return:
  q: 'Трое детей впряжены в бочку вместо тройки. Мать одного из них узнала его по выбитому зубу. Под какой фамилией — неродной, от дьячка за почерк — художник заставил Россию плакать?'
  a: 'Перов — фамилия, которую будущий художник получил от дьячка за красивый почерк.'
skripty:
  - js: |
      (function(){
      var steps=["Тётушка Марья привела сына Васю позировать","Перов написал «Тройку»","Третьяков купил холст (1867)","Картина — в Третьяковской галерее по сей день"];
      var order=[0,1,2,3],shuf=[0,1,2,3],next=0,done=false;
      var gres=document.getElementById('gres');
      function buildSort(){
        shuf=[0,1,2,3].sort(function(){return Math.random()-.5;});
        var c=document.getElementById('sort');c.innerHTML='';next=0;done=false;
        gres.style.display='none';
        shuf.forEach(function(real){var b=document.createElement('button');b.className='step';b.textContent=steps[real];b.dataset.real=real;b.addEventListener('click',function(){onStep(b);});c.appendChild(b);});
      }
      function onStep(b){
        if(done)return;
        var real=parseInt(b.dataset.real,10);
        if(real===order[next]){
          b.classList.add('done');b.innerHTML='<span class="n">'+(next+1)+'</span>'+steps[real];
          next++;
          if(next===4){done=true;gres.style.display='block';gres.innerHTML='<b style="color:var(--gold)">Путь собран верно!</b> От первой встречи у Тверской заставы до музейного зала.';}
        }else{
          b.classList.add('wrong');setTimeout(function(){b.classList.remove('wrong');},400);
          gres.style.display='block';gres.textContent='Не в том месте. Попробуйте начать заново.';
          setTimeout(buildSort,700);
        }
      }
      buildSort();
      })();
  - js: |
      (function(){
      var kb=[
       {k:['тройка','лошад','почему называ'],a:'Трое детей впряжены в бочку, как тройка. В этом весь ужас: лошадей заменили детьми. Название — самый короткий мой крик.'},
       {k:['молилась','молитв','колени','икон'],a:'Правда. Мать узнала своего Василия по выбитому зубу и встала на колени прямо в зале. Я написал ей отдельный портрет сына.'},
       {k:['мальчик','вася','оспа','умер','стало'],a:'Умер от оспы, бедняга, через несколько лет. Ради таких, как он, я и взялся за эту картину.'},
       {k:['детский труд','детств','зачем','почему взял'],a:'Я видел этих детей на московских улицах. Картина должна была не украшать гостиную, а кричать.'},
       {k:['фамил','перов','дьячок','почерк','барон'],a:'Я — незаконный сын барона Криденера, в бумагах числился Васильевым. «Перова» дал дьячок, учивший меня грамоте, — за красивый почерк.'},
       {k:['третьяков','купил','судьба картины'],a:'В 1867 году холст купил Павел Третьяков, прямо у меня. Там картина и живёт по сей день.'},
       {k:['передвиж','товариществ'],a:'Я — один из основателей Товарищества передвижников. Мы везли искусство в провинцию и показывали правду, а не салон.'},
       {k:['достоевск','островск','портрет'],a:'Писал Достоевского, Островского. В литераторах я видел союзников — они тоже говорили правду, только словами.'},
       {k:['умер','смерт','сколько','48'],a:'Я умер в 1882 году, сорока восьми лет. Спросите меня лучше о картинах — о них я знаю всё.'}];
      var log=document.getElementById('chatlog');
      function ask(q){
        var d=document.createElement('div');d.className='u';d.textContent='— '+q;log.appendChild(d);
        var ql=q.toLowerCase(),ans=null;
        for(var i=0;i<kb.length;i++){if(kb[i].k.some(function(k){return ql.indexOf(k)>=0;})){ans=kb[i].a;break;}}
        if(!ans)ans='Этого я вам не скажу — не знаю. А вот о «Тройке», о детях и о том, зачем картине кричать, — спрашивайте смело.';
        var a=document.createElement('div');a.className='a';a.textContent='— '+ans;log.appendChild(a);log.scrollTop=log.scrollHeight;
      }
      document.querySelectorAll('#chat .chip').forEach(function(c){c.addEventListener('click',function(){ask(c.textContent);});});
      document.getElementById('chatgo').addEventListener('click',function(){var v=document.getElementById('chatin').value.trim();if(v){ask(v);document.getElementById('chatin').value='';}});
      document.getElementById('chatin').addEventListener('keydown',function(e){if(e.key==='Enter'){document.getElementById('chatgo').click();}});
      })();
