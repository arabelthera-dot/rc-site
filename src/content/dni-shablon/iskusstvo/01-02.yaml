story:
  kicker: История
  h2: Картина, перед которой молились
  abzacy:
  - 'Зимняя Москва. В гору втаскивают обледеневшую бочку с водой — но запряжены в неё не лошади, а трое детей. Центральный мальчик тянет из последних сил, двое рядом надрываются вместе с ним. Мороз, ветер, впереди — длинная монастырская стена. Единственная, кого никто не запряг, — дворняга с оборванной верёвкой на шее: она бежит свободно, обгоняя детей.'
  - 'Автор картины — человек, у которого даже фамилия не своя. Василий Перов — незаконный сын барона Криденера, поэтому права на отцовскую фамилию не имел: в документах его записали Васильевым, по крёстному. «Перова» ему дал сельский дьячок за красивый почерк. Прозвище прилипло — и стало именем, под которым Россию заставили плакать.'
  - 'Перов долго не находил лица для центрального мальчика — ему нужна была не просто детская фигура, а «детская невинность». Однажды у Тверской заставы он встретил крестьянку «тётушку Марью» с 12-летним сыном Васенькой, шедших на богомолье. Марья долго не отдавала сына позировать — верила, что с писаного человека «чахнет и умирает». Перов уговорил.'
  - 'В 1867 году холст купил Павел Третьяков — прямо у автора. Но самая горькая глава в судьбе этой картины — не про владельцев, а про одну посетительницу. Через несколько лет Васенька умер от оспы. Марья продала всё имущество и пришла выкупить картину с сыном — но та уже принадлежала Третьякову. Перов привёл её в галерею: мать безошибочно нашла полотно и вскрикнула, узнав сына по выбитому зубу, — и встала на колени прямо в зале. Через год художник написал для неё отдельный портрет Васи и послал в деревню в золочёной раме — Марья повесила его в углу под иконами.'
  - 'Так «Тройка» стала хрестоматийным символом горького детства в русской живописи — картиной, перед которой в буквальном смысле молились.'
  - '<p><b>Художник одним абзацем.</b> Василий Григорьевич Перов (1834–1882) — мастер бытового жанра, один из основателей Товарищества передвижников. Незаконный сын барона Криденера, фамилию «Перов» получил от дьячка за красивый почерк. Автор «Тройки», «Охотников на привале», «Проводов покойника», портретов Достоевского и Островского. Умер в 48 лет.</p>'
fakty:
  - id: fakty
    kicker: Картина и художник
    h2: В это трудно поверить
    udary:
      - summary: 'У художника даже фамилия не своя'
        det:
          - 'Перов — незаконный сын барона Криденера, права на отцовскую фамилию у него не было: в документах он значился Васильевым, по крёстному. А «Перова» ему дал сельский дьячок, учивший мальчика грамоте, — за красивый почерк. Прозвище прилипло и стало именем, под которым Россию заставили плакать.'
        src: 'Культура.РФ (биография Василия Перова) · рассказ В. Г. Перова «Тётушка Марья»'
      - summary: 'Мать узнала сына по выбитому зубу'
        det:
          - 'Центрального мальчика Перов писал с живого Васи — 12-летнего сына крестьянки «тётушки Марьи». Через несколько лет мальчик умер от оспы. Мать продала всё имущество и пришла выкупить картину — а та уже принадлежала Третьякову. Перов привёл её в галерею: она нашла полотно и вскрикнула, узнав сына: «Батюшка ты мой! Родной ты мой, вот и зубик-то твой выбитый!»'
        src: 'Рассказ В. Г. Перова «Тётушка Марья» · Третьяковская галерея'
      - summary: 'Перед картиной стояли на коленях'
        det:
          - 'Та самая мать встала перед «Тройкой» на колени — прямо в зале. Через год Перов написал для неё отдельный портрет Васи и послал в деревню в золочёной раме; Марья повесила его в углу под иконами.'
        src: 'Рассказ В. Г. Перова «Тётушка Марья»'
      - summary: 'Марья боялась отдавать сына позировать'
        det:
          - 'Когда Перов встретил «тётушку Марью» у Тверской заставы, та долго не соглашалась: верила, что с писаного человека «чахнет и умирает». Художник уговорил. Так на холсте появилось лицо, которого он искал месяцами.'
        src: 'Рассказ В. Г. Перова «Тётушка Марья»'
      - summary: 'Третьяков купил холст прямо у автора'
        det:
          - 'В 1867 году, через год после написания, картину купил Павел Третьяков — прямо у Перова. С тех пор она не покидала его собрание и живёт в Третьяковской галерее по сей день.'
        src: 'Третьяковская галерея (my.tretyakov.ru) · Дилетант'
razdely:
  - posle: fakty
    html: |
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2>Для тех, кто смотрит внимательно</h2>
          <h3>Холодная палитра: мороз читается кожей</h3>
          <p>Перов нарочно выстудил гамму — серебристо-серые, перламутровые оттенки снега и неба. Ни одного тёплого пятна, кроме лиц и собственной краски усталости. Холод на полотне не нарисован словами, а заложен в цвет: смотреть на «Тройку» — значит физически чувствовать зиму.</p>
          <h3>Композиция: дорога идёт вверх</h3>
          <p>Дети тянут бочку в гору, и вся сцена поставлена по диагонали снизу вверх — взгляд зрителя сам «втаскивает» груз вместе с ними. Монастырская стена слева давит своей длиной: конца подъёма не видно, как не видно конца детскому труду.</p>
          <h3>Собака свободнее людей</h3>
          <p>Единственное свободное существо на холсте — дворняга с оборванной верёвкой на шее. Она бежит рядом и даже обгоняет запряжённых. Пёс, у которого нет хозяина и упряжи, свободнее, чем эти трое детей. Это главный, самый тихий укор картины.</p>
          <h3>Не дети, а взрослая усталость</h3>
          <p>Присмотритесь к лицам: на них нет ни одного ребёнка — только взрослая усталость на детских чертах. Именно так Перов добивался своего «крика»: не жалостливостью, а точностью. Он не украшал гостиную — он заставлял зрителя смотреть.</p>
          <h3>Хронология судьбы</h3>
          <ul>
            <li><b>1866 · рождение картины</b> — Перов находит у Тверской заставы «тётушку Марью» с сыном Васей и пишет «Тройку».</li>
            <li><b>1867 · Третьяков</b> — Павел Третьяков покупает холст прямо у автора.</li>
            <li><b>Через несколько лет · оспа</b> — Вася умирает. Марья продаёт всё и приходит выкупить картину.</li>
            <li><b>В зале · колени</b> — мать узнаёт сына по выбитому зубу и встаёт перед полотном на колени, как перед иконой.</li>
            <li><b>Через год · портрет</b> — Перов пишет для Марьи отдельный портрет Васи и шлёт в деревню в золочёной раме.</li>
            <li><b>Сегодня</b> — «Тройка» в Третьяковской галерее, хрестоматийный символ горького детства.</li>
          </ul>
        </div>
      </section>
  - posle: fakty
    html: |
      <section class="block" id="kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2>Горькое детство в мировой живописи</h2>
          <p>Детский труд — сюжет, который Европа и Россия писали в одно и то же время, но с разным ударом. Поставьте три полотна рядом, и разница станет очевидной.</p>
          <p>Англичане и французы чаще писали детский труд как социальную статистику или сентиментальную сценку. Перов сделал другое: он убрал дидактику и оставил только тяжесть — бочку, которая не сдвинется, и подъём, которому не видно конца. У него нет ни одной «жалостливой» детали вроде заплаканных глаз: есть трое детей, которые тянут, как взрослые, — и этого достаточно, чтобы у зрителя перехватило дыхание.</p>
          <p>Критический реализм передвижников, к которому принадлежал Перов, поставил русскую живопись в один ряд с европейской — но с русским акцентом: здесь искусство не украшало, а «кричало». «Тройка» — из первых картин, где этот крик услышала вся страна.</p>
        </div>
      </section>
