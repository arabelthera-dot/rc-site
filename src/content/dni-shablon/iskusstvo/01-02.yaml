story:
  kicker: История
  h2: Картина, перед которой молились
  abzacy:
  - 'Зимняя Москва. В гору втаскивают обледеневшую бочку с водой — но запряжены в неё не лошади, а трое детей. Центральный мальчик тянет из последних сил, двое рядом надрываются вместе с ним. Мороз, ветер, впереди — длинная монастырская стена. Единственная, кого никто не запряг, — дворняга с оборванной верёвкой на шее: она бежит свободно, обгоняя детей.'
  - 'Автор картины — человек, у которого даже фамилия не своя. Василий Перов — незаконный сын барона Криденера, поэтому права на отцовскую фамилию не имел: в документах его записали Васильевым, по крёстному. «Перова» ему дал сельский дьячок за красивый почерк. Прозвище прилипло — и стало именем, под которым Россию заставили плакать.'
  - 'Перов долго не находил лица для центрального мальчика — ему нужна была не просто детская фигура, а «детская невинность». Однажды у Тверской заставы он встретил крестьянку «тётушку Марью» с 12-летним сыном Васенькой, шедших на богомолье. Марья долго не отдавала сына позировать — верила, что с писаного человека «чахнет и умирает». Перов уговорил.'
  - 'В 1867 году холст купил Павел Третьяков — прямо у автора. Но самая горькая глава в судьбе этой картины — не про владельцев, а про одну посетительницу. Через несколько лет Васенька умер от оспы. Марья продала всё имущество и пришла выкупить картину с сыном — но та уже принадлежала Третьякову. Перов привёл её в галерею: мать безошибочно нашла полотно и вскрикнула, узнав сына по выбитому зубу, — и встала на колени прямо в зале. Через год художник написал для неё отдельный портрет Васи и послал в деревню в золочёной раме — Марья повесила его в углу под иконами.'
  - 'Так «Тройка» стала хрестоматийным символом горького детства в русской живописи — картиной, перед которой в буквальном смысле молились.'
  - '<p><b>Художник одним абзацем.</b> Василий Григорьевич Перов (1834–1882) — мастер бытового жанра, один из основателей Товарищества передвижников. Незаконный сын барона Криденера, фамилию «Перов» получил от дьячка за красивый почерк. Автор «Тройки», «Охотников на привале», «Проводов покойника», портретов Достоевского и Островского. Умер в 48 лет.</p>'
fakty:
  - id: fakty
    kicker: Картина и художник
    h2: В это трудно поверить
    udary:
      - summary: 'Фамилию Перов художнику дал дьячок — за красивый почерк'
        det:
          - 'Сельский дьячок, учивший мальчика грамоте, прозвал его «Перова» — за красивый почерк. Прозвище прилипло и стало именем, под которым Россию заставили плакать.'
        src: 'Культура.РФ (биография Василия Перова)'
      - summary: '«Тройка» — это не лошади: в упряжку запряжены трое детей-мастеровых'
        det:
          - 'Полное название — «Тройка. Ученики-мастеровые везут воду» (1866). Трое детей тащат в гору обледеневшую бочку с водой, как запряжённая тройка.'
        src: 'Третьяковская галерея, my.tretyakov.ru/app/masterpiece/8400'
      - summary: 'Центрального мальчика Перов писал с живого ребёнка, встреченного у Тверской заставы'
        det:
          - 'Это был 12-летний Васенька, сын крестьянки «тётушки Марьи» из Рязанской губернии; они шли на богомолье.'
        src: 'Рассказ В. Перова «Тётушка Марья»; diletant.media/articles/31990653'
      - summary: 'Марья боялась отдавать сына позировать'
        det:
          - 'Когда Перов встретил «тётушку Марью» у Тверской заставы, та долго не соглашалась: верила, что с писаного человека «чахнет и умирает». Художник уговорил. Так на холсте появилось лицо, которого он искал месяцами.'
        src: 'Рассказ В. Г. Перова «Тётушка Марья»'
      - summary: 'Через несколько лет Вася умер от оспы — мать пришла выкупить картину с сыном'
        det:
          - 'Тётушка Марья продала всё имущество, чтобы купить полотно, но оно уже принадлежало Павлу Третьякову.'
        src: 'diletant.media/articles/31990653'
      - summary: 'Мать узнала сына по выбитому зубу'
        det:
          - 'Перов привёл Марью в галерею; она безошибочно нашла полотно и вскрикнула: «Батюшка ты мой! Родной ты мой, вот и зубик-то твой выбитый!»'
        src: 'Рассказ В. Г. Перова «Тётушка Марья» · Третьяковская галерея'
      - summary: 'Создал критический реализм, основоположник передвижников — живопись стала кричать, а не украшать'
        det:
          - 'В 1870 году Перов встал у истоков Товарищества передвижных художественных выставок и вместе с Крамским и Мясоедовым подписал его первый устав. Идея была дерзкой: возить картины по провинциальным городам и показывать их не столичной публике, а простым людям. Перов стал столпом критического реализма — направления, где картина не украшает гостиную, а обличает несправедливость. Его «Тройка» — из первых картин, где этот крик услышала вся страна.'
        src: 'Культура.РФ · Третьяковская галерея (передвижники, критический реализм)'
      - summary: 'Перов написал для матери отдельный портрет Васи и послал в деревню в золочёной раме'
        det:
          - 'Через год художник исполнил обещание; Марья повесила портрет в углу под иконами.'
        src: 'Рассказ В. Перова «Тётушка Марья»'
      - summary: 'Первым сделал героем русской картины «маленького человека» — сироту, нищего, а не царя'
        det:
          - 'До Перова академическая живопись писала в основном историю, религию и портреты знати. Он первым вывел на холст «маленького человека» — сироту, нищего, крестьянина, ребёнка-батрака — и заставил зрителя смотреть ему в глаза. В живописи Перов сделал то, что Гоголь и Достоевский — в литературе: превратил «униженных и оскорблённых» в главных героев. «Тройка» — вершина этого открытия: трое детей вместо лошадей.'
        src: 'Культура.РФ (биография Василия Перова)'
      - summary: 'Рядом с запряжёнными детьми бежит свободная собака с оборванной верёвкой'
        det:
          - 'Обгоняющая детей дворняга с обрывком верёвки на шее — контраст: пёс свободнее, чем «запряжённые» дети.'
        src: 'Третьяковская галерея, инв. 364'
      - summary: 'Дети тащат бочку мимо монастырской стены с иконой и зажжённой лампадой'
        det:
          - 'Фон — монастырская стена, икона с лампадой над порталом: образ словно смотрит на детский труд.'
        src: 'Третьяковская галерея, инв. 364'
      - summary: 'Перов был не только художником, но и писателем — оставил рассказы о судьбах натурщиков'
        det:
          - 'В 1860-е он печатал очерки в журналах «Пчела» и «Художественный журнал». Среди рассказов — «Тётушка Марья» (история мальчика с «Тройки»), «На натуре (Фанни под № 30)» о натурщице, опознанной в морге, «Под крестом», «Великая жертва». Они собраны в книге «Рассказы художника». Сам Перов литературу серьёзным занятием не считал — но она стала его вторым голосом.'
        src: 'В. Перов, «Рассказы художника» · Русский музей'
      - summary: 'Центральный образ Перов искал долго — ему нужна была «детская невинность»'
        det:
          - 'В ребёнке художник искал воплощение детской невинности и простодушия, которое долго не находил.'
        src: 'Третьяковская галерея, my.tretyakov.ru/app/masterpiece/8400'
      - summary: 'Картина стала эталоном «униженных и оскорблённых» в русской живописи'
        det:
          - '«Тройка» — хрестоматийный образ бытового жанра второй половины XIX века, символ горького детства.'
        src: 'Третьяковская галерея'
      - summary: 'Художник усилил жалость холодным колоритом'
        det:
          - 'Серебристо-серые и перламутровые оттенки делают зимнюю сцену ещё пронзительнее.'
        src: 'Третьяковская галерея, инв. 364'
      - summary: '«Сельский крестный ход» обличил пьяное духовенство — картину сняли с выставки'
        det:
          - 'В «Сельском крестном ходе на Пасхе» (1861) Перов написал священника, который едва держится на ногах, и праздник, от которого остался один угар. Такого в русской живописи ещё не было: художник прямо обличил духовенство. Картину сняли с выставки и запретили воспроизводить — но именно с этого скандала страна узнала, что живопись умеет спорить. Полотно купил Павел Третьяков.'
        src: 'Культура.РФ · Третьяковская галерея («Сельский крестный ход на Пасхе»)'
