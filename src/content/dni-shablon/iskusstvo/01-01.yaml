  - posle: fakty
    html: |
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2>Для тех, кто смотрит внимательно</h2>
          <h3>Праздничная палитра: цвет спорит с эпохой</h3>
          <p>Кустодиев нарочно выстроил гамму на звонких, декоративных сочетаниях — алые, золотые, снежно-белые, зелёные оттенки ёлок. Ни одной тёмной краски: художник как будто спорил с голодной, военной зимой за окном мастерской. Смотреть на «Ёлочный торг» — значит ненадолго поверить, что праздник возможен.</p>
          <h3>Композиция: квадрат, полный движения</h3>
          <p>Холст почти квадратный — 98 на 98 сантиметров. В этот квадрат Кустодиев уложил целую ярмарку: ёлки, сани, купцов, детей. Взгляд скользит по диагоналям — от саней на переднем плане к гирляндам шаров наверху. Теснота не давит, а создаёт ощущение гула и толчеи.</p>
          <h3>Лица — розовощёкие, счастливые</h3>
          <p>На полотне нет ни одной грустной фигуры: дети румяны, купцы довольны, покупатели улыбаются. Это принципиальный выбор Кустодиева — в разгар Гражданской войны он писал не тревогу, а радость, которую хотел вернуть людям.</p>
          <h3>Хроника художника</h3>
          <ul>
            <li><b>1916 · болезнь</b> — врачи находят опухоль спинного мозга. После операции Кустодиев парализован и больше не ходит.</li>
            <li><b>1918 · «Ёлочный торг»</b> — прикованный к креслу, художник пишет самую весёлую ярмарку русской живописи.</li>
            <li><b>1920 · «Большевик»</b> — отклик на революцию: гигант с красным знаменем шагает над городом.</li>
            <li><b>1922 · Шаляпин</b> — лёжа пишет знаменитый портрет певца, одну из вершин русской портретной живописи.</li>
            <li><b>1927 · конец</b> — Кустодиев умирает в 49 лет, оставив образ «кустодиевской России».</li>
            <li><b>Сегодня</b> — «Ёлочный торг» в Краснодарском краевом художественном музее имени Ф. А. Коваленко.</li>
          </ul>
        </div>
      </section>
  - posle: fakty
    html: |
      <section class="block" id="kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2>Праздник против эпохи</h2>
          <p>1918 год — время, когда в русской живописи почти не было места празднику. Авангард строил новый мир из геометрии, реалисты писали войну и разруху, а Кустодиев, прикованный к креслу, писал ёлочный базар.</p>
          <p>В этом был его спор с судьбой. Чем тяжелее становилось телу, тем наряднее — краскам. «Ёлочный торг», «Масленица», «Купчиха за чаем» — все они написаны уже после паралича. Художник как будто компенсировал собственную неподвижность яркостью: мир, в котором он больше не мог ходить, на его холстах гулял, пел и звенел.</p>
          <p>Так родилась «кустодиевская Россия» — образ страны-праздника, который художник противопоставил суровой реальности. Сегодня это самое узнаваемое, самое любимое лицо русского быта в живописи — и оно принадлежит человеку, который писал его, не вставая с кресла.</p>
        </div>
      </section>
