skripty:
  - js: |
      (function(){
      var steps=["1916 · опухоль спинного мозга, паралич","1918 · написан «Ёлочный торг»","1920 · написан «Большевик»","1922 · написан портрет Шаляпина"];
      var order=[0,1,2,3],shuf=[0,1,2,3],next=0,done=false;
      var gres=document.getElementById('gres');
      function buildSort(){
        shuf=[0,1,2,3].sort(function(){return Math.random()-.5;});
        var c=document.getElementById('sort');c.innerHTML='';next=0;done=false;
        gres.style.display='none';
        shuf.forEach(function(real){var b=document.createElement('button');b.className='step';b.textContent=steps[real];b.dataset.real=real;b.addEventListener('click',function(){onStep(b);});c.appendChild(b);});
      }
      function onStep(b){
        if(done)return;
        var real=parseInt(b.dataset.real,10);
        if(real===order[next]){
          b.classList.add('done');b.innerHTML='<span class="n">'+(next+1)+'</span>'+steps[real];
          next++;
          if(next===4){done=true;gres.style.display='block';gres.innerHTML='<b style="color:var(--gold)">Путь собран верно!</b> От болезни до последних картин — хроника художника.';}
        }else{
          b.classList.add('wrong');setTimeout(function(){b.classList.remove('wrong');},400);
          gres.style.display='block';gres.textContent='Не в том месте. Попробуйте начать заново.';
          setTimeout(buildSort,700);
        }
      }
      buildSort();
      })();
  - js: |
      (function(){
      var kb=[
       {k:['ёлоч','базар','торг','картин','назва','ярмар'],a:'Картину называют и «Ёлочный торг», и «Ёлочный базар» — оба имени прижились. Написал я её в 1918 году, в разгар Гражданской войны.'},
       {k:['паралич','кресл','болезн','ходить','нога','опухол'],a:'В 1916 году врачи нашли у меня опухоль спинного мозга. После операции я перестал ходить и писал сидя или лёжа, с холстом, подвешенным наклонно.'},
       {k:['война','гражданск','почему весёл','праздник'],a:'В стране шла Гражданская война, а я писал мирную ярмарку. Мне хотелось подарить людям праздник, которого им не хватало.'},
       {k:['кустодиевская россия','стиль','манер','почему такой','яркий'],a:'Меня называют певцом русского быта: купчихи, ярмарки, масленицы. За эту нарядную, декоративную манеру и говорят о «кустодиевской России».'},
       {k:['репин','учител','ученик','академик'],a:'Я учился у Ильи Репина и стал академиком живописи. Но в историю вошёл как певец русского быта.'},
       {k:['большевик','революц','эпоха'],a:'В 1920 году я написал «Большевика» — огромную фигуру с красным знаменем, шагающую над городом. Это был мой образ новой эпохи.'},
       {k:['масленица','зима'],a:'«Масленицу» я писал в 1916 году, в тот самый год, когда меня приковала болезнь. Тройки, карусели, румяные лица — гимн русской зиме.'},
       {k:['шаляпин','портрет','певец'],a:'В 1922 году я написал портрет Фёдора Шаляпина — работал лёжа, а холст ко мне поворачивали. Получился один из лучших портретов русской живописи.'},
       {k:['умер','смерт','сколько','49','1927'],a:'Я умер в 1927 году, в 49 лет. Спросите меня лучше о картинах — о них я знаю всё.'}];
      var log=document.getElementById('chatlog');
      function ask(q){
        var d=document.createElement('div');d.className='u';d.textContent='— '+q;log.appendChild(d);
        var ql=q.toLowerCase(),ans=null;
        for(var i=0;i<kb.length;i++){if(kb[i].k.some(function(k){return ql.indexOf(k)>=0;})){ans=kb[i].a;break;}}
        if(!ans)ans='Этого я вам не скажу — не знаю. А вот о «Ёлочном торге», о болезни и о «кустодиевской России» — спрашивайте смело.';
        var a=document.createElement('div');a.className='a';a.textContent='— '+ans;log.appendChild(a);log.scrollTop=log.scrollHeight;
      }
      document.querySelectorAll('#chat .chip').forEach(function(c){c.addEventListener('click',function(){ask(c.textContent);});});
      document.getElementById('chatgo').addEventListener('click',function(){var v=document.getElementById('chatin').value.trim();if(v){ask(v);document.getElementById('chatin').value='';}});
      document.getElementById('chatin').addEventListener('keydown',function(e){if(e.key==='Enter'){document.getElementById('chatgo').click();}});
      })();
