story:
  kicker: История
  h2: Ярмарка, написанная из кресла
  abzacy:
  - 'На дворе 1918 год. В стране — Гражданская война, голод, разруха. А на холсте Бориса Кустодиева сияет мирная ёлочная ярмарка: нарядные ёлки, розовощёкие дети, купцы, сани, гирлянды цветных шаров. Ни войны, ни тревоги — только праздник, каким его помнят и любят.'
  - 'У картины два имени. Её называют и «Ёлочный торг», и «Ёлочный базар» — оба прижились. Холст почти квадратный: 98 на 98 сантиметров. Сегодня он хранится в Краснодарском краевом художественном музее имени Ф. А. Коваленко.'
  - 'А написал эту ярмарку человек, который уже два года не вставал с инвалидного кресла. В 1916 году у Кустодиева нашли опухоль спинного мозга. После операции он перестал ходить — нижняя часть тела была парализована. Дальше он писал только сидя, а то и лёжа, с холстом, подвешенным наклонно.'
  - 'Именно прикованным к креслу Кустодиев создал свои самые весёлые, самые праздничные полотна — «Масленицу», «Ёлочный торг», «Купчиху за чаем». Он как будто спорил с собственной бедой: чем тяжелее было телу, тем звонче и наряднее становились краски. Эту яркую, декоративную манеру стали называть «кустодиевской Россией» — образом страны-праздника, противопоставленным суровой реальности.'
  - 'Но Кустодиев умел писать и совсем другое. В 1920 году он написал «Большевика» — огромную фигуру с красным знаменем, шагающую над городом, выше домов и церквей. А в 1922 году, почти не двигаясь, — знаменитый портрет Фёдора Шаляпина, одну из вершин русской портретной живописи. Праздник и эпоха, красота и тревога — всё это умещалось в одном человеке, прикованном к креслу.'
  - '<p><b>Художник одним абзацем.</b> Борис Михайлович Кустодиев (1878–1927) — живописец, ученик Ильи Репина, академик живописи. В историю вошёл как певец русского быта: пышные купчихи, провинциальные ярмарки, масленичные гулянья, балаганы, чаепития. С 1916 года, после операции по удалению опухоли спинного мозга, был парализован и работал сидя или лёжа. Умер в 49 лет.</p>'
