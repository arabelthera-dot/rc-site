story:
  kicker: История корабля · 4 удара
  h2: Корабль из первой в мире фанеры
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: В декабре 1879 года Костович взялся за первый в мире дирижабль с жёстким скелетом.
      det:
        - "Мягкий баллон ветер гнёт и сминает. Костович дал кораблю жёсткий каркас — такой не мнётся на ветру. Описание корабля напечатал журнал «Воздухоплаватель» 1 января 1881 года."
      src: 'Источник: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>.'
    - summary: Скелет Костович устроил как велосипедное колесо — обод, втулка и спицы-тросы.
      det:
        - "Внутри корпуса шла круглая ферма-обод, сквозь середину — шахта-втулка, между ними тросы. В нижней части шахты помещались экипаж и пассажиры. Сравнение с колесом любил приводить сам Костович."
      src: 'Источник: «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>.'
    - summary: 8 августа 1882 года на Охтинской верфи начали строить корабль длиной 64 метра.
      det:
        - "Для каркаса Костович создал первую в мире фанеру — арборит, а для полёта — первый в мире бензиновый двигатель в 80 сил."
      src: 'Источник: «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>; Центральный музей ВВС, «Двигатель Костовича» — <a href="https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449" rel="noopener" target="_blank">cmvvs.ru</a>.'
    - summary: К 1889 году почти все детали были готовы — но буря разрушила сборочный сарай, а казённые деньги кончились.
      det:
        - "Костович строил дальше на свои деньги и деньги друзей. Взлететь «России» так и не довелось."
      src: 'Источник: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/" rel="noopener" target="_blank">авиару.рф</a>.'
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о Костовиче и «России»
  h2: Факты дня
  udary:
  - summary: <b>Костович создал первый в мире дирижабль на жёстком каркасе — на двадцать лет раньше всех.</b>
    utverzhdeno: Р197
    det:
    - 'Корабль появился на бумаге в декабре 1879 года, его описание напечатали в «Воздухоплавателе» 1 января 1881 года. 8 августа 1882 года на Охтинской верфи в Петербурге начали строить корабль длиной 64 метра. Следующий жёсткий дирижабль в мире поднялся в небо только летом 1900 года — через двадцать лет. «Россию» не достроили: кончились деньги.'
    src: 'Источник: «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>; А. Орлов, «Двигатель Костовича», Центральный музей ВВС — <a href="https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449" rel="noopener" target="_blank">cmvvs.ru</a>; «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/" rel="noopener" target="_blank">авиару.рф</a>.'
    otryvok: «8 августа 1882 года на Охтинской судоверфи Петербурга началась постройка дирижабля „РОССИЯ“».
    stranica: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/
    pometka: два источника
  - summary: <b>Для каркаса Костович создал первую в мире фанеру — арборит; из неё делали даже домики.</b>
    utverzhdeno: Р197
    det:
    - Каркасу нужен был материал прочный и лёгкий. В начале 1880-х Костович создал его сам — первую в мире фанеру в сегодняшнем смысле слова, как пишет «Российская газета»; БСЭ называет арборит «фанерой высокой прочности». Он склеивал не меньше трёх листов шпона, волокна в соседних листах шли крест-накрест — лист выходил прочным во всех направлениях.
    - Клеил он «клеем-цементом» собственного изобретения, «делая арборит не поддающимся гниению». На заводе под Петербургом из арборита делали «бочки для вина и керосина, ящики, сундуки, чемоданы, строительные детали и даже фанерные разборные домики».
    src: 'Источник: БСЭ, 3-е изд., ст. «Костович»; «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>.'
    otryvok: «…бочки для вина и керосина, ящики, сундуки, чемоданы, строительные детали и даже фанерные разборные домики».
    stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
    href: https://rg.ru/2013/12/30/kostovich-site.html
    pometka: два источника
  - summary: <b>Для дирижабля Костович создал первый в мире бензиновый двигатель — 80 сил при 240 кг.</b>
    utverzhdeno: Р197
    det:
    - 'Пар и газ не годились: котёл с углём или баллоны с газом дирижабль не поднимет. К 1884 году Костович создал лёгкий бензиновый двигатель: восемь цилиндров, до 80 лошадиных сил при 240 килограммах — три килограмма на каждую силу. Мотор сохранился и стоит в зале № 1 Центрального музея ВВС в Монино.'
    src: 'Источник: Центральный музей ВВС, «Двигатель Костовича» — <a href="https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449" rel="noopener" target="_blank">cmvvs.ru</a>; «Двигатель внутреннего сгорания для дирижабля О. С. Костовича», «Российская авиация» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/" rel="noopener" target="_blank">авиару.рф</a>.'
    otryvok: «…при массе двигателя 240 кг (эти показатели были даже лучшими, чем у первого двигателя…)».
    stranica: «Двигатель внутреннего сгорания для дирижабля О. С. Костовича», «Российская авиация»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/
    pometka: два источника
  - summary: <b>Костович первым в мире спрятал торпеды внутрь подводной лодки — так их носят и сегодня.</b>
    utverzhdeno: Р197
    det:
    - 'В 1878 году бывший капитан Дунайской флотилии создал для флота проект своей подводной лодки: торпеды в ней стояли внутри корпуса, в носовой «метательной трубе». До этого мины и торпеды крепили снаружи.'
    src: 'Источник: А. Ф. Ткаченко, «Морской биографический словарь», 2008, с. 488 — <a href="https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html" rel="noopener" target="_blank">imha.ru</a>.'
    otryvok: «…первым предложил размещать торпеды внутри подводной лодки».
    stranica: Международная военно-историческая ассоциация, «Костович Огнеслав Степанович» (по «Морскому биографическому словарю»)
    href: https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html
    pometka: документ
  - summary: '<b>Костович построил скафандр: водолаз шесть часов работал под водой без шланга с поверхности.</b>'
    utverzhdeno: Р197
    det:
    - В 1881 году, когда водолазу подавали воздух насосом с лодки, Костович сконструировал автономный скафандр. Всего у него больше сотни изобретений.
    src: 'Источник: Международная военно-историческая ассоциация, по «Морскому биографическому словарю» — <a href="https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html" rel="noopener" target="_blank">imha.ru</a>; «Российская газета», 30.12.2013.'
    otryvok: «…автономный скафандр, позволявший водолазу находиться под водой 6 часов без сообщения с поверхностью моря».
    stranica: Международная военно-историческая ассоциация, «Костович Огнеслав Степанович»
    href: https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html
    pometka: документ
  - summary: <b>Костович построил дирижабль крупнее всех воздушных кораблей, что были до него.</b>
    det:
    - Длина «России» — 64 метра, объём — 5 тысяч кубометров, поперёк — больше 12 метров. Это как двадцатиэтажный дом, положенный на бок. Ни один воздушный корабль до неё не был таким огромным.
    src: 'Источник: Г. Черненко, «Двигатель для дирижабля „Россия“», журнал «Воздухоплаватель» (впервые — «Изобретатель и рационализатор», 2004, № 2) — <a href="http://ballooning-magazine.ru/91" rel="noopener" target="_blank">ballooning-magazine.ru</a>.'
    otryvok: «…был огромным, намного крупнее всех до того построенных. Его корпус объемом 5000 м3 имел длину 64 м, и наибольший диаметр — свыше 12 м».
    stranica: Г. Черненко, «Двигатель для дирижабля „Россия“», «Воздухоплаватель»
    href: http://ballooning-magazine.ru/91
    pometka: документ
  - summary: <b>Костович посадил людей не под шаром, а прямо внутрь дирижабля.</b>
    det:
    - 'У воздушных шаров корзина висела снизу на верёвках. Костович провёл сквозь середину «России» вертикальную трубу-шахту: внизу в ней помещались экипаж и пассажиры, там же стоял мотор.'
    src: 'Источник: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>.'
    otryvok: «Сквозь середину корпуса проходила вертикальная шахта-труба, в нижнюю часть которой помещался экипаж и пассажиры. Здесь же располагалось и машинное отделение».
    stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
    href: https://rg.ru/2013/12/30/kostovich-site.html
    pometka: документ
  - summary: <b>Костович устроил скелет 64-метрового дирижабля как велосипедное колесо.</b>
    det:
    - Внутри баллона — круглая ферма-обод, в центре — шахта-втулка, между ними натянуты тросы, как спицы. Корабль вышел жёстким и при этом лёгким. Это сравнение любил повторять сам Костович.
    src: 'Источник: «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>; Г. Черненко, «Воздухоплаватель» — <a href="http://ballooning-magazine.ru/91" rel="noopener" target="_blank">ballooning-magazine.ru</a>.'
    otryvok: «…подобно тому, как идут от втулки к ободу спицы велосипедного колеса (такое сравнение любил приводить сам Костович)».
    stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
    href: https://rg.ru/2013/12/30/kostovich-site.html
    pometka: два источника
  - summary: <b>Костович первым в мире заправил мотор бензином — тогда им выводили пятна с одежды.</b>
    det:
    - 'В 1880-е бензин покупали в аптеке и лавке: хозяйки чистили им платья. Костович сделал его топливом для мотора своего воздушного корабля. «Российская газета» пишет: бензин как топливо тогда применили впервые.'
    src: 'Источник: «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>.'
    otryvok: «Также впервые в качестве топлива предлагалось использовать бензин, до этого употребляемый в хозяйстве лишь домохозяйками (для выведения пятен с одежды)…».
    stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
    href: https://rg.ru/2013/12/30/kostovich-site.html
    pometka: документ
  - summary: <b>Первую в мире фанеру Костовича запатентовали и за океаном — через 19 лет после русской.</b>
    det:
    - 'Русскую «привилегию» на арборит Костович получил в 1887 году и продлевал в 1892-м и 1902-м. 4 сентября 1906 года патент на ту же фанеру ему выдали в США: материал из каркаса «России» признали изобретением и там.'
    src: 'Источник: «Костович Огнеслав (Игнатий) Степанович», энциклопедия «Ретропланъ» — <a href="http://www.retroplan.ru/encyclopaedia.html?sobi2Task=sobi2Details&amp;sobi2Id=504" rel="noopener" target="_blank">retroplan.ru</a>; «Русская вера», 30.12.2016 — <a href="https://ruvera.ru/news/izobretatel_kostovich" rel="noopener" target="_blank">ruvera.ru</a>.'
    otryvok: «Костович запатентовал технологию производства арборита-фанеры в США, где ему был выдан патент от 4 сентября 1906 г. В России он получил “Привилегию” в 1887 г., которая была продлена в 1892 и 1902 гг.».
    stranica: «Костович Огнеслав (Игнатий) Степанович», энциклопедия «Ретропланъ»
    href: http://www.retroplan.ru/encyclopaedia.html?sobi2Task=sobi2Details&sobi2Id=504
    pometka: два источника
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Миллионы, буря и фанера
  udary:
  - summary: <b>Менделеев помог Костовичу собрать на дирижабль 200 тысяч рублей.</b>
    det:
    - При поддержке Дмитрия Менделеева и Михаила Рыкачёва создали «Товарищество по постройке воздухоплавательного корабля „Россия“». Пайщики внесли 200 тысяч рублей, военное министерство добавило 35 тысяч — и в 1882 году на Охте заложили корабль.
    src: 'Источник: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация», 07.07.2017 — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/" rel="noopener" target="_blank">авиару.рф</a>.'
    otryvok: «При поддержке Д.И.Менделеева и М.А.Рыкачева организовали «Товарищество по постройке воздухоплавательного корабля «РОССИЯ», собрали паевые взносы в сумме 200 тыс. руб. и вскоре выхлопотали финансирование от Военного министерства в размере 35 тыс. руб.».
    stranica: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/
    pometka: документ
  - summary: '<b>Почти готовый дирижабль остался без дома: буря снесла сарай, казна денег больше не дала.</b>'
    det:
    - К 1889 году были сделаны почти все детали «России». Тут буря разрушила сборочный сарай, а правительственная субсидия кончилась. Костович не бросил корабль и строил дальше на свои деньги и деньги друзей.
    src: 'Источник: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация», 07.07.2017 — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/" rel="noopener" target="_blank">авиару.рф</a>.'
    otryvok: «В 1889 году практически все детали аэростата были изготовлены… буря неожиданно разрушила сборочный сарай, закончилась правительственная субсидия и Костович продолжал работы за свой счёт и счёт своих друзей».
    stranica: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/
    pometka: документ
  - summary: <b>Капитан тонущего парохода выжил, отказал родине в своих чертежах — и выбрал Россию.</b>
    det:
    - В войну 1877–1878 годов Костович командовал пароходом «Ада», который возил русские войска через Дунай. Вражеский броненосец пустил «Аду» ко дну. Контуженный капитан выжил, отказался раскрыть своё изобретение — подводную лодку — и в октябре 1878 года попросил русского подданства, чтобы строить её в России.
    src: 'Источник: «Костович Огнеслав (Игнатий) Степанович», энциклопедия «Ретропланъ» — <a href="http://www.retroplan.ru/encyclopaedia.html?sobi2Task=sobi2Details&amp;sobi2Id=504" rel="noopener" target="_blank">retroplan.ru</a>; «Великая страна СССР», 15.10.2023 — <a href="https://www.great-country.ru/articles/sssr/lyudi/uchenye-izobretateli-konstruktory/00034.html" rel="noopener" target="_blank">great-country.ru</a>.'
    otryvok: «…судно пошло ко дну. Экипаж был спасён, но контуженный Костович ещё долго выздоравливал… Костовичу было предложено раскрыть своё изобретение, на что он ответил отказом. В октябре 1878 г. он подал прошение императору Александру II о получении российского гражданства и использовании своих изобретений в России».
    stranica: «Костович Огнеслав (Игнатий) Степанович», энциклопедия «Ретропланъ»
    href: http://www.retroplan.ru/encyclopaedia.html?sobi2Task=sobi2Details&sobi2Id=504
    pometka: два источника
  - summary: <b>Самую большую деталь «России» — трубу длиной 30 метров — Костович склеил из фанеры.</b>
    det:
    - 'Через весь корпус к винту шёл главный вал. Костович сделал его не из стали, а из своего арборита: фанерная труба толщиной 20 сантиметров и длиной около 30 метров — как десятиэтажный дом, положенный на бок.'
    src: 'Источник: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация», 07.07.2017 — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/" rel="noopener" target="_blank">авиару.рф</a>.'
    otryvok: «…из которого построил весь каркас, многие части дирижабля и самую крупную его деталь — передаточный вал к винту дирижабля, представлявший собой трубу диаметром 0,2 м и длиной около 30 м».
    stranica: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/
    pometka: документ
  - summary: <b>Фанерные части «России» пролежали 20 лет — и всё ещё годились для сборки.</b>
    det:
    - Когда стройку бросили, Костович увёз детали на свой завод в Малом Рыбацком под Петербургом. В 1910 году, через двадцать лет, секции корабля по-прежнему можно было собирать — фанера Костовича не сгнила. Военное министерство всё равно отказало.
    src: 'Источник: «Линкоры небес», «Русская планета» — <a href="https://rusplt.ru/ww1/history/linkoryi-nebes-15219.html" rel="noopener" target="_blank">rusplt.ru</a>; Г. Черненко, «Воздухоплаватель» — <a href="http://ballooning-magazine.ru/91" rel="noopener" target="_blank">ballooning-magazine.ru</a>.'
    otryvok: «Спустя 20 лет, в 1910 году секции «России», все еще сохраняемые изобретателем, по-прежнему были годны к сборке».
    stranica: «Линкоры небес», «Русская планета»
    href: https://rusplt.ru/ww1/history/linkoryi-nebes-15219.html
    pometka: документ
