  intro: Та же история коротким роликом — от первого в мире дирижабля на жёстком каркасе, с людьми прямо внутри, до деталей из первой в мире фанеры, которые пролежали 20 лет и всё ещё годились к сборке.
  poster: video/day-29jan-kostovich-rossiya-poster.jpg?v=2
