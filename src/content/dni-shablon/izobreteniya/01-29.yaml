return:
  q: Как Костович назвал первую в мире фанеру, которую создал для каркаса дирижабля?
  a: "Арборит: листы шпона крест-накрест на клее, который не давал гнить."
  src: БСЭ, 3-е изд., ст. «Костович»
audioguide:
  audioSrc: audio-guide-kostovich-rossiya-2-ru.mp3
  durationLabel: 3 минуты 57 секунд
  lead: 'Голос ведёт по залу Огнеслава Костовича: от рисунка «России» над Петербургом через скелет-«велосипедное колесо», первую в мире фанеру арборит и первый в мире бензиновый двигатель до игры «Километр над Петербургом». Шесть остановок — первый в мире дирижабль на жёстком каркасе. Слушать можно фоном, пока читаешь страницу.'
  stops:
  - t: 0
    mark: '0:00'
    title: '«Россия» над Петербургом'
  - t: 36
    mark: '0:36'
    title: 'Колесо в шестьдесят четыре метра'
  - t: 76
    mark: '1:16'
    title: 'Первая в мире фанера и бензиновый двигатель'
  - t: 130
    mark: '2:10'
    title: 'Деньги, буря и двадцать лет'
  - t: 167
    mark: '2:47'
    title: 'Капитан «Ады»'
  - t: 204
    mark: '3:24'
    title: 'Игра и викторина'
  transcript:
  - "«Здравствуйте. Мы в зале Огнеслава Костовича. Посмотрите на обложку: старый снимок рисунка. Длинный, как сигара, дирижабль с гондолой летит высоко над Петербургом, внизу Нева, острова и сетка улиц. Это «Россия» — такой её создал Костович. Главная мысль зала такая: Костович создал первый в мире дирижабль на жёстком каркасе. На бумаге корабль появился в декабре тысяча восемьсот семьдесят девятого года — за двадцать лет до следующего жёсткого дирижабля в мире, летом тысяча девятисотого года. Мягкий баллон ветер гнёт и сминает, а Костович дал кораблю скелет.»"
  - "«Теперь откройте факты. Восьмого августа тысяча восемьсот восемьдесят второго года на Охтинской верфи в Петербурге начали строить корабль длиной шестьдесят четыре метра и поперёк больше двенадцати метров. Это как двадцатиэтажный дом, положенный на бок. Ни один воздушный корабль до «России» не был таким огромным. Скелет Костович устроил как велосипедное колесо: внутри баллона круглая ферма-обод, в центре шахта-втулка, а между ними натянуты тросы, как спицы. И людей он посадил не под шаром, а прямо внутрь. У воздушных шаров корзина висела снизу на верёвках. А сквозь середину «России» шла шахта: внизу в ней помещались экипаж и пассажиры, там же стоял мотор.»"
  - "«Каркасу нужен был материал прочный и лёгкий, и Костович создал первую в мире фанеру — арборит. Листы шпона шли волокнами крест-накрест, а клей-цемент собственного изобретения не давал арбориту гнить. Даже главный вал, который шёл через весь корпус к винту, Костович сделал не из стали, а из фанеры: труба длиной около тридцати метров — как десятиэтажный дом на боку. Русскую привилегию на арборит он получил в тысяча восемьсот восемьдесят седьмом году, а через девятнадцать лет, в тысяча девятьсот шестом, патент на первую в мире фанеру ему выдали в Соединённых Штатах Америки. Для полёта Костович создал первый в мире бензиновый двигатель: восемьдесят лошадиных сил при двухстах сорока килограммах. А бензин тогда покупали в аптеке, и хозяйки выводили им пятна с платьев. Костович первым в мире заправил мотор бензином — пятновыводитель стал топливом для воздушного корабля. Двигатель сохранился и стоит в Центральном музее Военно-воздушных сил в Монино.»"
  - "«На такой корабль нужны были большие деньги. Дмитрий Менделеев помог Костовичу собрать товарищество: пайщики внесли двести тысяч рублей, военное министерство добавило тридцать пять тысяч. К тысяча восемьсот восемьдесят девятому году почти все детали «России» были готовы. И тут буря разрушила сборочный сарай, а казённые деньги кончились. Костович не бросил корабль и строил дальше на свои деньги и деньги друзей. Детали он увёз на свой завод под Петербургом. В тысяча девятьсот десятом году, через двадцать лет, секции всё ещё можно было собирать — фанера не сгнила. Военное министерство всё равно отказало.»"
  - "«Стоять на своём Костович умел и раньше. В войну тысяча восемьсот семьдесят седьмого — семьдесят восьмого годов он командовал пароходом «Ада», который возил русские войска через Дунай. Вражеский броненосец пустил «Аду» ко дну. Контуженный капитан выжил, отказался раскрыть своё изобретение — подводную лодку — и попросил русского подданства, чтобы строить её в России. Он первым в мире спрятал торпеды внутрь лодки, а не крепил их снаружи корпуса — так их носят подлодки и сегодня. А в тысяча восемьсот восемьдесят первом году Костович построил скафандр, в котором водолаз шесть часов работал под водой без шланга с поверхности.»"
  - "«Спуститесь к игре «Километр над Петербургом». Вы — капитан «России». Ведите корабль вверх и вниз, не задевайте крыши и шпили, обходите грозовые тучи и следите за красной стрелкой: она предупреждает о порыве ветра. В жизни буря не дала «России» взлететь, а в игре вы проведёте её над Петербургом целый километр. Вот и весь зал: первый в мире дирижабль на жёстком каркасе, крупнее всех кораблей до него, — из первой в мире фанеры и с первым в мире бензиновым двигателем. Теперь сыграйте и ответьте на два вопроса викторины.»"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
