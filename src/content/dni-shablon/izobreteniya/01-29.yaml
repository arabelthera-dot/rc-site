  model3d:
    glb: modeli/kostovich-rossiya.glb
    h2: "Дирижабль «Россия» в объёме — поверни и загляни под обшивку"
    lead: "Корабль длиной 64 метра на жёстком каркасе из арборита — первой фанеры. Обшивка с одного бока ещё не набрана: видно каркас, шахту и гондолу. Нажимай на части под сценой."
    alt: "Трёхмерная модель дирижабля «Россия» на стапеле верфи: сигарообразная оболочка, с одного бока открыт деревянный каркас, внизу гондола, сзади винт и рули. Поворачивается пальцем или мышью"
    razmer: около 0,9 МБ
    pravila:
      - "Веди пальцем или мышью по дирижаблю влево-вправо — он повернётся."
      - "Найди бок без обшивки — там видны шпангоуты каркаса из арборита и шахта с гондолой."
      - "Нажимай на части под сценой — каркас, вал и винт, двигатель — и читай факт о каждой."
    chasti:
      - uzel: obolochka
        nazvanie: "Оболочка корабля «Россия»"
        fakt: "Длина «России» — 64 метра, объём — 5 тысяч кубометров, поперёк — больше 12 метров. Ни один воздушный корабль до неё не был таким огромным."
      - uzel: karkas-iz-arborita
        nazvanie: "Жёсткий каркас из арборита"
        fakt: "Костович создал первый в мире дирижабль на жёстком каркасе — следующий жёсткий дирижабль поднялся только летом 1900 года, через двадцать лет. Для каркаса он создал первую в мире фанеру — арборит — не меньше трёх листов шпона, волокна в соседних листах крест-накрест."
      - uzel: shahta-i-trosy
        nazvanie: "Шахта-втулка и тросы-спицы"
        fakt: "Скелет корабля устроен как велосипедное колесо — круглая ферма-обод, в центре шахта-втулка, между ними натянуты тросы, как спицы. Корабль вышел жёстким и при этом лёгким."
      - uzel: val-i-vint
        nazvanie: "Главный вал из фанеры и винт"
        fakt: "Через весь корпус к винту шёл главный вал — фанерная труба из арборита толщиной 20 сантиметров и длиной около 30 метров. Это самая большая деталь «России»."
      - uzel: gondola
        nazvanie: "Гондола внизу шахты"
        fakt: "Костович посадил людей не под шаром, а прямо внутрь дирижабля — сквозь середину «России» шла вертикальная труба-шахта, внизу в ней помещались экипаж и пассажиры, там же стоял мотор."
      - uzel: dvigatel
        nazvanie: "Бензиновый двигатель Костовича"
        fakt: "Для дирижабля Костович создал первый в мире бензиновый двигатель — к 1884 году, восемь цилиндров, до 80 лошадиных сил при 240 килограммах. Мотор сохранился и стоит в Центральном музее ВВС в Монино."
      - uzel: stapel
        nazvanie: "Стапель Охтинской верфи"
        fakt: "8 августа 1882 года на Охтинской верфи в Петербурге начали строить корабль длиной 64 метра. К 1889 году были сделаны почти все детали, но буря разрушила сборочный сарай, а субсидия кончилась — «Россию» не достроили."
