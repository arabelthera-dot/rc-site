story:
  kicker: История проекта · 4 удара
  h2: Корабль, который собрали из фанеры
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: В декабре 1879 года Костович задумал дирижабль с жёстким скелетом — такой не мнётся на ветру.
      det:
        - "Мягкий баллон ветер гнёт и сминает. Костович решил дать кораблю каркас. Описание проекта напечатал журнал «Воздухоплаватель» 1 января 1881 года."
      src: 'Источник: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>.'
    - summary: Скелет был собран как велосипедное колесо — обод, втулка и спицы-тросы.
      det:
        - "Внутри корпуса шла круглая ферма-обод, сквозь середину — шахта-втулка, между ними тросы. В нижней части шахты помещались экипаж и пассажиры. Сравнение с колесом любил приводить сам Костович."
      src: 'Источник: «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>.'
    - summary: 8 августа 1882 года на Охтинской верфи начали строить корабль длиной 64 метра.
      det:
        - "Для каркаса Костович изобрёл свою фанеру — арборит, а для полёта собрал бензиновый мотор в 80 сил."
      src: 'Источник: «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>; Центральный музей ВВС, «Двигатель Костовича» — <a href="https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449" rel="noopener" target="_blank">cmvvs.ru</a>.'
    - summary: К 1889 году почти все детали были готовы — но буря разрушила сборочный сарай, а казённые деньги кончились.
      det:
        - "Костович строил дальше на свои деньги и деньги друзей. Взлететь «России» так и не довелось."
      src: 'Источник: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/" rel="noopener" target="_blank">авиару.рф</a>.'
fakty:
  id: fakty
  nav: Факты
  kicker: Пять фактов о Костовиче
  h2: Факты дня
  udary:
    - summary: <b>Костович задумал жёсткий дирижабль «Россия» за двадцать лет до того, как первый в мире жёсткий дирижабль поднялся в небо.</b>
      utverzhdeno: Р197
      det:
        - "Проект появился в декабре 1879 года, его описание напечатали в «Воздухоплавателе» 1 января 1881 года. 8 августа 1882 года на Охтинской верфи в Петербурге начали строить корабль длиной 64 метра. Первый жёсткий дирижабль в мире взлетел только летом 1900 года. «Россию» не достроили: кончились деньги."
      src: 'Источник: «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>; А. Орлов, «Двигатель Костовича», Центральный музей ВВС — <a href="https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449" rel="noopener" target="_blank">cmvvs.ru</a>.'
      otryvok: "«Проект появился в декабре 1879 года… 8 августа 1882 года на Охтинской верфи в Петербурге начали строить корабль длиной 64 метра»."
      stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
      href: https://rg.ru/2013/12/30/kostovich-site.html
      pometka: два источника
    - summary: <b>Для каркаса Костович изобрёл свою фанеру — арборит, которая не гниёт, и его завод делал из неё даже разборные домики.</b>
      utverzhdeno: Р197
      det:
        - "Каркасу нужен был материал прочный и лёгкий. В начале 1880-х Костович изобрёл его сам — БСЭ называет арборит «фанерой высокой прочности». Он склеивал не меньше трёх листов шпона, волокна в соседних листах шли крест-накрест — лист выходил прочным во всех направлениях."
        - "Клеил он «клеем-цементом» собственного изобретения, «делая арборит не поддающимся гниению». На заводе под Петербургом из арборита делали «бочки для вина и керосина, ящики, сундуки, чемоданы, строительные детали и даже фанерные разборные домики»."
      src: 'Источник: БСЭ, 3-е изд., ст. «Костович»; «Российская газета», 30.12.2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener" target="_blank">rg.ru</a>.'
      otryvok: "«…бочки для вина и керосина, ящики, сундуки, чемоданы, строительные детали и даже фанерные разборные домики»."
      stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
      href: https://rg.ru/2013/12/30/kostovich-site.html
      pometka: два источника
    - summary: <b>Для дирижабля Костович сам собрал бензиновый мотор — 80 сил при 240 килограммах, лучше, чем у первых бензиновых моторов мира.</b>
      utverzhdeno: Р197
      det:
        - "Пар и газ не годились: котёл с углём или баллоны с газом дирижабль не поднимет. К 1884 году Костович собрал лёгкий бензиновый мотор: восемь цилиндров, до 80 лошадиных сил при 240 килограммах — три килограмма на каждую силу. Мотор сохранился и стоит в зале № 1 Центрального музея ВВС в Монино."
      src: 'Источник: Центральный музей ВВС, «Двигатель Костовича» — <a href="https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449" rel="noopener" target="_blank">cmvvs.ru</a>; «Двигатель внутреннего сгорания для дирижабля О. С. Костовича», «Российская авиация» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/" rel="noopener" target="_blank">авиару.рф</a>.'
      otryvok: "«…при массе двигателя 240 кг (эти показатели были даже лучшими, чем у первого двигателя…)»; «В России это был первый двигатель внутреннего сгорания, предназначавшийся для летательного аппарата»."
      stranica: «Двигатель внутреннего сгорания для дирижабля О. С. Костовича», «Российская авиация»
      href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/
      pometka: музей и статья
    - summary: <b>Костович первым предложил прятать торпеды внутри подводной лодки — так их и носят подлодки сегодня.</b>
      utverzhdeno: Р197
      det:
        - "В 1878 году бывший капитан Дунайской флотилии предложил флоту свою подводную лодку. До этого мины и торпеды крепили снаружи корпуса."
      src: 'Источник: А. Ф. Ткаченко, «Морской биографический словарь», 2008, с. 488 — <a href="https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html" rel="noopener" target="_blank">imha.ru</a>.'
      otryvok: "«…первым предложил размещать торпеды внутри подводной лодки»."
      stranica: Международная военно-историческая ассоциация, «Костович Огнеслав Степанович» (по «Морскому биографическому словарю»)
      href: https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html
      pometka: словарь
    - summary: <b>Костович построил скафандр, в котором водолаз шесть часов работал под водой без шланга с поверхности.</b>
      utverzhdeno: Р197
      det:
        - "В 1881 году, когда водолазу подавали воздух насосом с лодки, Костович сконструировал автономный скафандр. Всего у него больше сотни изобретений."
      src: 'Источник: Международная военно-историческая ассоциация, по «Морскому биографическому словарю» — <a href="https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html" rel="noopener" target="_blank">imha.ru</a>; «Российская газета», 30.12.2013.'
      otryvok: "«…автономный скафандр, позволявший водолазу находиться под водой 6 часов без сообщения с поверхностью моря»."
      stranica: Международная военно-историческая ассоциация, «Костович Огнеслав Степанович»
      href: https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html
      pometka: словарь
