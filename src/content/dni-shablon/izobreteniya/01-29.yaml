    det:
    - 'Корабль появился на бумаге в декабре 1879 года, его описание напечатали в «Воздухоплавателе» 1 января 1881 года. 8 августа 1882 года на Охтинской верфи в Петербурге начали строить корабль длиной 64 метра. Следующий жёсткий дирижабль в мире поднялся в небо только летом 1900 года — через двадцать лет. «Россию» не достроили: кончились деньги.'
    src: "Источник: «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html; А. Орлов, «Двигатель Костовича», Центральный музей ВВС — https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449; «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация» — авиару.рф."
    otryvok: «8 августа 1882 года на Охтинской судоверфи Петербурга началась постройка дирижабля „РОССИЯ“».
    stranica: «Дирижабль „Россия“ — проект О. С. Костовича», «Российская авиация»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/
    pometka: два источника
    istochnik: "xn-80aafy5bs-xn-p1ai"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f01"
  - summary: "Для каркаса Костович создал первую в мире фанеру — арборит; из неё делали даже домики."
    utverzhdeno: Р197
    det:
    - Каркасу нужен был материал прочный и лёгкий. В начале 1880-х Костович создал его сам — первую в мире фанеру в сегодняшнем смысле слова, как пишет «Российская газета»; БСЭ называет арборит «фанерой высокой прочности». Он склеивал не меньше трёх листов шпона, волокна в соседних листах шли крест-накрест — лист выходил прочным во всех направлениях.
    - Клеил он «клеем-цементом» собственного изобретения, «делая арборит не поддающимся гниению». На заводе под Петербургом из арборита делали «бочки для вина и керосина, ящики, сундуки, чемоданы, строительные детали и даже фанерные разборные домики».
    src: "Источник: БСЭ, 3-е изд., ст. «Костович»; «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html."
    otryvok: «…бочки для вина и керосина, ящики, сундуки, чемоданы, строительные детали и даже фанерные разборные домики».
    stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
    href: https://rg.ru/2013/12/30/kostovich-site.html
    pometka: два источника
    istochnik: "rg"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f02"
  - summary: "Для дирижабля Костович создал первый в мире бензиновый двигатель — 80 сил при 240 кг."
    utverzhdeno: Р197
    det:
    - 'Пар и газ не годились: котёл с углём или баллоны с газом дирижабль не поднимет. К 1884 году Костович создал лёгкий бензиновый двигатель: восемь цилиндров, до 80 лошадиных сил при 240 килограммах — три килограмма на каждую силу. Мотор сохранился и стоит в зале № 1 Центрального музея ВВС в Монино.'
    src: "Источник: Центральный музей ВВС, «Двигатель Костовича» — https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449; «Двигатель внутреннего сгорания для дирижабля О. С. Костовича», «Российская авиация» — авиару.рф."
    otryvok: «…при массе двигателя 240 кг (эти показатели были даже лучшими, чем у первого двигателя…)».
    stranica: «Двигатель внутреннего сгорания для дирижабля О. С. Костовича», «Российская авиация»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/
    pometka: два источника
    istochnik: "xn-80aafy5bs-xn-p1ai-2"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f03"
  - summary: "Костович первым в мире спрятал торпеды внутрь подводной лодки — так их носят и сегодня."
    utverzhdeno: Р197
    det:
    - 'В 1878 году бывший капитан Дунайской флотилии создал для флота проект своей подводной лодки: торпеды в ней стояли внутри корпуса, в носовой «метательной трубе». До этого мины и торпеды крепили снаружи.'
    src: "Источник: А. Ф. Ткаченко, «Морской биографический словарь», 2008, с. 488 — https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html."
    otryvok: «…первым предложил размещать торпеды внутри подводной лодки».
    stranica: Международная военно-историческая ассоциация, «Костович Огнеслав Степанович» (по «Морскому биографическому словарю»)
    href: https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html
    pometka: документ
    istochnik: "imha"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f04"
  - summary: "Костович построил скафандр: водолаз шесть часов работал под водой без шланга с поверхности."
    utverzhdeno: Р197
    det:
    - В 1881 году, когда водолазу подавали воздух насосом с лодки, Костович сконструировал автономный скафандр. Всего у него больше сотни изобретений.
    src: "Источник: Международная военно-историческая ассоциация, по «Морскому биографическому словарю» — https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html; «Российская газета», 30.12.2013."
    otryvok: «…автономный скафандр, позволявший водолазу находиться под водой 6 часов без сообщения с поверхностью моря».
    stranica: Международная военно-историческая ассоциация, «Костович Огнеслав Степанович»
    href: https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html
    pometka: документ
    istochnik: "imha"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f05"
  - summary: "Костович построил дирижабль крупнее всех воздушных кораблей, что были до него."
    det:
    - Длина «России» — 64 метра, объём — 5 тысяч кубометров, поперёк — больше 12 метров. Это как двадцатиэтажный дом, положенный на бок. Ни один воздушный корабль до неё не был таким огромным.
    src: "Источник: Г. Черненко, «Двигатель для дирижабля „Россия“», журнал «Воздухоплаватель» (впервые — «Изобретатель и рационализатор», 2004, № 2) — http://ballooning-magazine.ru/91."
    otryvok: «…был огромным, намного крупнее всех до того построенных. Его корпус объемом 5000 м3 имел длину 64 м, и наибольший диаметр — свыше 12 м».
    stranica: Г. Черненко, «Двигатель для дирижабля „Россия“», «Воздухоплаватель»
    href: http://ballooning-magazine.ru/91
    pometka: документ
    istochnik: "ballooning-magazine"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f06"
  - summary: "Костович посадил людей не под шаром, а прямо внутрь дирижабля."
    det:
    - 'У воздушных шаров корзина висела снизу на верёвках. Костович провёл сквозь середину «России» вертикальную трубу-шахту: внизу в ней помещались экипаж и пассажиры, там же стоял мотор.'
    src: "Источник: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html."
    otryvok: «Сквозь середину корпуса проходила вертикальная шахта-труба, в нижнюю часть которой помещался экипаж и пассажиры. Здесь же располагалось и машинное отделение».
    stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
    href: https://rg.ru/2013/12/30/kostovich-site.html
    pometka: документ
    istochnik: "rg"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f07"
  - summary: "Костович устроил скелет 64-метрового дирижабля как велосипедное колесо."
    det:
    - Внутри баллона — круглая ферма-обод, в центре — шахта-втулка, между ними натянуты тросы, как спицы. Корабль вышел жёстким и при этом лёгким. Это сравнение любил повторять сам Костович.
    src: "Источник: «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html; Г. Черненко, «Воздухоплаватель» — http://ballooning-magazine.ru/91."
    otryvok: «…подобно тому, как идут от втулки к ободу спицы велосипедного колеса (такое сравнение любил приводить сам Костович)».
    stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
    href: https://rg.ru/2013/12/30/kostovich-site.html
    pometka: два источника
    istochnik: "rg"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f08"
  - summary: "Костович первым в мире заправил мотор бензином — тогда им выводили пятна с одежды."
    det:
    - 'В 1880-е бензин покупали в аптеке и лавке: хозяйки чистили им платья. Костович сделал его топливом для мотора своего воздушного корабля. «Российская газета» пишет: бензин как топливо тогда применили впервые.'
    src: "Источник: «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html."
    otryvok: «Также впервые в качестве топлива предлагалось использовать бензин, до этого употребляемый в хозяйстве лишь домохозяйками (для выведения пятен с одежды)…».
    stranica: О. Игнатова, «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013
    href: https://rg.ru/2013/12/30/kostovich-site.html
    pometka: документ
    istochnik: "rg"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f09"
  - summary: "Первую в мире фанеру Костовича запатентовали и за океаном — через 19 лет после русской."
    kadr:
      src: "/muzei/izobreteniya/img/01-29-patent-ssha-1906.jpg"
      alt: "Лист старого американского патента: вверху надпись «No. 830,084. Patented Sept. 4, 1906. Ogneslaw (Ignaz) Kosztovits. Apparatus for manufacturing casks», ниже четыре чертежа станка — большой барабан на подставке, рычаг с колесом и готовое кольцо-обечайка, внизу подписи свидетелей и изобретателя"
      data_source: "https://patents.google.com/patent/US830084A/en"
      license: "общественное достояние (официальный документ федерального правительства США, 1906)"
      podpis: "Патент США № 830 084 от 4 сентября 1906 года на имя Огнеслава Костовича: станок для гнутья бочек и ящиков из склеенных крест-накрест слоёв шпона — его фанеры-арборита. Дата на листе та же, что в энциклопедии: американский патент выдан 4 сентября 1906 года."
      credit: "Патент США № 830 084, О. И. Костович (Ogneslaw Ignaz Kosztovits), заявка 29.06.1904, выдан 04.09.1906; лист чертежей. Хранится: Ведомство по патентам и товарным знакам США; копия — Google Patents."
      width: 901
      height: 1400
      nomer_predmeta: "net"
      nomer_snimka: "net"
      hint: "Патент США № 830 084 Огнеслава Костовича, лист чертежей · 1906"
      glavnoe_na_kartinke: "net"
      podpis_kogda: "1906"
      podpis_gde: "Ведомство по патентам и товарным знакам США"
      podpis_chto: "Патент США № 830 084 Огнеслава Костовича, лист чертежей"
      svyashchennoe: false
      vid: "chertezh"
      prava: {"god_smerti_avtora":"net","god_reabilitacii":"net","sdelano_mashinoj":false,"ssylka":"https://patents.google.com/patent/US830084A/en","avtor":"О. И. Костович","god_sozdaniya":"1906","anonim":false,"otkuda":"Google Patents, patents.google.com"}
