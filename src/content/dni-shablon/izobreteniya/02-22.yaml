igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чьё это число
  pravilo_ru: 'Что сделать сейчас: выбери число и нажми на то, что оно значит.'
  kak_igrat:
    zachem: 'У каждого числа из истории Вологдина — своё место: секунды, рубли, вольты, год.'
    shagi:
    - Выбери число — кнопка загорится золотом.
    - Нажми на то, что оно значит. Верный выбор загорится зелёным.
    - Расставь все четыре числа — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все четыре числа на месте — +20 баллов.
  dannye:
    mesta:
    - kod: sekundy
      nazvanie: За столько секунд ток Вологдина калил танковую деталь
      verno_ru: Танковую деталь калили 30 часов — ток Вологдина сделал это за 37 секунд.
    - kod: rubli
      nazvanie: Столько рублей насчитал Вологдин за свой генератор
      verno_ru: «Сименс» запросила за генератор 200 тысяч рублей. Вологдин насчитал 7 тысяч — и построил сам.
    - kod: volty
      nazvanie: На столько вольт Вологдин сделал выпрямитель
      verno_ru: 'За границей считали: выше 4000 вольт выпрямитель не работает. Вологдин сделал на 12 000.'
    - kod: prikaz
      nazvanie: В таком году вышел приказ «по методу проф. Вологдина»
      verno_ru: В 1936 году вышел приказ о закалке «по методу проф. Вологдина» — метод назвали его именем.
    podpisi:
    - kod: n37
      tekst: 37 секунд
      mesto: sekundy
      mimo_ru: 37 секунд — за столько калили танковую деталь током Вологдина.
    - kod: n7000
      tekst: 7 тысяч рублей
      mesto: rubli
      mimo_ru: 7 тысяч рублей — столько насчитал Вологдин вместо 200 тысяч у «Сименс».
    - kod: n12000
      tekst: 12 000 вольт
      mesto: volty
      mimo_ru: 12 000 вольт — выпрямитель Вологдина, а за границей не верили и в 4000.
    - kod: n1936
      tekst: 1936 год
      mesto: prikaz
      mimo_ru: 1936 год — приказ о закалке «по методу проф. Вологдина».
    vyberi_ru: Сначала выбери число, потом его место.
    mimo_ru: Не то место — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все числа на месте — 37 секунд закалки, 7 тысяч рублей за генератор, 12 000 вольт, приказ 1936 года.
