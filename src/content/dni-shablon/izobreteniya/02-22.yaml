audioguide:
  audioSrc: audio-guide-tvch-vologdin-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу Вологдина: от сгоревшей машины 1912 года через генератор дешевле сименсовского к танкам, закалённым за секунды.'
  stops:
  - t: 0
    mark: 0:00
    title: Пожар и новая машина
  - t: 35
    mark: 0:35
    title: Дешевле «Сименс»
  - t: 70
    mark: '1:10'
    title: Тридцать семь секунд
  - t: 105
    mark: '1:45'
    title: Танки и Курск
  transcript:
  - Пожар тысяча девятьсот двенадцатого года сжёг первую машину Вологдина — в тот же год он построил её заново.
  - '«Сименс» запросила за генератор двести тысяч рублей. Вологдин насчитал семь тысяч — и построил сам. Французский профессор написал: генератор Вологдина «работать не будет». Генератор работал.'
  - Танковую деталь калили тридцать часов — ток Вологдина сделал это за тридцать семь секунд. Сверху деталь твёрдая, а внутри мягкая и упругая — поэтому почти не лопается.
  - Тысячи танков, закалённых током Вологдина, прошли Сталинград, Орёл и Киев. Вологдин не был под Курском, но во многом благодаря ему мы там победили.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
