  data: 22 февраля · Ленинград
  privyazka: В 1936 году вышел приказ о закалке «по методу проф. Вологдина» — метод назвали его именем.
  kto: Валентин Петрович Вологдин
  h1: Первый в мире промышленный индукционный нагрев токами высокой частоты · 1936
