- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Кукла у министра, арест и склад
  udary:
  - summary: "Котельников подбросил куклу с парашютом к потолку кабинета министра."
    det:
    - Получив отказ, Котельников пошёл с моделью на приём в Военное министерство. Прямо в кабинете замминистра генерала Поливанова он подбросил куклу под потолок, и она плавно опустилась на стол.
    - Удивлённый генерал тут же написал записку, и изобретение наконец приняли к рассмотрению. Заявке дали номер 50103.
    src: "Источник: В. П. Захаров, «Первый военный аэродром», глава «Парашют Котельникова» — http://militera.lib.ru/h/zaharov_vp/04.html."
    otryvok: «Прямо в его кабинете Котельников продемонстрировал свою модель, подбросив куклу под потолок. Удивленный генерал потрогал «Манекена-второго», плавно спустившегося на зеленое сукно министерского стола, и сразу же заполнил визитную карточку»
    stranica: В. П. Захаров, «Первый военный аэродром», Военная литература
    href: http://militera.lib.ru/h/zaharov_vp/04.html
    pometka: документ
    istochnik: "militera-lib"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f11"
  - summary: "Манекен потерял голову в воздухе, но приземлился на ноги."
    det:
    - На испытании под Гатчиной манекен весом около 80 кг сбросили с аэростата с высоты 200 метров головой вниз. По пути он задел аэростат, и у куклы оторвалась плохо пришитая голова.
    - Парашют всё равно раскрылся, и манекен опустился так мягко, что несколько мгновений стоял на ногах, а трава под ним едва примялась.
    src: "Источник: В. П. Захаров, «Первый военный аэродром», глава «Парашют Котельникова» — http://militera.lib.ru/h/zaharov_vp/04.html."
    otryvok: «Кукла до действия прибора налетела на один из поясов привязного аэростата, из-за чего у нее оказалась оторванной голова, которая была слабо приметана. После выбрасывания парашют вполне раскрылся, пролетев всего лишь 12–15 м»
    stranica: В. П. Захаров, «Первый военный аэродром», Военная литература
    href: http://militera.lib.ru/h/zaharov_vp/04.html
    pometka: документ
    istochnik: "militera-lib"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f12"
  - summary: "Изобретателя парашюта забрали на войну — в автомобильные части."
    det:
    - Когда началась Первая мировая война, поручика запаса Котельникова призвали в армию. Но отправили его не в авиацию, а к автомобилям.
    - Только когда лётчик Глеб Алехнович убедил командование выдать парашюты экипажам больших самолётов, Котельникова позвали делать парашюты для армии.
    src: "Источник: В. П. Захаров, «Первый военный аэродром», глава «Парашют Котельникова» — http://militera.lib.ru/h/zaharov_vp/04.html."
    otryvok: «В начале войны поручик запаса Г. Е. Котельников был призван в армию и направлен в автомобильные части. Однако вскоре летчик Г. В. Алехнович убедил командование о снабжении экипажей многомоторных самолетов парашютами РК-1.»
    stranica: В. П. Захаров, «Первый военный аэродром», Военная литература
