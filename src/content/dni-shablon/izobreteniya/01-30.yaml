      src: /muzei/izobreteniya/img/01-30-glebov-kotelnikov-akter.jpg
      width: 564
      height: 900
      alt: 'Старая фотография-открытка: актёр в рыцарском шлеме и доспехах, в плаще, смотрит в сторону'
      data_source: 'https://goskatalog.ru/portal/#/collections?id=7774064'
      license: 'общественное достояние (снимок начала XX века, фотоателье В. Каспари) · Государственный музей истории Санкт-Петербурга · Госкаталог'
      podpis: 'Г. Е. Глебов-Котельников в театральном рыцарском костюме. Фотооткрытка начала XX века — сценическое имя изобретателя.'
      credit: 'Фото: В. Каспари (С.-Петербург). Хранится: Государственный музей истории Санкт-Петербурга (ГМИ СПб 428553/744). Госкаталог музейного фонда РФ, рег. № 7658493.'
      hint: "Г. Е. Глебов-Котельников в театральном костюме, фотооткрытка · начало XX века"
