  - summary: "Уже в 1914 году армия заказала 70 парашютов Котельникова."
    det:
    - В начале Первой мировой войны военное ведомство, которое раньше отказало изобретателю, само заказало 70 его ранцевых парашютов.
    - Их выдали экипажам русских тяжёлых бомбардировщиков «Илья Муромец» и ротам дирижаблей.
