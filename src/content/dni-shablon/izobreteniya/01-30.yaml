story:
  kicker: История изобретения
  h2: Купол в ранце на спине
  udary:
  - summary: Котельников придумал парашют, потому что на его глазах разбился лётчик Мациевич.
    det:
    - 24 сентября 1910 года на празднике воздухоплавания в Петербурге у капитана Льва Мациевича на 400 метрах развалился аэроплан. Спастись ему было нечем — парашютов в авиации ещё не было.
    - 'Котельников стоял в толпе и решил: у лётчика должно быть спасение, которое всегда при нём.'
    src: 'Источник: «АиФ — Петербург», «Небесный купол» — <a href="https://spb.aif.ru/society/science/-nebesnyy-kupol-kto-pridumal-nadyozhnoe-sredstvo-dlya-spaseniya-lyotchikov" rel="noopener" target="_blank">spb.aif.ru</a>; Г. Е. Котельников, «Парашют», Детгиз, 1943'
  - summary: 'Изобретатель парашюта был актёром: на сцене его звали Глебов-Котельников.'
    det:
    - В 1910 году, в 38 лет, Котельников поступил в труппу Народного дома в Петербурге. Не инженер и не лётчик — актёр.
    src: 'Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939; «АиФ — Петербург», «Небесный купол» — <a href="https://spb.aif.ru/society/science/-nebesnyy-kupol-kto-pridumal-nadyozhnoe-sredstvo-dlya-spaseniya-lyotchikov" rel="noopener" target="_blank">spb.aif.ru</a>'
  - summary: Шёлк для купола подсказала шаль актрисы.
    det:
    - Котельников искал ткань, которая уложится в маленький ранец. Актриса выдернула из сумочки шёлковую шаль — и та развернулась в целое полотно. «Ведь это же мысль!.. Ничем не пропитанный шелк!» — вспоминал изобретатель.
    src: 'Источник: Г. Е. Котельников, «Парашют», Детгиз, 1943, гл. IV'
  - summary: Первую заявку на парашют в России отклонили «за ненадобностью».
    det:
    - 'В 1911 году генерал Кованько, начальник воздухоплавательной школы, спросил изобретателя: а не оторвутся ли у лётчика ноги от удара при раскрытии? Изобретение отклонили «за ненадобностью».'
    src: 'Источник: Г. Е. Котельников, «Парашют», Детгиз, 1943; В. П. Захаров, «Первый военный аэродром» — <a href="http://militera.lib.ru/h/zaharov_vp/04.html" rel="noopener" target="_blank">militera.lib.ru</a>'
  - summary: Котельников сам называл РК-1 «первым в мире автоматическим спасательным приспособлением».
    det:
    - До РК-1 парашют висел на самолёте и падал вместе с ним. У Котельникова купол сам выбрасывался из ранца на спине — стоило дёрнуть кольцо.
    - Изобретатель писал, что отказать такое устройство может «лишь, как несчастный случай».
    src: 'Источник: History.ru, «Спасительный ранец: история создания парашюта РК-1» — <a href="https://history.ru/read/articles/spasitelnyy-ranec-istoriya-sozdaniya-parashyuta-rk-1" rel="noopener" target="_blank">history.ru</a>'
  - summary: 6 (19) июня 1912 года РК-1 сработал с первого раза у деревни Сализи.
    det:
    - Под Гатчиной манекен весом в 80 килограммов с ранцем РК-1 сбросили с аэростата с высоты 200 метров. Купол раскрылся безупречно. 12 июня испытание повторили.
    src: 'Источник: В. П. Захаров, «Первый военный аэродром» — <a href="http://militera.lib.ru/h/zaharov_vp/04.html" rel="noopener" target="_blank">militera.lib.ru</a>; Г. Е. Котельников, «Парашют», Детгиз, 1943, гл. VIII'
  - summary: Осенью 1912 года РК-1 впервые сбросили с летящего аэроплана.
    det:
    - 26 сентября 1912 года в Гатчине штабс-капитан Горшков сбросил манекен с парашютом с моноплана на высоте 80 метров. Парашют раскрылся.
    src: 'Источник: В. П. Захаров, «Первый военный аэродром» — <a href="http://militera.lib.ru/h/zaharov_vp/04.html" rel="noopener" target="_blank">militera.lib.ru</a>; Г. Е. Котельников, «Парашют», Детгиз, 1943'
  - summary: Первым с РК-1 прыгнул человек — студент Петербургской консерватории.
    det:
    - 5 января 1913 года Владислав Оссовский прыгнул с ранцем Котельникова с моста через Сену в Руане — с высоты 53 метра. Смотреть собралась толпа на обоих берегах.
    src: 'Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939, гл. X; В. П. Захаров, «Первый военный аэродром» — <a href="http://militera.lib.ru/h/zaharov_vp/04.html" rel="noopener" target="_blank">militera.lib.ru</a>'
  - summary: Котельников первым придумал парашют-тормоз — после опыта с автомобилем.
    det:
    - 'Когда купол остановил разогнанную машину, изобретатель записал: «Парашют оказался тормозом!» Так можно сократить пробег аэроплана на посадке. Сегодня тормозной парашют выпускают самолёты на посадке.'
    src: 'Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939, гл. VII'
  - summary: В 1923 году Котельников сделал РК-2 — с полумягким ранцем.
    det:
    - Первый ранец был жёстким. РК-2 стал первым шагом к мягкому ранцу, который носят и сегодня.
    src: 'Источник: Г. Е. Котельников, «Парашют», Детгиз, 1943, гл. XII; «АиФ — Петербург», «Небесный купол» — <a href="https://spb.aif.ru/society/science/-nebesnyy-kupol-kto-pridumal-nadyozhnoe-sredstvo-dlya-spaseniya-lyotchikov" rel="noopener" target="_blank">spb.aif.ru</a>'
  - summary: Котельников сменил жёсткий ранец на мягкий — с сотами для строп.
    det:
    - Первый ранец был деревянным, потом алюминиевым. Затем Котельников сшил мягкий ранец, а стропы уложил в специальные соты. Патент на эту модель, РК-3, выдан 4 июля 1924 года, № 1607.
    src: 'Источник: «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>; RATNIK.TV, «Парашют РК-1 Глеба Котельникова» — <a href="https://ratnik.tv/articles/science/parashyut-rk-1-gleba-kotelnikova/" rel="noopener" target="_blank">ratnik.tv</a>'
  - summary: Котельников сделал парашют, который опускал с неба 300 кг груза.
    det:
    - В 1924 году появился грузовой РК-4 с куполом 12 метров в поперечнике. На нём с самолёта сбрасывали груз весом с четырёх взрослых.
    src: 'Источник: RATNIK.TV, «Парашют РК-1 Глеба Котельникова» — <a href="https://ratnik.tv/articles/science/parashyut-rk-1-gleba-kotelnikova/" rel="noopener" target="_blank">ratnik.tv</a>; сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>'
  - summary: Котельников придумал, как спасти всех пассажиров самолёта сразу.
    det:
    - 'Для гражданских самолётов он разработал «коллективный» парашют: пассажиры сидят в кабине, и при аварии лётчик поворотом рычага отделяет её — кабина опускается на парашюте.'
    src: 'Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939, гл. XII'
  - summary: В 1926 году Котельников подарил все свои парашюты стране.
    det:
    - «Все свои изобретения в области парашюта я подарил нашему правительству со всеми будущими усовершенствованиями», — писал он.
    src: 'Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939; «АиФ — Петербург», «Небесный купол» — <a href="https://spb.aif.ru/society/science/-nebesnyy-kupol-kto-pridumal-nadyozhnoe-sredstvo-dlya-spaseniya-lyotchikov" rel="noopener" target="_blank">spb.aif.ru</a>; История.РФ, «Котельников Глеб Евгеньевич» — <a href="https://history.ru/read/biographies/kotielnikov-glieb-ievghienievich" rel="noopener" target="_blank">history.ru</a>'
  - summary: Котельников пережил блокадную зиму и до конца жизни строил парашюты.
    det:
    - Войну изобретатель встретил в Ленинграде и пережил там первую блокадную зиму, потом его вывезли в Москву. Конструктором он работал до последних дней и умер 22 ноября 1944 года.
    src: 'Источник: сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>; «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>'
  - summary: Историю своего парашюта Котельников написал сам — для детей.
    det:
    - Книга «История одного изобретения. Русский парашют» вышла в Детиздате в 1939 году, а в 1943-м — под названием «Парашют».
    src: 'Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939; Г. Е. Котельников, «Парашют», Детгиз, 1943'
fakty:
  id: fakty
  nav: Факты
  kicker: 8 фактов о Котельникове
  h2: Факты дня
  udary:
  - summary: '<b>Великий князь запретил парашют: лётчики начнут спасаться, бросая дорогие самолёты.</b>'
    det:
    - 'Генералы просили великого князя Александра Михайловича, главного начальника русской авиации, ввести парашюты Котельникова. Князь написал на докладе: «Парашют вообще в авиации — вещь вредная, так как летчики, при малейшей опасности, грозящей им со стороны неприятеля, будут спасаться на парашютах, предоставляя самолеты гибели».'
    - 'По книге Котельникова, это было «в конце империалистической войны» — уже после того, как его парашюты спасли первых воздухоплавателей. А генералы и министры добавляли: «Машины дороже людей… А люди — найдутся!»'
    - Сегодня с парашютом прыгает каждый военный лётчик — и первым такой ранец сделал Котельников.
    src: 'Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939, гл. XI; Г. Е. Котельников, «Парашют», Детгиз, 1943, гл. XI; «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>'
    otryvok: «Парашют вообще в авиации — вещь вредная, так как летчики, при малейшей опасности, грозящей им со стороны неприятеля, будут спасаться на парашютах, предоставляя самолеты гибели».
    stranica: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939
    href: https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/
    pometka: два источника
    utverzhdeno: к сайту по Р359, правки — ревизией месяца (Р358)
  - summary: <b>Дома патент не дали — первой парашют Котельникова запатентовала Франция.</b>
    det:
    - 27 октября 1911 года Котельников подал заявку в петербургский Комитет по изобретениям, но получил только охранное свидетельство — патента ему не выдали.
    - 'Тогда он подал заявку во Франции: 20 марта 1912 года там выдали патент № 438 612, а 23 мая его опубликовали.'
    - Свой, отечественный патент Котельников получил только при советской власти — № 1607 на РК-3, 1924 год.
    src: 'Источник: В. П. Захаров, «Первый военный аэродром» — <a href="http://militera.lib.ru/h/zaharov_vp/04.html" rel="noopener" target="_blank">militera.lib.ru</a>; ИВАК, «Котельников. Заявка на изобретение авиационного парашюта» (по сборнику АН СССР, 1971) — <a href="https://ivak.spb.ru/aviation/kotelnikov-zayavka-na-izobretenie-aviacionnogo-parashyuta.html" rel="noopener" target="_blank">ivak.spb.ru</a>'
    otryvok: «…патент Г.Е. Котельникову выдан не был… 20 марта 1912 г. Национальное Управление промышленных изобретений Франции выдало… патент № 438612, а 23 мая того же 1912 г. содержание патента было опубликовано»
    stranica: ИВАК, «Котельников. Заявка на изобретение авиационного парашюта» (по сборнику АН СССР, 1971)
    href: https://ivak.spb.ru/aviation/kotelnikov-zayavka-na-izobretenie-aviacionnogo-parashyuta.html
    pometka: два источника
    utverzhdeno: к сайту по Р359, правки — ревизией месяца (Р358)
  - summary: <b>Котельников остановил мчащийся автомобиль одним рывком купола.</b>
    det:
    - 2 июня 1912 года парашют привязали к буксировочным крюкам и разогнали машину. Котельников дёрнул кольцо, и купол раскрылся мгновенно.
    - Тормозило так сильно, что у автомобиля заглох двигатель.
    src: 'Источник: сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>; «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>'
    otryvok: «Привязанный за буксировочные крюки парашют мгновенно раскрылся. Сила торможения передалась на автомобиль и двигатель заглох.»
    stranica: сайт «Российская авиация», «Парашют Котельникова»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/
    pometka: два источника
    utverzhdeno: к сайту по Р359, правки — ревизией месяца (Р358)
  - summary: <b>Парашют Котельникова раскрылся 20 раз из 20 — ни одной осечки.</b>
    det:
    - 4 августа 1911 года в Новгороде изобретатель сбрасывал куклу с парашютом с высоты 200 метров. Он сам написал об этом военному министру, когда просил денег на настоящий образец.
    src: 'Источник: сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>'
    otryvok: «4 августа с.г. в Новгороде кукла сбрасывалась с высоты 200 метров, из 20 раз ни одной осечки.»
    stranica: сайт «Российская авиация», «Парашют Котельникова»
    href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/
    pometka: документ
    utverzhdeno: к сайту по Р359, правки — ревизией месяца (Р358)
  - summary: <b>Парашют Котельникова сам вытащил офицера из корзины — и спас его.</b>
    det:
    - 25 января 1917 года на Северном фронте аэростат-наблюдатель поднялся на 250 метров. Ветер сорвал купол, и тот потащил подпоручика из корзины. Офицер прыгнул и благополучно приземлился.
    - С этого случая в русской армии началось применение парашютов.
    src: 'Источник: Л. Минов, «Военно-исторический журнал», № 8, 1976 — <a href="https://10otb.ru/content/history/army_history/parashuts_rus_army.html" rel="noopener" target="_blank">10otb.ru</a>'
    otryvok: «…об этом необыкновенном происшествии, ознаменовавшем начало применения парашютов в русской армии»
    stranica: Л. Минов, «Военно-исторический журнал», № 8, 1976
    href: https://10otb.ru/content/history/army_history/parashuts_rus_army.html
    pometka: документ
    utverzhdeno: к сайту по Р359, правки — ревизией месяца (Р358)
  - summary: <b>Уже в 1914 году армия заказала 70 парашютов Котельникова.</b>
    det:
    - В начале Первой мировой войны военное ведомство, которое раньше отказало изобретателю, само заказало 70 его ранцевых парашютов.
    - Их выдали экипажам первых русских тяжёлых бомбардировщиков «Илья Муромец» и ротам дирижаблей.
    src: 'Источник: Л. Минов, «Военно-исторический журнал», № 8, 1976 — <a href="https://10otb.ru/content/history/army_history/parashuts_rus_army.html" rel="noopener" target="_blank">10otb.ru</a>'
    otryvok: «Главное военно-техническое управление заказало для нужд авиации и воздухоплавания 70 ранцевых парашютов системы Г. Е. Котельникова»
    stranica: Л. Минов, «Военно-исторический журнал», № 8, 1976
    href: https://10otb.ru/content/history/army_history/parashuts_rus_army.html
    pometka: документ
    utverzhdeno: к сайту по Р359, правки — ревизией месяца (Р358)
  - summary: <b>Деревня, где впервые испытали РК-1, с 1949 года носит имя Котельникова.</b>
    det:
    - В июне 1912 года у деревни Сализи под Гатчиной парашют испытали с аэростата. В 1949 году деревню переименовали в Котельниково, а в 1972 году у въезда открыли памятный знак.
    src: 'Источник: RATNIK.TV, «Парашют РК-1 Глеба Котельникова» — <a href="https://ratnik.tv/articles/science/parashyut-rk-1-gleba-kotelnikova/" rel="noopener" target="_blank">ratnik.tv</a>; сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>'
    otryvok: «В сентябре 1949 деревня Сализи, где впервые испытывался парашют Котельникова, была переименована в Котельниково.»
    stranica: RATNIK.TV, «Парашют РК-1 Глеба Котельникова»
    href: https://ratnik.tv/articles/science/parashyut-rk-1-gleba-kotelnikova/
    pometka: два источника
    utverzhdeno: к сайту по Р359, правки — ревизией месяца (Р358)
  - summary: <b>Парашютисты до сих пор просят удачи у могилы Котельникова.</b>
    det:
    - Изобретатель похоронен на Новодевичьем кладбище в Москве. Парашютисты привязывают к веткам дерева над могилой ленточку для затяжки ранца — есть примета, что тогда прыжок будет удачным.
    src: 'Источник: «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>'
    otryvok: «Считается, что если привязать к ветвям дерева над могилой Глеба Евгеньевича Котельникова ленточку для затяжки парашютного ранца, парашютисту будет сопутствовать удача.»
    stranica: «Совершенно секретно», «Парашют Котельникова, модель первая»
    href: https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/
    pometka: документ
    utverzhdeno: к сайту по Р359, правки — ревизией месяца (Р358)
