    src: "Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939; «АиФ — Петербург», «Небесный купол» — spb.aif.ru; История.РФ, «Котельников Глеб Евгеньевич» — history.ru"
  - summary: Котельников пережил блокадную зиму и до конца жизни строил парашюты.
    det:
    - Войну изобретатель встретил в Ленинграде и пережил там первую блокадную зиму, потом его вывезли в Москву. Конструктором он работал до последних дней и умер 22 ноября 1944 года.
    src: "Источник: сайт «Российская авиация», «Парашют Котельникова» — xn--80aafy5bs.xn--p1ai; «Совершенно секретно», «Парашют Котельникова, модель первая» — www.sovsekretno.ru"
  - summary: Историю своего парашюта Котельников написал сам — для детей.
