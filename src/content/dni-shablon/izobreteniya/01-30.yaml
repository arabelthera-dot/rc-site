return:
  q: Сколько раз из 20 раскрылся парашют Котельникова на опыте 1911 года?
  a: 20 из 20 — ни одной осечки.
  src: сайт «Российская авиация», «Парашют Котельникова»
audioguide:
  audioSrc: /muzei/izobreteniya/audio-guide-kotelnikov-ru.mp3
  durationLabel: 6 минут 36 секунд
  lead: "Голос ведёт по залу парашюта: от праздника 1910 года до семейства РК. Шесть остановок, на каждой — что искать глазами."
  stops:
    - t: 0
      mark: 0:00
      title: Праздник, который кончился молчанием
    - t: 61
      mark: 1:01
      title: Актёр в толпе
    - t: 121
      mark: 2:01
      title: Шёлк вместо брезента
    - t: 185
      mark: 3:05
      title: "РК-1: ранец, пружины, кольцо"
    - t: 253
      mark: 4:13
      title: Иван Иванович
    - t: 312
      mark: 5:12
      title: Всё это он отдал даром
  transcript:
    - "<p>«Начнём не с парашюта, а с толпы. Двадцать четвёртое сентября 1910 года, Петербург, Всероссийский праздник воздухоплавания: тысячи людей стоят на аэродроме, задрав головы. В небе капитан Лев Мациевич поднимается на четыреста метров, и на этой высоте его аэроплан разваливается прямо в воздухе. Спастись ему нечем — не потому, что растерялся, а потому, что спасать в авиации тогда было нечем в принципе. Запомните это ощущение пустоты: весь зал — про то, как её заполнили.</p>"
    - "<p>Обычно на месте этого портрета в музеях висит инженер: сюртук, чертёж, циркуль. Глеб Евгеньевич Котельников — актёр труппы петербургского Народного дома, человек сцены. Он стоял в той самой толпе и видел падение своими глазами. Задача, которую он себе поставил, звучала так: у лётчика должно быть спасение, которое всегда при нём — не привязанное к машине, надетое на человека.</p>"
    - "<p>Витрина с тканью, два образца рядом. Слева брезент, из которого делали купола раньше, — в сложенном виде внушительный тюк. Справа шёлк — горсть ткани, разворачивающаяся в целое полотно. Легенду про дамский платок мы рассказываем честно: историки спорят, было ли так. Но инженерная мысль за ней достоверна. Пока купол тяжёлый, его можно только возить на самолёте; как только купол лёгкий — его можно носить на спине. Смена ткани здесь переносит спасение с машины на человека.</p>"
    - "<p>Центр зала — РК-1, «русский, Котельникова, первый». Ранец за спиной, внутри шёлковый купол, под куполом пружины, снаружи вытяжное кольцо. Человек дёрнул кольцо, пружины выбросили купол в поток, поток его раскрыл. Главное слово на табличке — «свободного действия»: момент раскрытия выбирает человек, а не самолёт, который уже разрушается. Рядом — манекен весом восемьдесят килограммов, которого изобретатель звал Иваном Ивановичем: его роняли с крыши, с воздушного змея, с аэростата, и 6 (19) июня 1912 года под Петербургом парашют сработал безупречно. Сначала кукла — и только потом человек.</p>"
    - <p>И последнее. Тормозной парашют, РК-2 с полумягким ранцем, РК-3 с мягким ранцем и сотами для строп (патент №1607 от 4 июля 1924 года), грузовой РК-4 с куполом двенадцати метров, коллективный спасательный — для целого пассажирского борта. А в 1926 году Котельников безвозмездно передал все права государству. Не продал — отдал. Человек, который начал с чужой смерти на аэродроме, закончил тем, что раздал спасение всем».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
