    det:
    - В 1910 году, в 38 лет, Котельников поступил в труппу Народного дома в Петербурге. Не инженер и не лётчик — актёр.
    src: "Источник: Г. Е. Котельников, «История одного изобретения. Русский парашют», Детиздат, 1939; «АиФ — Петербург», «Небесный купол» — spb.aif.ru"
  - summary: Шёлк для купола подсказала шаль актрисы.
    det:
    - Котельников искал ткань, которая уложится в маленький ранец. Актриса выдернула из сумочки шёлковую шаль — и та развернулась в целое полотно. «Ведь это же мысль!.. Ничем не пропитанный шелк!» — вспоминал изобретатель.
    src: 'Источник: Г. Е. Котельников, «Парашют», Детгиз, 1943, гл. IV'
  - summary: Заявку на парашют в России отклонили «за ненадобностью».
    det:
    - 'В 1911 году генерал Кованько, начальник воздухоплавательной школы, спросил изобретателя: а не оторвутся ли у лётчика ноги от удара при раскрытии? Изобретение отклонили «за ненадобностью».'
    src: "Источник: Г. Е. Котельников, «Парашют», Детгиз, 1943; В. П. Захаров, «Первый военный аэродром» — militera.lib.ru"
  - summary: Котельников сам называл РК-1 «первым в мире автоматическим спасательным приспособлением».
    det:
    - До РК-1 парашют висел на самолёте и падал вместе с ним. У Котельникова купол сам выбрасывался из ранца на спине — стоило дёрнуть кольцо.
    - Изобретатель писал, что отказать такое устройство может «лишь, как несчастный случай».
    src: "Источник: History.ru, «Спасительный ранец: история создания парашюта РК-1» — history.ru"
  - summary: 6 (19) июня 1912 года РК-1 сработал с первого раза у деревни Сализи.
    kadr:
      src: "/muzei/izobreteniya/img/01-30-ispytanie-maneken-salizi.jpg"
      alt: "Старая чёрно-белая фотография на листе с рваными краями: манекен в шлеме, затянутый в лямки парашюта, стоит у корзины аэростата; вокруг военные в фуражках, справа мужчина в канотье и костюме"
      data_source: "https://goskatalog.ru/portal/#/collections?id=57088835"
      license: "общественное достояние (фотограф не указан, снимок 1910-х годов) · Музей истории ВДВ · Госкаталог, рег. № 56812128"
      podpis: "Испытание парашюта Котельникова на манекене: манекен в подвесной системе готовят к сбросу из корзины аэростата. Так РК-1 проверяли перед военными, прежде чем доверить ему человека."
      credit: "Фотограф не указан. Хранится: Музей истории Воздушно-десантных войск — филиал Центрального музея Вооружённых сил РФ (ФФ/1084, МВДВ-5089). Госкаталог музейного фонда РФ, рег. № 56812128. В карточке дата «6 июня 1911 г.» — по источникам дня испытание у Сализи было 6 июня 1912 г."
