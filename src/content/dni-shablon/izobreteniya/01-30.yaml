      prava: {"god_smerti_avtora":"net","god_reabilitacii":"net","sdelano_mashinoj":false,"otkuda":"Госкаталог музейного фонда РФ","baza":"goskatalog","pervaya_publikaciya":"Госкаталог музейного фонда РФ","ssylka":"https://goskatalog.ru/portal/#/collections?id=7774064","avtor":"В. Каспари","god_sozdaniya":"начало XX века","anonim":false,"nomer":"7658493"}
