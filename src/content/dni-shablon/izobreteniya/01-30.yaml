  udary:
  - summary: Котельников придумал парашют, потому что на его глазах разбился лётчик Мациевич.
    kadr:
      src: "/muzei/izobreteniya/img/01-30-posledniy-polet-matsievicha-1910.jpg"
      alt: "Журнальная страница дореформенной орфографией «Последній полетъ капитана Л. М. Мациевича»: вверху аэроплан-биплан с лётчиком, в центре портрет капитана в фуражке, слева обломки аэроплана с номером 20 и толпа, внизу надгробие"
      data_source: "https://goskatalog.ru/portal/#/collections?id=23034178"
      license: "общественное достояние (издание 1910 года) · Центральный военно-морской музей · Госкаталог, рег. № 22897431"
      podpis: "«Последний полёт капитана Л. М. Мациевича в дни первого Всероссийского праздника воздухоплавания в 1910 году»: страница того времени с обломками его аэроплана. Эта гибель на глазах у публики заставила Котельникова взяться за парашют."
      credit: "Неизвестный издатель, 1910. Хранится: Центральный военно-морской музей имени императора Петра Великого (ЦВММ КП ФН-6419, стеклянный негатив). Госкаталог музейного фонда РФ, рег. № 22897431."
