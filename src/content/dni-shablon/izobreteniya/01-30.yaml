  - summary: "Лётчик Нестеров захотел прыгнуть с парашютом — и попал под арест."
    det:
    - Летом 1912 года под Гатчиной будущий знаменитый лётчик Пётр Нестеров увидел, как плавно опускается манекен с парашютом Котельникова. Он тут же попросил разрешения прыгнуть сам.
    - Но адъютант лётной школы запретил опыт, а поручик Нестеров отправился на гауптвахту. Лётчикам тогда вообще не разрешали пользоваться парашютами.
    src: "Источник: В. П. Захаров, «Первый военный аэродром», глава «Парашют Котельникова» — http://militera.lib.ru/h/zaharov_vp/04.html."
    otryvok: «Но адъютант школы вмешался и запретил эксперимент, а поручик Нестеров оказался на гауптвахте.»
    stranica: В. П. Захаров, «Первый военный аэродром», Военная литература
    href: http://militera.lib.ru/h/zaharov_vp/04.html
    pometka: документ
    istochnik: "militera-lib"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f09"
  - summary: "Генерал пугал: с парашютом лётчику оторвёт ноги."
    det:
    - Осенью 1911 года парашют Котельникова рассматривала комиссия во главе с начальником Воздухоплавательной школы генералом Кованько. Генерал заявил, что при резком рывке купола лётчик останется без ног.
    - Котельников с этим не смирился и всё-таки добился испытаний. Манекены с его парашютом приземлялись целыми.
    src: "Источник: В. П. Захаров, «Первый военный аэродром», глава «Парашют Котельникова» — http://militera.lib.ru/h/zaharov_vp/04.html."
    otryvok: «На заседании комиссии генерал Кованько озадачил изобретателя, заявив, что, после того как летчик выбросится из самолета и откроет парашют, ему он будет уже не нужен, так как при рывке у него оторвутся ноги. Однако Котельникову удалось добиться испытания своего парашюта.»
