return:
  q: Сколько раз из 20 раскрылся парашют Котельникова на опыте 1911 года?
  a: 20 из 20 — ни одной осечки.
  src: сайт «Российская авиация», «Парашют Котельникова»
audioguide:
  audioSrc: audio-guide-kotelnikov-ru.mp3
  durationLabel: 2 минуты 59 секунд
  lead: "Голос ведёт по залу парашюта: от двадцати раскрытий из двадцати и куклы под потолком министра до ленточки на удачу. Шесть остановок."
  stops:
  - t: 0
    mark: '0:00'
    title: "Первый ранцевый парашют"
  - t: 14
    mark: '0:14'
    title: "Двадцать раз из двадцати"
  - t: 51
    mark: '0:51'
    title: "Кукла под потолком министра"
  - t: 81
    mark: '1:21'
    title: "Франция и Нестеров"
  - t: 106
    mark: '1:46'
    title: "Два года на складе"
  - t: 141
    mark: '2:21'
    title: "Ленточка на удачу"
  transcript:
  - "Тридцатое января. Зал Глеба Котельникова — человека, который создал первый в мире ранцевый парашют. Шесть остановок, и на каждой — то, что рассказано на этой странице. Слушайте фоном, пока читаете."
  - "Остановка первая — испытания. Четвёртого августа тысяча девятьсот одиннадцатого года в Новгороде Котельников сбрасывал куклу с парашютом с высоты двести метров. Купол раскрылся двадцать раз из двадцати — ни одной осечки. Второго июня тысяча девятьсот двенадцатого года парашют привязали к автомобилю и разогнали машину. Котельников дёрнул кольцо, купол раскрылся мгновенно, и у автомобиля заглох двигатель. А под Гатчиной манекен весом около восьмидесяти килограммов сбросили с аэростата головой вниз. У куклы оторвалась плохо пришитая голова, но парашют раскрылся, и манекен несколько мгновений стоял на ногах."
  - "Остановка вторая — отказ. Осенью тысяча девятьсот одиннадцатого года комиссия во главе с генералом Кованько рассматривала парашют, и генерал заявил: при резком рывке купола лётчик останется без ног. Двадцать седьмого октября Котельников подал заявку в петербургский Комитет по изобретениям, но патента не получил — только охранное свидетельство. Тогда он пришёл с моделью к заместителю военного министра генералу Поливанову и подбросил куклу под потолок кабинета. Кукла плавно опустилась на стол, и изобретение наконец приняли к рассмотрению."
  - "Остановка третья. Двадцатого марта тысяча девятьсот двенадцатого года патент на парашют Котельникова выдали не дома, а во Франции. А летом того же года под Гатчиной лётчик Пётр Нестеров увидел, как плавно опускается манекен с парашютом, и попросил разрешения прыгнуть сам. Адъютант лётной школы запретил опыт, и Нестеров отправился на гауптвахту. Лётчикам тогда вообще не разрешали пользоваться парашютами."
  - "Остановка четвёртая — война. В тысяча девятьсот четырнадцатом году армия заказала семьдесят парашютов Котельникова, а самого изобретателя призвали не в авиацию, а в автомобильные части. Парашюты сшили за два месяца, и два года они пролежали на складе: воздухоплавателям их отдали только в мае тысяча девятьсот шестнадцатого. Двадцать пятого января тысяча девятьсот семнадцатого года на Северном фронте ветер сорвал купол и вытащил подпоручика из корзины аэростата. Офицер благополучно приземлился. За тот год парашютами воспользовались шестьдесят два раза, и сорок два раза всё закончилось благополучно."
  - "Остановка пятая. Великий князь Александр Михайлович, главный начальник русской авиации, написал на докладе, что парашют — вещь вредная: лётчики будут спасаться, бросая самолёты. Сегодня с парашютом прыгает каждый военный лётчик. Свой, отечественный патент Котельников получил только при советской власти. Деревня Сализи под Гатчиной, где испытали его парашют, с тысяча девятьсот сорок девятого года называется Котельниково. А на Новодевичьем кладбище в Москве парашютисты привязывают к дереву над его могилой ленточку для затяжки ранца — на удачу. Игра — наверху страницы, ниже — факты с источниками и викторина. Спасибо, что были с нами."
  note: Озвучено синтезом речи.
