story:
  kicker: История изобретения
  h2: Купол в ранце на спине
  udary:
    - summary: Котельников сам называл РК-1 «первым в мире автоматическим спасательным приспособлением».
      det:
        - До РК-1 парашют висел на самолёте и падал вместе с ним. У Котельникова купол сам выбрасывался из ранца на спине — стоило дёрнуть кольцо.
        - Изобретатель писал, что отказать такое устройство может «лишь, как несчастный случай».
      src: 'Источник: History.ru, «Спасительный ранец: история создания парашюта РК-1» — <a href="https://history.ru/read/articles/spasitelnyy-ranec-istoriya-sozdaniya-parashyuta-rk-1" rel="noopener" target="_blank">history.ru</a>'
    - summary: Котельников сменил жёсткий ранец на мягкий — с сотами для строп.
      det:
        - Первый ранец был деревянным, потом алюминиевым. Затем Котельников сшил мягкий ранец, а стропы уложил в специальные соты. Патент на эту модель, РК-3, выдан 4 июля 1924 года, № 1607.
      src: 'Источник: «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>; RATNIK.TV, «Парашют РК-1 Глеба Котельникова» — <a href="https://ratnik.tv/articles/science/parashyut-rk-1-gleba-kotelnikova/" rel="noopener" target="_blank">ratnik.tv</a>'
    - summary: Котельников сделал парашют, который опускал с неба 300 кг груза.
      det:
        - В 1924 году появился грузовой РК-4 с куполом 12 метров в поперечнике. На нём с самолёта сбрасывали груз весом с четырёх взрослых.
      src: 'Источник: RATNIK.TV, «Парашют РК-1 Глеба Котельникова» — <a href="https://ratnik.tv/articles/science/parashyut-rk-1-gleba-kotelnikova/" rel="noopener" target="_blank">ratnik.tv</a>; сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>'
    - summary: Котельников пережил блокадную зиму и до конца жизни строил парашюты.
      det:
        - Войну изобретатель встретил в Ленинграде и пережил там первую блокадную зиму, потом его вывезли в Москву. Конструктором он работал до последних дней и умер 22 ноября 1944 года.
      src: 'Источник: сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>; «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>'
fakty:
  id: fakty
  nav: Факты
  kicker: Шесть фактов о Котельникове
  h2: Факты дня
  udary:
    - summary: <b>Котельников остановил мчащийся автомобиль одним рывком купола.</b>
      det:
        - 2 июня 1912 года парашют привязали к буксировочным крюкам и разогнали машину. Котельников дёрнул кольцо, и купол раскрылся мгновенно.
        - Тормозило так сильно, что у автомобиля заглох двигатель.
      src: 'Источник: сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>; «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>'
      otryvok: «Привязанный за буксировочные крюки парашют мгновенно раскрылся. Сила торможения передалась на автомобиль и двигатель заглох.»
      stranica: сайт «Российская авиация», «Парашют Котельникова»
      href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/
      pometka: два источника
      utverzhdeno: ждёт «да» Сергея
    - summary: <b>Парашют Котельникова раскрылся 20 раз из 20 — ни одной осечки.</b>
      det:
        - 4 августа 1911 года в Новгороде изобретатель сбрасывал куклу с парашютом с высоты 200 метров. Он сам написал об этом военному министру, когда просил денег на настоящий образец.
      src: 'Источник: сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>'
      otryvok: «4 августа с.г. в Новгороде кукла сбрасывалась с высоты 200 метров, из 20 раз ни одной осечки.»
      stranica: сайт «Российская авиация», «Парашют Котельникова»
      href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/
      pometka: документ
      utverzhdeno: ждёт «да» Сергея
    - summary: <b>Парашют Котельникова сам вытащил офицера из корзины — и спас его.</b>
      det:
        - 25 января 1917 года на Северном фронте аэростат-наблюдатель поднялся на 250 метров. Ветер сорвал купол, и тот потащил подпоручика из корзины. Офицер прыгнул и благополучно приземлился.
        - С этого случая в русской армии началось применение парашютов.
      src: 'Источник: Л. Минов, «Военно-исторический журнал», № 8, 1976 — <a href="https://10otb.ru/content/history/army_history/parashuts_rus_army.html" rel="noopener" target="_blank">10otb.ru</a>'
      otryvok: «…об этом необыкновенном происшествии, ознаменовавшем начало применения парашютов в русской армии»
      stranica: Л. Минов, «Военно-исторический журнал», № 8, 1976
      href: https://10otb.ru/content/history/army_history/parashuts_rus_army.html
      pometka: документ
      utverzhdeno: ждёт «да» Сергея
    - summary: <b>Уже в 1914 году армия заказала 70 парашютов Котельникова.</b>
      det:
        - В начале Первой мировой войны военное ведомство, которое раньше отказало изобретателю, само заказало 70 его ранцевых парашютов.
        - Их выдали экипажам первых русских тяжёлых бомбардировщиков «Илья Муромец» и ротам дирижаблей.
      src: 'Источник: Л. Минов, «Военно-исторический журнал», № 8, 1976 — <a href="https://10otb.ru/content/history/army_history/parashuts_rus_army.html" rel="noopener" target="_blank">10otb.ru</a>'
      otryvok: «Главное военно-техническое управление заказало для нужд авиации и воздухоплавания 70 ранцевых парашютов системы Г. Е. Котельникова»
      stranica: Л. Минов, «Военно-исторический журнал», № 8, 1976
      href: https://10otb.ru/content/history/army_history/parashuts_rus_army.html
      pometka: документ
      utverzhdeno: ждёт «да» Сергея
    - summary: <b>Деревня, где впервые испытали РК-1, с 1949 года носит имя Котельникова.</b>
      det:
        - В июне 1912 года у деревни Сализи под Гатчиной парашют испытали с аэростата. В 1949 году деревню переименовали в Котельниково, а в 1972 году у въезда открыли памятный знак.
      src: 'Источник: RATNIK.TV, «Парашют РК-1 Глеба Котельникова» — <a href="https://ratnik.tv/articles/science/parashyut-rk-1-gleba-kotelnikova/" rel="noopener" target="_blank">ratnik.tv</a>; сайт «Российская авиация», «Парашют Котельникова» — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/sredstva-spaseniya-letnogo-sostava/parashyut-kotelnikova/" rel="noopener" target="_blank">xn--80aafy5bs.xn--p1ai</a>'
      otryvok: «В сентябре 1949 деревня Сализи, где впервые испытывался парашют Котельникова, была переименована в Котельниково.»
      stranica: RATNIK.TV, «Парашют РК-1 Глеба Котельникова»
      href: https://ratnik.tv/articles/science/parashyut-rk-1-gleba-kotelnikova/
      pometka: два источника
      utverzhdeno: ждёт «да» Сергея
    - summary: <b>Парашютисты до сих пор просят удачи у могилы Котельникова.</b>
      det:
        - Изобретатель похоронен на Новодевичьем кладбище в Москве. Парашютисты привязывают к веткам дерева над могилой ленточку для затяжки ранца — есть примета, что тогда прыжок будет удачным.
      src: 'Источник: «Совершенно секретно», «Парашют Котельникова, модель первая» — <a href="https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/" rel="noopener" target="_blank">www.sovsekretno.ru</a>'
      otryvok: «Считается, что если привязать к ветвям дерева над могилой Глеба Евгеньевича Котельникова ленточку для затяжки парашютного ранца, парашютисту будет сопутствовать удача.»
      stranica: «Совершенно секретно», «Парашют Котельникова, модель первая»
      href: https://www.sovsekretno.ru/articles/istoriya/parashyut-kotelnikova-model-pervaya/
      pometka: документ
      utverzhdeno: ждёт «да» Сергея
