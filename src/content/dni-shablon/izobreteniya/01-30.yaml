    src: "Источник: «Совершенно секретно», «Парашют Котельникова, модель первая» — www.sovsekretno.ru; RATNIK.TV, «Парашют РК-1 Глеба Котельникова» — ratnik.tv"
  - summary: Котельников сделал парашют, который опускал с неба 300 кг груза.
    det:
    - В 1924 году появился грузовой РК-4 с куполом 12 метров в поперечнике. На нём с самолёта сбрасывали груз весом с четырёх взрослых.
    src: "Источник: RATNIK.TV, «Парашют РК-1 Глеба Котельникова» — ratnik.tv; сайт «Российская авиация», «Парашют Котельникова» — xn--80aafy5bs.xn--p1ai"
  - summary: Котельников придумал, как спасти всех пассажиров самолёта сразу.
    det:
