igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Три лодки Григоровича
  pravilo_ru: 'Что сделать сейчас: выбери подвиг и нажми на лодку, которая его совершила.'
  kak_igrat:
    zachem: Из М-5 выросли новые машины Григоровича — у каждой свой первый в мире подвиг.
    shagi:
    - Выбери подвиг — кнопка загорится золотом.
    - Нажми на лодку. Верный выбор загорится зелёным.
    - Расставь все три — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все три подвига на месте — +20 баллов.
  dannye:
    mesta:
    - kod: m5
      nazvanie: М-5
      verno_ru: В 1916 году лодки М-5 нанесли с кораблей первый в мире авиаудар по вражескому порту.
    - kod: m9
      nazvanie: М-9
      verno_ru: На М-9, наследнице М-5, Нагурский первым в мире сделал мёртвую петлю на лодке.
    - kod: m11
      nazvanie: М-11
      verno_ru: Из М-5 выросла М-11 — первый в мире морской истребитель с бронёй для лётчика.
    podpisi:
    - kod: udar
      tekst: Удар с кораблей по вражескому порту
      mesto: m5
      mimo_ru: Удар по порту нанесла самая первая лодка — ищи старшую.
    - kod: petlya
      tekst: Мёртвая петля Нагурского
      mesto: m9
      mimo_ru: Петлю сделали на наследнице М-5 — ищи следующую по номеру.
    - kod: bronya
      tekst: Броня для лётчика
      mesto: m11
      mimo_ru: Броню получил морской истребитель — ищи самый большой номер.
    vyberi_ru: Сначала выбери подвиг, потом лодку.
    mimo_ru: Не та лодка — попробуй другую.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: '🏆 Все три подвига на месте: М-5 ударила по порту, на М-9 сделали петлю, М-11 получила броню.'
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: удар по порту — М-5, мёртвая петля — М-9, броня для лётчика — М-11.'
