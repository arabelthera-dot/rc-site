  - - Чёрное море
    - лодки М-5 с кораблей ударили по вражескому порту
    - '1916'
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Для викторины нужен JavaScript. Ответы: творогом; 7 тысяч тонн; 1916; под Троицким мостом; до 15 тысяч.'
  ball: 8
  voprosy:
  - q: Чем склеивали корпус М-5?
    o:
    - смолой
    - творогом в нашатыре
    - рыбьим клеем
    a: 1
    e: Корпус М-5 склеивали творогом, разведённым в нашатыре, и клей держал морскую воду.
  - q: Какой пароход пустила на дно бомба в 23 кило?
    o:
    - в 700 тонн
    - в 7 тысяч тонн
    - в 70 тысяч тонн
    a: 1
    e: Бомба в 23 кило с русской летающей лодки пустила на дно пароход в 7 тысяч тонн.
  - q: В каком году лодки М-5 с кораблей ударили по вражескому порту?
    o:
    - '1912'
    - '1916'
    - '1920'
    a: 1
    e: В 1916 году лодки М-5 нанесли с кораблей первый в мире авиаудар по вражескому порту.
  - q: Где Фриде провёл М-5 на испытаниях?
    o:
    - под Троицким мостом
    - над Кремлём
    - вдоль Невского
    a: 0
    e: Лётчик Фриде на испытаниях провёл М-5 под Троицким мостом в Петрограде.
  - q: Сколько шурупов вкручивали в корпус одной М-5?
    o:
    - до 150
    - до 1500
    - до 15 тысяч
    a: 2
    e: В корпус одной М-5 рабочие вручную вкручивали до 15 тысяч шурупов.
