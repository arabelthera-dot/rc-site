audioguide:
  audioSrc: audio-guide-zelinskij-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу Зелинского: от спиртового угля через газовую камеру к противогазу без патента.'
  stops:
  - t: 0
    mark: '0:00'
    title: Уголь от спирта
  - t: 12
    mark: '0:12'
    title: 66 минут в камере
  - t: 26
    mark: '0:26'
    title: Уголь у немцев
  - t: 38
    mark: '0:38'
    title: Ни копейки
  transcript:
  - 'Противогаз родился на спиртовом деле: уголь, которым чистили спирт, остановил хлор. В газовой атаке выживали те, кто дышал через землю и шинель, — так солдаты подсказали фильтр.'
  - Английский шлем держал газ 25 секунд, первый в мире угольный противогаз Зелинского — 66 минут, и на фронте оставили только его. 5 октября 1916-го с фронта велели убрать все маски, кроме противогаза Зелинского.
  - В 1916-м в немецком противогазе вдруг появился уголь — немцы делали его по русским трофеям. Англичане искали в русском угле тайную пропитку — а нашли чистый берёзовый уголь.
  - Куммант брал 50 копеек с каждой маски, Зелинский за противогаз не взял ни копейки. Русские химики тайком переправили противогаз и рецепт угля в Англию — даром, без патента.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
