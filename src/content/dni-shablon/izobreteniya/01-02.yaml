  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "Граница первенства: «Луна-1» — первая в мире межпланетная станция. 2 января 1959 года она первой в мире разогналась до второй космической скорости — 11,2 км/с — и навсегда ушла из притяжения Земли. Пройдя мимо Луны, она стала первым в мире искусственным спутником Солнца, «Мечтой», а по дороге первой в мире измерила солнечный ветер. Документ: Сообщение ТАСС о запуске космической ракеты в сторону Луны, 2 января 1959 года (текст — справочник «Ракетные войска стратегического назначения»). На обложке дня — макет станции «Луна-1» в натуральную величину из Мемориального музея космонавтики."
  net: "Чего здесь нет: в Луну «Луна-1» не попала — прошла мимо примерно в шести тысячах километров. Её первенство — не в попадании, а во второй космической скорости и уходе на орбиту вокруг Солнца. Луны достигла «Луна-2» в сентябре 1959 года — первая в мире жёсткая посадка на другое небесное тело."
