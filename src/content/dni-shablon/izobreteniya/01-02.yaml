  kicker: Проверь себя
  h2: Викторина
  intro: ​
  noscript: |-
    <p style="color:var(--muted);max-width:64ch">Викторина и игра с траекторией работают на JavaScript — сейчас он отключён.
          Ответы на вопросы дня есть в тексте выше: «Луна-1» стартовала 2 января 1959 года, прошла мимо Луны примерно
          в 6000 км и первой в истории вышла на гелиоцентрическую орбиту, развив вторую космическую скорость.</p>
  ball: 10
  voprosy:
    - q: Чем стала «Луна-1» после того, как прошла мимо Луны?
      o:
        - Упала на Землю
        - Вышла на орбиту Луны
        - Стала первым искусственным спутником Солнца
        - Была уничтожена в атмосфере
      a: 2
      e: «Луна-1» набрала вторую космическую скорость и вырвалась из притяжения Земли. Пройдя мимо Луны, она вышла на гелиоцентрическую орбиту и стала первым в истории искусственным спутником Солнца.
    - q: Что «Луна-1» открыла впервые в истории по пути к Луне?
      o:
        - Кратеры на обратной стороне Луны
        - Солнечный ветер — поток заряженных частиц от Солнца
        - Радиационные пояса Земли
        - Воду на Луне
      a: 1
      e: Магнитометры «Луны-1» не нашли магнитного поля Луны, зато впервые в истории измерили солнечный ветер — непрерывный поток заряженных частиц от Солнца. До этого его существование было лишь теорией.
