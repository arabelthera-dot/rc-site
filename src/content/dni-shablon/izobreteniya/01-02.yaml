  - posle: quiz
    html: |-
      <section class="block" id="excursion">
        <div class="wrap">
          <div class="kicker">Аудиогид</div>
          <h2>Фрагмент экскурсии</h2>
          <div class="card" style="border-left:3px solid var(--gold);border-radius:0 16px 16px 0">
      <p>«Вот карта — посмотрите на траекторию: Земля слева, Луна справа, и тонкая дуга проходит мимо неё — уходит дальше, в пространство между планетами. Это путь "Луны-1".</p>
      <p>2 января 1959 года она стартовала с Байконура и сделала то, чего не делал ни один рукотворный объект: разогналась до второй космической скорости и вырвалась из притяжения Земли навсегда.</p>
      <p>Цель была — Луна. Не долетела: прошла мимо на шесть тысяч километров. Но по дороге успела кое-что важное: измерила то, что до неё никто не измерял. Вот этот прибор — магнитометр — искал магнитное поле Луны и не нашёл его. Зато нашёл солнечный ветер. Поток заряженных частиц от Солнца, который физики-теоретики предсказывали, но никто ещё не щупал руками.</p>
      <p>А "Луна-1" прощупала. И улетела дальше — на орбиту вокруг Солнца. Где и летит до сих пор. Первый искусственный спутник Солнца, имя ему — "Мечта". Переходим дальше».</p>
          </div>
        </div>
      </section>

      >
