story:
  kicker: История изобретения
  h2: первая в мире межпланетная станция «Луна-1»
  abzacy:
    - |-
      <div class="article collapsed" id="article">
            <div class="body" id="articleBody">


      <p><b>2 января 1959 года, 19:41 по московскому времени.</b> С Байконура стартует ракета. На борту — металлический шар массой 361 килограмм, набитый приборами и маленьким вымпелом с советским гербом. Цель — Луна. Впервые в истории человечества рукотворный объект должен достичь другого небесного тела.</p>

      <p>Он не достиг. Прошёл мимо — на расстоянии примерно шести тысяч километров.</p>

      <p><b>Что это была за машина.</b> «Луна-1» — первый в мире космический аппарат, отправленный к другому небесному телу — Луне. До неё всё, что запускали в космос, оставалось на орбите Земли или падало обратно. «Луна-1» впервые разогналась до второй космической скорости — 11,2 км/с — и вырвалась из земного притяжения навсегда. Это само по себе было мировым рекордом, даже без попадания в Луну.</p>

      <p><b>Что нашли по дороге.</b> Учёные ожидали обнаружить у Луны магнитное поле — как у Земли. Магнитометр «Луны-1» не нашёл ничего. Зато нашли кое-что неожиданное: непрерывный поток заряженных частиц, летящих от Солнца. Это и был солнечный ветер — явление, о существовании которого физики спорили. «Луна-1» измерила его впервые и поставила точку в споре.</p>

      <p><b>Промах или план?</b> До сих пор нет точного ответа: была ли траектория рассчитана на попадание, или запас топлива для коррекции намеренно не предусматривался. Часть историков считает, что «Луна-1» изначально могла лишь облететь Луну — технически попасть в неё тогда было почти невозможно. Так или иначе, она прошла мимо.</p>

      <p><b>Что стало с «Луной-1».</b> Пролетев мимо, аппарат вышел на орбиту вокруг Солнца — и стал первым в истории искусственным спутником Солнца. Именно так его и назвали: «Мечта» — неофициальное имя, которое дали станции в советских газетах. Формальное обозначение — «Луна-1», но за ней закрепилось и это романтическое прозвище. Сегодня она продолжает летать вокруг Солнца где-то между орбитами Земли и Марса.</p>

      <p><b>США не успели.</b> Американцы запустили Pioneer 4 в марте того же 1959 года — тоже прошёл мимо Луны. На два месяца позже. А в сентябре 1959-го СССР отправил «Луну-2», которая всё-таки упала на Луну — первая в мире жёсткая посадка на другое небесное тело.</p>

      <p><b>Человек.</b> Сергей Павлович Королёв (12 января 1907 — 14 января 1966) — главный конструктор, чьё имя при жизни было государственной тайной. «Луна-1», как и всё советское космическое, делалась в его ОКБ-1. Подробнее о Королёве — в дне 4 октября: первый спутник Земли.</p>





      <hr>
            </div>
