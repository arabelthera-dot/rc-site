fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о «Луне-1» и её создателях
    h2: Промах на несколько секунд
    udary:
      - summary: <b>Рукотворная комета.</b> «Луна-1» выпустила в пути килограмм натрия — и с Земли увидели новую оранжевую «звезду» за 119 500 километров.
        det:
          - На второй день полёта, 3 января 1959 года в 3:56:20 по московскому времени, станция была в 119 500 км от Земли. В этот момент она выбросила облако паров натрия, примерно 1 кг. Облако расплывалось в пустоте и несколько минут светилось оранжевым.
          - "С Земли его видели как слабую звезду 6-й величины. Так люди впервые сами увидели, где летит их аппарат: в небе появилась искусственная комета."
        src: "Источник: Н. Ячменникова, «56 лет назад СССР запустил первую в мире межпланетную станцию „Луна-1“», «Российская газета», 02.01.2015 — https://rg.ru/2015/01/02/luna-site-anons.html"
        otryvok: «3 января в 3:56:20 по московскому времени, на расстоянии в 119500 км от Земли из станции было выпущено облако паров натрия. Примерно 1 кг. Рассеиваясь в вакууме, облако светилось оранжевым светом в течение нескольких минут и наблюдалось с Земли как слабая звезда 6-й величины.»
        stranica: Н. Ячменникова, «56 лет назад СССР запустил первую в мире межпланетную станцию „Луна-1“», «Российская газета», 02.01.2015
        href: https://rg.ru/2015/01/02/luna-site-anons.html
        pometka: документ
      - summary: <b>Опоздал — и выжил.</b> Королёв опоздал с Колымы на последний пароход, а «Индигирка» в шторм затонула вместе с запертыми в трюмах заключёнными.
        det:
          - В 1939 году осуждённого по ложному обвинению Королёва привезли на золотой прииск Мальдяк. Из пятисот заключённых этого лагеря до весны дожили не больше ста. Осенью его вызвали в Москву.
          - Документы оформляли долго, и он опоздал на последний пароход во Владивосток. 12 декабря пароход «Индигирка» попал в шторм и затонул у японского острова Хоккайдо. Спасли только пассажиров, заключённые в трюмах погибли.
          - Сам Королёв потом считал это знаком судьбы. До Владивостока он добрался только под Новый год. К тому времени он потерял четырнадцать зубов и почти не мог ходить из-за цинги.
        src: "Источник: «Как главный космический конструктор Сергей Королев выжил в концлагерях», «Российская газета — Неделя», № 68(6936), 31.03.2016 — https://rg.ru/2016/03/31/kak-glavnyj-kosmicheskij-konstruktor-sergej-korolev-vyzhil-v-konclageriah.html"
        otryvok: «Задержка с оформлением документов привела к тому, что опоздал на последний пароход во Владивосток. Позже воспринимал это как знак судьбы. Пароход "Индигирка" во время шторма 12 декабря затонул у берегов японского острова Хоккайдо. Спасены были только пассажиры; заключенные, запертые в трюмах, погибли.»
        stranica: В. Марков, «Как главный космический конструктор Сергей Королев выжил в концлагерях», «Российская газета», 31.03.2016
        href: https://rg.ru/2016/03/31/kak-glavnyj-kosmicheskij-konstruktor-sergej-korolev-vyzhil-v-konclageriah.html
        pometka: документ
      - summary: <b>Петля без мотора.</b> Королёв построил планёр, на котором лётчик впервые в истории трижды сделал мёртвую петлю без мотора.
        det:
          - До ракет Королёв строил планёры и летал на них сам. В 1929 году он на своём «Коктебеле» с размахом крыльев 17 м продержался в воздухе 4 часа 19 минут. В 1930 году он привёз в Коктебель новый планёр СК-3 «Красная звезда», сделанный для фигур высшего пилотажа, и сам провёл первые испытания.
          - 28 октября 1930 года пилот Василий Степанчёнок крутил на нём «петлю Нестерова». Это была первая в истории мёртвая петля на аппарате без мотора, и он сделал её три раза.
        src: "Источник: «Королёв Сергей Павлович», энциклопедия Российского исторического общества — https://history.ru/encyclopedia/korolev-sergey-pavlovich; дата полёта — «МВТУ — Коктебель. Биография С. П. Королёва», РГАНТД — https://rgantd.ru/korolev/biography/mvtu-koktebel/"
        otryvok: «В 1930 году Королёв привёз в Коктебель новый планер, СК-3 «Красная звезда». На нём лётчик В. А. Степанчёнок впервые в истории воздухоплавания трижды совершил мёртвую петлю («петля Нестерова») на безмоторном летательном аппарате.»
        stranica: «Королёв Сергей Павлович», Российская историческая энциклопедия, history.ru
        href: https://history.ru/encyclopedia/korolev-sergey-pavlovich
        pometka: документ
      - summary: <b>Самолёты перестали разваливаться.</b> Келдыш вычислил, как спасти самолёт от смертельной тряски, а в Германии от неё разбились почти 150 машин.
        det:
          - В 1930-е годы самолёты стали быстрее, и на большой скорости крыло вдруг начинало трястись. Тряска нарастала за секунды, и машина разваливалась в воздухе. Лётчики называли это флаттером.
          - С флаттером столкнулись все страны, где строили самолёты. Только в Германии с 1930 по 1943 год из-за него разбились почти 150 самолётов, и это лишь официальный подсчёт. Математик Мстислав Келдыш с коллегами рассчитал, как сделать крыло, которое не трясётся.
          - "В войну он сам ездил по заводам и следил, чтобы так и строили, и советские самолёты перестали гибнуть от тряски. Потом он справился и с «шимми»: из-за него при посадке «гуляла» и ломалась передняя стойка шасси. Позже тот же Келдыш стал «главным теоретиком» космонавтики, и его отдел считал полёты к Луне."
        src: "Источник: А. Бурмистров, «Математика, авиация, космос, атом: 110 лет со дня рождения Мстислава Келдыша», «Научная Россия», 10.02.2021 — https://scientificrussia.ru/articles/matematika-aviatsiya-kosmos-atom-110-let-so-dnya-rozhdeniya-mstislava-keldysha; «Мстислав Всеволодович Келдыш», ИКИ РАН — https://iki.cosmos.ru/popular/mstislav-vsevolodovich-keldysh"
        otryvok: "«В конце 30-х прошлого века ученые разных стран наперегонки пытались решить проблему критической скорости: например, в Германии с 1930 до 1943 годов из-за флаттера разбились почти 150 самолетов – это только официальные подсчеты. А в Советском Союзе уже через год после начала Великой Отечественной математику Мстиславу Всеволодовичу Келдышу вручают Сталинскую премию за решение проблемы.»"
        stranica: "А. Бурмистров, «Математика, авиация, космос, атом: 110 лет со дня рождения Мстислава Келдыша», «Научная Россия», 10.02.2021"
        href: https://scientificrussia.ru/articles/matematika-aviatsiya-kosmos-atom-110-let-so-dnya-rozhdeniya-mstislava-keldysha
        pometka: документ
      - summary: <b>Письмо Циолковскому.</b> Пятнадцатилетний Глушко написал Циолковскому и получил ответ, а его двигатели больше 60 лет поднимают «Союзы».
        det:
          - "В 1923 году одесскому школьнику Валентину Глушко ответил на письмо сам Циолковский, и началась переписка. В 1924 году юноша написал ему: межпланетные сообщения — это «моим идеалом и целью моей жизни». С 1929 года в ленинградской Газодинамической лаборатории Глушко строил ракетные двигатели. Позже, уже в Химках, его бюро сделало двигатели РД-107 и РД-108 для королёвской «семёрки»."
          - Эта ракета вывела первый спутник, «Восток» Гагарина и станции к Луне. Двигатели РД-107/108 больше 60 лет поднимают российские «Союзы», их и сейчас делают серийно в Самаре.
        src: "Источник: «Укротитель огня Валентин Глушко», Госкорпорация «Ростех», 04.09.2023 — http://rostec.ru/media/news/ukrotitel-ognya-valentin-glushko/; слова письма 1924 года — И. А. Арбузов и др., «Творческий путь академика В. П. Глушко. К 110-й годовщине со дня рождения», Чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики, 2018 — https://readings.gmik.ru/lecture/2018-TVORCHESKIY-PUT-AKADEMIKA-VP-GLUSHKO-K-110-Y-GODOVSCHINE-SO-DNYA-ROZHDENIYA"
        otryvok: «В 1923 году пятнадцатилетнему Валентину повезло − на его письмо отвечает основоположник космонавтики Константин Циолковский, завязывается переписка.»
        stranica: «Укротитель огня Валентин Глушко», Госкорпорация Ростех, 04.09.2023
        href: http://rostec.ru/media/news/ukrotitel-ognya-valentin-glushko/
        pometka: документ
      - summary: <b>Команда с Земли «выключить двигатель» опоздала на несколько секунд — и «Луна-1» промахнулась.</b>
        det:
          - Ракету к Луне вела не только автоматика на борту. Точную команду выключить двигатель подавала наземная станция радиоуправления.
          - При запуске «Луны-1» эта команда пришла на несколько секунд позже, чем нужно. Ракета успела набрать лишнюю скорость и ушла мимо цели.
          - "Позже учёные предположили, в чём ошибка: в расчёте забыли учесть время, за которое радиосигнал долетает от командного пункта до ракеты. Никаких поломок на самой станции не нашли."
        src: 'Источник: В. В. Ивашкин, «Лунные траектории космических аппаратов: пионерские работы в Институте прикладной математики и их развитие», ИПМ им. М. В. Келдыша РАН — <a href="https://keldysh.ru/memory/okhotsimsky/ivashkin.pdf" rel="noopener">keldysh.ru/memory/okhotsimsky/ivashkin.pdf</a>; Н. Ячменникова, «Как „Луна-1“ стала спутником Солнца: 65 лет назад была запущена первая в мире лунная станция», «Российская газета», 02.01.2024 — <a href="https://rg.ru/2024/01/02/kak-luna-1-stala-sputnikom-solnca-65-let-nazad-byla-zapushchena-pervaia-v-mire-lunnaia-stanciia.html" rel="noopener">rg.ru/2024/01/02/kak-luna-1-stala-sputnikom-solnca-65-let-nazad-byla-zapushchena-pervaia-v-mire-lunnaia-stanciia.html</a>.'
        otryvok: «При выведении КА Луна-1 это “радиовыключение” было сделано с запозданием на несколько секунд, скорость ракеты была превышена, это привело к отклонению от Луны»
        stranica: "В. В. Ивашкин, «Лунные траектории космических аппаратов: пионерские работы в Институте прикладной математики и их развитие», ИПМ им. М. В. Келдыша РАН"
        href: https://keldysh.ru/memory/okhotsimsky/ivashkin.pdf
        pometka: два источника
      - summary: <b>Сначала на Луне хотели устроить взрыв, чтобы его увидели с Земли. Думали даже о ядерном заряде.</b>
        det:
          - "В январе 1958 года Мстислав Келдыш отправил Королёву секретное письмо о полёте к Луне. Первый вариант был такой: ракета попадает в Луну, и там происходит взрыв, который можно наблюдать с Земли."
          - В бюро Королёва даже придумали аппарат Е-4, который должен был доставить на Луну боеприпас. Рассматривали и ядерный заряд, а облако от взрыва собирались сфотографировать в земной телескоп.
          - «Луна-1» в итоге везла не заряд, а вымпел с гербом страны.
        src: 'Источник: И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024 — <a href="https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata" rel="noopener">prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata</a>; С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019 — <a href="https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON" rel="noopener">readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON</a>.'
        otryvok: «Е-4 – аппарат, который должен доставить на Луну боеприпас для взрыва. Рассматривался даже ядерный заряд. Предполагалось зафиксировать факт удара аппарата о Луну, сфотографировав земным телескопом облако от взрыва.»
        stranica: "И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024"
        href: https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata
        pometka: два источника
      - summary: <b>Перед «Луной-1» три лунные ракеты подряд разрушились в полёте — на 87-й, 104-й и 245-й секунде.</b>
        det:
          - Первую ракету к Луне запустили 23 сентября 1958 года. Она разрушилась на 87-й секунде полёта. 11 октября вторая погибла на 104-й секунде, 4 декабря третья — на 245-й.
          - После каждой аварии конструкторы искали причину и исправляли её. Только четвёртая ракета, стартовавшая 2 января 1959 года, не подвела и унесла «Луну-1» в космос.
        src: 'Источник: И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024 — <a href="https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata" rel="noopener">prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata</a>; С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019 — <a href="https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON" rel="noopener">readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON</a>.'
        otryvok: «Старт ракеты 8К72 с контейнером Е-1 №1 состоялся 23 сентября 1958 года, но оказался неудачным из-за аварии носителя на 87-й секунде полета. Та же участь постигла и два следующих пуска 11 октября на 104-й секунде и и 4 декабря на 245-й секунде.»
        stranica: "И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024"
        href: https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata
        pometka: два источника
      - summary: <b>Аккумуляторы «Луны-1» рассчитали на 40 часов, а они продержались 62 — и связь шла на 500 000 км.</b>
        det:
          - Чтобы слышать станцию так далеко, на горе Кошка у Симеиза в Крыму поставили новый пункт связи с поворотной антенной площадью около 100–120 квадратных метров. Его радиосистему сделали в НИИ-885 под руководством Е. Я. Богуславского. Это была первая в мире измерительная станция для дальних космических аппаратов.
          - "Связь с «Луной-1» держалась до расстояния 500 тысяч километров — это был рекорд. Она прервалась, только когда сели аккумуляторы станции: они проработали 62 часа вместо расчётных 40."
        src: 'Источник: И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024 — <a href="https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata" rel="noopener">prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata</a>; В. В. Ивашкин, «Лунные траектории космических аппаратов: пионерские работы в Институте прикладной математики и их развитие», ИПМ им. М. В. Келдыша РАН — <a href="https://keldysh.ru/memory/okhotsimsky/ivashkin.pdf" rel="noopener">keldysh.ru/memory/okhotsimsky/ivashkin.pdf</a>.'
        otryvok: «Связь с «Луной-1» поддерживалась до 500 000 км, что тоже было рекордным, пока не разрядились аккумуляторы, проработавшие 62 часа, вместо расчетных 40 часов.»
        stranica: "И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024"
        href: https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata
        pometka: два источника
      - summary: <b>Опоздай ракета со стартом на 10 секунд — и она промахнулась бы мимо Луны на 200 километров.</b>
        det:
          - Ракета летела к Луне напрямую, без остановки на орбите вокруг Земли. Поправить курс в пути станция не могла, поэтому всё решали первые минуты разгона.
          - "Баллистики подсчитали: ошибка в скорости всего на 1 метр в секунду уводит ракету от цели на 250 км. Сдвиг старта на 10 секунд — ещё на 200 км. Такие расчёты вели группы Д. Е. Охоцимского, С. С. Лаврова и П. Е. Эльясберга на первых электронных вычислительных машинах."
        src: 'Источник: С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019 — <a href="https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON" rel="noopener">readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON</a>; И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024 — <a href="https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata" rel="noopener">prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata</a>.'
        otryvok: «Отклонение времени старта с Земли от расчетного на 10 секунд или вектора скорости от расчетного направления на 1 угловую минуту привело бы к промаху на 200 км!»
        stranica: С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019
        href: https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Вымпел, солнечный ветер и 30 часов на БЭСМ
    udary:
      - summary: <b>Вымпел «Луны-1» был шаром из стальных пятиугольников со взрывчаткой внутри — чтобы рассыпаться.</b>
        det:
          - "Внутри «Луны-1» лежал шар, собранный из стальных пятиугольных пластинок. В его середине был заряд взрывчатки: при ударе о Луну он должен был разбросать пластинки во все стороны."
          - Рядом лежала капсула с жидкостью, а в ней — алюминиевые полоски. На пластинках и полосках были герб, надпись «СССР» и дата запуска. «Луна-1» прошла мимо, и доставить вымпелы на Луну в тот раз не удалось.
        src: 'Источник: С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019 — <a href="https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON" rel="noopener">readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON</a>; «Автоматические межпланетные станции. Путь к Луне проложен! (к 60-летию запуска межпланетной автоматической станции „Луна-1“)», Российский государственный архив научно-технической документации (РГАНТД) — <a href="https://rgantd.ru/arh-docs/cosmos/put-k-lune-prolozhen-k-60-letiyu-zapuska-mezhplanetnoy-avtomaticheskoy-stantsii-luna-1-/" rel="noopener">rgantd.ru/arh-docs/cosmos/put-k-lune-prolozhen-k-60-letiyu-zapuska-mezhplanetnoy-avtomaticheskoy-stantsii-luna-1-</a>.'
        otryvok: «Внутри «Луны-1» находились сферический вымпел из стальных пятиугольных элементов с зарядом взрывчатого вещества внутри шара для их разброса и капсула, заполненная жидкостью, в которой размещались алюминиевые полоски.»
        stranica: С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019
        href: https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON
        pometka: два источника
      - summary: <b>Грингауз сделал передатчик первого спутника, а его прибор первым в мире измерил солнечный ветер.</b>
        det:
          - Радиоинженер Константин Грингауз разработал передатчик для первого искусственного спутника Земли. Для лунных станций 1959 года он сделал ловушки заряженных частиц — приборы, которые ловят крошечные частицы, летящие в космосе.
          - Его прибор первым в мире напрямую измерил потоки частиц в межпланетном пространстве. Так был открыт солнечный ветер — поток частиц от Солнца.
          - Грингауз и потом не боялся спорить с начальством. В 1964 году на защите проекта нового научного спутника он прямо заявил, что это «вчерашний день космонавтики». Проект всё равно приняли.
        src: 'Источник: «Хроники ИКИ 1965–2015. 50 лет Института космических исследований», ИКИ РАН, 2015 — <a href="http://www.iki.rssi.ru/books/2015iki_history.pdf" rel="noopener">www.iki.rssi.ru/books/2015iki_history.pdf</a>; С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019 — <a href="https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON" rel="noopener">readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON</a>.'
        otryvok: «впервые в мире прибором К. И. Грингауза выполнены прямые измерения потоков межпланетной плазмы»
        stranica: «Хроники ИКИ 1965–2015. 50 лет Института космических исследований», ИКИ РАН, 2015
        href: http://www.iki.rssi.ru/books/2015iki_history.pdf
        pometka: два источника
      - summary: <b>На ракету к Луне правительство дало всего семь месяцев — и первый пуск сделали даже раньше срока.</b>
        det:
          - "3 марта 1958 года бюро Королёва попросило у правительства поддержать полёты к Луне. Уже 20 марта вышло постановление: первый пуск к Луне — в октябре 1958 года, то есть всего через семь месяцев."
          - За это время нужно было сделать новую третью ступень ракеты, саму станцию и наземные пункты связи. Работы на полигоне шли днём и ночью. Первую ракету к Луне запустили уже 23 сентября 1958 года.
        src: 'Источник: И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024 — <a href="https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata" rel="noopener">prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata</a>.'
        otryvok: «А уже 20 марта того же года вышло соответствующее постановление ЦК КПСС и Совета Министров СССР №343-166 в котором не только ставилась задача достижения 2-й космической скорости, но и устанавливался срок первого пуска к Луне – октябрь 1958 года, то есть, всего через семь месяцев!»
        stranica: "И. Маринин, «„Луна наша“: 65 лет первому в истории полёту на Луну», «ПРО Космос» (медиа Роскосмоса), 13.09.2024"
        href: https://prokosmos.ru/2024/09/13/luna-nasha-65-let-pervomu-v-istorii-priluneniyu-kosmicheskogo-apparata
        pometka: документ
      - summary: <b>Вычислительных машин было так мало, что Келдыш письмом просил хотя бы 30 часов работы на БЭСМ.</b>
        det:
          - Путь к Луне считали на первых электронных машинах «Урал», «Стрела», БЭСМ и М-20. Машина учитывала, как ракету тянут к себе Земля, Луна и Солнце.
          - Таких машин в стране было мало, и время на них было в дефиците. Сам академик Мстислав Келдыш писал письмо с просьбой выделить не меньше 30 часов на БЭСМ для расчётов по спутникам. Полёты первых «лунников» рассчитывали в его институте под руководством Келдыша и Охоцимского.
        src: 'Источник: В. В. Ивашкин, «Лунные траектории космических аппаратов: пионерские работы в Институте прикладной математики и их развитие», ИПМ им. М. В. Келдыша РАН — <a href="https://keldysh.ru/memory/okhotsimsky/ivashkin.pdf" rel="noopener">keldysh.ru/memory/okhotsimsky/ivashkin.pdf</a>.'
        otryvok: «Таких машин в то время было мало, и время работы на них было весьма «дефицитным». Об этом свидетельствуют, в частности, письмо М.В. Келдыша [34] с просьбой о выделении не менее 30 часов времени на БЭСМ для расчетов по ИСЗ»
        stranica: "В. В. Ивашкин, «Лунные траектории космических аппаратов: пионерские работы в Институте прикладной математики и их развитие», ИПМ им. М. В. Келдыша РАН"
        href: https://keldysh.ru/memory/okhotsimsky/ivashkin.pdf
        pometka: документ
      - summary: <b>Если бы гироскопы последней ступени упёрлись в «упор», ракета к Луне потеряла бы управление.</b>
        det:
          - Последняя, третья ступень разгоняла «Луну-1» к Луне. Её систему управления разработали в ОКБ-885 под руководством Н. А. Пилюгина. А её двигатель впервые запускали прямо в космосе, в пустоте.
          - "Самым трудным был момент, когда ступень отделялась от ракеты: управление нужно было «перехватить» мгновенно. Если гироскопы, которые держат направление, отклонятся слишком сильно и упрутся в «упор», ракета станет неуправляемой."
          - Потом ступень почти 6 минут разгонялась и должна была выключиться точно при нужной скорости.
        src: 'Источник: С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019 — <a href="https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON" rel="noopener">readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON</a>.'
        otryvok: «Самой трудной была задача «перехвата» управления после отделения от центрального блока. Нельзя было допустить больших отклонений гироскопов. Если они сядут на «упор», управление будет потеряно.»
        stranica: С. А. Герасютин, «Первые полёты к Луне автоматических станций», Научные чтения памяти К. Э. Циолковского, Государственный музей истории космонавтики им. К. Э. Циолковского, 2019
        href: https://readings.gmik.ru/lecture/2019-PERVIE-POLETI-K-LUNE-AVTOMATICHESKIH-STANTSIY-THE-FIRST-SPACE-PROBES-LAUNCHED-TO-THE-MOON
        pometka: документ
