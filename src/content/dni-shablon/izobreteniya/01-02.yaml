    html: |-
      <section class="block" id="fork" style="background:rgba(45,140,191,.04)">
        <div class="wrap">
          <div class="kicker">Твой выбор</div>
          <h2>А как поступил бы ты?</h2>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">Ночь после старта, 2 января 1959 года. Станция ушла с Байконура и впервые в истории набрала вторую космическую скорость — но телеметрия говорит: в Луну она не попадёт, пройдёт мимо примерно в шести тысячах километров. Ты — Королёв, чьё имя засекречено, и до утренних газет считаные часы. Что объявить стране?</p>
          <div class="fork-opt"><b>Молчать до следующего пуска</b><br><span style="font-size:13px;color:var(--muted)">Мимо — значит провал. Сообщить, когда следующая станция всё-таки достанет Луну.</span></div>
          <div class="fork-opt"><b>Сказать о промахе прямо</b><br><span style="font-size:13px;color:var(--muted)">Целились в Луну, не попали. Честно назвать неудачу и работать дальше.</span></div>
          <div class="fork-opt"><b>Считать рекордом то, что уже сделано</b><br><span style="font-size:13px;color:var(--muted)">Вторая космическая, солнечный ветер, первый рукотворный спутник Солнца — этого нет ни у кого в мире.</span></div>
          <div id="forkReal" style="display:none;margin-top:14px;padding:14px 16px;border-left:3px solid var(--gold);border-radius:10px;background:var(--gold-g);font-size:14.5px;line-height:1.65">
            <b>Как было на самом деле.</b> Главным сделали не попадание, а рекорды: первый в мире разгон до второй космической скорости — 11,2 км/с, первое измерение солнечного ветра, первая искусственная планета. Станции дали имя «Мечта». Спор, была ли траектория вообще рассчитана на попадание или запас топлива для коррекции не предусматривался, историки ведут до сих пор. Через восемь месяцев «Луна-2» всё-таки достигла Луны, а американский Pioneer 4 в марте 1959-го тоже прошёл мимо — на два месяца позже нас.
          </div>
        </div>
      </section>
