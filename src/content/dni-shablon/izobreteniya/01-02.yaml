return:
  q: Чем стала «Луна-1» после того, как прошла мимо Луны?
  a: Стала первым искусственным спутником Солнца
audioguide:
  audioSrc: audio-guide-luna1-ru-2.mp3
  durationLabel: 5 минут 21 секунда
  lead: "Голос ведёт по залу «Луны-1»: от стартового стола Байконура до орбиты вокруг Солнца, где станция летит до сих пор. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Девятнадцать сорок одна
    - t: 37
      mark: 0:37
      title: Шар весом в триста шестьдесят один килограмм
    - t: 83
      mark: 1:23
      title: Одиннадцать и две десятых
    - t: 128
      mark: 2:08
      title: Промах в шесть тысяч километров
    - t: 170
      mark: 2:50
      title: Ветер, которого не видели
    - t: 222
      mark: 3:42
      title: Мечта, которая всё ещё летит
    - t: 265
      mark: 4:25
      title: Что мы отсюда берём
  transcript:
    - "<p>«Начнём не с ракеты, а с часов: 19:41 по Москве, 2 января 1959 года, Байконур. Всё, что летало в космос до этого дня, оставалось на орбите Земли или падало обратно — Земля никого не отпускала. Сейчас она отпустит первый раз».</p>"
    - "<p>«Главный предмет зала — шар. 361 килограмм, четыре антенны, внутри приборы, снаружи вымпел с гербом: его положили с расчётом на удар о лунную поверхность. Обратите внимание, чего у шара нет: двигателя для торможения, системы посадки, обратного билета».</p>"
    - "<p>«На схеме — цифра, ради которой стоит прийти в этот зал: 11,2 километра в секунду, вторая космическая. Ниже неё любая вещь падает обратно, выше — уходит навсегда. Все прежние траектории были кольцами вокруг Земли, эта первая уходит за край схемы».</p>"
    - "<p>«Аппарат, посланный попасть, не попал: прошёл в шести тысячах километров от Луны. Зато магнитометр показал, что своего магнитного поля у Луны нет, а приборы поймали непрерывный поток частиц от Солнца — солнечный ветер, о котором физики спорили годами. Летела в Луну — открыла ветер, которым продувается вся Солнечная система».</p>"
    - "<p>«Пролетев мимо, станция вышла на орбиту вокруг Солнца и стала первым искусственным спутником Солнца; в газетах её назвали „Мечта“. Это не прошедшее время: шар идёт по своему кольцу между орбитами Земли и Марса прямо сейчас».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
