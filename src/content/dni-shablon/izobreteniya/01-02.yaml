      - summary: "Самолёты перестали разваливаться. Келдыш вычислил, как спасти самолёт от смертельной тряски, а в Германии от неё разбились почти 150 машин."
        kadr:
          src: "/muzei/izobreteniya/img/day-02jan-keldysh-flatter-cagi-1944.jpg"
          alt: "Титульный лист: «Труды ЦАГИ № 557. О демпфировании флаттера. Я. М. Пархомовский. О демпферах с нелинейной характеристикой. М. В. Келдыш». 1944"
