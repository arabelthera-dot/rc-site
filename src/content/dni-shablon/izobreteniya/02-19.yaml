    sdvig: 70
    shag: 4
    scena:
      alt: Три цветных канала одной фотографии — небо, солнце, храм с куполом, луг и река
      podpis_ru: 'Три кадра через цветные стёкла складываются в цветную картину.'
    vyberi_ru: 'Тяни цветную метку канала или выбери канал кнопкой и двигай стрелками.'
    status_ru: 'Осталось совместить: {n}'
    sovpalo_ru: 'Канал «{k}» лёг на место.'
