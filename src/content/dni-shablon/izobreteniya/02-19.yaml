audioguide:
  audioSrc: audio-guide-cvetnaya-foto-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу цветной фотографии: от царского вагона-лаборатории через Ясную Поляну к пластинам, которые дошли до нас.'
  stops:
  - t: 0
    mark: '0:00'
    title: Вагон-лаборатория
  - t: 10
    mark: '0:10'
    title: Толстой в цвете
  - t: 21
    mark: '0:21'
    title: Тысяча девятьсот две пластины
  - t: 35
    mark: '0:35'
    title: Цветное кино
  transcript:
  - 'Царь дал фотографу вагон-лабораторию: цепляй к любому поезду и снимай Россию в цвете. Царский указ: пускать фотографа с камерой в любой храм и монастырь России.'
  - Единственный цветной портрет живого Льва Толстого снял он — в Ясной Поляне в тысяча девятьсот восьмом году. Цветной Толстой вышел на обложке «Огонька» тиражом больше двух миллионов.
  - 'Прокудин-Горский задумал десять тысяч цветных снимков России за десять лет — до нас дошли тысяча девятьсот две стеклянные пластины. Вода и облака на его снимках — цветные призраки: три кадра, по одной–три секунды каждый.'
  - В тысяча девятьсот тринадцатом году Прокудин-Горский запатентовал цветное кино сразу в пяти странах. В тысяча девятьсот шестнадцатом снял цветное кино о турецких городах, которые взяла русская армия.
  note: Озвучено синтезом речи.
