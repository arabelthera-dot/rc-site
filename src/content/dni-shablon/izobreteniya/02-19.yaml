igra:
  mehanika: tri-negativa
  kicker: Играй
  zagolovok: 🎞 Собери цвет из трёх негативов
  pravilo_ru: 'Камера снимала один вид трижды — через красное, зелёное и синее стекло. Совмести три цветных канала на экране, и из них сложится цветная фотография.'
  kak_igrat:
    zachem: 'Ты — Прокудин-Горский: один и тот же вид снят трижды, через красное, зелёное и синее стекло. Совмести три кадра-канала, и из них сложится цветная картина.'
    shagi:
    - Тяни цветную метку канала или выбери канал кнопкой и двигай стрелками — кадр поедет за тобой.
    - Попал в белую пунктирную рамку — канал защёлкнется и встанет ровно, как при показе через три цветных стекла.
    - Совмести все три — красный, зелёный и синий сложатся, и на месте трёх кадров появится цветная картина.
    nyuans: 'Нюансы: каналы складываются по свету — наложенные красный, зелёный и синий дают настоящий цвет. Канал защёлкивается, только когда подошёл почти точно к рамке.'
    final: Три канала совмещены — цветная фотография собрана.
  dannye:
    kanaly:
    - kod: krasnyy
      cvet: [255, 0, 0]
      imya_ru: красный
    - kod: zelenyy
      cvet: [0, 255, 0]
      imya_ru: зелёный
    - kod: siniy
      cvet: [0, 0, 255]
      imya_ru: синий
