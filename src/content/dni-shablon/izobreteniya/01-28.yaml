return:
  q: Во сколько раз реже умирали от холеры привитые вакциной Хавкина?
  a: "В десять раз: так показали испытания 1893–1895 годов на 42 тысячах человек."
  src: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3
audioguide:
  audioSrc: audio-guide-havkin-r192-ru-2.mp3
  durationLabel: около двух минут
  lead: "Голос ведёт по залу первых в мире вакцин от холеры и чумы, испытанных на людях: от уколов, которые Хавкин сначала делал себе, через камни и клевету в Индии к институту его имени."
  stops:
    - t: 0
      mark: '0:00'
      title: Сначала на себе
    - t: 34
      mark: '0:34'
      title: Рубашка перед толпой
    - t: 63
      mark: '1:03'
      title: Дома не нужна
    - t: 90
      mark: '1:30'
      title: Клеймо и оправдание
    - t: 120
      mark: '2:00'
      title: Великая душа
  transcript:
    - Здравствуйте. Мы в зале первых в мире вакцин от холеры и чумы, испытанных на людях. В Париже восемнадцатого июля тысяча восемьсот девяносто второго года Хавкин тайком ввёл себе холерную вакцину, во много раз больше дозы для кроликов. Убедившись, что здоров, он привил троих добровольцев, русских, живших в Париже. Десятого января тысяча восемьсот девяносто седьмого года в Бомбее он испытал на себе и чумную вакцину, дозой в десять раз больше той, что потом кололи людям. Начался жар, но Хавкин поправился.
    - "В посёлке под Калькуттой крестьяне считали холеру волей высших сил, отвечали угрозами, потом в прививавших полетели камни. Хавкин не сбежал: снял пиджак и рубашку, и товарищ сделал ему укол на глазах у толпы. После этого сто шестнадцать человек дали себя привить, и ни один не заболел. Когда чума вспыхнула в бомбейской тюрьме, власти разрешили колоть всех, а Хавкин честно объяснил риск и привил только согласных."
    - "Студента из Одессы трижды арестовывали и дважды выгоняли из университета. Заниматься наукой дома ему позволяли только ценой смены веры, и он отказался. Создав вакцину, Хавкин первым делом предложил её России, но «неблагонадёжному» бывшему арестанту ответили, что вакцина не нужна. Испытания разрешили в Индии: за два с половиной года там привили сорок две тысячи человек, и привитые умирали от холеры в десять раз реже."
    - Офицеры колониальных властей звали Хавкина русским шпионом, а противники властей пускали слух, что вакцина — яд. В тысяча девятьсот втором году после прививок в индийской деревне умерли девятнадцать человек, и всю вину свалили на него. За его честное имя вступились десять учёных во главе с Рональдом Россом, и в тысяча девятьсот седьмом году Хавкина оправдали полностью. Но в новой лаборатории не на что было делать вакцины, и он ушёл.
    - В Индии Хавкина звали «махатма», то есть «великая душа». Противочумной вакциной к тысяча девятьсот девятому году в одной Индии привили восемь миллионов человек, а к тысяча девятьсот сороковому — тридцать пять миллионов. Лабораторию против чумы в Бомбее Хавкину пришлось создать самому, и она выросла в большой центр бактериологии и эпидемиологии. С тысяча девятьсот двадцать пятого года это Институт Хавкина, и он работает до сих пор.
  note: Озвучено синтезом речи.
