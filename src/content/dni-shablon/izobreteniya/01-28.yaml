return:
  q: Во сколько раз реже умирали от холеры привитые вакциной Хавкина?
  a: "В десять раз: так показали испытания 1893–1895 годов на 42 тысячах человек."
  src: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3
audioguide:
  audioSrc: audio-guide-havkin-r192-ru.mp3
  durationLabel: 2 минуты 7 секунд
  lead: "Голос ведёт по залу Владимира Хавкина: от ответа «вакцина не нужна» до 35 миллионов привитых и института его имени. Пять остановок — пять утверждённых фактов с источниками. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: "0:00"
      title: "Учёный из Одессы"
    - t: 17
      mark: "0:17"
      title: "Дома сочли ненужной"
    - t: 43
      mark: "0:43"
      title: "Доза в десять раз"
    - t: 64
      mark: "1:04"
      title: "Камни и миллионы"
    - t: 83
      mark: "1:23"
      title: "Махатма"
    - t: 97
      mark: "1:37"
      title: "Институт Хавкина"
    - t: 114
      mark: "1:54"
      title: "Что дальше"
  transcript:
    - "<p>Двадцать восьмое января. Зал Владимира Хавкина — учёного из Одессы, который создал прививки от холеры и от чумы. Пять остановок, и на каждой — один факт, проверенный по источникам. Слушайте фоном, пока читаете страницу.</p>"
    - "<p>Остановка первая. Хавкин предложил прививать от холеры в России — и получил ответ, что вакцина не нужна. Испытания разрешили в Индии. За два с половиной года привили сорок две тысячи человек, и привитые умирали от холеры в десять раз реже. Найдите на странице старую фотографию: навес из жердей, врачи за столом, вокруг крестьяне. Это и есть прививки Хавкина.</p>"
    - "<p>Остановка вторая. Чумную вакцину Хавкин сначала испытал на себе. Десятого января тысяча восемьсот девяносто седьмого года, в Бомбее, при двух свидетелях, ему ввели дозу в десять раз больше той, что потом кололи людям. Через час начался жар — но Хавкин поправился, и вакцину стали давать людям.</p>"
    - "<p>Остановка третья. Крестьяне считали болезнь волей высших сил, и в прививавших летели камни. Тогда Хавкин снял рубашку, и ему сделали укол на глазах у толпы. К тысяча девятьсот девятому году от чумы привили восемь миллионов человек, а к тысяча девятьсот сороковому — тридцать пять миллионов.</p>"
    - "<p>Остановка четвёртая. В Индии Хавкина звали «махатма» — «великая душа». Так там называют самых почитаемых людей. Учёного из Одессы считали героем.</p>"
    - "<p>Остановка пятая. Лабораторию против чумы в Бомбее Хавкину пришлось создать самому. Она выросла в большой центр бактериологии и эпидемиологии. С тысяча девятьсот двадцать пятого года она называется Институтом Хавкина — и работает до сих пор.</p>"
    - "<p>Вакцина, которую дома сочли ненужной, спасла миллионы. Ниже на странице — пять фактов с источниками, игра «Зелёная стена» и викторина. Проверьте себя.</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
