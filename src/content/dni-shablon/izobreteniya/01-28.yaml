story:
  kicker: История открытия · 4 удара
  h2: Прививка, которую сочли ненужной
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Владимир Хавкин сделал прививку от холеры и предложил прививать в России. Ответ — «не нуждаются».
      det:
        - "Холера тогда уносила сотни тысяч жизней. Хавкин приготовил ослабленную вакцину и проверил её. Из России ему ответили, что в его вакцине не нуждаются."
      src: 'Источник: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>.'
    - summary: Испытания разрешили в Индии. За два с половиной года привили 42 тысячи человек.
      det:
        - "Привитые умирали от холеры в десять раз реже. Хавкин слёг с малярией — и через полгода вернулся, чтобы привить ещё 30 тысяч."
      src: 'Источник: «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>.'
    - summary: В 1896 году в Бомбей пришла чума. За три месяца Хавкин сделал вакцину и от неё.
      det:
        - "10 января 1897 года при двух свидетелях он ввёл себе дозу в десять раз больше той, что потом кололи людям. Тяжёлый жар — и через несколько дней снова в лаборатории."
      src: 'Источник: «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>; «Война с „чёрной смертью“», «Наука и жизнь» — <a href="https://www.nkj.ru/archive/articles/6364/" rel="noopener" target="_blank">nkj.ru</a>.'
    - summary: До 1940-х его вакцина оставалась, по сути, единственным средством против чумы.
      det:
        - "К 1909 году ею привили 8 миллионов человек, к 1940-му — 35 миллионов. Бомбейская лаборатория с 1925 года называется Институтом Хавкина."
      src: 'Источник: «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>.'
fakty:
  id: fakty
  nav: Факты
  kicker: Десять фактов о Хавкине
  h2: Факты дня
  udary:
    - summary: <b>Дома вакцину Хавкина сочли ненужной — а там, где ею привили, от холеры умирали в 10 раз реже.</b>
      utverzhdeno: Р192
      det:
        - "Хавкин предложил прививать в России и получил ответ, что вакцина не нужна. Испытания разрешили в Индии: за два с половиной года привили 42 тысячи человек, привитые умирали от холеры в десять раз реже."
      src: 'Источник: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>.'
      otryvok: "«Хавкину ответили, что в его вакцине в России не нуждаются… За 2,5 года прививки получили 42 тысячи человек. Некоторые все-таки заболевали, но смертность от холеры среди привитых снизилась в десять раз»."
      stranica: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3
      href: https://hij.ru/read/11413/
      pometka: документ
    - summary: <b>Чумную вакцину Хавкин испытал на себе — дозой в 10 раз больше той, что потом кололи людям.</b>
      utverzhdeno: Р192
      det:
        - "10 января 1897 года, Бомбей, при двух свидетелях. Через час начался жар, но Хавкин поправился — и вакцину стали давать людям."
      src: 'Источник: «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>; «Наука и жизнь» — <a href="https://www.nkj.ru/archive/articles/6364/" rel="noopener" target="_blank">nkj.ru</a>.'
      otryvok: "«Десятого января 1897 года… при двух свидетелях Владимиру ввели дозу противочумной вакцины, в десять раз большую той, которую позже вводили больным чумой жителям Бомбея»."
      stranica: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3
      href: https://hij.ru/read/11413/
      pometka: два источника
    - summary: <b>В Индии Хавкина звали «махатма» — «великая душа».</b>
      utverzhdeno: Р192
      det:
        - "Так в Индии называют самых почитаемых людей. Учёного из Одессы там считали героем."
      src: 'Источник: «Владимир Аронович Хавкин. Самый неизвестный учёный России», Российское историческое общество — <a href="https://historyrussia.org/tsekh-istorikov/vladimir-aronovich-khavkin-samyj-neizvestnyj-uchjonyj-rossii.html" rel="noopener" target="_blank">historyrussia.org</a>.'
      otryvok: "«В Индии же Хавкин стал героем. Исследователя-чужеземца назвали «махатма Хавкин» («великая душа Хавкин»)»."
      stranica: «Владимир Аронович Хавкин. Самый неизвестный учёный России», Российское историческое общество
      href: https://historyrussia.org/tsekh-istorikov/vladimir-aronovich-khavkin-samyj-neizvestnyj-uchjonyj-rossii.html
      pometka: документ
    - summary: <b>С 1925 года его противочумная лаборатория называется Институтом Хавкина — и работает до сих пор.</b>
      utverzhdeno: Р192
      det:
        - "Лабораторию против чумы в Бомбее (теперь Мумбаи) Хавкину пришлось создать самому. Она выросла в большой центр бактериологии и эпидемиологии."
      src: 'Источник: «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>; «Наука и жизнь» — <a href="https://www.nkj.ru/archive/articles/6364/" rel="noopener" target="_blank">nkj.ru</a>.'
      otryvok: "«Хавкину фактически пришлось организовать в Бомбее противочумную лабораторию, которая впоследствии стала крупным исследовательским центром бактериологии и эпидемиологии. С 1925 года этот исследовательский центр называется Институтом Хавкина»."
      stranica: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3
      href: https://hij.ru/read/11413/
      pometka: два источника
    - summary: <b>В прививавших летели камни — а к 1940-му чумную вакцину Хавкина получили 35 миллионов человек.</b>
      utverzhdeno: Р192
      det:
        - "Крестьяне считали болезнь волей высших сил и на уговоры отвечали угрозами. Хавкин снял рубашку, и ему сделали укол на глазах у толпы. К 1909 году от чумы привили 8 миллионов человек, к 1940-му — 35 миллионов."
      src: 'Источник: «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>.'
      otryvok: "«…во врачей полетели камни. Но вместо того чтобы сбежать, Хавкин снял пиджак и рубашку… К 1909 году противочумной вакциной Хавкина в одной Индии было привито 8 миллионов человек, к 1940 году — 35 миллионов»."
      stranica: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3
      href: https://hij.ru/read/11413/
      pometka: документ
    - summary: <b>Будущего спасителя миллионов трижды арестовывали, дважды выгоняли из университета и восемь лет держали под надзором.</b>
      utverzhdeno: Р339
      det:
        - "Студент-естественник из Одессы состоял в «Народной воле» и Еврейской лиге самообороны, суда и каторги избежал чудом."
      src: 'Источник: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4 — <a href="https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin" rel="noopener" target="_blank">elementy.ru</a>.'
      otryvok: "«…трижды арестовывали, дважды исключали из университета и восемь лет он жил в Одессе под надзором полиции»."
      stranica: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4
      href: https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin
      pometka: документ
    - summary: <b>В Пастеровском институте будущий победитель холеры начинал помощником библиотекаря, а опыты ставил только по вечерам.</b>
      utverzhdeno: Р339
      det:
        - "Должность дали по просьбе Мечникова: непрестижная и малооплачиваемая, но открывала дверь в лабораторию."
      src: 'Источник: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4 — <a href="https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin" rel="noopener" target="_blank">elementy.ru</a>; «Владимир Аронович Хавкин. Самый неизвестный учёный России», Российское историческое общество — <a href="https://historyrussia.org/tsekh-istorikov/vladimir-aronovich-khavkin-samyj-neizvestnyj-uchjonyj-rossii.html" rel="noopener" target="_blank">historyrussia.org</a>.'
      otryvok: "«…помощника библиотекаря и только по вечерам имел возможность работать в лаборатории»; «Должность помощника библиотекаря была непрестижной и малооплачиваемой»."
      stranica: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4
      href: https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin
      pometka: два источника
    - summary: <b>В 1902 году после прививок в индийской деревне умерли 19 человек, и всю вину свалили на Хавкина.</b>
      utverzhdeno: Р339
      det:
        - "Пять лет он жил с клеймом, пока комиссия не признала виновным врача, делавшего уколы, а в 1907-м Хавкина оправдали полностью."
      src: 'Источник: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4 — <a href="https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin" rel="noopener" target="_blank">elementy.ru</a>; «Химия и жизнь», 2018, № 3 — <a href="https://hij.ru/read/11413/" rel="noopener" target="_blank">hij.ru</a>.'
      otryvok: "«19 человек скончались от столбняка, на Хавкина была возложена вина»; «В 1907 году Хавкин был окончательно и абсолютно оправдан»."
      stranica: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4
      href: https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin
      pometka: два источника
    - summary: <b>За честное имя Хавкина вступились десять учёных во главе с нобелевским лауреатом Рональдом Россом.</b>
      utverzhdeno: Р339
      det:
        - "Их открытое письмо вышло в лондонской «Таймс» 29 июля 1907 года."
      src: 'Источник: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4 — <a href="https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin" rel="noopener" target="_blank">elementy.ru</a>.'
      otryvok: "«…письмо в защиту Хавкина, опубликованное в газете The Times 29 июля 1907 г.»"
      stranica: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4
      href: https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin
      pometka: документ
    - summary: <b>Создав вакцину, Хавкин первым делом предложил её России, но «неблагонадёжному» бывшему арестанту отказали.</b>
      utverzhdeno: Р339
      det:
        - "Отказ отправил его в Индию — на двадцать с лишним лет."
      src: 'Источник: «Владимир Аронович Хавкин. Самый неизвестный учёный России», Российское историческое общество — <a href="https://historyrussia.org/tsekh-istorikov/vladimir-aronovich-khavkin-samyj-neizvestnyj-uchjonyj-rossii.html" rel="noopener" target="_blank">historyrussia.org</a>.'
      otryvok: "«Владимир в первую очередь предлагает помощь российским властям… Но предложение «неблагонадёжного гражданина» было отклонено»."
      stranica: «Владимир Аронович Хавкин. Самый неизвестный учёный России», Российское историческое общество
      href: https://historyrussia.org/tsekh-istorikov/vladimir-aronovich-khavkin-samyj-neizvestnyj-uchjonyj-rossii.html
      pometka: документ
