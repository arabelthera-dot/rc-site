- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Тайный укол, тюрьма и «шпион»
  udary:
  - summary: "Холерную вакцину Хавкин тайком ввёл себе — следом укол сделали трое друзей из России."
    det:
    - Париж, 18 июля 1892 года. Морские свинки и кролики после прививки уже не болели холерой, но на людях её никто не пробовал. Начальник лаборатории не спешил разрешать опыт на человеке. Хавкин никому ничего не сказал и ввёл себе дозу во много раз больше той, что получали кролики.
    - 'Только убедившись, что жив и здоров, он привил троих добровольцев — русских эмигрантов, живших в Париже; двое из них были врачами. Все перенесли укол благополучно, и Хавкин объявил: вакцина безопасна, а через шесть дней после неё человек уже защищён от холеры.'
    src: "Источник: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4 — elementy.ru/nauchno-populyarnaya_biblioteka/435658; В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3 — https://hij.ru/read/11413/."
    otryvok: «никому не сказав о своем решении, Хавкин ввел себе в кровь дозу холерного яда, во много раз превышающую ту, что вводил кроликам. Только после этого он осуществил аналогичный эксперимент на троих добровольцах из России»
    stranica: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4
    href: https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin
    pometka: два источника
    istochnik: "elementy"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f11"
  - summary: "Власти разрешили колоть чумную вакцину заключённым поголовно — Хавкин привил только согласных."
    det:
    - В бомбейской тюрьме вспыхнула чума. Городские власти позволили Хавкину сделать первые массовые прививки прямо арестантам — предполагалось, что их и спрашивать не станут.
    - 'Хавкин сначала собрал заключённых и честно объяснил: вакцина новая, почти не проверенная, и риск есть. Привил только тех, кто согласился, — а согласилось большинство. Реакция на укол была тяжёлой, но почти все привитые выжили. После этого прививки стали делать всем желающим.'
    src: "Источник: «Владимир Аронович Хавкин. Самый неизвестный учёный России», Российское историческое общество — https://historyrussia.org/tsekh-istorikov/vladimir-aronovich-khavkin-samyj-neizvestnyj-uchjonyj-rossii.html; В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3 — https://hij.ru/read/11413/."
    otryvok: «…власти Бомбея разрешили Хавкину сделать инъекции заключённым. Предполагалось, что это будет обязательная мера, но Владимир, как истинный гуманист, воспитанный Мечниковым, делал прививки только добровольцам. Результат был превосходным. Прививки стали делать всем желающим»
    stranica: «Владимир Аронович Хавкин. Самый неизвестный учёный России», Российское историческое общество
    href: https://historyrussia.org/tsekh-istorikov/vladimir-aronovich-khavkin-samyj-neizvestnyj-uchjonyj-rossii.html
    pometka: два источника
    istochnik: "historyrussia"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f12"
  - summary: "Остаться учёным в Одессе Хавкину позволяли только ценой смены веры — он отказался."
    det:
    - В 1884 году Хавкин защитил диссертацию, но заниматься наукой в Одессе или преподавать в университете можно было, только приняв православие. Отказываться от своего еврейства он не захотел.
    - 'Итог — нищета: в музее он препарировал животных за гроши, полиция продолжала следить. В 1888 году Хавкин уехал из России — и через четыре года в Париже сделал вакцину от холеры.'
    src: "Источник: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3 — https://hij.ru/read/11413/; «Владимир Аронович Хавкин. Самый неизвестный учёный России», Российское историческое общество — https://historyrussia.org/tsekh-istorikov/vladimir-aronovich-khavkin-samyj-neizvestnyj-uchjonyj-rossii.html."
    otryvok: «продолжить в Одессе научную работу или преподавать в университете можно было, только приняв православие. Хотя отец Хавкина не воспитывал сына в духе еврейских традиций, отказаться от своего еврейства Владимир не захотел»
    stranica: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3
    href: https://hij.ru/read/11413/
    pometka: два источника
    istochnik: "hij"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f13"
  - summary: "Спасителя Индии там же звали «русским шпионом», а его вакцину — ядом."
    det:
    - Чем больше людей спасала вакцина, тем больше у Хавкина было врагов. Офицеры колониальных властей звали его русским шпионом. Противники властей пускали слух, что вакцина — яд, сваренный, чтобы извести простой народ. Даже сотрудники его собственной лаборатории были недовольны, что ими командует «какой-то русский еврей».
    - 'Чем кончилось: когда в 1902 году случилась беда с прививками в деревне, Хавкина сняли с должности, и его место занял тот самый сослуживец, который больше всех интриговал против «русского шпиона».'
    src: "Источник: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4 — elementy.ru/nauchno-populyarnaya_biblioteka/435658."
    otryvok: «Офицеры британской колониальной администрации время от времени называли его русским шпионом. Индийские оппозиционеры распускали слухи, что его вакцина была ядом, приготовленным правительством для уничтожения простых людей»
    stranica: М. Сорокина, «Между верой и разумом», «Природа», 2020, № 4
    href: https://elementy.ru/nauchno-populyarnaya_biblioteka/435658/Mezhdu_veroy_i_razumom_velikiy_bakteriolog_Vladimir_Khavkin
    pometka: документ
    istochnik: "elementy"
