  - summary: "В прививавших летели камни — Хавкин снял рубашку и привился на глазах у толпы."
    utverzhdeno: Р192
    det:
    - 'Это было ещё с холерной вакциной, в посёлке под Калькуттой. Крестьяне считали болезнь волей высших сил, на уговоры отвечали угрозами, потом полетели камни. Хавкин не сбежал: снял пиджак и рубашку, и товарищ сделал ему укол на глазах у толпы. После этого 116 человек дали себя привить — и ни один не заболел холерой. А противочумной вакциной Хавкина к 1909 году в одной Индии привили 8 миллионов человек, к 1940-му — 35 миллионов.'
    src: "Источник: «Химия и жизнь», 2018, № 3 — hij.ru."
    otryvok: «…во врачей полетели камни. Но вместо того чтобы сбежать, Хавкин снял пиджак и рубашку, а его товарищ на глазах у разгневанных бедняков сделал Хавкину инъекцию вакцины. Крестьяне были поражены, 116 человек дали сделать себе прививку, и ни один из них не заболел холерой… К 1909 году противочумной вакциной Хавкина в одной Индии было привито 8 миллионов человек, к 1940 году — 35 миллионов».
    stranica: В. А. Острогорская, «Непопулярный в России», «Химия и жизнь», 2018, № 3
