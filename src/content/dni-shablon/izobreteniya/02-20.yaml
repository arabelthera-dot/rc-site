audioguide:
  audioSrc: audio-guide-stanciya-mir-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу станции «Мир»: от перелёта на «Салют-7» через рекорд Полякова к спасению пробитой станции.'
  stops:
  - t: 0
    mark: 0:00
    title: Перелёт на «Салют-7»
  - t: 35
    mark: 0:35
    title: Птенец и зеркало
  - t: 70
    mark: '1:10'
    title: Четыреста тридцать семь суток
  - t: 105
    mark: '1:45'
    title: Пятнадцать лет вместо пяти
  transcript:
  - В тысяча девятьсот восемьдесят шестом Кизим и Соловьёв слетали с «Мира» на «Салют-7» и вернулись — такого больше не было.
  - Двадцать второго марта тысяча девятьсот девяностого года на «Мире» вылупился первый в мире птенец, рождённый в космосе. В тысяча девятьсот девяносто третьем зеркало с «Мира» ночью пустило над Европой «солнечный зайчик» ярче полной Луны.
  - 'Поляков пробыл на «Мире» четыреста тридцать семь суток — мировой рекорд держится больше тридцати лет. После этого он держался на ногах и шутил: «Я уже на Марс слетал».'
  - «Мир» строили на пять лет, а он пролетал пятнадцать. Стотридцатитонный «Мир» впервые в мире свели с орбиты управляемо — точно в заданный район океана.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
