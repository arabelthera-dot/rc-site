story:
  kicker: Дороги на одном рельсе
  h2: Как повозка встала на один брус
  udary:
  - summary: Дорога Эльманова
    det:
    - Повозка Эльманова — три яруса и 21 метр длины, и всё на одном брусе.
    - На модели Эльманова повозку с десятью пудами гирь катали одним пальцем.
    src: 'Источник: «Москва. Прогулка», «Эльмановская дорожка на столбах» — mosprogulka.ru'
  - summary: Гирокар Шиловского
    det:
    - В 1914 году в Лондоне двухколёсная машина Шиловского в 2,75 тонны стояла и не падала.
    - 'Бреннан, строивший гиропоезд в Англии, прокатился у Шиловского и признал: сам не додумался.'
    src: 'Источник: дитя костромского губернатора Шиловского», «Гирокар — kolesa.ru'
  - summary: Аэропоезд Вальднера
    det:
    - Аэропоезд придумал музыкант-самоучка, его модель неслась в парке Горького 120 км/ч.
    src: 'Источник: «За рулём», «Аэропоезд из 1933-го» — zr.ru'
