igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чья это дорога
  pravilo_ru: 'Что сделать сейчас: выбери изобретателя и нажми на машину, которую он придумал.'
  kak_igrat:
    zachem: 'У каждого изобретателя — своя дорога: брус на столбах, гироскоп, винт.'
    shagi:
    - Выбери изобретателя — кнопка загорится золотом.
    - Нажми на его машину. Верный выбор загорится зелёным.
    - Расставь всех троих — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все три изобретателя на месте — +20 баллов.
  dannye:
    mesta:
    - kod: brus
      nazvanie: Повозка на одном брусе
      verno_ru: Повозка Эльманова — три яруса и 21 метр длины, и всё на одном брусе.
    - kod: giro
      nazvanie: Двухколёсная машина, которая не падает
      verno_ru: В 1914 году в Лондоне двухколёсная машина Шиловского в 2,75 тонны стояла и не падала.
    - kod: vint
      nazvanie: Аэропоезд на 120 км/ч
      verno_ru: Аэропоезд придумал музыкант-самоучка, его модель неслась в парке Горького 120 км/ч.
    podpisi:
    - kod: elmanov
      tekst: Эльманов
      mesto: brus
      mimo_ru: Эльманов строил под Москвой дорогу на столбах — ищи брус.
    - kod: shilovskij
      tekst: Шиловский
      mesto: giro
      mimo_ru: Шиловский показывал свою машину в Лондоне — ищи ту, что не падает.
    - kod: valdner
      tekst: Вальднер
      mesto: vint
      mimo_ru: Вальднер — музыкант-самоучка, ищи аэропоезд.
    vyberi_ru: Сначала выбери изобретателя, потом машину.
    mimo_ru: Не та машина — попробуй другую.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все трое на месте — Эльманов поставил повозку на брус, Шиловский удержал машину на двух колёсах, Вальднер разогнал аэропоезд.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: Эльманов — повозка на одном брусе, Шиловский — двухколёсная машина, Вальднер — аэропоезд.'
pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: 'Что сделано: Эльманов пустил вагонетки по одному брусу на столбах за полвека до английских патентов.'
  net: 'Где граница: В 1835 году посчитали: на дороге Эльманова одна лошадь тянет за шестнадцать.'
  kolonki:
  - Где
  - Что
  - Когда
  stroki:
  - - Мячково
    - дорога Эльманова на столбах
    - '1820'
  - - Петербург
    - проект Романова Петербург — Москва
    - '1904'
  - - Лондон
    - гирокар Шиловского
    - '1914'
  - - Нижегородская область
    - лесной монорельс на 50 км
    - '1934'
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Для викторины нужен JavaScript. Ответы: шестнадцать; 2,75 тонны; 15 лет; 120 км/ч; 511 км.'
  ball: 8
  voprosy:
  - q: Сколько лошадей заменяет одна на дороге Эльманова?
    o:
    - четыре
    - шестнадцать
    - сто
    a: 1
    e: 'В 1835 году посчитали: на дороге Эльманова одна лошадь тянет за шестнадцать.'
  - q: Сколько весила машина Шиловского в Лондоне?
    o:
    - 2,75 тонны
    - 275 килограммов
    - 27 тонн
    a: 0
    e: В 1914 году в Лондоне двухколёсная машина Шиловского в 2,75 тонны стояла и не падала.
  - q: Сколько лет возил лес нижегородский монорельс?
    o:
    - 5 лет
    - 15 лет
    - 50 лет
    a: 1
    e: В 1934 году в нижегородской тайге пустили монорельс на 50 км, и он возил лес 15 лет.
  - q: С какой скоростью неслась модель аэропоезда в парке Горького?
    o:
    - 20 км/ч
    - 120 км/ч
    - 420 км/ч
    a: 1
    e: Аэропоезд придумал музыкант-самоучка, его модель неслась в парке Горького 120 км/ч.
  - q: Какой длины монорельс задумали на Камчатке в 1954 году?
    o:
    - 51 км
    - 511 км
    - 5110 км
    a: 1
    e: В 1954 году на Камчатке задумали самый длинный монорельс в мире — 511 км.
