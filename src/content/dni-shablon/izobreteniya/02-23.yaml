lead:
  data: 21 июня 1941 · Москва
  privyazka: 23 февраля — день музея; на полигоне установки испытали в 1939 году, а 21 июня 1941 года утвердили серийный выпуск «Катюши».
  kto: инженер Галковский и первая батарея капитана Флёрова
  h1: Первые в мире реактивные снаряды залпового огня «Катюша» · 1941
  hook: Идея была простая и страшная — не один точный выстрел, а залп по квадрату, и на полигоне это проверили за полтора года до войны
