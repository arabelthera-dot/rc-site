audioguide:
  audioSrc: audio-guide-katyusha-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу «Катюши»: от полигона 1939 года через решение 21 июня к первой батарее под Оршей.'
  stops:
  - t: 0
    mark: 0:00
    title: Полигон
  - t: 35
    mark: 0:35
    title: За часы до войны
  - t: 70
    mark: '1:10'
    title: Первая батарея
  - t: 105
    mark: '1:45'
    title: Враг не понял
  transcript:
  - 'На полигоне 1939 года испытали три установки — выдержала одна, будущая «Катюша». На испытаниях установка обжигала сама себя, а комиссия написала: «идея безусловно правильная».'
  - 'Инженер Галковский развернул направляющие вдоль машины: 16 вместо 24 — и схему одобрили. Серийный выпуск «Катюши» утвердили 21 июня 1941 года — за несколько часов до войны.'
  - Машины первой батареи стояли в глубокой ржавчине, две тянули с базы трактором. Первую батарею «Катюш» велели собрать за два дня, а через две недели она накрыла станцию Оршу.
  - Немцы приняли залп «Катюши» за химическое оружие и советовали солдатам защитные накидки. Немцы захватили «Катюши» под Мценском, но скопировать так и не смогли — секрет был в порохе.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
