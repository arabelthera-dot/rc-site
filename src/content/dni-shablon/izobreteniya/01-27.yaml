audioguide:
  audioSrc: audio-guide-elbrus-ru.mp3
  durationLabel: 3 минуты 3 секунды
  lead: 'Голос ведёт по залу «Эльбруса»: от проспекта 1982 года через щит Москвы и игру «Сбей ракету» к итогу зала.'
  stops:
  - t: 0
    mark: 0:00
    title: Обложка и четыре числа
  - t: 40
    mark: 0:40
    title: По нескольку команд за шаг
  - t: 71
    mark: '1:11'
    title: Щит Москвы
  - t: 94
    mark: '1:34'
    title: 'Игра: сбей ракету'
