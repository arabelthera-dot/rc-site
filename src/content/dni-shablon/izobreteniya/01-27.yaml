    mark: '2:12'
    title: Сорок восемь тонн и человек
  - t: 164
    mark: '2:44'
    title: Итог зала
  transcript:
  - <p>«Здравствуйте. Мы в зале «Эльбруса» — советской вычислительной машины, которая стерегла Москву от ракет. На обложке — подлинный проспект «Эльбрус-2. Многопроцессорный вычислительный комплекс» 1982 года из Музея современной истории России. Под заголовком страницы — четыре числа. Тысяча девятьсот семьдесят восьмой — первый «Эльбрус». Несколько команд за один шаг. Тысяча девятьсот девяносто первый — машины встали в щит Москвы. И сорок восемь тонн — столько весила центральная часть «Эльбруса-2».»</p>
  - '<p>«Программа для вычислительной машины — это список команд. Обычная машина выполняет их по одной: одна команда — один шаг. «Эльбрус-1» в 1978–1979 годах умел брать в один шаг сразу несколько команд, если они не ждут друг друга. И находила такие команды сама машина, на ходу. Журнал «Компьютерра» называет советский суперкомпьютер первой в мире коммерческой машиной с таким устройством.»</p>'
  - <p>««Эльбрус-2» выпускали с 1985 года. С 1991 года эти комплексы работали в системе противоракетной обороны А-135 вокруг Москвы. Машина должна была за секунды посчитать путь цели и точку, где её встретит противоракета. Здесь медленный счёт значил бы, что ракета долетит.»</p>
  - '<p>«Спуститесь к игре «Сбей ракету». На экране радара сверху к Москве летит красная точка — цель. Пунктир — её путь, который посчитала машина. Нажмите на этот путь впереди цели: там встанет точка встречи. Жёлтое кольцо показывает, где окажется цель, когда долетит противоракета. Жмите «Пуск», когда кольцо дойдёт до точки. А на второй и третьей цели экран погаснет: сгорел блок. Выдерните красный блок, нажмите «Перезапуск» — и успейте, пока цель летит.»</p>'
  - <p>«Центральная вычислительная часть «Эльбруса-2» весила сорок восемь тонн и занимала четыреста тридцать квадратных метров — больше полутора теннисных кортов. Над «Эльбрусом-1» и «Эльбрусом-2» с 1970 года работал инженер Владимир Пентковский. Он участвовал и в создании языка программирования Эль-76. А 1 декабря 2010 года в Московском физико-техническом институте открылась лаборатория суперкомпьютерных технологий, которую возглавил Пентковский.»</p>
  - '<p>«Вот и весь зал. Машина брала в один шаг несколько команд сразу, весила сорок восемь тонн и с 1991 года стерегла небо над Москвой. Ответьте на два вопроса викторины — и загляните в календарь: в каждом дне года своё русское первенство.»</p>'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
