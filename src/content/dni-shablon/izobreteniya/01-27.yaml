story:
  kicker: История машины · 3 удара
  h2: Машина, которая не ждала
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
  - summary: 'Программа — это список команд. Обычная машина выполняет их по одной: одна команда — один шаг.'
    det:
    - «Эльбрус-1» в 1978–1979 годах брал в один шаг сразу несколько команд, если они не ждут друг друга. Находила такие команды сама машина, на ходу.
    src: 'Источник: И. Карташев, «„Эльбрус“. История легенды», «Компьютерра» — <a href="https://old.computerra.ru/hitech/205267/" rel="noopener" target="_blank">computerra.ru</a>.'
  - summary: С 1991 года комплексы «Эльбрус-2» работали в системе противоракетной обороны А-135 вокруг Москвы.
    det:
    - Машина должна была за секунды посчитать путь цели и точку, где её встретит противоракета. Медленный счёт значил бы, что ракета долетит.
    src: 'Источник: «Компьютерра» — <a href="https://old.computerra.ru/hitech/205267/" rel="noopener" target="_blank">computerra.ru</a>.'
  - summary: Центральная часть «Эльбруса-2» весила 48 тонн и занимала 430 квадратных метров.
    det:
    - Это больше полутора теннисных кортов — и всё это ради того, чтобы считать быстрее.
    src: 'Источник: Виртуальный компьютерный музей, «МВК „Эльбрус-1“ и „Эльбрус-2“» — <a href="https://www.computer-museum.ru/histussr/elbrus12.htm" rel="noopener" target="_blank">computer-museum.ru</a>.'
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов об «Эльбрусе»
  h2: Машина, которую не ждали
  udary:
  - summary: <b>«Эльбрус-1» первым в мире среди серийных машин брал в один шаг сразу несколько команд.</b>
    det:
    - В 1978–1979 годах машина сама находила команды, которые не ждут друг друга, и выполняла их вместе. Журнал «Компьютерра» называет её первой в мире коммерческой ЭВМ с таким устройством.
    src: 'Источник: И. Карташев, «„Эльбрус“. История легенды», «Компьютерра» — <a href="https://old.computerra.ru/hitech/205267/" rel="noopener" target="_blank">computerra.ru</a>.'
    otryvok: «Советский суперкомпьютер стал первой в мире коммерческой ЭВМ, использующей суперскалярную архитектуру.»
    stranica: И. Карташев, «„Эльбрус“. История легенды», «Компьютерра»
    href: https://old.computerra.ru/hitech/205267/
    pometka: документ
  - summary: <b>С 1991 года «Эльбрус-2» стерёг небо над Москвой.</b>
    det:
    - Комплексы работали в системе противоракетной обороны А-135 и на других военных объектах.
    src: 'Источник: «Компьютерра» — <a href="https://old.computerra.ru/hitech/205267/" rel="noopener" target="_blank">computerra.ru</a>.'
    otryvok: «Наконец, именно комплексы "Эльбрус-2" с 1991 года использовались в системе противоракетной обороны А-135 и на других военных объектах.»
    stranica: И. Карташев, «„Эльбрус“. История легенды», «Компьютерра»
    href: https://old.computerra.ru/hitech/205267/
    pometka: документ
  - summary: <b>Инженер «Эльбрусов» Владимир Пентковский в 2010 году возглавил лабораторию суперкомпьютеров в МФТИ.</b>
    det:
    - Над «Эльбрусом-1» и «Эльбрусом-2» он работал с 1970 года. 1 декабря 2010 года в МФТИ открылась лаборатория суперкомпьютерных технологий i-SCALARE — её возглавил Пентковский.
    src: 'Источник: программа мегагрантов, «Пентковский Владимир Мстиславович» — <a href="https://megagrant.ru/labs/scientists/scientist_rus_112121/" rel="noopener" target="_blank">megagrant.ru</a>.'
    otryvok: «1 декабря 2010 года в МФТИ была создана Лаборатория суперкомпьютерных технологий для биомедицины, фармакологии и малоразмерных структур, i-SCALARE, которую возглавил В.»
    stranica: Программа мегагрантов, «Пентковский Владимир Мстиславович»
    href: https://megagrant.ru/labs/scientists/scientist_rus_112121/
    pometka: документ
  - summary: <b>Центральная часть «Эльбруса-2» весила 48 тонн и занимала 430 м².</b>
    det:
    - Это больше полутора теннисных кортов — столько места занимала вычислительная часть десятипроцессорного комплекса.
    src: 'Источник: Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/histussr/elbrus12.htm" rel="noopener" target="_blank">computer-museum.ru</a>.'
    otryvok: «Масса центральной вычислительной части 16900 — 48 250 кг.» «Занимаемая площадь 430 м 2 (центральная часть 10-процсссорного комплекса).»
    stranica: Виртуальный компьютерный музей, «МВК „Эльбрус-1“ и „Эльбрус-2“»
    href: https://www.computer-museum.ru/histussr/elbrus12.htm
    pometka: документ
  - summary: <b>От «Эльбруса» требовали 100 миллионов операций в секунду — и задачу перевыполнили.</b>
    det:
    - 'В начале 1970-х Бурцеву поставили цель, которая тогда казалась невыполнимой: машина должна делать 100 миллионов операций в секунду. Самые быстрые советские ЭВМ тех лет делали примерно миллион.'
    - «Эльбрус-2», запущенный в серию в 1985 году, выдавал 125 миллионов операций в секунду. Всего таких комплексов выпустили 30.
    src: 'Источник: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», журнал «Суперкомпьютеры» №6/2011, Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/galglory/burtcev_supercomp.htm" rel="noopener">computer-museum.ru/galglory/burtcev_supercomp.htm</a>.'
    otryvok: '«Перед главным конструктором была поставлена, казалось бы, невыполнимая на тот момент задача: получить быстродействие в 100 млн оп./с.»'
    stranica: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/galglory/burtcev_supercomp.htm
    pometka: документ
  - summary: <b>В год триумфа «Эльбруса-2» его главного конструктора вынудили уйти из института.</b>
    det:
    - 'В 1985 году «Эльбрус-2» наконец пошёл в серию. Всеволод Бурцев уже готовил следующий шаг: новый векторный процессор на 200–300 миллионов операций в секунду. Машина с несколькими такими процессорами могла бы делать больше миллиарда операций в секунду — рекорд для того времени.'
    - Но в том же 1985 году Бурцев был вынужден уйти из ИТМиВТ в другой академический вычислительный центр. Работы над рекордной машиной остановили, и она так и осталась проектом.
    src: 'Источник: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», журнал «Суперкомпьютеры» №6/2011, Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/galglory/burtcev_supercomp.htm" rel="noopener">computer-museum.ru/galglory/burtcev_supercomp.htm</a>.'
    otryvok: «Однако работы по созданию суперкомпьютера были остановлены в связи с тем, что в 1985 году в силу обстоятельств Бурцев был вынужден уйти из института и перейти в Вычислительный центр коллективного пользования АН СССР»
    stranica: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/galglory/burtcev_supercomp.htm
    pometka: документ
  - summary: <b>До «Эльбруса» машины Бурцева помогли с первого раза сбить боеголовку ракеты.</b>
    det:
    - Задолго до «Эльбруса» Всеволод Бурцев строил ЭВМ М-40 и М-50 для системы противоракетной обороны «А». В марте 1961 года на полигоне Сары-Шаган противоракета с первого раза сбила боеголовку баллистической ракеты Р-12.
    - Через десяток лет тот же Бурцев станет главным конструктором «Эльбруса». А в США похожий перехват смогли повторить только через 23 года.
    src: 'Источник: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», журнал «Суперкомпьютеры» №6/2011, Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/galglory/burtcev_supercomp.htm" rel="noopener">computer-museum.ru/galglory/burtcev_supercomp.htm</a>.'
    otryvok: '«Успешные испытания Системы «А» состоялись в марте 1961 года на полигоне Сары-Шаган: противоракета с первого раза сбила боеголовку межконтинентальной баллистической ракеты Р-12.»'
    stranica: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/galglory/burtcev_supercomp.htm
    pometka: документ
  - summary: <b>Бурцев создал первую в мире компьютерную сеть — в 1959 году, на шесть лет раньше США.</b>
    det:
    - 'Для противоракетной обороны Бурцев соединил несколько своих ЭВМ — М-40, М-50 и 5Э92 — в одну сеть. Машины вместе решали одну задачу — поймать ракету — и обменивались данными с объектами, удалёнными на расстояние до 200 километров.'
    - Так в 1959 году впервые в мире заработала компьютерная сеть. В США сеть из трёх компьютеров запустили только в 1965 году.
    src: 'Источник: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», журнал «Суперкомпьютеры» №6/2011, Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/galglory/burtcev_supercomp.htm" rel="noopener">computer-museum.ru/galglory/burtcev_supercomp.htm</a>.'
    otryvok: «Так, в 1959 году впервые в мире была запущена компьютерная сеть, которая с большой временной задержкой была воспроизведена в США. Первая сеть, связавшая по телефонным линиям два компьютера в Массачусетсе и один в Калифорнии, была запущена в 1965 году.»
    stranica: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/galglory/burtcev_supercomp.htm
    pometka: документ
  - summary: <b>«Эльбрус-3» обгонял лучший американский суперкомпьютер вдвое, но в серию так и не пошёл.</b>
    det:
    - Третий «Эльбрус» команда Бориса Бабаяна закончила в 1991 году, в год распада СССР. Машину собрали из старых советских деталей, но благодаря хитрому устройству она могла считать в два раза быстрее, чем самый быстрый американский суперкомпьютер тех лет Cray Y-MP.
    - 'Победа осталась на бумаге: денег на заводской выпуск в новой стране не нашлось, и серийно «Эльбрус-3» так и не начали делать.'
    src: 'Источник: «От «Эльбруса-3» — к «Эльбрусу-2000»», Computerworld Россия (изд-во «Открытые системы»), 20.07.2000 — <a href="https://www.osp.ru/cw/2000/27-28/6016" rel="noopener">osp.ru/cw/2000/27-28/6016</a>.'
    otryvok: «Построенная на устаревшей элементной базе, машина «Эльбрус-3» благодаря совершенству своей архитектуры могла обеспечить в два раза большую скорость обработки данных, чем самый быстрый американский суперкомпьютер тех лет Cray Y-MP.»
    stranica: «От «Эльбруса-3» — к «Эльбрусу-2000»», Computerworld Россия
    href: https://www.osp.ru/cw/2000/27-28/6016
    pometka: документ
  - summary: <b>На образец «Эльбруса-2000» нужно было 40 миллионов долларов — и никто их не дал.</b>
    det:
    - В феврале 1999 года команда Бабаяна закончила проект нового процессора «Эльбрус-2000». По испытаниям компьютеры с ним работали в полтора–три раза быстрее новейших американских.
    - Чтобы сделать хотя бы один настоящий образец, требовалось 40 миллионов долларов. Журнал «Коммерсантъ Власть» тогда писал, что денег Бабаяну никто не даёт, и назвал статью «Процессор не пошёл».
    src: 'Источник: «Процессор не пошёл», журнал «Коммерсантъ Власть» №9, 09.03.1999 — <a href="https://www.kommersant.ru/doc/15245" rel="noopener">kommersant.ru/doc/15245</a>.'
    otryvok: «Однако на изготовление опытного образца "Эльбруса-2000" нужно $40 млн. Но их Бабаяну никто не дает.»
    stranica: «Процессор не пошёл», «Коммерсантъ Власть»
    href: https://www.kommersant.ru/doc/15245
    pometka: документ
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Диссертация, запас и 25 секунд
  udary:
  - summary: '<b>Отвергнутый «Эльбрус» всё-таки родился: в мае 2005 года появился готовый процессор.</b>'
    det:
    - Осенью 2000 года государство снова начало платить за работу над «Эльбрусом». Ещё четыре года ушло на проверку и чертежи, и в мае 2005 года появился настоящий процессор «Эльбрус».
    - За один такт — самый короткий шаг своей работы — он мог выполнить до 23 операций. По словам разработчиков, это почти вдвое больше, чем у других процессоров общего назначения того времени.
    src: 'Источник: Ф. Груздов, В. Волконский, Ю. Сахин, А. Ким, «“Эльбрус” сегодня», журнал «Открытые системы. СУБД» №2, 27.03.2009 — <a href="https://www.osp.ru/os/2009/02/7314081" rel="noopener">osp.ru/os/2009/02/7314081</a>.'
    otryvok: «На доработку и верификацию архитектуры и логики работы, а также на физическое проектирование микропроцессора ушло четыре года – в мае 2005 года был изготовлен первый микропроцессор.»
    stranica: Ф. Груздов и др., «“Эльбрус” сегодня», «Открытые системы»
    href: https://www.osp.ru/os/2009/02/7314081
    pometka: документ
  - summary: <b>Студент, которого заметил Лебедев, через 23 года сменил учителя во главе института.</b>
    det:
    - Академик Сергей Лебедев, создатель знаменитой ЭВМ БЭСМ, заметил талантливого студента Всеволода Бурцева и позвал его строить машину БЭСМ. В 1950 году, ещё студентом, Бурцев стал инженером в лаборатории Лебедева.
    - В 1973 году Лебедев ушёл с поста директора ИТМиВТ, и институт возглавил его ученик Бурцев. Как раз в эти годы там строили «Эльбрус».
    src: 'Источник: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», журнал «Суперкомпьютеры» №6/2011, Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/galglory/burtcev_supercomp.htm" rel="noopener">computer-museum.ru/galglory/burtcev_supercomp.htm</a>.'
    otryvok: «В 1973-м после ухода с поста директора ИТМиВТ академика Лебедева институт возглавил Бурцев.»
    stranica: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/galglory/burtcev_supercomp.htm
    pometka: документ
  - summary: <b>Бурцев защищал диссертацию кандидата — а учёные дали ему сразу степень доктора наук.</b>
    det:
    - 'В 1955 году команда Бурцева построила машины «Диана-1» и «Диана-2»: они следили сразу за десятью самолётами и наводили истребитель на чужой.'
    - На этой работе Бурцев написал диссертацию на звание кандидата наук. Учёный совет решил, что она стоит большего, и присвоил ему сразу степень доктора.
    src: 'Источник: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», журнал «Суперкомпьютеры» №6/2011, Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/galglory/burtcev_supercomp.htm" rel="noopener">computer-museum.ru/galglory/burtcev_supercomp.htm</a>.'
    otryvok: «На основании этой работы Бурцев подготовил кандидатскую диссертацию, которую защитил позже – в 1962 году. Члены ученого совета единодушно пришли к мнению, что уровень диссертации и качество проработки вопроса значительно выше скромных притязаний соискателя, и присвоили ему докторскую степень.»
    stranica: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/galglory/burtcev_supercomp.htm
    pometka: документ
  - summary: <b>«Эльбрусы» считали для ядерных центров и Центра управления космическими полётами.</b>
    det:
    - 'Машины «Эльбрус-2» работали там, где нужны были огромные расчёты: в Центре управления космическими полётами и в секретных ядерных центрах Арзамас-16 (сейчас Саров) и Челябинск-70 (сейчас Снежинск).'
    - Был и упрощённый вариант — «Эльбрус 1-КБ» для обычных расчётов. Его закончили в 1988 году и до 1992 года выпустили 60 машин.
    src: 'Источник: Иван Карташев, «“Эльбрус”. История легенды», «Компьютерра», 01.07.2004 — <a href="https://old.computerra.ru/hitech/205267/" rel="noopener">old.computerra.ru/hitech/205267</a>.'
    otryvok: «Вычислительные комплексы "Эльбрус-2" эксплуатировались в Центре управления космическими полетами, в ядерных исследовательских центрах в Арзамасе-16 и Челябинске-70.»
    stranica: Иван Карташев, «“Эльбрус”. История легенды», «Компьютерра»
    href: https://old.computerra.ru/hitech/205267/
    pometka: документ
  - summary: <b>Сломанный блок в машине противоракетной обороны Бурцева меняли за 25 секунд.</b>
    det:
    - Машины Бурцева для обороны Москвы работали группой из 12 штук, две из них ждали в запасе. Если одна ломалась, запасная включалась за тысячные доли секунды.
    - Программа сама показывала, какой блок сломался, и его меняли за 25 секунд. Это была самая надёжная вычислительная система в стране.
    src: 'Источник: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», журнал «Суперкомпьютеры» №6/2011, Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/galglory/burtcev_supercomp.htm" rel="noopener">computer-museum.ru/galglory/burtcev_supercomp.htm</a>.'
    otryvok: '«А наличие двух резервных машин делало комплекс самой надежной вычислительной системой в стране. К тому же эта ЭВМ имела и уникальную ремонтопригодность: программа мгновенно идентифицировала отказавший узел, на замену которого тратилось 25 секунд.»'
    stranica: Владимир Тучков, «Восхождение на «Эльбрус». Суперкомпьютер академика Бурцева», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/galglory/burtcev_supercomp.htm
    pometka: документ
