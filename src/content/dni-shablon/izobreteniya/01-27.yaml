# 27 января — «Эльбрус». Пересборка r420-27 (Р302/Р304): факты утверждены Р190 (4 из 5; факт об иностранной фирме снят по Р298/Р318), новая игра «Сбей ракету» (Р224).
# Факты 1–4 — Р190.
