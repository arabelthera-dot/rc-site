return:
  q: Сколько весила центральная вычислительная часть «Эльбруса-2»?
  a: Около 48 тонн — и занимала 430 квадратных метров.
  src: Виртуальный компьютерный музей, «МВК „Эльбрус-1“ и „Эльбрус-2“»
audioguide:
  audioSrc: audio-guide-elbrus-ru.mp3
  durationLabel: 3 минуты 3 секунды
  lead: 'Голос ведёт по залу «Эльбруса»: от проспекта 1982 года через щит Москвы и сорок восемь тонн машины к итогу зала.'
  stops:
  - t: 0
    mark: 0:00
    title: Обложка и четыре числа
  - t: 40
    mark: 0:40
    title: По нескольку команд за шаг
  - t: 98
    mark: '1:38'
    title: Щит Москвы
  - t: 112
    mark: '1:52'
    title: Сорок восемь тонн и человек
  - t: 165
    mark: '2:45'
    title: Итог зала
  transcript:
  - "«Здравствуйте. Мы в зале «Эльбруса» — советской вычислительной машины, которая стерегла Москву от ракет. На обложке — подлинный проспект «Эльбрус-2. Многопроцессорный вычислительный комплекс» 1982 года из Музея современной истории России. Под заголовком страницы — четыре числа. Тысяча девятьсот семьдесят восьмой — первый «Эльбрус». Несколько команд за один шаг. Тысяча девятьсот девяносто первый — машины встали в щит Москвы. И сорок восемь тонн — столько весила центральная часть «Эльбруса-2».»"
  - "«Программа для вычислительной машины — это список команд. Обычная машина выполняет их по одной: одна команда — один шаг. «Эльбрус-1» в 1978–1979 годах умел брать в один шаг сразу несколько команд, если они не ждут друг друга. И находила такие команды сама машина, на ходу. Журнал «Компьютерра» называет советский суперкомпьютер первой в мире коммерческой машиной с таким устройством.»"
  - "««Эльбрус-2» выпускали с 1985 года. С 1991 года эти комплексы работали в системе противоракетной обороны А-135 вокруг Москвы. Машина должна была за секунды посчитать путь цели и точку, где её встретит противоракета. Здесь медленный счёт значил бы, что ракета долетит.»"
  - "«Центральная вычислительная часть «Эльбруса-2» весила сорок восемь тонн и занимала четыреста тридцать квадратных метров — больше полутора теннисных кортов. Над «Эльбрусом-1» и «Эльбрусом-2» с 1970 года работал инженер Владимир Пентковский. Он участвовал и в создании языка программирования Эль-76. А 1 декабря 2010 года в Московском физико-техническом институте открылась лаборатория суперкомпьютерных технологий, которую возглавил Пентковский.»"
  - "«Вот и весь зал. Машина брала в один шаг несколько команд сразу, весила сорок восемь тонн и с 1991 года стерегла небо над Москвой. Ответьте на два вопроса викторины — и загляните в календарь: в каждом дне года своё русское первенство.»"
  note: Озвучено синтезом речи.
