audioguide:
  audioSrc: audio-guide-pochvovedenie-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу почвоведения: от пешего пути по чернозёму через Париж и Сорбонну к лесополосам, которые растут до сих пор.'
  stops:
  - t: 0
    mark: '0:00'
    title: Десять тысяч вёрст пешком
  - t: 12
    mark: '0:12'
    title: Живое тело земли
  - t: 28
    mark: '0:28'
    title: Чернозём в Париже
  - t: 42
    mark: '0:42'
    title: Лесополосы в степи
  transcript:
  - Для книги «Русский чернозём» Василий Докучаев прошёл десять тысяч вёрст за два лета, большей частью пешком. Оппонентом его докторской был Менделеев — и встал на его сторону целиком.
  - Докучаев доказал, что чернозём — живое тело со своей историей. В тысяча восемьсот восемьдесят шестом году появилась первая в мире классификация почв по происхождению — русская. «Дороже нефти, угля и золота» — так Докучаев оценил русский чернозём.
  - Русский чернозём в Париже увидели тридцать два миллиона человек, Европа назвала его «чёрным бриллиантом». Кубометры русского чернозёма стояли в Сорбонне шестьдесят восемь лет — разбили только студенты в тысяча девятьсот шестьдесят восьмом году.
  - После голода тысяча восемьсот девяносто первого года Докучаев написал первую в мире книгу об экологическом кризисе степей. Сорок семь лесополос Докучаева тысяча восемьсот девяносто второго года растут до сих пор — в степи, где гибли хлеба.
  note: Озвучено синтезом речи.
