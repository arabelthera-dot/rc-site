audioguide:
  audioSrc: audio-guide-znamya-2-ru.mp3
  durationLabel: около полутора минут
  lead: 'Голос ведёт по залу «Знамени-2»: от зеркала, раскрытого без каркаса, через пятно света над Европой к второму зеркалу 1999 года.'
  stops:
  - t: 0
    mark: 0:00
    title: Зеркало без каркаса
  - t: 31
    mark: 0:31
    title: Пятно света над Европой
  - t: 56
    mark: 0:56
    title: Помятая плёнка и второе зеркало
  transcript:
  - 'Здравствуйте. Мы в зале «Знамени-2». Четвёртое февраля тысяча девятьсот девяносто третьего года. «Знамя-2» — русское зеркало в космосе — впервые в мире зажгло ночь над Европой. Раскрытие зеркала нельзя было проверить на Земле — узнали, сработает ли, только на орбите. Без каркаса: барабан крутился, и плёнку растянула центробежная сила. Двадцатиметровое зеркало раскрылось в космосе за три минуты. Парус в двадцать метров шириной весил всего четыре килограмма.'
  - 'Пятно света шириной пять километров, яркое, как полная Луна, ночью пробежало по Европе до Белоруссии. «Солнечный зайчик» мчался по Земле со скоростью восемь километров в секунду. Тучи закрыли пол-Европы, а вспышку из космоса всё равно увидели. Немецкие метеорологи сами замерили наш «зайчик»: ярок, как полная Луна. Уже отстреленное, зеркало ещё два витка сияло в небе над Канадой.'
  - 'Сыромятников успехом был недоволен: зеркало вышло «как помятая плёнка». Следующим шагом Падалка должен был водить луч по Земле, поворачивая весь корабль с пульта на «Мире». Ровно через шесть лет, четвёртого февраля тысяча девятьсот девяносто девятого года, второе зеркало зацепилось за антенну своего же корабля. Опыт описали сами разработчики в научном журнале «Космические исследования», в тысяча девятьсот девяносто четвёртом году. НАСА признало: первый в мире солнечный парус в космосе раскрыли русские, в тысяча девятьсот девяносто третьем году. Ниже — игра, викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
