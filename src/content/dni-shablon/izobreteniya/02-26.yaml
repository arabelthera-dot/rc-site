igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чьё это число
  pravilo_ru: 'Что сделать сейчас: выбери число и нажми на то, что оно значит.'
  kak_igrat:
    zachem: 'У каждого числа из истории каучука Лебедева — своё место: килограммы, километры и проценты.'
    shagi:
    - Выбери число — кнопка загорится золотом.
    - Нажми на то, что оно значит. Верный выбор загорится зелёным.
    - Расставь все четыре числа — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все четыре числа на месте — +20 баллов.
  dannye:
    mesta:
    - kod: konkurs
      nazvanie: Столько каучука надо было сдать к 1 января 1928 года
      verno_ru: Два килограмма каучука надо было сдать до полуночи 1 января 1928 года — Лебедев успел
    - kod: kartofel
      nazvanie: Столько картофеля уходило на одну шину
      verno_ru: На одну автомобильную шину уходило 500 кг отборного картофеля
    - kod: probeg
      nazvanie: Столько прошла первая шина на машине Лебедева
      verno_ru: Первую шину из нашего каучука надели на машину самого Лебедева — она прошла 16 070 км
    - kod: vyhod
      nazvanie: Такой выход насчитала экспертиза
      verno_ru: Лебедев обещал выход 20 %, экспертиза насчитала 22 % — сделал больше, чем заявил
    podpisi:
    - kod: n2
      tekst: 2 кг
      mesto: konkurs
      mimo_ru: 2 килограмма — столько каучука надо было сдать на конкурс.
    - kod: n500
      tekst: 500 кг
      mesto: kartofel
      mimo_ru: 500 килограммов — столько картофеля уходило на одну шину.
    - kod: n16070
      tekst: 16 070 км
      mesto: probeg
      mimo_ru: 16 070 километров — столько прошла первая шина.
    - kod: n22
      tekst: 22 %
      mesto: vyhod
      mimo_ru: 22 % — такой выход насчитала экспертиза.
    vyberi_ru: Сначала выбери число, потом его место.
    mimo_ru: Не то место — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все числа на месте — 2 килограмма к полуночи, 500 килограммов картофеля, 16 070 километров и 22 процента.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: 2 кг — каучук на конкурс, 500 кг — картофель на одну шину, 16 070 км — пробег первой шины, 22 % — выход по экспертизе.'
