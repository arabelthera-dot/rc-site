audioguide:
  audioSrc: audio-guide-kauchuk-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу каучука Лебедева: от двух килограммов к полуночи через шину со справкой к первому в мире заводу.'
  stops:
  - t: 0
    mark: 0:00
    title: «Невозможно»
  - t: 35
    mark: 0:35
    title: Гонка до полуночи
  - t: 70
    mark: '1:10'
    title: Шина со справкой
  - t: 105
    mark: '1:45'
    title: Завод за год
  transcript:
  - 'Эдисон говорил: синтетический каучук невозможен, вести из Советов — ложь. А первый в мире завод — у нас. Своих колоний с гевеей у нас не было — Лебедев сделал каучук из спирта.'
  - Два килограмма каучука надо было сдать до полуночи 1 января 1928 года — Лебедев успел. Восемь человек работали с 9 утра до 11 вечера, без выходных и без зарплаты — и обогнали мир. Условий конкурса не выдержал ни один образец лабораторий мира — премию получил один Лебедев.
  - Первую шину из синтетического каучука несли по городу со справкой, что она не краденая. Её надели на машину самого Лебедева — она прошла 16 070 километров.
  - 'Ярославский завод подняли за одиннадцать с половиной месяцев — 500 комсомольцев с лопатами и тачками. За неполный год у нас пошли три завода синтетического каучука: Ярославль, Воронеж, Ефремов.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
