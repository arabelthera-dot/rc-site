igra:
  imya: podnyat-motor
  css:
    - igra-podnyat-motor
  model3d:
    glb: modeli/kostovich-motor.glb
    h2: "Мотор Костовича в объёме — поверни и загляни в цилиндр"
    lead: "Первый в мире бензиновый двигатель для полёта: до 80 лошадиных сил при 240 килограммах. Один цилиндр в модели вскрыт — видно поршень и шатун. Нажимай на части под сценой."
    alt: "Трёхмерная модель восьмицилиндрового двигателя Костовича на музейном постаменте: латунные цилиндры, коленчатый вал, маховик, тяги. Поворачивается пальцем или мышью"
    razmer: около 1,0 МБ
    pravila:
      - "Веди пальцем или мышью по мотору влево-вправо — он повернётся."
      - "Найди вскрытый цилиндр — внутри видно поршень и шатун."
      - "Нажимай на части под сценой — цилиндры, зажигание, коленчатый вал — и читай факт о каждой."
    chasti:
      - uzel: cilindry
        nazvanie: "Восемь бронзовых цилиндров"
        fakt: "Восемь цилиндров лежат двумя четвёрками навстречу друг другу. Цилиндры бронзовые, охлаждение водяное."
      - uzel: porshen-v-razreze
        nazvanie: "Встречные поршни"
        fakt: "Поршни бронзовые и ходят навстречу друг другу. По «Российской авиации», встречное движение поршней Костович первым в мире применил на двигателе внутреннего сгорания."
      - uzel: zazhiganie
        nazvanie: "Электрическое зажигание"
        fakt: "Смесь поджигает электрический ток низкого напряжения. «Российская авиация» пишет, что электрическое зажигание на двигателе внутреннего сгорания Костович применил первым в мире."
      - uzel: karbyurator
        nazvanie: "Карбюратор и впускные патрубки"
        fakt: "Костович жёг в цилиндрах не газ, а пары бензина — лёгкое жидкое топливо превращается в горючую смесь в карбюраторе. К впускным клапанам смесь идёт по четырём патрубкам."
      - uzel: kolenval
        nazvanie: "Коленчатый вал"
        fakt: "Коленчатый вал и шатуны стальные. Коленвал заказали в Германии и дорабатывали в собственной мастерской, чтобы привести «в надлежащую точность»."
      - uzel: koromysla-i-tyagi
        nazvanie: "Коромысла и тяги клапанов"
        fakt: "Коромысла стальные, как коленчатый вал и шатуны. Смазка — из маслёнок."
      - uzel: mahovik
        nazvanie: "Маховик"
        fakt: "Большой маховик выравнивает ход мотора. Весь мотор давал до 80 лошадиных сил при массе 240 килограммов — три килограмма на каждую силу."
      - uzel: stanina
        nazvanie: "Чугунная станина"
        fakt: "К 1884 году Костович создал первый в мире бензиновый двигатель для полёта — для дирижабля «Россия». С 1977 года мотор хранится в Центральном музее ВВС в Монино, в зале № 1."
