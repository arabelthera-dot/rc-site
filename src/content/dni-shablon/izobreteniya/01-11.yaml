story:
  kicker: История изобретения · 11 ударов
  h2: Мотор, который строили для неба
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Серб Огнеслав Костович воевал за Россию на Дунае, а после войны, в 27 лет, остался в Петербурге.
      det:
        - Костович родился в 1851 году, в юности жил в Пеште, водил каботажные суда торгового флота. В русско-турецкую войну 1877–1878 годов он примкнул к русской армии, принял российское подданство и командовал пароходом Дунайской флотилии.
        - После войны, сопровождая имущество морского ведомства, 27-летний капитан оказался в Петербурге и увлёкся летательными аппаратами.
      src: "Источники: Центральный музей ВВС, «Двигатель Костовича»; А. Ф. Ткаченко, «Морской биографический словарь» (по публикации Международной военно-исторической ассоциации)."
    - summary: "В декабре 1879 года он взялся за управляемый аэростат: гондола, машина и баллон — одна жёсткая система."
      det:
        - Проект одобрили и назвали «Дирижабль „Россия“». На постройку собрали паевое товарищество; его поддержали Д. И. Менделеев и М. А. Рыкачёв. 8 августа 1882 года на Охтинской верфи в Петербурге начали строить корабль.
        - О самом дирижабле — отдельный день нашего календаря, 29 января. Здесь — его сердце, мотор.
      src: "Источники: Центральный музей ВВС; «Российская авиация», «Дирижабль „Россия“ (проект О. С. Костовича)»."
    - summary: "Паровая машина для неба не годилась: ей нужны котёл и запас угля, а это лишние сотни килограммов."
      det:
        - "До Костовича воздухоплавание знало только паровые машины. Костович отказался ставить пар на дирижабль: слишком много места уходило бы под уголь, котёл и машину, и корабль пришлось бы делать больше."
      src: "Источники: М. И. Левин, «Машина-двигатель. От водяного колеса до атомного двигателя», глава «Капитан русского флота Костович и его двигатель»; «Российская авиация»."
    - summary: "Газовый двигатель Отто тоже не подходил: светильный газ пришлось бы возить на борту в баллонах."
      det:
        - "Двигатель Отто на заводе берёт газ из трубы. В полёте трубы нет: газ везут с собой в баллонах, а баллоны занимают место и весят."
      src: "Источник: М. И. Левин, «Машина-двигатель»."
    - summary: Костович решил жечь в цилиндрах не газ, а пары жидкого топлива — бензина.
      find: true
      tag: Находка дня
      det:
        - "Цикл тот же, что у Отто, — четыре такта. Новое — топливо: лёгкое жидкое, которое занимает мало места и превращается в горючую смесь в карбюраторе. Работать над мотором Костович начал в 1879 году, в 1880-м собрал уменьшенную модель с двумя цилиндрами и поставил её на катер своей конструкции."
        - "Попробуй сам в модели ниже: чем крутить винт дирижабля."
      src: "Источники: Центральный музей ВВС; «Российская авиация», «Двигатель внутреннего сгорания для дирижабля О. С. Костовича»."
    - summary: Восемь цилиндров лежат двумя четвёрками навстречу друг другу, смесь поджигает электрический ток.
      det:
        - Цилиндры и поршни бронзовые, коленчатый вал, шатуны и коромысла стальные. Смесь из карбюратора идёт к впускным клапанам по четырём патрубкам. Зажигание электрическое, током низкого напряжения. Охлаждение водяное, смазка — из маслёнок. Большой маховик выравнивает ход.
        - "«Российская авиация» пишет: электрическое зажигание и встречное движение поршней Костович первым в мире применил на двигателе внутреннего сгорания."
      src: "Источники: Центральный музей ВВС; «Российская авиация»."
    - summary: "К 1884 году Костович создал первый в мире бензиновый двигатель для полёта: до 80 лошадиных сил при 240 килограммах — три килограмма на каждую силу."
      det:
        - Испытания и доводка шли до 1885 года. Центральный музей ВВС даёт мощность 60–80 лошадиных сил и называет 1883 год; «Российская авиация» — 80 сил и 1884 год. Масса у обоих — 240 килограммов.
        - "Для сравнения: моторы первого немецкого жёсткого дирижабля LZ-1 (1900) давали всего 14 сил и весили 420 килограммов — 30 килограммов на силу, в десять раз тяжелее."
      src: "Источники: Центральный музей ВВС; «Российская авиация» (оба материала)."
    - summary: Через год, в 1885-м, Даймлер запатентовал мотоцикл. Его мотор давал половину лошадиной силы.
      det:
        - "29 августа 1885 года Готлиб Даймлер получил немецкий патент на мотоцикл: деревянная рама, одноцилиндровый мотор в 0,5 л. с., скорость до 12 км/ч. 10 ноября 1885 года на нём проехал сын изобретателя."
        - Выходит, мотор Костовича давал до 80 лошадиных сил, когда у первого мотоцикла Даймлера было полсилы.
        - 29 января 1886 года Карл Бенц получил патент на трёхколёсную моторную повозку — её признают первым автомобилем.
      src: "Источники: Мотоциклетная федерация России, «29 августа — день рождения первого мотоцикла»; «Парламентская газета», 29.08.2019; «Коммерсантъ», «День рождения автомобиля», 2026."
    - summary: Заявку на привилегию Костович подал в 1888 году. Патенты США и Англии пришли раньше русского — его выдали в 1892-м.
      det:
        - 14 мая 1888 года (по старому стилю) Костович просил Департамент торговли и мануфактур о десятилетней привилегии на «усовершенствованный двигатель, действующий бензином, керосином, нефтяным, светильным и другими газами и взрывчатыми веществами». Привилегию выдали 4 ноября 1892 года — через четыре с половиной года.
      src: "Источники: Большая советская энциклопедия, «Костович»; «Российская авиация»."
    - summary: "Дирижабль «Россия» так и не взлетел: денег на постройку не хватило. Мотор остался без неба."
      det:
        - "После неудачи с дирижаблем Костович пытался выпускать свои двигатели как стационарные: в 1890-х один такой мотор в 64 силы работал на его заводе в Рыбацком. Широкого распространения мотор не получил."
      src: "Источники: Большая советская энциклопедия; Центральный музей ВВС; «Российская авиация»."
    - summary: Мотор засекретили. До 1947 года он простоял на заводе при Охтинской верфи, теперь его видно в Монино.
      det:
        - Двигатель хранился в помещениях ремонтного завода при Охтинской судоверфи, затем в Доме авиации в Москве. В 1977 году он поступил в Центральный музей ВВС и стоит в зале № 1. В 1965 году сделали два макета, которые показывали посетителям, как работает мотор.
      src: "Источники: Центральный музей ВВС; «Российская авиация»; М. И. Левин, «Машина-двигатель»."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Костовиче
    h2: Факты дня
    udary:
      - summary: <b>Первую в мире фанеру Костович создал для неба — чтобы построить лёгкий и прочный дирижабль.</b>
        det:
          - Чтобы построить лёгкий и прочный дирижабль, Костович изобрёл новый материал и назвал его «арборит».
          - "Дирижаблю нужен был материал одновременно лёгкий и прочный. Большая советская энциклопедия пишет, что в начале 1880-х годов Костович изобрёл «арборит» — фанеру высокой прочности. Центральный музей ВВС добавляет: технологию производства Костович разработал сам, материал запатентовал и пустил на каркас дирижабля."
          - По данным «Российской авиации», из арборита сделали весь каркас и самую крупную деталь корабля — вал, который передавал вращение от мотора к винту. Это была труба диаметром 0,2 метра и длиной около 30 метров. «Российская авиация» считает, что в историю Костович вошёл прежде всего как изобретатель фанеры.
        src: "Источник: «Костович Огнеслав (Игнатий) Степанович», Большая советская энциклопедия — https://www.booksite.ru/fulltext/1/001/008/065/241.htm ; «Двигатель Костовича», Центральный музей ВВС — https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449 ; «Дирижабль „Россия“ (проект О. С. Костовича)», «Российская авиация» — http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/"
        otryvok: «в начале 1880-х гг. изобрёл «арборит» — фанеру высокой прочности.» (Большая советская энциклопедия). — «Для конструкции дирижабля нужен был легкий и прочный материал. Костович успешно решил эту задачу — открыл совершенно новый материал арборит (фанеру), разработал технологию его производства, запатентовал и применил для каркаса и других частей дирижабля.» (Центральный музей ВВС).
        stranica: «Костович Огнеслав (Игнатий) Степанович» // Большая советская энциклопедия, 3-е изд. (booksite.ru) ; «Двигатель Костовича» // Центральный музей ВВС (Монино), раздел «Экспозиция — Двигатели»; второй источник — https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&id=449
        href: https://www.booksite.ru/fulltext/1/001/008/065/241.htm
        pometka: два источника
      - summary: <b>Сначала дирижабль «Россия» должен был махать крыльями, как орёл.</b>
        det:
          - В первом проекте дирижабль напоминал орла.
          - "В 1882 году Костович показал проект Русскому воздухоплавательному обществу. Аэростат в форме сигары он предлагал снабдить машущими крыльями. Современники писали, что корабль похож на птицу: хвост и крылья соотносятся с корпусом так же, как у орла."
          - Чертежи несколько лет переделывали. В последнем варианте Костович отказался от крыльев. Остался жёсткий дирижабль объёмом пять тысяч кубометров, а двигал его винт от мотора.
        src: "Источник: «Дирижабль „Россия“ (проект О. С. Костовича)», «Российская авиация» — http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/"
        otryvok: «В 1882 году Русскому воздухоплавательному обществу был представлен проект дирижабля «РОССИЯ» — на тот момент наиболее законченный и проработанный в русской истории воздухоплавания. Автор проекта – капитан Костович – предлагал соорудить аэростат сигарообразной формы и снабдить его машущими крыльями.» («Российская авиация»). — «По отзывам современников «…корабль имеет вид птицы, размеры хвоста и крыльев которой находятся к её корпусу в том же соотношении, что и у орла.»» («Российская авиация»).
        stranica: «Дирижабль „Россия“ (проект О. С. Костовича)» // «Российская авиация» (авиару.рф), 2017
        href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/
        pometka: документ
      - summary: <b>Ещё до мотора Костович создал скафандр, в котором можно шесть часов работать под водой.</b>
        det:
          - Ещё до мотора Костович придумал скафандр, которому не нужна связь с поверхностью.
          - В 1881 году Костович сконструировал автономный скафандр. Водолаз мог пробыть в нём под водой шесть часов, никак не сообщаясь с поверхностью моря.
          - Об этом пишет «Морской биографический словарь» А. Ф. Ткаченко. Скафандр появился за год до того, как в Петербурге заложили дирижабль «Россия».
        src: "Источник: «Костович Огнеслав Степанович», Международная военно-историческая ассоциация (по «Морскому биографическому словарю» А. Ф. Ткаченко, 2008) — https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html"
        otryvok: «В 1881 г. сконструировал автономный скафандр, позволявший водолазу находиться под водой 6 часов без сообщения с поверхностью моря.»
        stranica: "«Костович Огнеслав Степанович» // Международная военно-историческая ассоциация; по: Ткаченко А. Ф. Морской биографический словарь. Луганск: Шико, 2008, с. 488"
        href: https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html
        pometka: документ
      - summary: <b>Свой мотор Костович дважды предлагал флоту и для подводной лодки.</b>
        det:
          - Свою субмарину с двигателем внутреннего сгорания Костович предлагал флоту дважды.
          - В 1878 году, сразу после войны, Костович разработал проект подводной лодки с двигателем внутреннего сгорания. В 1880 году он второй раз представил его Морскому ведомству. В том же году прошла испытания маленькая двухцилиндровая модель его мотора.
          - "Удачные испытания убедили изобретателя, что мощный мотор можно построить и для дирижабля, и для подводной лодки. Морскую тему он не оставил и позже: перед Первой мировой войной он первым предложил размещать торпеды внутри подводной лодки."
        src: "Источник: «Двигатель внутреннего сгорания для дирижабля О. С. Костовича», «Российская авиация» — http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/ ; «Костович Огнеслав Степанович», Международная военно-историческая ассоциация (по «Морскому биографическому словарю» А. Ф. Ткаченко) — https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html"
        otryvok: «В 1878 г. разработал проект подводной лодки с двигателем внутреннего сгорания.» (МВИА, по Ткаченко). — «В 1880 году Костович изготовил уменьшенную модель двигателя с двумя цилиндрами. Успешные испытания дали уверенность в возможности создания более мощного мотора для дирижабля и для подводной лодки, проект которой он вторично представил Морскому ведомству в том же году» («Российская авиация»).
        stranica: "«Костович Огнеслав Степанович» // Международная военно-историческая ассоциация; по: Ткаченко А. Ф. Морской биографический словарь. Луганск: Шико, 2008, с. 488 ; «Двигатель внутреннего сгорания для дирижабля О. С. Костовича» // «Российская авиация» (авиару.рф); второй источник — http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/"
        href: https://imha.ru/1144548367-kostovich-ogneslav-stepanovich.html
        pometka: два источника
      - summary: <b>Строить корабль за границей Костович отказался — но коленвал пришлось заказать в Германии.</b>
        det:
          - Строить корабль за границей Костович отказался, однако часть деталей пришлось заказать в Германии.
          - Костовичу предлагали построить дирижабль за границей. Он отказался и объявил в печати, что корабль будут строить руками только русских рабочих.
          - "Но некоторые детали всё же заказали в Германии: коленчатый вал, цилиндры, запально-клапанные коробки, фрикционный шкив. Их приходилось дорабатывать в собственной мастерской, чтобы привести «в надлежащую точность»."
        src: "Источник: «Дирижабль „Россия“ (проект О. С. Костовича)», «Российская авиация» — http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/"
        otryvok: «Костович решительно отказался от предложений выполнять эту работу за границей и объявил в печати, что воздушный корабль будет строиться руками только русских рабочих.» («Российская авиация»). — «Заказанные в Германии детали, например коленчатый вал, цилиндры, запально-клапанные коробки, фрикционный шкив, приходилось дорабатывать в собственной мастерской, приводя их «в надлежащую точность».» («Российская авиация»).
        stranica: «Дирижабль „Россия“ (проект О. С. Костовича)» // «Российская авиация» (авиару.рф), 2017
        href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/
        pometka: документ
      - summary: <b>Костович первым в мире дал самолёту «жабры» — крылышки, что не давали лодке опрокинуться.</b>
        det:
          - крылышки по ватерлинии не давали лодке его аэрогидроплана опрокинуться на воде.
          - В 1911 году Костович получил привилегию на две схемы самолётов — сухопутный триплан и аэрогидроплан. Лодку аэрогидроплана, лонжероны крыльев и другие части сделали из арборита.
          - Гребных колёс, которые были в схеме, Костович строить не стал. Вместо них он поставил на лодку по ватерлинии водонепроницаемые крылышки поперечной остойчивости. «Российская газета» пишет, что такие «жабры», как их теперь называют, сделали впервые в мире.
        src: "Источник: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html"
        otryvok: «В аэрогидроплане был широко применен арборит, из которого была сделана лодка, лонжероны крыльев и другие части. При его постройке никаких гребных колес Костович не делал, а снабдил лодку по ватерлинии водонепроницаемыми крылышками поперечной остойчивости - "жабрами”, как их теперь называют, сделанными впервые в мире.»
        stranica: «Пять самых важных изобретений Огнеслава Костовича» // «Российская газета», 30.12.2013
        href: https://rg.ru/2013/12/30/kostovich-site.html
        pometka: документ
      - summary: <b>Двенадцать торпед из одной трубы — так Костович вооружил свою «рыбу-лодку» в 1878 году.</b>
        det:
          - в нос «рыбы-лодки» 1878 года Костович поставил метательную трубу, а винт отдал рукам двух моряков.
          - Проект «рыбы-лодки» Костович составил в 1878 году. Субмарина на восемь человек шла под одним гребным винтом, который приводили в движение два моряка.
          - В носу стояла «метательная труба» — прообраз торпедного аппарата. Из неё сжатым воздухом по очереди выпускали 12 торпед, и тем же сжатым воздухом дышала команда.
          - Проект критиковали прежде всего за то, что лодке не хватало мощного двигателя. Костович взял его на доработку и всерьёз занялся двигателями.
        src: "Источник: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html"
        otryvok: «Проект "рыбы-лодки" Костовича появился в 1878 году. Субмарина на 8 человек была с одним гребным винтом, приводимым в движение двумя моряками. В носовой части располагалась "метательная труба", прообраз торпедного аппарата, для поочередного пуска 12 торпед с помощью сжатого воздуха, используемого и для дыхания команды.»
        stranica: «Пять самых важных изобретений Огнеслава Костовича» // «Российская газета», 30.12.2013
        href: https://rg.ru/2013/12/30/kostovich-site.html
        pometka: документ
      - summary: <b>Из своей фанеры Костович делал даже разборные домики, бочки и чемоданы.</b>
        det:
          - его завод «Арборит» под Петербургом выпускал ещё бочки, сундуки и чемоданы.
          - Свой материал Костович называл «арборитом» и под Петербургом построил завод с тем же названием.
          - "Главной продукцией завода были изделия из арборита: бочки для вина и керосина, ящики, сундуки, чемоданы, строительные детали и даже фанерные разборные домики."
        src: "Источник: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html"
        otryvok: '«Костович называл свой материал "арборитом" и даже построил одноименный завод под Петербургом. Основной его продукцией были изделия из арборита: бочки для вина и керосина, ящики, сундуки, чемоданы, строительные детали и даже фанерные разборные домики.»'
        stranica: «Пять самых важных изобретений Огнеслава Костовича» // «Российская газета», 30.12.2013
        href: https://rg.ru/2013/12/30/kostovich-site.html
        pometka: документ
      - summary: <b>Костович изобрёл клей, который спасал фанеру от гнили, — но рецепт его потерян.</b>
        det:
          - его «клей-цемент» защищал фанеру от гнили и сырости, но как его делать, до нас не дошло.
          - "Листы арборита — не меньше трёх, с перекрещёнными волокнами — Костович склеивал «клеем-цементом» собственного изобретения. Клей не только скреплял листы, но и проникал во все поры распаренной древесины: арборит не гнил и не боялся влаги."
          - "«Российская газета» отмечает: рецепт клея-цемента не дошёл до нас."
        src: "Источник: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html"
        otryvok: «Склеивание листов он производил им же изобретенным "клеем-цементом”. Этот клей не только скреплял листы, но и проникал во все поры распаренной древесины, делая арборит не поддающимся гниению, не восприимчивым к атмосферной влаге и потому постоянным в массе. Рецепт клея-цемента не дошел до нас.»
        stranica: «Пять самых важных изобретений Огнеслава Костовича» // «Российская газета», 30.12.2013
        href: https://rg.ru/2013/12/30/kostovich-site.html
        pometka: документ
      - summary: <b>Летающую модель вертолёта Костович показал ещё в 1879 году.</b>
        det:
          - — вместе с моделями самолёта и махолёта.
          - В 1879 году Костович продемонстрировал летающие модели вертолёта, самолёта и орнитоптера — махолёта, который держится в воздухе взмахами крыльев. В 1881 году он начал строить самолёт в натуральную величину.
          - Центральный музей ВВС пишет, что моделями орнитоптера, планера и самолёта Костович увлёкся вскоре после переезда в Петербург и лишь потом решил отдать свой талант воздухоплаванию.
          - Самолёт так и не достроили. «Российская газета» объясняет это тем, что бензиновый двигатель Костовича оказался для него недостаточно мощным и слишком громоздким.
        src: "Источник: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 30.12.2013 — https://rg.ru/2013/12/30/kostovich-site.html ; «Двигатель Костовича», Центральный музей ВВС — https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&amp;id=449"
        otryvok: «В 1879 году Костович продемонстрировал свои летающие модели вертолета, самолета и орнитоптера, а в 1881 году приступил к постройке самолета в натуральную величину.» («Российская газета»). — «Обладая изобретательскими способностями, он увлекся моделями орнитоптера, планера и самолета.» (Центральный музей ВВС).
        stranica: «Пять самых важных изобретений Огнеслава Костовича» // «Российская газета», 30.12.2013 ; «Двигатель Костовича» // Центральный музей ВВС (Монино), раздел «Экспозиция — Двигатели»; второй источник — https://cmvvs.ru/ekspozitsiya/dvigateli.html?view=article&id=449
        href: https://rg.ru/2013/12/30/kostovich-site.html
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Катер, заводы и последняя летающая лодка
    udary:
      - summary: "<b>Казна не выкупила дирижабль: комиссия нашла у него «весьма гадательное военное значение».</b>"
        det:
          - «весьма гадательное военное значение».
          - Денег на сборку не дали, кредиторы и акционеры требовали вернуть паи — и Костович предложил Военно-инженерному ведомству выкупить у него дирижабль со всеми правами.
          - "В 1890 году комиссия Главного инженерного управления сочла расходы в 410 тысяч рублей несвоевременными: «гигантский управляемый аэростат… представляет собой весьма гадательное военное значение»."
          - Заодно комиссия напомнила, что право на изобретение и так принадлежит Военному министерству по контракту, который Костович заключил с Главным инженерным управлением 25 июля 1886 года. Первый дирижабль так и не собрали.
        src: "Источник: «Дирижабль „Россия“ (проект О. С. Костовича)», «Российская авиация» — http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/"
        otryvok: «В 1890 году комиссия Главного инженерного управления сочла связанные с этим расходы в размере 410 тыс. руб. несвоевременными и высказалась против, мотивируя свой отказ тем, что «…гигантский управляемый аэростат … представляет собой весьма гадательное военное значение».»
        stranica: «Дирижабль „Россия“ (проект О. С. Костовича)» // «Российская авиация» (авиару.рф), 2017
        href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/airplanes/rossijskaya-imperiya/dirizhabli-rossijskoj-imperii/dirizhabl-rossiya-proekt-o-s-kostovicha/
        pometka: документ
      - summary: <b>Свой бензиновый мотор Костович сначала проверил не в небе, а на воде — на собственном катере.</b>
        det:
          - "В 1880 году Костович сделал маленькую модель мотора всего с двумя цилиндрами. Она заработала, и изобретатель понял: можно строить мотор помощнее — и для дирижабля, и для подводной лодки."
          - В начале 1881 года он поставил этот двухцилиндровый моторчик на катер, который построил сам. Испытание удалось, и из четырёх таких моторов Костович собрал большой восьмицилиндровый — тот, что делали для «России».
        src: 'Источник: «Двигатель внутреннего сгорания для дирижабля О.С.Костовича», «Российская авиация» (Авиамузей) — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/" rel="noopener">авиару.рф/aviamuseum/…/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/</a>; «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener">rg.ru/2013/12/30/kostovich-site.html</a>.'
        otryvok: «в начале следующего установил двухцилиндровый движок на катер собственной конструкции. Проба новинки позволила сконструировать комбинацию из четырех таких моторов»
        stranica: «Двигатель внутреннего сгорания для дирижабля О.С.Костовича», «Российская авиация» (Авиамузей)
        href: http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/
        pometka: два источника
      - summary: <b>Дирижабль не взлетел, и Костович пустил свои моторы на заводы — один давал 64 лошадиные силы.</b>
        det:
          - Когда казённые деньги на дирижабль кончились, Костович не сдался. Он решил делать свои моторы не для неба, а для земли — стационарные, которые стоят на месте и крутят машины.
          - В 1890-х годах такой мотор силой 64 лошадиные силы работал на его собственном заводе в Рыбацком под Петербургом, несколько моторов поменьше строили по заказам. Но широко мотор так и не разошёлся.
        src: 'Источник: «Двигатель для дирижабля «Россия»», журнал «Воздухоплаватель» — <a href="http://ballooning-magazine.ru/91" rel="noopener">ballooning-magazine.ru/91</a>; «Двигатель внутреннего сгорания для дирижабля О.С.Костовича», «Российская авиация» (Авиамузей) — <a href="http://xn--80aafy5bs.xn--p1ai/aviamuseum/dvigateli-i-vooruzhenie/aviamotorostroenie/aviamotory-rossijskoj-imperii/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/" rel="noopener">авиару.рф/aviamuseum/…/dvigatel-vnutrennego-sgoraniya-dlya-dirizhablya-o-s-kostovicha/</a>.'
        otryvok: «Известно, что в 90-х гг. один из них мощностью в 64 л.с. работал на заводе О.С.Костовича в Рыбацком. Кроме того, несколько двигателей меньшей мощности строились по заказам. Но широкого распространения двигатель не получил.»
        stranica: «Двигатель для дирижабля «Россия»», журнал «Воздухоплаватель»
        href: http://ballooning-magazine.ru/91
        pometka: два источника
      - summary: <b>В 1881 году Костович взялся строить самолёт в полный рост — уже не модель, а машину для человека.</b>
        det:
          - В 1879 году Костович показывал летающие модели вертолёта, самолёта и махолёта. А в 1881 году он начал строить самолёт уже в натуральную величину — такой, чтобы в нём мог лететь человек.
          - Довести постройку до конца не удалось. Скорее всего, его бензиновый мотор для самолёта оказался слишком слабым и слишком громоздким. Но мечту о самолёте Костович не бросил и вернулся к ней через тридцать лет.
        src: 'Источник: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener">rg.ru/2013/12/30/kostovich-site.html</a>; «100 лет со дня смерти изобретателя Огнеслава Степановича Костовича», «Русская вера», 2016 — <a href="https://ruvera.ru/news/izobretatel_kostovich" rel="noopener">ruvera.ru/news/izobretatel_kostovich</a>.'
        otryvok: «В 1879 году Костович продемонстрировал свои летающие модели вертолета, самолета и орнитоптера, а в 1881 году приступил к постройке самолета в натуральную величину. Постройка самолета не была доведена до конца»
        stranica: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета»
        href: https://rg.ru/2013/12/30/kostovich-site.html
        pometka: два источника
      - summary: <b>Последнюю летающую лодку Костович строил до самой смерти — и не успел её закончить.</b>
        det:
          - В 1913–1914 годах Костович построил двухместный гидроаэроплан — самолёт на поплавках, почти целиком из фанеры. Машину закончили, но испытать её так и не успели.
          - В 1916 году он строил новую двухместную летающую лодку с мотором в 100 лошадиных сил и крылом почти 11 метров. В декабре 1916 года Костович умер в Петрограде, и самолёт остался недостроенным.
        src: 'Источник: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета», 2013 — <a href="https://rg.ru/2013/12/30/kostovich-site.html" rel="noopener">rg.ru/2013/12/30/kostovich-site.html</a>.'
        otryvok: «Двигатель мощностью 100 л. с. (по-видимому, рядный). Самолет не был закончен из-за смерти Костовича.»
        stranica: «Пять самых важных изобретений Огнеслава Костовича», «Российская газета»
        href: https://rg.ru/2013/12/30/kostovich-site.html
        pometka: документ
