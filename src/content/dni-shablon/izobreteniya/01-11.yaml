  transcript:
    - "<p>«Мотор Костовича в первом зале Центрального музея ВВС в Монино: огромный маховик и восемь бронзовых цилиндров, две четвёрки навстречу друг другу».</p>"
    - <p>«Серб Огнеслав Костович воевал на Дунае в 1877–1878 годах и после войны, в 27 лет, остался в Петербурге».</p>
    - <p>«Пар — это котёл и уголь, газ Отто — баллоны на борту. Костович решил жечь в цилиндрах пары жидкого топлива».</p>
    - "<p>«К 1884 году мотор собран: до 80 лошадиных сил при 240 килограммах, электрическое зажигание, водяное охлаждение».</p>"
    - <p>«Мотоцикл Даймлера 1885 года — половина лошадиной силы. Патент Бенца — 29 января 1886 года. Русская привилегия Костовича — 4 ноября 1892 года».</p>
    - <p>«Дирижабль „Россия“ не взлетел. Мотор до 1947 года хранили на заводе при Охтинской верфи, с 1977 года он в Монино».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
