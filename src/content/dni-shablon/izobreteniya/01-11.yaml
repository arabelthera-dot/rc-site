quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — котёл и запас угля; 2 — 80 сил; 3 — 240 кг; 4 — половина лошадиной силы; 5 — в Монино."
  ball: 10
  voprosy:
    - q: Почему Костович не поставил на дирижабль паровую машину?
      o:
        - Пар тогда запрещали в воздухоплавании
        - Ей нужны котёл и запас угля — слишком тяжело
        - Паровые машины не умели крутить винт
      a: 1
      e: Котёл, уголь и сама машина заняли бы слишком много места и веса — так объясняет М. И. Левин в книге «Машина-двигатель».
    - q: Какую мощность давал мотор Костовича?
      o:
        - 8 лошадиных сил
        - До 80 лошадиных сил
        - 800 лошадиных сил
      a: 1
      e: До 80 сил — Центральный музей ВВС даёт 60–80.
    - q: Сколько весил мотор?
      o:
        - 240 килограммов
        - 2,4 тонны
        - 24 килограмма
      a: 0
      e: 240 килограммов — три килограмма на каждую лошадиную силу.
    - q: Какую мощность давал мотор первого мотоцикла Даймлера (1885)?
      o:
        - Половину лошадиной силы
        - 10 лошадиных сил
        - 80 лошадиных сил
      a: 0
      e: 0,5 л. с. — у мотора Костовича было до восьмидесяти.
    - q: Где сегодня можно увидеть двигатель Костовича?
      o:
        - В Политехническом музее в Москве
        - В Центральном музее ВВС в Монино
        - Он не сохранился
      a: 1
      e: В зале № 1 Центрального музея ВВС в Монино, куда мотор поступил в 1977 году.
