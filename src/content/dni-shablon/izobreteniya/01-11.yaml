  q: На каком топливе Костович решил гонять мотор дирижабля вместо угля и светильного газа?
  a: На жидком лёгком топливе — бензине. Его пары сгорали в цилиндрах по циклу Отто.
  src: Центральный музей ВВС, «Двигатель Костовича»
audioguide:
  audioSrc: audio-guide-kostovich-ru.mp3
  durationLabel: 3 минуты 14 секунд
  lead: "Голос ведёт по залу Огнеслава Костовича: от бронзового мотора в Монино до привилегии, которую он ждал четыре с половиной года. Шесть остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
