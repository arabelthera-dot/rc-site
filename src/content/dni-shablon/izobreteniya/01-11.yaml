return:
  q: На каком топливе Костович решил гонять мотор дирижабля вместо угля и светильного газа?
  a: На жидком лёгком топливе — бензине. Его пары сгорали в цилиндрах по циклу Отто.
  src: Центральный музей ВВС, «Двигатель Костовича»
audioguide:
  audioSrc: audio-guide-kostovich-ru.mp3
  durationLabel: 3 минуты 14 секунд
  lead: "Голос ведёт по залу Огнеслава Костовича: от бронзового мотора в Монино до привилегии, которую он ждал четыре с половиной года. Шесть остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: '0:00'
      title: Мотор в первом зале
    - t: 8
      mark: '0:08'
      title: Капитан с Дуная
    - t: 18
      mark: '0:18'
      title: Чем крутить винт
    - t: 27
      mark: '0:27'
      title: Восемь цилиндров
    - t: 36
      mark: '0:36'
      title: Полсилы и восемьдесят
    - t: 52
      mark: '0:52'
      title: Мотор без неба
  transcript:
    - "«Мотор Костовича в первом зале Центрального музея ВВС в Монино: огромный маховик и восемь бронзовых цилиндров, две четвёрки навстречу друг другу»."
    - "«Серб Огнеслав Костович воевал на Дунае в 1877–1878 годах и после войны, в 27 лет, остался в Петербурге»."
    - "«Пар — это котёл и уголь, газ Отто — баллоны на борту. Костович решил жечь в цилиндрах пары жидкого топлива»."
    - "«К 1884 году мотор собран: до 80 лошадиных сил при 240 килограммах, электрическое зажигание, водяное охлаждение»."
    - "«Мотоцикл Даймлера 1885 года — половина лошадиной силы. Патент Бенца — 29 января 1886 года. Русская привилегия Костовича — 4 ноября 1892 года»."
    - "«Дирижабль „Россия“ не взлетел. Мотор до 1947 года хранили на заводе при Охтинской верфи, с 1977 года он в Монино»."
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
