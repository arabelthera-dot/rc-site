      e: В 14 — студент, в 22 — профессор, в 23 — доктор наук без защиты диссертации.
    - q: Что Госплан написал о книге Канторовича в 1944 году?
      o:
        - «Немедленно внедрить»
        - «Невозможно какое-либо практическое использование»
        - «Засекретить»
      a: 1
      e: А через 31 год за ту же книгу Канторович получил Нобелевскую премию.
    - q: Как назвали счётную машину Канторовича, которую десять лет выпускали три завода?
