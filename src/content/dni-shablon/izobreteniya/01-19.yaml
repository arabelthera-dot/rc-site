razdely:
  - posle: pervenstvo
    html: |-
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2 class="iz-u3">Для тех, кто смотрит внимательно</h2>
          <details class="deepd">
            <summary>Четыре сюжета подробно — развернуть</summary>
            <h3>Что такое «разрешающие множители»</h3>
            <p>Канторович придумал приписывать каждому ограничению — станку, сырью, рабочему времени — своё число. Эти числа показывают, во что на самом деле обходится каждый ресурс, и подсказывают, в какую сторону менять план, пока он не станет лучшим. Сегодня их называют двойственными оценками, и без них не обходится ни одна программа планирования.</p>
            <h3>Почему задача «линейная»</h3>
            <p>Если один станок за смену делает столько-то листов, то два — вдвое больше: всё складывается и умножается без хитростей. Трудность не в формулах, а в их количестве: восемь станков, пять работ — и вариантов столько, что перебрать их невозможно. Канторович нашёл путь к лучшему плану без перебора.</p>
            <h3>Данциг, Купманс и Канторович</h3>
            <p>Данциг в 1947 году придумал симплекс-метод, которым такие задачи решают на компьютерах. Купманс в 1951-м дал науке имя — «линейное программирование». Оба признавали, что первым был ленинградец: Данциг написал это прямо, Купманс отстаивал приоритет Канторовича. Нобелевский комитет в 1975-м отметил двоих — Канторовича и Купманса.</p>
            <h3>Почему день — 19 января</h3>
            <p>19 января 1912 года Канторович родился в Петербурге. В справочниках часто стоит другая дата, но Институт математики СО РАН держится этой — да и сам он говорил, что «себя помнит с 19.01.1912».</p>
          </details>
          <div class="src">Источники: old.math.nsc.ru · mathsoc.pdmi.ras.ru · journal.spbu.ru · library.spbu.ru · bioslovhist.spbu.ru · goskatalog.ru · kommersant.ru</div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="mirovoy-kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2 class="iz-u5">Что в это время делал мир</h2>
          <p class="iz-u6">1939 год. В Ленинграде выходит тонкая брошюра в 68 страниц о том, как наилучшим образом загрузить станки. Остальной мир о такой науке ещё не знает: в США линейное программирование появится только в 1947 году у Джорджа Данцига, а своё имя получит в 1951-м от Тьяллинга Купманса.</p>
          <p class="iz-u6">Дома главная книга Канторовича, написанная в 1942-м, лежит в столе до 1959 года. А Данциг потом напишет, что почти все применения линейного программирования, известные к 1960 году, уже были в ленинградской работе 1939-го.</p>
          <p class="iz-u6">Отсюда вывод, ради которого этот день стоит в календаре: <b class="iz-u7">первым бывает тот, кто в обычной заводской задаче увидел закон, по которому живёт любое хозяйство.</b> В 1975 году Стокгольм это признал.</p>
          <p class="src-note">Источник: Биобиблиографический указатель, ИМ СО РАН, 2012 (со ссылкой на русское издание Данцига, 1966, с. 29); Институт математики им. С. Л. Соболева СО РАН.</p>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="chat-sec">
        <div class="wrap">
          <div class="kicker">Поговори с изобретателем</div>
          <h2>Спроси Леонида Канторовича</h2>
          <p class="iz-u8">Задай вопрос — ответит сам математик.</p>
          <div id="starters"></div>
          <div class="iz-u9" id="chatBox"></div>
          <div class="iz-u10">
            <input class="iz-u11" id="chatInput" type="text" placeholder="Написать вопрос..." aria-label="Вопрос Леониду Канторовичу">
            <button class="btn gold" onclick="sendChat()">Отправить</button>
          </div>
          <p class="iz-u12">Ответы сформированы на основе документальных источников.</p>
        </div>
