  - posle: quiz
    html: |-
      <section class="block iz-u13" id="fork">
        <div class="wrap">
          <div class="kicker">Твой выбор</div>
          <h2>А как поступил бы ты?</h2>
          <p class="iz-u14">Ленинград, 1938 год. Тебе 26, ты профессор математики. Инженеры фанерного треста приносят «скучную» заводскую задачу: как загрузить восемь типов станков пятью видами работ. Перебрать варианты невозможно. Ты на месте Канторовича — что делаешь?</p>
          <div class="fork-opt">🧮 Ищу общий способ, который решит не только эту задачу, но и все похожие</div>
          <div class="fork-opt">📋 Подбираю на глаз приличный план для треста — и возвращаюсь к своей теории</div>
          <div class="fork-opt">🚪 Отказываю: заводские задачи — не дело для профессора математики</div>
          <div id="forkReal" class="exp iz-u15"><b>Как было на самом деле.</b> Канторович увидел в задаче треста новый класс задач и нашёл общий метод — «разрешающие множители». Уже в 1939 году вышла брошюра, где он применил его к раскрою, перевозкам, посевам и загрузке оборудования. Американец Данциг пришёл к тому же через восемь лет и сам признал: первым был Канторович.</div>
        </div>
      </section>
