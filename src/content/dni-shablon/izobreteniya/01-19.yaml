    id: "f01"
  - summary: "Перебором задачу треста решали бы через миллиард систем уравнений — Канторович обошёлся без него."
    det:
    - Трест спрашивал, как распределить восемь видов материала между пятью станками, чтобы фанеры вышло больше. Если перебирать все варианты, понадобилось бы решить примерно миллиард систем уравнений — вручную это немыслимо.
    - 'Канторович создал «разрешающие множители»: они подсказывают, как менять план, и ведут к лучшему варианту без перебора.'
    src: "Источник: Л. В. Канторович, «Мой путь в науке», «Успехи математических наук», 1987, т. 42, вып. 2, с. 200 — https://www.mathnet.ru/rus/rm2433; А. Алексеев, «Оптимум Канторовича», «Коммерсантъ», 22.10.2026 — https://www.kommersant.ru/doc/9041818"
    otryvok: «Но уже, скажем, в задаче фанерного треста при пяти станках и восьми видах материала такой перебор потребовал бы решения примерно миллиарда систем линейных уравнений, и было очевидно, что это нереальный путь.» (Л. В. Канторович, «Мой путь в науке», УМН, 1987)
    stranica: Л. В. Канторович, «Мой путь в науке», «Успехи математических наук», 1987, т. 42, вып. 2, с. 200
