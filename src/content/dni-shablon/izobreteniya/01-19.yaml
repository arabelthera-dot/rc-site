return:
  q: Сколько лет прошло между отзывом Госплана «невозможно какое-либо практическое использование» и Нобелевской премией за ту же книгу?
  a: "31 год: отзыв — 1944, премия — 1975."
  src: Биобиблиографический указатель Л. В. Канторовича, ИМ СО РАН, 2012
audioguide:
  audioSrc: audio-guide-kantorovich-2-ru.mp3
  durationLabel: 5 минут 1 секунда
  lead: "Голос ведёт по залу Леонида Канторовича: от Нобелевского диплома на обложке через задачу фанерного треста, лёд Ладоги и спор с Госпланом до счётной машины «Вильнюс». Семь остановок, на каждой — что искать глазами на странице."
  stops:
    - t: 0
      mark: 0:00
      title: "Нобелевский диплом"
    - t: 40
      mark: 0:40
      title: "Задача фанерного треста"
    - t: 84
      mark: 1:24
      title: "Брошюра в Ленинграде"
    - t: 130
      mark: 2:10
      title: "Студент в четырнадцать"
    - t: 154
      mark: 2:34
      title: "Игра: лёд Ладоги"
    - t: 200
      mark: 3:20
      title: "Спор с Госпланом"
    - t: 246
      mark: 4:06
      title: "Такси, «Вильнюс» и цилиндр"
  transcript:
    - "<p>«Здравствуйте. Мы в зале линейного программирования. Посмотрите на обложку: лист в чёрной рамке с гербом, крупно имя Леонида Канторовича. Это его диплом лауреата Нобелевской премии по экономике, тысяча девятьсот семьдесят пятый год. Вручили её в Стокгольме. Единственная такая премия в истории СССР. А начиналось всё с вопроса, как раскроить фанеру без отходов. Девятнадцатого января тысяча девятьсот двенадцатого года Канторович родился. Посмотрите на четыре числа под заголовком: брошюра в шестьдесят восемь страниц, двадцать семь метров между танками на льду, студент в четырнадцать лет и Нобелевская премия.»</p>"
    - "<p>«Начнём с заводского вопроса. Тысяча девятьсот тридцать восьмой год, Ленинград. Сотрудники Центральной лаборатории Ленинградского фанерного треста приносят двадцатишестилетнему профессору задачу. Пять видов работ, лущильные станки восьми типов. Как распределить работу, чтобы фанеры вышло больше всего? Если перебирать все варианты, пришлось бы решить примерно миллиард систем уравнений. Вручную это немыслимо. Канторович увидел, что это задача нового класса: найти наибольшее значение, когда ограничений много. И придумал общий способ — «разрешающие множители». Они подсказывают, как менять план, и ведут к лучшему варианту без перебора.»</p>"
    - "<p>«Дальше — май тысяча девятьсот тридцать девятого года. Канторович докладывает свой метод в Актовом зале университета. В том же году Издательство Ленинградского университета выпускает брошюру «Математические методы организации и планирования производства», шестьдесят восемь страниц. С неё и началось линейное программирование. Американец Джордж Данциг пришёл к тому же на восемь лет позже, в тысяча девятьсот сорок седьмом. А в шестидесятом брошюру Канторовича перевели в Америке по почину экономиста Тьяллинга Купманса — и в семьдесят пятом Нобелевскую премию разделили между нашим учёным и им. Посмотрите блок «Проверка факта»: там сказано, что именно Канторович сделал первым — первая в мире математическая постановка задач наилучшего планирования и общий метод их решения.»</p>"
    - "<p>«Теперь найдите на странице старый документ с фотографией подростка. Это студенческий матрикул тысяча девятьсот двадцать шестого года. Канторович поступил в Ленинградский университет четырнадцатилетним. В двадцать два года ему утвердили звание профессора. А ещё через год, в двадцать три, присудили степень доктора физико-математических наук без защиты диссертации.»</p>"
    - "<p>«Спуститесь к игре «Лёд Ладоги». В блокаду Канторович преподавал в военном инженерном училище и считал, какую нагрузку выдержит лёд Ладожского озера. По его расчёту танки должны были идти с промежутком не меньше двадцати семи метров. Танкисты боялись провалиться — и учёный сам сел в первый танк. Все танки благополучно перешли озеро. В игре вы — Канторович на берегу. Десять танков должны перейти лёд до рассвета. Сначала решите, кто едет первым. Потом пускайте танки по одному и смотрите на разрез льда внизу: под каждым танком лёд прогибается чашей. Сольются две чаши — лёд трещит. Слишком осторожничать тоже нельзя: колонна должна успеть до света.»</p>"
    - "<p>«Следующая остановка — о том, как было трудно. В годы войны Канторович написал книгу «Экономический расчёт наилучшего использования ресурсов» и отправил её в Госплан. В отзыве тысяча девятьсот сорок четвёртого года ответили: «невозможно какое-либо практическое использование». На обсуждении критики даже заявили, что само понятие оптимума взято у фашистской науки. Канторович ответил: «Мы не будем добиваться минимума продукции, максимума затрат, минимума доходности только для того, чтобы не было с ним никакого сходства». Книгу напечатали только в тысяча девятьсот пятьдесят девятом году. А в тысяча девятьсот сорок восьмом ему поручили срочно собрать группу расчётчиков для атомного проекта. Электронных машин ещё не было — считали на арифмометрах, и что именно считают, исполнителям не говорили.»</p>"
    - "<p>«И последняя остановка. Ещё в Ленинграде, до переезда в Новосибирск, лаборатория Канторовича рассчитала тарифы на такси для всей страны, и новые тарифы дали большую экономию. Ещё он придумал клавишную счётную машину, которая сама выполняла арифметические действия. Авторское свидетельство — тысяча девятьсот пятьдесят восьмой год. Машину выпускали три завода, в том числе в Вильнюсе, под именем «Вильнюс», — десять лет, пока не пришли электронные калькуляторы. А когда Канторовича избрали почётным доктором университета, к наряду полагался цилиндр. Размер головы гостя не знали и на всякий случай сшили самый большой. Внучку же больше премии впечатляло другое: «у деда даже шпага есть». Вот и весь зал. Между отзывом «невозможно какое-либо практическое использование» и Нобелевской премией за ту же книгу прошёл тридцать один год. Теперь проведите танки по льду Ладоги и ответьте на вопросы викторины.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
