  - summary: <b>Счётную машину Канторовича «Вильнюс» десять лет выпускали три завода — до электронных калькуляторов.</b>
    det:
    - До электронных калькуляторов считали на арифмометрах. Канторович придумал клавишную машину, которая сама выполняла арифметические действия; авторское свидетельство на неё он получил в 1958 году.
    - Машину выпускали три завода, в том числе в Вильнюсе — под именем «Вильнюс». Делали её десять лет, пока не появились настольные электронные калькуляторы.
    src: 'Источник: Виртуальный компьютерный музей, «Галерея славы»: «Академик Леонид Витальевич Канторович» — <a href="https://www.computer-museum.ru/galglory/21.htm" rel="noopener" target="_blank">www.computer-museum.ru/galglory/21.htm</a>'
    otryvok: «Л. В. Канторович предложил модель оригинальной релейной клавишной машины для автоматического выполнения арифметических операций, на которую в 1958 г. им было получено авторское свидетельство. Она выпускалась на трех заводах, в том числе в Вильнюсе машина «Вильнюс», в течение 10 лет вплоть до появления настольных электронных счетно-клавишных машин (калькуляторов).»
    stranica: 'Виртуальный компьютерный музей, «Галерея славы»: «Академик Леонид Витальевич Канторович»'
    href: https://www.computer-museum.ru/galglory/21.htm
