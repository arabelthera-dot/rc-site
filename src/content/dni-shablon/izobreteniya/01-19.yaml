story:
  kicker: История изобретения
  h2: Задача фанерного треста
  udary:
    - summary: В 1938-м фанерный трест спросил 26-летнего профессора, как выжать из восьми типов станков больше фанеры, — и из заводского вопроса родилась наука.
      det:
        - "Сотрудники Центральной лаборатории Ленинградского фанерного треста принесли Канторовичу задачу: пять видов работ, лущильные станки восьми типов — как распределить работу, чтобы выпуск был наибольшим. Перебрать все варианты вручную было немыслимо."
        - "Канторович увидел, что это задача нового класса: найти наибольшее значение при множестве ограничений-неравенств. И дал общий способ её решать — «разрешающие множители», которые сегодня называют двойственными оценками. Они показывают, во что обходится каждый станок и каждая работа, и ведут к лучшему плану без перебора."
        - "В мае 1939 года он доложил метод в Актовом зале университета, и в том же году Издательство ЛГУ выпустило брошюру «Математические методы организации и планирования производства» — 68 страниц. Институт математики СО РАН пишет о ней: здесь Канторович «впервые дал математическую постановку производственных задач оптимального планирования и предложил эффективные методы их решения»."
      src: "Источник: Л. В. Канторович. Биобиблиографический указатель. Новосибирск: ИМ СО РАН, 2012; Институт математики им. С. Л. Соболева СО РАН; «Санкт-Петербургский университет», № 1, 25.01.2012."
fakty:
- id: fakty
  kicker: Десять фактов о Канторовиче · с документом
  h2: Математик, который считал всё — от льда Ладоги до тарифов такси
  udary:
  - summary: '<b>Лёд Ладоги: Канторович рассчитал, что танки пройдут в 27 м друг от друга, — и сам сел в первый.</b>'
    det:
    - В блокаду Канторович преподавал в военном инженерном училище и считал, какую нагрузку выдержит лёд Ладожского озера. По его расчёту танки должны были идти по льду с промежутком 27 метров.
    - 'Курсант А. Образцов вспоминал: чтобы доказать, что расчёт верен, учёный сам сел в первый танк.'
    src: 'Источник: «Наука и жизнь», № 5, 2004 — <a href="https://www.nkj.ru/archive/articles/3563/" rel="noopener" target="_blank">www.nkj.ru/archive/articles/3563/</a>'
    otryvok: «Танкисты боялись провалиться под лед. Канторович рассчитал прочность льда и определил, что расстояние от танка до танка должно быть не менее 27 метров. В первый танк ученый сел сам. Все танки благополучно форсировали Ладогу».
    stranica: А. Образцов, «Юность математика», «Наука и жизнь», № 5, 2004
    href: https://www.nkj.ru/archive/articles/3563/
    pometka: документ
    kadr:
      src: "/muzei/izobreteniya/img/01-19-ledovye-dorogi-ladogi.jpg"
      width: 586
      height: 800
      klass: "portret"
      alt: "Рисованная от руки схема «Ледовые дороги Ладожского озера 1941–1943 гг.» с трассами через озеро"
      data_source: "https://goskatalog.ru/portal/#/collections?id=45343921"
      license: "Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
      podpis: "Схема ледовых дорог через Ладожское озеро в 1941–1943 годах: по этому льду шли машины и танки, для которых Канторович рассчитал безопасный промежуток."
      credit: "Составитель — бывший командир партизанского отряда № 164 Д. И. Власов (подпись на листе). Хранится: Государственный музей истории Санкт-Петербурга, инв. № III-Б-398 р, ГМИ СПб 28141. Госкаталог № 45096929. Источник: Госкаталог музейного фонда РФ."
  - summary: <b>Перебором задачу треста решали бы через миллиард систем уравнений — Канторович обошёлся без него.</b>
    det:
    - Трест спрашивал, как распределить пять видов работ между станками восьми типов, чтобы фанеры вышло больше. Если перебирать все варианты, понадобилось бы решить примерно миллиард систем уравнений — вручную это немыслимо.
    - 'Канторович создал «разрешающие множители»: они подсказывают, как менять план, и ведут к лучшему варианту без перебора.'
    src: 'Источник: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ», 22.10.2026 — <a href="https://www.kommersant.ru/doc/9041818" rel="noopener" target="_blank">www.kommersant.ru/doc/9041818</a>'
    otryvok: «При пяти станках и восьми видах материала перебор потребовал бы решения примерно миллиарда систем линейных уравнений (напомним, что компьютеров тогда не существовало)».
    stranica: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ. Деньги», 22.10.2026
    href: https://www.kommersant.ru/doc/9041818
    pometka: документ
    kadr:
      src: "/muzei/izobreteniya/img/01-19-optimalnoe-planirovanie-1964.jpg"
      width: 550
      height: 800
      klass: "portret"
      alt: "Титульный лист сборника «Оптимальное планирование. Выпуск 2 (алгорифмы)», Институт математики Сибирского отделения АН СССР, Новосибирск, 1964"
      data_source: "https://goskatalog.ru/portal/#/collections?id=5853041"
      license: "Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
      podpis: "Сборник «Оптимальное планирование. Алгорифмы» (Новосибирск, 1964) под редакцией академика Канторовича: вычислительные приёмы, которые позволяют найти лучший план без перебора всех вариантов."
      credit: "Автор не указан. Хранится: Новосибирский государственный краеведческий музей, инв. № Кн-336, НОКМ ОФ-16337/19. Госкаталог № 5691013. Источник: Госкаталог музейного фонда РФ."
  - summary: <b>В 14 лет — студент, в 22 — профессор, в 23 — доктор наук без защиты диссертации.</b>
    det:
    - Канторович поступил в Ленинградский университет в 1926 году, четырнадцатилетним. Профессорское звание ему утвердили в 1934 году.
    - Ещё через год, в 1935-м, ему присудили степень доктора физико-математических наук без защиты диссертации.
    src: 'Источник: «Коммерсантъ», 22.10.2026 — <a href="https://www.kommersant.ru/doc/9041818" rel="noopener" target="_blank">www.kommersant.ru/doc/9041818</a>; «Санкт-Петербургский университет», № 1, 2012 — <a href="https://journal.spbu.ru/?p=6167" rel="noopener" target="_blank">journal.spbu.ru/?p=6167</a>'
    otryvok: «В 20 лет он уже был доцентом. В 22 года стал профессором… В 23 года получил степень доктора физико-математических наук без защиты диссертации».
    stranica: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ. Деньги», 22.10.2026
    href: https://www.kommersant.ru/doc/9041818
    pometka: два источника
  - summary: <b>Тарифы на такси по всей стране рассчитала лаборатория Канторовича — и они дали большую экономию.</b>
    det:
    - Ещё до переезда в Новосибирск, в Ленинграде, лаборатория Канторовича применяла его методы к хозяйственным задачам.
    - 'Одной из них стали тарифы на такси: их рассчитали для всей страны, и новые тарифы дали большую экономию.'
    src: 'Источник: Институт математики им. С. Л. Соболева СО РАН, «Леонид Витальевич Канторович» — <a href="http://old.math.nsc.ru/LBRT/u2/nauka/kant.html" rel="noopener" target="_blank">old.math.nsc.ru/LBRT/u2/nauka/kant.html</a>'
    otryvok: «Еще до переезда в Новосибирск под руководством Л. В. Канторовича в Ленинграде были развернуты исследования… В частности, разработанные здесь оптимальные тарифы на такси были реализованы в масштабе страны и принесли большой экономический эффект».
    stranica: Институт математики им. С. Л. Соболева СО РАН, «Леонид Витальевич Канторович (1912–1986)»
    href: http://old.math.nsc.ru/LBRT/u2/nauka/kant.html
    pometka: два источника
  - summary: '<b>Почётному доктору сшили самый большой цилиндр: размер головы советского профессора никто не знал.</b>'
    det:
    - В 1971 году зарубежный университет избрал Канторовича почётным доктором; к торжественному наряду полагался цилиндр. Размер головы гостя заранее не знали — и на всякий случай сшили самый большой.
    - 'Внучку больше Нобелевской премии впечатляло другое: «у деда даже шпага есть».'
    src: 'Источник: Е. Голубев, «Л. В. Канторович: „Не всё должно быть в каждом блюде…“», «Санкт-Петербургский университет», № 1, 2012 — <a href="https://journal.spbu.ru/?p=6167" rel="noopener" target="_blank">journal.spbu.ru/?p=6167</a>'
    otryvok: «…не придала премии значения, потому, что „у деда даже шпага есть“… Своего шляпника у отца, естественно, не было, и… сшили самый большой цилиндр, думая, что у него большая голова…»
    stranica: 'Е. Голубев, «Л. В. Канторович: „Не всё должно быть в каждом блюде…“», «Санкт-Петербургский университет», № 1, 2012'
    href: https://journal.spbu.ru/?p=6167
    pometka: документ
  - summary: <b>Его группа вручную, на арифмометрах, считала критическую массу заряда атомной бомбы.</b>
    det:
    - В 1948 году Канторовичу поручили срочно собрать группу расчётчиков для атомного проекта. Электронных вычислительных машин ещё не было, и считали на арифмометрах.
    - Что именно они считают, исполнителям не говорили.
    src: 'Источник: «О вкладе математиков первой величины в атомный проект СССР», «Прикладная математика &amp; Физика», 2022 — <a href="https://cyberleninka.ru/article/n/o-vklade-matematikov-pervoy-velichiny-v-atomnyy-proekt-sssr" rel="noopener" target="_blank">cyberleninka.ru/article/n/o-vklade-matematikov-pervoy-velichiny-v-atomnyy-proekt-sssr</a>'
    otryvok: «Что именно считалось, никому не сообщалось, и только впоследствии узнали, что расчеты велись для атомной бомбы… Первая задача группы Канторовича состояла в расчёте критической массы заряда атомной бомбы».
    stranica: «О вкладе математиков первой величины в атомный проект СССР», «Прикладная математика &amp; Физика», 2022
    href: https://cyberleninka.ru/article/n/o-vklade-matematikov-pervoy-velichiny-v-atomnyy-proekt-sssr
    pometka: документ
    kadr:
      src: "/muzei/izobreteniya/img/01-19-arifmometr-feliks.jpg"
      width: 1400
      height: 919
      alt: "Механический арифмометр «Феликс» в чёрном металлическом корпусе с рычажками и ручкой"
      data_source: "https://goskatalog.ru/portal/#/collections?id=16104163"
      license: "Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
      podpis: "Арифмометр «Феликс» — на таких ручных счётных машинах группа Канторовича вела расчёты для атомного проекта."
      credit: "Автор не указан. Хранится: Музей истории города Бронницы, инв. № Тх-17, МИБ КП 3152. Госкаталог № 16000696. Источник: Госкаталог музейного фонда РФ."
  - summary: <b>Обвинение, что «оптимум» придумал фашист, Канторович отбил одной фразой.</b>
    det:
    - На обсуждении его работ в Госплане критики заявили, что само понятие оптимума взято у фашистской экономической науки.
    - 'Канторович ответил: «Мы не будем добиваться минимума продукции, максимума затрат, минимума доходности только для того, чтобы не было с ним никакого сходства».'
    src: 'Источник: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ», 22.10.2026 — <a href="https://www.kommersant.ru/doc/9041818" rel="noopener" target="_blank">www.kommersant.ru/doc/9041818</a>'
    otryvok: «…„мы не будем добиваться минимума продукции, максимума затрат, минимума доходности только для того, чтобы не было с ним никакого сходства“».
    stranica: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ. Деньги», 22.10.2026
    href: https://www.kommersant.ru/doc/9041818
    pometka: документ
  - summary: '<b>Госплан в 1944-м: «невозможно какое-либо практическое использование». Через 31 год — Нобель.</b>'
    det:
    - Книгу «Экономический расчёт наилучшего использования ресурсов» Канторович написал в годы войны и отправил в Госплан. В отзыве 1944 года ответили, что «невозможно какое-либо практическое использование» его предложений.
    - Книгу напечатали только в 1959 году, а в 1975-м за эти идеи Канторович получил Нобелевскую премию по экономике.
    src: 'Источник: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ», 22.10.2026 — <a href="https://www.kommersant.ru/doc/9041818" rel="noopener" target="_blank">www.kommersant.ru/doc/9041818</a>'
