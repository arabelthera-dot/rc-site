pervenstvo:
  kicker: Проверка факта
  h2: Что именно Канторович сделал первым
  granica: "Граница первенства: первая в мире математическая постановка задач оптимального планирования — найти лучший план при множестве линейных ограничений — и общий метод их решения, «разрешающие множители». Ленинград, 1939 год, брошюра «Математические методы организации и планирования производства»."
  net: "Чего здесь нет: сегодняшних компьютерных способов счёта — здесь только то, что сделал сам Канторович и когда."
  kolonki:
    - Где
    - Что
    - Когда
  stroki:
