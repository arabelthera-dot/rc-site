  - summary: '<b>Американцы сами признали: первым был Канторович.</b>'
    det:
    - Ленинградская брошюра вышла в 1939 году, а в США к тем же задачам пришли через восемь лет.
    - 'В 1963 году главный американский специалист по этим методам писал: «Канторовича следует признать первым, кто обнаружил, что широкий класс важнейших производственных задач поддаётся чёткой математической формулировке».'
