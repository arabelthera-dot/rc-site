- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Неделя, металлолом и арест
  udary:
  - summary: <b>Брошюру, с которой началось линейное программирование, напечатали за неделю.</b>
    det:
    - После доклада в университете Канторовичу посоветовали издать его работу. Он принёс рукопись, и Издательство Ленинградского университета выпустило брошюру всего за неделю. Близкий к нему математик И. В. Романовский назвал это «небывалым».
    - Тираж — тысяча экземпляров. Их разослали в наркоматы, газеты и журналы, Академию наук, научные институты и Госплан. Но применять метод в хозяйстве тогда никто не стал.
    src: 'Источник: Е. Голубев, «Л. В. Канторович: „Не всё должно быть в каждом блюде…“», «Санкт-Петербургский университет», № 1, 2012 — <a href="https://journal.spbu.ru/?p=6167" rel="noopener">journal.spbu.ru/?p=6167</a>; А. Алексеев, «Оптимум Канторовича», «Коммерсантъ. Деньги», 22.10.2026 — <a href="https://www.kommersant.ru/doc/9041818" rel="noopener">www.kommersant.ru/doc/9041818</a>.'
    otryvok: '«И случилось небывалое: Канторович представил рукопись, и Издательство ЛГУ напечатало его брошюру … за неделю! Всего 68 страниц…»'
    stranica: 'Е. Голубев, «Л. В. Канторович: „Не всё должно быть в каждом блюде…“», «Санкт-Петербургский университет», № 1, 2012'
    href: https://journal.spbu.ru/?p=6167
    pometka: два источника
  - summary: <b>Канторович сам не печатал свой метод, чтобы не выдать врагу «секретное оружие».</b>
    det:
    - Он понимал, что метод поможет заводам, в том числе военным. Поэтому перед войной и в войну не публиковал, как применять его в хозяйстве.
    - О перевозках грузов он написал отвлечённо, одной математикой, без заводов и планов. А статью об общем способе, написанную в 1940 году, напечатали только в 1949-м.
    src: 'Источник: Е. Голубев, «Л. В. Канторович: „Не всё должно быть в каждом блюде…“», «Санкт-Петербургский университет», № 1, 2012 — <a href="https://journal.spbu.ru/?p=6167" rel="noopener">journal.spbu.ru/?p=6167</a>.'
    otryvok: «Канторович не хотел публиковать материалы, чтобы не выдавать врагу свое «секретное оружие». Он понимал, что эти методы могут помочь промышленности, в том числе военной.»
    stranica: 'Е. Голубев, «Л. В. Канторович: „Не всё должно быть в каждом блюде…“», «Санкт-Петербургский университет», № 1, 2012'
    href: https://journal.spbu.ru/?p=6167
    pometka: документ
  - summary: <b>После спора в Госплане решали, не арестовать ли Канторовича. Он на время бросил экономику.</b>
    det:
    - В 1943 году его работу разбирали в Госплане. Уже после этого обсуждения в кабинете председателя Госплана Н. А. Вознесенского собрали совещание, где встал вопрос об аресте Канторовича. Сам он узнал об этом только в 1960-е годы.
    - 'Но опасность он почувствовал сразу и решил на время оставить эти работы: «Их продолжение становилось опасным». Дочь вспоминала: он боялся ареста, и его спасло начальство военного училища, где он преподавал, — оно за него заступилось.'
    src: 'Источник: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ. Деньги», 22.10.2026 — <a href="https://www.kommersant.ru/doc/9041818" rel="noopener">www.kommersant.ru/doc/9041818</a>; Е. Голубев, «Л. В. Канторович: „Не всё должно быть в каждом блюде…“», «Санкт-Петербургский университет», № 1, 2012 — <a href="https://journal.spbu.ru/?p=6167" rel="noopener">journal.spbu.ru/?p=6167</a>.'
    otryvok: «…в 1960-е годы он узнал, что после той дискуссии в кабинете председателя Госплана Николая Вознесенского состоялось совещание, на котором был поставлен вопрос о его аресте»
    stranica: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ. Деньги», 22.10.2026
    href: https://www.kommersant.ru/doc/9041818
    pometka: два источника
  - summary: '<b>Математики втрое срезали отходы стали, а завод получил выговор: не сдал план по металлолому.</b>'
    det:
    - В 1948–1950 годах Канторович со своим учеником Виктором Залгаллером рассчитали на Ленинградском вагоностроительном заводе, как резать стальные листы. Отходы по плану были 13%, заводские умельцы довели их до 8%, а с математиками — до 4%.
    - Награды не было. Металлолом на заводе почти целиком состоял из обрезков листов — и план по его сдаче сорвался. А на следующий год заводу велели перевыполнить план, хотя лучше уже было нельзя. Руководство получило выговор и больше с математиками не связывалось.
    src: 'Источник: «Канторович Леонид Витальевич», Персоналии, «История Росатома» — <a href="https://www.biblioatom.ru/persons/kantorovich_leonid_vitalevich/" rel="noopener">www.biblioatom.ru/persons/kantorovich_leonid_vitalevich</a>; Е. Голубев, «Л. В. Канторович: „Не всё должно быть в каждом блюде…“», «Санкт-Петербургский университет», № 1, 2012 — <a href="https://journal.spbu.ru/?p=6167" rel="noopener">journal.spbu.ru/?p=6167</a>.'
    otryvok: «К тому же завод не выполнил план по металлолому, львиная доля которого складывалась из обрезков стальных листов. Руководство завода получило выговор и больше с математиками не связывалось.»
    stranica: «Канторович Леонид Витальевич», Персоналии, «История Росатома» (biblioatom.ru)
    href: https://www.biblioatom.ru/persons/kantorovich_leonid_vitalevich/
    pometka: два источника
    kadr:
      src: "/muzei/izobreteniya/img/01-19-raskroj-1971.jpg"
      width: 548
      height: 799
      klass: "portret"
      alt: "Обложка книги Л. В. Канторовича и В. А. Залгаллера «Рациональный раскрой промышленных материалов»: фиолетовый переплёт с геометрическим рисунком"
      data_source: "https://goskatalog.ru/portal/#/collections?id=11812354"
      license: "Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
      podpis: "Книга Канторовича и Залгаллера «Рациональный раскрой промышленных материалов» (2-е изд., Новосибирск, 1971) из комплекта материалов нобелевского лауреата. Именно такими методами раскроя математики срезали отходы стали."
      credit: "Автор не указан. Хранится: Новосибирский государственный краеведческий музей, инв. № Кн-1431, НГКМ ОФ-21892/4. Госкаталог № 11694478. Источник: Госкаталог музейного фонда РФ."
  - summary: <b>За атомную бомбу Канторовичу дали 100 тысяч рублей, четверть раздали его расчётчикам.</b>
    det:
    - В 1948 году его группе поручили рассчитать критическую массу плутония — сколько его нужно для взрыва. К работе приступили всего восемь человек.
    - За участие в создании первой советской атомной бомбы Канторович получил орден и правительственную премию — 100 тысяч рублей. Из них 25 тысяч раздали сотрудникам.
    src: 'Источник: «Канторович Леонид Витальевич», Персоналии, «История Росатома» — <a href="https://www.biblioatom.ru/persons/kantorovich_leonid_vitalevich/" rel="noopener">www.biblioatom.ru/persons/kantorovich_leonid_vitalevich</a>.'
    otryvok: «За участие в создании первой советской атомной бомбы Л. В. Канторович был удостоен ордена Трудового Красного знамени и награжден правительственной премией. Он получил 100 тысяч рублей, 25 тысяч из которых было роздано сотрудникам.»
    stranica: «Канторович Леонид Витальевич», Персоналии, «История Росатома» (biblioatom.ru)
    href: https://www.biblioatom.ru/persons/kantorovich_leonid_vitalevich/
    pometka: документ
