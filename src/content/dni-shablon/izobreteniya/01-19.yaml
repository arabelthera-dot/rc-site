return:
  q: Сколько лет прошло между ленинградской брошюрой Канторовича и тем, как американец Данциг пришёл к линейному программированию?
  a: "Восемь: брошюра вышла в 1939 году, работа Данцига — в 1947-м."
  src: Биобиблиографический указатель Л. В. Канторовича, ИМ СО РАН, 2012
audioguide:
  audioSrc: audio-guide-kantorovich-ru.mp3
  durationLabel: 5 минут 50 секунд
  lead: "Голос ведёт по залу Леонида Канторовича: от нобелевского диплома на обложке через задачу фанерного треста и раскрой листа до Данцига, Монжа и Стокгольма. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Диплом из Стокгольма
    - t: 53
      mark: 0:53
      title: Задача фанерного треста
    - t: 105
      mark: 1:45
      title: Брошюра в Ленинграде
    - t: 153
      mark: 2:33
      title: "Игра: раскрои лист"
    - t: 207
      mark: 3:27
      title: Данциг признал первым
    - t: 258
      mark: 4:18
      title: Чуть не посадили
    - t: 311
      mark: 5:11
      title: Задача Монжа
  transcript:
    - "<p>«Здравствуйте. Мы в зале линейного программирования. Посмотрите на обложку: лист в чёрной рамке с гербом Шведской королевской академии наук, крупно имя Леонида Канторовича, внизу дата и две подписи. Это диплом лауреата Нобелевской премии по экономике. Стокгольм, десятое декабря тысяча девятьсот семьдесят пятого года. Премию дали вместе с Тьяллингом Купмансом «за вклад в теорию оптимального распределения ресурсов». А главная мысль зала такая: Канторович решал, как раскроить фанеру без отходов, а получил единственную в истории СССР Нобелевскую премию по экономике. Под обложкой полоса из четырёх чисел. Тысяча девятьсот тридцать девятый — брошюра в шестьдесят восемь страниц. На восемь лет раньше Данцига в США. Четырнадцать лет — уже студент университета. И тысяча девятьсот семьдесят пятый — Нобелевская премия. Пройдём по залу по порядку.»</p>"
    - "<p>«Начнём с заводского вопроса. Тысяча девятьсот тридцать восьмой год, Ленинград. Сотрудники Центральной лаборатории Ленинградского фанерного треста приносят двадцатишестилетнему профессору задачу. Пять видов работ, лущильные станки восьми типов. Как распределить работу, чтобы фанеры вышло больше всего? Перебрать все варианты вручную было немыслимо. Канторович увидел, что это задача нового класса: найти наибольшее значение при множестве ограничений-неравенств. И дал общий способ её решать — «разрешающие множители». Каждому станку, сырью, рабочему времени он приписал своё число. Эти числа показывают, во что на самом деле обходится каждый ресурс, и ведут к лучшему плану без перебора. Сегодня их называют двойственными оценками. Найдите ниже раздел «Для тех, кто смотрит внимательно» — там это объяснено подробнее.»</p>"
    - "<p>«Дальше — май тысяча девятьсот тридцать девятого года. Канторович докладывает свой метод в Актовом зале университета. В том же году Издательство Ленинградского университета выпускает брошюру «Математические методы организации и планирования производства». В ней шестьдесят восемь страниц. Институт математики Сибирского отделения Российской академии наук пишет о ней так: здесь Канторович «впервые дал математическую постановку производственных задач оптимального планирования и предложил эффективные методы их решения». В брошюре он применил свой метод к раскрою, перевозкам, посевам и загрузке оборудования. Почему день — девятнадцатое января? Девятнадцатого января тысяча девятьсот двенадцатого года Канторович родился в Петербурге. В справочниках часто стоит другая дата, но Институт математики держится этой.»</p>"
    - "<p>«Спуститесь к игре «Раскрои лист фанеры — и обгони Америку». Заказ: два больших щита, два малых и две полосы — всё из одного листа. Перетащите деталь пальцем или мышью на лист. Если не помещается, нажмите «Повернуть деталь». Уложенную деталь можно схватить и переложить, а если коснуться её — она вернётся в заказ. Полоска внизу показывает, сколько листа в деле. Мастер по соседству режет «на глаз» и теряет четверть листа. Обойдите его — или нажмите «Посчитать по Канторовичу», и детали лягут сами. Когда лист готов, побежит лента лет: от тысяча девятьсот тридцать девятого, Ленинград, до тысяча девятьсот сорок седьмого, США. Счётчик форы дойдёт до восьми лет. Честная оговорка: это модель, а не чертёж треста. Лист двенадцать на восемь клеток, размеры деталей и результат мастера заданы программой.»</p>"
    - "<p>«Теперь о первенстве. В США линейное программирование появилось только в тысяча девятьсот сорок седьмом году, в работах Джорджа Данцига, — на восемь лет позже. Данцига называют отцом симплекс-метода. И он же написал: «Канторовича следует признать первым». А ещё добавил, что почти все применения линейного программирования, известные к тысяча девятьсот шестидесятому году, уже были в ленинградской работе тридцать девятого. Найдите на странице раздел «Что именно Канторович сделал первым». Граница там проведена честно. Первенство Канторовича — сама постановка задачи и метод разрешающих множителей. А симплекс-метод, которым такие задачи решают на компьютерах, предложил Данциг. Слова «линейное программирование» придумал Купманс в тысяча девятьсот пятьдесят первом году. Оба американца признавали, что первым был ленинградец.»</p>"
    - "<p>«Следующая остановка — о том, как было трудно. В войну Канторович пытался докладывать в Москве, что экономические задачи можно решать новыми методами. Его, вспоминает сын, «смешали с грязью» и чуть не посадили. Книгу «Экономический расчёт наилучшего использования ресурсов», готовую в тысяча девятьсот сорок втором году, напечатали только в тысяча девятьсот пятьдесят девятом. А в тысяча девятьсот сорок восьмом ему дали две недели, чтобы собрать расчётную группу до пятнадцати человек для атомного проекта. Метод раскроя пригодился и заводам. На ленинградском вагоностроительном заводе в обрезки уходило тринадцать процентов материала, а с учеником Канторовича Виктором Залгаллером — четыре. Втрое меньше. В тысяча девятьсот пятьдесят первом году Канторович и Залгаллер выпустили книгу «Расчёт рационального раскроя промышленных материалов». Всё в ней считали вручную: компьютеров ещё не было.»</p>"
    - "<p>«И последняя остановка. Найдите в пяти фактах последний. Француз Гаспар Монж в тысяча семьсот восемьдесят первом году спрашивал: как перевезти землю из выемок в насыпи с наименьшими затратами? Монж доказывал свою теорему с большим трудом, а Канторович — на двух страницах. Сегодня это задача Монжа — Канторовича, и в две тысячи десятом году француз Седрик Виллани получил за работу по ней медаль Филдса. Вот и весь зал. Заводская задача о фанере, брошюра в шестьдесят восемь страниц, восемь лет форы перед Америкой и Стокгольм в тысяча девятьсот семьдесят пятом. Теперь можно раскроить лист без отходов или открыть пять фактов о Канторовиче ниже.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
