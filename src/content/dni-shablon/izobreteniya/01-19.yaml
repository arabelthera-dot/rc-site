story:
  kicker: История изобретения
  h2: Задача фанерного треста
  udary:
    - summary: В 1938-м фанерный трест спросил 26-летнего профессора, как выжать из восьми типов станков больше фанеры, — и из заводского вопроса родилась наука.
      det:
        - "Сотрудники Центральной лаборатории Ленинградского фанерного треста принесли Канторовичу задачу: пять видов работ, лущильные станки восьми типов — как распределить работу, чтобы выпуск был наибольшим. Перебрать все варианты вручную было немыслимо."
        - "Канторович увидел, что это задача нового класса: найти наибольшее значение при множестве ограничений-неравенств. И дал общий способ её решать — «разрешающие множители», которые сегодня называют двойственными оценками. Они показывают, во что обходится каждый станок и каждая работа, и ведут к лучшему плану без перебора."
        - "В мае 1939 года он доложил метод в Актовом зале университета, и в том же году Издательство ЛГУ выпустило брошюру «Математические методы организации и планирования производства» — 68 страниц. Институт математики СО РАН пишет о ней: здесь Канторович «впервые дал математическую постановку производственных задач оптимального планирования и предложил эффективные методы их решения»."
      src: "Источник: Л. В. Канторович. Биобиблиографический указатель. Новосибирск: ИМ СО РАН, 2012; Институт математики им. С. Л. Соболева СО РАН; «Санкт-Петербургский университет», № 1, 25.01.2012."
fakty:
  id: fakty-dnya
  kicker: Факты дня · с документом
  h2: Калькулятор, нейросети и американская премия
  udary:
    - summary: <b>Счётную машину «Вильнюс» придумал Канторович.</b> Её десять лет выпускали серийно на трёх заводах.
      det:
        - До электронных калькуляторов считали на арифмометрах. Канторович с сотрудниками придумал электрическую клавишную машину. Она сама выполняла арифметические действия.
        - Заявку на изобретение подали в 1958 году. Машину делали на трёх заводах, в Вильнюсе — под именем «Вильнюс». Выпускали её десять лет, пока не появились настольные электронные калькуляторы.
      src: "Источник: Виртуальный компьютерный музей, «Галерея славы»: «Академик Леонид Витальевич Канторович» — https://www.computer-museum.ru/galglory/21.htm; «Нобелевский лауреат Леонид Канторович и его вклад в IT», Хабр, блог «Онлайн Патент» — https://habr.com/ru/companies/onlinepatent/articles/883314/"
      otryvok: «Л. В. Канторович предложил модель оригинальной релейной клавишной машины для автоматического выполнения арифметических операций, на которую в 1958 г. им было получено авторское свидетельство. Она выпускалась на трех заводах, в том числе в Вильнюсе машина «Вильнюс», в течение 10 лет вплоть до появления настольных электронных счетно-клавишных машин (калькуляторов).»
      stranica: "Виртуальный компьютерный музей, «Галерея славы»: «Академик Леонид Витальевич Канторович»"
      href: https://www.computer-museum.ru/galglory/21.htm
      pometka: два источника
    - summary: <b>Нейросети учатся по формуле Канторовича.</b> В 2017 году генератор картинок Wasserstein GAN построили на его теореме.
      det:
        - Нейросеть, которая рисует лица или пейзажи, нужно учить. Для этого надо измерить, насколько её картинки «далеки» от настоящих. Авторы Wasserstein GAN взяли «расстояние землекопа» — по сути ту самую задачу о перевозке земли.
        - Посчитать его помогла теорема Канторовича и его ученика Г. Ш. Рубинштейна. Статью написали учёные Курантовского института и Facebook AI Research. Математика 1940-х годов работает внутри искусственного интеллекта.
      src: "Источник: M. Arjovsky, S. Chintala, L. Bottou, «Wasserstein GAN», arXiv:1701.07875, 2017, раздел 3 — https://arxiv.org/pdf/1701.07875"
      otryvok: "«On the other hand, the Kantorovich-Rubinstein duality [22] tells us that W(Pr, Pθ) = sup ∥f∥L≤1 Ex∼Pr[f(x)] − Ex∼Pθ[f(x)]» (Перевод: «С другой стороны, двойственность Канторовича — Рубинштейна говорит нам, что [расстояние Вассерштейна] равно…».)"
      stranica: M. Arjovsky, S. Chintala, L. Bottou, «Wasserstein GAN», arXiv:1701.07875, раздел 3
      href: https://arxiv.org/pdf/1701.07875
      pometka: документ
    - summary: <b>Брошюру 1939 года признали лучшей работой США за 1960 год.</b> Так решило Американское общество исследования операций.
      det:
        - Двадцать лет на Западе работу Канторовича не знали. В 1960 году по почину Тьяллинга Купманса её перевели и напечатали в американском журнале Management Science.
        - Общество исследования операций (ORSA) дало ей почётный диплом как лучшей работе года по исследованию операций в США. Тексту тогда был 21 год.
      src: "Источник: Институт математики им. С. Л. Соболева СО РАН, хронология «Leonid Vitalyevich Kantorovich» — http://old.math.nsc.ru/persons/Kanten.html; Л. В. Канторович, автобиография, NobelPrize.org — https://www.nobelprize.org/prizes/economic-sciences/1975/kantorovich/biographical/"
      otryvok: "«1960 Awarded an honorary diploma of the Operations Research Society of America for the best work on the operations research published in the U.S.A. in the I960 (Translation of Mathematical methods of the industry organization and planning, 1939).» (Перевод: «1960 — почётный диплом Американского общества исследования операций за лучшую работу по исследованию операций, опубликованную в США в 1960 году (перевод „Математических методов организации и планирования производства“, 1939).»)"
      stranica: Институт математики им. С. Л. Соболева СО РАН, хронология «Leonid Vitalyevich Kantorovich», 1960
      href: http://old.math.nsc.ru/persons/Kanten.html
      pometka: документ
    - summary: <b>Первая в мире книга о приближённых методах высшей математики.</b> Канторович написал её с В. И. Крыловым в 1936 году.
      det:
        - Сегодня мосты и самолёты считают на компьютерах приближёнными методами. В 1936 году компьютеров ещё не было. Канторович и Крылов собрали такие методы в книгу «Методы приближённого решения уравнений в частных производных».
        - Это первая в мировой литературе книга по численным методам высшего анализа. Её переиздавали и переводили на английский, немецкий, венгерский и румынский.
      src: "Источник: С. С. Кутателадзе, В. Л. Макаров, И. В. Романовский, Г. Ш. Рубинштейн, «Л. В. Канторович — математик и экономист», Санкт-Петербургское математическое общество — http://mathsoc.pdmi.ras.ru/pantheon/kantorov/lvkumn.html; биобиблиографический указатель ИМ СО РАН, 2012 — http://old.math.nsc.ru/LBRT/g2/english/ssk/lvk_bio.pdf"
      otryvok: «Разработанные Л. В. Канторовичем методы отражены в монографии 1936 г., написанной им совместно с В. И. Крыловым, «Методы приближенного решения уравнений в частных производных» (2-е изд. — «Приближенные методы высшего анализа», 1941 г.). Это сочинение стало первой в мировой научной литературе книгой по численным методам высшего анализа, неоднократно переиздававшейся в дальнейшем в нашей стране и за рубежом.»
      stranica: С. С. Кутателадзе и др., «Л. В. Канторович — математик и экономист», раздел «Вычислительная математика»
      href: http://mathsoc.pdmi.ras.ru/pantheon/kantorov/lvkumn.html
      pometka: два источника
    - summary: "<b>«Прорабы»: программы крупными блоками.</b> Школа Канторовича описала их в 1956 году — на 30 лет вперёд."
      det:
        - С 1953 года, когда появились первые советские ЭВМ, Канторович занялся автоматизацией программирования. Машина понимала только свой язык команд, а математик думает формулами.
        - "Школа Канторовича строила мост между ними: программу записывали крупными блоками — целыми действиями над таблицами чисел. Первые такие системы назвали «прорабами»."
      src: "Источник: Виртуальный компьютерный музей, «Галерея славы»: «Академик Леонид Витальевич Канторович» — https://www.computer-museum.ru/galglory/21.htm; «Леонид Канторович — 100-летие Нобелевского лауреата», IT-Week — https://www.itweek.ru/idea/article/detail.php?ID=136421"
      otryvok: «Сведения о первых системах крупноблочного программирования, разработанных этой школой и названных «прорабами», были опубликованы в 1956 г. Идеи, предложенные школой Л. В. Канторовича, во многом предвосхитили развитие программирования на последующие 30 лет.»
      stranica: "Виртуальный компьютерный музей, «Галерея славы»: «Академик Леонид Витальевич Канторович»"
      href: https://www.computer-museum.ru/galglory/21.htm
      pometka: два источника
razdely:
  - posle: igra
    html: |-
      <section class="block" id="fakty">
        <div class="wrap">
          <div class="kicker">Пять фактов о Канторовиче</div>
          <h2>Математик, которого чуть не посадили за Нобелевскую идею</h2>
          <ol class="udary">
            <li><details><summary><span>Американец Данциг открыл тот же метод через восемь лет — и сам написал: первым был Канторович.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Ленинградская брошюра «Математические методы организации и планирования производства» вышла в 1939 году. В США линейное программирование появилось только в 1947-м, в работах Джорджа Данцига, — на восемь лет позже. Данцига называют отцом симплекс-метода, и он же признал: «Канторовича следует признать первым, кто обнаружил, что широкий класс важнейших производственных задач поддаётся чёткой математической формулировке».</p>
                <p>И добавил: «Работа Л. В. Канторовича 1939 г. содержит почти все области приложений, известные в 1960 г.».</p>
                <p class="src-note">Источник: Институт математики им. С. Л. Соболева СО РАН, биобиблиографический указатель «Л. В. Канторович», 2012 — <a href="http://old.math.nsc.ru/LBRT/g2/english/ssk/lvk_bio.pdf" rel="noopener" target="_blank">old.math.nsc.ru/LBRT/g2/english/ssk/lvk_bio.pdf</a> (цитаты Данцига — по изданию: Данциг Дж. Б. Линейное программирование, его обобщения и применения. М.: Прогресс, 1966. С. 29); С. С. Кутателадзе и др. «Л. В. Канторович — математик и экономист», ПОМИ РАН — <a href="http://mathsoc.pdmi.ras.ru/pantheon/kantorov/lvkumn.html" rel="noopener" target="_blank">mathsoc.pdmi.ras.ru/pantheon/kantorov/lvkumn.html</a>.</p>
              </div></details></li>
            <li><details><summary><span>Канторовича едва не посадили за «буржуазную» экономику — за неё же потом дали Нобелевскую.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>В войну Канторович ездил из Ярославля, куда эвакуировали его военное училище, в Москву и пытался докладывать, что экономические задачи можно решать новыми методами. Его, вспоминает сын, «смешали с грязью, объявили приверженцем австрийской школы и чуть не посадили»: он боялся ареста, спасло заступничество начальства училища. Обвиняли в сходстве с идеями итальянца Парето — а Парето, напоминали ему, «любил Муссолини».</p>
                <p>Книгу «Экономический расчёт наилучшего использования ресурсов», готовую в 1942 году, напечатали только в 1959-м: она, как пишет Институт математики СО РАН, «настолько не соответствовала догматам тогдашней политической экономии». А в 1975-м за эти самые идеи — теорию оптимального распределения ресурсов — Канторович получил Нобелевскую премию по экономике.</p>
                <p class="src-note">Источник: «Санкт-Петербургский университет», № 1, 2012, воспоминания детей и учеников — <a href="https://journal.spbu.ru/?p=6167" rel="noopener" target="_blank">journal.spbu.ru/?p=6167</a>; Институт математики им. С. Л. Соболева СО РАН — <a href="http://old.math.nsc.ru/LBRT/u2/nauka/kant.html" rel="noopener" target="_blank">old.math.nsc.ru/LBRT/u2/nauka/kant.html</a>.</p>
              </div></details></li>
            <li><details><summary><span>В 1948-м Канторовичу дали две недели, чтобы собрать расчётчиков для атомного проекта.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Особо секретное постановление Совета Министров СССР № 1990–774сс/оп велело «в двухнедельный срок организовать… расчётную группу в количестве до 15 человек, возложив руководство этой группой на проф. Канторовича». Математик, начавший с фанеры, считал для ядерного оружия.</p>
                <p class="src-note">Источник: Институт математики им. С. Л. Соболева СО РАН, биобиблиографический указатель «Л. В. Канторович», 2012 — <a href="http://old.math.nsc.ru/LBRT/g2/english/ssk/lvk_bio.pdf" rel="noopener" target="_blank">old.math.nsc.ru/LBRT/g2/english/ssk/lvk_bio.pdf</a>.</p>
              </div></details></li>
            <li><details><summary><span>Математика Канторовича втрое сократила отходы на вагонном заводе: было 13 процентов, стало 4.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>На ленинградском вагоностроительном заводе по плану в обрезки уходило 13% материала. Свои рационализаторы довели потери до 8%, а с учеником Канторовича Виктором Залгаллером — до 4%: «стало втрое меньше, колоссальная экономия!». В 1948–1950 годах метод раскроя ввели на заводе имени Егорова и на Кировском заводе, а в 1951-м Канторович и Залгаллер выпустили книгу «Расчёт рационального раскроя промышленных материалов» — всё в ней считали вручную, компьютеров ещё не было.</p>
                <p class="src-note">Источник: «Санкт-Петербургский университет», № 1, 2012 — <a href="https://journal.spbu.ru/?p=6167" rel="noopener" target="_blank">journal.spbu.ru/?p=6167</a>; С. С. Кутателадзе и др., ПОМИ РАН — <a href="http://mathsoc.pdmi.ras.ru/pantheon/kantorov/lvkumn.html" rel="noopener" target="_blank">mathsoc.pdmi.ras.ru/pantheon/kantorov/lvkumn.html</a>.</p>
              </div></details></li>
            <li><details><summary><span>Задачу француза Монжа 1781 года Канторович решил на двух страницах — Монж доказывал её с большим трудом.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Гаспар Монж в мемуаре 1781 года спрашивал: на поле роют окопы и насыпают валы — как перевезти землю из выемок в насыпи с наименьшими затратами? Монж доказывал свою теорему «с большим трудом», после него за неё брались ещё двое учёных. Канторович после войны наткнулся на работу Монжа и увидел: его собственная транспортная задача доказывает это «на двух страницах».</p>
                <p>Сегодня это «задача Монжа — Канторовича». В 2010 году француз Седрик Виллани получил за работу по ней медаль Филдса — высшую награду математиков.</p>
                <p class="src-note">Источник: «Санкт-Петербургский университет», № 1, 2012, рассказ И. В. Романовского — <a href="https://journal.spbu.ru/?p=6167" rel="noopener" target="_blank">journal.spbu.ru/?p=6167</a>.</p>
              </div></details></li>
          </ol>
          <figure class="fig-doc" style="margin:22px 0 0">
            <img src="day-19jan-kantorovich-matrikul.jpg" data-source="https://goskatalog.ru/portal/#/collections?id=57973269" data-license="Музей истории СПбГУ, Госкаталог № 57677795; цитирование, ст. 1274 ГК РФ" width="570" height="387" loading="lazy" alt="Старый документ: слева наклеена фотография мальчика-подростка, справа печатный заголовок «Матрикул студента Ленинградского государственного университета», дело № 1175 и записи от руки">
            <figcaption>Студенческий матрикул Леонида Канторовича, 1926 год: в 14 лет он уже студент университета. <span class="credit">Хранится: Музей истории СПбГУ. Госкаталог музейного фонда РФ, № 57677795.</span></figcaption>
          </figure>
        </div>
      </section>
  - posle: pervenstvo
    html: |-
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2 class="s19-3">Для тех, кто смотрит внимательно</h2>
          <details class="deepd">
            <summary>Четыре сюжета подробно — развернуть</summary>
            <h3>Что такое «разрешающие множители»</h3>
            <p>Канторович придумал приписывать каждому ограничению — станку, сырью, рабочему времени — своё число. Эти числа показывают, во что на самом деле обходится каждый ресурс, и подсказывают, в какую сторону менять план, пока он не станет лучшим. Сегодня их называют двойственными оценками, и без них не обходится ни одна программа планирования.</p>
            <h3>Почему задача «линейная»</h3>
            <p>Если один станок за смену делает столько-то листов, то два — вдвое больше: всё складывается и умножается без хитростей. Трудность не в формулах, а в их количестве: восемь станков, пять работ — и вариантов столько, что перебрать их невозможно. Канторович нашёл путь к лучшему плану без перебора.</p>
            <h3>Данциг, Купманс и Канторович</h3>
            <p>Данциг в 1947 году придумал симплекс-метод, которым такие задачи решают на компьютерах. Купманс в 1951-м дал науке имя — «линейное программирование». Оба признавали, что первым был ленинградец: Данциг написал это прямо, Купманс отстаивал приоритет Канторовича. Нобелевский комитет в 1975-м отметил двоих — Канторовича и Купманса.</p>
            <h3>Почему день — 19 января</h3>
            <p>19 января 1912 года Канторович родился в Петербурге. В справочниках часто стоит другая дата, но Институт математики СО РАН держится этой — да и сам он говорил, что «себя помнит с 19.01.1912».</p>
          </details>
          <div class="src">Источники: old.math.nsc.ru · mathsoc.pdmi.ras.ru · journal.spbu.ru · library.spbu.ru · bioslovhist.spbu.ru · goskatalog.ru · kommersant.ru</div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="mirovoy-kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2 class="s19-5">Что в это время делал мир</h2>
          <p class="s19-6">1939 год. В Ленинграде выходит тонкая брошюра в 68 страниц о том, как наилучшим образом загрузить станки. Остальной мир о такой науке ещё не знает: в США линейное программирование появится только в 1947 году у Джорджа Данцига, а своё имя получит в 1951-м от Тьяллинга Купманса.</p>
          <p class="s19-6">Дома главная книга Канторовича, написанная в 1942-м, лежит в столе до 1959 года. А Данциг потом напишет, что почти все применения линейного программирования, известные к 1960 году, уже были в ленинградской работе 1939-го.</p>
          <p class="s19-6">Отсюда вывод, ради которого этот день стоит в календаре: <b class="s19-7">первым бывает тот, кто в обычной заводской задаче увидел закон, по которому живёт любое хозяйство.</b> В 1975 году Стокгольм это признал.</p>
          <p class="src-note">Источник: Биобиблиографический указатель, ИМ СО РАН, 2012 (со ссылкой на русское издание Данцига, 1966, с. 29); Институт математики им. С. Л. Соболева СО РАН.</p>
        </div>
      </section>
