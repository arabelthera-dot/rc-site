  granica: <b>Граница первенства:</b> первая в мире математическая постановка задач оптимального планирования — найти лучший план при множестве линейных ограничений — и общий метод их решения, «разрешающие множители». Ленинград, 1939 год, брошюра «Математические методы организации и планирования производства».
  net: "<b>Чего здесь нет:</b> сегодняшних компьютерных способов счёта — здесь только то, что сделал сам Канторович и когда."
