    otryvok: «Канторовича следует признать первым, кто обнаружил, что широкий класс важнейших производственных задач поддается четкой математической формулировке…»
    stranica: А. Алексеев, «Оптимум Канторовича», «Коммерсантъ. Деньги», 22.10.2026
