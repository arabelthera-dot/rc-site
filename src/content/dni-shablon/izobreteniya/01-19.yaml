return:
  q: Сколько лет прошло между отзывом Госплана «невозможно какое-либо практическое использование» и Нобелевской премией за ту же книгу?
  a: "31 год: отзыв — 1944, премия — 1975."
  src: Биобиблиографический указатель Л. В. Канторовича, ИМ СО РАН, 2012
audioguide:
  audioSrc: audio-guide-kantorovich-2-ru.mp3
  durationLabel: около двух минут
  lead: "Голос ведёт по залу первой в мире математики оптимального плана: от льда Ладоги через задачу о фанере и опасный спор в Госплане к Нобелевской премии."
  stops:
    - t: 0
      mark: '0:00'
      title: Лёд Ладоги
    - t: 24
      mark: '0:24'
      title: Без миллиарда уравнений
    - t: 52
      mark: '0:52'
      title: Опасный оптимум
    - t: 79
      mark: '1:19'
      title: Отходы и выговор
    - t: 106
      mark: '1:46'
      title: Тридцать один год
  transcript:
    - Здравствуйте. Мы в зале первой в мире математики оптимального плана — линейного программирования. В блокаду Канторович преподавал в военном инженерном училище и считал, какую нагрузку выдержит лёд Ладожского озера. По его расчёту танки должны были идти по льду с промежутком двадцать семь метров. Курсант Образцов вспоминал, что учёный, чтобы доказать верность расчёта, сам сел в первый танк.
    - Всё началось с треста, который спрашивал, как распределить восемь видов материала между пятью станками, чтобы фанеры вышло больше. Перебором пришлось бы решить примерно миллиард систем уравнений. Канторович создал «разрешающие множители», которые ведут к лучшему плану без перебора. Брошюру напечатали за неделю, тысячей экземпляров, в тысяча девятьсот тридцать девятом году, а в США к тем же задачам пришли через восемь лет. Студентом Канторович стал в четырнадцать лет.
    - "В тысяча девятьсот сорок третьем году его работу разбирали в Госплане. Критики заявили, что само понятие оптимума взято у фашистской экономической науки. Канторович ответил: «Мы не будем добиваться минимума продукции, максимума затрат, минимума доходности только для того, чтобы не было с ним никакого сходства». После обсуждения на совещании встал вопрос о его аресте. Он почувствовал опасность и на время оставил эти работы: «Их продолжение становилось опасным»."
    - В тысяча девятьсот сорок восьмом — пятидесятом годах Канторович с учеником Виктором Залгаллером рассчитали на Ленинградском вагоностроительном заводе, как резать стальные листы. Отходы по плану были тринадцать процентов, заводские умельцы довели их до восьми, а с математиками до четырёх. Награды не было. Металлолом почти целиком состоял из обрезков, и план по его сдаче сорвался. Руководство получило выговор и больше с математиками не связывалось.
    - Книгу «Экономический расчёт наилучшего использования ресурсов» Канторович написал в годы войны и отправил в Госплан. В отзыве тысяча девятьсот сорок четвёртого года ответили, что «невозможно какое-либо практическое использование» его предложений. Книгу напечатали только в тысяча девятьсот пятьдесят девятом году. А в тысяча девятьсот семьдесят пятом году, через тридцать один год после того отзыва, Канторович получил за эти идеи Нобелевскую премию по экономике.
  note: Озвучено синтезом речи.
