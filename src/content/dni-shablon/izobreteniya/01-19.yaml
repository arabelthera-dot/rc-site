quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — не меньше 27 метров; 2 — около миллиарда; 3 — в 22 года; 4 — «Невозможно какое-либо практическое использование»; 5 — «Вильнюс»."
  ball: 8
  voprosy:
    - q: С каким промежутком, по расчёту Канторовича, танки должны были идти по льду Ладоги?
      o:
        - Не меньше 10 метров
        - Не меньше 27 метров
        - Не меньше 100 метров
      a: 1
      e: "Не меньше 27 метров — и в первый танк учёный сел сам. «Наука и жизнь», № 5, 2004."
    - q: Сколько систем уравнений пришлось бы решить, чтобы перебором ответить фанерному тресту?
      o:
        - Около тысячи
        - Около миллиона
        - Около миллиарда
      a: 2
      e: Около миллиарда — вручную немыслимо. Канторович обошёлся без перебора.
    - q: Во сколько лет Канторович стал профессором?
      o:
        - В 22 года
        - В 30 лет
        - В 40 лет
      a: 0
      e: В 14 — студент, в 22 — профессор, в 23 — доктор наук без защиты диссертации.
    - q: Что Госплан написал о книге Канторовича в 1944 году?
      o:
        - «Немедленно внедрить»
        - «Невозможно какое-либо практическое использование»
        - «Засекретить»
      a: 1
      e: А через 31 год за ту же книгу Канторович получил Нобелевскую премию.
    - q: Как назвали счётную машину Канторовича, которую десять лет выпускали три завода?
      o:
        - «Вильнюс»
        - «Ладога»
        - «Оптимум»
      a: 0
      e: «Вильнюс» — по городу одного из заводов. Выпускали, пока не пришли электронные калькуляторы.
