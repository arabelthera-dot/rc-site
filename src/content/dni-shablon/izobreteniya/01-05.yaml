          hint: "Фрагмент нефтяного резервуара · конец XIX — начало XX века"
          glavnoe_na_kartinke: "net"
          podpis_kogda: "конец XIX — начало XX века"
          podpis_gde: "Ханты-Мансийск, Музей геологии, нефти и газа"
          podpis_chto: "Фрагмент нефтяного резервуара"
          svyashchennoe: false
          vid: "predmet"
          prava: {"god_smerti_avtora":"net","god_reabilitacii":"net","sdelano_mashinoj":false,"otkuda":"Госкаталог музейного фонда РФ","baza":"goskatalog","pervaya_publikaciya":"Госкаталог музейного фонда РФ, рег. № 16194627","ssylka":"https://goskatalog.ru/portal/#/collections?id=16321636","avtor":"автор не указан","god_sozdaniya":"конец XIX — начало XX века","anonim":true}
          podlinnik: {"gde":"Музей геологии, нефти и газа, Ханты-Мансийск, МГНГ-ОФ-5889","otkuda":"https://goskatalog.ru/portal/#/collections?id=16321636"}
          nomer_predmeta: "инв. в Госкаталоге не указан; Госкаталог рег. № 16194627"
          nomer_snimka: "16194627"
          hranitel: "Музей геологии, нефти и газа, Ханты-Мансийск, МГНГ-ОФ-5889"
        det:
          - С 1878 по 1939 год по проектам Шухова построили около 1600 километров трубопроводов для нефти, больше 10 000 стальных баков для её хранения и больше 8 000 паровых котлов.
          - А началось всё с одной десятикилометровой трубы в Баку.
        src: "Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf."
        otryvok: «С 1878 по 1939 года на территории Российской империи и Советского Союза по проектам академика было построено около 1600 километров трубопроводов для транспортировки нефти и нефтепродуктов; более 10 000 стальных цилиндрических резервуаров для хранения нефти и нефтепродуктов…; более 8 000 паровых котлов системы Шухова…»
        stranica: «Владимир Григорьевич Шухов и его последователи», Политехнический музей
