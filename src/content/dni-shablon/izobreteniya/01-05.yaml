  - posle: story
    html: |-
      <section class="fullbleed" id="credo">
        <div class="fb-line t"></div><div class="fb-line b"></div>
        <div class="fb-ghost" aria-hidden="true">1878</div>
        <div class="wrap">
          <div class="sub">Вывод дня · лист 2</div>
          <h2 class="big">Всё, что течёт сегодня по трубам мира,<br>течёт по <em>формулам 1878 года</em></h2>
          <p class="after">Диаметр, давление, вязкость, расстояние между насосными станциями — Шухов вывел это первым и опубликовал. По этим формулам трубопроводы проектируют до сих пор, во всём мире.</p>
        </div>
      </section>
  - posle: story
    html: |-
      <section class="block" id="tower-sheet" data-nav="Чертёж" style="padding-top:26px">
        <div class="wrap">
          <div class="bp-sheet">
            <i class="bp-corner tl"></i><i class="bp-corner tr"></i><i class="bp-corner bl"></i><i class="bp-corner br"></i>
            <div class="bp-meta">Лист 2 · Гиперболоид · патент <i>1899</i></div>
            <div class="tower-box">
              <svg id="tower" viewBox="0 0 560 430" role="img" aria-label="Схема гиперболоида: каркас из прямых стержней"></svg>
              <div class="tower-cap">каркас собран из <b>прямых</b> стержней — ни одной гнутой детали · <button type="button" class="tower-cta cta-pulse" id="towerHint">▶ Показать прямой стержень</button></div>
            </div>
