      <div class="scene-caption">
        <div class="wrap">
          <div class="scene-cap">Слева — промысел Балаханы, справа — заводы Чёрного города, между ними десять километров трубы. Пока насос стоит, нефть тянут подводами — три тысячи бочек в день.</div>
