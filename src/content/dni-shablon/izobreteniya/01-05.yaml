pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "Граница первенства. Первый в мире расчётный нефтепровод. Балаханы — Чёрный город, Баку, 1878 год. Десять километров трёхдюймовой трубы, и всё посчитано заранее: какой диаметр держит нужный поток, какое давление дают насосы, где ставить перекачечные станции, как густеет нефть на холоде. Свои формулы Шухов опубликовал — по ним трубы проектируют до сих пор."
  net: "Чего здесь нет. Саму трубу для нефти придумал не Шухов. Нефть по трубам качали и до него — но на глаз, пробой и ошибкой. Первенство Шухова — в расчёте: нефтепровод перестал быть удачей и стал задачей с решением."
  kolonki:
    - Документ
    - Ещё первые в мире
  stroki:
    - - "Статья Шухова «Нефтепроводы». Журнал «Вестник промышленности», 1884, № 7. Хранится: РГАНТД, проект «Шухов»."
      - "Что ещё Шухов создал первым в мире. Первое в мире промышленное сжигание мазута форсункой (1880). Первая в мире гиперболоидная башня, первые в мире сетчатые перекрытия и первое в мире висячее стальное перекрытие (Нижний Новгород, 1896). Первая в мире установка непрерывного крекинга нефти (патент 1891)."
