  - posle: quiz
    html: |-
      <section class="block" id="fork" style="background:rgba(45,140,191,.04)">
        <div class="wrap">
          <div class="kicker">Твой выбор</div>
          <h2>А как поступил бы ты?</h2>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">1891 год. Ты запатентовал крекинг — способ получать бензин из тяжёлой нефти. Но в России бензин никому не нужен: автомобилей ещё нет. Ты на месте Шухова — что делаешь с патентом?</p>
          <div class="fork-opt">🌍 Продаю патент за границу — там оценят</div>
          <div class="fork-opt">📁 Оставляю в столе и строю дальше: время покажет</div>
          <div class="fork-opt">🏭 Строю крекинг-завод на свои деньги — рынок появится</div>
          <div id="forkReal" style="display:none;margin-top:14px" class="exp"><b>Как было на самом деле.</b> Патент остался в столе: Шухов строил башни, котлы и трубопроводы. В 1913-м американец Бартон запатентовал почти тот же процесс — и Америка стала бензиновой державой. А в 1923-м делегация «Синклер» в Москве сверила патенты и признала первенство Шухова. Приоритет остался за Россией, индустрия — за океаном.</div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="theme-inventions" style="background:rgba(201,168,76,.03);border-top:1px solid rgba(201,168,76,.15)">
        <div class="wrap">
          <div class="kicker">Транспорт · Русские первенства</div>
          <h2 style="margin-bottom:6px">Что ещё русские изобрели первыми в теме «транспорт»</h2>
          <p style="color:var(--muted);margin-top:0;margin-bottom:16px;max-width:62ch">Этот день — не единственный. Вот другие изобретения русских в этой теме.</p>
          <div style="text-align:center;margin:14px 0 4px">
            <button class="btn gold" id="themeInvBtn">Показать 19 изобретений →</button>
          </div>
          <div id="themeInvBody" style="display:none;margin-top:20px">
            <div class="card" style="padding:0;overflow:hidden">
              <div style="padding:14px 20px;background:rgba(201,168,76,.08);border-bottom:1px solid rgba(201,168,76,.15)">
                <span style="color:var(--gold-l);font-weight:600;font-size:14px;letter-spacing:.5px">19 ИЗОБРЕТЕНИЙ · ТРАНСПОРТ</span>
              </div>
              <div style="padding:4px 20px 12px">
      <div style="display:grid;grid-template-columns:110px 1fr;gap:6px 12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;align-items:baseline">
                <span style="color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap">3 янв</span>
                <span><a href="day-03feb-luna9.html" style="color:inherit;text-decoration:none;border-bottom:1px solid rgba(201,168,76,.3);transition:.15s" onmouseover="this.style.color='var(--gold-l)'" onmouseout="this.style.color='inherit'">Первый в мире атомный ледокол-речник «Обь» и атомный флот →</a></span>
              </div>
