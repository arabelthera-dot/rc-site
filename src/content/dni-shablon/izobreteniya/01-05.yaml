story:
  kicker: История изобретения
  h2: Труба, по которой потёк XX век
  abzacy:
    - |-
      <div class="article collapsed" id="article">
            <div class="body" id="articleBody">
    - <p><b>Конец 1878 года, Баку.</b> На нефтепромысле Балаханы запускают паровой насос. Нефть уходит в трёхдюймовую стальную трубу и — впервые в истории промышленности — сама течёт десять километров до нефтеперегонных заводов Чёрного города. Ни бочек. Ни подвод. Ни возчиков. У трубы стоит автор проекта — инженеру Владимиру Шухову двадцать пять лет.</p>
    - "<p><b>Кто этот человек.</b> Выпускник Императорского технического училища. Пафнутий Чебышёв звал его на кафедру — Шухов отказался: чистая математика его не держала, он хотел строить. Потом про него скажут «первый инженер Российской империи» и «русский Леонардо». Нефть, вода, мосты, башни, котлы — любая задача. Он считал там, где другие работали на глазок.</p>"
    - "<p><b>В чём была загвоздка.</b> Баку 1870-х — нефтяная столица мира, задыхавшаяся от собственной нефти. Добыть её научились, а вот доставить с промыслов на заводы — нет. Нефть заливали в деревянные бочки по двадцать с лишним пудов, ставили на арбы, и больше десяти тысяч возчиков днём и ночью тянулись через город. Пуд нефти стоил на промысле три копейки. Довезти этот же пуд до завода — до двадцати. Возчики держали монополию и цену, промышленники платили: выхода не было.</p>"
    - <p><b>Как родилась идея.</b> Шухов приехал в Баку от конторы инженера Бари. И увидел в хаосе не беду, а задачу по гидравлике. В Америке нефть по коротким трубам уже качали — но на ощупь, пробой и ошибкой. Шухов сел за расчёт. Какой диаметр держит нужный поток, какое давление дают насосы, где ставить перекачечные станции, как густеет нефть на холоде. Не прикидка. Наука о трубопроводах, написанная с нуля.</p>
    - "<p><b>Что он построил.</b> Десять километров. Труба в три дюйма — от промыслов Балаханы до заводов Чёрного города. Паровые насосы гнали по ней 80 тысяч пудов в сутки, тринадцать сотен тонн. Платил Нобель: та самая семья, чья фамилия теперь стоит на премии, тогда просто считала убытки от бочек. Перекачка вышла в разы дешевле подвод. Свои формулы Шухов не спрятал в стол — опубликовал. По ним трубы проектируют до сих пор.</p>"
    - "<p><b>Испытания.</b> Труба отняла работу у тысяч возчиков — и они пришли её ломать. Первые нитки охраняли казаки. Человек, всю жизнь возивший бочки через Баку, видел в стальной трубе не прогресс, а конец заработка. Спор решили не доводы, а деньги: перекачка была дешевле. Через несколько лет Шухов тянул в Баку новые нитки, через десять — труба стала отраслевым стандартом. В 1907 году он дотянул керосинопровод от Баку до Батума. 835 километров через горы, самый длинный в мире.</p>"
    - "<p><b>Горькая часть.</b> Второе великое нефтяное изобретение Шухова украли — вежливо, по-патентному. В 1891 году он запатентовал крекинг: разложение тяжёлой нефти на лёгкие фракции нагревом под давлением — основу производства бензина. Россия патент не использовала: бензин был никому не нужен, автомобилей ещё не было. А в 1913 году американец Уильям Бартон запатентовал в США почти то же самое — и Америка стала бензиновой державой. Когда в 1923 году делегация фирмы «Синклер» приехала в Москву разбираться в патентном споре, Шухов показал им свой патент 1891 года. Американцы признали: русский был первым. Но промышленность и деньги остались за океаном.</p>"
    - "<p><b>Финал.</b> Всё, что сегодня течёт по миллионам километров труб — нефть, газ, бензин, — течёт по формулам 1878 года. Труба была первой большой работой Шухова. И не самой известной: дальше башни, перекрытия, баржи, котлы, около двухсот изобретений. Общее у них одно. Сначала бумага и расчёт, потом стройка.</p>"
    - "<p><b>Человек.</b> Владимир Григорьевич Шухов (1853–1939) — родился в Грайвороне Курской губернии в небогатой дворянской семье. Работал до 85 лет. От гонораров за многие проекты отказывался, повторяя, что инженер обязан стране. Погиб нелепо и трагически: опрокинул на себя свечу, получил ожоги и умер через пять дней — в 1939 году, всемирно признанным классиком инженерии.</p>"
    - |-
      </div>
            </div>
            <div class="more"><button class="btn ghost" id="moreBtn">Читать дальше ↓</button></div>
          </div>
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Шухове
    h2: Инженер, которого боялись возчики
    udary:
      - summary: <b>Американцы приехали разбираться — и Шухов доказал, что их бензин делают по его патенту.</b>
        det:
          - "Американские нефтяники приехали в Москву выяснять, чей способ делать бензин, и Шухов доказал: их заводы повторяют его патент 1891 года."
          - 27 ноября 1891 года Шухов вместе с Сергеем Гавриловым получил патент на установку, которая непрерывно разлагает тяжёлую нефть и мазут на лёгкие части. Так из отходов получают бензин. Тогда бензин был почти никому не нужен, и в России патент долго лежал без дела.
          - Его заметили американцы и стали пользоваться им без разрешения. Когда американские инженеры приехали в Москву, Шухов показал, что их установки повторяют его патент и своего в них нет. Комиссия американской компании «Синклер» оценила один этот патент в несколько десятков тысяч долларов.
          - "Шухов денег не взял: «Я работаю на государство и ни в чем не нуждаюсь». Дома его способ впервые применили только в 1931 году, на бакинском заводе «Советский крекинг»."
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>; «Универсальный гений. Гиперболоиды инженера Шухова», «Аргументы и факты», 14.03.2012 — <a href="https://aif.ru/society/people/universalnyy_geniy_giperboloidy_inzhenera_shuhova" rel="noopener">aif.ru/society/people/universalnyy_geniy_giperboloidy_inzhenera_shuhova</a>.'
        otryvok: «…один только патент на крекинг-процесс в США комиссия Синклера, — конкурента Рокфеллера по нефтяному бизнесу, — оценила в несколько десятков тысяч долларов (по сегодняшнему курсу — несколько миллионов), которые Шухов принять категорически отказался…» («Аргументы и факты»)
        stranica: «Универсальный гений. Гиперболоиды инженера Шухова», «Аргументы и факты», 14.03.2012
        href: https://aif.ru/society/people/universalnyy_geniy_giperboloidy_inzhenera_shuhova
        pometka: два источника
      - summary: <b>Шухову вынесли «условный расстрел» — а он всё равно достроил башню на Шаболовке.</b>
        det:
          - Шухову вынесли приговор «условный расстрел», и он достроил башню на Шаболовке, зная, что любая новая авария может стоить ему жизни.
          - 29 июня 1921 года, когда поднимали четвёртую секцию башни, сломалась третья. Четвёртая упала и повредила вторую и первую. Комиссия решила, что виновата «усталость металла», а проект безупречен.
          - "Шухова всё равно вызывали на допросы. 30 июля 1921 года он записал в дневнике: «Приговор Шухову — условный расстрел». Заменить его было некем, поэтому он продолжил стройку, хотя при малейшей ошибке приговор мог стать настоящим."
          - Башня заработала 19 марта 1922 года. После этого обвинение сняли, условный расстрел отменили.
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>; Д. Чижов, «Главный русский инженер: 170 лет со дня рождения Владимира Шухова», «Российская газета», 28.08.2023 — <a href="https://rg.ru/2023/08/28/glavnyj-russkij-inzhener-170-let-so-dnia-rozhdeniia-vladimira-shuhova.html" rel="noopener">rg.ru/2023/08/28/glavnyj-russkij-inzhener-170-let-so-dnia-rozhdeniia-vladimira-shuhova.html</a>.'
        otryvok: "«30 июля 1921 года он записал в дневнике: „Приговор Шухову — условный расстрел“» (Политехнический музей). — «В марте 1922 года башню сдали в эксплуатацию. С Шухова сняли обвинение и отменили условный расстрел» («Российская газета»)."
        stranica: «Владимир Григорьевич Шухов и его последователи», Политехнический музей
        href: https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf
        pometka: два источника
      - summary: "<b>Шухов рассчитал башню выше Эйфелевой — и втрое легче: 2200 тонн против 7300.</b>"
        det:
          - "Шухов рассчитал башню выше Эйфелевой, 350 метров против 300, а железа в ней втрое меньше: 2200 тонн против 7300."
          - По первому проекту радиобашня должна была подняться на 350 метров и обогнать Эйфелеву башню. Та до 2010 года была высотой 300 метров. По расчётам, шуховская башня весила бы всего 2200 тонн, а парижская весит 7300 тонн.
          - В разорённой стране на рекорд не хватило металла. С трудом нашли 240 тонн железа, и построили башню высотой 160 метров.
        src: 'Источник: «Шуховская башня в Москве — история и интересные факты», RUSSPASS Журнал — <a href="https://mag.russpass.ru/rubric/moskva/shuhovskaya-bashnya-v-moskve" rel="noopener">mag.russpass.ru/rubric/moskva/shuhovskaya-bashnya-v-moskve</a>; «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>.'
        otryvok: «Согласно первоначальному проекту, башня должна была быть высотой 350 метров — предполагалось, что она обгонит Эйфелеву (300 метров). При этом вес высокой Шуховской башни, по расчетам, составил бы всего 2200 тонн — против 7300 тонн парижской.»
        stranica: «Шуховская башня в Москве — история и интересные факты», RUSSPASS Журнал
        href: https://mag.russpass.ru/rubric/moskva/shuhovskaya-bashnya-v-moskve
        pometka: два источника
      - summary: <b>Форсунку студента Шухова Менделеев поместил на обложку книги, а Нобель тут же купил патент.</b>
        det:
          - Форсунку студента Шухова Менделеев поместил на обложку своей книги, а Людвиг Нобель сразу купил у него патент.
          - В 1876 году студент Шухов откликнулся на призыв Менделеева беречь нефть. Он придумал паровую форсунку, которая распыляет мазут в топке и сжигает его. До этого мазут считали отходом.
          - Опытный образец он сам сделал и испытал в мастерских училища. Изобретение высоко оценил Менделеев, и рисунок форсунки появился на обложке его книги «Основы фабрично-заводской промышленности» (1897). Людвиг Нобель, глава огромного нефтяного концерна и брат основателя премии, сразу купил у Шухова патент на её производство.
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>; Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013 — <a href="https://www.nkj.ru/archive/articles/23482/" rel="noopener">www.nkj.ru/archive/articles/23482</a>.'
        otryvok: «Впоследствии это изделие высоко оценил Менделеев, и изображение форсунки Шухова украсило обложку книги великого химика „Основы фабрично-заводской промышленности“ (1897)» (Политехнический музей). — «А Людвиг Нобель, глава громадного нефтяного концерна и брат основателя престижной премии, сразу приобрёл у Владимира патент на её производство» («Наука и жизнь»).
        stranica: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013
        href: https://www.nkj.ru/archive/articles/23482/
        pometka: два источника
      - summary: <b>Почти в 80 лет Шухов выпрямил падающий пятисотлетний минарет весом 2500 тонн.</b>
        det:
          - "Почти в восемьдесят лет Шухов выпрямил падающий пятисотлетний минарет в Самарканде: кирпичную громаду весом 2,5 тысячи тонн."
          - Минарет медресе Улугбека построили в XV веке. После землетрясения он накренился и мог упасть. В 1932 году объявили конкурс проектов, как его спасти.
          - Шухов выиграл конкурс и сам руководил работами. Для этого он придумал механизм, который работает как коромысло. Тросы и клинья осторожно подняли кирпичную башню весом 2,5 тысячи тонн в отвесное положение.
          - За четыре дня минарет выпрямили на 1,5 метра и поставили на прочное основание. Это была последняя большая работа Шухова.
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>; Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013 — <a href="https://www.nkj.ru/archive/articles/23482/" rel="noopener">www.nkj.ru/archive/articles/23482</a>; «Биография В. Г. Шухова», РГАНТД (Российский государственный архив научно-технической документации) — <a href="https://rgantd.ru/shuhov/biography/" rel="noopener">rgantd.ru/shuhov/biography</a>.'
        otryvok: «Остроумно устроенная система тросов и клиньев позволила осторожно поднять в отвесное положение кирпичную громаду весом в 2,5 тысячи тонн. За четыре дня минарет выпрямили на 1,5 метра и поставили на прочное основание.»
        stranica: «Владимир Григорьевич Шухов и его последователи», Политехнический музей
        href: https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf
        pometka: два источника
      - summary: <b>Шухов создал первую в мире гиперболоидную башню — после выставки её купили и увезли в имение.</b>
        det:
          - "В 1896 году на Всероссийской выставке в Нижнем Новгороде Шухов поставил водонапорную башню невиданного вида: сетку из прямых стальных стержней. Наверху, на высоте 25,6 метра, стоял бак на 114 000 литров — он поил водой всю выставку."
          - Когда выставка закрылась, башню купил помещик Нечаев-Мальцов и перевёз в своё имение Полибино под Липецком. Она стоит там до сих пор.
        src: 'Источник: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013 — <a href="https://www.nkj.ru/archive/articles/23482/" rel="noopener">www.nkj.ru/archive/articles/23482</a>; Д. Чижов, «Главный русский инженер: 170 лет со дня рождения Владимира Шухова», «Российская газета», 28.08.2023 — <a href="https://rg.ru/2023/08/28/glavnyj-russkij-inzhener-170-let-so-dnia-rozhdeniia-vladimira-shuhova.html" rel="noopener">rg.ru/2023/08/28/glavnyj-russkij-inzhener-170-let-so-dnia-rozhdeniia-vladimira-shuhova.html</a>.'
        otryvok: «Эта первая гиперболоидная башня осталась одним из самых красивых строительных сооружений Шухова. После завершения выставки её купил богатый помещик Нечаев-Мальцев и установил в своём поместье Полибино под Липецком. Башня стоит там и сегодня.» («Наука и жизнь»). — «…первая в истории водонапорная башня гиперболоидной формы, созданные по чертежам Шухова, были впервые продемонстрированы на Всероссийской промышленной выставке 1896 года в Нижнем Новгороде» («Российская газета»).
        stranica: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013
        href: https://www.nkj.ru/archive/articles/23482/
        pometka: два источника
      - summary: <b>Шухов создал первые в мире сетчатые оболочки и висячую стальную крышу-мембрану.</b>
        det:
          - "На той же выставке 1896 года Шухов построил восемь павильонов общей площадью около 27 000 квадратных метров. Пять из них, площадью около 20 000 квадратных метров, накрыл сетчатыми арочными сводами."
          - В центре одного павильона крыша висела, как натянутая тонкая сетка-мембрана. Такого в строительстве ещё не делал никто — павильон прозвали «ротондой Шухова».
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>.'
        otryvok: "«Здесь Шуховым было построено восемь выставочных павильонов общей площадью около 27 000 м2. Над пятью из них, с пролётами от 12,8 до 32 метров и общей площадью около 20 000 м2, были сделаны сетчатые арочные покрытия. Это были первые в мире перекрытия в виде сетчатых оболочек и первое в мире перекрытие в виде висячей стальной мембраны — так называемая „ротонда Шухова“» (Политехнический музей)."
        stranica: «Владимир Григорьевич Шухов и его последователи», Политехнический музей
        href: https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf
        pometka: документ
      - summary: <b>Мазут сливали в озёра, и он травил землю, — Шухов первым в мире стал жечь его в топках.</b>
        det:
          - Мазут — то, что остаётся от нефти после перегонки, — тогда считали отходом. Его сливали в огромные озёра у нефтяных заводов, и они отравляли почву.
          - "В 1880 году Шухов первым в мире наладил промышленное сжигание мазута: его форсунка распыляла мазут паром прямо в топке. Отход стал топливом."
        src: 'Источник: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013 — <a href="https://www.nkj.ru/archive/articles/23482/" rel="noopener">www.nkj.ru/archive/articles/23482</a>; «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>.'
        otryvok: «…В. Г. Шухов впервые в мире осуществил промышленное факельное сжигание жидкого топлива с помощью изобретённой им форсунки, позволявшей эффективно сжигать мазут, который считался отходом нефтепереработки; его огромные озёра в окрестностях нефтеперерабатывающих заводов отравляли почву.»
        stranica: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013
        href: https://www.nkj.ru/archive/articles/23482/
        pometka: два источника
      - summary: <b>В Америке молодой Шухов так увлёк инженера Бари, что тот бросил всё и открыл дело в России.</b>
        det:
          - В 1876 году Шухова как лучшего выпускника училища отправили в США — на Всемирную выставку в Филадельфии. Там он познакомился с Александром Бари, американцем русского происхождения.
          - Разговоры с молодым инженером убедили Бари вернуться в Россию. Он открыл здесь свою контору и сразу позвал туда Шухова ведущим инженером. От этой конторы Шухов и поехал строить нефтепровод в Баку.
        src: 'Источник: «Универсальный гений. Гиперболоиды инженера Шухова», «Аргументы и факты», 14.03.2012 — <a href="https://aif.ru/society/people/universalnyy_geniy_giperboloidy_inzhenera_shuhova" rel="noopener">aif.ru/society/people/universalnyy_geniy_giperboloidy_inzhenera_shuhova</a>; Д. Чижов, «Главный русский инженер: 170 лет со дня рождения Владимира Шухова», «Российская газета», 28.08.2023 — <a href="https://rg.ru/2023/08/28/glavnyj-russkij-inzhener-170-let-so-dnia-rozhdeniia-vladimira-shuhova.html" rel="noopener">rg.ru/2023/08/28/glavnyj-russkij-inzhener-170-let-so-dnia-rozhdeniia-vladimira-shuhova.html</a>.'
        otryvok: «С Шуховым он познакомился еще в США, в Филадельфии, и именно разговоры с молодым инженером заставили Бари вернуться на родину предков. Основав в России собственное конструкторское бюро он тут же зазвал туда своего знакомого.»
        stranica: «Универсальный гений. Гиперболоиды инженера Шухова», «Аргументы и факты», 14.03.2012
        href: https://aif.ru/society/people/universalnyy_geniy_giperboloidy_inzhenera_shuhova
        pometka: два источника
      - summary: <b>Шуховские баржи для нефти так прижились, что во всём мире их звали «русским речным флотом».</b>
        det:
          - "Шухов придумал стальные баржи для нефти: лёгкие на ходу, послушные рулю, дешёвые и прочные. По его проектам построили 90 таких барж."
          - Возить нефть по рекам в таких баржах во всём мире стали называть способом «русского речного флота».
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>.'
        otryvok: «Перевозку нефти в баржах во всём мире называли способом „русского речного флота“.»
        stranica: «Владимир Григорьевич Шухов и его последователи», Политехнический музей
        href: https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf
        pometka: документ
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Мосты, баки и Академия
    udary:
      - summary: <b>После 1917 года Шухов отказался уезжать из России — и остался строить.</b>
        det:
          - "После революции многие инженеры уехали за границу. Шухов к новой власти относился настороженно, но эмигрировать отказался: считал своим долгом служить своей стране."
          - Он остался — и уже в 1919 году начал строить башню на Шаболовке.
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>.'
        otryvok: «К революционным событиям 1917 года отношение Шухова было неоднозначным, но он отказался эмигрировать, считая своим долгом служение Отечеству.»
        stranica: «Владимир Григорьевич Шухов и его последователи», Политехнический музей
        href: https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf
        pometka: документ
      - summary: <b>В Академию наук брали теоретиков — а Шухова избрали за постройки, и в академики он идти отказался.</b>
        det:
          - В 1927 году Шухова избрали членом-корреспондентом Академии наук СССР. Раньше туда выбирали учёных-теоретиков, а не инженеров, которые строят башни и трубы.
          - Выдвинули его академики Алексей Крылов и Пётр Лазарев. А стать действительным академиком 80-летний Шухов наотрез отказался.
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>; «Универсальный гений. Гиперболоиды инженера Шухова», «Аргументы и факты», 14.03.2012 — <a href="https://aif.ru/society/people/universalnyy_geniy_giperboloidy_inzhenera_shuhova" rel="noopener">aif.ru/society/people/universalnyy_geniy_giperboloidy_inzhenera_shuhova</a>.'
        otryvok: «В 1927 году впервые в истории российской академической науки не учёный-теоретик, а инженер-практик Владимир Шухов был избран членом-корреспондентом Академии наук СССР по представлению академиков Алексея Крылова и Петра Лазарева» (Политехнический музей). — «Баллотироваться в действительные члены 80-летний уже инженер категорически отказывался по принципиальным соображениям» («Аргументы и факты»).
        stranica: «Владимир Григорьевич Шухов и его последователи», Политехнический музей
        href: https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf
        pometka: два источника
      - summary: <b>Через Оку Шухов перекинул провода на 1800 метров — на ажурных башнях высотой до 128 метров.</b>
        det:
          - В конце 1920-х под Нижним Новгородом нужно было провести линию электропередачи через Оку. Шухов поставил три пары сетчатых башен — 20, 69 и 128 метров; длина перехода — 1800 метров.
          - Башни держали многотонные провода даже с намёрзшим льдом — и всё равно вышли легче и стройнее его первой башни.
        src: 'Источник: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013 — <a href="https://www.nkj.ru/archive/articles/23482/" rel="noopener">www.nkj.ru/archive/articles/23482</a>.'
        otryvok: «…Шухов превзошёл свою первую башенную конструкцию, построив три пары сетчатых многоярусных гиперболоидных опор перехода длиной 1800 м высоковольтных линий электропередачи через Оку под Нижним Новгородом высотой 20, 69 и 128 м.»
        stranica: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013
        href: https://www.nkj.ru/archive/articles/23482/
        pometka: документ
      - summary: <b>По проектам Шухова построили 417 мостов — почти все стоят до сих пор.</b>
        det:
          - С 1892 года Шухов проектировал железнодорожные мосты — типовые, с пролётами от 25 до 100 метров.
          - По ним построили 417 мостов через Оку, Волгу, Енисей и другие реки. Почти все они стоят и сейчас.
        src: 'Источник: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013 — <a href="https://www.nkj.ru/archive/articles/23482/" rel="noopener">www.nkj.ru/archive/articles/23482</a>.'
        otryvok: «На основе этих типовых решений под его руководством было построено 417 мостов через Оку, Волгу, Енисей и другие реки. Почти все они стоят и сейчас.»
        stranica: Н. Лескова, «Человек-фабрика», «Наука и жизнь», № 12, 2013
        href: https://www.nkj.ru/archive/articles/23482/
        pometka: документ
      - summary: <b>Больше 10 000 нефтяных баков и 1600 километров труб — всё это построили по проектам Шухова.</b>
        det:
          - С 1878 по 1939 год по проектам Шухова построили около 1600 километров трубопроводов для нефти, больше 10 000 стальных баков для её хранения и больше 8 000 паровых котлов.
          - А началось всё с одной десятикилометровой трубы в Баку.
        src: 'Источник: «Владимир Григорьевич Шухов и его последователи», Политехнический музей — <a href="https://polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf" rel="noopener">polymus.ru/upload/medialibrary/1d4/cxgp13qppxxtlgbohitb9q1q2ix137st/Vladimir-Grigorevich-SHukhov-i-ego-posledovateli.pdf</a>.'
        otryvok: «С 1878 по 1939 года на территории Российской империи и Советского Союза по проектам академика было построено около 1600 километров трубопроводов для транспортировки нефти и нефтепродуктов; более 10 000 стальных цилиндрических резервуаров для хранения нефти и нефтепродуктов…; более 8 000 паровых котлов системы Шухова…»
        stranica: «Владимир Григорьевич Шухов и его последователи», Политехнический музей
