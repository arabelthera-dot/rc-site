pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "<b>Граница первенства. Первый в мире расчётный нефтепровод.</b> Балаханы — Чёрный город, Баку, 1878 год. Десять километров трёхдюймовой трубы, и всё посчитано заранее: какой диаметр держит нужный поток, какое давление дают насосы, где ставить перекачечные станции, как густеет нефть на холоде. Свои формулы Шухов опубликовал — по ним трубы проектируют до сих пор."
  net: "<b>Чего здесь нет. Саму трубу для нефти придумал не Шухов.</b> Нефть по трубам качали и до него — но на глаз, пробой и ошибкой. Первенство Шухова — в расчёте: нефтепровод перестал быть удачей и стал задачей с решением."
  kolonki:
    - Документ
    - Ещё первые в мире
  stroki:
    - - "<b>Статья Шухова «Нефтепроводы».</b> Журнал «Вестник промышленности», 1884, № 7. Хранится: РГАНТД, проект «Шухов»."
      - <b>Что ещё Шухов создал первым в мире.</b> Первое в мире промышленное сжигание мазута форсункой (1880). Первая в мире гиперболоидная башня, первые в мире сетчатые перекрытия и первое в мире висячее стальное перекрытие (Нижний Новгород, 1896). Первая в мире установка непрерывного крекинга нефти (патент 1891).
quiz:
  kicker: Проверь себя
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Ответы: 1 — Братья Нобель; 2 — Россия не использовала его — бензин был не нужен, а в 1913-м похожий процесс запатентовали в США."
  ball: 10
  voprosy:
    - q: Кто оплатил строительство первого в мире нефтепровода?
      o:
        - Царское правительство
        - Братья Нобель
        - Ротшильды
        - Сам Шухов
      a: 1
      e: «Товарищество братьев Нобель» — крупнейший нефтепромышленник Баку. Да, это та самая семья, чьё имя носит Нобелевская премия.
    - q: Что случилось с патентом Шухова на крекинг нефти 1891 года?
      o:
        - Он был продан американцам за миллион
        - Россия не использовала его — бензин был не нужен, а в 1913-м похожий процесс запатентовали в США
        - Патент сгорел при пожаре в конторе Бари
        - Его аннулировали как «не имеющий применения»
      a: 1
      e: В 1891 году бензин был почти отходом — автомобилей не существовало. Патент пролежал без дела, а в 1913 году американец Бартон запатентовал крекинг в США. В 1923-м американская делегация в Москве официально признала первенство Шухова.
