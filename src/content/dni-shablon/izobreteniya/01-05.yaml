  - posle: story
    html: |-
      <section class="block" id="more" data-nav="Работы">
        <div class="wrap">
          <div class="kicker">Не только нефтепровод</div>
          <h2>Другие работы Шухова</h2>
          <p style="color:var(--muted);max-width:62ch">Около двухсот изобретений — «первый инженер Российской империи» строил всё: от котлов до башен.</p>
          <div class="card"><b style="color:var(--gold-l)">Крекинг нефти (1891)</b><p style="margin:6px 0 0">Разложение тяжёлой нефти на лёгкие фракции — основа производства бензина. Американцы запатентовали то же через 22 года и в 1923-м официально признали первенство Шухова.</p></div>
          <div class="card"><b style="color:var(--gold-l)">Гиперболоидные башни</b><p style="margin:6px 0 0">Ажурные сетки из прямых стержней — лёгкие и прочные. Та самая Шуховская башня на Шаболовке; задумывалась выше Эйфелевой, в 350 метров.</p></div>
          <div class="card"><b style="color:var(--gold-l)">Сетчатые перекрытия</b><p style="margin:6px 0 0">Стеклянные небеса ГУМа и Пушкинского музея держатся на шуховских конструкциях.</p></div>
          <div class="card"><b style="color:var(--gold-l)">Керосинопровод Баку — Батум</b><p style="margin:6px 0 0">835 километров — крупнейший в мире на момент пуска (1907). Плюс нефтеналивные баржи, водотрубные котлы, форсунка для мазута.</p></div>
        </div>
      </section>
  - posle: story
    html: |-
      <section class="block" id="chto-zametit">
        <div class="wrap">
          <div class="kicker">На что смотреть</div>
          <h2 style="margin-bottom:6px">Четыре вещи, заметные только вблизи</h2>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">Работы Шухова выглядят просто, пока не подойдёшь ближе. Тогда становится видно, что простота — это результат расчёта.</p>
          <div class="q"><h3><em>Первое</em>В гиперболоидной башне нет ни одной гнутой детали</h3><p>Подойдите к любой шуховской башне и проследите взглядом за отдельным стержнем — он прямой. Круглая, изогнутая форма собрана целиком из прямых железных полос, поставленных под углом друг к другу. Кривизна здесь не выковывается в кузнице, а возникает сама из геометрии. Поэтому башню и мог собрать обычный клепальщик из типового проката — гнуть было нечего.</p></div>
          <div class="q"><h3><em>Второе</em>Башня росла сама из себя</h3><p>Ни лесов, ни высоких кранов на стройке Шаболовки не было. Секции собирали внизу, внутри уже стоящей части, и поднимали лебёдками сквозь неё — как складную подзорную трубу, только наоборот. Метод называется телескопическим, и придуман он был потому, что в 1920 году в стране не нашлось бы ни лесов, ни техники на 160-метровую высоту.</p></div>
          <div class="q"><h3><em>Третье</em>Труба 1878 года — всего три дюйма</h3><p>На фотографиях первого нефтепровода труба выглядит несерьёзно: тонкая нитка вдоль дороги, рядом с ней громоздкие арбы и бочки. Но именно эта нитка пропускала до 80 тысяч пудов нефти в сутки — больше, чем три тысячи бочек, которые возчики тащили за день. Размер здесь ничего не говорит о мощности: всё решают давление, диаметр и расстояние между насосами, то есть три числа из формул Шухова.</p></div>
          <div class="q"><h3><em>Четвёртое</em>Стеклянные крыши ГУМа держатся почти ни на чём</h3><p>Посмотрите вверх в Верхних торговых рядах или в Пушкинском музее: между стеклом и небом — тонкая стальная сетка, без единой массивной балки. Нагрузка в такой оболочке расходится по всей поверхности, а не давит в нескольких точках. Отсюда ощущение, что крыши нет вовсе, — а держит она снег московской зимы уже больше века.</p></div>
        </div>
      </section>
  - posle: pervenstvo
    html: |-
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2 style="margin-bottom:10px">Для тех, кто смотрит внимательно</h2>
          <details class="deepd">
            <summary>Четыре сюжета подробно — развернуть</summary>
            <h3>Труба была не первой. Первой была наука о трубе</h3>
            <p>Честно: нефть по трубам качали и до Баку. В 1865 году в Пенсильвании Сэмюэл ван Сайкл проложил восемь километров двухдюймовой трубы и погнал по ней нефть насосами — это работало и приносило деньги. Но строилось на глаз: диаметр, давление и расстояние между станциями подбирали пробами, а неудачные линии просто бросали. Шухов в 1878 году сделал другое — вывел формулы, связавшие расход, вязкость, температуру и потери напора, и опубликовал их. После этого нефтепровод перестал быть удачей и стал расчётом. Первенство здесь не в том, кто раньше положил железо в землю, а в том, кто первым объяснил, почему оно работает.</p>
            <h3>Почему гиперболоид собирают из прямых палок</h3>
            <p>Однополостный гиперболоид — одна из немногих кривых поверхностей, которую можно целиком построить из прямых линий: через каждую её точку проходят две прямые, лежащие на самой поверхности. Шухов первым понял, что это не математический курьёз, а способ строить. Прямой прокат дёшев, его не надо гнуть, соединения простые, а сетка из двух встречных семейств стержней работает на кручение лучше любой башни-«трубы». Легенда про плетёную корзину, перевёрнутую вверх дном, скорее всего правдива, но идею дала геометрия, а не корзина.</p>
            <h3>Почему крекинг оказался никому не нужен</h3>
            <p>В 1891 году бензин был отходом. Керосин для ламп — вот что покупали, а лёгкие фракции сливали или сжигали, потому что двигателей, которым они нужны, почти не существовало. Патент Шухова на разложение тяжёлой нефти нагревом под давлением решал задачу, которой в России ещё не было. Через двадцать два года задача появилась — но уже в стране с миллионами автомобилей, и решение запатентовали там. Изобретение опередило не технику, а рынок; для инженерной истории это самый частый способ проиграть.</p>
            <h3>Что на самом деле убила труба</h3>
            <p>Труба убила не бочку, а профессию. Возчики в Баку были не подсобным промыслом, а отдельным сословием со своей ценой и своей очередью у промысла: пока нефть везут люди и лошади, они и назначают, сколько она будет стоить на заводе. Нефтепровод впервые вывел доставку из области сговора в область арифметики — расход, напор, диаметр. После этого сопротивление уже ничего не решало: промысел, отказавшийся от трубы, просто продавал нефть дороже соседа. Технология побеждает не тогда, когда она лучше, а тогда, когда делает прежний способ бессмысленным.</p>
          </details>
          <div class="src">Источники: nkj.ru · aif.ru · kf.bmstu.ru · engineer-history.ru · moslenta.ru · kommersant.ru · ourbaku.com</div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="quiz-igry">
        <div class="wrap">
          <div class="gm" id="gm_tm">
            <h3>⚖️ Правда или миф</h3>
            <p style="font-weight:600;margin:0 0 12px">«Возчики нефти угрожали разрушить первый нефтепровод»</p>
            <div><button class="gm-btn" style="width:auto;display:inline-block;margin-right:8px" onclick="tmAns(this,true)">Правда</button><button class="gm-btn" style="width:auto;display:inline-block" onclick="tmAns(this,false)">Миф</button></div>
            <div class="gm-exp" id="tmExp">Правда. Сотни возчиков теряли заработок — трубу пришлось охранять казакам. Но экономика победила быстро: перекачка оказалась в разы дешевле бочек.</div>
          </div>
          <div class="gm" id="gm_vb">
            <h3>🤔 Верю — не верю</h3>
            <p style="font-weight:600;margin:0 0 12px">«Формулы Шухова 1878 года используются до сих пор»</p>
            <div><button class="gm-btn" style="width:auto;display:inline-block;margin-right:8px" onclick="vbAns(this,true)">Верю</button><button class="gm-btn" style="width:auto;display:inline-block" onclick="vbAns(this,false)">Не верю</button></div>
            <div class="gm-exp" id="vbExp">Верю — и правильно. Основы гидравлического расчёта трубопроводов, выведенные Шуховым, лежат в проектировании нефте- и газопроводов по сей день.</div>
          </div>
          <div class="gm" id="gm_char">
            <h3>🧩 Шарада</h3>
            <p style="font-style:italic;line-height:1.8;margin:0 0 12px">«Я бочки с арбами прогнал,<br>трудом лошадиным не мучаясь:<br>я нефти дорогу стальную создал —<br>считал, а не пробовал наудачу».</p>
            <button class="gm-btn" style="width:auto" id="charBtn" onclick="charShow()">Показать ответ</button>
            <div class="gm-exp" id="charExp">Владимир Шухов и его нефтепровод.</div>
          </div>
          <script>
          function tmAns(b,ok){document.querySelectorAll('#gm_tm .gm-btn').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');document.getElementById('tmExp').classList.add('show');if(ok&&typeof award==='function')award('tm',5);}
          function vbAns(b,ok){document.querySelectorAll('#gm_vb .gm-btn').forEach(x=>x.disabled=true);b.classList.add(ok?'ok':'no');document.getElementById('vbExp').classList.add('show');if(ok&&typeof award==='function')award('vb',5);}
          function charShow(){document.getElementById('charExp').classList.add('show');document.getElementById('charBtn').disabled=true;if(typeof award==='function')award('char',10);}
          </script>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="mirovoy-kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2 style="margin-bottom:6px">Что в это время делал мир</h2>
          <p style="max-width:66ch">Тысяча восемьсот семьдесят восьмой. В Берлине большие державы перекраивают карту Балкан после русско-турецкой войны. В Америке Эдисон только что запатентовал фонограф и обещает публике электрический свет. В Пенсильвании — нефтяная лихорадка в разгаре: Рокфеллер скупает заводы, вокруг скважин выросли города, которые исчезнут через десять лет.</p>
          <p style="max-width:66ch">Нефть в тот год умеют добывать все, а считать — почти никто: в Пенсильвании трубы кладут пробами и бросают неудачные линии, в Баку спорят о ценах, а не о физике. И там же, в самой богатой нефтью точке планеты, двадцатипятилетний инженер вместо проб считает вязкость, напор и диаметр — и превращает перевозку в задачу с решением.</p>
          <p style="max-width:66ch">Отсюда вывод, ради которого этот день стоит в календаре: <b style="color:var(--gold-l)">первым бывает не тот, кто раньше начал, а тот, кто первым понял, как это устроено.</b> Трубы клали и до Шухова — но по всему миру их до сих пор считают по его формулам.</p>
        </div>
      </section>
  - posle: quiz
