return:
  q: Труба Шухова давала 80 000 пудов нефти в сутки. Сколько это тонн, если в пуде 16,4 кг?
  a: "Около 1 300 тонн в сутки: 80 000 × 16,4 кг ≈ 1 312 000 кг."
audioguide:
  audioSrc: audio-guide-shukhov-ru-3.mp3
  durationLabel: 6 минут 40 секунд
  lead: "Голос ведёт от каравана бочек в Баку до гиперболоидной башни: семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Зал чёрного золота
    - t: 51
      mark: 0:51
      title: Молодой человек с портрета
    - t: 104
      mark: 1:44
      title: "Наука вместо «на авось»"
    - t: 158
      mark: 2:38
      title: Пуск 1878 года
    - t: 230
      mark: 3:50
      title: Патент, отданный вежливо
    - t: 292
      mark: 4:52
      title: Круглая башня из прямых стержней
    - t: 350
      mark: 5:50
      title: Что мы отсюда берём
  transcript:
    - "<p>Здравствуйте. Мы входим в зал чёрного золота — и первое, что я попрошу, посмотрите на большую фотографию слева. Баку, конец тысяча восемьсот семидесятых. Деревянные вышки до горизонта, земля чёрная от нефти, а между вышками — арбы, бочки, верблюды, лошади. Это не хаос стройки. Это транспорт. Так нефть возили везде в мире: наливали в деревянную бочку, ставили на телегу и везли с промысла на завод. Теперь цифра, ради которой мы здесь остановились. Перевозка бочки стоила дороже, чем нефть, которая в этой бочке была. Добывать научились, а доставить — нет. Сотни возчиков держали монополию и держали цену, и промышленники платили, потому что другого способа не существовало.</p>"
    - "<p>А теперь повернитесь к портрету у окна. Этому молодому человеку двадцать пять лет. Владимир Григорьевич Шухов, выпускник Императорского технического училища, только что приехал в Баку от конторы инженера Бари. Одна деталь про него, которая объясняет всё дальнейшее. Ему предлагал остаться на кафедре сам Пафнутий Чебышёв — великий математик. Шухов отказался. Не потому, что не тянул: потому что не хотел чистой математики, хотел строить. Всю жизнь он делал одно и то же — брал задачу, которую до него решали на глазок, и решал её расчётом. Нефть, вода, котлы, мосты, башни. Около двухсот изобретений. Он смотрит на тот же караван, что и мы с вами. И видит не хаос, а задачу по гидравлике.</p>"
    - "<p>Пройдём к витрине с чертежами. Здесь начинается то, за что этот зал носит его имя. В Америке к тому времени уже пробовали качать нефть по коротким трубам. Пробовали — ключевое слово: методом проб и ошибок, без теории. Трубу клали, насос ставили, смотрели, что получится. Шухов сделал иначе. Он вывел формулы: какой диаметр трубы нужен под заданный поток, какое давление должны создавать насосы, на каком расстоянии друг от друга эти насосы ставить, как меняется вязкость нефти с температурой. Посмотрите на эти четыре величины на схеме — диаметр, давление, вязкость, расстояние. До Шухова их подбирали. После Шухова их считают. Это и есть разница между ремеслом и наукой, и произошла она вот здесь, в Баку, в голове двадцатипятилетнего инженера.</p>"
    - "<p>Центральный экспонат зала — перед вами. Макет первой нитки: Балаханы — Чёрный город. Конец тысяча восемьсот семьдесят восьмого года. На промысле запускают паровой насос. Нефть уходит в стальную трубу диаметром три дюйма — это меньше ладони — и впервые в истории промышленности течёт сама. Десять километров. До восьмидесяти тысяч пудов в сутки. Ни бочек, ни подвод, ни возчиков. Заказ, кстати, оплатило «Товарищество братьев Нобель» — та самая семья, чьё имя носит знаменитая премия. И была ещё одна часть этой истории, о которой редко пишут. Возчики, потерявшие заработок, грозились разрушить трубу. Её пришлось охранять казакам. Но спор решили не казаки, а арифметика: перекачка оказалась в разы дешевле бочки. Через несколько лет Шухов строил в Баку новые нитки, а через десятилетие труба стала мировым стандартом. В тысяча девятьсот седьмом по его проекту заработал керосинопровод Баку — Батум, восемьсот тридцать пять километров, крупнейший в мире на тот момент.</p>"
    - "<p>Теперь подойдите к дальней витрине. Под стеклом — документ тысяча восемьсот девяносто первого года. Патент на крекинг: разложение тяжёлой нефти на лёгкие фракции нагревом под давлением. Проще говоря — способ получать бензин. Запомните дату: тысяча восемьсот девяносто первый. Россия этот патент не использовала — бензин тогда никому не был нужен, автомобилей ещё не было. В тысяча девятьсот тринадцатом американец Уильям Бартон патентует в США почти то же самое. Америка становится бензиновой державой. А в двадцать третьем году в Москву приезжает делегация фирмы «Синклер» — разбираться в патентном споре. Шухов кладёт перед ними свой патент. Американцы признают: русский был первым. Признание он получил. Промышленность и деньги остались за океаном. В этом зале мы не будем делать вид, что это справедливо, — но и забывать, что первенство доказано документом, тоже не будем.</p>"
    - "<p>Поднимите голову — над нами модель гиперболоидной башни, и я попрошу вас проделать одну вещь. Выберите глазами любой стержень в этой ажурной сетке и проследите за ним сверху донизу. Он прямой. Все до единого — прямые. Круглая, изогнутая, летящая форма собрана целиком из прямых железных полос, поставленных под углом друг к другу. Кривизна тут не выковывается в кузнице, а возникает сама, из геометрии. Поэтому башню и мог собрать обычный клепальщик из типового проката — гнуть было нечего. Самая известная такая башня стоит на Шаболовке в Москве, сто шестьдесят метров. Задумывалась она в триста пятьдесят — выше Эйфелевой. Металла в стране в двадцатом году не нашлось. И строили её без лесов и без высоких кранов: секции собирали внизу, внутри уже стоящей части, и поднимали лебёдками сквозь неё — как подзорную трубу, только наоборот.</p>"
    - "<p>И последнее, прежде чем мы перейдём в следующий зал. Всё, что течёт сегодня по миллионам километров труб планеты — нефть, газ, бензин, — течёт по формулам, выведенным в тысяча восемьсот семьдесят восьмом году. Они опубликованы, по ним проектируют до сих пор, во всём мире. А про самого Шухова — три факта, которые я оставлю вам на память. Он работал до восьмидесяти пяти лет. От гонораров за многие проекты отказывался, говоря, что инженер обязан стране. И умер нелепо: опрокинул на себя свечу, получил ожоги и через пять дней скончался — в тридцать девятом году, всемирно признанным классиком инженерии. Двадцать пять лет было ему, когда нефть впервые потекла сама. Спасибо, что прошли этот зал со мной.</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
