igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Три беды фотографа — три изобретения
  pravilo_ru: 'Что сделать сейчас: выбери изобретение и нажми на беду, которую оно решает.'
  kak_igrat:
    zachem: 'Болдырев не покупал готовое: каждую трудность фотографа он решал своим изобретением.'
    shagi:
    - Выбери изобретение — кнопка загорится золотом.
    - Нажми на беду, которую оно решает. Верный выбор загорится зелёным.
    - Расставь все три — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все три изобретения на месте — +20 баллов.
  dannye:
    mesta:
    - kod: steklo
      nazvanie: Стеклянный негатив разбился в пути
      verno_ru: Стеклянный негатив с портретом царя разбился в пути, и казак придумал плёнку, которая не бьётся.
    - kod: poezd
      nazvanie: Снять из окна мчащегося поезда
      verno_ru: Казак придумал затвор, чтобы снимать прямо из окна мчащегося поезда.
    - kod: optika
      nazvanie: Нет своего объектива
      verno_ru: 'Объектив собрал сам: ночами крутил стёкла в картонной трубке, «не имея понятия об оптике».'
    podpisi:
    - kod: plenka
      tekst: Гибкая плёнка
      mesto: steklo
      mimo_ru: Плёнка — против того, что бьётся.
    - kod: zatvor
      tekst: Затвор
      mesto: poezd
      mimo_ru: Затвор — для быстрого снимка на ходу.
    - kod: obektiv
      tekst: Объектив в картонной трубке
      mesto: optika
      mimo_ru: Объектив — когда нечем собирать свет.
    vyberi_ru: Сначала выбери изобретение, потом беду.
    mimo_ru: Не та беда — попробуй другую.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все три изобретения на месте — плёнка, затвор и объектив Болдырева.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: плёнка — против разбитого стекла, затвор — для поезда, объектив в картонной трубке — когда нет оптики.'
pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: 'Что сделано: Гибкая фотоплёнка была у донского казака за 10 лет до Kodak.'
  net: 'Где граница: Плёнка американца Истмена уступала болдыревской; патента Болдырев не взял.'
  kolonki:
  - Где
  - Что
  - Когда
  stroki:
  - - Санкт-Петербург
    - гибкая плёнка Болдырева показана Техническому обществу
    - '1880'
  - - Москва
    - бронза Всероссийской выставки изобретателю плёнки
    - '1882'
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Для викторины нужен JavaScript. Ответы: на 10 лет; дважды; сутки; бронзу; из окна поезда.'
  ball: 8
  voprosy:
  - q: На сколько лет гибкая плёнка Болдырева опередила Kodak?
    o:
    - на 1 год
    - на 10 лет
    - на 50 лет
    a: 1
    e: Гибкая фотоплёнка была у донского казака за 10 лет до Kodak.
  - q: Сколько раз Болдырев отказался от патента?
    o:
    - ни разу
    - дважды
    - пять раз
    a: 1
    e: 'Изобретатель первой гибкой плёнки дважды отказался от патента: не хватило денег на пошлину.'
  - q: Сколько плёнка пролежала в воде и осталась гибкой?
    o:
    - минуту
    - сутки
    - год
    a: 1
    e: Плёнку Болдырева на сутки положили в воду — она вышла такой же прозрачной и гибкой.
  - q: Какую награду выставки 1882 года дали изобретателю плёнки?
    o:
    - золото
    - серебро
    - бронзу
    a: 2
    e: Золото выставки 1882 года ушло за семейные снимки, изобретателю плёнки дали бронзу.
  - q: Откуда можно было снимать с затвором Болдырева?
    o:
    - из окна поезда
    - из-под воды
    - с аэростата
    a: 0
    e: Казак придумал затвор, чтобы снимать прямо из окна мчащегося поезда.
