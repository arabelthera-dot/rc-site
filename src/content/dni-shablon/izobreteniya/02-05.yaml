audioguide:
  audioSrc: audio-guide-boldyrev-ru.mp3
  durationLabel: 1 минута 42 секунды
  lead: 'Голос ведёт по залу Болдырева: от гибкой плёнки за десять лет до Kodak через разбитый негатив и затвор для поезда — к ночным снимкам и отказу от патента. Пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Плёнка за десять лет до Kodak
  - t: 22
    mark: 0:22
    title: Плёнка, которая не бьётся
  - t: 41
    mark: 0:41
    title: Затвор для поезда
  - t: 59
    mark: 0:59
    title: Ночью и в шахте
  - t: 80
    mark: '1:20'
    title: Без патента
  transcript:
  - Здравствуйте. Мы в зале Ивана Болдырева. Тысяча восемьсот восьмидесятый год, Петербург, Техническое общество. Донской казак и фотограф Иван Васильевич Болдырев показывает гибкую прозрачную фотоплёнку. Гибкая фотоплёнка была у донского казака за десять лет до Kodak. Плёнка американца Истмена уступала болдыревской.
  - 'Началось всё с беды. Стеклянный негатив с портретом царя разбился в пути, и казак придумал плёнку, которая не бьётся. Плёнку Болдырева на сутки положили в воду — она вышла такой же прозрачной и гибкой. Разбитые стеклянные негативы он спасал: переносил снимок на свою плёнку.'
  - 'Плёнкой дело не кончилось. Казак придумал затвор, чтобы снимать прямо из окна мчащегося поезда. Его затвор Техническое общество признало «лучшим из всех, что есть в продаже». Объектив собрал сам: ночами крутил стёкла в картонной трубке, «не имея понятия об оптике».'
  - 'Снимал ночью при свечах, керосинке и даже при свете луны. Полез с камерой в угольную шахту: лампа под землёй гасла, а снимки всё равно вышли. Знаменитый фотограф Карелин сам подошёл к казаку на выставке: «Хочу быть как вы». Придворный фотограф обвинил казака в краже способа и услышал: «Ни от кого не брал».'
  - 'Эксперты назвали его плёнку и затвор пустыми затеями, а через десять лет мир снимал на гибкую плёнку. Изобретатель первой гибкой плёнки дважды отказался от патента: не хватило денег на пошлину. Сам Болдырев писал, что хотел сохранить честь изобретения за Россией. Ниже — игра, викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
