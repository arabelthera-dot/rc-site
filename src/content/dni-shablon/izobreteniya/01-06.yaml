story:
  kicker: История изобретения · 12 ударов
  h2: Краски, которые легли разом
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: "Детство Ивана Орлова прошло на дорогах: мать водила его по деревням Нижегородской губернии просить милостыню."
      det:
        - Он родился в 1861 году в бедной крестьянской семье, в селе Неледино Княгининского уезда. Отец умер рано. «Бродя с ней по деревням и прося милостыню» — так «Наука и жизнь» пересказывает его детство.
        - Потом мать привезла сына в Нижний Новгород. Купец заметил, как мальчик рисует, и помог устроить его в Кулибинское училище.
      src: "Источник: «Наука и жизнь», «Русская революция в печатном деле»."
    - summary: Кулибинское училище он окончил с первой наградой, потом учился в Строгановском в Москве, а в 1886 году пришёл в Экспедицию, где печатали деньги.
      det:
        - Экспедиция заготовления государственных бумаг — нынешний Гознак — печатала кредитные билеты, марки и ценные бумаги империи. Главная её забота — защита денег от подделки.
      src: "Источник: «Наука и жизнь»; Банк России, справка к монете «Орловская печать», 2025."
    - summary: До Орлова каждую краску рисунка печатали своим прогоном — от двух до десяти раз, и каждый раз лист снова шёл под новую форму.
      det:
        - "Многокрасочный рисунок собирали по слоям: на каждый цвет своя печатная форма, свой проход листа через машину. Чем больше красок, тем больше прогонов."
      src: "Источник: «Наука и жизнь»."
    - summary: "Орлов собрал все краски на одной форме и переносил их на лист за один оборот: линия рисунка меняет цвет, не прерываясь."
      det:
        - Над способом он начал работать в 1890 году. Краски с нескольких промежуточных форм-шаблонов собирались на мягкий эластичный вал, а с него — на одну печатную форму. Лист проходил машину один раз.
        - "Банк России описывает результат так: «линии рисунка, не прерываясь, меняют один цвет на другой»."
      src: "Источники: Банк России, 2025; «Наука и жизнь» (первые оттиски — 1891, действующая машина — 1892)."
    - summary: Такое совпадение красок невозможно было повторить вручную — поэтому новые деньги стали защитой от фальшивомонетчиков.
      det:
        - "Поддельщик, который печатал бы краски по очереди, неизбежно давал бы сдвиг на стыке цветов. Орловский оттиск такого сдвига не имеет в принципе: все краски ложатся одним касанием. Попробуй сам на станке ниже."
      src: "Источники: «Наука и жизнь»; Банк России, 2025."
    - summary: В 1892 году в обращение вышли первые в мире деньги, напечатанные за один прогон, — русские кредитные билеты с орловской печатью, и «новые деньги стали сенсацией в финансовом мире».
      det:
        - "Какой купюрой всё началось, источники называют по-разному: Банк России — пятирублёвой, «Наука и жизнь» — двадцатипятирублёвой. Мы не выбираем наугад и оставляем оба свидетельства."
        - В 1894 году вышли десятирублёвые билеты с орловской печатью в три краски с обеих сторон.
      src: "Источники: Банк России, 2025; «Наука и жизнь»."
    - summary: В 1893 году способ повезли в Чикаго — бронзовая медаль «за художественный характер и оригинальность процесса».
      det:
        - Орловскую печать показывали на всемирных выставках в Чикаго и Париже. В 1896 году Орлов прочёл доклад в Императорском Русском техническом обществе, в 1902-м получил премию Петербургской академии наук.
      src: "Источники: «Наука и жизнь»; Банк России, 2025."
    - summary: Александр III велел выдать изобретателю 7 000 рублей, а служащий Экспедиции получал около 450 рублей в год.
      det:
        - Больше пятнадцати годовых жалований одной наградой. Поддерживал Орлова и управляющий Экспедицией Роберт Ленц, а чертежи и детали машины делал механик Иван Стружков.
      src: "Источник: «Наука и жизнь»."
    - summary: "Германский патент на русский способ выдали раньше российского: в Германии — в 1897 году, дома — только в 1899-м."
      det:
        - После немецкого пришли французский и английский патенты. Немецкая фирма «Кёниг и Бауэр» наладила выпуск машин по патенту Орлова и, как пишет Банк России, «платила России золотом за идею».
      src: "Источники: «Наука и жизнь»; Банк России, 2025."
    - summary: «Немцы дают ему миллион, а он отдал изобретение казне и получил всего десять тысяч», — записал в дневнике издатель Суворин.
      find: true
      tag: Находка дня
      det:
        - В ноябре 1897 года Орлов передал права на изобретение государству. Суворин не одобрял этот выбор, но его запись и сохранила цену отказа.
        - Сумма у Суворина — десять тысяч, в пересказе о царской награде — семь. Разница может означать разные выплаты; источники её не объясняют, и мы приводим обе цифры как есть.
      src: "Источник: «Наука и жизнь» (цитата из дневника А. С. Суворина)."
    - summary: "Он придумал и пневматический самонаклад: машина сама подавала в печать до 120 листов в минуту."
      det:
        - Самонаклад около 1898 года вошёл в практику полиграфии. Орлов придумал и способ изготовления тканых кредитных билетов.
      src: "Источники: Банк России, 2025; «Наука и жизнь»."
    - summary: Через 13 лет он ушёл из Экспедиции, вернулся в родное Неледино учить детей и отказывал зарубежным фирмам.
      det:
        - "Сначала была своя механическая мастерская и работа над автоматическим самонакладчиком. Потом возвращение в село: учительство, помощь односельчанам, книги и рисунок. Иван Иванович Орлов умер в 1928 году."
        - Сегодня печатные машины швейцарской KBA-NotaSys носят его имя — «Супер Орлоф Интальо» — и работают на денежных фабриках мира.
      src: "Источники: «Наука и жизнь»; Банк России, 2025."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов об Орлове
    h2: Часы от царя, шёлк и тюрьма
    udary:
      - summary: <b>За портрет, сотканный на станке, Орлов получил от царя золотые часы.</b>
        det:
          - Золотые часы от царя. Ещё до денег Орлов соткал на станке портрет наследника престола, и за это ему подарили массивные золотые часы.
          - Студентом Строгановского училища Орлов проходил практику на московской фабрике, где ткали мебельные ткани узором. На ткацком станке он сделал копию портрета наследника Николая Александровича, и в 1883 году, на коронации Александра III, работу поднесли новому государю.
          - Через полтора месяца Орлову вручили «массивные золотые часы фирмы Павла Буре», рассказывает Ульяна Карева, заведующая филиалом Нижегородского музея-заповедника «Покровка, 8». После революции, когда разорили его дом, часы пропали.
        src: "Источник: «Неподдельный интерес. Как крестьянский сын российские деньги защитил», «АиФ-Нижний Новгород», 21.02.2026 — https://nn.aif.ru/culture/nepoddelnyy-interes-kak-krestyanskiy-syn-rossiyskie-dengi-zashchitil"
        otryvok: «Через полтора месяца в качестве награды Орлову вручили массивные золотые часы фирмы Павла Буре»
        stranica: «Неподдельный интерес. Как крестьянский сын российские деньги защитил», «АиФ-Нижний Новгород», 21.02.2026
        href: https://nn.aif.ru/culture/nepoddelnyy-interes-kak-krestyanskiy-syn-rossiyskie-dengi-zashchitil
        pometka: два источника
      - summary: <b>Деньги по-орловски вышли такими яркими, что их прозвали «радужными».</b>
        det:
          - «Радужные» деньги. Билеты, напечатанные по-орловски, вышли такими яркими, что в народе их сразу прозвали «радужными».
          - Краски на орловском оттиске ложатся все сразу и не пачкают друг друга. Такую защиту любой человек проверит глазами, без приборов, а повторить её без машины Орлова невозможно.
          - Отсюда и народное прозвище. Правительство Нижегородской области пишет, что первые орловские банкноты 1890-х годов на выставках в Чикаго и Париже произвели фурор.
        src: "Источник: «Тайны „денежной“ печати Ивана Орлова узнают посетители выставки Волго-Вятского ГУ Банка России и НГИАМЗ», Банк России, 02.02.2026 — https://www.cbr.ru/press/regevent/?id=64950 ; «В Нижнем Новгороде открылась выставка „Код Орлова“», Правительство Нижегородской области, 30.01.2026 — https://nobl.ru/novosti-nizhegorodskoj-oblasti-za-vse-vremya/v-nizhnem-novgorode-otkrylas-vystavka-kod-orlova-razgadyvaya-tayny-denezhnoy-pechati"
        otryvok: «…от первых «радужных» банкнот 1890-х годов, произведших фурор на международных выставках в Чикаго и Париже…»
        stranica: «В Нижнем Новгороде открылась выставка „Код Орлова“», Правительство Нижегородской области, 30.01.2026
        href: https://nobl.ru/novosti-nizhegorodskoj-oblasti-za-vse-vremya/v-nizhnem-novgorode-otkrylas-vystavka-kod-orlova-razgadyvaya-tayny-denezhnoy-pechati
        pometka: два источника
      - summary: <b>Изобретение крестьянского сына отметил орденом президент Франции.</b>
        det:
          - Орден от Франции. Изобретение крестьянского сына из-под Нижнего отметил президент Франции — орденом Почётного легиона, высшей наградой страны.
          - Царь выдал Орлову денежную награду, а президент Французской республики пожаловал ему орден Почётного легиона — высшую награду Франции.
          - "До этого Орлов ездил в Прагу и Лейпциг советоваться, как подбирать и смешивать краски: он искал, как совместить цвета на банкноте без зазоров и наложений."
        src: "Источник: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026 — https://www.kommersant.ru/doc/8969946"
        otryvok: «Изобретение было отмечено и президентом Французской республики — он пожаловал ему орден Почетного легиона, высшую награду страны.»
        stranica: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026
        href: https://www.kommersant.ru/doc/8969946
        pometka: документ
      - summary: <b>Человека, спасшего деньги от подделок, посадили в тюрьму — за подделку денег.</b>
        det:
          - Защитник денег в тюрьме. Человека, который спас деньги от подделок, в 1919 году посадили в тюрьму — по подозрению в подделке денег.
          - "После революции у семьи Орлова отняли всё имущество. Весной 1919 года сам изобретатель попал в тюрьму: пошёл слух, что в своём имении он печатает «керенки», бумажные деньги Временного правительства. В сентябре его выпустили, но дом к тому времени уже разорили."
          - Чтобы заработать, Орлов развозил жалованье как курьер, потом работал на ситценабивной фабрике в Егорьевске. В 1926 году он вернулся в Гознак — учить, как защищать деньги от подделок.
        src: "Источник: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026 — https://www.kommersant.ru/doc/8969946 ; «Неподдельный интерес. Как крестьянский сын российские деньги защитил», «АиФ-Нижний Новгород», 21.02.2026 — https://nn.aif.ru/culture/nepoddelnyy-interes-kak-krestyanskiy-syn-rossiyskie-dengi-zashchitil"
        otryvok: «Сам изобретатель весной 1919 года попал в тюрьму по подозрению в подделке денежных знаков, но в сентябре того же года его выпустили.»
        stranica: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026
        href: https://www.kommersant.ru/doc/8969946
        pometka: два источника
      - summary: <b>В 1926 году Орлов описал карманный «радиотелефон в виде портсигара».</b>
        det:
          - Телефон в кармане. В 1926 году, за два года до смерти, Орлов описал карманный «радиотелефон в виде портсигара».
          - В Гознаке хранятся 1500 страниц записей, которые Орлов сделал в 1926 году. Убористым почерком он описывает там идеи на будущее.
          - Среди них «карманный радиотелефон в виде портсигара», «светоцветная музыка», «электрические поезда», «сборные жилища» и «индивидуальные летательные аппараты». Эти рукописи ещё предстоит изучить.
        src: "Источник: «Неподдельный интерес. Как крестьянский сын российские деньги защитил», «АиФ-Нижний Новгород», 21.02.2026 — https://nn.aif.ru/culture/nepoddelnyy-interes-kak-krestyanskiy-syn-rossiyskie-dengi-zashchitil ; «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026 — https://www.kommersant.ru/doc/8969946"
        otryvok: «В «Гознаке» хранятся 1500 страниц записей Ивана Орлова, сделанных в 1926 году.»
        stranica: «Неподдельный интерес. Как крестьянский сын российские деньги защитил», «АиФ-Нижний Новгород», 21.02.2026
        href: https://nn.aif.ru/culture/nepoddelnyy-interes-kak-krestyanskiy-syn-rossiyskie-dengi-zashchitil
        pometka: два источника
      - summary: <b>Сначала Орлов хотел ткать деньги из шёлка — ему отказали, но взяли на службу.</b>
        det:
          - "Мастер ткацкой фабрики прочитал в газете, что в стране всё чаще появляются фальшивые деньги, и решил: деньги на шёлковой ткани подделать труднее. Проект он отправил министру финансов Николаю Бунге."
          - "Шёлковые деньги делать не стали: по всему миру деньги печатают на бумаге. Но Орлова позвали в Петербург и оставили работать в Экспедиции заготовления государственных бумаг — там, где печатали деньги."
        src: "Источник: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026 — https://www.kommersant.ru/doc/8969946"
        otryvok: «Проект изобретатель отправил министру финансов Николаю Бунге, после чего Ивана Орлова пригласили в Петербург в Экспедицию заготовления государственных бумаг. Тогда в реализации идеи с шелковыми банкнотами Орлову все же отказали, сославшись на то, что общемировая практика печатания денег — на бумаге.»
        stranica: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026
        href: https://www.kommersant.ru/doc/8969946
        pometka: документ
      - summary: <b>Самую секретную часть машины Орлова сделали на заводе Однера — создателя арифмометра.</b>
        det:
          - Печатную машину Орлова собрали из двух частей. Первую, самую сложную и секретную, изготовили в Петербурге на заводе Вильгодта Однера — того самого, чей арифмометр стал «Феликсом» (о нём — 18 января).
          - Вторую, попроще, заказали в Германии.
        src: "Источник: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026 — https://www.kommersant.ru/doc/8969946"
        otryvok: "«Печатную машину, сконструированную изобретателем, в Экспедиции собрали из двух частей: первую, более сложную и секретную, изготовили на Механическом и меднолитейном заводе В. Т. Однера в Петербурге…»"
        stranica: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026
        href: https://www.kommersant.ru/doc/8969946
        pometka: два источника
      - summary: <b>За пять лет способом Орлова напечатали больше 70 миллионов билетов и бумаг.</b>
        det:
          - Через пять лет после первых оттисков Экспедиция выпустила больше 70 миллионов кредитных билетов и ценных бумаг с орловской печатью.
          - Машины для этого производства полностью делали в России.
        src: "Источник: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026 — https://www.kommersant.ru/doc/8969946"
        otryvok: «Спустя пять лет Экспедиция отпечатала более 70 млн кредитных билетов и ценных бумаг с использованием орловской печати. Машины, которыми оборудовали производство, полностью производились в России.»
        stranica: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026
        href: https://www.kommersant.ru/doc/8969946
        pometka: два источника
      - summary: <b>Немецкий завод делал машины по патенту Орлова — и платил России золотом.</b>
        det:
          - Немецкая фирма «Кёниг и Бауэр» наладила серийный выпуск печатных машин по патенту Орлова. За русскую идею она расплачивалась с Россией золотом.
        src: "Источник: Банк России, памятная монета «Орловская печать» (серия «Изобретения России», 2025), историко-тематическая справка — https://www.cbr.ru/cash_circulation/memorable_coins/coins_base/showcoins/?cat_num=5111-0528"
        otryvok: «Машиностроительная компания «Кениг и Бауер» наладила серийный выпуск машин по патенту Орлова и платила России золотом за идею.»
        stranica: Банк России, памятная монета «Орловская печать» (серия «Изобретения России», 2025), историко-тематическая справка
        href: https://www.cbr.ru/cash_circulation/memorable_coins/coins_base/showcoins/?cat_num=5111-0528
        pometka: два источника
      - summary: <b>После смерти Орлова его изобретение пытались украсть — газета «Правда» вступилась.</b>
        det:
          - Орлов умер в 1928 году. Вскоре один немецкий предприниматель попытался выдать его изобретение за своё.
          - "«Правда» ответила, что немцам надо объяснить: «мы тоже не лаптем щи хлебаем и жульничество от изобретательства отличать выучились»."
        src: "Источник: «Русская революция в печатном деле», «Наука и жизнь», 10.08.2018 — https://www.nkj.ru/open/32603/"
        otryvok: «После смерти Орлова (умер он в 1928 году) его изобретение еще раз хотел украсть один немецкий предприниматель. В газете «Правда» тогда писали, что следует объяснить в немецкой прессе, «что мы тоже не лаптем щи хлебаем и жульничество от изобретательства отличать выучились».»
        stranica: «Русская революция в печатном деле», «Наука и жизнь», 10.08.2018
        href: https://www.nkj.ru/open/32603/
        pometka: документ
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Деньги, закон и монета
    udary:
      - summary: <b>Первые советские деньги печатали по-орловски — в год, когда самого Орлова посадили.</b>
        det:
          - Новой стране были нужны новые деньги, защищённые от подделок, — и их печатали орловским способом. Пёстрые маленькие купюры 1919 года с гербом РСФСР прозвали «мотыльками» и печатали по 25 штук на листе.
          - В том же 1919 году самого изобретателя держали в тюрьме по подозрению в подделке денег.
        src: "Источник: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026 — https://www.kommersant.ru/doc/8969946"
        otryvok: «…новой стране были нужны новые деньги, защищенные от подделок — и все они печатались орловским способом. Напечатанные в 1919 году купюры с гербом РСФСР прозвали «мотыльками» за многокрасочную расцветку и малые размеры.»
        stranica: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026
        href: https://www.kommersant.ru/doc/8969946
        pometka: документ
      - summary: <b>Право на способ Орлова в России по закону есть только у Гознака.</b>
        det:
          - "Способ Орлова — не музейная редкость: им и сегодня защищают российские деньги. Пользоваться им в России по закону может только Гознак."
        src: "Источник: «Неподдельный интерес. Как крестьянский сын российские деньги защитил», «АиФ-Нижний Новгород», 21.02.2026 — https://nn.aif.ru/culture/nepoddelnyy-interes-kak-krestyanskiy-syn-rossiyskie-dengi-zashchitil"
        otryvok: «В России исключительное право использования технологии нижегородца Ивана Орлова законодательно закреплено за «Гознаком».»
        stranica: «Неподдельный интерес. Как крестьянский сын российские деньги защитил», «АиФ-Нижний Новгород», 21.02.2026
        href: https://nn.aif.ru/culture/nepoddelnyy-interes-kak-krestyanskiy-syn-rossiyskie-dengi-zashchitil
        pometka: документ
      - summary: <b>Машины для печати денег по всему миру и сегодня носят его имя.</b>
        det:
          - Печатные машины для денег и ценных бумаг, которые выпускает концерн KBA-NotaSys, называются «Супер Орлов Интальо». На них печатают ценные бумаги по всему миру.
          - А на Гознаке хранят один из образцов печатной машины самого Орлова.
        src: "Источник: «Русская революция в печатном деле», «Наука и жизнь», 10.08.2018 — https://www.nkj.ru/open/32603/"
        otryvok: «В настоящее время печатные машины производства немецкого концерна KBA-NotaSys SA носят имя русского изобретателя, они называются «Super Orlof Intaglio» («Супер Орлов Интальо»), и их используют при производстве ценных бумаг во всем мире.»
        stranica: «Русская революция в печатном деле», «Наука и жизнь», 10.08.2018
        href: https://www.nkj.ru/open/32603/
        pometka: два источника
      - summary: <b>Чтобы никто не присвоил его способ, Орлов объявил о нём на весь Петербург.</b>
        det:
          - В декабре 1896 года Орлов выступил в Русском техническом обществе с сообщением «Способ многокрасочного печатания с одного клише» — так он закрепил за собой первенство.
          - Следом, в 1897 и 1898 годах, в Петербурге вышли две его книги о новом способе.
        src: "Источник: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026 — https://www.kommersant.ru/doc/8969946"
        otryvok: «Чтобы закрепить первенство изобретения и официально известить о нем, в декабре 1896 года мастер выступил на заседании Технического общества с сообщением «Способ многокрасочного печатания с одного клише».»
        stranica: «Орловская печать», «Коммерсантъ-Приволжье», 18.09.2026
        href: https://www.kommersant.ru/doc/8969946
        pometka: документ
      - summary: <b>В 2025 году Банк России выпустил в честь Орлова серебряную монету.</b>
        det:
          - Серебряная монета в 3 рубля «Орловская печать» вышла в серии «Изобретения России». На ней портрет Орлова, чертёж его печатного станка и цветной узор, повторяющий орловскую печать.
        src: "Источник: «Тайны „денежной“ печати Ивана Орлова узнают посетители выставки…», Банк России, 02.02.2026 — https://www.cbr.ru/press/regevent/?id=64950"
        otryvok: «…увеличенная тактильная копия памятной серебряной монеты номиналом 3 рубля «Орловская печать» 2025 года выпуска…»
        stranica: «Тайны „денежной“ печати Ивана Орлова узнают посетители выставки…», Банк России, 02.02.2026
        href: https://www.cbr.ru/press/regevent/?id=64950
        pometka: два источника
