pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: <b>Граница первенства:</b> Иван Орлов создал первый в мире способ печатать все краски рисунка с одной печатной формы за один прогон — с точным совпадением красок. Работа начата в 1890 году, первые банкноты — 1892-й. Документы — патенты Германии (1897), Франции, Англии и России (1899).
  net: <b>Чего здесь нет:</b> Орлов не изобрёл многокрасочную печать и защиту денег вообще. Его первенство — одна форма и один прогон вместо стопки отдельных.
  kolonki:
    - Где
    - Что
    - Когда
  stroki:
    - - Россия, Экспедиция
      - "Орловская печать: первые кредитные билеты"
      - "1892"
    - - Германия, «Кёниг и Бауэр»
      - Машины по патенту Орлова, выплаты России
      - после 1897
    - - Австро-Венгрия
      - Орловская печать на банкноте 10 крон
      - "1904"
    - - Швейцария, KBA-NotaSys
      - Машины «Супер Орлоф Интальо» для денежных фабрик
