quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — все краски с одной формы за один прогон; 2 — от двух до десяти; 3 — в Германии; 4 — передал государству; 5 — пневматический самонаклад."
  ball: 10
  voprosy:
    - q: Что именно придумал Орлов?
      o:
        - Водяной знак на бумаге денег
        - Печатать все краски с одной формы за один прогон
        - Первые бумажные деньги России
      a: 1
      e: Один прогон и одна форма на все краски. Водяные знаки известны со Средневековья, бумажные ассигнации ходили в России с XVIII века.
    - q: Сколько прогонов требовал многокрасочный рисунок до Орлова?
      o:
        - Один
        - От двух до десяти
        - Ровно сто
      a: 1
      e: От двух до десяти — по прогону на краску. У Орлова — один.
    - q: Где Орлов получил патент раньше, чем в России?
      o:
        - В Германии
        - "Нигде: он не патентовал способ"
        - В России раньше всех
      a: 0
      e: Германский патент — 1897 год, российский — только 1899-й. Потом пришли французский и английский.
    - q: Что Орлов сделал с правами на изобретение в 1897 году?
      o:
        - Продал немцам за миллион
        - Передал государству
        - Оставил себе и открыл фабрику
      a: 1
      e: "Передал казне. Суворин записал: «Немцы дают ему миллион, а он отдал изобретение казне и получил всего десять тысяч»."
    - q: Что ещё Орлов построил для печатной машины?
      o:
        - Пневматический самонаклад
        - Паровой двигатель
        - Телеграфный аппарат
      a: 0
      e: Пневматический самонаклад подавал в машину до 120 листов в минуту.
