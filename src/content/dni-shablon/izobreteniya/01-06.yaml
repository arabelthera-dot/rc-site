  transcript:
    - <p>«Линия на листе из альбома Орлова меняет цвет, не прерываясь. До него каждую краску печатали отдельным прогоном — от двух до десяти раз, и на стыке цветов оставался сдвиг».</p>
    - <p>«Иван Орлов, сын нижегородских крестьян, пришёл в Экспедицию заготовления государственных бумаг в 1886 году. В 1890-м он начал собирать все краски на одной печатной форме, чтобы лист проходил машину один раз».</p>
    - <p>«Совпадение красок, недостижимое при печати по очереди, стало защитой от подделки. Первые кредитные билеты с орловской печатью вышли в 1892 году, десятирублёвые в три краски — в 1894-м».</p>
    - <p>«Германский патент выдан в 1897 году, раньше российского (1899); „Кёниг и Бауэр“ строила машины по патенту Орлова. Сам он в ноябре 1897-го передал права на изобретение государству».</p>
    - <p>«Орловскую печать видно на банкноте в 10 крон 1904 года, а машины „Супер Орлоф Интальо“ работают на денежных фабриках мира и сегодня».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
