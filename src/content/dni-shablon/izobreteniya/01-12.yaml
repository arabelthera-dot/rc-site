  transcript:
    - "<p>«Ракета семейства Р-7 на ВДНХ: центральный блок и четыре боковых вокруг него — первая в мире межконтинентальная баллистическая ракета».</p>"
    - <p>«Сергей Королёв родился 12 января 1907 года. 20 мая 1954 года его ОКБ-1 получило задание на межконтинентальную ракету».</p>
    - "<p>«Пакетная схема: все двигатели запускаются на земле, а не в полёте. Стартовая масса — 283 тонны; двигатели — бюро Валентина Глушко».</p>"
    - <p>«15 мая, 11 июня, 12 июля 1957 года — три неудачи. 21 августа головная часть дошла до полигона Кура на Камчатке; американский „Атлас“ повторит это в ноябре 1958-го».</p>
    - <p>«4 октября 1957 года Р-7 вывела на орбиту первый спутник, в 1961-м ракета этой семьи подняла Гагарина. „Союзы“ из той же семьи летают до сих пор».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
