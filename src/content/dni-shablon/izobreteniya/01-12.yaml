    udary:
      - summary: "Свои звали ракету «семёркой», а в секретных бумагах она шла как «изделие 8К71»."
        kadr:
          src: "/muzei/izobreteniya/img/01-12-model-8k71.jpg"
          alt: "Зелёная модель ракеты на круглой чёрной подставке: вокруг центрального блока с конусом наверху — четыре конусообразных боковых блока, внизу видны сопла."
          data_source: "https://goskatalog.ru/portal/#/collections?id=60097021"
          license: "цитирование в информационных целях (ст. 1274 ГК РФ) · Музейное объединение «Музеи наукограда Королёв» · Госкаталог, рег. № 59800367"
          podpis: "Модель-копия межконтинентальной ракеты 8К71 — так Р-7 называлась в секретных документах. Видна схема «пакет»: четыре боковых блока вокруг центрального."
          credit: "Модель-копия, 2000-е, заводское производство. Хранится: Музейное объединение «Музеи наукограда Королёв», МОК КИМ КП 139. Госкаталог музейного фонда РФ, рег. № 59800367."
