return:
  q: Первый удачный полёт Р-7 был 21 августа 1957 года. В какой день газеты напечатали об этом сообщение ТАСС?
  a: "27 августа 1957 года: ТАСС сообщил об испытании в СССР «сверхдальней многоступенчатой ракеты»."
  src: Президентская библиотека имени Б. Н. Ельцина, «Состоялся запуск первой советской межконтинентальной баллистической ракеты Р-7»
audioguide:
  audioSrc: audio-guide-r7-ru.mp3
  durationLabel: около трёх минут
  lead: "Голос ведёт по залу королёвской «семёрки»: от одного стартового стола для ракеты, спутника и Гагарина через семь главных конструкторов к двухтысячному пуску её семьи."
  stops:
    - t: 0
      mark: '0:00'
      title: Один стартовый стол
    - t: 32
      mark: '0:32'
      title: Семь главных
    - t: 66
      mark: '1:06'
      title: Висит, а не стоит
    - t: 96
      mark: '1:36'
      title: Неудобное оружие
    - t: 126
      mark: '2:06'
      title: Две тысячи пусков
  transcript:
    - Здравствуйте. Мы в зале первой в мире межконтинентальной ракеты. Двадцать первого августа тысяча девятьсот пятьдесят седьмого года «семёрка» впервые долетела до района цели, и через шесть дней советские газеты сообщили об успешном испытании сверхдальней многоступенчатой ракеты. С того же стартового комплекса четвёртого октября ушёл первый искусственный спутник Земли, а потом корабль с Юрием Гагариным. Под этот старт в тысяча девятьсот пятьдесят пятом году вырыли котлован глубиной сорок пять метров. Сегодня это «Гагаринский старт».
    - "Постановление о ракете приняли двадцатого мая тысяча девятьсот пятьдесят четвёртого года, а первый пуск прошёл пятнадцатого мая тысяча девятьсот пятьдесят седьмого: срок рекордный. Главным конструктором назначили Сергея Королёва. Ещё шестеро отвечали за свои системы: Валентин Глушко — за двигатели, Михаил Рязанский и Николай Пилюгин — за управление, Владимир Бармин — за стартовый комплекс, Виктор Кузнецов — за командные приборы, Алексей Богомолов — за телеметрию. Рулевые двигатели, от которых отказался Глушко, сделали молодые инженеры Королёва во главе с Михаилом Мельниковым."
    - "На старте «семёрка» не стоит, а висит. Четыре фермы держат её за силовой пояс центрального блока и отпускают, когда тяга двигателей становится больше веса ракеты. Так нижнюю часть не нагружали, пока ракета стояла на старте, и её удалось сделать легче. Целой до цели головная часть долетела не сразу: в августе она развалилась в воздухе, и полностью успешным пуск впервые стал лишь двадцать девятого марта тысяча девятьсот пятьдесят восьмого года."
    - "Свои звали ракету «семёркой», а в бумагах она шла под номером изделия. Серийные ракеты с декабря тысяча девятьсот пятьдесят восьмого года собирали в Куйбышеве, на авиазаводе, где раньше строили бомбардировщики. Как оружие она оказалась неудобной: заправленной могла простоять не больше тридцати суток, и построили всего четыре стартовых сооружения. К концу тысяча девятьсот шестьдесят восьмого года её сняли с вооружения. А как космическая ракета она служит до сих пор."
    - "Двадцать пятого декабря две тысячи двадцать четвёртого года ракеты этой семьи стартовали в двухтысячный раз. Боевых пусков из них всего пятьдесят четыре, а остальные тысяча девятьсот сорок шесть вывели в космос две тысячи восемьсот двенадцать аппаратов. Нобелевский комитет захотел узнать имя главного конструктора, но руководство страны отказалось его назвать: мол, творец новой техники — весь народ. При жизни Королёв печатался под псевдонимом «профессор К. Сергеев», а имя рассекретили лишь в день его смерти."
  note: Озвучено синтезом речи.
