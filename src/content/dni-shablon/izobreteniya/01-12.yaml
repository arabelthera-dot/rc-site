  voprosy:
    - q: Чем пакетная схема Р-7 выигрывала у ракеты-башни?
      o:
        - Все двигатели запускались ещё на земле
        - Ракета была легче всех в мире
        - Ей не нужно было топливо в боковых блоках
      a: 0
      e: "Главное достоинство схемы — «возможность запуска всех двигателей на земле, а не в полёте». Лёгкой Р-7 не была: 283 тонны на старте."
    - q: С какой попытки Р-7 впервые долетела до цели?
      o:
        - С первой
        - Со второй
        - С четвёртой
      a: 2
      e: 15 мая — пожар в хвостовом отсеке, 11 июня — ракета не ушла со старта, 12 июля — потеря устойчивости на 33-й секунде. Удачным стал пуск 21 августа 1957 года.
    - q: Куда долетела головная часть 21 августа 1957 года?
      o:
        - В Тихий океан у Гавайев
        - На полигон Кура на Камчатке
        - На Новую Землю
      a: 1
      e: На полигон Кура на Камчатке. В плотных слоях атмосферы она разрушилась, но в заданный квадрат попала.
    - q: Что Р-7 вывела на орбиту 4 октября 1957 года?
      o:
        - Первый искусственный спутник Земли
        - Корабль с Гагариным
        - Станцию «Луна-1»
      a: 0
      e: Первый спутник. Гагарин полетит на ракете этой семьи 12 апреля 1961 года.
    - q: Чьё конструкторское бюро делало двигатели Р-7?
      o:
        - Андрея Туполева
        - Валентина Глушко
        - Михаила Калашникова
      a: 1
      e: ОКБ-456 Валентина Глушко. У каждого бокового блока — четырёхкамерный двигатель.
