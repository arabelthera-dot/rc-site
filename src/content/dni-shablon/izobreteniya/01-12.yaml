  src: Президентская библиотека имени Б. Н. Ельцина, «Состоялся запуск первой советской межконтинентальной баллистической ракеты Р-7»
audioguide:
  audioSrc: audio-guide-r7-ru.mp3
  durationLabel: 3 минуты 44 секунд
  lead: "Голос ведёт по залу ракеты Р-7: от белой «семёрки» в стартовой ферме на ВДНХ до полигона Кура на Камчатке. Шесть остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
