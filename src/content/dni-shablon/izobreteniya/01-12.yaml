        podpis: "Пуск ракеты-носителя Р-7 с искусственным спутником Земли с Байконура. Та же «семёрка», что летала на Камчатку, вывела на орбиту первые спутники."
        credit: "Фото: автор не указан; отпечаток из альбома «В память о Байконуре», 1992. Хранится: Государственный исторический музей, ГИМ 108930/120. Госкаталог музейного фонда РФ, рег. № 12959709."
