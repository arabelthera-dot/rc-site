          prava: {"god_smerti_avtora":"net","god_reabilitacii":"net","sdelano_mashinoj":false,"otkuda":"Госкаталог музейного фонда РФ","baza":"goskatalog","pervaya_publikaciya":"Госкаталог музейного фонда РФ, рег. № 59800367","ssylka":"https://goskatalog.ru/portal/#/collections?id=60097021","avtor":"автор не указан","god_sozdaniya":"2000-е","anonim":true}
          podlinnik: {"gde":"Музейное объединение «Музеи наукограда Королёв», МОК КИМ КП 139","otkuda":"https://goskatalog.ru/portal/#/collections?id=60097021"}
          nomer_predmeta: "инв. в Госкаталоге не указан; Госкаталог рег. № 59800367"
