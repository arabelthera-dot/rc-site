  intro: Та же история коротким роликом — от задания 1954 года и «пакета» из пяти блоков до Камчатки, спутника и «Союза».
  poster: video/day-12jan-r7-poster.jpg?v=1
  mp4: video/day-12jan-r7.mp4?v=1
  note: "Кадры ролика — подлинные: ракета Р-7 перед стартом на полигоне Байконур, 1957, две фотографии (Мемориальный музей космонавтики, Госкаталог музейного фонда РФ, № 27352216 и 27352243); ракета-носитель Р-7 на стартовом столе, 1961 (там же, № 18488988); С. П. Королёв (слева) и Б. Н. Шереметев, 1963 (Белгородский государственный историко-краеведческий музей, № 5507469). Авторы снимков не указаны. Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История изобретения · 12 ударов
  h2: Пакет из пяти ракет
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Сергей Королёв родился 12 января 1907 года в Житомире, в семье учителя словесности.
      det:
        - По старому стилю — 30 декабря 1906 года. Окончил Одесскую строительную профессиональную школу (1924), учился в Киевском политехническом на авиационном отделении, в 1930 году окончил МВТУ имени Баумана.
      src: "Источник: Президентская библиотека имени Б. Н. Ельцина, «Родился советский учёный, конструктор ракетно-космических систем Сергей Павлович Королёв»."
    - summary: В 1933 году он пришёл в только что созданный Реактивный институт — заниматься ракетами.
      det:
        - С 1930 года Королёв работал в Центральном аэродинамическом институте, в 1933-м перешёл в Реактивный научно-исследовательский институт и занимался крылатыми ракетами.
      src: "Источник: Президентская библиотека."
    - summary: В конце 1930-х его арестовали по ложному обвинению и дали десять лет. Освободили досрочно, в июле 1944-го.
      det:
        - Обвинение — «вредительство», по словам Президентской библиотеки, ложное. Досрочно освобождён 27 июля 1944 года. С 1946 года Королёв — главный конструктор баллистических ракет.
      src: "Источник: Президентская библиотека."
    - summary: 20 мая 1954 года правительство поручило его ОКБ-1 ракету, которая долетит до другого континента.
      det:
        - Постановление вышло 20 мая 1954 года. Двигатели делало ОКБ-456 Валентина Глушко.
      src: "Источник: «История создания межконтинентальной баллистической ракеты Р-7», РИА Новости, 21.08.2012."
    - summary: "Королёв не поставил ступени друг на друга, а собрал их пакетом: четыре боковых блока вокруг центрального."
      find: true
      tag: Находка дня
      det:
        - "Обычная многоступенчатая ракета — башня: верхняя ступень зажигается, когда нижняя уже отработала и отпала, высоко в небе. У Р-7 четыре боковых блока — каждый 19 метров длиной и до 3 метров в диаметре — облегают центральный. Такую схему называют параллельным делением ступеней."
        - Главное её достоинство, по словам РИА Новости, — «возможность запуска всех двигателей на земле, а не в полёте». Если двигатель не запустился, это видно на старте, а не в небе.
      src: "Источник: РИА Новости, 2012."
    - summary: У каждого бокового блока — четырёхкамерный двигатель Глушко. На старте ракета весила 283 тонны.
      det:
        - Длина ракеты — 31,4 метра, стартовая масса — 283 тонны, дальность — 8000 километров, масса головной части — 5,4 тонны.
      src: "Источник: РИА Новости, 2012."
    - summary: "15 мая 1957 года первый пуск с полигона Тюра-Там оборвался: в хвостовом отсеке начался пожар."
      det:
        - Полёт сначала шёл нормально. Причина аварии — негерметичность топливной магистрали горючего. Полигон в Казахстане потом назовут Байконуром.
      src: "Источник: К. Редичкина, «Почему Р-7 смогли запустить только с четвёртого раза», «Парламентская газета», 21.08.2019."
    - summary: 11 июня ракета не ушла со стола, 12 июля на 33-й секунде потеряла устойчивость.
      det:
        - 11 июня пуск не состоялся из-за неисправности двигателей центрального блока. 12 июля причиной стало замыкание на корпус цепей управляющего сигнала интегрирующего прибора.
      src: "Источник: «Парламентская газета», 2019."
    - summary: С четвёртой попытки, 21 августа 1957 года, головная часть дошла до полигона Кура на Камчатке.
      det:
        - "Головная часть попала в заданный квадрат. Но в плотных слоях атмосферы она разрушилась, и работа над ней продолжалась. Пуск признали успешным: ракета первой в мире прошла весь путь до района цели."
        - Выходит, Р-7 долетела до Камчатки только с четвёртой попытки, а через полтора месяца та же ракета вывела на орбиту первый в мире спутник — 4 октября 1957 года.
      src: "Источники: «Парламентская газета», 2019; Президентская библиотека, «Состоялся запуск первой советской межконтинентальной баллистической ракеты Р-7»."
    - summary: "27 августа газеты напечатали сообщение ТАСС: в СССР испытана «сверхдальняя многоступенчатая ракета»."
      det:
        - Американская межконтинентальная ракета «Атлас» успешно слетает только в ноябре 1958 года — больше чем через год.
      src: "Источники: Президентская библиотека (сообщение ТАСС); «Вокруг света», «Дубинки межконтинентального значения» («Атлас»)."
    - summary: 4 октября 1957 года та же ракета вывела на орбиту первый в мире искусственный спутник Земли, 3 ноября — второй.
      det:
        - Ракета надёжно работала на активном участке, и её решили использовать для спутников. О самом спутнике — страница 4 октября.
      src: "Источники: Президентская библиотека; РИА Новости, 2012."
    - summary: "На вооружение Р-7 приняли 20 января 1960 года. Её потомки до сих пор возят людей в космос: «Союз» — из той же семьи."
      det:
        - 12 апреля 1961 года ракета этой семьи подняла «Восток-1» с Юрием Гагариным. Сегодня «Союз-2» из той же линии продолжает летать. Королёв умер 14 января 1966 года.
      src: "Источники: Президентская библиотека (вооружение, Гагарин, даты Королёва); «Парламентская газета», 2019 («Союз-2» в эксплуатации)."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Р-7
    h2: Факты дня
    udary:
      - summary: <b>Свои звали ракету «семёркой», а в секретных бумагах она шла как «изделие 8К71».</b>
        det:
          - Свои звали её «семёркой», а в бумагах она шла как «изделие 8К71».
          - Ракета Р-7 строилась как секретное оружие, поэтому в технической документации её называли не по имени, а номером — «изделие № 8К71». А в разговоре конструкторы и испытатели звали её просто «семёркой».
        src: "Источник: «История создания межконтинентальной баллистической ракеты Р-7», РИА Новости, 21.08.2012 — https://ria.ru/20120821/727374310.html"
        otryvok: «Ракета Р-7 именовалась также "семеркой", а в технической документации называлась "изделием №8К71".»
        stranica: «История создания межконтинентальной баллистической ракеты Р-7» // РИА Новости, 21.08.2012
        href: https://ria.ru/20120821/727374310.html
        pometka: документ
      - summary: <b>Целой до цели Р-7 долетела только через семь месяцев — головная часть разваливалась в воздухе.</b>
        det:
          - В августе 1957 года головная часть развалилась в воздухе. Без поломок всё прошло лишь 29 марта 1958-го.
          - После первых шести пусков головную часть Р-7 заменили новой, переделали систему её отделения и антенны телеметрии.
          - "29 марта 1958 года пуск впервые прошёл полностью успешно: головная часть достигла цели и не разрушилась."
        src: "Источник: «История создания межконтинентальной баллистической ракеты Р-7», РИА Новости, 21.08.2012 — https://ria.ru/20120821/727374310.html"
        otryvok: «Основным недостатком этого пуска явилось разрушение головной части в плотных слоях атмосферы на нисходящем участке траектории.» … «По результатам шести запусков ракеты Р-7 были доработаны головная часть (заменена новой) и система ее отделения, применены щелевые антенны телеметрической системы. 29 марта 1958 года впервые полностью успешно прошел пуск ракеты Р-7 (головная часть достигла цели без разрушения).»
        stranica: «История создания межконтинентальной баллистической ракеты Р-7» // РИА Новости, 21.08.2012
        href: https://ria.ru/20120821/727374310.html
        pometka: документ
      - summary: <b>Боевые «семёрки» поручили собирать заводу бомбардировщиков в Куйбышеве.</b>
        det:
          - Опытный завод под Москвой не справлялся, и выпуск «семёрок» поручили авиазаводу в Куйбышеве.
          - Первые Р-7 делали на заводе № 88 в подмосковном Калининграде — сейчас это город Королёв. Мощности там было мало. В феврале 1958 года ведущего конструктора «семёрки» Дмитрия Козлова отправили в Куйбышев (сейчас Самара). Там, на авиационном заводе № 1, раньше строили бомбардировщики.
          - Уже в декабре 1958 года со сборочной линии сошли первые серийные ракеты. Сегодня это предприятие — ракетно-космический центр «Прогресс».
        src: "Источник: «История создания межконтинентальной баллистической ракеты Р-7», РИА Новости, 21.08.2012 — https://ria.ru/20120821/727374310.html"
        otryvok: «Возможности опытного завода были ограничены, поэтому в феврале 1958 года ведущий конструктор "семерки" Дмитрий Козлов получил назначение в город Куйбышев (ныне Самара) для организации на базе авиационного завода № 1 (завод "Прогресс", ныне ФГУП "Государственный научно-производственный ракетно-космический центр "ЦСКБ - Прогресс"), на котором изготавливались бомбардировщики, серийного производства ракет Р-7. И уже в декабре 1958 года со сборочной линии завода сошли первые серийные изделия.»
        stranica: «История создания межконтинентальной баллистической ракеты Р-7» // РИА Новости, 21.08.2012
        href: https://ria.ru/20120821/727374310.html
        pometka: документ
      - summary: "<b>Как оружие Р-7 оказалась неудобной: заправленной она могла стоять не больше месяца.</b>"
        det:
          - Заправленной ракета могла стоять не больше месяца, а кислород для неё делал целый завод.
          - Перед стартом ракету везли по железной дороге на специальном лафете и ставили на пусковое устройство. Подготовка длилась больше двух часов. Заправленной Р-7 могла простоять не больше 30 суток.
          - "Поэтому много таких ракет на боевое дежурство поставить не смогли: построили всего четыре стартовых сооружения. К концу 1968 года Р-7 сняли с вооружения. А как космическая ракета она служит до сих пор."
        src: "Источник: «История создания межконтинентальной баллистической ракеты Р-7», РИА Новости, 21.08.2012 — https://ria.ru/20120821/727374310.html"
        otryvok: «К тому же в заправленном состоянии ракета могла находиться не более 30 суток. Для создания и пополнения необходимого запаса кислорода для развернутых ракет нужен был целый завод.» … «Всего было построено четыре стартовых сооружения. К концу 1968 года обе эти ракеты сняли с вооружения.»
        stranica: «История создания межконтинентальной баллистической ракеты Р-7» // РИА Новости, 21.08.2012
        href: https://ria.ru/20120821/727374310.html
        pometka: документ
      - summary: "<b>Самая массовая ракета в истории: семья Р-7 стартовала около 2000 раз.</b>"
        det:
          - К 2019 году ракеты семьи Р-7 стартовали около 2000 раз.
          - "На основе Р-7 сделали целое семейство: «Восток», «Восход», «Молния», «Союз», «Союз-2». Ракет этой семьи запустили больше всех в истории, и их считают одними из самых надёжных в мире."
          - И все пилотируемые полёты СССР и России, начиная с гагаринского, стартовали на ракетах этой семьи — так писала «Парламентская газета» в 2019 году.
        src: "Источник: К. Редичкина, «Почему Р-7 смогли запустить только с четвёртого раза», «Парламентская газета», 21.08.2019 — https://www.pnp.ru/social/pochemu-r-7-smogli-zapustit-tolko-s-chetvertogo-raza.html"
        otryvok: «Ракеты семейства Р-7 стали самыми массовыми в истории, число их запусков уже составляет порядка 2000, они же признаются и одними из самых надежных в мире. На сегодняшний день все пилотируемые запуски Советского Союза и России осуществлены при помощи ракет-носителей данного семейства.»
        stranica: Редичкина К. «Почему Р-7 смогли запустить только с четвёртого раза» // Парламентская газета, 21.08.2019
        href: https://www.pnp.ru/social/pochemu-r-7-smogli-zapustit-tolko-s-chetvertogo-raza.html
        pometka: документ
      - summary: <b>На старте Р-7 не стоит, а висит — четыре фермы держат её за пояс.</b>
        det:
          - Четыре фермы держат её за пояс и отпускают, когда тяга двигателей становится больше веса ракеты.
          - В пусковом устройстве Р-7 подвешивали на четырёх ферменных опорах — за силовой пояс центрального блока, к которому крепятся боковые блоки. Опоры держали ракету и отпускали её при старте, когда тяга двигателей превышала вес.
          - "В РКК «Энергия» объясняют, зачем так сделали: нижнюю часть ракеты не нагружали, пока она стояла на старте, и её удалось сделать легче."
        src: "Источники: Н. Ячменникова, «Что стоит за 2000-м пуском ракеты семейства Р-7», «Российская газета», 26.12.2024 — https://rg.ru/2024/12/26/chto-stoit-za-2000-m-puskom-rakety-semejstva-r-7.html; РКК «Энергия», «Ракета Р-7» — https://www.energia.ru/ru/history/systems/rockets/r7.html"
        otryvok: «Визитная карточка ракеты - в пусковом устройстве она подвешивалась с помощью четырех ферменных опор за силовой шпангоут центрального блока, к которому крепились боковые блоки. Опоры удерживали МБР и отпускали ее при старте, когда тяга двигателей превышала вес ракеты.» («Российская газета»). — «…пришлось создавать стационарное наземное оборудование с нетрадиционным способом подвески ракеты на специальных отбрасываемых фермах, что позволило не нагружать нижнюю часть ракеты при стоянке и уменьшить ее массу.» (РКК «Энергия»)
        stranica: Ячменникова Н. «Что стоит за 2000-м пуском ракеты семейства Р-7» // Российская газета, 26.12.2024; РКК «Энергия», «Ракета Р-7»; второй источник — https://www.energia.ru/ru/history/systems/rockets/r7.html
        href: https://rg.ru/2024/12/26/chto-stoit-za-2000-m-puskom-rakety-semejstva-r-7.html
        pometka: два источника
      - summary: <b>Под старт «семёрки» вырыли самый крупный котлован в мире.</b>
        det:
          - "В 1955 году: 45 метров в глубину, 250 в длину и 100 в ширину."
          - Стартовый комплекс для Р-7 строили под руководством Владимира Бармина. Работы на полигоне начали зимой 1955 года, и в тот же год вырыли котлован глубиной 45 метров, длиной 250 и шириной 100 метров. Сегодня это «Гагаринский старт» — площадка № 1 космодрома Байконур.
        src: "Источник: ЦЭНКИ, «„Гагаринский старт“: от первого пуска к новым звёздам», 23.09.2019 — https://www.russian.space/press-tsentr/novosti/gagarinskiy-start-ot-pervogo-puska-k-novym-zvezdam.html"
        otryvok: «Строительные работы на полигоне были начаты зимой 1955 года. В тот же год был вырыт самый крупный котлован в мире — глубиной 45 м, длиной 250 м и шириной 100 м.»
        stranica: "ЦЭНКИ. «„Гагаринский старт“: от первого пуска к новым звездам», 23.09.2019"
        href: https://www.russian.space/press-tsentr/novosti/gagarinskiy-start-ot-pervogo-puska-k-novym-zvezdam.html
        pometka: документ
      - summary: <b>Конструктор Палло поимённо записал всех, кто собирал первые Р-7, — на пяти листах.</b>
        det:
          - Конструктор Арвид Палло перечислил их поимённо в рукописи на пяти листах.
          - Рукопись лежит в личном фонде Арвида Владимировича Палло в Российском государственном архиве научно-технической документации (РГАНТД). В ней поимённо названы все, кто изготавливал первые ракеты Р-7 на заводе № 88 в подмосковных Подлипках.
        src: "Источник: РГАНТД, «К первому пуску легендарной „Семёрки“. Из истории советской космонавтики» — https://rgantd.ru/news/pamyatnye-daty/k-pervomu-pusku-legendarnoy-semyerki-iz-istorii-sovetskoy-kosmonavtiki/"
        otryvok: «В личном фонде Арвида Владимировича Палло, хранящемся в Российском государственном архиве научно-технической документации (РГАНТД), имеется его рукопись на пяти листах, в которой поименно перечислены все, кто изготавливал первые экземпляры ракеты Р-7 на заводе № 88 в подмосковных Подлипках.»
        stranica: РГАНТД. «К первому пуску легендарной „Семёрки“. Из истории советской космонавтики»
        href: https://rgantd.ru/news/pamyatnye-daty/k-pervomu-pusku-legendarnoy-semyerki-iz-istorii-sovetskoy-kosmonavtiki/
        pometka: документ
      - summary: <b>Первая удачная Р-7, первый в мире спутник и Гагарин улетели с одного стартового стола.</b>
        det:
          - К 2019 году с него было 518 пусков.
          - 21 августа 1957 года с этого стартового комплекса прошёл первый успешный пуск Р-7. Отсюда же 4 октября 1957 года ушёл первый искусственный спутник Земли, а потом — корабль «Восток-1» с Юрием Гагариным. К сентябрю 2019 года с площадки № 1 выполнили 518 пусков.
        src: "Источник: ЦЭНКИ, «„Гагаринский старт“: от первого пуска к новым звёздам», 23.09.2019 — https://www.russian.space/press-tsentr/novosti/gagarinskiy-start-ot-pervogo-puska-k-novym-zvezdam.html"
        otryvok: «21 августа 1957 года со стартового комплекса состоялся первый успешный пуск ракеты Р-7. Позже с «Гагаринского старта» были осуществлены легендарные запуски первого искусственного спутника Земли 4 октября 1957г. и космического корабля «Восток-1» с первым космонавтом Земли Юрием Алексеевичем Гагариным. Всего за время существования площадки № 1 осуществлено 518 пусков.»
        stranica: "ЦЭНКИ. «„Гагаринский старт“: от первого пуска к новым звездам», 23.09.2019"
        href: https://www.russian.space/press-tsentr/novosti/gagarinskiy-start-ot-pervogo-puska-k-novym-zvezdam.html
        pometka: документ
      - summary: <b>Р-7 строили семь главных конструкторов — каждый отвечал за свою часть.</b>
        det:
          - Королёв, Глушко, Рязанский, Пилюгин, Бармин, Кузнецов, Богомолов — каждый отвечал за свою часть.
          - "Главным конструктором всей ракеты назначили Сергея Королёва. Ещё шестеро отвечали за свои системы: Валентин Глушко — за двигатели, Михаил Рязанский и Николай Пилюгин — за системы управления, Владимир Бармин — за стартовый комплекс, Виктор Кузнецов — за командные приборы, Алексей Богомолов — за телеметрию и приборы, которые следили за полётом."
          - Их общий снимок хранится в Музее космонавтики.
        src: "Источники: РГАНТД, «К первому пуску легендарной „Семёрки“. Из истории советской космонавтики» — https://rgantd.ru/news/pamyatnye-daty/k-pervomu-pusku-legendarnoy-semyerki-iz-istorii-sovetskoy-kosmonavtiki/; Музей космонавтики, коллекция — https://kosmo-museum.ru/collections/6"
        otryvok: "«Главным конструктором по созданию МБР был назначен С.П. Королев, еще шесть главных конструкторов отвечали за создание отдельных систем и аппаратуры ракеты: В.П. Глушко – ракетные двигатели, М.С. Рязанский и Н.А. Пилюгин – системы управления, В.П. Бармин – наземное оборудование и стартовый комплекс, В.И. Кузнецов – командные приборы, А.Ф. Богомолов – телеметрические и траекторные приборы.» (РГАНТД). — «Главные конструкторы: А.Ф. Богомолов, М.С. Рязанский, Н.А. Пилюгин, С.П. Королёв, В.П. Глушко, В.П. Бармин, В.И. Кузнецов» (Музей космонавтики, подпись к снимку в коллекции)"
        stranica: РГАНТД. «К первому пуску легендарной „Семёрки“. Из истории советской космонавтики»; Музей космонавтики, коллекция; второй источник — https://kosmo-museum.ru/collections/6
        href: https://rgantd.ru/news/pamyatnye-daty/k-pervomu-pusku-legendarnoy-semyerki-iz-istorii-sovetskoy-kosmonavtiki/
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Испытания, рекорды и тайна главного конструктора
    udary:
      - summary: <b>От постановления до первого полёта Р-7 прошло всего три года — рекордный срок.</b>
        det:
          - "Срок рекордный: над ракетой работали десятки конструкторских бюро и заводов."
          - Постановление о создании Р-7 приняли 20 мая 1954 года, а первый пуск прошёл 15 мая 1957-го. Ракету сделали за рекордно короткий срок. В работе участвовали десятки конструкторских бюро и заводов, тысячи конструкторов, инженеров и рабочих.
        src: "Источники: РГАНТД, «К первому пуску легендарной „Семёрки“. Из истории советской космонавтики» — https://rgantd.ru/news/pamyatnye-daty/k-pervomu-pusku-legendarnoy-semyerki-iz-istorii-sovetskoy-kosmonavtiki/; РКК «Энергия», «Ракета Р-7» — https://www.energia.ru/ru/history/systems/rockets/r7.html"
        otryvok: "«Постановление ЦК КПСС и Совета Министров СССР о создании межконтинентальной баллистической ракеты (МБР), получившей обозначение Р-7 (8К71), было принято 20 мая 1954 г.» … «Ракета была разработана и изготовлена в рекордно короткие сроки: всего за три года. В ее создании принимали участие десятки конструкторских бюро и заводов, тысячи конструкторов, инженеров и высококлассных рабочих-мастеров.»"
        stranica: РГАНТД. «К первому пуску легендарной „Семёрки“. Из истории советской космонавтики»
        href: https://rgantd.ru/news/pamyatnye-daty/k-pervomu-pusku-legendarnoy-semyerki-iz-istorii-sovetskoy-kosmonavtiki/
        pometka: документ
      - summary: <b>25 декабря 2024 года ракеты семьи Р-7 стартовали в 2000-й раз.</b>
        det:
          - "Боевых пусков из них всего 54, остальные 1946 — мирные: они вывели в космос 2812 аппаратов."
          - "Юбилейный пуск был с Байконура: ракета «Союз-2.1б» вывела на орбиту спутник «Ресурс-П» № 5, который снимает Землю. Из 2000 пусков семьи Р-7 только 54 — пуски межконтинентальных боевых ракет. Остальные 1946 — ракеты-носители, и они вывели на орбиты и к другим планетам 2812 космических аппаратов."
        src: "Источники: Н. Ячменникова, «Что стоит за 2000-м пуском ракеты семейства Р-7», «Российская газета», 26.12.2024 — https://rg.ru/2024/12/26/chto-stoit-za-2000-m-puskom-rakety-semejstva-r-7.html; РИА Новости, 25.12.2024 — https://ria.ru/20241225/raketa-1991173631.html"
        otryvok: «Но запуск "Ресурс-П" № 5 стал особенным еще и потому, что это был юбилейный - 2000-й пуск для ракет семейства Р-7. <…> Всего с космодромов Байконур, Плесецк и Восточный, а также из Гвианского космического центра выполнены 54 пуска межконтинентальных баллистических ракет и 1946 пусков ракет-носителей - представительниц семейства Р-7, на околоземные орбиты и отлётные траектории выведены 2812 космических аппаратов.» («Российская газета»). — «Ракета "Союз-2.1б", стартовавшая в среду, стала двухтысячной запущенной ракетой на базе Р-7.» (РИА Новости, 25.12.2024)
        stranica: Ячменникова Н. «Что стоит за 2000-м пуском ракеты семейства Р-7» // Российская газета, 26.12.2024; «"Союз-2.1б" вывел на орбиту спутник "Ресурс-П"» // РИА Новости, 25.12.2024; второй источник — https://ria.ru/20241225/raketa-1991173631.html
        href: https://rg.ru/2024/12/26/chto-stoit-za-2000-m-puskom-rakety-semejstva-r-7.html
        pometka: два источника
      - summary: <b>27 августа 1957 года ТАСС объявил миру, что в СССР испытали межконтинентальную ракету.</b>
        det:
          - До первого спутника оставалось 38 дней.
          - 21 августа 1957 года Р-7 впервые долетела до района цели. Через шесть дней, 27 августа, в советских газетах вышло сообщение ТАСС об успешном испытании в СССР сверхдальней многоступенчатой ракеты. А 4 октября та же «семёрка» вывела на орбиту первый спутник Земли.
        src: "Источники: Президентская библиотека, «Состоялся запуск первой советской межконтинентальной баллистической ракеты Р-7» — https://www.prlib.ru/history/619478; РИА Новости Крым, 20.01.2026 — https://crimea.ria.ru/20260120/velikolepnaya-semerka-kak-sovetskaya-raketa-r-7-otkryla-kosmicheskuyu-eru-1152507942.html"
        otryvok: «21 августа 1957 г. состоялся четвёртый запуск, который оказался успешным, и ракета впервые достигла района цели. 27 августа 1957 г. в советских газетах появилось сообщение ТАСС об успешном испытании в СССР сверхдальней многоступенчатой ракеты.» (Президентская библиотека). — «27 августа 1957 года в прессе было опубликовано первое сообщение об испытании в СССР межконтинентальной баллистической ракеты.» (РИА Новости Крым)
        stranica: Президентская библиотека, «Состоялся запуск первой советской межконтинентальной баллистической ракеты Р-7»; «Великолепная семёрка…» // РИА Новости Крым, 20.01.2026; второй источник — https://crimea.ria.ru/20260120/velikolepnaya-semerka-kak-sovetskaya-raketa-r-7-otkryla-kosmicheskuyu-eru-1152507942.html
        href: https://www.prlib.ru/history/619478
        pometka: два источника
      - summary: <b>Главный двигателист отказался от рулевых моторов — их сделали молодые</b>
        det:
          - Двигатели для Р-7 делало бюро Валентина Глушко. Но маленькие поворотные двигатели, которыми ракета рулит в полёте, он делать отказался — к тому же между ним и Королёвым шёл спор.
          - Тогда Королёв поручил эту работу своим молодым инженерам во главе с Михаилом Мельниковым. Их рулевые камеры и встали на «семёрку».
        src: 'Источник: Я. Солонин, «70 лет назад в СССР испытали ракету-монстра», Lenta.ru, 2026 — <a href="https://lenta.ru/articles/2026/07/31/r7/" rel="noopener">lenta.ru/articles/2026/07/31/r7/</a>; «Как „семерка“ обогнала всех», ПРО Космос, 2025 — <a href="https://prokosmos.ru/2025/04/07/kak-semerka-obognala-vsekh-osobennosti-raketi-dlya-gagarinskogo-korablya" rel="noopener">prokosmos.ru/2025/04/07/…</a>.'
        otryvok: «Когда амбициозный Глушко отказался делать рулевые двигатели, Королев привлек молодых двигателистов — Мельникова, Райкова и Соколова.»
        stranica: Я. Солонин, «70 лет назад в СССР испытали ракету-монстра», Lenta.ru
        href: https://lenta.ru/articles/2026/07/31/r7/
        pometka: два источника
      - summary: <b>Нобелевский комитет спросил имя создателя спутника — его не назвали</b>
        det:
          - Ракета Королёва вывела в космос первый спутник и первого космонавта, и в Нобелевском комитете захотели узнать имя главного конструктора.
          - "Руководство страны отказалось его назвать: мол, творец новой техники — весь народ. Имя Королёва рассекретили лишь в день его смерти, а при жизни он печатался под псевдонимом «профессор К. Сергеев»."
        src: 'Источник: «Сергей Королев мечтал стать первым человеком в космосе», Российская газета, 2017 — <a href="https://rg.ru/2017/01/11/sergej-korolev-mechtal-stat-pervym-chelovekom-v-kosmose.html" rel="noopener">rg.ru/2017/01/11/…</a>.'
        otryvok: '«Но когда Нобелевский комитет предложил назвать фамилию главного конструктора, Никита Хрущев обрубил: "Одного человека назвать нельзя, творцом новой техники у нас является весь народ". <…> Имя Сергея Королева было рассекречено лишь в день его смерти.»'
        stranica: «Сергей Королев мечтал стать первым человеком в космосе», Российская газета
        href: https://rg.ru/2017/01/11/sergej-korolev-mechtal-stat-pervym-chelovekom-v-kosmose.html
        pometka: документ
