igra:
  kicker: Играй
  zagolovok: 🎮 Кто что сделал
  mehanika: kazhdomu-svoyo-mesto
  pravilo_ru: 'Что сделать сейчас: выбери героя и нажми на то, что он сделал.'
  kak_igrat:
    zachem: 'У каждого в этой истории — своё: петля, «буква S», приказ.'
    shagi:
    - Выбери героя — кнопка загорится золотом.
    - Нажми на его поступок. Верный выбор загорится зелёным.
    - Расставь всех троих — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все трое на месте — +20 баллов.
  dannye:
    bez_skripta_ru: 'Игра работает с включённым JavaScript: Нестеров — петля и повтор на 3500 м, Пегу — «буква S», кайзер — приказ летать «как это делают русские».'
    mesta:
    - kod: petlya
      nazvanie: Повторил петлю на 3500 м
      verno_ru: Военное ведомство приказом запретило повторять петлю — Нестеров тайком повторил её на 3500 м.
    - kod: bukva
      nazvanie: Сначала летал «буквой S»
      verno_ru: 'Перед взлётом: Пегу петли не делал, только «букву S», — настоящую увидите сейчас.'
    - kod: prikaz
      nazvanie: Велел летать «как это делают русские»
      verno_ru: Кайзер Вильгельм II приказал своим лётчикам летать так, «как это делают русские».
    podpisi:
    - kod: nesterov
      tekst: Нестеров
      mesto: petlya
      mimo_ru: Нестеров не послушал запрета — ищи повтор на высоте.
    - kod: pegu
      tekst: Пегу
      mesto: bukva
      mimo_ru: Пегу петли сначала не делал — ищи букву.
    - kod: kajzer
      tekst: Кайзер Вильгельм II
      mesto: prikaz
      mimo_ru: Кайзер командовал своими лётчиками — ищи приказ.
    vyberi_ru: Сначала выбери героя, потом его поступок.
    mimo_ru: Не тот поступок — попробуй другой.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      ochki: 20
      soobshchenie_ru: 🏆 Все трое на месте — Нестеров замкнул петлю, Пегу признал его первым, кайзер велел учиться у русских.
pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: Нестеров первым в мире замкнул на самолёте полный круг в вертикальной плоскости — 27 августа (9 сентября) 1913 года в Киеве.
  net: 'Полёт вниз головой — ещё не петля: Пегу за несколько дней до Нестерова перевернул самолёт и пролетел фигурой, похожей на букву S, но полного круга не описал. Первенство — в замкнутой петле.'
  kolonki:
  - Где
  - Что
  - Когда
  stroki:
  - - Киев
    - «мёртвая петля» Нестерова
    - '1913'
  - - Киев
    - вторая петля на 3500 м
    - '1914'
  - - Международная авиационная федерация
    - Кубок Нестерова для чемпиона мира
    - '1962'
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Для викторины нужен JavaScript. Ответы: тридцать; 3500 м; через 12; щекой; 1962.'
  ball: 8
  voprosy:
  - q: Сколько суток ареста сулили Нестерову за петлю?
    o:
    - три
    - тридцать
    - сто
    a: 1
    e: За петлю профессор-полковник сулил 30 суток ареста — в том же году Нестерову дали золотую медаль.
  - q: На какой высоте Нестеров тайком повторил петлю?
    o:
    - 500 м
    - 1000 м
    - 3500 м
    a: 2
    e: Военное ведомство приказом запретило повторять петлю — Нестеров тайком повторил её на 3500 м.
  - q: Через сколько дней после петли Нестерова Пегу решился на свою?
    o:
    - через 12
    - через 2
    - через 100
    a: 0
    e: Пегу прочёл в парижской газете статью Нестерова — и только через 12 дней решился на петлю.
  - q: Чем Нестеров ловил скорость без указателя?
    o:
    - ухом
    - щекой
    - рукой
    a: 1
    e: 'Указателя скорости не было: Нестеров ловил её щекой — с какой стороны ветер бьёт в лицо.'
  - q: С какого года чемпион мира по высшему пилотажу получает Кубок Нестерова?
    o:
    - '1913'
    - '1962'
    - '2000'
    a: 1
    e: С 1962 года чемпион мира по высшему пилотажу получает Кубок Нестерова.
