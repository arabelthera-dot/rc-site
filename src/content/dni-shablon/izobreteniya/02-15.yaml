story:
  kicker: Вверх колёсами
  h2: Как лётчик замкнул петлю
  udary:
  - summary: Расчёт на земле
    det:
    - 'Петлю сначала «начертил» на земле: вписал круг между двумя вешками в 45 метрах.'
    - 'Указателя скорости не было: Нестеров ловил её щекой — с какой стороны ветер бьёт в лицо.'
    src: 'Источник: Е. Ф. Бурче, «Пётр Николаевич Нестеров», гл. VI «Мёртвая петля» — coollib.com'
  - summary: Петля и наказание
    det:
    - За петлю профессор-полковник сулил 30 суток ареста — в том же году Нестерову дали золотую медаль.
    - Военное ведомство приказом запретило повторять петлю — Нестеров тайком повторил её на 3500 м.
    src: 'Источник: Е. Ф. Бурче, «Пётр Николаевич Нестеров», гл. VI «Мёртвая петля» — coollib.com · В. П. Захаров, «Первый военный аэродром» — militera.lib.ru'
  - summary: Соперник признал
    det:
    - 'Француз Пегу сбежал с трибуны и усадил Нестерова на своё место: «Здесь присутствует её автор»'
    - Кайзер Вильгельм II приказал своим лётчикам летать так, «как это делают русские».
    src: 'Источник: Е. Ф. Бурче, «Пётр Николаевич Нестеров», гл. VI «Мёртвая петля» — coollib.com · П. Маслюженко, «Живая „мёртвая петля“ Нестерова» — «Столетие», 28.02.2022 — stoletie.ru'
