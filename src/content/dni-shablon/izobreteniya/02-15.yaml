audioguide:
  audioSrc: audio-guide-mertvaya-petlya-ru.mp3
  durationLabel: около полутора минут
  lead: Полторы минуты о том, как Нестеров замкнул в небе первую петлю.
  stops:
  - t: 0
    mark: 0:00
    title: Расчёт на земле
  - t: 30
    mark: 0:30
    title: Петля и арест
  - t: 60
    mark: '1:00'
    title: Соперник признал
  transcript:
  - 'Петлю сначала «начертил» на земле: вписал круг между двумя вешками в 45 метрах. Указателя скорости не было: Нестеров ловил её щекой — с какой стороны ветер бьёт в лицо.'
  - За петлю профессор-полковник сулил 30 суток ареста — в том же году Нестерову дали золотую медаль. Военное ведомство приказом запретило повторять петлю — Нестеров тайком повторил её на 3500 м.
  - 'Француз Пегу сбежал с трибуны и усадил Нестерова на своё место: «Здесь присутствует её автор». Кайзер Вильгельм II приказал своим лётчикам летать так, «как это делают русские».'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
