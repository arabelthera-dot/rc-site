story:
  kicker: История пуска
  h2: Пар без угля
  udary:
    - summary: "Обычная электростанция жжёт уголь, чтобы вскипятить воду. В Обнинске воду в пар превращало тепло деления урана — остальное как у всех: пар, турбина, провода."
      det:
        - "Реактор назвали АМ — «Атом мирный». Он уран-графитовый, канальный: уран стоит в каналах графитовой кладки, через каналы бежит вода и уносит тепло. Мощность — 5 мегаватт."
        - "Главное — не сам реактор, а то, куда пошла энергия: в обычную энергосистему, к обычным потребителям."
      src: "Источник: Российское историческое общество, «70 лет назад, 27 июня 1954 года, состоялся пуск первой в мире атомной электростанции»; ТАСС, спецпроект «Обнинская АЭС»."
    - summary: "9 мая 1954 года, в 19:40, реактор ожил: физический пуск."
      det:
        - "Физический пуск — это когда в реакторе впервые пошла цепная реакция. Тока ещё нет: сначала надо убедиться, что атом слушается."
      src: "Источник: ФЭИ им. Лейпунского, «Первая в мире АЭС в Обнинске»; «Страна Росатом», «Судьба АМ-1, или С лёгким паром»."
    - summary: "26 июня 1954 года, 17:45: открыли задвижку — пар пошёл на турбину, и атомный ток впервые в мире потёк в общую сеть."
      kadr:
        src: /muzei/izobreteniya/img/01-21-lopatka-turbiny.jpg
        alt: "Металлическая лопатка турбины в прозрачном футляре; на крышке золотыми рукописными буквами: «Лопатка турбины первой в мире АЭС»"
        data_source: "https://goskatalog.ru/portal/#/collections?id=288886"
        license: "цитирование в информационных целях (ст. 1274 ГК РФ) · Музей истории города Обнинска · Госкаталог, рег. № 2002982"
        podpis: "Лопатка турбины Первой в мире АЭС. На такие лопатки 26 июня 1954 года пошёл пар от реактора — и атомный ток потёк в сеть."
        credit: "Предмет, 1960-е. Хранится: Музей истории города Обнинска, инв. МТ-33. Госкаталог музейного фонда РФ, рег. № 2002982."
        width: 800
        height: 479
      det:
        - "В летописи станции так и записано: «в вечернюю смену, в 17 час. 45 мин., была открыта задвижка подачи пара на турбогенератор… Первая в мире атомная электростанция встала под промышленную нагрузку»."
        - "Ток пошёл вечером 26-го, а официальная дата пуска — 27 июня: наутро о станции сообщили газеты."
      src: "Источник: ФЭИ им. Лейпунского, «Первая в мире АЭС в Обнинске»; РИО, «70 лет назад, 27 июня 1954 года…»; atomic-energy.ru, «Первая в мире АЭС (Обнинская)»."
    - summary: От постановления о стройке до тока в сети — около трёх лет.
      det:
        - 16 мая 1950 года Совет министров поручил разработать реактор АМ. 12 июня 1951 года вышло постановление строить опытную электростанцию прямо на территории Лаборатории «В». В июне 1954-го она уже давала ток.
        - "«Страна Росатом»: «С момента создания техпроекта до энергопуска прошло всего около трех лет»."
      src: 'Источник: ФЭИ им. Лейпунского, «Первая в мире АЭС в Обнинске» и «Лаборатория "В"»; «Страна Росатом», «Судьба АМ-1, или С лёгким паром».'
    - summary: Строили в секретной Лаборатории «В» под Калугой — нынешнем ФЭИ им. Лейпунского. Даже в сообщении 1954 года город не назвали.
      det:
        - Постановление о создании Лаборатории «В» вышло 19 декабря 1945 года. Место скрывали — но уже в 1955-м, когда в Обнинск поехали первые делегации, лаборатория, по словам Блохинцева, «стала широко известна во всем мире».
      src: 'Источник: ФЭИ им. Лейпунского, «Лаборатория "В"» и «Дмитрий Иванович Блохинцев».'
    - summary: 29 апреля 2002 года реактор заглушили навсегда. С 2009 года в здании — музей атомной энергетики.
      det:
        - Почти 48 лет работы. Музей атомной энергетики создан в 2009 году по распоряжению Президента России, а само здание — объект культурного наследия регионального значения.
      src: "Источник: «Научная Россия», «29 апреля 2002 года навсегда остановлен реактор первой в мире Обнинской АЭС»; ТАСС, спецпроект «Обнинская АЭС»; atomic-energy.ru."
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о первой АЭС
  h2: Факты дня
  udary:
  - summary: '<b>1. Мирный реактор АМ сначала задумывали для подводной лодки: «АМ» значило «атом морской».</b>'
    det:
    - В Обнинске собирались строить реакторы для флота. Первый вариант оказался слишком большим для подлодки и не прошёл по массе и габаритам. Тогда из него сделали электростанцию, и буквы АМ стали читать как «атом мирный».
    src: 'Источник: М. Беляева. «Обнинск. Порт пяти морей», газета «Новая среда» (ngregion.ru), 17.03.2026 — <a href="https://ngregion.ru/istoriya/obninsk-port-pyati-morej-2" rel="noopener" target="_blank">ngregion.ru</a>; то же: «Первая в мире Обнинская АЭС: запуск, год открытия, авторы», Lenta.ru, 26.06.2024 — <a href="https://lenta.ru/articles/2024/06/26/obninsk/" rel="noopener" target="_blank">lenta.ru</a>.'
    otryvok: «изначально здесь собирались не мирную атомную станцию строить, а реакторы для флота. Проект так и назывался — АМ (атом морской). Но первая наработка оказалась слишком большой для подлодки и не прошла по „массо-габаритным“ показателям… А аббревиатуру стали расшифровывать по-другому — атом мирный».
    stranica: М. Беляева. «Обнинск. Порт пяти морей», газета «Новая среда» (ngregion.ru), 17.03.2026
    href: https://ngregion.ru/istoriya/obninsk-port-pyati-morej-2
    pometka: два источника
    utverzhdeno: Р331
  - summary: <b>2. Первую в мире атомную станцию рассчитали на счётах и арифмометрах.</b>
    det:
    - 'Компьютеров не было: конструкцию реактора считали на конторских счётах и механических арифмометрах. Нынешние атомщики на экскурсии удивляются: «Как можно было на этом работать?» А станция проработала почти полвека.'
    src: 'Источник: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020 — <a href="https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/" rel="noopener" target="_blank">strana-rosatom.ru</a>.'
    otryvok: «Более того, конструкцию реактора первой в мире АЭС рассчитывали на счетах и арифмометрах — настольных механических вычислительных машинах».
    stranica: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020
    href: https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/
    pometka: документ
    utverzhdeno: Р331
  - summary: <b>3. Обнинская АЭС за 48 лет ни разу не облучила ни одного человека.</b>
    kadr:
      src: /muzei/izobreteniya/img/01-21-tetrad-kurchatova-1954.jpg
      alt: "Пожелтевший лист тетради, исписанный от руки чернилами. Подчёркнутый заголовок о трубках при эксплуатации аппарата «АМ», пункт 1 — о сигнале разрыва трубок в парогенераторе, слева нарисована схема с дифманометром"
      data_source: "https://goskatalog.ru/portal/#/collections?id=8239174"
      license: "цитирование в информационных целях (ст. 1274 ГК РФ) · Государственный центральный музей современной истории России · Госкаталог, рег. № 8129772"
      podpis: "Тетрадь Игоря Курчатова с записями во время пуска станции, июнь 1954 года. Первая же запись — о сигнале разрыва трубок в парогенераторе: аварийную защиту отлаживали прямо на ходу."
      credit: "Автор записей: И. В. Курчатов, июнь 1954. Хранится: Государственный центральный музей современной истории России, ГИК 34497/798. Госкаталог музейного фонда РФ, рег. № 8129772."
      width: 500
      height: 678
      klass: portret
    det:
    - В первые полгода реактор тёк, аварийные сигналы звучали по нескольку раз в день, и сотрудники прозвали их «нежданчиками». Но за все годы работы не облучился ни один сотрудник, и окружающая среда ни разу не была загрязнена.
    src: 'Источник: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020 — <a href="https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/" rel="noopener" target="_blank">strana-rosatom.ru</a>.'
    otryvok: «Аварийные сигналы звучали по несколько раз в день, сотрудники называли их „нежданчиками“… И при этом за почти 48 лет эксплуатации Обнинской АЭС не было ни одного случая облучения персонала. Окружающая среда ни разу не подвергалась радиационному загрязнению».
    stranica: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020
    href: https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/
    pometka: документ
    utverzhdeno: Р331
  - summary: <b>4. Первая в мире АЭС появилась раньше, чем город, в котором она стоит.</b>
    det:
    - 'В газетах 1954 года место пуска не называли: станция стояла на секретной территории. Город Обнинск с этим названием появился только через два года. Сегодня это первый наукоград России.'
    src: 'Источник: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020 — <a href="https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/" rel="noopener" target="_blank">strana-rosatom.ru</a>; про наукоград: М. Беляева. «Обнинск. Порт пяти морей», газета «Новая среда» (ngregion.ru), 17.03.2026 — <a href="https://ngregion.ru/istoriya/obninsk-port-pyati-morej-2" rel="noopener" target="_blank">ngregion.ru</a>.'
    otryvok: «Название населенного пункта, где была построена АЭС, в газетах не сообщалось. Лишь через два года поселок рядом со станцией получил статус города и название Обнинск». — «небольшой поселок при секретном институте стал первым наукоградом России».
    stranica: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020
    href: https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/
    pometka: два источника
    utverzhdeno: Р331
  - summary: <b>5. Станцию хотели закрыть после первых поломок, а замминистра Славский не дал.</b>
    det:
    - Учёные предлагали остановить АЭС, когда начались неполадки. Ефим Славский ответил, что станцию строили не для галочки и проблемы надо решать. АЭС починили и вернули в строй, после этого она работала ещё почти полвека.
    src: 'Источник: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020 — <a href="https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/" rel="noopener" target="_blank">strana-rosatom.ru</a>.'
    otryvok: '«Из-за возникающих в первое время неполадок некоторые ученые предложили остановить АЭС. Замминистра среднего машиностроения Ефим Славский отрезал: „Первая АЭС строилась не для галочки, чтобы громко объявить о ней и закрыть. Если возникли проблемы, их надо решать“».'
    stranica: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020
    href: https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/
    pometka: документ
    utverzhdeno: Р331
  - summary: '<b>6. Атомщики говорили шифром: уран — «олово», нейтрон — «метеорит», реактор — «кристаллизатор».</b>'
    det:
    - Пока строили реакторы и станцию, учёные пользовались словами-масками, чтобы при утечке никто ничего не понял. Графит называли «керамикой», облучение — «окуриванием», топливный элемент — «навеской».
    src: 'Источник: «Первая в мире Обнинская АЭС: запуск, год открытия, авторы», Lenta.ru, раздел «Наука и техника», 26.06.2024 — <a href="https://lenta.ru/articles/2024/06/26/obninsk/" rel="noopener" target="_blank">lenta.ru</a>.'
    otryvok: «Ученые даже выработали конспиративный глоссарий, чтобы в случае утечки информации никто ничего не понял… „керамика“ — графит, „кристаллизатор“ — реактор, „марс“ или „олово“ — уран, „метеорит“ — нейтрон, „навеска“ — тепловыделяющий элемент… „окуривание“ — облучение».
    stranica: '«Первая в мире Обнинская АЭС: запуск, год открытия, авторы», Lenta.ru, раздел «Наука и техника», 26.06.2024'
    href: https://lenta.ru/articles/2024/06/26/obninsk/
    pometka: документ
    utverzhdeno: Р331
  - summary: '<b>7. На Обнинской АЭС учились давать ток в космосе: отсюда вырос первый в мире реактор «Топаз».</b>'
    det:
    - 'С 1961 года на станции проводили опыты с термоэмиссионным преобразователем: тепло реактора сразу превращается в электричество, без турбины. В 1970 году заработал «Топаз», первый в мире термоэмиссионный реактор-преобразователь, будущий источник энергии для спутников.'
    src: 'Источник: И. Дорохова. «70 лет с мирным атомом: какие эксперименты проводили на Обнинской АЭС», «Страна Росатом», 16.07.2024 — <a href="https://strana-rosatom.ru/2024/07/16/70-let-s-mirnym-atomom-kakie-eksperimen/" rel="noopener" target="_blank">strana-rosatom.ru</a>.'
    otryvok: «1970 год Запуск первого в мире термоэмиссионного реактора-преобразователя „Топаз“. Эксперименты с этим типом перевода тепловой энергии в электрическую начались на Обнинской АЭС в 1961 году».
    stranica: 'И. Дорохова. «70 лет с мирным атомом: какие эксперименты проводили на Обнинской АЭС», «Страна Росатом», 16.07.2024'
    href: https://strana-rosatom.ru/2024/07/16/70-let-s-mirnym-atomom-kakie-eksperimen/
    pometka: документ
    utverzhdeno: Р331
  - summary: <b>8. Под скромным трёхэтажным зданием первой АЭС — подземелье глубиной с шестиэтажный дом.</b>
    kadr:
      src: /muzei/izobreteniya/img/01-21-maket-razrez.jpg
      alt: "Белый макет здания станции со снятой передней стеной: видны этажи с комнатами, реакторный зал под двускатной крышей, шахта реактора и подземные помещения с красными трубками первого контура; за макетом — табличка-легенда"
      data_source: "https://goskatalog.ru/portal/#/collections?id=4358438"
      license: "цитирование в информационных целях (ст. 1274 ГК РФ) · Музей истории города Обнинска · Госкаталог, рег. № 4402089"
      podpis: "Макет Первой в мире АЭС в разрезе. Видно, что основная часть станции — под землёй: шахта реактора, насосы и трубопроводы первого контура."
      credit: "Макет, автор не указан. Хранится: Музей истории города Обнинска, инв. НК-1. Госкаталог музейного фонда РФ, рег. № 4402089."
      width: 800
      height: 532
    det:
    - Снаружи станция похожа на обычную контору с колоннами, и это была хорошая маскировка. Под землёй на глубину до 17,5 метра уходят помещения с насосами и приборами. Реактор стоит в шахте за бетонными стенами толщиной 3 метра.
    src: 'Источник: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020 — <a href="https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/" rel="noopener" target="_blank">strana-rosatom.ru</a>.'
    otryvok: «Снаружи АЭС — трехэтажное здание, а под землей располагаются помещения на глубине до 17,5 м, как высота шестиэтажки». — «Реактор находится в шахте, окруженной защитными стенами из бетона толщиной 3 м».
    stranica: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС» (рассказывает И. Мохирева, руководитель музейной группы комплекса «Первая в мире АЭС»), «Страна Росатом», 19.08.2020
    href: https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/
    pometka: документ
    utverzhdeno: Р331
  - summary: '<b>9. Первый атомный ток Курчатов встретил банным поздравлением: «С лёгким паром!»</b>'
    det:
    - '26 июня 1954 года, в 17:45, Дмитрий Блохинцев записал в журнал: «Пар подан на турбину». Академики Курчатов и Александров поздравили смену: «С лёгким паром!» Пар был обычный, белый, только сделан без угля, теплом атома.'
    src: 'Источник: «Судьба АМ-1, или С лёгким паром» (А. Филиппова), «Страна Росатом», 22.05.2019 — <a href="https://strana-rosatom.ru/2019/05/22/sudba-am-1-ili-s-legkim-parom/" rel="noopener" target="_blank">strana-rosatom.ru</a>.'
    otryvok: '«Дмитрий Блохинцев записал в оперативном журнале: „17 часов 45 минут. Пар подан на турбину“. Академики Курчатов и Александров поздравили всех: „С легким паром!“»'
    stranica: «Судьба АМ-1, или С лёгким паром» (А. Филиппова), «Страна Росатом», 22.05.2019
    href: https://strana-rosatom.ru/2019/05/22/sudba-am-1-ili-s-legkim-parom/
    pometka: документ
    utverzhdeno: Р331
  - summary: '<b>10. Англичане зовут первой в мире свою АЭС 1956 года: видно, часы в Гринвиче отстают на два года.</b>'
    det:
    - Обнинская АЭС дала ток в сеть 26 июня 1954 года. Английский Колдер-Холл ввели в действие 17 октября 1956 года. По счёту это вторая атомная электростанция в мире.
    src: 'Источник: «Удаление топлива с АЭС „Колдер-Холл“», блог ФБУ «НТЦ ЯРБ» Ростехнадзора, 24.09.2019 — <a href="https://blog.secnrs.ru/2019/09/sellafield-completes-defueling-of-calder-hall/" rel="noopener" target="_blank">blog.secnrs.ru</a>; «Атомные электростанции в мире», РИА Новости, 03.03.2020 — <a href="https://ria.ru/20190627/1555884350.html" rel="noopener" target="_blank">ria.ru</a>.'
    otryvok: «АЭС „Колдер-Холл“ была введена в действие 17 октября 1956 г.» (НТЦ ЯРБ). — «Вторая в мире АЭС вступила в строй в 1956 году в Колдер-Холле в Великобритании» (РИА Новости).
    stranica: «Удаление топлива с АЭС „Колдер-Холл“», блог ФБУ «НТЦ ЯРБ» Ростехнадзора, 24.09.2019
    href: https://blog.secnrs.ru/2019/09/sellafield-completes-defueling-of-calder-hall/
    pometka: документ
    utverzhdeno: Р332
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Овация, псевдоним и подлодки
  udary:
  - summary: <b>Один и тот же инженер пускал первую в мире АЭС в 1954-м и сам заглушил её в 2002-м.</b>
    kadr:
      src: /muzei/izobreteniya/img/01-21-krasin-kochetkov-pult.jpg
      alt: "Двое мужчин в белых халатах разговаривают у пульта: слева пожилой с бородкой, справа молодой; за ними круглые шкалы самописцев и мнемосхема"
      data_source: "https://goskatalog.ru/portal/#/collections?id=7832131"
      license: "цитирование в информационных целях (ст. 1274 ГК РФ) · Музей истории города Обнинска · Госкаталог, рег. № 7718163"
      podpis: "Лев Кочетков (справа) и директор Лаборатории «В» Андрей Красин на пульте Первой АЭС, вторая половина 1950-х. Кочетков пускал станцию в 1954 году и сам заглушил её реактор в 2002-м."
      credit: "Фото: автор не указан, вторая половина 1950-х. Хранится: Музей истории города Обнинска, инв. Ф-7704. Госкаталог музейного фонда РФ, рег. № 7718163."
      width: 800
      height: 524
    det:
    - 'Лев Кочетков приехал в секретную Лабораторию «В» выпускником в 1952 году и считал реактор будущей станции. Что это за реактор, ему сначала даже не сказали. Родителям он ничего не объяснял и обижал их молчанием, а перед пуском написал домой: «Почитайте — тогда узнаете, где я работаю».'
    - Он участвовал в пуске станции в 1954 году, а через 48 лет, 29 апреля 2002 года, именно он нажал кнопку и навсегда остановил реактор.
    src: 'Источник: «Он запускал и останавливал атомный реактор. И не дожил полгода до юбилея первой в мире АЭС», газета «Неделя Обнинска» (pressaobninsk.ru), 2024 — <a href="https://pressaobninsk.ru/nedobfull/20252/" rel="noopener">pressaobninsk.ru/nedobfull/20252</a>; то же: «Судьба АМ-1, или С лёгким паром», «Страна Росатом», 22.05.2019 — <a href="https://strana-rosatom.ru/2019/05/22/sudba-am-1-ili-s-legkim-parom/" rel="noopener">strana-rosatom.ru/2019/05/22/sudba-am-1-ili-s-legkim-parom</a>.'
    otryvok: «Лев Алексеевич Кочетков - ученый, принимавший участие в пуске первой в мире АЭС» — «По радио скоро скажут, а в газетах напечатают о пуске одной электростанции. Почитайте - тогда узнаете, где я работаю» — «Он так же стал тем человеком, который 29 апреля 2002 года остановил реактор первой в мире атомной электростанции».
    stranica: «Он запускал и останавливал атомный реактор. И не дожил полгода до юбилея первой в мире АЭС», газета «Неделя Обнинска» (pressaobninsk.ru), 2024
    href: https://pressaobninsk.ru/nedobfull/20252/
    pometka: два источника
  - summary: <b>Аплодировать на конференции в Женеве запрещали, но доклад Блохинцева о станции встретили овацией.</b>
    kadr:
      src: /muzei/izobreteniya/img/01-21-doklad-zheneva-1955.jpg
      alt: "Титульный лист книги: вверху «Доклады, представленные СССР на Международную конференцию по мирному использованию атомной энергии», ниже авторы Д. И. Блохинцев и Н. А. Николаев, крупно название, внизу «Москва — 1955»"
      data_source: "https://goskatalog.ru/portal/#/collections?id=8528308"
      license: "цитирование в информационных целях (ст. 1274 ГК РФ) · Музей истории города Обнинска · Госкаталог, рег. № 8420510"
      podpis: "Тот самый доклад для Женевской конференции 1955 года: «Первая атомная электростанция СССР и пути развития атомной энергетики». После него зал нарушил запрет на аплодисменты."
      credit: "Издание: Д. И. Блохинцев, Н. А. Николаев, Москва, 1955. Хранится: Музей истории города Обнинска, инв. КН-83. Госкаталог музейного фонда РФ, рег. № 8420510."
      width: 539
      height: 800
      klass: portret
    det:
    - В 1955 году в Женеве собрались учёные со всего мира говорить о мирном атоме. Главным докладом стал рассказ Дмитрия Блохинцева, научного руководителя Обнинской станции.
    - Правила конференции запрещали хлопать. Но когда Блохинцев закончил рассказ об атомной электростанции, тысячный зал устроил ему бурную овацию.
    src: 'Источник: ГНЦ РФ — ФЭИ им. А. И. Лейпунского, «Дмитрий Иванович Блохинцев» — <a href="https://www.ippe.ru/founders/blokhintsev" rel="noopener">www.ippe.ru/founders/blokhintsev</a>.'
    otryvok: «Доклад произвел огромное впечатление на тысячную аудиторию. Несмотря на запрещение правилами конференции аплодисментов, окончание доклада об АЭС было встречено бурной овацией»
    stranica: ГНЦ РФ — ФЭИ им. А. И. Лейпунского, «Дмитрий Иванович Блохинцев»
    href: https://www.ippe.ru/founders/blokhintsev
    pometka: документ
  - summary: <b>Топливный стержень для реактора делали несколько институтов, а сработал только обнинский.</b>
    kadr:
      src: /muzei/izobreteniya/img/01-21-moskovskaya-pravda-1957.jpg
      alt: "Газетная полоса «Московская правда» за 25 апреля 1957 года; в центре колонка «Лауреаты Ленинских премий» с пятью портретами, нижний — мужчина в очках, В. А. Малых"
      data_source: "https://goskatalog.ru/portal/#/collections?id=16910298"
      license: "цитирование в информационных целях (ст. 1274 ГК РФ) · Музей истории города Обнинска · Госкаталог, рег. № 16786787"
      podpis: "«Московская правда», 25 апреля 1957 года: Владимир Малых — среди лауреатов Ленинской премии за создание первой АЭС. Его отдел в Лаборатории «В» сделал твэл, на котором заработал реактор."
      credit: "Газета «Московская правда», 25.04.1957. Хранится: Музей истории города Обнинска, инв. Д-10809. Госкаталог музейного фонда РФ, рег. № 16786787."
      width: 565
      height: 800
      klass: portret
    det:
    - 'Самое трудное в реакторе — стержень с ураном внутри: он должен годами греться и не разрушаться. Над ним бились сразу несколько организаций.'
    - Выдержал только вариант Владимира Малых и его отдела из Лаборатории «В». В конце 1952 года стержень был готов, и именно на нём заработала станция.
    src: 'Источник: ГНЦ РФ — ФЭИ им. А. И. Лейпунского, «Первая в мире АЭС» — <a href="https://www.ippe.ru/history/1aes" rel="noopener">www.ippe.ru/history/1aes</a>.'
    otryvok: «Разработкой твэла занималось несколько смежных организаций, но только вариант, предложенный В.А. Малых , показал высокую работоспособность. Поиск конструкции был завершён в конце 1952 г.»
    stranica: ГНЦ РФ — ФЭИ им. А. И. Лейпунского, «Первая в мире АЭС»
    href: https://www.ippe.ru/history/1aes
    pometka: документ
  - summary: '<b>Статью о пуске Блохинцев просил подписать чужим именем: по фамилии вычислят, где станция.</b>'
    det:
    - Летом 1954 года научный руководитель станции Дмитрий Блохинцев написал для «Известий» первую статью о ней. В сообщении ТАСС о пуске место не называли — секрет.
    - 'Блохинцев попросил министра решить вопрос о псевдониме: его фамилию знали, и по ней могли догадаться, где стоит станция. Тайна продержалась недолго: уже в 1955 году на станцию стали приезжать иностранные делегации, и об Обнинске узнал весь мир.'
    src: 'Источник: ГНЦ РФ — ФЭИ им. А. И. Лейпунского, «Дмитрий Иванович Блохинцев» — <a href="https://www.ippe.ru/founders/blokhintsev" rel="noopener">www.ippe.ru/founders/blokhintsev</a>.'
    otryvok: «в июле 1954 г. Блохинцев просил министра В.А. Малышева перед публикацией этой первой статьи «решить вопрос относительно псевдонима, так как обозначение моей [ т. е. Блохинцева ] фамилии может способствовать локализации объекта, не обозначенной в сообщении правительства»» — «уже в 1955 г., когда на АЭС стали принимать иностранные делегации, Лаборатория «В» стала широко известна во всем мире»
    stranica: ГНЦ РФ — ФЭИ им. А. И. Лейпунского, «Дмитрий Иванович Блохинцев»
    href: https://www.ippe.ru/founders/blokhintsev
    pometka: документ
  - summary: <b>На маленькой станции в 5 мегаватт учились экипажи атомных подлодок и ледокола «Ленин».</b>
    det:
    - 'Обнинская АЭС не только давала ток. Сюда приезжали моряки: прежде чем выйти в море на атомной подлодке или на атомном ледоколе «Ленин», экипажи учились управлять реактором здесь.'
    - Позже на станции стажировались и те, кто потом работал на других атомных станциях — у нас и за рубежом.
    src: 'Источник: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС», «Страна Росатом», 19.08.2020 — <a href="https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/" rel="noopener">strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol</a>; то же: ГНЦ РФ — ФЭИ, «Первая в мире АЭС» — <a href="https://www.ippe.ru/history/1aes" rel="noopener">www.ippe.ru/history/1aes</a>.'
    otryvok: «Но станция не только выдавала электроэнергию — на ней стажировались экипажи ледокола «Ленин» и атомных подлодок»
    stranica: «„Аварийные сигналы звучали по несколько раз в день“. Экскурсия на Обнинскую АЭС», «Страна Росатом», 19.08.2020
    href: https://strana-rosatom.ru/2020/08/19/avarijnye-signaly-zvuchali-po-neskol/
    pometka: два источника
