return:
  q: Почему станцию не закрыли, когда в первые месяцы аварийные сигналы звучали по нескольку раз в день?
  a: Замминистра Ефим Славский сказал, что станцию строили не для галочки и неполадки надо устранять. АЭС починили — и она проработала почти полвека, не облучив ни одного человека.
  src: Экскурсия на Обнинскую АЭС, рассказ И. Мохиревой, «Страна Росатом»
audioguide:
  audioSrc: audio-guide-obninsk-2-ru.mp3
  durationLabel: 4 минуты 11 секунд
  lead: "Голос ведёт по залу Первой в мире атомной электростанции: от пульта управления на обложке через пар без угля к игре «Дай атомный ток в сеть» и фактам дня. Семь остановок, на каждой — что искать на странице."
  stops:
    - t: 0
      mark: 0:00
      title: Пульт на обложке
    - t: 55
      mark: 0:55
      title: Пар без угля
    - t: 100
      mark: 1:40
      title: Задвижка открыта
    - t: 144
      mark: 2:24
      title: Игра «Дай атомный ток в сеть»
    - t: 177
      mark: 2:57
      title: Где граница
    - t: 198
      mark: 3:18
      title: Факты дня
    - t: 233
      mark: 3:53
      title: Итог зала
  transcript:
    - "<p>«Здравствуйте. Мы в зале Первой в мире атомной электростанции в Обнинске. Посмотрите на обложку: это пульт управления станцией. Два оператора сидят за пультом, за ними стоят сотрудники в белых халатах и шапочках, а на стене — мнемосхема реактора и шкалы приборов. Снимок сделан в тысяча девятьсот шестьдесят шестом году. Под заголовком сказано: двадцать первого января тысяча девятьсот третьего года родился Игорь Курчатов, руководитель советского атомного проекта. А главная мысль зала такая: в Обнинске атом впервые дал не взрыв, а ток в розетку, и станция проработала почти полвека. Под обложкой полоса из четырёх чисел. Пять мегаватт — мощность реактора АМ. Двадцать шестое июня тысяча девятьсот пятьдесят четвёртого года — ток пошёл в общую сеть. Сорок восемь лет работы вместо тридцати по плану. И ни одного облучённого человека за все эти годы. Пройдём по залу по порядку.»</p>"
    - "<p>«Найдите ниже раздел «История пуска» с заголовком «Пар без угля». Обычная электростанция жжёт уголь, чтобы вскипятить воду. В Обнинске воду в пар превращало тепло деления урана, а дальше всё как у всех: пар, турбина, провода. Реактор назвали АМ — «Атом мирный». Он уран-графитовый, канальный: уран стоит в каналах графитовой кладки, через каналы бежит вода и уносит тепло. Атом, который раньше знали по бомбе, здесь крутил турбину. Девятого мая тысяча девятьсот пятьдесят четвёртого года, в девятнадцать часов сорок минут, реактор ожил. Это физический пуск: в реакторе впервые пошла цепная реакция. Тока ещё нет. Сначала надо убедиться, что атом слушается.»</p>"
    - "<p>«Двадцать шестого июня тысяча девятьсот пятьдесят четвёртого года, в семнадцать часов сорок пять минут, открыли задвижку. Пар пошёл на турбину, и атомный ток впервые в мире потёк в общую сеть. В летописи станции записано, что первая в мире атомная электростанция встала под промышленную нагрузку. Почему же официальная дата пуска — двадцать седьмое июня? Оба числа верны: ток пошёл вечером, а наутро о станции сообщили газеты. От постановления о стройке до тока в сети прошло около трёх лет. Строили в секретной Лаборатории «В» под Калугой, и даже в сообщении того года город не назвали. Двадцать девятого апреля две тысячи второго года реактор заглушили навсегда. С две тысячи девятого года в здании — музей атомной энергетики.»</p>"
    - "<p>«Теперь спуститесь к игре «Дай атомный ток в сеть». Вы — дежурный инженер на пульте. Кнопка «Поднять стержни» разгоняет реактор, «Опустить» — успокаивает. Стрелка мощности отзывается не сразу, поэтому не торопитесь. Держите её в зелёной полосе: выше красной черты сработает аварийная защита. Время от времени завоет сигнал — это «нежданчик», так сотрудники станции звали внезапные неполадки первых месяцев. Наберётся пар — откройте задвижку и смотрите, как в посёлке зажигаются окна.»</p>"
    - "<p>«Загляните в раздел «Что именно сделали в Обнинске». Граница первенства точная: Обнинская станция — первая в мире атомная электростанция, отдавшая ток в общую энергосистему, людям. В таблице путь от создания Лаборатории «В» в декабре тысяча девятьсот сорок пятого года до остановки реактора двадцать девятого апреля две тысячи второго года.»</p>"
    - "<p>«Вернитесь к фактам дня. Их десять. Станцию рассчитали на счётах и арифмометрах. Атомщики говорили шифром: уран был «оловом», нейтрон — «метеоритом». А когда после первых поломок станцию предлагали закрыть, замминистра Ефим Славский ответил: строили не для галочки, чините. А когда пар впервые пошёл на турбину, Курчатов поздравил пусковую смену: «С лёгким паром!» А англичане запустили свою атомную станцию Колдер-Холл в тысяча девятьсот пятьдесят шестом году — на два года позже Обнинска — и до сих пор называют её первой в мире: видно, часы в Гринвиче отстают на два года.»</p>"
    - "<p>«Вот и весь зал. Маленькая станция на пять мегаватт стала большой школой: здесь учились давать атомный ток людям, отсюда вырос первый в мире космический реактор-преобразователь «Топаз». И за сорок восемь лет она не облучила ни одного человека. Спасибо, что прошли зал до конца.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
