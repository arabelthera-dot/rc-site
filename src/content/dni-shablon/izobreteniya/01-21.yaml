      <section class="block" id="mirovoy-kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2 class="h2-tight">Что в это время делал мир</h2>
          <p class="lead-p iz-u6">Тысяча девятьсот пятьдесят четвёртый. В январе в США спускают на воду первую атомную подлодку «Наутилус». На атомном ходу она выйдет только 17 января 1955 года с радиограммой «Я — "Наутилус"! Иду на атомной энергии!».</p>
          <p class="lead-p iz-u6">2 марта пленум ЦК КПСС решает поднимать целину: страна берётся за хлеб. А в Обнинске в эти месяцы достраивают реактор, который должен дать не взрыв, а ток.</p>
          <p class="lead-p iz-u6">Отсюда вывод, ради которого этот день стоит в календаре: <b class="iz-u7">у американцев первый атом служил флоту, у нас — розетке.</b> Мирный атом начался в Обнинске.</p>
          <p class="src-note">Источник: РИА Новости, «Схватка атомных акул»; «Страна Росатом», «Сражение "Кита" и "Наутилуса"»; РИО, Электронная библиотека исторических документов, постановление пленума ЦК КПСС 2 марта 1954 года.</p>
        </div>
      </section>
