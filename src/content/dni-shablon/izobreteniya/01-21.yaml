  - posle: story
    html: |-
      <section class="block" id="pyat-faktov">
        <div class="wrap">
          <div class="kicker">Пять фактов</div>
          <h2>Атом впервые дал ток людям — у нас</h2>
          <ol class="udary">
            <li><details><summary><span>Американский атомный ток мог зажечь тысячу лампочек в лаборатории — Обнинский зажёг 25 тысяч, и в общей сети.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Американский EBR-I (1951) давал 200 кВт — это 1000 лампочек по 200 Вт; в день пуска зажгли четыре, в сеть ток не шёл.</p>
                <p>Обнинская АЭС (1954) — 5000 кВт, 25 000 таких лампочек, в 25 раз больше, и первой в мире в общую сеть.</p>
                <p class="src-note">Источник: «Страна Росатом», «Атомный турнир сверхдержав», 08.12.2021 — <a href="https://strana-rosatom.ru/2021/12/08/atomnyj-turnir-sverhderzhav-o-njuansah/" rel="noopener">strana-rosatom.ru</a>.</p>
              </div></details></li>
            <li><details><summary><span>Английская пресса назвала пуск Обнинской АЭС событием важнее бомбы на Хиросиму.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>О станции не писали ни строчки до сообщения ТАСС, новость стала полной неожиданностью. Корреспондент Франс Пресс из Лондона сообщал, что СССР опередил Англию и Америку.</p>
                <p>В английской печати событие назвали имеющим «неизмеримо большее значение, чем сброс первой атомной бомбы на Хиросиму».</p>
                <p class="src-note">Источник: ТАСС, спецпроект «1954» — <a href="https://spec.tass.ru/time-x-power/1954/" rel="noopener">spec.tass.ru</a>.</p>
              </div></details></li>
            <li><details><summary><span>Англия запустила свою АЭС через два года после Обнинска, Америка — через три.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Вторая в мире АЭС — Колдер-Холл (Великобритания, 1956, 46 МВт), третья — Шиппингпорт (США, 1957, 60 МВт).</p>
                <p class="src-note">Источник: РИА Новости, «Атомные электростанции в мире», 27.06.2019 — <a href="https://ria.ru/20190627/1555884350.html" rel="noopener">ria.ru</a>.</p>
              </div></details></li>
            <li><details><summary><span>Перед первым током аварийная защита глушила реактор 18 раз — и всё же 26 июня он дал ток.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>С 12 по 23 июня 1954 года реактор выводили на мощность, и «за это время он останавливался аварийной защитой 18 раз»: сбоили топливные сборки, насосы, систему охлаждения переделывали на ходу. Опыт пуска реакторов был только у одного сотрудника.</p>
                <p>26 июня в 17:45 пар пошёл на турбину — его встретили банным «С лёгким паром!».</p>
                <p class="src-note">Источник: «Страна Росатом», «„Сперва всё казалось очень просто“: документ под грифом „совершенно секретно“», 21.05.2024 — <a href="https://strana-rosatom.ru/2024/05/21/sperva-vse-kazalos-ochen-prosto-pu/" rel="noopener">strana-rosatom.ru</a>.</p>
              </div></details></li>
            <li><details><summary><span>В Женеве доклад об Обнинске встретили овацией — хотя аплодисменты правила конференции запрещали.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Август 1955 года, первая Международная конференция по мирному атому: «несмотря на запрещение правилами конференции аплодисментов, окончание доклада об АЭС было встречено бурной овацией».</p>
                <p>Так вспоминал научный руководитель станции Дмитрий Иванович Блохинцев.</p>
                <p class="src-note">Источник: ГНЦ РФ — ФЭИ им. Лейпунского, «Дмитрий Иванович Блохинцев» — <a href="https://www.ippe.ru/founders/blokhintsev" rel="noopener">ippe.ru</a>.</p>
              </div></details></li>
          </ol>
        </div>
      </section>
  - posle: story
    html: |-
      <section class="block" id="more">
        <div class="wrap">
          <div class="kicker">Ещё о станции</div>
          <h2>Маленькая станция, большая школа</h2>
          <ol class="udary">
            <li><details><summary><span>Пуск встречали слезами: из клапана с силой вырвалась струя самого обычного белого пара.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Так вспоминал Блохинцев (в пересказе РИО): пар был обычный, белый, но его появление вызвало объятия, поздравления, даже слёзы радости.</p>
                <p class="src-note">Источник: РИО, «70 лет назад, 27 июня 1954 года, состоялся пуск первой в мире атомной электростанции».</p>
              </div></details></li>
            <li><details><summary><span>На пяти мегаваттах учились экипажи первых атомных подлодок и ледокола «Ленин».<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>«На АЭС прошли подготовку экипажи первых атомных подводных лодок, атомного ледокола "Ленин", персонал советских и зарубежных АЭС».</p>
                <p class="src-note">Источник: ФЭИ им. Лейпунского, «Первая в мире АЭС в Обнинске».</p>
              </div></details></li>
            <li><details><summary><span>Реактор АМ стал родоначальником целого семейства энергетических реакторов — линия от него ведёт к РБМК.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>ТАСС называет АМ «основоположником целого направления энергетических реакторов». Канальные уран-графитовые РБМК конструировал тот же Доллежаль.</p>
                <p class="src-note">Источник: ТАСС, спецпроект «Обнинская АЭС»; «Страна Росатом», «Создатель нового — к 120-летию Николая Доллежаля».</p>
              </div></details></li>
          </ol>
          <figure class="fig">
            <img src="day-21jan-obninsk-gagarin.jpg" data-source="https://goskatalog.ru/portal/#/collections?id=294713" data-license="цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Музей истории города Обнинска · Госкаталог, рег. № 2335970" width="800" height="513" loading="lazy" alt="Юрий Гагарин с группой людей у входа в здание Первой АЭС; на стене табличка со словами «Атомная электростанция»">
            <figcaption>Юрий Гагарин с группой у входа в здание Первой АЭС, 31 мая 1966 года. <span class="credit">Фото: автор не указан, 31 мая 1966. Хранится: Музей истории города Обнинска. Госкаталог музейного фонда РФ, рег. № 2335970.</span></figcaption>
          </figure>
        </div>
      </section>
  - posle: pervenstvo
    html: |-
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2 class="iz-u3">Для тех, кто смотрит внимательно</h2>
          <details class="deepd">
            <summary>Четыре сюжета подробно — развернуть</summary>
            <h3>26 или 27 июня?</h3>
            <p>Оба числа верны, но про разное. Вечером 26 июня, в 17:45, открыли задвижку, и станция встала под нагрузку. Сообщение появилось наутро, поэтому официальная дата пуска — 27 июня 1954 года.</p>
            <h3>Почему «первая», если EBR-I был раньше</h3>
            <p>EBR-I был опытным реактором: он доказал, что атомом можно получить электричество, и зажёг четыре лампы на стенде. Обнинск — электростанция: её ток ушёл в общую сеть, к потребителям. Первенство Обнинска — именно в этом.</p>
            <h3>Откуда «в 25 раз»</h3>
            <p>Сравниваем честно — по полной мощности, в одних и тех же лампочках по 200 ватт. EBR-I давал 200 киловатт: это 1000 лампочек, а в день пуска зажгли четыре. Обнинск — 5000 киловатт: 25 000 лампочек. 25 000 против 1000 — в 25 раз. И главное: в сеть шёл только ток Обнинска.</p>
            <h3>Что значит «АМ»</h3>
            <p>«Атом мирный» — так расшифровывают название реактора Российское историческое общество и ТАСС. Атом, который раньше знали по бомбе, здесь крутил турбину.</p>
          </details>
          <div class="src">Источники: ippe.ru · strana-rosatom.ru · historyrussia.org · scientificrussia.ru · spec.tass.ru · atomic-energy.ru</div>
        </div>
      </section>
