quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — «Атом мирный»; 2 — 26 июня 1954 года, 17:45; 3 — четыре лампы по 200 ватт; 4 — 48 лет; 5 — «С лёгким паром!»."
  ball: 10
  voprosy:
    - q: Как расшифровывается название реактора АМ?
      o:
        - «Атом морской»
        - «Атом мирный»
        - «Атомная машина»
      a: 1
      e: «Атом мирный» — так в материалах Российского исторического общества и ТАСС.
    - q: Когда ток Обнинской АЭС впервые пошёл в общую сеть?
      o:
        - 9 мая 1954 года
        - 26 июня 1954 года, в 17:45
        - 21 января 1955 года
      a: 1
      e: Вечером 26 июня открыли задвижку подачи пара на турбину. 9 мая был физический пуск, официальная дата — 27 июня.
    - q: Как атомщики Обнинска называли уран в разговорах и бумагах?
      o:
        - «Оловом»
        - «Керамикой»
        - «Метеоритом»
      a: 0
      e: Уран был «оловом», графит — «керамикой», нейтрон — «метеоритом», реактор — «кристаллизатором». Шифр берёг тайну при утечке.
    - q: Сколько лет проработала Обнинская АЭС?
      o:
        - 30 лет, как по плану
        - 48 лет
        - 12 лет
      a: 1
      e: Почти 48 лет — на 18 больше планового срока. Реактор заглушили 29 апреля 2002 года.
    - q: Какими словами Курчатов и Александров поздравили всех с пуском?
      o:
        - «Поехали!»
        - «С лёгким паром!»
        - «Да будет свет!»
      a: 1
      e: «С лёгким паром!» — ведь станция и правда делала пар, только без угля.
