pervenstvo:
  kicker: Проверка факта
  h2: Что именно сделали в Обнинске
  granica: <b>Что сделано:</b> построена и включена в общую энергосистему первая в мире атомная электростанция. 26 июня 1954 года реактор АМ мощностью 5 мегаватт через пар и турбину дал ток в сеть. Это первая в мире промышленная АЭС.
  net: "<b>Где граница:</b> атомное электричество как таковое впервые получили в США. 20 декабря 1951 года реактор EBR-I зажёг четыре 200-ваттные лампы — но в сеть этот ток не шёл. Американцы запитали от атома городок Арко только в июле 1955 года, через год после Обнинска. Поэтому мы говорим точно: первая в мире АЭС, отдавшая ток в общую сеть."
  kolonki:
    - Где
    - Что
    - Когда
  stroki:
    - - Обнинск
      - Создана Лаборатория «В»
      - 19 декабря 1945
    - - Москва
      - Постановление о разработке реактора АМ
      - 16 мая 1950
    - - Обнинск
      - Постановление строить опытную электростанцию
      - 12 июня 1951
    - - США, EBR-I
      - Четыре лампы по 200 ватт, без выхода в сеть
      - 20 декабря 1951
    - - Обнинск
      - Физический пуск реактора АМ
      - 9 мая 1954, 19:40
    - - Обнинск
      - Пар на турбину, ток в общую сеть
      - 26 июня 1954, 17:45
    - - США, Арко
      - Атомный ток в сети городка
      - июль 1955
    - - Обнинск
      - Реактор остановлен навсегда
      - 29 апреля 2002
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — «Атом мирный»; 2 — 26 июня 1954 года, 17:45; 3 — четыре лампы по 200 ватт; 4 — 48 лет; 5 — «С лёгким паром!»."
  ball: 10
  voprosy:
    - q: Как расшифровывается название реактора АМ?
      o:
        - «Атом морской»
        - «Атом мирный»
        - «Атомная машина»
      a: 1
      e: «Атом мирный» — так в материалах Российского исторического общества и ТАСС.
    - q: Когда ток Обнинской АЭС впервые пошёл в общую сеть?
      o:
        - 9 мая 1954 года
        - 26 июня 1954 года, в 17:45
        - 21 января 1955 года
      a: 1
      e: Вечером 26 июня открыли задвижку подачи пара на турбину. 9 мая был физический пуск, официальная дата — 27 июня.
    - q: На что хватило первого атомного тока американского EBR-I в 1951 году?
      o:
        - На целый городок
        - На четыре лампы по 200 ватт
        - На подводную лодку
      a: 1
      e: Четыре 200-ваттные лампы — 800 ватт. В сеть этот ток не шёл; городок Арко запитали только в 1955-м.
    - q: Сколько лет проработала Обнинская АЭС?
      o:
        - 30 лет, как по плану
        - 48 лет
        - 12 лет
      a: 1
      e: Почти 48 лет — на 18 больше планового срока. Реактор заглушили 29 апреля 2002 года.
    - q: Какими словами Курчатов и Александров поздравили всех с пуском?
      o:
        - «Поехали!»
        - «С лёгким паром!»
        - «Да будет свет!»
      a: 1
      e: «С лёгким паром!» — ведь станция и правда делала пар, только без угля.
