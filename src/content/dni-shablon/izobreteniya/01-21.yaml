          <div id="forkReal" class="exp forkReal"><b>Как было на самом деле.</b> 12 июня 1951 года вышло постановление строить опытную электростанцию на территории Лаборатории «В». Через три года, 26 июня 1954-го, её ток пошёл в общую сеть — первым в мире. Американцы шли через стенд: их EBR-I в 1951-м зажёг четыре лампы, а в сеть атомный ток попал только в 1955-м.</div>
