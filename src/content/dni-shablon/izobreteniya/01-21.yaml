         {k:['америк','сша','ebr','лампоч','лампы','арко'],a:'Американский EBR-I дал атомный ток раньше, в декабре 1951 года, — его хватило на четыре лампы по 200 ватт. В сеть он не шёл. Городок Арко американцы запитали только в июле 1955-го, через год после нас. Поэтому наша станция — первая, чей атомный ток пошёл в общую сеть.'},
         {k:['борода','бород','прозвищ','тиф','князь'],a:'Бородой меня прозвали после войны с тифом: в конце 1941 года я тяжело переболел, с пневмонией, и отпустил бороду. А до того товарищи звали меня «князь Игорь».'},
         {k:['лёгким паром','легким паром','поздрав','тост','сказал'],a:'26 июня 1954 года, в 17:45, пар пошёл на турбину. Мы с Анатолием Петровичем Александровым поздравили всех: «С лёгким паром!» Пар-то был обычный, белый — только сделан без угля.'},
         {k:['пуск','когда','дата','26','27','июн','мая','сеть'],a:'9 мая 1954 года, в 19:40, был физический пуск — реактор заработал. А 26 июня в 17:45 открыли задвижку подачи пара на турбогенератор, и ток пошёл в общую сеть. Официально считают 27 июня — наутро сообщили газеты.'},
         {k:['ам-1','«ам»',' ам ','атом мирн','реактор','как работ','мощн','мегават'],a:'Реактор АМ — «Атом мирный». Уран-графитовый, канальный, вода уносит тепло. Мощность — 5 мегаватт. Тепло деления урана превращает воду в пар, а дальше всё как на обычной станции: турбина, генератор, провода.'},
         {k:['блохинц','руковод','лаборатор','обнинск','секрет'],a:'Научным руководителем станции был Дмитрий Иванович Блохинцев, директор Лаборатории «В» в Обнинске. Он остался профессором МГУ и привёл туда своих учеников. Реактор конструировал Николай Антонович Доллежаль.'},
         {k:['доллежал','конструкт'],a:'Николай Антонович Доллежаль — главный конструктор реактора АМ. Потом он делал реакторы РБМК и установку для первой нашей атомной подлодки «Ленинский комсомол».'},
         {k:['сколько','лет','работал','остановил','2002','музей'],a:'Этого я уже не застал — меня не стало в 1960 году. Но в музее знают: станцию рассчитывали на 30 лет, а она проработала 48. Реактор заглушили 29 апреля 2002 года, а с 2009 года в здании — музей атомной энергетики.'},
         {k:['лодк','ледокол','учил','экипаж','школ'],a:'На нашей станции учились экипажи первых атомных подводных лодок и атомного ледокола «Ленин», а ещё персонал советских и зарубежных АЭС.'},
         {k:['родил','день рожд','21 январ','1903','детств'],a:'Родился я 8 января 1903 года по старому стилю — по новому это 21 января. Поэтому этот день в календаре музея — мой.'},
         {k:['женев','овац','аплод','конференц'],a:'В августе 1955 года в Женеве, на конференции по мирному атому, Блохинцев рассказывал о нашей станции. Аплодисменты правилами конференции были запрещены — а окончание доклада встретили бурной овацией.'},
         {k:['гост','гагарин','неру','жолио','делегац'],a:'Место держали в секрете, но уже в 1955 году к нам поехали иностранные делегации — и Лабораторию «В» узнал весь мир. А всего, как пишут теперь, за двадцать лет станцию посетили около 60 тысяч делегатов, из них 6770 иностранцев: Неру, Жолио-Кюри, Сиборг, Гагарин.'},
         {k:['срок','быстро','три года','постановлен','1951','1950'],a:'В мае 1950 года вышло постановление о разработке реактора АМ, 12 июня 1951-го — о сооружении опытной станции. А летом 1954-го она уже давала ток. От техпроекта до энергопуска — около трёх лет.'}
        ];
        function addMsg(text,who){
          var d=document.createElement('div'); d.className='msg '+who; d.textContent=text;
          document.getElementById('chatBox').appendChild(d);
          d.scrollIntoView({behavior:'smooth',block:'nearest'});
        }
        function findAnswer(q){
          q=q.toLowerCase();
          for (var i=0;i<kb.length;i++){ if (kb[i].k.some(function(k){return q.indexOf(k)>=0;})) return kb[i].a; }
          return 'Спросите точнее — о пуске станции, о реакторе АМ, об американских лампочках, о Блохинцеве и Доллежале или о том, почему я «Борода». Отвечу как было.';
        }
        function sendChat(){
          var inp=document.getElementById('chatInput'), q=inp.value.trim();
          if (!q) return;
          addMsg(q,'you'); inp.value='';
          setTimeout(function(){ addMsg(findAnswer(q),'inv'); award('chat',5); },600);
        }
        document.getElementById('chatSend').onclick=sendChat;
        document.getElementById('chatInput').addEventListener('keydown',function(e){ if(e.key==='Enter') sendChat(); });
        (function(){
          var qs=['Почему вас зовут Бородой?','Американцы ведь были первыми?','Что вы сказали при пуске?'];
          var box=document.getElementById('starters');
          qs.forEach(function(q){ var c=document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=q;
            c.onclick=function(){ document.getElementById('chatInput').value=q; sendChat(); }; box.appendChild(c); });
          var w=document.createElement('div'); w.className='msg inv';
          w.textContent='Здравствуйте. Игорь Васильевич Курчатов. Спрашивайте — про первую атомную станцию расскажу как было.';
          document.getElementById('chatBox').appendChild(w);
        })();

        // ── ТЕМАТИЧЕСКИЕ ИЗОБРЕТЕНИЯ ─────────────────────────────────────────────────
        var themeBtn=document.getElementById('themeInvBtn');
        if (themeBtn) themeBtn.onclick=function(){
          var b=document.getElementById('themeInvBody'), open=b.hidden;
          b.hidden=!open;
          this.textContent=open?'▲ Скрыть':(this.dataset.label||'Показать перечень →');
          if (open) award('theme',5);
        };
      })();
return:
  q: Сколько лампочек по 200 ватт могла зажечь Обнинская АЭС — и во сколько раз больше, чем американский EBR-I на всю мощность?
  a: 25 000 против 1000 — в 25 раз. И только ток Обнинска шёл в общую сеть.
  src: «Страна Росатом», «Атомный турнир сверхдержав», 08.12.2021
audioguide:
  audioSrc: audio-guide-obninsk-ru.mp3
  durationLabel: 5 минут 30 секунд
  lead: "Голос ведёт по залу Первой в мире атомной электростанции: от пульта управления на обложке через пар без угля и игру «Открой задвижку» до американского EBR-I и овации в Женеве. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Пульт на обложке
    - t: 56
      mark: 0:56
      title: Пар без угля
    - t: 101
      mark: 1:41
      title: Задвижка открыта
    - t: 145
      mark: 2:25
      title: Игра «Открой задвижку»
    - t: 194
      mark: 3:14
      title: Где граница
    - t: 244
      mark: 4:04
      title: Пять фактов
    - t: 300
      mark: 5:00
      title: Итог зала
  transcript:
    - "<p>«Здравствуйте. Мы в зале Первой в мире атомной электростанции в Обнинске. Посмотрите на обложку: это пульт управления станцией. Два оператора сидят за пультом, за ними стоят сотрудники в белых халатах и шапочках, а на стене — мнемосхема реактора и шкалы приборов. Снимок сделан в тысяча девятьсот шестьдесят шестом году. Под заголовком сказано: двадцать первого января тысяча девятьсот третьего года родился Игорь Курчатов, руководитель советского атомного проекта. А главная мысль зала такая: в Обнинске атом впервые дал не взрыв, а ток в розетку, и станция проработала почти полвека. Под обложкой полоса из четырёх чисел. Пять мегаватт — мощность реактора АМ. Двадцать шестое июня тысяча девятьсот пятьдесят четвёртого года — ток пошёл в общую сеть. Сорок восемь лет работы вместо тридцати по плану. И в двадцать пять раз мощнее американского EBR-I, да ещё и в сеть. Пройдём по залу по порядку.»</p>"
    - "<p>«Найдите ниже раздел «История пуска» с заголовком «Пар без угля». Обычная электростанция жжёт уголь, чтобы вскипятить воду. В Обнинске воду в пар превращало тепло деления урана, а дальше всё как у всех: пар, турбина, провода. Реактор назвали АМ — «Атом мирный». Он уран-графитовый, канальный: уран стоит в каналах графитовой кладки, через каналы бежит вода и уносит тепло. Атом, который раньше знали по бомбе, здесь крутил турбину. Девятого мая тысяча девятьсот пятьдесят четвёртого года, в девятнадцать часов сорок минут, реактор ожил. Это физический пуск: в реакторе впервые пошла цепная реакция. Тока ещё нет. Сначала надо убедиться, что атом слушается.»</p>"
    - "<p>«Двадцать шестого июня тысяча девятьсот пятьдесят четвёртого года, в семнадцать часов сорок пять минут, открыли задвижку. Пар пошёл на турбину, и атомный ток впервые в мире потёк в общую сеть. В летописи станции записано, что первая в мире атомная электростанция встала под промышленную нагрузку. Почему же официальная дата пуска — двадцать седьмое июня? Оба числа верны: ток пошёл вечером, а наутро о станции сообщили газеты. От постановления о стройке до тока в сети прошло около трёх лет. Строили в секретной Лаборатории «В» под Калугой, и даже в сообщении того года город не назвали. Двадцать девятого апреля две тысячи второго года реактор заглушили навсегда. С две тысячи девятого года в здании — музей атомной энергетики.»</p>"
    - "<p>«Теперь спуститесь к игре «Открой задвижку». На экране два первых атомных тока. Слева американская лаборатория, двадцатое декабря тысяча девятьсот пятьдесят первого года. Начните с неё: нажмите на ключ реактора. Загорятся четыре лампочки, а провод упрётся в стену: дальше лаборатории этот ток не пошёл. Справа Обнинск. Крутите штурвал задвижки пальцем по кругу, по часовой стрелке; короткое нажатие повернёт его на четверть оборота. Пар пойдёт на турбину, она тронется, ток выйдет за стену станции. Загорятся опоры, потом улица, потом завод, и ток уйдёт за край экрана, в общую сеть. Счётчик дойдёт до двадцати пяти тысяч лампочек. Честная оговорка: это модель, а не схема станции. Здания, опоры и окна нарисованы программой.»</p>"
    - "<p>«Загляните в раздел «Что именно сделали в Обнинске». Атомное электричество как таковое впервые получили в Соединённых Штатах. Реактор EBR-I зажёг четыре лампы по двести ватт, но в сеть этот ток не шёл. Это был опытный реактор: он доказал, что атомом можно получить электричество. Сравним честно, в одних и тех же лампочках. Вся мощность EBR-I — двести киловатт, это тысяча лампочек. Обнинск — пять тысяч киловатт, двадцать пять тысяч лампочек. В двадцать пять раз больше. Городок Арко американцы запитали от атома только в июле тысяча девятьсот пятьдесят пятого года, через год после Обнинска. Поэтому говорим точно: первая в мире АЭС, отдавшая ток в общую сеть. Англия запустила свою станцию Колдер-Холл через два года после Обнинска, Америка свою Шиппингпорт — через три.»</p>"
    - "<p>«Вернитесь наверх, к пяти фактам. Перед первым током аварийная защита глушила реактор восемнадцать раз: сбоили топливные сборки, насосы, систему охлаждения переделывали на ходу. Опыт пуска реакторов был только у одного сотрудника. Когда пар пошёл на турбину, Курчатов и Александров поздравили всех банным «С лёгким паром!». Английская печать назвала событие более важным, чем сброс первой атомной бомбы на Хиросиму. А в Женеве доклад об Обнинске встретили бурной овацией, хотя правила конференции аплодисменты запрещали. Так вспоминал научный руководитель станции Дмитрий Иванович Блохинцев. Теперь загляните в раздел «Ещё о станции». Пуск встречали слезами радости, хотя из клапана вырвалась струя самого обычного белого пара. На этих пяти мегаваттах учились экипажи первых атомных подводных лодок и ледокола «Ленин». Найдите снимок: Юрий Гагарин с группой у входа в здание Первой АЭС.»</p>"
    - "<p>«Вот и весь зал. Маленькая станция на пять мегаватт стала большой школой. Реактор АМ стал родоначальником целого семейства энергетических реакторов: линия от него ведёт к РБМК, которые конструировал тот же Николай Доллежаль. У американцев первый атом служил флоту, у нас — розетке. Мирный атом начался в Обнинске. Теперь откройте задвижку сами: поверните ключ слева, раскрутите штурвал справа и проводите ток за край экрана. А потом ответьте на пять вопросов викторины.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
