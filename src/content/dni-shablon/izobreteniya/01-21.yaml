pervenstvo:
  kicker: Проверка факта
  h2: Что именно сделали в Обнинске
  granica: <b>Что сделано:</b> построена и включена в общую энергосистему первая в мире атомная электростанция. 26 июня 1954 года реактор АМ мощностью 5 мегаватт через пар и турбину дал ток в сеть. Это первая в мире промышленная АЭС.
  net: "<b>Где граница:</b> Обнинская — не первый реактор и не первый атомный ток вообще. Её первенство в другом: впервые в мире атомная электростанция отдала ток в общую энергосистему, людям, и работала как промышленная станция почти 48 лет."
  kolonki:
    - Где
    - Что
    - Когда
  stroki:
