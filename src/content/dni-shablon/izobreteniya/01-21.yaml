          <h2>А как поступил бы ты?</h2>
          <p class="muted-p">1951 год. Атомная бомба у страны уже есть. В Обнинске, в секретной Лаборатории «В», — физики, уран и графит. Ты решаешь, чем им заняться дальше.</p>
