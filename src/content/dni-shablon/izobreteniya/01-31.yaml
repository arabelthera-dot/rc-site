  h2: Запреты, договоры и печи
  udary:
  - summary: "Министерство платило за гиротрон — и запретило писать в статьях само слово «гиротрон»."
    det:
    - 'После Государственной премии 1967 года доводить гиротрон до миллиона ватт взялось Министерство электронной промышленности. Условия поставили жёсткие: опыты не публиковать, а в статьях по теории вместо «гиротрон» писать безликое «МЦР».'
    - 'Так шесть лет и работали — под кодовыми названиями этапов «Радуга», «Роса» и «Рассвет». И с опаской листали свежие журналы: вдруг за границей обгонят? Только в 1972 году Академия наук разрешила рассказать о гиротроне открыто.'
    src: "Источник: М. И. Петелин, «А. В. Гапонов-Грехов — лидер релятивистской СВЧ-электроники», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 268–271 — https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf"
    otryvok: «в теоретических статьях вместо слова «гиротрон» писать международное «МЦР»»
    stranica: 'М. И. Петелин, в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 268–269'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    istochnik: "ipfran"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f11"
  - summary: "Заказчик сам упрекал учёных: вы обещаете вдвое меньше, чем собираетесь сделать."
    det:
    - 'Задания на гиротрон подписывала директор института Мария Грехова — и всегда с осторожной оговоркой: «Исследование возможностей получить такую-то мощность».'
    - 'Однажды Михаилу Петелину позвонил приёмщик из министерского института: «Две недели назад мы приняли у вас 100 киловатт, вы планировали сделать 300, а в задании обещаете всего 150». Петелин ответил: директор призывает к осторожности — не выполним задание, плохо будет и нам, и вам.'
    src: "Источник: М. И. Петелин, «А. В. Гапонов-Грехов — лидер релятивистской СВЧ-электроники», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 269–270 — https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf"
    otryvok: «Миша, две недели назад я и мои инженеры приняли у вас 100 кВт, вы планировали сделать 300, но в ТЗ обещаете всего 150»
    stranica: 'М. И. Петелин, в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 269–270'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    istochnik: "ipfran"
    dlya_voprosa: false
