  - <p>«Здравствуйте. Мы в зале гиротрона. Это прибор, который придумали в Горьком, в Радиофизическом институте, в группе Андрея Викторовича Гапонова-Грехова. Первый гиротрон в лаборатории Флягина прозвали «молотком». В 1964 году он выдал всего шесть ватт, меньше ночника. Но о нём рискнули доложить на конференции в Москве.»</p>
  - '<p>Как он работает? Электроны летят в сильном магнитном поле и крутятся по маленьким спиралям. Если подобрать поле так, чтобы они вращались в такт с волной в резонаторе, электроны отдают ей свою энергию. Волна получается миллиметровая, около миллиметра длиной, и очень мощная. Слово «гиротрон» придумали в 1966 году в Саратове: от слова «вращение».</p>'
  - <p>Дальше мощность росла почти на полпорядка в год. Работа была закрытой, даже слово «гиротрон» печатать не разрешали. Секретный прибор с прозвищем «Орясина» в 1972 году дал четыреста киловатт, а к концу 1973-го пришёл мегаватт. Уже в 1967 году Гапонов-Грехов и его ученики, Антаков, Петелин, Флягин и Юлпатов, получили Государственную премию СССР.</p>
  - <p>В 1972 году горьковский гиротрон отправили в Курчатовский институт и нагрели им плазму токамака ТМ-3. С 1975 года гиротроны выпускают серийно, на горьковском предприятии, позже названном «Салют». Сегодня больше половины термоядерных установок мира греют нижегородскими гиротронами. Спасибо, что были с нами.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
