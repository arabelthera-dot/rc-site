  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "Что сделано: в Горьком, в группе А. В. Гапонова-Грехова, создали первый в мире гиротрон — мощный генератор миллиметровых волн на вращающихся в магнитном поле электронах — и довели его от 6 ватт (1964) до мегаватта (1973)."
  net: "Где граница: первенство относится к прибору — гиротрону. Сам физический эффект излучения вращающихся электронов, как пишет М. И. Петелин, открывали независимо и в других лабораториях. Номер авторского свидетельства в источниках не найден; 1964 — год первого доклада."
