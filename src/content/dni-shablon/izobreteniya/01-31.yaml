story:
  kicker: История изобретения
  h2: От «молотка» к мегаватту
  udary:
  - summary: Первый в мире гиротрон создали в Горьком, в Радиофизическом институте, в группе Андрея Гапонова-Грехова.
    det:
    - Это прибор, в котором электроны крутятся в сильном магнитном поле и отдают энергию в миллиметровую радиоволну. Приоритет изобретения, по словам академика А. Г. Литвака, принадлежит группе Гапонова-Грехова.
    src: 'Источник: А. Г. Литвак, интервью «Как вышли в мир гиротроны из Горького», «Троицкий вариант — Наука», 2016 — <a href="https://www.trv-science.ru/2016/03/kak-vyshli-v-mir-girotrony-iz-gorkogo/" rel="noopener" target="_blank">trv-science.ru</a>'
  - summary: Первый образец за форму прозвали «молотком» — и он выдал всего 6 ватт.
    det:
    - Его рассчитали и собрали в лаборатории В. А. Флягина. О «молотке» рискнули рассказать на конференции 1964 года в Москве.
    src: 'Источник: М. И. Петелин, воспоминания, в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
  - summary: Слово «гиротрон» в 1966 году предложил А. Л. Гольденберг.
    det:
    - 'Название — от слова «вращение»: электроны в приборе вращаются вокруг силовых линий магнитного поля.'
    src: 'Источник: М. И. Петелин, воспоминания, в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
  - summary: Секретная «Орясина» дала 400 киловатт, а к концу 1973 года — мегаватт.
    det:
    - Мощность росла «на полпорядка в год». Работа была закрытой, и только в 1972 году гиротрон впервые показали на конференции в Москве.
    src: 'Источник: М. И. Петелин, воспоминания, в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
  - summary: Первое промышленное производство гиротронов наладили у нас.
    det:
    - Сегодня нижегородскими гиротронами оснащено больше половины термоядерных установок мира.
    src: 'Источник: А. Г. Литвак, интервью «Как вышли в мир гиротроны из Горького», «Троицкий вариант — Наука», 2016 — <a href="https://www.trv-science.ru/2016/03/kak-vyshli-v-mir-girotrony-iz-gorkogo/" rel="noopener" target="_blank">trv-science.ru</a>'
fakty:
  id: fakty
  nav: Факты
  kicker: Десять фактов о гиротроне
  h2: Факты дня
  udary:
  - summary: <b>Первый в мире гиротрон создали у нас, в Горьком, — в группе Андрея Гапонова-Грехова.</b>
    det:
    - Гиротрон — это «микроволновка» в миллионы раз мощнее кухонной. Сегодня город называется Нижний Новгород, и гиротроны оттуда работают по всему миру.
    src: 'Источник: А. Г. Литвак, интервью «Как вышли в мир гиротроны из Горького», «Троицкий вариант — Наука», 2016 — <a href="https://www.trv-science.ru/2016/03/kak-vyshli-v-mir-girotrony-iz-gorkogo/" rel="noopener" target="_blank">trv-science.ru</a>'
    otryvok: «приоритет изобретения гиротрона в принципе принадлежит сотрудникам института, группе во главе с Андреем Викторовичем Гапоновым-Греховым»
    stranica: «Троицкий вариант — Наука», 2016, интервью А. Г. Литвака
    href: https://www.trv-science.ru/2016/03/kak-vyshli-v-mir-girotrony-iz-gorkogo/
    pometka: документ
    utverzhdeno: утверждено Р352
  - summary: '<b>За девять лет гиротрон вырос с 6 ватт до миллиона ватт — примерно в 170 тысяч раз.</b>'
    det:
    - 'Миллион ватт учёные из Горького получили к концу 1973 года.'
    src: 'Источник: М. И. Петелин, воспоминания, в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
    otryvok: '«Мощность росла не быстро, на полпорядка в год, и мегаватт мы получили только к концу 1973-го»'
    stranica: '«А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    utverzhdeno: утверждено Р352
  - summary: '<b>Секретный гиротрон в лаборатории звали «Орясиной».</b>'
    det:
    - 'Он выдавал 400 тысяч ватт — как 200 электрочайников разом.'
    - 'Миру его впервые показали в 1972 году на конференции в Москве.'
    src: 'Источник: М. И. Петелин, воспоминания, в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
    otryvok: '«рассказал про гиротрон (бывший у нас под псевдонимом «Орясина») с выходной мощностью 400 кВт»'
    stranica: '«А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    utverzhdeno: утверждено Р352
  - summary: '<b>Больше половины установок «искусственного Солнца» в мире разогревают нижегородскими гиротронами.</b>'
    det:
    - 'В таких установках раскалённый газ греют до сотни миллионов градусов, чтобы зажечь «звезду на Земле».'
    src: 'Источник: А. Г. Литвак, интервью «Как вышли в мир гиротроны из Горького», «Троицкий вариант — Наука», 2016 — <a href="https://www.trv-science.ru/2016/03/kak-vyshli-v-mir-girotrony-iz-gorkogo/" rel="noopener" target="_blank">trv-science.ru</a>'
    otryvok: «Больше половины термоядерных установок мира оснащены нижегородскими гиротронами»
    stranica: «Троицкий вариант — Наука», 2016, интервью А. Г. Литвака
    href: https://www.trv-science.ru/2016/03/kak-vyshli-v-mir-girotrony-iz-gorkogo/
    pometka: документ
    utverzhdeno: утверждено Р352
  - summary: '<b>Крупнейшее в мире «искусственное Солнце» — ИТЭР во Франции — греют и нижегородские гиротроны.</b>'
    det:
    - 'Россия сделала для него восемь гиротронов.'
    - Каждый выдаёт миллион ватт. Разработал их Институт прикладной физики РАН, изготовила нижегородская фирма «Гиком». В 2026 году первые российские гиротроны смонтированы на реакторе.
    src: 'Источник: «Страна Росатом», 16.06.2026 — <a href="https://strana-rosatom.ru/2026/06/16/na-reaktore-iter-ustanovili-pervye-ro/" rel="noopener" target="_blank">strana-rosatom.ru</a>'
    otryvok: «Восемь российских гиротронов изготовлены, четыре поставлены во Францию, три смонтированы»
    stranica: «Страна Росатом», 16 июня 2026, «На реакторе ИТЭР установили первые российские гиротроны»
    href: https://strana-rosatom.ru/2026/06/16/na-reaktore-iter-ustanovili-pervye-ro/
    pometka: документ
    utverzhdeno: утверждено Р352
  - summary: '<b>Министерство: «Мощность слишком велика — но закроем глаза, если Академия разрешит».</b>'
    det:
    - 'Учёные просили разрешения рассказать о гиротроне открыто. Академия наук разрешила, и в 1972 году на конференции в Москве Михаил Петелин на ломаном английском рассказал о гиротроне всему миру. После этого гиротроны начали делать в США, Германии, Японии и Китае.'
    src: 'Источник: М. И. Петелин, воспоминания, в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
    otryvok: '«Разрешения дать не можем – ваша мощность слишком велика. Но мы закроем глаза, если разрешение даст Академия наук»'
    stranica: '«А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 270–271'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    utverzhdeno: утверждено Р354
  - summary: '<b>Французы: «Вы делаете гиротрон, мы клеим свои значки и платим вам 30%». Наши отказались.</b>'
    det:
    - 'Французская Thomson CSF хотела продавать наш гиротрон под своей маркой. На 30 процентов в ГИКОМе не согласились.'
    src: 'Источник: А. Г. Литвак, «На волнах памяти», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 180–181'
    otryvok: '«мы производим гиротрон, они навешивают на него свои бейджи и поставляют заказчику, оплачивая ГИКОМу 30 процентов от цены поставки»'
    stranica: '«А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 180–181'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    utverzhdeno: утверждено Р356
  - summary: '<b>Один гиротрон отдали немцам почти даром — и потом выиграли все тендеры мира.</b>'
    det:
    - 'Рекордный гиротрон отправили в Институт физики плазмы Макса Планка, чтобы немцы убедились сами. В 1990-е ГИКОМ выиграл все тендеры: Италия, Германия, Япония, Голландия, Швейцария, США, Канада, Испания.'
    src: 'Источник: А. Г. Литвак, «На волнах памяти», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 180–181'
    otryvok: '«ГИКОМ выиграл уже в 1990-е годы все тендеры на поставку гиротронов, объявленные ведущими термоядерными лабораториями Италии, Германии, Японии, Голландии, Швейцарии, США, Канады, Испании»'
    stranica: '«А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 180–181'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    utverzhdeno: утверждено Р356
  - summary: '<b>В 90-е маленькая фирма на гиротронах кормила целый институт, где людей в 6 раз больше.</b>'
    det:
    - 'Учёные сами создали фирму ГИКОМ. Её доходы превышали всё, что государство давало Институту прикладной физики, — так институт выстоял в трудные годы.'
    src: 'Источник: А. Г. Литвак, «На волнах памяти», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 180–182'
    otryvok: '«доходы, зарабатываемые ГИКОМом, превосходили объем финансирования ИПФ РАН, который по числу сотрудников превосходил тогда ГИКОМ в шесть раз»'
    stranica: '«А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 180–182'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    utverzhdeno: утверждено Р356
  - summary: '<b>Гиротрон Европы для ИТЭР забраковали. Следующие 48 делают Россия и Япония.</b>'
    det:
    - 'Европейский гиротрон немецкого института в Карлсруэ и знаменитой французской Thales не приняли: слабый КПД, около 40%. Российские сделаны в срок. Дополнительные 48 гиротронов поровну заказали России и Японии — Европы среди поставщиков нет.'
    src: 'Источник: А. Г. Литвак, «На волнах памяти», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 182–183'
    otryvok: '«Прототип гиротрона, разработанный и произведенный Европейским консорциумом в составе немецкого Karlsruhe Institute of Technology и знаменитой французской фирмы Thales, не принят заказчиком из-за низкого кпд ~ 40%»'
    stranica: '«А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 182–183'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    utverzhdeno: утверждено Р356
