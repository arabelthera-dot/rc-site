    det:
    - Гиротрон греет не только плазму. Его волна проходит в керамику насквозь и прогревает её сразу всю — быстро и ровно. Зёрна выходят мельче, а керамика — прочнее и не такая хрупкая.
    - Об этом рассказал сам Гапонов-Грехов в 2001 году, в лекции перед Общим собранием Академии наук. Для таких печей хватает гиротронов на 20–30 тысяч ватт — в десятки раз слабее и дешевле тех, что греют плазму.
