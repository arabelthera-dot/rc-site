  - summary: "Американцы подписали договор с ГИКОМом ради наших секретов — и сами же заплатили за нарушения."
    det:
    - В 1992 году известная американская фирма захотела делать гиротроны вместе с только что созданным ГИКОМом. Подписывать договор в Вашингтон полетел сам Гапонов-Грехов, хотя за границу он не ездил почти 20 лет.
    - 'Скоро стало ясно: партнёрам нужен был только доступ к нашим решениям. Свою часть работы они бросили, совместный гиротрон так и не построили, а наш гиротрон вернули. Но договор был составлен крепко: под давлением юристов фирма признала нарушения и заплатила.'
    src: "Источник: А. Г. Литвак, «На волнах памяти», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 183–187 — https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf"
    otryvok: «основной целью наших вариановских коллег было стремление получить доступ к технологическим решениям, которыми располагал «ГИКОМ»»
    stranica: 'А. Г. Литвак, «На волнах памяти», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 186–187'
    href: https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf
    pometka: документ
    istochnik: "ipfran"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f13"
  - summary: "30 лет назад нагрев гиротронами для ИТЭР считали самым неготовым. Теперь готов только он."
    det:
    - 'Плазму в термоядерном реакторе можно греть разными способами: пучками частиц, радиоволнами разной длины. Когда около 30 лет назад обсуждали первый проект ИТЭР, способ с гиротронами поставили последним — и по готовности приборов, и по сложности, и по цене.'
    - За эти годы нижегородские радиофизики довели гиротроны до нужной силы. По словам академика Литвака, сегодня к опытам на ИТЭР готов только нагрев гиротронами — остальные способы ещё далеки от плана.
    src: "Источник: А. Г. Литвак, «На волнах памяти», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 181–182 — https://ipfran.ru/api/elibrary/21893/Gaponov-Grekhov_2026.pdf"
    otryvok: «использующий гиротроны ЭЦ-метод оценивался как последний по уровню готовности приборов с необходимыми параметрами, сложности предстоящих задач и финансовой доступности»
    stranica: 'А. Г. Литвак, «На волнах памяти», в книге «А. В. Гапонов-Грехов. К 100-летию со дня рождения», Н. Новгород: ИПФ РАН, 2026, с. 181–182'
