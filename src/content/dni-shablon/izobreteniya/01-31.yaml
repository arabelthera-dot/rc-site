pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: <b>Что сделано:</b> в Горьком, в группе А. В. Гапонова-Грехова, создали первый в мире гиротрон — мощный генератор миллиметровых волн на вращающихся в магнитном поле электронах — и довели его от 6 ватт (1964) до мегаватта (1973).
