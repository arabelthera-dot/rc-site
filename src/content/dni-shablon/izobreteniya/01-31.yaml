return:
  q: Во сколько раз выросла мощность гиротрона с 1964 по 1973 год?
  a: 'Примерно в 170 тысяч раз: с 6 ватт до мегаватта.'
  src: 'М. И. Петелин, воспоминания, А. В. Гапонов-Грехов. К 100-летию со дня рождения. Н. Новгород: ИПФ РАН, 2026'
audioguide:
  audioSrc: /muzei/izobreteniya/audio-guide-girotron-2-ru.mp3
  durationLabel: 2 минуты 45 секунд
  lead: 'Голос ведёт по залу гиротрона: от «молотка» на шесть ватт и «закроем глаза» в министерстве до тендеров по всему миру и реактора ИТЭР.'
  stops:
  - t: 0
    mark: '0:00'
    title: Молоток на шесть ватт
  - t: 30
    mark: '0:30'
    title: Секретная «Орясина»
  - t: 50
    mark: '0:50'
    title: «Закроем глаза»
  - t: 87
    mark: '1:27'
    title: Тридцать процентов и тендеры
  - t: 118
    mark: '1:58'
    title: Фирма кормит институт
  - t: 133
    mark: '2:13'
    title: ИТЭР без Европы
  transcript:
  - '<p>Здравствуйте. Мы в зале гиротрона. Первый в мире гиротрон создали у нас, в Горьком, в Радиофизическом институте, в группе Андрея Викторовича Гапонова-Грехова. Гиротрон — как микроволновка, только в миллионы раз мощнее кухонной. Электроны в нём крутятся в сильном магнитном поле и отдают энергию радиоволне длиной около миллиметра. Первый образец за форму прозвали «молотком». В 1964 году он выдал всего шесть ватт, меньше ночника.</p>'
  - '<p>Дальше мощность росла на полпорядка в год. Работа была секретной, и новый гиротрон в лаборатории звали «Орясиной». Он выдавал четыреста тысяч ватт, как двести электрочайников разом. А к концу семьдесят третьего года пришёл миллион ватт. За девять лет мощность выросла примерно в сто семьдесят тысяч раз.</p>'
  - '<p>Как о секретном приборе узнал мир? Гиротроном захотели греть плазму в Курчатовском институте, а программа управляемого термоядерного синтеза была международной. Гапонов-Грехов пошёл в министерство просить разрешения на публикацию. Ему ответили: «Разрешения дать не можем, ваша мощность слишком велика. Но мы закроем глаза, если разрешение даст Академия наук». Академия разрешила. И в 1972 году на конференции в Москве Михаил Петелин на ломаном английском рассказал о гиротроне всему миру. После этого гиротроны начали делать в США, Германии, Японии и Китае.</p>'
  - '<p>В девяностые учёные сами создали фирму ГИКОМ. Французская компания Томсон предложила сделку: вы делаете гиротрон, мы клеим на него свои значки и платим вам тридцать процентов. Наши отказались. Вместо этого один рекордный гиротрон отправили немцам, в Институт физики плазмы Макса Планка, почти бесплатно, чтобы те убедились сами. Убедились. И в девяностые ГИКОМ выиграл все тендеры на гиротроны: Италия, Германия, Япония, Голландия, Швейцария, США, Канада, Испания.</p>'
  - '<p>В те трудные годы маленькая фирма зарабатывала больше, чем государство давало всему Институту прикладной физики, где людей было в шесть раз больше. Деньги ГИКОМа шли на институт и его сотрудников. Так гиротрон помог институту выстоять.</p>'
  - '<p>Сегодня больше половины термоядерных установок мира греют нижегородскими гиротронами. Самая большая из них — реактор ИТЭР во Франции. Россия сделала для него восемь гиротронов по миллиону ватт, в срок, и в 2026 году первые из них смонтированы на реакторе. А гиротрон европейского консорциума забраковали: у него слишком низкий коэффициент полезного действия. Следующие сорок восемь гиротронов для ИТЭР поровну заказали России и Японии. Европы среди поставщиков нет. Спасибо, что были с нами.</p>'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
