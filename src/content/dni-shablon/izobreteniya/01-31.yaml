  - q: Когда гиротрон дал мегаватт?
    o:
    - К концу 1973 года
    - В 1964 году
    - В 1991 году
    a: 0
    e: Мощность росла на полпорядка в год и к концу 1973-го достигла мегаватта.
  - q: От какого слова образовано название «гиротрон»?
    o:
    - «Вращение»
    - «Огонь»
    - «Гора»
    a: 0
    e: Электроны в гиротроне вращаются вокруг линий магнитного поля.
  - q: Какую долю термоядерных установок мира оснащают нижегородские гиротроны?
    o:
