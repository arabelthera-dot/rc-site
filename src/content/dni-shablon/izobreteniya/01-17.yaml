quiz:
  ball: 10
  voprosy:
    - q: Что, по Жуковскому, создаёт подъёмную силу крыла?
      o:
        - Тёплый воздух под крылом
        - Вихрь, присоединённый к крылу, — циркуляция
        - Взмахи, как у птицы
      a: 1
      e: 'Присоединённый вихрь: сила равна плотности воздуха, умноженной на скорость потока и на циркуляцию.'
    - q: Почему в Москве лопались магистральные трубы водопровода?
      o:
        - Вода замерзала зимой
        - Задвижку закрывали резко — гидравлический удар
        - Трубы делали из дерева
      a: 1
      e: Жуковский построил опытную сеть труб и нашёл виновника — гидравлический удар («Родина», 16.03.2014).
    - q: В каком году вышла работа «О присоединённых вихрях»?
      o:
        - '1895'
        - '1906'
        - '1918'
      a: 1
      e: В 1906-м. Идея — 1904 год, доклад в Московском математическом обществе — ноябрь 1905-го.
    - q: Как студенты кружка Жуковского собрали деньги на свои трубы в 1909 году?
      o:
        - Попросили у царя
        - Устроили воздухоплавательную выставку
        - Продали планёр
      a: 1
      e: Выставку устроили сами, а уже в 1910-м трубы пришлось продать училищу (музей Жуковского).
    - q: Что создано по предложению Жуковского 1 декабря 1918 года?
      o:
        - ЦАГИ — Центральный аэрогидродинамический институт
        - Московский университет
        - Институт путей сообщения
      a: 0
      e: ЦАГИ. С 1921 года институт носит имя Жуковского.
