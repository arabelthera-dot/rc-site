  intro: Та же история коротким роликом — от формулы подъёмной силы 1906 года и петли Нестерова до ЦАГИ и трубы Т-1-2, на момент постройки самой большой в мире.
  poster: video/day-17jan-zhukovsky-poster.jpg?v=1
  mp4: video/day-17jan-zhukovsky.mp4?v=1
