story:
  kicker: Пять фактов о Жуковском
  h2: Посчитал раньше, чем полетели
  udary:
    - summary: Немец Кутта посчитал подъёмную силу для одного частного крыла — Жуковский в 1906-м вывел её для любого.
      det:
        - Кутта разобрал частный случай — изогнутую пластину. Общую теорему о подъёмной силе в 1906 году доказал Жуковский, по ней считают крыло любой формы.
      src: 'Источник: «Наука и жизнь», «Центр авиационной науки» — <a href="https://www.nkj.ru/archive/articles/14886/" rel="noopener" target="_blank">nkj.ru/archive/articles/14886</a>'
    - summary: Мёртвую петлю Жуковский рассчитал на бумаге в 1891-м — Нестеров сделал её в небе через 22 года.
      det:
        - В работе «О парении птиц» он впервые вычислил возможные фигуры полёта, в том числе мёртвую петлю. В 1913 году Пётр Нестеров первым в мире выполнил её на «Ньюпоре-4».
      src: 'Источник: Научно-мемориальный музей Н. Е. Жуковского, «Биография» — <a href="https://zhukovskymuseum.ru/biography/" rel="noopener" target="_blank">zhukovskymuseum.ru/biography</a>; «Родина», «Пять главных открытий „отца русской авиации“», 16.03.2014 — <a href="https://rodina-history.ru/2014/03/16/zukovskiy-site.html" rel="noopener" target="_blank">rodina-history.ru</a>'
    - summary: Все истребители Великой Отечественной сперва «летали» в трубах ЦАГИ — института, который пробил Жуковский.
      det:
        - В 1940–1945 годах через большие трубы ЦАГИ прошли все опытные и серийные истребители советских КБ. В Т-101, самой большой дозвуковой трубе Европы (24×14 м), испытывали почти все советские и российские самолёты.
      src: 'Источник: ЦАГИ, «100-летие ЦАГИ в истории: аэродинамические трубы Т-101 и Т-104» — <a href="https://www.tsagi.ru/pressroom/news/4515/" rel="noopener" target="_blank">tsagi.ru/pressroom/news/4515</a>; «Российская газета», 01.03.2023 — <a href="https://rg.ru/2023/03/01/samaia-bolshaia-v-evrope-aerodinamicheskaia-truba-gde-ispytyvaiut-samolety-otkroetsia-dlia-turistov.html" rel="noopener" target="_blank">rg.ru</a>'
    - summary: В кружке Жуковского студент Туполев впервые полетел на планёре, который строил сам, — потом создал больше 100 самолётов.
      det:
        - В 1909 году студент МВТУ Андрей Туполев пришёл в воздухоплавательный кружок Жуковского; в 1910-м впервые полетел на планёре, который строил сам с товарищами. Под его руководством потом создано более 100 типов самолётов.
      src: 'Источник: РИА Новости, «Биография Андрея Туполева» — <a href="https://ria.ru/20131110/975497582.html" rel="noopener" target="_blank">ria.ru/20131110/975497582</a>; «Коммерсантъ», «Вихрь, поднявший на крыло птиц и людей» (более 100 типов) — <a href="https://www.kommersant.ru/doc/2865648" rel="noopener" target="_blank">kommersant.ru/doc/2865648</a>'
    - summary: Первый в Европе аэродинамический институт открылся в 1904 году под Москвой — и вёл его Жуковский.
      det:
        - Институт в Кучине построил на свои деньги Дмитрий Рябушинский и позвал руководить Жуковского. Там же, гуляя в поле, Жуковский пришёл к идее присоединённого вихря.
      src: 'Источник: «Узнай Москву», Н. Е. Жуковский — <a href="https://um.mos.ru/personalities/zhukovskiy_nikolay_egorovich/" rel="noopener" target="_blank">um.mos.ru</a>; «Наука и жизнь» (Рябушинский, Кучино) — <a href="https://www.nkj.ru/archive/articles/14885/" rel="noopener" target="_blank">nkj.ru/archive/articles/14885</a>'
fakty:
  kicker: Пять фактов о Жуковском и трубах
  h2: Факты дня
  udary:
    - summary: <b>Самая большая труба мира — в институте Жуковского.</b> Её запустили в ЦАГИ в последний день 1925 года.
      det:
        - "Труба Т-1-2 заработала в ночь с 31 декабря 1925 на 1 января 1926 года. Она стоит в Москве на улице Радио — там же, где сейчас дом-музей Жуковского. Строили её ученики уже после смерти учителя: Юрьев, Мусинянц, Черёмухин."
        - До войны в ней продували модели самолётов, например истребителя И-16. В 1950-е — проекты экранопланов. Сейчас в ней обдувают ветром модели «Рабочего и колхозницы» и небоскрёбов «Москва-Сити». Трубе сто лет, и она работает.
      src: "Источник: «85 лет первой аэродинамической трубе ЦАГИ», ЦАГИ — https://www.tsagi.ru/pressroom/news/1765/; «Жуковские вести», 23.12.2025 — https://www.zhukvesti.ru/articles/detail/69138/"
      otryvok: «31 декабря исполняется 85 лет со дня ввода в эксплуатацию первой аэродинамической трубы ЦАГИ Т-1-2 , расположенной на улице Радио в Москве . К моменту создания эта уникальная установка была самой большой в мире .» … «В настоящее время эта старейшая аэродинамическая труба ЦАГИ используется для исследований объектов промышленной аэродинамики , таких , например , как модели монументов Зураба Церетели , скульптуры « Рабочий и колхозница » , модели множества высотных зданий , в том числе комплекса «Москва-Сити»»
      stranica: ЦАГИ, Пресс-центр, Новости, «85 лет первой аэродинамической трубе ЦАГИ», 29.12.2010
      href: https://www.tsagi.ru/pressroom/news/1765/
      pometka: документ
    - summary: <b>Трубу изобрели до Жуковского.</b> Первую построили в Англии в 1871 году, и в том же году свою начали строить в Петербурге.
      det:
        - Англичанин Уэнхем продул первые модели крыльев в 1871 году. В том же году военный инженер В. А. Пашкевич начал строить в Петербурге трубу с весами. Но изучал он в ней снаряды, а не крылья.
        - Первым в России продувать в трубе модели для полёта стал Циолковский, в 1897 году. Труба Жуковского 1902 года в Московском университете — 7 метров в длину, 75 на 75 сантиметров в сечении. Это одна из первых в мире труб, где воздух не выдувают, а всасывают.
      src: "Источник: «Tunnel vision», Royal Aeronautical Society — https://www.aerosociety.com/news/tunnel-vision/; «О работах Циолковского по аэродинамике», Государственный музей истории космонавтики — https://readings.gmik.ru/lecture/2004-O-RABOTAH-TSIOLKOVSKOGO-PO-AERODINAMIKE; Летопись МГУ, «Жуковский Николай Егорович» — https://letopis.msu.ru/peoples/8552"
      otryvok: "«Also in 1871, in Russia, a wind tunnel and a three-component aerodynamic balance was designed and constructed by V A Pashkevich at the Mikhailov Artillery Academy, St. Petersburg» (перевод: «Также в 1871 году в России В. А. Пашкевич спроектировал и построил аэродинамическую трубу с трёхкомпонентными весами в Михайловской артиллерийской академии в Санкт-Петербурге»); там же: «the construction in 1871 – 150 years ago – of the world’s first wind tunnel under the auspices of the Aeronautical Society of Great Britain» (перевод: «постройка в 1871 году, 150 лет назад, первой в мире аэродинамической трубы под эгидой Аэронавтического общества Великобритании»). Труба Жуковского: «была построена малая аэродинамическая труба длиной 7 м с квадратным сечением 75х75 см, которая была одной из первых всасывающих труб в мире (1902)». Циолковский: «Первая аэродинамическая труба в России была построена военным инженером В. А. Пашкевичем в 1871-73 гг. Аэродинамическая труба Пашкевича использовалась исключительно для опытов в области баллистики, тогда как Циолковский впервые в России применил аэродинамическую трубу для исследований, связанных с вопросами авиации и воздухоплавания.»"
      stranica: Royal Aeronautical Society, «Tunnel vision» (к 150-летию трубы Уэнхема); Государственный музей истории космонавтики, Чтения Циолковского, 2004; Летопись МГУ, Н. Е. Жуковский
      href: https://www.aerosociety.com/news/tunnel-vision/
      pometka: два источника
    - summary: <b>Книга о велосипедном колесе — с автографом Шухову.</b> Жуковский подарил её автору Шуховской башни.
      det:
        - Инженер Шухов построил знаменитую радиобашню на Шаболовке. А ещё он был заядлым велогонщиком и однажды стал чемпионом Москвы среди любителей. Шухов, кстати, учился у Жуковского.
        - В 1902 году Жуковский выпустил брошюру в 14 страниц «О прочности велосипедного колеса». Экземпляр с надписью «Глубокоуважаемому Владимиру Григорьевичу Шухову от автора» хранится в библиотеке МГТУ имени Баумана.
      src: "Источник: «3 июня — Всемирный день велосипеда», НТБ МГТУ им. Н. Э. Баумана — https://library.bmstu.ru/News/Details/1779; Летопись МГУ, «Жуковский Николай Егорович» — https://letopis.msu.ru/peoples/8552"
      otryvok: "«В 1902 году в знак признания успехов Шухова-велосипедиста русский учёный-механик, основоположник гидро- и аэродинамики Николай Егорович Жуковский подарил ему свою только что вышедшую книгу «О прочности велосипедного колеса», надписав её: «Глубокоуважаемому Владимиру Григорьевичу Шухову от автора». Фонд редких книг НТБ МГТУ им. Н.Э. Баумана: Жуковский Н. Е. О прочности велосипедного колеса / Жуковский Н. Е. - М. : Университетская типография, 1902. - 14 с.»"
      stranica: Научно-техническая библиотека МГТУ им. Н. Э. Баумана, новость «3 июня — Всемирный день велосипеда»
      href: https://library.bmstu.ru/News/Details/1779
      pometka: документ
    - summary: <b>Не стал академиком ради студентов.</b> В 1900 году Жуковский снял свою кандидатуру, чтобы не уезжать из Москвы.
      det:
        - Звание действительного члена Академии наук — высшее для учёного. Но академикам нужно было жить в Петербурге. А Жуковский не хотел бросать Московский университет и Техническое училище.
        - Он сам снял свою кандидатуру и остался преподавать. Академиком он так и не стал. Зато стал «отцом русской авиации».
      src: "Источник: РИА Новости, «Биография Николая Жуковского», 17.01.2017 — https://ria.ru/20170117/1485561584.html; «Узнай Москву», «Жуковский Николай Егорович» — https://um.mos.ru/personalities/zhukovskiy_nikolay_egorovich/"
      otryvok: "«В 1894 году Жуковский был избран в члены‑корреспонденты Петербургской академии наук; в 1900 году был выдвинут кандидатом в действительные члены академии наук, но снял свою кандидатуру, не желая оставлять преподавание в Московском университете и Техническом училище.» (РИА). Второй источник: «…но снял свою кандидатуру, не желая оставлять преподавание в Московском университете и МВТУ, т. к. избрание означало бы переезд в Санкт-Петербург.» («Узнай Москву»)"
      stranica: РИА Новости, «Биография Николая Жуковского», 17.01.2017; «Узнай Москву», «Жуковский Николай Егорович»
      href: https://ria.ru/20170117/1485561584.html
      pometka: два источника
    - summary: <b>Первую статью Циолковского в печать отдал Жуковский.</b> Это была работа 1891 года о полёте.
      det:
        - Учитель Циолковский прислал в Москву рукопись о том, как воздух давит на плоскость, то есть на крыло. Жуковский вместе с физиком Столетовым представил её к печати в научном сборнике.
        - В этой статье Циолковский впервые расчётом и опытом показал, как важна вытянутость крыла. Рукопись хранится в Архиве Российской академии наук.
      src: "Источник: виртуальная выставка «Константин Эдуардович Циолковский. Жизнь, деятельность и память о нем в рукописях и фотографиях», Архив РАН — https://arran.ru/exposition3_1"
      otryvok: «В этой работе К.Э. Циолковский впервые установил аналитически и доказал экспериментально - путем устройства оригинального и простого прибора, значение продолговатости крыла. К напечатанию в Трудах Физического отделения Общества любителей естествознания в Москве она была представлена Н.Е. Жуковским и А.Г. Столетовым.»
      stranica: Архив РАН, виртуальная выставка о К. Э. Циолковском, часть 1; рукопись «Давление жидкости на равномерно движущуюся в ней плоскость», 1891, АРАН, Ф. 555, Оп. 1, Д. 2
      href: https://arran.ru/exposition3_1
      pometka: документ
razdely:
  - posle: story
    html: |-
      <section class="block" id="truba">
        <div class="wrap">
          <div class="kicker">Вопрос, который задают первым</div>
          <h2>Изобрёл ли Жуковский аэродинамическую трубу?</h2>
          <ol class="udary udary-odin">
            <li><details><summary><span>Трубу изобрёл не Жуковский — но трубы, в которых испытывают все наши самолёты, стоят в институте его имени.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Труба Жуковского 1902 года в Московском университете — «одна из первых всасывающих труб в мире» (Летопись МГУ). Первая в России она не была: до неё трубы строили В. А. Пашкевич в Петербурге (в начале 1870-х) и К. Э. Циолковский в Калуге (1897). Первенство у него другое: в 1904 году он возглавил в Кучине первый в Европе аэродинамический институт.</p>
                <p>Из Кучина вырос ЦАГИ — создан в 1918 году по настоянию Жуковского и носит его имя. Сегодня все наши самолёты продувают в трубах ЦАГИ: в Т-101, самой большой дозвуковой трубе Европы, испытывали «практически все советские и российские летательные аппараты».</p>
                <p class="src-note">Источник: РИА Новости, «Биография Николая Жуковского», 17.01.2017 — <a href="https://ria.ru/20170117/1485561584.html" rel="noopener" target="_blank">ria.ru/20170117/1485561584</a>; Летопись МГУ, «Жуковский Николай Егорович» — <a href="https://letopis.msu.ru/peoples/8552" rel="noopener" target="_blank">letopis.msu.ru</a>; Государственный музей истории космонавтики, «О работах Циолковского по аэродинамике» — <a href="https://readings.gmik.ru/lecture/2004-O-RABOTAH-TSIOLKOVSKOGO-PO-AERODINAMIKE" rel="noopener" target="_blank">readings.gmik.ru</a>; «Узнай Москву» — <a href="https://um.mos.ru/personalities/zhukovskiy_nikolay_egorovich/" rel="noopener" target="_blank">um.mos.ru</a>; «Российская газета» со ссылкой на ЦАГИ, 01.03.2023 — <a href="https://rg.ru/2023/03/01/samaia-bolshaia-v-evrope-aerodinamicheskaia-truba-gde-ispytyvaiut-samolety-otkroetsia-dlia-turistov.html" rel="noopener" target="_blank">rg.ru</a></p>
              </div></details></li>
          </ol>
        </div>
      </section>
  - posle: pervenstvo
    html: |-
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2>Для тех, кто смотрит внимательно</h2>
          <details class="deepd">
            <summary>Четыре сюжета подробно — развернуть</summary>
            <h3>Что такое циркуляция — на пальцах</h3>
            <p>Представь, что к обычному потоку воздуха добавили медленный круговорот вокруг крыла. Над крылом он идёт по течению — воздух там бежит быстрее, под крылом против течения — медленнее. Разница и толкает крыло вверх. Жуковский доказал: сила равна плотности воздуха, умноженной на скорость потока и на силу этого круговорота, циркуляцию. Нет круговорота — нет силы.</p>
            <h3>1904, 1905 или 1906?</h3>
            <p>Все три года верны, но про разное. 1 октября 1904 года — идея на прогулке в Кучине. 15 (28) ноября 1905 года — доклад «О присоединённых вихрях» в Московском математическом обществе. 1906 год — печатная работа. Поэтому на странице главный год — 1906-й: с публикации формулу мог проверить любой.</p>
            <h3>Откуда слова «отец русской авиации»</h3>
            <p>Это не прозвище из учебника, а строка государственного документа: так Жуковский назван в постановлении Совнаркома от 3 декабря 1920 года к 50-летию его научной деятельности. Постановление напечатали «Известия» № 276 от 8 декабря 1920 года.</p>
            <h3>Почему крыло сваливается</h3>
            <p>Теорема Жуковского объясняет и опасность: подъёмная сила держится, пока держится закрутка вокруг крыла. Если поднять нос слишком круто, поток над крылом срывается, вихрь уносит назад — и сила пропадает. Именно это ты видел в модели.</p>
          </details>
          <div class="src">Источники: zhukovskymuseum.ru · nkj.ru · rodina-history.ru · tsagi.ru · rg.ru · kommersant.ru · docs.historyrussia.org · gufo.me · ria.ru · um.mos.ru · gmik.ru</div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="mirovoy-kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2>Что в это время делал мир</h2>
          <p>Тысяча девятьсот шестой. 27 апреля (10 мая) в Петербурге открылась I Государственная дума — первый парламент России; она проработала всего 72 дня. Страна спорит о власти и законе.</p>
          <p>А в Москве профессор Жуковский печатает работу «О присоединённых вихрях». Летать к этому времени уже пробуют — но крыло строят на глаз и проверяют падением. Формула, по которой силу крыла можно посчитать заранее, переводит это дело из смелых опытов в инженерный расчёт.</p>
          <p>Отсюда вывод, ради которого этот день стоит в календаре: <b>наукой авиация стала тогда, когда кто-то объяснил, почему крыло держит.</b> Объяснил это Жуковский.</p>
          <p class="src-note">Источник: Президентская библиотека им. Б. Н. Ельцина, «Открылась I Государственная дума» — https://www.prlib.ru/history/619233</p>
        </div>
      </section>
