  - posle: quiz
    html: |-
      <section class="block iz-u13" id="fork">
        <div class="wrap">
          <div class="kicker">Твой выбор</div>
          <h2>А как поступил бы ты?</h2>
          <p>1904 год, Кучино. У тебя аэродинамическая лаборатория, а в мире — смельчаки, которые строят летательные аппараты наугад и разбиваются. Никто не может объяснить, почему крыло вообще держит. Ты на месте Жуковского — что делаешь?</p>
          <div class="fork-opt">🛩 Строю аппараты и пробую, пока какой-нибудь не полетит</div>
          <div class="fork-opt">📐 Ищу закон: почему крыло держит — и как это посчитать</div>
          <div class="fork-opt">⏳ Жду, пока авиаторы сами разберутся на опыте</div>
          <div id="forkReal" class="exp iz-u15"><b>Как было на самом деле.</b> Жуковский искал закон. 1 октября 1904 года на прогулке у Кучинской лаборатории он пришёл к идее присоединённых вихрей, в ноябре 1905-го доложил её в Московском математическом обществе, а в 1906-м напечатал. С этой формулой подъёмную силу крыла стало можно рассчитать до полёта.</div>
        </div>
