story:
  kicker: Главное событие дня
  h2: Посчитал раньше, чем полетели
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: До Жуковского крыло подбирали на глаз и проверяли падением. В 1906 году он вывел, откуда берётся подъёмная сила, — для крыла любой формы.
      det:
        - 'В работе «О присоединённых вихрях» Жуковский доказал теорему: подъёмная сила равна произведению плотности воздуха, скорости потока и «присоединённого вихря» вокруг крыла. По этой теореме крыло считают на бумаге — до того, как его построят.'
      src: 'Источник: Математическая энциклопедия, «Жуковского теорема» — <a href="https://gufo.me/dict/mathematics_encyclopedia/Жуковского_Теорема" rel="noopener" target="_blank">gufo.me</a>; «Наука и жизнь», «Центр авиационной науки» — <a href="https://www.nkj.ru/archive/articles/14886/" rel="noopener" target="_blank">nkj.ru/archive/articles/14886</a>'
    - summary: 1 декабря 1918 года по предложению Жуковского создан ЦАГИ — Центральный аэрогидродинамический институт. С 1921 года он носит имя Жуковского.
      det:
        - Институт вырос из лаборатории Московского высшего технического училища, где работали ученики Жуковского. Сам Жуковский возглавлял ЦАГИ до своей смерти в марте 1921 года.
      src: 'Источник: «Узнай Москву», Н. Е. Жуковский — <a href="https://um.mos.ru/personalities/zhukovskiy_nikolay_egorovich/" rel="noopener" target="_blank">um.mos.ru</a>; РИА Новости, «Биография Николая Жуковского», 17.01.2017 — <a href="https://ria.ru/20170117/1485561584.html" rel="noopener" target="_blank">ria.ru</a>'
    - summary: Все истребители Великой Отечественной сперва «летали» в трубах ЦАГИ — института, который пробил Жуковский.
      det:
        - В 1940–1945 годах через большие трубы ЦАГИ прошли все опытные и серийные истребители советских КБ. В Т-101, самой большой дозвуковой трубе Европы (24×14 м), испытывали почти все советские и российские самолёты.
      src: 'Источник: ЦАГИ, «100-летие ЦАГИ в истории: аэродинамические трубы Т-101 и Т-104» — <a href="https://www.tsagi.ru/pressroom/news/4515/" rel="noopener" target="_blank">tsagi.ru/pressroom/news/4515</a>; «Российская газета», 01.03.2023 — <a href="https://rg.ru/2023/03/01/samaia-bolshaia-v-evrope-aerodinamicheskaia-truba-gde-ispytyvaiut-samolety-otkroetsia-dlia-turistov.html" rel="noopener" target="_blank">rg.ru</a>'
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Жуковском
    h2: Трубы, крылья и худший математик
    udary:
      - summary: <b>Студенты сами построили трубу — и через год им пришлось её продать.</b>
        det:
          - Деньги на трубы кружок Жуковского в 1909 году собрал сам, устроив воздухоплавательную выставку. Уже в 1910-м денег не хватило, и обе трубы, плоскую и круглую, студенты продали собственному училищу.
          - На этих трубах выросла лаборатория Московского высшего технического училища, а из неё — ЦАГИ.
        src: "Источник: Научно-мемориальный музей профессора Н. Е. Жуковского, «Плоская аэродинамическая труба» — https://zhukovskymuseum.ru/ploskaya-truba/"
        otryvok: «Деньги на постройку получили от организованной членами кружка воздухоплавательной выставки… Однако уже в 1910 г. из-за недостатка средств кружок был вынужден продать построенные им трубы (кроме плоской, была еще и круглая) Московскому техническому училищу».
        stranica: Научно-мемориальный музей профессора Н. Е. Жуковского, «Плоская аэродинамическая труба»
        href: https://zhukovskymuseum.ru/ploskaya-truba/
        pometka: документ
        utverzhdeno: Р297
      - summary: <b>Трубу строил студент Туполев, хотя «никто путём не знал, как их надо строить».</b>
        det:
          - Жуковский поручил постройку молодому Андрею Туполеву. Деревянная труба кружка разгоняла ветер до 36 м/с — такого потока тогда не было ни у одной трубы.
          - Она проработала до 1950 года, сорок с лишним лет, и стоит теперь в музее Жуковского.
        src: "Источник: Научно-мемориальный музей профессора Н. Е. Жуковского, «Плоская аэродинамическая труба» — https://zhukovskymuseum.ru/ploskaya-truba/"
        otryvok: «„Когда Николай Егорович поручил мне постройку, у меня не возникло никаких колебаний…, не задумываясь ни одной минуты, я приступил к делу и стал строить аэродинамические трубы, а ведь тогда никто путем не знал, как их надо строить“». — «…максимальная скорость потока в трубе повысилась до 36 м/с. Это была первая аэродинамическая труба того времени с потоком такой скорости». — «…передана в Московский авиационный институт (МАИ), где проработала до 1950 г.»
        stranica: Научно-мемориальный музей профессора Н. Е. Жуковского, «Плоская аэродинамическая труба»
        href: https://zhukovskymuseum.ru/ploskaya-truba/
        pometka: документ
        utverzhdeno: Р297
      - summary: <b>Отец авиации спас Москву от лопающихся водопроводных труб.</b>
        det:
          - В Москве и других городах магистральные трубы вдруг рвались, и целые районы оставались без воды. Главный инженер водопровода Николай Зимин обратился к своему учителю Жуковскому.
          - Тот построил опытную сеть из труб разной толщины и нашёл виновника — гидравлический удар от резко закрытой задвижки. В игре ниже можно попробовать самому.
        src: "Источник: «Родина», «Пять главных открытий „отца русской авиации“ Николая Егоровича Жуковского», 16.03.2014 — https://rodina-history.ru/2014/03/16/zukovskiy-site.html"
        otryvok: «…часто происходили разрывы магистральных труб водопроводов. Из-за этого воды лишались целые районы. Главный инженер московского водопровода Николай Зимин, отчаявшись решить эту проблему, обратился к своему бывшему учителю Николаю Жуковскому. Ученый построил экспериментальную сеть из труб разных диаметров и выяснил, что причиной разрывов стал гидравлический удар».
        stranica: «Родина», 16.03.2014, «Пять главных открытий „отца русской авиации“»
        href: https://rodina-history.ru/2014/03/16/zukovskiy-site.html
        pometka: документ
        utverzhdeno: Р297
      - summary: <b>Подземная вода «дышит» вместе с погодой — и Жуковский это измерил.</b>
        det:
          - В песках, которые питают родники, капли воды перемешаны с пузырьками воздуха. Когда растёт атмосферное давление, пузырьки сжимаются и уровень воды падает.
          - По величине этого колебания Жуковский научился оценивать запасы источника. По словам журнала «Родина», так считают до сих пор и в нефтяном деле.
        src: "Источник: «Родина», 16.03.2014 — https://rodina-history.ru/2014/03/16/zukovskiy-site.html"
        otryvok: «…в водоносных песках, которые питали подземные ключи, капли воды перемешаны с пузырьками воздуха. Когда атмосферное давление повышалось, пузырьки сжимались, из-за чего уровень вод понижался. Жуковский сделал вывод, что величина этого колебания зависит от объема источника… Это открытие сегодня широко применяется в нефтяной промышленности».
        stranica: «Родина», 16.03.2014, «Пять главных открытий „отца русской авиации“»
        href: https://rodina-history.ru/2014/03/16/zukovskiy-site.html
        pometka: документ
        utverzhdeno: Р297
      - summary: <b>Будущий великий механик три года был худшим математиком в классе.</b>
        det:
          - В гимназии мальчик витал в облаках. Учитель звал его «певчей птицей» и не ждал от «маменькиного сынка» ничего путного.
          - Потом, по словам биографа, детский ум «попал в свою стихию» — и худший математик стал отцом русской авиации.
        src: "Источник: Л. Гумилевский, «Николай Егорович Жуковский», сборник «Великие русские люди» — https://biography.wikireading.ru/73021"
        otryvok: «В первых трех классах Жуковский был самым плохим математиком из-за своей рассеянности». — «Малинин никогда не называл его иначе как „певчей птицей“ — не то за его тонкий, высокий голос, не то за неумение считать…»
        stranica: Л. Гумилевский, «Николай Егорович Жуковский», сборник «Великие русские люди» (копия текста книги)
        href: https://biography.wikireading.ru/73021
        pometka: документ
        utverzhdeno: Р297
      - summary: <b>Отец русской авиации поднялся в воздух лишь однажды — и зарёкся летать.</b>
        det:
          - В сентябре 1900 года Жуковского позвали на Всемирный воздухоплавательный конгресс в Париже и предложили подняться на воздушном шаре. Наверху ему стало плохо.
          - Больше он не летал никогда, ни на шаре, ни на самолёте. Зато вернулся с твёрдой мыслью, что будущее не за шарами, которые несёт ветер, а за машинами тяжелее воздуха.
        src: 'Источник: «Аргументы и факты», «В чём сила, отец? Его формула дала авиации больше, чем полёт братьев Райт» — <a href="https://aif.ru/society/history/v_chyom_sila_otec_ego_formula_dala_aviacii_bolshe_chem_polyot_bratev_rayt" rel="noopener">aif.ru/society/history</a>; «Владимирские ведомости», 07.08.2022 — <a href="https://vedom.ru/news/2022/08/07/55776-orehovo-otca-russkoy-aviacii" rel="noopener">vedom.ru/news/2022/08/07</a>.'
        otryvok: «Примечательно, что Николай Егорович за всю свою жизнь на самолёте так ни разу и не слетал, а в воздух поднимался лишь однажды. Случилось это в сентябре 1900 года, когда он участвовал во Всемирном воздухоплавательном конгрессе в Париже. Там учёному предложили совершить полёт на воздушном шаре. На высоте он почувствовал себя неважно…» (АиФ). — «Интересно, что сам Жуковский летал всего один раз. В Париже, на выставке, поднялся в небо на воздушном шаре. Но ему сделалось так дурно, что он зарекся от полетов» («Владимирские ведомости»).
        stranica: «Аргументы и факты», «В чём сила, отец?»; «Владимирские ведомости», «Отца русской авиации Николая Жуковского окрыляло родное имение Орехово», 2022
        href: https://aif.ru/society/history/v_chyom_sila_otec_ego_formula_dala_aviacii_bolshe_chem_polyot_bratev_rayt
        pometka: два источника
      - summary: <b>Мёртвую петлю Жуковский рассчитал на бумаге за 22 года до того, как её сделали в небе.</b>
        det:
          - В 1891 году, когда самолётов ещё не было, Жуковский в работе «О парении птиц» вычислил, какие фигуры может выписывать в воздухе парящее тело. Среди них была и «мёртвая петля».
          - В 1913 году русский лётчик Пётр Нестеров впервые в мире сделал петлю на самолёте. По данным АиФ, перед этим он советовался с Жуковским.
        src: 'Источник: Научно-мемориальный музей профессора Н. Е. Жуковского, «Биография» — <a href="https://zhukovskymuseum.ru/biography/" rel="noopener">zhukovskymuseum.ru/biography</a>; «Аргументы и факты», «В чём сила, отец?» — <a href="https://aif.ru/society/history/v_chyom_sila_otec_ego_formula_dala_aviacii_bolshe_chem_polyot_bratev_rayt" rel="noopener">aif.ru/society/history</a>.'
        otryvok: «Опубликована работа „О парении птиц“, в которой исследуется механизм парения с набором высоты и впервые вычисляются возможные эволюции при парении, в том числе „мертвая петля“ (петля Нестерова, 1913 г.)» (музей). — «…в 1913-м русский лётчик Пётр Нестеров впервые в истории выполнит эту фигуру высшего пилотажа на самолёте. Прежде чем сделать её, Нестеров посоветуется с Жуковским» (АиФ).
        stranica: Научно-мемориальный музей профессора Н. Е. Жуковского, «Биография Н. Е. Жуковского»; «Аргументы и факты», «В чём сила, отец?»
        href: https://zhukovskymuseum.ru/biography/
        pometka: два источника
      - summary: <b>Жуковского выдвинули в академики — а он сам снял свою кандидатуру.</b>
        det:
          - В 1900 году Жуковского выдвинули в действительные члены Петербургской академии наук — высшее звание для учёного в России.
          - Но академику пришлось бы переехать в Петербург и бросить студентов Московского университета и Технического училища. Жуковский отказался и преподавал в Москве до конца жизни.
        src: 'Источник: «Узнай Москву», «Жуковский Николай Егорович» — <a href="https://um.mos.ru/personalities/zhukovskiy_nikolay_egorovich/" rel="noopener">um.mos.ru/personalities</a>; РИА Новости, «Биография Николая Жуковского», 17.01.2017 — <a href="https://ria.ru/20170117/1485561584.html" rel="noopener">ria.ru/20170117/1485561584</a>.'
        otryvok: «В 1900 году он был выдвинут кандидатом в действительные члены академии, но снял свою кандидатуру, не желая оставлять преподавание в Московском университете и МВТУ, т. к. избрание означало бы переезд в Санкт-Петербург» («Узнай Москву»). — «…в 1900 году был выдвинут кандидатом в действительные члены академии наук, но снял свою кандидатуру, не желая оставлять преподавание в Московском университете и Техническом училище» (РИА Новости).
        stranica: «Узнай Москву», «Жуковский Николай Егорович»; РИА Новости, «Биография Николая Жуковского», 2017
        href: https://um.mos.ru/personalities/zhukovskiy_nikolay_egorovich/
        pometka: два источника
      - summary: <b>Прозвище «отец русской авиации» вписали в правительственный декрет.</b>
        det:
          - В декабре 1920 года вышел декрет Совнаркома за подписью Ленина к 50-летию научной работы Жуковского. В нём его прямо назвали «отцом русской авиации».
          - Декрет учредил премию имени Жуковского за лучшие труды по математике и механике, издание его трудов и льготы самому учёному. Жить ему оставалось три месяца.
        src: 'Источник: РИА Новости, «Биография Николая Жуковского», 17.01.2017 — <a href="https://ria.ru/20170117/1485561584.html" rel="noopener">ria.ru/20170117/1485561584</a>; Государственная научная педагогическая библиотека им. К. Д. Ушинского, «Николай Егорович Жуковский» (по Большой советской энциклопедии) — <a href="https://dates.gnpbu.ru/2-7/Zhukovsky/zhukovsky.html" rel="noopener">dates.gnpbu.ru</a>.'
        otryvok: «В 1920 году был издан специальный декрет Совета Народных Комиссаров за подписью Ленина об учреждении, в ознаменование 50‑летия научной деятельности Жуковского и огромных заслуг его как „отца русской авиации“, годичной премии его имени за лучшие труды по математике и механике, а также о ряде льгот для самого Жуковского» (РИА). — «…об учреждении премии им. Н. Е. Жуковского за лучшие труды по математике и механике, об издании трудов Жуковского, а также о ряде льгот для самого ученого» (ГНПБ).
        stranica: РИА Новости, «Биография Николая Жуковского», 2017; ГНПБ им. К. Д. Ушинского, «Николай Егорович Жуковский»
        href: https://ria.ru/20170117/1485561584.html
        pometka: два источника
      - summary: <b>В Первую мировую профессор сам руководил опытами со сбросом зажигательных бомб с аэропланов.</b>
        det:
          - Когда началась война, Жуковский взялся за военные задачи. Он лично наблюдал, как с аэропланов бросают зажигательные бомбы, испытывал модели бомб и стрелы, которые сбрасывали с самолётов.
          - Он разработал теорию бомбометания — как рассчитать, куда упадёт бомба, — и читал в университете курс «Внешняя баллистика и метание бомб с аэропланов».
        src: 'Источник: Летопись Московского университета, «Учёные в помощь фронту // Московский университет в Первой мировой войне» — <a href="http://letopis.msu.ru/content/uchyonye-v-pomoshch-frontu-moskovskiy-universitet-v-pervoy-mirovoy-voyne" rel="noopener">letopis.msu.ru</a>; «Узнай Москву», «Жуковский Николай Егорович» — <a href="https://um.mos.ru/personalities/zhukovskiy_nikolay_egorovich/" rel="noopener">um.mos.ru/personalities</a>.'
        otryvok: «По его указанию был спроектирован и заказан прибор для определения сопротивления стрел, бросаемых с аэропланов при больших скоростях. Исследовались баллистические свойства моделей бомб… Он лично руководил научными наблюдениями над бросанием зажигательных бомб с аэропланов и читал… в университете – спецкурс „Внешняя баллистика и метание бомб с аэропланов“» (Летопись МГУ). — «Во время Первой мировой войны 1914-1918 годов Н. Е. Жуковский разрабатывал теорию бомбометания…» («Узнай Москву»).
        stranica: Летопись Московского университета, «Учёные в помощь фронту»; «Узнай Москву», «Жуковский Николай Егорович»
        href: http://letopis.msu.ru/content/uchyonye-v-pomoshch-frontu-moskovskiy-universitet-v-pervoy-mirovoy-voyne
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ректор в 73 года, велосипед с крыльями и «НЕЖ»
    udary:
      - summary: <b>Курсы для лётчиков выросли в военный институт — и его первым ректором стал 73-летний Жуковский.</b>
        det:
          - В Первую мировую Жуковский устроил при Техническом училище теоретические курсы авиации для лётчиков-добровольцев — учили четыре месяца. До конца 1917 года курсы выпустили 242 специалиста.
          - Из курсов вырос Институт инженеров Красного Воздушного флота. В сентябре 1920 года его первым ректором стал сам Жуковский, которому было 73 года. Сегодня это Военно-воздушная академия его имени.
        src: 'Источник: Московский авиационный институт, «Из истории высшего авиационного образования в России» — <a href="https://mai.ru/common/university/history/years/" rel="noopener">mai.ru/common/university/history/years</a>; Научно-мемориальный музей профессора Н. Е. Жуковского, «Биография» — <a href="https://zhukovskymuseum.ru/biography/" rel="noopener">zhukovskymuseum.ru/biography</a>.'
        otryvok: «При ИМТУ организованы теоретические курсы авиации для летчиков-добровольцев авиационной школы Московского общества воздухоплавания. Срок обучения — 4 месяца… Лекции на курсах читали Н. Е. Жуковский, В. П. Ветчинкин и другие. С осени 1914 года по декабрь 1917 теоретические курсы авиации при ИМТУ выпустили 242 специалиста» (МАИ). — «26 сентября 1920 года организован Институт инженеров Красного Воздушного флота, где Жуковский был первым ректором. Впоследствии институт переименован в Военно-воздушную инженерную академию» (музей).
        stranica: МАИ, «Из истории высшего авиационного образования в России»; Научно-мемориальный музей профессора Н. Е. Жуковского, «Биография Н. Е. Жуковского»
        href: https://mai.ru/common/university/history/years/
        pometka: два источника
      - summary: <b>Крестьяне видели, как бородатый барин гоняет по полю на велосипеде с крыльями.</b>
        det:
          - Летом в родном имении Орехово под Владимиром Жуковский катался по аллеям и полю на трёхколёсном велосипеде. За спиной — крылья из бамбука, обтянутые тканью, которые он сделал сам.
          - Разгоняясь с разной скоростью, он проверял, как воздух давит на крыло. Это были его первые опыты с подъёмной силой — задолго до знаменитой теоремы.
        src: 'Источник: «Аргументы и факты», «В чём сила, отец?» — <a href="https://aif.ru/society/history/v_chyom_sila_otec_ego_formula_dala_aviacii_bolshe_chem_polyot_bratev_rayt" rel="noopener">aif.ru/society/history</a>; «Владимирские ведомости», 07.08.2022 — <a href="https://vedom.ru/news/2022/08/07/55776-orehovo-otca-russkoy-aviacii" rel="noopener">vedom.ru/news/2022/08/07</a>; «Жуковские вести», «Мечта о крыльях» — <a href="https://www.zhukvesti.ru/articles/detail/28093/" rel="noopener">zhukvesti.ru/articles/detail/28093</a>.'
        otryvok: «Проводя летние месяцы в родительском доме под Владимиром, исследователь разъезжал на велосипеде по окрестностям с крыльями за спиной, чем приводил в недоумение местных крестьян. Каркас крыльев он делал из бамбука и обтягивал его тканью. Разгоняясь до разных скоростей, Жуковский пытался понять, как возникает и действует подъёмная сила» (АиФ). — «По аллеям парка в усадьбе он ездил на трехколесном французском велосипеде с приделанными за спиной крыльями, которые сконструировал сам. Так испытывал давление воздуха на крыло при быстром движении» («Владимирские ведомости»). — «Первые опыты по определению подъемной силы крыла были задуманы им и проведены на велосипеде – за околицей Орехова» («Жуковские вести»).
        stranica: «Аргументы и факты», «В чём сила, отец?»; «Владимирские ведомости», 2022; «Жуковские вести», «Мечта о крыльях»
        href: https://aif.ru/society/history/v_chyom_sila_otec_ego_formula_dala_aviacii_bolshe_chem_polyot_bratev_rayt
        pometka: два источника
      - summary: <b>Миллионер построил для Жуковского институт — а через два года отказался от его помощи.</b>
        det:
          - В 1904 году в Кучино под Москвой на деньги промышленника Дмитрия Рябушинского открылся аэродинамический институт, первый в Европе. Только до 1905 года Рябушинский вложил в него 100 тысяч рублей. Научным руководителем стал Жуковский.
          - Но завистники стали говорить, что все успехи молодого хозяина — от денег и от Жуковского. Самолюбивый Рябушинский в 1906 году отказался от помощи профессора и дальше работал сам. После революции этот институт вошёл в ЦАГИ.
        src: 'Источник: «Научная Россия», «Мечты о небе. Более 100 лет со дня открытия Аэродинамического института», 06.05.2023 — <a href="https://scientificrussia.ru/articles/mecty-o-nebe-bolee-100-let-so-dna-otkrytia-aerodinamiceskogo-instituta" rel="noopener">scientificrussia.ru/articles</a>; «Наука и жизнь», «Центр авиационной науки» — <a href="https://www.nkj.ru/archive/articles/14886/" rel="noopener">nkj.ru/archive/articles/14886</a>.'
        otryvok: «На создание института Д.П. Рябушинский потратил 100 тыс. рублей, и это только до 1905 г. Институтом первоначально руководил Н.Е. Жуковский, который числился его „почетным сотрудником“… Некоторые завистники стали приписывать все успехи молодого Рябушинского его капиталу и руководству Жуковского. Это привело к тому, что молодой и самолюбивый Дмитрий Павлович в 1906 г. отказался от помощи Н.Е. Жуковского и продолжил работу в институте самостоятельно» («Научная Россия»). — «В 1904 году по инициативе и на средства промышленника Дмитрия Павловича Рябушинского в Кучине под Москвой был создан аэродинамический институт, которым с 1904 по 1906 год руководил Н. Е. Жуковский» («Наука и жизнь»).
        stranica: «Научная Россия», «Мечты о небе», 2023; «Наука и жизнь», «Центр авиационной науки»
        href: https://scientificrussia.ru/articles/mecty-o-nebe-bolee-100-let-so-dna-otkrytia-aerodinamiceskogo-instituta
        pometka: два источника
      - summary: <b>На пропеллерах ставили три буквы — «НЕЖ». Это инициалы Жуковского.</b>
        det:
          - "С 1912 года Жуковский создавал теорию воздушного винта — как должны быть устроены лопасти, чтобы винт лучше тянул. По его расчётам делали винты с маркой «НЕЖ»: Николай Егорович Жуковский."
          - Его же именем называли профили крыла и рули. А по его теории винта и сегодня проектируют пропеллеры большинства винтовых самолётов.
        src: 'Источник: Ростех, «Академик неба: главные открытия Николая Жуковского», 17.01.2025 — <a href="https://rostec.ru/media/news/akademik-neba-glavnye-otkrytiya-nikolaya-zhukovskogo/" rel="noopener">rostec.ru/media/news</a>; «100 великих научных достижений России», глава «Аэродинамика и теория авиации Жуковского» (копия книги) — <a href="https://tech.wikireading.ru/hGBs9U2I6R" rel="noopener">tech.wikireading.ru/hGBs9U2I6R</a>.'
        otryvok: «В 1912 году начинаются исследования Жуковского по вихревой теории гребного винта. На основе этой теории сегодня проектируют и строят пропеллеры большинства современных винтовых и турбовинтовых самолетов. А винты с инициалами ученого „НЕЖ“ производились и имели успех» (Ростех). — «Теоретические профили, открытые Жуковским, назвали по его имени – „профилями НЕЖ“, „обобщенными профилями НЕЖ“ и „рулями НЕЖ“» («100 великих научных достижений России»).
        stranica: "Ростех, «Академик неба: главные открытия Николая Жуковского», 2025; «100 великих научных достижений России»"
        href: https://rostec.ru/media/news/akademik-neba-glavnye-otkrytiya-nikolaya-zhukovskogo/
        pometka: два источника
      - summary: <b>В 1919 году в глухую деревню прилетел самолёт, а посадкой командовал 72-летний профессор.</b>
        det:
          - Ученики Жуковского Борис Стечкин и Егоров-Уткин прилетели на самолёте прямо в его родное Орехово. Поглядеть на «чудо чудное» сбежались крестьяне со всей округи.
          - Посадкой руководил сам 72-летний Жуковский — тот, кто за всю жизнь на самолёте так и не полетел.
        src: 'Источник: «Жуковские вести», «Мечта о крыльях. Ко дню рождения Николая Егоровича Жуковского» — <a href="https://www.zhukvesti.ru/articles/detail/28093/" rel="noopener">zhukvesti.ru/articles/detail/28093</a>.'
        otryvok: «В 1919-м любимые ученики Николая Егоровича – Стечкин и Егоров-Уткин прилетали в Орехово на самолете. Посмотреть на „чудо чудное“ тогда собрались крестьяне со всей округи, а 72-летний Жуковский лично руководил посадкой».
        stranica: «Жуковские вести», «Мечта о крыльях. Ко дню рождения Николая Егоровича Жуковского»
        href: https://www.zhukvesti.ru/articles/detail/28093/
        pometka: документ
