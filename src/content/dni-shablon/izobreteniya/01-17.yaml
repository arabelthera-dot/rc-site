return:
  q: Отчего в Москве лопались трубы водопровода — и кто нашёл причину?
  a: Гидравлический удар от резко закрытой задвижки. Причину нашёл Жуковский на опытной сети труб, по просьбе своего ученика, инженера водопровода Николая Зимина.
  src: «Родина», 16.03.2014
audioguide:
  audioSrc: audio-guide-zhukovsky-ru.mp3
  durationLabel: 5 минут 30 секунд
  lead: 'Голос ведёт по залу аэродинамики: от Жуковского у доски через мёртвую петлю на бумаге и игру с планёрами до формулы, по которой считают любое крыло. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу.'
  stops:
    - t: 0
      mark: '0:00'
      title: Профессор у доски
    - t: 52
      mark: '0:52'
      title: Посчитал раньше, чем полетели
    - t: 93
      mark: '1:33'
      title: Трубы, кружок и Кучино
    - t: 138
      mark: '2:18'
      title: Чья это труба
    - t: 182
      mark: '3:02'
      title: Наугад или по формуле
    - t: 239
      mark: '3:59'
      title: Что он сделал
    - t: 292
      mark: '4:52'
      title: Почему крыло держит
  transcript:
    - '<p>«Здравствуйте. Мы в зале аэродинамики как науки. Посмотрите на обложку: седой профессор с бородой стоит у доски в аудитории, а на доске мелом нарисованы профиль крыла, линии обтекания и формулы. Это Николай Егорович Жуковский, он читает курс «Теоретические основы воздухоплавания» в Московском высшем техническом училище. Он родился семнадцатого января тысяча восемьсот сорок седьмого года, в этот самый день календаря. Главная мысль такая: Жуковский вывел, откуда берётся подъёмная сила, и авиация из авантюры стала наукой. Под обложкой полоса из четырёх чисел. Тысяча восемьсот девяносто первый — мёртвая петля на бумаге. Тысяча девятьсот четвёртый — первый в Европе аэродинамический институт. Тысяча девятьсот шестой — подъёмная сила любого крыла. И тысяча девятьсот восемнадцатый — по его настоянию создан ЦАГИ. Пройдём по залу по порядку.»</p>'
    - '<p>«Ниже найдите пять фактов о Жуковском. Каждый можно развернуть кнопкой «Узнать подробнее». Первый факт про немецкого учёного Кутту. Кутта посчитал подъёмную силу для одного частного крыла, изогнутой пластины. А Жуковский в тысяча девятьсот шестом году доказал общую теорему: по ней считают крыло любой формы. Второй факт про мёртвую петлю. В работе «О парении птиц», в тысяча восемьсот девяносто первом году, Жуковский впервые вычислил возможные фигуры полёта, и среди них мёртвую петлю. А в небе её первым в мире выполнил Пётр Нестеров на «Ньюпоре-четыре» в тысяча девятьсот тринадцатом году. Через двадцать два года после расчёта.»</p>'
    - '<p>«Третий факт: все истребители Великой Отечественной сперва «летали» в трубах ЦАГИ. С тысяча девятьсот сорокового по тысяча девятьсот сорок пятый год через большие трубы ЦАГИ прошли все опытные и серийные истребители советских конструкторских бюро. Четвёртый факт про Туполева. В тысяча девятьсот девятом году студент Андрей Туполев пришёл в воздухоплавательный кружок Жуковского, а в тысяча девятьсот десятом впервые полетел на планёре, который строил сам с товарищами. Потом под его руководством создано больше ста типов самолётов. Пятый факт: первый в Европе аэродинамический институт открылся в тысяча девятьсот четвёртом году под Москвой, в Кучине. Построил его на свои деньги Дмитрий Рябушинский и позвал руководить Жуковского. Там же, гуляя в поле, Жуковский пришёл к идее присоединённого вихря.»</p>'
    - '<p>«Дальше вопрос, который задают первым: изобрёл ли Жуковский аэродинамическую трубу? Честный ответ: нет, трубу изобрёл не он. Его труба тысяча девятьсот второго года в Московском университете — одна из первых в мире всасывающих труб. Первой в России она не была: раньше трубы строили Пашкевич в Петербурге и Циолковский в Калуге. Его первенство другое: институт в Кучине. Из Кучина вырос ЦАГИ, он носит имя Жуковского. Сегодня все наши самолёты продувают в трубах ЦАГИ, а в самой большой дозвуковой трубе Европы испытывали практически все советские и российские летательные аппараты. Посмотрите на второй снимок: Жуковский стоит у стены в строящейся аэродинамической трубе, рядом на станине большой вентилятор с двухлопастным пропеллером. Это лаборатория Московского высшего технического училища, тысяча девятьсот шестнадцатый год.»</p>'
    - '<p>«Теперь игра «Подними пилота: наугад — или по формуле». До тысяча девятьсот шестого года крыло подбирали на глаз и проверяли падением. Попробуйте так же. Первый пилот весит семьдесят килограммов, у каждого следующего вес свой. Сдвиньте ползунок «Угол крыла» и нажмите «В воздух». Мало угла — планёр клюёт носом. Много — нос задирается, поток срывается, планёр сваливается. Счётчик покажет, сколько планёров разбито. Разбив пару, включите «Глазами Жуковского». Теперь видно вихрь вокруг крыла и стрелку силы. Поставьте угол так, чтобы зелёная стрелка дошла до красной черты, и пилот полетит с первого раза. Честная оговорка: это модель, а не расчёт. Вес пилотов, предел угла в пятнадцать градусов и запас плюс-минус шесть процентов заданы программой. Сколько планёров разбили до тысяча девятьсот шестого года на самом деле, игра не утверждает.»</p>'
    - '<p>«Следующая остановка — что именно сделал Жуковский. Он вывел и доказал теорему о подъёмной силе крыла: сила равна плотности воздуха, умноженной на скорость потока и на циркуляцию. На пальцах это так: к потоку воздуха добавили медленный круговорот вокруг крыла. Над крылом воздух бежит быстрее, под крылом медленнее, и разница толкает крыло вверх. Нет круговорота — нет силы. Найдите ленту дат. Первого октября тысяча девятьсот четвёртого года — идея на прогулке в Кучине. В ноябре тысяча девятьсот пятого — доклад «О присоединённых вихрях» в Московском математическом обществе. Тысяча девятьсот шестой — печатная работа, с неё формулу мог проверить любой. Первого декабря тысяча девятьсот восемнадцатого по его предложению создан ЦАГИ. В Германии к той же формуле независимо подошёл Мартин Кутта, и в мире её называют теоремой Кутты — Жуковского.»</p>'
    - '<p>«Итог зала. В тысяча девятьсот шестом году летать уже пробовали, но крыло строили на глаз и проверяли падением. Формула Жуковского перевела это дело из смелых опытов в инженерный расчёт. Наукой авиация стала тогда, когда кто-то объяснил, почему крыло держит. Объяснил это Жуковский. И слова «отец русской авиации» — не прозвище из учебника, а строка постановления Совнаркома от третьего декабря тысяча девятьсот двадцатого года. Теперь вернитесь к игре: разбейте пару планёров наугад, а потом поднимите пилота по формуле. Или откройте пять фактов и ответьте на пять вопросов викторины. Спасибо, что прошли зал.»</p>'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
