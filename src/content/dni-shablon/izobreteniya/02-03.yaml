audioguide:
  audioSrc: audio-guide-luna9-ru.mp3
  durationLabel: 1 минута 36 секунд
  lead: 'Голос ведёт по залу «Луны-9»: от записки Королёва «Луна твёрдая» через двенадцатую станцию и надувные подушки — к снимкам, которые облетели мир. Пять остановок.'
  stops:
    - t: 0
      mark: '0:00'
      title: 'Луна твёрдая'
    - t: 21
      mark: '0:21'
      title: 'Двенадцатая — первая в мире'
    - t: 41
      mark: '0:41'
      title: 'Щуп, подушки и три панорамы'
    - t: 61
      mark: '1:01'
      title: 'Снимки облетели мир'
    - t: 79
      mark: '1:19'
      title: 'США отстали дважды'
  transcript:
    - 'Здравствуйте. Мы в зале «Луны-9». Третье февраля тысяча девятьсот шестьдесят шестого года. Учёные пугали: Луна в пыли, где утонет любая машина. «Луна твёрдая. С. Королёв» — одна записка тысяча девятьсот шестьдесят четвёртого года закрыла спор учёных о лунной пыли. «Луна-9» села — и не утонула.'
    - 'Одиннадцать станций подряд не сумели сесть на Луну — двенадцатая, «Луна-9», села первой в мире. Королёв шёл к мягкой посадке с тысяча девятьсот пятьдесят девятого года — и не дожил до неё двадцать дней. Завод Лавочкина взял тему у Королёва — и первая же его станция села на Луну.'
    - 'Щуп коснулся Луны — и станцию выстрелили вверх, чтобы она упала на надувные подушки. К Луне летели полторы тонны — на грунт встали девяносто килограммов, шестнадцатая часть. Села на краю двадцатипятиметрового кратера с креном семьдесят пять градусов — и всё равно сняла три панорамы.'
    - 'Англичане перехватили сигнал «Луны-9» и напечатали снимки с Луны раньше «Правды». Чтобы прочесть сигнал с Луны, британские астрономы одолжили факс у газеты «Дейли Экспресс». Разведка США ломала сигнал «Луны-9»: «Белый дом и Конгресс ждут ответов».'
    - 'Американский «Сервейер» смог повторить посадку «Луны-9» только через четыре месяца. После снимков «Луны-9» луноход переделали: вместо гусениц — восемь колёс. А через два месяца — «Луна-10», первый спутник Луны: США отстали на четыре месяца дважды.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
