pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "<b>Граница первенства:</b> первая в мире женщина, которая получила должность профессора математики в университете и действительно вела на ней курсы: Стокгольм, назначение 24 июня 1884 года, пожизненно — с 1889 года. Документ — назначение университета; энциклопедия называет её первой в мире женщиной — профессором математики. Ещё одно первенство — первая женщина — член-корреспондент Петербургской академии наук, 1889."
  net: <b>Чего здесь нет:</b> в 1750 году папа Бенедикт XIV назначил итальянку Марию Гаэтану Аньези на кафедру математики Болонского университета. Её имя сорок пять лет стояло в списках университета, но в Болонью она так и не приехала и лекций не читала. Поэтому мы пишем «вела кафедру», а не просто «получила звание».
  kolonki:
    - Документ или событие
    - Что
    - Когда
  stroki:
    - - Гёттингенский университет
