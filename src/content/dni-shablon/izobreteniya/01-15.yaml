quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — листами лекций Остроградского; 2 — частно, у Вейерштрасса; 3 — в Стокгольме; 4 — до 5000 франков; 5 — A = B = 2C, центр тяжести в экваториальной плоскости."
  ball: 10
  voprosy:
    - q: Чем оклеили стену детской в Полибино?
      o:
        - Географическими картами
        - Листами лекций Остроградского по математическому анализу
        - Нотами
      a: 1
      e: На детскую не хватило обоев, и стену оклеили листами лекций академика Остроградского по дифференциальному и интегральному исчислению.
    - q: Как Ковалевская училась у Вейерштрасса в Берлине?
      o:
        - Слушала его лекции в университете
        - "Частно: в университет женщин не пускали"
        - По переписке
      a: 1
      e: В Берлинский университет женщины не допускались, и Вейерштрасс четыре года давал ей частные уроки.
    - q: Где Ковалевская стала профессором?
      o:
        - В Петербурге
        - В Гёттингене
        - В Стокгольме
      a: 2
      e: "В Стокгольме: 24 июня 1884 года — профессор на пять лет, с 1889-го — пожизненно. В Петербурге ей места не дали."
    - q: До скольких франков Парижская академия подняла премию Бордена?
      o:
        - До 3000
        - До 5000
        - До 50 000
      a: 1
      e: Обещано было 3000 франков, а вручили 5000 — из-за особых достоинств работы.
    - q: Какое условие у волчка Ковалевской?
      o:
        - Центр тяжести в точке опоры
        - A = B = 2C, центр тяжести в экваториальной плоскости
        - Тело — однородный шар
      a: 1
      e: Два главных момента инерции равны, третий вдвое меньше, а центр тяжести лежит в экваториальной плоскости. Центр тяжести в точке опоры — это случай Эйлера.
