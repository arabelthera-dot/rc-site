video:
  h2: История в 59 секунд
  klyuch: izobreteniya/15jan-kovalevskaya
  format: horizontal
  pole: izobreteniya/15jan-kovalevskaya:horizontal.sec
  suffix: сек
  badge: 59 сек
  intro: Та же история коротким роликом — от фиктивного брака ради учёбы до кафедры в Стокгольме и волчка, за который Ковалевская получила премию Бордена.
  poster: video/day-15jan-kovalevskaya-poster.jpg?v=1
  mp4: video/day-15jan-kovalevskaya.mp4?v=1
  note: "Кадры ролика — подлинные, из Госкаталога музейного фонда РФ: фотографии С. В. Ковалевской из ателье Dahllöf, Стокгольм, 1880-е (Псковский музей-заповедник); гравюра И. И. Матюшина по фотографии С. Л. Левицкого, 1891, из «Русской старины» (ГМИИ им. А. С. Пушкина); М. В. Остроградский, литография П. Ф. Бореля, 1869 (Государственный литературный музей им. В. И. Даля); фототипия «Софья Ковалевская», Петербург, конец XIX века (Национальный музей Республики Татарстан); могила Ковалевской в Стокгольме, памятник 1896 года, фото 1973 (Псковский музей-заповедник). Модель волчка — снимок с этой страницы. Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История первенства · 13 ударов
  h2: Профессор Соня
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: В усадьбе Полибино на детскую не хватило обоев. Стену оклеили листами лекций академика Остроградского по математическому анализу.
      det:
        - Это были печатные лекции Михаила Остроградского по дифференциальному и интегральному исчислению. Софья потом вспоминала, что часами простаивала перед «таинственной стеной», пытаясь разобрать хоть отдельные фразы и найти порядок, в котором листы должны идти друг за другом. Многие формулы врезались ей в память раньше, чем она поняла их смысл.
        - Полибино — имение её отца, генерал-лейтенанта В. В. Корвин-Круковского, ныне Великолукский район Псковской области. Сегодня там музей Ковалевской.
      src: "Источники: «Русский мир», «Софья Ковалевская. Жизнь как уравнение», 14.01.2025; «Псковиана», «Ковалевская Софья Васильевна»; «Аргументы и факты — Петербург», 15.01.2026."
    - summary: В российские университеты женщин тогда не принимали. В 1868 году Софья фиктивно вышла замуж, чтобы уехать учиться за границу.
      det:
        - "С 1866 года она брала частные уроки математики в Петербурге: доступ женщинам в Санкт-Петербургский университет был закрыт. Мужем стал выпускник Училища правоведения Владимир Ковалевский; за границей он занялся палеонтологией."
      src: "Источники: энциклопедическая статья «Ковалевская Софья Васильевна» (knowledge.su); журнал «Родина», 15.01.2025."
    - summary: В Берлинский университет женщин не пускали. Четыре года её частно учил знаменитый математик Карл Вейерштрасс.
      det:
        - "Сначала, в 1869 году, был Гейдельберг: математика, лекции Кирхгофа и Гельмгольца. С 1870 по 1874 год — Берлин, где Вейерштрасс давал ей частные уроки, потому что в университет женщины не допускались."
      src: "Источники: энциклопедическая статья «Ковалевская Софья Васильевна» (knowledge.su); журнал «Родина», 15.01.2025."
    - summary: В 1874 году Гёттингенский университет заочно присудил ей степень доктора философии — сразу за три работы.
      det:
        - Работы представил Вейерштрасс. Одна из них дала теорему о существовании решений систем уравнений с частными производными — сегодня она называется теоремой Коши — Ковалевской и входит в университетские учебники. Софье было 24 года.
      src: "Источники: энциклопедическая статья «Ковалевская Софья Васильевна» (knowledge.su); НИЯУ МИФИ, «К 175-летию Софьи Ковалевской. „Математическая русалка“»; «Псковиана»."
    - summary: "Дома доктору математики места не нашлось: в Петербургский университет не взяли, на Высших женских курсах преподавать не допустили."
      det:
        - Почти на шесть лет она отошла от науки и занялась литературой и публицистикой. «Аргументы и факты» пишут, что на родине ей готовы были предложить лишь арифметику в младших классах гимназии.
      src: "Источники: энциклопедическая статья «Ковалевская Софья Васильевна» (knowledge.su); «Аргументы и факты — Петербург», 15.01.2026."
    - summary: В ноябре 1883 года шведский математик Миттаг-Леффлер позвал её в Стокгольм. 30 января 1884 года она прочла там первую лекцию.
      det:
        - Гёста Миттаг-Леффлер, сам ученик Вейерштрасса, предложил ей место приват-доцента в Стокгольмском университете — тогда Стокгольмской высшей школе. По условию первый год она читала лекции по-немецки, а со второго года — по-шведски.
      src: "Источники: «Узнай Москву», «Ковалевская Софья Васильевна»; «Аргументы и факты — Петербург», 15.01.2026; энциклопедическая статья (knowledge.su)."
    - summary: 24 июня 1884 года её назначили профессором — сначала на пять лет. Ни одна женщина в мире до неё не вела кафедру математики.
      det:
        - Энциклопедия называет её первой в мире женщиной — профессором математики. В Стокгольме она читала лекции по математическому анализу и механике — на немецком и шведском языках.
      src: "Источники: «Узнай Москву»; энциклопедическая статья (knowledge.su); «Аргументы и факты — Петербург», 15.01.2026."
    - summary: Задачу о волчке — как вращается тяжёлое тело вокруг закреплённой точки — математики решали больше ста лет. До конца удавалось просчитать только два случая.
      det:
        - "Уравнения движения вывел Леонард Эйлер. Он же нашёл первый случай, когда их можно решить до конца: тело закреплено в своём центре тяжести. Второй случай нашёл Жозеф Луи Лагранж: тело симметрично, как юла, а центр тяжести лежит на оси симметрии. Дальше никто продвинуться не мог."
      src: "Источники: НИЯУ МИФИ, «„Математическая русалка“»; энциклопедическая статья (knowledge.su)."
    - summary: Волчок Ковалевской — третий случай, когда вращение тяжёлого тела рассчитывается до конца.
      find: true
      tag: Находка дня
      det:
        - "Условие оказалось странным: два главных момента инерции тела равны, а третий вдвое меньше их, и центр тяжести лежит не на оси симметрии, а в экваториальной плоскости. Ковалевская искала решения уравнений на комплексной плоскости — подход, который подсказал ей Вейерштрасс."
        - "Попробуй сам в модели ниже: найди условие, при котором волчок перестаёт вести себя хаотично."
      src: "Источники: НИЯУ МИФИ, «„Математическая русалка“»; энциклопедическая статья (knowledge.su); журнал «Родина», 15.01.2025."
    - summary: 24 декабря 1888 года Парижская академия наук вручила ей премию Бордена — и подняла её с 3000 до 5000 франков.
      det:
        - "Работы на премию подавались анонимно, под девизом. Девиз Ковалевской: «Говори, что знаешь, делай, что должен, и пусть будет, что будет». Решение академиков было единогласным, а сумму увеличили из-за особых достоинств работы."
      src: "Источники: НИЯУ МИФИ, «„Математическая русалка“»; журнал «Стимул», «Математик прекрасного пола»."
    - summary: В 1889 году за продолжение той же темы Шведская академия наук дала ей премию короля Оскара II, а университет сделал её профессором пожизненно.
      det:
        - Премия составляла полторы тысячи крон. Пожизненное звание профессора Стокгольмской высшей школы упоминают и «Узнай Москву», и НИЯУ МИФИ.
      src: "Источники: «Узнай Москву»; НИЯУ МИФИ; журнал «Родина», 15.01.2025."
    - summary: В том же 1889 году Петербургская академия наук впервые избрала женщину членом-корреспондентом. Ради этого академии пришлось менять порядок избрания.
      det:
        - Кандидатуру предложили П. Л. Чебышев, В. Г. Имшенецкий и В. Я. Буняковский — после того как было принято решение допускать женщин к избранию в члены-корреспонденты. Но присутствие женщины на заседаниях Академии по-прежнему считали недопустимым.
      src: "Источники: энциклопедическая статья (knowledge.su); журнал «Родина», 15.01.2025; «Аргументы и факты — Петербург», 15.01.2026."
    - summary: Софья Ковалевская умерла в Стокгольме 10 февраля 1891 года от воспаления лёгких. Ей был 41 год.
      det:
        - "Она была и писательницей: «Воспоминания детства», повесть «Нигилистка», драма «Борьба за счастье», написанная вместе со шведской писательницей Анной Шарлоттой Леффлер."
      src: "Источники: журнал «Родина», 15.01.2025; энциклопедическая статья (knowledge.su)."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Софье Ковалевской
    h2: Запреты, которые она обошла
    udary:
      - summary: <b>Маме приснился вещий сон.</b> Незнакомец сказал ей одну фразу о будущем дочери.
        det:
          - "Он сказал: «Твоя дочь будет математиком». Эту историю Софья потом описала в своих воспоминаниях. Был ли сон на самом деле, неизвестно."
          - Зато математика была у неё в роду. Дед по маме был математиком, а прадед — астрономом. И интерес к числам девочка показала очень рано.
        src: "Источник: «Софья Ковалевская. Жизнь как уравнение», Русский мир — https://russkiymir.ru/publications/332224/"
        otryvok: "«По материнской линии её дед был математиком, а прадед – астрономом. А её матери однажды приснился сон, в котором неизвестный сказал: „Твоя дочь будет математиком“. Эту мистическую историю Софья опишет в своих мемуарах. Так ли это было на самом деле или нет, но интерес к математике девочка действительно проявила очень рано.»"
        stranica: «Софья Ковалевская. Жизнь как уравнение», «Русский мир»
        href: https://russkiymir.ru/publications/332224/
        pometka: легенда
      - summary: <b>Гость назвал девочку «новым Паскалем».</b> Всё из-за учебника, который он подарил её отцу.
        det:
          - К Корвин-Круковским ходил профессор физики Морской академии Николай Тыртов. Он подарил отцу Сони свой учебник физики. Соне было лет четырнадцать. Она сама взялась его читать.
          - В следующий приезд Тыртов узнал, что Соня сама заново вывела простые теоремы тригонометрии. Он был поражён. Он уговаривал отца дать дочери учить высшую математику.
        src: "Источник: «Математик прекрасного пола», журнал «Стимул» — https://stimul.online/historical-dates/matematik-prekrasnogo-pola/"
        otryvok: «Семью Корвин-Круковских посещал профессор физики Морской академии Николай Никанорович Тыртов… Автор подарил экземпляр своего учебника Василию Васильевичу… Соня, которой было в то время лет четырнадцать, заинтересовалась этим учебником… Соня воссоздала простейшие теоремы тригонометрии. Он горячо расхвалил ее отцу, назвав девочку „новым Паскалем“, и советовал генералу дать дочери возможность заниматься высшей математикой.»
        stranica: «Математик прекрасного пола», журнал «Стимул»
        href: https://stimul.online/historical-dates/matematik-prekrasnogo-pola/
        pometka: документ
      - summary: <b>«Математик — это всегда поэт в душе».</b> Эту фразу Ковалевской до сих пор повторяют студентам.
        det:
          - А её волчок дал начало целой ветви математики.
          - Её любит профессор НИЯУ МИФИ Николай Кудряшов. Он называет себя последователем Ковалевской. В своих работах он идёт тем же путём, что и она в задаче о волчке.
          - После работы Ковалевской француз Эмиль Пикар предложил похожую задачу для других уравнений. За неё взялся Поль Пенлеве с учениками. Они 15 лет разбирали уравнения и нашли шесть, решения которых раньше не знал никто. Теперь их называют уравнениями Пенлеве.
        src: "Источник: «Математическая русалка», НИЯУ МИФИ — https://mephi.ru/press/news/23925"
        otryvok: "«Ковалевской принадлежит замечательная фраза, которую я часто повторяю студентам: „Математик – это всегда поэт в душе“… – говорит… профессор НИЯУ МИФИ Николай Кудряшов. – В МИФИ я, наверно, самый верный ученик и последователь Ковалевской…» …«Под влиянием работы Ковалевской французский математик Эмиль Пикар предложил рассмотреть определенный класс дифференциальных уравнений… Поль Пенлеве. Со своими учениками он в течение 15 лет занимался анализом… решения шести уравнений были найдены впервые.»"
        stranica: Ксения Ерохина, «Математическая русалка», пресс-служба НИЯУ МИФИ
        href: https://mephi.ru/press/news/23925
        pometka: документ
      - summary: <b>«Вы и ваша дочь успеете состариться».</b> Так министр ответил Ковалевской.
        det:
          - Её дочь выросла и тоже получила высшее образование.
          - Ковалевская просила министра просвещения Андрея Сабурова дать ей место в университете. Он ответил, что она и её дочь состарятся раньше, чем женщин пустят в университет.
          - Дочь тоже звали Софьей, дома — Фуфой. Она окончила Женский медицинский институт в Петербурге и стала врачом. А ещё перевела со шведского многие работы матери.
        src: "Источник: «Профессор Соня. Как Софья Ковалевская стала первой женщиной в Академии наук», АиФ-Петербург — https://spb.aif.ru/society/science/professor_sonya_kak_sofya_kovalevskaya_stala_pervoy_zhenschinoy_v_akademii_nauk; «Математическая русалка», НИЯУ МИФИ — https://mephi.ru/press/news/23925"
        otryvok: "«Министр просвещения России Андрей Сабуров на просьбу Ковалевской дать ей профессорскую кафедру при университете ответил: „Вы и ваша дочь успеете состариться прежде, чем женщин будут допускать к университету“.»"
        stranica: «Профессор Соня. Как Софья Ковалевская стала первой женщиной в Академии наук», «АиФ-Петербург»
        href: https://spb.aif.ru/society/science/professor_sonya_kak_sofya_kovalevskaya_stala_pervoy_zhenschinoy_v_akademii_nauk
        pometka: два источника
      - summary: <b>Её имя есть на Луне и в Арктике.</b> И ещё среди малых планет.
        det:
          - В честь Ковалевской назвали лунный кратер и астероид № 1859. На Шпицбергене есть её гора, хребет и долина, а в Карском море — залив. Российская академия наук вручает премию её имени.
          - В 1986 году в Полибино, в бывшем имении её отца, открыли музей Ковалевской. Это единственный её музей в России. Он стоит в Псковской области, рядом с Великими Луками.
        src: "Источник: «Математическая русалка», НИЯУ МИФИ — https://mephi.ru/press/news/23925; «Ковалевская Софья Васильевна», энциклопедия «Знание» — https://knowledge.su/k/kovalevskaya-sofya-vasilevna"
        otryvok: «Её именем названы улицы и школы в разных городах России и мира, гора, хребет и долина на острове Шпицберген, залив в Карском море, лунный кратер и астероид №1859. И теперь уже в ее честь отделение математических наук РАН ежегодно присуждает Премию имени С.В. Ковалевской.»
        stranica: Ксения Ерохина, «Математическая русалка», пресс-служба НИЯУ МИФИ
        href: https://mephi.ru/press/news/23925
        pometka: два источника
      - summary: <b>В России женщин на лекции не пускали. Один профессор рискнул и пустил её сам.</b>
        det:
          - Осенью 1868 года Софья добилась права ходить в Медико-хирургическую академию в Петербурге — на лекции знаменитого физиолога Ивана Сеченова и на занятия анатомией.
          - Официального разрешения не было. Сеченов пустил её на свой страх и риск и сам вёл с ней практические занятия.
        src: 'Источник: «Математик прекрасного пола», журнал «Стимул»; «Биография Софьи Ковалевской», РИА Новости, 15.01.2020 — <a href="https://stimul.online/historical-dates/matematik-prekrasnogo-pola/" rel="noopener">stimul.online/historical-dates/matematik-prekrasnogo-pola</a>.'
        otryvok: «Сеченов на свой страх и риск предложил Софье посещать эти лекции и сам проводил практические занятия с Ковалевскими.» (Стимул); «в 1868 году добилась права слушать лекции у ученого-физиолога Ивана Сеченова и заниматься анатомией в Медико-хирургической академии» (РИА Новости)
        stranica: «Математик прекрасного пола», журнал «Стимул»; «Биография Софьи Ковалевской», РИА Новости, 2020
        href: https://stimul.online/historical-dates/matematik-prekrasnogo-pola/
        pometka: два источника
      - summary: <b>Университет Гейдельберга ей отказал. Тогда она пошла уговаривать профессоров по одному.</b>
        det:
          - Для немецкого университета женщина на лекциях была делом невиданным. Комиссия запретила Ковалевской ходить на лекции.
          - Но комиссия оставила каждому профессору право пускать её на свои занятия по собственному решению. Софья несколько раз ходила от одного профессора к другому. Студенткой её так и не признали, но лекции она слушала.
        src: 'Источник: «Математик прекрасного пола», журнал «Стимул» — <a href="https://stimul.online/historical-dates/matematik-prekrasnogo-pola/" rel="noopener">stimul.online/historical-dates/matematik-prekrasnogo-pola</a>.'
        otryvok: «В Гейдельберге, чтобы получить разрешение посещать лекции в университете, Соне несколько раз пришлось ходить от одного профессора к другому. Для университета допущение женщин на лекции было новым делом, и комиссия не разрешила Ковалевской посещать лекции, предоставив, однако, отдельным профессорам право допускать ее на свои занятия по их усмотрению. Соня не была признана полноправным ст[удентом]…»
        stranica: «Математик прекрасного пола», журнал «Стимул»
        href: https://stimul.online/historical-dates/matematik-prekrasnogo-pola/
        pometka: документ
      - summary: <b>Великий математик хотел от неё отделаться и дал трудные задачи. Ответ его ошеломил.</b>
        det:
          - В 1870 году Софья пришла к Карлу Вейерштрассу в Берлине. Он дал ей несколько сложных задач — рассчитывал, что девушка не справится и откажется от своей затеи.
          - На следующее занятие она пришла и сказала, что решила все. Вейерштрасс взял её в ученицы и даже просил университет пустить её на лекции. Ему отказали.
        src: 'Источник: «Ковалевская Софья Васильевна», Российская государственная библиотека для слепых (по материалу журнала «Вокруг света») — <a href="https://rgbs.ru/tiflology/pubs/kovalevskaya-sofya-vasilevna/" rel="noopener">rgbs.ru/tiflology/pubs/kovalevskaya-sofya-vasilevna</a>.'
        otryvok: «Карл Вейерштрасс, который поначалу хотел избавиться от пытливой студентки. Он предложил Софье несколько сложных задач в надежде, что девушка не справится с ними, расстроится и откажется от своих затей. Не тут-то было. На очередное занятие она пришла, гордая собой, и заявила, что решила все задачи. Учёному не оставалось ничего, кроме как взять Софью под свое крыло. Академический совет Берлинского университета он попросил предоставить ей доступ к занятиям, но получил отказ»
        stranica: «Ковалевская Софья Васильевна», РГБ для слепых (rgbs.ru)
        href: https://rgbs.ru/tiflology/pubs/kovalevskaya-sofya-vasilevna/
        pometka: легенда
      - summary: <b>Весной 1871 года она пробралась в Париж, окружённый прусской армией.</b>
        det:
          - Во Франции шла война, а в самом Париже — восстание, Парижская коммуна. Ковалевская сумела проникнуть в осаждённый город.
          - Почти 40 дней она провела в Париже и ухаживала за больными и ранеными в госпитале.
        src: 'Источник: «Ковалевская Софья Васильевна», Российская государственная библиотека для слепых; Ю. Овсянников, «Русские в Парижской коммуне», журнал «Смена», № 620, 1953 — <a href="https://rgbs.ru/tiflology/pubs/kovalevskaya-sofya-vasilevna/" rel="noopener">rgbs.ru/tiflology/pubs/kovalevskaya-sofya-vasilevna</a>.'
        otryvok: «Ковалевским удалось проникнуть в осаждённый прусской армией город. Они провели в Париже почти 40 дней. В это время Софья и Анна ухаживали за больными и ранеными в госпитале.» (РГБС); «В дни Коммуны Софья Ковалевская работала в госпиталях, помогая раненым коммунарам.» (Смена, 1953, https://smena-online.ru/stories/russkie-v-parizhskoi-kommune)
        stranica: «Ковалевская Софья Васильевна», РГБ для слепых; Ю. Овсянников, «Русские в Парижской коммуне», «Смена», 1953
        href: https://rgbs.ru/tiflology/pubs/kovalevskaya-sofya-vasilevna/
        pometka: два источника
      - summary: <b>Эту премию Парижская академия несколько раз не давала никому.</b>
        det:
          - "Премию обещали за серьёзное продвижение в задаче о вращении тела. Несколько раз её так никому и не присудили: хороших работ не было."
          - В 1888 году на конкурс прислали 15 работ. Судьи не знали имён авторов. Лучшей признали работу Ковалевской.
        src: 'Источник: «Ковалевская Софья Васильевна», Донская государственная публичная библиотека, 2021 — <a href="https://www.dspl.ru/sobytiya/tematicheskie-gody/god-nauki-2021/kovalevskaya-sofya-vasilevna/" rel="noopener">dspl.ru/sobytiya/tematicheskie-gody/god-nauki-2021/kovalevskaya-sofya-vasilevna</a>.'
        otryvok: «Несколько раз эта премия оставалась не присужденной из-за отсутствия достаточно хороших работ. … После рассмотрения 15 работ, присланных на конкурс, премия была присуждена Софье Васильевне Ковалевской.» (ДГПБ); «Жюри оценивало 15 работ, не зная имён их авторов во избежание предвзятости.» (РГБС, https://rgbs.ru/tiflology/pubs/kovalevskaya-sofya-vasilevna/)
        stranica: «Ковалевская Софья Васильевна», Донская государственная публичная библиотека, 2021
        href: https://www.dspl.ru/sobytiya/tematicheskie-gody/god-nauki-2021/kovalevskaya-sofya-vasilevna/
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Цензура, слава и памятник
    udary:
      - summary: <b>Прошло больше 130 лет. Четвёртого такого случая не нашёл никто.</b>
        det:
          - "До Ковалевской вращение волчка удавалось рассчитать до конца лишь в двух случаях. Она нашла третий — его так и называют: «случай Ковалевской»."
          - С тех пор новых таких случаев не нашёл ни один математик.
        src: 'Источник: «Ковалевская Софья Васильевна», Донская государственная публичная библиотека, 2021 — <a href="https://www.dspl.ru/sobytiya/tematicheskie-gody/god-nauki-2021/kovalevskaya-sofya-vasilevna/" rel="noopener">dspl.ru/sobytiya/tematicheskie-gody/god-nauki-2021/kovalevskaya-sofya-vasilevna</a>.'
        otryvok: «С.В. Ковалевской удалось найти третий случай, который теперь называется «случай Ковалевской». С тех пор найти новые случаи аналитического решения этой задачи никому не удалось.»
        stranica: «Ковалевская Софья Васильевна», Донская государственная публичная библиотека, 2021
        href: https://www.dspl.ru/sobytiya/tematicheskie-gody/god-nauki-2021/kovalevskaya-sofya-vasilevna/
        pometka: документ
      - summary: <b>Её повесть запретили в России — даже в переводе на другие языки.</b>
        det:
          - Повесть «Нигилистка» Ковалевская написала в Швеции в 1884 году. Это история русской девушки, которая уходит в революционное движение.
          - В царской России книгу запретили печатать на любом языке. Впервые по-русски она вышла за границей, в Женеве, в 1892 году — уже после смерти автора.
        src: 'Источник: С. В. Ковалевская, «Нигилистка», Женева, 1892, Общество распространения полезных книг; «Математик прекрасного пола», журнал «Стимул» — <a href="https://orpk.org/books/1684" rel="noopener">orpk.org/books/1684</a>.'
        otryvok: «Повесть была опубликована за границей только в 1892 году в Женеве, запрещена к печати в царской России даже на иностранных языках.» (ОРПК); «Роман Ковалевской «Нигилистка» был запрещен в царской России.» (Стимул)
        stranica: "С. В. Ковалевская, «Нигилистка», Женева: Вольная русская типография, 1892 (ОРПК)"
        href: https://orpk.org/books/1684
        pometka: два источника
      - summary: <b>Шведская газета написала о её приезде так, будто в город прибыла принцесса.</b>
        det:
          - В ноябре 1883 года о приезде Ковалевской в Стокгольм писали многие газеты.
          - Одна из них сообщила, что в город приехал не какой-нибудь принц, а «принцесса науки». Она станет первой женщиной — приват-доцентом во всей Швеции. Так её потом и звали в университете.
        src: 'Источник: «Математик прекрасного пола», журнал «Стимул»; М. Константинова, «Профессор Соня», АиФ-Петербург, 15.01.2026 — <a href="https://stimul.online/historical-dates/matematik-prekrasnogo-pola/" rel="noopener">stimul.online/historical-dates/matematik-prekrasnogo-pola</a>.'
        otryvok: "«В одной демократической газете говорилось: «Сегодня нам предстоит сообщить не о приезде какого-нибудь пошлого принца крови или тому подобного, но ничего не значащего лица. Нет, принцесса науки, г-жа Ковалевская, почтила наш город своим посещением и будет первым приват-доцентом-женщиной во всей Швеции».» (Стимул); «„Принцесса науки“ - так называли Софью Ковалевскую друзья по Стокгольмскому университету» (АиФ)"
        stranica: «Математик прекрасного пола», журнал «Стимул»; «Профессор Соня», АиФ-Петербург, 2026
        href: https://stimul.online/historical-dates/matematik-prekrasnogo-pola/
        pometka: два источника
      - summary: <b>Преподавать её не пустили, а памятник ей поставили на деньги русских женщин.</b>
        det:
          - Через пять лет после смерти Ковалевской на её могиле в Стокгольме появился памятник по эскизу архитектора Николая Султанова.
          - "Деньги собрали комитет Высших женских курсов и другие женские общества России. На плите по-русски: «Профессору математики С. В. Ковалевской — её русские друзья и почитатели»."
        src: 'Источник: «День памяти Софьи Ковалевской отмечается 10 февраля», Псковская лента новостей (со ссылкой на Мемориальный музей-усадьбу С. В. Ковалевской) — <a href="https://pln-pskov.ru/vln/society/438591.html" rel="noopener">pln-pskov.ru/vln/society/438591.html</a>.'
        otryvok: "«через 5 лет на ее могиле на Северном кладбище Стокгольма появился памятник, выполненный по эскизу скульптора Николая Султанова. Средства на него собрали комитет Высших женских курсов и другие женские организации России. Место упокоения ученой обозначено простым мраморным крестом и темной мраморной плитой с надписью на русском языке: «Профессору математики С. В. Ковалевской — ее русские друзья и почитатели».»"
        stranica: «День памяти Софьи Ковалевской отмечается 10 февраля», Псковская лента новостей
        href: https://pln-pskov.ru/vln/society/438591.html
        pometka: документ
      - summary: <b>Доктор математики зарабатывала театральными рецензиями.</b>
        det:
          - В 1874 году, вернувшись в Петербург доктором наук, Ковалевская не нашла работы по специальности.
          - Она писала театральные рецензии для газеты «Новое время».
        src: 'Источник: «Ковалевская Софья Васильевна», «Узнай Москву» — <a href="https://um.mos.ru/personalities/kovalevskaya/" rel="noopener">um.mos.ru/personalities/kovalevskaya</a>.'
        otryvok: «Софья Ковалевская пишет театральные рецензии для газеты «Новое время» А.С. Суворина в этот период.»
        stranica: «Ковалевская Софья Васильевна», «Узнай Москву»
        href: https://um.mos.ru/personalities/kovalevskaya/
        pometka: документ
