  net: <b>Чего здесь нет:</b> в 1750 году папа Бенедикт XIV назначил итальянку Марию Гаэтану Аньези на кафедру математики Болонского университета. Её имя сорок пять лет стояло в списках университета, но в Болонью она так и не приехала и лекций не читала. Поэтому мы пишем «вела кафедру», а не просто «получила звание».
