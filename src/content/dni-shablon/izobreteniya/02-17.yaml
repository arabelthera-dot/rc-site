igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чьё это число
  pravilo_ru: 'Что сделать сейчас: выбери число и нажми на то, что оно значит.'
  kak_igrat:
    zachem: 'У каждого числа из истории трамвая — своё место: пассажиры, месяцы, зимы.'
    shagi:
    - Выбери число — кнопка загорится золотом.
    - Нажми на то, что оно значит. Верный выбор загорится зелёным.
    - Расставь все три числа — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все три числа на месте — +20 баллов.
  dannye:
    mesta:
    - kod: passazhiry
      nazvanie: Столько пассажиров поехало в вагоне без лошади
      verno_ru: Вагон конки № 114 с 40 пассажирами поехал по Петербургу без единой лошади.
    - kod: mesyacy
      nazvanie: Через столько месяцев Берлин пустил «свой» трамвай
      verno_ru: Карл Сименс перечертил схемы Пироцкого — и через 9 месяцев Берлин пустил «свой» трамвай.
    - kod: zimy
      nazvanie: Столько зим ходил трамвай по льду Невы
      verno_ru: Петербургский трамвай по льду Невы — единственный в мире, ходил 16 зим.
    podpisi:
    - kod: n40
      tekst: '40'
      mesto: passazhiry
      mimo_ru: '40 — это пассажиры: столько людей поехало в вагоне № 114.'
    - kod: n9
      tekst: '9'
      mesto: mesyacy
      mimo_ru: '9 — это месяцы: столько прошло до «своего» трамвая в Берлине.'
    - kod: n16
      tekst: '16'
      mesto: zimy
      mimo_ru: '16 — это зимы: столько ходил трамвай по льду Невы.'
    vyberi_ru: Сначала выбери число, потом его место.
    mimo_ru: Не то место — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
