  data: 3 сентября 1880 · Петербург
  privyazka: 17 февраля — день музея; Фёдор Пироцкий родился 17 февраля 1845 года, а первый в мире электрический трамвай с людьми пустил в Петербурге в 1880 году.
  kto: Фёдор Пироцкий, инженер-артиллерист из Петербурга
