audioguide:
  audioSrc: audio-guide-tramvaj-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу первого в мире электрического трамвая: от вагона без лошади через чужой «свой» трамвай в Берлине к рельсам на льду Невы. Четыре остановки.'
  stops:
  - t: 0
    mark: 0:00
    title: Вагон без лошади
  - t: 40
    mark: 0:40
    title: Через девять месяцев — в Берлине
  - t: 75
    mark: '1:15'
    title: Трамвай на льду Невы
  - t: 110
    mark: '1:50'
    title: Водопады и кабель
  transcript:
  - 'Здравствуйте. Мы в зале первого в мире электрического трамвая. Тысяча восемьсот восьмидесятый год, Петербург. Вагон конки номер сто четырнадцать с сорока пассажирами поехал по Петербургу без единой лошади. Шесть с половиной тонны вагона и сорок человек тянул один электромотор вместо упряжки лошадей. Проводов над первым трамваем не было: ток бежал по самим рельсам.'
  - 'Карл Сименс перечертил схемы Пироцкого — и через девять месяцев Берлин пустил свой трамвай. Сименс звал Пироцкого работать в Германию — русский инженер отказался. Комиссия назвала трамвай Пироцкого бесперспективным — а он покорил весь мир. Город, где родился трамвай, получил его только двадцать седьмым в стране — через двадцать семь лет.'
  - 'Запрет конки касался улиц, а не реки — и трамвай пустили по льду Невы. Столбы для проводов ледового трамвая вмораживали прямо в лёд. По льду Невы трамвай мчал до двадцати километров в час — почти втрое быстрее конки. За одну зиму он перевёз почти миллион человек. Петербургский трамвай по льду Невы — единственный в мире, ходил шестнадцать зим.'
  - 'Заявку на привилегию Пироцкий подал двадцать четвёртого июня тысяча восемьсот семьдесят четвёртого года — за семь лет до трамвая Сименса. В тысяча восемьсот семьдесят седьмом он предложил гнать силу водопадов в города по рельсам — на любое расстояние. А в тысяча восемьсот восемьдесят первом Пироцкий проложил в Петербурге первый подземный электрокабель.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
