story:
  kicker: История открытия
  h2: Капица увидел, Ландау объяснил
  udary:
    - summary: Ниже 2,17 градуса над абсолютным нулём жидкий гелий течёт совсем без трения — это открыл Пётр Капица.
      kadr:
        src: /muzei/izobreteniya/img/01-22-kapica-izvestiya-1941.jpg
        alt: "Пожелтевшая страница журнала: шапка «Известия Академии наук СССР», ниже заголовок «П. Л. Капица. О свойствах жидкого гелия» и плотный текст статьи со сноской внизу"
        data_source: "https://goskatalog.ru/portal/#/collections?id=50697272"
        license: "цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Национальный музей Республики Татарстан · Госкаталог, рег. № 50455788"
        podpis: "Статья Капицы «О свойствах жидкого гелия», 1941: здесь он пишет, что гелий II течёт с вязкостью в миллиарды раз меньше, чем у воды, и что он предложил назвать это «сверхтекучестью»; в сноске — первая публикация в ДАН СССР, 1938."
        credit: "Автор: П. Л. Капица; «Известия Академии наук СССР. Серия физическая», 1941, т. V, № 1. Хранится: Национальный музей Республики Татарстан (НМРТ КППи-123095/2). Госкаталог музейного фонда РФ, рег. № 50455788."
        width: 491
        height: 800
        klass: portret
        hint: "Статья Капицы «О свойствах жидкого гелия» · 1941"
        glavnoe_na_kartinke: "net"
        podpis_kogda: "1941"
        podpis_gde: "Казань, Национальный музей Республики Татарстан"
        podpis_chto: "Статья Капицы «О свойствах жидкого гелия» в «Известиях Академии наук СССР»"
        svyashchennoe: false
        vid: "dokument"
        prava: {"god_smerti_avtora":"net","god_reabilitacii":"net","sdelano_mashinoj":false,"otkuda":"Госкаталог музейного фонда РФ","baza":"goskatalog","pervaya_publikaciya":"Госкаталог музейного фонда РФ, рег. № 50455788","ssylka":"https://goskatalog.ru/portal/#/collections?id=50697272","avtor":"П. Л. Капица","god_sozdaniya":"1941","anonim":false}
        podlinnik: {"gde":"Национальный музей Республики Татарстан (НМРТ КППи-123095/2)","otkuda":"https://goskatalog.ru/portal/#/collections?id=50697272"}
        nomer_predmeta: "инв. в Госкаталоге не указан; Госкаталог рег. № 50455788"
        nomer_snimka: "50455788"
        hranitel: "Национальный музей Республики Татарстан (НМРТ КППи-123095/2)"
      utverzhdeno: Р334
      det:
        - 1937–1938 годы, Институт физических проблем в Москве. Капица пропускал гелий сквозь капилляры диаметром около 10⁻⁴ миллиметра — и ниже 2,17 К гелий проходил их без всякого трения. Капица сообщил об открытии сверхтекучести.
      src: "Источник: Мемориальный музей-кабинет П. Л. Капицы ИФП РАН, хронология; «Наука и жизнь», статья о жидком гелии."
    - summary: "Налей такой гелий в пробирку — он не удержится: поднимется по стенкам и уйдёт через край."
      utverzhdeno: Р334
      det:
        - "По стенке ползёт плёнка толщиной около 3·10⁻⁶ см — примерно 1000 атомных слоёв. «Наука и жизнь»: гелий «выбирается из пробирки через край и либо весь выливается в ванну с гелием, либо течёт (вверх!) до тех пор, пока уровни не сравняются»."
      src: "Источник: «Наука и жизнь», статья о жидком гелии."
    - summary: "В 1941-м Ландау объяснил чудо: в гелии сразу две жидкости — обычная и сверхтекучая."
      utverzhdeno: Р334
      det:
        - Статья «Теория сверхтекучести гелия II» вышла в ЖЭТФ, т. 11, вып. 6, с. 592. Её ключ — «одновременное существование двух движений — сверхтекучего и нормального».
      src: "Источник: «Успехи физических наук», 1967 — перепечатка статьи Л. Д. Ландау «Теория сверхтекучести гелия II» (ЖЭТФ, 1941)."
    - summary: Ландау нарисовал главную кривую своей теории на глаз, по одной интуиции. Через годы точки опыта легли прямо на неё — и зал аплодировал.
      utverzhdeno: Р334
      det:
        - "Это кривая энергии ротонов — «порций» теплового движения в гелии. Позже её измерили пучками нейтронов: «точки … легли прямо на кривую, проведенную Ландау. Зал рукоплескал докладчику»."
      src: "Источник: Э. Л. Андроникашвили, «Воспоминания о жидком гелии», «Химия и жизнь», 1982, № 1–3."
    - summary: "Теория предсказала то, чего никто не слышал, — «второй звук»: в гелии волной бежит тепло."
      utverzhdeno: Р334
      det:
        - "Предсказание вышло прямо из двух жидкостей: если в гелии одновременно есть два движения, по нему может бежать не только обычный звук, но и волна тепла."
      src: "Источник: Физический факультет МГУ, газета «Советский физик», 2008, № 1 (61)."
    - summary: За это в 1962 году Ландау дали Нобелевскую премию — «в особенности за жидкий гелий».
      kadr:
        src: /muzei/izobreteniya/img/01-22-landau-nobel-diplom.jpg
        alt: "Фотография листа диплома в узорной рамке: крупно имя «Lev Davidovič Landau», под ним строка по-шведски про теории конденсированной материи и жидкий гелий, дата «Stockholm den 10 december 1962», две подписи и круглая печать с короной"
        data_source: "https://goskatalog.ru/portal/#/collections?id=35682369"
