          <p class="muted-p">1938 год. Арестован молодой физик-теоретик — гениальный, но со «скверным характером». Ты — Пётр Капица, и ты знаешь ему цену. Что делаешь?</p>
          <div class="fork-opt" role="button" tabindex="0">🤐 Промолчать: за любое слово сейчас можно сесть самому</div>
          <div class="fork-opt" role="button" tabindex="0">✍️ Написать Сталину и поручиться за него лично</div>
          <div class="fork-opt" role="button" tabindex="0">⏳ Ждать: может быть, разберутся и отпустят</div>
          <div id="forkReal" class="exp forkReal"><b>Как было на самом деле.</b> Капица написал Сталину в тот же день, 28 апреля 1938 года: Ландау с Фоком — «самые крупные физики-теоретики», хотя характер у Ландау «скверный. Он задира и забияка». Ровно через год, 28 апреля 1939-го, Капица добился освобождения Ландау «под личное своё поручительство». В 1941 году Ландау объяснил сверхтекучесть, открытую Капицей, — а в 1962-м получил за это Нобелевскую премию.</div>
