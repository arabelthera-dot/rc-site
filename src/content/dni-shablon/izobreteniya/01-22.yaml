story:
  kicker: История открытия
  h2: Капица увидел, Ландау объяснил
  udary:
    - summary: Ниже 2,17 градуса над абсолютным нулём жидкий гелий течёт совсем без трения — это открыл Пётр Капица.
      det:
        - 1937–1938 годы, Институт физических проблем в Москве. Капица пропускал гелий сквозь щели-капилляры шириной около 10⁻⁴ см — и ниже 2,17 К гелий проходил их без всякого трения. Капица сообщил об открытии сверхтекучести.
      src: "Источник: Мемориальный музей-кабинет П. Л. Капицы ИФП РАН, хронология; «Наука и жизнь», статья о жидком гелии."
    - summary: "Налей такой гелий в пробирку — он не удержится: поднимется по стенкам и уйдёт через край."
      det:
        - "По стенке ползёт плёнка толщиной около 3·10⁻⁶ см — примерно 1000 атомных слоёв. «Наука и жизнь»: гелий «выбирается из пробирки через край и либо весь выливается в ванну с гелием, либо течёт (вверх!) до тех пор, пока уровни не сравняются»."
      src: "Источник: «Наука и жизнь», статья о жидком гелии."
    - summary: "В 1941-м Ландау объяснил чудо: в гелии сразу две жидкости — обычная и сверхтекучая."
      det:
        - Статья «Теория сверхтекучести гелия II» вышла в ЖЭТФ, т. 11, вып. 6, с. 592. Её ключ — «одновременное существование двух движений — сверхтекучего и нормального».
      src: "Источник: «Успехи физических наук», 1967 — перепечатка статьи Л. Д. Ландау «Теория сверхтекучести гелия II» (ЖЭТФ, 1941)."
    - summary: "Теория предсказала то, чего никто не слышал, — «второй звук»: в гелии волной бежит тепло."
      det:
        - "Предсказание вышло прямо из двух жидкостей: если в гелии одновременно есть два движения, по нему может бежать не только обычный звук, но и волна тепла."
      src: "Источник: Физический факультет МГУ, газета «Советский физик», 2008, № 1 (61)."
    - summary: За это в 1962 году Ландау дали Нобелевскую премию — «в особенности за жидкий гелий».
      det:
        - "Формулировка — «за основополагающие теории конденсированной материи, в особенности жидкого гелия». На шведском дипломе так и написано: «särskilt flytande helium» — «в особенности жидкий гелий»."
      src: "Источник: РИА Новости, 07.10.2013; Летопись Московского университета, «Ландау Лев Давидович»."
fakty:
  id: fakty
  nav: Факты
  kicker: Факты дня · 10 на выбор, у каждого номер
  h2: Десять фактов о Ландау и сверхтекучести
  udary:
    - summary: <b>Факт 1 из 10.</b> Ландау нарисовал кривую «на глаз» — через годы опыт с нейтронами лёг точно на неё.
      det:
        - Ландау придумал, что тепло в гелии переносят особые порции движения — ротоны. График их энергии он построил по одной интуиции, без опыта.
        - Через годы график проверили рассеянием нейтронов — и все точки легли прямо на линию Ландау. Зал, где об этом докладывали, аплодировал.
      src: 'Источник: Э. Андроникашвили, «Воспоминания о жидком гелии», «Химия и жизнь», 1982, № 1–3 — <a href="https://www.eduspb.com/public/books/byograf/andronikashvili_iz_vospominaniya_o_zhidkom_gelii_genri_holl.pdf" rel="noopener" target="_blank">eduspb.com</a>.'
      otryvok: «Эту кривую, изображающую зависимость энергии ротонов от их импульса, Ландау построил по интуиции. Теперь она была подтверждена с необычайной точностью… Зал рукоплескал докладчику».
      stranica: Э. Андроникашвили, «Воспоминания о жидком гелии», «Химия и жизнь», 1982, № 1–3
      href: https://www.eduspb.com/public/books/byograf/andronikashvili_iz_vospominaniya_o_zhidkom_gelii_genri_holl.pdf
      pometka: документ
    - summary: "<b>Факт 2 из 10.</b> Ландау вычислил скорость звука, которого никто никогда не слышал: 25 метров в секунду."
      det:
        - Обычный звук бежит по жидкому гелию со скоростью 250 метров в секунду. Ландау предсказал «второй звук» — волну тепла, которая в десять раз медленнее.
        - "Капица сравнивал это с открытием планеты Нептун «на кончике пера», но говорил, что здесь было труднее: планета уже была на небе, а такого звука до Ландау никто не знал."
      src: 'Источник: П. Л. Капица, «Свойства жидкого гелия» (журнал «Природа»), перепечатка: RELGA.RU, № 18 [236], 10.11.2011 — <a href="https://relga.ru/articles/3046/" rel="noopener" target="_blank">relga.ru</a>.'
      otryvok: «звуковая скорость в нормальном гелии была известна — 250 м/с. Но должна появиться еще и другая скорость. И Ландау предсказал ее и даже вычислил, что она должна равняться 25 м/с».
      stranica: "П. Л. Капица, «Свойства жидкого гелия» (журнал «Природа»), перепечатка: RELGA.RU, № 18 [236], 10.11.2011"
      href: https://relga.ru/articles/3046/
      pometka: документ
    - summary: <b>Факт 3 из 10.</b> Жизнь Ландау спасали 87 физиков — они дежурили в больнице сутками.
      det:
        - После аварии 7 января 1962 года ученики Ландау не уходили из больницы. Им отдали комнату рядом с кабинетом главного врача.
        - "Так появился «физический штаб»: его участники искали лекарства, приборы и врачей по всему миру. В книге дежурств — 87 фамилий."
      src: 'Источник: М. Бессараб, «Страницы жизни Ландау», ч. 7 — ГПНТБ СО РАН, электронная выставка «Ландау» — <a href="https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi" rel="noopener" target="_blank">prometeus.nsc.ru</a>.'
      otryvok: «Пришлось дать физикам комнату, смежную с кабинетом главного врача. Так возник знаменитый „физический штаб“. В книге дежурства штаба – 87 фамилий!»
      stranica: М. Бессараб, «Страницы жизни Ландау», ч. 7 — ГПНТБ СО РАН, электронная выставка «Ландау»
      href: https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi
      pometka: документ
    - summary: <b>Факт 4 из 10.</b> Ради Ландау самолёт в Москву задержали на целый час.
      det:
        - Нужное лекарство нашли в Англии. Пакет с надписью «Для Ландау» передали лётчику, а в Шереметьеве его уже ждал дежурный физик из «штаба».
      src: 'Источник: М. Бессараб, «Страницы жизни Ландау», ч. 7 — ГПНТБ СО РАН, электронная выставка «Ландау» — <a href="https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi" rel="noopener" target="_blank">prometeus.nsc.ru</a>.'
      otryvok: «Когда в аэропорту узнали, что речь идет о доставке медикаментов для тяжело раненого, самолет был задержан на целый час».
      stranica: М. Бессараб, «Страницы жизни Ландау», ч. 7 — ГПНТБ СО РАН, электронная выставка «Ландау»
      href: https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi
      pometka: легенда
    - summary: <b>Факт 5 из 10.</b> Ландау получил Нобелевскую премию на 16 лет раньше Капицы, открывшего сверхтекучесть.
      det:
        - Капица открыл сверхтекучесть в 1938 году, а Нобелевскую премию за неё получил только в 1978-м, через 40 лет. Ландау, который объяснил открытие, стал лауреатом в 1962-м.
        - Так за один стакан жидкого гелия наша страна получила две Нобелевские премии.
      src: 'Источник: «Чашка жидкого гелия», N+1, 10.07.2018 (рассказывает Я. Фоминов, ИТФ им. Л. Д. Ландау РАН) — <a href="https://nplus1.ru/material/2018/07/10/superfluidity" rel="noopener" target="_blank">nplus1.ru</a>.'
      otryvok: «Главным образом именно за эту работу он в 1962 году удостоился Нобелевской премии — на 16 лет раньше Капицы».
      stranica: «Чашка жидкого гелия», N+1, 10.07.2018 (рассказывает Я. Фоминов, ИТФ им. Л. Д. Ландау РАН)
      href: https://nplus1.ru/material/2018/07/10/superfluidity
      pometka: документ
    - summary: <b>Факт 6 из 10.</b> Машина Капицы давала 18 литров жидкого гелия в час — в несколько раз больше всех в мире.
      det:
        - Без жидкого гелия не было бы и открытия. Капица построил установку, которая сжижала гелий быстрее всех тогдашних машин.
        - Её перевезли в Москву, в Институт физических проблем, — там и открыли сверхтекучесть, которую потом объяснил Ландау.
      src: 'Источник: «Чашка жидкого гелия», N+1, 10.07.2018 (рассказывает Я. Фоминов, ИТФ им. Л. Д. Ландау РАН) — <a href="https://nplus1.ru/material/2018/07/10/superfluidity" rel="noopener" target="_blank">nplus1.ru</a>.'
      otryvok: "«По производительности установка в несколько раз превосходила все существовавшие в то время аналоги: выход жидкого гелия достигал 18 литров в час»."
      stranica: «Чашка жидкого гелия», N+1, 10.07.2018 (рассказывает Я. Фоминов, ИТФ им. Л. Д. Ландау РАН)
      href: https://nplus1.ru/material/2018/07/10/superfluidity
      pometka: документ
    - summary: <b>Факт 7 из 10.</b> Ландау стал академиком сразу, перескочив через ступень члена-корреспондента.
      det:
        - Обычно учёный сначала становится членом-корреспондентом Академии наук и лишь потом академиком. В 1946 году Ландау, которому было 38 лет, избрали академиком без этой ступени.
      src: 'Источник: «Ландау Лев Давидович», «История Росатома» (biblioatom.ru), раздел «Персоналии» — <a href="https://www.biblioatom.ru/persons/landau_lev_davidovich/" rel="noopener" target="_blank">biblioatom.ru</a>.'
      otryvok: «В 1946 году Л. Д. Ландау был избран действительным членом (академиком) АН СССР, миновав звание члена-корреспондента».
      stranica: «Ландау Лев Давидович», «История Росатома» (biblioatom.ru), раздел «Персоналии»
      href: https://www.biblioatom.ru/persons/landau_lev_davidovich/
      pometka: документ
    - summary: <b>Факт 8 из 10.</b> Ландау посчитал атомную бомбу «на бумаге», а полгода машинного счёта подтвердили его ответ.
      det:
        - Электронных машин тогда не было. Теоретический отдел Ландау вычислял, сколько энергии выделят первые советские атомные бомбы.
        - Потом бригады девушек-вычислителей неделями и месяцами повторяли расчёт на клавишных машинах — и подтвердили упрощённые вычисления Ландау.
      src: 'Источник: «ЭС: Атомный проект», Летопись Московского университета — <a href="https://letopis.msu.ru/content/es-atomnyy-proekt" rel="noopener" target="_blank">letopis.msu.ru</a>.'
      otryvok: «…выполнялись большими коллективами девушек-вычислителей, занимая сроки от недель до полугода. Этими силами группой А.Н. Тихонова были проведены прямые расчёты взрыва плутониевого, а затем и урановых шаров (1949), в значительной степени подтвердившие правильность более упрощённых вычислений Л.Д. Ландау».
      stranica: "«ЭС: Атомный проект», Летопись Московского университета"
      href: https://letopis.msu.ru/content/es-atomnyy-proekt
      pometka: документ
    - summary: <b>Факт 9 из 10.</b> За атомный проект Ландау получил звезду Героя и три премии, а потом сам ушёл из секретной работы.
      det:
        - За расчёты атомной и водородной бомб он получил три государственные премии, орден Ленина и звание Героя Социалистического Труда.
        - После 1953 года Ландау твёрдо решил вернуться к чистой науке — и добился своего.
      src: 'Источник: «Ландау Лев Давидович», «История Росатома» (biblioatom.ru), раздел «Персоналии» — <a href="https://www.biblioatom.ru/persons/landau_lev_davidovich/" rel="noopener" target="_blank">biblioatom.ru</a>.'
      otryvok: «За работу в Атомном проекте удостоен трех Сталинских премий (1946 г., 1949 г., 1953 г.), награждён орденом Ленина (1949 г.), ему присвоено звание Героя Социалистического Труда (1954 г.)».
      stranica: «Ландау Лев Давидович», «История Росатома» (biblioatom.ru), раздел «Персоналии»
      href: https://www.biblioatom.ru/persons/landau_lev_davidovich/
      pometka: документ
    - summary: "<b>Факт 10 из 10.</b> Наши физики доказали: вращающийся сверхтекучий гелий пружинит, как ни одна жидкость."
      det:
        - Э. Л. Андроникашвили, ученик Капицы, подвесил в гелии стопку тонких дисков на нити и закручивал их.
        - Оказалось, что вращающийся гелий упруго сопротивляется закручиванию — обычные жидкости так себя не ведут. Объяснение советских физиков время подтвердило.
      src: 'Источник: Э. Андроникашвили, «Воспоминания о жидком гелии», «Химия и жизнь», 1982, № 1–3 — <a href="https://www.eduspb.com/public/books/byograf/andronikashvili_iz_vospominaniya_o_zhidkom_gelii_genri_holl.pdf" rel="noopener" target="_blank">eduspb.com</a>.'
      otryvok: «гелий-II, вопреки поведению всех других жидкостей, оказывает упругое сопротивление закручиванию его вокруг оси вращения. Время показало, что правда была на нашей стороне».
      stranica: Э. Андроникашвили, «Воспоминания о жидком гелии», «Химия и жизнь», 1982, № 1–3
      href: https://www.eduspb.com/public/books/byograf/andronikashvili_iz_vospominaniya_o_zhidkom_gelii_genri_holl.pdf
      pometka: документ
razdely:
  - posle: fakty
    html: |-
      <section class="block" id="pyat-faktov">
        <div class="wrap">
          <div class="kicker">Пять фактов о Ландау</div>
          <h2>Тюрьма, шкала гениев и Нобель в больнице</h2>
          <ol class="udary">
            <li><details><summary><span>Ландау вышел из тюрьмы НКВД под поручительство Капицы — и объяснил его главное открытие.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>28 апреля 1938 г. Ландау арестован; в тот же день Капица пишет Сталину, что Ландау с Фоком — «самые крупные физики-теоретики», хоть он «задира и забияка». Через год Капица добивается освобождения «под личное своё поручительство». В 1941 г. Ландау объяснил сверхтекучесть гелия, открытую Капицей.</p>
                <p class="src-note">Источник: Мемориальный музей-кабинет П. Л. Капицы ИФП РАН — письмо П. Л. Капицы И. В. Сталину, 28.04.1938; хронология.</p>
              </div></details></li>
            <li><details><summary><span>Ландау делил физиков на классы, где чем меньше число, тем гениальнее: Эйнштейн — 0,5, Бор — 1, а себя он с годами поднял с 2,5 до 1,5.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Шкала логарифмическая: каждый следующий класс слабее предыдущего в десять раз. Класс 0,5 — только Эйнштейн, класс 1 — Бор, Гейзенберг и ещё несколько. Себя Ландау поставил в 2,5, потом во 2-й и затем в 1,5 — то есть с годами поднимал себя выше: меньше число — гениальнее.</p>
                <p class="src-note">Источник: Российская академия наук, новость портала (по интервью «Российской газете», 22.01.2008).</p>
              </div></details></li>
            <li><details><summary><span>Экзамен Ландау был таким, что за 28 лет его сдали всего 43 человека.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>„Теоретический минимум“ — девять экзаменов у самого Ландау; „с 1933 до 1961 г. … сдали 43 человека“.</p>
                <p class="src-note">Источник: Летопись Московского университета, «Ландау Лев Давидович».</p>
              </div></details></li>
            <li><details><summary><span>Впервые в истории Нобелевскую вручили в больнице — ради Ландау шведы нарушили собственные правила.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>7 января 1962 г. Ландау разбился в автокатастрофе по дороге в Дубну. 10 декабря 1962 г. премию ему вручил посол Швеции Рольф Сульман в конференц-зале Центральной больницы АН СССР в Москве. Посол: «Впервые за всю историю Нобелевских премий… допускается отступление от существующих правил».</p>
                <p class="src-note">Источник: Летопись Московского университета; ГПНТБ СО РАН, электронная выставка «Ландау»; фотобанк РИА Новости, вручение премии 10.12.1962.</p>
              </div></details></li>
            <li><details><summary><span>Свои теории Ландау придумывал лёжа на диване — за столом он почти не работал.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Сын, И. Л. Ландау: «Дома он работал, лёжа на диване. Практически никогда — сидя за столом». Этот снимок — в кадрах дня ниже: он из собрания Государственного исторического музея.</p>
                <p class="src-note">Источник: Российская академия наук, перепечатка интервью И. Л. Ландау «Российской газете»; Госкаталог музейного фонда РФ, рег. № 35185685 (ГИМ, И IX 13541).</p>
              </div></details></li>
          </ol>
          <figure class="fig">
            <img src="day-22jan-landau-diplom.jpg" data-source="https://goskatalog.ru/portal/#/collections?id=35682369" data-license="цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Государственный исторический музей · Госкаталог, рег. № 35487249" width="800" height="600" loading="lazy" alt="Лист Нобелевского диплома в чёрной орнаментальной рамке: шведский текст, крупно имя «Lev Davidovič Landau», ниже «Stockholm den 10 december 1962», две подписи и круглая печать Академии">
            <figcaption>Нобелевский диплом Ландау: „Стокгольм, 10 декабря 1962“ — а вручали его в московской больнице. <span class="credit">Фотография второго листа диплома. Хранится: Государственный исторический музей (Арх. 4614). Госкаталог музейного фонда РФ, рег. № 35487249.</span></figcaption>
          </figure>
        </div>
      </section>
  - posle: pervenstvo
    html: |-
      <section class="block" id="trudno-poverit">
        <div class="wrap">
          <div class="kicker">Ландау и его гелий</div>
          <h2 class="h2-tight">В это трудно поверить</h2>
          <div class="q"><h3><em>Факт 1</em>В 13 лет он окончил школу, в 14 — стал студентом</h3><p>«В тринадцать лет он окончил школу и научился интегрировать, в четырнадцать – поступил в Бакинский университет». К 19 годам у него было четыре научные работы.</p></div>
          <div class="q"><h3><em>Факт 2</em>Гелий убегает по плёнке в тысячу атомов</h3><p>Толщина плёнки, по которой сверхтекучий гелий выбирается из пробирки, — около 3·10⁻⁶ см, примерно 1000 атомных слоёв.</p></div>
          <div class="q"><h3><em>Факт 3</em>Тепло, которое бежит волной</h3><p>Теория Ландау предсказала «второй звук»: в сверхтекучем гелии волной бежит не давление, а тепло.</p></div>
          <div class="q"><h3><em>Факт 4</em>Поручился за «задиру и забияку»</h3><p>В письме Сталину Капица честно написал о Ландау: характер у него «скверный. Он задира и забияка». И всё равно через год вытащил его из тюрьмы под личное поручительство.</p></div>
          <div class="q"><h3><em>Факт 5</em>Нобелевская премия — в больничном зале</h3><p>10 декабря 1962 года посол Швеции вручил премию в конференц-зале Центральной больницы АН СССР. Сам посол сказал: «Впервые за всю историю Нобелевских премий… допускается отступление от существующих правил».</p></div>
        </div>
      </section>
  - posle: pervenstvo
    html: |-
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2 class="iz-u3">Для тех, кто смотрит внимательно</h2>
          <details class="deepd">
            <summary>Три сюжета подробно — развернуть</summary>
            <h3>Почему сверхтекучесть, а не просто жидкость</h3>
            <p>Любая обычная жидкость вязкая: она трётся о стенки и сама о себя. Гелий ниже 2,17 К проходил сквозь щели шириной около 10⁻⁴ см совсем без трения — поэтому Капица и назвал явление сверхтекучестью. Вместе с этим теплопроводность гелия скачком растёт почти в миллион раз: тепло разносится мгновенно, и кипение пузырями прекращается. А тонкая плёнка поднимается по стенкам и уводит жидкость через край.</p>
            <h3>Что такое лямбда-точка</h3>
            <p>Так называют температуру 2,17 градуса над абсолютным нулём. Выше неё жидкий гелий — гелий I, обычная кипящая жидкость. Ниже — гелий II, сверхтекучий. В модели на этой странице лямбда-точка — золотая риска на термометре.</p>
            <h3>Откуда классы физиков</h3>
            <p>Шкалу Ландау пересказывает новость Российской академии наук по интервью «Российской газете» 22 января 2008 года. Шкала логарифмическая: каждый следующий класс слабее предыдущего в десять раз. В классе 0,5 «был всего один человек – Эйнштейн», в первом — Бор, Гейзенберг и ещё несколько. Себя Ландау с годами перевёл из 2,5 во 2-й, а затем в 1,5.</p>
          </details>
          <div class="src">Источники: nkj.ru · ufn.ru · ras.ru · kapitza.ras.ru · letopis.msu.ru</div>
        </div>
      </section>
