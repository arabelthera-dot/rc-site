        podpis: "Нобелевский диплом Ландау, 1962: по-шведски написано «за основополагающие теории конденсированной материи, в особенности жидкого гелия» (särskilt flytande helium)."
        credit: "Фото: автор не указан, 1962. Хранится: Государственный исторический музей (Арх. 4614, ГИМ 98321/2649). Госкаталог музейного фонда РФ, рег. № 35487249."
