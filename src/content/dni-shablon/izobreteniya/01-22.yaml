  intro: Та же история коротким роликом — от гелия, который у Капицы течёт без трения, до объяснения Ландау и Нобелевской премии 1962 года.
  poster: video/day-22jan-landau-poster.jpg?v=1
  mp4: video/day-22jan-landau.mp4?v=1
  note: "Кадры ролика — подлинные, из Госкаталога музейного фонда РФ: Л. Д. Ландау за работой дома; гелиевый ожижитель П. Л. Капицы; Нобелевский диплом Ландау 1962 года. Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История открытия
  h2: Капица увидел, Ландау объяснил
  udary:
    - summary: Ниже 2,17 градуса над абсолютным нулём жидкий гелий течёт совсем без трения — это открыл Пётр Капица.
      utverzhdeno: Р334
      det:
        - 1937–1938 годы, Институт физических проблем в Москве. Капица пропускал гелий сквозь капилляры диаметром около 10⁻⁴ миллиметра — и ниже 2,17 К гелий проходил их без всякого трения. Капица сообщил об открытии сверхтекучести.
      src: "Источник: Мемориальный музей-кабинет П. Л. Капицы ИФП РАН, хронология; «Наука и жизнь», статья о жидком гелии."
    - summary: "Налей такой гелий в пробирку — он не удержится: поднимется по стенкам и уйдёт через край."
      utverzhdeno: Р334
      det:
        - "По стенке ползёт плёнка толщиной около 3·10⁻⁶ см — примерно 1000 атомных слоёв. «Наука и жизнь»: гелий «выбирается из пробирки через край и либо весь выливается в ванну с гелием, либо течёт (вверх!) до тех пор, пока уровни не сравняются»."
      src: "Источник: «Наука и жизнь», статья о жидком гелии."
    - summary: "В 1941-м Ландау объяснил чудо: в гелии сразу две жидкости — обычная и сверхтекучая."
      utverzhdeno: Р334
      det:
        - Статья «Теория сверхтекучести гелия II» вышла в ЖЭТФ, т. 11, вып. 6, с. 592. Её ключ — «одновременное существование двух движений — сверхтекучего и нормального».
      src: "Источник: «Успехи физических наук», 1967 — перепечатка статьи Л. Д. Ландау «Теория сверхтекучести гелия II» (ЖЭТФ, 1941)."
    - summary: Ландау нарисовал главную кривую своей теории на глаз, по одной интуиции. Через годы точки опыта легли прямо на неё — и зал аплодировал.
      utverzhdeno: Р334
      det:
        - "Это кривая энергии ротонов — «порций» теплового движения в гелии. Позже её измерили пучками нейтронов: «точки … легли прямо на кривую, проведенную Ландау. Зал рукоплескал докладчику»."
      src: "Источник: Э. Л. Андроникашвили, «Воспоминания о жидком гелии», «Химия и жизнь», 1982, № 1–3."
    - summary: "Теория предсказала то, чего никто не слышал, — «второй звук»: в гелии волной бежит тепло."
      utverzhdeno: Р334
      det:
        - "Предсказание вышло прямо из двух жидкостей: если в гелии одновременно есть два движения, по нему может бежать не только обычный звук, но и волна тепла."
      src: "Источник: Физический факультет МГУ, газета «Советский физик», 2008, № 1 (61)."
    - summary: За это в 1962 году Ландау дали Нобелевскую премию — «в особенности за жидкий гелий».
      utverzhdeno: Р334
      det:
        - "Формулировка — «за основополагающие теории конденсированной материи, в особенности жидкого гелия»."
      src: "Источник: РИА Новости, 07.10.2013; Летопись Московского университета, «Ландау Лев Давидович»."
    - summary: Капица получил Нобелевскую премию за само открытие только в 1978 году — на 16 лет позже Ландау. Один стакан гелия принёс нашей стране две Нобелевские премии.
      utverzhdeno: Р334
      det:
        - "Сверхтекучесть «открыл … Петр Капица в 1938 году, за что ему присудили Нобелевскую премию по физике 1978 года». А Ландау за объяснение «в 1962 году удостоился Нобелевской премии — на 16 лет раньше Капицы»."
      src: "Источник: «Чашка жидкого гелия», N+1, 10.07.2018."
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о Ландау
  h2: Вундеркинд, которого не остановили
  udary:
  - summary: '<b>Ландау вышел из тюрьмы НКВД под поручительство Капицы — и объяснил его главное открытие.</b>'
    det:
    - 28 апреля 1938 года Ландау арестовали. В тот же день Капица написал Сталину, что Ландау с Фоком — «самые крупные физики-теоретики», хоть он «задира и забияка».
    - Через год, 28 апреля 1939-го, Капица добился освобождения Ландау «под личное своё поручительство». А в 1941 году Ландау объяснил сверхтекучесть гелия, которую открыл Капица.
    src: 'Источник: Мемориальный музей-кабинет П. Л. Капицы ИФП РАН — письмо П. Л. Капицы И. В. Сталину, 28.04.1938 — <a href="https://kapitza.ras.ru/museum/letter1.htm" rel="noopener" target="_blank">kapitza.ras.ru</a>; хронология — <a href="https://kapitza.ras.ru/history/PLKapitza/mainK.html" rel="noopener" target="_blank">kapitza.ras.ru/history</a>'
    otryvok: '«самые крупные физики-теоретики» … «Он задира и забияка»'
    stranica: Мемориальный музей-кабинет П. Л. Капицы ИФП РАН, письмо П. Л. Капицы И. В. Сталину, 28.04.1938
    href: 'https://kapitza.ras.ru/museum/letter1.htm'
    pometka: документ
    utverzhdeno: Р334
  - summary: '<b>Экзамен Ландау был таким, что за 28 лет его сдали всего 43 человека.</b>'
    det:
    - '«Теоретический минимум» — девять экзаменов, которые Ландау принимал сам. По Летописи МГУ, «с 1933 до 1961 г. … сдали 43 человека».'
    src: 'Источник: Летопись Московского университета, «Ландау Лев Давидович» — <a href="http://letopis.msu.ru/peoples/7575" rel="noopener" target="_blank">letopis.msu.ru</a>'
    otryvok: '«с 1933 до 1961 г. … сдали 43 человека»'
    stranica: Летопись Московского университета, «Ландау Лев Давидович»
    href: 'http://letopis.msu.ru/peoples/7575'
    pometka: документ
    utverzhdeno: Р334
  - summary: '<b>Ландау рассчитал атомную бомбу на бумаге — вычислители месяцами проверяли его, и всё сошлось.</b>'
    det:
    - Счёт вели «большими коллективами девушек-вычислителей, занимая сроки от недель до полугода». В 1949 году он «в значительной степени» подтвердил упрощённые вычисления Ландау.
    - За атомный проект Ландау получил Сталинские премии 1949 и 1953 годов, орден Ленина и звание Героя Социалистического Труда. Ещё одну Сталинскую премию, 1946 года, ему дали за работы о сверхпроводниках и гелии II.
    src: 'Источник: Летопись Московского университета, «ЭС: Атомный проект» — <a href="https://letopis.msu.ru/content/es-atomnyy-proekt" rel="noopener" target="_blank">letopis.msu.ru</a>; «История Росатома», «Ландау Лев Давидович» — <a href="https://www.biblioatom.ru/persons/landau_lev_davidovich/" rel="noopener" target="_blank">biblioatom.ru</a>; Летопись Московского университета, «Ландау Лев Давидович» — <a href="http://letopis.msu.ru/peoples/7575" rel="noopener" target="_blank">letopis.msu.ru/peoples/7575</a>'
    otryvok: '«большими коллективами девушек-вычислителей, занимая сроки от недель до полугода» … «в значительной степени подтвердившие правильность более упрощённых вычислений Л.Д. Ландау» … «Лауреат Государственной премии СССР за научные исследования по фазовым превращениям, завершившиеся работами «К теории промежуточного состояния сверхпроводников» и «К гидродинамике гелия II» (1946)»'
    stranica: 'Летопись Московского университета, «ЭС: Атомный проект»'
    href: 'https://letopis.msu.ru/content/es-atomnyy-proekt'
    pometka: два источника
    utverzhdeno: Р334
  - summary: '<b>Впервые в истории Нобелевскую премию вручили в больнице — ради Ландау отступили от правил премии.</b>'
    det:
    - 7 января 1962 года Ландау тяжело разбился в автокатастрофе по дороге в Дубну. Ехать за премией он не мог.
    - 10 декабря 1962 года премию вручили прямо в конференц-зале Центральной больницы Академии наук СССР в Москве — впервые за всю историю премии.
    src: 'Источник: Летопись Московского университета, «Ландау Лев Давидович» — <a href="http://letopis.msu.ru/peoples/7575" rel="noopener" target="_blank">letopis.msu.ru</a>; ГПНТБ СО РАН, электронная выставка «Ландау» — <a href="https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi" rel="noopener" target="_blank">prometeus.nsc.ru</a>'
    otryvok: '«Впервые за всю историю Нобелевских премий… допускается отступление от существующих правил»'
    stranica: ГПНТБ СО РАН, электронная выставка «Ландау»
    href: 'https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi'
    pometka: два источника
    utverzhdeno: Р334
  - summary: '<b>Свои теории Ландау придумывал лёжа на диване — за столом он почти не работал.</b>'
    det:
    - 'Сын учёного, И. Л. Ландау, вспоминал: «Дома он работал, лёжа на диване. Практически никогда — сидя за столом».'
    - Так он и снят на фотографии из собрания Государственного исторического музея — она в кадрах дня ниже.
    src: 'Источник: Российская академия наук, перепечатка интервью И. Л. Ландау «Российской газете» — <a href="https://www.ras.ru/news/shownews.aspx?id=683dca0e-eedd-4f75-837d-f8c1bce7a668" rel="noopener" target="_blank">ras.ru</a>; Госкаталог музейного фонда РФ, рег. № 35185685 (ГИМ, И IX 13541)'
    otryvok: '«Дома он работал, лёжа на диване. Практически никогда — сидя за столом»'
    stranica: Российская академия наук, интервью И. Л. Ландау «Российской газете»
    href: 'https://www.ras.ru/news/shownews.aspx?id=683dca0e-eedd-4f75-837d-f8c1bce7a668'
    pometka: документ
    utverzhdeno: Р334
  - summary: '<b>В 13 лет Ландау окончил школу, а в 14 стал студентом сразу двух факультетов</b>'
    det:
    - В тринадцать лет Ландау уже окончил школу и умел интегрировать. В четырнадцать поступил в Бакинский университет — и учился одновременно на физико-математическом и химическом факультетах.
    - Сложные расчёты он делал в уме, без логарифмической линейки и справочников.
    src: 'Источник: «Самую большую любовь Льва Ландау звали Наукой», РИА Новости, 17.11.2008 — <a href="https://ria.ru/20081117/155351495.html" rel="noopener">ria.ru/20081117/155351495.html</a>.'
    otryvok: '«Уже в тринадцать лет он окончил школу и научился интегрировать, в четырнадцать – поступил в Бакинский университет, где обучался одновременно на двух факультетах: физико-математическом и химическом.»'
    stranica: '«Самую большую любовь Льва Ландау звали Наукой», РИА Новости, 17.11.2008'
    href: 'https://ria.ru/20081117/155351495.html'
    pometka: документ
  - summary: '<b>Ландау стал академиком, перепрыгнув через ступень, — без звания член-корреспондента</b>'
    det:
    - Обычно учёный сначала становится членом-корреспондентом Академии наук и лишь потом академиком.
    - Ландау в 1946 году избрали сразу академиком — минуя первую ступень. Это было всего через семь лет после того, как его выпустили из тюрьмы.
    src: 'Источник: С. Шаракшанэ, «Учёный в России больше, чем учёный» (выставка Архива РАН), портал РАН, 09.10.2019 — <a href="https://www.ras.ru/news/shownews.aspx?id=a778a10f-8663-4880-8e61-807596b299f9" rel="noopener">www.ras.ru/news/shownews.aspx?id=a778a10f-8663-4880-8e61-807596b299f9</a>.'
    otryvok: '«Ландау избирают в академики в 1946 году, минуя ступень члена-корреспондента.»'
    stranica: С. Шаракшанэ, «Учёный в России больше, чем учёный» (выставка Архива РАН), портал РАН, 09.10.2019
    href: 'https://www.ras.ru/news/shownews.aspx?id=a778a10f-8663-4880-8e61-807596b299f9'
    pometka: документ
  - summary: '<b>Ландау стал доктором наук без защиты диссертации — хватило его работ</b>'
    det:
    - Чтобы стать доктором наук, обычно пишут и защищают большую диссертацию.
    - Ландау в 1934 году, в 26 лет, получил докторскую степень без защиты — её присудили по совокупности уже опубликованных работ.
    src: 'Источник: «Ландау Лев Давидович», Летопись Московского университета — <a href="http://letopis.msu.ru/peoples/7575" rel="noopener">letopis.msu.ru/peoples/7575</a>.'
    otryvok: '«Доктор физико-математических наук (1934, без защиты диссертации).»'
    stranica: '«Ландау Лев Давидович», Летопись Московского университета'
    href: 'http://letopis.msu.ru/peoples/7575'
    pometka: документ
  - summary: '<b>Из МГУ Ландау уволили в 1950-м, а в 1953-м вернули голосованием против декана</b>'
    det:
    - В 1950 году вслед за Капицей Ландау освободили от работы в Московском университете.
    - Через три года комиссия снова обсуждала его кандидатуру. Декан физфака резко выступил против, но большинство проголосовало «за» — и Ландау вернулся читать лекции.
    src: 'Источник: «Ландау Лев Давидович», Летопись Московского университета — <a href="http://letopis.msu.ru/peoples/7575" rel="noopener">letopis.msu.ru/peoples/7575</a>.'
    otryvok: '«Резко против высказался декан физического факультета А.А. Соколов, однако большинством голосов кандидатура была одобрена.»'
    stranica: '«Ландау Лев Давидович», Летопись Московского университета'
    href: 'http://letopis.msu.ru/peoples/7575'
    pometka: документ
  - summary: '<b>Ландау звали работать в лучшие институты за границей — он каждый раз отказывал</b>'
    det:
    - В молодости Ландау стажировался в Европе, и руководители крупных научных учреждений не раз звали его остаться у них.
    - 'Ландау неизменно отказывался и вернулся домой: роскошь его не интересовала, он хотел, чтобы лучшее в мире образование было в его стране.'
    src: 'Источник: «Самую большую любовь Льва Ландау звали Наукой», РИА Новости, 17.11.2008 — <a href="https://ria.ru/20081117/155351495.html" rel="noopener">ria.ru/20081117/155351495.html</a>.'
    otryvok: '«За границей Ландау получал множество предложений руководителей крупных научных учреждений, но Ландау неизменно отказывался.»'
    stranica: '«Самую большую любовь Льва Ландау звали Наукой», РИА Новости, 17.11.2008'
    href: 'https://ria.ru/20081117/155351495.html'
    pometka: документ
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Как физики спасали Ландау
  udary:
  - summary: '<b>Ландау спасали в больнице 87 физиков — они сутками дежурили там, как в штабе</b>'
    det:
    - После аварии 7 января 1962 года физики не уходили из больницы даже ночью. Им отдали комнату рядом с кабинетом главврача — так возник «физический штаб».
    - 'Ученики Ландау стали курьерами, шофёрами и диспетчерами: встречали в аэропорту самолёты с лекарствами, звонили врачам за границу. В книге дежурств набралось 87 фамилий.'
    src: 'Источник: М. Бессараб, «Страницы жизни Ландау» (М.: Московский рабочий, 1971), электронная выставка ГПНТБ СО РАН — <a href="https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi" rel="noopener">www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi</a>.'
    otryvok: '«Так возник знаменитый «физический штаб». В книге дежурства штаба – 87 фамилий! Ученики Дау, а также ученики его учеников на время превратились в диспетчеров, курьеров, шоферов.»'
    stranica: 'М. Бессараб, «Страницы жизни Ландау» (М.: Московский рабочий, 1971), электронная выставка ГПНТБ СО РАН'
    href: 'https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi'
    pometka: документ
  - summary: '<b>Ландау перестал дышать — физики на плечах вынесли машину-лёгкие и успели за час</b>'
    det:
    - 12 января 1962 года в пять утра Ландау почти перестал дышать, а аппарата искусственного дыхания в больнице не было.
    - 'Физики узнали, где он есть, сами вынесли тяжёлую машину, остановили проезжий грузовик и привезли её в палату. «Опоздай они на час, больной, вероятно, уже перестал бы дышать», — писала Майя Бессараб. Смерть отступила в третий раз.'
    src: 'Источник: М. Бессараб, «Страницы жизни Ландау» (М.: Московский рабочий, 1971), электронная выставка ГПНТБ СО РАН — <a href="https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi" rel="noopener">www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi</a>.'
    otryvok: '«Физики узнали, где есть аппарат Энгстрема, на плечах вынесли тяжелую машину, остановили проходившую мимо трехтонку, перевезли на ней аппарат и перенесли его в палату. Опоздай они на час, больной, вероятно, уже перестал бы дышать.»'
    stranica: 'М. Бессараб, «Страницы жизни Ландау» (М.: Московский рабочий, 1971), электронная выставка ГПНТБ СО РАН'
    href: 'https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi'
    pometka: документ
  - summary: '<b>Ради лекарства для Ландау рейсовый самолёт в Москву задержали на целый час</b>'
    det:
    - Врачи узнали, что за границей есть редкое лекарство, которое может спасти Ландау. Английский физик Джон Кокрофт вместе с издателем Ландау Максвеллом достал его, но они опаздывали к самолёту на Москву.
    - Они позвонили в аэропорт — и рейс задержали на час. Пакет с надписью «Для Ландау» отдали лётчику, а в Москве самолёт уже ждал дежурный физик.
    src: 'Источник: М. Бессараб, «Страницы жизни Ландау» (М.: Московский рабочий, 1971), электронная выставка ГПНТБ СО РАН — <a href="https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi" rel="noopener">www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi</a>.'
    otryvok: '«Когда в аэропорту узнали, что речь идет о доставке медикаментов для тяжело раненого, самолет был задержан на целый час.»'
    stranica: 'М. Бессараб, «Страницы жизни Ландау» (М.: Московский рабочий, 1971), электронная выставка ГПНТБ СО РАН'
    href: 'https://www.prometeus.nsc.ru/archives/exhibits/landau/pagelif6.ssi'
    pometka: документ
  - summary: '<b>Ландау не читал научных статей — их читали ученики, а он сам пересчитывал всё</b>'
    det:
    - 'У Ландау была необычная привычка: научную литературу он не читал, поручая это ученикам.'
    - Если чужая идея его увлекала, он сам заново проделывал все вычисления — и так докапывался до сути глубже авторов.
    src: 'Источник: «Ландау Лев Давидович», Летопись Московского университета — <a href="http://letopis.msu.ru/peoples/7575" rel="noopener">letopis.msu.ru/peoples/7575</a>.'
    otryvok: '«Одной из особенностей научной работы Л.Д. Ландау было то, что сам он не читал научной литературы, поручая это ученикам.»'
    stranica: '«Ландау Лев Давидович», Летопись Московского университета'
    href: 'http://letopis.msu.ru/peoples/7575'
    pometka: документ
  - summary: '<b>Курс физики Ландау вырос в 10 томов — последние дописали уже после его смерти</b>'
    det:
    - Первые ученики Ландау учились по рукописным конспектам. В 1938 году он вместе с Е. М. Лифшицем начал выпускать «Курс теоретической физики» — студенты прозвали его «Ландавшиц».
    - Курс вырос до 10 томов, за шесть из них в 1962 году дали Ленинскую премию, а закончили весь труд уже после смерти Ландау.
    src: 'Источник: «Ландау Лев Давидович», Летопись Московского университета — <a href="http://letopis.msu.ru/peoples/7575" rel="noopener">letopis.msu.ru/peoples/7575</a>.'
    otryvok: '«В 1938 г. вместе с Е.М. Лифшицем был начат выпуск уникального 10-томного цикла учебных пособий «Курс теоретической физики» (известный у студентов как «Ландавшиц»).»'
    stranica: '«Ландау Лев Давидович», Летопись Московского университета'
    href: 'http://letopis.msu.ru/peoples/7575'
    pometka: документ
