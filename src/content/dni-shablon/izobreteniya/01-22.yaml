return:
  q: С какой температуры жидкий гелий начинает сам вылезать из сосуда?
  a: Ниже 2,17 градуса над абсолютным нулём (лямбда-точка).
  src: «Наука и жизнь», статья о жидком гелии
audioguide:
  audioSrc: "/muzei/izobreteniya/audio-guide-landau-2-ru.mp3"
  durationLabel: 4 минуты 23 секунды
  lead: "Голос ведёт по залу Льва Ландау: от фотографии учёного на диване через опыт Капицы с жидким гелием и опыт со вторым звуком до письма Капицы Сталину. Пять остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Ландау на диване
    - t: 55
      mark: 0:55
      title: Капица увидел
    - t: 104
      mark: 1:44
      title: Две жидкости сразу
    - t: 174
      mark: 2:54
      title: "Игра: второй звук"
    - t: 208
      mark: 3:28
      title: Тюрьма и поручительство
  transcript:
    - "<p>«Здравствуйте. Мы в зале теории сверхтекучести. Найдите на странице фотографию: Лев Ландау лежит на диване на фоне ковра, подперев голову рукой. Перед ним на покрывале листы статьи, в руке карандаш. Так он работал дома всегда — лёжа. Родился Лев Ландау двадцать второго января тысяча девятьсот восьмого года в Баку. Главная мысль зала такая: жидкий гелий сам ползёт вверх по стенке и убегает из сосуда. Ландау объяснил почему, а Нобелевскую премию получал в больнице. Под фотографией полоса из четырёх чисел. Две целых семнадцать сотых градуса над абсолютным нулём — здесь гелий становится сверхтекучим. Тысяча девятьсот сорок первый — год теории Ландау. Сорок три — столько человек сдали его экзамен за двадцать восемь лет. И тысяча девятьсот шестьдесят второй — Нобелевская, врученная в больнице. Пройдём по залу по порядку.»</p>"
    - "<p>«Начнём с истории открытия. Её заголовок: «Капица увидел, Ландау объяснил». Тысяча девятьсот тридцать седьмой — тридцать восьмой годы, Институт физических проблем в Москве. Пётр Капица пропускал жидкий гелий сквозь узкие щели-капилляры. И ниже двух целых семнадцати сотых градуса над абсолютным нулём гелий проходил их совсем без трения. Капица сообщил об открытии сверхтекучести. А если налить такой гелий в пробирку, он не удержится: поднимется по стенкам и уйдёт через край. По стенке ползёт плёнка примерно в тысячу атомных слоёв. Найдите ниже фотографию из музея: высокий металлический цилиндр в стальной раме, рядом голубой сосуд, над ними панель с круглыми манометрами. Это гелиевый ожижитель Капицы. На таких установках в институте получали жидкий гелий.»</p>"
    - "<p>«В тысяча девятьсот сорок первом году Ландау объяснил это чудо. В гелии сразу две жидкости: обычная и сверхтекучая. Его статья называлась «Теория сверхтекучести гелия-два». Ключ теории — «одновременное существование двух движений — сверхтекучего и нормального». Главную кривую своей теории Ландау нарисовал на глаз, по одной интуиции. Через годы её измерили пучками нейтронов, и точки опыта легли прямо на кривую Ландау. Зал рукоплескал. Из этого вышло предсказание того, чего никто не слышал, — «второй звук». В сверхтекучем гелии волной бежит не давление, а тепло. Важно и то, где граница. Само явление открыл не Ландау, а Капица. Ландау — автор теории, которая объяснила, почему так происходит. За это в тысяча девятьсот шестьдесят втором году ему дали Нобелевскую премию — «за основополагающие теории конденсированной материи, в особенности жидкого гелия». А Капица получил Нобелевскую премию за само открытие только в тысяча девятьсот семьдесят восьмом году — на шестнадцать лет позже Ландау. Один стакан гелия принёс нашей стране две Нобелевские премии.»</p>"
    - "<p>«Спуститесь к опыту «Услышь второй звук». Охладите гелий ниже двух и семнадцати сотых градуса над абсолютным нулём — кипение сразу прекратится. Теперь угадайте, с какой скоростью побежит второй звук: Ландау вычислил около двадцати пяти метров в секунду. Дайте тепловой импульс. Первым пролетит обычный звук, а за ним медленно поползёт волна тепла. Поймайте её кнопкой, когда она дойдёт до датчика. В тысяча девятьсот сорок четвёртом году в Институте физических проблем Василий Пешков так и измерил второй звук: девятнадцать и шесть десятых метра в секунду.»</p>"
    - "<p>«Теперь факты о Ландау. Первый — о тюрьме. Двадцать восьмого апреля тысяча девятьсот тридцать восьмого года Ландау арестовали. В тот же день Капица написал Сталину, что Ландау вместе с Фоком — «самые крупные физики-теоретики». И честно добавил, что характер у него «скверный. Он задира и забияка». Ровно через год, двадцать восьмого апреля тысяча девятьсот тридцать девятого года, Капица добился освобождения Ландау «под личное своё поручительство». И ещё один факт. Ландау рассчитал первую атомную бомбу на бумаге. Большие коллективы девушек-вычислителей неделями, а то и по полгода пересчитывали его на клавишных машинах — и всё сошлось. За атомный проект Ландау получил две Сталинские премии, орден Ленина и звание Героя Социалистического Труда. Один увидел — другой объяснил: Капица вытащил Ландау из тюрьмы, а Ландау объяснил открытие Капицы.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
