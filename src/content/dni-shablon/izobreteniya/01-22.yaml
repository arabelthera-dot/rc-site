pervenstvo:
  kicker: Проверка факта
  h2: Что именно сделал Ландау
  granica: <b>Что сделано:</b> в 1941 году Ландау построил теорию сверхтекучести гелия II. В такой жидкости одновременно существуют два движения — сверхтекучее и нормальное. Теория объяснила открытие Капицы и предсказала «второй звук» — волну тепла в гелии.
  net: <b>Где граница:</b> само явление открыл не Ландау, а Пётр Капица в 1937–1938 годах. Ландау объяснил его и предсказал второй звук; в 1944 году второй звук измерил В. П. Пешков в ИФП — 19,6 м/с.
  kolonki:
    - Где
    - Что
    - Когда
  stroki:
    - - Москва, ИФП
      - Капица открывает сверхтекучесть гелия
      - 1937–1938
    - - Москва
      - Ландау арестован; в тот же день Капица пишет Сталину
      - 28 апреля 1938
    - - Москва
      - Ландау освобождён под личное поручительство Капицы
      - 28 апреля 1939
    - - Москва, ЖЭТФ
      - «Теория сверхтекучести гелия II»
      - "1941"
    - - Москва, ИФП
      - В. П. Пешков измеряет второй звук — 19,6 м/с
      - "1944"
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — при 2,17 градуса над абсолютным нулём; 2 — Пётр Капица; 3 — 43 человека; 4 — около 25 метров в секунду; 5 — Василий Пешков."
  ball: 8
  voprosy:
    - q: Ниже какой температуры жидкий гелий становится сверхтекучим?
      o:
        - 4,2 градуса над абсолютным нулём
        - 2,17 градуса над абсолютным нулём
        - 0 градусов Цельсия
      a: 1
      e: 2,17 К — лямбда-точка. Выше неё гелий кипит, как обычная жидкость, ниже — течёт без трения.
    - q: Кто открыл сверхтекучесть гелия?
      o:
        - Лев Ландау
        - Пётр Капица
        - Владимир Фок
      a: 1
      e: Открыл Капица в 1937–1938 годах. Ландау в 1941-м объяснил, почему так происходит.
    - q: Сколько человек сдали «теоретический минимум» Ландау с 1933 по 1961 год?
      o:
        - "43"
        - "430"
        - "4300"
      a: 0
      e: Всего 43 человека за 28 лет — девять экзаменов у самого Ландау.
    - q: С какой скоростью, по расчёту Ландау, бежит второй звук в гелии?
      o:
        - Около 25 метров в секунду
        - Около 340 метров в секунду
        - Около 3000 метров в секунду
      a: 0
      e: Ландау вычислил около 25 м/с — в десять раз медленнее обычного звука в гелии.
    - q: Кто первым измерил второй звук?
      o:
        - Лев Ландау
        - Василий Пешков
        - Пётр Капица
      a: 1
      e: В 1944 году в ИФП Пешков получил 19,6 м/с — почти как предсказал Ландау.
