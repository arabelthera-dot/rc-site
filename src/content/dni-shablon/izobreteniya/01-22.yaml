return:
  q: С какой температуры жидкий гелий начинает сам вылезать из сосуда?
  a: Ниже 2,17 градуса над абсолютным нулём (лямбда-точка).
  src: «Наука и жизнь», статья о жидком гелии
audioguide:
  audioSrc: "/muzei/izobreteniya/audio-guide-landau-ru.mp3"
  durationLabel: 5 минут 49 секунд
  lead: "Голос ведёт по залу Льва Ландау: от фотографии учёного на диване через опыт Капицы с жидким гелием и модель убегающего гелия до Нобелевской премии, врученной в больнице. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Ландау на диване
    - t: 54
      mark: 0:54
      title: Капица увидел
    - t: 104
      mark: 1:44
      title: Две жидкости сразу
    - t: 154
      mark: 2:34
      title: "Игра: гелий убегает"
    - t: 213
      mark: 3:33
      title: Тюрьма и поручительство
    - t: 259
      mark: 4:19
      title: Шкала гениев
    - t: 302
      mark: 5:02
      title: Нобель в больнице
  transcript:
    - "<p>«Здравствуйте. Мы в зале теории сверхтекучести. Посмотрите на фотографию наверху страницы. Лев Ландау лежит на диване на фоне ковра, подперев голову рукой. Перед ним на покрывале листы статьи, в руке карандаш. Так он работал дома всегда — лёжа. Родился Лев Ландау двадцать второго января тысяча девятьсот восьмого года в Баку. Главная мысль зала такая: жидкий гелий сам ползёт вверх по стенке и убегает из сосуда. Ландау объяснил почему, а Нобелевскую премию получал в больнице. Под фотографией полоса из четырёх чисел. Две целых семнадцать сотых градуса над абсолютным нулём — здесь гелий становится сверхтекучим. Тысяча девятьсот сорок первый — год теории Ландау. Сорок три — столько человек сдали его экзамен за двадцать восемь лет. И тысяча девятьсот шестьдесят второй — Нобелевская, врученная в больнице. Пройдём по залу по порядку.»</p>"
    - "<p>«Начнём с истории открытия. Её заголовок: «Капица увидел, Ландау объяснил». Тысяча девятьсот тридцать седьмой — тридцать восьмой годы, Институт физических проблем в Москве. Пётр Капица пропускал жидкий гелий сквозь узкие щели-капилляры. И ниже двух целых семнадцати сотых градуса над абсолютным нулём гелий проходил их совсем без трения. Капица сообщил об открытии сверхтекучести. А если налить такой гелий в пробирку, он не удержится: поднимется по стенкам и уйдёт через край. По стенке ползёт плёнка примерно в тысячу атомных слоёв. Найдите ниже фотографию из музея: высокий металлический цилиндр в стальной раме, рядом голубой сосуд, над ними панель с круглыми манометрами. Это гелиевый ожижитель Капицы. На таких установках в институте получали жидкий гелий.»</p>"
    - "<p>«В тысяча девятьсот сорок первом году Ландау объяснил это чудо. В гелии сразу две жидкости: обычная и сверхтекучая. Его статья называлась «Теория сверхтекучести гелия-два». Ключ теории — «одновременное существование двух движений — сверхтекучего и нормального». Из этого вышло предсказание того, чего никто не слышал, — «второй звук». В сверхтекучем гелии волной бежит не давление, а тепло. Важно и то, где граница. Само явление открыл не Ландау, а Капица. Одновременно с ним течение гелия без трения наблюдали Аллен и Мейзнер. Ландау — автор теории, которая объяснила, почему так происходит. За это в тысяча девятьсот шестьдесят втором году ему дали Нобелевскую премию — «за основополагающие теории конденсированной материи, в особенности жидкого гелия».»</p>"
    - "<p>«Спуститесь к модели «Гелий, который убегает из стакана». В стакане жидкий гелий, четыре целых две десятых градуса над абсолютным нулём. Он кипит, как вода в чайнике. Нажимайте «Охладить» или тяните ползунок температуры. Пока теплее, гелий даже в наклонённом стакане лежит ровно. Наклонить стакан можно пальцем по картинке или вторым ползунком. Золотая риска на термометре — это лямбда-точка, две целых семнадцать сотых градуса. Перейдите её — кипение оборвётся, и гелий тонкой плёнкой полезет вверх по стенке, через край и каплями в ванну. Даже из ровно стоящего стакана. Счётчик «Утекло» начнёт расти. Теперь нажмите «Глазами Ландау»: синие частицы — обычная, вязкая жидкость, золотые — сверхтекучая, она и уходит по стенке. Честная оговорка: это модель, а не расчёт. Доля сверхтекучей части посчитана по упрощённой формуле, а плёнка нарочно толще, чтобы её было видно.»</p>"
    - "<p>«Теперь пять фактов о Ландау. Первый — о тюрьме. Двадцать восьмого апреля тысяча девятьсот тридцать восьмого года Ландау арестовали. В тот же день Капица написал Сталину, что Ландау вместе с Фоком — «самые крупные физики-теоретики». И честно добавил, что характер у него «скверный. Он задира и забияка». Ровно через год, двадцать восьмого апреля тысяча девятьсот тридцать девятого года, Капица добился освобождения Ландау «под личное своё поручительство». Один увидел — другой объяснил: Капица вытащил Ландау из тюрьмы, а Ландау объяснил открытие Капицы. На странице есть развилка «А как поступил бы ты?». Там можно самому решить за Капицу, что делать, а потом узнать, как было на самом деле.»</p>"
    - "<p>«Ландау делил физиков на классы: чем меньше число, тем гениальнее. Шкала логарифмическая: каждый следующий класс слабее предыдущего в десять раз. В классе ноль целых пять десятых был один Эйнштейн, в первом — Бор, Гейзенберг и ещё несколько. Себя Ландау поставил в класс два с половиной, потом во второй, а затем в полтора. Его экзамен назывался «теоретический минимум» — девять экзаменов у самого Ландау. С тысяча девятьсот тридцать третьего по тысяча девятьсот шестьдесят первый год его сдали всего сорок три человека. Сам он начал рано: в тринадцать лет окончил школу и научился интегрировать, в четырнадцать поступил в Бакинский университет. К девятнадцати годам у него было четыре научные работы.»</p>"
    - "<p>«И последняя остановка. Седьмого января тысяча девятьсот шестьдесят второго года Ландау разбился в автокатастрофе по дороге в Дубну. Десятого декабря того же года премию ему вручил посол Швеции Рольф Сульман — в конференц-зале Центральной больницы Академии наук в Москве. Посол сказал: «Впервые за всю историю Нобелевских премий… допускается отступление от существующих правил». Найдите ниже лист диплома в чёрной орнаментальной рамке: шведский текст, крупно имя Ландау, ниже Стокгольм, десятое декабря тысяча девятьсот шестьдесят второго года. Вот и весь зал. Гелий, который сам уходит по стенке. Капица, который увидел, и Ландау, который объяснил. Теперь можно охладить гелий ниже двух целых семнадцати сотых градуса, посмотреть на него глазами Ландау или открыть пять фактов ниже.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
