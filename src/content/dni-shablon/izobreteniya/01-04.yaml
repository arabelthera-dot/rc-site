  - posle: pervenstvo
    html: |-
      <section class="block" id="excursion">
        <div class="wrap">
          <div class="kicker">Аудиогид</div>
          <h2>Фрагмент экскурсии</h2>
          <div class="card" style="border-left:3px solid var(--gold);border-radius:0 16px 16px 0">
            <p>«Заходим в зал невидимых волн. Посмотрите на эту афишу — Одесса, 1898 год, публичная лекция профессора Пильчикова. Билеты раскуплены: город слышал, что профессор показывает чудеса. Вот здесь, на столе, — реконструкция его установки. Слева передатчик с ключом, справа — приёмник, между ними ничего. Совсем ничего. И вот в этом "ничего" — вся суть.</p>
      <p>Пильчиков нажимал ключ — и через весь зал, по воздуху, летела команда. Лампа зажигалась. Семафор поворачивался. Заряд гремел. Заметьте: не сообщение для человека — команда для машины. Этого не делал до него никто в мире.</p>
      <p>А теперь взгляните на витрину справа. Это протектор — его вторая идея, фильтр от чужих сигналов. Чтобы машина слушалась только своего хозяина. Сегодня это называется кодированием канала — и без него не летал бы ни один дрон.</p>
      <p>И последнее, самое тяжёлое. Фотография харьковской лечебницы, май 1908 года. Здесь профессора нашли застреленным. Револьвер рядом, записи военных опытов исчезли, дело закрыли за несколько дней. Самоубийство? Коллеги не верили. Ответа нет до сих пор. Переходим к следующему экспонату».</p>
          </div>
        </div>
      </section>
  - posle: quiz
    html: |2-
          <div class="gm" id="gm_tm">
            <h3>⚖️ Правда или миф</h3>
            <p style="font-weight:600;margin:0 0 12px">«Пильчиков запатентовал радиоуправление раньше Теслы»</p>
            <div><button class="gm-btn" style="width:auto;display:inline-block;margin-right:8px" onclick="tmAns(this,false)">Правда</button><button class="gm-btn" style="width:auto;display:inline-block" onclick="tmAns(this,true)">Миф</button></div>
            <div class="gm-exp" id="tmExp">Миф. Пильчиков вообще не оформлял патент — российские учёные тогда редко это делали. Тесла запатентовал радиоуправляемую лодку в США в 1898 году, и мировой приоритет закрепился за ним.</div>
          </div>
          <div class="gm" id="gm_vb">
            <h3>🤔 Верю — не верю</h3>
            <p style="font-weight:600;margin:0 0 12px">«Смерть Пильчикова до сих пор остаётся неразгаданной»</p>
            <div><button class="gm-btn" style="width:auto;display:inline-block;margin-right:8px" onclick="vbAns(this,true)">Верю</button><button class="gm-btn" style="width:auto;display:inline-block" onclick="vbAns(this,false)">Не верю</button></div>
            <div class="gm-exp" id="vbExp">Верю — и правильно. В мае 1908 года его нашли застреленным в больничной палате. Официально — самоубийство, но записи военных разработок исчезли, а дело закрыли за несколько дней. Историки спорят до сих пор.</div>
          </div>
          <div class="gm" id="gm_char">
            <h3>🧩 Шарада</h3>
            <p style="font-style:italic;line-height:1.8;margin:0 0 12px">«Я проводов не признавал —<br>командовал по воздуху волнами:<br>маяк зажёг, заряд взорвал…<br>А тайну смерти — унёс с нами».</p>
            <button class="gm-btn" style="width:auto" id="charBtn" onclick="charShow()">Показать ответ</button>
            <div class="gm-exp" id="charExp">Николай Пильчиков и его радиоуправление.</div>
          </div>
  - posle: quiz
    html: |-
      <section class="block" id="fork" style="background:rgba(45,140,191,.04)">
        <div class="wrap">
          <div class="kicker">Твой выбор</div>
          <h2>А как поступил бы ты?</h2>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">1903 год. Твои опыты для Черноморского флота — радиовзрыватели, защита связи от помех — легли под сукно: ведомство молчит. Тесла уже запатентовал свою лодку в Америке. Ты на месте Пильчикова — что делаешь?</p>
          <div class="fork-opt">🌍 Еду за границу и патентую — пусть мир узнает, чьё это первенство</div>
          <div class="fork-opt">🔬 Остаюсь: продолжаю опыты, публикуюсь в русских журналах, учу студентов</div>
          <div class="fork-opt">📐 Оставляю радио — сосредоточусь на преподавании и приборах</div>
          <div id="forkReal" style="display:none;margin-top:14px" class="exp"><b>Как было на самом деле.</b> Пильчиков остался: преподавал, строил приборы, публиковался в журналах Русского физико-химического общества. Патент он так и не оформил — и мировой приоритет закрепился за Теслой. А его отчёты для флота исчезли после смерти в 1908-м. Приоритет мало завоевать — его надо ещё и оформить.</div>
        </div>
      </section>
