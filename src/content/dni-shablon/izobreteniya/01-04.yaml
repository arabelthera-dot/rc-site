story:
  kicker: История изобретения
  h2: Человек, который управлял миром по воздуху
  abzacy:
    - <p><b>Весна 1898 года, Одесса.</b> В зале собралась публика — профессора, студенты, любопытные горожане. На сцене — профессор Николай Пильчиков с небольшим прибором. В дальнем конце зала — макет яхты, орудийный заряд, электрическая лампа. Пильчиков нажимает ключ. Ни один провод не тянется через зал — но лампа вспыхивает, заряд гремит, модель приходит в движение. Зрители не понимают, как это возможно. Они только что увидели первое в мире публичное радиоуправление.</p>
    - "<p><b>Кто этот человек.</b> Сын полтавского преподавателя истории и политической экономии, Пильчиков окончил Харьковский университет и остался в нём преподавать. Коллеги считали его «человеком-лабораторией»: он собирал приборы своими руками и ставил опыты, на которые не решались другие. В 26 лет он открыл аномалии земного магнетизма под Курском — то, что через полвека назовут Курской магнитной аномалией и что окажется крупнейшим железорудным бассейном мира. Уже в 1896 году, в год открытия рентгеновских лучей, сам делал рентгеновские снимки. Изобрёл около 25 приборов, включая протектор — устройство защиты радиоприёма от помех, предвосхитившее военную радиоэлектронику.</p>"
    - "<p><b>В чём была загвоздка.</b> Радио только родилось: Попов показал свой приёмник в 1895 году, Маркони запатентовал передатчик в 1896-м. Но все видели в радио одно — беспроволочный телеграф, замену азбуки Морзе. Пильчиков увидел другое: радиоволной можно не только передать сообщение — ею можно <b>управлять машиной</b>. Это принципиально иной уровень: сигнал не для человека, а для механизма.</p>"
    - "<p><b>Как родилась идея.</b> Пильчиков занимался электромагнетизмом двадцать лет и понимал: приёмник может не просто фиксировать сигнал, а замыкать электрическую цепь. А цепь может делать что угодно — зажечь лампу, поднять флаг, взорвать заряд, запустить двигатель. Оставалась проблема помех: как сделать, чтобы устройство слушалось только «своего» передатчика? Так появился протектор Пильчикова — фильтр, отсеивающий чужие сигналы. По сути, первый шаг к кодированной связи.</p>"
    - "<p><b>Что он показал.</b> На демонстрациях Пильчиков по радио зажигал огни маяка, заставлял вращаться модель железнодорожного семафора, взрывал небольшие заряды и управлял механизмами. Каждый номер программы бил в одну точку: машиной можно управлять на расстоянии, без проводов. В том же 1898 году, за океаном, Никола Тесла показал радиоуправляемую лодку в Нью-Йорке — и запатентовал её. Пильчиков патент не оформил.</p>"
    - "<p><b>Испытания для флота.</b> Военные заинтересовались: в 1902–1903 годах Пильчиков вёл работы для Черноморского флота — опыты по радиоуправлению взрывателями и защите корабельной радиосвязи от помех. Его отчёты ушли в военное ведомство и легли под сукно. Продолжения не последовало.</p>"
    - "<p><b>Горькая часть.</b> Пильчиков не получил ни патента, ни премии, ни кафедры в столице. Мировой приоритет радиоуправления закрепился за Теслой — тот действовал в Америке и понимал силу патентного права. А в мае 1908 года Пильчикова нашли застреленным в палате харьковской лечебницы, куда он лёг на лечение. Револьвер лежал рядом. Официальная версия — самоубийство. Коллеги не поверили: накануне он строил планы опытов, а его лабораторные записи по военным разработкам исчезли. Дело закрыли за несколько дней. Загадка не разгадана до сих пор.</p>"
    - "<p><b>Финал.</b> Принцип, который Пильчиков показал публике в 1898 году, стал фундаментом века: радиовзрыватели Второй мировой, телеметрия космических аппаратов, пульты, Wi-Fi, дроны, беспилотные автомобили. Каждый раз, когда человек нажимает кнопку — а машина слушается на расстоянии, — работает идея, впервые показанная в одесском зале.</p>"
    - <p><b>Человек.</b> Николай Дмитриевич Пильчиков (1857–1908) — физик, геофизик, изобретатель. Родился в Полтаве в семье преподавателя истории и политической экономии. Играл на скрипке, писал стихи, публиковал научные статьи на трёх языках. Не был женат — говорил, что «женат на физике». Работал до последнего дня.</p>
    - '<p style="font-size:13px;color:var(--muted);margin-top:26px">Источники: histrf.ru · rg.ru · nkj.ru · tvzvezda.ru</p>'
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Пильчикове
    h2: Запрет директора и тюремный залог
    udary:
      - summary: <b>Железо по стрелке компаса.</b> В 1883-м Пильчиков первым заявил, что под Курском лежит железо. Руду подняли через 40 лет, и это крупнейшее месторождение в мире.
        det:
          - "Ещё в 1773 году заметили, что под Курском и Белгородом стрелка компаса упрямо отклоняется. В 1883 году ассистент Харьковского университета Николай Пильчиков сделал там больше 70 наблюдений. Он первым предположил, что стрелку тянут к себе залежи железной руды. Учёные тогда в это не верили: считалось, что руды в этих местах быть не может."
          - Первый керн железной руды подняли только 7 апреля 1923 года, с глубины 220 метров. Сегодня там карьеры Лебединского, Стойленского и Михайловского комбинатов. Залежи занимают около 120 тысяч квадратных километров, а разведанные запасы — миллиарды тонн.
        src: "Источник: Л. Попкова, «Притяжение аномалии: как нашли самое крупное в мире месторождение железных руд», Русское географическое общество, 27.09.2023 — https://rgo.ru/activity/redaction/articles/prityazhenie-anomalii-kak-nashli-samoe-krupnoe-v-mire-mestorozhdenie-zheleznykh-rud/"
        otryvok: «Участвовавший в ее работе ассистент кафедры физики Харьковского университета Николай Пильчиков провел более 70 наблюдений и в 1883 году первым предположил, что причиной аномального магнетизма являются залежи железной руды.»
        stranica: "«Притяжение аномалии: как нашли самое крупное в мире месторождение железных руд», сайт Русского географического общества (rgo.ru), 27 сентября 2023"
        href: https://rgo.ru/activity/redaction/articles/prityazhenie-anomalii-kak-nashli-samoe-krupnoe-v-mire-mestorozhdenie-zheleznykh-rud/
        pometka: документ
      - summary: <b>Экзамен у самого Попова.</b> Предложения Пильчикова флоту разбирал сам изобретатель радио Попов и выделил его защиту радиограмм от перехвата.
        det:
          - "В мае 1901 года предложения Пильчикова передали в Морское министерство, и для них собрали комиссию. В неё входил Александр Попов, который в 1895 году показал первый в мире радиоприёмник. В отзыве Попов отметил: внимания заслуживает защита депеш от перехвата. Для неё Пильчиков предлагал телеграфный аппарат, который пишет двумя перьями особой азбукой вместо Морзе."
          - Попов предупредил и о слабом месте. Настройка на свою волну, по его словам, полностью от перехвата не защищает, и её уже применяют все. Поэтому он попросил точно указать, что в приборах изобрёл лично Пильчиков.
        src: "Источник: В. Бартенев, «Об истории отечественной радиотелемеханики», «Современная электроника», № 5/2017 — https://www.cta.ru/articles/soel/2017/2017-5/112394/"
        otryvok: "«В состав комиссии входил профессор А.С. Попов, который дал отзыв на предложения Пильчикова [4]. В частности, он писал: «В предложении профессора Н.Д. Пильчикова заслуживает внимания постановка вопроса о защите от перехватывания депеш беспроводного телеграфа…»"
        stranica: В. Бартенев, «Об истории отечественной радиотелемеханики», «Современная электроника», № 5/2017
        href: https://www.cta.ru/articles/soel/2017/2017-5/112394/
        pometka: документ
      - summary: <b>Втрое дальше.</b> В 1903-м у Севастополя флот с прибором Пильчикова передавал радиограммы как минимум втрое дальше, чем раньше на Чёрном море.
        det:
          - Флот согласился на опыты в 1902 году, но их перенесли на лето 1903-го. Испытания прошли в августе 1903 года в районе Севастополя. Проверяли протектор — фильтр, который пропускает к приёмнику только «свои» волны.
          - "Подробный отчёт не нашёлся. Но в отчёте Харьковского технологического института за 1903 год, где тогда работал Пильчиков, записано: передавать радиограммы без сбоев стало можно на расстояниях как минимум втрое больших, чем прежде на Чёрном море. Продолжить опыты помешала Русско-японская война."
        src: "Источник: В. Бартенев, «Об истории отечественной радиотелемеханики», «Современная электроника», № 5/2017 — https://www.cta.ru/articles/soel/2017/2017-5/112394/"
        otryvok: "«Однако в отчёте Харьковского технологического института [5] за 1903 г. (в это время именно там работал Н.Д. Пильчиков) отмечалось: «Полученные результаты привели к возможности правильного телеграфирования на расстояниях, по крайней мере, втрое больших, чем то имело место раньше на Чёрном море».»"
        stranica: В. Бартенев, «Об истории отечественной радиотелемеханики», «Современная электроника», № 5/2017
        href: https://www.cta.ru/articles/soel/2017/2017-5/112394/
        pometka: документ
      - summary: <b>Скафандр до стратосферы.</b> Пильчиков придумал высотный скафандр для пилота ещё до 1908-го, а советский стратостат поднялся на 19 км лишь в 1933-м.
        det:
          - Пильчиков изучал атмосферное электричество и верхние слои воздуха. Он придумал аппарат для подъёма в верхние слои атмосферы и разработал высотный скафандр для его пилота. Пильчиков умер 6 мая 1908 года.
          - В СССР защитой человека от низкого давления и холода на высоте всерьёз занялись только в январе 1931 года, когда при ЦАГИ создали Бюро особых конструкций. Первой его работой стала герметичная гондола стратостата «СССР». В 1933 году стратостат поднялся на 19 километров и обошёл рекорд швейцарца Огюста Пиккара (16 370 метров).
        src: "Источник: «Притяжение аномалии…», РГО, 27.09.2023 — https://rgo.ru/activity/redaction/articles/prityazhenie-anomalii-kak-nashli-samoe-krupnoe-v-mire-mestorozhdenie-zheleznykh-rud/; «Прорыв в стратосферу», «Наука и жизнь», № 4, 1999 — https://www.nkj.ru/archive/articles/9095/; дата смерти — «Современная электроника», № 5/2017"
        otryvok: «Кроме того, он придумал конструкцию аппарата для изучения верхних слоев атмосферы и разработал высотный скафандр для его пилота.»
        stranica: "«Притяжение аномалии: как нашли самое крупное в мире месторождение железных руд», сайт Русского географического общества (rgo.ru), 27 сентября 2023"
        href: https://rgo.ru/activity/redaction/articles/prityazhenie-anomalii-kak-nashli-samoe-krupnoe-v-mire-mestorozhdenie-zheleznykh-rud/
        pometka: документ
      - summary: <b>Радиостанцию на машине Пильчиков купил сам, а директор запретил ему ездить по институту.</b>
        det:
          - В Харьковском технологическом институте Пильчиков на свои деньги построил радиостанцию с мачтой высотой 25 метров и павильон для опытов.
          - Вторую, передвижную станцию он поставил на автомобиль — тоже купленный за свои деньги. Но директор института Николай Шиллер запретил ему ездить на машине по территории института, и опыты застопорились.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «Передвижную Станцию Н. Д. Пильчиков установил на автомобиле, приобретённом им также на собственные средства. Продолжение этих работ натолкнулось на препятствие в лице директора Технологического института Шиллера, который запретил Н. Д. Пильчикову ездить по территории Института на автомобиле.»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>Студента с больными лёгкими посадили в тюрьму — профессор тут же выложил 1000 рублей залога.</b>
        det:
          - В Харьковском технологическом институте после студенческих волнений арестовали нескольких студентов. Один из них, Лихонин, был болен туберкулёзом, и тюрьма могла его погубить.
          - Пильчиков сразу внёс за него залог — 1000 рублей, огромные по тем временам деньги. Студента выпустили. Об этом рассказали сами студенты в прощальной статье о профессоре в 1908 году.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «Один из арестованных студентов Лихонин был болен туберкулёзом. Пребывание в тюрьме было пагубным для него. Николай Дмитриевич немедленно внёс требуемый залог в размере 1000 рублей, и Лихонин был освобождён.»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>Ещё в 1898-м Пильчиков предложил военному министру лодки без единого человека на борту.</b>
        det:
          - "12 декабря 1898 года Пильчиков написал военному министру письмо. Он предлагал управлять по радио минными лодками, в которых нет ни одного человека команды: они сами догоняли бы вражеские броненосцы."
          - Там же он описал сухопутные машины без экипажа, которые шли бы впереди атакующих и разрушали укрепления. По сути, это была идея боевых беспилотников — за много десятилетий до их появления.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «создать такие минные лодки, которые, не имея на себе ни одного человека команды, могли бы двигаться, направляться, настигать неприятельские броненосцы и топить их; 4. построить такие сухопутные миноносцы, которые могли бы, также не имея на себе ни одного человека команды, двигаться впереди атакующих»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>Рентгеновский снимок шёл полчаса — Пильчиков сократил его до двух секунд.</b>
        det:
          - Когда в 1896 году пришла весть об открытии рентгеновских лучей, Пильчиков сразу взялся за опыты. Обычная трубка давала слабые лучи, и снимок приходилось делать 20–30 минут.
          - Пильчиков поставил внутрь трубки пластинку из слюды, покрытую светящимся веществом. Лучи стали гораздо сильнее, и снимок теперь занимал всего 2 секунды. Результаты он напечатал в Докладах Парижской академии наук.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «С помощью этой трубки ему удалось получить более мощный пучок рентгеновских лучей, чем получавшийся с трубкой Крукса, и добиться сокращения экспозиции от 20—30 минут до 2 секунд.»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>Директор уволил профессоров — Пильчиков почти год бился за них и дошёл до министерства.</b>
        det:
          - "В 1904 году директор Харьковского технологического института Шиллер устроил разгром: многих студентов отправил под арест, многих профессоров уволил."
          - Пильчиков не промолчал. Почти год он требовал вернуть уволенных — в газетах и на заседаниях, а потом поднял вопрос в Министерстве народного просвещения в Петербурге. Профессоров вернули.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «В течение чуть ли не целого года он поднимал этот вопрос на столбцах печати, заседаниях учебного комитета и, наконец, будучи на съезде представителей высших учебных заведений в Петербурге, обратил внимание на необходимость возвращения уволенных профессоров в Министерстве народного просвещения.»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>На лекцию Пильчикова о рентгене в Одессе пришла тысяча человек, а деньги ушли на курсы для женщин.</b>
        det:
          - "В начале 1896 года Пильчиков объехал юг России с публичными лекциями о рентгеновских лучах: Одесса, Кишинёв, Херсон, Николаев. Всё, что собрали за билеты, он отдал на будущие Высшие женские курсы в Одессе — тогда женщинам было трудно получить высшее образование."
          - Его доклад в Одесском университете собрал в тесном актовом зале тысячу слушателей.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «сбор со всех лекций поступил в пользу будущих Высших женских курсов в Одессе) и три раза демонстрировал опыты в учёных обществах. Доклад на совместном заседании обществ естественников и врачей привлёк в тесный актовый зал университета тысячную аудиторию.»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Рентген, деньги флота и своя метеостанция
    udary:
      - summary: <b>Морское министерство оценило протектор Пильчикова и согласилось оплатить половину из 5000 рублей.</b>
        det:
          - "Пильчиков попросил на первые опыты со своим протектором 5000 рублей. В марте 1902 года начальник Главного морского штаба сообщил: управляющий Морским министерством согласен взять на себя половину расходов."
          - Но деньги, аккумуляторы и корабль Черноморского флота дали только в конце лета 1902 года — и годы ушли на переписку.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «согласился принять участие в половине расходов, вызываемых подготовкою и производством первых опытов с протектором, на что профессор Пильчиков и спрашивает 5000 рублей»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>В 1896 году Пильчиков угадал, что рентгеновские лучи — это очень короткие волны.</b>
        det:
          - "Никто не знал, что такое рентгеновские лучи: может быть, поток заряженных частиц? Пильчиков проверил это 22 января 1896 года: положил на фотопластинку медные проволоки, зарядил их и снова пустил лучи."
          - "Лучи не отклонились. Отсюда он сделал вывод, что это колебания с очень короткими волнами. Позже наука подтвердила: рентгеновские лучи — именно такие волны."
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «Профессор Пильчиков склоняется к предположению, что Х-лучи суть поперечные колебания эфира с чрезвычайно короткими волнами, настолько короткими, что полированные поверхности, отражающие обыкновенный свет, являются для Х-лучей как бы матовыми и рассеивают их»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>Метеостанцию для университета Пильчиков выбил у начальства и частично оплатил сам.</b>
        det:
          - В 1891 году после долгих хлопот Пильчикова при Харьковском университете открыли метеорологическую станцию. Часть расходов профессор взял на себя.
          - С 1892 года он с учениками вёл там наблюдения каждый день. Главная физическая обсерватория в Петербурге включила станцию в свой список и объявила Пильчикову благодарность.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «Затраты на создание метеорологической станции частично взял на себя Н. Д. Пильчиков. С 1892 г. Н. Д. Пильчиков со своими учениками и помощниками начал регулярные метеорологические наблюдений на университетской метеорологической станции.»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>В Одессе Пильчиков пошёл к ректору и попечителю — и выбил университету новую лабораторию.</b>
        det:
          - В Новороссийском университете в Одессе приборов и места для опытов не хватало. Пильчиков составил проект хорошей лаборатории и добивался его у ректора и у попечителя учебного округа.
          - Его поддержали знаменитые физики Столетов, Лебедев и Умов. В итоге в университете создали отдельную измерительную лабораторию.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «Получив поддержку таких выдающихся ученых, как А. Г. Столетов, П. Н. Лебедев, Н. А. Умов, и ряда других видных физиков, Н. Д. Пильчиков добивался у ректора Одесского университета и попечителя Одесского учебного округа осуществления своего проекта строительства хорошей лаборатории.»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
      - summary: <b>В 1896-м физик Пильчиков сам делал рентгеновские снимки больным, которые шли к нему за помощью.</b>
        det:
          - "Больниц с рентгеновскими аппаратами тогда ещё не было. Уже в 1896 году Пильчиков помогал врачам: делал снимки больным, которые приходили к нему в лабораторию."
          - На это он тратил много времени, хотя был физиком, а не врачом. Историки называют его одним из тех, с кого в России началась рентгеновская медицина.
        src: 'Источник: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954 — <a href="https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf" rel="noopener">ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf</a>.'
        otryvok: «Уже в 1896 г. он помогал врачам в практическом осуществлении рентгендиагностики, посвящая много времени на производство рентгеноснимков обращавшимся к нему за помощью больным.»
        stranica: Н. Л. Полякова, Е. А. Попова-Кьяндская, «Николай Дмитриевич Пильчиков», «Успехи физических наук», т. LIII, вып. 1, май 1954
        href: https://ufn.ru/ufn54/ufn54_5/Russian/r545f.pdf
        pometka: документ
