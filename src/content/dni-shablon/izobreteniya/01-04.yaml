audioguide:
  audioSrc: audio-guide-pilchikov-ru.mp3
  durationLabel: 4 минуты 13 секунд
  lead: "Голос ведёт по залу Пильчикова: от одесской сцены 1898 года, где заряд взорвался без единого провода, до палаты харьковской лечебницы, где всё оборвалось. Семь остановок, на каждой — что искать глазами."
  stops:
    - t: 0
      mark: 0:00
      title: Зал, в котором нет проводов
    - t: 37
      mark: 0:37
      title: Чем это отличалось от радио
    - t: 78
      mark: 1:18
      title: Протектор
    - t: 114
      mark: 1:54
      title: Человек-лаборатория
    - t: 151
      mark: 2:31
      title: Тесла и патентное право
    - t: 186
      mark: 3:06
      title: Отчёты, которые легли под сукно
    - t: 213
      mark: 3:33
      title: Май тысяча девятьсот восьмого
  transcript:
    - "Весна 1898 года, Одесса. На сцене — профессор Николай Пильчиков с прибором, в дальнем конце зала макет яхты, орудийный заряд и лампа. Ни одного провода между ними. Он нажимает ключ: лампа вспыхивает, заряд гремит, модель приходит в движение. Это первое в мире публичное радиоуправление."
    - "Радио тогда уже существовало: приёмник Попова 1895 года, передатчик Маркони 1896-го. Но все видели в нём беспроволочный телеграф — сигнал для человека. Пильчиков увидел команду для механизма: приёмник замыкает цепь, а цепь зажигает огонь, поднимает флаг, взрывает заряд, запускает двигатель."
    - Главной помехой были чужие сигналы. Пильчиков сделал протектор — фильтр, благодаря которому механизм слушался только «своего» передатчика. По сути, первый шаг к кодированной связи.
    - Он окончил Харьковский университет и там же преподавал. В 24 года первым исследовал магнитную аномалию под Курском — будущий крупнейший железорудный бассейн мира. В 1896 году сам делал рентгеновские снимки. Изобрёл около 25 приборов.
    - В том же 1898 году Никола Тесла показал в Нью-Йорке радиоуправляемую лодку и запатентовал её. Пильчиков патент не оформил, и мировой приоритет закрепился за Теслой.
    - "В 1902–1903 годах Пильчиков вёл работы для Черноморского флота: радиоуправление взрывателями и защита корабельной радиосвязи от помех. Отчёты ушли в военное ведомство и легли под сукно."
    - В мае 1908 года Пильчикова нашли застреленным в палате харьковской лечебницы. Официальная версия — самоубийство; коллеги не поверили, лабораторные записи по военным работам исчезли. Дело закрыли за несколько дней.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
