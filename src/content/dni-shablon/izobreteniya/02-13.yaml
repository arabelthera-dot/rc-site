igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чей это подвиг
  pravilo_ru: 'Что сделать сейчас: выбери машину и нажми на подвиг, который она совершила.'
  kak_igrat:
    zachem: 'У каждой машины Бериева — свой подвиг: скорость, вода, подлодки.'
    shagi:
    - Выбери машину — кнопка загорится золотом.
    - Нажми на её подвиг. Верный выбор загорится зелёным.
    - Расставь все три — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все три машины на месте — +20 баллов.
  dannye:
    mesta:
    - kod: skorost
      nazvanie: 912 км/ч
      verno_ru: В 1961-м Бе-10 разогнали до 912 км/ч — рекорд летающих лодок не побит до сих пор.
    - kod: voda
      nazvanie: 12 тонн воды за 12 секунд
      verno_ru: Бе-200 набирает 12 тонн воды за 12 секунд — прямо на ходу, скользя по морю.
    - kod: lodki
      nazvanie: 29 подлодок за год
      verno_ru: За один 1989 год экипажи Бе-12 нашли 29 чужих подводных лодок.
    podpisi:
    - kod: be10
      tekst: Бе-10
      mesto: skorost
      mimo_ru: Бе-10 — реактивная лодка, ищи рекорд скорости.
    - kod: be200
      tekst: Бе-200
      mesto: voda
      mimo_ru: Бе-200 тушит пожары — ищи подвиг с водой.
    - kod: be12
      tekst: Бе-12
      mesto: lodki
      mimo_ru: Бе-12 — противолодочная амфибия, ищи подлодки.
    vyberi_ru: Сначала выбери машину, потом подвиг.
    mimo_ru: Не тот подвиг — попробуй другой.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все три машины на месте — Бе-10 летит быстрее всех лодок, Бе-200 черпает море, Бе-12 находит подлодки.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: Бе-10 — 912 км/ч, Бе-200 — 12 тонн воды за 12 секунд, Бе-12 — 29 подлодок за год.'
