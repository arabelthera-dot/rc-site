pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "Граница первенства: первое в мире исследование внутреннего строения стали под микроскопом, 1831 год. Документ — собственная книга Аносова «О булатах» (1841)."
  net: "Чего здесь нет: сам булат придумал не Аносов — узорчатую сталь варили в Индии за много веков до него. Первенство Аносова — в методе: он первым прочёл строение металла и первым описал, как получить булат по правилам, а не по тайному рецепту."
