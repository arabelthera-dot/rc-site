audioguide:
  audioSrc: audio-guide-anosov-ru.mp3
  durationLabel: 5 минут 34 секунд
  lead: "Голос ведёт по залу Павла Аносова: от булатного кинжала на красном бархате до микроскопа 1831 года и книги «О булатах». Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Клинок на красном бархате
    - t: 49
      mark: 0:49
      title: Тайна, перед которой отступил Фарадей
    - t: 97
      mark: 1:37
      title: Портрет и завод
    - t: 144
      mark: 2:24
      title: Глиняный горшок за полтинник
    - t: 190
      mark: 3:10
      title: Тысяча восемьсот тридцать первый
    - t: 237
      mark: 3:57
      title: Узор — это строение
    - t: 287
      mark: 4:47
      title: Книга без секретов
  transcript:
    - <p>«Кинжал 1840 года из Златоуста — русский булат. Веками Европа покупала такие клинки на Востоке и не умела их повторить; над тайной бились и Фарадей, и Стодарт, и Бертье».</p>
    - <p>«Павел Аносов пришёл на Златоустовский завод в 1817 году, а к 1824-му управлял оружейной фабрикой. Немецкий тигель стоил 25 рублей золотом — он слепил свой из уральской глины за 40–50 копеек, и опыты можно было ставить сотнями».</p>
    - "<p>«В 1831 году Аносов первым в мире положил сталь под микроскоп; Генри Сорби сделает это в 1860-х. Первенство — не булат, а метод: с него начался микроскопический анализ металлов».</p>"
    - <p>«Он доказал, что узор булата — строение самого металла, отделил настоящий булат от ложного и сварочного и в 1838 году выковал первый клинок русского булата».</p>
    - <p>«В 1841 году книга „О булатах“ открыла всем десять условий совершенного булата и сразу вышла на немецком и французском. Три из них можно проверить в тигле на этой странице».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
