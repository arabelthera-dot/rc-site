story:
  kicker: История изобретения · 12 ударов
  h2: Узор, который оказался строением стали
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  abzacy:
    - |-
      <ol class="udary">
            <li><details><summary><span>Европа веками покупала булатные клинки на Востоке и не умела их повторить: за лучший клинок в Азии платили по сто и больше червонцев.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Родина булата — Индия: оттуда вывозили слитки-«хлебцы» вуца, около 12,5 см в поперечнике и около 900 граммов весом. Слиток разрубали пополам, чтобы покупатель видел строение металла.</p>
                <p>В 1779 году в Париже докладчик Общества поощрения национальной промышленности признал: европейцы «в конце концов оказались вынужденными получать все булатные клинки с востока».</p>
                <p>Сам Аносов писал: «Азиатцы… охотно платят за лучшие клинки по 100 и более червонцев».</p>
                <p><span class="tag">Предание</span>Рассказ о том, как Саладин булатом разрезал в воздухе шёлковый платок, — легенда, а не документ. Её пересказывают, чтобы объяснить славу булата.</p>
                <p class="src-note">Источник: С. В. Истомин, «Самые знаменитые изобретатели России», 2000 (текст в библиотеке ИРНИТУ).</p>
              </div></details></li>
            <li><details><summary><span>Над секретом булата бились лучшие учёные Европы, среди них Майкл Фарадей, — и тайна не поддалась.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Булат изучали французы Клуэ, Бреан, Бертье, англичане Стодарт и Фарадей. Швед Ринман считал, что узор получается только сваркой стали и железа разной твёрдости. Бертье принимал за булат хромистую сталь.</p>
                <p>Даже имитация, похожая на булат лишь внешне, тогда считалась серьёзным достижением.</p>
                <p class="src-note">Источник: С. В. Истомин, 2000.</p>
              </div></details></li>
            <li><details><summary><span>Рано осиротевший мальчик попал в Горный кадетский корпус, а к тридцати годам уже управлял Златоустовской оружейной фабрикой.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Павел Петрович Аносов родился 29 июня 1796 года в Твери (так у Президентской библиотеки; в других биографиях — 1797 год и Петербург). Рано осиротев, рос в семье родственника. В 1810 году его определили в Горный кадетский корпус.</p>
                <p>В 1817 году он приехал на Златоустовский казённый завод техником для поручений, в 1819-м стал смотрителем отделения «украшенного оружия», в декабре 1821-го — помощником управляющего, в ноябре 1824-го — управляющим оружейной фабрикой.</p>
                <p class="src-note">Источники: Президентская библиотека имени Б. Н. Ельцина; С. В. Истомин, 2000.</p>
                <div style="clear:both"></div>
              </div></details></li>
            <li class="find"><details><summary><span>Немецкий тигель стоил 25 рублей золотом — Аносов слепил свой из уральской глины с толчёным углём за 40–50 копеек.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p><span class="tag">Находка дня</span>Тигель — глиняный сосуд, в котором плавят сталь. Считалось, что хорошие тигли умеют делать только за границей. Аносов взял местную огнеупорную глину, смешал с мелко истолчённым древесным углём, высушил и обжёг. Его тигли выдерживали плавку стали и золота и обходились примерно в пятьдесят раз дешевле привозных.</p>
                <p>Дешёвые тигли и позволили ставить опыты сотнями: без них десятилетний поиск булата разорил бы завод.</p>
                <p class="src-note">Источник: С. В. Истомин, 2000.</p>
              </div></details></li>
            <li><details><summary><span>В 1831 году он первым в мире положил сталь под микроскоп — англичанин Генри Сорби сделает это только через три десятилетия.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>О микроскопе 1831 года Аносов сам пишет в книге «О булатах». С этого начался микроскопический анализ металлов — сегодня без него не выпускают ни рельсы, ни турбинные лопатки.</p>
                <p>Честь начала металлографии долго отдавали Сорби, который взялся за микроисследования стали в 1860-х. Граница нашего первенства узкая и точная: не булат, а метод — первое исследование строения стали под микроскопом.</p>
                <p class="src-note">Источники: Президентская библиотека («первый применил для исследования стали микроскоп»); С. В. Истомин, 2000.</p>
              </div></details></li>
            <li><details><summary><span>Он доказал: узор булата — не рисунок кузнеца, а видимое глазу строение самого металла.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Аносов разделил булаты на настоящие и ложные. Ложный — узор наведён на поверхность рисовкой и травлением. Сварочный — узор внутри, но получен многократной сваркой полос. Настоящий — узор рождается при плавке и остывании и после каждой полировки проявляется снова.</p>
                <p>Строение, писал он, зависит от состава, способа плавки, условий затвердевания и ковки. Для самых прочных клинков он назвал лучшими сетчатый и коленчатый узор.</p>
                <p class="src-note">Источник: П. П. Аносов, «О булатах», 1841, по изложению С. В. Истомина, 2000.</p>
              </div></details></li>
            <li><details><summary><span>Больше десяти лет опытов: кремний, марганец, хром, титан, золото, платина и даже алмаз — всё шло в тигель.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Опыты начались в 1828 году. Приложение к книге описывает плавки 1828–1839 годов. Своё дело Аносов сравнивал с «океаном, который надлежало переплывать многие годы, не приставая к берегу».</p>
                <p>Лучшей присадкой для получения углеродистой булатной стали он признал графит.</p>
                <p class="src-note">Источники: Президентская библиотека (начало опытов — 1828); С. В. Истомин, 2000; Златоустовская ЦБС, «Научное исследование П. П. Аносовым булатной стали».</p>
              </div></details></li>
            <li><details><summary><span>В 1838 году он выковал первый клинок русского булата — и перестал называть сталь азиатскими именами.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Аносов отказался от старых названий «вуц», «табан», «кара-табан», «шам» и ввёл своё — «русский булат». По виду он делил его на полосатый, струистый, волнистый, сетчатый и коленчатый.</p>
                <p>Златоустовские мастера выковывали из булата сабли и кинжалы. Кинжал 1840 года на обложке этой страницы — из той самой стали.</p>
                <p class="src-note">Источники: Президентская библиотека (первый булатный клинок — 1838); С. В. Истомин, 2000; Военно-исторический музей артиллерии — предмет на обложке.</p>
              </div></details></li>
            <li><details><summary><span>Секрет он не спрятал: в 1841 году напечатал всё, от сорта угля до медленного остывания тигля, — книгу сразу перевели на немецкий и французский.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Десять условий «совершенного булата» по Аносову: лучший уголь, «как, например, чистый сосновый»; печь из самых огнеупорных кирпичей; тигли без трещин; лучшее железо; чистый самородный графит; пожжённый кварц или доломит; сильнейший жар; наибольшее время плавления; медленное охлаждение тигля; наименьшее нагревание при ковке.</p>
                <p>Три из них ты проверишь сам в тигле ниже.</p>
                <p class="src-note">Источник: П. П. Аносов, «О булатах», 1841, цитата по С. В. Истомину, 2000.</p>
              </div></details></li>
            <li><details><summary><span>Отдельный запрет его инструкции — перегреть булат при ковке: от лишнего жара узор теряется.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Аносов требовал, чтобы при проковке «ни один нагрев не был оставлен без внимания и точного доведения до степени жара, при которой узор теряется». Рецепт был не только в тигле, но и в руке кузнеца.</p>
                <p class="src-note">Источник: П. П. Аносов, «О булатах», 1841, цитата по С. В. Истомину, 2000.</p>
              </div></details></li>
            <li><details><summary><span>Попутно он первым в мире применил газовую цементацию: насыщал сталь углеродом из печных газов, без засыпки углём.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Веками считалось, что для науглероживания железо должно касаться угля. Аносов показал, что печные газы с большим содержанием углерода делают это не хуже. Позже этот приём разошёлся по машиностроительным заводам.</p>
                <p class="src-note">Источник: С. В. Истомин, 2000. Истомин пишет «впервые в мире».</p>
              </div></details></li>
            <li><details><summary><span>Генерала-металлурга свалил буран: возок опрокинулся, и Аносов часами пролежал в снегу под адъютантом и чемоданами.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>В 1847 году Аносова назначили начальником Алтайских заводов, затем томским гражданским губернатором. В начале 1851 года он ехал из Томска в Омск встречать сенатора Анненкова и не доехал восемнадцати вёрст.</p>
                <p>Дочь, Лариса Павловна, вспоминала: возок наехал на сугроб и опрокинулся, Аносов выпал, сверху упали адъютант и чемоданы. Их нашли через несколько часов. Вскоре начались нарывы в горле. Павел Петрович Аносов умер в Омске 13 (25) мая 1851 года.</p>
                <p class="src-note">Источник: воспоминания Л. П. Аносовой по книге С. В. Истомина, 2000; некролог в «Санкт-Петербургских ведомостях», 1851.</p>
              </div></details></li>
          </ol>
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов об Аносове
    h2: Отказ Академии и коса-рекордсменка
    udary:
      - summary: "<b>Зазубрина на английском клинке.</b> В Лондоне англичане рубанули аносовским булатом по своему клинку: на английском осталась зазубрина, на русском только пятнышко."
        det:
          - В 1851 году клинки из булата Аносова показали на выставке в Лондоне. Везти их доверили его помощнику, златоустовскому мастеру Николаю Ивановичу Швецову. Его рассказ дошёл до наших дней. Англичане решили проверить русскую сталь и рубили русским клинком по английскому.
          - На английском осталась «изрядная зазубрина», на аносовском — «только пятнышко». Потом русский клинок согнули в дугу, и он выпрямился, не оставив следа. Горный инженер Илимов, который проверял оружейную фабрику, писал, что закалённый кусок булата «крошил лучше английского зубила».
        src: "Источник: В. Лапунов, «Павел Аносов — творец русского булата», официальный сайт Постоянного Комитета Союзного государства, 12.03.2014 — https://xn--c1anggbdpdf.xn--p1ai/history/198843/ (посткомсг.рф)"
        otryvok: «До нашего времени дошел рассказ Швецова о том, как англичане, решив испытать крепость златоустовского булата, рубили русским клинком по английскому. В результате на английском образовалась изрядная зазубрина, а на аносовском — только пятнышко.»
        stranica: В. Лапунов, «Павел Аносов — творец русского булата», сайт Постоянного Комитета Союзного государства, 12.03.2014
        href: https://xn--c1anggbdpdf.xn--p1ai/history/198843/
        pometka: документ
      - summary: <b>«Шеффилд и Бирмингем» Урала.</b> Английский геолог Мурчисон сравнил завод Аносова с Шеффилдом и Бирмингемом, главными заводскими городами Англии.
        det:
          - "При Аносове Златоуст стал «своеобразной Меккой»: сюда приезжали Александр Гумбольдт, академик Купфер, поэт Жуковский. Английский геолог Родерик Мурчисон побывал на заводе в 1841 году. Он назвал Златоустовский завод, которым руководил Аносов, «Шеффилдом и Бирмингемом хребта Уральского»."
          - "В те годы эти два города считались сердцем британской стали и металлообработки. Другой материал пересказывает вывод Мурчисона так: во всём мире нет оружейной фабрики, которая могла бы сравниться со Златоустовской."
        src: "Источник: «Павел Аносов — известный и неизвестный», «Наука и жизнь», 2005, № 9 — https://www.nkj.ru/archive/articles/1695/ ; В. Лапунов, сайт Постоянного Комитета Союзного государства, 12.03.2014"
        otryvok: «Известный английский ученый-геолог Р. Мурчисон назвал Златоустовский завод, руководимый генерал-майором Аносовым, "Шеффилдом и Бирмингемом хребта Уральского".»
        stranica: М. Главацкий, Л. Дашкевич, «Павел Аносов — известный и неизвестный», «Наука и жизнь», 2005, № 9
        href: https://www.nkj.ru/archive/articles/1695/
        pometka: документ
      - summary: <b>Сталь на морозе.</b> Аносов первым в истории обработал металл холодом, до −18 °C, и сегодня этот приём широко применяют на заводах.
        det:
          - "Аносов годами изучал, как закаливать сталь, а в 1828–1829 годах проверил, что с металлом делает мороз: от −5 до −18 °C."
          - По оценке Президентской библиотеки, это был первый в истории металлургии опыт обработки металла холодом. В те же годы он закаливал стальные вещи в струе сжатого воздуха и описал это в статье «Об опытах закалки стальных вещей в сгущённом воздухе» (1829).
        src: "Источник: «Павел Петрович Аносов (1796–1851)», Президентская библиотека имени Б. Н. Ельцина — https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Anosov"
        otryvok: «В истории металлургии это был первый опыт обработки металла холодом, нашедший в современной практике весьма широкое применение.»
        stranica: «Павел Петрович Аносов (1796–1851)», проект «Великая Россия», Президентская библиотека
        href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Anosov
        pometka: документ
      - summary: <b>Золото из доменной печи.</b> Аносов придумал плавить золотой песок в доменной печи, и его опытам, по словам Демидова, «удивлялась вся Европа».
        det:
          - "Аносов был горным начальником, и золотые прииски у Миасса были его прямой заботой. Золото там промывали машиной, которую он сам усовершенствовал. Потом он предложил другой путь: не промывать песок, а плавить его в доменной печи. В 1837 году он доложил об удачных опытах."
          - "Горное ведомство составило программу таких опытов для всех заводов Урала. На других заводах опыты не получились, и главный начальник уральских заводов назвал их «химерными». «Наука и жизнь» пишет, что идея просто опередила время: позже она помогла улучшить очистку цветных металлов."
        src: "Источник: «Павел Аносов — известный и неизвестный», «Наука и жизнь», 2005, № 9 — https://www.nkj.ru/archive/articles/1695/ ; Президентская библиотека имени Б. Н. Ельцина"
        otryvok: «Однако опыты П. П. Аносова, которым, по словам П. Н. Демидова, "удивлялась вся Европа", оказались неудачными лишь потому, что идея, как нередко случается, опередила время.»
        stranica: М. Главацкий, Л. Дашкевич, «Павел Аносов — известный и неизвестный», «Наука и жизнь», 2005, № 9
        href: https://www.nkj.ru/archive/articles/1695/
        pometka: два источника
      - summary: <b>Позолота без ртути.</b> Ртутная позолота клинков губила здоровье мастеров, и Аносов заменил её на фабрике золочением с помощью тока.
        det:
          - "Златоуст славился «украшенным оружием»: клинки с гравировкой и позолотой. Аносов и начинал смотрителем этого отделения фабрики."
          - "Раньше клинки золотили ртутью, а её пары вредны для здоровья. Аносов перевёл фабрику на гальваническое золочение: золото ложится на сталь под действием электрического тока, без ртути."
        src: "Источник: «Павел Петрович Аносов (1796–1851)», Президентская библиотека имени Б. Н. Ельцина — https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Anosov"
        otryvok: «Аносов первым применил для исследования стали микроскоп, заменил на фабрике вредное для здоровья ртутное золочение клинков гальваническим, предложил и испытал способ получения золота из золотосодержащих песков путём плавления в доменных печах, усовершенствовал золотопромывальную машину и другие заводские устройства.»
        stranica: «Павел Петрович Аносов (1796–1851)», проект «Великая Россия», Президентская библиотека
        href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Anosov
        pometka: документ
      - summary: "<b>Он раскрыл тайну булата, а Академия наук отказала ему в премии: решили, что булат вышел случайно.</b>"
        det:
          - В 1841 году Аносов напечатал книгу «О булатах», и через два года её издали на французском, немецком, а потом и на английском. Но кто бы ни пытался сварить булат по этой книге, у него ничего не получалось.
          - Из-за этого Российская академия наук отказала Аносову в Демидовской премии — главной научной награде России того времени. Учёные заподозрили, что булат у него получился случайно. До сих пор считается, что какую-то главную хитрость Аносов так и не записал.
        src: 'Источник: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024 — <a href="https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali" rel="noopener">chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali</a>.'
        otryvok: "«Но вот незадача: кто бы ни пытался получить булат, руководствуясь этим сочинением, терпел неудачу. Из-за этого Российская академия наук даже отказала Аносову в присуждении Демидовской премии: ученые мужи заподозрили, что булат у него получился случайно.»"
        stranica: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024
        href: https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali
        pometka: документ
      - summary: "<b>Аносов уехал с Урала — и его булатное производство закрыли: клинков успели сделать меньше сотни.</b>"
        det:
          - В 1847 году Аносова перевели на Алтай начальником заводов. После его отъезда созданное им в Златоусте производство тигельной стали ликвидировали.
          - "Клинков из аносовского булата сделали, по оценке Златоустовского краеведческого музея, едва ли сотню. Та же судьба постигла его косы: Артинский завод вернулся к старому способу, качество упало, и производство пришло в упадок."
        src: 'Источник: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024 — <a href="https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali" rel="noopener">chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali</a>.'
        otryvok: «Число изготовленных из этой стали клинков едва ли достигло сотни. После назначения Павла Аносова начальником Алтайских горных заводов и его отъезда из Златоуста созданное им производство тигельной стали ликвидировали»
        stranica: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024
        href: https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali
        pometka: документ
      - summary: <b>Одна аносовская коса обошла 120 отборных австрийских — и он получил за косы золотую медаль.</b>
        det:
          - Косы тогда нужны были крестьянам миллионами, а рынок держали английские и австрийские мастера. Аносов стал делать косы из своей литой стали на Артинском заводе и проверял их так же строго, как сабли.
          - "По приказу министра финансов косы два года испытывали в поле. В акте записали: одна златоустовская коса «превзошла 120 кос штирийских, выбранных из 600». В 1839 году Московское общество сельского хозяйства присудило Аносову Золотую медаль за русские косы."
        src: 'Источник: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024 — <a href="https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali" rel="noopener">chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali</a>; В. Н. Панасенков, «Металлург Павел Аносов. Жизнь и трагическая судьба», журнал «Национальные приоритеты России», 2021, № 1 (40) — <a href="https://cyberleninka.ru/article/n/metallurg-pavel-anosov-zhizn-i-tragicheskaya-sudba" rel="noopener">cyberleninka.ru/article/n/metallurg-pavel-anosov-zhizn-i-tragicheskaya-sudba</a>.'
        otryvok: «Одна златоустовская коса, — говорится там, — закалена жестче шафенгаузских и так остра, что превзошла 120 кос штирийских, выбранных из 600 таких же кос. Она выдержала в 1836 и 1837 годах по два прокоса и две ржаных жатвы».
        stranica: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024
        href: https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali
        pometka: два источника
      - summary: <b>Клинок из русского булата Аносов подарил самому императору Николаю I.</b>
        det:
          - Клинок из русского булата, сделанный на Златоустовском заводе, Аносов в 1836 году подарил императору Николаю I. Такой же подарок получил великий князь Михаил Павлович.
          - "Скоро златоустовские клинки узнали в русской армии, а особенно ценили их на Кавказе. Годы первых булатных клинков в источниках расходятся: называют 1833, 1836 и 1838 годы."
        src: 'Источник: В. Н. Панасенков, «Металлург Павел Аносов. Жизнь и трагическая судьба», журнал «Национальные приоритеты России», 2021, № 1 (40) — <a href="https://cyberleninka.ru/article/n/metallurg-pavel-anosov-zhizn-i-tragicheskaya-sudba" rel="noopener">cyberleninka.ru/article/n/metallurg-pavel-anosov-zhizn-i-tragicheskaya-sudba</a>.'
        otryvok: «Изготовленный на Златоустовском заводе клинок из русского булата Аносов в 1836 году подарил императору Николаю I. Такой же подарок металлург преподнёс великому князю Михаилу Павловичу.»
        stranica: В. Н. Панасенков, «Металлург Павел Аносов. Жизнь и трагическая судьба», журнал «Национальные приоритеты России», 2021, № 1 (40)
        href: https://cyberleninka.ru/article/n/metallurg-pavel-anosov-zhizn-i-tragicheskaya-sudba
        pometka: документ
      - summary: <b>Булатом Аносов занялся не по своей воле, а по заданию министра — и влюбился в узор старых сабель.</b>
        det:
          - Искать секрет булата Аносову поручил министр финансов граф Егор Канкрин. Сначала Аносов взялся за дело без большой охоты.
          - Всё изменили несколько старинных персидских сабель из коллекции оренбургского военного губернатора Перовского. Увидев на лезвиях причудливый узор, Аносов загорелся идеей его повторить — и потратил на это десять лет.
        src: 'Источник: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024 — <a href="https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali" rel="noopener">chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali</a>.'
        otryvok: «Булатом Павел Аносов занялся не по своей инициативе, а по заданию все того же графа Канкрина. Поначалу без энтузиазма, но, получив для изучения несколько старинных персидских сабель из личной коллекции оренбургского военного губернатора Перовского, ученый влюбился в причудливый узор»
        stranica: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024
        href: https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali
        pometka: документ
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Золото, крылатый конь и гнев царя
    udary:
      - summary: "<b>Металлург ещё и сам искал богатства недр: нашёл золотые россыпи у Миасса и залежи корунда.</b>"
        det:
          - Аносов не только варил сталь, но и сам ходил в геологические походы вокруг Златоуста. Он открыл большие залежи корунда (1832) — очень твёрдого камня, которым шлифуют металл, — золотоносные россыпи близ Миасса (1834) и месторождение титанистого железа (1835).
          - Он же составил геологический разрез Урала от Златоуста до Миасса — как бы срез гор, где видно, какие породы лежат друг под другом.
        src: 'Источник: «Аносов Павел Петрович», Горная энциклопедия (mining-enc.ru) — <a href="http://www.mining-enc.ru/a/anosov/" rel="noopener">www.mining-enc.ru/a/anosov</a>; В. Н. Панасенков, «Металлург Павел Аносов. Жизнь и трагическая судьба», журнал «Национальные приоритеты России», 2021, № 1 (40) — <a href="https://cyberleninka.ru/article/n/metallurg-pavel-anosov-zhizn-i-tragicheskaya-sudba" rel="noopener">cyberleninka.ru/article/n/metallurg-pavel-anosov-zhizn-i-tragicheskaya-sudba</a>.'
        otryvok: «Открыл большие залежи корунда (1832), золотоносные россыпи близ Миасса (1834), месторождение титанистого железа (1835). Составил подробный очерк геологического строения Златоустовского горного округа и геологический разрез Урала от Златоуста до Миасса.»
        stranica: «Аносов Павел Петрович», Горная энциклопедия (mining-enc.ru)
        href: http://www.mining-enc.ru/a/anosov/
        pometka: два источника
      - summary: <b>Крылатый конь с аносовских клинков стал гербом целого города — Златоуста.</b>
        det:
          - Златоустовские клинки при Аносове не только ковали, но и украшали гравюрой. Уральский мастер Иван Бушуев выгравировал на аносовских клинках крылатого коня.
          - "Этот конь прижился: он стал частью герба Златоуста. Сам булат Златоуста не раз отмечали на русских и международных выставках XIX века."
        src: 'Источник: М. Главацкий, Л. Дашкевич, «Павел Аносов — известный и неизвестный», «Наука и жизнь», 2005, № 9 — <a href="https://www.nkj.ru/archive/articles/1695/" rel="noopener">www.nkj.ru/archive/articles/1695</a>.'
        otryvok: «Крылатый конь, выгравированный уральским мастером Иваном Бушуевым на аносовских клинках, стал неотъемлемой частью и герба Златоуста...»
        stranica: М. Главацкий, Л. Дашкевич, «Павел Аносов — известный и неизвестный», «Наука и жизнь», 2005, № 9
        href: https://www.nkj.ru/archive/articles/1695/
        pometka: документ
      - summary: <b>Сирота окончил Горный корпус так блестяще, что получил сразу две медали — золотую и серебряную.</b>
        det:
          - Мальчика, рано оставшегося без родителей, в 1810 году определили в Горный кадетский корпус в Петербурге — школу будущих горных инженеров.
          - Окончил он его так успешно, что получил одновременно Большую золотую и Серебряную медали. После этого его отправили практикантом на Златоустовский оружейный завод, где он и прослужил почти 30 лет.
        src: 'Источник: «Павел Петрович Аносов (1796–1851)», Президентская библиотека имени Б. Н. Ельцина — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Anosov" rel="noopener">www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Anosov</a>; В. Лапунов, «Павел Аносов — творец русского булата», официальный сайт Постоянного Комитета Союзного государства, 12.03.2014 — <a href="https://xn--c1anggbdpdf.xn--p1ai/history/198843/" rel="noopener">xn--c1anggbdpdf.xn--p1ai/history/198843</a>.'
        otryvok: «В 1810 году опекун определил его в Горный кадетский корпус, который юноша окончил столь успешно, что получил одновременно Большую золотую и Серебряную медали, попав после этого практикантом на Златоустовский оружейный завод.»
        stranica: «Павел Петрович Аносов (1796–1851)», Президентская библиотека имени Б. Н. Ельцина
        href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Anosov
        pometka: два источника
      - summary: <b>Губернатором в Сибири он привёз мастеров из Златоуста — но литую сталь в Томске так и не сварил.</b>
        det:
          - В феврале 1847 года Аносова назначили главным начальником Алтайских горных заводов и томским губернатором. Он выписал мастеров из Златоуста, чтобы наладить литую сталь на Томском железоделательном заводе и научить местных плавильщиков.
          - Ничего не вышло. Помешали старое оборудование рудников и заводов, подневольный труд и косность местных чиновников.
        src: 'Источник: В. Лапунов, «Павел Аносов — творец русского булата», официальный сайт Постоянного Комитета Союзного государства, 12.03.2014 — <a href="https://xn--c1anggbdpdf.xn--p1ai/history/198843/" rel="noopener">xn--c1anggbdpdf.xn--p1ai/history/198843</a>.'
        otryvok: «С помощью выписанных из Златоуста мастеров он попытался наладить производство литой стали на Томском железоделательном заводе и обучить этому местных плавильщиков. К сожалению, этот технологический прорыв не удался из-за устаревшего оборудования рудников и заводов»
        stranica: В. Лапунов, «Павел Аносов — творец русского булата», официальный сайт Постоянного Комитета Союзного государства, 12.03.2014
        href: https://xn--c1anggbdpdf.xn--p1ai/history/198843/
        pometka: документ
      - summary: <b>Царь отчитал Аносова по жалобе немца-мастера, а потом в извинение дал ему орден.</b>
        det:
          - "Рассказывают, что немецкий мастер пожаловался императору Александру I на молодого помощника управителя фабрики: Аносов будто бы не велел вставить в его квартире вторые окна. Царь сделал Аносову замечание, и тот от огорчения даже заболел."
          - Потом выяснилось, что квартиры вообще не были делом Аносова. Тогда император в извинение наградил его орденом Святой Анны третьей степени, а через несколько месяцев Аносов стал управителем фабрики. Сам источник подаёт эту историю со слов «говорят».
        src: 'Источник: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024 — <a href="https://chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali" rel="noopener">chel.aif.ru/culture/otec-russkogo-bulata-kak-pavel-anosov-raskryl-sekret-chudo-stali</a>.'
        otryvok: «Один из немецких мастеров пожаловался на молодого помощника управителя фабрики императору Александру I за то, что тот не распорядился поставить в квартире иностранного специалиста вторые окна. Его Величество сделал Аносову замечание, отчего тот даже заболел.»
        stranica: Руслан Сафин, «Отец русского булата. Как Павел Аносов раскрыл секрет чудо-стали», «Аргументы и факты — Челябинск», 15.08.2024
