quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — исследовал строение стали под микроскопом; 2 — 25 рублей золотом; 3 — перегрев при ковке; 4 — 1841 год; 5 — Индия."
  ball: 10
  voprosy:
    - q: Что Аносов сделал первым в мире?
      o:
        - Изобрёл булатную сталь
        - Исследовал строение стали под микроскопом
        - Первым стал плавить сталь в тигле
      a: 1
      e: "Микроскоп на стали — 1831 год, об этом пишет сам Аносов. Булат варили в Индии за века до него, а тигельная плавка стали была известна и до Аносова: он её усовершенствовал."
    - q: Сколько стоил привозной тигель, который Аносов заменил своим?
      o:
        - 40–50 копеек
        - 25 рублей золотом
        - 100 червонцев
      a: 1
      e: Привозной — 25 рублей золотом, аносовский из уральской глины — 40–50 копеек. Сто и больше червонцев в Азии платили за лучший булатный клинок.
    - q: Что, по Аносову, губит узор булата при ковке?
      o:
        - Слишком сильный нагрев
        - Медленное остывание
        - Чистый графит
      a: 0
      e: "Он требовал «наименьшее нагревание при ковке»: от лишнего жара узор теряется. Медленное остывание тигля и чистый графит — наоборот, условия булата из его списка."
    - q: В каком году вышла книга «О булатах»?
      o:
        - "1831"
        - "1841"
        - "1851"
      a: 1
      e: 1841. В 1831 году Аносов впервые посмотрел на сталь в микроскоп, в 1851-м он умер в Омске.
    - q: Где родина булата?
      o:
        - На Урале
        - В Индии
        - В Англии
      a: 1
      e: Родина булата — Индия, оттуда везли слитки-«хлебцы» вуца. Аносов вернул утраченный секрет и назвал свою сталь «русским булатом».
