return:
  q: Первым условием «совершенного булата» Аносов назвал «лучший уголь, дающий наименее шлаку». Какой уголь он привёл в пример?
  a: "Чистый сосновый. Так в книге «О булатах» (1841): «Лучший уголь, дающий наименее шлаку, как, например, чистый сосновый»."
  src: П. П. Аносов, «О булатах», 1841 — по книге С. В. Истомина «Самые знаменитые изобретатели России», 2000
audioguide:
  audioSrc: audio-guide-anosov-ru.mp3
  durationLabel: 5 минут 34 секунд
  lead: "Голос ведёт по залу Павла Аносова: от портрета Аносова на обложке до микроскопа 1831 года и книги «О булатах». Пять остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: '0:00'
      title: Портрет на обложке
    - t: 13
      mark: '0:13'
      title: Глиняный горшок за полтинник
    - t: 29
      mark: '0:29'
      title: Тысяча восемьсот тридцать первый
    - t: 41
      mark: '0:41'
      title: Узор — это строение
    - t: 52
      mark: '0:52'
      title: Книга без секретов
  transcript:
    - "«На обложке — Павел Аносов, горный инженер из Златоуста. Веками Европа покупала булатные клинки на Востоке и не умела их повторить; над тайной бились и Фарадей, и Стодарт, и Бертье»."
    - "«Павел Аносов пришёл на Златоустовский завод в 1817 году, а к 1824-му управлял оружейной фабрикой. Немецкий тигель стоил 25 рублей золотом — он слепил свой из уральской глины за 40–50 копеек, и опыты можно было ставить сотнями»."
    - "«В 1831 году Аносов первым в мире положил сталь под микроскоп; Генри Сорби сделает это в 1860-х. Первенство — не булат, а метод: с него начался микроскопический анализ металлов»."
    - "«Он доказал, что узор булата — строение самого металла, отделил настоящий булат от ложного и сварочного и в 1838 году выковал первый клинок русского булата»."
    - "«В 1841 году книга „О булатах“ открыла всем десять условий совершенного булата и через два года вышла на французском и немецком. Три из них можно проверить в тигле на этой странице»."
  note: Озвучено синтезом речи.
