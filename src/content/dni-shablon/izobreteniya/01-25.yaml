story:
  kicker: Пять фактов о Корсакове
  h2: Карта с дырками, которая ищет ответ
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источником.
  udary:
    - summary: <b>Перфокарты впервые хранят сведения.</b> Корсаков первым доверил перфокартам сведения — до него они только ткали узоры и играли музыку.
      det:
        - "До 1832 года перфокарты управляли ткацкими станками Жаккара и стояли в музыкальных шкатулках. Корсаков записал на перфорированные таблицы сведения и построил машины, которые по ним ищут. Профессор Г. Н. Поваров: «Корсакову принадлежит честь первым использовать перфорированные карты в информатике»."
      src: "Источник: С. Н. Корсаков, «Начертание нового способа исследования при помощи машин, сравнивающих идеи», под ред. А. С. Михайлова, М.: МИФИ, 2009, с. 32 — raai.robofob.ru/library/books/korsakov/korsakov_book.pdf"
    - summary: <b>На полвека раньше Холлерита.</b> Корсаков записал сведения на перфокарты за полвека до американца Холлерита, с чьей фирмы выросла IBM.
      det:
        - В машинах Корсакова почти все принципы табулятора Холлерита, появившегося «более чем пятьдесят лет спустя», в 1880-е, для переписи населения США. Фирма Холлерита «станет предтечей современной нам IBM».
      src: "Источник: МИФИ, 2009, с. 32; А. Нитусов, «Семен Корсаков и „машина для сравнения идей“», Виртуальный компьютерный музей — computer-museum.ru/precomp/korsakov.htm"
    - summary: <b>Без патента — даром всем.</b> Корсаков сам отказался от патента на свои машины — и отдал способ всем даром.
      det:
        - В письме Академии наук (сентябрь 1832 года) он «добровольно отказывается от преимуществ исключительной привилегии» и передаёт изобретение «безвозмездно» в общественное пользование.
      src: "Источник: МИФИ, 2009, с. 29; Виртуальный компьютерный музей"
    - summary: <b>Советчица врача.</b> Ещё в 1832-м машина Корсакова подбирала больному лекарство по симптомам — первая в мире советчица врача.
      det:
        - В таблице — лекарства и симптомы; врач выставляет шипы по симптомам больного и ведёт планку — она останавливается на подходящем лекарстве. Журнал ВШЭ называет гомеоскоп первой медицинской экспертной системой.
      src: "Источник: Д. Кузнецов, «Идейные машины советника Корсакова», IQ.Media НИУ ВШЭ, 20.10.2023 — iq-media.ru/archive/867027146.html; МИФИ, 2009, с. 29"
    - summary: <b>Раньше Бэббиджа.</b> Корсаков показал машину на перфокартах в 1832-м — англичанин Бэббидж задумал свою позже и так и не достроил.
      det:
        - Аналитическая машина Бэббиджа на перфокартах — проект 1833–1836 годов, «построить её до конца не удалось». Машины Корсакова к 1832 году уже описаны и показаны Академии.
      src: "Источник: Виртуальный компьютерный музей; МИФИ, 2009"
fakty:
  id: fakty
  nav: Факты
  kicker: Десять фактов о Корсакове · с цитатой и источником
  h2: Факты дня
  udary:
    - summary: "<b>Академики вынесли машинам Корсакова приговор: «научил других обходиться без разума».</b>"
      tag: Факт 1
      det:
        - Осенью 1832 года Корсаков отправил свои машины на суд Академии наук. Комиссия из четырёх академиков под председательством Остроградского пользы в них не нашла и ответила насмешкой. Тот же Остроградский громил и геометрию Лобачевского. Сегодня машины, «заменяющие разум», — главная технология века.
      src: "Источник: С. Н. Корсаков, «Начертание нового способа исследования при помощи машин, сравнивающих идеи», под ред. А. С. Михайлова, М.: МИФИ, 2009, с. 28; второй источник — А. Нитусов, «Семен Корсаков и „машина для сравнения идей“», Виртуальный компьютерный музей."
      otryvok: "«Заключение комиссии содержало ироническое замечание: “Г-н Корсаков потратил слишком много разума на то, чтобы научить других обходиться без разума”. Справедливости ради отметим, что Остроградский также не принял и остро критиковал работы Н.И. Лобачевского по неевклидовой геометрии» (МИФИ, 2009, с. 28). — «Господин Корсаков потратил чересчур много своих интеллектуальных сил, пытаясь научить других, как вовсе без оного интеллекта прожить» (Виртуальный компьютерный музей)."
      stranica: МИФИ, 2009, с. 28; Виртуальный компьютерный музей
      href: https://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf
      pometka: два источника
    - summary: <b>Деревянная машина Корсакова сравнивала 10 000 признаков за один ход.</b>
      tag: Факт 2
      det:
        - "Это плоский гомеоскоп: таблица размером 100 на 100 клеток плюс доска со штырями. Корсаков писал, что со ступенчатыми стержнями число признаков можно довести до миллиона. Это 1832 год, до электричества в быту ещё полвека."
      src: "Источник: МИФИ, 2009, с. 9 (перевод брошюры 1832 года) и с. 19 (таблица 100 на 100 клеток)."
      otryvok: "«Плоский гомеоскоп. Таким же образом мгновенно указывает соответствия, имеющиеся у сравниваемых между собой идей, число деталей которых может достигать десяти тысяч и даже больше. Число этих деталей можно довести до одного миллиона, используя градуированные стержни»."
      stranica: МИФИ, 2009, с. 9, 19 (перевод брошюры 1832 года)
      href: https://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf
      pometka: документ
    - summary: <b>Корсаков первым в мире назвал машины «интеллектуальными» — в 1832 году.</b> <i>⚠ проверяется</i>
      tag: Факт 3 · ⚠ проверяется
      det:
        - В брошюре 1832 года он ввёл понятие «интеллектуальные машины» (machines intellectuelles). Выражение «искусственный интеллект» появилось только в 1956 году, через 124 года.
        - "⚠ Под вопросом: дата 1956 год в источниках дня не названа — нужен русский источник."
      src: "Источник: А. Нитусов, «Семен Корсаков и „машина для сравнения идей“», Виртуальный компьютерный музей."
      otryvok: "«…вводилось понятие о “интеллектуальных машинах” (machines intellectuelles), т. е. прообразе нашего “искусственного интеллекта”»."
      stranica: Виртуальный компьютерный музей, А. Нитусов, «Семен Корсаков и „машина для сравнения идей“»
      href: https://www.computer-museum.ru/precomp/korsakov.htm
      pometka: два источника
    - summary: <b>Корсаков в 1832-м предсказал, что машины станут для разума тем же, чем телескоп для глаза.</b>
      tag: Факт 4
      det:
        - Корсаков писал, что его машины — лишь первый шаг и что они «безгранично расширят» возможности мысли. Это почти дословная формула сегодняшнего ИИ-помощника. Профессор МИФИ Г. Н. Поваров называл это концепцией искусственного разума как усилителя естественного.
      src: "Источник: Виртуальный компьютерный музей (цитата из брошюры 1832 года); МИФИ, 2009, с. 32."
      otryvok: "«Равно как телескоп и микроскоп придают дополнительную силу нашим глазам, интеллектуальные машины безгранично расширят возможности нашей мысли (разума)…»"
      stranica: Виртуальный компьютерный музей; МИФИ, 2009, с. 32
      href: https://www.computer-museum.ru/precomp/korsakov.htm
      pometka: два источника
    - summary: <b>Человек сравнивает два предмета разом, а идеоскоп Корсакова — сотни.</b>
      tag: Факт 5
      det:
        - "Корсаков сам объяснял, зачем нужна машина: ум одновременно охватывает лишь несколько деталей. Его идеоскоп «мгновенно» сравнивал за одну операцию несколько сотен карточек-идей, по сотне с лишним признаков у каждой."
      src: "Источники: МИФИ, 2009, с. 7 (перевод брошюры); Виртуальный компьютерный музей."
      otryvok: "«Мы не можем сравнивать, по той же причине, более двух предметов одновременно…» (МИФИ, 2009, с. 7). — «Число идей (перфокарт) сравниваемых за одну операцию могло достигать нескольких сотен, а число уточняющих деталей для каждого понятия – превысить сотню» (Виртуальный компьютерный музей)."
      stranica: МИФИ, 2009, с. 7; Виртуальный компьютерный музей
      href: https://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf
      pometka: два источника
    - summary: <b>Машина Корсакова 1832 года искала по фильтрам с «весом» — как сайт подбирает телефон.</b>
      tag: Факт 6
      det:
        - Академики возражали, что не все признаки одинаково важны. Тогда Корсаков дописал способ задавать важность каждого признака, то есть весовые коэффициенты. Учёные МИФИ сравнивают это с выбором телефона по нескольким условиям.
      src: "Источник: МИФИ, 2009, с. 4, 29, 39."
      otryvok: "«многокритериальный поиск с учетом относительной степени важности различных критериев (весовых коэффициентов)» (с. 4). — «Третий документ посвящен изложению способа задания различных степеней важности (весовых коэффициентов) для признаков искомой записи. Скорее всего, это письмо было написано Корсаковым в ответ на критику академиков…» (с. 29). — «Читатель легко может провести аналогию с сегодняшним днем, например с выбором мобильного телефона по ряду критериев» (с. 39)."
      stranica: МИФИ, 2009, с. 4, 29, 39
      href: https://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf
      pometka: документ
    - summary: <b>Корсаков дошёл с русской армией до Парижа — и, видимо, привёз оттуда идею перфокарты.</b> <i>⚠ проверяется</i>
      tag: Факт 7 · ⚠ проверяется
      det:
        - Он воевал в 1812 году и прошёл Заграничный поход 1813–1814 годов. В Париже как раз работали ткацкие станки Жаккара на перфокартах. Через 18 лет офицер-победитель заставил те же карты не ткать, а думать.
        - "⚠ Под вопросом: что Корсаков видел станки на перфокартах в Париже — предположение автора статьи («по всей вероятности»). Участие в войне и походе подтверждают два источника."
      src: "Источники: А. Нитусов, «Семен Корсаков и его „машина для сравнения идей“», газета «Информатика» (ИД «Первое сентября»), № 8/2009; МИФИ, 2009, с. 27."
      otryvok: "«Сам он принимал участие в Отечественной войне 1812–1814 гг. и вместе с русской армией побывал в “столице наук” — Париже, где, по всей вероятности, познакомился с одной из самых захватывающих технических новинок того времени — перфокартами Жаккара» («Информатика», № 8/2009). — «Корсаков участвовал в Отечественной войне 1812 г., а также в Заграничном походе против Наполеона 1813–1814 гг.» (МИФИ, 2009, с. 27)."
      stranica: МИФИ, 2009, с. 27; газета «Информатика», № 8/2009
      href: https://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf
      pometka: два источника
    - summary: <b>Изобретение Корсакова 129 лет пролежало в архиве Академии, и о нём никто не знал.</b>
      tag: Факт 8
      det:
        - Бумаги нашли и опубликовали только в 1961 году (М. И. Радовский). В 1980-х профессор Поваров отыскал в Российской государственной библиотеке оригинал брошюры — единственное полное описание всех пяти машин. Мировое признание пришло с книгой, изданной за рубежом в 2001 году.
      src: "Источник: МИФИ, 2009, с. 4–5, 29, 32."
      otryvok: "«Изобретения Корсакова были незаслуженно забыты. В 1961 году М.И. Радовский опубликовал архивные документы АН СССР… Геллий Николаевич провел собственное научно-историческое исследование, нашел в Российской государственной библиотеке оригинальную брошюру Корсакова» (с. 4–5). — «брошюра Корсакова является единственным источником подробного описания всех пяти “интеллектуальных машин” и их изображений» (с. 29)."
      stranica: МИФИ, 2009, с. 4–5, 29, 32
      href: https://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf
      pometka: документ
    - summary: <b>Машины Корсакова в 1832-м делали то, с чего сегодня начинается учебник информатики.</b>
      tag: Факт 9
      det:
        - Пересечение, объединение, разность множеств — основа дискретной математики, на ней стоят базы данных и поиск. Учёные МИФИ показали, что все пять машин Корсакова выполняли эти операции механически, деревом и штырями.
      src: "Источник: МИФИ, 2009, с. 5."
      otryvok: "«Уже в первой половине XIX века машины Корсакова на практике реализовывали основные операции с множествами, т.е. тот самый базис, который и поныне лежит в основе дискретной математики и излагается в первых главах современных учебников»."
