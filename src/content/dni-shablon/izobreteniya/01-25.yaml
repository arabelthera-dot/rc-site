    det:
    - 'Корсаков описал Академии наук пять машин. Комиссия в октябре 1832 года подробно разобрала лишь простейшую — прямолинейный гомеоскоп с неподвижными частями: его показывали на примере подбора лекарства по признакам болезни.'
    - Остальные четыре машины — среди них идеоскоп, сравнивавший сотни карточек разом, — в заключении подробно не разбирали. Но отказ получило всё предложение Корсакова целиком.
    src: "Источник: С. Н. Корсаков, «Начертание нового способа исследования при помощи машин, сравнивающих идеи», под ред. А. С. Михайлова, М.: МИФИ, 2009, с. 29 — http://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf."
    otryvok: «Судя по документу, детальному рассмотрению подвергся только гомеоскоп с неподвижными частями, работа которого иллюстрировалась на примере поиска подходящего лекарства на основе симптомов заболевания.»
