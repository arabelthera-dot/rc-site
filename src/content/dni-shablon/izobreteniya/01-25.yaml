return:
  q: За сколько лет до табулятора Холлерита Корсаков доверил перфокартам сведения?
  a: "Больше чем за полвека: машины Корсакова — 1832 год, табулятор Холлерита — 1880-е."
  src: "С. Н. Корсаков, «Начертание нового способа исследования…», М.: МИФИ, 2009, с. 32"
audioguide:
  audioSrc: "audio-guide-korsakov-ru.mp3"
  durationLabel: 5 минут 24 секунды
  lead: "Голос ведёт по залу Семёна Корсакова: от портрета и брошюры тысяча восемьсот тридцать второго года через чертёж машины и игру с перфокартой до письма в Академию наук. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Портрет и брошюра
    - t: 64
      mark: 1:04
      title: Карта, которая умела только ткать
    - t: 108
      mark: 1:48
      title: Машина, которая советует врачу
    - t: 152
      mark: 2:32
      title: Пробейте карту сами
    - t: 204
      mark: 3:24
      title: Холлерит и Бэббидж
    - t: 246
      mark: 4:06
      title: Даром — всем
    - t: 279
      mark: 4:39
      title: Перфокарта ищет ответ
  transcript:
    - "<p>«Здравствуйте. Мы в зале Семёна Николаевича Корсакова. Посмотрите на гравюру: пожилой человек в очках, с залысинами, в сюртуке с высоким воротником. Рядом — титульный лист старой брошюры на французском языке. Санкт-Петербург, тысяча восемьсот тридцать второй год, с пометками чернилами. В этой брошюре Корсаков описал «машины для сравнения идей». Звучит загадочно, но мысль у него была очень простая и очень смелая: карточка с дырками может не только ткать узор. Она может хранить сведения и искать ответ. Наверху зала полоса из четырёх цифр. Тысяча восемьсот тридцать второй год — машины показаны Академии. Пятьдесят лет — столько оставалось до перфокарт Холлерита. Тысяча восемьсот тридцать третий — Бэббидж только задумал свою машину. И ноль рублей — патент не взял, даром всем. К каждой из этих цифр мы ещё вернёмся. Пройдём по залу по порядку: чем перфокарта была до Корсакова, что он с ней сделал, как это попробовать самому, кто пришёл к той же мысли позже, и почему Корсаков не взял за изобретение ни рубля.»</p>"
    - "<p>«Сначала о том, что было до тысяча восемьсот тридцать второго года. Перфокарты тогда уже существовали. Они управляли ткацкими станками Жаккара: дырки в карте говорили станку, какие нитки поднять. Так получался узор на ткани. Такие же карточки с дырками стояли в музыкальных шкатулках и играли мелодию. В игре ниже это первый шаг: карточка с дырками светится под станком. То есть карта умела только одно — повторять заданный узор или заданную музыку. Корсаков сделал другой шаг. Он записал на перфорированные таблицы сведения и построил машины, которые по этим сведениям ищут. Профессор Поваров сказал об этом так: «Корсакову принадлежит честь первым использовать перфорированные карты в информатике».»</p>"
    - "<p>«Теперь найдите в зале старый чертёж: две доски с рядами отверстий и штырей, пронумерованные от одного до восемнадцати, а рядом крупно нарисован узел со штырём. Это и есть машина Корсакова. В её таблице записаны лекарства и признаки болезней. Врач выставляет шипы по признакам больного и ведёт планку вдоль таблицы. Там, где шипы совпадают с дырками, планка останавливается. Это и есть подходящее лекарство. Сравните чертёж с игрой: доски с дырками и штыри — та же пара, перфокарта и шипы. Машина называлась гомеоскоп. Журнал Высшей школы экономики называет её первой медицинской экспертной системой. Получается, что ещё в тысяча восемьсот тридцать втором году у врача появилась первая в мире машина-советчица. Она не лечила сама, она помогала выбрать.»</p>"
    - "<p>«Спуститесь к игре «Пробей карту и найди лекарство». Сначала нажмите на перфокарту, и станок соткёт узор. Так было до Корсакова: карта умела только ткать. Потом нажмите «Дальше». Перед вами больной: у него жар, кашель и слабость. Пробейте три дырки, по одной на каждый признак. Затем нажимайте «Сдвинь ниже», пока шипы не войдут во все дырки. Когда войдут, вы увидите надпись: «Лекарство найдено — машиной!» В игре честно сказано про два упрощения. Первое: в таблице пять строк, а у Корсакова их были сотни. Второе: у Корсакова дырявой была таблица лекарств, а признаки больного врач выставлял шипами на планке. В игре они поменялись местами, чтобы карту больного вы пробили своими руками. Принцип от этого не меняется: дырки хранят сведения, а машина по ним ищет.»</p>"
    - "<p>«Пройдём к сравнению. Наверху зала в полосе фактов стоит цифра: пятьдесят лет. Американец Холлерит стал записывать сведения на перфокарты только в тысяча восемьсот восьмидесятых годах, для переписи населения США. Из его фирмы потом выросла IBM. В машинах Корсакова, как сказано в издании МИФИ, есть почти все принципы табулятора Холлерита, появившегося более чем пятьдесят лет спустя. А англичанин Бэббидж задумал свою аналитическую машину на перфокартах позже Корсакова. Это проект тысяча восемьсот тридцать третьего — тысяча восемьсот тридцать шестого годов, и построить её до конца так и не удалось. Машины Корсакова к тысяча восемьсот тридцать второму году уже были описаны и показаны Академии наук.»</p>"
    - "<p>«А теперь, пожалуй, самая необычная остановка зала. В полосе фактов наверху стоит: ноль рублей. Патент не взял, даром всем. В сентябре тысяча восемьсот тридцать второго года Корсаков написал в Академию наук письмо. В нём он «добровольно отказывается от преимуществ исключительной привилегии». Привилегией тогда называли то, что сегодня мы зовём патентом. И передаёт своё изобретение «безвозмездно», в общественное пользование. Он не стал брать денег. Он подарил свой способ всем.»</p>"
    - "<p>«Вот и весь зал. Повторим главное. До тысяча восемьсот тридцать второго года перфокарта ткала узоры и играла музыку. Семён Корсаков первым в мире доверил ей сведения и построил машины, которые по этим сведениям ищут. Одна из них подбирала больному лекарство по признакам болезни. Это было за полвека до Холлерита и IBM и раньше, чем Бэббидж задумал свою машину. И всё это Корсаков отдал людям даром. Если ещё не пробовали, вернитесь к игре и пробейте карту больного сами. А ниже — пять фактов о Корсакове и источники. Эта страница стоит на трёх: на книге самого Корсакова в издании МИФИ под редакцией Михайлова, на очерке Нитусова в Виртуальном компьютерном музее и на статье Кузнецова в журнале Высшей школы экономики.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
