return:
  q: За сколько лет до табулятора Холлерита Корсаков доверил перфокартам сведения?
  a: "Больше чем за полвека: машины Корсакова — 1832 год, табулятор Холлерита — 1880-е."
  src: "С. Н. Корсаков, «Начертание нового способа исследования…», М.: МИФИ, 2009, с. 32"
audioguide:
  audioSrc: "audio-guide-korsakov-ru-4.mp3"
  durationLabel: 4 минуты 42 секунды
  lead: "Голос ведёт по залу Семёна Корсакова: от портрета и брошюры тысяча восемьсот тридцать второго года через чертёж машины до письма в Академию наук. Шесть остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: "0:00"
      title: Портрет и брошюра
    - t: 64
      mark: "1:04"
      title: Карта, которая умела только ткать
    - t: 104
      mark: "1:44"
      title: Машина, которая советует врачу
    - t: 154
      mark: "2:34"
      title: Холлерит и Бэббидж
    - t: 198
      mark: "3:18"
      title: Даром — всем
    - t: 231
      mark: "3:51"
      title: Перфокарта ищет ответ
  transcript:
    - "«Здравствуйте. Мы в зале Семёна Николаевича Корсакова. Посмотрите на гравюру: пожилой человек в очках, с залысинами, в сюртуке с высоким воротником. Рядом — титульный лист старой брошюры на французском языке. Санкт-Петербург, тысяча восемьсот тридцать второй год, с пометками чернилами. В этой брошюре Корсаков описал «машины для сравнения идей». Звучит загадочно, но мысль у него была очень простая и очень смелая: карточка с дырками может не только ткать узор. Она может хранить сведения и искать ответ. Наверху зала полоса из четырёх цифр. Тысяча восемьсот тридцать второй год — машины показаны Академии. Пятьдесят лет — столько оставалось до перфокарт Холлерита. Тысяча восемьсот тридцать третий — Бэббидж только задумал свою машину. И ноль рублей — патент не взял, даром всем. К каждой из этих цифр мы ещё вернёмся. Пройдём по залу по порядку: чем перфокарта была до Корсакова, что он с ней сделал, кто пришёл к той же мысли позже, и почему Корсаков не взял за изобретение ни рубля.»"
    - "«Сначала о том, что было до тысяча восемьсот тридцать второго года. Перфокарты тогда уже существовали. Они управляли ткацкими станками Жаккара: дырки в карте говорили станку, какие нитки поднять. Так получался узор на ткани. Такие же карточки с дырками стояли в музыкальных шкатулках и играли мелодию. То есть карта умела только одно — повторять заданный узор или заданную музыку. Корсаков сделал другой шаг. Он записал на перфорированные таблицы сведения и построил машины, которые по этим сведениям ищут. Профессор Поваров сказал об этом так: «Корсакову принадлежит честь первым использовать перфорированные карты в информатике».»"
    - "«Теперь найдите в зале старый чертёж: две доски с рядами отверстий и штырей, пронумерованные от одного до восемнадцати, а рядом крупно нарисован узел со штырём. Это компаратор — одна из пяти машин Корсакова: две деревянные рамки сравнивают две идеи, например качества двух людей. А лекарство подбирала другая его машина — гомеоскоп. В её таблице записаны лекарства и признаки болезней. Врач выставляет шипы по признакам больного и ведёт планку вдоль таблицы. Там, где шипы совпадают с дырками, планка останавливается. Это и есть подходящее лекарство. Машина называлась гомеоскоп. Журнал Высшей школы экономики называет её первой медицинской экспертной системой. Получается, что ещё в тысяча восемьсот тридцать втором году у врача появилась первая в мире машина-советчица. Она не лечила сама, она помогала выбрать.»"
    - "«Пройдём к сравнению. Наверху зала в полосе фактов стоит цифра: пятьдесят лет. Американец Холлерит стал записывать сведения на перфокарты только в тысяча восемьсот восьмидесятых годах, для переписи населения США. Из его фирмы потом выросла IBM. В машинах Корсакова, как пишет Нитусов в Виртуальном компьютерном музее, есть почти все принципы табулятора Холлерита, появившегося более чем пятьдесят лет спустя. А англичанин Бэббидж задумал свою аналитическую машину на перфокартах позже Корсакова. Это проект тысяча восемьсот тридцать третьего — тысяча восемьсот тридцать шестого годов, и построить её до конца так и не удалось. Машины Корсакова к тысяча восемьсот тридцать второму году уже были описаны и показаны Академии наук.»"
    - "«А теперь, пожалуй, самая необычная остановка зала. В полосе фактов наверху стоит: ноль рублей. Патент не взял, даром всем. В сентябре тысяча восемьсот тридцать второго года Корсаков написал в Академию наук письмо. В нём он «добровольно отказывается от преимуществ исключительной привилегии». Привилегией тогда называли то, что сегодня мы зовём патентом. И передаёт своё изобретение «безвозмездно», в общественное пользование. Он не стал брать денег. Он подарил свой способ всем.»"
    - "«Вот и весь зал. Повторим главное. До тысяча восемьсот тридцать второго года перфокарта ткала узоры и играла музыку. Семён Корсаков первым в мире доверил ей сведения и построил машины, которые по этим сведениям ищут. Одна из них подбирала больному лекарство по признакам болезни. Это было за полвека до Холлерита и IBM и раньше, чем Бэббидж задумал свою машину. И всё это Корсаков отдал людям даром. А ниже — факты о Корсакове и источники. Главных источников у страницы три: книга самого Корсакова в издании МИФИ под редакцией Михайлова, очерк Нитусова в Виртуальном компьютерном музее и статья Кузнецова в журнале Высшей школы экономики.»"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
