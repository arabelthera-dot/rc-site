  - summary: "Единственная книжка о машинах Корсакова пропала из Ленинки — нашли её только в Италии."
    det:
    - Всё, что мы знаем о пяти машинах Корсакова, известно из его брошюры 1832 года. В 1980-х профессор МИФИ Г. Н. Поваров видел её в каталоге Ленинской библиотеки в Москве. А потом книжка стала недоступной — главное доказательство русского первенства исчезло из главной библиотеки страны.
    - Участники международного проекта по истории русской вычислительной техники искали её несколько лет. Нашлась брошюра в Италии, в библиотеке маленького университетского городка.
    src: "Источник: А. Нитусов, «Семен Корсаков и „машина для сравнения идей“», Виртуальный компьютерный музей — computer-museum.ru/precomp/korsakov.htm; второй источник — А. Нитусов, «Семен Корсаков и его „машина для сравнения идей“», газета «Информатика» (ИД «Первое сентября»), № 8/2009 — https://inf.1sept.ru/view_article.php?ID=200900805."
    otryvok: «Г. Н. Поваров видел ее в каталоге библиотеки им. Ленина, но в последние годы она оказалась недоступной. После нескольких лет поисков … удалось найти ее в Италии, в библиотеке небольшого университетского городка.»
    stranica: А. Нитусов, «Семен Корсаков и „машина для сравнения идей“», Виртуальный компьютерный музей; газета «Информатика», № 8/2009
