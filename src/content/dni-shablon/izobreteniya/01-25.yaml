  - summary: "Корсаков устроил в Москве «справочное место» — живую «поисковую систему»."
    det:
    - 'Кроме машин, он организовал в Москве «справочное место»: туда приходили за нужными сведениями. Это та же мечта, что и в машинах: дать человеку ответ сразу.'
    src: 'Источники: А. Нитусов, газета «Информатика», № 8/2009, и Виртуальный компьютерный музей; МИФИ, 2009, с. 26.'
    otryvok: «В Москве он организовал… “справочное место”» (А. Нитусов). — «…организовал… в Москве “справочное место”, аналог современных пунктов получения информации» (МИФИ, 2009, с. 26).
    stranica: МИФИ, 2009, с. 26; Виртуальный компьютерный музей
