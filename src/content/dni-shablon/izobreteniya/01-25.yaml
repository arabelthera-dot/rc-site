      prava: {"god_smerti_avtora":1900,"god_reabilitacii":"net","sdelano_mashinoj":false,"otkuda":"Госкаталог музейного фонда РФ","baza":"goskatalog","pervaya_publikaciya":"Госкаталог музейного фонда РФ, рег. № 7711039","ssylka":"https://goskatalog.ru/portal/#/collections?id=7825101","avtor":"П. Ф. Борель","god_sozdaniya":"1869","anonim":false}
      podlinnik: {"gde":"Государственный музей истории российской литературы имени В. И. Даля","otkuda":"https://goskatalog.ru/portal/#/collections?id=7825101"}
