  - summary: "Корсаков обещал, что его машины будут дешёвыми. Академия отказала: слишком дорого."
    det:
    - 'В брошюре 1832 года Корсаков писал: машины устроены просто, стоить будут недорого, а значит, пользу от них получат многие.'
    - 'Академики посчитали иначе. Для каждой науки нужна своя таблица с дырками, таблицы выйдут огромными, а траты не окупятся. Учёные МИФИ сегодня пишут, что ошибка была в другом: машину не обязательно было делать сразу на всю науку, она годилась для конкретных задач.'
    src: "Источник: С. Н. Корсаков, «Начертание нового способа исследования при помощи машин, сравнивающих идеи», под ред. А. С. Михайлова, М.: МИФИ, 2009, с. 8, 30–31 — http://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf."
    otryvok: «Члены Комиссии замечают, что этот метод по самой своей природе может быть приложен лишь к некоторым наукам, да и то для каждой из них потребовалось бы составить отдельную таблицу; последняя в большинстве своем имела бы огромные размеры и потребовала бы затрат, совершенно не соответствующих пользе, которую по мнению автора (Корсакова), можно было бы получить от этого прибора».
    stranica: С. Н. Корсаков, «Начертание нового способа исследования…», МИФИ, 2009, с. 30
    href: http://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf
