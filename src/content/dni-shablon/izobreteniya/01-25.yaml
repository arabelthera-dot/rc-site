  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — управляли ткацкими станками и музыкальными шкатулками; 2 — посмеялась: «научить других обходиться без разума»; 3 — десять тысяч и даже больше; 4 — способ задать важность каждого признака; 5 — ничего, отказался от привилегии."
  ball: 10
  voprosy:
    - q: Что делали перфокарты до Корсакова?
      o:
        - Считали деньги в банках
        - Управляли ткацкими станками и музыкальными шкатулками
        - Хранили книги в библиотеках
      a: 1
      e: Карта с дырками говорила станку, какие нитки поднять, а шкатулке — какую ноту сыграть. Сведения на неё первым записал Корсаков.
    - q: Что ответила Корсакову комиссия Академии наук в 1832 году?
      o:
        - Дала ему премию
        - "Посмеялась: он потратил много разума, «чтобы научить других обходиться без разума»"
        - Купила машины для библиотеки
      a: 1
      e: Пользы в машинах комиссия не нашла и ответила насмешкой (МИФИ, 2009, с. 28).
    - q: Сколько признаков мог сравнить плоский гомеоскоп Корсакова?
      o:
        - Десять
        - Сто
        - Десять тысяч и даже больше
      a: 2
      e: «Десяти тысяч и даже больше», а со ступенчатыми стержнями — до миллиона (брошюра 1832 года, МИФИ, 2009, с. 9).
    - q: Что Корсаков дописал к своим машинам после критики академиков?
      o:
        - Способ задать важность каждого признака
        - Паровой двигатель
        - Счётчик денег
      a: 0
      e: Весовые коэффициенты — то, что сегодня делает фильтр в магазине, когда одно условие важнее другого (МИФИ, 2009, с. 29).
    - q: Сколько Корсаков взял за свой способ?
      o:
        - Ничего — отказался от привилегии и отдал способ всем
        - Сто рублей
        - Продал его за границу
      a: 0
      e: В сентябре 1832 года он написал Академии, что «добровольно отказывается от преимуществ исключительной привилегии».
