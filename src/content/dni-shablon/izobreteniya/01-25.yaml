    - Академия отказала, бумаги ушли в архив. Но в архивных документах нет ни устройства машин, ни рисунков. Всё, что мы знаем о пяти машинах Корсакова, известно из той самой брошюры.
    src: "Источник: Д. Кузнецов, «Идейные машины советника Корсакова», IQ.Media НИУ ВШЭ, 20.10.2023 — https://iq-media.ru/archive/867027146.html; С. Н. Корсаков, «Начертание нового способа исследования при помощи машин, сравнивающих идеи», под ред. А. С. Михайлова, М.: МИФИ, 2009, с. 29 — http://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf."
