  - summary: "Академики боялись, что машина Корсакова отучит врачей думать."
    det:
    - 'Корсаков показывал гомеоскоп на примере врача: тот отмечает признаки болезни, а машина находит подходящее лекарство.'
    - 'Комиссия Академии наук испугалась: «столь механический метод лечения» уничтожит у врачей «всякую способность мыслить». Машину отвергли, а помощники врача по этому принципу появились только во второй половине XX века.'
    src: "Источник: С. Н. Корсаков, «Начертание нового способа исследования при помощи машин, сравнивающих идеи», под ред. А. С. Михайлова, М.: МИФИ, 2009, с. 30 — http://raai.robofob.ru/library/books/korsakov/korsakov_book.pdf; Д. Кузнецов, «Идейные машины советника Корсакова», IQ.Media НИУ ВШЭ, 20.10.2023 — https://iq-media.ru/archive/867027146.html."
