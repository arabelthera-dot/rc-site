return:
  q: Сколько больных с пришитой к сердцу грудной артерией было у Колесова, когда в 1967 году его статья вышла в американском журнале?
  a: "Двенадцать: за три года после первой операции Колесов сделал уже 12 таких шунтов."
  src: Вестник хирургии им. И. И. Грекова, 2015; Креативная кардиология, 2017
audioguide:
  audioSrc: audio-guide-kolesov-ru.mp3
  durationLabel: 5 минут 47 секунд
  lead: "Голос ведёт по залу Василия Колесова: от бюста хирурга на обложке через восемь минут у кардиограммы и игру «Сшей шунт» до собаки Доги, блокады и признания через полвека. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Бюст в сквере
    - t: 59
      mark: 0:59
      title: Восемь минут у кардиограммы
    - t: 108
      mark: 1:48
      title: Вена или артерия
    - t: 154
      mark: 2:34
      title: "Сшей шунт: игра"
    - t: 212
      mark: 3:32
      title: "Первенство: шов и человек"
    - t: 258
      mark: 4:18
      title: Блокада и Чусовая
    - t: 302
      mark: 5:02
      title: Решился руками
  transcript:
    - "<p>«Здравствуйте. Мы в зале хирурга Василия Колесова. Посмотрите на фотографию наверху страницы. Бюст на высоком постаменте в сквере университета, у подножия цветы, рядом выступающие и почётный караул. Это открытие бюста Колесову в Первом Санкт-Петербургском медицинском университете имени Павлова, тридцатое августа две тысячи двадцать первого года. Ниже строка: двадцать пятое февраля тысяча девятьсот шестьдесят четвёртого года, Ленинград. Седьмое января — лишь день календаря музея, а сама операция прошла в феврале. Главная мысль зала: Ленинградский хирург Василий Колесов сделал первое в мире коронарное шунтирование — пришил собственную артерию человека к живому, бьющемуся сердцу.. Ниже, под заголовком, полоса из четырёх чисел. Тысяча девятьсот шестьдесят четвёртый — первая операция. На три года раньше Фавалоро. Без аппарата искусственного кровообращения, на бьющемся сердце. И двадцать лет — до самой частой операции мира. Пройдём по залу по порядку.»</p>"
    - "<p>«Начнём с истории, она называется «Артерия, пришитая к сердцу». Больному было сорок четыре года. Инфаркт он перенёс восемью годами раньше, и стенокардия не отпускала его. Колесов взял левую внутреннюю грудную артерию — сосуд, который идёт вдоль грудины, — и соединил её с ветвью артерии сердца, в обход суженного участка. Но сначала хирург восемь минут держал артерию сердца пережатой и следил за кардиограммой: выдержит ли сердце. Выдержало. Шов наложен вручную, под лупой. Боли ушли — по словам университета, на три года. Нажмите ниже «Узнать подробнее»: там слова авторов статьи к стодесятилетию Колесова. С этой операции началась эпоха коронарного шунтирования. А через двадцать лет шунтирование стало самой выполняемой операцией в мире.»</p>"
    - "<p>«Следующий абзац истории — про соперника. Американец Рене Фавалоро из Кливленда, которого на Западе называют отцом шунтирования, сделал шунтирование только в тысяча девятьсот шестьдесят седьмом году. На три года позже — и не артерией, а собственной веной больного. Разница не только в годах: Колесов первым в мире пришил к сердцу собственную артерию человека, швом, руками. Есть и сюжет с рецензией. В ноябре тысяча девятьсот шестьдесят шестого года американский журнал отправил рукопись Колесова Дональду Эффлеру — шефу Кливлендской клиники, где работал Фавалоро. Статья вышла в октябре тысяча девятьсот шестьдесят седьмого года. А в две тысячи двадцать четвёртом, к шестидесятилетию операции, в Павловском университете сказали: «Весь мир знает, что пионером был Василий Иванович Колесов».»</p>"
    - "<p>«Теперь спуститесь к игре «Сшей обходной путь на бьющемся сердце». Вы — хирург Колесов, тысяча девятьсот шестьдесят четвёртый год. Сначала нажмите «Пережать артерию и смотреть ЭКГ». Артерию сердца зажмут, и на левом экране побежит кардиограмма — линия ударов сердца. Подождите восемь секунд: это восемь минут операции. Ритм ровный — сердце выдержит, можно шить. Пока восемь секунд не прошли, шить нельзя. Потом нажимайте на золотые точки на рисунке сердца справа. Одна точка — один стежок, всего восемь. Сердце бьётся, и точки качаются вместе с ним, так что попадайте точно: промах не засчитается. На восьмом стежке красные капли крови побегут в обход сужения — операция удалась. Кнопка «Начать заново» всё сбрасывает. Честная оговорка: это модель, а не снимок. Восемь минут пережатия сжаты до восьми секунд, число стежков задано программой.»</p>"
    - "<p>«Ниже есть раздел «Что именно Колесов сделал первым». Здесь страница честно проводит границу. Идею обойти больную артерию сердца в опыте на животных первыми показали другие — Демихов в Москве и Мюррей в Канаде, независимо, в тысяча девятьсот пятьдесят третьем году, и без шва. Первого ноября тысяча девятьсот пятьдесят третьего года московский биолог Владимир Демихов соединил собаке по кличке Дога внутреннюю грудную артерию с сердечной. Шва не было: стеклянная канюля-тройник, затянутая нитками. Дога прожила с новым руслом крови семь лет. Колесов знал эту работу и ссылался на неё. Но первенство Колесова — шов и человек. Посмотрите на таблицу: Москва, Ленинград, Кливленд и снова Ленинград — механический шов аппаратом и экстренные шунты при инфаркте.»</p>"
    - <p>«Теперь пять фактов и раздел «Ещё о Колесове». Колесов родился в вологодской деревне Мартьяновская, в крестьянской семье, где было шестеро детей. Мальчишкой пел в церковном хоре и подрабатывал писарем. В тысяча девятьсот тридцать первом году молодой врач заведовал инфекционным отделением в Чусовой, в разгар сыпного тифа, и свою первую операцию сделал вместо хирурга — и спас ребёнка. Всю блокаду он оперировал в Ленинграде. Зимой тысяча девятьсот сорок второго года от голода у него развился тяжёлый гидроперикард — вода в сердечной сумке. И в том же году он собрал в осаждённом городе научную конференцию. А в тысяча девятьсот шестьдесят восьмом первым в мире шунтировал сердце прямо во время начинающегося инфаркта — и все трое больных выжили.»</p>
    - "<p>«Подведём итог зала. До прямого шунта клиника Колесова сделала больше трёхсот непрямых операций, которые помогали медленно. Эта медленность и толкнула его к прямому пути. Он не остановил сердце: тяжелобольному, считал он, аппарат искусственного кровообращения только вредит. Через полвека именно отказ от этого аппарата и операцию на работающем сердце назвали главным направлением коронарной хирургии. Мемуары «Записки старого хирурга» ученики издали уже после его смерти. А сегодня едва ли найдётся клиника в мире, где не применяют его операцию. Первым бывает тот, кто решился сделать руками то, что другие считали слишком опасным. Теперь пережмите артерию и сшейте шунт в игре — или откройте пять фактов и проверьте себя в викторине.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
