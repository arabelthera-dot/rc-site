  intro: Та же история коротким роликом — от восьми минут с пережатой артерией до операции, которую сегодня делают по всему миру.
  poster: video/day-07jan-kolesov-poster.jpg
  mp4: video/day-07jan-kolesov.mp4?v=1
  note: "Кадры ролика — подлинные: открытие бюста В. И. Колесова и цветы к бюсту, фото 2021 года. Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История изобретения
  h2: Артерия, пришитая к сердцу
  udary:
    - summary: 25 февраля 1964 года в Ленинграде Колесов пришил собственную артерию больного прямо к артерии его сердца — так началась эпоха коронарного шунтирования.
      det:
        - Больному было 44 года, инфаркт он перенёс восемью годами раньше, и стенокардия не отпускала его. Колесов взял левую внутреннюю грудную артерию — сосуд, который идёт вдоль грудины, — и соединил её «конец в конец» с ветвью огибающей артерии сердца, в обход суженного участка.
        - "Перед тем как вскрыть артерию сердца, хирург восемь минут держал её пережатой и следил за кардиограммой: выдержит ли сердце. Выдержало. Шов наложен вручную, под лупой. Боли ушли — по словам университета, больной был избавлен от них на три года."
        - "Авторы статьи к 110-летию Колесова пишут прямо: «25 февраля 1964 г. В. И. Колесов выполнил первую в мире успешную операцию маммарно-коронарного анастомоза» и «С этой операции началась эпоха коронарного шунтирования». Через двадцать лет шунтирование стало самой выполняемой операцией в мире."
      src: "Источник: Седов В. М., Немков А. С. // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1. С. 90, 92; ПСПбГМУ им. И. П. Павлова, 30.08.2021."
    - summary: Американец Фавалоро сделал шунтирование только в 1967 году — на три года позже и не артерией, а веной.
      det:
        - Рене Фавалоро из Кливленда, которого на Западе называют отцом шунтирования, в 1967 году внедрил аорто-коронарное шунтирование собственной веной больного. У Колесова шунтом была артерия — и было это в 1964-м.
        - "В 2024 году, к 60-летию операции, в Павловском университете сказали так: «Весь мир знает, что пионером был Василий Иванович Колесов»."
      src: "Источник: Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1. С. 90; ПСПбГМУ им. И. П. Павлова, «МИР 24», 29.02.2024."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Колесове
    h2: Хирург, которого признали не сразу
    udary:
      - summary: <b>Первым в мире Колесов шил шунт на бьющемся сердце — без аппарата искусственного кровообращения.</b>
        det:
          - "Колесов наложил соединение вручную, «под контролем лупы», не останавливая сердце и без аппарата искусственного кровообращения: тяжелобольному, считал он, этот аппарат только вредит."
          - Через полвека доклад на сессии Бакулевского центра называет главным направлением современной коронарной хирургии именно «отказ от ИК и выполнение операции на работающем сердце».
        src: "Источник: Вестник хирургии им. И. И. Грекова. 2015. С. 92; Синельников М. Е., Чумаков А. В., доклад на XIX сессии НЦССХ им. А. Н. Бакулева, 2015."
        otryvok: «Наложение анастомоза осуществлено под контролем лупы» («Вестник хирургии»). — «Первым в мире В.И. Колесов провел ПРМ при остром инфаркте миокарда и нестабильной стенокардии, выполнил МКШ на работающем сердце» (сессия НЦССХ им. Бакулева).
        stranica: "Синельников М. Е., Чумаков А. В. «Операция маммарно-коронарного шунтирования: история разработки и внедрения в клинику», XIX сессия НЦССХ им. А. Н. Бакулева, 2015 (racvs.ru)"
        href: https://racvs.ru/events/archive/xix_ezhegodnaya_sessiya_nauchnogo_tsentra_serdechnososudistoy_khirurgii_im_an_bakuleva_s_vserossiysk/operatsiya_mammarnokoronarnogo_shuntirovaniya_mksh_istoriya_razrabotki_i_vnedreniya_v_kliniku/
        pometka: два источника
      - summary: <b>Первым в мире он шунтировал сердце во время начинающегося инфаркта — и все трое больных выжили.</b>
        det:
          - "В 1968 году у трёх больных, которых готовили к плановой операции, начался инфаркт. Колесов шунтировал их экстренно, на работающем сердце: двоих — ручным швом, третьего — советским сосудосшивающим аппаратом АСЦ-4. Все трое выжили."
          - "Сегодня это закон лечения инфаркта: чем раньше восстановлен кровоток, тем больше сердца спасено. Позже клиника Колесова шунтировала даже больного, которого только что вывели из клинической смерти."
        src: "Источник: Синельников М. Е., Чумаков А. В., доклад на XIX сессии НЦССХ им. А. Н. Бакулева, 2015; Вестник хирургии им. И. И. Грекова. 2015. С. 94."
        otryvok: «Первым двум пациентам выполнен шовный анастомоз ВГА-ПМЖВ, третьему больному анастомоз ВГА-ПМЖВ выполнен с помощью сосудосшивающего аппарата «АСЦ-4». Все пациенты выжили» («Вестник хирургии»). — «Первым в мире В.И. Колесов провел ПРМ при остром инфаркте миокарда» (сессия НЦССХ им. Бакулева).
        stranica: Седов В. М., Немков А. С. «Василий Иванович Колесов и его роль в развитии коронарной хирургии» // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1
        href: https://www.vestnik-grekova.ru/jour/article/download/21/22
        pometka: два источника
      - summary: <b>Американский журнал отдал статью Колесова на отзыв шефу его соперника — и всё равно напечатал.</b>
        det:
          - В ноябре 1966 года редактор американского «The Journal of Thoracic and Cardiovascular Surgery» отправил рукопись Колесова на рецензию Дональду Эффлеру — шефу Кливлендской клиники, где работал Рене Фавалоро.
          - Статья вышла в октябре 1967 года с оговоркой Эффлера, что он «по некоторым позициям» иного мнения; Колесов ответил ему там же. Историк Д. Джонс допускает, что Фавалоро знал о работе Колесова ещё до публикации. А сам Фавалоро, сделавший сотни операций с той же грудной артерией, ни разу не пришил её прямо к коронарной — начал лишь после 1968 года.
        src: "Источник: Алшибая М. Д. // Креативная кардиология. 2017. Т. 11, № 3. С. 205; Вестник хирургии им. И. И. Грекова. 2015. С. 93."
        otryvok: «рукопись статьи В.И. Колесова в ноябре 1966 г. была направлена редактором американского журнала Б. Блэйдсом на рецензию Д. Эффлеру, и, возможно, тот показал ее ученику».
        stranica: "Алшибая М. Д. «К юбилею операции коронарного шунтирования: ещё раз об этой истории…» // Креативная кардиология. 2017. Т. 11, № 3"
        href: http://heart-master.com/wp-content/uploads/2017/10/2017_03_202-211.pdf
        pometka: два источника
      - summary: <b>В блокаду голод едва не остановил ему сердце — а он в 1942-м собрал в осаждённом городе конференцию.</b>
        det:
          - Всю блокаду Колесов оперировал в Ленинграде — в больнице имени Ленина на Васильевском острове, потом старшим хирургом эвакогоспиталя; операции шли круглые сутки.
          - Зимой 1942 года у истощённого хирурга от голода развился тяжёлый гидроперикард — вода в сердечной сумке; его с трудом выходили к весне. Он потерял от голода брата, племянницу и племянника; тело брата сам отвёз к грузовику, шедшему на Пискарёвское кладбище.
          - "И в том же 1942-м собрал в блокадном городе научную конференцию: показал двух раненых, спасённых сосудистым швом, и доложил о лечении ран бактериофагом."
        src: "Источник: Вестник хирургии им. И. И. Грекова. 2015. С. 91."
        otryvok: «Зимой 1942 г. ослабевшего хирурга В. И. Колесова с трудом спасли от смерти в госпитале…» — «В 1942 г. в блокадном Ленинграде на научной конференции, инициатором которой был В. И. Колесов, состоялась демонстрация успешного лечения двух раненых».
        stranica: Седов В. М., Немков А. С. «Василий Иванович Колесов и его роль в развитии коронарной хирургии» // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1
        href: https://www.vestnik-grekova.ru/jour/article/download/21/22
        pometka: документ
      - summary: "<b>Эту операцию русские придумали дважды: Демихов в 1953-м — на собаке, Колесов в 1964-м — на человеке.</b>"
        find: true
        det:
          - "1 ноября 1953 года московский биолог Владимир Демихов соединил собаке по кличке Дога внутреннюю грудную артерию с сердечной, а родную артерию сердца перевязал. Шов он не накладывал: вставлял в сосуды тонкую стеклянную канюлю-тройник и затягивал нитками — так быстро, что сердце не успевало сбиться."
          - Дога прожила с новым руслом крови семь лет. Уже в 1955 году президент АМН Бакулев назвал опыт с трибуны съезда хирургов, но в клинику его тогда не пустили. Колесов знал эту работу и ссылался на неё в своих книгах; в 1964 году он сделал то же самое человеку — но уже ручным швом.
        src: "Источник: Глянцев С. П. // Хирургия им. Н. И. Пирогова. 2016. № 8; Алшибая М. Д. // Креативная кардиология. 2017. С. 204–205; Глянцев С. П. // Трансплантология. 2015. № 3; Вестник хирургии им. И. И. Грекова. 2015. С. 91."
        otryvok: «1953 г., 1 ноября - наложил маммарно-коронарный анастомоз собаке Доге, предварительно перевязав у нее ПМЖВ (…); с этим анастомозом и перевязанной ПМЖВ собака жила 7 лет».
        stranica: Глянцев С. П. «Трудно быть гением… (к 100-летию В. П. Демихова)» // Хирургия им. Н. И. Пирогова. 2016. № 8
        href: https://www.mediasphera.ru/issues/khirurgiya-zhurnal-im-n-i-pirogova/2016/8/1002312072016081094
        pometka: два источника
      - summary: <b>Мемуары Колесова вышли через 9 лет после его смерти, а его операцию делают почти везде в мире.</b>
        det:
          - "Свой путь в коронарную хирургию Колесов сам считал «не оценённым по достоинству современниками». Мемуары «Записки старого хирурга» при жизни не вышли: Колесов умер в 1992 году, а книгу издали его ученики в 2001-м."
          - Сегодня, по словам авторов статьи к его 110-летию, «едва ли найдётся клиника в мире», где не применяют его операцию.
        src: "Источник: Вестник хирургии им. И. И. Грекова. 2015. С. 93, 95."
        otryvok: «Через 9 лет после его смерти книгу издали бывшие сотрудники В. И. Колесова» — «В настоящее время едва ли найдется клиника в мире, где не используется операция В. И. Колесова».
        stranica: Седов В. М., Немков А. С. «Василий Иванович Колесов и его роль в развитии коронарной хирургии» // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1
        href: https://www.vestnik-grekova.ru/jour/article/download/21/22
        pometka: документ
      - summary: <b>Мальчишкой будущий хирург сердца пел в церковном хоре и подрабатывал писарем.</b>
        det:
          - Василий Колесов родился 24 сентября 1904 года в вологодской деревне Мартьяновская, в крестьянской семье, где было шестеро детей.
          - Выучившись грамоте и чистописанию, он подрабатывал писарем при церкви в селе Кубенское и пел в церковном хоре.
        src: "Источник: Седов В. М., Немков А. С. // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1. С. 90."
        otryvok: «В детстве, освоив грамоту и чистописание, он подрабатывал в одной из церквей с. Кубенское писарем и пел в церковном хоре».
        stranica: Седов В. М., Немков А. С. «Василий Иванович Колесов и его роль в развитии коронарной хирургии» // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1
        href: https://www.vestnik-grekova.ru/jour/article/download/21/22
        pometka: документ
      - summary: <b>Свою первую операцию молодой врач сделал вместо хирурга — и спас ребёнка.</b>
        det:
          - В 1931 году Колесова отправили в Чусовую, в Пермский край, заведовать инфекционным отделением в разгар сыпного тифа. Тиф, дифтерия и скарлатина лежали вместе, водопровод и канализация не работали.
          - Когда у двух детей с дифтерией после трахеотомии случились смертельные осложнения, хирург предложил третью операцию сделать Колесову. Она прошла успешно. Анатомию он потом отрабатывал с патологоанатомом в маленькой часовне.
          - В Чусовой он встретил и жену — акушера Эттель Исаевну Керштейн.
        src: "Источник: Седов В. М., Немков А. С. // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1. С. 90–91."
        otryvok: «Тогда хирург, не понимая причины осложнений, предложил В. И. Колесову выполнить такую же операцию у третьего пациента. Операция закончилась успешно».
        stranica: Седов В. М., Немков А. С. «Василий Иванович Колесов и его роль в развитии коронарной хирургии» // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1
        href: https://www.vestnik-grekova.ru/jour/article/download/21/22
        pometka: документ
      - summary: <b>Сотни медленных «обходных» операций подтолкнули Колесова пришить артерию прямо к сердцу.</b>
        det:
          - К 1966 году клиника сделала 310 операций Фиески, а с 1962-го — 21 операцию Вайнберга. Это «непрямые» способы подвести к сердцу больше крови.
          - "Их эффект наступал медленно — и именно это подтолкнуло Колесова к прямому шунту: пришить артерию к сердцу сразу."
        src: "Источник: Седов В. М., Немков А. С. // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1."
        otryvok: «популярная в 1950-е годы операция Фиески к 1966 г. была выполнена 310 больным» — «Однако медленно развивающийся эффект реваскуляризации после этой операции не удовлетворял хирургов».
        stranica: Седов В. М., Немков А. С. «Василий Иванович Колесов и его роль в развитии коронарной хирургии» // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1
        href: https://www.vestnik-grekova.ru/jour/article/download/21/22
        pometka: документ
      - summary: <b>22 марта 1967 года Колесов пришил артерию к сердцу не рукой, а сшивающим аппаратом.</b>
        det:
          - Шов вместо рук хирурга наложил советский сосудосшивающий аппарат АСЦ-4.
          - Тем же аппаратом через год Колесов шил шунт одному из трёх больных, у которых начался инфаркт.
        src: "Источник: Седов В. М., Немков А. С. // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1."
        otryvok: «22.03.1967 г. Первый механический МКА-ПМЖВ АСЦ-4» (таблица операций клиники В. И. Колесова).
        stranica: Седов В. М., Немков А. С. «Василий Иванович Колесов и его роль в развитии коронарной хирургии» // Вестник хирургии им. И. И. Грекова. 2015. Т. 174, № 1
        href: https://www.vestnik-grekova.ru/jour/article/download/21/22
        pometka: документ
  - id: fakty-dnya
    nav: Ещё факты
    kicker: Ещё пять фактов
    h2: Запрет, рекорд и шов на шлангах
    udary:
      - summary: <b>Через два года после первого шунта всесоюзный конгресс кардиологов решил эту операцию запретить.</b>
        det:
          - Первое шунтирование Колесов сделал в 1964 году, а уже в 1966-м всесоюзный конгресс кардиологов решил запретить операцию как вредную.
          - Гонения на хирурга продолжались, пока его методом не заинтересовалась мировая медицина. Сегодня шунтирование — самая частая операция на сердце в мире.
        src: 'Источник: «Аорто-коронарное шунтирование, или операция президентов», энциклопедия Медпортал — <a href="https://medportal.ru/enc/cardiology/ibs/5/" rel="noopener">medportal.ru</a>; ПСПбГМУ им. И. П. Павлова: «МИР 24 — 60 лет назад было проведено первое маммарокоронарное шунтирование», 29.02.2024.'
        otryvok: «Произошло это в 1964-ом году, а уже в 1966-ом всесоюзный конгресс кардиологов принял решение запретить вредоносную операцию. Гонения на Колесова продолжались до тех пор, пока революционным методом лечения ИБС не заинтересовалась мировая медицинская наука» (Медпортал).
        stranica: «Аорто-коронарное шунтирование, или операция президентов», энциклопедия Медпортал
        href: https://medportal.ru/enc/cardiology/ibs/5/
        pometka: два источника
      - summary: <b>Три года клиника Колесова была единственным местом в мире, где умели шунтировать сердце.</b>
        det:
          - С 25 февраля 1964 года по 9 мая 1967 года хирургическое отделение Колесова в Ленинграде оставалось единственным в мире, где успешно делали коронарное шунтирование.
          - "До операции на человеке Колесов ставил опыты на собаках: чтобы уложиться в жёсткий лимит времени, он сам усовершенствовал сосудосшивающий аппарат."
        src: "Источник: Фонд сохранения наследия академика Ф. Г. Углова: «25 февраля 1964 года в Ленинграде кардиохирург Василий Колесов провёл первое в мире успешное коронарное шунтирование…»."
        otryvok: «В период с 25 февраля 1964 года по 9 мая 1967 года хирургическое отделение, возглавляемое Василием Ивановичем Колесовым, оставалось единственным местом в мире, где успешно выполнялись операции коронарного шунтирования».
        stranica: "Фонд сохранения наследия академика Ф. Г. Углова: «25 февраля 1964 года в Ленинграде кардиохирург Василий Колесов провёл первое в мире успешное коронарное шунтирование…»"
        href: http://uglov-fund.ru/media-tsentr/kalendar-novostey/25-fevralya-1964-goda-v-leningrade-kardiokhirurg-vasiliy-kolesov-provyel-pervoe-v-mire-uspeshnoe-kor/
        pometka: документ
      - summary: <b>Первым в мире Колесов шунтировал сердце через маленький разрез сбоку груди.</b>
        det:
          - Обычно для операции на сердце грудь вскрывают широко. Колесов первым в мире сделал шунтирование через миниторакотомию — небольшой разрез сбоку грудной клетки.
          - "Сегодня хирургия сердца идёт именно туда: разрез меньше, без аппарата искусственного кровообращения, на работающем сердце."
        src: "Источник: Синельников М. Е., Чумаков А. В. «Операция маммарно-коронарного шунтирования: история разработки и внедрения в клинику», XIX сессия НЦССХ им. А. Н. Бакулева, 2015 (racvs.ru)."
        otryvok: «Первым в мире В.И. Колесов провел ПРМ при остром инфаркте миокарда и нестабильной стенокардии, выполнил МКШ на работающем сердце и через миниторакотомию».
        stranica: "Синельников М. Е., Чумаков А. В. «Операция маммарно-коронарного шунтирования: история разработки и внедрения в клинику», XIX сессия НЦССХ им. А. Н. Бакулева, 2015 (racvs.ru)"
        href: https://racvs.ru/events/archive/xix_ezhegodnaya_sessiya_nauchnogo_tsentra_serdechnososudistoy_khirurgii_im_an_bakuleva_s_vserossiysk/operatsiya_mammarnokoronarnogo_shuntirovaniya_mksh_istoriya_razrabotki_i_vnedreniya_v_kliniku/
        pometka: документ
      - summary: <b>Сегодня в 9 из 10 шунтирований хирурги берут ту же грудную артерию, что Колесов в 1964-м.</b>
        det:
          - "Шунтирование стало самой частой операцией на сердце в мире. И более чем в 90% случаев хирурги используют внутреннюю грудную артерию — как Колесов: она почти не поражается атеросклерозом."
          - В университете, где Колесов сделал первую операцию, такие операции теперь идут планово, по несколько в день.
        src: "Источник: ПСПбГМУ им. И. П. Павлова: «МИР 24 — 60 лет назад было проведено первое маммарокоронарное шунтирование», 29.02.2024."
        otryvok: «И сегодня операция аортокоронарного шунтирования является самой популярной, самой часто выполняемой операцией в мире. И маммарокоронарный анастомоз более чем в 90% случаев кардиохирургами используется во время этих операций».
        stranica: "ПСПбГМУ им. И. П. Павлова: «МИР 24 — 60 лет назад было проведено первое маммарокоронарное шунтирование», 29.02.2024"
        href: https://www.1spbgmu.ru/universitet/media/smi-o-nas/8374-29-2-2024-mir
        pometka: документ
      - summary: <b>Молодые кардиохирурги учатся шить «по Колесову» на шлангах — с первого года ординатуры.</b>
        det:
          - "Там, где 60 лет назад стоял операционный стол Колесова, теперь ординаторская: врачи заполняют истории болезней."
          - А соединение «по Колесову» будущие кардиохирурги университета отрабатывают с первого года ординатуры — сначала на шлангах, потом на работающем сердце.
        src: "Источник: ПСПбГМУ им. И. П. Павлова: «МИР 24 — 60 лет назад было проведено первое маммарокоронарное шунтирование», 29.02.2024."
        otryvok: «А 60 лет назад здесь стоял хирургический стол, за которым Василий Колесов провел первое маммарокоронарное шунтирование на работающем сердце» — «Делать анастомозы «по Колесову» врачи тренируются с первого года клинической ординатуры на шлангах».
        stranica: "ПСПбГМУ им. И. П. Павлова: «МИР 24 — 60 лет назад было проведено первое маммарокоронарное шунтирование», 29.02.2024"
        href: https://www.1spbgmu.ru/universitet/media/smi-o-nas/8374-29-2-2024-mir
        pometka: документ
razdely:
  - posle: pervenstvo
    html: |-
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2 style="margin-bottom:10px">Для тех, кто смотрит внимательно</h2>
          <details class="deepd">
            <summary>Четыре сюжета подробно — развернуть</summary>
            <h3>Артерию взяли у самого больного</h3>
            <p>Обходной путь Колесов сделал не из чужого сосуда и не из вены, а из внутренней грудной артерии того же человека: она идёт рядом с сердцем, и её можно отвести, не отрезая от кровотока. Фавалоро в Кливленде в 1967 году шунтировал веной. Разница не только в трёх годах: Колесов первым в мире пришил к сердцу собственную артерию больного — швом, руками.</p>
            <h3>Демихов и Колесов — два разных способа</h3>
            <p>Демихов в 1953 году соединял сосуды собаки стеклянной канюлей, без шва. Колесов в 1964-м шил сосуды человека нитью. Колесов знал работу Демихова и ссылался на неё в своих монографиях, но путь у него свой. Поэтому точнее так: сначала на собаке — Демихов, потом на человеке — Колесов.</p>
            <h3>Кто такой Эффлер и почему важна его рецензия</h3>
            <p>В ноябре 1966 года американский «The Journal of Thoracic and Cardiovascular Surgery» отправил рукопись Колесова Дональду Эффлеру — шефу Кливлендской клиники, где работал Рене Фавалоро. Статья вышла в октябре 1967 года с его оговоркой, что «по некоторым позициям» он иного мнения. Колесов ответил там же. Русская работа ушла в печать через руки главного соперника — и вышла.</p>
            <h3>Мальчик из церковного хора</h3>
            <p>Колесов родился 24 сентября 1904 года в вологодской деревне Мартьяновская, в крестьянской семье, где было шестеро детей. Мальчишкой, выучившись грамоте и чистописанию, подрабатывал писарем при церкви в селе Кубенское и пел в церковном хоре. Твёрдая рука чистописания пригодилась потом там, где ошибка в миллиметр стоит жизни.</p>
          </details>
          <div class="src">Источники: vestnik-grekova.ru · heart-master.com · racvs.ru · mediasphera.ru · 1spbgmu.ru</div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="mirovoy-kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2 style="margin-bottom:6px">Что в это время делал мир</h2>
          <p style="max-width:66ch">Тысяча девятьсот шестьдесят четвёртый. В феврале, в те же дни, что и операция в Ленинграде, Америка смотрит по телевизору на «Битлз». Осенью Токио принимает первую в Азии Олимпиаду, а Япония запускает скоростной поезд «Синкансэн». В октябре над планетой летит «Восход» — первый в мире многоместный космический корабль.</p>
          <p style="max-width:66ch">Мир разгоняется — а лечить больное сердце медицина почти не умеет. Хирурги обходят его стороной: пытаются подкормить кровью непрямыми операциями и ждут, сработает ли. В Ленинграде профессор Колесов, сделавший таких операций больше трёхсот, решает идти напрямую — к самой артерии бьющегося сердца.</p>
          <p style="max-width:66ch">Отсюда вывод, ради которого этот день стоит в календаре: <b style="color:var(--gold-l)">первым бывает тот, кто решился сделать руками то, что другие считали слишком опасным.</b> Сегодня, по словам историков хирургии, едва ли найдётся клиника в мире, где не применяют его операцию.</p>
        </div>
      </section>
