quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — 25 февраля 1964 года, Ленинград; 2 — собственная внутренняя грудная артерия; 3 — нет, сердце билось; 4 — Дональду Эффлеру из Кливленда; 5 — шунтировал при начинающемся инфаркте, и все трое выжили."
  ball: 10
  voprosy:
    - q: Когда и где прошла первая в мире шовная операция коронарного шунтирования?
      o:
        - 1953 год, Москва
        - 25 февраля 1964 года, Ленинград
        - 1967 год, Кливленд
      a: 1
      e: Ленинград, 25 февраля 1964 года. В 1953-м в Москве Демихов делал опыт на собаке без шва, в 1967-м в Кливленде Фавалоро шунтировал веной.
    - q: Чем Колесов обошёл суженную артерию сердца?
      o:
        - Веной с ноги больного
        - Металлической трубкой
        - Собственной внутренней грудной артерией больного
      a: 2
      e: Внутренней грудной артерией — сосудом, который идёт вдоль грудины. Фавалоро через три года взял вену.
    - q: Останавливал ли Колесов сердце и подключал ли аппарат искусственного кровообращения?
      o:
        - Нет, шил на бьющемся сердце
        - Да, сердце остановили
        - Да, но только на час
      a: 0
      e: "Сердце билось, аппарата не было: тяжелобольному, считал Колесов, он только вредит. Шов — вручную, под лупой."
    - q: Кому американский журнал отправил статью Колесова на рецензию?
      o:
        - Самому Фавалоро
        - Дональду Эффлеру, шефу Кливлендской клиники
        - Демихову
      a: 1
      e: Эффлеру — шефу клиники, где работал Фавалоро. Статья всё равно вышла в 1967 году, а Колесов ответил на комментарий там же.
    - q: Что Колесов сделал в 1968 году первым в мире?
      o:
        - Пересадил сердце
        - Шунтировал сердце при начинающемся инфаркте
        - Построил сшивающий аппарат
      a: 1
      e: У трёх больных начался инфаркт — Колесов шунтировал их экстренно, на работающем сердце. Все трое выжили.
