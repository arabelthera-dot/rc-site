        podpis: Брошюра Колесова о хирургическом лечении коронарной болезни сердца вышла в 1965 году — через год после того, как он сделал первое в мире коронарное шунтирование.
        credit: "Колесов В. И. «Современные проблемы хирургического лечения коронарной болезни сердца». М.: Медицина, 1965. Хранится: Вологодский государственный историко-архитектурный и художественный музей-заповедник. Госкаталог музейного фонда РФ, рег. № 63495853."
