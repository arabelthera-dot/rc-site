      <section class="block" id="fork" style="background:rgba(45,140,191,.04)">
        <div class="wrap">
          <div class="kicker">Твой выбор</div>
          <h2>А как поступил бы ты?</h2>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">Ленинград, 1964 год. Перед тобой больной 44 лет: инфаркт восемь лет назад, боли в сердце не отпускают. Непрямые операции помогают медленно. Можно пришить артерию прямо к сердцу — но для этого его либо останавливают и подключают аппарат искусственного кровообращения, либо шьют на бьющемся. Ты на месте Колесова — что выбираешь?</p>
          <div class="fork-opt">🫀 Оперирую на работающем сердце, без аппарата</div>
          <div class="fork-opt">⚙️ Подключаю аппарат искусственного кровообращения и останавливаю сердце</div>
          <div class="fork-opt">⏳ Жду, пока появится способ надёжнее, — и делаю ещё одну непрямую операцию</div>
          <div id="forkReal" style="display:none;margin-top:14px" class="exp"><b>Как было на самом деле.</b> Колесов шил на работающем сердце: тяжелобольному, считал он, аппарат искусственного кровообращения только вредит. Восемь минут пережатия под контролем ЭКГ, шов под лупой — и больной избавился от болей. Через полвека отказ от аппарата и операция на работающем сердце названы главным направлением коронарной хирургии.</div>
        </div>
      </section>
