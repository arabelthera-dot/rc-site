quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — из титана; 2 — 44,7 узла (83 км/ч); 3 — дверь рубки, лючки и антенну; 4 — титан стоил как чёрная икра; 5 — взлетала из-под воды."
  ball: 10
  voprosy:
    - q: Из какого металла был корпус «Анчара»?
      o:
        - Из стали
        - Из титана
        - Из алюминия
      a: 1
      e: "Из титана: «Анчар» — первая в мире подлодка с титановым корпусом. В приёмном акте металл секретно называли «сплав № 3»."
    - q: Какую скорость под водой показал «Анчар» 18 декабря 1970 года?
      o:
        - 30 узлов (56 км/ч)
        - 35 узлов (65 км/ч)
        - 44,7 узла (83 км/ч)
      a: 2
      e: 44,7 узла — около 83 км/ч. Быстрее под водой не ходила ни одна подводная лодка в мире.
    - q: Что сорвал напор воды с «Анчара» на рекордном ходу?
      o:
        - Дверь в ограждении рубки, лючки и радиоантенну
        - Перископ и гребной винт
        - Ничего — титан выдержал всё
      a: 0
      e: "Участник испытаний В. Зайцев: «Напором воды вырвало дверь в ограждении рубки, один лючок на верхней палубе, два лючка в носовой части. Оторвало и радиоантенну»."
    - q: Почему «Анчар» прозвали «Золотой рыбкой»?
      o:
        - Его покрасили в золотой цвет
        - Килограмм титана стоил как килограмм чёрной икры
        - За рекорд дали золотую медаль
      a: 1
      e: Килограмм листового титана стоил 18 рублей — столько же, сколько килограмм чёрной икры.
    - q: Чем была особенна ракета «Аметист», созданная для «Анчара»?
      o:
        - Взлетала из-под воды — лодке не нужно было всплывать
        - Летала в космос
        - Запускалась только с берега
      a: 0
      e: "«Аметист» вылетал из затопленного контейнера с глубины 30 метров: лодке больше не нужно было всплывать перед пуском и выдавать себя."
