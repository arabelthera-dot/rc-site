razdely:
  - posle: fakty
    html: |-
      <section class="block" id="pyat-faktov">
        <div class="wrap">
          <div class="kicker">Пять фактов об «Анчаре»</div>
          <h2>Ещё пять фактов</h2>
          <ol class="udary">
            <li><details><summary><span><b>Первая из титана.</b> «Анчар» стал первой в мире подлодкой из титана — и почти 60 лет спустя такие лодки есть только у России.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Титан почти вдвое легче стали и не притягивает магнит; работы шли так секретно, что даже в приёмном акте металл назывался «сплав № 3». «Севмаш» построил из него первую в мире атомную подлодку с титановым корпусом — флоту её передали 31 декабря 1969 года.</p>
                <p>«Подводной лодки с корпусом из титана &lt;…&gt; нет ни у кого в мире уже почти 60 лет, а у нас есть…», — сказал в марте 2026 года президент Курчатовского института Михаил Ковальчук.</p>
                <p class="src-note">Источник: «Наука и жизнь», 2006, № 12, В. Зайцев, «„Золотая рыбка“ из титана» — nkj.ru/archive/articles/8335/; РИА Новости, «Жажда скорости», 18.12.2020 — ria.ru/20201218/podlodka-1589747230.html; «Известия», 20.03.2026 — iz.ru/2063321/2026-03-20/kovalchuk-otmetil-unikalnost-rossiiskikh-podvodnykh-lodok</p>
              </div></details></li>
            <li><details><summary><span><b>Авианосец не ушёл.</b> Авианосец «Саратога» выжал полные 56 км/ч — и не смог оторваться от «Анчара», умевшего 83 под водой.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Первый боевой поход, осень 1971 года: К-162 вела «Саратогу», и «даже на самой высокой своей скорости в 30 узлов он не смог оторваться» — от Гренландского моря до Бразильской впадины.</p>
                <p>Рекорд лодки — 44,7 узла (18 декабря 1970 года). Пересчёт: 30 узлов = 56 км/ч, 44,7 узла = 83 км/ч.</p>
                <p class="src-note">Источник: Российское историческое общество, «Самая быстрая в мире „Золотая рыбка“» — history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka; «Российская газета», 18.12.2019 — rg.ru/2019/12/18/reg-szfo/kak-zolotaia-rybka-avianosec-ssha-po-okeanu-goniala.html</p>
              </div></details></li>
            <li><details><summary><span><b>Вода рвала лодку.</b> «Анчар» шёл так быстро, что вода вырвала дверь его рубки, три люка и антенну.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>«Напором воды вырвало дверь в ограждении рубки, один лючок на верхней палубе, два лючка в носовой части. Оторвало и радиоантенну».</p>
                <p class="src-note">Источник: «Наука и жизнь», 2006, № 12, В. Зайцев, «„Золотая рыбка“ из титана» — nkj.ru/archive/articles/8335/</p>
              </div></details></li>
            <li><details><summary><span><b>Ракета из-под воды.</b> Для «Анчара» наши создали первую в мире крылатую ракету, которая взлетает из-под 30 метров воды — всплывать уже не надо.<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>Прежним лодкам с крылатыми ракетами перед пуском приходилось всплывать и выдавать себя. «Аметист» бюро Челомея вылетал из затопленного контейнера с глубины 30 метров; на «Анчаре» таких контейнеров было десять.</p>
                <p>Ракету задумали под «Анчар», но титановую лодку строили так долго, что первыми с «Аметистом» в строй вошли стальные «Скаты» (головной — в 1967-м); на вооружение ракету приняли в 1968 году.</p>
                <p class="src-note">Источник: МГТУ им. Н. Э. Баумана, кафедра СМ2 — sm2.bmstu.ru/o-kafedre/chelomey-vn; Российское историческое общество, «Самая быстрая в мире „Золотая рыбка“» — history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka; РИА Новости, «Жажда скорости», 18.12.2020 — ria.ru/20201218/podlodka-1589747230.html; «Российская газета», 06.07.2021 — rg.ru/2021/07/06/pamiat-o-samoj-skorostnoj-v-mire-apl-i-ee-sozdateliah-uvekovechat.html</p>
              </div></details></li>
            <li><details><summary><span><b>Золотая рыбка.</b> Титан для «Анчара» стоил как чёрная икра, килограмм в килограмм, — отсюда прозвище «Золотая рыбка».<span class="more-lbl"><span class="o">Узнать подробнее</span><span class="c">Свернуть</span></span></span></summary>
              <div class="det">
                <p>«Килограмм листового металла стоил 18 руб., столько же, сколько килограмм черной икры. Поэтому лодку… мы полушутя стали называть „золотой рыбкой“».</p>
                <p class="src-note">Источник: «Наука и жизнь», 2006, № 12, В. Зайцев, «„Золотая рыбка“ из титана» — nkj.ru/archive/articles/8335/; «Российская газета», 17.12.2013 — rg.ru/2013/12/17/anchar-site.html</p>
              </div></details></li>
          </ol>
        </div>
      </section>
