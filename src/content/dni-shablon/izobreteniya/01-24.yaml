story:
  kicker: История рекорда
  h2: 83 км/ч под водой
  abzacy:
    - <p>18 декабря 1970 года подводная лодка К-162 («Анчар») под водой разогналась до 44,7 узла — это 83 км/ч. Быстрее под водой не ходила ни одна подводная лодка в мире — ни до, ни после.</p>
    - "<p>Узел — морская мера скорости: одна морская миля (1852 м) в час.</p>"
    - <p>1 узел = 1,852 км/ч<br>30 узлов × 1,852 ≈ 56 км/ч — «Саратога»<br>44,7 узла × 1,852 ≈ 83 км/ч — «Анчар»</p>
    - "<p>Осень 1971 года, первый боевой поход: К-162 вела «Саратогу», и «даже на самой высокой своей скорости в 30 узлов он не смог оторваться».</p>"
    - '<p class="src-note">Источники: Российское историческое общество, «Самая быстрая в мире „Золотая рыбка“» — history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka; «Российская газета», 18.12.2019 — rg.ru/2019/12/18/reg-szfo/kak-zolotaia-rybka-avianosec-ssha-po-okeanu-goniala.html; «Наука и жизнь», 2006, № 12 — nkj.ru/archive/articles/8335/</p>'
fakty:
  id: fakty
  nav: Факты
  kicker: Факты дня · 10 на выбор, у каждого номер
  h2: Десять фактов об «Анчаре»
  udary:
    - summary: <b>Факт 1 из 10.</b> На рекордном ходу у экипажа «Анчара» была 21 секунда на ошибку рулём.
      det:
        - "Рекорд ставили на полигоне глубиной всего 200 метров: сверху лёд, снизу грунт. Лодка шла посередине, на 100 метрах."
        - Ошибись рули — и через 21 секунду нос врезался бы в лёд или в ил. Так шли 12 часов, а запас глубины был не больше длины самой лодки.
      src: 'Источник: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана — <a href="https://flot.com/history/branches/sub/plark_anchar.htm" rel="noopener" target="_blank">flot.com</a>.'
      otryvok: «Тем более что глубина нашего полигона не превышала 200 метров. Наверху - лед, внизу - грунт. Малейшая ошибка в управлении горизонтальными рулями или отказ авторулевого - и через 21 секунду нос атомохода врезается либо в лед, либо в ил». — «Мы же шли в таком режиме двенадцать часов! А ведь запас безопасности нашей глубины не превышал длины самой лодки».
      stranica: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана
      href: https://flot.com/history/branches/sub/plark_anchar.htm
      pometka: легенда
    - summary: <b>Факт 2 из 10.</b> Руль повернули на три градуса — и подлодка легла в вираж, как самолёт.
      det:
        - На первом повороте автоматика повернула руль всего на 3°. Палуба накренилась так, что люди едва устояли на ногах.
        - Чуть больше — и лодка могла сорваться в «подводный штопор».
      src: 'Источник: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана — <a href="https://flot.com/history/branches/sub/plark_anchar.htm" rel="noopener" target="_blank">flot.com</a>.'
      otryvok: «Авторулевой переложил вертикальный руль всего на три градуса, а палуба под ногами накренилась так, что мы чуть не посыпались на правый борт. … Это был не крен поворота, это был самый настоящий авиационный вираж, и если бы руль переложили чуть больше, К-162 могла бы сорваться в "подводный штопор"».
      stranica: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана
      href: https://flot.com/history/branches/sub/plark_anchar.htm
      pometka: легенда
    - summary: <b>Факт 3 из 10.</b> Вода содрала с «Анчара» краску до голого титана.
      det:
        - После рекордного хода лодка вернулась «скорее боевой, чем парадной». Поток воды ободрал краску, на корпусе остались вмятины.
        - Через несколько дней на полной мощности лодка показала 44,7 узла — 82,8 км/ч.
      src: 'Источник: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана — <a href="https://flot.com/history/branches/sub/plark_anchar.htm" rel="noopener" target="_blank">flot.com</a>.'
      otryvok: «Правда, вид у рекордсменки был скорее боевой, чем парадный. Потоки воды ободрали краску до голого титана».
      stranica: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана
      href: https://flot.com/history/branches/sub/plark_anchar.htm
      pometka: легенда
    - summary: <b>Факт 4 из 10.</b> Испытатели называли «Анчар» «подводным самолётом», а за цвет титана его прозвали «Серебряным китом».
      det:
        - Блестящий титановый корпус дал лодке прозвище «Серебряный кит». Испытатели, которые водили её на рекордных скоростях, звали её «подводным самолётом».
        - Даже главный в мире справочник военных кораблей — английский справочник Джейн — выделил лодку особым именем «Папа», по букве морского семафора.
      src: 'Источник: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана — <a href="https://flot.com/history/branches/sub/plark_anchar.htm" rel="noopener" target="_blank">flot.com</a>.'
      otryvok: «Американцы называли ее "Серебряный кит", английский справочник Джейн присвоил необычной лодке необычное наименование - "Папа", по одной из букв морского международного семафора. Испытатели называли ее подводным самолетом. С "Серебряным китом" все понятно - это за цвет титана».
      stranica: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана
      href: https://flot.com/history/branches/sub/plark_anchar.htm
      pometka: легенда
    - summary: <b>Факт 5 из 10.</b> Ради одной лодки страна создала целую новую отрасль — титановую металлургию.
      det:
        - Лодка ещё была эскизом, а для неё уже налаживали технологию титановых сплавов, какой в мире не было.
        - "Проект вёл ленинградский ЦКБ-16 (сейчас «Малахит»), главный конструктор — академик Н. Н. Исанин. Академик И. В. Горынин, чей институт «Прометей» дал лодке титан, вспоминал: проблему судостроительных титановых сплавов решили работой «в масштабах всей страны»."
      src: 'Источник: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана — <a href="https://flot.com/history/branches/sub/plark_anchar.htm" rel="noopener" target="_blank">flot.com</a>; К. Чуприн, Е. Шембель, «Титан из „Прометея“: к 100-летию академика Игоря Горынина», «Страна Росатом», 23.03.2026 — <a href="https://strana-rosatom.ru/2026/03/23/titan-iz-prometeya-ispolnilos-100-let/" rel="noopener" target="_blank">strana-rosatom.ru</a>.'
      otryvok: "«К-162 была еще на стадии эскизного проектирования, - продолжает свой рассказ контр-адмирал Николай Мормуль, - а для нее уже создавалась принципиально новая отрасль металлургической промышленности: технология титановых сплавов, невиданная доселе в мире»."
      stranica: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана
      href: https://flot.com/history/branches/sub/plark_anchar.htm
      pometka: два источника
    - summary: <b>Факт 6 из 10.</b> По городам ещё ездили на лошадях, а страна закладывала первую в мире титановую атомную лодку.
      det:
        - Лодку решили проектировать в 1959 году. Тогда ещё не везде разобрали руины войны, а в крупных городах ходили гужевые повозки.
        - «Российская газета» сравнивала ввод К-162 в строй с полётом первого человека в космос.
      src: 'Источник: «„Золотая рыбка“ и золотые рекорды, о которых мало кто знал», «Российская газета», 17.12.2013 — <a href="https://rg.ru/2013/12/17/anchar-site.html" rel="noopener" target="_blank">rg.ru</a>.'
      otryvok: «В западноевропейской части страны были убраны еще не все руины прошедшей войны, даже в крупных городах гужевой транспорт был делом обычным, а на стапелях закладывалась титановая атомная подводная лодка - первая титановая в мире». — «Введение в строй К-162, без преувеличения, можно сравнить с запуском первого человека в Космос».
      stranica: «„Золотая рыбка“ и золотые рекорды, о которых мало кто знал», «Российская газета», 17.12.2013
      href: https://rg.ru/2013/12/17/anchar-site.html
      pometka: документ
    - summary: <b>Факт 7 из 10.</b> За «Анчаром» пошла чужая подлодка — и он сам зашёл ей в хвост.
      det:
        - На учениях в Баренцевом море экипаж заметил, что лодку преследует чужая субмарина.
        - На скорости К-162 вышла ей в хвост и держала на прицеле, пока чужая лодка не ушла в нейтральные воды.
      src: 'Источник: «„Золотая рыбка“ и золотые рекорды, о которых мало кто знал», «Российская газета», 17.12.2013 — <a href="https://rg.ru/2013/12/17/anchar-site.html" rel="noopener" target="_blank">rg.ru</a>.'
      otryvok: «Экипаж лодки зафиксировал, что ее преследует чужая субмарина. Благодаря высокой скорости и маневренным характеристикам, К-162 сама вышла в хвост вражеской подлодки и держала ее под прицелом, пока та не скрылась в нейтральных водах».
      stranica: «„Золотая рыбка“ и золотые рекорды, о которых мало кто знал», «Российская газета», 17.12.2013
      href: https://rg.ru/2013/12/17/anchar-site.html
      pometka: легенда
    - summary: <b>Факт 8 из 10.</b> Всплыть рекордсмену помогал двигатель от реактивного истребителя.
      det:
        - Сжатый воздух берегли, поэтому балластные цистерны при всплытии продували только частично.
        - Остальное доделывал двигатель от истребителя, который запускали при открытом люке рубки. Об этом рассказал контр-адмирал Валерий Филатов, командир «Анчара» в 1985–1987 годах.
      src: 'Источник: «„Жажда скорости“: почему ВМФ отказался от подлодки ценой в два миллиарда», РИА Новости, 18.12.2020 — <a href="https://ria.ru/20201218/podlodka-1589747230.html" rel="noopener" target="_blank">ria.ru</a>.'
      otryvok: «К примеру, для экономии сжатого воздуха цистерны главного балласта при всплытии продували лишь частично, а дальше запускали двигатель от истребителя, который при открытом рубочном люке доводил дело до конца", — рассказал контр-адмирал Валерий Филатов, который командовал "Анчаром" с 1985-го по 1987-й».
      stranica: "«„Жажда скорости“: почему ВМФ отказался от подлодки ценой в два миллиарда», РИА Новости, 18.12.2020"
      href: https://ria.ru/20201218/podlodka-1589747230.html
      pometka: легенда
    - summary: <b>Факт 9 из 10.</b> От «Анчара» не ушёл бы даже новейший американский авианосец.
      det:
        - «Анчар» мог часами идти под водой на 37–38 узлах — это около 70 км/ч.
        - Наибольшая скорость новейшего американского авианосца типа «Джеральд Р. Форд» — 31 узел, около 57 км/ч. Авианосного соединения, которое оторвалось бы от такого охотника, в мире нет и сегодня.
      src: 'Источник: К. Чуприн, Е. Шембель, «Титан из „Прометея“: к 100-летию академика Игоря Горынина», «Страна Росатом», 23.03.2026 — <a href="https://strana-rosatom.ru/2026/03/23/titan-iz-prometeya-ispolnilos-100-let/" rel="noopener" target="_blank">strana-rosatom.ru</a>.'
      otryvok: "«…могла поддерживать режим длительного хода на уровне 37–38 узлов. В мире не было (да и сейчас нет) авианосного соединения, которое оторвалось бы от такого охотника. Для сравнения: максимальная скорость новейшего американского авианосца типа «Джеральд Р. Форд» — 31 узел»."
      stranica: "К. Чуприн, Е. Шембель, «Титан из „Прометея“: к 100-летию академика Игоря Горынина», «Страна Росатом», 23.03.2026"
      href: https://strana-rosatom.ru/2026/03/23/titan-iz-prometeya-ispolnilos-100-let/
      pometka: документ
    - summary: <b>Факт 10 из 10.</b> Подводники назвали свой рекорд «Голубой лентой» — так звался приз, за который полтора века бились лайнеры.
      det:
        - С 1840 года самым быстрым судам через Атлантику вручали «Голубую ленту», а потом серебряный кубок — с почестями, как олимпийским чемпионам.
        - "Кубка «Анчару» никто не вручал: экипаж К-162 сам назвал свой рекорд «Голубой лентой» Атлантики для подводных лодок."
      src: 'Источник: Н. Черкашин, «Советская подводная лодка — обладательница „Голубой ленты“ Посейдона», FLOT (flot.com), дата не указана — <a href="https://flot.com/history/branches/sub/plark_anchar.htm" rel="noopener" target="_blank">flot.com</a>.'
