return:
  q: С какой скоростью «Анчар» шёл под водой в рекордном 1970 году?
  a: 44,7 узла — около 83 км/ч.
  src: РИА Новости, «Жажда скорости», 18.12.2020
audioguide:
  audioSrc: /muzei/izobreteniya/audio-guide-k162-v2-ru.mp3
  durationLabel: около двух минут
  lead: "Голос ведёт по залу первой в мире подлодки из титана: от воды, вырвавшей дверь рубки, через рекорд подо льдом и погоню за авианосцем к «золотой рыбке», которая так и осталась единственной."
  stops:
    - t: 0
      mark: '0:00'
      title: Вода рвала лодку
    - t: 29
      mark: '0:29'
      title: Двадцать одна секунда
    - t: 56
      mark: '0:56'
      title: Ночь на полном ходу
    - t: 82
      mark: '1:22'
      title: Ракета из-под воды
    - t: 110
      mark: '1:50'
      title: Золотая рыбка
  transcript:
    - Здравствуйте. Мы в зале первой в мире подлодки из титана ка-сто шестьдесят два, «Анчара». Титан почти вдвое легче стали и не притягивает магнит, а работы шли так секретно, что в приёмном акте металл назывался «сплав номер три». «Севмаш» передал лодку флоту тридцать первого декабря тысяча девятьсот шестьдесят девятого года. «Анчар» шёл так быстро, что вода вырвала дверь его рубки, три люка и антенну. Почти шестьдесят лет такая лодка есть только у России.
    - "Рекорд скорости ставили на мелком полигоне глубиной всего двести метров. Сверху лёд, снизу дно, а лодка шла посередине, на ста метрах. Ошибись рули, и через двадцать одну секунду нос врезался бы в лёд или в ил. Так шли двенадцать часов: начальство торопилось сделать подарок ко дню рождения Брежнева. Руль повернули всего на три градуса, и лодка легла в вираж, как самолёт. Тогда рули доверили боцману."
    - "Однажды экипаж заказал буксиры к утру и всю ночь шёл под водой на сорока двух узлах, почти семьдесят восемь километров в час. Утром всплыли, а встречать некому: дежурный базы прикинул обычную скорость подлодок и решил, что моряки «блефуют». В другой раз, тридцатого марта тысяча девятьсот семьдесят первого года, лодка успела показать сорок четыре и восемьдесят пять сотых узла, но командование сочло это недоказанным, и в документах осталось сорок четыре и семь десятых."
    - Для «Анчара» создали первую в мире крылатую ракету, которая взлетает из-под тридцати метров воды. Прежним лодкам перед пуском приходилось всплывать и выдавать себя. «Аметист» бюро Челомея вылетал из затопленного контейнера, и таких контейнеров на лодке было десять. Осенью тысяча девятьсот семьдесят первого года «Анчар» сел на хвост американскому авианосцу. Тот выжимал предельные тридцать узлов, но оторваться не смог, а лодка ещё и обогнала его.
    - Титан для лодки стоил восемнадцать рублей за килограмм, столько же, сколько чёрная икра, и лодку полушутя прозвали «золотой рыбкой». Правительство выделило двести сорок миллионов рублей, а строители уложились в двести двадцать, и выходило, что каждый житель страны вложил в лодку по рублю. Флот ждал десять таких лодок, но достроили всего одну, и «Анчар» так и остался единственным.
  note: Озвучено синтезом речи.
