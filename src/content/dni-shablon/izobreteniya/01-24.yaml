  q: С какой скоростью «Анчар» шёл под водой в рекордном 1970 году?
  a: 44,7 узла — около 83 км/ч.
  src: РИА Новости, «Жажда скорости», 18.12.2020
audioguide:
  audioSrc: "/muzei/izobreteniya/audio-guide-k162-ru.mp3"
  durationLabel: 5 минут 41 секунда
  lead: "Голос ведёт по залу подводной лодки К-162 «Анчар»: от пенного следа на снимке через титан, «Золотую рыбку» и рекорд скорости до погони за авианосцем «Саратога». Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Пенный след
    - t: 63
      mark: 1:03
      title: Сплав номер три
    - t: 101
      mark: 1:41
      title: Золотая рыбка
    - t: 141
      mark: 2:21
      title: Рекорд и сорванные люки
    - t: 181
      mark: 3:01
      title: Ракета из-под воды
    - t: 233
      mark: 3:53
      title: Погоня за «Саратогой»
    - t: 299
      mark: 4:59
      title: Почти шестьдесят лет
  transcript:
    - "<p>«Здравствуйте. Мы в зале подводной лодки К-сто шестьдесят два, которую называли «Анчар». Проект шестьсот шестьдесят один. Посмотрите на снимок наверху страницы: лодка идёт в надводном положении в открытом море. Тёмный корпус, низкая рубка, высокий стабилизатор на корме, а вокруг пенится белый бурун. Эта лодка держит рекорд, который не побит до сих пор: под водой она шла со скоростью восемьдесят три километра в час. Быстрее под водой не ходила ни одна подводная лодка в мире, ни до, ни после. И сделана она была не из стали, а из титана, первой в мире. Под снимком полоса из четырёх фактов. Восемьдесят три километра в час под водой — рекорд. Тысяча девятьсот семидесятый год — сорок четыре и семь десятых узла. Пятьдесят шесть километров в час — полный ход авианосца «Саратога». И титан — корпус, первый в мире. Запомните эти цифры: весь зал о них. Пройдём по залу по порядку: металл, цена, рекорд, ракета, погоня через Атлантику и то, что осталось от «Анчара» сегодня.»</p>"
    - <p>«Начнём с металла. Титан почти вдвое легче стали и не притягивает магнит. Для подводной лодки это очень важные свойства. Работы шли так секретно, что даже в приёмном акте металл называли не титаном, а «сплав номер три». Строил лодку завод «Севмаш». Из титана там собрали первую в мире атомную подводную лодку с титановым корпусом. Флоту её передали тридцать первого декабря тысяча девятьсот шестьдесят девятого года. Обо всём этом рассказал в журнале «Наука и жизнь» участник испытаний В. Зайцев, и большая часть подробностей в этом зале — из его статьи «Золотая рыбка из титана».»</p>
    - "<p>«Откуда такое название? В. Зайцев объясняет просто. Килограмм листового титана стоил восемнадцать рублей. Ровно столько же, сколько килограмм чёрной икры. Килограмм в килограмм. «Поэтому лодку мы полушутя стали называть золотой рыбкой», — вспоминает он. Прозвище прижилось. Им называют «Анчар» и Российское историческое общество, и «Российская газета». Задержитесь у второго снимка, чёрно-белого. Лодка снята с носа: обтекаемый корпус, рубка с выдвинутыми перископами и антеннами, люди на мостике. На этом снимке у лодки уже поздний номер, К-двести двадцать два.»</p>"
    - "<p>«Теперь главная цифра зала. Восемнадцатого декабря тысяча девятьсот семидесятого года «Анчар» разогнался под водой до сорока четырёх и семи десятых узла. Узел — морская мера скорости: одна морская миля, тысяча восемьсот пятьдесят два метра, в час. Умножаем: сорок четыре и семь десятых узла — это примерно восемьдесят три километра в час. Лодка шла так быстро, что вода начала её разрывать. Зайцев записал: «Напором воды вырвало дверь в ограждении рубки, один лючок на верхней палубе, два лючка в носовой части. Оторвало и радиоантенну». Представьте: металлическую дверь срывает не взрыв и не удар, а просто вода, которая обтекает корпус.»</p>"
    - <p>«Следующая остановка — оружие. Прежним лодкам с крылатыми ракетами перед пуском приходилось всплывать, и этим они себя выдавали. Для «Анчара» в бюро Челомея задумали первую в мире крылатую ракету, которая взлетает из-под воды. Она называлась «Аметист». Ракета вылетала из затопленного контейнера с глубины тридцати метров, и таких контейнеров на «Анчаре» было десять. Есть тут и честная оговорка. Титановую лодку строили так долго, что первыми с «Аметистом» в строй вошли стальные лодки «Скат». Головной «Скат» — в тысяча девятьсот шестьдесят седьмом году. На вооружение ракету приняли в тысяча девятьсот шестьдесят восьмом. А задумывали её всё-таки под «Анчар». Подробности о ракете собраны по материалам кафедры МГТУ имени Баумана, Российского исторического общества, РИА Новости и «Российской газеты».»</p>
    - "<p>«Теперь спуститесь к игре «Уйди от Анчара». В ней вы капитан американского авианосца, а за вами под водой идёт советская лодка. Нажмите «Полный ход», потом «До упора». Строка «Анчар» показывает, сколько метров до лодки: в начале она в двухстах пятидесяти метрах позади. Когда лодка рядом, жмите руль влево или вправо: корабль резко свернёт, и лодка на время вас потеряет. Сначала она идёт скрытно и медленно, потом прибавляет ход. Время в игре ускорено в шесть раз, а скорости настоящие. Авианосец выжимает всё — пятьдесят шесть километров в час. Это тридцать узлов. «Анчар» под водой умеет восемьдесят три. Уйти не получится. Так было и на самом деле. Осенью тысяча девятьсот семьдесят первого года, в первом боевом походе, К-сто шестьдесят два вела американский авианосец «Саратога». Шли от Гренландского моря почти до Бразильской впадины, через Атлантику. И, как пишет Российское историческое общество, даже на самой высокой своей скорости в тридцать узлов авианосец не смог оторваться.»</p>"
    - "<p>«И последняя остановка. Посмотрите на третий снимок: «Анчар» вдали у горизонта, а на переднем плане широкий пенный след от его поворота. Лодка давно ушла, а её первенство осталось. В марте две тысячи двадцать шестого года президент Курчатовского института Михаил Ковальчук сказал: подводной лодки с корпусом из титана нет ни у кого в мире уже почти шестьдесят лет, а у нас есть. Вот и весь зал. Первая в мире подлодка из титана. Восемьдесят три километра в час под водой, рекорд, который никто не повторил. Ракета, которой не нужно всплывать. И авианосец, который на полном ходу так и не оторвался. Теперь можно ещё раз сыграть в погоню или открыть пять фактов об «Анчаре» ниже.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
