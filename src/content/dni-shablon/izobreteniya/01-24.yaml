return:
  q: С какой скоростью «Анчар» шёл под водой в рекордном 1970 году?
  a: 44,7 узла — около 83 км/ч.
  src: РИА Новости, «Жажда скорости», 18.12.2020
audioguide:
  audioSrc: "/muzei/izobreteniya/audio-guide-k162-v2-ru.mp3"
  durationLabel: 2 минуты 9 секунд
  lead: "Голос ведёт по залу подводной лодки К-162 «Анчар»: титан, рекорд скорости под водой и ракета, которая взлетает из-под воды. Три остановки. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Сплав номер три
    - t: 37
      mark: 0:37
      title: Рекорд и сорванные люки
    - t: 77
      mark: 1:17
      title: Ракета из-под воды
  transcript:
    - <p>«Начнём с металла. Титан почти вдвое легче стали и не притягивает магнит. Для подводной лодки это очень важные свойства. Работы шли так секретно, что даже в приёмном акте металл называли не титаном, а «сплав номер три». Строил лодку завод «Севмаш». Из титана там собрали первую в мире атомную подводную лодку с титановым корпусом. Флоту её передали тридцать первого декабря тысяча девятьсот шестьдесят девятого года. Обо всём этом рассказал в журнале «Наука и жизнь» участник испытаний В. Зайцев, и большая часть подробностей в этом зале — из его статьи «Золотая рыбка из титана».»</p>
    - "<p>«Теперь главная цифра зала. Восемнадцатого декабря тысяча девятьсот семидесятого года «Анчар» разогнался под водой до сорока четырёх и семи десятых узла. Узел — морская мера скорости: одна морская миля, тысяча восемьсот пятьдесят два метра, в час. Умножаем: сорок четыре и семь десятых узла — это примерно восемьдесят три километра в час. Лодка шла так быстро, что вода начала её разрывать. Зайцев записал: «Напором воды вырвало дверь в ограждении рубки, один лючок на верхней палубе, два лючка в носовой части. Оторвало и радиоантенну». Представьте: металлическую дверь срывает не взрыв и не удар, а просто вода, которая обтекает корпус.»</p>"
    - <p>«Следующая остановка — оружие. Прежним лодкам с крылатыми ракетами перед пуском приходилось всплывать, и этим они себя выдавали. Для «Анчара» в бюро Челомея задумали первую в мире крылатую ракету, которая взлетает из-под воды. Она называлась «Аметист». Ракета вылетала из затопленного контейнера с глубины тридцати метров, и таких контейнеров на «Анчаре» было десять. Есть тут и честная оговорка. Титановую лодку строили так долго, что первыми с «Аметистом» в строй вошли стальные лодки «Скат». Головной «Скат» — в тысяча девятьсот шестьдесят седьмом году. На вооружение ракету приняли в тысяча девятьсот шестьдесят восьмом. А задумывали её всё-таки под «Анчар». Подробности о ракете собраны по материалам кафедры МГТУ имени Баумана, Российского исторического общества, РИА Новости и «Российской газеты».»</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
