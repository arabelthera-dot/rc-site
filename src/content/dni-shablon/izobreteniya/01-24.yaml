story:
  kicker: История рекорда
  h2: 83 км/ч под водой
  abzacy:
    - <p>18 декабря 1970 года подводная лодка К-162 («Анчар») под водой разогналась до 44,7 узла — это 83 км/ч. Быстрее под водой не ходила ни одна подводная лодка в мире — ни до, ни после.</p>
    - "<p>Узел — морская мера скорости: одна морская миля (1852 м) в час.</p>"
    - <p>1 узел = 1,852 км/ч<br>44,7 узла × 1,852 ≈ 83 км/ч — «Анчар» под водой</p>
    - "<p>Корпус лодки впервые в мире сделали из титана: он почти вдвое легче стали и не притягивает магнит. На рекордном ходу напор воды срывал с лодки дверь рубки, лючки и антенну.</p>"
    - '<p class="src-note">Источники: Российское историческое общество, «Самая быстрая в мире „Золотая рыбка“» — history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka; «Наука и жизнь», 2006, № 12 — nkj.ru/archive/articles/8335/</p>'
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов об «Анчаре»
  h2: Факты об «Анчаре»
  udary:
  - summary: <b>Первая из титана.</b> «Анчар» — первая в мире титановая подлодка; и почти 60 лет спустя — лишь у России.
    det:
    - Титан почти вдвое легче стали и не притягивает магнит; работы шли так секретно, что даже в приёмном акте металл назывался «сплав № 3». «Севмаш» построил из него первую в мире атомную подлодку с титановым корпусом — флоту её передали 31 декабря 1969 года.
    - «Подводной лодки с корпусом из титана &lt;…&gt; нет ни у кого в мире уже почти 60 лет, а у нас есть…», — сказал в марте 2026 года президент Курчатовского института Михаил Ковальчук.
    src: 'Источник: «Наука и жизнь», 2006, № 12, В. Зайцев, «„Золотая рыбка“ из титана» — nkj.ru/archive/articles/8335/; РИА Новости, «Жажда скорости», 18.12.2020 — ria.ru/20201218/podlodka-1589747230.html; «Известия», 20.03.2026 — iz.ru/2063321/2026-03-20/kovalchuk-otmetil-unikalnost-rossiiskikh-podvodnykh-lodok'
    otryvok: «Подводной лодки с корпусом из титана &lt;…&gt; нет ни у кого в мире уже почти 60 лет, а у нас есть…», — сказал в марте 2026 года президент Курчатовского института Михаил Ковальчук.
    stranica: «Известия», 20.03.2026, «Ковальчук отметил уникальность российских подводных лодок»
    href: https://iz.ru/2063321/2026-03-20/kovalchuk-otmetil-unikalnost-rossiiskikh-podvodnykh-lodok
    pometka: два источника
    utverzhdeno: Р186
  - summary: <b>Вода рвала лодку.</b> «Анчар» шёл так быстро, что вода вырвала дверь его рубки, три люка и антенну.
    det:
    - «Напором воды вырвало дверь в ограждении рубки, один лючок на верхней палубе, два лючка в носовой части. Оторвало и радиоантенну».
    src: 'Источник: «Наука и жизнь», 2006, № 12, В. Зайцев, «„Золотая рыбка“ из титана» — nkj.ru/archive/articles/8335/'
    otryvok: «Напором воды вырвало дверь в ограждении рубки, один лючок на верхней палубе, два лючка в носовой части. Оторвало и радиоантенну».
    stranica: «Наука и жизнь», 2006, № 12, В. Зайцев, «„Золотая рыбка“ из титана»
    href: https://nkj.ru/archive/articles/8335/
    pometka: документ
    utverzhdeno: Р186
  - summary: <b>Ракета из-под воды.</b> Для «Анчара» создали первую в мире крылатую ракету, что взлетает из-под 30 м воды.
    det:
    - Прежним лодкам с крылатыми ракетами перед пуском приходилось всплывать и выдавать себя. «Аметист» бюро Челомея вылетал из затопленного контейнера с глубины 30 метров; на «Анчаре» таких контейнеров было десять.
    - Ракету задумали под «Анчар», но титановую лодку строили так долго, что первыми с «Аметистом» в строй вошли стальные «Скаты» (головной — в 1967-м); на вооружение ракету приняли в 1968 году.
    src: 'Источник: МГТУ им. Н. Э. Баумана, кафедра СМ2 — sm2.bmstu.ru/o-kafedre/chelomey-vn; Российское историческое общество, «Самая быстрая в мире „Золотая рыбка“» — history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka; РИА Новости, «Жажда скорости», 18.12.2020 — ria.ru/20201218/podlodka-1589747230.html; «Российская газета», 06.07.2021 — rg.ru/2021/07/06/pamiat-o-samoj-skorostnoj-v-mire-apl-i-ee-sozdateliah-uvekovechat.html'
    otryvok: «Образно говоря, „Золотая рыбка“ появилась на свет как средство скрытой доставки к цели новых противокорабельных крылатых ракет П-70 „Аметист“».
    stranica: Российское историческое общество, «Самая быстрая в мире „Золотая рыбка“»
    href: https://history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka
    pometka: два источника
    utverzhdeno: Р186
  - summary: <b>Золотая рыбка.</b> Титан для «Анчара» стоил как чёрная икра, килограмм в килограмм, — отсюда и прозвище.
    det:
    - «Килограмм листового металла стоил 18 руб., столько же, сколько килограмм черной икры. Поэтому лодку… мы полушутя стали называть „золотой рыбкой“».
    src: 'Источник: «Наука и жизнь», 2006, № 12, В. Зайцев, «„Золотая рыбка“ из титана» — nkj.ru/archive/articles/8335/; «Российская газета», 17.12.2013 — rg.ru/2013/12/17/anchar-site.html'
    otryvok: «Килограмм листового металла стоил 18 руб., столько же, сколько килограмм черной икры. Поэтому лодку… мы полушутя стали называть „золотой рыбкой“».
    stranica: «Наука и жизнь», 2006, № 12, В. Зайцев, «„Золотая рыбка“ из титана»
    href: https://nkj.ru/archive/articles/8335/
    pometka: два источника
    utverzhdeno: Р186
  - summary: '<b>На рекордном ходу у рулевых была 21 секунда на ошибку: сверху лёд, снизу дно.</b>'
    det:
    - Рекорд скорости ставили на мелком полигоне — глубиной всего 200 метров. Сверху лёд, снизу дно, а лодка шла посередине, на 100 метрах. Ошибись рули или откажи автомат — через 21 секунду нос врезался бы в лёд или в ил.
    - 'Так шли двенадцать часов. Искать место поглубже и без льда не стали: начальство торопилось сделать подарок ко дню рождения Брежнева. Лодка выдержала — и после похода в Москву ушла шифровка о рекорде.'
    src: 'Источник: Н. Черкашин, «„Золотая рыбка“, она же „Серебряный кит“, она же „Папа“» (воспоминания контр-адмирала Н. Г. Мормуля), «Военно-промышленный курьер» — FLOT, 30.03.2010 — <a href="https://flot.com/history/branches/sub/plark_anchar.htm" rel="noopener">flot.com/history/branches/sub/plark_anchar.htm</a>.'
    otryvok: «Малейшая ошибка в управлении горизонтальными рулями или отказ авторулевого - и через 21 секунду нос атомохода врезается либо в лед, либо в ил.» — «А начальство торопилось преподнести свой подарок ко дню рождения генсека ЦК КПСС Леонида Ильича Брежнева.»
    stranica: Н. Черкашин, «„Золотая рыбка“, она же „Серебряный кит“, она же „Папа“», «Военно-промышленный курьер» — FLOT, 30.03.2010
    href: https://flot.com/history/branches/sub/plark_anchar.htm
    pometka: документ
  - summary: <b>Руль повернули всего на три градуса — и подлодка легла в вираж, как самолёт.</b>
    det:
    - На рекордной скорости автомат на первом повороте сдвинул руль совсем чуть-чуть. Палуба накренилась так, что члены комиссии едва не попадали на правый борт и хватались за что попало.
    - 'Участник испытаний вспоминал: поверни руль чуть больше — и лодка могла сорваться в «подводный штопор». Председатель комиссии велел перейти с автомата на ручное управление, и рули доверили боцману.'
    src: 'Источник: Н. Черкашин, «„Золотая рыбка“, она же „Серебряный кит“, она же „Папа“» (воспоминания контр-адмирала Н. Г. Мормуля), «Военно-промышленный курьер» — FLOT, 30.03.2010 — <a href="https://flot.com/history/branches/sub/plark_anchar.htm" rel="noopener">flot.com/history/branches/sub/plark_anchar.htm</a>.'
    otryvok: «Авторулевой переложил вертикальный руль всего на три градуса, а палуба под ногами накренилась так, что мы чуть не посыпались на правый борт.»
    stranica: Н. Черкашин, «„Золотая рыбка“, она же „Серебряный кит“, она же „Папа“», «Военно-промышленный курьер» — FLOT, 30.03.2010
    href: https://flot.com/history/branches/sub/plark_anchar.htm
    pometka: документ
  - summary: <b>Дежурный не поверил, что «Анчар» вернётся за одну ночь, — и лодку никто не встретил.</b>
    det:
    - Экипаж заказал буксиры к утру и рассчитывал на выходной быть дома. С другого конца Белого моря лодка всю ночь шла под водой на 42 узлах — почти 78 км/ч.
    - Утром всплыли — а встречать некому. Опытный дежурный базы прикинул обычную скорость подлодок и решил, что моряки «блефуют». Пришлось ждать у буя до позднего вечера, пока прилив не поднимет воду в канале.
    src: 'Источник: В. Зайцев, «„Золотая рыбка“ из титана», «Наука и жизнь», 2006, № 12 — <a href="https://www.nkj.ru/archive/articles/8335/" rel="noopener">www.nkj.ru/archive/articles/8335</a>.'
    otryvok: «Оперативный дежурный базы был бывалым моряком, он знал наше расположение, среднюю скорость атомных подлодок, все подсчитал и решил, что мы блефуем и заказали буксиры с запасом. Так нам и пришлось простоять у приемного буя до позднего вечера, когда прилив нагнал воду.»
    stranica: В. Зайцев, «„Золотая рыбка“ из титана», «Наука и жизнь», 2006, № 12
    href: https://www.nkj.ru/archive/articles/8335/
    pometka: документ
  - summary: <b>«Анчар» нельзя было ставить вплотную к стальному причалу — иначе причал сгнил бы.</b>
    det:
    - 'Титан и сталь в морской воде не уживаются: железо рядом с титаном начинает быстро разъедать. Изнутри лодки ржавели болты и гайки, крепившие начинку к титановому корпусу.'
    - Поэтому к стальному пирсу «Анчар», в отличие от других лодок, швартовали через особые прокладки. Об этом рассказал контр-адмирал Валерий Филатов, командовавший лодкой в 1985–1987 годах.
    src: 'Источник: Н. Протопопов, «„Жажда скорости“: почему ВМФ отказался от подлодки ценой в два миллиарда», РИА Новости, 18.12.2020 — <a href="https://ria.ru/20201218/podlodka-1589747230.html" rel="noopener">ria.ru/20201218/podlodka-1589747230.html</a>.'
    otryvok: «Даже к стальному пирсу эту лодку ставили не вплотную, как другие, а отделяли специальными проставками. Иначе пирс мог попросту сгнить.»
    stranica: 'Н. Протопопов, «„Жажда скорости“: почему ВМФ отказался от подлодки ценой в два миллиарда», РИА Новости, 18.12.2020'
    href: https://ria.ru/20201218/podlodka-1589747230.html
    pometka: документ
  - summary: <b>При первом пуске реактора в отсеке пошёл водород — реактор пришлось срочно глушить.</b>
    det:
    - Как только реактор «Анчара» вышел на рабочую температуру, в отсеке стал быстро копиться водород — газ, который может взорваться. Обычные средства не справлялись. Реактор заглушили, отсек обесточили и ждали, пока водород уйдёт сам. Промедление, писал участник, грозило бедой масштаба Чернобыля.
    - 'Виноват оказался опыт учёных: для защиты от излучения вместо обычных свинца и полиэтилена поставили соединение титана с водородом, а при нагреве оно отдавало газ. Больше на подлодках его для этого не применяли.'
    src: 'Источник: В. Зайцев, «„Золотая рыбка“ из титана», «Наука и жизнь», 2006, № 12 — <a href="https://www.nkj.ru/archive/articles/8335/" rel="noopener">www.nkj.ru/archive/articles/8335</a>.'
    otryvok: «Было принято решение заглушить реактор, обесточить отсек и дожидаться, пока водород выйдет естественным путем. Промедление грозило последствиями, сравнимыми с аварией в Чернобыле.»
    stranica: В. Зайцев, «„Золотая рыбка“ из титана», «Наука и жизнь», 2006, № 12
    href: https://www.nkj.ru/archive/articles/8335/
    pometka: документ
  - summary: <b>Американский авианосец на полном ходу не смог уйти от «Анчара» — лодка ещё и обогнала его.</b>
    det:
    - Осенью 1971 года, в первом боевом походе, «Анчар» сел на хвост американскому авианосцу и гнал его от Гренландского моря до Бразильской впадины. Авианосец выжимал свои предельные 30 узлов, но оторваться не смог.
    - 'А потом американцы увидели, что неизвестная подлодка легко обогнала его и ушла вперёд. Командир «Анчара» Юрий Голубков вспоминал: он понял, что может занять любую позицию и уничтожить авианосец первым залпом.'
    src: 'Источник: А. Трофимов, «Самая быстрая в мире „Золотая рыбка“», Российское историческое общество, 15.04.2022 — <a href="https://history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka" rel="noopener">history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka</a>; С. Птичкин, «„Золотая рыбка“ и золотые рекорды, о которых мало кто знал», «Российская газета», 17.12.2013 — <a href="https://rg.ru/2013/12/17/anchar-site.html" rel="noopener">rg.ru/2013/12/17/anchar-site.html</a>; РИА Новости, 18.12.2020 — <a href="https://ria.ru/20201218/podlodka-1589747230.html" rel="noopener">ria.ru/20201218/podlodka-1589747230.html</a>.'
    otryvok: «Даже на самой высокой своей скорости в 30 узлов он не смог оторваться от неизвестной подводной лодки, а потом обнаружил, что она легко обогнала его и ушла вперед.»
    stranica: А. Трофимов, «Самая быстрая в мире „Золотая рыбка“», Российское историческое общество, 15.04.2022
    href: https://history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka
    pometka: два источника
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Истребитель, брак и рубль
  udary:
  - summary: <b>Всплыть «Анчару» помогал двигатель от реактивного истребителя.</b>
    det:
    - Сжатый воздух на лодке берегли. Поэтому при всплытии воду из балластных цистерн выдували им лишь частично.
    - 'Остальное доделывал двигатель от истребителя: его запускали при открытом люке рубки, и он додувал цистерны до конца. Так рассказал контр-адмирал Валерий Филатов, командир «Анчара» в 1985–1987 годах.'
    src: 'Источник: Н. Протопопов, «„Жажда скорости“: почему ВМФ отказался от подлодки ценой в два миллиарда», РИА Новости, 18.12.2020 — <a href="https://ria.ru/20201218/podlodka-1589747230.html" rel="noopener">ria.ru/20201218/podlodka-1589747230.html</a>.'
    otryvok: «для экономии сжатого воздуха цистерны главного балласта при всплытии продували лишь частично, а дальше запускали двигатель от истребителя, который при открытом рубочном люке доводил дело до конца»
    stranica: 'Н. Протопопов, «„Жажда скорости“: почему ВМФ отказался от подлодки ценой в два миллиарда», РИА Новости, 18.12.2020'
    href: https://ria.ru/20201218/podlodka-1589747230.html
    pometka: документ
  - summary: <b>Завод решил сэкономить на нагреве титана — и на стройку пришли десятки тонн брака.</b>
    det:
    - 'Учёные предупредили: титан при нагреве жадно впитывает водород и становится хрупким. Но на металлургическом заводе, откуда шли листы, ради экономии стали греть их газом, в котором много водорода.'
    - В итоге на стапель попали несколько десятков тонн негодного металла. Корабелам «Севмаша» пришлось долго искать бракованные детали по номерам плавок и менять их.
    src: 'Источник: В. Зайцев, «„Золотая рыбка“ из титана», «Наука и жизнь», 2006, № 12 — <a href="https://www.nkj.ru/archive/articles/8335/" rel="noopener">www.nkj.ru/archive/articles/8335</a>.'
    otryvok: «Более того, там внедрили рацпредложение, по которому заготовки перед прокаткой ради снижения расходов нагревали доменным газом, очень богатым водородом. В результате на стапель попало несколько десятков тонн бракованного листа.»
    stranica: В. Зайцев, «„Золотая рыбка“ из титана», «Наука и жизнь», 2006, № 12
    href: https://www.nkj.ru/archive/articles/8335/
    pometka: документ
  - summary: <b>Каждый житель СССР вложил в «Анчар» рубль — и строители ещё вернули 20 миллионов.</b>
    det:
    - На лодку правительство выделило 240 миллионов рублей. Строители пересчитали затраты и уложились в 220 миллионов — даже с учётом бракованного металла. Выходило, что каждый житель страны вложил в лодку по рублю.
    - Сэкономленные 20 миллионов отдали Северному флоту — на испытания лодки в море.
    src: 'Источник: В. Зайцев, «„Золотая рыбка“ из титана», «Наука и жизнь», 2006, № 12 — <a href="https://www.nkj.ru/archive/articles/8335/" rel="noopener">www.nkj.ru/archive/articles/8335</a>.'
    otryvok: «Таким образом, каждый гражданин СССР вложил 1 руб. в этот объект, а сэкономленные 20 млн руб. были в дальнейшем переданы Северному флоту на опытную эксплуатацию лодки.»
    stranica: В. Зайцев, «„Золотая рыбка“ из титана», «Наука и жизнь», 2006, № 12
    href: https://www.nkj.ru/archive/articles/8335/
    pometka: документ
  - summary: <b>В 1971-м «Анчар» побил свой же рекорд — но флот новую цифру не засчитал.</b>
    det:
    - 30 марта 1971 года скорость хотели замерить уже не приборами самой лодки, а с судов-наблюдателей на мерной миле. До конца замер довести не удалось — отказало управление турбинами.
    - Но лодка успела показать 44,85 узла, около 83 км/ч. Командование флота сочло это недоказанным, и во всех документах осталась прежняя цифра — 44,7 узла.
    src: 'Источник: А. Трофимов, «Самая быстрая в мире „Золотая рыбка“», Российское историческое общество, 15.04.2022 — <a href="https://history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka" rel="noopener">history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka</a>.'
    otryvok: «во время этого эксперимента был достигнут показатель в 44,85 узла, то есть 83 км/ч. Командование ВМФ посчитало достижение недоказанным, потому во всех документах фигурировал прежний показатель»
    stranica: А. Трофимов, «Самая быстрая в мире „Золотая рыбка“», Российское историческое общество, 15.04.2022
    href: https://history.ru/read/articles/samaya-bystraya-v-mire-zolotaya-rybka
    pometka: документ
  - summary: <b>Флот ждал десять «Анчаров», а получил один — других таких лодок не построили.</b>
    det:
    - 'Титановую лодку строили десять лет: не хватало титана и деталей, долго не могли принять на вооружение новые ракеты. В Северный флот «Анчар» вошёл только в январе 1970 года.'
    - Планировали построить десять таких лодок, но достроили и спустили на воду всего одну. Опытная служба выявила много недоработок, и делать улучшенную версию не стали — «Анчар» так и остался единственным.
    src: 'Источник: Н. Протопопов, «„Жажда скорости“: почему ВМФ отказался от подлодки ценой в два миллиарда», РИА Новости, 18.12.2020 — <a href="https://ria.ru/20201218/podlodka-1589747230.html" rel="noopener">ria.ru/20201218/podlodka-1589747230.html</a>.'
    otryvok: «Планировалось, что флот получит десять таких подлодок. Но достроить и спустить на воду удалось всего одну.» — «Заниматься модернизированной версией сочли нецелесообразным.»
    stranica: 'Н. Протопопов, «„Жажда скорости“: почему ВМФ отказался от подлодки ценой в два миллиарда», РИА Новости, 18.12.2020'
    href: https://ria.ru/20201218/podlodka-1589747230.html
    pometka: документ
