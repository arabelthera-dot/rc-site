audioguide:
  audioSrc: audio-guide-filatov-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу Филатова: от двух неудачных пересадок через арест к слепому, который прозрел, и к японцам, приехавшим учиться.'
  stops:
  - t: 0
    mark: '0:00'
    title: Слепой прозрел
  - t: 15
    mark: '0:15'
    title: Арест и 16 дней
  - t: 28
    mark: '0:28'
    title: Бельмо светлеет
  - t: 39
    mark: '0:39'
    title: Учиться у Филатова
  transcript:
  - Филатов первым в мире вернул слепому зрение роговицей умершего человека — 6 мая 1931-го. Две пересадки, в 1912-м и 1914-м, провалились — Филатов не бросил, и слепой прозрел.
  - В апреле 1931-го Филатова выпустили из-под ареста, а через 16 дней он сделал мировое первенство. Коллеги пугали «трупным заражением» — Филатов всё равно пересадил роговицу умершего, и всё обошлось.
  - 'Вокруг роговицы умершего у слепого начало светлеть бельмо — так родилась тканевая терапия. Филатов открыл: ткань на грани жизни и смерти сама копит лекарство.'
  - После Хиросимы японские учёные приехали учиться у Филатова — в 1946 году. 23 депутата парламента Японии приехали к Филатову и открыли у себя общество его имени.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
