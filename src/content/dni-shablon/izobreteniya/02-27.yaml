igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чьё это число
  pravilo_ru: 'Что сделать сейчас: выбери число и нажми на то, что оно значит.'
  kak_igrat:
    zachem: 'У каждого числа из истории Филатова — своё место: дни, годы, люди и сантиметры.'
    shagi:
    - Выбери число — кнопка загорится золотом.
    - Нажми на то, что оно значит. Верный выбор загорится зелёным.
    - Расставь все четыре числа — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все четыре числа на месте — +20 баллов.
  dannye:
    mesta:
    - kod: arest
      nazvanie: Столько дней прошло от освобождения из-под ареста до мирового первенства
      verno_ru: В апреле 1931-го Филатова выпустили из-под ареста, а через 16 дней он сделал мировое первенство
    - kod: yaponcy
      nazvanie: Год, когда японские учёные приехали учиться у Филатова
      verno_ru: После Хиросимы японские учёные приехали учиться у Филатова — в 1946 году
    - kod: deputaty
      nazvanie: Столько депутатов парламента Японии приехали к Филатову
      verno_ru: 23 депутата парламента Японии приехали к Филатову и открыли у себя общество его имени
    - kod: trubka
      nazvanie: До стольких сантиметров бывала трубка из кожи
      verno_ru: Трубка из кожи длиной до 40 см «шагала» по телу раненого к ране на лице
    podpisi:
    - kod: n16
      tekst: 16 дней
      mesto: arest
      mimo_ru: 16 дней — от освобождения из-под ареста до мирового первенства.
    - kod: n1946
      tekst: '1946'
      mesto: yaponcy
      mimo_ru: 1946 — год, когда японские учёные приехали учиться.
    - kod: n23
      tekst: '23'
      mesto: deputaty
      mimo_ru: 23 — столько депутатов парламента Японии приехали к Филатову.
    - kod: n40
      tekst: 40 см
      mesto: trubka
      mimo_ru: 40 см — такой длины бывала трубка из кожи.
    vyberi_ru: Сначала выбери число, потом его место.
    mimo_ru: Не то место — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все числа на месте — 16 дней после освобождения из-под ареста, японцы в 1946-м, 23 депутата и трубка из кожи до 40 см.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: 16 дней — от освобождения из-под ареста до первенства, 1946 — японские учёные, 23 — депутаты Японии, 40 см — трубка из кожи.'
