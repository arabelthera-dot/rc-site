audioguide:
  audioSrc: audio-guide-lenc-ru.mp3
  durationLabel: около минуты
  lead: 'Голос ведёт по залу Эмилия Ленца: от правила 1833 года через двигатель Якоби к первым взглядам в глубину океана.'
  stops:
  - t: 0
    mark: 0:00
    title: Правило 1833 года
  - t: 25
    mark: 0:25
    title: Двигатель даёт ток
  - t: 44
    mark: 0:44
    title: Физик в океане
  transcript:
  - 'Здравствуйте. Мы в зале Эмилия Ленца. Двенадцатого февраля тысяча восемьсот четвёртого года родился физик, который первым записал правилом, что природа сопротивляется вмешательству. Двадцать девятого ноября тысяча восемьсот тридцать третьего года он доложил в Петербургской академии наук: индукционный ток всегда направлен так, чтобы мешать своей причине. Это случилось за четырнадцать лет до закона сохранения энергии.'
  - 'Тогда все считали индукционный ток особым. Ленц один опытом доказал, что он обычный. А потом показал: если крутить вал двигателя Якоби, двигатель сам даёт ток. Вместе с Якоби Ленц первым научился рассчитывать электромагниты для машин. На его правиле стоит каждый электродвигатель.'
  - 'Но физик Ленц начинал в океане. Он первым в мире заглянул в его глубины, и отсюда началась океанография. В тропиках на глубине километра он намерил плюс два и две десятых градуса — рекордный холод того времени. Адмирал Макаров потом написал: наблюдения Ленца в океане первые и по времени, и по качеству.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
