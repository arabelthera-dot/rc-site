igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Три прибора Ленца — три открытия
  pravilo_ru: 'Что сделать сейчас: выбери прибор и нажми на открытие, которое он помог сделать.'
  kak_igrat:
    zachem: 'Ленц мерил всё сам: высоту — барометром, глубину — батометром, ток — машиной Якоби.'
    shagi:
    - Выбери прибор — кнопка загорится золотом.
    - Нажми на открытие, которое он помог сделать. Верный выбор загорится зелёным.
    - Расставь все три — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все три прибора на месте — +20 баллов.
  dannye:
    mesta:
    - kod: kaspij
      nazvanie: Насколько Каспий ниже Чёрного моря
      verno_ru: 'Барометром Ленц выяснил: Каспий на 30,5 метра ниже Чёрного моря.'
    - kod: glubina
      nazvanie: Какой холод в глубине тропиков
      verno_ru: В тропиках на глубине километра Ленц намерил +2,2° — рекордный холод того времени.
    - kod: tok
      nazvanie: Откуда ток, если крутить вал
      verno_ru: 'Ленц доказал: крутишь вал двигателя Якоби — и он сам даёт ток.'
    podpisi:
    - kod: barometr
      tekst: Барометр
      mesto: kaspij
      mimo_ru: Барометр мерит давление воздуха — по нему считают высоту.
    - kod: batometr
      tekst: Батометр
      mesto: glubina
      mimo_ru: Батометр поднимает воду с глубины.
    - kod: dvigatel
      tekst: Двигатель Якоби
      mesto: tok
      mimo_ru: Двигатель Якоби работает от тока — и может сам его давать.
    vyberi_ru: Сначала выбери прибор, потом открытие.
    mimo_ru: Не то открытие — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все три прибора на месте — барометр, батометр и двигатель Якоби.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: барометр — к Каспию, батометр — к глубине тропиков, двигатель Якоби — к току.'
