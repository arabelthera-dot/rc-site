kak_rabotaet:
- Магнит двигают к катушке — в катушке рождается ток
- Ток делает катушку магнитом, и этот магнит отталкивает пришедший
- Индукционный ток всегда мешает тому, что его вызвало
- Поэтому вал генератора под нагрузкой крутить тяжело — сила рук уходит в ток
data_uslovnaya: 12 февраля — день рождения Эмилия Христиановича Ленца (1804); правило Ленца он доложил в Академии наук 29 ноября 1833 года.
