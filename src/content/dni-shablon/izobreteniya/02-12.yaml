  - q: Насколько Каспий ниже Чёрного моря по барометру Ленца?
    o:
    - на 3 метра
    - на 30,5 метра
    - на 300 метров
    a: 1
    e: 'Барометром Ленц выяснил: Каспий на 30,5 метра ниже Чёрного моря.'
  - q: Что Ленц сделал электрическим током в 1838 году?
    o:
    - заморозил воду
    - зажёг лампу
    - расплавил стекло
    a: 0
    e: В 1838 году Ленц заморозил воду электрическим током.
  - q: Кто не сразу решился напечатать опыты Ленца?
    o:
    - царь
    - Академия наук
    - редактор главного физического журнала
    a: 2
    e: Редактор главного физического журнала не сразу решился напечатать опыты Ленца.
  - q: Сколько градусов Ленц намерил на глубине километра в тропиках?
    o:
    - +22°
    - +12°
    - +2,2°
    a: 2
    e: В тропиках на глубине километра Ленц намерил +2,2° — рекордный холод того времени.
