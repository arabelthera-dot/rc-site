igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чьё это число
  pravilo_ru: 'Что сделать сейчас: выбери число и нажми на то, что оно значит.'
  kak_igrat:
    zachem: 'У каждого числа из истории шпиля Петропавловки — своё место: тонны, метры и сантиметры.'
    shagi:
    - Выбери число — кнопка загорится золотом.
    - Нажми на то, что оно значит. Верный выбор загорится зелёным.
    - Расставь все четыре числа — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все четыре числа на месте — +20 баллов.
  dannye:
    mesta:
    - kod: ves
      nazvanie: Столько тонн железа в шпиле Петропавловки
      verno_ru: 56 тонн железа на высоте 122 метров — и шпиль стоит как неваляшка
    - kod: vysota
      nazvanie: Такая в метрах высота собора со шпилем
      verno_ru: Собор со шпилем, крестом и ангелом поднимается на 122 метра
    - kod: raschet
      nazvanie: На столько сантиметров шпиль рассчитан качаться
      verno_ru: Шпиль рассчитан качаться на 90 см
