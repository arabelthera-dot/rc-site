audioguide:
  audioSrc: audio-guide-zhuravskij-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу Журавского: от поющей модели моста через царский поезд к шпилю-неваляшке.'
  stops:
  - t: 0
    mark: 0:00
    title: Мост поёт
  - t: 35
    mark: 0:35
    title: Убрать в канцелярию
  - t: 70
    mark: '1:10'
    title: Шпиль-неваляшка
  - t: 105
    mark: '1:45'
    title: Первым — русский
  transcript:
  - 'Журавский проверял мост смычком: у опор проволоки модели пели выше — значит, тянут сильнее. Американский консультант Уистлер не верил расчёту Журавского — опыт на модели его переубедил.'
  - 'Клейнмихель велел «убрать к делам канцелярии» книгу Журавского — она взяла Демидовскую премию. Царский поезд встал на мосту Журавского: мастер выкрасил рельсы маслом, и колёса забуксовали.'
  - 'Пятьдесят шесть тонн железа на высоте ста двадцати двух метров: шпиль Петропавловки по расчёту Журавского стоит как неваляшка. Шпиль Журавского рассчитан качаться на девяносто сантиметров — за полтора века сместился на три сантиметра.'
  - 'Немец Кульман сосчитал ферму в 1851 году и только на один пролёт — Журавский раньше и на девять. Бресс, Коллиньон и Сен-Венан признали: первым в мире дополнил теорию изгиба русский — Журавский.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
