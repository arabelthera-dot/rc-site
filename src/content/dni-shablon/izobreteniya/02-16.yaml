audioguide:
  audioSrc: audio-guide-radiozond-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу радиозонда: от шара над Павловском через дирижабль над Арктикой к восьмистам зондам в день. Четыре остановки.'
  stops:
  - t: 0
    mark: 0:00
    title: Шар над Павловском
  - t: 40
    mark: 0:40
    title: Гребёнка и цифровой код
  - t: 75
    mark: '1:15'
    title: Зонды с «Графа Цеппелина»
  - t: 110
    mark: '1:50'
    title: Сеть станций и потомки
  transcript:
  - 'Здравствуйте. Мы в зале первого в мире радиозонда. Тысяча девятьсот тридцатый год, тридцатое января, Павловск под Ленинградом. Павел Александрович Молчанов выпускает в небо шар с приборами. Передатчик для этого зонда он собрал своими руками. Шар поднялся на семь и восемь десятых километра и сам сообщил по радио: за бортом минус сорок и семь десятых градуса. Через тридцать две минуты после старта в Москву ушла первая в мире сводка погоды с высоты.'
  - 'Как зонд говорил с землёй? Он передавал погоду уже цифровым кодом: стрелка прыгала по зубцам гребёнки, и каждый зубец давал свой сигнал. Самые первые зонды Молчанова мерили почти так же точно, как нынешние. Зонд почти тридцать лет работал без переделок, а сменщика по имени «Волна» пришлось переделывать.'
  - 'Зонды Молчанова пускали с дирижабля «Граф Цеппелин» над Арктикой, а шар надували водородом самого дирижабля. Чтобы зонд не попал в винт, его сначала роняли вниз, а груз отрезала гильотина с часами. С дирижабля зонд уходил на пятнадцать — двадцать километров, а его голос слушали до пятидесяти минут. Эти зонды показали: над всей Арктикой стратосфера начинается на десяти с половиной километрах. Кренкель назвал зонд Молчанова прекрасным даром человечеству.'
  - Летом тысяча девятьсот тридцать третьего года в бухте Тихой заработала первая в мире автоматическая метеостанция — тоже Молчанова. К тысяча девятьсот тридцать седьмому году его зонды поднимали двадцать семь станций страны — первая в мире сеть. Десятки радиозондов разных стран построены на его принципах. И сегодня мир каждый день выпускает около восьмисот радиозондов — потомков зонда из Павловска.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
