igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чьё это число
  pravilo_ru: 'Что сделать сейчас: выбери число и нажми на то, что оно значит.'
  kak_igrat:
    zachem: 'У каждого числа из истории зонда — своё место: минуты, станции, зонды в день.'
    shagi:
    - Выбери число — кнопка загорится золотом.
    - Нажми на то, что оно значит. Верный выбор загорится зелёным.
    - Расставь все три числа — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все три числа на месте — +20 баллов.
  dannye:
    mesta:
    - kod: minuty
      nazvanie: Через столько минут сводка ушла в Москву
      verno_ru: Через 32 минуты после старта зонда в Москву ушла первая в мире сводка погоды с высоты.
    - kod: stancii
      nazvanie: Столько станций поднимали зонды к 1937 году
      verno_ru: К 1937-му зонды Молчанова поднимали 27 станций страны — первая в мире сеть.
    - kod: zondy
      nazvanie: Столько радиозондов мир выпускает каждый день
      verno_ru: Каждый день мир выпускает около 800 радиозондов — потомков зонда из Павловска.
    podpisi:
    - kod: n32
      tekst: '32'
      mesto: minuty
      mimo_ru: '32 — это минуты: столько ждала Москва первую сводку.'
    - kod: n27
      tekst: '27'
      mesto: stancii
      mimo_ru: '27 — это станции: первая в мире сеть к 1937 году.'
    - kod: n800
      tekst: около 800
      mesto: zondy
      mimo_ru: Около 800 — это зонды, которые мир выпускает каждый день.
    vyberi_ru: Сначала выбери число, потом его место.
    mimo_ru: Не то место — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все числа на месте — 32 минуты до первой сводки, 27 станций к 1937 году, около 800 зондов в день сегодня.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: 32 — минуты до первой сводки, 27 — станций к 1937 году, около 800 — зондов в день.'
