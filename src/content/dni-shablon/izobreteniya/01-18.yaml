story:
  kicker: История дня · 3 удара
  h2: Папиросы, суд и ручка
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источником.
  udary:
  - summary: Денег на свой завод у механика Однера не было — их принесла его папиросная машина.
    det: &id001
    - 'Денег на свою фабрику у Однера не было. Помог табачный бум: в Петербурге разрешили курить на улицах, и его папиросная машина стала продаваться. В 1885 году он открыл мастерскую с одним токарным станком, который крутили ногой. Через четыре года на заводе стояло больше ста станков, а в 1890 году он продал 500 арифмометров.'
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — https://www.nkj.ru/archive/articles/38885/'
  - summary: Права на арифмометр он когда-то отдал компаньону — и первые машины делал без права, пока не отсудил его назад.
    det: &id002
    - Права на своё изобретение Однер отдал компаньону, но тот так и не наладил выпуск машин. Тогда Однер стал делать арифмометры сам, хотя права у него уже не было. Потом он через суд забрал права назад и в 1890 году получил патент на улучшенную машину.
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — https://www.nkj.ru/archive/articles/38885/'
  - summary: В 1890 году — патент, 500 проданных машин и книга-наставление, где корень находят одной ручкой.
    det: &id003
    - 'В 1890 году Однер выпустил книгу-наставление к своей машине, и через два года её пришлось допечатывать. Там есть приём для квадратного корня: вычитай подряд нечётные числа, пока не дойдёшь до нуля. Сколько раз повернул ручку — это и есть корень. Проверь сам в игре выше.'
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — https://www.nkj.ru/archive/articles/38885/'
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов об Однере
  h2: Мастер, который собрал калькулятор дома
  udary:
  - summary: <b>Первый арифмометр Однер собрал у себя дома — от бедности, в 1873 году.</b>
    utverzhdeno: Р324
    det:
    - Однер был старшим мастером на петербургском заводе, но жалованье было маленьким, а расходы росли. По его словам, за счётную машину его усадила надежда разбогатеть.
    - Первую модель он собрал дома. Серийная машина 1890 года была 13 × 18 см — меньше школьной тетради.
    src: 'Источник: А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE, 26.06.2024 — <a href="https://iq-media.ru/archive/936485878" rel="noopener">iq-media.ru/archive/936485878</a>; А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">www.nkj.ru/archive/articles/38885</a>.'
    otryvok: «По его собственным словам, именно надежда разбогатеть заставила его заняться созданием вычислительной машины» (IQ.HSE). — «Первую модель нового арифмометра Однер изготовил дома в 1873 году» («Наука и жизнь»).
    stranica: 'А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE, 26.06.2024'
    href: https://iq-media.ru/archive/936485878
    pometka: два источника
  - summary: <b>Однер взял высшую награду в Чикаго с заводом из 25 взрослых и 10 детей.</b>
    utverzhdeno: Р324
    det:
    - В 1893 году завод «Однер и Гиль» привёз арифмометр на Всемирную выставку в Чикаго. На заводе стояло 25 станков и один нефтяной двигатель на четыре лошадиные силы.
    - Работали там 25 взрослых и 10 детей. И эта маленькая фабрика получила высшую награду выставки.
    src: 'Источник: А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE, 26.06.2024 — <a href="https://iq-media.ru/archive/936485878" rel="noopener">iq-media.ru/archive/936485878</a>.'
    otryvok: «Официальный каталог выставки сообщает, что на заводе работают 25 взрослых и десять детей… На чикагской выставке арифмометр получает высшую награду…»
    stranica: 'А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE, 26.06.2024'
    href: https://iq-media.ru/archive/936485878
    pometka: документ
  - summary: <b>Арифмометр Однера за семь лет взял награды пяти выставок, в Париже — золото.</b>
    utverzhdeno: Р324
    det:
    - 'После Чикаго машина получала награды каждые год-два: Брюссель — 1895, Нижний Новгород — 1896, Стокгольм — 1897.'
    - В 1900 году на Всемирной выставке в Париже Однер получил золотую медаль.
    src: 'Источник: О. А. Ананьева (Политехнический музей), «Арифмометры В. Т. Однера», Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/precomp/odner.htm" rel="noopener">www.computer-museum.ru/precomp/odner.htm</a>; А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">www.nkj.ru/archive/articles/38885</a>.'
    otryvok: '«На крупнейших промышленных выставках арифмометры завоевывают славу и высокие награды: в Чикаго (1893 г.), Брюсселе (1895 г.), Нижнем Новгороде (1896 г.), Стокгольме (1897 г.), Париже (1900 г.)»'
    stranica: О. А. Ананьева (Политехнический музей), «Арифмометры В. Т. Однера», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/precomp/odner.htm
    pometka: два источника
  - summary: <b>Каждый пятый ранний арифмометр Однера уехал за границу.</b>
    utverzhdeno: Р324
    det:
    - За пять лет после 1890 года в России продали около 4 000 машин Однера, а ещё 1 000 ушла за границу.
    - К 1913 году в России работали 22 000 его арифмометров.
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">www.nkj.ru/archive/articles/38885</a>; О. А. Ананьева (Политехнический музей), «Арифмометры В. Т. Однера», Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/precomp/odner.htm" rel="noopener">www.computer-museum.ru/precomp/odner.htm</a>.'
    otryvok: «В течение последующих пяти лет только в России было продано около 4000 машин, а ещё 1000 ушла за границу. В 1913 году в России будет уже 22 000 арифмометров Однера»
    stranica: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6
    href: https://www.nkj.ru/archive/articles/38885/
    pometka: два источника
  - summary: <b>Арифмометр Однера в России сменил пять имён — последним стал «Феликс».</b>
    utverzhdeno: Р324
    det:
    - 'После революции машина не исчезла, а меняла названия: «Оригинал Однер», «Союз», «Оригинал Динамо», «Москва», «Феликс».'
    - Одного «Феликса» выпустили около двух десятков разновидностей — в Москве, Пензе и Курске, всего несколько миллионов машин.
    src: 'Источник: О. А. Ананьева (Политехнический музей), «Арифмометры В. Т. Однера», Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/precomp/odner.htm" rel="noopener">www.computer-museum.ru/precomp/odner.htm</a>; С. Н. Сихов, «Железный „Феликс“ — надёжный друг советского бухгалтера», Анапский археологический музей — <a href="https://museumanapa.ru/железный-феликс-надежный-друг-сове/" rel="noopener">museumanapa.ru/железный-феликс-надежный-друг-сове</a>.'
    otryvok: «…выпускались до конца 1960-х годов под марками „Оригинал Однер“, „Союз“, „Оригинал Динамо“, „Москва“, „Феликс“»
    stranica: О. А. Ананьева (Политехнический музей), «Арифмометры В. Т. Однера», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/precomp/odner.htm
    pometka: два источника
  - summary: <b>Завод «Феликсов» в Курске заложили на шестой день после Победы.</b>
    utverzhdeno: Р324
    det:
    - 14 мая 1945 года правительство решило построить в Курске, недалеко от полей Курской дуги, завод счётных машин.
    - К 8 марта 1948 года рабочие собрали там первый свой «Феликс». С него начался «Счётмаш».
    src: 'Источник: «Курский завод „Счётмаш“» (книга «Приборостроение — XX век», 2004), Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/histussr/schetmash.htm" rel="noopener">www.computer-museum.ru/histussr/schetmash.htm</a>.'
    otryvok: «…на шестой день после окончания Великой Отечественной войны — 14 мая 1945 года Правительство Союза ССР принимает решение о строительстве в г. Курске завода по производству счетно-аналитических машин».
    stranica: «Курский завод „Счётмаш“» (книга «Приборостроение — XX век», 2004), Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/histussr/schetmash.htm
    pometka: документ
  - summary: <b>«Феликс» в 1960-е был обязательным уроком в школе — ученики сами его чинили.</b>
    utverzhdeno: Р324
    det:
    - В 1960-е и в начале 1970-х работе на арифмометре учили всех советских школьников — как сейчас учат работать на компьютере.
    - Машина была так проста, что ломалась редко, а сломанную ремонтировали сами ученики.
    src: 'Источник: С. Н. Сихов, «Железный „Феликс“ — надёжный друг советского бухгалтера», Анапский археологический музей — <a href="https://museumanapa.ru/железный-феликс-надежный-друг-сове/" rel="noopener">museumanapa.ru/железный-феликс-надежный-друг-сове</a>.'
    otryvok: «…в 60 – н. 70 гг. ХХ века в программу обучения советских школьников входил обязательный курс работы с арифмометром. Благодаря своей достаточно простой конструкции приборы редко ломались и при необходимости ремонтировались даже учащимися».
    stranica: С. Н. Сихов, «Железный „Феликс“ — надёжный друг советского бухгалтера», Анапский археологический музей
    href: https://museumanapa.ru/железный-феликс-надежный-друг-сове/
    pometka: легенда
  - summary: <b>Арифмометр оплатили папиросы, а завод начинался с одного ножного станка.</b>
    utverzhdeno: Р324
    det:
    - 'Денег на свою фабрику у Однера не было. Помог табачный бум: в Петербурге разрешили курить на улицах, и его папиросная машина стала продаваться.'
    - В 1885 году он открыл мастерскую с одним токарным станком, который крутили ногой. Через четыре года на заводе стояло больше ста станков, а в 1890 году он продал 500 арифмометров.
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">www.nkj.ru/archive/articles/38885</a>.'
    otryvok: «…помог табачный бум. <…> На заработанные деньги он в 1885 году открыл маленькую мастерскую всего с одним ножным токарным станком…» — «В 1889—1890 годах завод расширился и имел уже более 100 станков. Так что в 1890 году было произведено и продано 500 арифмометров».
    stranica: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6
    href: https://www.nkj.ru/archive/articles/38885/
    pometka: документ
  - summary: <b>Первые свои арифмометры Однер делал незаконно и потом отсудил права у компаньона.</b>
    utverzhdeno: Р324
    det:
    - Права на изобретение Однер отдал компаньону, но тот так и не наладил выпуск машин. Тогда Однер стал делать арифмометры сам, хотя права у него уже не было.
    - Потом он через суд вернул себе права и в 1890 году получил патент на улучшенную машину.
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">www.nkj.ru/archive/articles/38885</a>.'
    otryvok: «Пытался он производить и арифмометры, поначалу незаконно, так как права на своё устройство он ранее уступил фирме „Кёнигсбергер и Ко“. Но поскольку фирма так и не наладила своё производство, Однер отсудил у неё права и в 1890 году получил патент…»
    stranica: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6
    href: https://www.nkj.ru/archive/articles/38885/
    pometka: документ
  - summary: '<b>Корень на арифмометре извлекали, складывая нечётные числа: 1 + 3 + 5 + 7 + 9 = 25.</b>'
    utverzhdeno: Р324
    det:
    - 'В инструкции 1890 года Однер показал приём для квадратного корня: складываешь подряд нечётные числа, пока не дойдёшь до нужного числа. Сколько раз повернул ручку — это и есть корень.'
    - 'Проверь сам на бумаге: 1 + 3 + 5 + 7 + 9 = 25, пять слагаемых — корень из 25 равен 5.'
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">www.nkj.ru/archive/articles/38885</a>.'
    otryvok: «…квадрат целого числа n равен сумме нечётных чисел от 1 до 2n–1. Например, 25 = 1 + 3 + 5 + 7 + 9. <…> для нахождения корня из некоторого числа на арифмометре надо складывать нечётные числа, пока не получится это число. Ответ при этом показывается на счётчике оборотов…»
    stranica: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6
    href: https://www.nkj.ru/archive/articles/38885/
    pometka: документ
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Турникеты, деньги и ракеты
  udary:
  - summary: <b>Турникеты на пристанях — тоже Однер.</b>
    utverzhdeno: Р324
    det:
    - Через его турникеты пассажиры проходили на пароходы почти по всей России.
    - Однер изобретал не только арифмометр. Хранитель Политехнического музея среди его изобретений называет турникеты. Ими пользовались почти все пароходные компании России.
    - 'Простояли они до середины XX века. Шведский Технический музей пишет то же: кроме счётных машин, завод Однера делал печатные прессы, турникеты и граммофоны.'
    src: 'Источник: О. А. Ананьева (Политехнический музей), «Арифмометры В. Т. Однера», Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/precomp/odner.htm" rel="noopener">www.computer-museum.ru/precomp/odner.htm</a>; Tekniska museet (Стокгольм), «Willgodt Theophil Odhner» — <a href="https://www.tekniskamuseet.se/en/learn-more/swedish-inventors/wilgodt-theophil-odhner-mechanical-calculator/" rel="noopener">www.tekniskamuseet.se/en/learn-more/swedish-inventors/wilgodt-theophil-odhner-mechanical-calculator</a>'
    otryvok: «На счету В. Т. Однера множество изобретений. Среди них машина для нумерации кредитных билетов; папиросная машина; турникеты, применявшиеся почти во всех пароходных компаниях России до середины XX столетия; наконец, арифмометры.»
    stranica: О. А. Ананьева, «Арифмометры В. Т. Однера», Виртуальный компьютерный музей
    href: https://www.computer-museum.ru/precomp/odner.htm
    pometka: два источника
  - summary: <b>Номера на деньгах ставила машина Однера.</b>
    utverzhdeno: Р324
    det:
    - До него номера на русских бумажных деньгах проставляли вручную.
    - В 1878 году Однер пришёл в Экспедицию заготовления государственных бумаг. Там печатали кредитные билеты — бумажные деньги. У каждой купюры свой номер, и ставили его вручную.
    - Однер построил машину, которая ставила номера сама. В 1881 году его поставили во главе отдела печати кредитных билетов.
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">www.nkj.ru/archive/articles/38885</a>; «Механический и меднолитейный завод В. Т. Однер», CityWalls — <a href="https://www.citywalls.ru/house16127.html" rel="noopener">www.citywalls.ru/house16127.html</a>'
    otryvok: «В 1878 году Однер поступил работать на фабрику Экспедиции заготовления государственных бумаг, где печатали деньги. Он изобретает машину для автоматической нумерации бумажных денег и в 1881 году становится во главе отдела по печати кредитных билетов.»
    stranica: А. Понятов, «Рождение легенды», «Наука и жизнь» № 6, 2020
    href: https://www.nkj.ru/archive/articles/38885/
    pometka: два источника
  - summary: <b>Арифмометр стоил полторы месячные зарплаты.</b>
    utverzhdeno: Р324
    det:
    - Первый «Однер» 1890 года продавали за 75 рублей.
    - По объявлению 1890 года машина стоила 75 рублей, с большим числом разрядов — 100. Купить её можно было у самого изобретателя, на Рижском проспекте, 26.
    - Чиновник или приказчик получал около 50 рублей в месяц. Поэтому покупали арифмометры в основном банки и железные дороги.
    src: 'Источник: «Арифмометр В. Т. Однера», «Наука и жизнь» № 45, 1890 (перепечатка) — <a href="https://www.nkj.ru/archive/articles/38884/" rel="noopener">nkj.ru/archive/articles/38884</a>; А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">nkj.ru/archive/articles/38885</a>.'
    otryvok: «Цена арифмометра для произведений до 99,999 миллионов и частных до 999 тысяч 75 рублей; для произведений до 9.999 миллиардов и частных до 99 миллионов — 100 рублей. Получить можно в Петербурге у изобретателя В. Т. Однера (Рижский просп., д. № 26)»
    stranica: '«Наука и жизнь» № 45, 1890: объявление «Арифмометр В. Т. Однера»'
    href: https://www.nkj.ru/archive/articles/38884/
    pometka: документ
  - summary: <b>С завода Однера выгнали.</b>
    utverzhdeno: Р324
    det:
    - А через 14 лет хозяева того же завода сами считали на десяти его машинах.
    - В 1877 г., пока Людвиг Нобель был в отъезде, директора запретили Однеру появляться на заводе и уволили его, партия из 14 машин осталась без производства.
    - В 1891 г. «Товарищество братьев Нобель» уже работало на десяти его арифмометрах.
    src: 'Источник: А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE — <a href="https://iq-media.ru/archive/936485878" rel="noopener">iq-media.ru/archive/936485878</a>.'
    otryvok: «Осенью дело доходит до того, что изобретателю запрещают появляться на территории завода, а затем увольняют.» … «…«Товарищество Братьев Нобель», которое уже в 1891 году пользовалось десятью арифмометрами».
    stranica: 'А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE'
    href: https://iq-media.ru/archive/936485878
    pometka: два источника
  - summary: <b>Ракеты в поле считали на «Феликсе».</b>
    utverzhdeno: Р324
    det:
    - Ему не нужно электричество.
    - Армия была главным покупателем — «только на арифмометре в полевых и боевых условиях при отсутствии электричества и можно было сделать необходимые для запуска ракет расчёты».
    - Только за 1969 г. выпустили 300 тысяч «Феликсов».
    src: 'Источник: «Огонёк», № 34, 29.08.2004 — <a href="https://www.kommersant.ru/doc/2294058" rel="noopener">kommersant.ru/doc/2294058</a>.'
    otryvok: '«Основным потребителем на этот раз стала армия: ведь только на арифмометре в полевых и боевых условиях при отсутствии электричества и можно было сделать необходимые для запуска ракет расчеты.»'
    stranica: «Арифмометр Феликс», «Огонёк» № 34, 29.08.2004, с. 31
    href: https://www.kommersant.ru/doc/2294058
    pometka: легенда
