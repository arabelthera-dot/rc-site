      title: Граница первенства
    - t: 305
      mark: 5:05
      title: Итог зала
  transcript:
    - "<p>«Здравствуйте. Мы в зале арифмометра Однера. Посмотрите на обложку: арифмометр «Оригинал-Однер» на дубовой доске. Чёрный корпус с золотыми цифрами, ряд рычажков, каретка со счётчиком и ручка справа, а на доске латунная табличка петербургского торгового дома. Эту машину сделали в Петербурге в тысяча девятьсот десятом — двенадцатом годах, хранится она в Политехническом музее. Под заголовком — Вильгодт Однер, механик, Петербург. Главная мысль зала: арифмометр Однера — самый массовый механический калькулятор в истории. Он считал на всех континентах почти сто лет, а в Советском Союзе его звали «Феликс». Под обложкой полоса из четырёх чисел. Тысяча восемьсот семьдесят четвёртый — первый образец в Петербурге. Тридцать тысяч машин Однера к тысяча девятьсот семнадцатому году. Три миллиона «Феликсов» в одном Курске к тысяча девятьсот семьдесят третьему. И около девяноста лет без смены принципа. Пройдём по залу по порядку.»</p>"
    - <p>«Начнём с истории. Все арифмометры до Однера стояли на тяжёлом ступенчатом валике Лейбница. Это длинный цилиндр с зубцами разной длины. Французская машина Тома де Кольмара, мировой стандарт тех лет, весила больше десяти килограммов. Однер поставил вместо валика колесо с девятью выдвижными зубцами. Набираешь рычажком цифру — и из колеса выдвигается ровно столько зубцов. Один оборот ручки — и число перешло в счётчик. Колесо Однера — плоский диск, и такие диски ставятся рядом тесной стопкой. Так счётная машина впервые уместилась на столе счетовода. В тысяча восемьсот девяностом году петербургский завод продал первые пятьсот арифмометров. А потом их потомков делали в Германии, Швеции и Соединённых Штатах миллионами.»</p>
    - "<p>«Найдите ниже полку арифмометров: семь машин из четырёх стран. Петербургский «Однер» тысяча восемьсот девяностого года, немецкие машины, среди них «Брунсвига», шведские, американская и курский «Феликс». Корпуса у всех разные. Ведите пальцем светящийся просвет по полке или нажмите на машину — и увидите, что у неё внутри. Счётчик под полкой показывает, в скольких машинах из семи колесо Однера уже найдено. А внутри у каждой то же петербургское колесо. Ниже — сравнение кирпичиками. Один кирпичик — пять тысяч машин. Слева один: около пяти тысяч арифмометров Тома де Кольмара за сто лет. Справа шестьсот: три миллиона «Феликсов» одного Курска к тысяча девятьсот семьдесят третьему году. Честная оговорка: это схема музея, а не снимок, корпуса нарисованы по типу машин.»</p>"
    - "<p>«Теперь игра «Возьми любую и покрути ручку». Задача счетовода: в цехе двадцать три рабочих, каждому положено сто сорок семь рублей. Сколько всего? Нажимайте кнопки «Сотни», «Десятки» и «Единицы» и наберите сто сорок семь. Из колёс выдвинется один, четыре и семь зубцов. Теперь крутите ручку пальцем по кругу по часовой стрелке или нажимайте «Ручку вперёд». Три оборота — в счётчике четыреста сорок один. Нажмите «Сдвинуть каретку»: теперь каждый оборот прибавляет число, умноженное на десять. Ещё два оборота — и в счётчике три тысячи триста восемьдесят один рубль. Всего пять оборотов вместо двадцати трёх сложений. Покрутите назад и уйдите в минус — зазвенит звонок, как у настоящего «Феликса». Честная оговорка: это модель, а не снимок. Три колеса вместо девяти и каретка на два положения.»</p>"
    - "<p>«Дальше пять фактов об Однере. Около тысяча восемьсот семьдесят первого года мастеру завода Нобеля принесли сломанный арифмометр Тома. Однер разобрал его и придумал своё колесо. В тысяча восемьсот семьдесят седьмом году на заводе собрали пробную партию из четырнадцати машин. Но пока Людвиг Нобель был в отъезде, директора уволили изобретателя. А в тысяча восемьсот девяносто первом году «Товарищество братьев Нобель» уже работало на десяти его арифмометрах. Два арифмометра пробной партии годами считали для правительства Соединённых Штатов. Немецкая «Брунсвига» с тысяча восемьсот девяносто второго года выпускала машины по лицензии Однера и к тысяча девятьсот двенадцатому году сделала двадцать тысяч. А ракеты в поле считали на «Феликсе»: ему не нужно электричество. Только за тысяча девятьсот шестьдесят девятый год выпустили триста тысяч «Феликсов».»</p>"
    - "<p>«Теперь найдите блок «Что именно Однер сделал первым». Считающие машины были и раньше: арифмометр Тома де Кольмара во Франции выпускали с тысяча восемьсот двадцатого года. Похожее колесо в тысяча восемьсот семьдесят пятом году запатентовал американец Болдуин. Первенство Однера в другом: это машина, которую весь мир стал делать миллионами. После национализации завода её делали в Москве, а с конца двадцатых годов — под маркой «Феликс», в честь Дзержинского. И вот во что трудно поверить. В семидесятые годы карманный калькулятор уже был в магазинах, но «Феликс» стоил примерно в десять раз дешевле, и его брали. Делали его до тысяча девятьсот семьдесят восьмого года. Машину с ручкой выпускали дольше, чем существовал Советский Союз.»</p>"
    - "<p>«Подведём итог зала. Однер приехал в Петербург осенью тысяча восемьсот шестьдесят восьмого года с восемью рублями, не зная ни слова по-русски. Диплома он так и не получил и говорил о себе: я механик, не инженер. А его колесо разошлось по всему миру и вернулось в Советский Союз «Феликсом». Вывод страницы такой: первым бывает тот, кто сделал сложное простым и дешёвым, — тогда им пользуется весь мир. До карманных калькуляторов бухгалтерии, конторы и школы почти сто лет крутили ручку машины, придуманной в Петербурге. Теперь вернитесь к полке и пройдите просветом все семь машин. Наберите сто сорок семь и умножьте за пять оборотов. Или откройте пять фактов и ответьте на пять вопросов викторины. Спасибо, что прошли этот зал вместе со мной.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
