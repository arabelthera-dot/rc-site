  kicker: Утверждённые факты об Однере
  h2: Факты дня
  udary:
  - summary: <b>Арифмометр оплатили папиросы, а завод начался с одного ножного станка.</b>
    det: *id001
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — https://www.nkj.ru/archive/articles/38885/'
    otryvok: «…помог табачный бум. В те годы резко возросло потребление папирос, на улицах Петербурга даже разрешили курить, и Однер спроектировал новую папиросную машину, пользовавшуюся спросом. На заработанные деньги он в 1885 году открыл маленькую мастерскую всего с одним ножным токарным станком…»
    stranica: «Наука и жизнь», 2020, № 6, А. Понятов, «Рождение легенды»
    href: https://www.nkj.ru/archive/articles/38885/
    pometka: документ
  - summary: <b>Первые арифмометры Однер делал незаконно — и отсудил права у компаньона.</b>
    det: *id002
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — https://www.nkj.ru/archive/articles/38885/'
    otryvok: «Пытался он производить и арифмометры, поначалу незаконно, так как права на своё устройство он ранее уступил <…>. Но поскольку фирма так и не наладила своё производство, Однер отсудил у неё права и в 1890 году получил патент Департамента торговли и мануфактур…»
    stranica: «Наука и жизнь», 2020, № 6, А. Понятов, «Рождение легенды»
    href: https://www.nkj.ru/archive/articles/38885/
    pometka: документ
  - summary: '<b>Корень на арифмометре находили, складывая нечётные числа: 1 + 3 + 5 + 7 + 9 = 25.</b>'
    det: *id003
    src: 'Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — https://www.nkj.ru/archive/articles/38885/'
