  - id: fakty-dnya
    posle: igra
    kicker: Ещё пять фактов
    h2: Турникеты, деньги и Папа Римский
    udary:
      - summary: <b>Турникеты на пристанях — тоже Однер.</b> Через его турникеты пассажиры проходили на пароходы почти по всей России.
        det:
          - Однер изобретал не только арифмометр. Хранитель Политехнического музея среди его изобретений называет турникеты. Ими пользовались почти все пароходные компании России.
          - "Простояли они до середины XX века. Шведский Технический музей пишет то же: кроме счётных машин, завод Однера делал печатные прессы, турникеты и граммофоны."
        src: "Источник: О. А. Ананьева (Политехнический музей), «Арифмометры В. Т. Однера», Виртуальный компьютерный музей — https://www.computer-museum.ru/precomp/odner.htm; Tekniska museet (Стокгольм), «Willgodt Theophil Odhner» — https://www.tekniskamuseet.se/en/learn-more/swedish-inventors/wilgodt-theophil-odhner-mechanical-calculator/"
        otryvok: «На счету В. Т. Однера множество изобретений. Среди них машина для нумерации кредитных билетов; папиросная машина; турникеты, применявшиеся почти во всех пароходных компаниях России до середины XX столетия; наконец, арифмометры.»
        stranica: О. А. Ананьева, «Арифмометры В. Т. Однера», Виртуальный компьютерный музей
        href: https://www.computer-museum.ru/precomp/odner.htm
        pometka: два источника
      - summary: <b>Номера на деньгах ставила машина Однера.</b> До него номера на русских бумажных деньгах проставляли вручную.
        det:
          - В 1878 году Однер пришёл в Экспедицию заготовления государственных бумаг. Там печатали кредитные билеты — бумажные деньги. У каждой купюры свой номер, и ставили его вручную.
          - Однер построил машину, которая ставила номера сама. В 1881 году его поставили во главе отдела печати кредитных билетов.
        src: "Источник: А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — https://www.nkj.ru/archive/articles/38885/; «Механический и меднолитейный завод В. Т. Однер», CityWalls — https://www.citywalls.ru/house16127.html"
        otryvok: «В 1878 году Однер поступил работать на фабрику Экспедиции заготовления государственных бумаг, где печатали деньги. Он изобретает машину для автоматической нумерации бумажных денег и в 1881 году становится во главе отдела по печати кредитных билетов.»
        stranica: А. Понятов, «Рождение легенды», «Наука и жизнь» № 6, 2020
        href: https://www.nkj.ru/archive/articles/38885/
        pometka: два источника
      - summary: <b>Арифмометр стоил полторы месячные зарплаты.</b> Первый «Однер» 1890 года продавали за 75 рублей, а французский арифмометр Тома — за 300.
        det:
          - По объявлению 1890 года машина стоила 75 рублей, с большим числом разрядов — 100. Купить её можно было у самого изобретателя, на Рижском проспекте, 26.
          - Чиновник или приказчик получал около 50 рублей в месяц. Поэтому покупали арифмометры в основном банки и железные дороги. Французский арифмометр Тома на 16 разрядов стоил 300 рублей — вчетверо дороже.
        src: "Источник: «Арифмометр В. Т. Однера», «Наука и жизнь» № 45, 1890 (перепечатка) — https://www.nkj.ru/archive/articles/38884/; А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — https://www.nkj.ru/archive/articles/38885/; блог Heinz Nixdorf MuseumsForum, 12.05.2020 — https://blog.hnf.de/die-rechenmaschine-mit-der-kurbel/"
        otryvok: «Цена арифмометра для произведений до 99,999 миллионов и частных до 999 тысяч 75 рублей; для произведений до 9.999 миллиардов и частных до 99 миллионов — 100 рублей. Получить можно в Петербурге у изобретателя В. Т. Однера (Рижский просп., д. № 26)»
        stranica: "«Наука и жизнь» № 45, 1890: объявление «Арифмометр В. Т. Однера»"
        href: https://www.nkj.ru/archive/articles/38884/
        pometka: документ
      - summary: <b>«Брунсвигу» начал делать завод швейных машин.</b> Его совет директоров называл петербургский арифмометр «дорогой игрушкой».
        det:
          - Фирма Grimme, Natalis & Co. из Брауншвейга до того делала швейные машины, печи и газовые плиты. Директор Франц Тринкс уговорил сомневавшийся совет купить права на машину Однера.
          - Заплатили 10 000 марок сразу и ещё по 10 марок с каждой проданной машины. Так появилась «Брунсвига». К 1952 году фирма выпустила 265 000 счётных и суммирующих машин.
        src: "Источник: Rechnerlexikon, «Brunsviga (1892–1959)» — https://rechnerlexikon.de/artikel/Brunsviga_(1892-1959)%2C_Mechanische_Rechenmaschinen_als_Welterfolg; блог Heinz Nixdorf MuseumsForum, «Die Rechenmaschine mit der Kurbel», 12.05.2020 — https://blog.hnf.de/die-rechenmaschine-mit-der-kurbel/"
        otryvok: "«Gegen erhebliche Skepsis im Aufsichtsrat gegenüber dem „teueren Spielzeug“ konnte Trinks den Ankauf der Patente für 10.000.- RM zuzüglich 10.- RM Lizenz für jede verkaufte Maschine durchsetzen.» (Перевод: «Вопреки большим сомнениям совета директоров насчёт „дорогой игрушки“ Тринкс добился покупки патентов за 10 000 марок плюс 10 марок лицензионных за каждую проданную машину».)"
        stranica: Rechnerlexikon, статья «Brunsviga (1892–1959)»
        href: https://rechnerlexikon.de/artikel/Brunsviga_(1892-1959)%2C_Mechanische_Rechenmaschinen_als_Welterfolg
        pometka: два источника
      - summary: <b>Арифмометр Однера подарили Папе Римскому.</b> В 2016 году Евгений Касперский вручил ему столетнюю петербургскую машину.
        det:
          - Основатель «Лаборатории Касперского» попал на короткую аудиенцию в Ватикане. По его словам, разговор длился секунд тридцать. За это время он вручил подарок — механическую счётную машину российского производства, которой было сто лет.
          - "Выбор Касперский объяснил так: больше 130 лет назад Россия продавала вычислительную технику за границу."
        src: "Источник: Е. Касперский, блог Nota Bene, «Ватикан с изнанки», 01.10.2016 — https://eugene.kaspersky.ru/2016/10/01/vatikan-s-iznanki/; «Невероятные приключения арифмометра», 30.09.2016 — https://eugene.kaspersky.ru/2016/09/30/neveroyatnye-priklyucheniya-arifmometra/"
        otryvok: «Пожать руку, что-то сказать и вручить подарок самому Папе Римскому! Вручена была 100-летнего возраста механическая арифметическая машинка российского производства — арифмометр Однера. Удивительная история у этой машинки… Оказывается, 130+ лет назад Россия была экспортёром вычислительной техники!»
