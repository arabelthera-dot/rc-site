  net: <b>Чего здесь нет:</b> считающие машины были и раньше — арифмометр Тома де Кольмара во Франции выпускали с 1820 года; похожее колесо в 1875 году запатентовал американец Болдуин. Первенство Однера — машина, которую весь мир стал делать миллионами.
