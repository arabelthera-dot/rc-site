story:
  kicker: История изобретения
  h2: Колесо с выдвижными зубцами
  abzacy:
    - '<p class="s18-1">Все арифмометры до Однера стояли на тяжёлом ступенчатом валике Лейбница — французская машина Тома де Кольмара, мировой стандарт тех лет, весила больше десяти килограммов. Однер поставил вместо валика колесо с девятью выдвижными зубцами: набираешь рычажком цифру — из колеса выдвигается ровно столько зубцов, один оборот ручки — и число перешло в счётчик. Так счётная машина впервые уместилась на столе счетовода. Это «колесо Однера» стоит внутри каждой машины на полке ниже: в 1890 году петербургский завод продал первые 500 арифмометров, а потом их потомков делали в Германии, Швеции и США миллионами.</p>'
    - '<p class="src-note">Источник: Понятов А. «Рождение легенды», «Наука и жизнь» № 6, 2020; Басов А. И. «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE, 26.06.2024.</p>'
fakty:
  - id: fakty
    posle: igra
    kicker: Пять фактов об Однере
    h2: Механик, которого выгнали с завода
    udary:
      - summary: Лучший в мире французский арифмометр Однеру дали починить — он сделал свой, и Курск собрал его 3 миллиона.
        det:
          - "Около 1871 г. мастеру завода Нобеля принесли сломанный арифмометр Тома де Кольмара — до Однера мировой стандарт: больше 10 кг, около 2 000 штук за XIX век. Однер разобрал его и придумал своё колесо."
          - Трёхмиллионный «Феликс» сошёл в Курске в 1973 г.
        src: 'Источник: А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE — <a href="https://iq-media.ru/archive/936485878" rel="noopener">iq-media.ru/archive/936485878</a>; «Курский завод „Счётмаш“», Виртуальный компьютерный музей — <a href="https://www.computer-museum.ru/histussr/schetmash.htm" rel="noopener">computer-museum.ru/histussr/schetmash.htm</a>; число машин Тома — А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">nkj.ru/archive/articles/38885</a>.'
        otryvok: «Сам он рассказывал, что примерно в 1871 году ему поручили отремонтировать арифмометр Тома де Кольмара.»
        stranica: "А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE"
        href: https://iq-media.ru/archive/936485878
        pometka: два источника
      - summary: Завод Нобеля выгнал Однера — а через 14 лет компания Нобелей сама считала на десяти его машинах.
        det:
          - В 1877 г., пока Людвиг Нобель был в отъезде, директора запретили Однеру появляться на заводе и уволили его, партия из 14 машин осталась без производства.
          - В 1891 г. «Товарищество братьев Нобель» уже работало на десяти его арифмометрах.
        src: 'Источник: А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE — <a href="https://iq-media.ru/archive/936485878" rel="noopener">iq-media.ru/archive/936485878</a>.'
        otryvok: «Осенью дело доходит до того, что изобретателю запрещают появляться на территории завода, а затем увольняют.» … «…«Товарищество Братьев Нобель», которое уже в 1891 году пользовалось десятью арифмометрами».
        stranica: "А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE"
        href: https://iq-media.ru/archive/936485878
        pometka: два источника
      - summary: Первые машины Однера годами считали для правительства США — теперь они в Смитсоновском институте.
        det:
          - Американский агент компаньона Однера продал два арифмометра пробной партии 1870-х чиновникам правительства США, «которые использовали их на протяжении многих лет».
          - Третий экземпляр той партии хранится в Политехническом музее.
        src: 'Источник: А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE — <a href="https://iq-media.ru/archive/936485878" rel="noopener">iq-media.ru/archive/936485878</a>.'
        otryvok: «Американский агент Кёнигсбергера даже продал два арифмометра чиновникам правительства США, которые использовали их на протяжении многих лет (сейчас эти арифмометры хранятся в Смитсоновском институте, а третий экземпляр из пробной партии находится в Политехническом музее).»
        stranica: "А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE"
        href: https://iq-media.ru/archive/936485878
        pometka: два источника
      - summary: "Немецкая «Брунсвига» — это Однер: Германия купила лицензию у петербургского мастера и сделала 20 000 машин."
        det:
          - С 1892 г. немецкая фирма выпускала арифмометры по лицензии Однера, к 1912 г. — 20 000 штук.
          - "Его колесо крутили и под другими марками: Facit в Швеции, Triumphator в Германии, «Рапид» во Франции."
        src: 'Источник: А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE — <a href="https://iq-media.ru/archive/936485878" rel="noopener">iq-media.ru/archive/936485878</a>; А. Понятов, «Рождение легенды», «Наука и жизнь», 2020, № 6 — <a href="https://www.nkj.ru/archive/articles/38885/" rel="noopener">nkj.ru/archive/articles/38885</a>.'
        otryvok: «…приобретает право выпускать усовершенствованную версию под торговой маркой Brunsviga (к 1912 году фирма выпустит уже 20 000 арифмометров).»
        stranica: "А. И. Басов (НИУ ВШЭ), «История с вычислениями. Эпизод третий: империя арифмометров», IQ.HSE"
        href: https://iq-media.ru/archive/936485878
        pometka: два источника
      - summary: "Ракеты в поле считали на «Феликсе»: ему не нужно электричество."
        det:
          - Армия была главным покупателем — «только на арифмометре в полевых и боевых условиях при отсутствии электричества и можно было сделать необходимые для запуска ракет расчёты».
          - Только за 1969 г. выпустили 300 тысяч «Феликсов».
        src: 'Источник: «Огонёк», № 34, 29.08.2004 — <a href="https://www.kommersant.ru/doc/2294058" rel="noopener">kommersant.ru/doc/2294058</a>.'
        otryvok: "«Основным потребителем на этот раз стала армия: ведь только на арифмометре в полевых и боевых условиях при отсутствии электричества и можно было сделать необходимые для запуска ракет расчеты.»"
        stranica: «Арифмометр Феликс», «Огонёк» № 34, 29.08.2004, с. 31
        href: https://www.kommersant.ru/doc/2294058
        pometka: легенда
