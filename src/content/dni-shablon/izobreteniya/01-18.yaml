razdely:
  - posle: pervenstvo
    html: |-
      <section class="block s18-5" id="trudno-poverit">
        <div class="wrap">
          <div class="kicker">Машина и её время</div>
          <h2 class="s18-6">В это трудно поверить</h2>
          <div class="q"><h3><em>Факт 1</em>Калькуляторы уже продавались, а «Феликс» всё равно покупали</h3><p>В 1970-е карманный калькулятор был уже в магазинах. Но «Феликс» стоил примерно в десять раз дешевле — и его брали. А если при вычитании уходил в минус, звенел звонок.</p></div>
          <div class="q"><h3><em>Факт 2</em>Машину с ручкой выпускали дольше, чем существовал СССР</h3><p>Петербургская серия началась в 1890 году, курский «Феликс» делали до 1978-го. Почти девяносто лет — без смены принципа: то же колесо с выдвижными зубцами.</p></div>
        </div>
      </section>
  - posle: pervenstvo
    html: |-
      <section class="block" id="razbor">
        <div class="wrap">
          <div class="kicker">Разбор</div>
          <h2 class="s18-7">Для тех, кто смотрит внимательно</h2>
          <details class="deepd">
            <summary>Четыре сюжета подробно — развернуть</summary>
            <h3>Почему колесо, а не валик</h3>
            <p>Ступенчатый валик Лейбница — длинный цилиндр с зубцами разной длины. Чтобы поместить в машину много разрядов, нужно много таких цилиндров, и машина тяжелеет: французские арифмометры Тома весили больше десяти килограммов. Колесо Однера — плоский диск, из которого рычажок выдвигает от нуля до девяти зубцов. Диски ставятся рядом тесной стопкой, и машина помещается на столе счетовода.</p>
            <h3>Откуда имя «Феликс»</h3>
            <p>После национализации завода машину стали делать в Москве с 1924–1925 годов — сначала под старым именем «Оригинал-Однер». С конца 1920-х её выпускали под маркой «Феликс», в честь Дзержинского. Источники называют 1928 или 1931 год — так или иначе, с конца 1920-х петербургская машина стала «Феликсом».</p>
            <h3>Нобели: уволили — и купили</h3>
            <p>Первую партию из 14 машин собрали на заводе Людвига Нобеля в 1877 году. Директора выставили изобретателя за ворота, пока хозяин был в отъезде. А в 1891 году «Товарищество братьев Нобель» уже считало на десяти арифмометрах Однера.</p>
            <h3>Как машина ушла за границу</h3>
            <p>Новые модели Однер патентовал в Европе и США, а немецкая «Брунсвига» купила лицензию ещё при его жизни. После 1917 года наследники уехали в Швецию и выпускали там «Оригинал-Однер». Так петербургское колесо разошлось по всему миру — и вернулось в СССР «Феликсом».</p>
          </details>
          <div class="src">Источники: nkj.ru · schetmash.com · computer-museum.ru · iq-media.ru · ar.culture.ru · companybest.ru · goskatalog.ru</div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="mirovoy-kontekst">
        <div class="wrap">
          <div class="kicker">Контекст</div>
          <h2 class="s18-6">Что в это время делал мир</h2>
          <p class="s18-9">Тысяча восемьсот девяностый. Мир считает вручную — столбиком, на счётах, а у кого есть деньги, на тяжёлых французских арифмометрах Тома. За семьдесят лет их сделали несколько тысяч: машина дорогая, громоздкая, и стоит она в редкой конторе.</p>
          <p class="s18-9">И тут из Петербурга приходит машина, которая помещается на столе. Уже в 1892–1893 годах немецкая фирма покупает лицензию Однера и начинает делать «Брунсвигу». В 1893 году на Всемирной выставке в Чикаго петербургский арифмометр получает высшую награду.</p>
          <p class="s18-9">Отсюда вывод, ради которого этот день стоит в календаре: <b class="s18-10">первым бывает тот, кто сделал сложное простым и дешёвым — тогда им пользуется весь мир.</b> До карманных калькуляторов бухгалтерии, конторы и школы почти сто лет крутили ручку машины, придуманной в Петербурге.</p>
        </div>
      </section>
