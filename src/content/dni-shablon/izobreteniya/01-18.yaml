  - posle: quiz
    html: |-
      <section class="block s18-16" id="fork">
        <div class="wrap">
          <div class="kicker">Твой выбор</div>
          <h2>А как поступил бы ты?</h2>
          <p class="s18-17">Петербург, 1877 год. Тебя только что уволили с завода, где собрана готовая партия из 14 твоих арифмометров. Хозяин вкладываться больше не хочет. Дома жена и дети, денег нет. Ты на месте Однера — что выбираешь?</p>
          <div class="fork-opt">🏭 Иду на хорошую службу, коплю деньги и потом открываю свою фабрику</div>
          <div class="fork-opt">🧳 Продаю изобретение за границу целиком и забываю о нём</div>
          <div class="fork-opt">🛑 Бросаю арифмометр: раз не вышло у Нобеля, не выйдет ни у кого</div>
          <div id="forkReal" class="exp s18-18"><b>Как было на самом деле.</b> Однер ушёл в Экспедицию заготовления государственных бумаг и 14 лет руководил там отделом. Арифмометр он не бросил: в 1878–1879 годах взял патенты в нескольких странах, в 1887 году открыл мастерскую, а с 1890 года пустил машину в серию.</div>
        </div>
      </section>
