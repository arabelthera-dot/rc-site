audioguide:
  audioSrc: audio-guide-odner-ru.mp3
  durationLabel: 5 минут 51 секунда
  lead: "Голос ведёт по залу арифмометра Однера: от машины на дубовой доске через колесо с выдвижными зубцами и полку из семи арифмометров до курского «Феликса». Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Машина на обложке
    - t: 58
      mark: 0:58
      title: Колесо вместо валика
    - t: 104
      mark: 1:44
      title: Полка из семи машин
    - t: 155
