  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — колесо с выдвижными зубцами; 2 — с восемью рублями, не зная русского; 3 — 14 машин на заводе Нобеля; 4 — с 1890 года, Петербург; 5 — около двух тысяч."
  ball: 10
  voprosy:
    - q: Что Однер поставил в арифмометр вместо тяжёлого ступенчатого валика?
      o:
        - Электрический мотор
        - Колесо с выдвижными зубцами
        - Костяшки, как на счётах
      a: 1
      e: "Колесо с девятью зубцами: рычажок выдвигает столько зубцов, какая цифра набрана. Машина стала маленькой, лёгкой и дешёвой."
    - q: С чем Однер приехал в Петербург осенью 1868 года?
      o:
        - С дипломом инженера и рекомендациями
        - С восемью рублями, не зная ни слова по-русски
        - С готовым арифмометром из Стокгольма
      a: 1
      e: Восемь рублей и ни слова по-русски. Диплома он так и не получил и всю жизнь называл себя механиком.
    - q: Сколько машин было в пробной партии на заводе Нобеля в 1877 году?
      o:
        - "14"
        - "140"
        - "1400"
      a: 0
      e: "Четырнадцать. Партия осталась без производства: изобретателя уволили, а Нобель вкладываться снова отказался."
    - q: Когда начался серийный выпуск арифмометров Однера?
      o:
        - В 1874 году, в Стокгольме
        - В 1890 году, в Петербурге
        - В 1948 году, в Курске
      a: 1
      e: "В 1890 году, в Петербурге: за первый год продали 500 машин. В 1874-м был первый образец, а в 1948-м Курск собрал первый свой «Феликс»."
    - q: Сколько арифмометров Тома, прежнего мирового стандарта, сделали за XIX век?
      o:
        - Около двух тысяч
        - Около миллиона
        - Около трёх миллионов
      a: 0
      e: Около двух тысяч. А «Феликсов» только в Курске к 1973 году выпустили три миллиона.
