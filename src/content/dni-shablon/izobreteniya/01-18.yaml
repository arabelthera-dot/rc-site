skripty:
  - js: |-
      // ── РАЗВИЛКА ──────────────────────────────────────────────────────────────────
      document.querySelectorAll('.fork-opt').forEach((el,i)=>{
        el.onclick=function(){
          document.querySelectorAll('.fork-opt').forEach(b=>b.classList.remove('chosen'));
          this.classList.add('chosen');
          document.getElementById('forkReal').style.display='block';
          award('fork',5);
        };
      });

      // ── ЧАТ ───────────────────────────────────────────────────────────────────────
      const kb=[
       {k:['колес','зубц','валик','устро','как работа'],a:'Все до меня строили арифмометры на ступенчатом валике Лейбница — машины Тома весили больше десяти килограммов. Я поставил колесо с девятью зубцами: рычажком набираешь цифру, и выдвигается ровно столько зубцов. Повернул ручку — число в счётчике. Машина вышла маленькая, лёгкая и дешёвая.'},
       {k:['восемь рубл','приехал','петербург','швец','стокгольм','институт','диплом'],a:'Отец мой, землемер, умер в 1863 году, нас осталось шестеро детей. Институт в Стокгольме я оставил после третьего курса, дома работы не нашёл и осенью 1868 года приехал в Петербург — с восемью рублями и без единого русского слова. Диплома так и не получил. Я механик, не инженер.'},
       {k:['нобел','уволи','1877','14 машин','партия'],a:'На заводе Людвига Нобеля мы собрали пробную партию — 14 машин. В 1877 году Нобель уехал надолго в Европу, и директора запретили мне даже показываться на заводе, а потом уволили. Партия осталась лежать. А в 1891 году «Товарищество братьев Нобель» уже считало на десяти моих арифмометрах.'},
       {k:['французск','тома','кольмар','почини','ремонт','сломан'],a:'Около 1871 года мне поручили отремонтировать французский арифмометр Тома де Кольмара. Разобрал его, увидел слабые места и решил: сделаю лучше. Скажу честно — хотелось разбогатеть. Жалованье маленькое, жена, пошли дети.'},
       {k:['деньг','банкнот','экспедици','нумер','орловск'],a:'После завода Нобеля я ушёл в Экспедицию заготовления государственных бумаг, где печатают деньги, и 14 лет руководил там отделом. Получил золотую медаль за улучшения, участвовал в создании орловской печати, которая защищает банкноты от подделки, и сделал машину для нумерации кредитных билетов.'},
       {k:['турникет','папирос','ещё изобрел','другие изобретен'],a:'Арифмометр — не единственное. Я придумал папиросную машину и турникеты — их потом ставили почти все пароходные компании России.'},
       {k:['завод','фабрик','1890','серия','гиль','мастерск'],a:'Мастерскую я открыл в 1887 году, а в 1890-м пустил машину в серию — за первый год продали 500 штук. Со службы ушёл в 1892-м. В 1893 году у меня работали 25 взрослых и десять детей, стояли 25 станков и нефтяной двигатель в четыре силы.'},
       {k:['чикаго','выставк','медал','наград'],a:'В 1893 году мой арифмометр получил высшую награду Всемирной выставки в Чикаго. Потом были медали в Брюсселе, Нижнем Новгороде, Стокгольме и Париже.'},
       {k:['брунсвиг','герман','лиценз','за границ'],a:'Немецкая фирма купила у меня лицензию и с 1892–1893 года делала машину под именем «Брунсвига». К 1912 году их выпустили 20 000. Так что «немецкий» арифмометр — тоже мой.'},
       {k:['феликс','дзержинск','курск','ссср','счётмаш','счетмаш'],a:'Я умер в 1905 году и «Феликса» не увидел. Но знаю, что машину возобновили в Москве в 1924–1925 годах, с конца 1920-х назвали «Феликсом», а в Курске к июню 1973-го выпустили три миллиона. Колесо осталось моё.'},
       {k:['калькулятор','дешев','дешёв','звонок','минус'],a:'Говорят, даже когда появились карманные калькуляторы, «Феликс» покупали: он был раз в десять дешевле. А уйдёшь в минус при вычитании — звенит звонок, чтобы счетовод не ошибся.'},
       {k:['первым','первый','1874','изобрел','придумал','трудил'],a:'После пятнадцатилетнего труда и постоянных улучшений мне удалось устроить аппарат, превосходящий значительно изобретённые моими предшественниками. Первый образец я собрал в Петербурге в 1873–1874 годах.'}
      ];

      function addMsg(text,who){
        const d=document.createElement('div');
        d.className='msg '+who;
        d.textContent=text;
        document.getElementById('chatBox').appendChild(d);
        d.scrollIntoView({behavior:'smooth'});
      }

      function findAnswer(q){
        q=q.toLowerCase();
        for(const item of kb){
          if(item.k.some(k=>q.includes(k.toLowerCase())))return item.a;
        }
        return 'Спросите точнее — о колесе с зубцами, о заводе Нобеля, о деньгах, которые я печатал, о Чикаго или о «Феликсе». Отвечу как было.';
      }

      function sendChat(){
        const inp=document.getElementById('chatInput');
        const q=inp.value.trim();
        if(!q)return;
        addMsg(q,'you');
        inp.value='';
        setTimeout(()=>{addMsg(findAnswer(q),'inv');award('chat',5);},600);
      }
      document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});

      // стартовые вопросы + приветствие (без прокрутки при загрузке)
      (function(){
        const qs=['Как устроено ваше колесо?','Почему вас уволили с завода Нобеля?','Откуда взялся «Феликс»?'];
        const box=document.getElementById('starters');
        qs.forEach(q=>{const c=document.createElement('span');c.className='chip';c.textContent=q;
          c.onclick=()=>{document.getElementById('chatInput').value=q;sendChat();};box.appendChild(c);});
        const w=document.createElement('div');w.className='msg inv';
        w.textContent='Здравствуйте. Вильгодт Однер, механик, Петербург. Спрашивайте — про мой арифмометр расскажу как было.';
        document.getElementById('chatBox').appendChild(w);
      })();

      // ── ТЕМАТИЧЕСКИЕ ИЗОБРЕТЕНИЯ ─────────────────────────────────────────────────
      const themeBtn=document.getElementById('themeInvBtn');
      if(themeBtn)themeBtn.onclick=function(){
        const b=document.getElementById('themeInvBody');
        const open=getComputedStyle(b).display==='none';
        b.style.display=open?'block':'none';
        this.textContent=open?'▲ Скрыть':this.dataset.label||'Показать перечень →';
        if(open)award('theme',5);
      };
