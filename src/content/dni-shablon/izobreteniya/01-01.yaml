story:
  kicker: История изобретения
  h2: Кабельное телевидение придумали не в Америке
  abzacy:
    - |-
      <div class="article collapsed" id="article">
            <div class="body">
              <p><b>Новый, 1939 год жильцы одного московского дома встретили как никто на планете.</b> В их квартирах стояли телевизоры, которым не нужна антенна: картинка приходила по кабелю из стены. Дом № 17 по Петровскому бульвару стал первым домом Земли с кабельным телевидением — в США такое появится только в 1948 году, на девять лет позже.</p>
    - <p class="pull">Первые 30 кабельных абонентов мира жили в одном подъездном списке.</p>
    - "<p><b>Кто жил в этом доме.</b> Дом был не простой: квартиры в нём занимали высокопоставленные военные и партийные руководители. Для них ленинградский НИИ телевидения и московский ЦНИИ связи спроектировали невиданную вещь — «Телевизионный трансляционный узел»: качественная приёмная аппаратура ловила сигнал телецентра, а дальше он расходился по кабелю в 30 квартир.</p>"
    - "<p><b>Телевизор без антенны.</b> В квартирах стояли специальные упрощённые приёмники АТП-1 — «абонентский телевизионный приёмник». Экран — круглый кинескоп диаметром 18 сантиметров, чуть больше блюдца. Ни антенны, ни сложной настройки — только кабель из стены. По сути, первый в мире «абонентский» телевизор: включил — и смотри. Выпускал их серийно Александровский радиозавод.</p>"
    - "<p><b>Зачем кабель, если есть эфир?</b> В конце 1930-х телевизионный приёмник был капризным и дорогим: слабый сигнал, помехи, ручная настройка. Кабельная схема решала всё разом — один качественный приёмный пункт на дом, и чистая картинка у всех абонентов. Ровно та логика, по которой кабельное ТВ десятилетия спустя завоюет мир.</p>"
    - <p><b>Судьба узла.</b> Сеть проработала с 1939-го до самой войны, в 1941-м замолчала — и ожила снова в 1946-м. Служила дому ещё десять лет, до 1956 года. Семнадцать лет работы у технологии, которую мир привык считать американским изобретением сороковых.</p>
    - "<p><b>Почему об этом никто не знает.</b> Узел обслуживал закрытый дом номенклатуры — в газетах о нём не писали. Американская сеть 1948 года родилась как коммерческая услуга и потому вошла во все учебники. Так бывает с нашими первенствами: сделали раньше — рассказали позже.</p>"
    - |-
      <p style="color:var(--gold-l);font-weight:600">А эта история — только начало: у отечественного телевидения были и другие «первые в мире».</p>
              <div style="text-align:center;margin:12px 0 4px">
                <button class="btn gold" id="toMore">Хочешь узнать подробности? →</button>
              </div>
            </div>
            <div class="more"><button class="btn ghost" id="moreBtn">Читать дальше ↓</button></div>
          </div>
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о первом телевидении
    h2: Ссылка Розинга и 625 строк
    udary:
      - summary: <b>Ученик из Америки.</b> Студент Розинга Зворыкин прославился телевидением в США — и помог привезти оттуда передатчик на Шуховскую башню.
        det:
          - В 1911 году профессор Петербургского технологического института Борис Розинг показал на электронно-лучевой трубке изображение геометрических фигур. «Фонтанка» называет это первым в мире электронным телевизионным изображением. Помогал ему студент Владимир Зворыкин.
          - После революции Зворыкин уехал в США и добился там больших успехов в электронном телевидении. При этом он никогда не скрывал, что начинал у Розинга. В 1933 году его, уже гражданина США, пригласили в СССР читать лекции о телевидении.
          - В конце 1930-х Москва купила передатчик у американской фирмы RCA, и помог в этом Зворыкин. Передатчик поставили на Шуховскую башню.
        src: "Источник: «Как профессор Розинг и студент Зворыкин изобретали телевидение», «Фонтанка.ру», 22.05.2017 — https://www.fontanka.ru/2017/05/22/017/ ; Г. Ольтаржевский, «Говорит и показывает Москва», «Известия», 05.11.2017 — https://iz.ru/667021/georgii-oltarzhevskii/govorit-i-pokazyvaet-moskva"
        otryvok: «Изобретение вернулось к нам в виде купленного у американской фирмы RCA передатчика, который приехал в СССР в конце 30-х , кстати, с помощью эмигранта Зворыкина. Установлен он был на знаменитой Шуховской башне.»
        stranica: Г. Олтаржевский, «Говорит и показывает Москва», «Известия», 5 ноября 2017
        href: https://iz.ru/667021/georgii-oltarzhevskii/govorit-i-pokazyvaet-moskva
        pometka: два источника
      - summary: <b>Трамвай на экране.</b> Ташкентец Грабовский в 1928-м вывел на экран едущий трамвай — это признали первой в мире электронной телепередачей.
        det:
          - Осенью 1925 года Борис Грабовский со своим проектом приехал в Ленинград к Розингу, и тот высоко оценил работу. Официальное испытание «Телефота» прошло в Ташкенте 26 июля 1928 года, в присутствии комиссии. Расстояние между передатчиком и приёмником было около 20 метров, и на экране было хорошо видно, как помощник изобретателя Белянский поворачивает голову и шевелит губами.
          - 4 августа 1928 года приёмник поставили на крыльце кинотеатра «Хива». На экране впервые появился ташкентский трамвай, который шёл по Алексеевскому переулку и Ленинградской улице. Признали это не сразу.
          - "На другой заявке Грабовского, на «радиоосциллограф», осталась резолюция: «Отказать. Противоречит законам природы». В 1971 году Международный союз прессы по радиотехнике и электронике выдал свидетельство о заслугах Грабовского и Белянского."
        src: "Источник: «Документы личного фонда Б. П. Грабовского по истории телевидения», журнал «Вестник архивиста», 10.09.2009 — https://www.vestarchive.ru/arhivovedenie/707--n-e-.html"
        otryvok: «26 июля и 4 августа 1929 г. в Ташкенте - даты событий, положивших начало целой эре в истории человечества -эре телевидения. Группе изобретателей во главе с Борисом Павловичем Грабовским впервые удалось передать и получить на экране телефотоизображение движущегося ташкентского трамвая!»
        stranica: «Документы личного фонда Б.П. Грабовского по истории телевидения», журнал «Вестник архивиста», 10 сентября 2009
        href: https://www.vestarchive.ru/arhivovedenie/707--n-e-.html
        pometka: документ
      - summary: <b>Слово на весь мир.</b> Слово «телевидение» придумал русский профессор Перский — в 1900-м в Париже, и оно прижилось во всём мире.
        det:
          - В 1900 году в Париже шла Всемирная выставка, и в её рамках прошёл электротехнический конгресс. Там профессор Константин Перский прочитал доклад «Современное состояние вопроса об электровидении на расстоянии».
          - "В нём он предсказал новую эру и предложил слово, которым мы пользуемся до сих пор. Самого телевидения тогда ещё не было: Розинг покажет первое электронное изображение только через 11 лет."
        src: "Источник: «История телевидения», сайт телеканала «Санкт-Петербург» (телецентр на Чапыгина, 6) — https://spbtv.ru/about ; о конгрессе 1900 года — «„Есть сигнал!“ Как к нам пришло телевидение», «История.РФ» (РВИО) — https://histrf.ru/teacher/vseobshchaya-istoriya-2/dopolnitelnye-materialy-k-periodu-1945-nachalo-xxi-veka-vseobshchaya-istoriya/article/oks"
        otryvok: «За слово «телевидение» принято благодарить русского изобретателя, профессора Константина Перского. В 1900 году в Париже он сделал доклад «Современное состояние вопроса об электровидении на расстоянии», в котором предсказал новую эру и предложил прижившийся во всем мире термин.»
        stranica: Телеканал «Санкт-Петербург», «История телевидения» (раздел «Сначала было слово», 1900), spbtv.ru
        href: https://spbtv.ru/about
        pometka: документ
      - summary: <b>Лёд для диктора.</b> В первой ленинградской телестудии было до 40 градусов — дикторы держали наготове лёд, чтобы не упасть в обморок.
        det:
          - Ленинградское телевидение вышло в эфир 7 июля 1938 года. Студия занимала половину комнаты площадью 54 квадратных метра, а камера стояла на неподвижном штативе. Техника так грела студию, что там бывало до 40 градусов.
          - "Чтобы сменить кадр, объектив просто закрывали чёрным листом картона. Тем же летом начались регулярные передачи, по два часа раз в неделю, и в одной из них танцевала Галина Уланова. Москва покупала американское оборудование, а Ленинград пошёл своим путём: аппаратуру разработали в лабораториях ленинградских институтов, картинка была в 240 строк."
        src: "Источник: «История телевидения», сайт телеканала «Санкт-Петербург» — https://spbtv.ru/about ; «Ленинградское телевидение отмечает своё 70-летие», «Лениздат.ру» — https://lenizdat.ru/articles/1064065/"
        otryvok: «Температура в ней доходила до 40 градусов из-за нагревающейся техники, дикторы держали наготове лед, чтобы внезапно не упасть в обморок от жары.»
        stranica: Телеканал «Санкт-Петербург», «История телевидения» (раздел 1938), spbtv.ru
        href: https://spbtv.ru/about
        pometka: документ
      - summary: <b>Взорвать башню.</b> В 1941-м Щетинину велели взорвать Шуховскую башню — он не взорвал, и в мае 1945-го с неё первой в Европе вернулось ТВ.
        det:
          - С 1937 года с Шуховской башни шли опытные телепередачи. В 1939 году на ней стоял телепередатчик, и в день первой трансляции его принимали в Москве 100 телевизоров ТК-1. В том же 1939 году почтовый самолёт задел крылом один из тросов башни.
          - Она выдержала, и ремонт не понадобился. В ноябре 1941 года немецкие войска подошли вплотную к Москве. Башню заминировали, а начальнику московской телевизионной лаборатории Александру Щетинину поручили взорвать её лично.
          - За невыполнение приказа ему грозили серьёзные последствия, но он дождался, пока врага отбросят. 7 мая 1945 года, накануне вступления в силу капитуляции Германии, с этой башни вышла первая в Европе телепередача с начала войны.
        src: "Источник: «Шуховская башня», проект «Узнай Москву», mos.ru — https://um.mos.ru/houses/shukhovskaya-bashnya/"
        otryvok: «В ноябре 1941 года, когда войска вермахта подошли вплотную к Москве, начальнику Московской телевизионной филиал-лаборатории Министерства связи Александру Щетинину было поручено лично взорвать Шуховскую башню, которая была предварительно заминирована.»
        stranica: «Шуховская башня», портал «Узнай Москву» (um.mos.ru)
        href: https://um.mos.ru/houses/shukhovskaya-bashnya/
        pometka: документ
      - summary: <b>Отца электронного телевидения Розинга в 1931-м сослали на Север — домой он так и не вернулся.</b>
        det:
          - Борис Розинг показал изображение на электронной трубке ещё в 1911 году. Но в 1931 году учёного без всяких оснований арестовали и выслали на север.
          - В Петербург он больше не вернулся. Розинг умер в апреле 1933 года в Архангельске, в ссылке, — всего через два года после того, как в Москве начались регулярные опытные телепередачи.
        src: 'Источник: Н. Борисова, «Борис Львович Розинг: у истоков электронного телевидения», журнал «Первая миля», № 8/2019 — <a href="https://www.lastmile.su/journal/article/8011" rel="noopener">www.lastmile.su/journal/article/8011</a>.'
        otryvok: «В 1931 году ученый был необоснованно репрессирован и выслан на север; он скончался в апреле 1933 года в Архангельске.»
        stranica: "Н. Борисова, «Борис Львович Розинг: у истоков электронного телевидения», журнал «Первая миля», № 8/2019"
        href: https://www.lastmile.su/journal/article/8011
        pometka: документ
      - summary: <b>Московский телецентр первым в мире перешёл на 625 строк — и за ним потянулись страны Европы.</b>
        det:
          - Чем больше строк, тем чётче картинка. 3 сентября 1948 года Московский телецентр на Шаболовке первым в мире начал передачи с изображением из 625 строк.
          - Переключить телецентр на новый стандарт и выйти в эфир доверили молодому инженеру Марку Кривошееву, ему было всего 26 лет. Вслед за СССР на 625 строк стали переходить европейские страны и многие другие государства.
        src: 'Источник: Редакция журнала «Электросвязь», «Корифей отечественного телевидения», сайт «Виртуальный компьютерный музей» — <a href="https://www.computer-museum.ru/connect/krivoshe.htm" rel="noopener">www.computer-museum.ru/connect/krivoshe.htm</a>; Л. С. Лейтес, «60 лет регулярного электронного телевизионного вещания в Москве», «Электросвязь», № 12, 1999 — <a href="https://www.computer-museum.ru/connect/mostv60.htm" rel="noopener">www.computer-museum.ru/connect/mostv60.htm</a>.'
        otryvok: "«3 сентября 1948 г. вошло знаменательной страницей в историю техники телевизионного ТВ вещания: Московский телецентр (МТЦ), впервые в мире, начал передачу телевизионных программ с разложением изображения на 625 строк.»"
        stranica: Редакция журнала «Электросвязь», «Корифей отечественного телевидения», сайт «Виртуальный компьютерный музей»
        href: https://www.computer-museum.ru/connect/krivoshe.htm
        pometka: два источника
      - summary: <b>Розинг получил патент на своё телевидение в Англии и Германии раньше, чем в родной России.</b>
        det:
          - В 1907 году Борис Розинг подал заявку на «Способ электрической передачи изображений». Это был будущий принцип электронного телевидения.
          - Первым патент выдали в Великобритании — в 1908 году, затем в Германии — в 1909-м. А русский патент Розинг получил только в 1910 году, позже всех.
        src: 'Источник: Н. Борисова, «Борис Львович Розинг: у истоков электронного телевидения», журнал «Первая миля», № 8/2019 — <a href="https://www.lastmile.su/journal/article/8011" rel="noopener">www.lastmile.su/journal/article/8011</a>.'
        otryvok: «Новый способ электрической передачи изображений был запатентован ученым не только в России (патент от 30.10.1910), но и в Великобритании (патент от 25.06.1908) и Германии (патент от 24.04.1909).»
        stranica: "Н. Борисова, «Борис Львович Розинг: у истоков электронного телевидения», журнал «Первая миля», № 8/2019"
        href: https://www.lastmile.su/journal/article/8011
        pometka: документ
      - summary: <b>Инженер Катаев заявил свою передающую трубку на полтора месяца раньше, чем похожую — в США.</b>
        det:
          - 24 сентября 1931 года молодой инженер Семён Катаев подал заявку на «устройство для передачи движущихся изображений». Это была трубка, которая копит заряды и даёт яркую, чёткую картинку.
          - Знаменитую американскую трубку такого же типа заявили примерно через полтора месяца. Но авторское свидетельство № 29865 Катаев получил только весной 1933 года.
        src: 'Источник: В. Мишецкий, «Иконоскоп телевидения», «Совершенно секретно», 10.11.2016 — <a href="https://www.sovsekretno.ru/articles/istoriya/ikonoskop-televideniya/" rel="noopener">www.sovsekretno.ru/articles/istoriya/ikonoskop-televideniya</a>; Л. С. Лейтес, «Отечественные ученые и специалисты — изобретатели и конструкторы телевизионных передающих трубок», «Очерки истории отечественного телевидения», computer-museum.ru — <a href="https://www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/660/" rel="noopener">www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/660</a>.'
        otryvok: «патентная заявка на иконоскоп была подана на полтора месяца раньше Зворыкина советским инженером Семёном Катаевым (Авторское свидетельство СССР № 29.865 от 30 апреля 1933 года)»
        stranica: В. Мишецкий, «Иконоскоп телевидения», «Совершенно секретно», 10.11.2016
        href: https://www.sovsekretno.ru/articles/istoriya/ikonoskop-televideniya/
        pometka: два источника
      - summary: <b>Идею Брауде 1938 года воплотили только через восемь лет — и уже в чужой стране.</b>
        det:
          - "В 1938 году ленинградский инженер Григорий Брауде придумал, как сделать передающую телекамеру намного чувствительнее: заряды должна копить особая мишень, работающая с двух сторон."
          - Эта мишень стала главной частью новой трубки — суперортикона. Но собрали такую трубку не у нас, а в США, в 1946 году, через восемь лет после изобретения Брауде.
        src: 'Источник: Л. С. Лейтес, «Отечественные ученые и специалисты — изобретатели и конструкторы телевизионных передающих трубок», «Очерки истории отечественного телевидения», computer-museum.ru — <a href="https://www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/660/" rel="noopener">www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/660</a>.'
        otryvok: «Реализация предложения Г. В. Брауде нашла воплощение в новом классе передающих трубок типа суперортикон (изготовлен в США в 1946 г.).»
        stranica: Л. С. Лейтес, «Отечественные ученые и специалисты — изобретатели и конструкторы телевизионных передающих трубок», «Очерки истории отечественного телевидения», computer-museum.ru
        href: https://www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/660/
        pometka: документ
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Экран с марку и телевизор своими руками
    udary:
      - summary: <b>Экран серийного телевизора Б-2 был размером с почтовую марку — 16 на 12 миллиметров.</b>
        det:
          - "Телевизор Б-2 был маленькой коробкой, а картинка в нём — крошечной: 16 на 12 миллиметров. Её крутил вращающийся диск с дырочками."
          - Чтобы хоть что-то разглядеть, ставили линзу — и изображение вырастало всего до 32 на 24 миллиметра. Главным конструктором был А. Я. Брейтбарт, телевизор выпускал ленинградский завод имени Козицкого.
        src: 'Источник: Л. С. Лейтес, «Малострочное механическое ТВ-вещание из Москвы», «Очерки истории отечественного телевидения», computer-museum.ru — <a href="https://www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/656/" rel="noopener">www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/656</a>.'
        otryvok: «В серийном массовом малогабаритном (230 х 216 х 160 мм) телевизоре «Б-2» завода им. Козицкого (главный конструктор А. Я. Брейтбарт, выпускался с начала 1936 г.) размер изображения составлял 16 х 12 мм»
        stranica: Л. С. Лейтес, «Малострочное механическое ТВ-вещание из Москвы», «Очерки истории отечественного телевидения», computer-museum.ru
        href: https://www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/656/
        pometka: документ
      - summary: <b>Чтобы настроить советский электронный телевизор ТК-1 1938 года, крутили 14 ручек.</b>
        det:
          - Телевизор ТК-1 выпустил ленинградский завод имени Козицкого в 1938 году. Это был огромный ящик высотой больше метра с экраном 14 на 18 сантиметров.
          - Трубка стояла в нём вертикально, поэтому картинку смотрели в зеркале, встроенном в крышку. А для хорошей настройки приходилось регулировать 14 ручек. Сегодня ТК-1 хранится в Музее связи имени Попова как памятник науки и техники.
        src: 'Источник: «Телевизионный приемник «ТК-1»», Центральный музей связи имени А. С. Попова — <a href="https://www.rustelecom-museum.ru/specialists/monuments/televizionnyy-priemnik-tk-1/" rel="noopener">www.rustelecom-museum.ru/specialists/monuments/televizionnyy-priemnik-tk-1</a>.'
        otryvok: «Для качественной настройки приходилось регулировать 14 ручек»
        stranica: «Телевизионный приемник «ТК-1»», Центральный музей связи имени А. С. Попова
        href: https://www.rustelecom-museum.ru/specialists/monuments/televizionnyy-priemnik-tk-1/
        pometka: документ
      - summary: <b>Первые телезрители делали телевизор сами — диск крутили приводом от швейной машинки.</b>
        det:
          - В начале 1930-х телевизоров в магазинах почти не было, и любители собирали их сами. Главной деталью был вращающийся диск с дырочками.
          - Журнал «Радиофронт» советовал ставить этот диск на привод от швейной машинки и крутить ручку со скоростью 50 оборотов в минуту. На всю Москву тогда было около трёх десятков телевизоров, и в основном самодельных.
        src: 'Источник: А. Байков, «Диски, трубки и Шаболовка: как зарождалось советское телевидение», «Москва 24», 25.03.2016 — <a href="https://www.m24.ru/articles/gorod/25032016/100893" rel="noopener">www.m24.ru/articles/gorod/25032016/100893</a>.'
        otryvok: «„Радио Фронт“, к примеру, рекомендовал любителям телевидения устанавливать диск на привод от швейной машинки и крутить ручку со скоростью 50 оборотов в минуту.»
        stranica: "А. Байков, «Диски, трубки и Шаболовка: как зарождалось советское телевидение», «Москва 24», 25.03.2016"
        href: https://www.m24.ru/articles/gorod/25032016/100893
        pometka: документ
      - summary: <b>Супериконоскоп Шмакова и Тимофеева позволил вдвое приглушить жаркий свет в телестудиях.</b>
        det:
          - Первые телекамеры видели плохо, и студию заливали светом мощных ламп. В 1933 году Павел Шмаков и П. В. Тимофеев придумали новую, более чувствительную трубку — супериконоскоп.
          - Когда камеры с этими трубками пришли в студии, освещение там удалось снизить больше чем в два раза.
        src: 'Источник: Л. С. Лейтес, «Отечественные ученые и специалисты — изобретатели и конструкторы телевизионных передающих трубок», «Очерки истории отечественного телевидения», computer-museum.ru — <a href="https://www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/660/" rel="noopener">www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/660</a>.'
        otryvok: «Освещенность в студиях снизилась более чем в два раза.»
        stranica: Л. С. Лейтес, «Отечественные ученые и специалисты — изобретатели и конструкторы телевизионных передающих трубок», «Очерки истории отечественного телевидения», computer-museum.ru
        href: https://www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/660/
        pometka: документ
      - summary: <b>Первую звуковую телепередачу в СССР открыл великий актёр Москвин — чеховским «Злоумышленником».</b>
        det:
          - "15 ноября 1934 года в СССР прошла первая телепередача со звуком. Дикторы обращались к зрителям так: «Товарищи радиозрители»."
          - Первым в эфир вышел знаменитый актёр МХАТа Иван Москвин. Он прочитал смешной рассказ Чехова «Злоумышленник» — про мужика, который откручивал гайки с железной дороги.
        src: 'Источник: Е. Зайцева, «90 лет назад советские „радиозрители“ посмотрели первую звуковую телепередачу», «Родина», 15.11.2024 — <a href="https://rodina-history.ru/2024/11/15/90-let-nazad-sovetskie-radiozriteli-posmotreli-pervuiu-zvukovuiu-teleperedachu.html" rel="noopener">rodina-history.ru/2024/11/15/90-let-nazad-sovetskie-radiozriteli-posmotreli-pervuiu-zvukovuiu-teleperedachu.html</a>; Л. С. Лейтес, «Малострочное механическое ТВ-вещание из Москвы», computer-museum.ru — <a href="https://www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/656/" rel="noopener">www.computer-museum.ru/articles/ocherki-istorii-otechestvennogo-televideniya/656</a>.'
        otryvok: «15 ноября 1934 года состоялся показ первой в СССР звуковой передачи.»
        stranica: Е. Зайцева, «90 лет назад советские „радиозрители“ посмотрели первую звуковую телепередачу», «Родина», 15.11.2024
        href: https://rodina-history.ru/2024/11/15/90-let-nazad-sovetskie-radiozriteli-posmotreli-pervuiu-zvukovuiu-teleperedachu.html
        pometka: два источника
razdely:
  - posle: daynav
    html: |-
      <!-- живая сцена дня (была сверху; обложка — фото выше, Р231) -->
      <div class="hero-scene" id="hero">
        <canvas id="hero3d" class="scene" aria-label="3D-визуализация телевизора АТП-1"></canvas>
      </div>

      <div class="scene-caption">
        <div class="wrap">
          <div class="scene-cap">Так могло выглядеть: вечер, московская квартира. На круглом кинескопе АТП-1 — эфир Шуховской башни: сигнал пришёл не с антенны на крыше, а по кабелю из подвала.</div>
          <span class="scene-hint">3D · телевизор АТП-1</span>
        </div>
      </div>
      <script type="module">
      import * as THREE from '/assets/vendor/three.module.min.js';
      const cv=document.getElementById('hero3d');
      if(cv){ try{
        const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
        renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
        renderer.outputColorSpace=THREE.SRGBColorSpace;
        const scene=new THREE.Scene();
        scene.fog=new THREE.FogExp2(0xdfe6ec,0.014);
        const camera=new THREE.PerspectiveCamera(45,1,0.1,120);
        camera.position.set(0,0.4,7);

        // --- вспомогалка: холст-градиент ---
        function gradTex(stops){const c=document.createElement('canvas');c.width=16;c.height=256;const g=c.getContext('2d');const lg=g.createLinearGradient(0,0,0,256);stops.forEach(s=>lg.addColorStop(s[0],s[1]));g.fillStyle=lg;g.fillRect(0,0,16,256);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
        function blobTex(col){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const rg=g.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);}

        // --- небо ---
        const sky=new THREE.Mesh(new THREE.SphereGeometry(60,32,16),
          new THREE.MeshBasicMaterial({map:gradTex([[0,'#0a1730'],[0.55,'#122448'],[0.85,'#23355c'],[1,'#3a4a6e']]),side:THREE.BackSide,fog:false,depthWrite:false}));
        scene.add(sky);
        scene.fog=new THREE.FogExp2(0x101c34,0.012);
        // луна (свечение)
        const sunS=new THREE.Sprite(new THREE.SpriteMaterial({map:blobTex('rgba(220,232,255,0.9)'),blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,fog:false}));
        sunS.scale.set(9,9,1); sunS.position.set(4.2,7.5,-15); scene.add(sunS);
        const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:blobTex('rgba(190,210,255,0.35)'),blending:THREE.AdditiveBlending,depthTest:false,depthWrite:false,fog:false}));
        glow.scale.set(20,20,1); glow.position.set(4.2,7.5,-16); scene.add(glow);

        // --- свет (вечерний, тёплый от экрана) ---
        scene.add(new THREE.HemisphereLight(0x9db4d8,0x2a2418,0.7));
        const key=new THREE.DirectionalLight(0xcfe0ff,0.9); key.position.set(-5,5,4); scene.add(key);
        const rim=new THREE.DirectionalLight(0xffd9a0,0.8); rim.position.set(4,2,-4); scene.add(rim);
        const tvLight=new THREE.PointLight(0xbfe4ff,2.2,10); tvLight.position.set(0,0.4,1.6); scene.add(tvLight);

        const para=new THREE.Group(); scene.add(para);
        // === Ретро-телевизор АТП-1 (1939) ===
        const woodMat=new THREE.MeshPhysicalMaterial({color:0x5a3a22,roughness:0.55,clearcoat:0.5,clearcoatRoughness:0.35});
        const woodDark=new THREE.MeshPhysicalMaterial({color:0x3e2716,roughness:0.6,clearcoat:0.35});
        // корпус
        const cab=new THREE.Mesh(new THREE.BoxGeometry(2.9,2.2,1.5),woodMat); para.add(cab);
        const face=new THREE.Mesh(new THREE.BoxGeometry(2.62,1.94,0.1),woodDark); face.position.z=0.76; para.add(face);
        // круглый экран-кинескоп: живая текстура с мерцанием и строками
        const scrC=document.createElement('canvas'); scrC.width=scrC.height=256;
        const scrG=scrC.getContext('2d'); const scrTex=new THREE.CanvasTexture(scrC); scrTex.colorSpace=THREE.SRGBColorSpace;
        function paintScreen(t){
          const g2=scrG.createRadialGradient(128,118,10,128,128,130);
          g2.addColorStop(0,'#dff2ff');g2.addColorStop(0.55,'#7fb7d8');g2.addColorStop(1,'#1d3a4e');
          scrG.fillStyle=g2;scrG.fillRect(0,0,256,256);
          scrG.fillStyle='rgba(10,25,35,0.28)';
          for(let y=(t*30)%4;y<256;y+=4)scrG.fillRect(0,y,256,1.4);          // строчная развёртка
          const fl=0.10+0.06*Math.sin(t*9)+0.04*Math.sin(t*23);               // мерцание
          scrG.fillStyle='rgba(230,245,255,'+fl+')';scrG.fillRect(0,0,256,256);
          // силуэт Шуховской башни в эфире
          scrG.strokeStyle='rgba(16,40,54,0.85)';scrG.lineWidth=3;scrG.beginPath();
          scrG.moveTo(104,190);scrG.lineTo(120,66);scrG.lineTo(136,66);scrG.lineTo(152,190);
          scrG.moveTo(104,190);scrG.lineTo(152,150);scrG.moveTo(152,190);scrG.lineTo(104,150);
          scrG.moveTo(106,168);scrG.lineTo(150,168);scrG.stroke();
          scrTex.needsUpdate=true;}
        paintScreen(0);
        const screen=new THREE.Mesh(new THREE.CircleGeometry(0.72,48),
          new THREE.MeshBasicMaterial({map:scrTex,fog:false}));
        screen.position.set(-0.35,0.12,0.83); para.add(screen);
        const bezel=new THREE.Mesh(new THREE.TorusGeometry(0.74,0.055,14,48),
          new THREE.MeshStandardMaterial({color:0xc8a24a,metalness:0.75,roughness:0.3}));
        bezel.position.copy(screen.position); para.add(bezel);
        // панель с ручками
        const knobMat=new THREE.MeshStandardMaterial({color:0xd8b25e,metalness:0.7,roughness:0.35});
        [[-0.05,0],[0.25,0],[0.55,0]].forEach((k,i)=>{
          const kn=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.1,20),knobMat);
          kn.rotation.x=Math.PI/2; kn.position.set(0.75+ (i-1)*0.32, -0.55, 0.84); para.add(kn);});
        const grille=new THREE.Mesh(new THREE.PlaneGeometry(0.72,0.7),
          new THREE.MeshStandardMaterial({color:0x2c1c10,roughness:0.9}));
        grille.position.set(0.75,0.25,0.815); para.add(grille);
        for(let i=0;i<5;i++){const bar=new THREE.Mesh(new THREE.BoxGeometry(0.72,0.05,0.02),woodMat);
          bar.position.set(0.75,0.52-i*0.135,0.83); para.add(bar);}
        // ножки
        [[-1.15,-1.32],[1.15,-1.32]].forEach(p=>{const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.06,0.5,14),woodDark);
          leg.position.set(p[0],p[1],0.3); para.add(leg);
          const leg2=leg.clone(); leg2.position.z=-0.3; para.add(leg2);});
        // КАБЕЛЬ — главный герой дня: провод уходит из корпуса вглубь сцены
        const cablePts=[]; for(let i=0;i<=40;i++){const s=i/40;
          cablePts.push(new THREE.Vector3(1.45+s*3.6, -1.05+Math.sin(s*Math.PI)*0.55-s*0.3, -0.2-s*2.2));}
        const cableGeo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cablePts),40,0.045,10,false);
        const cable=new THREE.Mesh(cableGeo,new THREE.MeshStandardMaterial({color:0x1a1a20,roughness:0.6}));
        para.add(cable);
        // бегущий по кабелю «сигнал» — светящаяся точка
        const sig=new THREE.Sprite(new THREE.SpriteMaterial({map:blobTex('rgba(160,220,255,0.95)'),blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
        sig.scale.set(0.55,0.55,1); para.add(sig);
        const cableCurve=new THREE.CatmullRomCurve3(cablePts);

        // --- облака ---
        const clouds=[];
        for(let i=0;i<7;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:blobTex('rgba(255,255,255,0.55)'),transparent:true,opacity:0.5,depthWrite:false,fog:false}));
          const sc=6+Math.random()*6; s.scale.set(sc,sc*0.6,1);
          s.position.set(-16+Math.random()*32, 3+Math.random()*5, -20+Math.random()*10);
          scene.add(s); clouds.push(s);}

        // --- реальные фото как парящие панели ---
        const gallery=[]; const loader=new THREE.TextureLoader();
        const photos=[]; // реальных фото АТП-1 в свободном доступе нет — сцена живёт телевизором и сигналом
        photos.forEach((p,idx)=>{loader.load(p.f,tex=>{tex.colorSpace=THREE.SRGBColorSpace;
          const ar=(tex.image.width||1)/(tex.image.height||1); const h=1.55,w=h*ar;
          const g=new THREE.Group();
          g.add(new THREE.Mesh(new THREE.PlaneGeometry(w+0.1,h+0.1),new THREE.MeshStandardMaterial({color:0x16233c,roughness:0.5})));
          const pic=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,fog:false})); pic.position.z=0.02; g.add(pic);
          g.userData={a:idx/photos.length*Math.PI*2, yy:-0.9+idx*0.35};
          scene.add(g); gallery.push(g);
        },undefined,()=>{});});

        // параллакс
        let tx=0,ty=0;
        window.addEventListener('pointermove',e=>{tx=e.clientX/window.innerWidth-0.5;ty=e.clientY/window.innerHeight-0.5;});
        function resize(){const w=cv.clientWidth,h=cv.clientHeight;if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
        new ResizeObserver(resize).observe(cv); resize();

        const t0=performance.now();
        (function loop(){const t=(performance.now()-t0)/1000;
          // экран живёт: развёртка + мерцание
          paintScreen(t);
          tvLight.intensity=1.8+0.5*Math.sin(t*9)+0.3*Math.sin(t*23);
          // сигнал бежит по кабелю к телевизору
          const sp=cableCurve.getPoint(1-((t*0.35)%1)); sig.position.copy(sp);
          para.rotation.y=Math.sin(t*0.25)*0.28+tx*0.5;
          para.rotation.z=-tx*0.06;
          para.position.y=Math.sin(t*0.7)*0.06;
          clouds.forEach((c,i)=>{c.position.x+=0.006+i*0.001; if(c.position.x>17)c.position.x=-17;});
          gallery.forEach((g,i)=>{const a=g.userData.a+t*0.09; g.position.set(Math.cos(a)*4.9,g.userData.yy+Math.sin(t*0.5+i)*0.12,Math.sin(a)*4.9-0.6); g.lookAt(camera.position);});
          camera.position.x=tx*0.9; camera.position.y=0.4-ty*0.4; camera.lookAt(0,0.3,0);
          renderer.render(scene,camera); requestAnimationFrame(loop);
        })();
      }catch(e){ console.warn('3D hero недоступен:',e); } }
      </script>
  - posle: story
    html: |-
      <section class="block" id="more">
        <div class="wrap">
          <div class="kicker">Подробности</div>
          <h2>Как это было устроено</h2>
          <p style="color:var(--muted);margin-top:0">Первая кабельная сеть мира — в деталях.</p>
          <div style="text-align:center;margin:10px 0 2px">
            <button class="btn gold" id="moreInv2">🔎 Раскрыть подробности</button>
          </div>

          <div id="moreInvBody" style="display:none;margin-top:18px">

            <div class="card">
              <h3 style="font-size:20px;color:var(--gold-l);margin-bottom:6px">АТП-1 — телевизор-«блюдце»
                <span style="display:inline-block;background:#e7f5e9;color:#1f5b2c;border:1px solid #3f9b52;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;vertical-align:middle">✓ факт</span></h3>
              <p>«Абонентский телевизионный приёмник» — специально упрощённая модель: круглый кинескоп диаметром <b>18 сантиметров</b>, никакой антенны и эфирной настройки — только кабель. Серийно выпускался Александровским радиозаводом. По сути — первый в мире телевизор, задуманный именно как абонентское устройство кабельной сети.</p>
            </div>

            <div class="card">
              <h3 style="font-size:20px;color:var(--gold-l);margin-bottom:6px">Кто построил узел
                <span style="display:inline-block;background:#e7f5e9;color:#1f5b2c;border:1px solid #3f9b52;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;vertical-align:middle">✓ факт</span></h3>
              <p>Проект делали два института: <b>НИИ телевидения (Ленинград)</b> и <b>ЦНИИ связи (Москва)</b>. Схема на десятилетия вперёд: один качественный приёмный пункт на здание — кабельная разводка — простые приёмники в квартирах. Так сегодня устроена любая кабельная сеть мира.</p>
              <p class="pull">Схема 1938 года совпадает с современной кабельной сетью один в один.</p>
            </div>

            <div class="card">
              <h3 style="font-size:20px;color:var(--gold-l);margin-bottom:6px">17 лет службы
                <span style="display:inline-block;background:#e7f5e9;color:#1f5b2c;border:1px solid #3f9b52;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;vertical-align:middle">✓ факт</span></h3>
              <p>Узел приняли в эксплуатацию <b>1 января 1939 года</b>. Работал до 1941-го, замолчал на войну — и снова ожил в 1946-м. Окончательно выключен только в <b>1956 году</b>, когда телевизоры уже стояли в сотнях тысяч советских квартир.</p>
            </div>

            <div class="card">
              <h3 style="font-size:20px;color:var(--gold-l);margin-bottom:6px">А что же Америка?
                <span style="display:inline-block;background:#e7f5e9;color:#1f5b2c;border:1px solid #3f9b52;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;vertical-align:middle">✓ факт</span></h3>
              <p>Первая кабельная телесеть США появилась в <b>1948 году</b> в Пенсильвании — торговец телевизорами Джон Уолсон тянул кабель, чтобы продавать приёмники в городке, до которого не добивал эфир. Это на <b>9 лет позже</b> московского узла. Но американская сеть была коммерческой и открытой — потому мир запомнил её.</p>
            </div>

            <div class="card" style="border-color:var(--gold);background:var(--gold-g)">
              <h3 style="font-size:20px;color:var(--gold-l);margin-bottom:6px">Почему первенство осталось в тени
                <span style="display:inline-block;background:#e7f5e9;color:#1f5b2c;border:1px solid #3f9b52;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;vertical-align:middle">✓ факт</span></h3>
              <p>Дом на Петровском бульваре был закрытым — о его «телевизионном чуде» не написала ни одна газета. Сделали первыми, рассказали последними: типичная судьба многих наших первенств, и одна из причин, почему существует этот музей.</p>
            </div>

            <div class="card" style="border-color:var(--gold);background:var(--gold-g)">
              <h3 style="font-size:20px;color:var(--gold-l);margin-bottom:10px">А что ещё русские изобрели в телевидении?</h3>
              <ol style="margin:0;padding-left:20px;line-height:2;color:var(--ink)">
                <li><b>Электронное телевидение</b> — Борис Розинг в 1907 году подал заявку на передачу изображения с помощью электронно-лучевой трубки; патенты он получил в Великобритании (1908), Германии (1909) и России (1910).</li>
                <li><b>Первый телевизионный фильм</b> — в 1931 году СССР снял первый в мире телевизионный игровой фильм «Глаза, которые видят».</li>
                <li><b>Спутниковое телевидение</b> — советский спутник «Молния-1» (1965) стал первым в мире спутником для трансляции телевидения на всю страну. Система «Орбита» охватила самые отдалённые районы планеты.</li>
                <li><b>Цветное телевидение через спутник</b> — первая в мире трансляция цветного ТВ через спутник состоялась в СССР в 1967 году.</li>
                <li><b>Негорючая плёнка</b> — советские инженеры первыми разработали безопасную негорючую киноплёнку для телевизионного вещания, заменив опасный целлулоид.</li>
              </ol>
            </div>

          </div>
        </div>
      </section>
  - posle: story
    html: |-
      <section class="block" id="fork" style="background:rgba(45,140,191,.04)">
        <div class="wrap">
          <h2 style="margin-bottom:8px">А как поступил бы ты?</h2>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">1938 год. Ты — инженер узла. Сеть построена и работает, дом смотрит телевидение по кабелю — первый на планете. Но дом закрытый: о вашем «первом в мире» нельзя рассказать ни в одной газете. Что делаешь?</p>
          <div id="forkBox" style="margin-top:14px"></div>
          <div id="forkReal" class="exp" style="margin-top:12px;border-left:3px solid var(--gold)">
            <b>Как было на самом деле.</b> Инженеры работали молча: узел так и остался закрытой «услугой» дома на Петровском бульваре — без публикаций и наград. Сеть честно отслужила семнадцать лет, до 1956 года. А первенство страна вспомнила лишь десятилетия спустя, когда весь мир уже называл кабельное телевидение американским изобретением 1948 года.
          </div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="chat-sec">
        <div class="wrap">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap">
            <h2 style="margin:0">Спроси инженера узла</h2>
          </div>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">Задай вопрос вымышленному инженеру телевизионного узла на Петровском бульваре — программа ответит про устройство узла, приёмники АТП-1 и судьбу сети. Ответы — пересказ по источникам дня.</p>
          <div id="chat" class="card" style="min-height:120px"></div>
          <div id="suggest" style="margin:8px 0"></div>
          <div style="display:flex;gap:8px">
            <input id="cin" placeholder="Спроси изобретателя…" style="flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px">
            <button class="btn" id="csend">Спросить</button>
          </div>
        </div>
      </section>
