return:
  q: Борис Розинг, чей патент 1907 года упомянут на этой странице, 9 мая 1911 года впервые в мире принял изображение на экране электронно-лучевой трубки. Что было на этом первом телевизионном «кадре»?
  a: Решётка — четыре светлые полосы на тёмном фоне. В записной книжке Розинг отметил «отчётливое изображение, состоявшее из четырёх светлых полос». Передачу видели члены Русского технического общества.
  src: "Н. Борисова, «Борис Львович Розинг: у истоков электронного телевидения», журнал «Первая миля», 2019; «Электрический глаз. Русский учёный первым провёл телевизионную передачу», «Аргументы и факты», 09.05.2021"
audioguide:
  audioSrc: audio-guide-cabletv-ru.mp3
  durationLabel: 6 минут 42 секунды
  lead: "Голос ведёт по дому № 17 на Петровском бульваре: от новогоднего вечера 1938-го до подвала с приёмным узлом и круглого экрана АТП-1. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Тридцать первое декабря 1938-го
    - t: 54
      mark: 0:54
      title: Подвал, где живёт сигнал
    - t: 123
      mark: 2:03
      title: Телевизор размером с блюдце
    - t: 177
      mark: 2:57
      title: Откуда приходила картинка
    - t: 237
      mark: 3:57
      title: Кто эти тридцать абонентов
    - t: 299
      mark: 4:59
      title: Пенсильвания, 1948
    - t: 354
      mark: 5:54
      title: Что мы отсюда берём
  transcript:
    - "<p>«Начнём не с техники, а с вечера. Москва, конец декабря 1938 года: вся страна встречает Новый год одинаково — патефон, радиоточка на стене, разговоры за столом. А в одном доме этого города Новый год встречают иначе. Петровский бульвар, дом № 17: в тридцати квартирах стоят телевизоры, и картинка приходит не из воздуха, а из стены.</p>"
    - "<p>Спустимся в подвал — главный экспонат зала там. Стойка приёмной аппаратуры, в документах — «телевизионный трансляционный узел». Проектировали два института: НИИ телевидения в Ленинграде и ЦНИИ связи в Москве. Логика простая: зачем ставить тридцать капризных приёмников в тридцать квартир, если можно поставить один, очень хороший, на весь дом? Схема 1938 года — один приёмный пункт на здание, кабельная разводка, простые приёмники у абонентов — это устройство любой кабельной сети сегодня.</p>"
    - "<p>Теперь к витрине справа. АТП-1, абонентский телевизионный приёмник. Экран круглый — торец электронно-лучевой трубки, восемнадцать сантиметров, чуть больше чайного блюдца. Посмотрите на заднюю стенку: ни антенной клеммы, ни ручек эфирной настройки. Только гнездо для кабеля.</p>"
    - "<p>И последнее. Сравните две даты: 1939-й и 1948-й, Москва и Пенсильвания. Девять лет разницы — и разные мотивы: у нас инженерное решение для закрытого дома, о котором нельзя писать, там коммерческая услуга, о которой нужно кричать. Мир запоминает не то, что случилось раньше, а то, что было ему рассказано. Сделали раньше, рассказали позже — этот музей существует ровно для второй половины фразы».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
