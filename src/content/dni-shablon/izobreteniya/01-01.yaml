        <div class="wrap" style="text-align:center">
          <h2 style="margin-bottom:6px;color:#fff">У нас много изобретений</h2>
          <p style="color:var(--muted);margin:0 auto 16px;max-width:60ch">Русские сделали первыми в мире сотни вещей. Открой полную базу и выбери по алфавиту то, что интересно именно тебе.</p>
