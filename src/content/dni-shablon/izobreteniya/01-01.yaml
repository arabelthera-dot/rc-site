  granica: "<b>Граница первенства:</b> первая в мире сеть кабельного телевидения — «Телевизионный трансляционный узел» дома № 17 на Петровском бульваре в Москве. Узел приняли в эксплуатацию 1 января 1939 года: один приёмный пункт на дом ловил сигнал телецентра, а дальше картинка расходилась по кабелю в 30 квартир, на приёмники АТП-1 без антенны. Проект — НИИ телевидения (Ленинград) и ЦНИИ связи (Москва)."
  net: "<b>Чего здесь нет:</b> не само телевидение и не телевизор — они появились раньше. Первенство — в способе доставки: кабель из стены вместо антенны у каждого приёмника. И это не открытая городская услуга: узел обслуживал один закрытый дом, о нём не писали в газетах — поэтому мир и запомнил американскую сеть 1948 года."
