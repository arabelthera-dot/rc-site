return:
  q: Какие две камеры Срезневский сделал в одном 1886 году?
  a: "Камеру для съёмки с воздушного шара — объективом вниз — и камеру, в которую не проникала вода, для морских съёмок."
  src: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд.
audioguide:
  audioSrc: audio-guide-sreznevskiy-26-ru.mp3
  durationLabel: 3 минуты 46 секунд
  lead: 'Голос ведёт по залу Вячеслава Срезневского: от отчёта о полётах шара через Кронштадт с неба и камеру, в которую не проникала вода, до игры «Сними Кронштадт». Пять остановок — небо и море одного 1886 года. Слушать можно фоном, пока читаешь страницу.'
  stops:
  - t: 0
    mark: 0:00
    title: Отчёт о полётах шара
  - t: 51
    mark: 0:51
    title: Кронштадт с неба
  - t: 95
    mark: '1:35'
    title: Ранец и камера для Тибета
  - t: 134
    mark: '2:14'
    title: Камера, в которую не проникала вода
  - t: 181
    mark: '3:01'
    title: Игра, судья на льду и итог
  transcript:
  - '<p>«Здравствуйте. Мы в зале Вячеслава Срезневского. Посмотрите на обложку: первая страница старой брошюры. Это отчёт полковника Сигунова о полётах воздушного шара Русского технического общества летом тысяча восемьсот восемьдесят шестого года. Сам отчёт хранится в Государственном музее истории космонавтики имени Циолковского. Главная мысль зала такая: Срезневский построил первую в мире камеру для съёмки с неба. Под обложкой полоса из четырёх чисел. Шестое июля тысяча восемьсот восемьдесят шестого — съёмка с шара. Тысяча сто метров — высота, с которой сняли Кронштадт. Двадцать четыре на двадцать четыре сантиметра — стеклянная пластинка. И тот же тысяча восемьсот восемьдесят шестой — камера, в которую не проникала вода.»</p>'
  - <p>«Начнём с неба. Весной тысяча восемьсот восемьдесят шестого года поручик Александр Кованько поднялся на аэростате над Петербургом и снимал город обычной камерой. Сразу после этого Срезневский предложил сделать для следующего полёта особую камеру, приспособленную для такой съёмки. Шестого июля шар повёл Кованько, снимал Леонид Зверинцев. За полёт сделали четыре снимка, и на одном из них — Кронштадт с высоты тысяча сто метров. Остров Котлин целиком попал в кадр. Камера крепилась к шару объективом вниз и снимала на стеклянные пластинки. А для съёмки с неба Срезневский сделал и свои фотопластинки.»</p>
  - '<p>«Теперь откройте факты. Срезневский делал камеры для трудной дороги задолго до шара. Ещё в тысяча восемьсот семьдесят пятом году он уместил в один ранец и фотоаппарат, и лабораторию: снял и тут же проявил. Раньше такая походная лаборатория занимала целый фургон, запряжённый парой лошадей. А путешественнику Николаю Пржевальскому он собрал камеру для экспедиции в Тибет. Жара днём, холод ночью, пыль и тряска. Камера весила около четырёх килограммов вместе с тридцатью стеклянными пластинками и носилась на плече в двойном футляре.»</p>'
  - '<p>«А теперь море. В том же тысяча восемьсот восемьдесят шестом году Срезневский сделал камеру, в которую не проникала вода. Большая советская энциклопедия называет её водонепроницаемой камерой для морских съёмок. Срезневский был не один. Годом раньше в Кронштадтской водолазной школе врач Есипов и инженер-механик Родионов взялись делать фотокамеру для съёмки под водой, а их коллега лейтенант Тверитинов сделал фонарь для подводного света. Снимки русских водолазов показали на ярмарке в Нижнем Новгороде в тысяча восемьсот девяносто шестом году, а через год — на Петербургской выставке судоходства. И честная оговорка: как была устроена камера Срезневского и что ею сняли под водой, источники не сообщают.»</p>'
  - '<p>«Спуститесь к игре «Сними Кронштадт». Поднимите шар, нажмите кнопку съёмки и посмотрите, что видно с высоты. Снимок в игре нарисован музеем: подлинник в открытом доступе не найден. И ещё один Срезневский, совсем другой. Он судил фигурное катание, к тысяча восемьсот восемьдесят третьему году вошёл в международную судейскую коллегию, а первый в истории чемпионат мира по фигурному катанию в тысяча восемьсот девяносто шестом году прошёл в его Петербурге. Вот и весь зал. Небо и море в один год: камера, которая смотрит вниз с шара, и камера, в которую не проникает вода. Теперь сыграйте и ответьте на два вопроса викторины.»</p>'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
