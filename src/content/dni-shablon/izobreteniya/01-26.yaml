  udary:
  - summary: "Сборная плыла на Олимпиаду-1912 — а глава Олимпийского комитета Срезневский остался на причале."
    det:
    - Срезневский возглавлял Российский олимпийский комитет и готовил выезд команды в Стокгольм на V Олимпийские игры 1912 года. Больше 200 спортсменов отправились туда на пароходе «Бирма».
    - Но пароход отчалил на час раньше объявленного срока, и на берегу остались многие участники поездки — во главе с самим председателем комитета Срезневским. Догонять свою команду ему пришлось на катере.
    src: "Источник: «Спортивная Цусима. К годовщине открытия V Олимпиады», портал «История.РФ» — https://history.ru/read/articles/sportivnaia-tsusima-k-105-lietiiu-otkrytiia-v-olimpiady; «Коммерсантъ», «Олимпийская Цусима» — https://www.kommersant.ru/doc/1008929 (догонял команду на катере)."
    otryvok: '«пароход отчалил на час раньше объявленного срока, и на причале осталось немало отъезжающих во главе с председателем олимпийского комитета Срезневским»'
