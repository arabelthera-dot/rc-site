return:
  q: Какие две камеры Срезневский сделал в одном 1886 году?
  a: "Камеру для съёмки с воздушного шара — объективом вниз — и первую в мире подводную камеру, которая не пропускала воду."
  src: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд.
audioguide:
  audioSrc: audio-guide-sreznevskiy-26-3-ru.mp3
  durationLabel: 3 минуты 35 секунд
  lead: 'Голос ведёт по залу Вячеслава Срезневского: от отчёта о полётах шара через первую в мире камеру для съёмки с неба и первую в мире подводную камеру, которая не пропускала воду, до игры «Сними Кронштадт». Пять остановок — небо и море одного 1886 года. Слушать можно фоном, пока читаешь страницу.'
  stops:
  - t: 0
    mark: '0:00'
    title: Отчёт о полётах шара
  - t: 50
    mark: '0:50'
    title: Кронштадт с неба
  - t: 98
    mark: '1:38'
    title: Ранец и камера для Тибета
  - t: 134
    mark: '2:14'
    title: Первая в мире подводная камера
  - t: 171
    mark: '2:51'
    title: Игра, чемпионат мира и итог
  transcript:
  - '<p>«Здравствуйте. Мы в зале Вячеслава Срезневского. Посмотрите на обложку: первая страница старой брошюры. Это отчёт полковника Сигунова о полётах воздушного шара Русского технического общества летом тысяча восемьсот восемьдесят шестого года. Сам отчёт хранится в Государственном музее истории космонавтики имени Циолковского. Главная мысль зала такая: Срезневский построил первую в мире камеру для съёмки с неба. Под обложкой полоса из четырёх чисел. Шестое июля тысяча восемьсот восемьдесят шестого — съёмка с шара. Тысяча сто метров — высота, с которой сняли Кронштадт. Двадцать четыре на двадцать четыре сантиметра — стеклянная пластинка. И тот же тысяча восемьсот восемьдесят шестой — первая в мире подводная камера, которая не пропускала воду.»</p>'
  - '<p>«Начнём с неба. Весной тысяча восемьсот восемьдесят шестого года поручик Александр Кованько поднялся на аэростате над Петербургом и снимал город обычной камерой. Сразу после этого Срезневский предложил сделать для следующего полёта первую в мире камеру для съёмки с неба. Шестого июля тысяча восемьсот восемьдесят шестого года — первая в мире аэрофотосъёмка особой камерой: шар вёл Кованько, снимал Леонид Зверинцев. За полёт сделали четыре снимка, и на одном из них — Кронштадт с высоты тысяча сто метров. Остров Котлин целиком попал в кадр. Камера крепилась к шару объективом вниз и снимала на стеклянные пластинки. А пластинки для съёмки с неба Срезневский первым в мире сделал сам: разработал их и впервые изготовил в том же тысяча восемьсот восемьдесят шестом году.»</p>'
  - '<p>«Теперь откройте факты. Срезневский делал камеры для трудной дороги задолго до шара. В тысяча восемьсот семьдесят пятом году он сделал первый в мире компактный ранец — фотоаппарат и лабораторию разом. До него такую лабораторию возили в фургоне, запряжённом парой лошадей. А в ранце Срезневского было и то и другое: снял — и тут же проявил. Путешественнику Николаю Пржевальскому он собрал камеру для экспедиции в Тибет. Жара днём, холод ночью, пыль и тряска. Камера весила около четырёх килограммов вместе с тридцатью стеклянными пластинками и носилась на плече в двойном футляре.»</p>'
  - '<p>«А теперь море. В том же тысяча восемьсот восемьдесят шестом году Срезневский сделал первую в мире подводную камеру, которая не пропускала воду. В прежние камеры для съёмки под водой заливалась вода, и снимок выходил нерезким. Камера Срезневского появилась на семь лет раньше подводных снимков француза Луи Бутана. Срезневский был не один. Годом раньше в Кронштадтской водолазной школе врач Есипов и инженер-механик Родионов взялись делать фотокамеру для съёмки под водой, а их коллега лейтенант Тверитинов сделал фонарь для подводного света. Снимки русских водолазов показали на ярмарке в Нижнем Новгороде в тысяча восемьсот девяносто шестом году, а через год — на Петербургской выставке судоходства.»</p>'
  - '<p>«Спуститесь к игре «Сними Кронштадт». Поднимите шар, нажмите кнопку съёмки и посмотрите, что видно с высоты. Снимок в игре нарисован музеем: подлинник в открытом доступе не найден. И ещё один Срезневский, совсем другой. Он судил фигурное катание, к тысяча восемьсот восемьдесят третьему году вошёл в международную судейскую коллегию — и добился, чтобы первый в истории чемпионат мира по фигурному катанию, в тысяча восемьсот девяносто шестом году, прошёл в Петербурге. Вот и весь зал. Небо и море в один год: первая в мире камера, которая смотрит вниз с шара, и первая в мире подводная камера, которая не пропускала воду. Теперь сыграйте и ответьте на два вопроса викторины.»</p>'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
