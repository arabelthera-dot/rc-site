        podpis_chto: "Статья Кованько и Трофимова «Воздушное путешествие из С.-Петербурга в Новгород»"
        svyashchennoe: false
        vid: "dokument"
        prava: {"god_smerti_avtora":"net","god_reabilitacii":"net","sdelano_mashinoj":false,"otkuda":"Госкаталог музейного фонда РФ","baza":"goskatalog","pervaya_publikaciya":"Госкаталог музейного фонда РФ, рег. № 6031333","ssylka":"https://goskatalog.ru/portal/#/collections?id=6236581","avtor":"Кованько, Трофимов","god_sozdaniya":"1885","anonim":false}
        podlinnik: {"gde":"Государственный музей истории космонавтики им. К. Э. Циолковского","otkuda":"https://goskatalog.ru/portal/#/collections?id=6236581"}
        nomer_predmeta: "инв. К3 2302; Госкаталог рег. № 6031333"
        nomer_snimka: "6031333"
        hranitel: "Государственный музей истории космонавтики им. К. Э. Циолковского"
      det:
        - "Камера Срезневского крепилась к шару объективом вниз и снимала на стеклянные пластинки 24×24 см. Пластинки для неба Срезневский тоже сделал сам — первым в мире."
      src: "Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — http://www.photohistory.ru/1207248167929303.html."
    - summary: '6 июля 1886 года — первая в мире аэрофотосъёмка особой камерой: шар вёл Кованько, снимал Зверинцев. Один из четырёх снимков — Кронштадт с 1100 метров.'
      det:
        - "Остров Котлин, на котором стоит Кронштадт, целиком попал в кадр. Г. Абрамов называет этот полёт первой в мире аэрофотосъёмкой специализированным фотоаппаратом."
      src: "Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — http://www.photohistory.ru/1207248167929303.html; «Аргументы и факты», 03.10.2024 — https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka."
    - summary: 'В том же 1886 году Срезневский сделал первую в мире подводную камеру, которая не пропускала воду: в прежние камеры для съёмки под водой заливалась вода.'
      det:
        - "Это на 7 лет раньше подводных снимков француза Луи Бутана (1893). В камеру, которой снимали под водой в 1856 году, во время съёмки заливалась вода, и снимок выходил нерезким. Большая советская энциклопедия называет камеру Срезневского «водонепроницаемая камера для морских съёмок (1886)»."
      src: "Источник: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — https://www.booksite.ru/fulltext/1/001/008/105/610.htm; С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021 — https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/."
    - summary: Под воду смотрели и кронштадтские водолазы — врач Есипов и инженер-механик Родионов.
      det:
        - "В 1885 году в Кронштадтской водолазной школе они начали делать камеру для съёмки под водой, а лейтенант Тверитинов — фонарь для подводного света. Снимки русских водолазов показали в Нижнем Новгороде в 1896 году и на Петербургской выставке судоходства в 1897-м."
      src: "Источник: С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021 — https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/."
