  granica: "Граница первенства: первая в мире камера, сделанная специально для съёмки с воздушного шара, первые в мире фотопластинки для съёмки с неба и первая аэрофотосъёмка такой камерой — Кронштадт с 1100 метров, 6 июля 1886 года. В том же году — первая в мире подводная камера, которая не пропускала воду; в прежние камеры для съёмки под водой заливалась вода. А в 1875 году — первый в мире компактный ранец: фотоаппарат и лаборатория разом; до него такую лабораторию возили в фургоне, запряжённом парой лошадей."
  net: "Чего здесь нет: мы не утверждаем, что Срезневский первым вообще снял землю с шара, — его первенство в особой камере и особых пластинках для неба. И мы не утверждаем, что он первым снял под водой: его первенство — первая в мире подводная камера, которая не пропускала воду; в прежние камеры для съёмки под водой заливалась вода."
