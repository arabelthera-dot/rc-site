      det:
        - "Он руководил отделом с 1878 по 1916 год. Ещё до шара он делал камеры для трудной дороги: в 1875 году — первый в мире компактный ранец, который был и фотоаппаратом, и лабораторией; до него такую лабораторию возили в фургоне, запряжённом парой лошадей."
      src: "Источник: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — https://www.booksite.ru/fulltext/1/001/008/105/610.htm."
    - summary: Весной воздухоплаватель Александр Кованько снял Петербург с шара — и Срезневский предложил сделать для следующего полёта первую в мире камеру для съёмки с неба.
      kadr:
        src: "/muzei/izobreteniya/img/01-26-kovanko-polet-novgorod-1885.jpg"
        alt: "Пожелтевшая страница с пятном в левом углу: заголовок «III. Смесь», ниже статья «Воздушное путешествие из С.-Петербурга в Новгород» о комиссии по военному воздухоплаванию и опытах с шарами, внизу «XI и XII. 1885 г.»"
        data_source: "https://goskatalog.ru/portal/#/collections?id=6236581"
        license: "общественное достояние (издание до 1923 г.) · Государственный музей истории космонавтики им. К. Э. Циолковского · Госкаталог, рег. № 6031333"
        podpis: "Статья Кованько и Трофимова «Воздушное путешествие из С.-Петербурга в Новгород», напечатанная в конце 1885 года: так начинали военные воздухоплаватели, за несколько месяцев до того, как Кованько снял Петербург с шара."
        credit: "Кованько, Трофимов, «Воздушное путешествие из С.-Петербурга в Новгород», отдельный оттиск, XI–XII 1885 г., с. 105–114. Хранится: Государственный музей истории космонавтики им. К. Э. Циолковского, инв. К3 2302. Госкаталог музейного фонда РФ, рег. № 6031333."
        width: 669
        height: 1024
        hint: "Статья Кованько и Трофимова «Воздушное путешествие из С.-Петербурга в Новгород» · 1885"
