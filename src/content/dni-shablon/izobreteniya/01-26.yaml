story:
  kicker: История изобретения · 5 ударов
  h2: Небо и море в один год
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Петербург, 1886 год. Вячеслав Срезневский руководит фотографическим отделом Русского технического общества.
      det:
        - "Он руководил отделом с 1878 по 1916 год. Ещё до шара он делал камеры для трудной дороги: в 1875 году — первый в мире компактный ранец, который был и фотоаппаратом, и лабораторией; до него такую лабораторию возили в фургоне, запряжённом парой лошадей."
      src: 'Источник: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>.'
    - summary: Весной воздухоплаватель Александр Кованько снял Петербург с шара — и Срезневский предложил сделать для следующего полёта первую в мире камеру для съёмки с неба.
      det:
        - "Камера Срезневского крепилась к шару объективом вниз и снимала на стеклянные пластинки 24×24 см. Пластинки для неба Срезневский тоже сделал сам — первым в мире."
      src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>.'
    - summary: '6 июля 1886 года — первая в мире аэрофотосъёмка особой камерой: шар вёл Кованько, снимал Зверинцев. Один из четырёх снимков — Кронштадт с 1100 метров.'
      det:
        - "Остров Котлин, на котором стоит Кронштадт, целиком попал в кадр. Г. Абрамов называет этот полёт первой в мире аэрофотосъёмкой специализированным фотоаппаратом."
      src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>; «Аргументы и факты», 03.10.2024 — <a href="https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka" rel="noopener" target="_blank">aif.ru</a>.'
    - summary: 'В том же 1886 году Срезневский сделал первую в мире подводную камеру, которая не пропускала воду: в прежние камеры для съёмки под водой заливалась вода.'
      det:
        - "Это на 7 лет раньше подводных снимков француза Луи Бутана (1893). В камеру, которой снимали под водой в 1856 году, во время съёмки заливалась вода, и снимок выходил нерезким. Большая советская энциклопедия называет камеру Срезневского «водонепроницаемая камера для морских съёмок (1886)»."
      src: 'Источник: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>; С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021 — <a href="https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/" rel="noopener" target="_blank">pglubina.ru</a>.'
    - summary: Под воду смотрели и кронштадтские водолазы — врач Есипов и инженер-механик Родионов.
      det:
        - "В 1885 году в Кронштадтской водолазной школе они начали делать камеру для съёмки под водой, а лейтенант Тверитинов — фонарь для подводного света. Снимки русских водолазов показали в Нижнем Новгороде в 1896 году и на Петербургской выставке судоходства в 1897-м."
      src: 'Источник: С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021 — <a href="https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/" rel="noopener" target="_blank">pglubina.ru</a>.'
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о Срезневском
  h2: Камеры для неба, моря и Тибета
  udary:
  - summary: '<b>Срезневский создал первую в мире камеру для съёмки с неба — в 1886-м она сняла Кронштадт.</b>'
    det:
    - Г. Абрамов называет полёт 6 июля 1886 года первой в мире аэрофотосъёмкой специализированным фотоаппаратом — камерой системы Срезневского. Она крепилась объективом вниз, снимала на стеклянные пластинки 24×24 см. Для неба Срезневский сделал и свои фотопластинки.
    src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>; «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>.'
    otryvok: '«И вот 6 июля 1886 года в России состоялась первая в мире аэрофотосъёмка специализированным фотоаппаратом системы В.И. Срезневского».'
    stranica: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В. И. Срезневского»
    href: 'http://www.photohistory.ru/1207248167929303.html'
    pometka: два источника
  - summary: '<b>6 июля 1886-го — первая в мире аэрофотосъёмка особой камерой: шар вёл Кованько, снимал Зверинцев.</b>'
    det:
    - 'За полёт — четыре снимка камерой Срезневского. На одном из них — Кронштадт с высоты 1100 метров: остров Котлин целиком попал в кадр. Срезневский следил за полётом с земли.'
    src: 'Источник: «Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», 03.10.2024 — <a href="https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka" rel="noopener" target="_blank">aif.ru</a>; Г. Абрамов — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>.'
    otryvok: '«Над Петербургом взмыл аэростат, и воздушный разведчик Леонид Зверинцев сделал четыре снимка камерой Срезневского. Один из них запечатлел Кронштадт с высоты 1100 метров».'
    stranica: '«Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», 03.10.2024'
    href: 'https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka'
    pometka: два источника
  - summary: '<b>Срезневский первым в мире создал особые фотопластинки для съёмки с неба (1886).</b>'
    det:
    - Для полёта над Кронштадтом мало было камеры объективом вниз — нужны были и свои пластинки. Срезневский разработал их и впервые изготовил в 1886 году. Пластинки 24×24 см вставляли в камеру по одной, в светонепроницаемых чехлах.
    src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>; «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>.'
    otryvok: '«Разработал и впервые изготовил специальные фотопластинки для аэрофотографии (1886)».'
    stranica: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В. И. Срезневского»; то же — Большая советская энциклопедия, 3-е изд.
    href: 'http://www.photohistory.ru/1207248167929303.html'
    pometka: два источника
  - summary: '<b>Пржевальский понёс в Тибет камеру Срезневского — около 4 кг вместе с 30 стеклянными пластинками.</b>'
    det:
    - 'Для экспедиции Срезневский собрал прочную камеру весом около 9 фунтов (≈3,7 кг) с запасом из 30 пластинок, в двойном футляре, на плечевом ремне: днём жара, ночью холод, всюду пыль и тряска.'
    src: 'Источник: О. В. Воробьёва, «„Селфи“ фотографов XIX века», «Наука и жизнь», 05.09.2015 — <a href="https://www.nkj.ru/open/26937/" rel="noopener" target="_blank">nkj.ru</a>.'
    otryvok: '«Фотоаппарат Срезневского весил около 9 фунтов вместе с 30 стёклами, он помещался в двойной футляр, чтобы защитить его от пыли и для ношения через плечо».'
    stranica: О. В. Воробьёва, «„Селфи“ фотографов XIX века», «Наука и жизнь», 05.09.2015
    href: 'https://www.nkj.ru/open/26937/'
    pometka: документ
  - summary: '<b>Срезневский создал первый в мире ранец с фотоаппаратом и лабораторией — до него её возили в фургоне.</b>'
    det:
    - 'Это было в 1875 году. Ранец служил и фотоаппаратом, и лабораторией: снял — и тут же проявил. Г. Абрамов называет Срезневского изобретателем этой походной аппарат-лаборатории, «Аргументы и факты» — первой портативной.'
    src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>; О. В. Воробьёва, «Наука и жизнь», 05.09.2015 — <a href="https://www.nkj.ru/open/26937/" rel="noopener" target="_blank">nkj.ru</a>.'
    otryvok: '«…портативной походной аппарат-лаборатории (1875), которая имела вид ранца и служила одновременно камерой для съемки и лабораторией для проявления (раньше такая лаборатория занимала целый фургон, запряженный парой лошадей)».'
    stranica: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В. И. Срезневского»
    href: 'http://www.photohistory.ru/1207248167929303.html'
    pometka: два источника
  - summary: '<b>Срезневский добился, чтобы первый чемпионат мира по фигурному катанию прошёл в Петербурге.</b>'
    det:
    - Он устраивал соревнования фигуристов и судил их, к 1883 году вошёл в международную судейскую коллегию. Его энергия и авторитет привели к тому, что первый чемпионат мира доверили Петербургу.
    src: 'Источник: «Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», 03.10.2024 — <a href="https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka" rel="noopener" target="_blank">aif.ru</a>.'
    otryvok: '«К 1883 году докатался до того, что вошёл в состав международной судейской коллегии. Его энергия и авторитет в конечном счёте привели к тому, что первый чемпионат мира по фигурному катанию (1896) доверили провести именно Петербургу».'
    stranica: '«Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», 03.10.2024'
    href: 'https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka'
    pometka: документ
  - summary: '<b>Срезневский создал первую в мире подводную камеру, которая не пропускала воду.</b>'
    det:
    - Это было в 1886 году — на 7 лет раньше подводных снимков француза Луи Бутана (1893). В камеру, которой снимали под водой в 1856 году, во время съёмки заливалась вода, и снимок выходил нерезким. Большая советская энциклопедия называет камеру Срезневского «водонепроницаемая камера для морских съёмок (1886)».
    src: 'Источник: С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021 — <a href="https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/" rel="noopener" target="_blank">pglubina.ru</a>; «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>.'
    otryvok: '«…камера в момент съёмки была заполнена водой, поэтому на фотопластинке изображение оказалось нерезким… член Русского фотографического общества Вячеслав Срезневский создал в 1886 году водонепроницаемую камеру для морских съёмок».'
    stranica: С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021
    href: 'https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/'
    pometka: два источника
  - summary: '<b>В Кронштадтской водолазной школе врач Есипов и механик Родионов взялись снимать под водой.</b>'
    det:
    - Это было в 1885 году. Их коллега лейтенант Тверитинов сделал фонарь для подводного света. Снимки русских водолазов показали на ярмарке в Нижнем Новгороде в 1896 году, а через год — на Петербургской выставке судоходства.
    src: 'Источник: С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021 — <a href="https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/" rel="noopener" target="_blank">pglubina.ru</a>.'
    otryvok: '«…преподаватели Кронштадтской водолазной школы, врач Есипов и инженер-механик Родионов, начали разрабатывать фотокамеру для съёмки под водой. Их коллега, лейтенант Тверитинов сделал фонарь для освещения».'
    stranica: С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021
    href: 'https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/'
    pometka: документ
  - summary: '<b>Шар с камерой Срезневского унесло в море — людей подобрал пароход в 100 км от Кронштадта.</b>'
    det:
    - 6 июля 1886 года аэростат с камерой Срезневского вылетел из Петербурга к Кронштадту. Сесть в Кронштадте не получилось, и шар понесло в открытое море.
    - Воздухоплавателей подобрал проходивший пароход примерно в 100 километрах от острова. Снимки, сделанные камерой в этом полёте, сохранились.
    src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В.И. Срезневского» (с выдержкой из Б. В. Краснопевцева, «История фотограмметрии в России») — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener">www.photohistory.ru/1207248167929303.html</a>.'
    otryvok: '«Опуститься в Кронштадте не удалось, и шар полетел в сторону открытого моря, где примерно в 100 км от острова воздухоплаватели были приняты на борт английского парохода.»'
    stranica: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В.И. Срезневского» (с выдержкой из Б. В. Краснопевцева, «История фотограмметрии в России»)
    href: 'http://www.photohistory.ru/1207248167929303.html'
    pometka: документ
  - summary: '<b>Срезневский требовал открыть школу фотографии в 1896-м — её открыли лишь через 22 года.</b>'
    det:
    - В январе 1896 года Срезневский выступил на съезде с докладом о том, что России нужно особое училище по фотографии.
    - 'Ждать пришлось 22 года: только в 1918 году в Петрограде открыли Высший институт фотографии и фототехники. Срезневский стал одним из его основателей и деканом, а сегодня это Санкт-Петербургский университет кино и телевидения.'
    src: 'Источник: О. В. Воробьёва, «„Селфи“ фотографов XIX века», «Наука и жизнь», 05.09.2015 — <a href="https://www.nkj.ru/open/26937/" rel="noopener">www.nkj.ru/open/26937/</a>.'
    otryvok: '«Только через 22 года после доклада, в 1918 году в Петрограде учредили Высший институт фотографии и фототехники (ныне — Санкт-Петербургский университет кино и телевидения), одним из основателей которого и деканом научно-фотографического факультета стал сам Вячеслав Срезневский.»'
    stranica: О. В. Воробьёва, «„Селфи“ фотографов XIX века», «Наука и жизнь», 05.09.2015
    href: 'https://www.nkj.ru/open/26937/'
    pometka: документ
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Олимпиада, лыжи и коньки
  udary:
  - summary: '<b>Сборная плыла на Олимпиаду-1912 — а глава Олимпийского комитета Срезневский остался на причале.</b>'
    det:
    - Срезневский возглавлял Российский олимпийский комитет и готовил выезд команды в Стокгольм на V Олимпийские игры 1912 года. Больше 200 спортсменов отправились туда на пароходе «Бирма».
    - Но пароход отчалил на час раньше объявленного срока, и на берегу остались многие участники поездки — во главе с самим председателем комитета Срезневским.
    src: 'Источник: «Спортивная Цусима. К годовщине открытия V Олимпиады», портал «История.РФ» — <a href="https://history.ru/read/articles/sportivnaia-tsusima-k-105-lietiiu-otkrytiia-v-olimpiady" rel="noopener">history.ru/read/articles/sportivnaia-tsusima-k-105-lietiiu-otkrytiia-v-olimpiady</a>.'
    otryvok: '«пароход отчалил на час раньше объявленного срока, и на причале осталось немало отъезжающих во главе с председателем олимпийского комитета Срезневским»'
    stranica: '«Спортивная Цусима. К годовщине открытия V Олимпиады», портал «История.РФ»'
    href: 'https://history.ru/read/articles/sportivnaia-tsusima-k-105-lietiiu-otkrytiia-v-olimpiady'
    pometka: документ
  - summary: '<b>С Олимпиады-1912 сборная привезла 4 медали — Срезневский взялся перестроить всю подготовку.</b>'
    det:
    - Срезневский сам сопровождал российскую команду на Олимпийские игры 1912 года в Стокгольме. Сборная взяла лишь два серебра и две бронзы.
    - Срезневский переживал неудачу как свою собственную и решил, что виноваты не спортсмены, а плохая организация. Подготовку изменили к Олимпиаде 1916 года, но её отменили из-за Первой мировой войны.
    src: 'Источник: «Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», № 40, 02.10.2024 — <a href="https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka" rel="noopener">aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka</a>.'
    otryvok: '«Срезневский переживал неудачу как свою личную. Понимал, что дело было не в отсутствии талантов, а в организационных недоработках.»'
    stranica: '«Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», № 40, 02.10.2024'
    href: 'https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka'
    pometka: документ
  - summary: '<b>В 52 года изобретатель аэрофотоаппарата Срезневский взял серебро в лыжной гонке.</b>'
    det:
    - Срезневский был не только изобретателем, но и спортсменом. В 1901 году, когда ему было 52 года, он пришёл вторым в лыжной гонке на призы журнала «Спорт» на Марсовом поле в Петербурге.
    - Через десять лет его избрали председателем Российского олимпийского комитета.
    src: 'Источник: «115 лет НОК России: от генерала Бутовского до министра Дегтярёва», «Советский спорт» — <a href="https://www.sovsport.ru/sportstory/articles/115-let-nok-rossii-ot-generala-butovskogo-do-ministra-degtyaryova-vspomnim-istoki" rel="noopener">www.sovsport.ru/sportstory/articles/115-let-nok-rossii-ot-generala-butovskogo-do-ministra-degtyaryova-vspomnim-istoki</a>.'
    otryvok: '«В 1901 году в 52 года он занял второе место в соревнованиях по лыжным гонкам на призы журнала «Спорт», проходивших на Марсовом поле.»'
    stranica: '«115 лет НОК России: от генерала Бутовского до министра Дегтярёва», «Советский спорт»'
    href: 'https://www.sovsport.ru/sportstory/articles/115-let-nok-rossii-ot-generala-butovskogo-do-ministra-degtyaryova-vspomnim-istoki'
    pometka: документ
  - summary: '<b>В полёте с камерой Срезневского море сверху оказалось картой мелей — так дно увидели с неба.</b>'
    det:
    - 'В том же полёте 1886 года над морем воздухоплаватели заметили: с высоты 2500 метров отмели и глубокие места видны разным цветом — мели жёлтые и бурые, глубина темнее.'
    - Так они поняли, что по снимкам с неба можно изучать дно моря и искать безопасный путь для кораблей. Об этом рассказали в отчёте о полёте в 1887 году.
    src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В.И. Срезневского» (с выдержкой из Б. В. Краснопевцева, «История фотограмметрии в России») — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener">www.photohistory.ru/1207248167929303.html</a>.'
    otryvok: '«В ходе полета над морем ими была отмечена возможность изучения по воздушным фотоснимкам рельефа дна.»'
    stranica: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В.И. Срезневского» (с выдержкой из Б. В. Краснопевцева, «История фотограмметрии в России»)
    href: 'http://www.photohistory.ru/1207248167929303.html'
    pometka: документ
  - summary: '<b>Срезневский не только судил фигуристов — сам брал международные призы в парном катании.</b>'
    det:
    - Срезневский всерьёз занимался фигурным катанием и выигрывал несколько международных призов в катании парой.
    - 'Позже он стал судьёй и организатором соревнований: под его руководством в Петербурге прошёл чемпионат мира 1896 года, а в 1898-м в Гельсингфорсе — чемпионат Европы по бегу на коньках.'
    src: 'Источник: Д. А. Баринов, Е. А. Ростовцев (ред.), «Срезневский Вячеслав Измайлович», Биографика СПбГУ, Словарь историков Санкт-Петербургского университета — <a href="https://bioslovhist.spbu.ru/person/267-sreznevskiy-vyacheslav-izmaylovich.html" rel="noopener">bioslovhist.spbu.ru/person/267-sreznevskiy-vyacheslav-izmaylovich.html</a>.'
    otryvok: '«Также С. профессионально занимался фигурным катанием, был лауреатом нескольких международных призов в парном разряде.»'
    stranica: Д. А. Баринов, Е. А. Ростовцев (ред.), «Срезневский Вячеслав Измайлович», Биографика СПбГУ, Словарь историков Санкт-Петербургского университета
    href: 'https://bioslovhist.spbu.ru/person/267-sreznevskiy-vyacheslav-izmaylovich.html'
    pometka: документ
