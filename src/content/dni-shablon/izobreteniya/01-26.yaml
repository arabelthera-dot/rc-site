story:
  kicker: История изобретения · 5 ударов
  h2: Небо и море в один год
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Петербург, 1886 год. Вячеслав Срезневский руководит фотографическим отделом Русского технического общества.
      det:
        - "Он руководил отделом с 1878 по 1916 год. Ещё до шара он делал камеры для трудной дороги: в 1875 году — первый в мире компактный ранец, который был и фотоаппаратом, и лабораторией; до него такую лабораторию возили в фургоне, запряжённом парой лошадей."
      src: 'Источник: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>.'
    - summary: Весной воздухоплаватель Александр Кованько снял Петербург с шара — и Срезневский предложил сделать для следующего полёта первую в мире камеру для съёмки с неба.
      det:
        - "Камера Срезневского крепилась к шару объективом вниз и снимала на стеклянные пластинки 24×24 см. Пластинки для неба Срезневский тоже сделал сам — первым в мире."
      src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>.'
    - summary: '6 июля 1886 года — первая в мире аэрофотосъёмка особой камерой: шар вёл Кованько, снимал Зверинцев. Один из четырёх снимков — Кронштадт с 1100 метров.'
      det:
        - "Остров Котлин, на котором стоит Кронштадт, целиком попал в кадр. Г. Абрамов называет этот полёт первой в мире аэрофотосъёмкой специализированным фотоаппаратом."
      src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>; «Аргументы и факты», 03.10.2024 — <a href="https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka" rel="noopener" target="_blank">aif.ru</a>.'
    - summary: 'В том же 1886 году Срезневский сделал первую в мире подводную камеру, которая не пропускала воду: в прежние камеры для съёмки под водой заливалась вода.'
      det:
        - "Это на 7 лет раньше подводных снимков француза Луи Бутана (1893). В камеру, которой снимали под водой в 1856 году, во время съёмки заливалась вода, и снимок выходил нерезким. Большая советская энциклопедия называет камеру Срезневского «водонепроницаемая камера для морских съёмок (1886)»."
      src: 'Источник: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>; С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021 — <a href="https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/" rel="noopener" target="_blank">pglubina.ru</a>.'
    - summary: Под воду смотрели и кронштадтские водолазы — врач Есипов и инженер-механик Родионов.
      det:
        - "В 1885 году в Кронштадтской водолазной школе они начали делать камеру для съёмки под водой, а лейтенант Тверитинов — фонарь для подводного света. Снимки русских водолазов показали в Нижнем Новгороде в 1896 году и на Петербургской выставке судоходства в 1897-м."
      src: 'Источник: С. Глущенко, «История подводной фотографии с 1856 года и до наших дней», «Предельная глубина», № 6/2021 — <a href="https://pglubina.ru/istoriya-podvodnoj-fotografii-c-1856-goda-i-do-nashih-dnej-veteran-podvodnogo-fotodela-harkovchanin-sergej-glushhenko-issleduet-temu-podvodnoj-fotosjomki-uzhe-50-let-poka-osvezhit/" rel="noopener" target="_blank">pglubina.ru</a>.'
fakty:
  id: fakty
  nav: Факты
  kicker: Восемь фактов о камерах Срезневского
  h2: Факты дня
  udary:
    - summary: <b>Срезневский построил первую в мире камеру для съёмки с неба — в 1886-м она сняла Кронштадт с 1100 метров.</b>
      det:
        - "Г. Абрамов называет полёт 6 июля 1886 года первой в мире аэрофотосъёмкой специализированным фотоаппаратом — камерой системы Срезневского. Она крепилась объективом вниз, снимала на стеклянные пластинки 24×24 см. Для неба Срезневский сделал и свои фотопластинки."
      src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>; «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>.'
      otryvok: "«И вот 6 июля 1886 года в России состоялась первая в мире аэрофотосъёмка специализированным фотоаппаратом системы В.И. Срезневского»."
      stranica: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В. И. Срезневского»
      href: http://www.photohistory.ru/1207248167929303.html
      pometka: два источника
    - summary: '<b>6 июля 1886 года — первая в мире аэрофотосъёмка особой камерой: шар вёл Александр Кованько, снимал Леонид Зверинцев.</b>'
      det:
        - "За полёт — четыре снимка камерой Срезневского. На одном из них — Кронштадт с высоты 1100 метров: остров Котлин целиком попал в кадр. Срезневский следил за полётом с земли."
      src: 'Источник: «Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», 03.10.2024 — <a href="https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka" rel="noopener" target="_blank">aif.ru</a>; Г. Абрамов — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>.'
      otryvok: "«Над Петербургом взмыл аэростат, и воздушный разведчик Леонид Зверинцев сделал четыре снимка камерой Срезневского. Один из них запечатлел Кронштадт с высоты 1100 метров»."
      stranica: «Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», 03.10.2024
      href: https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka
      pometka: два источника
    - summary: <b>Срезневский первым в мире сделал особые фотопластинки для съёмки с неба (1886).</b>
      det:
        - "Для полёта над Кронштадтом мало было камеры объективом вниз — нужны были и свои пластинки. Срезневский разработал их и впервые изготовил в 1886 году. Пластинки 24×24 см вставляли в камеру по одной, в светонепроницаемых чехлах."
      src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>; «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд. — <a href="https://www.booksite.ru/fulltext/1/001/008/105/610.htm" rel="noopener" target="_blank">booksite.ru</a>.'
      otryvok: "«Разработал и впервые изготовил специальные фотопластинки для аэрофотографии (1886)»."
      stranica: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В. И. Срезневского»; то же — Большая советская энциклопедия, 3-е изд.
      href: http://www.photohistory.ru/1207248167929303.html
      pometka: два источника
    - summary: <b>Пржевальский понёс в Тибет камеру Срезневского — около 4 кг вместе с 30 стеклянными пластинками.</b>
      det:
        - "Для экспедиции Срезневский собрал прочную камеру весом около 9 фунтов (≈3,7 кг) с запасом из 30 пластинок, в двойном футляре, на плечевом ремне: днём жара, ночью холод, всюду пыль и тряска."
      src: 'Источник: О. В. Воробьёва, «„Селфи“ фотографов XIX века», «Наука и жизнь», 05.09.2015 — <a href="https://www.nkj.ru/open/26937/" rel="noopener" target="_blank">nkj.ru</a>.'
      otryvok: "«Фотоаппарат Срезневского весил около 9 фунтов вместе с 30 стёклами, он помещался в двойной футляр, чтобы защитить его от пыли и для ношения через плечо»."
      stranica: О. В. Воробьёва, «„Селфи“ фотографов XIX века», «Наука и жизнь», 05.09.2015
      href: https://www.nkj.ru/open/26937/
      pometka: документ
    - summary: <b>Срезневский сделал первый в мире компактный ранец — фотоаппарат и лабораторию разом; до него такую лабораторию возили в фургоне, запряжённом парой лошадей.</b>
      det:
        - "Это было в 1875 году. Ранец служил и фотоаппаратом, и лабораторией: снял — и тут же проявил. Г. Абрамов называет Срезневского изобретателем этой походной аппарат-лаборатории, «Аргументы и факты» — первой портативной."
      src: 'Источник: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения» — <a href="http://www.photohistory.ru/1207248167929303.html" rel="noopener" target="_blank">photohistory.ru</a>; О. В. Воробьёва, «Наука и жизнь», 05.09.2015 — <a href="https://www.nkj.ru/open/26937/" rel="noopener" target="_blank">nkj.ru</a>.'
      otryvok: "«…портативной походной аппарат-лаборатории (1875), которая имела вид ранца и служила одновременно камерой для съемки и лабораторией для проявления (раньше такая лаборатория занимала целый фургон, запряженный парой лошадей)»."
      stranica: Г. Абрамов, «Этапы развития отечественного фотоаппаратостроения», раздел «Аппараты В. И. Срезневского»
      href: http://www.photohistory.ru/1207248167929303.html
      pometka: два источника
    - summary: <b>Срезневский добился, чтобы первый в истории чемпионат мира по фигурному катанию (1896) прошёл в Петербурге.</b>
      det:
        - "Он устраивал соревнования фигуристов и судил их, к 1883 году вошёл в международную судейскую коллегию. Его энергия и авторитет привели к тому, что первый чемпионат мира доверили Петербургу."
      src: 'Источник: «Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», 03.10.2024 — <a href="https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka" rel="noopener" target="_blank">aif.ru</a>.'
      otryvok: "«К 1883 году докатался до того, что вошёл в состав международной судейской коллегии. Его энергия и авторитет в конечном счёте привели к тому, что первый чемпионат мира по фигурному катанию (1896) доверили провести именно Петербургу»."
      stranica: «Вышла из камеры. Как благодаря Вячеславу Срезневскому появилась аэросъёмка», «Аргументы и факты», 03.10.2024
      href: https://aif.ru/society/science/vyshla-iz-kamery-kak-blagodarya-vyacheslavu-sreznevskomu-poyavilas-aerosyomka
      pometka: документ
    - summary: '<b>Срезневский сделал первую в мире подводную камеру, которая не пропускала воду: в прежние камеры для съёмки под водой заливалась вода.</b>'
      det:
        - "Это было в 1886 году — на 7 лет раньше подводных снимков француза Луи Бутана (1893). В камеру, которой снимали под водой в 1856 году, во время съёмки заливалась вода, и снимок выходил нерезким. Большая советская энциклопедия называет камеру Срезневского «водонепроницаемая камера для морских съёмок (1886)»."
