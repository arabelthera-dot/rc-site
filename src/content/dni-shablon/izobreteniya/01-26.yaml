return:
  q: Какие две камеры Срезневский сделал в одном 1886 году?
  a: "Камеру для съёмки с воздушного шара — объективом вниз — и первую в мире подводную камеру, которая не пропускала воду."
  src: «Срезневский Вячеслав Измайлович», Большая советская энциклопедия, 3-е изд.
audioguide:
  audioSrc: audio-guide-sreznevskiy-26-3-ru.mp3
  durationLabel: около двух минут
  lead: "Голос ведёт по залу Срезневского: от снимка Кронштадта с неба через подводную камеру, которая не пропускала воду, к лыжне, катку и олимпийскому причалу."
  stops:
    - t: 0
      mark: '0:00'
      title: Кронштадт с неба
    - t: 32
      mark: '0:32'
      title: Ранец и Тибет
    - t: 59
      mark: '0:59'
      title: Камера под водой
    - t: 85
      mark: '1:25'
      title: Судья и лыжник
    - t: 114
      mark: '1:54'
      title: Остался на причале
  transcript:
    - "Здравствуйте. Мы в зале первого в мире аэрофотоаппарата и первой в мире подводной камеры, которая не пропускала воду. Шестого июля тысяча восемьсот восемьдесят шестого года шар вёл Кованько, снимал Зверинцев, а Срезневский следил за полётом с земли. Его камера крепилась объективом вниз и снимала на пластинки двадцать четыре на двадцать четыре сантиметра, тоже сделанные им самим. За полёт вышло четыре снимка, и на одном Кронштадт с высоты тысячи ста метров: остров Котлин целиком."
    - Сесть в Кронштадте не получилось, и шар понесло в открытое море. Воздухоплавателей подобрал пароход примерно в ста километрах от острова, а снимки сохранились. С высоты двух с половиной тысяч метров они заметили, что мели жёлтые и бурые, а глубина темнее. Так поняли, что по снимкам с неба можно изучать дно и искать безопасный путь кораблям. Камеры для трудной дороги Срезневский делал и раньше.
    - "В тысяча восемьсот семьдесят пятом году он создал первый в мире ранец, который служил и фотоаппаратом, и лабораторией: снял и тут же проявил. До него лабораторию возили в фургоне. Путешественнику Пржевальскому для Тибета он собрал прочную камеру около четырёх килограммов вместе с тридцатью пластинками, в двойном футляре, на плечевом ремне. Днём там жара, ночью холод, всюду пыль и тряска."
    - В тысяча восемьсот восемьдесят шестом году Срезневский создал первую в мире подводную камеру, которая не пропускала воду, на семь лет раньше подводных снимков француза Луи Бутана. В камеру, которой снимали под водой в тысяча восемьсот пятьдесят шестом году, вода заливалась, и снимок выходил нерезким. А в Кронштадтской водолазной школе врач Есипов и механик Родионов тоже взялись снимать под водой, их коллега Тверитинов сделал фонарь для подводного света.
    - Срезневский судил фигуристов, сам брал призы в парном катании и добился, чтобы чемпионат мира тысяча восемьсот девяносто шестого года прошёл в Петербурге. В пятьдесят два года он взял серебро в лыжной гонке. Позже он возглавил Российский олимпийский комитет, но пароход «Бирма» со сборной ушёл в Стокгольм на час раньше срока, и догонять команду пришлось на катере. Через двадцать два года после его доклада о нужде в училище по фотографии открыли институт, и Срезневский стал его деканом.
  note: Озвучено синтезом речи.
