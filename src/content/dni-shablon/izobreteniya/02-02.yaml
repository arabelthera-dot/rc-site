  transcript:
  - '<p>Здравствуйте. Мы в зале «единорога». Перед нами бронзовый ствол 1757 года: ручки отлиты в виде двух скачущих зверей. Его хранит Артиллерийский музей в Петербурге.</p>'
  - '<p>В 1756 году Артиллерийское ведомство возглавил граф Пётр Шувалов. Армии нужна была одна пушка вместо двух: чтобы стрелять и ядром, и разрывной гранатой.</p>'
  - <p>Михаил Данилов и М. Г. Мартынов сначала отлили «близняток» — две мортирки сплошь. Не вышло. Тогда они сделали «одиночку», которая стреляла картечью, гранатой и ядром попеременно. Это и был «единорог» — первое в мире универсальное орудие.</p>
  - <p>Почему «единорог»? В гербе графа Шувалова был единорог. Поэтому и ручки ствола отливали в виде скачущих единорогов.</p>
  - <p>В 1758 году русские единороги отправили союзникам в Вену. Австрийцы испытывали их под Веной, но точной копии так и не отлили. Ствол 1757 года до сих пор хранится в венском военном музее.</p>
  - <p>«Единороги» служили больше ста лет — в поле, в крепостях и на кораблях, до появления нарезных орудий.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
