    pometka: документ
  - summary: <b>Уже в 1760 году вышла книга «Практика единорогов».</b>
    det:
    - Наставление для артиллеристов напечатали в Санкт-Петербурге, через три года после изобретения.
    src: 'Источник: Президентская библиотека им. Б. Н. Ельцина, «Шувалов Пётр Иванович» — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XVIII/Shuvalov" rel="noopener" target="_blank">prlib.ru</a>'
    otryvok: «Практика единорогов…», СПб., 1760
    stranica: страница о П. И. Шувалове
    href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XVIII/Shuvalov
    pometka: документ
  - summary: <b>В 1758 году русские единороги отправили союзникам в Вену.</b>
    det:
    - Летом 1759 года австрийцы испытывали новые для европейцев орудия у местечка Обергасинг под Веной.
    src: 'Источник: А. В. Громов, «О подражаниях «шуваловской» артиллерии», Сборник исследований и материалов ВИМАИВиВС, вып. XIII, 2024 — <a href="https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf" rel="noopener" target="_blank">museum-artillery.ru</a>, с. 15–16'
    otryvok: практические испытания этих новых для европейцев орудий производились летом 1759 г. в местечке Обергасинг, неподалеку от Вены
    stranica: с. 15–16
    href: https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf
    pometka: документ
  - summary: <b>В Вене до сих пор хранится русский единорог 1757 года.</b>
    det:
    - ¼-пудовый ствол, отлитый в Санкт-Петербурге, остался в венском Цейхгаузе с тех самых лет и теперь стоит в Военно-историческом музее Вены.
    src: 'Источник: А. В. Громов, «О подражаниях «шуваловской» артиллерии», Сборник исследований и материалов ВИМАИВиВС, вып. XIII, 2024 — <a href="https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf" rel="noopener" target="_blank">museum-artillery.ru</a>, с. 16'
    otryvok: в военном музее в Вене (Heeresgeschichtlihes Museum) сейчас хранится русский ¼-пуд. единорог, отлитый в С.-Петербурге в 1757 г.
    stranica: с. 16
    href: https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf
    pometka: документ
  - summary: <b>В 1797 году Павел I заменил в армии все прежние гаубицы единорогами.</b>
    det:
    - Реформа артиллерии сделала «единорог» главным навесным орудием русской армии.
