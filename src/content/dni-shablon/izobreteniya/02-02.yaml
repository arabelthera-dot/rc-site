igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Один ствол — четыре снаряда
  pravilo_ru: 'Что сделать сейчас: выбери снаряд и нажми на цель, которую он берёт.'
  kak_igrat:
    zachem: Раньше в бой везли две разные пушки — для ядра и для гранаты. «Единорог» — первое в мире универсальное орудие — стрелял из одного ствола ядром, гранатой, картечью и зажигательными снарядами.
    shagi:
    - Выбери снаряд — кнопка под схемой загорится золотом.
    - Нажми на цель на схеме. Верный выбор загорится зелёным с названием снаряда.
    - Расставь все четыре — счётчик внизу покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок снарядов каждый раз новый.'
    final: Все четыре снаряда на своих целях — +20 баллов.
  dannye:
    kartinka:
      src: /muzei/izobreteniya/igry/edinorog-snaryady.svg
      alt: 'Схема поля боя: орудие, крепостная стена, земляной вал с укрытыми за ним, пехота в поле, деревянные склады'
      podpis_ru: Схема поля боя — нажми на цель после выбора снаряда.
    mesta:
    - kod: ukreplenie
      nazvanie: Стена
      x: 80
      y: 28
      verno_ru: Ядро однопудового «единорога» разбивало укрепления так же, как пушка вдвое тяжелее.
    - kod: za-valom
      nazvanie: За валом
      x: 58
      y: 56
      verno_ru: Граната летит навесом через вал — «единорог» бил навесом, как гаубица.
    - kod: pekhota
      nazvanie: Пехота
      x: 36
      y: 84
      verno_ru: Картечью «единороги» встретили пруссаков под Пальцигом — «едва ль кто из передних спастись могли».
    - kod: sklady
      nazvanie: Склады
      x: 90
      y: 85
      verno_ru: Зажигательный снаряд поджигает склады — и его бросал тот же ствол «единорога».
    podpisi:
    - kod: yadro
      tekst: Ядро
      mesto: ukreplenie
      mimo_ru: 'Ядро — по укреплениям: оно разбивало их, как пушка вдвое тяжелее.'
    - kod: granata
      tekst: Граната
      mesto: za-valom
      mimo_ru: Граната — навесом, по тем, кто укрылся за валом.
    - kod: kartech
      tekst: Картечь
      mesto: pekhota
      mimo_ru: 'Картечь — по пехоте в поле: так под Пальцигом встретили пруссаков.'
    - kod: zazhigatelnyy
      tekst: Зажигательный
      mesto: sklady
      mimo_ru: Зажигательный снаряд — туда, где есть чему гореть.
    vyberi_ru: Сначала выбери снаряд под схемой, потом нажми на цель.
    mimo_ru: Не та цель — попробуй другую.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все четыре снаряда на своих целях — один ствол «единорога» взял все четыре. Так стреляло первое в мире универсальное орудие.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: ядро — по стене, граната — за вал, картечь — по пехоте, зажигательный — по складам.'
pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: 'Что сделано: в 1757 году в России создано первое универсальное орудие — один ствол для ядра, разрывной гранаты и картечи.'
  net: 'Где граница: точных копий «единорога» в Европе не сделали; европейские длинные гаубицы появились позже и выросли под его влиянием.'
  kolonki:
  - Где
  - Что
  - Когда
  stroki:
  - - Санкт-Петербург
    - «единорог» Данилова и Мартынова
    - '1757'
  - - Россия
    - Павел I заменил все гаубицы единорогами
    - '1797'
  - - Россия
    - единороги на вооружении до нарезных орудий
    - вторая половина XIX века
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Для викторины нужен JavaScript. Ответы: 1757; ядро, граната и картечь; от герба Шувалова; ни одна; больше ста лет.'
  ball: 8
  voprosy:
  - q: В каком году изобрели «единорог»?
    o:
    - '1700'
    - '1757'
    - '1812'
    a: 1
    e: В 1757 году, при графе Петре Шувалове.
  - q: Чем стрелял «единорог»?
    o:
    - Только ядрами
    - Только гранатами
    - Ядром, гранатой и картечью
    a: 2
    e: Из одного ствола — всеми снарядами.
  - q: Откуда имя «единорог»?
    o:
    - От герба Шувалова
    - От названия завода
    - От фамилии мастера
    a: 0
    e: В гербе графа Шувалова был единорог.
  - q: Какая страна смогла отлить точную копию «единорога»?
    o:
    - Австрия
    - Пруссия
    - Ни одна
    a: 2
    e: Ни Австрия, ни Пруссия, ни Франция так и не смогли отлить точную копию «единорога».
  - q: Сколько лет служил «единорог»?
    o:
    - 20 лет
    - 50 лет
    - Больше ста лет
    a: 2
    e: До появления нарезных орудий во второй половине XIX века.
