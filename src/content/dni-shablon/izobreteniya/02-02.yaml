story:
  kicker: История изобретения
  h2: Как появился «единорог»
  udary:
  - summary: Секретная гаубица Шувалова
    det:
    - В 1756 году Артиллерийское ведомство возглавил граф Пётр Шувалов. При нём артиллеристы искали орудие, которое заменит и пушку, и гаубицу.
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — ar.culture.ru'
  - summary: От «близняток» к «одиночке»
    det:
    - Капитан Михаил Данилов и М. Г. Мартынов сначала отлили «близняток», а потом «одиночку», которая стреляла картечью, гранатой и ядром попеременно. В 1757 году так появился «единорог».
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — ar.culture.ru; Государственный Исторический музей, «Ствол единорога (модель)» — nav.shm.ru'
  - summary: Сто лет службы
    det:
    - «Единороги» стояли в полевой, осадной, крепостной и корабельной артиллерии больше ста лет — до нарезных орудий.
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — nav.shm.ru; А. В. Громов, «О подражаниях «шуваловской» артиллерии», Сборник исследований и материалов ВИМАИВиВС, вып. XIII, 2024 — museum-artillery.ru'
fakty:
- id: fakty
  nav: Факты
  kicker: Что изобрели
  h2: Факты дня
  udary:
  - summary: Меньше чем за два года после изобретения Россия отлила почти пятьсот единорогов — 477 к февралю 1759-го.
    det:
    - Первые 12 единорогов ушли в поход уже в кампанию 1757 года, а с 1760 года их стали ставить и на корабли.
    src: 'Источник: «Звезда», «Единорог — страшный русский зверь», 26.01.2020 — zvezdaweekly.ru'
    otryvok: А уже к 7 февраля 1759 года было изготовлено 477 единорогов.
    stranica: «Звезда», 26.01.2020
    href: https://zvezdaweekly.ru/news/20201241050-bG1SP.html
    pometka: документ
    id: 477-edinorogov
    istochnik: zvezda-edinorog-2020
    dlya_voprosa: true
    otvet: '477'
    otvet_edinstvennyj: true
  - summary: 'Под Пальцигом единороги встретили пруссаков картечью так, что, по донесению, «едва ль кто из передних спастись могли». Главнокомандующий Салтыков писал: единороги «ужасное имели действо».'
    det:
    - Слова о картечи — из донесения генерала К. Бороздина, их приводит историк Н. Е. Бранденбург. Пальциг — сражение 1759 года.
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — reenactor.ru, с. 324'
    otryvok: неприятеля нового рода гаубицами и единорогами «нечаянно (внезапно. – В.О.) столь встретили скорострельною стрельбою картечами храбро, что едва ль кто из передних спастись могли»; В своей реляции по итогам сражения генерал-фельдмаршал П.С. Салтыков писал, что «единороги и шуваловские гаубицы ужасное имели действо»
    stranica: с. 324
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
    id: kartech-palcig
    istochnik: otochkin-sekretnaya-gaubica
    dlya_voprosa: false
  - summary: Ядро однопудового единорога разбивало укрепления так же, как пушка вдвое тяжелее.
    det:
    - 'Его сравнивали с восемнадцатифунтовой пушкой: бил так же, а весил на 64 пуда, то есть на 1048 килограммов, меньше.'
    src: 'Источник: Президентская библиотека им. Б. Н. Ельцина, «Шувалов Пётр Иванович» — prlib.ru'
    otryvok: Разрушительное действие ядер однопудового «Единорога» по укреплениям было таким же, как и от восемнадцатифунтовой пушки, но весил «Единорог» на 64 пуда (1048 килограммов) меньше.
    stranica: статья «Шувалов Пётр Иванович»
    href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XVIII/Shuvalov
    pometka: документ
    id: yadro-kak-vdvoe-tyazhelee
    istochnik: prlib-shuvalov
    dlya_voprosa: false
  - summary: Не было ни одной войны вплоть до Крымской, где бы не стреляли русские единороги. Последние вывезли из крепостей только в 1906 году — почти через 150 лет.
    det:
    - Крымская война шла в 1853–1855 годах. В крепостях единороги стояли ещё полвека после неё.
    src: 'Источник: «Звезда», «Единорог — страшный русский зверь», 26.01.2020 — zvezdaweekly.ru'
    otryvok: Ну а далее не было ни одной войны, включая Крымскую 1853-1855 годов, где бы не участвовали страшные русские единороги. … Последние единороги были изъяты из крепостей в 1906 году.
    stranica: «Звезда», 26.01.2020
    href: https://zvezdaweekly.ru/news/20201241050-bG1SP.html
    pometka: документ
    id: do-krymskoj-vojny
    istochnik: zvezda-edinorog-2020
    dlya_voprosa: true
    otvet: '1906'
    otvet_edinstvennyj: true
  - summary: 'Первое в мире универсальное орудие: «единорог» бил и далеко, как пушка, и навесом, как гаубица.'
    det:
    - Единороги могли стрелять по навесной траектории — через головы своих солдат.
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — ar.culture.ru; Президентская библиотека им. Б. Н. Ельцина, «Шувалов Пётр Иванович» — prlib.ru'
    otryvok: 'Единороги стали первым универсальным видом орудия: оно сочетало свойства гаубицы и пушки, и для него годились все виды боеприпасов.'
    stranica: карточка предмета
    href: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
    pometka: два источника
    id: pervoe-universalnoe-orudie
    istochnik: ar-edinorog-1757
    dlya_voprosa: false
  - summary: Раньше в бой везли две разные пушки — для ядра и для гранаты. «Единорог» стрелял из одного ствола ядром, гранатой, картечью и зажигательными снарядами.
    det:
    - Пушки стреляли сплошными ядрами и картечью, гаубицы — бомбами или картечью. Брандкугель — зажигательный снаряд.
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — nav.shm.ru; «Звезда», «Единорог — страшный русский зверь», 26.01.2020 — zvezdaweekly.ru'
    otryvok: 'могло стрелять всеми видами применявшихся снарядов: ядрами, бомбами (гранатами), картечью и брандкугелями'
    stranica: карточка предмета
    href: https://nav.shm.ru/exhibits/3499/
    pometka: два источника
    id: odin-stvol-chetyre-snaryada
    istochnik: gim-model-edinoroga
    dlya_voprosa: false
  - summary: Ни Австрия, ни Пруссия, ни Франция так и не смогли отлить точную копию «единорога».
    det:
    - Копий не появилось, но русское орудие повлияло на «длинные» гаубицы в Европе.
    src: 'Источник: А. В. Громов, «О подражаниях «шуваловской» артиллерии», Сборник исследований и материалов ВИМАИВиВС, вып. XIII, 2024 — museum-artillery.ru, с. 29'
    otryvok: несмотря на отсутствие точных копий единорогов в странах Европы (Австрии, Пруссии, Франции и т. д.) их появление оказало существенное влияние на развитие «длинных» гаубиц
    stranica: с. 29
    href: https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf
    pometka: документ
    id: net-tochnoj-kopii
    istochnik: gromov-podrazhaniya-2024
    dlya_voprosa: false
  - summary: Боевое орудие назвали в честь сказочного зверя с герба Шувалова, а ручки ствола отливали в виде скачущих единорогов.
    kadr:
      src: /muzei/izobreteniya/img/02-02-shuvalov-rotari-1761.jpg
      width: 331
      height: 448
      alt: 'Живописный портрет: граф Пётр Шувалов в напудренном парике и мундире с орденской лентой'
      data_source: https://goskatalog.ru/portal/#/collections?id=4888970
      license: цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Нижегородский государственный художественный музей · Госкаталог
      podpis: Портрет графа Петра Ивановича Шувалова. Пьетро Антонио Ротари, 1761 год, холст, масло. Хранит Нижегородский государственный художественный музей.
      credit: 'Фото: автор не указан. Хранится: Нижегородский государственный художественный музей (КП-5514, НГХМ-Ж-229). Госкаталог музейного фонда РФ, рег. № 4836279.'
      vid: kartina
      prava:
        avtor: Пьетро Антонио Ротари
        god_sozdaniya: 1761
        god_smerti_avtora: 1762
        god_reabilitacii: net
