story:
  kicker: История изобретения
  h2: Как появился «единорог»
  udary:
  - summary: <b>Секретная гаубица Шувалова</b>
    det:
    - В 1756 году Артиллерийское ведомство возглавил граф Пётр Шувалов. При нём артиллеристы искали орудие, которое заменит и пушку, и гаубицу.
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>'
  - summary: <b>От «близняток» к «одиночке»</b>
    det:
    - Капитан Михаил Данилов и Мартынов сначала отлили «близняток», а потом «одиночку», которая стреляла картечью, гранатой и ядром попеременно. В 1757 году так родился «единорог».
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>; Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>'
  - summary: <b>Сто лет службы</b>
    det:
    - «Единороги» стояли в полевой, осадной, крепостной и корабельной артиллерии больше ста лет — до нарезных орудий.
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>; А. В. Громов, «О подражаниях «шуваловской» артиллерии», Сборник исследований и материалов ВИМАИВиВС, вып. XIII, 2024 — <a href="https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf" rel="noopener" target="_blank">museum-artillery.ru</a>'
fakty:
- id: fakty
  nav: Факты
  kicker: Что изобрели
  h2: Факты дня
  udary:
  - summary: <b>«Единорог» изобрели в 1757 году русские артиллеристы Михаил Данилов и Мартынов.</b>
    kadr: &id001
      src: /muzei/izobreteniya/img/02-02-edinorog-1757-speredi.jpg
      width: 1400
      height: 933
      alt: 'Тот же бронзовый ствол 1757 года в другом ракурсе: ручки в виде единорогов и растительный орнамент'
      data_source: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
      license: цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Военно-исторический музей артиллерии, инженерных войск и войск связи · проект «Артефакт» Минкультуры России
      podpis: '12-фунтовый «единорог» 1757 года, другой ракурс: ручки в виде скачущих единорогов. Хранит Военно-исторический музей артиллерии, Санкт-Петербург.'
      credit: 'Фото: Военно-исторический музей артиллерии, инженерных войск и войск связи. Хранится: Военно-исторический музей артиллерии, инженерных войск и войск связи, Санкт-Петербург. Источник: проект «Артефакт», ar.culture.ru.'
    det:
    - На вооружение орудие поставил граф Пётр Шувалов, глава Артиллерийского ведомства с 1756 года. Бронзовый ствол Данилова 1757 года цел и хранится в Петербурге.
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>; Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>'
    otryvok: Новый тип орудия – «единорог» – был изобретен в 1757 году русскими артиллеристами М.В. Даниловым и С.А. Мартыновым и поставлен на вооружение графом П.И. Шуваловым
    stranica: карточка предмета
    href: https://nav.shm.ru/exhibits/3499/
    pometka: документ
  - summary: <b>Из одного ствола «единорог» стрелял ядром, гранатой и картечью.</b>
    det:
    - До него для ядра брали пушку, а для разрывной гранаты — гаубицу. Исторический музей добавляет ещё брандкугели — зажигательные снаряды.
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>; Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>'
    otryvok: 'могло стрелять всеми видами применявшихся снарядов: ядрами, бомбами (гранатами), картечью и брандкугелями'
    stranica: карточка предмета
    href: https://nav.shm.ru/exhibits/3499/
    pometka: документ
  - summary: '<b>«Единорог» — первое в мире универсальное орудие: в нём соединились пушка и гаубица.</b>'
    det:
    - Ствол длиннее, чем у гаубицы, и легче, чем у пушки, — поэтому он бил и далеко, и навесом.
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>'
    otryvok: первый универсальный вид орудия
    stranica: карточка предмета
    href: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
    pometka: документ
  - summary: <b>Сначала Данилов отлил «близняток» — две мортирки сплошь, и лишь потом «одиночку».</b>
    kadr: &id004
      src: /muzei/izobreteniya/img/02-02-edinorog-dvuhkanalnyy.jpg
      width: 800
      height: 441
      alt: Бронзовый ствол с двумя каналами в одной отливке, на стволе клеймо-монограмма
      data_source: https://goskatalog.ru/portal/#/collections?id=14362013
      license: цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Военно-исторический музей артиллерии, инженерных войск и войск связи · Госкаталог
      podpis: Ствол 8-фунтового (105-мм) двухканального единорога — два ствола в одной отливке, первая половина XIX века. Хранит Военно-исторический музей артиллерии, Санкт-Петербург.
      credit: 'Фото: автор не указан. Хранится: Военно-исторический музей артиллерии, инженерных войск и войск связи (КП АФ 396). Госкаталог музейного фонда РФ, рег. № 14240120.'
    det:
    - Неудача с «близнятками» привела к «одиночке», которая и стала «единорогом». Двухканальные стволы в одной отливке потом лили и в XIX веке — один такой хранит Артиллерийский музей.
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>; Госкаталог, рег. № 14240120 — <a href="https://goskatalog.ru/portal/#/collections?id=14362013" rel="noopener" target="_blank">goskatalog.ru</a>'
    otryvok: которая стреляла картечью, гранатой и ядром попеременно
    stranica: карточка предмета
    href: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
    pometka: документ
  - summary: <b>Имя орудию дал герб графа Шувалова — в нём был единорог.</b>
    kadr: &id008
      src: /muzei/izobreteniya/img/02-02-shuvalov-rotari-1761.jpg
      width: 331
      height: 448
      alt: 'Живописный портрет: граф Пётр Шувалов в напудренном парике и мундире с орденской лентой'
      data_source: https://goskatalog.ru/portal/#/collections?id=4888970
      license: цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Нижегородский государственный художественный музей · Госкаталог
      podpis: Портрет графа Петра Ивановича Шувалова. Пьетро Антонио Ротари, 1761 год, холст, масло. Хранит Нижегородский государственный художественный музей.
      credit: 'Фото: автор не указан. Хранится: Нижегородский государственный художественный музей (КП-5514, НГХМ-Ж-229). Госкаталог музейного фонда РФ, рег. № 4836279.'
    det:
    - 'Президентская библиотека: на стволе изображён единорог, как на гербе Шувалова.'
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>; Президентская библиотека им. Б. Н. Ельцина, «Шувалов Пётр Иванович» — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XVIII/Shuvalov" rel="noopener" target="_blank">prlib.ru</a>'
    otryvok: название — от единорога в фамильном гербе П. И. Шувалова
    stranica: карточка предмета
    href: https://nav.shm.ru/exhibits/3499/
    pometka: документ
  - summary: <b>Ручки ствола отливали в виде скачущих единорогов.</b>
    kadr: &id002
      src: /muzei/izobreteniya/img/02-02-edinorog-2-pudovyy.jpg
      width: 800
      height: 413
      alt: Огромный бронзовый ствол на подставке, ручки отлиты в виде фигур зверей-единорогов
      data_source: https://goskatalog.ru/portal/#/collections?id=16009549
      license: цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Военно-исторический музей артиллерии, инженерных войск и войск связи · Госкаталог
      podpis: Ствол 2-пудового (245-мм) единорога, вторая половина XVIII века, длина 216 см. Хранит Военно-исторический музей артиллерии, Санкт-Петербург.
      credit: 'Фото: автор не указан. Хранится: Военно-исторический музей артиллерии, инженерных войск и войск связи (КП АФ 358). Госкаталог музейного фонда РФ, рег. № 15887293.'
    det:
    - Винград — шишку на казённой части — делали в виде головы единорога, а дельфины — ручки для подъёма ствола — в виде скачущих зверей.
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>; Госкаталог, рег. № 15887293 — <a href="https://goskatalog.ru/portal/#/collections?id=16009549" rel="noopener" target="_blank">goskatalog.ru</a>'
