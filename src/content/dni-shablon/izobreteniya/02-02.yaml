story:
  kicker: История изобретения
  h2: Как появился «единорог»
  udary:
  - summary: <b>Секретная гаубица Шувалова</b>
    det:
    - В 1756 году Артиллерийское ведомство возглавил граф Пётр Шувалов. При нём артиллеристы искали орудие, которое заменит и пушку, и гаубицу.
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>'
  - summary: <b>От «близняток» к «одиночке»</b>
    det:
    - Капитан Михаил Данилов и М. Г. Мартынов сначала отлили «близняток», а потом «одиночку», которая стреляла картечью, гранатой и ядром попеременно. В 1757 году так родился «единорог».
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>; Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>'
  - summary: <b>Сто лет службы</b>
    det:
    - «Единороги» стояли в полевой, осадной, крепостной и корабельной артиллерии больше ста лет — до нарезных орудий.
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>; А. В. Громов, «О подражаниях «шуваловской» артиллерии», Сборник исследований и материалов ВИМАИВиВС, вып. XIII, 2024 — <a href="https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf" rel="noopener" target="_blank">museum-artillery.ru</a>'
fakty:
- id: fakty
  nav: Факты
  kicker: Что изобрели
  h2: Факты дня
  udary:
  - summary: '<b>Меньше чем за два года после изобретения Россия отлила почти пятьсот единорогов — 477 к февралю 1759-го.</b>'
    det:
    - 'Первые 12 единорогов ушли в поход уже в кампанию 1757 года, а с 1760 года их стали ставить и на корабли.'
    src: 'Источник: «Звезда», «Единорог — страшный русский зверь», 26.01.2020 — <a href="https://zvezdaweekly.ru/news/20201241050-bG1SP.html" rel="noopener" target="_blank">zvezdaweekly.ru</a>'
    otryvok: 'А уже к 7 февраля 1759 года было изготовлено 477 единорогов.'
    stranica: '«Звезда», 26.01.2020'
    href: https://zvezdaweekly.ru/news/20201241050-bG1SP.html
    pometka: документ
  - summary: '<b>Под Пальцигом единороги встретили пруссаков картечью так, что, по донесению, «едва ль кто из передних спастись могли». Главнокомандующий Салтыков писал: единороги «ужасное имели действо».</b>'
    det:
    - 'Слова о картечи — из донесения генерала К. Бороздина, их приводит историк Н. Е. Бранденбург. Пальциг — сражение 1759 года.'
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — <a href="https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf" rel="noopener" target="_blank">reenactor.ru</a>, с. 324'
    otryvok: 'неприятеля нового рода гаубицами и единорогами «нечаянно (внезапно. – В.О.) столь встретили скорострельною стрельбою картечами храбро, что едва ль кто из передних спастись могли»; В своей реляции по итогам сражения генерал-фельдмаршал П.С. Салтыков писал, что «единороги и шуваловские гаубицы ужасное имели действо»'
    stranica: 'с. 324'
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
  - summary: '<b>Ядро однопудового единорога разбивало укрепления так же, как пушка вдвое тяжелее.</b>'
    det:
    - 'Его сравнивали с восемнадцатифунтовой пушкой: бил так же, а весил на 64 пуда, то есть на 1048 килограммов, меньше.'
    src: 'Источник: Президентская библиотека им. Б. Н. Ельцина, «Шувалов Пётр Иванович» — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XVIII/Shuvalov" rel="noopener" target="_blank">prlib.ru</a>'
    otryvok: 'Разрушительное действие ядер однопудового «Единорога» по укреплениям было таким же, как и от восемнадцатифунтовой пушки, но весил «Единорог» на 64 пуда (1048 килограммов) меньше.'
    stranica: 'статья «Шувалов Пётр Иванович»'
    href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XVIII/Shuvalov
    pometka: документ
  - summary: '<b>Не было ни одной войны вплоть до Крымской, где бы не стреляли русские единороги. Последние вывезли из крепостей только в 1906 году — почти через 150 лет.</b>'
    det:
    - 'Крымская война шла в 1853–1855 годах. В крепостях единороги стояли ещё полвека после неё.'
    src: 'Источник: «Звезда», «Единорог — страшный русский зверь», 26.01.2020 — <a href="https://zvezdaweekly.ru/news/20201241050-bG1SP.html" rel="noopener" target="_blank">zvezdaweekly.ru</a>'
    otryvok: 'Ну а далее не было ни одной войны, включая Крымскую 1853-1855 годов, где бы не участвовали страшные русские единороги. … Последние единороги были изъяты из крепостей в 1906 году.'
    stranica: '«Звезда», 26.01.2020'
    href: https://zvezdaweekly.ru/news/20201241050-bG1SP.html
    pometka: документ
  - summary: '<b>Первое в мире универсальное орудие: «единорог» бил и далеко, как пушка, и навесом, как гаубица.</b>'
    det:
    - 'Единороги могли стрелять по навесной траектории — через головы своих солдат.'
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>; Президентская библиотека им. Б. Н. Ельцина, «Шувалов Пётр Иванович» — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XVIII/Shuvalov" rel="noopener" target="_blank">prlib.ru</a>'
    otryvok: 'Единороги стали первым универсальным видом орудия: оно сочетало свойства гаубицы и пушки, и для него годились все виды боеприпасов.'
    stranica: 'карточка предмета'
    href: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
    pometka: два источника
  - summary: '<b>Раньше в бой везли две разные пушки — для ядра и для гранаты. «Единорог» стрелял из одного ствола ядром, гранатой, картечью и зажигательными снарядами.</b>'
    det:
    - 'Пушки стреляли сплошными ядрами и картечью, гаубицы — бомбами или картечью. Брандкугель — зажигательный снаряд.'
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>; «Звезда», «Единорог — страшный русский зверь», 26.01.2020 — <a href="https://zvezdaweekly.ru/news/20201241050-bG1SP.html" rel="noopener" target="_blank">zvezdaweekly.ru</a>'
    otryvok: 'могло стрелять всеми видами применявшихся снарядов: ядрами, бомбами (гранатами), картечью и брандкугелями'
    stranica: 'карточка предмета'
    href: https://nav.shm.ru/exhibits/3499/
    pometka: два источника
  - summary: '<b>Ни Австрия, ни Пруссия, ни Франция так и не смогли отлить точную копию «единорога».</b>'
    det:
    - 'Копий не появилось, но русское орудие повлияло на «длинные» гаубицы в Европе.'
    src: 'Источник: А. В. Громов, «О подражаниях «шуваловской» артиллерии», Сборник исследований и материалов ВИМАИВиВС, вып. XIII, 2024 — <a href="https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf" rel="noopener" target="_blank">museum-artillery.ru</a>, с. 29'
    otryvok: 'несмотря на отсутствие точных копий единорогов в странах Европы (Австрии, Пруссии, Франции и т. д.) их появление оказало существенное влияние на развитие «длинных» гаубиц'
    stranica: 'с. 29'
    href: https://museum-artillery.ru/assets/files/sbornik-vimaivivs-13-web.pdf
    pometka: документ
  - summary: '<b>Боевое орудие назвали в честь сказочного зверя с герба Шувалова, а ручки ствола отливали в виде скачущих единорогов.</b>'
    kadr: &id008
      src: /muzei/izobreteniya/img/02-02-shuvalov-rotari-1761.jp; Президентская библиотека им. Б. Н. Ельцина, «Шувалов Пётр Иванович» — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XVIII/Shuvalov" rel="noopener" target="_blank">prlib.ru</a>'
      width: 331
      height: 448
      alt: 'Живописный портрет: граф Пётр Шувалов в напудренном парике и мундире с орденской лентой'
      data_source: https://goskatalog.ru/portal/#/collections?id=4888970
      license: цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Нижегородский государственный художественный музей · Госкаталог
      podpis: Портрет графа Петра Ивановича Шувалова. Пьетро Антонио Ротари, 1761 год, холст, масло. Хранит Нижегородский государственный художественный музей.
      credit: 'Фото: автор не указан. Хранится: Нижегородский государственный художественный музей (КП-5514, НГХМ-Ж-229). Госкаталог музейного фонда РФ, рег. № 4836279.'
    det:
    - 'Пётр Шувалов был генерал-фельдцейхмейстером — главой русской артиллерии. Единорог с его фамильного герба изображали и на стволе.'
    src: 'Источник: Государственный Исторический музей, «Ствол единорога (модель)» — <a href="https://nav.shm.ru/exhibits/3499/" rel="noopener" target="_blank">nav.shm.ru</a>; Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>'
    otryvok: 'название орудие получило от мифического единорога, изображенного в фамильном гербе графа П. И. Шувалова; «Единорогами» эти орудия окрестили за декоративный элемент: дельфины и винград (деталь торели) были отлиты в виде этих мифических животных.'
    stranica: 'карточка предмета'
    href: https://nav.shm.ru/exhibits/3499/
    pometka: два источника
  - summary: '<b>Тот самый первый бронзовый ствол 1757 года цел до сих пор и хранится в Петербурге.</b>'
    kadr: &id001
      src: /muzei/izobreteniya/img/02-02-edinorog-1757-speredi.jpg
      width: 1400
      height: 933
      alt: 'Тот же бронзовый ствол 1757 года в другом ракурсе: ручки в виде единорогов и растительный орнамент'
      data_source: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
      license: цитирование в информационных целях с указанием автора и источника (ст. 1274 ГК РФ) · Военно-исторический музей артиллерии, инженерных войск и войск связи · проект «Артефакт» Минкультуры России
      podpis: '12-фунтовый «единорог» 1757 года, другой ракурс: ручки в виде скачущих единорогов. Хранит Военно-исторический музей артиллерии, Санкт-Петербург.'
      credit: 'Фото: Военно-исторический музей артиллерии, инженерных войск и войск связи. Хранится: Военно-исторический музей артиллерии, инженерных войск и войск связи, Санкт-Петербург. Источник: проект «Артефакт», ar.culture.ru.'
    det:
    - 'Это 12-фунтовый единорог работы Михаила Данилова. Он в коллекции Военно-исторического музея артиллерии.'
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>'
    otryvok: '12-фунтовый единорог Данилов М.В. Время создания 1757 … Коллекция Военно-исторический музей артиллерии, инженерных войск и войск связи'
    stranica: 'карточка предмета'
    href: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
    pometka: документ
  - summary: '<b>Павел I убрал из армии все гаубицы до одной и поставил вместо них единороги.</b>'
    det:
    - 'Это случилось в 1797 году, когда император переделывал всю русскую артиллерию.'
    src: 'Источник: Военно-исторический музей артиллерии, «12-фунтовый единорог, 1757 г.», проект «Артефакт» — <a href="https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g" rel="noopener" target="_blank">ar.culture.ru</a>'
    otryvok: 'В 1797 году император Павел I реформировал русскую артиллерию и, в частности, полностью упразднил прежние гаубицы, заменив их единорогами.'
    stranica: 'карточка предмета'
    href: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
    pometka: документ
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: 'Ещё 5 — про «секретную гаубицу» Шувалова. Это не сам «единорог», а орудие той же мастерской, оно воевало рядом с ним'
  udary:
  - summary: '<b>Ствол секретной гаубицы держали под медной крышкой на замке, чтобы никто не заглянул внутрь.</b>'
    det:
    - 'Так вспоминал артиллерист Михаил Данилов — не без иронии: дуло, по его словам, и без того многие знали.'
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — <a href="https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf" rel="noopener" target="_blank">reenactor.ru</a>, с. 319'
    otryvok: 'гоубицу назвали секретною и дула никому не давали смотреть, заслоняли его медными закрышками и замыкали замком.'
    stranica: 'с. 319'
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
  - summary: '<b>Расчёт давал отдельную присягу, а за рассказ о гаубице грозила смертная казнь.</b>'
    det:
    - 'Присягу давали офицеры и рядовые, приставленные к орудию. О смертной казни пишет Андрей Болотов, командир роты Архангелогородского полка.'
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — <a href="https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf" rel="noopener" target="_blank">reenactor.ru</a>, с. 319, 321'
    otryvok: 'оным учинена была особливая присяга, чтоб никому не показывали секретной гоубицы дула; с особой канонирской командой, которой под смертной казнью запрещено было о них сказывать'
    stranica: 'с. 319, 321'
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
  - summary: '<b>Под Цорндорфом пруссаки захватили 17 таких гаубиц, но секрет не узнали: расчёты успели расстрелять все заряды до последнего.</b>'
    det:
    - 'Генерал К. Бороздин доносил о потере 17 гаубиц. Пленный прусский поручик позже подтвердил: зарядов к ним пруссакам не досталось.'
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — <a href="https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf" rel="noopener" target="_blank">reenactor.ru</a>, с. 322–323'
    otryvok: 'Всего печальнее не сыскано … 17-ти шуваловских гаубиц, которые заступлены (захвачены. – В.О.) неприятелем на месте баталии; неприятелю не удалось захватить снарядов секретных гаубиц, потому что был израсходован весь боекомплект'
    stranica: 'с. 322–323'
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
  - summary: '<b>Фридрих Великий выставил трофейные гаубицы в Берлине на обозрение. Прусские офицеры признавали: русские орудия «жесточайше и далее их стреляют».</b>'
    det:
    - 'Захваченные гаубицы сначала отвезли в Кюстрин, после показа в Берлине их переплавили.'
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — <a href="https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf" rel="noopener" target="_blank">reenactor.ru</a>, с. 323'
    otryvok: 'Захваченные неприятелем гаубицы были доставлены в Кюстрин, затем по приказу короля Фридриха – в Берлин, выставлены на обозрение и потом отправлены на переплавку; по свидетельству же прусских артиллерийских офицеров – оные русские орудии жесточайше и далее их стреляют'
    stranica: 'с. 323'
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
  - summary: '<b>Своих гаубиц русские солдаты узнавали в бою на слух и по густому чёрному дыму.</b>'
    det:
    - 'Так Андрей Болотов описал сражение под Егерсдорфом в 1757 году.'
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — <a href="https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf" rel="noopener" target="_blank">reenactor.ru</a>, с. 321'
    otryvok: 'а особенно из наших секретных шуваловских гаубиц, которые по особенному своему звуку и густому черному дыму мы (могли. – В.О.) явственно видеть и отличать от прочей пушечной стрельбы'
    stranica: 'с. 321'
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
