audioguide:
  audioSrc: /muzei/izobreteniya/audio-guide-edinorog-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт по залу «единорога»: от секретной гаубицы до ста лет службы.'
  stops:
