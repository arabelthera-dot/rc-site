quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Для викторины нужен JavaScript. Ответы: 1757; ядро, граната и картечь; от герба Шувалова; в Вену; больше ста лет.'
  ball: 8
  voprosy:
  - q: В каком году изобрели «единорог»?
    o:
    - '1700'
    - '1757'
    - '1812'
    a: 1
    e: В 1757 году, при графе Петре Шувалове.
  - q: Чем стрелял «единорог»?
    o:
    - Только ядрами
    - Только гранатами
    - Ядром, гранатой и картечью
    a: 2
    e: Из одного ствола — всеми снарядами.
  - q: Откуда имя «единорог»?
    o:
    - От герба Шувалова
    - От названия завода
    - От фамилии мастера
    a: 0
    e: В гербе графа Шувалова был единорог.
  - q: Куда в 1758 году отправили русские единороги?
    o:
    - В Лондон
    - В Вену
    - В Мадрид
    a: 1
    e: Союзникам-австрийцам, в 1759 году их испытывали под Веной.
  - q: Сколько лет служил «единорог»?
    o:
    - 20 лет
    - 50 лет
    - Больше ста лет
    a: 2
    e: До появления нарезных орудий во второй половине XIX века.
