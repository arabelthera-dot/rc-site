audioguide:
  audioSrc: audio-guide-edinorog-ru.mp3
  durationLabel: 3 минуты
  lead: 'Голос ведёт по залу «единорога»: от первого ствола 1757 года через секретную гаубицу Шувалова до последних единорогов в крепостях 1906 года. Шесть остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу.'
  stops:
    - t: 0
      mark: '0:00'
      title: Первый ствол
    - t: 30
      mark: '0:30'
      title: Как появился
    - t: 60
      mark: '1:00'
      title: Факты дня
    - t: 90
      mark: '1:30'
      title: 'Игра: четыре снаряда'
    - t: 120
      mark: '2:00'
      title: Секретная гаубица
    - t: 150
      mark: '2:30'
      title: Что здесь первое
  transcript:
    - '<p>«Здравствуйте. Мы в зале гаубицы «единорог». Посмотрите на обложку: бронзовый ствол на деревянном лафете, а ручки отлиты в виде двух скачущих зверей. Это тот самый первый ствол тысяча семьсот пятьдесят седьмого года, работа Михаила Данилова. Он цел до сих пор и хранится в Петербурге, в Военно-историческом музее артиллерии. Главное о нём одной фразой: русский «единорог» первым в мире стрелял ядром, гранатой и картечью из одного ствола.»</p>'
    - '<p>«Спуститесь к истории «Как появился «единорог»». В тысяча семьсот пятьдесят шестом году Артиллерийское ведомство возглавил граф Пётр Шувалов. При нём артиллеристы искали орудие, которое заменит и пушку, и гаубицу. Раньше в бой везли две разные пушки — для ядра и для гранаты. «Единорог» бил и далеко, как пушка, и навесом, как гаубица. А имя ему дал сказочный зверь с герба Шувалова.»</p>'
    - '<p>«Теперь факты дня. Меньше чем за два года Россия отлила четыреста семьдесят семь единорогов — столько их было к февралю тысяча семьсот пятьдесят девятого года. Под Пальцигом единороги встретили пруссаков картечью так, что, по донесению, «едва ль кто из передних спастись могли». Ядро однопудового единорога разбивало укрепления так же, как пушка вдвое тяжелее. Ни Австрия, ни Пруссия, ни Франция так и не смогли отлить точную копию. А Павел Первый убрал из армии все гаубицы до одной и поставил вместо них единороги.»</p>'
    - '<p>«Дальше игра «Один ствол — четыре снаряда». На схеме — поле боя и цели. Выберите снаряд и нажмите на цель, которую он берёт: ядро, гранату, картечь или зажигательный снаряд. Расставите все четыре — получите двадцать баллов.»</p>'
    - '<p>«Ниже ещё пять фактов — про «секретную гаубицу» Шувалова. Это не сам «единорог», а орудие той же мастерской, оно воевало рядом с ним. Её ствол прятали под медной крышкой, чтобы никто не заглянул внутрь. Расчёт давал отдельную присягу, а за рассказ о гаубице грозила смертная казнь. Под Цорндорфом пруссаки захватили семнадцать таких гаубиц, но секрет не узнали: расчёты успели расстрелять все заряды до последнего. А своих гаубиц русские солдаты узнавали в бою на слух и по густому чёрному дыму.»</p>'
    - '<p>«Найдите блок «Что именно здесь первое в мире». Граница такая: в тысяча семьсот пятьдесят седьмом году в России создано первое универсальное орудие — один ствол для ядра, разрывной гранаты и картечи. Не было ни одной войны вплоть до Крымской, где бы не стреляли русские единороги. Последние вывезли из крепостей только в тысяча девятьсот шестом году — почти через сто пятьдесят лет. Вот и весь зал. Пройдите викторину из пяти вопросов и посмотрите итог дня.»</p>'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
