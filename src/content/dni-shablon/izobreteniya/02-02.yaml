- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Ещё 5 — про «секретную гаубицу» Шувалова. Это не сам «единорог», а орудие той же мастерской, оно воевало рядом с ним
  udary:
  - summary: Ствол секретной гаубицы держали под медной крышкой на замке, чтобы никто не заглянул внутрь.
    det:
    - 'Так вспоминал артиллерист Михаил Данилов — не без иронии: дуло, по его словам, и без того многие знали.'
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — reenactor.ru, с. 319'
    otryvok: гоубицу назвали секретною и дула никому не давали смотреть, заслоняли его медными закрышками и замыкали замком.
    stranica: с. 319
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
    id: kryshka-na-zamke
    istochnik: otochkin-sekretnaya-gaubica
    dlya_voprosa: false
  - summary: Расчёт давал отдельную присягу, а за рассказ о гаубице грозила смертная казнь.
    det:
    - Присягу давали офицеры и рядовые, приставленные к орудию. О смертной казни пишет Андрей Болотов, командир роты Архангелогородского полка.
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — reenactor.ru, с. 319, 321'
    otryvok: оным учинена была особливая присяга, чтоб никому не показывали секретной гоубицы дула; с особой канонирской командой, которой под смертной казнью запрещено было о них сказывать
    stranica: с. 319, 321
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
    id: prisyaga-rascheta
    istochnik: otochkin-sekretnaya-gaubica
    dlya_voprosa: false
  - summary: 'Под Цорндорфом пруссаки захватили 17 таких гаубиц, но секрет не узнали: расчёты успели расстрелять все заряды до последнего.'
    det:
    - 'Генерал К. Бороздин доносил о потере 17 гаубиц. Пленный прусский поручик позже подтвердил: зарядов к ним пруссакам не досталось.'
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — reenactor.ru, с. 322–323'
    otryvok: Всего печальнее не сыскано … 17-ти шуваловских гаубиц, которые заступлены (захвачены. – В.О.) неприятелем на месте баталии; неприятелю не удалось захватить снарядов секретных гаубиц, потому что был израсходован весь боекомплект
    stranica: с. 322–323
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
    id: 17-gaubic-pod-corndorfom
    istochnik: otochkin-sekretnaya-gaubica
    dlya_voprosa: true
    otvet: '17'
    otvet_edinstvennyj: true
  - summary: 'Фридрих Великий выставил трофейные гаубицы в Берлине на обозрение. Прусские офицеры признавали: русские орудия «жесточайше и далее их стреляют».'
    det:
    - Захваченные гаубицы сначала отвезли в Кюстрин, после показа в Берлине их переплавили.
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — reenactor.ru, с. 323'
    otryvok: Захваченные неприятелем гаубицы были доставлены в Кюстрин, затем по приказу короля Фридриха – в Берлин, выставлены на обозрение и потом отправлены на переплавку; по свидетельству же прусских артиллерийских офицеров – оные русские орудии жесточайше и далее их стреляют
    stranica: с. 323
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
    id: trofei-v-berline
    istochnik: otochkin-sekretnaya-gaubica
    dlya_voprosa: false
  - summary: Своих гаубиц русские солдаты узнавали в бою на слух и по густому чёрному дыму.
    det:
    - Так Андрей Болотов описал сражение под Егерсдорфом в 1757 году.
    src: 'Источник: В. В. Оточкин, «„Секретная гаубица“ П. И. Шувалова: история создания и боевого применения» // Война и оружие: новые исследования и материалы. Труды Шестой Международной научно-практической конференции. СПб., 2015. Ч. III — reenactor.ru, с. 321'
    otryvok: а особенно из наших секретных шуваловских гаубиц, которые по особенному своему звуку и густому черному дыму мы (могли. – В.О.) явственно видеть и отличать от прочей пушечной стрельбы
    stranica: с. 321
    href: https://www.reenactor.ru/ARH/PDF/Otochkin_00.pdf
    pometka: документ
    id: na-sluh-i-po-dymu
    istochnik: otochkin-sekretnaya-gaubica
    dlya_voprosa: false
