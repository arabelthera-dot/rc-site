return:
  q: Сколько лет «единорог» простоял на вооружении?
  a: 'Больше ста лет: с 1757 года до введения нарезных орудий во второй половине XIX века.'
  src: Государственный Исторический музей, nav.shm.ru; А. В. Громов, Сборник ВИМАИВиВС, вып. XIII, 2024, с. 21
proof:
  status: found
  claim_id: rc:izobreteniya:02-02-edinorog:claim-1757
  ours:
    kind: museum-object
    title: 12-фунтовый единорог, 1757 г.
    date: '1757'
    holder: Военно-исторический музей артиллерии, инженерных войск и войск связи
    source_url: https://ar.culture.ru/ru/subject/12-funtovyy-edinorog-1757-g
audioguide:
  audioSrc: audio-guide-edinorog-ru.mp3
  durationLabel: 2 минуты 7 секунд
  lead: 'Голос ведёт по залу «единорога»: от первого в мире универсального орудия через герб Шувалова и пальцигскую картечь — к ста пятидесяти годам службы. Пять остановок.'
  stops:
    - t: 0
      mark: '0:00'
      title: 'Первое универсальное орудие'
    - t: 32
      mark: '0:32'
      title: 'Зверь с герба Шувалова'
    - t: 39
      mark: '0:39'
      title: 'Почти пятьсот за два года'
    - t: 64
      mark: '1:04'
      title: 'Картечь под Пальцигом'
    - t: 90
      mark: '1:30'
      title: 'Сто пятьдесят лет службы'
  transcript:
    - 'Здравствуйте. Мы в зале гаубицы «единорог». Тысяча семьсот пятьдесят седьмой год, Петербург, Артиллерийское ведомство графа Петра Шувалова. Михаил Данилов и Мартынов отливают первое в мире универсальное орудие. Раньше в бой везли две разные пушки — для ядра и для гранаты. «Единорог» стреляет из одного ствола ядром, гранатой, картечью и зажигательными снарядами. Он бьёт и далеко, как пушка, и навесом, как гаубица, — через головы своих солдат. Назвали его в честь сказочного зверя с герба Шувалова, а ручки ствола отлили в виде скачущих единорогов.'
    - 'Россия отливает единороги быстро: первые двенадцать уходят в поход уже в кампанию тысяча семьсот пятьдесят седьмого года, а к февралю тысяча семьсот пятьдесят девятого их уже четыреста семьдесят семь. Ядро однопудового единорога разбивает укрепления так же, как пушка вдвое тяжелее, а весит орудие на тысячу сорок восемь килограммов меньше. Под Пальцигом единороги встречают пруссаков картечью так, что, по донесению генерала Бороздина, «едва ль кто из передних спастись могли». Главнокомандующий Салтыков пишет: единороги «ужасное имели действо». Прусские офицеры признают: русские орудия «жесточайше и далее их стреляют». Ни Австрия, ни Пруссия, ни Франция так и не смогли отлить точную копию «единорога».'
    - 'Не было ни одной войны вплоть до Крымской, где бы не стреляли русские единороги. Павел Первый в тысяча семьсот девяносто седьмом году убирает из армии все гаубицы до одной и ставит вместо них единороги. Последние вывозят из крепостей только в тысяча девятьсот шестом году — почти через сто пятьдесят лет. А тот самый первый бронзовый ствол тысяча семьсот пятьдесят седьмого года цел до сих пор и хранится в Петербурге, в Военно-историческом музее артиллерии. Ниже — игра, викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
