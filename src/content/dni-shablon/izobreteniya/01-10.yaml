  h2: Что именно Бритнев сделал первым
  granica: <b>Граница первенства:</b> первое судно, которому нарочно дали скошенный нос, чтобы оно наползало на лёд и ломало его своим весом, — «Пайлот», 1864 год. Эту форму и назвали ледокольной; по его чертежам строили первые немецкие ледоколы.
  net: <b>Чего здесь нет:</b> Бритнев не первым стал ходить зимой и не первым колол лёд. Первенство — в форме носа и способе ломать лёд весом. «Пайлот» был маленьким портовым буксиром. Линейный ледокол для открытого моря и Арктики — это «Ермак», 1899 год.
