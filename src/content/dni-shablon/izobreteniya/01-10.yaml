  transcript:
    - "<p>«Портрет-миниатюра 1845 года: Михаил Бритнев, кронштадтский судовладелец. Снимков самого „Пайлота“ мы не нашли — форму его носа показывает модель на странице».</p>"
    - <p>«Михаил Бритнев, кронштадтский судовладелец, учился в Англии корабельной архитектуре. В 1862 году там же для него построили буксир „Пайлот“ — 26 метров, 85 лошадиных сил».</p>
    - "<p>«Нос „Пайлота“ срезали ниже ватерлинии под 20 градусов: судно вползало на лёд и ломало его своим весом. Первый рейс — 22 апреля 1864 года, из Кронштадта к Ораниенбауму».</p>"
    - <p>«Зимой 1871 года замёрзла Эльба. Немецкие инженеры купили чертежи „Пайлота“ за 300 рублей и построили по ним первые немецкие ледоколы».</p>
    - <p>«Форму носа назвали ледокольной. В 1899 году Россия получила „Ермак“, первый арктический ледокол».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
