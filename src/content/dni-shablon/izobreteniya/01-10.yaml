  intro: Та же история коротким роликом — от парохода, который бьётся о кронштадтский лёд, до «Пайлота», ставшего прообразом ледоколов.
  poster: video/day-10jan-britnev-poster.jpg?v=1
  mp4: video/day-10jan-britnev.mp4?v=1
  note: "Кадры ролика — подлинные: гравюра «Пароход „North Sea“ пробивается сквозь лёд у Кронштадта» (Illustrated London News, 1856); панорама Кронштадта, гравюра ок. 1854; портрет М. О. Бритнева, миниатюра 1845; почтовая марка СССР 1976 года «Ледокол „Пайлот“» — условный рисунок, как выглядел «Пайлот», точно не известно; В. В. Игнациус «Кронштадтская гавань зимой», 1870–1880-е, и литография «Военная гавань зимой в 1851 году» (Центральный военно-морской музей); открытка «Кронштадт. Ораниенбаумская пароходная пристань», начало XX века (Музей истории Кронштадта); ледокол «Ермак» у Кронштадта (The Graphic, 1900) — наследник «Пайлота». Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История изобретения · 12 ударов
  h2: Корабль, который полез на лёд
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: "Кронштадт стоит на острове посреди Финского залива: пока лёд не сойдёт, пароход к нему не подойдёт."
      det:
        - "Остров Котлин с Кронштадтом отделён от южного берега, где стоит Ораниенбаум, полосой воды в несколько вёрст. Когда залив замерзал, пароходы вставали до весны. Бритнев потом и мерил успех этим: в апреле 1865 года навигация благодаря «Пайлоту» открылась раньше обычного."
      src: "Источник: Президентская библиотека имени Б. Н. Ельцина, «Михаил Осипович Бритнев (1822–1889)»."
      kadr:
        src: "/muzei/izobreteniya/img/01-10-vid-kronshtadta-s-oranienbauma.jpg"
        width: 800
        height: 450
        alt: "Гравюра «Вид Кронштадта со стороны Ораниенбаума»: парусный корабль и лодка на волнах, вдали укрепления и мачты Кронштадта"
        data_source: "https://goskatalog.ru/portal/#/collections?id=25393848"
        license: "общественное достояние (гравюра середины XIX века); Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
        podpis: "Кронштадт с южного берега, от Ораниенбаума: город отделён от материка полосой открытой воды, через которую зимой не мог пройти ни один пароход."
        credit: "Гравёр Гоберт, гравюра из серии «Виды России» (Памятные книжки 1840-х гг.), оттиск 1860-х гг. Хранится: Государственный научно-исследовательский музей архитектуры имени А. В. Щусева, инв. Р III-8157/8. Госкаталог № 25249250. Источник: Госкаталог музейного фонда РФ."
    - summary: Михаил Бритнев родился в 1822 году в Кронштадте, в купеческой семье. Отца он потерял в двенадцать лет.
      det:
        - Бритнев родом из купеческой семьи потомственного почётного гражданина Кронштадта. Отец умер, когда сыну было двенадцать лет.
        - Учился в уездном четырёхклассном училище, потом в коммерческом училище в Петербурге.
      src: "Источник: Президентская библиотека имени Б. Н. Ельцина."
    - summary: Купеческий сын поехал в Англию учиться корабельной архитектуре — и вернулся в Кронштадт судовым хозяином.
      det:
        - В Англии Бритнев изучал корабельную архитектуру. Дома он занялся ремонтом судов и спасательными работами, держал паровые плавучие краны для разгрузки кораблей.
      src: "Источники: Президентская библиотека; О. Обыденская, «Очень деловой человек. Кто придумал ледокол», «Сноб», 03.10.2023."
    - summary: "В 1862 году он заказал в Англии небольшой буксир «Пайлот»: 26 метров длины, машина в 85 лошадиных сил."
      det:
        - «Пайлот» построили в Англии по заказу Бритнева в 1862 году. Длина — 26 метров, осадка — до 2,5 метра, мощность машины — 85 лошадиных сил. Обычный небольшой буксир.
      src: "Источник: Президентская библиотека имени Б. Н. Ельцина."
    - summary: Бритнев велел срезать нос «Пайлота» ниже ватерлинии под углом 20 градусов к килю.
      find: true
      tag: Находка дня
      det:
        - "Форштевень — передняя кромка корпуса. У обычного судна он почти отвесный. Бритнев заострил его ниже ватерлинии и скосил под углом 20 градусов. Судно перестало упираться в кромку льда: скошенный нос подныривал под неё."
        - "Попробуй сам в модели ниже: прямой нос против скошенного."
      src: "Источники: пресс-релиз ОСК, korabel.ru, 2022; Президентская библиотека."
    - summary: Корабль больше не бил лёд, а вползал на него и ломал собственным весом.
      det:
        - "Так объясняют сами кораблестроители: скошенный нос позволил судну «вползать на лёд и ломать его своим весом». Удар в лоб тратит силу машины и калечит корпус. Вес давит сверху на тонкую плиту, и лёд проламывается."
      src: "Источник: пресс-релиз ОСК, korabel.ru, 2022."
    - summary: 22 апреля 1864 года переделанный «Пайлот» пошёл первым рейсом из Кронштадта к Ораниенбауму.
      det:
        - С этого рейса «Деловой Петербург» и «Сноб» ведут отсчёт ледокольного флота.
      src: 'Источники: И. Хлебов, «"Пайлот" Первый», «Деловой Петербург», 21.04.2019; «Сноб», 03.10.2023.'
      kadr:
        src: "/muzei/izobreteniya/img/01-10-oranienbaum-pristan-1856.jpg"
        width: 530
        height: 326
        alt: "Акварель «Вид на взморье и пристань в Ораниенбауме»: длинный деревянный мол, у него колёсный пароход с мачтами, в дымке у горизонта ещё одно судно"
        data_source: "https://goskatalog.ru/portal/#/collections?id=5817357"
        license: "общественное достояние (И. И. Шарлемань, 1824–1870); Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
        podpis: "Ораниенбаумская пристань за восемь лет до первого рейса «Пайлота»: именно к этому берегу от Кронштадта шли бритневские пароходы."
        credit: "Художник И. И. Шарлемань, 1856. Хранится: Государственный музей-заповедник «Петергоф», инв. ПДМП 33-ак. Госкаталог № 5659138. Источник: Госкаталог музейного фонда РФ."
    - summary: "Льды он не отменил, но растянул навигацию: весной 1865-го пароходы пошли раньше обычного."
      det:
        - "Его сила — в начале и конце сезона, когда кромка тоньше: несколько лишних недель навигации для купеческой линии означали деньги. Президентская библиотека пишет, что «Пайлот» ходил по линии Кронштадт — Ораниенбаум во льдах вплоть до 1890 года."
      src: "Источники: Президентская библиотека имени Б. Н. Ельцина, «Михаил Осипович Бритнев (1822–1889)» (апрель 1865 года, линия до 1890 года); А. Мельникова, «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник» (навигацию продлили на несколько недель)."
      kadr:
        src: "/muzei/izobreteniya/img/01-10-kronshtadt-gavan-zimoj-ignacius.jpg"
        width: 800
        height: 568
        alt: "Рисунок В. В. Игнациуса «Кронштадтская гавань зимой»: вмёрзшие во лёд военные корабли, по льду идут матросы с пешнями"
        data_source: "https://goskatalog.ru/portal/#/collections?id=18159468"
        license: "общественное достояние (В. В. Игнациус, умер более 70 лет назад); Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
        podpis: "Кронштадтская гавань зимой в 1870–1880-е годы, когда «Пайлот» уже ходил во льду: корабли стоят вмёрзшими до весны, люди рубят лёд вручную."
        credit: "Художник В. В. Игнациус, 1870–1880-е гг. Хранится: Центральный военно-морской музей имени императора Петра Великого, инв. 02 Р-2656. Госкаталог № 18032454. Источник: Госкаталог музейного фонда РФ."
    - summary: Зимой 1871 года замёрзла Эльба — и немцы приехали в Кронштадт за чертежами. Бритнев продал их за 300 рублей.
      det:
        - Суровая зима заперла Гамбургский порт. Немецкие инженеры купили у Бритнева чертежи «Пайлота», заплатив, как пишет «Деловой Петербург», «не щедрые 300 рублей».
      src: "Источники: Президентская библиотека; «Деловой Петербург», 2019; «Сноб», 2023."
    - summary: По русским чертежам в Гамбурге построили первые немецкие ледоколы.
      det:
        - Президентская библиотека называет их «Айсбрехер-1» и «Айсбрехер-2». «Деловой Петербург» даёт немецкому ледоколу другое имя — «Айсфукс», «Ледяной лис». Какой из кораблей пошёл первым, мы по русским источникам не установили и оставляем оба свидетельства.
      src: "Источники: Президентская библиотека; «Деловой Петербург», 2019."
    - summary: "Сам Бритнев строил дальше: «Бой» в 1875 году, «Буй» в 1889-м — оба ледокольные."
      det:
        - В 1869–1873 годах был городским головой Кронштадта, основал водолазную школу, сиротский дом и женскую гимназию.
      src: "Источники: Президентская библиотека; «Сноб», 2023."
    - summary: Форму его носа назвали «ледокольной», а «Пайлот» — прообразом ледоколов.
      det:
        - По словам ОСК, форма носа «впоследствии стала именоваться „ледокольной“», а проект Бритнева «стал прообразом нового типа судов — ледоколов». Бритнев умер в 1889 году. Через десять лет в Россию пришёл «Ермак» — первый арктический ледокол (о нём — 8 января).
      src: "Источники: пресс-релиз ОСК, korabel.ru, 2022; Президентская библиотека."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Бритневе
    h2: Факты дня
    udary:
      - summary: <b>Слово «ледокол» сначала досталось другому кораблю — флотскому, с гирями и минами.</b>
        det:
          - Сначала «ледоколом» звался флотский корабль с гирями и минами, а «Пайлот» считался всего лишь «буксиром-ледорезом».
          - Начальник Морской строительной части Кронштадтского порта Николай Эйлер переделал канонерскую лодку «Опыт». Паровые краны роняли на лёд тяжёлые гири, а там, где лёд не раскалывался, его взрывали минами. Своё судно Эйлер назвал «минно-гиревой ледокол „Опыт“».
          - В ноябре 1866 года морское ведомство устроило двум судам состязание. «Пайлот» обошёл застрявший во льдах «Опыт». Изобретение Эйлера забыли, а слово «ледокол» перешло к судну Бритнева.
        src: 'Источник: «Михаил Осипович Бритнев (1822–1889)», Президентская библиотека имени Б. Н. Ельцина — https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev ; И. Хлебов, «"Пайлот" Первый», «Деловой Петербург», 21.04.2019 — https://www.dp.ru/a/2019/04/21/Pajlot_Pervij'
        otryvok: «Однако «Пайлот» называли не ледоколом, а буксиром-ледорезом. Ледоколом назывался другой корабль. <…> Эйлер назвал свое судно «минно-гиревой ледокол „Опыт“». Морское ведомство устроило сравнительные испытания между «Пайлотом» и «Опытом» в ноябре 1866 года. «Буксир-ледорез» оказался эффективнее и обошёл застрявший во льдах «Опыт»» (Президентская библиотека). — «Так что об изобретении Эйлера вскоре предпочли забыть, а название "ледокол" досталось "Пайлоту" — как–то привязалось само собой» («Деловой Петербург»).
        stranica: «Михаил Осипович Бритнев (1822–1889)» // Президентская библиотека имени Б. Н. Ельцина, раздел «Великая Россия. Выдающиеся учёные XIX века»; Хлебов И. «"Пайлот" Первый. Начало ледокольного флота положено 22 апреля 1864 года на пути в Кронштадт» // Деловой Петербург, 22.04.2019 (в URL 21.04); второй источник — https://www.dp.ru/a/2019/04/21/Pajlot_Pervij
        href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev
        pometka: два источника
      - summary: <b>Нос первого в мире ледокола Бритнев срезал по образцу поморских лодок.</b>
        det:
          - Нос «Пайлота» Бритнев переделал по образцу поморских лодок и чертежи начертил сам.
          - Бритнев решил переделать «Пайлот» по образцу поморских лодок. Носовую часть буксира укрепили, заострили и срезали так, чтобы судно «вползало» на лёд.
          - Чертежи новой конструкции, как пишет Президентская библиотека, Бритнев выполнил сам. Корабельной архитектуре он учился в молодости в Англии.
        src: "Источник: «Михаил Осипович Бритнев (1822–1889)», Президентская библиотека имени Б. Н. Ельцина — https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev"
        otryvok: "«Чертежи новой конструкции М. О. Бритнев выполнил сам. Бритнев решил переделать свой пароходный винтовой буксир «Пайлот» по образцу поморских лодок: носовую оконечность «Пайлота» укрепили, заострили и срезали под углом 20 градусов ниже ватерлинии к линии киля, так чтобы он мог «вползать» на лёд, разрушая его своей тяжестью» (Президентская библиотека)."
        stranica: «Михаил Осипович Бритнев (1822–1889)» // Президентская библиотека имени Б. Н. Ельцина, раздел «Великая Россия. Выдающиеся учёные XIX века»; Мельникова А. «Михаил Осипович Бритнев. Служение родному городу» (продолжение; начало в «КВ» № 47 от 20.11.2014) // Кронштадтский вестник
        href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev
        pometka: документ
        kadr:
          src: "/muzei/izobreteniya/img/01-10-pomorskij-karbas.jpg"
          width: 800
          height: 600
          alt: "Модель поморского карбаса XIX века: деревянная беспалубная лодка с двумя мачтами и прямым парусом"
          data_source: "https://goskatalog.ru/portal/#/collections?id=17170436"
          license: "Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
          podpis: "Модель поморского карбаса XIX века — лодки того самого типа, по образцу которой Бритнев заострил и срезал нос «Пайлота»."
          credit: "Автор модели не указан, XX век (масштаб 1:20). Хранится: Северный морской музей (Архангельск), СММ КП 1742. Госкаталог № 17042957. Источник: Госкаталог музейного фонда РФ."
      - summary: <b>«Пайлот» ломал лёд без всякой брони — и за всю службу ни разу серьёзно не пострадал.</b>
        det:
          - «Пайлот» ломал лёд без всякой брони, с обычной обшивкой, и за всю службу ни разу серьёзно не пострадал.
          - Скошенный нос не только помогал ломать лёд. Он заметно ослаблял удар, когда судно встречало льдину. Поэтому обшивку корпуса не пришлось усиливать.
          - Президентская библиотека пишет, что «Пайлот» возил почту и пассажиров между Кронштадтом и Ораниенбаумом во льдах вплоть до 1890 года, то есть больше четверти века.
        src: "Источник: «Михаил Осипович Бритнев (1822–1889)», Президентская библиотека имени Б. Н. Ельцина — https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev"
        otryvok: «Наклонный форштевень не только помогал ломать лёд, но и значительно ослаблял силу удара при встрече со льдинами. Благодаря этому, имея обычную обшивку корпуса, «Пайлот» за всё время эксплуатации ни разу не получил серьёзных повреждений. <…> Судно использовалось для почтово-пассажирского сообщения между Кронштадтом и Ораниенбаумом в ледовых условиях вплоть до 1890 года»
        stranica: «Михаил Осипович Бритнев (1822–1889)» // Президентская библиотека имени Б. Н. Ельцина, раздел «Великая Россия. Выдающиеся учёные XIX века»
        href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev
        pometka: документ
      - summary: "<b>Как выглядел первый в мире ледокол, никто не знает: не осталось ни чертежей, ни рисунка.</b>"
        det:
          - От «Пайлота» не осталось ни чертежей, ни достоверного изображения.
          - "Президентская библиотека с сожалением отмечает: не сохранилось ни чертежей «Пайлота», ни его достоверного изображения. Каким именно было судно, с которого началась история ледоколов, сегодня точно не известно."
          - В 1976 году вышла почтовая марка с именем первого ледокола. Но, по мнению экспертов, на ней лишь условный пароход, похожий на все пароходы тех лет.
        src: "Источник: «Михаил Осипович Бритнев (1822–1889)», Президентская библиотека имени Б. Н. Ельцина — https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev"
        otryvok: «К сожалению, не сохранилось ни чертежей, ни достоверного изображения парохода «Пайлот». В 1976 году была выпущена марка с именем первого ледокола, но, по мнению экспертов, это лишь условное изображение всех пароходов тех лет.»
        stranica: «Михаил Осипович Бритнев (1822–1889)» // Президентская библиотека имени Б. Н. Ельцина, раздел «Великая Россия. Выдающиеся учёные XIX века»
        href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev
        pometka: документ
        kadr:
          src: "/muzei/izobreteniya/img/01-10-marka-pajlot-1976.jpg"
          width: 1284
          height: 876
          alt: "Гашёная почтовая марка СССР 1976 года, 4 копейки: пароход с высокой трубой во льдах, надпись «Ледокол „Пайлот“»"
          data_source: "https://goskatalog.ru/portal/#/collections?id=8406071"
          license: "государственный знак почтовой оплаты — не объект авторского права (ст. 1259 ГК РФ); Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
          podpis: "Марка «Ледокол „Пайлот“» 1976 года: по мнению экспертов, на ней лишь условный пароход тех лет — подлинного изображения «Пайлота» не сохранилось."
          credit: "Почта СССР, 1976. Хранится: Чегдомынский межпоселенческий краеведческий музей, ЧКМ КП № 911/74. Госкаталог № 8299909. Источник: Госкаталог музейного фонда РФ."
      - summary: <b>В опасный лёд Бритнев сам вставал за штурвал — а богатым так и не стал.</b>
        det:
          - В опасный лёд хозяин линии сам вставал за штурвал. А богатым так и не стал.
          - "Когда обстановка на воде казалась особенно опасной, Бритнев сам становился к штурвалу. Историк Владимир Андриенко писал: «Главным ледоколом в многолетнем предприятии по обеспечению сообщения между Котлином и ораниенбаумским берегом был не „Пайлот“, а сам Бритнев»."
          - После его смерти газета «Кронштадтский вестник» отметила, что за долгую жизнь он не нажил большого состояния, «так как был настолько честен и добр к ближнему».
        src: "Источник: О. Обыденская, «Очень деловой человек. Кто придумал ледокол», «Сноб», 03.10.2023 — https://snob.ru/history/ochen-delovoj-chelovek-kto-pridumal-ledokol/"
        otryvok: «Когда ситуация на воде казалась Бритневу особенно опасной, он сам вставал за штурвал. «Главным ледоколом в многолетнем предприятии по обеспечению сообщения между Котлином и ораниенбаумским берегом был не “Пайлот”, а сам Бритнев», — писал историк Владимир Андриенко. <…> «Несмотря на долголетнюю деятельность, Бритнев не приобрел себе большого состояния, так как был настолько честен и добр к ближнему»»
        stranica: Обыденская О. «Очень деловой человек. Кто придумал ледокол» // Сноб, 03.10.2023 (серия «Кто придумал»)
        href: https://snob.ru/history/ochen-delovoj-chelovek-kto-pridumal-ledokol/
        pometka: документ
      - summary: <b>Флот не верил «Пайлоту» — и устроил ему гонку во льду с ледоколом-«гиревиком».</b>
        det:
          - "В ноябре 1866 года, когда залив затянуло льдом, чиновники Морского ведомства устроили состязание: бритневский «Пайлот» против казённого судна «Опыт», которое кололо лёд, роняя на него тяжёлые гири."
          - "«Пайлот» обошёл застрявший во льдах «Опыт». Начальство это не убедило, но жизнь рассудила: «Опыт» постоянно ломался и так и не смог возить людей между Кронштадтом и Ораниенбаумом, а пароходики Бритнева возили."
        src: 'Источник: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник», 2014 — <a href="https://kronvestnik.ru/history/16467" rel="noopener">kronvestnik.ru/history/16467</a>; «Путь прокладывает лоцман. Михаил Бритнев — создатель первого судна для работы во льдах», «Санкт-Петербургские ведомости», 2023 — <a href="https://spbvedomosti.ru/news/nasledie/put-prokladyvaet-lotsman-mikhail-britnev-sozdatel-pervogo-sudna-dlya-raboty-vo-ldakh/" rel="noopener">spbvedomosti.ru/news/nasledie/…</a>.'
        otryvok: «В начале ноября 1866 года, когда Финский залив уже покрылся наносным льдом, чиновники Морского ведомства провели сравнительные испытания «Пайлота» и ледокольного судна «Опыт», снаряжённого гирями для колки льда… испытание выиграл «Пайлот», обойдя застрявший во льдах «Опыт»».
        stranica: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник»
        href: https://kronvestnik.ru/history/16467
        pometka: два источника
      - summary: "<b>Канал во льду за тысячу рублей: Бритнев нанимал сотни рабочих.</b>"
        det:
          - Весной пароходики Бритнева не могли пробиться сквозь толстый лёд сами. Тогда он нанимал рабочих — их тогда и звали «ледоколами». Они откалывали глыбы, а пароход отводил их на буксире в сторону.
          - Порой на льду работали несколько сотен человек. Кронштадтская газета писала, что один такой канал обошёлся Бритневу почти в тысячу рублей — и он рисковал этими деньгами ради того, чтобы открыть рейсы раньше.
        src: 'Источник: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник», 2014 — <a href="https://kronvestnik.ru/history/16467" rel="noopener">kronvestnik.ru/history/16467</a>.'
        otryvok: "«Прорубая канал,… наш почётный гражданин Бритнев, разумеется, рисковал порядочной суммой денег: канал стоил ему, как мы слышали, до тысячи рублей…»."
        stranica: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник»
        href: https://kronvestnik.ru/history/16467
        pometka: документ
      - summary: "<b>Один из первых походов к Ораниенбауму провалился: «Пайлот» сел на мель за две версты до пристани.</b>"
        det:
          - Ледокольный нос сработал не сразу. Весной 1864 года «Пайлот» пошёл к Ораниенбауму, но крепкий лёд и мель остановили его примерно в двух верстах от берега, и пароходу пришлось вернуться.
          - "Бритнев сделал вывод: одного парохода мало, нужно два, чтобы выручать друг друга. Вскоре на линию вышел второй, переделанный по образцу «Пайлота», — «Айрот»."
        src: 'Источник: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник», 2014 — <a href="https://kronvestnik.ru/history/16467" rel="noopener">kronvestnik.ru/history/16467</a>.'
        otryvok: «…пароход «Пайлот» почётного гражданина Бритнева пробовал идти к Ораниенбауму, но, не дойдя около двух верст к пристани, приткнулся к мели; идти далее… мешал крепкий лёд, так что он принужден был воротиться».
        stranica: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник»
        href: https://kronvestnik.ru/history/16467
        pometka: документ
      - summary: <b>Билет подорожал вдвое — и газета встала на защиту судовладельца.</b>
        det:
          - В распутицу проезд на пароходах Бритнева стоил рубль, хотя сначала был 50 копеек. Кронштадтцы возмущались.
          - "Но «Кронштадтский вестник» объяснил: хозяин тратится на прорубку канала и каждый год теряет во льдах по нескольку гребных винтов. А главное — за все годы с пассажирами его пароходов не случилось ни одного несчастного случая."
        src: 'Источник: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник», 2014 — <a href="https://kronvestnik.ru/history/16467" rel="noopener">kronvestnik.ru/history/16467</a>.'
        otryvok: «кроме того, М. О. ежегодно терял в борьбе со льдами по несколько винтов»… «со дня начала сообщения с Ораниенбаумом на пароходах Бритнева… не было ни одного несчастного случая с пассажирами».
        stranica: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник»
        href: https://kronvestnik.ru/history/16467
        pometka: документ
        kadr:
          src: "/muzei/izobreteniya/img/01-10-kronshtadtskij-vestnik-1882.jpg"
          width: 799
          height: 582
          alt: "Разворот газеты «Кронштадтский вестник» № 123 от 20 октября 1882 года: четыре колонки мелкого текста, справа объявления"
          data_source: "https://goskatalog.ru/portal/#/collections?id=41225617"
          license: "общественное достояние (газета 1882 года); Госкаталог музейного фонда РФ; цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)"
          podpis: "Номер «Кронштадтского вестника» 1882 года, когда «Пайлот» ещё ходил во льду: эта городская газета и вступилась за Бритнева, объяснив, на что идут деньги за билет."
          credit: "«Кронштадтский вестник», № 123, 20 октября 1882 г. Хранится: Музей Черноморского флота (филиал ЦВММ, Севастополь), МЧФ КП-1106. Госкаталог № 41009750. Источник: Госкаталог музейного фонда РФ."
      - summary: <b>Бритнева обвиняли, что его пароходы нарочно не дают замёрзнуть дороге по льду.</b>
        det:
          - У каждой удачи есть недовольные. Часть кронштадтцев уверяла, что пароходы Бритнева специально ходят крюком к Петергофу и ломают лёд, чтобы не установилась санная дорога и людям пришлось платить за билеты.
          - "Обвинение не прижилось: таких недовольных было немного, а большинство горожан считали главной заслугой Бритнева именно то, что остров перестал отрываться от материка в распутицу."
        src: 'Источник: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник», 2014 — <a href="https://kronvestnik.ru/history/16467" rel="noopener">kronvestnik.ru/history/16467</a>.'
        otryvok: «Однако были и те, кто обвинял предприимчивого купца в том, что его пароходы, нарочно забирая к востоку в сторону Петергофа, не дают установиться санному пути, видя в этом корыстный умысел судовладельца».
        stranica: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник»
        href: https://kronvestnik.ru/history/16467
        pometka: документ
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Гонки во льду, суды и конкуренты
    udary:
      - summary: <b>За десять лет работы «Пайлота» Кронштадт лишь раз остался без почты на два дня.</b>
        det:
          - Раньше в распутицу остров неделями сидел без почты и продуктов, а газета каждый номер начинала с заметки «Состояние льда».
          - "В ноябре 1872 года «Кронштадтский вестник» отметил десятилетие рейсов «Пайлота» во льду и написал: за это время горожане едва могут вспомнить один случай, когда два дня не получали почту из Ораниенбаума."
        src: 'Источник: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник», 2014 — <a href="https://kronvestnik.ru/history/16467" rel="noopener">kronvestnik.ru/history/16467</a>.'
        otryvok: «…с лёгкой руки маленького «Пайлота»… мы едва можем вспомнить один только случай, когда два дня не получали почту из Ораниенбаума».
        stranica: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник»
        href: https://kronvestnik.ru/history/16467
        pometka: документ
      - summary: <b>Конкуренты пытались отбить у Бритнева линию — и высаживали пассажиров прямо на лёд.</b>
        det:
          - Весной 1873 года другие кронштадтские судовладельцы пустили в Ораниенбаум свои пароходы «Приятель» и «Сергий».
          - Разрешения причаливать к ораниенбаумской пристани у них не было, и «Сергий» высаживал людей прямо на лёд. Успеха это не принесло, и вскоре оба конкурента от затеи отказались.
        src: 'Источник: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник», 2014 — <a href="https://kronvestnik.ru/history/16467" rel="noopener">kronvestnik.ru/history/16467</a>.'
        otryvok: «из-за отсутствия разрешения причаливать к пристани в Ораниенбауме, пароход «Сергий» вынужден был высаживать пассажиров прямо на лёд… и вскоре он и «Приятель» были вынуждены отказаться от этой затеи».
        stranica: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник»
        href: https://kronvestnik.ru/history/16467
        pometka: документ
      - summary: "<b>Ночь во льдах с пассажирами: на выручку «Пайлоту» шёл старший брат «Бой».</b>"
        det:
          - Маленький «Пайлот» иногда застревал во льдах на полпути, и пассажирам приходилось ночевать на борту посреди залива.
          - Тогда к нему пробивался «Бой» — построенный на заводе Бритнева в 1875 году пароход с машиной в 250 лошадиных сил. Так выяснилось, что во льду ледоколам выгоднее работать парой.
        src: 'Источник: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник», 2014 — <a href="https://kronvestnik.ru/history/16467" rel="noopener">kronvestnik.ru/history/16467</a>; «Михаил Осипович Бритнев (1822 – 1889)», Президентская библиотека имени Б. Н. Ельцина — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev" rel="noopener">prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev</a>.'
        otryvok: "«Зачастую случалось так, что «Пайлоту» и, конечно же, пассажирам на его борту приходилось проводить ночь во льдах на пути из Ораниенбаума к Кронштадту, в то время как более сильный пароход «Бой» пробивался к нему на помощь». (prlib.ru: «ледокольное судно «Бой» с машиной мощностью в 250 лошадиных сил»)"
        stranica: «Михаил Осипович Бритнев. Служение родному городу», «Кронштадтский вестник»
        href: https://kronvestnik.ru/history/16467
        pometka: два источника
      - summary: <b>Плавучие краны Бритнева так понравились, что их перенял военный флот.</b>
        det:
          - Ещё до ледоколов Бритнев занимался ремонтом судов и погрузкой в Кронштадтском порту. Чтобы быстрее грузить и разгружать корабли, он построил несколько плавучих кранов.
          - Идея оказалась настолько удачной, что потом её взяло на вооружение Морское ведомство.
        src: 'Источник: «Михаил Осипович Бритнев (1822 – 1889)», Президентская библиотека имени Б. Н. Ельцина — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev" rel="noopener">prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev</a>.'
        otryvok: «Для разгрузки и загрузки судов М. О. Бритнев построил несколько плавучих кранов (идею потом использовало морское ведомство)».
        stranica: «Михаил Осипович Бритнев (1822 – 1889)», Президентская библиотека имени Б. Н. Ельцина
        href: https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev
        pometka: документ
      - summary: <b>Суда, построенные Бритневым в Кронштадте, плавали по Енисею, Лене и Байкалу.</b>
        det:
          - Завод Бритнева вырос из маленькой мастерской и строил суда не только для Финского залива.
          - Его суда долгие годы ходили по сибирским рекам Енисею и Лене и по озеру Байкал — за тысячи километров от Кронштадта.
        src: 'Источник: «Михаил Осипович Бритнев (1822 – 1889)», Президентская библиотека имени Б. Н. Ельцина — <a href="https://www.prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev" rel="noopener">prlib.ru/Great_Russia/outstanding_scientists_XIX/Britnev</a>.'
        otryvok: «Построенные М. О. Бритневым суда долгое время эксплуатировались также на реках Енисей, Лена и озере Байкал».
