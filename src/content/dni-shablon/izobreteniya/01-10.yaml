quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — наползал и ломал весом; 2 — 20 градусов; 3 — 300 рублей; 4 — замёрзла Эльба; 5 — «Ермак»."
  ball: 10
  voprosy:
    - q: Как «Пайлот» ломал лёд?
      o:
        - Бил его с разгона усиленным тараном
        - Наползал на лёд и ломал его своим весом
        - Растапливал паром из котла
      a: 1
      e: Скошенный нос позволял судну «вползать на лёд и ломать его своим весом» — так объясняют кораблестроители ОСК.
    - q: Под каким углом Бритнев срезал нос «Пайлота»?
      o:
        - 5 градусов
        - 20 градусов
        - 45 градусов
      a: 1
      e: 20 градусов, ниже ватерлинии. Эту форму потом назвали ледокольной.
    - q: За сколько немецкие инженеры купили чертежи «Пайлота» в 1871 году?
      o:
        - 300 рублей
        - 3000 рублей
        - 30 000 рублей
      a: 0
      e: 300 рублей — «не щедрые», как пишет «Деловой Петербург». По чертежам в Гамбурге построили первые немецкие ледоколы.
    - q: Что заставило немцев приехать за чертежами?
      o:
        - Война с Францией
        - Зимой 1871 года замёрзла Эльба
        - Приказ кайзера строить флот
      a: 1
      e: "Суровая зима 1871 года: замёрзла Эльба, и порт Гамбурга встал."
    - q: Какой ледокол стал первым арктическим — через десять лет после смерти Бритнева?
      o:
        - «Ермак»
        - «Бой»
        - «Красин»
      a: 0
      e: «Ермак», 1899 год, — о нём страница 8 января. «Бой» — второй ледокол самого Бритнева, 1875 год.
