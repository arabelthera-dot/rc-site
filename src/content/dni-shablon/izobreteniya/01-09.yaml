  h2: Что именно Блинов сделал первым
  granica: <b>Граница первенства:</b> гусеничный ход — «вагон с бесконечными рельсами», патент (привилегия) № 2245 1879 года. А в 1888 году Блинов поставил паровую машину на гусеничное шасси и испытал под Балаковым первый в мире гусеничный трактор.
  net: "<b>Чего здесь нет:</b> запатентованный «вагон» 1879 года сам не ездил — это был прицеп на гусеницах, его тянули лошади. Своим ходом на гусеницах пошёл только «самоход» 1888 года. Завод при жизни Блинова так и не появился: серийный выпуск в 1906 году начал уже американец Холт — под маркой «Caterpillar»."
  kolonki:
    - Кто
    - Что
    - Когда
  stroki:
    - - Фёдор Блинов, Саратовская губерния
      - Патент № 2245 на «вагон с бесконечными рельсами»
      - "1879"
    - - Фёдор Блинов, Балаково
      - Паровой «самоход» на гусеницах — первый в мире гусеничный трактор
      - "1888"
    - - Бенджамин Холт, США
      - Испытание гусеничного трактора
      - "1904"
    - - Бенджамин Холт, США
