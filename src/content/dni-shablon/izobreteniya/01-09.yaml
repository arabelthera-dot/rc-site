return:
  q: «Не колесо я и не сани, но еду там, где те застряли; я цепь, что стелется под ход — крестьянский ум меня создал».
  a: Гусеница Блинова — «бесконечные рельсы».
audioguide:
  audioSrc: audio-guide-blinov-ru.mp3
  durationLabel: 1 минута 42 секунды
  lead: Голос ведёт от размытой саратовской колеи до жёлтого бульдозера на современной стройке. 4 остановки, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже.
  stops:
    - t: 0
      mark: 0:00
      title: Телега в грязи
    - t: 23
      mark: 0:23
      title: Бесконечные рельсы
    - t: 49
      mark: 0:49
      title: Медаль за насос, грамота за трактор
    - t: 77
      mark: 1:17
      title: Жёлтые машины Холта
  transcript:
    - "<p>«Мы в зале, где пахнет мазутом и мокрой землёй. Посмотрите на эту фотографию: телега, зарывшаяся в грязь по ступицу, и лошади, тянущие из последних сил. Саратовская губерния, 1870-е. Такое видели все. А крестьянин Фёдор Блинов, стоя над этой колеёй, задал вопрос иначе: не как вытащить, а почему колесо вообще проваливается.</p>"
    - <p>Вот его ответ — в витрине справа. Цепь из плоских звеньев, которая расстилается перед машиной и собирается за ней. Колесо давит всем весом в одну точку, а эта лента раскладывает вес на целую полосу грунта. В 1879 году Блинов получил на неё патент — «вагон с бесконечными рельсами». Через девять лет он поставил на такое шасси паровую машину, и первый в мире гусеничный трактор пошёл по пашне там, где колёсная техника вставала намертво.</p>
    - <p>Теперь — Нижний Новгород, 1896 год, промышленная выставка. Машина прошла своим ходом, повернула, развернулась на глазах комиссии. Серебряную медаль Блинову дали — только за пожарный насос. А за трактор — лишь похвальную грамоту. И на этом всё. Ни капиталистов за спиной, ни министерских связей у бывшего крепостного не было. Блинов умер в 1902-м, так и не увидев свой трактор в серии.</p>
    - <p>А теперь взгляните на последний снимок в зале — жёлтая машина на стройке. В 1904 году американец Бенджамин Холт испытывает гусеничный трактор, в 1906-м ставит его на поток под маркой «Катерпиллер». Патент саратовского самоучки старше на двадцать пять лет. Каждый танк, экскаватор и бульдозер планеты катится на его ленте. В Балакове ему открыли памятную доску. Переходим к следующему экспонату».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
