  voprosy:
    - q: Что такое «вагон с бесконечными рельсами» по патенту Блинова 1879 года?
      o:
        - Паровоз нового типа
        - Повозка с гусеничным ходом
        - Монорельс для городского транспорта
        - Подводный кабель для телеграфа
      a: 1
      e: Блинов придумал заменить колесо бесконечной цепью из звеньев — она распределяет вес машины по большой площади. Сегодня это называется гусеницей.
    - q: На сколько лет патент Блинова на гусеницу старше первых испытаний трактора Холта в США?
      o:
        - На 5 лет
        - На 10 лет
        - На 25 лет
