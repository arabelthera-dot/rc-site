  intro: Та же история коротким роликом — от колеса, которое проваливается в грязь, до гусеницы под всей тяжёлой техникой планеты.
  poster: video/day-09jan-blinov-poster.jpg?v=1
  mp4: video/day-09jan-blinov.mp4?v=1
  note: "Кадры ролика — подлинные: картина К. П. Белова «Первый гусеничный трактор Блинова», 1947 (Омский музей Кондратия Белова); фотография М. П. Дмитриева «Хлебная пристань на Волге. С. Балаково», конец XIX века (Нижегородский историко-архитектурный музей-заповедник); медальон с профилем Ф. А. Блинова, 1970–1980-е, и пожарный насос завода Блинова, 1880-е (Музей истории г. Балаково); почтовая марка России 2021 года «Трактор Ф.А. Блинова» (Нижнетагильский музей-заповедник «Горнозаводской Урал»). Все — из Госкаталога музейного фонда РФ; сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История изобретения
  h2: Человек, создавший первую в мире гусеницу
  abzacy:
    - |-
      <div class="article collapsed" id="article">
            <div class="body" id="articleBody">
      <p><b>Саратовская губерния, 1870-е.</b> Фёдор Блинов смотрит на поле после дождя. Телега с грузом зарылась в грязь по ступицу — лошади тянут из последних сил. Он видел это тысячи раз. Но впервые задаётся вопросом не «как вытащить», а «почему вообще колесо проваливается». И придумывает ответ, который изменит мир.</p>
    - "<p><b>Кто этот человек.</b> Фёдор Абрамович Блинов родился в 1827 году (по другим данным — в 1831-м) в селе Никольском Вольского уезда Саратовской губернии — в крепостной семье. Грамоте выучился сам. Был грузчиком и бурлаком, потом почти четверть века служил на волжском пароходе «Геркулес» кочегаром, помощником машиниста и машинистом. Осенью 1881 года перебрался в Балаково — тогда село Самарской губернии — и завёл там собственные мастерские. Про таких говорят «самородок»: не имея образования, он понимал механику интуитивно — и строил то, что образованные инженеры считали невозможным.</p>"
    - "<p><b>В чём была загвоздка.</b> Колесо — идеальная машина на твёрдой поверхности и беспомощная на мягкой: оно давит всем весом на маленькую точку контакта и проваливается. Чем тяжелее машина, тем глубже яма. Паровые тракторы того времени ездили только по твёрдым дорогам — на поле они застревали намертво.</p>"
    - "<p><b>Как родилась идея.</b> Блинов рассуждал просто: если колесо проваливается, потому что давит в одну точку — значит, надо распределить вес по большей площади. Что если под колёса подложить бесконечную цепь из звеньев, которая расстилается перед машиной и собирается за ней? Вес равномерно ложится на полосу грунта — и машина идёт там, где колесо застряло бы намертво.</p>"
    - "<p><b>Что он построил.</b> В 1879 году Блинов получил патент №2245 — на «вагон с бесконечными рельсами». Следующим шагом стал самодвижущийся трактор: в 1888 году Блинов поставил паровую машину на гусеничное шасси и испытал его под Балаковым. Первый в мире гусеничный трактор мог ехать по пашне, по грязи, по целине — там, где колёсная техника была беспомощна.</p>"
    - "<p><b>Демонстрация.</b> В 1896 году Блинов привёз трактор на Нижегородскую промышленно-художественную выставку. Машина прошла своим ходом, повернула, развернулась. Серебряную медаль Блинову присудили за пожарный насос, а за трактор — только похвальную грамоту. Серийного производства не последовало: у Блинова не было ни капиталистов за спиной, ни связей в министерствах.</p>"
    - <p><b>Горькая часть.</b> Блинов умер в 1902 году — не увидев, что произойдёт дальше. В 1904 году американец Бенджамин Холт испытал гусеничный трактор в США. В 1906-м — начал серийное производство под маркой «Caterpillar». Сегодня «Caterpillar» — один из крупнейших концернов мира, его жёлтые машины работают на всех стройках планеты. В учебниках по всему миру написано имя Холта. Патент Блинова на 25 лет старше — но Россия так и не запустила его в производство при жизни изобретателя.</p>
    - "<p><b>Финал.</b> Гусеница Блинова стала основой двух революций XX века: промышленной (тракторы, экскаваторы, краны, бульдозеры) и военной (танки Первой и Второй мировых). Каждый танк — это воплощённый патент крестьянина из Саратовской губернии. В Балакове в 2024 году ему открыли памятную доску. «Caterpillar» об этом не упоминает.</p>"
    - |-
      <p><b>Человек.</b> Фёдор Абрамович Блинов (1827–1902; по другим данным родился в 1831 году) — бывший крепостной, самоучка, механик. Говорил мало, работал руками. Современники отмечали: объяснить, почему та или иная конструкция будет работать, он не мог — но машина работала. Последние годы жил в Балакове, в своих мастерских, продолжал изобретать до последнего дня.</p>
            </div>
            <div class="more"><button class="btn ghost" id="moreBtn">Читать дальше ↓</button></div>
          </div>
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Блинове
    h2: Изобретатель, которому дали медаль, как за рогожи
    udary:
      - summary: <b>Задолго до трактора Блинов заставил пароход разворачиваться на месте — разрезав гребной вал.</b>
        det:
          - "Почти четверть века Блинов прослужил на волжском пароходе «Геркулес»: был кочегаром, помощником машиниста, потом машинистом. Однажды в разгар навигации лопнул гребной вал, который от двух паровых машин вращал водяные колёса. Мастера браться за ремонт отказались: все считали, что нужен новый вал."
          - "Блинов предложил разрезать вал на две части, чтобы каждая машина крутила своё колесо. Ремонт пошёл быстрее, а пароход стал послушнее: выключи одну машину, и «Геркулес» поворачивается даже на месте. Так же потом поворачивал и его гусеничный «самоход» 1888 года: каждую гусеницу вела своя паровая машина, и для поворота одну из них выключали."
        src: "Источник: Салтыков Р. В. «Из истории изобретения трактора» // Образование. Карьера. Общество, 2013 (cyberleninka.ru)."
        otryvok: «Однажды в разгар навигации на «Геркулесе» лопнул гребной вал, приводившийся от двух паровых машин и вращавший водяные колеса.» … «Тогда Блинов предложил неожиданное решение - разрезать вал на две части, чтобы паровые машины раздельно приводили гребные колеса в движение. Это значительно ускорило ремонт и улучшило маневренность - «Геркулес» мог свободно поворачиваться даже на месте, если выключалась одна из машин.» … «Каждая гусеница приводилась в движение отдельно. Поворот «самохода» обеспечивался выключением или включением соответствующей машины.»
        stranica: Салтыков Р. В., Пейпорт Н. В. «Из истории изобретения трактора» // Образование. Карьера. Общество. 2013. № 1 (37) (cyberleninka.ru)
        href: https://cyberleninka.ru/article/n/iz-istorii-izobreteniya-traktora
        pometka: документ
      - summary: <b>Гусеничную повозку Блинова испытали с 2000 кирпичей и 30 людьми — тянули её две лошади.</b>
        det:
          - Запатентованный «вагон» Блинова сам не ездил. Это был прицеп на гусеницах для пароконной упряжки. Летом 1880 года в Вольске Блинов испытал его на пахоте, на грунтовых дорогах и даже на болоте. Пара лошадей везла на нём столько, сколько на колёсной телеге потянули бы не меньше десяти.
          - "Потом были официальные испытания. 8 января 1881 года «Саратовский листок» напечатал письмо из Вольска: платформа «с самодвижущимися рельсами» с 550 пудами груза, то есть 2000 кирпичей и больше 30 взрослых людей, несколько раз проехала по улицам города на паре лошадей и вызвала всеобщее одобрение."
        src: "Источник: Салтыков Р. В. «Из истории изобретения трактора» // cyberleninka.ru (цитата по «Саратовскому листку» от 8 января 1881 г.)."
        otryvok: «В пароконной упряжке «вагон» перевозил груз, для перевозки которого на колесной тележке требовалось не менее десяти лошадей.» … «Платформа с самодвижущимися рельсами, нагруженная 550 пудами (2000 кирпичей и более 30 взрослых человек народа), запряженная парой обыкновенных лошадей, на днях проезжала несколько раз по улицам нашего города, вызвав всеобщее одобрение.»
        stranica: Салтыков Р. В., Пейпорт Н. В. «Из истории изобретения трактора» // Образование. Карьера. Общество. 2013. № 1 (37) (cyberleninka.ru); цитата из «Саратовского листка» от 8 января 1881 г.
        href: https://cyberleninka.ru/article/n/iz-istorii-izobreteniya-traktora
        pometka: документ
      - summary: <b>Первый в мире гусеничный трактор получил на выставке ту же медаль, что мочала и рогожи.</b>
        det:
          - Готовый «самоход» Блинов ещё месяц испытывал в любых условиях и никому его не показывал. Только когда сам во всём уверился, вывел машину к людям, причём не просто показывал её, а объяснял устройство и доказывал, что механическая тяга нужна сельскому хозяйству.
          - В 1889 году трактор показали в работе на сельскохозяйственной выставке в Саратове. Изобретатель получил серебряную медаль. Ровно такой же наградой отметили одну помещичью экономию за мочала и рогожи. На этом признание и закончилось.
        src: "Источник: Салтыков Р. В. «Из истории изобретения трактора» // cyberleninka.ru."
        otryvok: «Но Блинов настолько ответственно относился к своей работе, что, когда машина была уже полностью готова, еще месяц испытывал ее во всевозможных условиях, никому не показывая.» … «В 1889 году он был показан в работе на сельскохозяйственной выставке в Саратове. Изобретатель был награжден серебряной медалью (такую же награду получила одна помещичья экономия за мочала и рогожи), но тем все и ограничилось.»
        stranica: Салтыков Р. В., Пейпорт Н. В. «Из истории изобретения трактора» // Образование. Карьера. Общество. 2013. № 1 (37) (cyberleninka.ru)
        href: https://cyberleninka.ru/article/n/iz-istorii-izobreteniya-traktora
        pometka: документ
      - summary: <b>Серебро Блинову дали за пожарный насос, а за гусеничный трактор — лишь похвальную грамоту.</b>
        det:
          - Деньги на трактор Блинову приносили пожарные насосы. Он придумал одноцилиндровый насос, который работал лучше и надёжнее привычного двухцилиндрового, а в 1887 году взял в аренду небольшой чугунолитейный завод и наладил их выпуск.
          - "На выставку 1896 года в Нижнем Новгороде он привёз улучшенный «самоход» и называл его «паровозом для грунтовых дорог». Серебряную медаль жюри снова присудило, только за насос. Трактор получил похвальную грамоту. А немецкая фирма прямо на выставке предложила купить машину за хорошие деньги и наладить выпуск. Блинов, хоть и сидел без денег, отказал: «Я русский мужик, думал и делал для России»."
        src: "Источник: Салтыков Р. В. «Из истории изобретения трактора» // cyberleninka.ru (слова Блинова — в пересказе дочери, Устиньи Фёдоровны)."
        otryvok: "«Блинов получил на выставке серебряную медаль... за пожарный насос и похвальную грамоту за «самоход».» … «Федор Абрамович, испытывавший к тому времени серьезные денежные затруднения, предложение тем не менее не принял, мотивировав свое решение, по словам дочери Устиньи Федоровны, так: «Я русский мужик, думал и делал для России».»"
        stranica: Салтыков Р. В., Пейпорт Н. В. «Из истории изобретения трактора» // Образование. Карьера. Общество. 2013. № 1 (37) (cyberleninka.ru)
        href: https://cyberleninka.ru/article/n/iz-istorii-izobreteniya-traktora
        pometka: документ
      - summary: <b>Мальчик, пришедший к Блинову в мастерскую в 11 лет, позже выпустил в Балакове «Русский трактор».</b>
        det:
          - "Яков Мамин окончил приходскую школу в Балакове, поработал учеником у лудильщика, а в 11 лет перешёл в мастерскую Блинова. После неудачи в Нижнем Новгороде Блинов сказал ему: «Не поняли меня купцы… А ты доживёшь, увидишь, какое значение будут иметь „самоходы“ для русских людей»."
          - "Ученик дожил. Осенью 1914 года «Саратовский листок» писал, что по улицам Балакова прошёл трактор завода Я. В. Мамина и что завод собирается выпускать машины в 25 и 50 сил под названием «Русский трактор»: пока таких собрали четыре. Позже Мамин построил простейший трактор «Карлик». Сегодня он стоит у здания минсельхоза Саратовской области."
        src: "Источники: Салтыков Р. В. «Из истории изобретения трактора» // cyberleninka.ru; Китаев Е. «От „Карлика“ до „Титана“» // Российская газета, 09.10.2025 (rg.ru)."
        otryvok: '«После окончания приходской школы в селе Балаково Самарской губернии он поступил учеником к кустарю-лудильщику, а в 11 лет перешел в мастерскую Федора Блинова, собравшего первый в России гусеничный трактор с паровым двигателем.» … «"Саратовский листок" осенью 1914 года сообщил: "На днях по улицам Балакова ходил трактор местного завода Я.В. Мамина. … Завод предполагает вырабатывать тракторы 25 и 50 сил под названием "Русский трактор". Пока изготовлены четыре штуки".» … «"Карлик", ставший символом тракторостроения в Саратовской области, установлен у здания регионального минсельхоза.» (Российская газета). — «Не поняли меня купцы, - сказал после выставки Блинов своему помощнику Я. Мамину. -А ты доживешь, увидишь, какое значение будут иметь «самоходы» для русских людей». (Салтыков, Пейпорт, «Образование. Карьера. Общество»)'
        stranica: "Китаев Е. «От „Карлика“ до „Титана“: Чем конструктор Яков Мамин занимался в Челябинске» // Российская газета, 09.10.2025; Салтыков Р. В., Пейпорт Н. В. «Из истории изобретения трактора» // Образование. Карьера. Общество. 2013. № 1 (37) (cyberleninka.ru); второй источник — https://cyberleninka.ru/article/n/iz-istorii-izobreteniya-traktora"
        href: https://rg.ru/2025/10/09/reg-urfo/sozdatel-mashin-vremeni.html
        pometka: два источника
      - summary: <b>Министерство признало, что вагон Блинова в 6–7 раз легче тянуть, — и всё равно его не одобрило</b>
        det:
          - "В январе 1878 года Блинов подал прошение министру путей сообщения: просил рассмотреть его «вагон с бесконечными рельсами» и сказать, годится ли он в дело."
          - "14 марта пришёл ответ за № 3418. Чиновники признали: лошадям тянуть такой вагон в 6–7 раз легче, чем обычную повозку по шоссе. Но сказать, можно ли пускать его в работу, отказались — побоялись, что цепь будет рваться на ухабах. Чертежи вернули изобретателю."
        src: 'Источник: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., «Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин», Труды НГТУ им. Р. Е. Алексеева, 2016 — <a href="https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh" rel="noopener">cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh</a>.'
        otryvok: «Признав за вашим вагоном достоинство в достижении уменьшения в силе тяги от 6 до 7 раз сравнительно с обычным способом передвижения грузов по шоссе, Т. И. Ч. У. (техническо-инспекторская часть управления ж/д) воздерживается, однако, высказать заключение о возможности практического применения снаряда»
        stranica: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин, Труды НГТУ им. Р. Е. Алексеева, 2016
        href: https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh
        pometka: документ
      - summary: <b>Министерство отказало Блинову, а купец уже на следующий день сам пошёл добывать ему патент</b>
        det:
          - "Когда чиновники путей сообщения не дали изобретению хода, за дело взялся купец Канунников. Он быстро сосчитал выгоду: с вагоном Блинова для перевозки зерна от амбаров к волжским пристаням понадобилось бы в семь раз меньше подвод."
          - У купца были связи в нужном департаменте и деньги на пошлины. На следующий же день он подал прошение о привилегии для Блинова — и в 1879 году крестьянин получил патент № 2245.
        src: 'Источник: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., «Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин», Труды НГТУ им. Р. Е. Алексеева, 2016 — <a href="https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh" rel="noopener">cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh</a>; Центральная городская библиотека г. Саратова (по книге А. А. Деревянченко, А. Г. Чулкова «Волжский самородок»), «Блинов Ф.А.», elsso.ru — <a href="https://elsso.ru/cont/ppl/230.html" rel="noopener">elsso.ru/cont/ppl/230.html</a>.'
        otryvok: «Имея связи в департаменте торговли и мануфактур и деньги на пошлины, Канунников на другой же день обратился туда с прошением о выдаче Блинову привилегии»
        stranica: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин, Труды НГТУ им. Р. Е. Алексеева, 2016
        href: https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh
        pometka: два источника
      - summary: <b>Крестьянин сам повёз в Петербург модель своего вагона и заплатил за прошение 40 копеек</b>
        det:
          - В 1877 году Блинов сделал модель своего гусеничного вагона и решил сам ехать в столицу хлопотать о патенте. Поселился на Калашниковской пристани у Невского.
          - 18 января 1878 года он заплатил 40 копеек гербового сбора, и писарь крупным красивым почерком оформил прошение министру. К нему крестьянин приложил чертежи в семи видах и модель в четверть настоящей величины.
        src: 'Источник: Центральная городская библиотека г. Саратова (по книге А. А. Деревянченко, А. Г. Чулкова «Волжский самородок»), «Блинов Ф.А.», elsso.ru — <a href="https://elsso.ru/cont/ppl/230.html" rel="noopener">elsso.ru/cont/ppl/230.html</a>.'
        otryvok: «18 января изобретатель заплатил 40 копеек за гербовый сбор, а 21 января министерский писарь, наклеив гербовую марку, по его просьбе красивым крупным почерком оформил документ, ставший теперь историческим.»
        stranica: Центральная городская библиотека г. Саратова (по книге А. А. Деревянченко, А. Г. Чулкова «Волжский самородок»), Блинов Ф.А., elsso.ru
        href: https://elsso.ru/cont/ppl/230.html
        pometka: документ
      - summary: <b>Волжский крестьянин-самоучка сам выступил перед учёными столицы и добился встречи с министром</b>
        det:
          - Без образования и связей Блинов в Петербурге не сидел сложа руки. Через влиятельного чиновника он добился, чтобы техническое общество столицы выслушало его самого — о том, чем «сей вагон» выгоден России.
          - "Потом он поговорил и с министром путей сообщения адмиралом Посьетом. Именно министр дал делу ход: прошение крестьянина отправили на проверку инженерам."
        src: 'Источник: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., «Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин», Труды НГТУ им. Р. Е. Алексеева, 2016 — <a href="https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh" rel="noopener">cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh</a>; Медиапроект «Стол», «Бесконечные рельсы» механика-самоучки Блинова», s-t-o-l.com — <a href="https://s-t-o-l.com/russkaya-zhizn/54881-beskonechnye-relsy-mekhanika-samouchki-blinova/" rel="noopener">s-t-o-l.com/russkaya-zhizn/54881-beskonechnye-relsy-mekhanika-samouchki-blinova</a>.'
        otryvok: «Тот добился, чтобы техническое общество Петербурга заслушало самого Блинова о выгодности для России «сего вагона». Федор Абрамович имел беседу и с министром путей сообщения адмиралом К.Н. Посьетом, который и дал ход делу.»
        stranica: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин, Труды НГТУ им. Р. Е. Алексеева, 2016
        href: https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh
        pometka: два источника
      - summary: "<b>Блинов придумал, как гусеничной машине поворачивать: просто остановить одну гусеницу</b>"
        det:
          - "Уже в первом изобретении Блинов решил задачу, о которую потом спотыкались многие: как повернуть машину на гусеницах. Его ответ — остановить одну гусеницу, а другую оставить в движении. Вагон от этого становился очень поворотливым."
          - Многие гусеничные машины конца XIX — начала XX века этой идеи не взяли и поворачивали с помощью колёс, лыж или полозьев. А у танков и тракторов XX века поворот устроен по тому же принципу, что предложил волжский механик.
        src: 'Источник: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., «Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин», Труды НГТУ им. Р. Е. Алексеева, 2016 — <a href="https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh" rel="noopener">cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh</a>; Центральная городская библиотека г. Саратова (по книге А. А. Деревянченко, А. Г. Чулкова «Волжский самородок»), «Блинов Ф.А.», elsso.ru — <a href="https://elsso.ru/cont/ppl/230.html" rel="noopener">elsso.ru/cont/ppl/230.html</a>.'
        otryvok: «Поворот платформы, по мнению Блинова, мог быть осуществлен остановкой одной гусеницы-рельса и продолжением движения другой. Это делало вагон чрезвычайно маневренным.»
        stranica: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин, Труды НГТУ им. Р. Е. Алексеева, 2016
        href: https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Насос, запальник и 16 лет без денег
    udary:
      - summary: <b>Блинов замахнулся на целый гусеничный поезд — и потратил 16 лет на машину, чтобы его тянуть</b>
        det:
          - Ещё в первом изобретении Блинов предлагал возить грузы не одним вагоном, а гусеничным поездом из четырёх вагонов-прицепов.
          - Сам вагон он построил к 1880 году. А вот над паровой машиной на гусеницах, которая потянула бы такой поезд, ему пришлось биться около 16 лет.
        src: 'Источник: Центральная городская библиотека г. Саратова (по книге А. А. Деревянченко, А. Г. Чулкова «Волжский самородок»), «Блинов Ф.А.», elsso.ru — <a href="https://elsso.ru/cont/ppl/230.html" rel="noopener">elsso.ru/cont/ppl/230.html</a>; Журнал «Стимул», «Самоход» с Волги», stimul.online — <a href="https://stimul.online/historical-dates/samokhod-s-volgi-/" rel="noopener">stimul.online/historical-dates/samokhod-s-volgi-</a>.'
        otryvok: «С первой задачей (вагон) изобретатель справился еще в 1880 году, а вот с постройкой паровоза, предназначенного для буксировки четырех вагонов, Блинову пришлось помучиться около 16 лет.»
        stranica: Центральная городская библиотека г. Саратова (по книге А. А. Деревянченко, А. Г. Чулкова «Волжский самородок»), Блинов Ф.А., elsso.ru
        href: https://elsso.ru/cont/ppl/230.html
        pometka: два источника
      - summary: <b>Свой трактор Блинов построил за 10 тысяч рублей — и 16 лет не мог найти, кто вложит деньги</b>
        det:
          - "В 1896 году на Нижегородской выставке с Блиновым поговорил корреспондент газеты «Каспий». Изобретатель горько жаловался: машину он придумал 16 лет назад, взял на неё патент, а капиталиста, который наладил бы выпуск на фабрике, так и не нашёл."
          - Свой паровой гусеничный самоход он строил на собственные деньги — машина обошлась ему в 10 тысяч рублей. Богатые люди, к которым он обращался, вкладываться не захотели.
        src: 'Источник: Научная Россия, «Вагон с бесконечными рельсами» Федора Блинова», scientificrussia.ru — <a href="https://scientificrussia.ru/articles/beskonecnye-relsy-fedora-blinova" rel="noopener">scientificrussia.ru/articles/beskonecnye-relsy-fedora-blinova</a>; Журнал «Стимул», «Самоход» с Волги», stimul.online — <a href="https://stimul.online/historical-dates/samokhod-s-volgi-/" rel="noopener">stimul.online/historical-dates/samokhod-s-volgi-</a>.'
        otryvok: «целых 16 лет, как придуман им этот двигатель, он даже взял на него привилегию, но все никак не может подыскать капиталиста, который бы взялся изготавливать его фабричным путем. Даже существующие пробелы выставленного двигателя, обошедшегося ему в 10 тыс. рублей»
        stranica: Научная Россия, «Вагон с бесконечными рельсами» Федора Блинова, scientificrussia.ru
        href: https://scientificrussia.ru/articles/beskonecnye-relsy-fedora-blinova
        pometka: два источника
      - summary: <b>Блинов начертил гусеничный трактор с мотором — с траками и катками, как у будущих машин</b>
        det:
          - В конторе балаковского завода долго хранились чертежи двух гусеничных тракторов Блинова — уже не на пару, а с мотором. Вместо котла и двух паровых машин стоял двухцилиндровый двигатель, а управление вынесено в кабину.
          - "На эскизах видны звенья гусениц с шипами-почвозацепами и тележка с пятью парами катков — так устроены гусеничные машины и сегодня. Построить этот трактор Блинов не успел: помешали болезнь и смерть в 1902 году."
        src: 'Источник: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., «Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин», Труды НГТУ им. Р. Е. Алексеева, 2016 — <a href="https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh" rel="noopener">cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh</a>; Журнал «Стимул», «Самоход» с Волги», stimul.online — <a href="https://stimul.online/historical-dates/samokhod-s-volgi-/" rel="noopener">stimul.online/historical-dates/samokhod-s-volgi-</a>.'
        otryvok: «Судя по сохранившимся эскизам, Блинова можно считать автором пионерского изобретения - фрикционной муфты, бортовой передачи, гусеничного штампованного звена с почвозацепами (трака) и полужест-»
        stranica: П. О. Береснев, В. И. Филатов, А. А. Еремин и др., Статистическая модель выбора геометрических параметров… гусеничных транспортно-технологических машин, Труды НГТУ им. Р. Е. Алексеева, 2016
        href: https://cyberleninka.ru/article/n/statisticheskaya-model-vybora-geometricheskih-parametrov-massoinertsionnyh-moschnostnyh-i-skorostnyh-harakteristik-gusenichnyh
        pometka: два источника
      - summary: <b>Насос Блинова испытали, подпалив нарочно построенные сараи, — и он взял первое место</b>
        det:
          - "На губернской выставке в Саратове в 1889 году пожарный насос Блинова проверили в деле: для испытания нарочно соорудили легко загорающиеся постройки и подожгли их."
          - Насос «кустаря из Балакова» получил 15 баллов и первое место — по дальности и высоте струи, силе удара воды и надёжности. Блинову дали серебряную медаль, а доход от насосов помогал ему строить гусеничный самоход.
        src: 'Источник: Журнал «Стимул», «Самоход» с Волги», stimul.online — <a href="https://stimul.online/historical-dates/samokhod-s-volgi-/" rel="noopener">stimul.online/historical-dates/samokhod-s-volgi-</a>.'
        otryvok: «Пожарный насос блиновской конструкции поместили в каталог, а для испытания насоса в действии выделили специальное место, где соорудили легковоспламеняющиеся постройки.»
        stranica: Журнал «Стимул», «Самоход» с Волги, stimul.online
        href: https://stimul.online/historical-dates/samokhod-s-volgi-/
        pometka: документ
      - summary: <b>Блинов придумал запальник для нефтяного мотора — и заводчики потом переняли его</b>
        det:
          - После выставки 1896 года Блинов задумал поставить на свой гусеничный тягач вместо паровой машины мотор на сырой нефти. Трудность была в том, что нефть плохо загорается.
          - Долгие опыты закончились ещё одним изобретением — запальником. С ним получился новый мотор, работающий на сырой нефти. Позже многие заводы-изготовители моторов отказались от прежних способов поджига и взяли простой блиновский запальник.
        src: 'Источник: Центральная городская библиотека г. Саратова (по книге А. А. Деревянченко, А. Г. Чулкова «Волжский самородок»), «Блинов Ф.А.», elsso.ru — <a href="https://elsso.ru/cont/ppl/230.html" rel="noopener">elsso.ru/cont/ppl/230.html</a>; Журнал «Стимул», «Самоход» с Волги», stimul.online — <a href="https://stimul.online/historical-dates/samokhod-s-volgi-/" rel="noopener">stimul.online/historical-dates/samokhod-s-volgi-</a>.'
        otryvok: «Так родился запальник — еще одно изобретение Блинова. (Впоследствии многие заводчики — изготовители двигателей— откажутся от наружных калоризаторов и возьмут на вооружение простой конструкции блиновский запальник.)»
        stranica: Центральная городская библиотека г. Саратова (по книге А. А. Деревянченко, А. Г. Чулкова «Волжский самородок»), Блинов Ф.А., elsso.ru
        href: https://elsso.ru/cont/ppl/230.html
        pometka: два источника
