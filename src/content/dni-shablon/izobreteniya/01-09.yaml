    html: |-
      <section class="block" id="more">
        <div class="wrap">
          <div class="kicker">Гусеница изменила мир</div>
          <h2>Что выросло из изобретения Блинова</h2>
          <div class="card"><b style="color:var(--gold-l)">Сельскохозяйственный трактор</b><p style="margin:6px 0 0">Гусеничные тракторы пришли в поля в 1910-х и сделали возможной механизацию сельского хозяйства — на переувлажнённых почвах, торфяниках и целине, куда колёсная техника не доходила.</p></div>
          <div class="card"><b style="color:var(--gold-l)">Танк</b><p style="margin:6px 0 0">Первые танки Первой мировой (британские Mark I, 1916) были гусеничными — только так они могли преодолевать окопы и рвы. Без принципа Блинова не было бы ни одного танка в обеих мировых войнах.</p></div>
          <div class="card"><b style="color:var(--gold-l)">Строительная и горная техника</b><p style="margin:6px 0 0">Экскаваторы, бульдозеры, краны на гусеничном ходу — весь парк тяжёлой техники, без которого невозможно ни одно крупное строительство.</p></div>
          <div class="card"><b style="color:var(--gold-l)">«Caterpillar»</b><p style="margin:6px 0 0">Компания основана в 1925-м (слияние Холта и Беста), сегодня №1 в мире по строительной и горной технике. На логотипе — гусеница. О Блинове — ни слова.</p></div>
        </div>
      </section>
