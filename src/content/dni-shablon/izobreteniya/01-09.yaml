    pravila:
      - "Веди пальцем или мышью по трактору влево-вправо — он повернётся."
      - "Загляни сбоку и снизу — найди звенья гусениц и катки, по которым они бегут."
      - "Нажимай на части под сценой — гусеницы, котёл, паровые машины — и читай, что о них известно."
    chasti:
      - uzel: gusenicy
        nazvanie: "Гусеницы — «бесконечные рельсы»"
        fakt: "В 1879 году Блинов получил патент № 2245 на «вагон с бесконечными рельсами» — первый в мире гусеничный ход. Бесконечная цепь из звеньев расстилается перед машиной и собирается за ней, и вес ложится на полосу грунта, а не в одну точку, как у колеса."
      - uzel: hodovaya
        nazvanie: "Ходовая — колёса и катки"
        fakt: "Колесо давит всем весом на маленькую точку и проваливается — паровые тракторы того времени застревали на поле намертво. Гусеничный трактор Блинова мог ехать по пашне, по грязи, по целине."
      - uzel: parovye-mashiny
        nazvanie: "Две паровые машины"
        fakt: "Каждую гусеницу «самохода» 1888 года вела своя паровая машина, а для поворота одну из них выключали. Эту мысль Блинов вынес с парохода «Геркулес», где разрезал лопнувший гребной вал, чтобы каждая машина крутила своё колесо."
      - uzel: upravlenie
        nazvanie: "Место машиниста и рычаги"
        fakt: "Поворот Блинов придумал ещё в первом изобретении — остановить одну гусеницу, а другую оставить в движении. Многие гусеничные машины рубежа веков этой идеи не взяли, а у танков и тракторов XX века поворот устроен по тому же принципу."
      - uzel: kotel
        nazvanie: "Паровой котёл с трубой"
        fakt: "В 1888 году Блинов поставил паровую машину на гусеничное шасси и испытал под Балаковым первый в мире гусеничный трактор. Над этой машиной ему пришлось биться около 16 лет."
      - uzel: rama
        nazvanie: "Деревянная рама и настил"
        fakt: "В 1896 году Блинов привёз трактор на Нижегородскую выставку — машина прошла своим ходом, повернула, развернулась. Серебряную медаль дали за пожарный насос, а за трактор — лишь похвальную грамоту."
      - uzel: doroga
        nazvanie: "Раскисшая дорога"
        fakt: "Телега с грузом зарывалась в грязь по ступицу — и Блинов спросил себя, почему колесо вообще проваливается. Ответ — распределить вес по большей площади."
