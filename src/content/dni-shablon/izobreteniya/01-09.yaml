          <h2>А как поступил бы ты?</h2>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">1896 год. Выставка в Нижнем Новгороде прошла хорошо. Медаль дали за пожарный насос, за трактор — похвальную грамоту. Но серийного завода по-прежнему нет — ни инвесторов, ни государственного заказа. Тебе 65 лет. Ты на месте Блинова — что делаешь?</p>
          <div class="fork-opt">🏭 Ищу промышленника, продаю лицензию — пусть сам строит завод</div>
          <div class="fork-opt">📜 Подаю прошение в министерство земледелия — трактор нужен крестьянам</div>
          <div class="fork-opt">🔧 Продолжаю совершенствовать машину в мастерских — пока не появится покупатель</div>
          <div id="forkReal" style="display:none;margin-top:14px" class="exp"><b>Как было на самом деле.</b> Блинов продолжал работать в балаковских мастерских до смерти в 1902 году — завод так и не появился. Через два года Бенджамин Холт в США испытал то же самое и за несколько лет построил империю «Caterpillar». Разница была не в идее — а в том, кто стоял за спиной изобретателя.</div>
