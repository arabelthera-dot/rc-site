  note: "Кадры ролика — подлинные, из Госкаталога музейного фонда РФ: фотография «Атомная подводная лодка «Комсомолец» перед последним выходом в плавание», 1989, автор не указан (Владимиро-Суздальский музей-заповедник, № 4655496); фотография атомной подводной лодки «Комсомолец» и модель К-278 проекта 685 (Центральный военно-морской музей, № 20729222 и № 9860261); портрет вице-адмирала Е. Д. Чернова, фото А. Степанова, 1983 (Центральный музей Великой Отечественной войны, № 21947646); эхограмма лодки на дне Норвежского моря, 1991 (Политехнический музей, № 22917495); памятный знак «ПЛА „Комсомолец“ 1983–1989», 1990 (Северный морской музей, № 51789636). Права: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ). Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История рекорда · 13 ударов
  h2: Лодка, которая ушла на километр
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: В 1966 году флот заказал лодку, которая уйдёт на километр. Обычной атомной подлодке хватало 600 метров.
      det:
        - Задание на глубоководную атомную подводную лодку командование ВМФ СССР выдало ленинградскому ЦКБ-18 — сегодня это ЦКБ морской техники «Рубин» — в 1966 году. Проектирование закончили в 1974-м. Главным конструктором был Н. А. Климов, с 1977 года — Ю. Н. Кормилицин.
        - Рабочая глубина обычной атомной лодки — не больше 600 метров. Новой лодке задали рабочую глубину 1000 метров и предельную — 1250.
      src: "Источники: ЦКБ МТ «Рубин», «История»; «Московская правда», 04.08.2021; «Российская газета», 04.08.2020; Общество памяти АПЛ «Комсомолец»."
    - summary: Сталь на такой глубине не годилась. Прочный корпус сварили из титанового сплава — впервые целиком у атомной лодки.
      det:
        - "«Российская газета» называет корпус К-278 первым целиком созданным из титана корпусом атомной подлодки. Титан не магнитится и меньше шумит. Он к тому же лёгкий: корпус занял всего 39 процентов водоизмещения лодки — меньше, чем у других атомных лодок."
        - "Прочный корпус — цилиндр диаметром 8 метров, разделённый на семь отсеков. Второй и третий отсеки были убежищами: их переборки рассчитали на давление до 40 килограммов на квадратный сантиметр."
      src: "Источники: «Российская газета», 04.08.2020; «Московская правда», 04.08.2021; Общество памяти АПЛ «Комсомолец»."
    - summary: "Лодку заложили в Северодвинске в 1978 году и спустили на воду в 1983-м. Других таких не строили: проект 685 «Плавник» — одна К-278."
      det:
        - Закладка — 22 апреля 1978 года, спуск на воду — 3 июня 1983 года, в строй лодка вступила 28 декабря 1983-го и вошла в Северный флот. В НАТО её называли «Майк».
      src: "Источники: «Российская газета», 04.08.2020; «Московская правда», 04.08.2021; Общество памяти АПЛ «Комсомолец»."
    - summary: 4 августа 1985 года в Норвежском море с глубиномера оторвали чёрную бумажку. Под ней прятали цифры предельной глубины.
      det:
        - Лодкой командовал капитан 1-го ранга Юрий Зеленский, старшим на борту был вице-адмирал Евгений Чернов, командующий 1-й флотилией атомных подводных лодок. В отсеках был и главный конструктор Юрий Кормилицин.
        - "Старшина команды штурманских электриков Вениамин Матвеев вспоминал: «В тот день с глубиномера в центральном посту была оторвана чёрная бумажка, закрывавшая на его шкале секретности ради цифры предельной глубины. Мы ахнули: 900, 1000, 1100 метров…»"
      src: "Источники: телеканал «Звезда», «Титановый панцирь „Комсомольца“»; «Московская правда», 04.08.2021, по книге Ю. Бахарева «Триумф и трагедия „Комсомольца“»."
    - summary: "Уходили медленно: до 800 метров — ступенями по 50, дальше — по 25, и на каждой осматривали отсеки. На 700 метрах реактор вывели на полную мощность."
      det:
        - "Адмирал Чернов рассказывал: «Перед погружением были тщательно проверены все системы, имеющие забортное сообщение, торпедные аппараты, оружие… Понимали, что с такой глубины можно и не всплыть»."
        - "Ответственный сдатчик лодки от Севмаша Владимир Чувакин вспоминал: «До восьмисот метров погружение осуществлялось ступенями через 50 метров, далее до предельной глубины ступенями через 25 метров». На каждой ступени задерживались и осматривали отсеки."
        - Погружение на километр заняло несколько часов.
      src: "Источники: телеканал «Звезда»; пресс-служба ПО «Севмаш» (Sudostroenie.info, 04.08.2025); «Московская правда», 04.08.2021."
    - summary: "На тысяче метров Чернов сказал в микрофон: «Остановись, мгновенье!» — и по отсекам пронесли флаг корабля."
      det:
        - "«Наконец стрелка глубиномера остановилась на четырёхзначной отметке — 1000. Есть глубина в один километр! Я вышел на связь с отсеками по боевой линии и, глядя на глубиномер, произнёс в микрофон внутрилодочной связи бессмертную пушкинскую фразу: „Остановись, мгновенье!..“»"
        - "Потом адмирал спросил конструкторов Юрия Кормилицина и Дмитрия Романова: «Если ещё на двадцать метров погрузимся — выдержим?» Их поддержал ответственный сдатчик лодки от Севмаша Владимир Чувакин, и лодка пошла глубже."
      src: "Источники: телеканал «Звезда», рассказ Героя Советского Союза адмирала Е. Д. Чернова; имя В. Чувакина — по пресс-службе ПО «Севмаш» (Sudostroenie.info, 04.08.2025)."
    - summary: На 1027 метрах потёк фланец, треснула деревянная панель, а срезанные давлением титановые болты отлетали, как пули.
      find: true
      tag: Находка дня
      det:
        - "Корпус на такой глубине обжимает так, что он становится чуть уже. Чернов вспоминал: «Из отсеков поступали тревожные доклады: там потёк фланец, там треснула от резкого уменьшения диаметра корпуса деревянная панель… Потом, как пули, стали отлетать срезанные немыслимым обжатием титановые болты. Но в целом все механизмы работали без замечаний, корабль прекрасно управлялся как по глубине, так и по горизонту»."
        - "Попробуй сам в модели ниже: опустить лодку на километр."
      src: "Источник: телеканал «Звезда», рассказ адмирала Е. Д. Чернова."
    - summary: На километре вода давит на каждый квадратный сантиметр корпуса почти с сотней килограммов.
      det:
        - Каждые 10 метров воды добавляют примерно одну атмосферу — около килограмма на квадратный сантиметр. На глубине 1027 метров это около 103 атмосфер. Это наш расчёт по школьной физике, а не цифра из документов лодки.
        - «Московская правда» пишет, что на километровой глубине на весь корпус давит больше трёх миллионов тонн.
      src: "Источник: «Московская правда», 04.08.2021; расчёт давления — наш."
    - summary: На обратном пути, на 800 метрах, лодка выстрелила торпедой. Задние крышки аппаратов дрогнули — и выдержали.
      det:
        - "Стреляли болванками — торпедами без боевой части. Вениамин Матвеев был в торпедном отсеке: «Когда открыли передние крышки торпедных аппаратов, мы увидели, как дрогнули задние от напора глубины. Дрогнули, но чудовищное забортное давление удержали. Торпеда вышла нормально… Гребные валы вдруг изогнулись, потом снова приняли свою форму. А затем всплытие. Вознеслись с глубины 800 метров… за 30 секунд»."
        - На такой глубине лодку не могли достать ни другие подлодки, ни противолодочное оружие, а гидроакустика её почти не слышала.
      src: "Источники: телеканал «Звезда»; Общество памяти АПЛ «Комсомолец»; «Московская правда», 04.08.2021."
    - summary: 7 апреля 1989 года, на 39-й день похода, в седьмом отсеке вспыхнул пожар. Лодка всплыла и почти шесть часов боролась за жизнь.
      det:
        - 31 января 1989 года К-278 получила имя «Комсомолец». Через 67 дней, в 11:02, лодка шла на глубине 380 метров, и в седьмом отсеке начался пожар. Причина так и не установлена. В 11:16 лодка всплыла. Огонь разрушил трубопроводы, и лодку стала заливать вода. В 17:08 «Комсомолец» затонул в Норвежском море на глубине 1658 метров.
      src: "Источники: Центральный военно-морской музей, выставка «Памяти АПЛ К-278 „Комсомолец“»; Общество памяти АПЛ «Комсомолец»; «Московская правда», 04.08.2021."
    - summary: Капитан 3-го ранга А. М. Испенков остался внутри и до последних минут держал работающим дизель-генератор.
      det:
        - Пока экипаж выходил наверх, Испенков оставался в прочном корпусе и обеспечивал работу дизель-генератора. Он ушёл на дно вместе с лодкой.
        - Командир Евгений Ванин и ещё четверо успели забраться во всплывающую спасательную камеру. На поверхности давлением сорвало люк. Мичмана Сергея Черникова выбросило в море, выбраться сумел только мичман Виктор Слюсаренко. Камера набрала воды и затонула.
      src: "Источник: Общество памяти АПЛ «Комсомолец», хроника гибели."
    - summary: На борту было 69 человек, погибли 42. Весь экипаж наградили орденом Красного Знамени.
      podrobnee: Указ о награждении и День памяти
      det:
        - Большинство погибших не утонули вместе с лодкой, а замёрзли в ледяной воде, не дождавшись спасателей. Плавбаза «Алексей Хлобыстов» пришла в 18:20 и подняла 30 живых и 16 погибших. Указ о награждении всех членов экипажа орденом Красного Знамени вышел 12 мая 1989 года.
        - День гибели «Комсомольца», 7 апреля, в России — День памяти погибших подводников.
      src: "Источники: Общество памяти АПЛ «Комсомолец»; Центральный военно-морской музей; «Российская газета», 04.08.2020."
    - summary: "Рекорд остался за погибшей лодкой: ни одна подводная лодка не погружалась глубже 1027 метров."
      det:
        - Центральный военно-морской музей называет 1027 метров абсолютным рекордом глубины погружения среди подводных лодок. «Российская газета» в 2020 году и «Московская правда» в 2021-м пишут, что этот рекорд никто не побил.
        - Участник погружения капитан 2-го ранга Василий Кундрюков вспоминал, что одни манометры показали 1040 метров, а в документы по общему согласию записали 1020.
      src: "Источники: Центральный военно-морской музей; «Российская газета», 04.08.2020; «Московская правда», 04.08.2021."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о К-278 «Комсомолец»
    h2: Титан, рекорд и золотая рыбка
    udary:
      - summary: <b>Севмаш построил три док-камеры, чтобы ещё на заводе сдавить отсеки К-278 давлением глубины.</b>
        det:
          - "Титановый корпус проверили до выхода в море: завод специально построил три док-камеры. В них отсеки лодки сдавливали снаружи водой — так, как их сдавит глубина."
          - Кораблестроители и офицеры называли саму лодку «гидрокосмической орбитальной станцией».
        src: "Источник: «Исполнилось 40 лет рекорду глубины погружения», Sudostroenie.info (пресс-служба ПО «Севмаш»), 04.08.2025 — https://sudostroenie.info/novosti/45757.html"
        otryvok: «…на заводе специально были построены три док-камеры для испытаний отсеков подлодки наружным давлением. Кораблестроители и офицеры называли атомную подлодку своего рода гидрокосмической орбитальной станцией».
        stranica: «Исполнилось 40 лет рекорду глубины погружения», Sudostroenie.info (пресс-служба ПО «Севмаш»), 2025
        href: https://sudostroenie.info/novosti/45757.html
        pometka: документ
      - summary: "<b>Сварщики Севмаша учились заново: титановую лодку нельзя было варить, как стальную.</b>"
        det:
          - Для титанового сплава понадобились особое оборудование, свои станки и специально обученные сварщики.
          - Строили К-278 в стапельном цехе № 42 Севмаша, в строжайшей секретности. Ответственный сдатчик лодки — Владимир Чувакин.
        src: "Источник: «Самой глубоководной в мире атомной подводной лодке исполнилось 40 лет», Korabel.ru (материал ПО «Севмаш»), 28.12.2023 — https://www.korabel.ru/news/comments/samoy_glubokovodnoy_v_mire_atomnoy_podvodnoy_lodke_ispolnilos_40_let.html"
        otryvok: «…проведение сварочных работ на АПЛ из титанового сплава из-за особенностей металла требовало специального оборудования, станков, специально обученных сварщиков». — «Атомная подводная лодка была заложена в 1978 году на Севмаше в стапельном цехе №42. Ответственный сдатчик – Владимир Чувакин».
        stranica: «Самой глубоководной в мире атомной подводной лодке исполнилось 40 лет», Korabel.ru (материал ПО «Севмаш»), 2023
        href: https://www.korabel.ru/news/comments/samoy_glubokovodnoy_v_mire_atomnoy_podvodnoy_lodke_ispolnilos_40_let.html
        pometka: документ
      - summary: <b>На флоте её звали «золотой рыбкой» — за сверхдорогой титан и долгие годы проектирования и постройки.</b>
        det:
          - Корпус из титанового сплава стоил очень дорого, а от задания 1966 года до вступления в строй в декабре 1983-го прошло больше 17 лет. За это лодку на флоте и прозвали «золотой рыбкой».
          - "«Аргументы и факты» добавляют: при этом К-278 действительно была уникальным кораблём."
        src: "Источник: Андрей Сидорчик, «Конец „Комсомольца“. Как погибла лучшая советская подлодка», «Аргументы и факты», 07.04.2014 — https://aif.ru/society/history/konec_komsomolca_kak_pogibla_luchshaya_sovetskaya_podlodka"
        otryvok: «За использование сверхдорогого титана, а также за длительность проектирования и постройки лодку на флоте прозвали „золотой рыбкой“. Но К-278 действительно была уникальным кораблём».
        stranica: Андрей Сидорчик, «Конец „Комсомольца“. Как погибла лучшая советская подлодка», «Аргументы и факты», 2014
        href: https://aif.ru/society/history/konec_komsomolca_kak_pogibla_luchshaya_sovetskaya_podlodka
        pometka: документ
      - summary: <b>Экипаж К-278 продержал лодку на километровой глубине 51 минуту, прежде чем уйти ещё глубже.</b>
        det:
          - "Это было не касание: на глубине 1000 метров лодка провела почти час — 51 минуту — и только потом пошла дальше, к рекорду."
          - Так вспоминал участник погружения капитан 2-го ранга Василий Кундрюков (журнал «Морполит»).
        src: "Источник: Сергей Ишков, «Погружение на рекордную глубину», «Московская правда», 04.08.2021 — https://mospravda.ru/2021/08/04/213644/"
        otryvok: "«…капитан 2-го ранга Василий Кундрюков (его воспоминания были опубликованы в журнале „Морполит“), на глубине 1000 метров подлодка находилась почти час (51 минуту): „Затем погрузились еще…“»."
        stranica: Сергей Ишков, «Погружение на рекордную глубину», «Московская правда», 2021
        href: https://mospravda.ru/2021/08/04/213644/
        pometka: документ
      - summary: <b>Последние метры до рекорда экипаж К-278 прошёл шагами по 25 метров.</b>
        det:
          - "Ответственный сдатчик Севмаша Владимир Чувакин вспоминал: «До восьмисот метров погружение осуществлялось ступенями через 50 метров, далее до предельной глубины ступенями через 25 метров. С семисот метров начало сказываться обжатие прочного корпуса… С окончанием проверок на предельной глубине 1027 метров состоялся короткий митинг»."
          - Митинг провели прямо в лодке, на глубине больше километра.
        src: "Источник: «Исполнилось 40 лет рекорду глубины погружения», Sudostroenie.info (пресс-служба ПО «Севмаш»), 04.08.2025 — https://sudostroenie.info/novosti/45757.html"
        otryvok: «До восьмисот метров погружение осуществлялось ступенями через 50 метров, далее до предельной глубины ступенями через 25 метров. С семисот метров начало сказываться обжатие прочного корпуса».
        stranica: «Исполнилось 40 лет рекорду глубины погружения», Sudostroenie.info (пресс-служба ПО «Севмаш»), 2025
        href: https://sudostroenie.info/novosti/45757.html
        pometka: документ
      - summary: <b>К-278 ещё в 1985 году работала на глубине вдвое большей, чем американский «Сивулф» 1997 года.</b>
        det:
          - Seawolf — самая современная атомная лодка США, в строй она вошла в 1997 году, через 12 лет после рекорда К-278. Её рабочая глубина — 450 метров, предельная — 600.
          - "К-278 работала на 1000 метрах и опустилась на 1027. «Российская газета»: ни одна боевая лодка мира не смогла бы уйти на такую глубину — «её бы раздавило»."
        src: "Источники: «Малошумный „Морской волк“ из США, или „Много шума из ничего“», еженедельник «Звезда», 22.10.2020 — https://zvezdaweekly.ru/news/20201022106-WXh4E.html ; «АПЛ „Комсомолец“ установила рекорд глубины погружения 35 лет назад», «Российская газета», 04.08.2020 — https://rg.ru/2020/08/04/apl-komsomolec-ustanovila-rekord-glubiny-pogruzheniia-35-let-nazad.html"
        otryvok: «Рабочая глубина - 450 м, максимальная - 600 м». — «Компания GDEB заложила корпус в октябре 1989 г. Спуск на воду состоялся в 1995-м. На ходовые испытания ушло дополнительно два года».
        stranica: «Малошумный „Морской волк“ из США, или „Много шума из ничего“», еженедельник «Звезда», 2020
        href: https://zvezdaweekly.ru/news/20201022106-WXh4E.html
        pometka: два источника
      - summary: <b>К-278 опережала своё время на четверть века — так РИА Новости оценивает её характеристики.</b>
        det:
          - Лодка была сразу лабораторией, испытательным стендом и прототипом будущего гражданского подводного флота.
          - Входили в неё через всплывающую спасательную камеру. Севмаш пишет о «заложенных в конструкцию технических идеях XXI века».
        src: "Источники: «Гибель атомной подводной лодки К-278 „Комсомолец“ (1989)», РИА Новости, 07.04.2019 — https://ria.ru/20190407/1552413093.html ; ПО «Севмаш», «Памятные даты», 28.12.1983 — https://sevmash.ru/rus/dates.html?start=110"
        otryvok: «По своим тактико-техническим характеристикам корабль опережал свое время на четверть века». — «Она была одновременно лабораторией, испытательным стендом и прототипом будущего гражданского подводного флота».
        stranica: «Гибель атомной подводной лодки К-278 „Комсомолец“ (1989)», РИА Новости, 2019
        href: https://ria.ru/20190407/1552413093.html
        pometka: документ
      - summary: <b>Мичман Виктор Слюсаренко — единственный в мире, кто спасся с лодки, затонувшей на глубине 1,5 км.</b>
        det:
          - Когда «Комсомолец» тонул, пятеро моряков были во всплывающей спасательной камере. Она оторвалась от лодки почти у дна и вылетела на поверхность «как пробка из-под шампанского».
          - Выжил только Слюсаренко.
        src: "Источник: Андрей Сидорчик, «Конец „Комсомольца“. Как погибла лучшая советская подлодка», «Аргументы и факты», 07.04.2014 — https://aif.ru/society/history/konec_komsomolca_kak_pogibla_luchshaya_sovetskaya_podlodka"
        otryvok: «Камера отделилась от лодки практически на дне… Спасательную капсулу выбросило на поверхность, как пробку из-под шампанского». — «Виктор Фёдорович Слюсаренко — единственный человек в мире, спасшийся из подводной лодки, затонувшей на полуторакилометровой глубине».
        stranica: Андрей Сидорчик, «Конец „Комсомольца“. Как погибла лучшая советская подлодка», «Аргументы и факты», 2014
        href: https://aif.ru/society/history/konec_komsomolca_kak_pogibla_luchshaya_sovetskaya_podlodka
        pometka: документ
      - summary: <b>На глубине в спасательной камере у моряков стали писклявые голоса.</b>
        det:
          - "Камера, в которой были пятеро, шла ко дну вместе с «Комсомольцем». Нижний люк не закрывался до конца, и вода выгоняла через щель воздух из отсеков, накачивая титановую капсулу, как компрессор. Давление росло с каждой сотней метров: камеру заволокло холодным паром, а голоса изменились."
        src: "Источник: «Тайна „камеры-убийцы“», Korabel.ru, 25.05.2004 — https://www.korabel.ru/news/comments/tayna___kameri-ubiytsi.html"
        otryvok: «Сквозь все еще не закрытую щель в камеру с силой шел воздух, выгоняемый водой из отсеков, он надувал титановую капсулу, будто мощный компрессор. С каждой сотней метров давление росло, так что вскоре камеру заволокло холодным паром, а голоса у всех стали писклявыми».
        stranica: «Тайна „камеры-убийцы“», Korabel.ru, 2004
        href: https://www.korabel.ru/news/comments/tayna___kameri-ubiytsi.html
        pometka: документ
      - summary: <b>Спасательная камера К-278 была рассчитана на 70 человек — то есть на весь экипаж.</b>
        det:
          - Всплывающую спасательную камеру встроили в рубку. Обводы лодки от этого не пострадали. «Популярная механика» (TechInsider) пишет, что камеру, способную спасти весь экипаж, придумали только советские конструкторы. На борту в последнем походе было 69 человек, а в камере поместились бы все.
        src: "Источники: «Тайна „камеры-убийцы“», Korabel.ru, 25.05.2004 — https://www.korabel.ru/news/comments/tayna___kameri-ubiytsi.html ; «Как спастись с подводной лодки: „Комсомолец“ и другие», TechInsider («Популярная механика») — https://www.techinsider.ru/weapon/492862-kak-spastis-s-podvodnoy-lodki-komsomolec-i-drugie/"
        otryvok: «…если бы… весь экипаж заблаговременно разместился в капсуле, рассчитанной на 70 человек».
        stranica: «Тайна „камеры-убийцы“», Korabel.ru, 2004
        href: https://www.korabel.ru/news/comments/tayna___kameri-ubiytsi.html
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё шесть фактов
    h2: Последний поход
    udary:
      - summary: <b>Под водой лодка могла держаться 90 суток, а в последнем походе ей велели не всплывать три месяца.</b>
        det:
          - «Комсомолец» вышел на боевую службу в конце февраля 1989 года. Экипаж должен был три месяца скрытно следить за кораблями вероятного противника, ни разу не поднимаясь на поверхность. По плану лодка возвращалась 31 мая (так говорит Слюсаренко в журнале «Родина», 07.04.2019).
        src: "Источник: «„Ушла за минуты“: выжившие моряки рассказали о гибели АПЛ „Комсомолец“», РИА Новости, 07.04.2019 — https://ria.ru/20190407/1552427815.html"
        otryvok: «Под водой лодка могла находиться до 90 суток… Моряки должны были три месяца дежурить без всплытия — обнаруживать и скрытно следить за кораблями потенциального противника».
        stranica: "«„Ушла за минуты“: выжившие моряки рассказали о гибели АПЛ „Комсомолец“», РИА Новости, 2019"
        href: https://ria.ru/20190407/1552427815.html
        pometka: документ
      - summary: <b>На «Комсомольце» кормили пять раз в день — «физически столько не съесть».</b>
        det:
          - "Мичман Виктор Слюсаренко рассказал, что перед пожаром 7 апреля отказался от еды: кормили так часто, что не успевал проголодаться. В том же походе кок испёк ему торт на день рождения — прямо под водой."
        src: "Источник: «Мичман Виктор Слюсаренко: „Я всплыл с 1000 метров…“», журнал «Родина» («Российская газета»), 07.04.2019 — https://rodina-history.ru/2019/04/07/rodina-podlodka-komsomolets.html"
        otryvok: «Кушать не стал, нас кормили пять раз в день, физически столько не съесть». — «Попутно отпраздновал я день рождения, кок испек торт».
        stranica: "«Мичман Виктор Слюсаренко: „Я всплыл с 1000 метров…“», журнал «Родина» («Российская газета»), 2019"
        href: https://rodina-history.ru/2019/04/07/rodina-podlodka-komsomolets.html
        pometka: документ
      - summary: "<b>Имя «Комсомолец» придумали в экипаже: все на борту были молодыми комсомольцами.</b>"
        det:
          - Сначала лодка носила шифр проекта — «Плавник». Замполит решил, что у корабля должно быть настоящее имя. Экипаж был молодой, все состояли в комсомоле, отсюда и название.
        src: "Источник: «Мичман Виктор Слюсаренко: „Я всплыл с 1000 метров…“», журнал «Родина» («Российская газета»), 07.04.2019 — https://rodina-history.ru/2019/04/07/rodina-podlodka-komsomolets.html"
        otryvok: '«Изначально он носил другое название - "Плавник". Но наш замполит считал, что лодка должна быть именной. И решили: раз экипаж у нас молодой, все комсомольцы, то пусть будет "Комсомолец"».'
        stranica: "«Мичман Виктор Слюсаренко: „Я всплыл с 1000 метров…“», журнал «Родина» («Российская газета»), 2019"
        href: https://rodina-history.ru/2019/04/07/rodina-podlodka-komsomolets.html
        pometka: документ
      - summary: <b>Экипаж Ил-38 поднял самолёт на помощь лодке за 49 минут вместо положенных 1 ч 20 мин.</b>
        det:
          - "Лодка горела в 980 км от советской границы: вертолёту не хватило бы топлива, а гидросамолёт летел вдвое медленнее. Поэтому к ней отправили противолодочный Ил-38 майора Геннадия Петроградского. Он кружил над «Комсомольцем», держал связь с берегом и наводил к лодке суда."
        src: "Источник: «Гибель атомной подводной лодки К-278 „Комсомолец“. Справка», РИА Новости, 07.04.2009 — https://ria.ru/20090407/167349950.html"
        otryvok: «В 12:43 поднялся в воздух ИЛ‑38, командир экипажа майор Геннадий Петроградский. На подготовку такой машины к аварийно-спасательному вылету отводится 1 час 20 минут. Но экипаж сумел уложиться в 49 минут».
        stranica: «Гибель атомной подводной лодки К-278 „Комсомолец“. Справка», РИА Новости, 2009
        href: https://ria.ru/20090407/167349950.html
        pometka: документ
      - summary: <b>Лодку на дне «запечатали» двухметровыми титановыми заглушками — впервые в мире.</b>
        det:
          - В 1994 году глубоководные «Мир-1» и «Мир-2» на глубине около 1700 метров закрыли манипуляторами носовые отверстия торпедных аппаратов, где лежали торпеды с ядерными боеголовками. Один аппарат подвозил заглушку, второй ставил её на место. В аппаратах было +11 °C при влажности 100 %.
        src: "Источники: «Чрезвычайные экспедиции к месту нахождения затонувшей подводной лодки „Комсомолец“», журнал портала ВДПО.рф (воспоминания А. И. Вялышева, главного специалиста МЧС России) — https://xn--b1ae4ad.xn--p1ai/blog/post/chrezvychaynye-ekspeditsii-k-mestu-nakhozhdeniya-zatonuvshey-podvodnoy-lodki-komsomolets ; РИА Новости, 07.04.2019 — https://ria.ru/20190407/1552427815.html"
        otryvok: «…„надеть“ на эти зажимы двухметровые титановые заглушки». — «Работы по герметизации носовой части подводной лодки не имели прецедента и проводились впервые в мировой практике». — «…воздуха в аппарате +11°С при влажности 100 %».
        stranica: А. И. Вялышев (воспоминания), «Чрезвычайные экспедиции к месту нахождения затонувшей подводной лодки „Комсомолец“», журнал портала ВДПО.рф, б. г.
        href: https://xn--b1ae4ad.xn--p1ai/blog/post/chrezvychaynye-ekspeditsii-k-mestu-nakhozhdeniya-zatonuvshey-podvodnoy-lodki-komsomolets
        pometka: документ
      - summary: "<b>Приборы на корпусе «Комсомольца» однажды нашли срезанными: у лодки побывали «незваные гости».</b>"
        det:
          - С 1989 по 1998 год у лодки работали «Миры». На корпус ставили измерительную и записывающую аппаратуру. В одно из погружений оказалось, что всю её кто-то срезал. «Звезда» связывает это с интересом иностранцев к секретам лодки и напоминает, что в 2019 году норвежцы обследовали К-278 своим подводным аппаратом.
        src: "Источник: «Титановый панцирь „Комсомольца“, или Триумф и трагедия самой глубоководной АПЛ», еженедельник «Звезда», 06.08.2025 — https://zvezdaweekly.ru/news/20257221243-lJNcP.html"
        otryvok: «…на корпусе субмарины была установлена измерительная и записывающая аппаратура… во время очередного погружения было установлено, что вся измерительная и записывающая аппаратура с корпуса срезана. То есть на „Комсомольце“ побывали незваные гости».
        stranica: «Титановый панцирь „Комсомольца“, или Триумф и трагедия самой глубоководной АПЛ», еженедельник «Звезда», 2025
        href: https://zvezdaweekly.ru/news/20257221243-lJNcP.html
        pometka: документ
razdely: []
