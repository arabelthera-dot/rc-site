pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "<b>Граница рекорда:</b> абсолютный мировой рекорд глубины погружения подводной лодки — 1027 метров, К-278, 4 августа 1985 года, Норвежское море. Это боевая лодка, а не исследовательский аппарат: на обратном пути она стреляла торпедой с 800 метров. Доказательство — Центральный военно-морской музей и свидетельства участников погружения."
