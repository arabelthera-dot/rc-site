kak_rabotaet:
- Элементы стоят по росту атомного веса
- Похожие по свойствам элементы оказываются в одном столбце
- Там, где ряд ломается, Менделеев оставлял пустую клетку
- По соседям клетки он рассчитывал вес и свойства ненайденного элемента
data_uslovnaya: 8 февраля — день музея; таблицу Менделеев составил 17 февраля (1 марта) 1869 года.
