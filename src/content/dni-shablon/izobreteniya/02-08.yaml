audioguide:
  audioSrc: audio-guide-mendeleev-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу таблицы Менделеева: от пустых клеток 1869 года через галлий, скандий и германий к сто первому элементу. Четыре остановки.'
  stops:
  - t: 0
    mark: '0:00'
    title: Таблица с пустыми клетками
  - t: 45
    mark: '0:45'
    title: Галлий и скандий
  - t: 90
    mark: '1:30'
    title: Германий — экасилиций
  - t: 117
    mark: '1:57'
    title: Сто первый элемент
  transcript:
  - 'Здравствуйте. Мы в зале периодической системы элементов. Тысяча восемьсот шестьдесят девятый год, Санкт-Петербург, университет. Дмитрий Иванович Менделеев, химик, профессор Петербургского университета, семнадцатого февраля составляет таблицу элементов. Менделеев оставил в таблице пустые клетки и описал вещества, которых никто не видел, — их нашли ровно такими. Элементы стоят по росту атомного веса, и похожие по свойствам оказываются в одном столбце. Там, где ряд ломается, Менделеев оставлял пустую клетку, а по соседям рассчитывал вес и свойства ненайденного элемента. О законе века объявил не автор: Менделеев в тот день уехал проверять сыроварни.'
  - 'Первым нашли галлий — во Франции, в тысяча восемьсот семьдесят пятом году. Менделеев предсказал даже прибор: экаалюминий найдут спектроскопом. Так его и нашли. Француз, открывший галлий, узнал о законе Менделеева из письма самого Менделеева. Не держа в руках ни крупинки галлия, Менделеев поправил его первооткрывателя — и оказался прав. Все химики писали вес бериллия тринадцать с половиной. Менделеев зачеркнул и поставил девять — и мир исправился. Швед Нильсон спорил с Менделеевым о бериллии — и сам же нашёл предсказанный им экабор, скандий. Для скандия Менделеев заранее расписал вес, формулы окисла и хлорида, соли — сбылось через восемь лет.'
  - 'Менделеев предсказал вес экасилиция: семьдесят два. Через пятнадцать лет германий взвесили — семьдесят две целых тридцать две сотых. Немец Винклер решил, что нашёл родню сурьмы, — спор кончился признанием: это экасилиций. Германий хотели назвать «нептуний»: как планету Нептун, найденную сперва на бумаге. Бунзен, создатель спектроскопа, сравнил таблицу с «биржевым листком» — его прибор её и доказал.'
  - 'Клетку экамарганца не смогла заполнить природа — элемент пришлось сделать в циклотроне. Экамарганец «открывали» в Японии и Германии, давали имена — и всё оказалось ошибкой. Тысяча девятьсот пятьдесят пятый, холодная война — а американцы назвали сто первый элемент в честь русского Менделеева. Менделевий нашли всего по семнадцати атомам — и назвали в честь того, кто таблицу придумал. Сегодня в таблице сто восемнадцать элементов.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
