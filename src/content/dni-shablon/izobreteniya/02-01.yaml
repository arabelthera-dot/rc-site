    src: 'Источник: статья «Санкт-Петербургскому научно-исследовательскому психоневрологическому институту им. В. М. Бехтерева — 100 лет», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/sankt-peterburgskomu-nauchno-issledovatelskomu-psihonevrologicheskomu-institutu-im-v-m-behtereva-100-let" rel="noopener" target="_blank">cyberleninka.ru</a>; НМИЦ психиатрии и неврологии им. В. М. Бехтерева, «История центра» — <a href="https://bekhterev.ru/about/history/" rel="noopener" target="_blank">bekhterev.ru</a>'
