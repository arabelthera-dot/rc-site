story:
  kicker: История учёного
  h2: Карта мозга, подписанная его именем
  udary:
  - summary: '<b>Бехтерев составлял карту мозга: какой участок за что отвечает.</b>'
    det:
    - 'Он вскрывал проводящие пути, искал ядра и центры — и описывал их первым. Поэтому на карте мозга столько мест с его именем: ядро, полоска, пути.'
    - Он лечил людей и учил студентов, а в 1907 году открыл в Петербурге Психоневрологический институт.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «впервые описан ряд проводящих путей и других ядер ЦНС»
    stranica: КиберЛенинка, раздел о вкладе в нейроанатомию
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о Бехтереве
  h2: Факты дня
  udary:
  - summary: <b>Владимир Бехтерев родился 20 января 1857 года в селе Сорали Вятской губернии.</b>
    kadr:
      src: /muzei/izobreteniya/img/02-01-goskatalog-24878749.jpg
      width: 503
      height: 800
      alt: 'Старый печатный портрет: Владимир Бехтерев с густой бородой и зачёсанными назад волосами, в тёмном сюртуке'
      data_source: https://goskatalog.ru/portal/#/collections?id=25026537
      license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ); Госкаталог музейного фонда РФ
      podpis: Портрет Владимира Михайловича Бехтерева, врача-психиатра, начало XX века.
      credit: 'Цинкография, автор не указан. Хранится: Государственный исторический музей (Москва), инв. И III 64140. Госкаталог музейного фонда РФ, рег. № 24878749.'
    det:
    - По новому стилю это 1 февраля — поэтому его день в нашем календаре сегодня.
    - Отец, становой пристав, умер от чахотки, когда сыну было восемь лет. Сегодня родное село называется Бехтерево — оно в Татарстане.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «В. М. Бехтерев и учение о двигательных расстройствах», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-uchenie-o-dvigatelnyh-rasstroystvah" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «Бехтерев родился 1 февраля (20 января по старому стилю) 1857 года в с. Сорали Елабужского уезда Вятской губернии»
    stranica: 'КиберЛенинка; вторая статья: «Родился Владимир Михайлович 20 января (1 февраля по новому стилю) 1857 г.»'
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>Бехтерев первым описал верхнее вестибулярное ядро — во всём мире его зовут «ядро Бехтерева».</b>
    det:
    - Это скопление нервных клеток в стволе мозга, которое помогает держать равновесие.
    - Ядро он описал в 1885 году — и после этого его имя узнали все неврологи Европы.
    src: 'Источник: статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «Имя Владимира Михайловича Бехтерева стало известно всем неврологам Европы после того, как он описал «вестибулярное ядро Бехтерева» (1885)»
    stranica: 'КиберЛенинка; вторая статья: «открыты верхнее вестибулярное ядро (ядро Бехтерева)»'
    href: https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii
    pometka: документ
  - summary: <b>В коре мозга есть «полоска Бехтерева» — так её назвали немецкие учёные Фохты.</b>
    det:
    - Это тонкая полоска нервных волокон между первым и вторым слоями коры больших полушарий.
    - Имя Бехтерева дали ей супруги Оскар и Сесиль Фохт — сами исследователи мозга.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «полоска нервных волокон между I и II слоями коры больших полушарий (полоска Бехтерева - эпоним предложен О. и С. Фохтами)»
    stranica: КиберЛенинка, раздел о вкладе в нейроанатомию
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>Он первым описал «одеревенелость позвоночника» — болезнь Бехтерева, 1892 год.</b>
    det:
    - При этой болезни позвонки срастаются, и спина теряет гибкость.
    - Сегодня врачи называют её анкилозирующим спондилоартритом, но и старое имя — болезнь Бехтерева — в ходу по всему миру.
    src: 'Источник: статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «В. М. Бехтерев и учение о двигательных расстройствах», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-uchenie-o-dvigatelnyh-rasstroystvah" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «описал «вестибулярное ядро Бехтерева» (1885) и «одеревенелость позвоночника» — болезнь Бехтерева (1892)»
    stranica: 'КиберЛенинка; вторая статья: «Другое название - анкилозирующий спондилоартрит»'
    href: https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii
    pometka: документ
  - summary: <b>Бехтерев нашёл в коре мозга человека место, где мы чувствуем вкус.</b>
    det:
    - Он определил, что вкусовой центр лежит в коре, в области покрышки — по-латыни operculum.
    - Он же выяснил, какую роль играет зрительный бугор — таламус.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «определено расположение вкусового центра у человека в коре … в области operculum; выяснена роль таламуса»
    stranica: КиберЛенинка, раздел о вкладе в нейрофизиологию
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>Книга «Проводящие пути мозга» вышла в Казани и получила премию Бэра.</b>
    det:
    - В ней Бехтерев собрал, по каким нервным волокнам сигнал идёт от одного участка мозга к другому.
    - Книгу много раз переиздавали; ряд этих путей он описал первым.
    src: 'Источник: статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «В Казани состоялась первая публикация его книги «Проводящие пути мозга», которая неоднократно переиздавалась и была удостоена премии Бэра»
    stranica: 'КиберЛенинка; вторая статья: «беспрецедентный по своему значению труд «Проводящие пути спинного и головного мозга»»'
    href: https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii
    pometka: документ
  - summary: <b>«Основы учения о функциях мозга» Бехтерев выпустил в семи книгах.</b>
    kadr:
      src: /muzei/izobreteniya/img/02-01-goskatalog-66150086.jpg
      width: 425
      height: 480
      alt: Обложка старой книги с крупным заглавием и фамилией автора
      data_source: https://goskatalog.ru/portal/#/collections?id=66434151
      license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ); Госкаталог музейного фонда РФ
      podpis: Книга В. М. Бехтерева «Основы учения о функциях мозга», выпуск IV, Санкт-Петербург, 1905 год.
      credit: 'Типографская печать, 1905. Хранится: Кировский областной краеведческий музей им. П. В. Алабина. Госкаталог музейного фонда РФ, рег. № 66150086.'
    det:
    - Это энциклопедия о том, что делает каждый участок мозга. Выпуски выходили в Санкт-Петербурге с 1903 по 1907 год.
    - Четвёртый выпуск 1905 года хранится в Кировском областном краеведческом музее.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «Смелость учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/smelost-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; Музей истории медицины Кировского ГМУ, страница «Владимир Михайлович Бехтерев» — <a href="https://muzeum.medkirov.ru/site/bekhterev" rel="noopener" target="_blank">muzeum.medkirov.ru</a>'
    otryvok: «Появился его энциклопедический труд «Основы учения о функциях мозга» в 7 книгах»
    stranica: 'КиберЛенинка; вторая статья: «был собран материал для одной из фундаментальных его работ - «Основы учения о функциях мозга»»'
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>В 1907 году Бехтерев основал в Петербурге Психоневрологический институт.</b>
    kadr:
      src: /muzei/izobreteniya/img/02-01-goskatalog-17392585.jpg
      width: 800
      height: 626
      alt: Раскрытая книжечка студенческого билета с печатным текстом, вписанными от руки строками и печатью
      data_source: https://goskatalog.ru/portal/#/collections?id=17525967
      license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ); Госкаталог музейного фонда РФ
      podpis: Студенческий билет Психоневрологического института в Санкт-Петербурге на 1913–1916 учебные годы, выданный Александру Николаевичу Чуркину.
      credit: 'Типографская печать, рукопись, 1916. Хранится: Вятский районный историко-художественный музей (МБУК ВРИХМ). Госкаталог музейного фонда РФ, рег. № 17392585.'
    det:
    - 'Это был и научный институт, и высшая школа: мозг и психику человека там изучали вместе.'
    - В институт принимали студентов любого пола и вероисповедания.
    src: 'Источник: статья «Санкт-Петербургскому научно-исследовательскому психоневрологическому институту им. В. М. Бехтерева — 100 лет», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/sankt-peterburgskomu-nauchno-issledovatelskomu-psihonevrologicheskomu-institutu-im-v-m-behtereva-100-let" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «К 165-летию со дня рождения и к 95-летию со дня кончины В. М. Бехтерева», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/k-165-letiyu-so-dnya-rozhdeniya-i-k-95-letiyu-so-dnya-konchiny-v-m-behtereva" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «особое место занимает созданный в 1907 году в Санкт-Петербурге Психоневрологический институт, с деятельностью которого была связана вся его дальнейшая жизнь»
