  - summary: <b>Бехтерев спорил с Фрейдом на равных — и не принял психоанализ целиком.</b>
    det:
    - Оба учились у француза Жана Шарко. Бехтерев критиковал «катарсис» и «сублимацию» Фрейда.
    - В книге «Гипноз, внушение, психотерапия» 1911 года он писал, что психоанализ «далеко уступает психотерапии перевоспитанием и даже внушению».
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «Из истории психоаналитического движения в России, 1904–1932 гг.», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/iz-istorii-psihoanaliticheskogo-dvizheniya-v-rossii-1904-1932-gg" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «В.М. Бехтерев не принимал учения З. Фрейда не только в частностях, но и в целом»
    stranica: 'КиберЛенинка; вторая статья: «Психоанализ же критиковался наиболее резко»'
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>Бехтерев создал своё направление — рефлексологию.</b>
    det:
    - Он считал, что любой мысли и чувству отвечает движение тела или работа органов — и это можно наблюдать и записать.
    - Три тома «Объективной психологии» вышли в 1907–1910 годах, «Общие основания рефлексологии» — в 1918-м.
