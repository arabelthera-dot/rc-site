  kicker: Играй
  zagolovok: 🎮 Подпиши мозг по Бехтереву
  pravilo_ru: 'Что сделать сейчас: выбери подпись под схемой и нажми на её место на мозге или позвоночнике.'
  kak_igrat:
    zachem: Семь участков мозга носят имя Бехтерева — по ним до сих пор учатся неврологи всего мира. Найди на схеме то, что первым описал и нашёл он.
    shagi:
    - Выбери подпись — кнопка под схемой загорится золотом.
    - Нажми на её место на схеме. Верное место загорится зелёным с подписью.
    - Расставь все пять — счётчик внизу покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок подписей каждый раз новый.'
    final: Все пять подписей на своих местах — +20 баллов.
  dannye:
    kartinka:
      src: /muzei/izobreteniya/img/02-01-igra-mozg.svg
      alt: 'Схема мозга сбоку и позвоночника: в глубине мозга — овал, на коре сбоку и в стволе мозга — светящиеся точки, лупа показывает слои коры с тонкой золотой полоской, ниже — позвонки'
      podpis_ru: Схема мозга и позвоночника — нажми на место после выбора подписи.
    mesta:
    - kod: talamus
      nazvanie: Глубина мозга
      x: 40
      y: 29
      verno_ru: Зрительный бугор — таламус. Какую роль он играет, выяснил Бехтерев.
    - kod: vkus
      nazvanie: Кора сбоку
      x: 25
      y: 43
      verno_ru: Вкусовой центр. Где в голове живёт вкус, первым нашёл Бехтерев — в коре, в области покрышки.
    - kod: poloska
      nazvanie: Слои коры
      x: 86
      y: 14
      verno_ru: Полоска Бехтерева — тонкая полоска нервных волокон между первым и вторым слоями коры. Немцы сами назвали её именем русского учёного.
    - kod: yadro
      nazvanie: Ствол мозга
      x: 51
      y: 59
      verno_ru: Ядро Бехтерева в стволе мозга держит нас в равновесии. Это открытие в 28 лет — и его имя узнали все неврологи Европы.
    - kod: pozvonochnik
      nazvanie: Позвоночник
      x: 51
      y: 88
      verno_ru: Болезнь Бехтерева — позвонки срастаются, спина каменеет. Весь мир до сих пор зовёт её его именем.
    podpisi:
    - kod: talamus
      tekst: Таламус
      mesto: talamus
      mimo_ru: Таламус — зрительный бугор — лежит глубоко в центре мозга, а не на поверхности.
    - kod: vkus
      tekst: Вкусовой центр
      mesto: vkus
      mimo_ru: Вкусовой центр Бехтерев нашёл в коре — сбоку, в области покрышки.
    - kod: poloska
      tekst: Полоска Бехтерева
      mesto: poloska
      mimo_ru: 'Полоска Бехтерева лежит между первым и вторым слоями коры: ищи её в лупе.'
    - kod: yadro
      tekst: Ядро равновесия
      mesto: yadro
      mimo_ru: Ядро, которое держит нас в равновесии, лежит в стволе мозга.
    - kod: pozvonochnik
      tekst: Болезнь Бехтерева
      mesto: pozvonochnik
      mimo_ru: 'Болезнь Бехтерева — болезнь позвоночника: позвонки срастаются, спина каменеет.'
