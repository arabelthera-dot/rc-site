story:
  kicker: История учёного
  h2: Карта мозга, подписанная его именем
  udary:
  - summary: 'Бехтерев составлял карту мозга: какой участок за что отвечает.'
    det:
    - 'Он вскрывал проводящие пути, искал ядра и центры — и описывал их первым. Поэтому на карте мозга столько мест с его именем: ядро, полоска, пути.'
    - Он лечил людей и учил студентов, а в 1907 году открыл в Петербурге Психоневрологический институт.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — cyberleninka.ru; статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — cyberleninka.ru'
    otryvok: «впервые описан ряд проводящих путей и других ядер ЦНС»
    stranica: КиберЛенинка, раздел о вкладе в нейроанатомию
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о Бехтереве
  h2: Факты дня
  udary:
  - summary: Семь участков мозга носят имя Бехтерева — по ним до сих пор учатся неврологи всего мира.
    det:
    - Среди его открытий в анатомии мозга — верхнее вестибулярное ядро, полоска нервных волокон в коре, сетчатое ядро покрышки моста и центральный пучок покрышки.
    - Ещё он впервые описал ряд проводящих путей и других ядер нервной системы.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — cyberleninka.ru'
    otryvok: '«Перечислим основные открытия В.М. Бехтерева, признанные при жизни и вошедшие в различные руководства. В нейроанатомии: открыты верхнее вестибулярное ядро (ядро Бехтерева); полоска нервных волокон между I и II слоями коры больших полушарий (полоска Бехтерева -эпоним предложен О. и С. Фохтами); сетчатое ядро покрышки моста мозга (иногда современные авторы добавляют «Бехтерева»); центральный пучок покрышки»'
    stranica: 'КиберЛенинка, раздел об открытиях; там же: «Важно подчеркнуть устоявшиеся, сохранившиеся до наших дней эпонимы»'
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
    id: sem-uchastkov
    istochnik: cl-xxi-vek
    dlya_voprosa: true
    otvet: семь
    otvet_edinstvennyj: true
  - summary: 'Немецкий анатом Копш говорил: «Анатомию мозга прекрасно знают только двое — Бог и Бехтерев».'
    det:
    - Свои исследования мозга казанских лет Бехтерев собрал в книге «Проводящие пути спинного и головного мозга», 1893 год.
    src: 'Источник: статья «Владимир Михайлович Бехтерев», сайт НМИЦ психиатрии и неврологии им. В. М. Бехтерева — bekhterev.ru'
    otryvok: «Немецкий профессор Ф. Копш (1868-1955) утверждал, что «знают прекрасно анатомию мозга только двое – это Бог и Бехтерев».»
    stranica: НМИЦ ПН им. В. М. Бехтерева, страница о Владимире Михайловиче Бехтереве
    href: https://bekhterev.ru/about/vladimir-mihajlovich-behterev/
    pometka: документ
    id: kopsh
    istochnik: nmic-bekhterev
    dlya_voprosa: false
  - summary: 'Ему было 28 лет: одно открытие — ядро в стволе мозга, которое держит нас в равновесии, — и его имя узнали все неврологи Европы.'
    det:
    - Ядро Бехтерев описал в 1885 году; в учебниках оно называется верхним вестибулярным ядром, или ядром Бехтерева.
    src: 'Источник: статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — cyberleninka.ru; статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — cyberleninka.ru'
    otryvok: «Имя Владимира Михайловича Бехтерева стало известно всем неврологам Европы после того, как он описал «вестибулярное ядро Бехтерева» (1885)»
    stranica: 'КиберЛенинка; вторая статья: «открыты верхнее вестибулярное ядро (ядро Бехтерева)»'
    href: https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii
    pometka: документ
    id: yadro-28-let
    istochnik: cl-osnovopolozhnik
    dlya_voprosa: true
    otvet: 28 лет
    otvet_edinstvennyj: true
  - summary: Болезнь, при которой позвонки срастаются и спина каменеет, весь мир до сих пор зовёт болезнью Бехтерева.
    det:
    - Он описал её в 1892 году под названием «одеревенелость позвоночника».
    - Сегодня врачи называют её анкилозирующим спондилоартритом.
    src: 'Источник: статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — cyberleninka.ru; статья «В. М. Бехтерев и учение о двигательных расстройствах», научная электронная библиотека КиберЛенинка — cyberleninka.ru'
    otryvok: «описал «вестибулярное ядро Бехтерева» (1885) и «одеревенелость позвоночника» — болезнь Бехтерева (1892)»
    stranica: 'КиберЛенинка; вторая статья: «Другое название - анкилозирующий спондилоартрит»'
    href: https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii
    pometka: документ
    id: bolezn
    istochnik: cl-osnovopolozhnik
    dlya_voprosa: false
  - summary: Академик посадил у себя дома на диван дрессированную собаку Дурова и проверял, умеет ли она читать мысли.
    det:
    - Дрессировщик Владимир Дуров привёл к нему двух собак — Лорда и маленького фокстерьера Пикки.
    - Дуров смотрел на записанные цифры, отворачивался, и Лорд лаял столько раз, сколько составляла их сумма; сам считать по цифрам пёс не умел — это проверили.
    src: 'Источник: статья В. М. Бехтерева «Об опытах над «мысленным» воздействием на поведение животных», журнал «Вопросы изучения и воспитания личности», 1920, № 2, электронная библиотека ГНПБУ им. К. Д. Ушинского — elib.gnpbu.ru'
    otryvok: '«Мы условились осуществить сеансы на моей квартире. В условленный день Д. привел ко мне двух собак: того же Лорда и другую маленькую собачку из породы фокс-терьеров — Пикки. Пока я скажу об опытах с Лордом. Собака была усажена на диван»'
    stranica: Электронная библиотека ГНПБУ, журнал «Вопросы изучения и воспитания личности», 1920, № 2
    href: http://elib.gnpbu.ru/text/behterev_voprosy-izucheniya-i-vospitaniya_2_1920/
    pometka: документ
    id: sobaka-durova
    istochnik: gnpbu-1920
    dlya_voprosa: false
  - summary: Опытов «мысленного внушения» собакам было 1278, и 696 из них признали удачными.
    det:
    - Ставил их Бехтерев вместе с дрессировщиком Владимиром Дуровым.
    src: 'Источник: буклет «Бехтерев Владимир Михайлович: к 165-летию со дня рождения», библиотека Финансового университета — library.fa.ru'
    otryvok: «Владимир Михайлович с помощью дрессировщика В.Л. Дурова провел порядка 1278 опытов мысленного внушения информации собакам. Из них 696 было признано удачными»
    stranica: Библиотека Финансового университета, буклет к 165-летию Бехтерева, с. 6
    href: http://www.library.fa.ru/files/Bekhterev.pdf
    pometka: документ
    id: opyty-1278
    istochnik: fa-buklet
    dlya_voprosa: true
    otvet: '1278'
    otvet_edinstvennyj: true
  - summary: Алкоголиков Бехтерев гипнотизировал не по одному, а сразу целым залом. Из 600 пациентов у 85% тяга надолго ушла.
    det:
    - Бехтерев заметил, что гипноз в группе получается глубже, чем с одним человеком.
    - В 1927 году вместе с В. Срезневским он доложил на съезде невропатологов и психиатров «Новый метод коллективного лечения больных хроническим алкоголизмом».
    src: 'Источник: автореферат диссертации М. В. Иваниковой «Роль школы В. М. Бехтерева в развитии исследований алкоголизма в России», 2012 — medical-diss.com'
    otryvok: «гипноз в коллективе получается более глубокий, нежели в отдельных случаях»
    stranica: 'Автореферат М. В. Иваниковой, 2012; там же: «прошли курс коллективного гипноза 600 пациентов, в 85% случаев были получены длительные ремиссии»'
    href: https://medical-diss.com/medicina/rol-shkoly-v-m-behtereva-v-razvitii-issledovaniy-alkogolizma-v-rossii
    pometka: документ
    id: gipnoz-zalom
    istochnik: ivanikova
    dlya_voprosa: false
  - summary: Бехтерев и Фрейд учились у одного учителя. Бехтерев напечатал, что психоанализ «далеко уступает» даже обычному внушению.
    det:
    - В Париже, в клинике Жана Шарко, Бехтерев освоил технику гипноза.
    - Психоанализ он резко критиковал в книге «Гипноз, внушение, психотерапия» 1911 года.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — cyberleninka.ru; статья «Из истории психоаналитического движения в России, 1904–1932 гг.», научная электронная библиотека КиберЛенинка — cyberleninka.ru'
    otryvok: «В.М. Бехтерев считал, что метод психоанализа З. Фрейда «далеко уступает психотерапии перевоспитанием и даже внушению»»
    stranica: 'КиберЛенинка; там же: «Конечным пунктом командировки стал Париж, где в клинике Ж. Шарко он освоил технику гипноза»'
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
    id: frejd
    istochnik: cl-xxi-vek
    dlya_voprosa: false
  - summary: Бехтерев предложил собирать мозг гениев в «Пантеон мозга». В итоге его собственный мозг остался в институте.
    det:
    - Статья «О создании Пантеона в СССР» вышла в «Известиях» 19 июня 1927 года.
    - Пока вопрос решали, учёный скоропостижно скончался.
    src: 'Источник: статья «Как создавался Пантеон гениальных мозгов?», Военно-медицинский музей — milmed.spb.ru'
