story:
  kicker: История учёного
  h2: Карта мозга, подписанная его именем
  udary:
  - summary: '<b>Бехтерев составлял карту мозга: какой участок за что отвечает.</b>'
    det:
    - 'Он вскрывал проводящие пути, искал ядра и центры — и описывал их первым. Поэтому на карте мозга столько мест с его именем: ядро, полоска, пути.'
    - Он лечил людей и учил студентов, а в 1907 году открыл в Петербурге Психоневрологический институт.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «впервые описан ряд проводящих путей и других ядер ЦНС»
    stranica: КиберЛенинка, раздел о вкладе в нейроанатомию
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о Бехтереве
  h2: Факты дня
  udary:
  - summary: <b>Семь участков мозга носят имя Бехтерева — по ним до сих пор учатся неврологи всего мира.</b>
    det:
    - Среди его открытий в анатомии мозга — верхнее вестибулярное ядро, полоска нервных волокон в коре, сетчатое ядро покрышки моста и центральный пучок покрышки.
    - Ещё он впервые описал ряд проводящих путей и других ядер нервной системы.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: '«Перечислим основные открытия В.М. Бехтерева, признанные при жизни и вошедшие в различные руководства. В нейроанатомии: открыты верхнее вестибулярное ядро (ядро Бехтерева); полоска нервных волокон между I и II слоями коры больших полушарий (полоска Бехтерева -эпоним предложен О. и С. Фохтами); сетчатое ядро покрышки моста мозга (иногда современные авторы добавляют «Бехтерева»); центральный пучок покрышки»'
    stranica: 'КиберЛенинка, раздел об открытиях; там же: «Важно подчеркнуть устоявшиеся, сохранившиеся до наших дней эпонимы»'
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: '<b>Немецкий анатом Копш говорил: «Анатомию мозга прекрасно знают только двое — Бог и Бехтерев».</b>'
    det:
    - Свои исследования мозга казанских лет Бехтерев собрал в книге «Проводящие пути спинного и головного мозга», 1893 год.
    src: 'Источник: статья «Владимир Михайлович Бехтерев», сайт НМИЦ психиатрии и неврологии им. В. М. Бехтерева — <a href="https://bekhterev.ru/about/vladimir-mihajlovich-behterev/" rel="noopener" target="_blank">bekhterev.ru</a>'
    otryvok: «Немецкий профессор Ф. Копш (1868-1955) утверждал, что «знают прекрасно анатомию мозга только двое – это Бог и Бехтерев».»
    stranica: НМИЦ ПН им. В. М. Бехтерева, страница о Владимире Михайловиче Бехтереве
    href: https://bekhterev.ru/about/vladimir-mihajlovich-behterev/
    pometka: документ
  - summary: '<b>Ему было 28 лет: одно открытие — ядро в стволе мозга, которое держит нас в равновесии, — и его имя узнали все неврологи Европы.</b>'
    det:
    - Ядро Бехтерев описал в 1885 году; в учебниках оно называется верхним вестибулярным ядром, или ядром Бехтерева.
    src: 'Источник: статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «Имя Владимира Михайловича Бехтерева стало известно всем неврологам Европы после того, как он описал «вестибулярное ядро Бехтерева» (1885)»
    stranica: 'КиберЛенинка; вторая статья: «открыты верхнее вестибулярное ядро (ядро Бехтерева)»'
    href: https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii
    pometka: документ
  - summary: <b>Болезнь, при которой позвонки срастаются и спина каменеет, весь мир до сих пор зовёт болезнью Бехтерева.</b>
    det:
    - Он описал её в 1892 году под названием «одеревенелость позвоночника».
    - Сегодня врачи называют её анкилозирующим спондилоартритом.
    src: 'Источник: статья «Владимир Михайлович Бехтерев — основоположник клинической психоневрологии», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «В. М. Бехтерев и учение о двигательных расстройствах», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-uchenie-o-dvigatelnyh-rasstroystvah" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «описал «вестибулярное ядро Бехтерева» (1885) и «одеревенелость позвоночника» — болезнь Бехтерева (1892)»
    stranica: 'КиберЛенинка; вторая статья: «Другое название - анкилозирующий спондилоартрит»'
    href: https://cyberleninka.ru/article/n/vladimir-mihaylovich-behterev-osnovopolozhnik-klinicheskoy-psihonevrologii
    pometka: документ
  - summary: <b>Академик посадил у себя дома на диван дрессированную собаку Дурова и проверял, умеет ли она читать мысли.</b>
    det:
    - Дрессировщик Владимир Дуров привёл к нему двух собак — Лорда и маленького фокстерьера Пикки.
    - Дуров смотрел на записанные цифры, отворачивался, и Лорд лаял столько раз, сколько составляла их сумма; сам считать по цифрам пёс не умел — это проверили.
    src: 'Источник: статья В. М. Бехтерева «Об опытах над «мысленным» воздействием на поведение животных», журнал «Вопросы изучения и воспитания личности», 1920, № 2, электронная библиотека ГНПБУ им. К. Д. Ушинского — <a href="http://elib.gnpbu.ru/text/behterev_voprosy-izucheniya-i-vospitaniya_2_1920/" rel="noopener" target="_blank">elib.gnpbu.ru</a>'
    otryvok: '«Мы условились осуществить сеансы на моей квартире. В условленный день Д. привел ко мне двух собак: того же Лорда и другую маленькую собачку из породы фокс-терьеров — Пикки. Пока я скажу об опытах с Лордом. Собака была усажена на диван»'
    stranica: Электронная библиотека ГНПБУ, журнал «Вопросы изучения и воспитания личности», 1920, № 2
    href: http://elib.gnpbu.ru/text/behterev_voprosy-izucheniya-i-vospitaniya_2_1920/
    pometka: документ
  - summary: <b>Опытов «мысленного внушения» собакам было 1278, и 696 из них признали удачными.</b>
    det:
    - Ставил их Бехтерев вместе с дрессировщиком Владимиром Дуровым.
    src: 'Источник: буклет «Бехтерев Владимир Михайлович: к 165-летию со дня рождения», библиотека Финансового университета — <a href="http://www.library.fa.ru/files/Bekhterev.pdf" rel="noopener" target="_blank">library.fa.ru</a>'
    otryvok: «Владимир Михайлович с помощью дрессировщика В.Л. Дурова провел порядка 1278 опытов мысленного внушения информации собакам. Из них 696 было признано удачными»
    stranica: Библиотека Финансового университета, буклет к 165-летию Бехтерева, с. 6
    href: http://www.library.fa.ru/files/Bekhterev.pdf
    pometka: документ
  - summary: <b>Алкоголиков Бехтерев гипнотизировал не по одному, а сразу целым залом. Из 600 пациентов у 85% тяга надолго ушла.</b>
    det:
    - Бехтерев заметил, что гипноз в группе получается глубже, чем с одним человеком.
    - В 1927 году вместе с В. Срезневским он доложил на съезде невропатологов и психиатров «Новый метод коллективного лечения больных хроническим алкоголизмом».
    src: 'Источник: автореферат диссертации М. В. Иваниковой «Роль школы В. М. Бехтерева в развитии исследований алкоголизма в России», 2012 — <a href="https://medical-diss.com/medicina/rol-shkoly-v-m-behtereva-v-razvitii-issledovaniy-alkogolizma-v-rossii" rel="noopener" target="_blank">medical-diss.com</a>'
    otryvok: «гипноз в коллективе получается более глубокий, нежели в отдельных случаях»
    stranica: 'Автореферат М. В. Иваниковой, 2012; там же: «прошли курс коллективного гипноза 600 пациентов, в 85% случаев были получены длительные ремиссии»'
    href: https://medical-diss.com/medicina/rol-shkoly-v-m-behtereva-v-razvitii-issledovaniy-alkogolizma-v-rossii
    pometka: документ
  - summary: <b>Бехтерев и Фрейд учились у одного учителя. Бехтерев напечатал, что психоанализ «далеко уступает» даже обычному внушению.</b>
    det:
    - В Париже, в клинике Жана Шарко, Бехтерев освоил технику гипноза.
    - Психоанализ он резко критиковал в книге «Гипноз, внушение, психотерапия» 1911 года.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «Из истории психоаналитического движения в России, 1904–1932 гг.», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/iz-istorii-psihoanaliticheskogo-dvizheniya-v-rossii-1904-1932-gg" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «В.М. Бехтерев считал, что метод психоанализа З. Фрейда «далеко уступает психотерапии перевоспитанием и даже внушению»»
    stranica: 'КиберЛенинка; там же: «Конечным пунктом командировки стал Париж, где в клинике Ж. Шарко он освоил технику гипноза»'
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>Бехтерев предложил собирать мозг гениев в «Пантеон мозга». В итоге его собственный мозг остался в институте.</b>
    det:
    - Статья «О создании Пантеона в СССР» вышла в «Известиях» 19 июня 1927 года.
    - Пока вопрос решали, учёный скоропостижно скончался.
    src: 'Источник: статья «Как создавался Пантеон гениальных мозгов?», Военно-медицинский музей — <a href="https://milmed.spb.ru/%d0%ba%d0%b0%d0%ba-%d1%81%d0%be%d0%b7%d0%b4%d0%b0%d0%b2%d0%b0%d0%bb%d1%81%d1%8f-%d0%bf%d0%b0%d0%bd%d1%82%d0%b5%d0%be%d0%bd-%d0%b3%d0%b5%d0%bd%d0%b8%d0%b0%d0%bb%d1%8c%d0%bd%d1%8b%d1%85-%d0%bc%d0%be/" rel="noopener" target="_blank">milmed.spb.ru</a>'
    otryvok: «сам инициатор его создания, академик Бехтерев, скоропостижно скончался. Однако светлая идея не пропала. Она была подхвачена другим «энтузиастом», наркомом здравоохранения Н.А. Семашко. А мозг самого Бехтерева стал первым экспонатом Пантеона.»
    stranica: Военно-медицинский музей, статья о Пантеоне
    href: https://milmed.spb.ru/%d0%ba%d0%b0%d0%ba-%d1%81%d0%be%d0%b7%d0%b4%d0%b0%d0%b2%d0%b0%d0%bb%d1%81%d1%8f-%d0%bf%d0%b0%d0%bd%d1%82%d0%b5%d0%be%d0%bd-%d0%b3%d0%b5%d0%bd%d0%b8%d0%b0%d0%bb%d1%8c%d0%bd%d1%8b%d1%85-%d0%bc%d0%be/
    pometka: документ
  - summary: <b>В 1923 году, когда Ленин после инсульта потерял речь, консультировать позвали Бехтерева.</b>
    det:
    - Обширный инсульт лишил Ленина не только речи, но и способности двигаться.
    src: 'Источник: буклет «Бехтерев Владимир Михайлович: к 165-летию со дня рождения», библиотека Финансового университета — <a href="http://www.library.fa.ru/files/Bekhterev.pdf" rel="noopener" target="_blank">library.fa.ru</a>'
    otryvok: «В 1923 году Бехтерев консультирует В. И. Ленина, у которого в результате обширного инсульта утратилась способность к речи и движению.»
    stranica: Библиотека Финансового университета, буклет к 165-летию Бехтерева, с. 6
    href: http://www.library.fa.ru/files/Bekhterev.pdf
    pometka: документ
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Мозг, книги и наследники
  udary:
  - summary: <b>Где в голове живёт вкус? Это место в коре мозга первым нашёл Бехтерев.</b>
    det:
    - Вкусовой центр лежит в коре, в области покрышки — по-латыни operculum.
    - Он же выяснил, какую роль играет зрительный бугор — таламус.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «определено расположение вкусового центра у человека в коре … в области operculum; выяснена роль таламуса»
    stranica: КиберЛенинка, раздел о вкладе в нейрофизиологию
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>Немцы сами назвали участок коры мозга именем русского учёного — «полоска Бехтерева».</b>
    det:
    - Это тонкая полоска нервных волокон между первым и вторым слоями коры больших полушарий.
    - Имя ей дали супруги Оскар и Сесиль Фохт — сами исследователи мозга.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «полоска нервных волокон между I и II слоями коры больших полушарий (полоска Бехтерева - эпоним предложен О. и С. Фохтами)»
    stranica: КиберЛенинка, раздел о вкладе в нейроанатомию
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>Целую энциклопедию мозга, семь книг, Бехтерев написал за пять лет.</b>
    kadr:
      src: /muzei/izobreteniya/img/02-01-goskatalog-66150086.jpg
      width: 425
      height: 480
      alt: Обложка старой книги с крупным заглавием и фамилией автора
      data_source: https://goskatalog.ru/portal/#/collections?id=66434151
      license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ); Госкаталог музейного фонда РФ
      podpis: Книга В. М. Бехтерева «Основы учения о функциях мозга», выпуск IV, Санкт-Петербург, 1905 год.
      credit: 'Типографская печать, 1905. Хранится: Кировский областной краеведческий музей им. П. В. Алабина. Госкаталог музейного фонда РФ, рег. № 66150086.'
    det:
    - Это энциклопедия о том, что делает каждый участок мозга. Выпуски выходили в Санкт-Петербурге с 1903 по 1907 год.
    - Четвёртый выпуск 1905 года хранится в Кировском областном краеведческом музее.
    src: 'Источник: статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «Смелость учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/smelost-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>; Музей истории медицины Кировского ГМУ, страница «Владимир Михайлович Бехтерев» — <a href="https://muzeum.medkirov.ru/site/bekhterev" rel="noopener" target="_blank">muzeum.medkirov.ru</a>'
    otryvok: «Появился его энциклопедический труд «Основы учения о функциях мозга» в 7 книгах»
    stranica: 'КиберЛенинка; вторая статья: «был собран материал для одной из фундаментальных его работ - «Основы учения о функциях мозга»»'
    href: https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo
    pometka: документ
  - summary: <b>Институтом мозга, который возглавлял Бехтерев, сегодня руководит его правнук.</b>
    det:
    - Мозг изучала внучка — академик Наталья Бехтерева.
    - Правнук Святослав Медведев руководит Институтом мозга РАН, которым когда-то руководил прадед.
    src: 'Источник: статья «Смелость учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/smelost-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «Мозг изучала его внучка - Наталья Бехтерева, продолжает дело ученого его правнук - Святослав Всеволодович Медведев - директор Института мозга РАН, которым руководил его прадед»
    stranica: КиберЛенинка
    href: https://cyberleninka.ru/article/n/smelost-uchenogo
    pometka: документ
  - summary: '<b>Бехтерев утверждал: любую мысль можно увидеть и записать по работе тела. Так появилась его наука — рефлексология.</b>'
    det:
    - Три тома «Объективной психологии» вышли в 1907–1910 годах, «Общие основания рефлексологии» — в 1918-м.
    src: 'Источник: статья «К 165-летию со дня рождения и к 95-летию со дня кончины В. М. Бехтерева», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/k-165-letiyu-so-dnya-rozhdeniya-i-k-95-letiyu-so-dnya-konchiny-v-m-behtereva" rel="noopener" target="_blank">cyberleninka.ru</a>; статья «В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», научная электронная библиотека КиберЛенинка — <a href="https://cyberleninka.ru/article/n/v-m-behterev-i-xxi-vek-k-150-letiyu-so-dnya-rozhdeniya-uchenogo" rel="noopener" target="_blank">cyberleninka.ru</a>'
    otryvok: «В 1907-1910 годах Бехтерев опубликовал три тома книги «Объективная психология», в которых утверждал, что все психические процессы сопровождаются рефлекторными двигательными и вегетативными реакциями»
    stranica: 'КиберЛенинка; вторая статья: «Его итоговый труд «Общие основания рефлексологии» увидел свет в 1918 г.»'
