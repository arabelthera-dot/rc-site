return:
  q: Сколько книг в «Основах учения о функциях мозга» Бехтерева?
  a: Семь книг.
  src: '«В. М. Бехтерев и XXI век: к 150-летию со дня рождения учёного», КиберЛенинка'
audioguide:
  audioSrc: audio-guide-behterev-ru.mp3
  durationLabel: 2 минуты 46 секунд
  lead: 'Голос ведёт по залу Бехтерева: от карты мозга через игру «Подпиши мозг» и опыты с собакой Дурова до спора с Фрейдом и Психоневрологического института. Шесть остановок.'
  stops:
    - t: 0
      mark: '0:00'
      title: Кто такой Бехтерев
    - t: 25
      mark: '0:25'
      title: Карта мозга
    - t: 55
      mark: '0:55'
      title: Игра «Подпиши мозг»
    - t: 94
      mark: '1:34'
      title: Собака Дурова и гипноз залом
    - t: 118
      mark: '1:58'
      title: Спор с Фрейдом
    - t: 143
      mark: '2:23'
      title: Итог зала
  transcript:
    - 'Здравствуйте. Мы в зале Владимира Михайловича Бехтерева — невролога, психиатра и психолога. Бехтерев описал столько участков мозга, что семь из них носят его имя, и спорил с Фрейдом на равных. На обложке — седой Бехтерев с большой бородой, Петроград, тысяча девятьсот семнадцатый год. Родился он первого февраля тысяча восемьсот пятьдесят седьмого года по новому стилю, в селе Сорали Вятской губернии.'
    - 'Ниже — история учёного. Бехтерев составлял карту мозга: какой участок за что отвечает. Он вскрывал проводящие пути, искал ядра и центры и описывал их первым. Немецкий анатом Копш говорил: «Анатомию мозга прекрасно знают только двое — Бог и Бехтерев». В двадцать восемь лет, в тысяча восемьсот восемьдесят пятом году, Бехтерев описал ядро в стволе мозга, которое держит нас в равновесии. В учебниках оно так и называется — ядро Бехтерева.'
    - 'Теперь игра «Подпиши мозг по Бехтереву». Выберите подпись под схемой и нажмите на её место. Таламус — в глубине мозга: какую роль играет этот зрительный бугор, выяснил Бехтерев. Вкусовой центр — в коре сбоку, его он нашёл первым. Полоска Бехтерева лежит между первым и вторым слоями коры; имя ей дали немецкие учёные, супруги Оскар и Сесиль Фохт. Ядро равновесия — в стволе мозга. А на позвоночнике — болезнь Бехтерева: позвонки срастаются, спина каменеет. Он описал её в тысяча восемьсот девяносто втором году. Все пять подписей на своих местах — плюс двадцать баллов.'
    - 'Дальше — факты, которые трудно забыть. Академик посадил у себя дома на диван дрессированную собаку Дурова и проверял, умеет ли она читать мысли. Опытов мысленного внушения собакам было тысяча двести семьдесят восемь, удачными признали шестьсот девяносто шесть. А алкоголиков Бехтерев гипнотизировал не по одному, а сразу целым залом: из шестисот пациентов у восьмидесяти пяти процентов тяга надолго ушла.'
    - 'Теперь о споре с Фрейдом. Бехтерев и Фрейд учились у одного учителя: в Париже, в клинике Жана Шарко, Бехтерев освоил технику гипноза. В книге тысяча девятьсот одиннадцатого года он напечатал, что психоанализ «далеко уступает» даже обычному внушению. А ещё Бехтерев предложил собирать мозг гениев в «Пантеон мозга». В итоге его собственный мозг остался в институте.'
    - 'Итог зала. Целую энциклопедию мозга, семь книг, Бехтерев написал за пять лет. В тысяча девятьсот седьмом году он открыл в Петербурге Психоневрологический институт. А Институтом мозга, который возглавлял Бехтерев, сегодня руководит его правнук Святослав Медведев. Ниже — викторина из пяти вопросов и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
