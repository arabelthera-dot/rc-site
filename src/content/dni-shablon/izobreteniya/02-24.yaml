igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чьё это число
  pravilo_ru: 'Что сделать сейчас: выбери число и нажми на то, что оно значит.'
  kak_igrat:
    zachem: 'У каждого числа из истории станции имени Коминтерна — своё место: киловатты и километры.'
    shagi:
    - Выбери число — кнопка загорится золотом.
    - Нажми на то, что оно значит. Верный выбор загорится зелёным.
    - Расставь все четыре числа — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все четыре числа на месте — +20 баллов.
  dannye:
    mesta:
    - kod: moskva
      nazvanie: Столько киловатт давала станция в Москве
      verno_ru: 'В Москве — 12 киловатт: больше Нью-Йорка, Парижа и Берлина, вместе взятых'
    - kod: nyu-jork
      nazvanie: Столько киловатт давала станция в Нью-Йорке
      verno_ru: В Нью-Йорке — 1,5 киловатта, в восемь раз меньше Москвы
    - kod: arko
      nazvanie: Лампы на столько киловатт увидел граф Арко
      verno_ru: 'Граф Арко уверял: ламп мощнее 6 киловатт не бывает. Увидел наши на 25 — и передумал'
    - kod: rekord
      nazvanie: За столько километров узнавали голоса
      verno_ru: Голоса узнавали за 1600 километров — мировой рекорд дальности переговоров
    podpisi:
    - kod: n12
      tekst: 12 кВт
      mesto: moskva
      mimo_ru: 12 киловатт — столько давала станция в Москве.
    - kod: n1-5
      tekst: 1,5 кВт
      mesto: nyu-jork
      mimo_ru: 1,5 киловатта — столько давала станция в Нью-Йорке.
    - kod: n25
      tekst: 25 кВт
      mesto: arko
      mimo_ru: 25 киловатт — такие лампы увидел граф Арко.
    - kod: n1600
      tekst: 1600 км
      mesto: rekord
      mimo_ru: 1600 километров — рекорд дальности переговоров.
    vyberi_ru: Сначала выбери число, потом его место.
    mimo_ru: Не то место — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все числа на месте — 12 киловатт Москвы, 1,5 Нью-Йорка, лампы на 25 и рекорд в 1600 километров.
