audioguide:
  audioSrc: audio-guide-komintern-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу станции имени Коминтерна: от медной лампы с водой через рояль во дворе к удивлению «Телефункена».'
  stops:
  - t: 0
    mark: 0:00
    title: Сильнее трёх столиц
  - t: 35
    mark: 0:35
    title: Медь и вода
  - t: 70
    mark: '1:10'
    title: Рояль во дворе
  - t: 105
    mark: '1:45'
    title: «Это невозможно»
  transcript:
  - Одна московская станция «Коминтерн» била мощнее Нью-Йорка, Парижа и Берлина, вместе взятых. В Нью-Йорке — полтора киловатта, в Париже и под Берлином — по пять. В Москве — двенадцать.
  - Редких металлов для ламп в Нижнем не было — анод сделали из меди и остудили водой. Ленин дал на станцию два с половиной месяца — и дальность в две тысячи вёрст.
  - Студия не успела — рояль вынесли во двор и положили на крышку телефонную трубку. По Москве ездил грузовик с громкоговорителем — радио слушали прямо на улице.
  - 'Под Берлином инженеры «Телефункена» услышали «Говорит Москва!» и сказали: «Это невозможно». Немецкий «Телефункен» заказал наши лампы — чтобы разобрать и скопировать у себя.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
