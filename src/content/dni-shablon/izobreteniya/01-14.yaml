quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — 41 узел; 2 — расплавом свинца и висмута; 3 — при 123 °C; 4 — всплывающая спасательная рубка на весь экипаж; 5 — 22 часа."
  ball: 10
  voprosy:
    - q: Какую скорость под водой давала «Лира»?
      o:
        - 25 узлов
        - 41 узел
        - 60 узлов
      a: 1
      e: 41 узел — около 76 километров в час. За скорость проект 705 занесён в Книгу рекордов Гиннесса.
    - q: Чем охлаждали реактор «Лиры»?
      o:
        - Обычной водой
        - Расплавом свинца и висмута
        - Воздухом
      a: 1
      e: Расплавом свинца и висмута — поэтому лодка разгонялась до полного хода за минуту.
    - q: При какой температуре застывает этот сплав?
      o:
        - При 0 °C
        - При 123 °C
        - При 1000 °C
      a: 1
      e: При 123 °C. В базе реактор держали горячим, иначе металл каменел в трубах.
    - q: Что впервые в мире появилось на «Лире»?
      o:
        - Всплывающая рубка для спасения всего экипажа
        - Перископ
        - Торпедный аппарат
      a: 0
      e: "Всплывающая спасательная рубка: в ней весь экипаж мог подняться с предельной глубины."
    - q: Сколько часов «Лира» держалась в хвосте атомохода НАТО?
      o:
        - 2 часа
        - 22 часа
        - 220 часов
      a: 1
      e: "22 часа по сборнику «Подводные лодки: история развития» — и отстала только по приказу с берега."
