  intro: Та же история коротким роликом — от бюро «Малахит» и смены из восьми человек до 22 часов в хвосте атомохода НАТО.
  poster: video/day-14jan-lira-poster.jpg?v=1
  mp4: video/day-14jan-lira.mp4?v=1
  note: "Кадры ролика — подлинные (Госкаталог музейного фонда РФ): «Лира» у причала, фото из бюро «Малахит», 1970–1989 (Центральный военно-морской музей, № 24243467); лодка проекта 705 на карманном календаре 1999 года (Северный морской музей, № 38736860); модели лодки проекта 705 — Центрального военно-морского музея (№ 10403812), А. Т. Богданова, 2000 (Музей Мирового океана, № 3719439) и 2005 (Военно-морской музей Северного флота, № 46688599); капитан 1-го ранга А. С. Пушкин, командир К-64 (Саратовский музей боевой и трудовой славы, № 36317246); «Лира» в шторм, живопись А. Ю. Заикина, календарь 1997 (Центральный военно-морской музей, № 23059032). Схема погони — кадр игры «Перехват» с этой страницы. Авторы снимков не указаны. Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История изобретения · 13 ударов
  h2: Подводный истребитель
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: "В 1959 году ленинградский инженер А. Б. Петров предложил подводный истребитель: маленький, автоматический и быстрее 40 узлов."
      det:
        - По замыслу, лодка водоизмещением около 1500 тонн за короткое время выходит в нужную точку океана, атакует подводного или надводного противника, а заметив торпедную атаку — даёт залп и уходит от торпед.
        - Главным конструктором стал Михаил Русанов, проект вело СКБ-143 — сегодня Санкт-Петербургское морское бюро машиностроения «Малахит».
      src: "Источники: сборник «Подводные лодки: история развития» (сост. В. П. Власов), «Атомные подводные лодки проекта 705»; «Адмиралтейские верфи», «Проект 705, „Лира“»."
    - summary: На других атомных лодках служили 80–100 человек. В задание на «Лиру» записали шестнадцать — и только офицеров.
      det:
        - "Экипаж сократили автоматикой. В ходе проектирования он всё же вырос до 31 человека: шесть техников-мичманов и один матрос, который был коком и заодно дневальным. Справочная таблица сборника «Подводные лодки: история развития» даёт экипаж в 32 человека."
      src: "Источники: «Страна Росатом», «Сотворение „Лиры“», 16.12.2021; сборник «Подводные лодки: история развития»."
    - summary: "В отсеках вахту не несли: система «Аккорд» сводила всё на центральный пост. Боевая смена — восемь человек."
      det:
        - Боевая информационно-управляющая система «Аккорд» следила за обстановкой и реактором, гидролокатор и оружие работали самостоятельно, механизирован был даже камбуз. Центральный пост был набит индикаторами от палубы до обшивки. Моряки прозвали эти лодки «автоматами».
      src: "Источники: «Страна Росатом», 16.12.2021; «Адмиралтейские верфи»; сборник «Подводные лодки: история развития»."
    - summary: "Корпус сварили из титанового сплава ЦНИИ «Прометей»: он легче стали, прочнее её и почти не магнитится."
      det:
        - "Сплав разработали в ЦНИИ «Прометей» под руководством И. В. Горынина. Титан оказался капризным: его трудно варить и обрабатывать. На головной лодке потом нашли трещины сварного корпуса."
      src: "Источники: «Адмиралтейские верфи»; Межрегиональное общественное движение ветеранов атомной энергетики и промышленности, «Чудо инженерии — подлодки проекта 705 „Лира“»; сборник «Подводные лодки: история развития»."
    - summary: Реактор охлаждала не вода, а расплав свинца и висмута. Поэтому «Лира» разгонялась до полного хода за минуту.
      find: true
      tag: Находка дня
      det:
        - "Лодкам с водо-водяными реакторами перед полным ходом нужен особый переход установки на повышенные параметры. «Лире» он был не нужен: свинцово-висмутовая установка давала полный ход в течение минуты, с почти «самолётным» разгоном."
        - Жидкий металл в реакторе до этого пробовали на одной опытной лодке проекта 645, а «Лиры» строили серией.
        - "Попробуй сам в модели ниже: зайти в хвост лодке противника."
      src: "Источники: сборник «Подводные лодки: история развития»; «Страна Росатом», 16.12.2021; «Адмиралтейские верфи»."
    - summary: Под водой «Лира» давала 41 узел — около 76 километров в час.
      det:
        - "Полная подводная скорость по справочной таблице — 41 узел, «Страна Росатом» пишет «более 40 узлов». 76 километров в час — наш перевод: узел — это 1,852 километра в час. Скорость лодки была сравнима со скоростью противолодочных торпед."
      src: "Источники: сборник «Подводные лодки: история развития»; «Адмиралтейские верфи»; «Страна Росатом», 16.12.2021."
    - summary: На полном ходу она разворачивалась на 180 градусов и через 42 секунды уже шла обратно.
      det:
        - "Контр-адмирал А. С. Богатырев, командовавший К-123, вспоминал, что лодка разворачивалась «на пятачке». Командиры А. Ч. Аббасов и А. Ф. Загрядский описывали манёвр: разгон с погружением сбивал со следа противника, который слушал «Лиру», и она «по-истребительному» заходила ему в хвост."
      src: "Источники: сборник «Подводные лодки: история развития»; «Страна Росатом», 16.12.2021; «Адмиралтейские верфи»."
    - summary: В начале 80-х «Лира» 22 часа держалась в хвосте атомохода НАТО. Сбросить её он так и не смог.
      det:
        - Лодка шла в кормовом секторе чужого атомохода в Северной Атлантике. Командир противника отчаянно пытался оторваться, но слежение прекратили только по приказу с берега. «Страна Росатом» называет срок в 20 часов, сборник — 22 часа.
      src: "Источники: сборник «Подводные лодки: история развития»; «Страна Росатом», 16.12.2021."
    - summary: "Впервые в мире на подлодке стояла всплывающая рубка: в ней с предельной глубины мог спастись весь экипаж."
      det:
        - Обитаемый отсек на лодке был один, и камера стояла прямо над ним. Она всплывала даже при большом крене и дифференте и спасала экипаж «сухим способом», без выхода в воду.
      src: "Источники: «Адмиралтейские верфи»; сборник «Подводные лодки: история развития»; МОД ветеранов атомной энергетики; «Страна Росатом», 16.12.2021."
    - summary: Расплав свинца и висмута застывает при 123 °C. В базе реактор держали горячим, иначе металл каменел в трубах.
      det:
        - Это главная цена скорости. Первый контур нужно было постоянно держать горячим, следить за сплавом и регулярно очищать его от окислов. С заглушённым реактором лодке в базе требовался внешний источник энергии. Идею второго, «берегового» экипажа на практике так и не осуществили.
      src: "Источники: «Атомный вестник», Г. Тошинский, «Свинец-висмут: путь к „железу“», 03.08.2022 (температура плавления сплава — 123 °С); «Страна Росатом», 16.12.2021; сборник «Подводные лодки: история развития»."
    - summary: "Головная К-64 боевой так и не стала: в 1972 году в отсек вытекли сотни литров сплава, и лодку списали."
      det:
        - К-64 заложили 2 июня 1968 года в Ленинграде, на том же стапеле, где строили «Аврору», и спустили на воду 22 апреля 1969 года. В строй она вступила 31 декабря 1971 года. В феврале 1972-го вышла из строя ещё одна петля реактора, 700–800 литров сплава попали в отсек. Лодку решили не восстанавливать. Первый командир, капитан 1-го ранга А. С. Пушкин, позже получил орден Ленина.
        - "Конструкторы учли урок: у следующих лодок реакторный отсек удлинили на 1,2 метра и переделали парогенератор."
      src: "Источники: «Страна Росатом», 16.12.2021; сборник «Подводные лодки: история развития»; «Адмиралтейские верфи»."
    - summary: За двадцать с лишним лет службы на «Лирах» никто не погиб в борьбе за живучесть, ни одна лодка не потеряна.
      det:
        - Всего построили семь лодок проектов 705 и 705К. Командир К-123 капитан 2-го ранга А. Ч. Аббасов за освоение принципиально нового корабля в 1984 году стал Героем Советского Союза.
      src: "Источники: «Страна Росатом», 16.12.2021; сборник «Подводные лодки: история развития»; МОД ветеранов атомной энергетики."
    - summary: За скорость проект 705 занесли в Книгу рекордов Гиннесса.
      det:
        - Об этом пишет «Страна Росатом». Рубку «лимузинного типа», плавно переходящую в корпус, отработали гидродинамики. Обводы почти не отражали сигналы гидролокаторов, и атаковать «Лиру» с активной гидроакустикой было трудно.
      src: "Источники: «Страна Росатом», 16.12.2021; сборник «Подводные лодки: история развития»."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о «Лире»
    h2: Жидкий металл, титан и автоматы
    udary:
      - summary: <b>Две «Лиры» с разными реакторами.</b>
        det:
          - "Для одной лодки сделали две атомные установки: ленинградскую с тремя петлями и северодвинскую с двумя — отсюда проекты 705 и 705К."
          - "Основной вариант — установку ОК-550 с тремя петлями — разработало ОКБ завода № 92 (с 1967 года — ОКБМ), лодки с ней строил ленинградский завод «Судомех».</p><p>Физико-энергетический институт в Обнинске и ОКБ «Гидропресс» по своей инициативе предложили другую схему — в блочном исполнении и с двумя петлями вместо трёх: она упрощала установку и сокращала монтаж на стапеле. В октябре 1962 года её узаконили под индексом БМ-40А, проект лодки под неё получил номер 705К, строить его поручили Северодвинску. Мощность обоих реакторов была одинаковой — 155 МВт."
        src: "Источник: «Страна Росатом», «Сотворение „Лиры“: история создания первого атомного подводного истребителя», 16.12.2021 — https://strana-rosatom.ru/2021/12/16/sotvorenie-liry-istoriya-sozdaniya-p/"
        otryvok: «За основу был принят проект ОК‑550 трехпетлевой ППУ разработки ОКБ завода № 92 Миноборонпрома (с 1967 года — ОКБМ)… Позже с инициативной разработкой собственного варианта ППУ… выступил авторский коллектив ФЭИ и ОКБ „Гидропресс“, который предложил другое схемно-конструктивное решение — в блочном исполнении и с симметричной схемой (две петли вместо трех)… Решением комиссии ВПК в октябре 1962 года этот вариант был узаконен под индексом БМ‑40А, а проекту лодки для него присвоен номер 705К. Строительство этой АПЛ поручили Севмашпредприятию в Северодвинске.»
        stranica: "Александр Кузнецов, «Сотворение „Лиры“: история создания первого атомного подводного истребителя», «Страна Росатом», 16.12.2021"
        href: https://strana-rosatom.ru/2021/12/16/sotvorenie-liry-istoriya-sozdaniya-p/
        pometka: документ
      - summary: <b>Проект не подписал энергетик собственного бюро.</b>
        det:
          - Главный конструктор по энергетике СКБ-143 Павел Дегтярев отказался ставить подпись под техническим проектом «Лиры».
          - "Против жидкого металла на подводных лодках выступал целый ряд специалистов. Начальник ОКБМ Игорь Африкантов, чьё бюро проектировало установку для 705К, написал в ЦК КПСС, что её нужно переделать.</p><p>Спорили не о самой идее, а о сроках: из-за недоработок оснащать корабли такими установками считали преждевременным. Куратор проекта академик Анатолий Александров был сторонником жидкого металла, и стройку продолжили."
        src: "Источник: «Страна Росатом», «Сотворение „Лиры“: история создания первого атомного подводного истребителя», 16.12.2021 — https://strana-rosatom.ru/2021/12/16/sotvorenie-liry-istoriya-sozdaniya-p/"
        otryvok: «Главный конструктор по энергетике СКБ № 143 Павел Дегтярев отказался подписать технический проект лодки проекта 705, а начальник ОКБМ, проектанта ППУ для 705К, Игорь Африкантов выразил в ЦК КПСС мнение о необходимости переделать установку… из-за ряда недоработок и нерешенных научно-технических проблем оснащать корабли такими установками более чем преждевременно.»
        stranica: "Александр Кузнецов, «Сотворение „Лиры“: история создания первого атомного подводного истребителя», «Страна Росатом», 16.12.2021"
        href: https://strana-rosatom.ru/2021/12/16/sotvorenie-liry-istoriya-sozdaniya-p/
        pometka: документ
      - summary: <b>Стреляла с любой глубины.</b>
        det:
          - Впервые на подводной лодке поставили пневмогидравлические торпедные аппараты — стрелять можно было от перископной глубины до предельной.
          - Это одно из нескольких первенств «Лиры», которые называет завод-строитель. Другие — всплывающая спасательная камера на весь экипаж и система «Аккорд», которая свела управление лодкой на центральный пост.
        src: "Источник: АО «Адмиралтейские верфи», «Проект 705, „Лира“» — http://admship.ru/production/archive/spravochnik-proektov-podvodnykh-lodok-postroennykh-na-admiralteyskikh-verfyakh/proekt-705-lira/"
        otryvok: «…уникальная боевая информационно-управляющая система „Аккорд“, позволившая сосредоточить все управление АПЛ на центральном посту. Впервые на ПЛ применили пневмогидравлические торпедные аппараты с глубиной стрельбы от перископной до предельной.»
        stranica: АО «Адмиралтейские верфи», «Проект 705, „Лира“» (справочник проектов подводных лодок)
        href: http://admship.ru/production/archive/spravochnik-proektov-podvodnykh-lodok-postroennykh-na-admiralteyskikh-verfyakh/proekt-705-lira/
        pometka: документ
      - summary: <b>Моряки звали их «автоматами».</b>
        det:
          - На лодку с экипажем в 31 человек пришёлся всего один матрос — он был и коком, и дневальным-уборщиком.
          - "Остальные — офицеры и шесть техников-мичманов. Вахту в отсеках не несли: вся информация стекалась на центральный пост, набитый индикаторами от палубы до обшивки, а механизирован был даже камбуз. Отсюда и прозвище."
        src: "Источник: «Страна Росатом», «Сотворение „Лиры“: история создания первого атомного подводного истребителя», 16.12.2021 — https://strana-rosatom.ru/2021/12/16/sotvorenie-liry-istoriya-sozdaniya-p/"
        otryvok: «…численность будущего экипажа выросла до 31 человека, включая шесть техников-мичманов и одного матроса, на которого возлагалась роль кока и по совместительству дневального-уборщика… Экипаж субмарины не нес вахту в отсеках — вся информация стекалась на центральный пост, набитый индикаторами от палубы до обшивки… Моряки прозвали эти лодки „автоматами“.»
        stranica: "Александр Кузнецов, «Сотворение „Лиры“: история создания первого атомного подводного истребителя», «Страна Росатом», 16.12.2021"
        href: https://strana-rosatom.ru/2021/12/16/sotvorenie-liry-istoriya-sozdaniya-p/
        pometka: документ
      - summary: <b>Реактор «Лиры» доработал до конца на суше.</b>
        det:
          - После аварии на головной К-64 построили наземный стенд КМ-1 с той же установкой — и он проработал до 1987 года без единой течи.
          - "Стенд с установкой ОК-550 начали сооружать в НИТИ ещё в 1968 году, после неудач К-64 его достройку ускорили. На нём подтвердили, что основные конструкторские решения верны, и началось серийное строительство.</p><p>Стенд работал до полной выработки энергозапаса: сплав в первом контуре оставался в норме, тепловыделяющие элементы активной зоны — герметичными."
        src: "Источник: «Страна Росатом», «Сотворение „Лиры“: история создания первого атомного подводного истребителя», 16.12.2021 — https://strana-rosatom.ru/2021/12/16/sotvorenie-liry-istoriya-sozdaniya-p/"
        otryvok: «Решено было также форсировать начатое в 1968 году сооружение в НИТИ натурного наземного стенда КМ‑1 с установкой ОК‑550… Стенд КМ‑1 эксплуатировался до 1987 года с нормальным состоянием сплава в первом контуре и с сохранением герметичности твэлов активной зоны вплоть до полной выработки энергозапаса.»
        stranica: "Александр Кузнецов, «Сотворение „Лиры“: история создания первого атомного подводного истребителя», «Страна Росатом», 16.12.2021"
        href: https://strana-rosatom.ru/2021/12/16/sotvorenie-liry-istoriya-sozdaniya-p/
        pometka: документ
      - summary: <b>Первую «Лиру» спускали на воду ночью, под прожекторами, — но сохранить тайну не удалось.</b>
        det:
          - По соображениям секретности К-64 спустили 22 апреля 1969 года ночью, под прожекторами, «интересные» места корпуса закрыли маскировкой.
          - Позже, когда К-64 готовили к отправке на Север, секретность дала сбой — на другом берегу Невы собралась толпа, и «вражеские голоса» на следующий день объявили, что русские построили лодку нового типа.
        src: "Источник: В. Щербаков, «Как Пентагон охотился за секретами АПЛ проекта 705», «Независимое военное обозрение» («Независимая газета»), 30.11.2018 — https://nvo.ng.ru/spforces/2018-11-30/8_1024_secret.html"
        otryvok: "«По соображениям секретности церемония происходила ночью. Замаскированное в особо „интересных“ местах темное тело корабля освещалось прожекторами» — и отдельно, о подготовке К-64 к транспортировке на Север: «на противоположном берегу Невы собралась большая толпа, а „вражеские голоса“ на следующий же день известили мир о том, что русские построили принципиально новую подлодку.»"
        stranica: В. Щербаков, «Как Пентагон охотился за секретами АПЛ проекта 705», «Независимое военное обозрение», 30.11.2018
        href: https://nvo.ng.ru/spforces/2018-11-30/8_1024_secret.html
        pometka: документ
      - summary: <b>Американцы сначала приняли «Лиру» за дизельную лодку.</b>
        det:
          - "Разведка США увидела новую лодку у ленинградского «Судомеха» в 1969 году и записала её в дизельные — продолжение «Фокстрота». Выдали её «необычно сильно блестящие» секции корпуса: так американцы вышли на титан. Часть аналитиков даже решила, что корпус для обмана просто покрасили алюминиевой краской."
        src: "Источники: «Независимое военное обозрение», 30.11.2018 — https://nvo.ng.ru/spforces/2018-11-30/8_1024_secret.html ; ИноСМИ (МИА «Россия сегодня»), перевод The National Interest, 06.01.2024 — https://inosmi.ru/20240106/podlodka-267297219.html"
        otryvok: «…первоначально классифицировали новую субмарину как новый, следующий за „Фокстротом“ тип дизель-электрических подводных лодок… аналитики обратили внимание на совершенно новые предметы – „необычно сильно блестящие“ секции прочного корпуса около места сборки „Альфы“.»
        stranica: В. Щербаков, «Как Пентагон охотился за секретами АПЛ проекта 705», «Независимое военное обозрение», 30.11.2018
        href: https://nvo.ng.ru/spforces/2018-11-30/8_1024_secret.html
        pometka: два источника
      - summary: <b>В США не верили, что СССР умеет варить титановые корпуса.</b>
        det:
          - "Аналитик военно-морской разведки Герберт Лорд первым понял, что русские строят титановую лодку-автомат с крошечным экипажем. Его подняли на смех: варить крупные титановые секции якобы невозможно. Почти девять лет он доказывал своё, так и не убедил адмиралов, уволился и вскоре умер."
        src: "Источник: «Независимое военное обозрение», 30.11.2018 — https://nvo.ng.ru/spforces/2018-11-30/8_1024_secret.html"
        otryvok: «…одни ему поверили…, а другие – подняли на смех, заявив, что невозможно варить крупные титановые секции в условиях современных верфей… следующие без малого девять лет (!) своей жизни и карьеры разведчика он посвятил „охоте за русской титановой подлодкой“… был вынужден уволиться, а вскоре он умер.»
        stranica: В. Щербаков, «Как Пентагон охотился за секретами АПЛ проекта 705», «Независимое военное обозрение», 30.11.2018
        href: https://nvo.ng.ru/spforces/2018-11-30/8_1024_secret.html
        pometka: документ
      - summary: <b>Из-за «Лиры» американцам пришлось делать новые торпеды.</b>
        det:
          - Разведка США пришла к выводу, что лодка идёт под водой быстрее 40 узлов и уходит на глубины, где американское противолодочное оружие не действует. В январе 1979 года командование военно-морских систем ВМС США написало, что сведения об «Альфе» сэкономили флоту 325 млн долларов на разработке новых торпед.
        src: "Источник: В. Щербаков, «Охота на „Лиру“: развязка», «Независимое военное обозрение», 27.12.2018 — https://nvo.ng.ru/spforces/2018-12-27/8_1028_lira.html"
        otryvok: «…позволяет новой субмарине развивать скорость подводного хода более 40 узлов; – данные высокотехнологичные ПЛ способны действовать на глубинах, находящихся вне зоны эффективного применения имеющихся образцов противолодочного оружия ВМС США… 19 января 1979 года глава Командования военно-морских систем ВМС США направил на имя директора УВМР служебную записку… позволили ВМС сэкономить 325 млн долл. на разработке новых образцов торпедного оружия.»
        stranica: "В. Щербаков, «Охота на „Лиру“: развязка», «Независимое военное обозрение», 27.12.2018"
        href: https://nvo.ng.ru/spforces/2018-12-27/8_1028_lira.html
        pometka: документ
      - summary: <b>Сварщики «Лиры» работали в скафандрах, вслепую — по зеркалу.</b>
        det:
          - Титан при сварке нельзя пускать на воздух, поэтому цеха герметизировали и заполняли аргоном, а сварщикам по шлангу подавали кислород — в костюмах вроде космических. На «Севмаше» мастера гнули электроды и смотрели в зеркала, чтобы вести шов среди трубопроводов и кабелей.
        src: "Источники: «Российская газета», «Подводный истребитель: как СССР построил „убийцу подлодок“», 22.04.2019 — https://rg.ru/2019/04/22/podvodnyj-istrebitel-kak-sssr-postroil-ubijcu-podlodok.html ; ИноСМИ, 06.01.2024 — https://inosmi.ru/20240106/podlodka-267297219.html. Про скафандры и аргон пишет американский журнал; ИноСМИ — перевод, отдельной русской сверки нет."
        otryvok: «Виртуозные сварщики „Севмаша“ гнули электроды и использовали зеркала, чтобы вести шов в мешанине трубопроводов и кабелей.»
        stranica: "«Подводный истребитель: как СССР построил „убийцу подлодок“», «Российская газета», 22.04.2019"
        href: https://rg.ru/2019/04/22/podvodnyj-istrebitel-kak-sssr-postroil-ubijcu-podlodok.html
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Тишина, медкомиссия и чёрный ящик
    udary:
      - summary: "<b>Первое погружение не удалось: лодка не хотела уходить под воду.</b>"
        det:
          - Цистерны заполнились, а верх рубки К-64 всё равно торчал над водой, и даже на ходу загнать её под воду не вышло. Лодка вернулась в базу, и в места, которые указали конструкторы, уложили чугунные чушки. В следующий выход она погрузилась без труда.
        src: "Источник: «Петербургский дневник», «Неуязвимые „Лиры“ из Ленинграда: как строили титановые подлодки-автоматы», 19.04.2016 — https://spbdnevnik.ru/news/2016-04-19/neuyazvimyey--liry--iz-leningrada"
        otryvok: «Лодка погружается, но верх рубки остается торчать на поверхности. Строптивицу даже на ходу загнать под воду не получается… Пришлось возвратиться на базу и принять твердый балласт из чугунных чушек, разместив их в местах, указанных конструкторами». …Во время следующего выхода в море лодка без труда ушла под воду»
        stranica: "«Неуязвимые „Лиры“ из Ленинграда: как строили титановые подлодки-автоматы», «Петербургский дневник», 2016"
        href: https://spbdnevnik.ru/news/2016-04-19/neuyazvimyey--liry--iz-leningrada
        pometka: документ
      - summary: <b>Когда «Лира» впервые дала ход, всех поразила тишина.</b>
        det:
          - "Первый командир К-64 вспоминал: лодка вздрогнула, двинулась — и вокруг стихло. После шума, суеты и команд перед отходом эта тишина казалась внезапной и торжественной."
        src: "Источник: «Петербургский дневник», 19.04.2016 — https://spbdnevnik.ru/news/2016-04-19/neuyazvimyey--liry--iz-leningrada"
        otryvok: «Первое впечатление, которое я получил при даче хода, незабываемо… Лодка вздрогнула, двинулась и… тишина. Тишина эта после обычного предотходного гвалта, шума, команд поражала своей внезапностью и торжественностью».
        stranica: "«Неуязвимые „Лиры“ из Ленинграда: как строили титановые подлодки-автоматы», «Петербургский дневник», 2016"
        href: https://spbdnevnik.ru/news/2016-04-19/neuyazvimyey--liry--iz-leningrada
        pometka: документ
      - summary: <b>Экипаж «Лиры» отбирали по медкомиссии, как космонавтов.</b>
        det:
          - "Командир «Лиры» Геннадий Баранов вспоминал: врачи проверяли подводников почти по программе космонавтов, психологическая подготовка была очень строгой. На борту он почувствовал себя «как у капитана Немо»: таких кораблей тогда ещё не было."
        src: "Источник: телеканал «Звезда», «Командир уникальной АПЛ „Лира“ рассказал о „космической“ подготовке для подводников», 19.12.2021 — https://tvzvezda.ru/news/20211219815-TELBw.html"
        otryvok: «Впечатления были фантастические, как будто я попал к капитану Немо жюльверновскому. Таких кораблей в те времена еще не было… нас проверяли практически по программе космонавтов по медицинскому допуску… С точки зрения психологической подготовки все было очень серьезно».
        stranica: «Командир уникальной АПЛ „Лира“ рассказал о „космической“ подготовке для подводников», телеканал «Звезда», 19.12.2021
        href: https://tvzvezda.ru/news/20211219815-TELBw.html
        pometka: документ
      - summary: <b>На «Лире» был свой «чёрный ящик», а камеры круглые сутки снимали отсеки.</b>
        det:
          - Почти весь экипаж сидел на центральном посту, а остальные отсеки видел через камеры. Всё, что происходило на корабле, писал закрытый от вмешательства магнитофон «Снегирь» — подобие самолётного «чёрного ящика».
        src: "Источник: телеканал «Звезда», «Автоматика, камеры и только офицеры: командир АПЛ „Лира“ рассказал об уникальности службы на подлодке», 19.12.2021 — https://tvzvezda.ru/news/20211219931-7QtEJ.html"
        otryvok: «Присутствовала система видеонаблюдения, круглосуточно снимающая все отсеки»… «Система „Снегирь“ — подобие черного ящика. Это специальный магнитофон, который был закрыт от внешнего вмешательства».
        stranica: "«Автоматика, камеры и только офицеры: командир АПЛ „Лира“ рассказал об уникальности службы на подлодке», телеканал «Звезда», 19.12.2021"
        href: https://tvzvezda.ru/news/20211219931-7QtEJ.html
        pometka: документ
      - summary: <b>Одна «Лира» простояла на стапеле почти десять лет, а седьмую разобрали недостроенной.</b>
        det:
          - К-432 заложили в Северодвинске 12 ноября 1967 года, а на воду спустили только 3 ноября 1977-го. Соседняя К-123, заложенная там же в декабре 1967-го, ждала спуска больше восьми лет.
          - "Виновата авария первой лодки: в 1972 году работы по уже заложенным «Лирам» остановили, пока не найдут причину. Программу не закрыли, но седьмую лодку серии так и не достроили — её разобрали прямо на стапеле."
        src: 'Источник: сборник «Подводные лодки: история развития» (сост. В. П. Власов), «Атомные подводные лодки проекта 705 („Альфа“)», электронная библиотека Свердловской областной научной библиотеки им. В. Г. Белинского — <a href="https://book.uraic.ru/elib/pl/lodki/705.htm" rel="noopener">book.uraic.ru/elib/pl/lodki/705.htm</a>.'
        otryvok: "«Ранее, в 1972 г. было решение о приостановке дальнейших работ по заложенным АПЛ проекта 705 до выяснения и устранения причин вывода из строя первого контура реактора… Последний, седьмой корабль в серии, был разобран на стапеле.» — таблица: «„К-432“ СМП 12.11.1967 г. 03.11.1977 г. Январь 1979 г.»; «„К-123“ СМП 22.12.1967 г. 04.04.1976 г. Ноябрь 1977 г.»"
        stranica: "В. П. Власов (сост.), «Подводные лодки: история развития», «Атомные подводные лодки проекта 705 („Альфа“)», СОУНБ им. Белинского"
        href: https://book.uraic.ru/elib/pl/lodki/705.htm
        pometka: документ
