igra:
  imya: perehvat
  css:
    - igra-pogonya
pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: <b>Граница первенства:</b> самые быстрые серийные подводные лодки в мире — 41 узел под водой, полный ход за минуту, разворот на 180° за 42 секунды; за скорость проект занесён в Книгу рекордов Гиннесса. Ещё одно мировое первенство — всплывающая рубка для спасения всего экипажа с предельной глубины. Доказательство — построенные лодки (семь в строю флота) и документы строителей.
  net: <b>Чего здесь нет:</b> слово «серийные» важно. Рекорд скорости одиночной опытной лодки К-162 — другой день нашего календаря, 24 января.
  kolonki:
    - Лодка
    - Что
    - Когда
  stroki:
    - - К-64, головная, проект 705
      - Вступила в строй Северного флота
      - 31.12.1971
    - - К-123, проект 705К
      - Завершила заводские и государственные испытания
