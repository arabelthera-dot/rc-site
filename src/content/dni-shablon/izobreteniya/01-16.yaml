return:
  q: Почему «Союз-5» успел захватить для Шаталова более свежие письма и газеты, чем были на «Союзе-4»?
  a: «Союз-5» стартовал на сутки позже «Союза-4» — и забрал с Земли почту, вышедшую уже после старта первого корабля.
  src: РГАНТД; «Российская газета», интервью Б. В. Волынова
audioguide:
  audioSrc: audio-guide-soyuz45-ru.mp3
  durationLabel: 2 минуты 37 секунд
  lead: "Голос ведёт по залу «Союза-4» и «Союза-5»: от старта в одиночку до перехода через открытый космос и аварийной посадки Волынова. Шесть остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Амур и Байкалы
    - t: 29
      mark: 0:29
      title: Стыковка над Африкой
    - t: 53
      mark: 0:53
      title: Люка не было
    - t: 78
      mark: 1:18
      title: Тридцать семь минут снаружи
    - t: 101
      mark: 1:41
      title: Космический почтальон
    - t: 124
      mark: 2:04
      title: Кувырок в плазме
  transcript:
    - "<p>«14 и 15 января 1969 года с Байконура стартовали «Союз-4» и «Союз-5» — Шаталов в одиночку, следом трое: Волынов, Елисеев, Хрунов».</p>"
    - "<p>«16 января, 08:20 по Гринвичу: корабли состыковались вручную — первая в мире стыковка двух пилотируемых кораблей».</p>"
    - <p>«Переходного люка между кораблями ещё не придумали — Елисеев и Хрунов перебрались через открытый космос в скафандрах «Ястреб»».</p>
    - <p>«37 минут — мировой рекорд пребывания двух космонавтов вне корабля; 4 часа 33 минуты — рекорд в состыкованном виде».</p>
    - <p>«Хрунов передал Шаталову письма и газеты — первый в мире космический почтальон».</p>
    - "<p>«При посадке 18 января «Союз-5» едва не погиб: приборный отсек не отделился, корабль кувыркался в плазме — но Волынов выжил».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
