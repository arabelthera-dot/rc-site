quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — переходного люка не было; 2 — 37 минут; 3 — Хрунов; 4 — приборный агрегат не отделился вовремя; 5 — переход космонавта с лунного корабля в орбитальный через открытый космос."
  ball: 8
  voprosy:
    - q: Почему Елисеев и Хрунов перебирались из корабля в корабль через открытый космос?
      o:
        - Переходного люка между кораблями не было
        - Кабина была негерметична
        - Так было зрелищнее для телевидения
      a: 0
      e: Узел «Контакт» умел только механически соединить корабли — внутреннего люка для перехода экипажа не было.
    - q: Сколько длился переход — мировой рекорд пребывания двух космонавтов вне корабля?
      o:
        - 2 минуты
        - 37 минут
        - 4 часа
      a: 1
      e: 37 минут — по рекордному делу РГАНТД (Ф. 24, Оп. 1-1, Д. 90, Л. 15).
    - q: Кто стал первым в мире «космическим почтальоном»?
      o:
        - Владимир Шаталов
        - Борис Волынов
        - Евгений Хрунов
      a: 2
      e: Хрунов передал Шаталову письма, телеграммы и газеты, которых не было на борту «Союза-4» в день его старта.
    - q: Что едва не погубило Бориса Волынова при посадке?
      o:
        - Приборный агрегат вовремя не отделился
        - Не раскрылся парашют
        - Закончился кислород
      a: 0
      e: Приборный агрегат не отделился штатно, и корабль неуправляемо закувыркался при входе в атмосферу; отсеки разошлись только после взрыва перегретых баков с топливом.
    - q: Какую операцию для лунной программы репетировал этот полёт?
      o:
        - Стыковку на орбите — просто для тренировки
        - Переход космонавта с лунного корабля в орбитальный через открытый космос
        - Ничего — это было самостоятельное достижение
      a: 1
      e: По проекту Л3 космонавт должен был вернуться с поверхности Луны, состыковаться на окололунной орбите и перейти в орбитальный корабль тем же способом — через открытый космос.
