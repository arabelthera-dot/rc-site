  intro: Та же история коротким роликом — от двух стартов и стыковки вручную до перехода через открытый космос и первой «почты» с Земли.
  poster: video/day-16jan-soyuz45-poster.jpg?v=1
  mp4: video/day-16jan-soyuz45.mp4?v=1
  note: "Кадры ролика — подлинные, из Госкаталога музейного фонда РФ: экипаж «Союза-5» — Е. В. Хрунов, Б. В. Волынов, А. С. Елисеев, Хрунов и Елисеев в скафандрах «Ястреб» (Прокопьевский городской краеведческий музей); открытка с портретом командира «Союза-4» В. А. Шаталова (Сургутский краеведческий музей); скафандр «Ястреб» для выхода космонавта из «Союза-4» и «Союза-5» в открытый космос (Мемориальный музей космонавтики); Елисеев, Волынов, Шаталов и Хрунов, фотография с дарственной надписью (Государственный музей политической истории России); Шаталов, Хрунов и Елисеев с газетами на месте приземления, 17 января 1969 (РОСФОТО); приём в Кремле в честь Шаталова, Волынова, Елисеева и Хрунова (Государственный центральный музей современной истории России). Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История первенства · 14 ударов
  h2: «Байкалы» идут к «Амуру»
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: 14 января 1969 года с Байконура стартовал «Союз-4» — в одиночку. Пилотировал его Владимир Шаталов, позывной «Амур».
      det:
        - Шаталов стартовал первым из двух кораблей полёта — он должен был встретить второй корабль, который полетит на следующий день, и состыковаться с ним на орбите.
      src: "Источники: Музей Первого полёта (museumgagarin.ru), «Январь 1969 года…»; Государственный музей истории космонавтики, Калуга (gmik.ru)."
    - summary: На следующий день, 15 января, стартовал «Союз-5» — сразу с тремя космонавтами. Общий позывной экипажа — «Байкалы».
      det:
        - "Командир корабля — Борис Волынов, бортинженер — Алексей Елисеев, инженер-исследователь — Евгений Хрунов. Экипажу предстояло разделиться: двое должны были перейти на «Союз-4», один — вернуться на Землю в одиночку."
      src: "Источники: РГАНТД («Первая в мире стыковка космических кораблей»); Музей Первого полёта."
    - summary: 16 января в 08:20 UTC корабли состыковались вручную — впервые в мире состыковались два пилотируемых корабля.
      det:
        - "Активную роль играл «Союз-4»: именно в его стыковочном узле стояли штырь и активная радиоэлектроника системы сближения. По словам Бориса Волынова, сближение шло поэтапно: остановились на ста метрах, потом на тридцати — и «зависли», ожидая, пока место встречи окажется в зоне видимости советских наземных станций слежения: перед стартом экипажам прямо сказали «сделайте так, чтобы это увидел весь мир»."
      src: "Источники: Музей Первого полёта; Калужский музей космонавтики; «Российская газета», интервью Б. В. Волынова, 15.01.2019."
    - summary: "Переходного люка между кораблями ещё не придумали — поэтому из «Союза-5» в «Союз-4» Елисеев и Хрунов перебирались через открытый космос: узел «Контакт» умел только механически соединить корабли, но не превращал их в один герметичный объём."
      find: true
      tag: Находка дня
      det:
        - "Внутренний люк для перехода экипажа к этому полёту просто не успели спроектировать — конструкторы ограничились надёжной механической и электрической стыковкой. По свидетельствам историков космонавтики, инженер Константин Феоктистов предложил более быстрый обходной путь: одеть переходящих космонавтов в новые скафандры и пустить их по обшивке через открытый космос."
      src: "Источники: Drew Ex Machina, «Soyuz 4 & 5: The First Crew Exchange in Space»; RussianSpaceWeb.com."
    - summary: Алексей Елисеев и Евгений Хрунов впервые в мире перешли из одного корабля в другой через открытый космос — в новых скафандрах «Ястреб».
      det:
        - Перед выходом Борис Волынов задраил люк спускаемого аппарата, стравил давление в орбитальном отсеке и следил за медицинскими показаниями товарищей по приборам. Когда люк наружу пошёл, пульс и давление у обоих подскочили — «как будто они пробежали стометровку», вспоминал потом Волынов.
      src: "Источники: «Российская газета», интервью Б. В. Волынова; РГАНТД."
    - summary: Переход занял 37 минут — мировой рекорд одновременного пребывания двух космонавтов вне корабля.
      det:
        - "Рекорд зафиксирован в архивном «рекордном деле» о групповом полёте: РГАНТД, фонд Федерации космонавтики СССР, Ф. 24, Оп. 1-1, Д. 90, Л. 15."
      src: "Источник: РГАНТД."
    - summary: Пока корабли были состыкованы — 4 часа 33 минуты 49 секунд — в космосе существовала первая в мире экспериментальная орбитальная станция с четырьмя космонавтами на борту.
      det:
        - Это тоже мировой рекорд — по продолжительности и суммарной массе состыкованных пилотируемых кораблей (РГАНТД, Ф. 24, Оп. 1-1, Д. 90, Л. 13).
      src: "Источники: РГАНТД; Калужский музей космонавтики («более четырёх часов работали советские космонавты…»)."
    - summary: "Евгений Хрунов стал первым в мире «космическим почтальоном»: он передал Шаталову письма, телеграммы и газеты, которых не было на борту «Союза-4» в день его старта."
      det:
        - '«Союз-5» стартовал на сутки позже и успел захватить более свежую почту с Земли. Журналист «Российской газеты» спросил Волынова о специальном штемпеле «Земля — Космос» для такой почты; тот ответил: «Думаю, сохранилось у кого-то».'
      src: "Источники: РГАНТД; «Российская газета», интервью Б. В. Волынова."
    - summary: Пока ждал стыковки, командир Шаталов опробовал незапланированный программой способ одновременной ориентации корабля на Солнце и на Землю — сегодня его называют «методом Шаталова».
      det:
        - Метод вошёл в практику последующих орбитальных полётов как способ экономить топливо ориентации, не теряя связь с Землёй и энергию от Солнца одновременно.
      src: "Источник: РГАНТД."
    - summary: 17 января экипаж «Союза-4» — Шаталов, Елисеев и Хрунов — вернулся на Землю. Командир «Союза-5» Борис Волынов приземлился уже один, на сутки позже.
      det:
        - "Разделение экипажей на два разных корабля при возвращении было частью замысла полёта: по лунному проекту Л3 один космонавт так же через открытый космос переходил бы из орбитального корабля в лунный, в одиночку садился на Луну, а после взлёта и стыковки возвращался через космос к товарищу."
      src: "Источники: РГАНТД; Музей Первого полёта; И. Б. Афанасьев, «Неизвестные космические корабли», глава «Лунный комплекс Л3» (astronaut.ru)."
    - summary: "Спуск Волынова едва не закончился трагически: приборный агрегат вовремя не отделился, и корабль неуправляемо закувыркался при входе в атмосферу."
      det:
        - "«Голова — ноги, голова — ноги…» — так вспоминал вращение корабля сам Волынов. В иллюминаторе — розовые жгуты раскалённого газа и плазма, металл обшивки на глазах становился мягким, будто тряпка. Связь с Землёй пропала: сгорели антенны. Отсеки разошлись только тогда, когда от перегрева взорвались баки с остатками топлива — после взрыва спускаемый аппарат наконец отделился, но уже без всякой ориентации."
      src: "Источник: «Российская газета», интервью Б. В. Волынова, 15.01.2019."
    - summary: Корабль спускался неуправляемо и вращаясь, но парашют всё же раскрылся. При жёсткой посадке южнее Кустаная Волынов сломал зубы — и выжил.
      det:
        - Это был аварийный баллистический спуск. При ударе магнитофон, писавший параметры полёта, сорвало с крепления и пролетело мимо ног космонавта; Волынов получил перелом костей зубов и позже лечился в госпитале им. Бурденко.
      src: "Источник: «Российская газета», интервью Б. В. Волынова."
    - summary: Указом Президиума Верховного Совета СССР от 22 января 1969 года все четверо участников полёта стали Героями Советского Союза.
      det:
        - Шаталов, Волынов, Елисеев и Хрунов получили ордена Ленина, медали «Золотая Звезда» и звания «Лётчик-космонавт СССР».
      src: "Источник: РГАНТД."
    - summary: Стыковка и переход через открытый космос репетировали ровно ту операцию, которую требовала советская лунная программа.
      det:
        - "По проекту Л3 единственный космонавт должен был взлететь с поверхности Луны в лунном корабле, состыковаться с орбитальным кораблём на окололунной орбите — и перейти в него тем же способом, через открытый космос: внутреннего люка не было и там."
      src: "Источники: Drew Ex Machina; RussianSpaceWeb.com."
fakty:
  kicker: Десять фактов о первой стыковке
  h2: Факты дня
  udary:
  - summary: <b>Корабли замерли в 30 метрах друг от друга и ждали, пока их покажут по ТВ.</b>
    det:
    - 'Сначала корабли сближались автоматически, со ста метров командиры повели их вручную, а на тридцати метрах остановились. Внизу была Африка, советские антенны корабли не видели, а Земля просила: «сделайте так, чтобы вас увидел весь мир». Командиры висели и ждали, пока появится телесвязь, хотя топлива у Шаталова уже почти не было, и Елисеев на ходу считал, хватит ли его у «Союза-5».'
    src: 'Источник: «50 лет первой космической станции: интервью с Борисом Волыновым», Госкорпорация «Роскосмос», январь 2019 — https://www.roscosmos.ru/25932/'
    otryvok: '«А мы глянули: тридцать метров, глянули на поверхность Земли, где мы находимся-то. В районе Африки. Значит, мы можем состыковаться, но никто нас не увидит. Придем уже в стыковочном состоянии. Поэтому решили потянуть до установления телесвязи». — «У Володи [Шаталова] топлива не было. А мы с Лешей [Елисеевым] думали: посмотри, сколько у нас, хватит, не хватит?»'
    stranica: Роскосмос, интервью Б. В. Волынова «50 лет первой космической станции»
    href: https://www.roscosmos.ru/25932/
    pometka: документ
  - summary: <b>На тренировках связь «перерезали ножницами» — командиры говорили огнями.</b>
    det:
    - 'На тренажёре Шаталова и Волынова проверяли жёстко: обрывали связь, и оставалась только картинка с другого корабля. Командиры заранее договорились мигать друг другу бортовыми огнями, так и передавали самые важные команды. Готовились раздельно и соревновались, кто лучше состыкуется.'
    src: 'Источник: интервью Б. В. Волынова, Роскосмос, январь 2019 — https://www.roscosmos.ru/25932/'
    otryvok: «Для того чтобы создать ситуацию, когда мы не слышим, не видим, а только видим изображение друг друга — попробуй состыковаться! Ножницами обрезает провод электрический... Было и такое. Но мы раньше еще подумали об этом. Поэтому самые важные команды мы моргали [с помощью световых сигналов]. У нас огни еще есть».
    stranica: Роскосмос, интервью Б. В. Волынова «50 лет первой космической станции»
    href: https://www.roscosmos.ru/25932/
    pometka: документ
  - summary: '<b>За бортом Хрунов полз только на руках: ногами корабль трогать было нельзя.</b>'
    det:
    - Хрунов протиснулся в узкий люк и пошёл к «Союзу-4», перехватывая руками поручень. Снаружи корабль был усеян датчиками, поэтому Хрунов не шёл, а плыл горизонтально, будто в воде. Елисеев высунулся из люка по пояс и смотрел ему вслед.
    src: 'Источник: «Есть рукопожатие!», Музей космонавтики (Москва), новости музея — https://kosmo-museum.ru/news/est-rukopozhatie'
    otryvok: «Евгений словно плыл в горизонтальном положении в космическом океане — ногами нельзя было касаться усеянной датчиками внешней поверхности корабля. Космонавта связывал с „Союзом-5“ длинный фал. Высунувшись по пояс из люка, за ним наблюдал Елисеев».
    stranica: Музей космонавтики, «Есть рукопожатие!»
    href: https://kosmo-museum.ru/news/est-rukopozhatie
    pometka: документ
  - summary: <b>Посреди открытого космоса у Хрунова отказала вентиляция — Земле не сказали.</b>
    det:
    - 'Хрунов вдруг остановился: воздух в скафандре перестал гонять. Без вентиляции скафандр нагревается, и дышать становится тяжело. Космонавты молча искали причину и нашли её: тумблер вентиляции оказался выключен. Центр управления в это время спрашивал, почему они замолчали.'
    src: 'Источник: «Есть рукопожатие!», Музей космонавтики — https://kosmo-museum.ru/news/est-rukopozhatie (приводит В. Б. Головачёва, «Труд», 15.01.1999)'
    otryvok: «— Женя, что там? — спокойным тоном спросил Елисеев по радиосвязи. — Нелады с вентиляцией, она перестала работать, — ответил Хрунов. <…> На Землю ничего не сообщали. Опасались, что переход сразу же отменят». — «…на скафандре Хрунова оказался выключенным тумблер вентиляции».
    stranica: Музей космонавтики, «Есть рукопожатие!»
    href: https://kosmo-museum.ru/news/est-rukopozhatie
    pometka: документ
  - summary: <b>Елисеев за бортом вдруг замер, и у генерала на Земле побежали мурашки.</b>
    det:
    - Переход смотрели по телевидению. Руководитель подготовки космонавтов Николай Каманин больше всего боялся именно за Елисеева. Тот сначала остановился, потом застыл неподвижно, и только через две-три минуты помахал рукой. Каманин записал это в дневник в тот же вечер.
    src: 'Источник: Н. П. Каманин, «Скрытый космос», дневник, запись за 16 января 1969 — https://www.astronaut.ru/bookcase/books/kamanin4/text/1969-01.htm'
    otryvok: «Когда при переходе Елисеев сначала перестал двигаться, а потом и вообще безжизненно замер, у меня по спине побежали мурашки... Все облегченно вздохнули, когда через две-три минуты увидели, что Елисеев помахал рукой».
    stranica: Н. П. Каманин, «Скрытый космос», дневник, январь 1969
    href: https://www.astronaut.ru/bookcase/books/kamanin4/text/1969-01.htm
    pometka: документ
  - summary: <b>Фалы двух космонавтов перепутались — Хрунову пришлось вернуться в корабль.</b>
    det:
    - 'Каждого держал фал со шлангом. Короткий был всего около 60 см, а длинный шёл к борту «Союза-5», и на том корабле его предстояло переключить. Фалы спутались, Хрунову пришлось вернуться в отсек и распутывать. Задуманная киносъёмка перехода тоже не удалась: камеру неудачно установили.'
    src: 'Источники: Н. П. Каманин, «Скрытый космос» (итоги полёта на Госкомиссии) — https://www.astronaut.ru/bookcase/books/kamanin4/text/1969-01.htm ; интервью Б. В. Волынова, Роскосмос — https://www.roscosmos.ru/25932/'
    otryvok: «…перепутывание фалов Хрунова и Елисеева при выходе (Хрунову пришлось возвращаться из космоса в бытовой отсек и распутывать фалы); 2) невыполнение киносъемки перехода из корабля в корабль из-за неудачной установки кинокамеры». — «…коротенький маленький шланг (провод), шестьдесят или чуть больше сантиметров. У — второго длинный, который был соединен с моим бортом».
    stranica: Н. П. Каманин, «Скрытый космос», дневник, январь 1969
    href: https://www.astronaut.ru/bookcase/books/kamanin4/text/1969-01.htm
    pometka: два источника
  - summary: <b>Шаталов прочитал в космосе газету о собственном полёте.</b>
    det:
    - 'Шаталов улетел на сутки раньше, поэтому газет о своём старте не видел. В три часа ночи с Москвы на космодром прилетел Ан-12 и привёз по 10 экземпляров «Правды», «Известий» и других газет, а ещё письмо от жены и детей. Через открытый космос всё это и понесли Шаталову.'
    src: 'Источник: Н. П. Каманин, «Скрытый космос», записи за 14 и 15 января 1969 — https://www.astronaut.ru/bookcase/books/kamanin4/text/1969-01.htm'
    otryvok: «…поручив им передать Шаталову письмо от жены, мое письмо и газеты „Правда“ и „Известия“, в которых опубликовано сообщение о полете „Союза-4“». — «Около трех часов ночи из Москвы прилетел самолет Ан-12, доставивший на космодром помимо всего прочего по 10 экземпляров разных газет с сообщениями о полете „Союза-4“, а также письмо Шаталову от жены и детей».
    stranica: Н. П. Каманин, «Скрытый космос», дневник, январь 1969
    href: https://www.astronaut.ru/bookcase/books/kamanin4/text/1969-01.htm
    pometka: документ
  - summary: <b>В голенище сапога Волынов пронёс в космос медвежонка — а в нём тайное фото.</b>
    det:
    - Плюшевый мишка размером с детский кулачок. Взять его «на счастье и удачу» попросили дети, 11-летний Андрей и 4-летняя Таня. Жена Тамара тайком от мужа спрятала внутрь игрушки семейную фотографию. Хрунов рассказывал, что мишка плавал по кабине вместе с экипажем.
    src: 'Источник: «Есть рукопожатие!», Музей космонавтики — https://kosmo-museum.ru/news/est-rukopozhatie'
    otryvok: «Этого маленького — размером с детский кулачок — плюшевого медвежонка „на счастью и удачу“ попросили взять с собой дети космонавта Волынова. Андрею было тогда 11 лет, Танечке — четыре года. Игрушку на борт корабля Борис Волынов пронёс в голенище космического сапога. Внутрь игрушки, втайне от мужа, Тамара Волынова спрятала семейную фотографию, на обороте которой написала „Да сохранит тебя любовь моя и наша“».
    stranica: Музей космонавтики, «Есть рукопожатие!»
    href: https://kosmo-museum.ru/news/est-rukopozhatie
    pometka: документ
  - summary: '<b>Перед спуском Волынов глянул вниз, а там вместо дня ночь: расчёт был неверный.</b>'
    det:
    - Перед включением тормозного двигателя Волынову нужно было увидеть в оптический прибор край Земли, чтобы не разогнать корабль вместо торможения. По расчёту внизу должен был быть день, а там была ночь. Волынов выключил программу и развернул корабль вручную. Потом не отделился приборный отсек, и спускаемый аппарат пошёл хвостом вперёд, хотя, как сказал Волынов, «ворона вперёд хвостом не летает».
    src: 'Источник: интервью Б. В. Волынова, Роскосмос, январь 2019 — https://www.roscosmos.ru/25932/'
    otryvok: '«Я смотрю в оптический прибор, который дает возможность обзор 150 градусов сразу. И по Земле тоже. Все расчерчено у нас, как Земля должна идти. Глянул, а на Земле ночь. Ошиблись. Я про себя думаю: „куда запускать двигатель“? — Неизвестно. Всю программу выключил. Теперь надо было вручную, самому сориентировать [корабль] нормально».'
    stranica: Роскосмос, интервью Б. В. Волынова «50 лет первой космической станции»
    href: https://www.roscosmos.ru/25932/
    pometka: документ
  - summary: '<b>После посадки колхозница потрогала Елисеева и ахнула: «Тёплый!»</b>'
    det:
    - Казахстанская степь, утро. Колхозники увидели в небе бело-оранжевый парашют и сбежались к кораблю, некоторые примчались на мотоциклах. Стояли и говорили шёпотом. Одна женщина осторожно ощупала руку космонавта, будто проверяла, из чего он сделан.
    src: 'Источник: «Есть рукопожатие!», Музей космонавтики — https://kosmo-museum.ru/news/est-rukopozhatie (воспоминания А. С. Елисеева, «Техника — молодёжи», 1980, № 6)'
    otryvok: '«И вдруг я чувствую, что кто-то осторожно трогает мою руку. Оборачиваюсь: две женщины внимательно оглядывают меня, а одна даже пытается на ощупь определить, из какого „материала“ я состою. <…> Наконец та, что проводила „экспертизу“, с удивлением констатировала: „Тёплый!“»'
    stranica: Музей космонавтики, «Есть рукопожатие!»
    href: https://kosmo-museum.ru/news/est-rukopozhatie
    pometka: документ
