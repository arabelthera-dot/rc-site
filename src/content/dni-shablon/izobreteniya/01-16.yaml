  h2: Что именно здесь первое в мире
  granica: <b>Граница первенства:</b> первая в мире стыковка двух НЕЗАВИСИМО запущенных пилотируемых космических кораблей и первый в мире переход члена экипажа из одного корабля в другой через открытый космос — 16 января 1969 года, 08:20 UTC. Подтверждено архивным рекордным делом РГАНТД (Ф. 24, Оп. 1-1, Д. 90) о мировых рекордах этого полёта.
  net: <b>Чего здесь нет:</b> в марте 1966 года экипаж «Джемини-8» состыковался с беспилотной мишенью «Аджена» — но мишень не имела экипажа, и перехода между кораблями не было. Первое аналогичное достижение США — стыковка пилотируемых командного и лунного модулей «Аполлона-9» с переходом экипажа через внутренний люк — состоялось только 3 марта 1969 года, на 46 дней позже.
  kolonki:
    - Документ или событие
    - Что
    - Когда
  stroki:
