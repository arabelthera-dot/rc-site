    - Выбери подпись — кнопка загорится золотом.
    - Нажми на подходящее место. Верный выбор загорится зелёным.
    - Расставь все три — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все три подписи на месте — +20 баллов.
