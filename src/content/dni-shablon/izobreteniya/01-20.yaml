story:
  kicker: Пять фактов о Лунине
  h2: Искал соли — нашёл витамины
  udary:
    - summary: Лунин искал, зачем животным соли, — а открыл витамины.
      det:
        - "Тему дали про минеральные соли. Он добавил мышам все соли молока до грамма — и мыши всё равно погибли. Вывод: в настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна; позже их назвали витаминами."
      src: 'Источник: БСЭ, статья «Лунин Николай Иванович» — <a href="https://www.booksite.ru/fulltext/1/001/008/071/707.htm" rel="noopener" target="_blank">booksite.ru/fulltext/1/001/008/071/707.htm</a>; Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3 — <a href="https://cyberleninka.ru/article/n/viva-la-vita-100-let-nazad-vydelen-pervyy-vitamin-b1-i-vveden-termin-vitamin" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    - summary: Вывод 26-летнего Лунина не принял даже его руководитель — а прав оказался ученик.
      det:
        - Руководитель Густав Бунге искал причину смерти мышей в кислоте из корма; «вывод Лунина не получил признания (даже со стороны его руководителя Г. Бунге)». Через 30 лет опыт повторили в Англии — и подтвердили.
      src: 'Источник: Вениаминова Г. Н., Инденбом Т. П. «История больницы имени К. А. Раухфуса» // Пространство и Время. 2013. № 1 — <a href="https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    - summary: Опыт, за который англичанин Хопкинс в 1929-м получил Нобелевскую, Лунин поставил на 49 лет раньше.
      det:
        - Хопкинс в 1906–1912 годах «фактически повторил опыты» Лунина на крысах. В 1929 году Хопкинс и Эйкман получили Нобелевскую премию по физиологии и медицине.
      src: 'Источник: Ненахов И. Г. // Научно-медицинский вестник Центрального Черноземья. 2019. № 77 — <a href="https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya" rel="noopener" target="_blank">cyberleninka.ru</a>; Громова О. А. // Педиатрическая фармакология. 2008. № 1 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    - summary: В Нобелевской лекции 1929 года Хопкинс назвал опыт Лунина первым доказательством витаминов.
      det:
        - "Лекция Фредерика Хопкинса «Ранняя история изучения витаминов», 11 декабря 1929 года: «Сейчас общепризнано, что первое ясное, основанное на опыте доказательство существования пищевых факторов, по природе подобных витаминам, получено в школе Бунге в Базеле. В 1881 г. Лунин, один из сотрудников этой школы, кормил мышей искусственной смесью отдельных составных частей молока […] Он обнаружил, что на такой смеси животные не выживают, и пришёл к выводу, что „природная пища, такая как молоко, должна поэтому содержать, помимо этих известных главных составных частей, небольшие количества неизвестных веществ, необходимых для жизни“. Это утверждение, которому уже полвека, […] содержит, по-видимому, суть того, во что мы верим сегодня»."
        - "В оригинале: «It is now generally agreed that the first clear evidence, based upon experiment, for the existence of dietary factors of the nature of vitamins came from the school of Bunge at Basel. In 1881 Lunin, one of the workers in that school, fed mice upon an artificial mixture of the separate constituents of milk…» Год 1881 — это год, когда работа вышла в журнале; защищена диссертация в 1880-м."
        - "На самом деле — Дерпт и 1880 год: в Базель Бунге переехал в 1885 году."
      src: 'Источник: F. G. Hopkins. The Earlier History of Vitamin Research. Nobel Lecture, 11.12.1929 — <a href="https://www.nobelprize.org/prizes/medicine/1929/hopkins/lecture/" rel="noopener" target="_blank">nobelprize.org/prizes/medicine/1929/hopkins/lecture/</a>; Громова О. А. «Исторические и современные аспекты отечественной педиатрической витаминологии» // Педиатрическая фармакология. 2008. № 1 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    - summary: Витамины получили имя только через 32 года после того, как Лунин доказал, что они существуют.
      det:
        - Слово придумал Казимир Функ в 1911–1912 годах, когда выделил вещество, излечивавшее бери-бери.
      src: 'Источник: Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3 — <a href="https://cyberleninka.ru/article/n/viva-la-vita-100-let-nazad-vydelen-pervyy-vitamin-b1-i-vveden-termin-vitamin" rel="noopener" target="_blank">cyberleninka.ru</a>.'
