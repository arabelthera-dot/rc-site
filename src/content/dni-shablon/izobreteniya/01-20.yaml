  lead: "Голос ведёт по залу открытия витаминов: от портрета Николая Лунина через опыт с мышами и молоком и игру «Спаси мышь» до итога зала. Шесть остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Портрет и четыре числа
    - t: 51
      mark: 0:51
      title: Искал соли
    - t: 101
      mark: 1:41
      title: Ученик против профессора
    - t: 147
      mark: 2:27
      title: "Игра: спаси мышь"
    - t: 199
      mark: 3:19
      title: Что сделал первым
    - t: 284
      mark: 4:44
      title: Итог зала
  transcript:
    - "<p>«Здравствуйте. Мы в зале открытия витаминов. Посмотрите на обложку: студийная фотография, пожилой человек с густыми усами, в тёмном костюме, сидит вполоборота на деревянном стуле. Это Николай Иванович Лунин. Двадцатого января тысяча восемьсот пятьдесят третьего года по старому стилю он родился в Дерпте, нынешнем Тарту. Там же, в Дерптском университете, в лаборатории Густава Бунге, он защитил диссертацию о мышах и молоке. Главная мысль зала такая: мыши получали идеальную смесь белков, жиров и сахара и умирали, пока Лунин не понял, что в еде есть что-то ещё. Под обложкой полоса из четырёх чисел. Тысяча восемьсот восьмидесятый — диссертация Лунина. От одиннадцати до двадцати одного дня жили мыши на смеси. Десять недель — здоровы на молоке. И сорок девять лет — до Нобелевской премии другим.»</p>"
    - "<p>«Начнём с того, какую тему дали молодому врачу. Тему дали про минеральные соли: зачем они нужны животным. Лунин кормил мышей смесью очищенных казеина, жира и молочного сахара, то есть всем, из чего, как тогда знала наука, состоит молоко. Мыши погибали на одиннадцатый — двадцать первый день. А мыши на цельном молоке все десять недель оставались здоровыми. Тогда профессор Бунге решил, что мышей травит кислота из корма, и велел добавить соду. С содой мыши жили дольше, но всё равно гибли, между шестнадцатым и тридцатым днём. Лунин добавил все соли молока, до грамма. И мыши снова гибли, на двадцатый — тридцатый день. Отсюда вывод: в настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна. Позже их назвали витаминами.»</p>"
    - "<p>«Теперь спуститесь к игре «Спаси мышь — и не сможешь». Перед вами две клетки и полка лаборатории с баночками. Правой мыши просто налейте молока: перетащите баночку в миску или нажмите на неё. Левой соберите идеальный корм: белок, жир, молочный сахар и воду. Нажмите «Пустить дни». Счётчик побежит до семидесятого дня. Правая мышь бегает в колесе, а левая слабеет и гибнет. Тогда на полке появится сода, как велел Бунге. Добавьте её и пустите дни ещё раз. Мышь снова погибнет, лишь чуть позже. Последней появится баночка со всеми солями молока, как у Лунина. И даже она не спасёт. Честная оговорка: это модель, а не съёмка. Десять недель опыта сжаты в полминуты. Сколько было мышей, источники не сообщают, здесь по одной в клетке.»</p>"
    - "<p>«Вот и весь зал. Молодой врач в Дерпте искал, зачем животным соли, а открыл витамины. Белок есть, жир есть, сахар есть, вода, соли до грамма, а мышь всё равно гибнет и живёт только на молоке. Это первый в мире вопрос о витаминах. Вывод дня такой: первым бывает тот, кто поверил своему опыту, а не учебнику и даже не своему профессору. Теперь сыграйте в «Спаси мышь» и сами попробуйте спасти левую мышь так, как пробовали Бунге и Лунин. Потом ответьте на пять вопросов викторины, задайте вопрос самому Лунину и откройте «Узнать подробнее» под каждым из пяти фактов. Там подробности и источники.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
