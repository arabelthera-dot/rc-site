        $('chatInput').addEventListener('keydown', function(e){ if (e.key==='Enter') send(); });
        ['Чем вы кормили мышей?','Почему Бунге вам не поверил?','Кто получил Нобелевскую премию?'].forEach(function(q){
          var c=document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=q;
          c.onclick=function(){ $('chatInput').value=q; send(); }; $('starters').appendChild(c); });
        var w=document.createElement('div'); w.className='msg inv';
        w.textContent='Здравствуйте. Николай Иванович Лунин, врач. Спрашивайте — расскажу, как мыши подсказали мне, что в еде есть что-то ещё.';
        $('chatBox').appendChild(w);

        /* ── ПЕРЕЧЕНЬ ТЕМЫ ── */
        $('themeInvBtn').onclick=function(){
          var b=$('themeInvBody'), open=b.hidden; b.hidden=!open;
          this.textContent=open ? '▲ Скрыть' : this.dataset.label;
          if (open) award('theme',5);
        };
      })();
return:
  q: Сколько лет прошло между диссертацией Лунина о мышах и молоке и Нобелевской премией Хопкинсу и Эйкману?
  a: "49 лет: диссертация — 1880 год, премия — 1929-й."
audioguide:
  audioSrc: audio-guide-lunin-ru.mp3
  durationLabel: 5 минут 23 секунды
  lead: "Голос ведёт по залу открытия витаминов: от портрета Николая Лунина через опыт с мышами и молоком и игру «Спаси мышь» до Нобелевской лекции Хопкинса. Семь остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: 0:00
      title: Портрет и четыре числа
    - t: 51
      mark: 0:51
      title: Искал соли
    - t: 101
      mark: 1:41
      title: Ученик против профессора
    - t: 147
      mark: 2:27
      title: "Игра: спаси мышь"
    - t: 199
      mark: 3:19
      title: Что сделал первым
    - t: 242
      mark: 4:02
      title: Хопкинс и Функ
    - t: 284
      mark: 4:44
      title: Итог зала
  transcript:
    - "<p>«Здравствуйте. Мы в зале открытия витаминов. Посмотрите на обложку: студийная фотография, пожилой человек с густыми усами, в тёмном костюме, сидит вполоборота на деревянном стуле. Это Николай Иванович Лунин. Двадцатого января тысяча восемьсот пятьдесят третьего года по старому стилю он родился в Дерпте, нынешнем Тарту. Там же, в Дерптском университете, в лаборатории Густава Бунге, он защитил диссертацию о мышах и молоке. Главная мысль зала такая: мыши получали идеальную смесь белков, жиров и сахара и умирали, пока Лунин не понял, что в еде есть что-то ещё. Под обложкой полоса из четырёх чисел. Тысяча восемьсот восьмидесятый — диссертация Лунина. От одиннадцати до двадцати одного дня жили мыши на смеси. Десять недель — здоровы на молоке. И сорок девять лет — до Нобелевской премии другим.»</p>"
    - "<p>«Начнём с того, какую тему дали молодому врачу. Тему дали про минеральные соли: зачем они нужны животным. Лунин кормил мышей смесью очищенных казеина, жира и молочного сахара, то есть всем, из чего, как тогда знала наука, состоит молоко. Мыши погибали на одиннадцатый — двадцать первый день. А мыши на цельном молоке все десять недель оставались здоровыми. Тогда профессор Бунге решил, что мышей травит кислота из корма, и велел добавить соду. С содой мыши жили дольше, но всё равно гибли, между шестнадцатым и тридцатым днём. Лунин добавил все соли молока, до грамма. И мыши снова гибли, на двадцатый — тридцатый день. Отсюда вывод: в настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна. Позже их назвали витаминами.»</p>"
    - "<p>«Найдите ниже раздел «Что в это время делал мир». Тысяча восемьсот восьмидесятый год. В Петербурге гремит взрыв в Зимнем дворце, а в Москве на Тверском бульваре открывают первый в России памятник Пушкину. Мир уверен, что знает, из чего состоит еда: белки, жиры, углеводы, соли, вода. А в тихом Дерпте двадцатишестилетний Лунин видит, что этой формулы мало. Его вывод не принял даже его руководитель, Густав Бунге. Признания вывод тогда не получил. В развилке «А как поступил бы ты?» вам предложат выбрать: написать в диссертации про неизвестные вещества, согласиться с профессором или бросить тему. Лунин выбрал первое. А прав оказался ученик: через тридцать лет опыт повторили в Англии и подтвердили.»</p>"
    - "<p>«Теперь спуститесь к игре «Спаси мышь — и не сможешь». Перед вами две клетки и полка лаборатории с баночками. Правой мыши просто налейте молока: перетащите баночку в миску или нажмите на неё. Левой соберите идеальный корм: белок, жир, молочный сахар и воду. Нажмите «Пустить дни». Счётчик побежит до семидесятого дня. Правая мышь бегает в колесе, а левая слабеет и гибнет. Тогда на полке появится сода, как велел Бунге. Добавьте её и пустите дни ещё раз. Мышь снова погибнет, лишь чуть позже. Последней появится баночка со всеми солями молока, как у Лунина. И даже она не спасёт. Честная оговорка: это модель, а не съёмка. Десять недель опыта сжаты в полминуты. Сколько было мышей, источники не сообщают, здесь по одной в клетке.»</p>"
    - "<p>«Найдите блок «Что именно Лунин сделал первым». Граница первенства такая: первый в мире опыт, который показал, что пища из чистых белков, жиров, углеводов и солей не поддерживает жизнь, и вывод, что в натуральной еде есть неизвестные вещества, необходимые для жизни. Дерпт, диссертация тысяча восемьсот восьмидесятого года. А чего здесь нет: Лунин не выделил ни одного витамина и не дал им имя. Ниже таблица. Около тысяча восемьсот девяностого года в Дерпте Сосин повторил опыт с гемоглобином, итог тот же. В тысяча восемьсот девяностые годы на Яве Эйкман изучал кур на полированном рисе: рисовые отруби их спасали. Первенство Лунина — сама мысль, доказанная опытом.»</p>"
    - <p>«Теперь пять фактов. Англичанин Хопкинс в тысяча девятьсот шестом — тысяча девятьсот двенадцатом годах фактически повторил опыты Лунина на крысах, и добавка молока их спасала. В тысяча девятьсот двадцать девятом году Хопкинс и Эйкман получили Нобелевскую премию по физиологии и медицине. Это через сорок девять лет после диссертации Лунина. Одиннадцатого декабря тысяча девятьсот двадцать девятого года в Нобелевской лекции Хопкинс назвал опыт Лунина первым ясным, основанным на опыте доказательством существования витаминов. А само слово «витамин» придумал Казимир Функ в тысяча девятьсот одиннадцатом — двенадцатом годах, когда выделил вещество, излечивавшее бери-бери. Так витамины получили имя только через тридцать два года после опыта Лунина.»</p>
    - "<p>«Вот и весь зал. Молодой врач в Дерпте искал, зачем животным соли, а открыл витамины. Белок есть, жир есть, сахар есть, вода, соли до грамма, а мышь всё равно гибнет и живёт только на молоке. Это первый в мире вопрос о витаминах. Вывод дня такой: первым бывает тот, кто поверил своему опыту, а не учебнику и даже не своему профессору. Теперь сыграйте в «Спаси мышь» и сами попробуйте спасти левую мышь так, как пробовали Бунге и Лунин. Потом ответьте на пять вопросов викторины, задайте вопрос самому Лунину и откройте «Узнать подробнее» под каждым из пяти фактов. Там подробности и источники.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
