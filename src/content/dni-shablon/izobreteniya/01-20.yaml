  intro: Та же история коротким роликом — от мышей на идеальной смеси в Дерпте 1880 года до молока, витаминов и Нобелевской премии другим через 49 лет.
  poster: video/day-20jan-lunin-poster.jpg?v=1
  mp4: video/day-20jan-lunin.mp4?v=1
  note: "Кадры ролика — подлинные, из Госкаталога музейного фонда РФ: тушка домовой мыши (Забайкальский краевой краеведческий музей им. А. К. Кузнецова); открытка «Юрьев (Дерпт), университет» (Государственный музей истории Санкт-Петербурга); весы аптечные (Государственный музей истории Санкт-Петербурга); фарфоровая выпарительная чашка (музей-заповедник «Кузнецкая крепость»); портрет Н. И. Лунина (Государственный исторический музей); обложка книги «Алкоголизм и вырождение» (Государственный музей Л. Н. Толстого). Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История открытия · 4 удара
  h2: Искал соли — нашёл витамины
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Дерпт, 1880 год. Молодой врач Николай Лунин получил тему — зачем животным минеральные соли.
      kadr:
        src: /muzei/izobreteniya/img/01-20-dissertaciya-titul.jpg
        alt: "Пожелтевший титульный лист старинной книги на немецком: «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», ниже — «Inaugural-Dissertation… Doctors der Medicin… Universität zu Dorpat… von N. Lunin», внизу «Dorpat, 1880»"
        data_source: "https://archive.org/details/IA40154018_0109"
        license: "право: общественное достояние (издание 1880 г., автор умер в 1937 г.)"
        podpis: "Титул диссертации Николая Лунина «О значении неорганических солей для питания животного», Дерпт, 1880. Именно с этой темы про соли начался опыт, доказавший существование витаминов."
        credit: "Н. Лунин, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», Дерпт: типография Г. Лакмана, 1880. Скан: Internet Archive, IA40154018_0109 (экземпляр Lane Medical Library)."
        width: 812
        height: 1400
        klass: portret
      det:
        - "Он взял мышей и стал кормить их тем, из чего, как тогда знала наука, состоит молоко: очищенным белком, жиром, молочным сахаром и водой."
      src: 'Источник: БСЭ, статья «Лунин Николай Иванович» — <a href="https://www.booksite.ru/fulltext/1/001/008/071/707.htm" rel="noopener" target="_blank">booksite.ru</a>.'
    - summary: На такой «идеальной» смеси мыши погибали за 11–21 день. На молоке — жили.
      kadr:
        src: /muzei/izobreteniya/img/01-20-dissertaciya-s12-myshi.jpg
        alt: "Страница 12 старой немецкой книги: сплошной текст, в нём числа «2 1/2 Monate», «11, 13, 14, 15, 21» и «16, 23, 24, 27, 30, 26 Tage»"
        data_source: "https://archive.org/details/IA40154018_0109"
        license: "право: общественное достояние (издание 1880 г., автор умер в 1937 г.)"
        podpis: "Страница 12 диссертации: две мыши на одном молоке жили два с половиной месяца и были отпущены здоровыми, а пять мышей на почти беззольной смеси прожили 11, 13, 14, 15 и 21 день. Ниже — опыт с содой: 16–30 дней."
        credit: "Н. Лунин, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», Дерпт: типография Г. Лакмана, 1880. Скан: Internet Archive, IA40154018_0109 (экземпляр Lane Medical Library)."
        width: 827
        height: 1400
        klass: portret
      det:
        - "Свежее молоко скисало в мисках, поэтому Лунин давал молоко, выпаренное на пару почти досуха. На нём мыши два с половиной месяца оставались здоровыми."
      src: 'Источник: диссертация Н. И. Лунина, Дерпт, 1880, с. 14–15 — <a href="https://archive.org/details/IA40154018_0109" rel="noopener" target="_blank">скан диссертации</a>.'
    - summary: Руководитель лаборатории решил, что мышей травит кислота, — и велел добавить соду.
      kadr:
        src: /muzei/izobreteniya/img/01-20-dissertaciya-rukovoditel.jpg
        alt: "Страница старой книги с немецким текстом из нескольких абзацев, начинается крупной буквицей D: «Diese Arbeit wurde ausgeführt auf Anregung und unter Leitung des Herrn Doc. Dr. G. Bunge…»"
        data_source: "https://archive.org/details/IA40154018_0109"
        license: "право: общественное достояние (издание 1880 г., автор умер в 1937 г.)"
        podpis: "Предисловие диссертации: Лунин пишет, что работа сделана по предложению и под руководством доцента, в физиологическом кабинете Дерптского университета. Это и есть руководитель лаборатории из истории опыта."
        credit: "Н. Лунин, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», Дерпт: типография Г. Лакмана, 1880. Скан: Internet Archive, IA40154018_0109 (экземпляр Lane Medical Library)."
        width: 833
        height: 1400
        klass: portret
      det:
        - "С содой мыши жили дольше, но всё равно гибли — между 16-м и 30-м днём."
      src: 'Источник: диссертация Н. И. Лунина, Дерпт, 1880 — <a href="https://archive.org/details/IA40154018_0109" rel="noopener" target="_blank">скан диссертации</a>.'
    - summary: Лунин добавил все соли молока в той же пропорции. Мыши снова погибли — и он сделал вывод.
      kadr:
        src: /muzei/izobreteniya/img/01-20-dissertaciya-s14-soli.jpg
        alt: "Страница 14 старой немецкой книги со сплошным текстом; во втором абзаце ряд чисел «20, 23, 23, 29, 30, 31», внизу сноска мелким шрифтом"
        data_source: "https://archive.org/details/IA40154018_0109"
        license: "право: общественное достояние (издание 1880 г., автор умер в 1937 г.)"
        podpis: "Страница 14: корм с искусственной смесью солей по анализу молока — и мыши всё равно живут лишь 20–31 день, «несмотря на все составные части золы». Отсюда Лунин переходит к опыту с цельным молоком."
        credit: "Н. Лунин, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», Дерпт: типография Г. Лакмана, 1880. Скан: Internet Archive, IA40154018_0109 (экземпляр Lane Medical Library)."
        width: 827
        height: 1400
        klass: portret
      det:
        - "В настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна. Позже их назвали витаминами."
      src: 'Источник: БСЭ, статья «Лунин Николай Иванович» — <a href="https://www.booksite.ru/fulltext/1/001/008/071/707.htm" rel="noopener" target="_blank">booksite.ru</a>.'
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о Лунине
  h2: Ученик, которому не поверил учитель
  udary:
  - summary: '<b>Лунин искал, зачем животным соли, — а открыл витамины.</b>'
    kadr:
      src: /muzei/izobreteniya/img/01-20-dissertaciya-s15-vyvod.jpg
      alt: "Страница 15 старой немецкой книги со сплошным текстом; в середине фраза «…noch andere Stoffe vorhanden sein müssen, welche für die Ernährung unentbehrlich sind»"
      data_source: "https://archive.org/details/IA40154018_0109"
      license: "право: общественное достояние (издание 1880 г., автор умер в 1937 г.)"
      podpis: "Тот самый вывод 1880 года: раз мыши не живут на белке, жире, сахаре, солях и воде, «в молоке, кроме казеина, жира, молочного сахара и солей, должны быть ещё другие вещества, незаменимые для питания». Позже их назовут витаминами."
      credit: "Н. Лунин, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», Дерпт: типография Г. Лакмана, 1880. Скан: Internet Archive, IA40154018_0109 (экземпляр Lane Medical Library)."
      width: 839
      height: 1400
      klass: portret
    det:
    - 'Тему дали про минеральные соли. Он добавил мышам все соли молока в той же пропорции, что в молоке, — и мыши всё равно погибли. Вывод: в настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна; позже их назвали витаминами.'
    src: 'Источник: БСЭ, статья «Лунин Николай Иванович» — <a href="https://www.booksite.ru/fulltext/1/001/008/071/707.htm" rel="noopener" target="_blank">booksite.ru</a>; Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3 — <a href="https://cyberleninka.ru/article/n/viva-la-vita-100-let-nazad-vydelen-pervyy-vitamin-b1-i-vveden-termin-vitamin" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    otryvok: '«В 1880 защитил докторскую диссертацию «О значении неорганических солей в питании животных», в которой показал, что, кроме белков, жиров, углеводов, солей и воды, для нормального развития и жизни животных (мышей) необходимы ещё особые неизвестные в то время вещества, названные позднее витаминами».'
    stranica: Большая советская энциклопедия, статья «Лунин Николай Иванович»
    href: 'https://www.booksite.ru/fulltext/1/001/008/071/707.htm'
    pometka: два источника
  - summary: '<b>Вывод 26-летнего Лунина не принял даже его руководитель — а прав оказался ученик.</b>'
    kadr:
      src: /muzei/izobreteniya/img/01-20-yurevskij-universitet-niva-1902.jpg
      alt: "Старая газетная фотография: большое классическое здание с шестью колоннами и треугольным фронтоном, высокая скатная крыша с трубами, слева деревья; под снимком подпись дореформенной орфографией «Къ столѣтію юрьевскаго университета. Главное зданіе университета»"
      data_source: "https://pastvu.com/p/174498"
      license: "право: общественное достояние (издание 1902 г.) · pastvu.com"
      podpis: "Главное здание Дерптского (с 1893 года — Юрьевского) университета, где Лунин учился и в 1880 году защитил диссертацию. Снимок из «Нивы» к столетию университета."
      credit: "Фото: автор не указан, 1901–1902. Опубликовано: журнал «Нива», 1902. Источник оцифровки: pastvu.com, фото № 174498 (загрузил 1qa2ws)."
      width: 1400
      height: 1091
    det:
    - 'Руководитель лаборатории искал причину смерти мышей в кислоте из корма; вывод Лунина не признал даже он. Прав оказался ученик: через тридцать лет опыт повторили — и подтвердили.'
    src: 'Источник: Вениаминова Г. Н., Инденбом Т. П. «История больницы имени К. А. Раухфуса» // Пространство и Время. 2013. № 1 — <a href="https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    otryvok: '«Хотя вывод Лунина не получил признания (даже со стороны его руководителя…), в 1911–1913 гг. произошел прорыв в этом направлении, и за короткое время появилось значительное число работ, заложивших основы учения о витаминах».'
    stranica: Вениаминова Г. Н., Инденбом Т. П. // Пространство и Время. 2013. № 1
    href: 'https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa'
    pometka: документ
  - summary: '<b>Лунин первым в мире поставил опыт, который потом повторил нобелевский лауреат 1929 года.</b>'
    det:
    - Диссертация Лунина — 1880 год. Позже его опыт «фактически повторил» один из двух будущих лауреатов (Ненахов, 2019). Нобелевская премия по физиологии и медицине за открытие витаминов — 1929-й. Самому Лунину её не дали.
    src: 'Источник: Громова О. А. // Педиатрическая фармакология. 2008. № 1 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener" target="_blank">cyberleninka.ru</a>; «Научная Россия», 31.07.2021 — <a href="https://scientificrussia.ru/articles/ih-nuzno-nemnogo-no-bez-nih-nikak" rel="noopener" target="_blank">scientificrussia.ru</a>.'
    otryvok: '«Наш соотечественник — выдающийся биохимик и практикующий врач-педиатр Н.И. Лунин в 1880 г. впервые в мире обозначил обнаруженные им и присутствующие в пище в ничтожно малых количествах неизвестные вещества, как абсолютно необходимые для жизни».'
    stranica: Громова О. А. «Исторические и современные аспекты отечественной педиатрической витаминологии» // Педиатрическая фармакология. 2008. № 1
    href: 'https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii'
    pometka: два источника
  - summary: '<b>Витамины получили имя только через 32 года после того, как Лунин доказал, что они существуют.</b>'
    det:
    - Само слово «витамин» появилось только в 1911–1912 годах.
    src: 'Источник: Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3 — <a href="https://cyberleninka.ru/article/n/viva-la-vita-100-let-nazad-vydelen-pervyy-vitamin-b1-i-vveden-termin-vitamin" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    otryvok: '«Viva la Vita! 100 лет назад выделен первый витамин B1 и введен термин «витамин»» — заголовок статьи 2011 года.'
    stranica: Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3
    href: 'https://cyberleninka.ru/article/n/viva-la-vita-100-let-nazad-vydelen-pervyy-vitamin-b1-i-vveden-termin-vitamin'
    pometka: документ
  - summary: '<b>Опыт напечатали в 1881-м, подтвердили в 1890-м — а мир «не замечал» открытие ещё два десятка лет.</b>'
    det:
    - Диссертацию Лунина опубликовали в 1881 году в биохимическом журнале международного значения, в 1890-м его результаты подтвердили. И всё равно о них долго не вспоминали.
    src: 'Источник: Ненахов И. Г. «Николай Иванович Лунин — основатель витаминологии…» // Научно-медицинский вестник Центрального Черноземья. 2019. № 77, с. 122 — <a href="https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    otryvok: '«…результаты исследований Лунина были опубликованы в 1881 г. в биохимическом журнале международного значения, а также подтверждены в 1890 г., они долгое время оставались незамеченными».'
    stranica: Ненахов И. Г. «Николай Иванович Лунин — основатель витаминологии…» // Научно-медицинский вестник Центрального Черноземья. 2019. № 77, с. 122
    href: 'https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya'
    pometka: документ
  - summary: '<b>Первенство признал швед: в 1926-м написал, что опыт англичанина Лунин сделал «около 30 лет назад».</b>'
    det:
    - 'Шведский учёный Густав Хаммарстен в 1926 году, излагая опыты англичанина Фредерика Гопкинса, прямо написал: такие наблюдения задолго до него сделал Николай Иванович Лунин.'
    src: 'Источник: Ненахов И. Г. «Николай Иванович Лунин — основатель витаминологии…» // Научно-медицинский вестник Центрального Черноземья. 2019. № 77, с. 123 — <a href="https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    otryvok: '«…шведский ученый Густав Хаммарстен в 1926 г., излагая результаты опытов Фредерика Гопкинса, отметил, что «аналогичные наблюдения были сделаны около 30 лет назад Николаем Ивановичем Луниным»».'
    stranica: Ненахов И. Г. «Николай Иванович Лунин — основатель витаминологии…» // Научно-медицинский вестник Центрального Черноземья. 2019. № 77, с. 123
    href: 'https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya'
    pometka: документ
  - summary: '<b>Лунин понял витамины вернее иностранцев: не лекарство, а обязательная часть еды. Так и оказалось.</b>'
    det:
    - Лунин утверждал, что эти вещества — не лекарство, а естественная и необходимая часть питания. Современные исследования его взгляд полностью подтвердили.
    src: 'Источник: Ненахов И. Г. «Николай Иванович Лунин — основатель витаминологии…» // Научно-медицинский вестник Центрального Черноземья. 2019. № 77, с. 122–123 — <a href="https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    otryvok: '«…Николай Иванович утверждал, что витамины являются не лекарственными веществами, а, наоборот, … естественные и необходимые элементы питания… Взгляды Николая Ивановича Лунина полностью подтвердились современными исследованиями».'
    stranica: Ненахов И. Г. «Николай Иванович Лунин — основатель витаминологии…» // Научно-медицинский вестник Центрального Черноземья. 2019. № 77, с. 122–123
    href: 'https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya'
    pometka: документ
  - summary: '<b>Открыл витамины — а умер простым детским доктором: в 83 года, по дороге на приём в амбулаторию.</b>'
    det:
    - Николай Иванович Лунин умер в 1937 году, когда спешил на приём в амбулаторию, где тогда работал.
    src: 'Источник: Ненахов И. Г. «Николай Иванович Лунин — основатель витаминологии…» // Научно-медицинский вестник Центрального Черноземья. 2019. № 77, с. 123 — <a href="https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya" rel="noopener" target="_blank">cyberleninka.ru</a>.'
    otryvok: '«Умер Николай Иванович Лунин в 1937 г. в возрасте 83 лет, спеша на прием в амбулаторию, где он в то время работал».'
    stranica: Ненахов И. Г. «Николай Иванович Лунин — основатель витаминологии…» // Научно-медицинский вестник Центрального Черноземья. 2019. № 77, с. 123
    href: 'https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya'
    pometka: документ
  - summary: '<b>Открыв витамины, Лунин был вынужден бросить опыты — и стал детским врачом в Петербурге.</b>'
    kadr:
      src: /muzei/izobreteniya/img/01-20-bolnica-oldenburgskogo-1869.jpg
      alt: "Старая коричневатая фотография: длинное трёхэтажное светлое здание больницы с выступающим центральным корпусом и надписью под крышей, перед ним дорожка, низкий деревянный забор и откос канала"
      data_source: "https://pastvu.com/p/2474138"
      license: "право: общественное достояние (снимок 1869 г.) · pastvu.com"
      podpis: "Детская больница принца Ольденбургского на Лиговке в год открытия. Здесь Лунин работал с 1882 года и стал главным врачом; позже больница получила имя К. А. Раухфуса."
      credit: "Фото: автор не указан, 1869. Источник оцифровки: pastvu.com, фото № 2474138 (загрузил yuriT; первоисточник — vk.com/wall-998865_988777)."
      width: 1400
      height: 978
    det:
    - 'Продолжать исследования Лунину не пришлось: после диссертации он оставил биохимию и переехал в Петербург.'
    - Там он стал практическим врачом и занимался в основном детскими болезнями. Именно как детский врач, а не как открыватель витаминов, он и получил известность и уважение коллег.
    src: 'Источник: И. Г. Ненахов, «Николай Иванович Лунин — основатель витаминологии…», Научно-медицинский вестник Центрального Черноземья, 2019, № 77 — <a href="https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya" rel="noopener">cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya</a>; О. А. Громова, Педиатрическая фармакология, 2008, № 1 («Ему не пришлось продолжить исследовательскую работу. Он стал врачом-педиатром и в этом качестве приобрел известность и авторитет») — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener">cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii</a>.'
    otryvok: '«После опубликования диссертации Николай Иванович Лунин был вынужден прекратить работы по биохимии. Он переехал в Санкт-Петербург, где продолжил работать в качестве практического врача, занимаясь преимущественно педиатрией»'
    stranica: И. Г. Ненахов, «Николай Иванович Лунин — основатель витаминологии…», Научно-медицинский вестник Центрального Черноземья, 2019
    href: 'https://cyberleninka.ru/article/n/nikolay-ivanovich-lunin-osnovatel-vitaminologii-i-uchenyy-vnesshiy-znachitelnyy-vklad-v-razvitie-gigieny-pitaniya'
    pometka: два источника
  - summary: '<b>В 1934 году в Ленинграде собрали съезд по витаминам — их открывателя, жившего рядом, не позвали.</b>'
    det:
    - В 1934 году в Ленинграде прошла первая всесоюзная конференция по витаминам. Николай Лунин, который за 54 года до неё доказал, что витамины существуют, жил и работал в том же городе.
    - Организаторы об этом даже не знали — и приглашения ему не прислали. О его открытии помнили только детские врачи, а биохимики им не интересовались.
    src: 'Источник: О. А. Громова, «Исторические и современные аспекты отечественной педиатрической витаминологии», Педиатрическая фармакология, 2008, № 1 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener">cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii</a>.'
    otryvok: '«Организаторы 1-й Всесоюзной конференции по витаминам, проходившей в Ленинграде в 1934 г., не знали, что Н.И. Лунин в то время жил и работал в том же городе, и даже не пригласили его принять участие в работе конференции»'
    stranica: О. А. Громова, «Исторические и современные аспекты отечественной педиатрической витаминологии», Педиатрическая фармакология, 2008
    href: 'https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii'
    pometka: документ
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Премии, речи и детская больница
  udary:
  - summary: '<b>В 1929-м, когда премию за витамины дали другим, ученики посвятили Лунину целый номер журнала.</b>'
    det:
    - В 1929 году исполнилось 50 лет работы Лунина врачом, учёным и преподавателем. Журнал «Педиатрия» выпустил в его честь отдельный номер — целиком из статей его учеников.
    - В тот же год Нобелевскую премию за витамины получили иностранные учёные. Что их коллега когда-то первым открыл эти вещества, хорошо знали только детские врачи.
    src: 'Источник: О. А. Громова, «Исторические и современные аспекты отечественной педиатрической витаминологии», Педиатрическая фармакология, 2008, № 1 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener">cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii</a>.'
    otryvok: '«Журнал «Педиатрия» в 1929 г. посвятил 50-летнему юбилею врачебной, общественной, научной и преподавательской деятельности Н.И. Лунина отдельный номер, целиком составленный из статей его учеников. Примечательно, что только в среде педиатров было хорошо известно, какое выдающееся открытие сделал их коллега в начале своего творческого пути.»'
    stranica: О. А. Громова, «Исторические и современные аспекты отечественной педиатрической витаминологии», Педиатрическая фармакология, 2008
    href: 'https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii'
    pometka: документ
  - summary: '<b>Даже в Нобелевской речи 1929 года за витамины первооткрывателем назвали Лунина.</b>'
    det:
    - В 1929 году Нобелевскую премию за открытие витаминов вручили двум иностранным учёным. Лунина среди награждённых не было, хотя он был жив.
    - 'Но один из лауреатов, по словам историков медицины, в своей Нобелевской речи сам признал: самые первые опыты, доказавшие существование витаминов, поставил российский учёный Лунин.'
    src: 'Источник: О. А. Громова, «Исторические и современные аспекты отечественной педиатрической витаминологии», Педиатрическая фармакология, 2008, № 1 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener">cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii</a>.'
    otryvok: '«В своей Нобелевской речи Ф.Г. Хопкинс признал, что самые первые экспериментальные доказательства существования витаминов были получены российским ученым Н.И. Луниным.»'
    stranica: О. А. Громова, «Исторические и современные аспекты отечественной педиатрической витаминологии», Педиатрическая фармакология, 2008
    href: 'https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii'
    pometka: документ
  - summary: '<b>В 1937-м, в год смерти Лунина, нобелевский лауреат за витамин C назвал его своим предшественником.</b>'
    det:
    - В 1937 году Нобелевскую премию дали учёному из Венгрии — за открытие витамина C. В своей Нобелевской речи он с благодарностью перечислил российских предшественников, и первым среди них — Николая Лунина.
    - 'Это было одно из последних признаний при жизни Лунина: в том же 1937 году он умер.'
    src: 'Источник: О. А. Громова, «Исторические и современные аспекты отечественной педиатрической витаминологии», Педиатрическая фармакология, 2008, № 1 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener">cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii</a>.'
    otryvok: '«Нобелевскую премию за открытие витамина С в 1937 году дали Сент-Дъерди — личности поистине планетарного масштаба. В Нобелевской речи ученый с благодарностью перечислил своих российских предшественников — Н.И. Лунина и Н.А. Бессонова»'
    stranica: О. А. Громова, «Исторические и современные аспекты отечественной педиатрической витаминологии», Педиатрическая фармакология, 2008
    href: 'https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii'
    pometka: документ
  - summary: '<b>Детский врач Лунин написал больше 40 работ — о детских инфекциях и прививках школьникам.</b>'
    det:
    - С 1882 года Лунин работал в детской больнице принца Ольденбургского в Петербурге — позже она стала больницей имени Раухфуса.
    - 'Уйдя от мышей, он не бросил науку: опубликовал больше 40 работ о детских заразных болезнях, о том, как лечить детей, и о прививках для школьников.'
    src: 'Источник: Г. Н. Вениаминова, Т. П. Инденбом, «История больницы имени К. А. Раухфуса», Пространство и Время, 2013, № 1 (11) — <a href="https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa" rel="noopener">cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa</a>.'
    otryvok: '«Н.И. Лунин, работавший здесь с 1882 г., открыл витамины, разработал оригинальную методику исследований потребностей организма в пище, опубликовал более 40 научных работ по вопросам детских инфекций, методов лечения детских болезней, иммунизации школьников.»'
    stranica: Г. Н. Вениаминова, Т. П. Инденбом, «История больницы имени К. А. Раухфуса», Пространство и Время, 2013
    href: 'https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa'
    pometka: документ
  - summary: '<b>С 1919 года Лунин учил врачей лечить детей — возглавил кафедру педиатрии в Петрограде.</b>'
    det:
    - В 1919 году, в разгар Гражданской войны, Лунин занял кафедру детских болезней в Петроградском институте, где опытные врачи повышали квалификацию. До него кафедру вели главные врачи его же детской больницы.
    - Он также руководил Обществом детских врачей — так открыватель витаминов стал одним из главных детских докторов города.
    src: 'Источник: Г. Н. Вениаминова, Т. П. Инденбом, «История больницы имени К. А. Раухфуса», Пространство и Время, 2013, № 1 (11) (там же подпись к портрету: «председатель Общества детских врачей») — <a href="https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa" rel="noopener">cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa</a>.'
    otryvok: '«Впоследствии кафедру педиатрии там последовательно занимали его преемники на посту главного врача проф. А.А. Руссов (с 1908) и Н.И. Лунин (с 1919).»'
    stranica: Г. Н. Вениаминова, Т. П. Инденбом, «История больницы имени К. А. Раухфуса», Пространство и Время, 2013
    href: 'https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa'
    pometka: документ
