  - summary: "Лунин первым в мире поставил опыт, который потом повторил нобелевский лауреат 1929 года."
    det:
    - Диссертация Лунина — 1880 год. Позже его опыт «фактически повторил» один из двух будущих лауреатов (Ненахов, 2019). Нобелевская премия по физиологии и медицине за открытие витаминов — 1929-й. Самому Лунину её не дали.
    src: "Источник: Громова О. А. // Педиатрическая фармакология. 2008. № 1 — https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii; «Научная Россия», 31.07.2021 — https://scientificrussia.ru/articles/ih-nuzno-nemnogo-no-bez-nih-nikak."
