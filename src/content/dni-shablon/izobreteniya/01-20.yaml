return:
  q: Сколько лет прошло между опытом Лунина и появлением самого слова «витамин»?
  a: "Около 32 лет: диссертация — 1880 год, слово «витамин» — 1911–1912 годы."
  src: Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3
audioguide:
  audioSrc: audio-guide-lunin-3-ru.mp3
  durationLabel: 4 минуты 1 секунда
  lead: "Голос ведёт по залу открытия витаминов: от портрета Николая Лунина через опыт с мышами и молоком, восемь фактов дня и игру «Что ещё есть в молоке» до того, что именно он сделал первым. Семь остановок, на каждой — что искать глазами на странице."
  stops:
    - t: 0
      mark: 0:00
      title: "Портрет и четыре числа"
    - t: 31
      mark: 0:31
      title: "Искал соли"
    - t: 64
      mark: 1:04
      title: "Ученик и руководитель"
    - t: 101
      mark: 1:41
      title: "Восемь фактов"
    - t: 147
      mark: 2:27
      title: "Игра: что ещё есть в молоке"
    - t: 183
      mark: 3:03
      title: "Что сделал первым"
    - t: 210
      mark: 3:30
      title: "Сорок девять лет"
  transcript:
    - "<p>«Здравствуйте. Мы в зале открытия витаминов. Двадцатого января тысяча восемьсот пятьдесят третьего года по старому стилю в Дерпте, нынешнем Тарту, родился Николай Лунин. Там же, в Дерптском университете, он защитил диссертацию о мышах и молоке. Посмотрите на четыре числа под заголовком: тысяча восемьсот восьмидесятый год — диссертация; от одиннадцати до двадцати одного дня жили мыши на «идеальной» смеси; два с половиной месяца — здоровы на молоке; и сорок девять лет — до Нобелевской премии, которую дали другим.»</p>"
    - "<p>«Начнём с того, какую тему дали молодому врачу. Тему дали про минеральные соли: зачем они животным. Лунин взял мышей и стал кормить их тем, из чего, как тогда знала наука, состоит молоко: очищенным белком, жиром, молочным сахаром и водой. На такой смеси мыши погибали за одиннадцать — двадцать один день. А на молоке жили. Свежее молоко скисало в мисках, поэтому Лунин давал молоко, выпаренное на пару почти досуха. На нём мыши два с половиной месяца оставались здоровыми.»</p>"
    - "<p>«Дальше — спор. Руководитель лаборатории решил, что мышей травит кислота из корма, и велел добавить соду. С содой мыши жили дольше, но всё равно гибли — между шестнадцатым и тридцатым днём. Тогда Лунин добавил в смесь все соли молока, до грамма. Мыши снова погибли. И он сделал вывод: в настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна. Позже их назвали витаминами. Вывод двадцатишестилетнего Лунина не принял даже его руководитель. Прав оказался ученик: через тридцать лет опыт повторили и подтвердили.»</p>"
    - "<p>«Теперь откройте блок «Факты дня» — там восемь фактов. Вот четыре, которых нет в рассказе. Опыт Лунина напечатали в тысяча восемьсот восемьдесят первом году и подтвердили уже в тысяча восемьсот девяностом — а мир всё равно не замечал открытие ещё два десятка лет. Но первенство нашего признали даже за границей: в тысяча девятьсот двадцать шестом году шведский учёный Густав Хаммарстен написал, что такие наблюдения около тридцати лет назад уже сделал Николай Иванович Лунин. Лунин и понимал витамины вернее заграничных учёных: те считали их чем-то вроде лекарства, а он — обычной и обязательной частью еды. Так и оказалось. А умер он как простой детский доктор: в тысяча девятьсот тридцать седьмом году, в восемьдесят три года, когда спешил на приём к маленьким пациентам.»</p>"
    - "<p>«Спуститесь к игре «Что ещё есть в молоке». Вы — Николай Лунин, тысяча восемьсот восьмидесятый год. До защиты диссертации девяносто дней. Нажимайте на миски — белок, жир, сахар, соли, молоко — и собирайте корм для каждой клетки. Кнопка «Кормить тридцать дней» прогоняет время, и видно, какая мышь бодра, а какая слабеет. Руководитель будет спорить, и его возражение придётся опровергнуть опытом. Нужны три доказательства: мышь на полной смеси с солями гибнет, мышь на молоке живёт, и совет руководителя её не спасает.»</p>"
    - "<p>«Теперь найдите блок «Проверка факта». Первенство Лунина — первый в мире опыт, который показал: пища из чистых белков, жиров, углеводов и солей не поддерживает жизнь, а в натуральной еде есть неизвестные вещества, необходимые для жизни. Дерпт, тысяча восемьсот восьмидесятый год. Чего здесь нет: Лунин не выделил ни одного витамина и не дал им имени — это сделали позже. Его первенство — сама мысль, доказанная опытом.»</p>"
    - "<p>«И последняя остановка. Нобелевскую премию по физиологии и медицине за открытие витаминов дали в тысяча девятьсот двадцать девятом году — через сорок девять лет после диссертации Лунина. Самому Лунину её не дали. А само слово «витамин» появилось только в тысяча девятьсот одиннадцатом — двенадцатом годах, через тридцать два года после его опыта. Вот и весь зал. Молодой врач искал, зачем животным соли, а открыл витамины. Теперь соберите корм в игре и ответьте на вопросы викторины.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
