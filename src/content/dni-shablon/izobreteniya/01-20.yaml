quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — на мышах; 2 — молоком, выпаренным почти досуха; 3 — решил, что мышей травит кислота, и велел добавить соду; 4 — Хопкинс и Эйкман, 1929; 5 — назвал первым ясным доказательством витаминов."
  ball: 10
  voprosy:
    - q: На ком Лунин ставил свой опыт в 1880 году?
      o:
        - На курах
        - На мышах
        - На крысах
      a: 1
      e: "На мышах: они всеядные и едят почти как человек. Кур с рисом изучал Эйкман, крыс — Хопкинс, оба позже."
    - q: Чем кормили мышей, которые остались здоровыми два с половиной месяца?
      o:
        - Смесью белка, жира и сахара
        - Той же смесью с солями
        - Молоком, выпаренным почти досуха
      a: 2
      e: "Молоком, выпаренным почти досуха: свежее скисало в мисках. На смеси его «правильных» частей мыши гибли за 11–21 день."
    - q: Что посоветовал Лунину его руководитель Бунге?
      o:
        - Бросить опыт
        - "Добавить соду: он думал, мышей губит кислота"
        - Взять крыс
      a: 1
      e: Соду. Мыши с содой всё равно погибли — между 16-м и 30-м днём.
    - q: Кто получил Нобелевскую премию 1929 года за работы о витаминах?
      o:
        - Лунин
        - Хопкинс и Эйкман
        - Функ
      a: 1
      e: Англичанин Хопкинс и голландец Эйкман. Хопкинс повторил опыт Лунина на крысах в 1906–1912 годах.
    - q: Что Хопкинс сказал об опыте Лунина в Нобелевской лекции 1929 года?
      o:
        - Что опыт был ошибкой
        - Что это первое ясное доказательство витаминов
        - Ничего не сказал
      a: 1
      e: «Первое ясное, основанное на опыте доказательство» существования веществ, подобных витаминам, — так Хопкинс назвал работу школы Бунге, где опыт поставил Лунин.
