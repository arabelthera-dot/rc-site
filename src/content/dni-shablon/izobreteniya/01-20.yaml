return:
  q: Сколько лет прошло между опытом Лунина и появлением самого слова «витамин»?
  a: "Около 32 лет: диссертация — 1880 год, слово «витамин» — 1911–1912 годы."
  src: Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3
audioguide:
  audioSrc: audio-guide-lunin-3-ru.mp3
  durationLabel: около двух минут
  lead: "Голос ведёт по залу первого в мире опыта, доказавшего существование витаминов: от мышей, которым не хватило солей молока, через жизнь детского врача к поздним признаниям в Нобелевских речах."
  stops:
    - t: 0
      mark: '0:00'
      title: Искал соли
    - t: 27
      mark: '0:27'
      title: Ученик против руководителя
    - t: 55
      mark: '0:55'
      title: Детский врач
    - t: 83
      mark: '1:23'
      title: Премия другим
    - t: 114
      mark: '1:54'
      title: Признание напоследок
  transcript:
    - "Здравствуйте. Мы в зале первого в мире опыта, доказавшего существование витаминов. Николаю Лунину дали тему про минеральные соли. Он добавил мышам все соли молока в той же пропорции, что в молоке, и мыши всё равно погибли. Вывод был такой: в настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна. Позже их назвали витаминами. Диссертация Лунина датирована тысяча восемьсот восьмидесятым годом."
    - "Руководитель лаборатории искал причину смерти мышей в кислоте из корма и вывод двадцатисемилетнего Лунина не признал. Опыт напечатали в тысяча восемьсот восемьдесят первом году, подтвердили в тысяча восемьсот девяностом, но о нём долго не вспоминали. Само слово «витамин» появилось только в тысяча девятьсот одиннадцатом — двенадцатом годах, через тридцать два года после опыта. А Лунин понимал эти вещества верно: не лекарство, а необходимая часть питания."
    - После диссертации Лунин оставил биохимию и переехал в Петербург. С тысяча восемьсот восемьдесят второго года он работал в детской больнице принца Ольденбургского и получил известность именно как детский врач. Он опубликовал больше сорока работ о детских заразных болезнях и о прививках для школьников. В тысяча девятьсот девятнадцатом году, в разгар Гражданской войны, Лунин занял кафедру детских болезней в Петрограде и руководил Обществом детских врачей.
    - В тысяча девятьсот двадцать девятом году Нобелевскую премию за открытие витаминов вручили двум иностранным учёным. Лунина среди них не было, хотя он был жив. Но один из лауреатов в Нобелевской речи сам признал, что самые первые опыты поставил Лунин. В тот же год журнал «Педиатрия» выпустил в его честь номер из статей учеников. А ещё в тысяча девятьсот двадцать шестом году швед Хаммарстен написал, что такие наблюдения задолго до других сделал Лунин.
    - В тысяча девятьсот тридцать четвёртом году в Ленинграде прошла первая всесоюзная конференция по витаминам. Лунин жил в том же городе, но организаторы о нём даже не знали и не позвали его. В тысяча девятьсот тридцать седьмом году Нобелевскую премию за открытие ещё одного витамина получил учёный из Венгрии и в речи первым из российских предшественников назвал Лунина. В том же году Лунин умер в восемьдесят четыре года по дороге на приём в амбулаторию.
  note: Озвучено синтезом речи.
