  intro: Та же история коротким роликом — от мышей на идеальной смеси в Дерпте 1880 года до молока, витаминов и Нобелевской премии другим через 49 лет.
  poster: video/day-20jan-lunin-poster.jpg?v=1
  mp4: video/day-20jan-lunin.mp4?v=1
  note: "Кадры ролика — подлинные, из Госкаталога музейного фонда РФ: тушка домовой мыши (Забайкальский краевой краеведческий музей им. А. К. Кузнецова); открытка «Юрьев (Дерпт), университет» (Государственный музей истории Санкт-Петербурга); весы аптечные (Государственный музей истории Санкт-Петербурга); фарфоровая выпарительная чашка (музей-заповедник «Кузнецкая крепость»); портрет Н. И. Лунина (Государственный исторический музей); обложка книги Г. Бунге «Алкоголизм и вырождение» (Государственный музей Л. Н. Толстого). Сгенерированных нейросетью кадров нет. Закадровый текст озвучен синтезом речи."
story:
  kicker: История открытия · 4 удара
  h2: Искал соли — нашёл витамины
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Дерпт, 1880 год. Молодой врач Николай Лунин получил тему — зачем животным минеральные соли.
      det:
        - "Он взял мышей и стал кормить их тем, из чего, как тогда знала наука, состоит молоко: очищенным белком, жиром, молочным сахаром и водой."
      src: 'Источник: БСЭ, статья «Лунин Николай Иванович» — <a href="https://www.booksite.ru/fulltext/1/001/008/071/707.htm" rel="noopener" target="_blank">booksite.ru</a>.'
    - summary: На такой «идеальной» смеси мыши погибали за 11–21 день. На молоке — жили.
      det:
        - "Свежее молоко скисало в мисках, поэтому Лунин давал молоко, выпаренное на пару почти досуха. На нём мыши два с половиной месяца оставались здоровыми."
      src: 'Источник: диссертация Н. И. Лунина, Дерпт, 1880, с. 14–15 — <a href="https://archive.org/details/IA40154018_0109" rel="noopener" target="_blank">скан диссертации</a>.'
    - summary: Руководитель лаборатории решил, что мышей травит кислота, — и велел добавить соду.
      det:
        - "С содой мыши жили дольше, но всё равно гибли — между 16-м и 30-м днём."
      src: 'Источник: диссертация Н. И. Лунина, Дерпт, 1880 — <a href="https://archive.org/details/IA40154018_0109" rel="noopener" target="_blank">скан диссертации</a>.'
    - summary: Лунин добавил все соли молока до грамма. Мыши снова погибли — и он сделал вывод.
      det:
        - "В настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна. Позже их назвали витаминами."
      src: 'Источник: БСЭ, статья «Лунин Николай Иванович» — <a href="https://www.booksite.ru/fulltext/1/001/008/071/707.htm" rel="noopener" target="_blank">booksite.ru</a>.'
fakty:
  id: fakty
  nav: Факты
  kicker: Четыре факта об открытии Лунина
  h2: Факты дня
  udary:
    - summary: <b>Лунин искал, зачем животным соли, — а открыл витамины.</b>
      det:
        - "Тему дали про минеральные соли. Он добавил мышам все соли молока до грамма — и мыши всё равно погибли. Вывод: в настоящей еде есть ещё неизвестные вещества, без которых жизнь невозможна; позже их назвали витаминами."
      src: 'Источник: БСЭ, статья «Лунин Николай Иванович» — <a href="https://www.booksite.ru/fulltext/1/001/008/071/707.htm" rel="noopener" target="_blank">booksite.ru</a>; Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3 — <a href="https://cyberleninka.ru/article/n/viva-la-vita-100-let-nazad-vydelen-pervyy-vitamin-b1-i-vveden-termin-vitamin" rel="noopener" target="_blank">cyberleninka.ru</a>.'
      otryvok: "«В 1880 защитил докторскую диссертацию «О значении неорганических солей в питании животных», в которой показал, что, кроме белков, жиров, углеводов, солей и воды, для нормального развития и жизни животных (мышей) необходимы ещё особые неизвестные в то время вещества, названные позднее витаминами»."
      stranica: Большая советская энциклопедия, статья «Лунин Николай Иванович»
      href: https://www.booksite.ru/fulltext/1/001/008/071/707.htm
      pometka: два источника
    - summary: <b>Вывод 26-летнего Лунина не принял даже его руководитель — а прав оказался ученик.</b>
      det:
        - "Руководитель лаборатории искал причину смерти мышей в кислоте из корма; вывод Лунина не признал даже он. Прав оказался ученик: через тридцать лет опыт повторили — и подтвердили."
      src: 'Источник: Вениаминова Г. Н., Инденбом Т. П. «История больницы имени К. А. Раухфуса» // Пространство и Время. 2013. № 1 — <a href="https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa" rel="noopener" target="_blank">cyberleninka.ru</a>.'
      otryvok: "«Хотя вывод Лунина не получил признания (даже со стороны его руководителя…), в 1911–1913 гг. произошел прорыв в этом направлении, и за короткое время появилось значительное число работ, заложивших основы учения о витаминах»."
      stranica: Вениаминова Г. Н., Инденбом Т. П. // Пространство и Время. 2013. № 1
      href: https://cyberleninka.ru/article/n/istoriya-bolnitsy-imeni-k-a-rauhfusa
      pometka: документ
    - summary: <b>Опыт, за который в 1929 году дали Нобелевскую премию, Лунин поставил на 49 лет раньше.</b>
      det:
        - "Диссертация Лунина — 1880 год. Нобелевская премия по физиологии и медицине за открытие витаминов — 1929-й. Самому Лунину её не дали."
      src: 'Источник: Громова О. А. // Педиатрическая фармакология. 2008. № 1 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener" target="_blank">cyberleninka.ru</a>; «Научная Россия», 31.07.2021 — <a href="https://scientificrussia.ru/articles/ih-nuzno-nemnogo-no-bez-nih-nikak" rel="noopener" target="_blank">scientificrussia.ru</a>.'
      otryvok: "«Наш соотечественник — выдающийся биохимик и практикующий врач-педиатр Н.И. Лунин в 1880 г. впервые в мире обозначил обнаруженные им и присутствующие в пище в ничтожно малых количествах неизвестные вещества, как абсолютно необходимые для жизни»."
      stranica: Громова О. А. «Исторические и современные аспекты отечественной педиатрической витаминологии» // Педиатрическая фармакология. 2008. № 1
      href: https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii
      pometka: два источника
    - summary: <b>Витамины получили имя только через 32 года после того, как Лунин доказал, что они существуют.</b>
      det:
        - Само слово «витамин» появилось только в 1911–1912 годах.
      src: 'Источник: Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3 — <a href="https://cyberleninka.ru/article/n/viva-la-vita-100-let-nazad-vydelen-pervyy-vitamin-b1-i-vveden-termin-vitamin" rel="noopener" target="_blank">cyberleninka.ru</a>.'
      otryvok: "«Viva la Vita! 100 лет назад выделен первый витамин B1 и введен термин «витамин»» — заголовок статьи 2011 года."
      stranica: Кореченкова Е. «Viva la vita!» // Вопросы современной педиатрии. 2011. № 3
      href: https://cyberleninka.ru/article/n/viva-la-vita-100-let-nazad-vydelen-pervyy-vitamin-b1-i-vveden-termin-vitamin
      pometka: документ
