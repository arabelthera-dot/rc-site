fakty:
  id: fakty
  kicker: Факты дня · по диссертации 1880 года и документам
  h2: Факты дня
  udary:
    - summary: <b>Мышей спасло не свежее молоко, а почти сгущёнка.</b> Свежее молоко скисало в мисках, и мыши на нём умирали.
      det:
        - Сначала Лунин кормил мышей обычным свежим молоком. В тёплой комнате оно быстро скисало, мыши его пачкали. Все мыши умерли за несколько дней.
        - Тогда он выпарил молоко на паровой бане почти досуха. На таком молоке мыши жили. Получилось почти то, что мы сегодня покупаем в банке, — сгущённое или сухое молоко.
      src: 'Источник: N. Lunin, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», диссертация, Дерпт, 1880 (скан Internet Archive) — <a href="https://archive.org/stream/IA40154018_0109/IA40154018_0109_djvu.txt" rel="noopener" target="_blank">archive.org/details/IA40154018_0109</a>'
      otryvok: "«Zu diesem Behufe fütterte ich anfangs eine Anzahl Mäuse nur mit frischer Milch. Die Milch gerinnt aber bei Zimmertemperatur in den kleinen Gefässen sehr schnell, wozu noch die Verunreinigung derselben durch die Mäuse hinzukommt und alle Mäuse starben mir in wenigen Tagen. […] Um dem Sauerwerden der Milch vorzubeugen, dickte ich dieselbe auf dem Dampfbade fast bis zur Trockne ein und fütterte mit dieser eingetrockneten Milch die Mäuse.» (Перевод: «Для этого я сначала кормил несколько мышей только свежим молоком. Но молоко при комнатной температуре в маленьких сосудах очень быстро свёртывается, к тому же мыши его загрязняют, и все мыши умерли у меня за несколько дней. […] Чтобы молоко не скисало, я сгущал его на паровой бане почти досуха и кормил мышей этим высушенным молоком».)"
      stranica: N. Lunin, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», диссертация, Дерпт, 1880, с. 14–15 (OCR, ſ→s)
      href: https://archive.org/stream/IA40154018_0109/IA40154018_0109_djvu.txt
      pometka: документ
    - summary: <b>Здоровых мышей Лунин отпустил на волю.</b> После опыта он выпустил их на свободу бодрыми и упитанными.
      det:
        - На сгущённом молоке жили три мыши. Одна погибла на 47-й день — вскрытие показало заворот кишок. Две другие прожили в неволе два с половиной месяца, растолстели и всё время были бодрыми.
        - Когда опыты закончились, Лунин выпустил их на свободу. Об этом он сам пишет в диссертации — дважды.
      src: 'Источник: N. Lunin, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», диссертация, Дерпт, 1880 (скан Internet Archive) — <a href="https://archive.org/stream/IA40154018_0109/IA40154018_0109_djvu.txt" rel="noopener" target="_blank">archive.org/details/IA40154018_0109</a>'
      otryvok: "«Von drei Thieren, die damit gefüttert wurden, starb eines nach 47 Tagen, zeigte aber bei der Section alle Anzeichen einer Darmverschlingung; die beiden anderen lebten in der Gefangenschaft zwei und einen halben Monat, nahmen an Körperumfang bedeutend zu, blieben stets munter und wurden endlich, als ich meine Versuche einstellte, vollkommen munter, gesund und in sehr gutem Ernährungszustande in Freiheit gesetzt.» (Перевод: «Из трёх животных, которых так кормили, одно умерло через 47 дней, но при вскрытии у него были все признаки заворота кишок; два других прожили в неволе два с половиной месяца, заметно прибавили в объёме, всё время были бодры и в конце концов, когда я закончил опыты, были выпущены на свободу совершенно бодрыми, здоровыми и хорошо упитанными».)"
      stranica: N. Lunin, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», диссертация, Дерпт, 1880, с. 15 (OCR, ſ→s)
      href: https://archive.org/stream/IA40154018_0109/IA40154018_0109_djvu.txt
      pometka: документ
    - summary: "<b>Мысль о витаминах Лунин вынес на публичную защиту.</b> Одно из его положений: «Не доказано, что белков, жиров, углеводов, солей и воды достаточно»."
      det:
        - В конце диссертации напечатаны тезисы — короткие положения, которые автор отстаивает на защите перед оппонентами. Одним из оппонентов был сам Бунге.
        - Второй тезис Лунина — это идея витаминов в одной фразе. Значит, это был не случайный вывод в конце текста. Лунин открыто спорил о нём на защите.
      src: 'Источник: N. Lunin, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», диссертация, Дерпт, 1880 (скан Internet Archive) — <a href="https://archive.org/stream/IA40154018_0109/IA40154018_0109_djvu.txt" rel="noopener" target="_blank">archive.org/details/IA40154018_0109</a>'
      otryvok: "«Es ist nicht bewiesen, dass Albuminate, Fette, Kohlehydrate, Salze und Wasser zur Erhaltung des thierischen Organismus genügen.» (Перевод: «Не доказано, что белков, жиров, углеводов, солей и воды достаточно для поддержания жизни животного организма».) На титуле: «Ordentliche Opponenten: Doc. Dr. G. Bunge. — Prof. Dr. F. Hoffmann. — Prof. Dr. Vogel.»"
      stranica: N. Lunin, «Über die Bedeutung der anorganischen Salze für die Ernährung des Thieres», диссертация, Дерпт, 1880, раздел «Thesen», последняя страница (OCR, ſ→s)
      href: https://archive.org/stream/IA40154018_0109/IA40154018_0109_djvu.txt
      pometka: документ
    - summary: <b>На первую конференцию по витаминам Лунина не позвали.</b> Она шла в 1934 году в Ленинграде — в том же городе, где он работал.
      det:
        - Лунин до самой смерти в 1937 году был детским врачом в Ленинграде. Детские врачи о его открытии знали. А биохимики, которые изучали витамины, — нет.
        - Организаторы 1-й Всесоюзной конференции по витаминам не знали, что первооткрыватель живёт рядом. Его даже не пригласили.
      src: 'Источник: Громова О. А. «Исторические и современные аспекты отечественной педиатрической витаминологии» // Педиатрическая фармакология. 2008. № 1. С. 57 — <a href="https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii" rel="noopener" target="_blank">cyberleninka.ru</a>; «Как открыли витамины?», geoglob.ru — <a href="https://geoglob.ru/history/vitaminy/" rel="noopener" target="_blank">geoglob.ru/history/vitaminy</a>'
      otryvok: «Советские биохимики-витаминологи личностью Н.И. Лунина не интересовались. Организаторы 1-й Всесоюзной конференции по витаминам, проходившей в Ленинграде в 1934 г., не знали, что Н.И. Лунин в то время жил и работал в том же городе, и даже не пригласили его принять участие в работе конференции».
      stranica: Громова О. А. // Педиатрическая фармакология. 2008. № 1. С. 57
      href: https://cyberleninka.ru/article/n/istoricheskie-i-sovremennye-aspekty-otechestvennoy-pediatricheskoy-vitaminologii
      pometka: два источника
    - summary: <b>Нобелевский лауреат перепутал город Лунина.</b> Хопкинс поместил его опыт в Базель, а работа сделана в Дерпте.
      det:
        - "В Нобелевской лекции 1929 года Хопкинс написал: «школа Бунге в Базеле», 1881 год. К тому времени Бунге давно был профессором в Базеле. Но туда он переехал только в 1885 году."
        - "На титуле диссертации стоит: Императорский университет в Дерпте, 1880 год. Ошибка живёт до сих пор: в 2024 году медицинский журнал Hektoen International написал, что Лунин был «студентом в Базеле в 1881 году»."
      src: 'Источник: F. G. Hopkins. The Earlier History of Vitamin Research. Nobel Lecture, 11.12.1929 — <a href="https://www.nobelprize.org/prizes/medicine/1929/hopkins/lecture/" rel="noopener" target="_blank">nobelprize.org</a>; титул диссертации Лунина — <a href="https://archive.org/stream/IA40154018_0109/IA40154018_0109_djvu.txt" rel="noopener" target="_blank">archive.org</a>; «Liver, lime, and vitamins», Hektoen International, 04.04.2024 — <a href="https://hekint.org/2024/04/04/liver-lime-and-vitamins/" rel="noopener" target="_blank">hekint.org</a>; год переезда Бунге — «Prof. Dr. Gustav von Bunge», <a href="http://www.edimuster.ch/alkoholgeschichte/bunge.htm" rel="noopener" target="_blank">edimuster.ch</a>'
      otryvok: "Хопкинс: «…came from the school of Bunge at Basel. In 1881 Lunin, one of the workers in that school…» Титул диссертации: «…der medicinischen Facultät der Kaiserlichen Universität zu Dorpat zur öffentlichen Vertheidigung bestimmt […] Dorpat. […] 1880.» (Перевод: «…пришло из школы Бунге в Базеле. В 1881 году Лунин, один из сотрудников этой школы…»; «…предназначена к публичной защите на медицинском факультете Императорского университета в Дерпте […] Дерпт, 1880».)"
      stranica: F. G. Hopkins, Нобелевская лекция, 11.12.1929; титул диссертации Лунина, Дерпт, 1880
      href: https://www.nobelprize.org/prizes/medicine/1929/hopkins/lecture/
      pometka: два источника
razdely:
  - posle: quiz
    html: |-
      <section class="block" id="mirovoy-kontekst">
