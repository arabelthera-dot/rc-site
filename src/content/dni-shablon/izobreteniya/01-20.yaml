  h2: Что именно Лунин сделал первым
  granica: "<b>Граница первенства:</b> первый в мире опыт, который показал, что пища из чистых белков, жиров, углеводов и солей не поддерживает жизнь, и вывод: в натуральной еде есть неизвестные вещества, необходимые для жизни. Дерпт, диссертация 1880 года."
