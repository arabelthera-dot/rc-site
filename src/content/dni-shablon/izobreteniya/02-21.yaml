igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Чьё это число
  pravilo_ru: 'Что сделать сейчас: выбери число и нажми на то, что оно значит.'
  kak_igrat:
    zachem: 'У каждого числа из жизни Гамалеи — своё место: годы, дни, люди.'
    shagi:
    - Выбери число — кнопка загорится золотом.
    - Нажми на то, что оно значит. Верный выбор загорится зелёным.
    - Расставь все четыре числа — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все четыре числа на месте — +20 баллов.
  dannye:
    mesta:
    - kod: tuberkulez
      nazvanie: В столько лет Гамалея заразил себя туберкулёзом
      verno_ru: В 85 лет Гамалея заразил себя туберкулёзом, чтобы проверить своё лекарство
    - kod: krysy
      nazvanie: За столько дней Гамалея очистил Одессу от крыс
      verno_ru: 'Чума в Одессе: за 12 дней Гамалея очистил город от крыс — даже 42 парохода'
    - kod: volk
      nazvanie: Столько укушенных волком умерли у Гамалеи
      verno_ru: 'Укушенных бешеным волком у Гамалеи умирало вчетверо меньше: 7 из 44'
    - kod: vosh
      nazvanie: Год, когда Гамалея назвал вошь виновницей тифа
      verno_ru: В 1908-м Гамалея первым в мире назвал вошь виновницей сыпного тифа
    podpisi:
    - kod: n85
      tekst: 85 лет
      mesto: tuberkulez
      mimo_ru: 85 лет — столько было Гамалее, когда он заразил себя туберкулёзом.
    - kod: n12
      tekst: 12 дней
      mesto: krysy
      mimo_ru: 12 дней — за столько Гамалея очистил Одессу от крыс.
    - kod: n7iz44
      tekst: 7 из 44
      mesto: volk
      mimo_ru: 7 из 44 — столько укушенных волком умерли у Гамалеи.
    - kod: n1908
      tekst: '1908'
      mesto: vosh
      mimo_ru: 1908 — год, когда Гамалея назвал вошь виновницей сыпного тифа.
    vyberi_ru: Сначала выбери число, потом его место.
    mimo_ru: Не то место — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все числа на месте — 85 лет опыта на себе, 12 дней против чумы, 7 из 44 укушенных и 1908 год.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: 85 лет — опыт с туберкулёзом, 12 дней — Одесса без крыс, 7 из 44 — укушенные волком, 1908 — вошь и сыпной тиф.'
