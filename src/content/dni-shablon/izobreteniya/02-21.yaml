audioguide:
  audioSrc: audio-guide-gamaleya-ru.mp3
  durationLabel: около двух минут
  lead: 'Голос ведёт по залу Гамалеи: от кроликов Пастера через Одесскую станцию и чуму к опыту на себе в восемьдесят пять лет.'
  stops:
  - t: 0
    mark: 0:00
    title: Два кролика в дорогу
  - t: 35
    mark: 0:35
    title: Станция в Одессе
  - t: 70
    mark: '1:10'
    title: Двенадцать дней чумы
  - t: 105
    mark: '1:45'
    title: Опыт на себе
  transcript:
  - Пастер дал в дорогу двух заражённых кроликов — так прививка приехала в Россию.
  - 'Пастер звал Гамалею остаться в Париже — тот уехал работать в Одессу. Укушенных бешеным волком у Гамалеи умирало вчетверо меньше: семь из сорока четырёх.'
  - 'Чума в Одессе: за двенадцать дней Гамалея очистил город от крыс — даже сорок два парохода. В тысяча девятьсот восьмом Гамалея первым в мире назвал вошь виновницей сыпного тифа.'
  - Холерную вакцину Гамалея выпил сам — и жена выпила вместе с ним. В восемьдесят пять лет Гамалея заразил себя туберкулёзом, чтобы проверить своё лекарство.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
