lead:
  data: 12 июня 1886 · Одесса
  privyazka: 21 февраля — день музея; в феврале 1886 года Гамалея приехал в Париж к Пастеру, а 12 июня 1886 года по старому стилю в Одессе открылась Пастеровская станция Гамалеи.
  kto: Николай Гамалея, микробиолог
  h1: Гамалея первым в мире назвал вошь виновницей сыпного тифа · 1908
  hook: Гамалея привёз от Пастера прививку от бешенства и открыл в Одессе станцию, куда везли укушенных со всей империи
