story:
  kicker: История изобретения
  h2: Как появилась «Сетунь»
  udary:
  - summary: Свою машину вместо чужой
    det:
    - Машину МГУ не отдали из-за обиды на выборах в Академию — и Брусенцов построил свою. В чужой лаборатории до 90% ферритов шло в брак — Брусенцов нашёл схему, где работают все.
    src: 'Источник: Б. Н. Малиновский, «Творец троичной ЭВМ», Виртуальный компьютерный музей — computer-museum.ru'
  - summary: Десятый день наладки
    det:
    - Первую троичную ЭВМ мира собрали 8 вчерашних выпускников и 12 техников. «Сетунь» заработала на десятый день наладки — такого у наладчиков тех лет ещё не бывало.
    src: 'Источник: Н. П. Брусенцов, «Троичная ЭВМ «Сетунь»», Виртуальный компьютерный музей — computer-museum.ru; Б. Н. Малиновский, «Творец троичной ЭВМ», Виртуальный компьютерный музей — computer-museum.ru'
  - summary: Слишком дешева
    det:
    - 'Комиссия министерства доказывала, что машина не работает. Испытания: 98% полезного времени. Завод снял «Сетунь» с выпуска: за 27,5 тыс. рублей она была «слишком дешева».'
    src: 'Источник: Б. Н. Малиновский, «Творец троичной ЭВМ», Виртуальный компьютерный музей — computer-museum.ru'
