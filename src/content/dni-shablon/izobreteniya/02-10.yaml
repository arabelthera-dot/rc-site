quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Для викторины нужен JavaScript. Ответы: в 1904 году; 74,7 км/ч; за танки; 70; сами сани.'
  ball: 8
  voprosy:
  - q: В каком году Неждановский построил первые в мире аэросани?
    o:
    - в 1904 году
    - в 1924 году
    - в 1941 году
    a: 0
    e: Первые в мире аэросани построил русский инженер Неждановский в 1904 году.
  - q: До какой скорости Сикорский разогнал сани в 1910 году?
    o:
    - 20 км/ч
    - 74,7 км/ч
    - 200 км/ч
    a: 1
    e: Студент Сикорский в 1910 разогнал сани до 74,7 км/ч на моторе в 30 сил.
  - q: За что пленные немцы приняли аэросани?
    o:
    - за самолёты
    - за танки
    - за грузовики
    a: 1
    e: Пленные немцы приняли аэросани за танки, летящие по глубокому снегу.
  - q: Сколько аэросанных батальонов собрали за войну?
    o:
    - '7'
    - '70'
    - '700'
    a: 1
    e: За войну собрали 70 аэросанных батальонов — 2,1 тысячи машин от Москвы до Сталинграда.
  - q: Кто получил орден Красного Знамени под Кронштадтом?
    o:
    - сами сани
    - конструктор
    - завод
    a: 0
    e: Орденом Красного Знамени наградили сами аэросани, прорвавшиеся по льду в Кронштадт.
