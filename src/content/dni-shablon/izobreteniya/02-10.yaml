igra:
  mehanika: kazhdomu-svoyo-mesto
  kicker: Играй
  zagolovok: 🎮 Трое саней — три первенства
  pravilo_ru: 'Что сделать сейчас: выбери сани и нажми на то, чем они прославились.'
  kak_igrat:
    zachem: 'Аэросани прошли путь от первой модели до боевых машин: у каждых саней — своё первенство.'
    shagi:
    - Выбери сани — кнопка загорится золотом.
    - Нажми на то, чем они прославились. Верный выбор загорится зелёным.
    - Расставь все три — счётчик покажет, сколько осталось.
    nyuans: 'Нюансы: с клавиатуры — Tab до кнопки и Enter. Порядок каждый раз новый.'
    final: Все трое саней на месте — +20 баллов.
  dannye:
    mesta:
    - kod: pervye
      nazvanie: Первые в мире аэросани
      verno_ru: Первые в мире аэросани построил русский инженер Неждановский в 1904 году.
    - kod: metall
      nazvanie: Первые цельнометаллические сани
      verno_ru: Туполев сделал цельнометаллические сани АНТ-III раньше, чем свои металлические самолёты.
    - kod: u2
      nazvanie: Боевые сани с мотором от У-2
      verno_ru: Боевые сани НКЛ-26 придумал Наркомлес, а сердце им дал мотор учебного самолёта У-2.
    podpisi:
    - kod: nezhd
      tekst: Сани Неждановского, 1904
      mesto: pervye
      mimo_ru: Неждановский — тот, кто начал первым.
    - kod: ant3
      tekst: АНТ-III Туполева
      mesto: metall
      mimo_ru: Туполев проверял на санях металл для будущих самолётов.
    - kod: nkl26
      tekst: НКЛ-26
      mesto: u2
      mimo_ru: НКЛ-26 — военные сани Наркомлеса.
    vyberi_ru: Сначала выбери сани, потом первенство.
    mimo_ru: Не то первенство — попробуй другое.
    ostalos_ru: 'Осталось расставить: {n}'
    pobeda:
      soobshchenie_ru: 🏆 Все трое саней на месте — Неждановский, Туполев и Наркомлес.
      ochki: 20
    bez_skripta_ru: 'Игра работает с включённым JavaScript: сани Неждановского — первые в мире, АНТ-III — первые цельнометаллические, НКЛ-26 — боевые сани с мотором от У-2.'
