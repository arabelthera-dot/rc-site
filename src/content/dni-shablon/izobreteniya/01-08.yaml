  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "<b>Граница первенства:</b> Макаров создал первый в мире арктический ледокол — «Ермак», корабль для открытого моря и полярных льдов: сам добился денег, возглавил комиссию, которая написала требования к кораблю, принял его и повёл во льды. В строй «Ермак» вошёл в 1899 году. Центральный военно-морской музей хранит его флаг «как память о ледоколе „Ермак“ — первом линейном ледоколе мира»."
  net: "<b>Чего здесь нет:</b> Макаров не изобрёл ледокольную форму носа — её первым в мире дал портовому буксиру «Пайлот» Михаил Бритнев в Кронштадте в 1864 году (это 10 января). И корпус строили не в России: своих мощностей не было, «Ермак» построили в Ньюкасле, на верфи Армстронга, по требованиям Макарова и под надзором русских инженеров."
