return:
  q: «Я не рублю, а вползаю на лёд, весом своим пробивая проход; купцы меня в честь покорителя Сибири назвали — угадай, кто плывёт?»
  a: Ледокол «Ермак».
audioguide:
  audioSrc: audio-guide-icebreaker-ru-2.mp3
  durationLabel: около трёх минут
  lead: "Голос ведёт по залу Макарова и ледокола «Ермак»: от рыбаков, спасённых по первой радиодепеше, через запрет ходить в полярные моря к письму Папанина, которое не спасло ледокол от слома."
  stops:
    - t: 0
      mark: '0:00'
      title: Спасённые рыбаки
    - t: 34
      mark: '0:34'
      title: Три миллиона от царя
    - t: 64
      mark: '1:04'
      title: Имя и овации
    - t: 90
      mark: '1:30'
      title: Запрет на Арктику
    - t: 118
      mark: '1:58'
      title: Долгая служба
  transcript:
    - "Здравствуйте. Мы в зале первого в мире арктического ледокола «Ермак». Осенью тысяча восемьсот девяносто девятого года у острова Гогланд сел на камни броненосец «Генерал-адмирал Апраксин». Александр Попов связал остров с берегом беспроволочным телеграфом, и пятого февраля тысяча девятисотого года связь заработала. Почти сразу пришла депеша: «Ермаку» приказали спасать рыбаков, которых унесло на оторвавшейся льдине. Вечером шестого февраля ледокол вернулся с двадцатью семью спасёнными. Так радио при первом же применении спасло людей."
    - А начиналось всё с отказа. В начале тысяча восемьсот девяносто седьмого года управляющий Морским министерством адмирал Тыртов «не видел пользы» в ледоколе. Тогда Макаров пошёл к министру финансов Витте. Четырнадцатого ноября Витте получил согласие императора выделить три миллиона рублей, и уже двадцать четвёртого декабря Макаров подписал договор с верфью Армстронга в Ньюкасле. Зимой тысяча девятисотого года «Ермак» снял с камней тот самый броненосец стоимостью четыре с половиной миллиона рублей, и Тыртову пришлось благодарить Витте.
    - "Сначала Макаров хотел назвать корабль богатырским именем «Добрыня Никитич». Назвать его в честь покорителя Сибири предложили иркутские и томские купцы, и весной тысяча восемьсот девяносто восьмого года имя «Ермак» утвердил Николай Второй. Четвёртого марта тысяча восемьсот девяносто девятого года ледокол с триумфом пришёл в Кронштадт: он прошёл там, где зимой не ходило ни одно судно. Четвёртого апреля столица встретила его на Неве бурными овациями."
    - Арктика далась труднее. Менделеев не захотел работать под началом адмирала и отказался от экспедиции. Летом тысяча восемьсот девяносто девятого года «Ермак» дважды ходил к Шпицбергену и оба раза возвращался чинить корпус. Комиссия решила его «не подвергать опасностям в полярных морях». В тысяча девятьсот первом году ледокол с восьмого июля по шестое августа простоял во льдах у Новой Земли, и Николай Второй освободил Макарова от полярных плаваний.
    - "Служба «Ермака» оказалась долгой. Весной тысяча девятьсот восемнадцатого года он провёл корабли Балтийского флота из Гельсингфорса через льды в Кронштадт: путь в сто восемьдесят миль занял пять суток. Двадцать третьего сентября тысяча девятьсот сорок первого года на него налетели тридцать шесть самолётов, но капитан Михаил Сорокин увёл корабль из-под всех бомб. Иван Папанин просил сохранить ледокол как живой памятник, но в тысяча девятьсот шестьдесят четвёртом году «Ермак» отправили на слом."
  note: Озвучено синтезом речи.
