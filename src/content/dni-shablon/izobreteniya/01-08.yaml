  - posle: quiz
    html: |-
      <div class="wrap">
          <div class="gm" id="gm_tm">
            <h3>⚖️ Правда или миф</h3>
            <p style="font-weight:600;margin:0 0 12px">«"Ермак" прослужил всего несколько лет и был списан»</p>
            <div><button class="gm-btn" style="width:auto;display:inline-block;margin-right:8px" onclick="tmAns(this,false)">Правда</button><button class="gm-btn" style="width:auto;display:inline-block" onclick="tmAns(this,true)">Миф</button></div>
            <div class="gm-exp" id="tmExp">Миф. Он служил больше шестидесяти лет — до 1964 года, пережил три войны, ходил в экспедицию за папанинцами и был списан, когда уже ходил атомный ледокол «Ленин».</div>
          </div>
          <div class="gm" id="gm_vb">
            <h3>🤔 Верю — не верю</h3>
            <p style="font-weight:600;margin:0 0 12px">«Первый арктический ледокол построили в Англии по русскому заказу»</p>
            <div><button class="gm-btn" style="width:auto;display:inline-block;margin-right:8px" onclick="vbAns(this,true)">Верю</button><button class="gm-btn" style="width:auto;display:inline-block" onclick="vbAns(this,false)">Не верю</button></div>
            <div class="gm-exp" id="vbExp">Верю — правильно. Своих мощностей под такой корпус в России тогда не было: строили в Ньюкасле, на верфи Армстронга — по проекту Макарова и под надзором русских инженеров.</div>
          </div>
          <div class="gm" id="gm_char">
            <h3>🧩 Шарада</h3>
            <p style="font-style:italic;line-height:1.8;margin:0 0 12px">«Я не рублю, а вползаю на лёд,<br>весом своим пробивая проход;<br>купцы меня в честь покорителя<br>Сибири назвали — угадай, кто плывёт?»</p>
            <button class="gm-btn" style="width:auto" id="charBtn" onclick="charShow()">Показать ответ</button>
            <div class="gm-exp" id="charExp">Ледокол «Ермак».</div>
          </div>
      </div>
  - posle: quiz
    html: |-
      <section class="block" id="fork" style="background:rgba(45,140,191,.04)">
        <div class="wrap">
          <div class="kicker">Твой выбор</div>
          <h2>А как поступил бы ты?</h2>
          <p style="color:var(--muted);margin-top:0;max-width:62ch">1897 год. Чиновники снова отказали в деньгах на ледокол. Проект считают фантазией. Менделеев готов поддержать, но нужно убедить лично министра финансов Витте на встрече через неделю. Ты на месте Макарова:</p>
          <div class="fork-opt">🗣 Иду к Витте сам и кладу на стол расчёты</div>
          <div class="fork-opt">📜 Прошу Менделеева выступить первым — его имя убедительнее</div>
          <div class="fork-opt">🌐 Публикую статью в газетах — пусть общество давит на министерство</div>
          <div id="forkReal" style="display:none;margin-top:14px" class="exp"><b>Как было на самом деле.</b> Менделеев и Макаров действовали вместе: авторитет химика открыл двери, точные расчёты адмирала убедили министерство. Витте дал деньги. «Ермак» построили в Ньюкасле и в 1899 году он уже спасал суда из ледового плена Финского залива. Союз учёного и практика сработал там, где одиночные обращения терпели неудачу.</div>
        </div>
      </section>
  - posle: quiz
    html: |-
      <section class="block" id="chat-sec">
