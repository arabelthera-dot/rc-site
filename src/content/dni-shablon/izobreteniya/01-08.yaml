      <section class="block" id="more">
        <div class="wrap">
          <div class="kicker">Не только «Ермак»</div>
          <h2>Другие изобретения Макарова</h2>
          <div class="card"><b style="color:var(--gold-l)">Первая успешная торпедная атака в истории</b><p style="margin:6px 0 0">Ночь на 14 (26) января 1878 года, русско-турецкая война. Катера «Чесма» и «Синоп» с парохода Макарова «Великий князь Константин» торпедами потопили у Батума турецкий сторожевой корабль «Интибах» — первое в истории успешное боевое применение торпеды.</p></div>
          <div class="card"><b style="color:var(--gold-l)">Пластырь для заделки пробоин</b><p style="margin:6px 0 0">Сворачивался в рулон, заводился снаружи борта. Принцип используется в флоте до сих пор.</p></div>
          <div class="card"><b style="color:var(--gold-l)">«Макаровский колпачок»</b><p style="margin:6px 0 0">Мягкий наконечник бронебойного снаряда — снижает рикошет. Принят на вооружение уже после гибели адмирала.</p></div>
          <div class="card"><b style="color:var(--gold-l)">Батометр и теория непотопляемости</b><p style="margin:6px 0 0">Прибор для взятия проб воды на глубине + фундаментальный труд по непотопляемости кораблей. Плюс открытие двух течений в Босфоре.</p></div>
        </div>
      </section>
  - posle: pervenstvo
    html: |-
      <section class="block" id="theme-inventions" style="background:rgba(201,168,76,.03);border-top:1px solid rgba(201,168,76,.15)">
        <div class="wrap">
