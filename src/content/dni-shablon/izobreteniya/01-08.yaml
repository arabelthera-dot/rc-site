story:
  kicker: История изобретения
  h2: «К Северному полюсу — напролом!»
  abzacy:
    - |-
      <div class="article collapsed" id="article">
            <div class="body" id="articleBody">
      <p><b>30 марта 1897 года, Петербург.</b> Мраморный дворец, экстренное заседание Географического общества; в зале — члены императорской фамилии и сановники. Первую часть лекции читает Ф. Ф. Врангель, вторую — вице-адмирал Степан Макаров, и название у неё дерзкое: «К Северному полюсу — напролом!» Идея, которую он вбивает в головы чиновников: не обходить полярные льды, а ломать их специально построенным кораблём и идти напрямик, через макушку планеты. Зал аплодирует. Министерства — отказывают.</p>
    - "<p><b>Кто этот человек.</b> Макаров родился 8 января 1849 года в Николаеве, в небогатой семье — отец выслужился из простых матросов, знатной родословной за сыном не стояло. Всего добился головой и трудом, за что его звали «Леонардо русского флота»: боевой адмирал, учёный-океанограф и изобретатель в одном лице. Любил повторять: «В море я у себя дома, а на берегу — в гостях». Флоту оставил завет, ставший крылатым: «Помни войну» — будь готов даже в самый мирный день.</p>"
    - "<p><b>В чём была загвоздка.</b> Ледоколы в конце XIX века уже существовали — маленькие, портовые: расчищали гавани, кололи лёд толщиной в десятки сантиметров. Но Арктика — это лёд в два метра и поля на сотни вёрст. Корабля, способного работать в таком льду, не было ни у одной державы мира — и большинство инженеров считало, что построить его невозможно.</p>"
    - "<p><b>Как родилась идея — и кто помог.</b> Проект считали фантазией, денег не давали. И тут на сцену выходит неожиданный союзник — Дмитрий Менделеев. Да, тот самый. Великий химик сам грезил Арктикой и помог Макарову убедить всесильного министра финансов Витте: деньги на постройку дали.</p>"
    - <p><b>Что придумал Макаров.</b> «Ермак» не режет лёд как нож — он вползает на него скошенным носом и продавливает собственным весом. Корпус — яйцевидного сечения, чтобы льды не раздавили, а выталкивали судно вверх; обшивка в ледовом поясе — дюймовая сталь. Заказ разместили в Англии, на верфи Армстронга в Ньюкасле — своих мощностей под такой корпус ещё не было. Строили по русскому проекту, под надзором русских инженеров. 17 (29) октября 1898 года «Ермак» сошёл на воду — имя дали в честь покорителя Сибири.</p>
    - "<p><b>Первое дело.</b> Едва вступив в строй, «Ермак» занялся спасением: лютой зимой 1899 года он вызволил из льдов у Ревеля десятки застрявших пароходов, а вскоре снял с камней броненосец «Генерал-адмирал Апраксин» — заодно в этой операции впервые в истории по-настоящему поработало радио Попова: депешу о спасении передали по беспроволочному телеграфу. Потом были походы к Шпицбергену, работа во льдах, каких не видел ни один корабль мира.</p>"
    - "<p><b>Горькая часть.</b> Сам Макаров до триумфов своего детища не дожил. В 1904 году, в русско-японскую войну, его флагманский броненосец «Петропавловск» подорвался на мине под Порт-Артуром и затонул за две минуты. Вместе с адмиралом погиб художник Василий Верещагин, писавший море с мостика. Человек, который хотел пробить дорогу через лёд к полюсу, ушёл на дно тёплого южного моря. А «Ермаку» ещё и припомнили «неудачи» первых полярных походов: Макарова при жизни успели отстранить от арктических планов — чиновники сочли походы к полюсу баловством.</p>"
    - "<p><b>Финал.</b> «Ермак» прослужил больше шестидесяти лет — редкая судьба для корабля. Его звёздный час пришёлся на 1938 год: участвовал в экспедиции за папанинцами, водил караваны Северным морским путём, прошёл две мировые войны. Исключён из списков флота только в 1964-м, когда уже ходил атомный ледокол «Ленин». Сегодня Россия — единственная страна с атомным ледокольным флотом, и родословная каждого корабля в нём начинается с «Ермака».</p>"
    - |-
      <p><b>Человек — и это ещё не всё.</b> Ледокол — лишь одно из дел Макарова. Он создал первый в мире пластырь для заделки пробоин (флот пользуется принципом до сих пор) и вывел теорию непотопляемости корабля. Создал «макаровский колпачок» — мягкий наконечник бронебойного снаряда; его приняли на вооружение уже после гибели адмирала. Провёл первую в мире успешную торпедную атаку — в русско-турецкую войну, с парохода «Великий князь Константин». Доказал, что в Босфоре два течения — верхнее и нижнее. Обошёл вокруг света на корвете «Витязь» с океанографическими наблюдениями.</p>
            </div>
            <div class="more"><button class="btn ghost" id="moreBtn">Читать дальше ↓</button></div>
          </div>
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Макарове и «Ермаке»
    h2: Ледокол, который встречали как героя
    udary:
      - summary: <b>Радио Попова в первый же месяц работы отправило «Ермак» за льдиной — он привёз 27 спасённых рыбаков.</b>
        det:
          - Осенью 1899 года у острова Гогланд в Финском заливе сел на камни броненосец «Генерал-адмирал Апраксин». Чтобы руководить его спасением, Александр Попов связал остров с берегом беспроволочным телеграфом. Станции строили в сильный мороз и метель. 5 февраля 1900 года связь заработала.
          - "И почти сразу пришла депеша совсем не про броненосец: «Ермаку» приказали выйти в море на помощь рыбакам, которых унесло на оторвавшейся льдине. Вечером 6 февраля ледокол вернулся с 27 спасёнными на борту. Так радио при первом же практическом применении спасло людей."
        src: 'Источник: В. Самохин, «Памяти Александра Степановича Попова (1859–1905)», «Машиностроение и компьютерные технологии», 2015 — <a href="https://cyberleninka.ru/article/n/pamyati-aleksandra-stepanovicha-popova-1859-1905" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «Одна из радиограмм предписывала ледоколу R «Ермак» выйти в открытое море для помощи рыбакам, унесенным на льдине. К вечеру 6 февраля «Ермак» вернулся с 27 рыбаками на борту.»
        stranica: В. Самохин, «Памяти Александра Степановича Попова (1859–1905)», «Машиностроение и компьютерные технологии», 2015
        href: https://cyberleninka.ru/article/n/pamyati-aleksandra-stepanovicha-popova-1859-1905
        pometka: документ
      - summary: <b>Весной 1899-го Петербург встречал ледокол овациями, будто тот вернулся с войны.</b>
        det:
          - "19 февраля 1899 года комиссия во главе с Макаровым приняла «Ермак» у английских строителей. 1 марта он вошёл во льды Финского залива, а 4 марта с триумфом прибыл в Кронштадт: ледокол прошёл там, где зимой не ходило ни одно судно."
          - "Через месяц, 4 апреля, «Ермак» ошвартовался на Неве, и жители столицы встретили его бурными овациями. Макаров ликовал: теперь, писал он, дело уже никакая «шушера» не заглушит."
        src: 'Источник: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ) — <a href="https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «4 апреля под бурные овации жителей столицы «Ермак» ошвартовался на Неве»
        stranica: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ)
        href: https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak
        pometka: документ
      - summary: <b>После первых походов в Арктику «Ермаку» официально запретили соваться в полярные моря.</b>
        det:
          - Летом 1899 года Макаров дважды водил «Ермак» к Шпицбергену, и оба раза ледокол возвращался чинить корпус в Ньюкасл. В Петербурге недруги адмирала объявили это его поражением, и министр финансов Витте прислал комиссию разбираться в аварии.
          - "Макаров настаивал: после перестройки корабль обязательно надо снова испытать в полярных льдах. Но комиссия решила, что «Ермак» лучше «не подвергать опасностям в полярных морях». В мае 1900 года его снова отправили в Ньюкасл, где переделали носовую часть."
        src: 'Источник: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ) — <a href="https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «Комиссия постановила, что представляется желательным не подвергать ледокол опасностям в полярных морях.»
        stranica: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ)
        href: https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak
        pometka: документ
      - summary: <b>Ледоколу было почти сорок лет, когда его послали в высокие широты вытаскивать из льдов три корабля.</b>
        det:
          - "В феврале 1938 года «Ермак» участвовал в экспедиции за папанинцами. Самих зимовщиков станции «Северный полюс» 19 февраля забрали ледокольные пароходы «Таймыр» и «Мурман»: льдина за 274 дня дрейфа ушла больше чем на 2500 км и у берегов Гренландии раскололась на куски."
          - А в августе того же 1938 года «Ермак» ушёл в высокие широты выводить из льдов дрейфующие ледокольные пароходы «Садко», «Малыгин» и «Георгий Седов».
        src: 'Источник: С. В. Фролов, «Роль ААНИИ в… высокоширотных плаваниях отечественных ледоколов», «Полярные чтения на ледоколе „Красин“», 2014 — <a href="https://cyberleninka.ru/article/n/rol-aanii-v-planirovanii-provedenii-i-gidrometeorologicheskom-obespechenii-vysokoshirotnyh-plavaniy-otechestvennyh-ledokolov" rel="noopener">cyberleninka.ru</a>; Н. К. Кононова, «Экспедиция „Северный полюс“ и глобальная типизация циркуляции атмосферы», «Жизнь Земли», 2017 — <a href="https://cyberleninka.ru/article/n/ekspeditsiya-severnyy-polyus-i-globalnaya-tipizatsiya-tsirkulyatsii-atmosfery" rel="noopener">cyberleninka.ru</a>.'
        otryvok: "«три рейса по выводу дрейфующих ледокольных пароходов («Садко, «Малыгин» и «Георгий Седов») из льдов: ледоколов «Ермак» в августе 1938 г.» — «Ледокольные пароходы «Таймыр» и «Мурман» сняли четвёрку зимовщиков 19 февраля 1938 г.»"
        stranica: С. В. Фролов, «Роль ААНИИ в… высокоширотных плаваниях отечественных ледоколов», «Полярные чтения на ледоколе „Красин“», 2014
        href: https://cyberleninka.ru/article/n/rol-aanii-v-planirovanii-provedenii-i-gidrometeorologicheskom-obespechenii-vysokoshirotnyh-plavaniy-otechestvennyh-ledokolov
        pometka: два источника
      - summary: <b>Сам Папанин просил сохранить «Ермак» как памятник, но ледокол всё равно отправили на слом.</b>
        det:
          - "Когда старый ледокол приговорили к уничтожению, за него вступились полярники. 23 сентября 1963 года «Правда» напечатала их письмо, первым его подписал дважды Герой Советского Союза Иван Папанин: «Ермак» должен быть сохранён как живой памятник мужества советских полярников. Через два дня «Комсомольская правда» вышла со статьёй «„Ермак“ должен жить»."
          - "В июне 1964 года учёные-полярники, среди них Трёшников и Гаккель, написали в ЦК партии и предложили сделать из корабля музей. Не помогло: в 1964 году «Ермак» отправили на слом."
        src: 'Источник: А. А. Михайлов, «Выдающиеся исследователи Арктики… и нереализованный план музеефикации ледокола „Ермак“», «Полярные чтения на ледоколе „Красин“», 2017 — <a href="https://cyberleninka.ru/article/n/vydayuschiesya-issledovateli-arktiki-e-e-shvede-m-i-belov-a-f-tryoshnikov-ya-ya-gakkel-m-e-ostrekin-i-nerealizovannyy-plan" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «орденоносный "Ермак" должен быть сохранён как живой памятник мужества, отваги, мастерства советских полярников»»
        stranica: А. А. Михайлов, «Выдающиеся исследователи Арктики… и нереализованный план музеефикации ледокола „Ермак“», «Полярные чтения на ледоколе „Красин“», 2017
        href: https://cyberleninka.ru/article/n/vydayuschiesya-issledovateli-arktiki-e-e-shvede-m-i-belov-a-f-tryoshnikov-ya-ya-gakkel-m-e-ostrekin-i-nerealizovannyy-plan
        pometka: документ
      - summary: <b>Морской министр отказал Макарову с ледоколом — а через три года «Ермак» спас флоту броненосец.</b>
        det:
          - В начале 1897 года Макаров принёс докладную записку о ледоколах управляющему Морским министерством адмиралу Тыртову. Тот отнёсся к идее отрицательно и «не видел пользы» в таком корабле.
          - Зимой 1900 года «Ермак» снял с камней у Гогланда броненосец «Генерал-адмирал Апраксин» стоимостью 4,5 миллиона рублей. И Тыртову пришлось благодарить министра финансов Витте за то, что тот отдал «Ермак» в распоряжение флота.
        src: 'Источник: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ) — <a href="https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «Тыртов отрицательно отнесся к идее Макарова» — «при помощи ледокола «Ермак» был спасён броненосец «Генерал-адмирал Апраксин» стоимостью в 4,5 млн. рублей. Адмирал П. П. Тыртов, который ещё не так давно «не видел пользы» в строительстве ледокола, теперь вынужден был благодарить Витте»
        stranica: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ)
        href: https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak
        pometka: документ
      - summary: <b>Царь дал на ледокол 3 миллиона рублей — и через сорок дней Макаров подписал договор на постройку.</b>
        det:
          - Флот денег не дал, и Макаров пошёл к министру финансов Витте. Тот собрал комиссию, которая писала требования к будущему кораблю; председателем назначили самого Макарова, в комиссию вошёл Менделеев.
          - 14 ноября 1897 года Витте получил согласие императора выделить на ледокол 3 миллиона рублей. Уже 24 декабря Макаров подписал договор на постройку с верфью Армстронга в Ньюкасле — своей верфи под такой корпус в России тогда не было.
        src: 'Источник: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ) — <a href="https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «14 ноября 1897 г. С. Ю. Витте получил согласие императора на ассигнование 3 млн. руб. для постройки ледокола. 24 декабря 1897 г. Макаров подписал с фирмой Армстронга в Ньюкасле (Англия) договор на постройку ледокола»
        stranica: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ)
        href: https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak
        pometka: документ
      - summary: <b>За месяц до первого полярного похода учёные во главе с Менделеевым отказались плыть с Макаровым.</b>
        det:
          - "Менделеев помог Макарову получить деньги на ледокол и сам собирался в Арктику. Но работать под началом адмирала он не захотел: по словам их общего друга Врангеля, Менделеев «не допускал мысли», что окажется в зависимом положении."
          - В апреле 1899 года Макаров, «бледный от волнения», сообщил Врангелю, что Менделеев и его учёные отказываются от экспедиции. Врангель ездил мирить их, но не помирил. Летом Макаров повёл «Ермак» к Шпицбергену с небольшой группой учёных.
        src: 'Источник: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ) — <a href="https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «В апреле 1899 г. Макаров, «бледный от волнения», сообщил Врангелю, что Менделеев и приглашённые им учёные отказываются от участия в экспедиции»
        stranica: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ)
        href: https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak
        pometka: документ
      - summary: <b>Месяц «Ермак» простоял в ледовом плену у Новой Земли — и царь отстранил Макарова от Арктики.</b>
        det:
          - Летом 1901 года Макаров повёл ледокол к Новой Земле. С 8 июля по 6 августа «Ермак» не мог выбраться из льдов в 60 милях от берега, потом дошёл до Земли Франца-Иосифа и вернулся.
          - Плавание признали неудачным. Николай II велел впредь держать «Ермак» только на проводке судов в Балтийском море, а Макарова освободил от полярных плаваний. Мечта адмирала исследовать Арктику ледоколами была похоронена на много лет.
        src: 'Источник: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ) — <a href="https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «С 8 июля по 6 августа «Ермак» находился в ледовом плену в 60 милях к западу от Северной Сульменевой губы Новой Земли.» — «Николай II принял решение ограничить деятельность «Ермака» проводкой судов в Балтийском море и передать его в ведение Комитета по портовым делам, освободив вице-адмирала Макарова от обязанностей по «опытным плаваниям» во льдах»
        stranica: В. Г. Смирнов, «С. О. Макаров, Ф. Ф. Врангель и „Ермак“», «Полярные чтения на ледоколе „Красин“», 2014 (по документам РГАВМФ)
        href: https://cyberleninka.ru/article/n/s-o-makarov-f-f-vrangel-i-ermak
        pometka: документ
      - summary: <b>В 1918 году «Ермак» вывел Балтийский флот из Гельсингфорса через льды — и спас его от захвата.</b>
        det:
          - Весной 1918 года корабли Балтийского флота стояли в Ревеле и Гельсингфорсе, к которым подходили немецкие войска. «Ермак» проложил им путь через тяжёлые льды Финского залива в Кронштадт.
          - Каждое утро ледокол обходил все корабли и обламывал вокруг них лёд — за ночь они примерзали. Путь в 180 миль, который линкор «Полтава» обычно проходил за 14 часов, занял пять суток. Знамя «Ермака» из этого похода хранится в Центральном военно-морском музее.
        src: 'Источник: Е. В. Овсянникова (Центральный военно-морской музей), «Реликвии освоения Арктики», «Военно-исторический журнал», 2018 — <a href="https://cyberleninka.ru/article/n/relikvii-osvoeniya-arktiki" rel="noopener">cyberleninka.ru</a>; С. С. Близниченко, «Начало карьеры в РККФ флагмана И. М. Лудри: участие в Ледовом походе Балтфлота в 1918 году», 2016 — <a href="https://cyberleninka.ru/article/n/nachalo-kariery-v-rkkf-flagmana-i-m-ludri-uchastie-v-ledovom-pohode-baltflota-v-1918-godu" rel="noopener">cyberleninka.ru</a>.'
        otryvok: ««Ермак» спас Балтийский флот от захвата его неприятелем, проведя в тяжёлых льдах, покрывавших Финский залив, корабли из Ревеля в Гельсингфорс, а затем из Гельсингфорса в Кронштадт» — «Утром каждого из этих дней «Ермак» обходил все корабли, разламывая вокруг них лед, так как за ночь они примерзали к ледовой кромке.»
        stranica: Е. В. Овсянникова (Центральный военно-морской музей), «Реликвии освоения Арктики», «Военно-исторический журнал», 2018
        href: https://cyberleninka.ru/article/n/relikvii-osvoeniya-arktiki
        pometka: два источника
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Богатырское имя, бомбы и музейный флаг
    udary:
      - summary: <b>Макаров хотел назвать ледокол «Добрыней Никитичем» — имя «Ермак» предложили сибирские купцы.</b>
        det:
          - Сначала адмирал выбирал богатырское имя — «Добрыня Никитич». Обсуждали и «Добрыню», «Енисей», «Петербург».
          - Назвать корабль в честь покорителя Сибири предложили иркутские и томские купцы. Весной 1898 года имя «Ермак» утвердил Николай II.
        src: 'Источник: Я. В. Баженова (СФУ), «Ледокол „Ермак“ как риторико-имагологический феномен», «Имагология и компаративистика», 2025 — <a href="https://cyberleninka.ru/article/n/k-istorii-kommemorativnyh-proektsiy-syuzheta-o-pokorenii-sibiri-ledokol-ermak-kak-ritoriko-imagologicheskiy-fenomen" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «первоначально сам инициатор создания корабля - адмирал С.О. Макаров - предполагал назвать его «Добрыней Никитичем»» — «Дать ледоколу имя покорителя Сибири предложили иркутские и томские купцы»
        stranica: Я. В. Баженова (СФУ), «Ледокол „Ермак“ как риторико-имагологический феномен», «Имагология и компаративистика», 2025
        href: https://cyberleninka.ru/article/n/k-istorii-kommemorativnyh-proektsiy-syuzheta-o-pokorenii-sibiri-ledokol-ermak-kak-ritoriko-imagologicheskiy-fenomen
        pometka: документ
      - summary: <b>В 1941 году на «Ермак» налетели 36 немецких самолётов — и ни одна бомба в него не попала.</b>
        det:
          - Осенью 1941 года ледокол вооружили пушками и пулемётами. 23 сентября на Большом рейде Кронштадта его атаковали 36 самолётов, но капитан Михаил Сорокин увёл корабль из-под всех бомб.
          - Всю блокадную зиму «Ермак» ночами водил суда между Ленинградом и Кронштадтом с боеприпасами, углём и продуктами, а обратно вывозил раненых — под огнём немецких батарей из Стрельны и Петергофа.
        src: 'Источник: В. В. Дремлюг, «Участие ледокола „Ермак“ в героической обороне Ленинграда», «Полярные чтения на ледоколе „Красин“», 2014 — <a href="https://cyberleninka.ru/article/n/uchastie-ledokola-ermak-v-geroicheskoy-oborone-leningrada" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «23 сентября 1941 г. на Большом рейде Кронштадта «Ермак» подвергся атаке 36 немецких самолётов, однако благодаря хладнокровию и опыту капитана М. Я. Сорокина ледокол сумел уклониться от бомб и не пострадал.»
        stranica: В. В. Дремлюг, «Участие ледокола „Ермак“ в героической обороне Ленинграда», «Полярные чтения на ледоколе „Красин“», 2014
        href: https://cyberleninka.ru/article/n/uchastie-ledokola-ermak-v-geroicheskoy-oborone-leningrada
        pometka: документ
      - summary: <b>Пароход Макарова возил на борту минные катера — от них пошёл новый класс кораблей, миноносцы.</b>
        det:
          - В войну с Турцией 1877–1878 годов лейтенант Макаров превратил пассажирский пароход «Великий князь Константин» в носитель минных катеров. Ночью пароход подходил к вражескому рейду и спускал катера на воду.
          - Такие катера стали предками миноносцев. За эти походы Макаров получил Георгиевский крест, золотое оружие за храбрость и чин капитана 2-го ранга.
        src: 'Источник: Т. Н. Ясько, «Адмирал С. О. Макаров», «Россия и АТР», 1998 — <a href="https://cyberleninka.ru/article/n/admiral-s-o-makarov" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «Макаров впервые использовал против турецких кораблей минные катера, которые стали родоначальниками нового класса кораблей — миноносцев.» — «Он не раз был награжден, в том числе Георгиевским крестом, золотым оружием за храбрость»
        stranica: Т. Н. Ясько, «Адмирал С. О. Макаров», «Россия и АТР», 1998
        href: https://cyberleninka.ru/article/n/admiral-s-o-makarov
        pometka: документ
      - summary: <b>В Монако корвет Макарова «Витязь» вписали в десятку самых известных научных кораблей мира.</b>
        det:
          - В 1886–1889 годах Макаров обошёл на корвете «Витязь» вокруг света и всю дорогу мерил температуру и солёность океана на разных глубинах.
          - Его книга «„Витязь“ и Тихий океан» стала известна учёным всего мира, а на фасаде Океанографического института в Монако «Витязь» назван среди десяти самых известных кораблей-исследователей океана.
        src: 'Источник: Н. Павлов, «Адмирал Степан Осипович Макаров и исследование Тихого океана», «Известия ДВФУ», 1998 — <a href="https://cyberleninka.ru/article/n/admiral-stepan-osipovich-makarov-i-issledovanie-tihogo-okeana" rel="noopener">cyberleninka.ru</a>.'
        otryvok: «На фронтоне известного Океанографического института в Монако корабль "Витязь" назван среди десяти самых известных океанографических судов мира.»
        stranica: Н. Павлов, «Адмирал Степан Осипович Макаров и исследование Тихого океана», «Известия ДВФУ», 1998
        href: https://cyberleninka.ru/article/n/admiral-stepan-osipovich-makarov-i-issledovanie-tihogo-okeana
        pometka: документ
      - summary: <b>Флаг и буквы с борта «Ермака» военно-морской музей взял на память о «первом линейном ледоколе мира».</b>
        det:
          - В 1964 году «Ермак» исключили из списков флота и отправили на слом. Для его вещей создали особую комиссию, которая раздала их по музеям.
          - По акту 15 августа 1964 года Центральный военно-морской музей получил флаг и вымпел ледокола, буквы бортовой надписи и фонари — «как память о ледоколе „Ермак“ — первом линейном ледоколе мира». Ещё часть вещей ушла в Музей Арктики и Мурманский краеведческий музей.
        src: 'Источник: Е. В. Овсянникова (Центральный военно-морской музей), «Реликвии освоения Арктики», «Военно-исторический журнал», 2018 — <a href="https://cyberleninka.ru/article/n/relikvii-osvoeniya-arktiki" rel="noopener">cyberleninka.ru</a>.'
        otryvok: '«в ЦВММ в качестве экспонатов «для истории Отечественного флота как память о ледоколе "Ермак" — первом линейном ледоколе мира» передавались следующие предметы: Государственный флаг СССР и вымпел, под которыми ледокол ходил в последние годы, буквы бортовой надписи»'
        stranica: Е. В. Овсянникова (Центральный военно-морской музей), «Реликвии освоения Арктики», «Военно-исторический журнал», 2018
        href: https://cyberleninka.ru/article/n/relikvii-osvoeniya-arktiki
        pometka: документ
