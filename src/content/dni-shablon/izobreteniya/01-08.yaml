  q: «Я не рублю, а вползаю на лёд, весом своим пробивая проход; купцы меня в честь покорителя Сибири назвали — угадай, кто плывёт?»
  a: Ледокол «Ермак».
audioguide:
  audioSrc: audio-guide-icebreaker-ru.mp3
  durationLabel: 1 минут 25 секунд
  lead: "Голос ведёт по залу, где пахнет солью и железом: от модели с яйцевидным корпусом до льдины папанинцев. 4 остановки, на каждой — что искать глазами. Слушать можно фоном, пока читаешь статью ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Скруглённый нос «Ермака»
    - t: 23
      mark: 0:23
      title: Адмирал Макаров
    - t: 47
      mark: 0:47
      title: Первая зима и папанинцы
    - t: 66
      mark: 1:06
      title: Мина под Порт-Артуром
  transcript:
    - '<p>«Мы в зале, где пахнет солью и железом. Перед вами — модель корабля с необычным, скруглённым носом. Это "Ермак". Присмотритесь: он не режет лёд, как нож, — он на него вползает и продавливает своим весом. До него так не умел никто в мире. Корпус в сечении похож на яйцо — попробуйте раздавить яйцо льдами: они его не сомнут, а вытолкнут вверх.</p>'
    - "<p>А придумал это вот этот человек на портрете — адмирал Макаров. Сын простого матроса, выбившийся в вице-адмиралы головой и упрямством. Он говорил: к полюсу надо идти не в обход, а напролом. Над ним смеялись — пока за его мечту не вступился Дмитрий Менделеев. Да-да, тот самый, из школьной таблицы: он тоже бредил Арктикой и помог достать деньги у министра финансов.</p>"
    - "<p>Вот фотография первой зимы «Ермака»: 1899 год, Финский залив, вокруг ледокола — вереница вмёрзших пароходов, которые он выводит на чистую воду. А чуть дальше снимок 1938 года — крохотные фигурки на льдине: это папанинцы. В экспедицию за ними ходил всё тот же «Ермак», сорок лет спустя, а снимали зимовщиков со льдины ледокольные пароходы «Таймыр» и «Мурман».</p>"
    - "<p>И обратите внимание на последнюю табличку. Адмирал не дожил до славы своего корабля: в 1904-м его броненосец подорвался на мине под Порт-Артуром и затонул за две минуты. А его ледокол служил ещё почти шестьдесят лет — и списали его, только когда в море уже ходил атомоход. Переходим к следующему экспонату».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
