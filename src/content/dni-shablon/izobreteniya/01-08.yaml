          <p style="color:var(--muted)">Задай вопрос — программа ответит пересказом по источникам дня.</p>
          <div id="starters"></div>
          <div id="chatBox" style="margin:16px 0;min-height:80px"></div>
          <div style="display:flex;gap:10px;margin-top:12px">
            <input id="chatInput" type="text" placeholder="Написать вопрос..." style="flex:1;padding:12px 16px;font-size:15px">
            <button class="btn gold" onclick="sendChat()">Отправить</button>
          </div>
          <p style="font-size:12px;color:var(--muted);margin-top:8px">Ответы — пересказ по источникам дня.</p>
