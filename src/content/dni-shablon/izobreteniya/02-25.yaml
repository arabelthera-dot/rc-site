    mark: '0:34'
    title: Русское слово
  transcript:
  - До 1969 года токамаки в мире строили только в одной стране — у нас. Т-3 нагрел плазму до десяти миллионов градусов — в десять раз горячее лучших машин соперников.
  - Англичане не поверили нашим цифрам, привезли в Москву свои приборы — и намерили ещё больше. Проверив нас, американцы бросили свои установки и построили точную копию советской.
  - 'США объявили о термоядерной реакции — Арцимович доказал: нейтроны просто отражались от предметов. В разгар холодной войны губернатор Техаса сделал Арцимовича почётным гражданином штата.'
  - «Токамак» — русское слово, и так эту машину называют на всех языках мира. Сегодня в мире около двухсот токамаков — и лишь несколько машин другой схемы.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
