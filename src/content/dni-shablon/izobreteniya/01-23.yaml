quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — сколько энергии в каждом кусочке среды; 2 — шесть часов; 3 — коллекцию бабочек; 4 — в знак протеста; 5 — вращение Земли вокруг оси."
  ball: 13
  voprosy:
    - q: В формуле Умова S = w · v что означает w?
      o:
        - Вес верёвки
        - Сколько энергии в каждом кусочке среды
        - Ширину волны
      a: 1
      e: "w — плотность энергии: сколько её в каждом кусочке. v — скорость и направление, с которыми она едет. S — поток энергии."
    - q: Сколько продолжался диспут на защите Умова в 1874 году?
      o:
        - Час
        - Шесть часов
        - Три дня
      a: 1
      e: "«Диспут продолжался шесть часов»: Столетов, Слудский и Цингер выступили против самой идеи диссертации."
    - q: Что профессор Умов в 1876 году передал Зоологическому музею Московского университета?
      o:
        - Скелет мамонта
        - Свою коллекцию бабочек
        - Микроскоп
      a: 1
      e: Умов был сыном врача-коллекционера и с детства собирал природу. Свою коллекцию бабочек он отдал университету.
    - q: Почему в 1911 году Умов оставил кафедру физики, которой заведовал 15 лет?
      o:
        - Ушёл на пенсию
        - Уехал в экспедицию
        - В знак протеста, вместе с другими преподавателями
      a: 2
      e: Министр Кассо ввёл в университет полицию и снял выборное руководство. Около 130 преподавателей ушли в знак протеста, среди них — 65-летний Умов.
    - q: Что Умов показывал студентам в тёмной аудитории с верёвкой и гирей?
      o:
        - Вращение Земли вокруг оси
        - Как бьёт молния
        - Как рождается радуга
      a: 0
      e: "Маятник под потолком: «Мы присутствуем при вращении Земли вокруг оси». Плоскость качания поворачивается, потому что под ним вращается Земля."
