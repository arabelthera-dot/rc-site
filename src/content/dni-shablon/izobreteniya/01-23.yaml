pervenstvo:
  kicker: Проверка факта
  h2: Что именно здесь первое в мире
  granica: "Граница первенства: в 1874 году в докторской диссертации «Уравнения движения энергии в телах» Умов первым в мире ввёл понятия о плотности энергии в точке среды, о скорости и направлении её движения и о потоке энергии. Он составил уравнения движения энергии в твёрдых упругих и в жидких телах и показал, что волна переносит энергию целиком от точки к точке."
  net: "Чего здесь нет: Умов писал об энергии в упругих телах и жидкостях. Об электромагнитном поле в его работе 1874 года речи нет."
  kolonki:
