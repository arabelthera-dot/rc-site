story:
  kicker: История открытия
  h2: У энергии есть место, скорость и направление
  udary:
    - summary: Энергия движения сидит там, где движется частица, — значит, вместе с частицами может ехать и она.
      det:
        - «Кинетическая энергия всегда связана с движущейся частицей и находится там, где находится частица. Отсюда, естественно, возникает понятие о движении энергии». Умов «первый утвердил в науке это понятие».
      src: "Источник: НТБ ИРНИТУ, «Николай Алексеевич Умов (1846–1915)»."
    - summary: В 1874 году Умов защитил в Москве докторскую «Уравнения движения энергии в телах» — первое в мире учение о потоке энергии.
      det:
        - В ней он первым в мире ввёл понятия о скорости и направлении движения энергии, о плотности энергии в данной точке среды и о пространственной локализации потока энергии. Для любого вида энергии, считал Умов, можно ввести плотность и скорость её движения.
      src: "Источник: физфак МГУ, «Советский физик», 2005, № 1(43); НТБ ИРНИТУ."
    - summary: Волна, понял Умов, переносит энергию целиком — из одной точки в другую.
      det:
        - "Теорема Умова: «Количество энергии, проходящей через элемент поверхности тела в единицу времени, равно силе давления или натяжения, действующей на этот элемент, умноженной на скорость движения элемента»."
      src: "Источник: НТБ ИРНИТУ."
fakty:
  kicker: Десять фактов об Умове
  h2: Бабочки, протест и два миллиона золотом на науку
  udary:
    - summary: '<b>Немецкий профессор поставил Умова рядом с Гауссом: «два гениальные мыслителя».</b>'
      det:
        - Гаусс описал магнитное поле Земли формулой с 24 коэффициентами, подобранными по измерениям. Умов перевёл эти голые числа обратно в наглядную геометрическую картину.
        - Профессор Лейст назвал их двумя гениями, которые дополняют друг друга.
      src: 'Источник: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» — <a href="https://library.istu.edu/hoe/personalia/umov.pdf" rel="noopener" target="_blank">library.istu.edu/hoe/personalia/umov.pdf</a>'
      otryvok: «Гаусс исходил из геометрического представления и составил потенциальную формулу с эмпирически определяемыми 24 коэффициентами. Умов, наоборот, составил комментарий к этим коэффициентам и перевёл их опять в геометрический образ, но в совершенно новых плоскостях. Так дополняют друг друга два гениальные мыслителя Карл Фридрих Гаусс и Николай Алексеевич Умов».
      stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
      href: https://library.istu.edu/hoe/personalia/umov.pdf
      pometka: документ
    - summary: <b>Умов ушёл из университета вместе со 130 профессорами — в знак протеста.</b>
      det:
        - В 1911 году министр Кассо ввёл полицию в Московский университет и снял с постов выборное руководство. Около 130 преподавателей, почти треть, подали в отставку.
        - Среди них был 65-летний Умов, который 15 лет заведовал кафедрой физики. Он оставил кафедру и лабораторию ради принципа.
      src: 'Источники: «Физика в Московском университете 1755–1932», «Советский физик» (газета физфака МГУ), 2003, № 4(33) — <a href="https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2003/4(33)-2003/intro/" rel="noopener" target="_blank">www.phys.msu.ru/rus/about/sovphys/ISSUES-2003/4(33)-2003/intro</a>; С. Г. Морозова, «Друзья человечества, или Два миллиона золотом на российскую науку», «Химия и жизнь», 2013, № 4 — <a href="https://www.hij.ru/read/articles/earth-science/2536/" rel="noopener" target="_blank">www.hij.ru/read/articles/earth-science/2536</a>'
      otryvok: "«1911 - в знак протеста против полицейского произвола из университета ушло около 130 демократически настроенных профессоров, в том числе Умов, Лебедев…» — «В ответ более ста профессоров и доцентов прекратили чтение лекций и подали заявление об отставке. Среди них — известнейшие ученые: Н.Е.Жуковский, Н.А.Умов, П.Н.Лебедев и С.А.Чаплыгин»."
      stranica: «Физика в Московском университете 1755–1932», «Советский физик» (газета физфака МГУ), 2003, № 4(33)
      href: https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2003/4(33)-2003/intro/
      pometka: два источника
    - summary: <b>Умов придумал Физический институт МГУ — у физиков появилось своё здание.</b>
      det:
        - В 1897 году Умов, Соколов и Лебедев вместе с архитектором Быковским составили проект института.
        - В 1903 году здание открыли. Здесь проходили и научная работа, и практикум студентов.
      src: 'Источники: «Физика в Московском университете 1755–1932», «Советский физик» (газета физфака МГУ), 2003, № 4(33) — <a href="https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2003/4(33)-2003/intro/" rel="noopener" target="_blank">www.phys.msu.ru/rus/about/sovphys/ISSUES-2003/4(33)-2003/intro</a>; «Пётр Николаевич Лебедев и развитие физики в Московском университете», «Советский физик», 2016, № 6(122) — <a href="https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2016/06(122)-2016/25260/" rel="noopener" target="_blank">www.phys.msu.ru/rus/about/sovphys/ISSUES-2016/06(122)-2016/25260</a>'
      otryvok: «1903 - открытие, по инициативе Н.А. Умова, Физического института, ставшего центром научно-исследовательской работы и экспериментальной подготовки студентов физико-математического факультета». — «В 1897 году Н.А. Умов, А.П. Соколов, П.Н. Лебедев совместно с архитектором Е.М.Быковским подготовили проект Физического института. Здание института было официально открыто в 1903 году».
      stranica: «Физика в Московском университете 1755–1932», «Советский физик» (газета физфака МГУ), 2003, № 4(33)
      href: https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2003/4(33)-2003/intro/
      pometka: два источника
    - summary: <b>Купец завещал науке два миллиона золотом — устав фонда он писал вместе с Умовым.</b>
      det:
        - Купец Леденцов завещал науке почти два миллиона золотом. Правила, по которым эти деньги шли учёным, он составлял вместе с Умовым.
        - С 1910 года Умов был товарищем (заместителем) председателя общества.
      src: 'Источники: «Общество Леденцова: первый фонд поддержки научных исследований в России», ИОНХ РАН, раздел «История института» — <a href="https://igic.ras.ru/docs/History_Institute/obshestvo_ledentcova_1_fond_podderzhki_ni.pdf" rel="noopener" target="_blank">igic.ras.ru/docs/History_Institute/obshestvo_ledentcova_1_fond_podderzhki_ni.pdf</a>; С. Г. Морозова, «Друзья человечества, или Два миллиона золотом на российскую науку», «Химия и жизнь», 2013, № 4 — <a href="https://www.hij.ru/read/articles/earth-science/2536/" rel="noopener" target="_blank">www.hij.ru/read/articles/earth-science/2536</a>'
      otryvok: «Составителем проекта устава общества стал сам Х.С. Леденцов, а вместе с ним первый русский физик-теоретик Н.А. Умов». — «…имущество Леденцова (почти два миллиона золотом) было оставлено в качестве неприкосновенного капитала на цели учреждения Общества».
      stranica: "«Общество Леденцова: первый фонд поддержки научных исследований в России», ИОНХ РАН, раздел «История института»"
      href: https://igic.ras.ru/docs/History_Institute/obshestvo_ledentcova_1_fond_podderzhki_ni.pdf
      pometka: два источника
    - summary: <b>Деньги на поиск радиоактивных руд Вернадский попросил у Умова.</b>
      det:
        - В феврале 1911 года Вернадский написал Умову, что про уран и торий в земной коре почти ничего не известно. На спектроскопы он просил 3600 рублей.
        - Общество Леденцова эту сумму выделило.
      src: 'Источник: С. Г. Морозова, «Друзья человечества, или Два миллиона золотом на российскую науку», «Химия и жизнь», 2013, № 4 — <a href="https://www.hij.ru/read/articles/earth-science/2536/" rel="noopener" target="_blank">www.hij.ru/read/articles/earth-science/2536</a>'
      otryvok: "«…в феврале 1911 года он обращается за содействием к Н.А.Умову: „Наши знания в этой области (исследовании свойств природных соединений тория, урана, редких земель, благородных газов) в настоящее время в высшей степени незначительны, а между тем они должны быть положены в основу всех наших поисков радиоактивных руд…“» — «…собирался потратить запрашиваемые 3600 рублей… Общество выделило запрашиваемую сумму»."
      stranica: С. Г. Морозова, «Друзья человечества, или Два миллиона золотом на российскую науку», «Химия и жизнь», 2013, № 4
      href: https://www.hij.ru/read/articles/earth-science/2536/
      pometka: документ
    - summary: <b>На деньги общества, которое вёл Умов, в Москве построили институт — из него вырос ФИАН.</b>
      det:
        - Специальное здание на Миусской площади в Москве построили на средства Общества Леденцова. В декабре 1916 года там открыли научно-исследовательский институт. Из него вырос знаменитый ФИАН.
        - Это дело общества, где Умов был заместителем председателя. Сам Умов умер в 1915 году и открытия не застал.
      src: 'Источник: «Общество Леденцова: первый фонд поддержки научных исследований в России», ИОНХ РАН, раздел «История института» — <a href="https://igic.ras.ru/docs/History_Institute/obshestvo_ledentcova_1_fond_podderzhki_ni.pdf" rel="noopener" target="_blank">igic.ras.ru/docs/History_Institute/obshestvo_ledentcova_1_fond_podderzhki_ni.pdf</a>'
      otryvok: «…на Миусской площади в Москве на средства общества было построено специальное здание. В декабре 1916 г., уже после кончины Лебедева, здесь был открыт первый научно-исследовательский институт России — Институт биофизики и физики. В 1929 г. он был реорганизован…»
      stranica: "«Общество Леденцова: первый фонд поддержки научных исследований в России», ИОНХ РАН, раздел «История института»"
      href: https://igic.ras.ru/docs/History_Institute/obshestvo_ledentcova_1_fond_podderzhki_ni.pdf
      pometka: документ
    - summary: <b>В 64 года Умов взялся за новую теорию Эйнштейна — и написал о ней две работы.</b>
      det:
        - Теорию относительности Эйнштейн опубликовал в 1905 году. Умов написал о ней в 1910 и 1912 годах — и эти две работы стали его последними научными трудами.
      src: 'Источник: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» — <a href="https://library.istu.edu/hoe/personalia/umov.pdf" rel="noopener" target="_blank">library.istu.edu/hoe/personalia/umov.pdf</a>'
      otryvok: «В 1910 г. появилась первая работа Н. А. Умова, посвящённая теории относительности, созданной А. Эйнштейном в 1905 г. … Упомянутые две работы Н. А. Умова по теории относительности явились его лебединой песней».
      stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
      href: https://library.istu.edu/hoe/personalia/umov.pdf
      pometka: документ
    - summary: <b>Физик Умов подарил университету целую коллекцию бабочек.</b>
      det:
        - В 1876 году профессор физики передал свою коллекцию Зоологическому музею Московского университета. По отчёту университета, она заметно пополнила отдел насекомых.
        - Умов был сыном врача-коллекционера и с детства собирал природу.
      src: 'Источник: «Летопись физико-математического факультета», «Летопись Московского университета», МГУ — <a href="http://letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta" rel="noopener" target="_blank">letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta</a>'
      otryvok: «Проф. Н.А.Умов (физико-математический факультет) пожертвовал Зоологическому музею собрание бабочек, значительно обогатившее его энтомологический отдел» (по «Отчёту о состоянии и действиях имп. Московского университета за 1876 г.», с. 71).
      stranica: «Летопись физико-математического факультета», «Летопись Московского университета», МГУ
      href: http://letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta
      pometka: документ
    - summary: <b>Умов научился узнавать вещество по цвету света, который оно рассеивает.</b>
      det:
        - Умов построил особый спектроскоп. По виду спектра рассеянного света можно судить, что за вещество перед тобой.
        - Его метод взяли геологи и стали изучать минералы под микроскопом.
      src: 'Источники: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» — <a href="https://library.istu.edu/hoe/personalia/umov.pdf" rel="noopener" target="_blank">library.istu.edu/hoe/personalia/umov.pdf</a>; «Летопись физико-математического факультета», «Летопись Московского университета», МГУ — <a href="http://letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta" rel="noopener" target="_blank">letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta</a>'
      otryvok: «Н. А. Умов показал, что спектры лучей, рассеянных поверхностями различных веществ, рассматриваемые в специальный спектроскоп, построенный Н. А. Умовым, различны. Благодаря этому по виду спектра можно судить и о веществе, рассеявшем свет. … Метод Н. А. Умова нашёл применение к микроскопическому исследованию минералов». — «Им предложен метод качественного спектрального анализа цветных тел, получивший практическое применение в исследовании минералов».
      stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
