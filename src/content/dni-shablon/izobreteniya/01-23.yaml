- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Полиция, плагиат и стихи
  udary:
  - summary: "Умов решил трудную задачу — а немецкий профессор напечатал её от своего имени."
    det:
    - 'В 1875 году Умов поехал за границу и показал знаменитому немецкому физику свою работу: как растекается электрический ток по поверхности любой формы. До Умова её умели решать только для отдельных случаев — для плоскости, шара, цилиндра. Умов решил её для любой поверхности.'
    - 'Немец тут же напечатал это решение в журнале Берлинской академии наук от своего имени, как часть своей работы, а Умова лишь упомянул. Умов потом не раз жаловался на это друзьям. Его студент, писатель Андрей Белый, сказал прямо: работу Умова «почти сплагировал».'
    src: "Источники: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» (по книге «Люди русской науки», 1948) — https://library.istu.edu/hoe/personalia/umov.pdf; А. С. Илюшин, «Н. А. Умов», «Советский физик» (газета физфака МГУ), 2005, № 1(43) — https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2005/1(43)-2005/umov/."
    otryvok: «До Н. А. Умова эта задача решалась лишь для различных частных случаев. <…> Н. А. Умов дал её решение в самом общем виде. <…> Результаты, полученные Н. А. Умовым, <…> в видоизменённом изложении немедленно опубликовал в ежемесячнике Берлинской академии наук от своего имени, как часть своей работы, лишь упоминая в ней имя Н. А. Умова. Это весьма огорчило Н. А. Умова, и он не раз потом жаловался на это своим товарищам». — «…его раннюю работу о стационарном течении электричества использовал <…> в формах, нарушающих добрые нравы науки (т.е. почти сплагировал)»
    stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
    href: https://library.istu.edu/hoe/personalia/umov.pdf
    pometka: два источника
    istochnik: "library-istu-edu"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f11"
  - summary: "Студент Умов читал лекции для народа — кружок закрыла полиция."
    det:
    - 'В университете Умов вошёл в студенческий кружок: студенты читали простым людям лекции по истории, о небе и о природе. Вскоре полиция кружок закрыла.'
    - Умов не сдался и собрал новый кружок — математический. А когда стал профессором, на свои деньги выпускал научно-популярный журнал «Научное слово» — и понёс на нём немалые убытки.
    src: "Источник: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» (по книге «Люди русской науки», 1948) — https://library.istu.edu/hoe/personalia/umov.pdf."
    otryvok: «Он активно работал в студенческом кружке лекторов, организовавшем чтение лекций по истории, космографии, естественным наукам для народа. <…> Однако кружок был вскоре закрыт полицией. После этого Н. А. Умов организовал математический кружок…» — «С целью популяризации науки Н. А. Умов выпускал журнал «Научное слово», потерпев изрядные убытки на его издании».
    stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
    href: https://library.istu.edu/hoe/personalia/umov.pdf
    pometka: документ
    istochnik: "library-istu-edu"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f12"
  - summary: "Столетов громил его диссертацию, а через 22 года Умов возглавил кафедру Столетова."
    det:
    - В 1874 году на защите Умова официальным оппонентом был профессор Столетов — и он резко раскритиковал работу.
    - В 1893 году Умова пригласили из Одессы в Московский университет. А в 1896 году, после смерти Столетова, кафедру физики возглавил Умов и руководил ею 15 лет.
    src: "Источники: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» — https://library.istu.edu/hoe/personalia/umov.pdf; А. С. Илюшин, «Н. А. Умов», «Советский физик» (газета физфака МГУ), 2005, № 1(43) — https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2005/1(43)-2005/umov/; «Летопись физико-математического факультета», «Летопись Московского университета», МГУ — http://letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta."
    otryvok: «Докторская диссертация Н. А. Умова — «Уравнения движения энергии в телах» — вызывала большие споры и резкую критику со стороны официальных оппонентов — профессоров А. Г. Столетова и Ф. А. Слудского». — «С 1893 по 1911 год был профессором Московского университета, а с 1896 года, после смерти А.Г.Столетова, возглавлял кафедру физики».
    stranica: А. С. Илюшин, «Н. А. Умов», «Советский физик» (газета физфака МГУ), 2005, № 1(43)
    href: https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2005/1(43)-2005/umov/
    pometka: два источника
    istochnik: "phys-msu-4"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f13"
  - summary: "Умов усомнился в известном законе о растворах — и оказался прав."
    det:
    - С 1888 по 1891 год Умов изучал, как соль и кислоты сами расходятся по воде. Был известный закон, который это описывал, и его считали верным всегда.
    - 'Умов показал: для солёной воды и кислот закон работает, только если раствор очень слабый и везде одной температуры. Позже его возражения подтвердились. Приборы для этих опытов Умов придумал сам.'
    src: "Источник: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» (по книге «Люди русской науки», 1948) — https://library.istu.edu/hoe/personalia/umov.pdf."
    otryvok: «Н. А. Умов показывает, что в случае диффузии водного раствора поваренной соли, других солей и кислот следует усомниться в правильности этого закона. О его применимости можно говорить лишь при условии полной изотермичности среды и для очень слабых растворов. Соображения Н. А. Умова впоследствии подтвердились. Попутно он разработал ряд остроумных приборов…»
    stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
    href: https://library.istu.edu/hoe/personalia/umov.pdf
    pometka: документ
    istochnik: "library-istu-edu"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f14"
  - summary: "Студент-поэт срифмовал «шумов» и «Умов» — и профессор физики попал в стихи."
    det:
    - 'Андрей Белый, будущий знаменитый писатель, учился у Умова и окончил университет в 1903 году. Через двадцать лет он вспомнил профессора стихами: «И строгой физикой мой ум / Переполнял профессор Умов».'
    - 'В воспоминаниях Белый признался: Умов на всю жизнь приучил его «с глубоким трепетом» следить за физикой.'
    src: "Источник: А. С. Илюшин, «Н. А. Умов», «Советский физик» (газета физфака МГУ), 2005, № 1(43), с воспоминаниями Андрея Белого «На рубеже двух столетий» — https://www.phys.msu.ru/rus/about/sovphys/ISSUES-2005/1(43)-2005/umov/."
    otryvok: '«И через двадцать лет, вспоминая его, я отразил Николая Алексеевича в стихах: И было: много, много дум, И метафизики, и шумов… И строгой физикой мой ум Переполнял профессор Умов.» — «…он заставил и приучил меня на всю жизнь с глубоким трепетом прислушиваться к развитию физической мысли…»'
    stranica: А. С. Илюшин, «Н. А. Умов», «Советский физик» (газета физфака МГУ), 2005, № 1(43)
