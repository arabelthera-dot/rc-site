return:
  q: Сколько часов шёл спор на защите Умова в 1874 году?
  a: "Шесть часов: три профессора выступили против идеи, что энергия движется."
  src: НТБ ИРНИТУ, «Николай Алексеевич Умов (1846–1915)»
audioguide:
  audioSrc: "audio-guide-umov-ru-3.mp3"
  durationLabel: 4 минуты 48 секунд
  lead: "Голос ведёт по залу Николая Умова, создавшего первое в мире учение о потоке энергии: от портрета в начале страницы через шестичасовой спор и верёвку с колокольчиком до тёмной аудитории с маятником. Шесть остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь страницу."
  stops:
    - t: 0
      mark: "0:00"
      title: Портрет в начале зала
    - t: 48
      mark: "0:48"
      title: Энергия, у которой есть адрес
    - t: 106
      mark: "1:46"
      title: Шесть часов спора
    - t: 140
      mark: "2:20"
      title: Верёвка с колокольчиком
    - t: 204
      mark: "3:24"
      title: Свет выдаёт тёмную поверхность
    - t: 245
      mark: "4:05"
      title: Учитель в тёмной аудитории
  transcript:
    - "<p>«Здравствуйте. Мы в зале Николая Умова, московского физика. Посмотрите на портрет наверху страницы: седой человек с пышной бородой, тёмный сюртук, галстук-бабочка. Родился он двадцать третьего января тысяча восемьсот сорок шестого года в Симбирске. По новому стилю это четвёртое февраля. А прославило его вот что: в тысяча восемьсот семьдесят четвёртом году Умов создал первое в мире учение о потоке энергии. Энергия не сидит на месте. Она едет, как посылка: из одного места в другое, с определённой скоростью и в определённую сторону. Сегодня это звучит просто. Тогда за эту мысль пришлось шесть часов спорить с тремя профессорами. Пройдём по залу по порядку: сначала сама идея, потом спор, потом верёвка с колокольчиком, и в конце несколько историй о самом Умове.»</p>"
    - "<p>«Начнём с главной мысли. Вот как объясняет её очерк об Умове в книге «Люди русской науки» под редакцией Сергея Вавилова. Кинетическая энергия всегда связана с движущейся частицей и находится там, где находится частица. Значит, если частица движется, вместе с ней едет и энергия. Отсюда, естественно, возникает понятие о движении энергии — и Умов первым в мире утвердил его в науке. В докторской диссертации «Уравнения движения энергии в телах» он создал первое в мире учение о потоке энергии и первым в мире ввёл сразу несколько понятий: плотность энергии в данной точке среды, скорость и направление её движения, поток энергии. Для любого вида энергии, считал Умов, можно ввести плотность и скорость её движения. Он составил уравнения движения энергии в твёрдых упругих телах и в жидкостях и показал, что волна переносит энергию целиком, из одной точки в другую. Его теорема звучит так: количество энергии, которое проходит через кусочек поверхности за единицу времени, равно силе давления или натяжения на этот кусочек, умноженной на скорость его движения.»</p>"
    - "<p>«Теперь сама защита. Тысяча восемьсот семьдесят четвёртый год, Московский университет. Оппоненты — Столетов, Слудский и Цингер. Все трое выступили, как сказано в очерке об Умове, «в решительных тонах против идеи диссертации». Диспут продолжался шесть часов. Умов стоял на своём до конца и диссертацию защитил. Но этот день, по словам того же очерка, на всю жизнь оставил у него неприятное воспоминание. И ещё одна фраза оттуда, которую стоит запомнить: «Новые взгляды не могли проложить себе путь в жизнь без боя».»</p>"
    - "<p>«Спуститесь к игре «Верёвка с колокольчиком». Это модель, и она показывает мысль Умова глазами. Нажмите «Дёрнуть»: по верёвке бежит рывок, и колокольчик справа звенит. Нажмите «Глазами Умова»: в замедленном показе по верёвке едет светящийся комок. Это и есть энергия рывка. Обратите внимание: сама верёвка никуда не едет. Едет только энергия. А теперь «Прижать пальцем»: палец прижимает верёвку посередине, и колокольчик молчит. Посылка до него не доехала, значит, звон и правда приезжал по верёвке. Под игрой написана формула: эс равно дубль-вэ, умноженное на вэ. Дубль-вэ — сколько энергии в каждом кусочке верёвки, в игре это толщина светящегося сгустка. Вэ — скорость и направление, это стрелка. Их произведение — поток энергии, вектор Умова: сколько энергии и куда проходит за секунду. И одна деталь, в которую трудно поверить: энергия волны растёт как квадрат размаха. Дёрнешь вдвое сильнее — к колокольчику поедет вчетверо больше энергии.»</p>"
    - "<p>«Следующая остановка — свет. Умов заметил: белые матовые поверхности свет деполяризуют, то есть лишают его колебания определённого направления. А у тёмных, поглощающих поверхностей отражённый свет оказывается поляризованным. Важен даже цвет: красное сукно деполяризует красные лучи и поляризует зелёные. На этом Умов построил свой метод спектрального анализа матовых поверхностей. И закон Умова работает до сих пор. Астероид не потрогать, но по его свету можно узнать, насколько он тёмный. В работе Института космических исследований Российской академии наук две тысячи двадцать третьего года альбедо астероида оценивают по максимуму поляризации, по закону Умова.»</p>"
    - "<p>«И последняя остановка — сам человек. Внизу зала фотография: Николай Умов с женой Еленой Леонардовной. Её сделали в московском фотоателье Опитца, на обороте — дарственная надпись Умова, а хранится снимок в Государственном историческом музее. Об Умове-учителе вспоминал его ученик Андрей Белый. По взмаху руки Умова в физической аудитории падали все занавески, студенты оставались во мраке, и с потолка спускалась верёвка с гирей. Плоскость его качания поворачивается, потому что под ним вращается Земля. «Мы присутствуем при вращении Земли вокруг оси», — записал Андрей Белый. Вот и весь зал. Энергия едет, как посылка, — и первое в мире учение о потоке энергии создал Николай Умов.»</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
