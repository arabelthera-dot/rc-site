  - summary: "В 64 года Умов взялся за новую теорию Эйнштейна — и написал о ней две работы."
    det:
    - Теорию относительности Эйнштейн опубликовал в 1905 году. Умов написал о ней в 1910 и 1912 годах — и эти две работы стали его последними научными трудами.
    src: "Источник: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» — https://library.istu.edu/hoe/personalia/umov.pdf"
    otryvok: «В 1910 г. появилась первая работа Н. А. Умова, посвящённая теории относительности, созданной А. Эйнштейном в 1905 г. … Упомянутые две работы Н. А. Умова по теории относительности явились его лебединой песней».
    stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
    href: https://library.istu.edu/hoe/personalia/umov.pdf
    pometka: документ
    istochnik: "library-istu-edu"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f07"
  - summary: "Физик Умов подарил университету целую коллекцию бабочек."
    det:
    - В 1876 году профессор физики передал свою коллекцию Зоологическому музею Московского университета. По отчёту университета, она заметно пополнила отдел насекомых.
    - Умов был сыном врача-коллекционера и с детства собирал природу.
    src: "Источник: «Летопись физико-математического факультета», «Летопись Московского университета», МГУ — http://letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta"
    otryvok: «Проф. Н.А.Умов (физико-математический факультет) пожертвовал Зоологическому музею собрание бабочек, значительно обогатившее его энтомологический отдел» (по «Отчёту о состоянии и действиях имп. Московского университета за 1876 г.», с. 71).
    stranica: «Летопись физико-математического факультета», «Летопись Московского университета», МГУ
    href: http://letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta
    pometka: документ
    istochnik: "letopis-msu"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f08"
  - summary: "Умов научился узнавать вещество по цвету света, который оно рассеивает."
    det:
    - Умов построил особый спектроскоп. По виду спектра рассеянного света можно судить, что за вещество перед тобой.
    - Его метод взяли геологи и стали изучать минералы под микроскопом.
    src: "Источники: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» — https://library.istu.edu/hoe/personalia/umov.pdf; «Летопись физико-математического факультета», «Летопись Московского университета», МГУ — http://letopis.msu.ru/content/letopis-fiziko-matematicheskogo-fakulteta"
    otryvok: «Н. А. Умов показал, что спектры лучей, рассеянных поверхностями различных веществ, рассматриваемые в специальный спектроскоп, построенный Н. А. Умовым, различны. Благодаря этому по виду спектра можно судить и о веществе, рассеявшем свет. … Метод Н. А. Умова нашёл применение к микроскопическому исследованию минералов». — «Им предложен метод качественного спектрального анализа цветных тел, получивший практическое применение в исследовании минералов».
    stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
    href: https://library.istu.edu/hoe/personalia/umov.pdf
    pometka: два источника
    istochnik: "library-istu-edu"
    dlya_voprosa: false
    sravnenie: "net"
    id: "f09"
  - summary: "Послушать лекции физика Умова сбегались студенты всех факультетов."
    det:
    - 'Аудитория была переполнена. Законы Ньютона он «обнародовал» как событие: однажды студенты вошли и увидели гигантский плакат с аршинными буквами.'
    - Опыты он показывал «как волшебник». Его приборы до сих пор хранит физический кабинет университета.
    src: "Источник: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии» — https://library.istu.edu/hoe/personalia/umov.pdf"
    otryvok: '«Когда он читал экспериментальную или теоретическую физику, аудитория была переполнена студентами. Слушать Н. А. Умова приходили не только студенты физико-математического факультета, но и других факультетов… Опыты на лекциях он показывал с большой торжественностью, как волшебник, как маг. В физическом кабинете Московского университета сохранилась целая коллекция остроумных и поучительных „умовских“ приборов». — Андрей Белый: «…вывесил гигантский плакат с аршинными буквами („принципы или законы движения“); войдя, мы ахнули…»'
    stranica: «Николай Алексеевич Умов (1846–1915)», НТБ Иркутского национального исследовательского технического университета, серия «Персоналии»
    href: https://library.istu.edu/hoe/personalia/umov.pdf
    pometka: документ
    istochnik: "library-istu-edu"
