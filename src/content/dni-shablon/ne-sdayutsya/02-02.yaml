story:
  kicker: Подвиг
  h2: Дмитрий Овчаренко
  abzacy:
  - '13 июля 1941 года, Южный фронт, Молдавия. Пулемётчика Дмитрия Овчаренко после ранения отвели в тыл и поставили ездовым: он везёт боеприпасы для 3-й пулемётной роты, до своих четыре-пять километров. У местечка Песец повозку окружают две немецкие машины: 50 солдат и 3 офицера. Офицер выбивает у него винтовку, велит поднять руки и начинает допрос. В повозке лежит топор.'
  - Овчаренко хватает топор и убивает офицера. Три гранаты летят к машине, 21 германский солдат убит, остальные бегут. Раненого офицера он догоняет в огороде. Через две недели, 27 июля, он снова за пулемётом на высоте 239,8. За оба боя указом 9 ноября 1941 года он становится Героем Советского Союза и воюет рядовым до гибели 28 января 1945 года в Венгрии.
