    src: 'Источник: А. Пешков, «Топор войны: как солдат Овчаренко 20 немцев убил», телеканал «Звезда», 9 апреля 2020 года — https://tvzvezda.ru/news/2020491443-GVPpg.html; А. Заквасин, «„23 немца были убиты, остальные в панике бежали“: как советский солдат смог в одиночку расправиться с отрядом фашистов», RT на русском, 28 января 2018 года — https://russian.rt.com/science/article/474886-dmitrii-ovcharenko-voina-podvig'
