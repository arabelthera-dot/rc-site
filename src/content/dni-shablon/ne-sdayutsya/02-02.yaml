story:
  kicker: Подвиг
  h2: Дмитрий Овчаренко
  abzacy:
  - '13 июля 1941 года. Южный фронт, 176-я стрелковая дивизия держит оборону в Молдавии. Ездовой 3-й пулемётной роты 389-го стрелкового полка Дмитрий Овчаренко, сын сельского плотника из Овчарово, везёт от местечка Песец повозку с боеприпасами и продуктами. До роты четыре-пять километров. Навстречу выходят две немецкие машины: 50 солдат и 3 офицера. Офицер приказывает поднять руки, выбивает винтовку и начинает допрос. Немцы уверены, что перед ними пленный. В повозке лежат топор и три гранаты.'
  - Овчаренко хватает топор и одним ударом убивает офицера. Три гранаты летят к машинам, и 21 германский солдат остаётся лежать, а остальные бегут в панике. Раненого второго офицера ездовой с топором догоняет в огороде местечка Песец. Он собирает документы, карты и планшеты, сдаёт их в штаб полка и вовремя довозит груз до роты. 9 ноября 1941 года указ делает ездового Героем Советского Союза, одним из первых в этой войне. Он воюет до 28 января 1945 года и погибает у станции Шерегейеш в Венгрии.
