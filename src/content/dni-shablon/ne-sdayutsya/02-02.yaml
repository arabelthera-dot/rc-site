    href: https://statehistory.ru/701/Kak-krasnarmeets-Dmitriy-Ovcharenko-toporom-fashistov-zarubil/
    otryvok: «Когда он подрос, отец научил его владеть топором. … Один раз все село взялось за топоры. Сильно досадили кайзеровские вояки.»
    pometka: один источник
    utverzhden: '2026-11-09'
    istochnik: n4
    dlya_voprosa: false
  - id: ns-0202-v-stroj-1944
    summary: Герой 1941 года в 1944-м снова встал в строй через военкомат в Донбассе и дошёл с танковой бригадой до Венгрии.
    det:
    - В 1944 году Овчаренко призывает Чистяковский военкомат Сталинской области. Рядовым 3-й танковой бригады он погибает 28 января 1945 года у станции Шерегейеш в Венгрии.
