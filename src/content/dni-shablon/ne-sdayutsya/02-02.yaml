  - summary: <b>Пулемётчик 3-й танковой бригады Овчаренко погибает 28 января 1945 года у станции Шерегейеш в Венгрии.</b>
    det:
    - Овчаренко воюет почти до конца войны. В боях за освобождение Венгрии, у станции Шерегейеш в медье Фейер, пулемётчик 3-й танковой бригады тяжело ранен. Его жизнь обрывается 28 января 1945 года. В донесении о безвозвратных потерях записан также призыв 1944 года Чистяковским райвоенкоматом Сталинской области.
