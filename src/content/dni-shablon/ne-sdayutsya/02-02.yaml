vizual:
  imya: ovcharenko-nagradnoy-list
  vid: dokument
  kicker: Документ
  h2: Наградной лист 1941 года
  lead: Пять строк из настоящего листа, по которому Дмитрий Овчаренко стал Героем Советского Союза. Нажми — и найди их в документе.
audioguide:
  audioSrc: audio-guide-ovcharenko-ru.mp3
  durationLabel: 1 минута 55 секунд
  lead: 'Голос ведёт от повозки ездового у местечка Песец через удар топором и три гранаты — к пулемёту и Звезде Героя: пять остановок.'
  stops:
    - t: 0
      mark: '0:00'
      title: 'Ездовой у местечка Песец'
    - t: 22
      mark: '0:22'
      title: '«Руки вверх»'
    - t: 44
      mark: '0:44'
      title: 'Топор и три гранаты'
    - t: 68
      mark: '1:08'
      title: 'Довёз и доложил'
    - t: 93
      mark: '1:33'
      title: 'Звезда Героя'
  transcript:
    - 'Тринадцатое июля тысяча девятьсот сорок первого года, Южный фронт, Молдавия. Пулемётчика Дмитрия Овчаренко после ранения отводят в тыл и ставят ездовым: он возит боеприпасы роте. У местечка Песец, в четырёх-пяти километрах от своих, его повозку окружают две немецкие машины. В них пятьдесят солдат и три офицера. Офицер выбивает у Овчаренко винтовку, кричит «руки вверх» и начинает допрос. Немцы уверены, что перед ними пленный. А в повозке лежит топор.'
    - 'Топором его учил владеть отец, сельский плотник. Он рассказывал, как в тысяча девятьсот восемнадцатом году всё село взялось за топоры против кайзеровских солдат. Овчаренко хватает топор и бьёт офицера. В наградном листе Героя так и написано: «отрубил голову германскому офицеру». Три гранаты летят к машине — двадцать один немец убит, остальные бегут в панике. Раненый офицер пытается уйти, но солдат с топором догоняет его в огороде. Пятьдесят три немца против одного солдата — бежали немцы.'
    - 'Овчаренко не бросает повозку: боеприпасы и продукты он довозит до роты вовремя, а в штаб полка сдаёт карты, планшеты и схемы немецких офицеров. В роте ему сначала не верят и поднимают на смех. Политрук едет на место боя, там пересчитывают убитых, и всё подтверждается. Комбат спрашивает, какая у него просьба. Он просит одного: вернуть его в пулемётчики. Через две недели, двадцать седьмого июля, на высоте двести тридцать девять и восемь он ведёт ураганный огонь. Указом девятого ноября тысяча девятьсот сорок первого года Дмитрий Овчаренко — Герой Советского Союза. Рядовым танковой бригады он дошёл до Венгрии. Ниже — викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
