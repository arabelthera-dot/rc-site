    det:
    - Писатель и драматург Марк Колосов описывает жизнь и подвиг ездового в книге «Люди и подвиги», вышедшей в 1941 году. Страна узнаёт о бое у Песца в первые месяцы войны.
    src: 'Источник: А. Заквасин, «„23 немца были убиты, остальные в панике бежали“: как советский солдат смог в одиночку расправиться с отрядом фашистов», RT на русском, 28 января 2018 года — https://russian.rt.com/science/article/474886-dmitrii-ovcharenko-voina-podvig'
