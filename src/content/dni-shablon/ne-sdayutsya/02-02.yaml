    src: 'Источник: «Бессмертный полк. Луганск. Овчаренко Дмитрий Романович», страница Н. Марковой, 28 ноября 2016 года (цитата из наградного листа) — https://www.moypolk.ru/soldier/ovcharenko-dmitriy-romanovich-geroy-sovetskogo-soyuza; «Мой День Победы». Овчаренко Дмитрий Романович — https://www.moydenpobedy.ru/35.html'
