  - id: ns-0202-ne-poverili
    summary: В роте ему сначала не поверили и подняли на смех. Политрук съездил на место боя, и всё подтвердилось.
    det:
    - Рассказ ездового в роте принимают за выдумку. Политрук смотрит привезённые документы, берёт нескольких бойцов и едет на место боя. Там пересчитывают убитых — два офицера и 21 солдат.
    src: 'Источник: «Аргументы и факты». «Песец» с топором. Как красноармеец Овчаренко в одиночку победил 50 фашистов — https://aif.ru/society/history/pesec_s_toporom_kak_krasnoarmeec_ovcharenko_v_odinochku_pobedil_50_fashistov; телеканал «Звезда» — https://tvzvezda.ru/news/2020491443-GVPpg.html'
    stranica: «Аргументы и факты»; телеканал «Звезда»
    href: https://aif.ru/society/history/pesec_s_toporom_kak_krasnoarmeec_ovcharenko_v_odinochku_pobedil_50_fashistov
    otryvok: «Однако политрук роты, посмотрев привезенные документы, присвистнул от изумления, и, взяв несколько бойцов, отправился на место событий. Когда подсчитали убитых, выяснилось, что Дмитрий Овчаренко в этой схватке уничтожил двух немецких офицеров и 21 солдата противника.»
    pometka: два источника
    utverzhden: '2026-11-09'
    istochnik: n3
    dlya_voprosa: false
  - id: ns-0202-v-pulemetchiki
    summary: 'Комбат спросил, какая у него просьба. Он попросил одного: вернуть его в пулемётчики.'
    det:
    - После боя командир благодарит Овчаренко и спрашивает, есть ли у него просьба. Ездовой просит вернуть его в пулемётный взвод, и дальше служит пулемётчиком.
    src: 'Источник: М. Колосов, «Люди и подвиги», очерк «Поэма о топоре» — https://statehistory.ru/701/Kak-krasnarmeets-Dmitriy-Ovcharenko-toporom-fashistov-zarubil/'
