quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 53; 2 — топором; 3 — 21; 4 — в огороде; 5 — 13 и 27 июля 1941 года.'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: сколько врагов, по наградному листу, вышло против одного ездового с топором?'
    o:
    - '23'
    - '35'
    - '53'
    - '100'
    a: 2
    e: По наградному листу повозку окружили две автомашины, в которых было 50 германских солдат и 3 офицера, всего 53 человека.
  - q: Немцы выбили у Овчаренко винтовку и велели поднять руки. Чем он ответил?
    o:
    - Гранатой
    - Топором
    - Штыком
    - Сдался
    a: 1
    e: В повозке лежал топор. По наградному листу, этим топором красноармеец отрубил голову германскому офицеру.
  - q: Сколько германских солдат убили три гранаты Овчаренко?
    o:
    - '3'
    - '9'
    - '21'
    - '50'
    a: 2
    e: По наградному листу три гранаты, брошенные к машине, убили 21 германского солдата, остальные в панике бежали.
  - q: Где Овчаренко догнал раненого немецкого офицера?
    o:
    - В лесу
    - В огороде
    - У реки
    - В машине
    a: 1
    e: Раненый офицер побежал, и солдат с топором догнал его в огороде.
  - q: За какие бои Овчаренко получил Звезду Героя?
    o:
    - 22 июня 1941 года
    - 13 и 27 июля 1941 года
    - 9 ноября 1941 года
    - 28 января 1945 года
    a: 1
    e: 'Наградной лист описывает два боя: с топором 13 июля и за пулемётом на высоте 239,8 27 июля 1941 года. 9 ноября 1941 года — дата указа.'
