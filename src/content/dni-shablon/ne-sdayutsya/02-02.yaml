    otryvok: «- Есть, товарищ капитан! - ответил повозочный. - Прошу вернуть меня в пулеметный взвод.»
    pometka: один источник
    utverzhden: '2026-11-09'
    istochnik: n4
    dlya_voprosa: false
  - id: ns-0202-otec-plotnik
    summary: Топором его учил владеть отец, сельский плотник. Он же рассказывал, как в 1918 году всё село взялось за топоры против кайзеровских солдат.
    det:
    - Отец, сельский плотник, учит сына владеть топором. Долгими вечерами он рассказывает, как всё село взялось за топоры против кайзеровских солдат.
    src: 'Источник: М. Колосов, «Люди и подвиги», очерк «Поэма о топоре» — https://statehistory.ru/701/Kak-krasnarmeets-Dmitriy-Ovcharenko-toporom-fashistov-zarubil/'
