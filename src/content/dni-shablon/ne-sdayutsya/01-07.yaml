  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Четверо; 2 — В топливный бак; 3 — Лётчики Фёдор Воробьёв и Анатолий Рыбас; 4 — 26 июля 1941; 5 — В 1958 году."
  ball: 10
  voprosy:
    - q: Сколько человек было в экипаже Гастелло?
      o:
        - Один — сам командир
        - Двое
        - Четверо
        - Шестеро
      a: 2
      e: "Четверо: Гастелло, штурман Бурденюк, люковый стрелок Скоробогатый, стрелок-радист Калинин."
    - q: Куда попал зенитный снаряд?
      o:
        - В кабину пилота
        - В топливный бак
        - В хвостовое оперение
        - В бомболюк
      a: 1
      e: Снаряд попал в бензобак, самолёт загорелся — так говорит сводка Совинформбюро 1941 года.
    - q: Кто видел, как горящая машина развернулась к колонне?
      o:
        - Партизаны
        - Немецкие солдаты
        - Лётчики Фёдор Воробьёв и Анатолий Рыбас
        - Никто
      a: 2
      e: Старший лейтенант Фёдор Воробьёв и лейтенант Анатолий Рыбас видели разворот подбитого самолёта в сторону колонны.
    - q: Когда Гастелло присвоено звание Героя Советского Союза?
      o:
        - 26 июня 1941
        - 26 июля 1941
        - 9 мая 1945
        - В 1958 году
      a: 1
      e: Указом Президиума Верховного Совета СССР от 26 июля 1941 года, посмертно.
    - q: Когда наградили остальных троих членов экипажа?
      o:
        - В 1941 году
        - В 1945 году
        - В 1958 году
        - Не наградили
      a: 2
      e: Орденами Отечественной войны I степени, посмертно, в 1958 году — через семнадцать лет.
