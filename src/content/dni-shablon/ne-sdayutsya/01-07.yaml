story:
  kicker: Среда подвига
  h2: Четвёртый день войны, дорога на Минск
  abzacy:
    - Николай Гастелло родился в Москве 6 мая 1907 года, в семье рабочих; в 1924-м семья переехала в Муром. К июню 1941-го за ним уже были бои на Халхин-Голе и советско-финская война, а весной он переучился на новый дальний бомбардировщик ДБ-3Ф.
    - "С первых дней войны 207-й дальнебомбардировочный авиаполк бросают против немецких механизированных колонн, которые рвутся к Минску. Полк несёт тяжёлые потери: только 24 июня он лишился нескольких экипажей. <b>26 июня экипаж капитана Гастелло вылетает снова — бить колонну на дороге Молодечно — Радошковичи.</b>"
    - Над колонной самолёт попадает под зенитный огонь. Снаряд пробивает топливный бак, машина загорается. <b>Под крылом — занятая врагом земля, огонь растёт. Решать надо за секунды.</b>
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Николай Гастелло — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>За два дня до тарана Гастелло сбил «Юнкерс» из пулемёта, не поднимаясь в воздух.</b>
        det:
          - 24 июня 1941 года Ju-88 прошёл над аэродромом на высоте 80–100 метров и обстрелял стоянку, целясь в самолёт, где сидел Гастелло. Гастелло ответил из крупнокалиберного пулемёта и выбил правый мотор. Немец сел на вынужденную и попал в плен. В наградном листе от 25.07.1941 сказано, что за штурвалом сидел лётчик, «награждённый Гитлером… тремя крестами, в том числе железным крестом».
        src: "Источник: «Гастелло Николай Францевич», «Герои страны» (полный текст наградного листа) — https://warheroes.ru/hero/hero.asp?Hero_id=275; Белорусский государственный музей истории ВОВ, «Огненный таран экипажа Н. Ф. Гастелло» — https://www.warmuseum.by/news/hronika_pobedy/ognennyy-taran-ekipazha-n-f-gastello/"
        stranica: «Гастелло Николай Францевич», «Герои страны» (полный текст наградного листа)
        href: https://warheroes.ru/hero/hero.asp?Hero_id=275
        otryvok: «награждённый Гитлером… тремя крестами, в том числе железным крестом»
        pometka: документ
      - summary: <b>Гастелло развернул горящий бомбардировщик не к своим, а на колонну врага.</b>
        det:
          - Над дорогой Молодечно — Радошковичи зенитный снаряд пробил топливный бак, машина загорелась. Под крылом была занятая врагом земля. Старший лейтенант Фёдор Воробьёв и лейтенант Анатолий Рыбас видели, как Гастелло развернул подбитый дымящий самолёт к колонне.
        src: "Источник: «Огненный таран: как лётчик Гастелло совершил свой подвиг», «Российская газета», 26.06.2020 — https://rg.ru/2020/06/26/ognennyj-taran-letchik-gastello-sovershil-podvig-79-let-nazad.html; топливный бак — «Родина», 26.06.2026 — https://rodina-history.ru/2026/06/26/85-let-nazad-nikolaj-gastello-sovershil-svoj-znamenityj-podvig.html; Пометка: свидетельство очевидцев (Воробьёв, Рыбас), не протокол удара"
        stranica: "«Огненный таран: как лётчик Гастелло совершил свой подвиг», «Российская газета», 26.06.2020"
        href: https://rg.ru/2020/06/26/ognennyj-taran-letchik-gastello-sovershil-podvig-79-let-nazad.html
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-07-goskatalog-56785988.jpg
          alt: Бомбардировщик Ил-4 (ДБ-3Ф), 1942 — машина того же типа, что у экипажа Гастелло.
          data_source: https://goskatalog.ru/portal/#/collections?id=45962960
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Бомбардировщик Ил-4 (ДБ-3Ф), 1942 — машина того же типа, что у экипажа Гастелло.
          credit: Госкаталог музейного фонда РФ, № 45962960, Музей-заповедник героической обороны и освобождения Севастополя
          width: 1280
          height: 474
      - summary: <b>Никто из четверых не выпрыгнул из горящей машины.</b>
        det:
          - "В экипаже были капитан Николай Гастелло, лейтенанты Анатолий Бурденюк и Григорий Скоробогатый, старший сержант Алексей Калинин. «Российская газета»: «никто из его членов не попытался покинуть бомбардировщик». На месте падения поисковики нашли пряжки парашютов, «теоретически у экипажа был шанс спастись» («Родина»). Экипаж был четырёх национальностей: белорус, украинец, русский, ненец (Белорусский музей истории ВОВ)."
        src: "Источник: «Российская газета», 26.06.2020 — https://rg.ru/2020/06/26/ognennyj-taran-letchik-gastello-sovershil-podvig-79-let-nazad.html; «85 лет назад Николай Гастелло совершил свой знаменитый подвиг», «Родина», 26.06.2026 — https://rodina-history.ru/2026/06/26/85-let-nazad-nikolaj-gastello-sovershil-svoj-znamenityj-podvig.html; национальности — Белорусский государственный музей истории ВОВ — https://www.warmuseum.by/news/hronika_pobedy/ognennyy-taran-ekipazha-n-f-gastello/"
        stranica: «Российская газета», 26.06.2020
        href: https://rg.ru/2020/06/26/ognennyj-taran-letchik-gastello-sovershil-podvig-79-let-nazad.html
        otryvok: «никто из его членов не попытался покинуть бомбардировщик»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-07-goskatalog-61254385.jpg
          alt: Три фотопортрета членов экипажа Гастелло в военной форме
          data_source: https://goskatalog.ru/portal/#/collections?id=49213693
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Экипаж самолёта Героя Советского Союза Н. Ф. Гастелло: лейтенант А. А. Бурденюк, старший сержант А. А. Калинин, лейтенант Г. Н. Скоробогатый. Лист буклета, 1964 год."
          credit: Госкаталог музейного фонда РФ, № 49213693, Брянский государственный краеведческий музей
          width: 1600
          height: 1131
      - summary: <b>Экипаж Гастелло унёс с собой десятки солдат 7-й танковой дивизии вермахта.</b>
        det:
          - "По немецким документам, 26 июня на колонну 7-й танковой дивизии у деревень Мацки и Мерковичи упал советский самолёт: 29 убитых, больше сотни раненых, много разбитой техники. Самолёт, по траектории осколков, планировал, как при посадке, чтобы нанести наибольший урон колонне."
        src: "Источник: «Российская газета» («Союз. Беларусь — Россия»), 23.07.2025 — https://rg.ru/2025/07/23/ognennyj-taran.html; «СБ. Беларусь сегодня», 25.07.2025 — https://www.sb.by/articles/ognennyy-taran.html"
        stranica: «Российская газета» («Союз. Беларусь — Россия»), 23.07.2025
        href: https://rg.ru/2025/07/23/ognennyj-taran.html
        pometka: два источника
      - summary: "<b>Родители просили оставить восьмую пулю себе, а Гастелло отвечал: «Я другой выход найду».</b>"
        det:
          - "Родители просили сына не садиться на вражеской земле, а если подобьют, «семь пуль на врагов истратить, а восьмую оставить себе». Николай ответил: «Зачем я буду садиться на их территории, патроны тратить. Я другой выход найду». Слова записаны в книге 1941 года «Герой Советского Союза капитан Н. Гастелло», она есть в Президентской библиотеке."
        src: "Источник: «85 лет назад Николай Гастелло совершил свой знаменитый подвиг», «Родина», 26.06.2026 — https://rodina-history.ru/2026/06/26/85-let-nazad-nikolaj-gastello-sovershil-svoj-znamenityj-podvig.html"
        stranica: «85 лет назад Николай Гастелло совершил свой знаменитый подвиг», «Родина», 26.06.2026
        href: https://rodina-history.ru/2026/06/26/85-let-nazad-nikolaj-gastello-sovershil-svoj-znamenityj-podvig.html
        otryvok: «семь пуль на врагов истратить, а восьмую оставить себе»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-07-goskatalog-20656972.jpg
          alt: Левый форменный сапог, принадлежавший Николаю Гастелло, 1935–1941.
          data_source: https://goskatalog.ru/portal/#/collections?id=19947982
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Левый форменный сапог, принадлежавший Николаю Гастелло, 1935–1941.
          credit: Госкаталог музейного фонда РФ, № 19947982, Государственный центральный музей современной истории России
          width: 683
          height: 1024
      - summary: <b>Лётчик Скоробогатый сам напросился в вылет вместо штатного стрелка.</b>
        det:
          - Лейтенант Григорий Скоробогатый был лётчиком того же 207-го полка и напросился в боевой вылет вместо штатного стрелка, так он оказался люковым стрелком у Гастелло. Орден Отечественной войны I степени ему дали посмертно в 1958 году. Сейчас этот орден хранится в Белорусском музее истории Великой Отечественной войны.
        src: "Источник: «Гастелло Николай Францевич», «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=275; «Родина», 26.06.2026 — https://rodina-history.ru/2026/06/26/85-let-nazad-nikolaj-gastello-sovershil-svoj-znamenityj-podvig.html; Белорусский государственный музей истории ВОВ — https://www.warmuseum.by/news/hronika_pobedy/ognennyy-taran-ekipazha-n-f-gastello/"
        stranica: «Гастелло Николай Францевич», «Герои страны»
        href: https://warheroes.ru/hero/hero.asp?Hero_id=275
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-07-goskatalog-55901881.jpg
          alt: Значок с бомбардировщиком и четырьмя фамилиями экипажа Гастелло
          data_source: https://goskatalog.ru/portal/#/collections?id=6943258
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Значок к 40-летию подвига с фамилиями экипажа: Гастелло, Бурденюк, Калинин, Скоробогатый, 1981 год."
          credit: Госкаталог музейного фонда РФ, № 6943258, Музейное объединение Ненецкого автономного округа
          width: 496
          height: 296
      - summary: <b>В 1951 году у места тарана Гастелло нашли останки другого экипажа — капитана Маслова.</b>
        det:
          - "Капитан Александр Маслов был комэском того же 207-го полка и не вернулся 26 июня. При перезахоронении в 1951 году, когда останки переносили в сквер Радошковичей, нашли медальон стрелка-радиста Маслова Г. В. Реутова. Позже появилась версия, что таран совершил Маслов: на месте событий нашли обломки его бомбардировщика и останки экипажа. Указом от 2 мая 1996 года Героями России стали все четверо: Маслов, Владимир Балашов, Бахтурас Бейскбаев, Григорий Реутов."
        src: "Источник: «Российская газета», 26.06.2020 — https://rg.ru/2020/06/26/ognennyj-taran-letchik-gastello-sovershil-podvig-79-let-nazad.html; «Маслов Александр Спиридонович», «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=6774"
        stranica: «Российская газета», 26.06.2020
        href: https://rg.ru/2020/06/26/ognennyj-taran-letchik-gastello-sovershil-podvig-79-let-nazad.html
        pometka: два источника
      - summary: <b>Поисковики нашли номера двигателя и планера и доказали, где упала машина Гастелло.</b>
        det:
          - "В 2006 году поисковый батальон № 52 Министерства обороны Беларуси нашёл обломки ДБ-3Ф у деревень Мацки и Мерковичи Логойского района. Повторные раскопки группы «Авиапоиск-Борисов» дали детали с номерами двигателей и планера. Руководитель группы Владимир Балашов: «Такой самолёт прибыл в полк за четыре дня до войны». На могиле пока нет имён, ей ещё предстоит получить статус воинского захоронения."
        src: "Источник: «Российская газета» («Союз. Беларусь — Россия»), 23.07.2025 — https://rg.ru/2025/07/23/ognennyj-taran.html"
        stranica: «Российская газета» («Союз. Беларусь — Россия»), 23.07.2025
        href: https://rg.ru/2025/07/23/ognennyj-taran.html
        otryvok: «Такой самолёт прибыл в полк за четыре дня до войны»
        pometka: документ
      - summary: <b>Местные жители тайком от немцев похоронили экипаж прямо на месте падения.</b>
        det:
          - Останки четверых лётчиков крестьяне закопали тайком от оккупантов там, где упал самолёт. После войны их перезахоронили в деревне Беларучи, рядом с могилами партизан. Летом 2025 года потомки Гастелло приезжали к дубу, который, по словам «Российской газеты», «26 июня 1941 года был свидетелем подвига».
        src: "Источник: «Российская газета» («Союз. Беларусь — Россия»), 23.07.2025 — https://rg.ru/2025/07/23/ognennyj-taran.html"
        stranica: «Российская газета» («Союз. Беларусь — Россия»), 23.07.2025
        href: https://rg.ru/2025/07/23/ognennyj-taran.html
        otryvok: «26 июня 1941 года был свидетелем подвига»
        pometka: документ
      - summary: <b>Звено Гастелло на четвёртый день войны уничтожило и повредило 20 танков и бронемашин.</b>
        det:
          - 24 июня из 18 самолётов полка вернулись 8. Вечером командир полка полковник Г. В. Титов свёл всех в две эскадрильи, их получили Маслов и Гастелло. 25 июня звено Гастелло уничтожило и повредило 20 танков и бронемашин. Первый боевой вылет экипаж сделал 22 июня в 5 утра.
        src: "Источник: Белорусский государственный музей истории ВОВ, «Огненный таран экипажа Н. Ф. Гастелло» — https://www.warmuseum.by/news/hronika_pobedy/ognennyy-taran-ekipazha-n-f-gastello/"
        stranica: Белорусский государственный музей истории ВОВ, «Огненный таран экипажа Н. Ф. Гастелло»
        href: https://www.warmuseum.by/news/hronika_pobedy/ognennyy-taran-ekipazha-n-f-gastello/
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>О таране Гастелло страна узнала из сводки Совинформбюро ещё до указа о Герое.</b>
        det:
          - "«Российская газета»: в начале июля вся страна услышала сводку Советского информбюро об огненном таране, а месяц спустя Гастелло получил звание Героя. Указ о присвоении звания Героя Советского Союза посмертно подписан 26 июля 1941 года. Звезду дали только командиру, остальным троим ордена пришли лишь в 1958 году."
        src: "Источник: «Российская газета», 26.06.2020 — https://rg.ru/2020/06/26/ognennyj-taran-letchik-gastello-sovershil-podvig-79-let-nazad.html; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=275; «Родина», 26.06.2026 — https://rodina-history.ru/2026/06/26/85-let-nazad-nikolaj-gastello-sovershil-svoj-znamenityj-podvig.html"
        stranica: «Российская газета», 26.06.2020
        href: https://rg.ru/2020/06/26/ognennyj-taran-letchik-gastello-sovershil-podvig-79-let-nazad.html
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-07-goskatalog-18796278.jpg
          alt: Ноты и текст песни «Баллада о капитане Гастелло», Музгиз, 1941.
          data_source: https://goskatalog.ru/portal/#/collections?id=18579592
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Ноты и текст песни «Баллада о капитане Гастелло», Музгиз, 1941.
          credit: Госкаталог музейного фонда РФ, № 18579592, Музей Победы
          width: 570
          height: 800
      - summary: <b>Стрелку-радисту Калинину дали отпуск, но приказ вернуться догнал его в Архангельске.</b>
        det:
          - Алексей Александрович Калинин родился в 1919 году в селе Нижняя Пёша, старший сержант, стрелок-радист 4-й эскадрильи 207-го полка. Летом 1941 года ему дали отпуск, но в Архангельске его догнал приказ вернуться в часть. В письме домой он писал о присяге 12 января 1940 года и об 11 благодарностях. Орден Отечественной войны I степени он, как Бурденюк и Скоробогатый, получил посмертно только в 1958 году.
        src: "Источник: «Подвиг во имя жизни», Ненецкий окружной краеведческий музей — https://naomuseum.ru/visitors/spetsialistam/issledovatelyam/nashi-issledovaniya/podvig-vo-imya-zhizni/; «Родина», 26.06.2026 — https://rodina-history.ru/2026/06/26/85-let-nazad-nikolaj-gastello-sovershil-svoj-znamenityj-podvig.html"
        stranica: «Подвиг во имя жизни», Ненецкий окружной краеведческий музей
        href: https://naomuseum.ru/visitors/spetsialistam/issledovatelyam/nashi-issledovaniya/podvig-vo-imya-zhizni/
        pometka: два источника
      - summary: <b>Однополчанин Гастелло по Халхин-Голу Ююкин первым направил горящий самолёт на врага.</b>
        det:
          - "Комиссар Михаил Ююкин на Халхин-Голе направил подбитый бомбардировщик в скопление японских войск, а стрелку-радисту и штурману приказал прыгать. «Родина»: «этот подвиг повторит Николай Гастелло, служивший на Халхин-Голе в одном полку с Ююкиным». Сам Гастелло родился в Москве 6 мая 1907 года, воевал на Халхин-Голе и в финскую, весной 1941-го переучивался на ДБ-3Ф."
        src: "Источник: «Проверка Халхин-Голом», «Родина», 25.04.2024 — https://rodina-history.ru/2024/04/25/proverka-halhin-golom-hronika-vojny-v-mongolskih-stepiah.html; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=275; Белорусский государственный музей истории ВОВ — https://www.warmuseum.by/news/hronika_pobedy/ognennyy-taran-ekipazha-n-f-gastello/"
        stranica: «Проверка Халхин-Голом», «Родина», 25.04.2024
        href: https://rodina-history.ru/2024/04/25/proverka-halhin-golom-hronika-vojny-v-mongolskih-stepiah.html
        otryvok: «этот подвиг повторит Николай Гастелло, служивший на Халхин-Голе в одном полку с Ююкиным»
        pometka: документ
      - summary: <b>Советские лётчики 506 раз направляли подбитый самолёт в наземную цель, их звали «гастелловцами».</b>
        det:
          - По данным РВИО, за войну было 506 наземных огненных таранов, 600 воздушных, 52 танковых и 14 морских. На выставке в Музее Победы в 2019 году куратор выставки Дмитрий Фадеев называл те же 506 наземных и 600 воздушных.
        src: "Источник: РВИО, «Подвиг Гастелло» — https://history.ru/read/articles/podvigh-gastiello-event; ТВ «Звезда», 26.07.2019 — https://tvzvezda.ru/news/201972620-EScdP.html; Пометка: у Фадеева («Звезда») — 16 морских и 160 танковых"
        stranica: РВИО, «Подвиг Гастелло»
        href: https://history.ru/read/articles/podvigh-gastiello-event
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-07-goskatalog-45844888.jpg
          alt: Медаль «Н. Ф. Гастелло», 1970-е.
          data_source: https://goskatalog.ru/portal/#/collections?id=38060080
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Медаль «Н. Ф. Гастелло», 1970-е.
          credit: Госкаталог музейного фонда РФ, № 38060080, МБУК «Мемориальный музей В и ТП 1941-1945 гг.»
          width: 1600
          height: 1506
      - summary: <b>На одной из первых марок о подвиге Гастелло нарисовали не тот самолёт — истребитель.</b>
        det:
          - Гастелло летел на дальнем бомбардировщике ДБ-3Ф, а на марке ошибочно изобразили истребитель. Марку показывали на выставке в Музее Победы в 2019 году вместе с брошюрой «Капитан Гастелло», которую в 1941 году написали его родные, и нотами песни «Баллада о капитане Гастелло» (1941).
        src: "Источник: ТВ «Звезда», 26.07.2019 — https://tvzvezda.ru/news/201972620-EScdP.html; ДБ-3Ф — «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=275"
        stranica: ТВ «Звезда», 26.07.2019
        href: https://tvzvezda.ru/news/201972620-EScdP.html
        otryvok: «Баллада о капитане Гастелло»
        pometka: документ
