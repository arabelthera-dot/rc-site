      - summary: "<b>Панфиловцы написали на рейхстаге: «Спасибо, Батя, за валенки».</b>"
        det:
          - "Ещё до войны Панфилов просил начальство позаботиться о тёплых вещах и валенках для солдат, бойцы звали его «генерал-батя». Он погиб 18 ноября 1941 года, через два дня после Дубосекова: крошечный осколок пробил висок. Через несколько дней дивизии присвоили его имя. В мае 1945 года на рейхстаге появилась надпись: «Мы панфиловцы. Спасибо, Батя, за валенки»."
        src: "Источник: «Иван Панфилов — генерал по прозвищу Батя», Радио Sputnik (РИА), 19.01.2015 — https://radiosputnik.ria.ru/20150119/1043192491.html"
        stranica: «Иван Панфилов — генерал по прозвищу Батя», Радио Sputnik (РИА), 19.01.2015
