quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — У разъезда Дубосеково под Волоколамском; 2 — Гранатами, бутылками с горючей смесью и противотанковыми ружьями; 3 — Василий Клочков; 4 — В Алма-Ате и Фрунзе; 5 — Она стала 8-й гвардейской и получила имя Панфилова."
  ball: 10
  voprosy:
    - q: Где шёл бой 16 ноября 1941 года?
      o:
        - У разъезда Дубосеково под Волоколамском
        - Под Сталинградом
        - В Брестской крепости
        - Под Ленинградом
      a: 0
      e: У разъезда Дубосеково, юго-восточнее Волоколамска, на рубеже 1075-го стрелкового полка.
    - q: Чем взвод останавливал танки?
      o:
        - Авиацией
        - Танковой бригадой
        - Гранатами, бутылками с горючей смесью и противотанковыми ружьями
        - Крепостной артиллерией
      a: 2
      e: Противотанковая пушка на весь полк была одна. Танки подпускали к окопу и били гранатами, бутылками и из противотанковых ружей.
    - q: Кто был политруком 4-й роты?
      o:
        - Иван Панфилов
        - Константин Рокоссовский
        - Александр Кривицкий
        - Василий Клочков
      a: 3
      e: Василий Клочков. Панфилов командовал дивизией, Рокоссовский — 16-й армией, Кривицкий — журналист «Красной звезды».
    - q: Где формировалась дивизия Панфилова?
      o:
        - В Алма-Ате и Фрунзе
        - В Сибири
        - На Дальнем Востоке
        - На Урале
      a: 0
      e: 316-ю стрелковую дивизию собрали летом 1941 года в Алма-Ате и Фрунзе (ныне Бишкек).
    - q: Что стало с дивизией после боёв ноября 1941 года?
      o:
        - Её расформировали
        - Её отвели в тыл до конца войны
        - Её перебросили на Дальний Восток
        - Она стала 8-й гвардейской и получила имя Панфилова
      a: 3
      e: Дивизия стала гвардейской — 8-й, а 23 ноября 1941 года по просьбе бойцов получила имя погибшего командира.
