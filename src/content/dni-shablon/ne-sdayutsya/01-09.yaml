        otryvok: «Мы панфиловцы. Спасибо, Батя, за валенки»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Смертельно раненный Иван Натаров успел рассказать о бое, так страна узнала о подвиге.</b>
        det:
          - "Мухамедьяров на допросе 1942 года: о бое рассказал «один из героев тов. Натаров Иван Мойсеевич, который, будучи тяжело раненым, попал в госпиталь и где умер последний из павших». Указом от 21 июля 1942 года двадцати восьми бойцам 4-й роты присвоено звание Героя, большинству посмертно."
        src: "Источник: «Российская газета», 02.12.2018 — https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html; «Натаров Иван Моисеевич», «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=6594"
