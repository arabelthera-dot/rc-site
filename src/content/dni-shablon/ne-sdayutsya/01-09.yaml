      - summary: <b>Особисты 1942-го нашли живым «погибшего» героя, и Звезду отдали его павшему однофамильцу.</b>
        det:
          - "О 28 героях первой написала «Красная звезда» 28 ноября 1941 года, автор А. Кривицкий. В мае 1942 года особый отдел НКВД арестовал Даниила Кужебергенова, попавшего в список погибших живым, и звание получил его павший однофамилец Аскар; закрывал дело через два года уже «Смерш». Последний лист: «Лиц, подлежащих взятию на оперативный учет по материалам дела, не имеется». Мединский в 2018 году: описанные события «имеют гораздо больше фактических оснований, чем мы даже могли предполагать»."
        src: "Источник: «Российская газета», 02.12.2018 — https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html; «Родина», 03.12.2018 — https://rodina-history.ru/2018/12/03/medinskij-predstavil-rassekrechennye-dokumenty-o-podvige-panfilovcev.html; Пометка: Кривицкому позже вменили, что слова «отступать некуда» он выдумал; Мединский: дословной достоверности очерка документы не подтверждают"
        stranica: «Российская газета», 02.12.2018
        href: https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html
        otryvok: «Лиц, подлежащих взятию на оперативный учет по материалам дела, не имеется»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>(замена) Старшина, командир полка и политруки назвали одно: 16 ноября, Дубосеково, 9 утра.</b>"
        det:
          - "Мягков в 2019 году: у старшины 4-й роты Дживаго, у самого Капрова, у политруков «информация одна: 16 ноября, высота 251, разъезд Дубосеково, деревня Петелино, начало боя — 9 утра, вначале идет пехота, потом две волны танков». По его словам, донесения разных людей не могут сходиться, если подвига не было. Капров в 1948 году показал: от 4-й роты «уцелело человек 20-25, остальные все погибли»."
        src: "Источник: «„Такое не придумаешь“: новые доказательства подвига 28 панфиловцев», ТВ «Звезда», 18.10.2019 — https://tvzvezda.ru/news/201910181313-b6QV9.html; «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html; Пометка: свод показаний — по Мягкову; политдонесение дивизии называет начало боя в 8.00"
