story:
  kicker: Люди
  h2: Дивизия из Алма-Аты и политрук, который остался
  abzacy:
    - "316-ю стрелковую дивизию собрали летом 1941 года в Алма-Ате и Фрунзе. В ней служили русские, казахи, киргизы, украинцы — вся страна в одной дивизии. Командовал генерал-майор Иван Панфилов. Он гонял бойцов на занятиях часами: как рыть окоп, как <b>встречать танк, а не бежать от него</b>."
    - К Москве дивизию перебросили в октябре. Уже 23 октября штаб немецкого 5-го армейского корпуса доносил, что 316-я русская дивизия <b>«ведёт поразительно упорную борьбу»</b>.
    - "Политрук 4-й роты — Василий Клочков. Начальник штаба полка потом скажет о нём коротко: «честный, прямой и смелый». 16 ноября Клочков шёл во 2-й взвод и по дороге увидел: отделение сержанта Ивана Добробабина уже дерётся с танками. <b>Клочков решил остаться с этим отделением и вести бой сам.</b>"
    - "Уйти ему было куда: политрук отвечает за всю роту, а не за один окоп. Он выбрал окоп, куда шли танки."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: 28 панфиловцев — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Илларион Васильев подползал к танкам на семь метров и подкладывал гранаты под гусеницы.</b>
        det:
          - "Из его автобиографии, заверенной особым отделом в сентябре 1942 года: «примерно 7 метров подползали к танкам и под гусеницы подкладывали связки гранат, а в щели экипажей танков бросали бутылки». Бой начался с бомбёжки, потом пошли автоматчики, их подпустили на 30–40 метров и отбросили, и только тогда двинулись танки, сначала 20–25, потом ещё до 30. Контуженный Васильев с четырьмя ранениями выжил, а жена «была удивлена моим появлением, так как не считала меня в живых»."
        src: 'Источник: «"Смерш" подтвердил подвиг панфиловцев», «Российская газета», 02.12.2018 — https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html'
        stranica: «"Смерш" подтвердил подвиг панфиловцев», «Российская газета», 02.12.2018
        href: https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html
        otryvok: «примерно 7 метров подползали к танкам и под гусеницы подкладывали связки гранат, а в щели экипажей танков бросали бутылки»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Против танков у полка была одна противотанковая пушка, остальное — гранаты в руках.</b>
        det:
          - "Политдонесение дивизии: «1075 СП в борьбе против такого количества танков имел 2 взвода П.Т.Р. и одну противотанковую пушку». В оперсводке полка на 28 октября: «Четыре ПТ (противотанковых) орудия ещё не прибыли»."
        src: "Источник: К. Дроздов, «Ноябрь 1941 года. Отступать некуда — позади Москва», «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html; М. Мягков, «Подвиг панфиловцев: новые документы и факты», ВИЖ — https://history.milportal.ru/podvig-panfilovcev-novye-dokumenty-i-fakty/; Пометка: по другим сведениям Мягкова (ВИЖ), в полку числились два 76-мм орудия и четыре противотанковых ружья"
        stranica: К. Дроздов, «Ноябрь 1941 года. Отступать некуда — позади Москва», «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html
        otryvok: «1075 СП в борьбе против такого количества танков имел 2 взвода П.Т.Р. и одну противотанковую пушку»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Политрук Клочков узнал, что на второй взвод идут танки, и сам пошёл туда, где потом погиб.</b>
        det:
          - "Военком полка Мухамедьяров на допросе 5 июля 1942 года: «Политрук 4-й стрелк. роты тов. Клочков, узнав создавшееся опасное положение в районе второго взвода роты, направляется туда». Тела Клочкова в окопах не нашли: местные жители «тайком от немцев разыскали его труп и схоронили за сторожкой путевого обходчика»."
        src: "Источник: «Российская газета», 02.12.2018 — https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html"
        stranica: «Российская газета», 02.12.2018
        href: https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html
        otryvok: «Политрук 4-й стрелк. роты тов. Клочков, узнав создавшееся опасное положение в районе второго взвода роты, направляется туда»
        pometka: документ
        kadr:
          src: kartinka:000070
          alt: «Подвиг 28 героев-панфиловцев». Е. И. Комаров, 1942.
          data_source: https://goskatalog.ru/portal/#/collections?id=8717367
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: «Подвиг 28 героев-панфиловцев». Е. И. Комаров, 1942.
          credit: Госкаталог Музейного фонда РФ, № 8717367, Государственный музей обороны Москвы
          width: 1600
          height: 1124
        utverzhden: 2026-11-03
      - summary: <b>Немецкий генерал Гёпнер назвал панфиловцев «дикой дивизией», которая не сдаётся в плен.</b>
        det:
          - "Командующему 4-й танковой группой Эриху Гёпнеру приписывают слова: «Дикая дивизия, воюющая в нарушение всех уставов и правил ведения боя, солдаты которой не сдаются в плен, чрезвычайно фанатичны и не боятся смерти». Ещё 23 октября отчёт 5-го армейского корпуса отмечал, что 316-я дивизия «ведёт поразительно упорную борьбу». Дивизию собрали летом 1941 года в Алма-Ате и Фрунзе."
        src: "Источник: «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html; ВИЖ, Мягков — https://history.milportal.ru/podvig-panfilovcev-novye-dokumenty-i-fakty/; Пометка: архивного шифра цитаты Гёпнера источники не дают"
        stranica: «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html
        otryvok: «Дикая дивизия, воюющая в нарушение всех уставов и правил ведения боя, солдаты которой не сдаются в плен, чрезвычайно фанатичны и не боятся смерти»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Малик Габдулин с тринадцатью автоматчиками сдержал батальон и уполз в тыл громить миномёты.</b>
        det:
          - "16 ноября у Ширяева рота автоматчиков 1075-го полка подпустила немецкую пехоту на 150 метров. «Мы выпустили по одному диску и уложили не менее ста немцев… Их было батальон, а нас всего 13 человек». Когда патронов осталось по 10–15, Габдулин скомандовал: «Автоматчики, за мной!» Группа вышла в тыл к огородам Морозова, где стояли две батареи шестиствольных миномётов."
        src: "Источник: «Родина», № 9, 2015 (стенограмма беседы, архив ИРИ РАН) — https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html"
        stranica: «Родина», № 9, 2015 (стенограмма беседы, архив ИРИ РАН)
        href: https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html
        otryvok: «Мы выпустили по одному диску и уложили не менее ста немцев… Их было батальон, а нас всего 13 человек»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Политрук Джетпысбаев подбил танк гранатой с десяти метров и застрелил вылезавшего танкиста.</b>
        det:
          - Помощник командира 5-й роты, держал оборону у деревни Ширяево. «Метров 10 до танка осталось… Бросил гранату лежа. Танк продолжает идти. Я бросил вторую гранату». Второй танк бойцы тоже подожгли. Из винтовки убитого бойца он застрелил танкиста, вылезавшего из люка. «У меня осталось 15 человек из 75».
        src: "Источник: «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html"
        stranica: «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html
        otryvok: «Метров 10 до танка осталось… Бросил гранату лежа. Танк продолжает идти. Я бросил вторую гранату»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Взвод 4–5 часов держал до 50 танков и подбил 18.</b>
        det:
          - "Мухамедьяров, 5 июля 1942 года: «против второго взвода двумя эшелонами шли до 50 танков противника. Неравный бой длился 4-5 часов… подбили и уничтожили 18 танков». Начальник штаба полка Ветков: массовый героизм — «неопровержимый факт»."
        src: "Источник: «Российская газета», 02.12.2018 — https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html; «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html; Пометка: показания военкома Мухамедьярова; политдонесение дивизии 17.11.1941 — «не меньше 9 танков»"
        stranica: «Российская газета», 02.12.2018
        href: https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html
        otryvok: «против второго взвода двумя эшелонами шли до 50 танков противника. Неравный бой длился 4-5 часов… подбили и уничтожили 18 танков»
        pometka: документ
        kadr:
          src: kartinka:000071
          alt: «Дубосеково. Окоп героев-панфиловцев». С. А. Федоров, 1986.
          data_source: https://goskatalog.ru/portal/#/collections?id=18991450
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: «Дубосеково. Окоп героев-панфиловцев». С. А. Федоров, 1986.
          credit: Госкаталог Музейного фонда РФ, № 18991450, Тамбовская областная картинная галерея — Музей-усадьба А. М. Герасимова
          width: 921
          height: 1600
        utverzhden: 2026-11-03
      - summary: <b>За девять дней до Дубосекова Клочков с ротой сжёг три танка и разгромил штаб немецкого полка.</b>
        det:
          - "В ночь с 6 на 7 ноября 1941 года три группы полковника Капрова ударили по штабу немецкого полка в деревне Жданово. «Сожгли 3 танка, штаб уничтожили». Капров доложил: «Мы дали малый концерт из малого аула. Просим из большого аула дать большой концерт». Минут через 20 по деревне ударили «Катюши»."
        src: "Источник: Е. Кириченко, «Политрук Клочков. Подвиг без ретуши», «Родина», 12.04.2023 — https://rodina-history.ru/2023/04/12/politruk-klochkov-podvig-bez-retushi.html"
        stranica: Е. Кириченко, «Политрук Клочков. Подвиг без ретуши», «Родина», 12.04.2023
        href: https://rodina-history.ru/2023/04/12/politruk-klochkov-podvig-bez-retushi.html
        otryvok: «Сожгли 3 танка, штаб уничтожили»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Окружённый штаб полка в 19:12 радировал: «Обороняют только КП», и не ушёл.</b>"
        det:
          - "Политдонесение дивизии: «1075 СП дрался до последней возможности, командование полка оставило командный пункт только тогда, когда в расположении командного пункта появились танки». В 19 часов 12 минут 16 ноября полковник Капров передал: «Окружен. Обороняют только КП». Атаку танков на Шишкино отбили дважды, и наступление здесь приостановилось."
        src: "Источник: «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html; «Родина», 12.04.2023 — https://rodina-history.ru/2023/04/12/politruk-klochkov-podvig-bez-retushi.html"
        stranica: «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html
        otryvok: «1075 СП дрался до последней возможности, командование полка оставило командный пункт только тогда, когда в расположении командного пункта появились танки»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Иван Шадрин вернулся из Заксенхаузена «посмертным» Героем, и его вдове уже построили дом.</b>
        det:
