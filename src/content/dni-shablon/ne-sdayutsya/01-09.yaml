    udary:
      - summary: <b>К лету 1942 года из всей 4-й роты в полку остался один старшина Дживаго.</b>
        det:
          - "Справка «Смерша» на 06.07.1942: «Других лиц из состава 4-й стрелковой роты… в полку нет», кроме бывшего старшины Ф. Т. Дживаго. Политдонесение 17 ноября 1941 года: «2 роты потеряны полностью». К 16 ноября в 1075-м полку было 1534 человека, к 20 ноября осталось 120."
        src: "Источник: «Российская газета», 02.12.2018 — https://rg.ru/2018/12/02/medinskij-nazval-sensaciej-novye-dokumenty-o-geroiah-panfilovcah.html; «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/07/rodina-panfilovtsy.html"
