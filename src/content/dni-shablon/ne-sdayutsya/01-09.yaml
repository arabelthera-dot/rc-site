audioguide:
  audioSrc: audio-guide-panfilovtsy-ru.mp3
  durationLabel: 1 минута 18 секунд
  lead: "Голос ведёт от рубежа у Волоколамска до памяти о бое: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Рубеж у разъезда
    - t: 15
      mark: 0:15
      title: Против брони
    - t: 30
      mark: 0:30
      title: Политрук остаётся
    - t: 46
      mark: 0:46
      title: Четыре часа
    - t: 62
      mark: 1:02
      title: Память
  transcript:
    - <p>Мы у разъезда Дубосеково, юго-восточнее Волоколамска. Ноябрь сорок первого года. Волоколамск уже у немцев. Рубеж у железной дороги держит 1075-й полк дивизии генерала Панфилова.</p>
    - <p>Противотанковая пушка на весь полк — одна. Против танков у бойцов противотанковые ружья, гранаты и бутылки с горючей смесью. Чтобы бросить гранату, танк надо подпустить к своему окопу.</p>
    - <p>Утром шестнадцатого ноября взвод отбивает атаку автоматчиков. Потом идут танки, двумя эшелонами. Политрук роты Василий Клочков видит, что отделение сержанта Добробабина уже дерётся с танками, — и остаётся с ним вести бой.</p>
    - <p>Бой идёт часами. Танки жгут гранатами и бутылками у самых окопов. Штаб полка уходит со своего командного пункта, только когда к нему подходят танки. Полк дерётся до последней возможности.</p>
    - <p>Сколько было бойцов и сколько сгорело танков, спорят до сих пор. Что бой был и полк стоял, признают обе стороны спора. Летом сорок второго двадцать восемь бойцов четвёртой роты стали Героями Советского Союза.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
