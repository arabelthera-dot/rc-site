story:
  kicker: Подвиг
  h2: Азовское осадное сидение
  abzacy:
  - В июне 1637 года донские казаки взяли турецкую крепость Азов в устье Дона. Взяли сами, без царского указа. Четыре года крепость стояла казачьей.
  - 24 июня 1641 года к Азову подошло войско султана и крымского хана — по росписи казаков, 256 тысяч человек. В крепости сидели около 5,5 тысячи донцов, среди них 800 женщин. Стены рушились от пушек — казаки уходили под землю, вели подкопы и отбивали приступы. 93 дня и 93 ночи они держались, и в ночь на 26 сентября турецкое войско ушло.
