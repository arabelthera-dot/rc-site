quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 93 дня; 2 — 28 подкопов; 3 — 800 женщин; 4 — через камышинку; 5 — ночью, до рассвета.'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: сколько дней казаки держали Азов?'
    o:
    - '9'
    - '39'
    - '93'
    - '193'
    a: 2
    e: 93 дня и 93 ночи — с 24 июня до 26 сентября 1641 года.
  - q: Сколько подкопов казаки повели под турецкий лагерь?
    o:
    - '2'
    - '8'
    - '28'
    - '280'
    a: 2
    e: Из нор под турецким валом казаки повели 28 подкопов.
  - q: Сколько женщин было среди защитников Азова?
    o:
    - Ни одной
    - '80'
    - '800'
    - '8000'
    a: 2
    e: Около 5,5 тысячи донцов, в том числе 800 женщин.
  - q: Как подмога пробиралась в крепость под водой Дона?
    o:
    - В лодках
    - Дыша через камышинку
    - По мосту
    - На плотах
    a: 1
    e: По 500–600 казаков за ночь плыли под водой, дыша через камышинку.
  - q: Когда турецкая армия ушла из-под Азова?
    o:
    - Днём, после боя
    - Ночью, до рассвета
    - Весной
    - Через год
    a: 1
    e: За четыре часа до рассвета — никем не гонимая.
