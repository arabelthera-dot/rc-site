vizual:
  imya: azov-povesti-orlov
  vid: dokument
  kicker: Книга под лупой
  h2: Повесть об Азовском сидении
  lead: 'Эту книгу 2003 года хранит музей в Таганроге. Приблизь снимок: на обложке казак с саблей рубится в гуще боя, внизу на ленте — название повести.'
audioguide:
  audioSrc: audio-guide-azov-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от взятия Азова через подкопы и отказ от выкупа — к ночному бегству турок: пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Своеволие
  - t: 22
    mark: 0:22
    title: Против армии
  - t: 44
    mark: 0:44
    title: Подкопы
  - t: 66
    mark: '1:06'
    title: Не продаём
  - t: 88
    mark: '1:28'
    title: Бегство
  transcript:
  - 'В тысяча шестьсот тридцать седьмом году донские казаки взяли турецкую крепость Азов — сами, без царского указа. Москва объявила султану: это их «своеволие».'
  - Летом тысяча шестьсот сорок первого года к Азову пришла армия султана. Пять с половиной тысяч казаков девяносто три дня держали Азов — и турки ушли ни с чем.
  - Стены рушились — казаки ушли под землю. Из нор под турецким валом они повели двадцать восемь подкопов. Турки насыпали гору выше стен — казаки взорвали её и закинули в город полторы тысячи янычар.
  - 'Турки сулили каждому казаку триста талеров серебра и двести золота за «пустое место». За каждую голову янычара давали червонец. Казаки ответили: «Не продаём мы трупа мёртвого».'
  - В ночь на двадцать шестое сентября, за четыре часа до рассвета, турецкая армия бежала из-под Азова — никем не гонимая.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
