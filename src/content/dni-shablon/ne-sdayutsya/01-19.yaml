vizual:
  imya: k19-kniga
  vid: predmet
  kicker: Вещь под лупой
  h2: Книга о первом экипаже
  lead: 'Эту книгу выпустили в 2011 году, к 50-летию аварии реактора, — о первом экипаже К-19, о Корчилове и моряках, что пошли к реактору. Приближайте: ржавый металл, красная звезда, буквы «К-19».'
audioguide:
  audioSrc: audio-guide-k19-ru.mp3
  durationLabel: 1 минута 29 секунд
  lead: "Голос ведёт от учений «Полярный круг» через реакторный отсек — к памятнику на Кузьминском кладбище: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Первый ракетоносец
    - t: 16
      mark: 0:16
      title: Течь в первом контуре
    - t: 32
      mark: 0:32
      title: Труба к воздушнику
    - t: 47
      mark: 0:47
      title: Восемь имён
    - t: 64
      mark: 1:04
      title: Кузьминское кладбище
  transcript:
    - "Ка-девятнадцать — первая в Советском Союзе атомная подводная лодка, способная нести три баллистические ракеты. Её построили в Северодвинске в рекордные сроки. Летом тысяча девятьсот шестьдесят первого года она вышла на учения «Полярный круг» под командованием Николая Затеева."
    - "Четвёртого июля, на шестнадцатые сутки похода, в семидесяти милях от острова Ян-Майен приборы показали падение давления в первом контуре кормового реактора. Насосы заклинило. Без охлаждения активная зона начала разогреваться — это грозило взрывом."
    - "Моряки вошли в реакторный отсек и собрали нештатную систему охлаждения. Первая попытка не удалась — сорвало шланг. Тогда аварийная партия приварила трубопровод к воздушнику реактора и стала проливать активную зону пресной водой из питьевых запасов."
    - "Взрыва не случилось. Экипаж пересадили на подошедшие подлодки и эсминцы. Но восемь моряков, работавших у реактора, получили смертельные дозы и умерли в июле того же года. Среди них лейтенант Борис Корчилов и матрос Валерий Харитонов — оба пошли туда добровольно."
    - "Аварию засекретили больше чем на тридцать лет. В две тысячи пятом году первый экипаж выдвинули на Нобелевскую премию мира. Командир Николай Затеев похоронен на Кузьминском кладбище в Москве — рядом со своими моряками."
  note: Озвучено синтезом речи.
razdely: []
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Потёк первый контур охлаждения реактора; 2 — Пресной водой из питьевых запасов; 3 — Восемь; 4 — Сами выжившие моряки — надписью на пластыре в госпитале; 5 — На Нобелевскую премию мира."
  ball: 10
  voprosy:
    - q: Что случилось на К-19 4 июля 1961 года?
      o:
        - Лодка столкнулась с американской подлодкой
        - Загорелась ракетная шахта
        - Потёк первый контур охлаждения реактора
        - Лодка села на мель у Ян-Майена
      a: 2
      e: "В 4:15 приборы показали падение давления и уровня в первом контуре кормового реактора: течь дала импульсная трубка между напорной линией и датчиками давления."
    - q: Какой водой моряки охлаждали реактор?
      o:
        - Забортной морской водой
        - Пресной водой из питьевых запасов
        - Водой из системы пожаротушения
        - Реактор не охлаждали — его заглушили
      a: 1
      e: Штатные насосы заклинило. Аварийная партия приварила трубопровод к воздушнику реактора и со второй попытки наладила проливку активной зоны пресной водой из питьевых запасов.
    - q: Сколько моряков, собиравших охлаждение реактора, умерли от облучения в июле 1961 года?
      o:
        - Трое
        - Двадцать два
        - Весь экипаж
        - Восемь
      a: 3
      e: "Восемь моряков: Юрий Повстьев, Борис Корчилов, Борис Рыжиков, Юрий Ордочкин, Евгений Кашенков, Семён Пеньков, Николай Савкин и Валерий Харитонов."
    - q: Кто, по воспоминаниям члена экипажа Виктора Стрельца, первым назвал лодку «Хиросимой»?
      o:
        - Сами выжившие моряки — надписью на пластыре в госпитале
        - Американские журналисты
        - Создатели голливудского фильма 2002 года
        - Командир Затеев в рапорте
      a: 0
      e: После пересадки костного мозга в ленинградском госпитале выжившие написали «Хиросима» на пластыре, наклеенном крест-накрест на груди, — как на плакатах «Нет Хиросиме!».
    - q: На какую награду в декабре 2005 года выдвинули первый экипаж К-19?
      o:
        - На звание Героя России
        - На Государственную премию
        - На Нобелевскую премию мира
        - На орден Мужества
      a: 2
      e: Михаил Горбачёв выдвинул первый экипаж К-19 на Нобелевскую премию мира — за ликвидацию в 1961 году аварии реактора на борту.
