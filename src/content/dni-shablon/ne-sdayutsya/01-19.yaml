quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Потёк первый контур охлаждения реактора; 2 — Пресной водой из питьевых запасов; 3 — Восемь; 4 — Сами выжившие моряки — надписью на пластыре в госпитале; 5 — На Нобелевскую премию мира."
  ball: 10
  voprosy:
    - q: Что случилось на К-19 4 июля 1961 года?
      o:
        - Лодка столкнулась с американской подлодкой
        - Загорелась ракетная шахта
        - Потёк первый контур охлаждения реактора
        - Лодка села на мель у Ян-Майена
      a: 2
      e: "В 4:15 приборы показали падение давления и уровня в первом контуре кормового реактора: течь дала импульсная трубка между напорной линией и датчиками давления."
    - q: Какой водой моряки охлаждали реактор?
      o:
        - Забортной морской водой
        - Пресной водой из питьевых запасов
        - Водой из системы пожаротушения
        - Реактор не охлаждали — его заглушили
      a: 1
      e: Штатные насосы заклинило. Аварийная партия приварила трубопровод к воздушнику реактора и со второй попытки наладила проливку активной зоны пресной водой из питьевых запасов.
    - q: Сколько моряков, собиравших охлаждение реактора, умерли от облучения в июле 1961 года?
      o:
        - Трое
        - Двадцать два
        - Весь экипаж
        - Восемь
      a: 3
      e: "Восемь моряков: Юрий Повстьев, Борис Корчилов, Борис Рыжиков, Юрий Ордочкин, Евгений Кашенков, Семён Пеньков, Николай Савкин и Валерий Харитонов."
    - q: Кто, по воспоминаниям члена экипажа Виктора Стрельца, первым назвал лодку «Хиросимой»?
      o:
        - Сами выжившие моряки — надписью на пластыре в госпитале
        - Американские журналисты
        - Создатели голливудского фильма 2002 года
        - Командир Затеев в рапорте
      a: 0
      e: После пересадки костного мозга в ленинградском госпитале выжившие написали «Хиросима» на пластыре, наклеенном крест-накрест на груди, — как на плакатах «Нет Хиросиме!».
    - q: На какую награду в декабре 2005 года выдвинули первый экипаж К-19?
      o:
        - На звание Героя России
        - На Государственную премию
        - На Нобелевскую премию мира
        - На орден Мужества
      a: 2
      e: Михаил Горбачёв выдвинул первый экипаж К-19 на Нобелевскую премию мира — за ликвидацию в 1961 году аварии реактора на борту.
