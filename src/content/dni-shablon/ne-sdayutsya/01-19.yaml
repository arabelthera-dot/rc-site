story:
  kicker: Среда подвига
  h2: Первый ракетоносец и учения «Полярный круг»
  abzacy:
    - К-19 была первой в СССР атомной подводной лодкой, способной нести три баллистические ракеты с ядерными боеголовками. Её построили в Северодвинске в рекордно короткие сроки — как ответ на появление американского подводного ракетоносца «Джордж Вашингтон». Первым командиром стал капитан 2 ранга Николай Затеев.
    - "В июне–июле 1961 года лодка вышла на океанские учения «Полярный круг» и играла за «противника»: ей предстояло скрытно пройти Северной Атлантикой и условно атаковать побережье СССР. Командир выбрал путь между Гренландией и Исландией через Датский пролив."
    - 4 июля, на шестнадцатые сутки плавания, лодка шла в подводном положении примерно в 70 милях от норвежского острова Ян-Майен. <b>В 4:15 приборы пульта показали падение давления и уровня в первом контуре охлаждения кормового реактора.</b>
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Подлодка К-19 — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Затеев написал в чужом вахтенном журнале приказ торпедировать свою лодку при подходе врага.</b>
        det:
          - "Перебравшись на дизельную С-159, Затеев взял у её командира Григория Вассера вахтенный журнал и записал: «Прошу циркулировать в районе дрейфа К-19. Торпедный аппарат № 4 (заряженный боевой торпедой) прошу подготовить к залпу. В случае подхода к АПЛ К-19 военно-морских сил вероятного противника торпедировать АПЛ К-19 буду сам». Лодка дрейфовала «рядом с американской военно-морской базой». Торпедировать не пришлось: подошли наш крейсер и вспомогательное судно."
        src: "Источник: Черкашин Н. А. Чрезвычайные происшествия на советском флоте (записки Н. В. Затеева) // militera.lib.ru — https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html"
        stranica: Черкашин Н. А. Чрезвычайные происшествия на советском флоте (записки Н. В. Затеева) // militera.lib.ru
        href: https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html
        otryvok: «Прошу циркулировать в районе дрейфа К-19. Торпедный аппарат № 4 (заряженный боевой торпедой) прошу подготовить к залпу. В случае подхода к АПЛ К-19 военно-морских сил вероятного противника торпедировать АПЛ К-19 буду сам»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Корчилов на вопрос командира «Ты знаешь, на что идёшь?» ответил «Да» и повёл людей к реактору.</b>
        det:
          - восемь моряков, работавших у реактора, умерли от облучения в июле 1961 года; лейтенант Борис Корчилов и матрос Валерий Харитонов пошли туда добровольно (Харитонов — из соседнего турбинного отсека). Группа Бориса Корчилова спустилась в выгородку в 6:50; на крышке реактора было до 250 рентген в час, трубопроводы светились голубым — моряки сперва решили, что пожар. Корчилов как «хозяин» отсека был там всё время, хотя группы менялись по два-три человека. Он получил 5400 бэр и «сам стал интенсивнейшим источником облучения». Через 30 лет Затеев зажёг по нему свечу в Никольском морском соборе.
        src: "Источник: Черкашин Н. А. // militera.lib.ru — https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html; Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021 — https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html"
        stranica: Черкашин Н. А. // militera.lib.ru
        href: https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html
        otryvok: «сам стал интенсивнейшим источником облучения»
        pometka: один источник
        kadr:
          src: kartinka:000602
          alt: Чёрно-белый погрудный портрет юноши в матросской форме с гюйсом и тельняшкой
          data_source: https://goskatalog.ru/portal/#/collections?id=21493970
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Погрудный портрет Бориса Корчилова, 1961 год; в карточке музея указано, что он награждён орденом Красного Знамени.
          credit: Городской историко-краеведческий музей г. Полярного (ЗАТО Александровск), ГИКМП ОФ-3423
          width: 558
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Капитан-лейтенант Поляков и 11 моряков 23 дня держались в темноте в отрезанном огнём отсеке.</b>
        det:
          - "24 февраля 1972 года в 10:23 на глубине 120 м в 9-м отсеке загорелось масло на раскалённом фильтре; люки задраили, 10-й отсек оказался отрезан огнём и газом. Поляков приказал задраиться и ждать; лишь к вечеру связался с центральным постом по аварийному телефону, кислород им подали по трубопроводу дифферентовки. Еда — «заначки»: четыре пачки чая, две банки сгущёнки, консервированная капуста; ели в полной темноте, фонарики сели в первый же день. Вынесли их 18 марта; на глаза накладывали повязки, чтобы не ослепило солнце."
        src: "Источник: 23 дня в темноте: как спасали экипаж К-19 // Российская газета, 24.02.2020 — https://rg.ru/2020/02/24/reg-szfo/23-dnia-v-temnote-kak-spasali-ekipazh-k-19.html ; К-19: символ мужества и стойкости // histrf.ru (РВИО) — https://histrf.ru/read/articles/k-19-simvol-muzhiestva-i-stoikosti"
        stranica: "23 дня в темноте: как спасали экипаж К-19 // Российская газета, 24.02.2020"
        href: https://rg.ru/2020/02/24/reg-szfo/23-dnia-v-temnote-kak-spasali-ekipazh-k-19.html
        otryvok: «Старшим там был капитан-лейтенант Борис Поляков. Он приказал задраиться и ждать.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Опасаясь бунта, Затеев велел выбросить автоматы за борт и оставил офицерам пять «макаровых».</b>
        det:
          - "Замполит и командир резервного экипажа требовали вести лодку к норвежскому Ян-Майену, высадить людей, а корабль затопить. Затеев «турнул их с мостика» и, боясь, что они подобьют матросов, велел выбросить за борт автоматы и пистолеты; себе и помощникам оставил пять пистолетов Макарова. Позже признал: ни в ком, «кроме замполита», не ошибся."
        src: "Источник: «Спасите наши души». Подлинная история аварии на подлодке «К-19» // АиФ № 27, 06.07.2016 — https://aif.ru/society/history/cpasite_nashi_dushi_podlinnaya_istoriya_avarii_na_podlodke_k-19 ; записки Затеева у Н. Черкашина — https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html"
        stranica: «Спасите наши души». Подлинная история аварии на подлодке «К-19» // АиФ № 27, 06.07.2016
        href: https://aif.ru/society/history/cpasite_nashi_dushi_podlinnaya_istoriya_avarii_na_podlodke_k-19
        otryvok: «турнул их с мостика»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Моряки К-19 приварили трубу к реактору и остудили его питьевой водой из запасов лодки.</b>
        det:
          - "4 июля 1961 года, на 16-е сутки плавания, примерно в 70 милях от острова Ян-Майен у одного из двух реакторов потёк первый контур: давление упало с 200 атмосфер до нуля, заклинило главный и вспомогательный насосы. На борту было 139 человек. Моряки приварили трубопровод к «воздушнику» реактора и со второй попытки наладили проливку активной зоны пресной водой из питьевых запасов. Взрыва не случилось."
        src: "Источник: Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021 — https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html; Черкашин Н. А. Чрезвычайные происшествия на советском флоте (записки Н. В. Затеева) // militera.lib.ru — https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html"
        stranica: "Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021"
        href: https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html
        otryvok: «Им надо было отвернуть заглушку „воздушника“ на компенсирующей решётке и приварить медный трубопровод, который применяют для зарядки торпед воздухом высокого давления.»
        pometka: два источника
        kadr:
          src: kartinka:000603
          alt: Модель чёрной атомной подводной лодки в профиль на подставке с синим бархатом
          data_source: https://goskatalog.ru/portal/#/collections?id=10664312
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Сувенирная модель атомной подводной лодки с баллистическими ракетами проекта 658 «К-19».
          credit: Центральный военно-морской музей имени императора Петра Великого, ЦВММ КП-59765
          width: 800
          height: 600
        utverzhden: 2026-11-03
      - summary: "<b>Затеев отказался покинуть лодку, ожидая взрыва: «Я не имею права оставить корабль».</b>"
        det:
          - "В отсеке С-270 Затеев сказал Свербилову, что ждёт атомного взрыва. «Ну так переходите все на корабль». — «Я не имею право оставить корабль». Свербилов: «Хорошо! Тогда будем стоять в эпицентре и не останемся калеками». На К-19 остались шестеро — Затеев, замполит, шифровальщик, сигнальщик и два электрика; лодку он покинул последним."
        src: "Источник: Lenta.ru, 04.07.2021 — https://lenta.ru/articles/2021/07/04/podlodka/ ; АиФ № 27, 06.07.2016 — https://aif.ru/society/history/cpasite_nashi_dushi_podlinnaya_istoriya_avarii_na_podlodke_k-19; Черкашин Н. А. Чрезвычайные происшествия на советском флоте (записки Н. В. Затеева) // militera.lib.ru — https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html"
        stranica: Lenta.ru, 04.07.2021
        href: https://lenta.ru/articles/2021/07/04/podlodka/
        otryvok: «Ну так переходите все на корабль»
        pometka: воспоминание
        utverzhden: 2026-11-03
      - summary: <b>Жан Свербилов без приказа покинул учения, привёл свою С-270 к К-19 и спас 79 моряков.</b>
        det:
          - "первыми на помощь пришли дизельные подлодки С-270 и С-159, с них моряков пересадили на эсминцы. Командирам в завесе под угрозой трибунала запрещалось обнаруживать себя. Свербилов пошёл на сигнал и доложил: «Стою у борта К-19. Принял 11 тяжелобольных. Обеспечиваю К-19 радиосвязью. Жду указаний». Ответ главкома Северного флота: «Почему без разрешения покинули район учений? Ответите за самовольство!». С-270 доставила в Полярный 68 членов экипажа и 11 тяжелобольных."
        src: "Источник: «Трудно людей на смерть посылать»… // Lenta.ru, 04.07.2021 — https://lenta.ru/articles/2021/07/04/podlodka/; Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021 — https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html"
        stranica: «Трудно людей на смерть посылать»… // Lenta.ru, 04.07.2021
        href: https://lenta.ru/articles/2021/07/04/podlodka/
        otryvok: «Стою у борта К-19. Принял 11 тяжелобольных. Обеспечиваю К-19 радиосвязью. Жду указаний»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Погорелов, Кулаков и Березов вызвались идти в реакторный отсек, когда самодельная система дала течь.</b>
        det:
          - "В 15:00 4 июля самодельная система охлаждения потекла: уходил бидистиллят, температура активной зоны снова могла пойти вверх. «Кого посылать в реакторный на сей раз?» — вспоминал Затеев. Вызвались командир электротехнического дивизиона капитан-лейтенант Погорелов, старшина команды трюмных Иван Кулаков и старшина-ракетчик Леонид Березов. «Довольно быстро они заварили место протечки»."
        src: "Источник: Черкашин Н. А. Чрезвычайные происшествия на советском флоте (записки Затеева) // militera.lib.ru — https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html"
        stranica: Черкашин Н. А. Чрезвычайные происшествия на советском флоте (записки Затеева) // militera.lib.ru
        href: https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html
        otryvok: «Кого посылать в реакторный на сей раз?»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>В 1969 году К-19 протаранила под водой американскую Gato, следившую за ней у мыса Териберский.</b>
        det:
          - 15 ноября 1969 года при смене глубины с 60 на 90 метров К-19 ударила шпионившую за ней USS Gato. Командир минно-торпедной части Gato, решив, что русские таранят нарочно, приказал готовить три торпеды и ракету SUBROC с ядерной боеголовкой — отменил командир лодки. К-19 со смятым носом всплыла и своим ходом пришла в базу; комиссия всё списала на «неудачную гидрологию моря».
        src: "Источник: 50 лет назад советская подлодка К-19 протаранила американскую USS Gato // Российская газета, 15.11.2019 — https://rg.ru/2019/11/15/50-let-nazad-sovetskaia-podlodka-k-19-protaranila-amerikanskuiu-uss-gato.html; Lenta.ru, 04.07.2021 — https://lenta.ru/articles/2021/07/04/podlodka/ ; РИА Новости, 12.11.2020 — https://ria.ru/20201112/k-19-1584154081.html"
        stranica: 50 лет назад советская подлодка К-19 протаранила американскую USS Gato // Российская газета, 15.11.2019
        href: https://rg.ru/2019/11/15/50-let-nazad-sovetskaia-podlodka-k-19-protaranila-amerikanskuiu-uss-gato.html
        otryvok: «неудачную гидрологию моря»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Моряки К-19 писали на груди «Хиросима», а в документах им ставили нервный диагноз.</b>
        det:
          - в ленинградской клинике после пересадки костного мозга выжившие наклеили на грудь пластырь крест-накрест с надписью «Хиросима», как на плакатах «Нет Хиросиме!», — прозвище осталось за лодкой; сама авария была секретной больше 30 лет. С выживших взяли расписку о неразглашении на 30 лет, умерших хоронили ночью в цинковых гробах. В больнице вместо лучевой болезни писали «астеновегетативный синдром». Иван Кулаков с этим диагнозом не мог устроиться на работу, получал пенсию 32 рубля; в 2004 году ему, жителю Минска, вручили орден Мужества.
        src: "Источник: АиФ № 27, 06.07.2016 — https://aif.ru/society/history/cpasite_nashi_dushi_podlinnaya_istoriya_avarii_na_podlodke_k-19 ; Российская газета, 25.11.2004 — https://rg.ru/2004/11/25/a46425.html; Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021 — https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html"
        stranica: АиФ № 27, 06.07.2016
        href: https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html
        otryvok: «И впервые это слово написали на широком лейкопластыре, крест-накрест наклеенном на груди после пересадки костного мозга»
        pometka: два источника
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Антенна вышла из строя, и 10 часов К-19 звала на помощь слабым аварийным передатчиком.</b>
        det:
          - "Антенна главного передатчика вышла из строя, связаться с берегом было нельзя. Затеев повёл лодку на юг и «велел врубить аварийный передатчик», который слал SOS на международной частоте. «Маломощный — четыреста ватт — аппарат» бил лишь «около ста миль». Затеев вспомнил карту в кабинете главкома с позициями наших дизельных лодок южнее: «Один шанс на миллион, но другого нет»; сигнал шёл 10 часов."
        src: "Источник: АиФ, 06.07.2016 — https://aif.ru/society/history/cpasite_nashi_dushi_podlinnaya_istoriya_avarii_na_podlodke_k-19 ; РИА Новости, справка 04.07.2021 («повреждённой оказалась антенна передатчика дальней связи») — https://ria.ru/20210704/podlodka-1739573161.html; Черкашин Н. А. Чрезвычайные происшествия на советском флоте (записки Н. В. Затеева) // militera.lib.ru — https://militera.lib.ru/research/cherkashin_na01/cherkashin_na01.html"
        stranica: АиФ, 06.07.2016
        href: https://aif.ru/society/history/cpasite_nashi_dushi_podlinnaya_istoriya_avarii_na_podlodke_k-19
        otryvok: «велел врубить аварийный передатчик»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Командира К-19 пытались сделать виноватым и не дали адмирала, а лёг он рядом со своими моряками.</b>
        det:
          - Сразу после аварии экипаж пытались сделать виноватым, командира наказать, а всё произошедшее засекретили; умерших от облучения похоронили незаметно. Затеев до адмирала не дослужился и был уволен в запас капитаном 1 ранга. В 1998 году он умер и с согласия родных и членов экипажа похоронен на Кузьминском кладбище рядом со своими бывшими подчинёнными.
        src: "Источник: Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021 — https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html"
        stranica: "Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021"
        href: https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html
        otryvok: «Сразу после той аварии экипаж пытались сделать виноватым, командира наказать, а все произошедшее засекретили.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Корчилова, Ордочкина и Пенькова внесли в списки на Героя, но Хрущёв отказал.</b>
        det:
          - "В 1961 году 49 подводников К-19 представили к орденам и медалям: Затеев должен был получить орден Красного Знамени, Борис Корчилов, Юрий Ордочкин и Семён Пеньков были в списках на звание Героя Советского Союза. Кандидатуры отверг Н. С. Хрущёв: «Мы за аварии не награждаем»."
        src: "Источник: Рабчук Ю. Моряка с К-19 наградили орденом Мужества // Российская газета, 25.11.2004 — https://rg.ru/2004/11/25/a46425.html"
        stranica: Рабчук Ю. Моряка с К-19 наградили орденом Мужества // Российская газета, 25.11.2004
        href: https://rg.ru/2004/11/25/a46425.html
        otryvok: «Мы за аварии не награждаем»
        pometka: мнение
        kadr:
          src: kartinka:000604
          alt: Чёрная двубортная флотская шинель с золотыми пуговицами и погонами на вешалке
          data_source: https://goskatalog.ru/portal/#/collections?id=51367656
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Шинель инженер-лейтенанта Бориса Корчилова, командира группы дистанционного управления подводной лодки «К-19».
          credit: Военно-морской музей Северного флота, ВММСФКП-934
          width: 530
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Отсек с реактором вырезали и затопили у Новой Земли, а лодка через два года вернулась в строй.</b>
        det:
          - К-19 — первая в СССР атомная лодка с тремя баллистическими ракетами, построенная в Северодвинске в рекордные сроки. После аварии её отбуксировали в базу, аварийный реакторный отсек вырезали и затопили у Новой Земли, поставили новый, и через два с половиной года лодка снова вышла в море.
        src: "Источник: Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021 — https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html; Емельяненков А. «Горбачев выдвигает экипаж К-19 на Нобелевскую премию» // «Российская газета», 02.02.2006 — https://rg.ru/2006/02/02/gorbachev-k19.html"
        stranica: "Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021"
        href: https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html
        otryvok: «отсек с аварийным реактором вырезали и затопили у Новой Земли. На его место уставили новый, попутно заменили ракетный комплекс Д-2 на Д-4 - уже с подводным стартом - и через два с половиной года К-19 вернулась в боевой состав.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Через 45 лет после аварии экипаж К-19 выдвинули на Нобелевскую премию мира.</b>
        det:
          - "Михаил Горбачёв как нобелевский лауреат выдвинул экипаж К-19 соискателем премии мира 2006 года; ходатайство ушло в Нобелевский комитет в начале 2006-го. Довод: в разгар «холодной войны» взрыв лодки мог быть расценен как провокация СССР, и ответ США и НАТО мог последовать незамедлительно. Восемь моряков погибли от облучения в считанные дни после аварии."
        src: "Источник: Емельяненков А. «Горбачев выдвигает экипаж К-19 на Нобелевскую премию» // «Российская газета», 02.02.2006 — https://rg.ru/2006/02/02/gorbachev-k19.html; Емельяненков А. «Авария на К-19: как это было 60 лет назад и что открылось сегодня» // «Российская газета», 04.07.2021 — https://rg.ru/2021/07/04/avariia-na-k-19-kak-eto-bylo-60-let-nazad-i-chto-otkrylos-segodnia.html"
        stranica: Емельяненков А. «Горбачев выдвигает экипаж К-19 на Нобелевскую премию» // «Российская газета», 02.02.2006
        href: https://rg.ru/2006/02/02/gorbachev-k19.html
        otryvok: «Экс-президент СССР Михаил Горбачев воспользовался своим правом нобелевского лауреата и выдвинул соискателем на аналогичную награду 2006 года экипаж атомной подводной лодки К-19»
        pometka: один источник
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-k19-ru.mp3
  durationLabel: 1 минута 29 секунд
  lead: "Голос ведёт от учений «Полярный круг» через реакторный отсек — к памятнику на Кузьминском кладбище: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Первый ракетоносец
    - t: 18
      mark: 0:18
      title: Течь в первом контуре
    - t: 36
      mark: 0:36
      title: Труба к воздушнику
    - t: 53
      mark: 0:53
      title: Восемь имён
    - t: 73
      mark: 1:13
      title: Кузьминское кладбище
  transcript:
    - <p>Ка-девятнадцать — первая в Советском Союзе атомная подводная лодка, способная нести три баллистические ракеты. Её построили в Северодвинске в рекордные сроки. Летом тысяча девятьсот шестьдесят первого года она вышла на учения «Полярный круг» под командованием Николая Затеева.</p>
    - <p>Четвёртого июля, на шестнадцатые сутки похода, в семидесяти милях от острова Ян-Майен приборы показали падение давления в первом контуре кормового реактора. Насосы заклинило. Без охлаждения активная зона начала разогреваться — это грозило взрывом.</p>
    - <p>Моряки вошли в реакторный отсек и собрали нештатную систему охлаждения. Первая попытка не удалась — сорвало шланг. Тогда аварийная партия приварила трубопровод к воздушнику реактора и стала проливать активную зону пресной водой из питьевых запасов.</p>
    - <p>Взрыва не случилось. Экипаж пересадили на подошедшие подлодки и эсминцы. Но восемь моряков, работавших у реактора, получили смертельные дозы и умерли в июле того же года. Среди них лейтенант Борис Корчилов и матрос Валерий Харитонов — оба пошли туда добровольно.</p>
    - <p>Аварию засекретили больше чем на тридцать лет. В две тысячи пятом году первый экипаж выдвинули на Нобелевскую премию мира. Командир Николай Затеев похоронен на Кузьминском кладбище в Москве — рядом со своими моряками.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
