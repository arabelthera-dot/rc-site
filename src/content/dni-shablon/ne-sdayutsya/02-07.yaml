  - id: ns-0207-zaveshchanie
    n: 2
    summary: 'Завещание в тетради: «Его присудят к смертной казни. Он умрёт. Но останется 116 стихов»'
    det:
    - 'В первой тетради Джалиль написал о себе в третьем лице: его приговорят к смерти, он умрёт, но останутся 116 стихов. Он просил того, кто найдёт тетрадь, переписать их и передать на родину. Спасал он не себя, а стихи.'
    otryvok: Его присудят к смертной казни. Он умрет. Но у него останется 116 стихов, написанных в плену и в заточении.
