quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 116; 2 — «Словарь»; 3 — отбор певцов в хор; 4 — из полей газет; 5 — 11.'
  ball: 10
  voprosy:
  - q: Сколько стихов Джалиль назвал в завещании в тетради?
    o:
    - '93'
    - '100'
    - '116'
    - '125'
    a: 2
    e: 'В завещании первой тетради: «Он умрёт. Но останется 116 стихов». До нас дошли 93 стихотворения.'
  - q: Какое слово Джалиль написал по-немецки на обложке тетради?
    o:
    - «Дневник»
    - «Словарь»
    - «Песни»
    - «Письма»
    a: 1
    e: 'Надпись «Словарь» обманула надзирателей: внутрь тетради они не заглядывали.'
  - q: Под каким видом Джалиль объезжал лагеря и вербовал подпольщиков?
    o:
    - Отбор певцов в хор
    - Набор переводчиков
    - Проверка больных
    - Раздача газет
    a: 0
    e: Он набирал участников в хор легиона и так находил надёжных людей для подполья.
  - q: Из чего Джалиль сшивал блокноты в тюрьме?
    o:
    - Из обёрточной бумаги
    - Из полей газет
    - Из писем
    - Из листов Библии
    a: 1
    e: 'Бумаги смертнику не давали: он срезал бритвой поля газет и сшивал из них блокноты.'
  - q: Сколько подпольщиков взяли всю вину на себя?
    o:
    - '3'
    - '7'
    - '11'
    - '13'
    a: 2
    e: Джалиль и десять товарищей — одиннадцать человек — взяли вину на себя и отвели расправу от сотен легионеров.
