    otvet: хор
    otvet_edinstvennyj: true
  - id: ns-0207-polya-gazet
    n: 10
    summary: Бумаги смертнику не давали — он срезал бритвой поля газет и сшивал из них блокноты
    det:
    - В тюрьме бумаги не было. Джалиль срезал бритвой чистые поля газет и сшивал из полосок крошечные блокноты. В двух таких тетрадях дошли до нас 93 стихотворения.
    otryvok: Еще он отрывал чистые поля у газет, которые разрешались в тюрьме, и сшивал из них маленькие блокноты. В них он и записывал свои произведения.
    src: 'Источник: Библиотека Финансового университета. «Тетрадь из Моабита. Последний подвиг Мусы Джалиля» — https://library.fa.ru/files/Dghalil.pdf; «Пленный дух Моабита». «Совершенно секретно» — https://www.sovsekretno.ru/articles/istoriya/plennyy-dukh-moabita/'
    stranica: Библиотека Финансового университета. «Тетрадь из Моабита. Последний подвиг Мусы Джалиля»
    href: https://library.fa.ru/files/Dghalil.pdf
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: 93 стихотворения в двух тетрадях с ладонь
    istochnik: fa-tetrad-iz-moabita
    dlya_voprosa: true
    otvet: бритвой
    otvet_edinstvennyj: true
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Ещё о подвиге
  udary:
  - id: ns-0207-berlin
    n: 11
    summary: Избитых узников катали по Берлину, показывая мирную жизнь, — он никого не выдал
    det:
    - После допросов гестаповцы возили избитых подпольщиков по Берлину и показывали улицы, кафе, спокойную жизнь — чтобы сломать их желанием жить. Джалиль никого не выдал.
    otryvok: Избитых и изувеченных людей иногда вывозили в Берлин, останавливаясь в людных местах. Заключенным показывали кусочек мирной жизни, а затем возвращали в тюрьму, где следователь предлагал выдать всех соучастников
    src: 'Источник: Библиотека Финансового университета. «Тетрадь из Моабита. Последний подвиг Мусы Джалиля» — https://library.fa.ru/files/Dghalil.pdf; «Пленный дух Моабита». «Совершенно секретно» — https://www.sovsekretno.ru/articles/istoriya/plennyy-dukh-moabita/'
    stranica: Библиотека Финансового университета. «Тетрадь из Моабита. Последний подвиг Мусы Джалиля»
    href: https://library.fa.ru/files/Dghalil.pdf
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: fa-tetrad-iz-moabita
    dlya_voprosa: true
    otvet: Берлину
    otvet_edinstvennyj: true
  - id: ns-0207-odinnadcat
    n: 12
    summary: Одиннадцать взяли всю вину на себя — и отвели расправу от сотен легионеров
    det:
    - На суде Джалиль и десять его товарищей взяли всю вину на себя. Так они отвели расправу от сотен легионеров, которых гестапо тоже могло обвинить.
    otryvok: В подпольной работе подозревались многие легионеры и военнопленные. Но всю вину на себя взяли 11 человек
    src: 'Источник: «Пленный дух Моабита». «Совершенно секретно» — https://www.sovsekretno.ru/articles/istoriya/plennyy-dukh-moabita/'
    stranica: «Пленный дух Моабита». «Совершенно секретно»
    href: https://www.sovsekretno.ru/articles/istoriya/plennyy-dukh-moabita/
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: 11 человек — футбольная команда
    istochnik: sovsekretno-plennyj-duh
    dlya_voprosa: true
    otvet: '11'
    otvet_edinstvennyj: true
  - id: ns-0207-rozenberg
    n: 13
    summary: Помилование подпольщику группы Джалиля запретил лично рейхсминистр Розенберг
    det:
    - Историк Искандер Гилязов нашёл в Федеральном архиве Берлина документы о деле группы. Просьбу о помиловании одного из подпольщиков отклонил лично рейхсминистр Альфред Розенберг. Их боялись на самом верху рейха.
    otryvok: В случае с Симаевым имею очень серьезные сомнения по поводу дела о помиловании и прошу воздержаться от подобного шага
    src: 'Источник: И. Гилязов о документах Федерального архива Берлина. «Казань Первый» — https://kazanfirst.ru/articles/591193'
    stranica: И. Гилязов о документах Федерального архива Берлина. «Казань Первый»
    href: https://kazanfirst.ru/articles/591193
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: kazanfirst-gilyazov
    dlya_voprosa: true
    otvet: Розенберг
    otvet_edinstvennyj: true
  - id: ns-0207-repeticiya
    n: 14
    summary: Гестапо взяло подполье на «репетиции» — за три дня до восстания легиона
    det:
    - Восстание легиона подпольщики назначили на 14 августа 1943 года. 11 августа участников собрали под видом репетиции — и там гестапо их арестовало.
    otryvok: Восстание было намечено на 14 августа. Однако 11 августа всех «культурных пропагандистов» вызвали в солдатскую столовую
    src: 'Источник: «Пленный дух Моабита». «Совершенно секретно» — https://www.sovsekretno.ru/articles/istoriya/plennyy-dukh-moabita/; Библиотека Финансового университета. «Тетрадь из Моабита. Последний подвиг Мусы Джалиля» — https://library.fa.ru/files/Dghalil.pdf'
    stranica: «Пленный дух Моабита». «Совершенно секретно»
    href: https://www.sovsekretno.ru/articles/istoriya/plennyy-dukh-moabita/
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: 3 дня — от понедельника до четверга
    istochnik: sovsekretno-plennyj-duh
    dlya_voprosa: true
    otvet: '3'
    otvet_edinstvennyj: true
  - id: ns-0207-smeshnye
    n: 15
    summary: В камере смертников он писал и смешные стихи — среди 93 есть юмористические
    det:
    - В двух уцелевших тетрадях — 93 стихотворения. Среди них не только стихи о Родине и мужестве, но и юмористические. В камере смертников поэт не потерял способности смеяться.
    otryvok: В сборнике 93 стихотворения, разных по содержанию и настроению – от обличающих преступления нацистов до юмористических зарисовок.
    src: 'Источник: Национальный музей Республики Татарстан. «Подлинные „Моабитские тетради“ на один день станут доступны публике» — https://tatmuseum.ru/news/podlinnye-moabitskie-tetradi-na-odin-den-stanut-dostupny-publike/'
    stranica: Национальный музей Республики Татарстан. «Подлинные „Моабитские тетради“ на один день станут доступны публике»
    href: https://tatmuseum.ru/news/podlinnye-moabitskie-tetradi-na-odin-den-stanut-dostupny-publike/
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: tatmuseum-tetradi
    dlya_voprosa: true
    otvet: '93'
    otvet_edinstvennyj: true
