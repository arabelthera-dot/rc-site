  - id: ns-0207-gazeta
    n: 8
    summary: Газету немецкого легиона подпольщики нарочно делали «безвредной и скучной»
    det:
    - Немцы выпускали для татарского легиона газету, чтобы склонить пленных на свою сторону. Подпольщики, работавшие в редакции, нарочно делали её «безвредной и скучной» — пропаганда врага не работала.
    otryvok: Среди подпольщиков были те, кто работал в татарской газете, выпускаемой немцами для легионеров, и перед ними стояла задача сделать работу газеты безвредной и скучной, препятствовать появлению антисоветских статей.
    src: 'Источник: «Пленный дух Моабита». «Совершенно секретно» — https://www.sovsekretno.ru/articles/istoriya/plennyy-dukh-moabita/'
