  - id: ns-0207-slovar
    n: 3
    summary: На обложке тетради смертник вывел по-немецки «Словарь» — и надзиратели не заглянули внутрь
    det:
    - Тетради были крошечные — с детскую ладошку. На обложке Джалиль написал по-немецки «Словарь». Надзиратели видели учебную тетрадку для слов и не заглядывали внутрь, а там были стихи.
    otryvok: 'На обложке написано химическим карандашом по-немецки (для отвода глаз гитлеровских тюремщиков): «Словарь немецких, тюркских, русских слов и выражений. Муса Джалиль. 1943-44 г.»'
    src: 'Источник: Оренбургская областная библиотека. «Моабитская тетрадь», предисловие к изданию — https://www.orenlib.ru/up/knigi_o_vojne/doc/Dzhalil_Moabitskaya_tetrad.pdf'
