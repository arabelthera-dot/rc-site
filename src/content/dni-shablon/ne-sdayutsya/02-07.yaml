vizual:
  imya: dzhalil-moabitskaya-tetrad
  vid: predmet
  kicker: Предмет
  h2: «Моабитская тетрадь», 1959 год
  lead: Книга со стихами, которые Джалиль написал в тюрьме Моабит. Нажми — и рассмотри её вблизи.
audioguide:
  audioSrc: audio-guide-dzhalil-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от тетради, названной «Словарём», через хор легиона и газетные поля — к подъёму на казнь с поднятой головой: пять остановок.'
  stops:
    - t: 0
      mark: '0:00'
      title: 'Тетрадь под видом словаря'
    - t: 25
      mark: '0:25'
      title: 'Хор вместо штаба'
    - t: 50
      mark: '0:50'
      title: 'Блокноты из газетных полей'
    - t: 75
      mark: '1:15'
      title: 'Одиннадцать против рейха'
    - t: 100
      mark: '1:40'
      title: 'Весть из тюремного двора'
  transcript:
    - 'Седьмое февраля тысяча девятьсот сорок четвёртого года, Дрезден: начинается суд над поэтом Мусой Джалилем и десятью его товарищами. На обложке тетради смертник вывел по-немецки «Словарь» — и надзиратели не заглянули внутрь. Завещание в тетради: «Его присудят к смертной казни. Он умрёт. Но останется сто шестнадцать стихов».'
    - 'Под видом отбора певцов в хор легиона он объезжал лагеря и вербовал подпольщиков. Газету немецкого легиона подпольщики нарочно делали «безвредной и скучной». Гестапо взяло подполье на «репетиции» — за три дня до восстания легиона.'
    - 'Бумаги смертнику не давали — он срезал бритвой поля газет и сшивал из них блокноты. Избитых узников катали по Берлину, показывая мирную жизнь, — он никого не выдал. В камере смертников он писал и смешные стихи — среди девяноста трёх есть юмористические.'
    - 'Следователь гестапо: «Того, что вы сделали, хватит на десять смертных приговоров». Одиннадцать взяли всю вину на себя — и отвели расправу от сотен легионеров. Помилование подпольщику группы Джалиля запретил лично рейхсминистр Розенберг. Надзиратель тюрьмы: «Не видел, чтобы на казнь шли с поднятой головой и пели».'
    - 'В конце тетради — двенадцать имён арестованных, жирная черта и тринадцатое: имя предателя. В тысяча девятьсот сорок пятом солдат нашёл в мусоре двора Моабита записку: «Я, татарский поэт Муса Джалиль…». А в сорок шестом МГБ объявило его в розыск как изменника — хотя его казнили почти за два года до этого. Тетрадь дошла до Казани, и стихи из Моабита живут. Ниже — викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
