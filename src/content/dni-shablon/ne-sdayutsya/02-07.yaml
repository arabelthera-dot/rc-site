  - id: ns-0207-hor
    n: 9
    summary: Под видом отбора певцов в хор легиона он объезжал лагеря и вербовал подпольщиков
    det:
    - Джалилю поручили набирать участников в хоровую капеллу легиона. Он ездил по лагерям военнопленных, под видом отбора певцов, а на деле находил надёжных людей и привлекал их в подполье.
    otryvok: Джалиль, разъезжая по лагерям для военнопленных, устанавливал конспиративные связи и под видом отбора самодеятельных артистов для созданной в легионе хоровой капеллы вербовал новых членов подпольной организации.
    src: 'Источник: Библиотека Финансового университета. «Тетрадь из Моабита. Последний подвиг Мусы Джалиля» — https://library.fa.ru/files/Dghalil.pdf'
