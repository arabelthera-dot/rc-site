  - id: ns-0207-rozysk
    n: 4
    summary: В 1946-м МГБ объявило его в розыск как изменника — а его казнили почти за два года до этого
    det:
    - 'После войны имя Джалиля считали именем предателя: в 1946 году МГБ завело на него розыскное дело как на изменника Родины. А его казнили в Берлине ещё в августе 1944 года. Правду открыли тетради.'
    otryvok: В 1946 году Министерство госбезопасности СССР завело на него розыскное дело. Он обвинялся в измене родине и пособничестве врагу.
