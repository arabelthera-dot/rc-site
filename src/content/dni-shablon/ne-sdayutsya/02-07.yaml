story:
  kicker: Подвиг
  h2: Муса Джалиль
  abzacy:
  - 'Татарский поэт Муса Джалиль попал в плен в 1942 году. В лагерях он не сдался: немцы собирали из пленных легион, а Джалиль под видом набора певцов в хор объезжал лагеря и находил своих. В редакции легионной газеты подпольщики нарочно делали её «безвредной и скучной».'
  - Восстание легиона назначили на 14 августа 1943 года. За три дня до него гестапо арестовало подпольщиков, собрав их под видом репетиции. 7 февраля 1944 года в Дрездене начался суд. Одиннадцать человек взяли всю вину на себя и отвели расправу от сотен легионеров.
  - В тюрьме Моабит бумаги смертнику не давали. Джалиль срезал бритвой поля газет и сшивал из них крошечные блокноты, а на обложке писал по-немецки «Словарь». В августе 1944 года его казнили в Берлине. Две тетради с 93 стихотворениями вынесли из тюрьмы и сохранили — так «Моабитская тетрадь» вернула поэту честное имя.
