  udary:
  - id: ns-0207-spisok-13
    n: 1
    summary: 'В конце тетради — 12 имён арестованных, жирная черта и тринадцатое: имя предателя'
    det:
    - 'На последних страницах тетради Джалиль записал имена двенадцати арестованных товарищей. Под ними — жирная черта, а ниже — тринадцатое имя: того, кто их выдал. Из камеры смертника он оставил потомкам и список героев, и имя доносчика.'
    otryvok: Затем он провел жирную черту и приписал фамилию тринадцатого — предателя, выдавшего подпольную организацию.
