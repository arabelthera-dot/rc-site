  - id: ns-0207-zapiska
    n: 6
    summary: 'В 1945-м солдат нашёл в мусоре двора Моабита записку: «Я, татарский поэт Муса Джалиль…»'
    det:
    - 'Весной 1945 года в Берлин вошли советские войска. Во дворе тюрьмы Моабит солдат нашёл среди мусора листок: «Я, татарский поэт Муса Джалиль…». Весть о поэте дошла до своих через клочок бумаги.'
    otryvok: 'И среди мусора во дворе тюрьмы кто-то из солдат случайно заметил листок с записью на русском языке: «Я, татарский поэт Муса Джалиль, заключен в Моабитскую тюрьму как пленный, которому предъявлены политические обвинения, и, наверное, буду скоро расстрелян.'
    src: 'Источник: Национальная электронная библиотека Республики Татарстан. «История „Моабитской тетради“» — https://kitap.tatar.ru/ru/site/42217989-7/news/83841/; Библиотека Финансового университета. «Тетрадь из Моабита. Последний подвиг Мусы Джалиля» — https://library.fa.ru/files/Dghalil.pdf'
