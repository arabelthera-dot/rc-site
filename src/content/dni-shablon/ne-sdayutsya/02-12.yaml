story:
  kicker: Подвиг
  h2: Вера Волошина
  abzacy:
  - Ноябрь 1941 года, немцы под Москвой. Вера Волошина, студентка из Кемерова, служит разведчицей в войсковой части № 9903 штаба Западного фронта. Семь раз она уходит в немецкий тыл и возвращается. 21 ноября группа уходит в восьмой раз — вместе с Зоей Космодемьянской.
  - Группа попадает в засаду. Раненная в плечо Вера остаётся ближе всех к врагу и прикрывает отход товарищей огнём из автомата. Немцы берут её в плен. Всю ночь её пытают, а она называет себя чужой фамилией — Гора — и не выдаёт никого.
  - 29 ноября 1941 года в деревне Головково Веру вешают. С петлёй на шее она поёт «Интернационал» и кричит своё настоящее имя. В тот же день в десяти километрах казнят Зою. Звание Героя Российской Федерации Вера Волошина получает посмертно, в 1994 году.
