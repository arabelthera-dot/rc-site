  - n: 4
    id: ns-0212-internacional
    summary: В кузове немецкого грузовика, с петлёй на шее, она запела «Интернационал».
    det:
    - Казнь готовят на виду у согнанных жителей. Вера стоит в кузове грузовика, на шее уже петля, — и поёт.
    src: 'Источник: «Герои страны». Волошина Вера Даниловна — https://warheroes.ru/hero/hero.asp?Hero_id=3289; Л. Максименко. «„Меня зовут Гора!“: стали известны последние часы советской разведчицы из Кузбасса Веры Волошиной перед казнью», «Комсомольская правда — Кузбасс», 28.11.2024 — https://www.kem.kp.ru/daily/27666/5017533/'
