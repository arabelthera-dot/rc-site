  - n: 8
    id: ns-0212-nasha-partizanka
    summary: Деревня, не зная имени, звала её «наша партизанка», а мать 15 лет считала пропавшей без вести.
    det:
    - Жители Головкова хоронят казнённую девушку, не зная, кто она. Дома, в Кемерове, мать ждёт письма, а дочь числится пропавшей без вести.
    src: 'Источник: «Наша партизанка», «НЭП. Моя бытейская история» — https://www.nepsite.ru/articles/byt-history/nasha-partizanka/; «Не судьба Веры Волошиной», «Аргументы и факты» — https://aif.ru/society/history/29421; «Вера Волошина», «1941–1942: Московская битва» — https://1941-1942.ru/vera-voloshina/'
    stranica: статья
    href: https://www.nepsite.ru/articles/byt-history/nasha-partizanka/
    otryvok: «А разведчица Вера Волошина 15 лет считалась пропавшей без вести, поэтому о её подвиге никто не знал.»
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: 15 лет — столько, сколько учатся в школе и институте вместе
