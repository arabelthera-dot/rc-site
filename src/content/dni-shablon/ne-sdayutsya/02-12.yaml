  - n: 13
    id: ns-0212-frolov
    summary: Журналист Георгий Фролов 15 лет шёл по её следу по деревням и нашёл свидетелей казни.
    det:
    - Журналист из Кемерова выясняет, что стало с землячкой. Он ездит по подмосковным деревням, опрашивает жителей и находит тех, кто видел казнь. Потом пишет о Вере книги.
    src: 'Источник: «Названая сестра Зои Космодемьянской», РИА Новости, 29.11.2011 — https://ria.ru/20111129/501268214.html'
