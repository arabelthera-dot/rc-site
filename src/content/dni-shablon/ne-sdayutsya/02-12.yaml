    otvet: 15 лет
    otvet_edinstvennyj: true
  - n: 9
    id: ns-0212-arhiv-ssha
    summary: Доклад немецкого полка о её допросе нашёлся в архиве США — через 83 года.
    det:
    - Немцы составляют о допросе пленной бумагу. Её копия попадает в американский архив, и в 2024 году историки находят и переводят этот доклад.
    src: 'Источник: Л. Максименко. «Белое платье Веры Волошиной», «Комсомольская правда — Кузбасс», 13.05.2025 — https://www.kem.kp.ru/daily/27698/5087056/; «Вера Волошина», «1941–1942: Московская битва» — https://1941-1942.ru/vera-voloshina/'
    stranica: статья
    href: https://www.kem.kp.ru/daily/27698/5087056/
    otryvok: «Копией допроса (из документов 292-й пехотной дивизии вермахта, из Национального управления архивов и документации США) в переводе историка Сергея Вершинина.»
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: 83 года — дольше, чем живёт большинство людей
    istochnik: n3
    dlya_voprosa: true
    otvet: '83'
    otvet_edinstvennyj: true
  - n: 10
    id: ns-0212-zoya-10-km
    summary: В один день и в 10 км друг от друга немцы казнили двух подруг — Веру и Зою Космодемьянскую.
    det:
    - Вера и Зоя служат в одной части и уходят на задание вместе. 29 ноября 1941 года Зою вешают в Петрищеве, Веру — в Головкове.
    src: 'Источник: «К 100-летию разведчицы Веры Волошиной в Музее Победы открылась выставка», «Новости Москвы» (smi24.news) — https://smi24.news/k-100-letiyu-razvedchiczy-very-voloshinoj-v-muzee-pobedy-otkrylas-vystavka/; «„Наши все равно победят“: сила воли простой разведчицы Веры Волошиной», RuBaltic.ru, 02.11.2022 — https://www.rubaltic.ru/context/02112022-nashi-vse-ravno-pobedyat-sila-voli-prostoy-razvedchitsy-very-voloshinoy-ee-veli-na-kazn-a-ona-pela/'
    stranica: статья
    href: https://smi24.news/k-100-letiyu-razvedchiczy-very-voloshinoj-v-muzee-pobedy-otkrylas-vystavka/
    otryvok: «Их повесили в один день, 29 ноября. Только Зою – в Петрищево, а Веру в десяти километрах от нее, в деревне Головково.»
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: 10 км — около двух часов пешком
    istochnik: n13
    dlya_voprosa: false
- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Ещё о подвиге
  udary:
  - n: 11
    id: ns-0212-malchishki
    summary: Мальчишки 13 и 16 лет тайком срезали её тело с ивы под носом у немцев.
    det:
    - Тело казнённой не дают снять. Деревенские подростки ночью в снегопад срезают его и прячут в снегу в овраге.
    src: 'Источник: Л. Максименко. «„Меня зовут Гора!“: стали известны последние часы советской разведчицы из Кузбасса Веры Волошиной перед казнью», «Комсомольская правда — Кузбасс», 28.11.2024 — https://www.kem.kp.ru/daily/27666/5017533/; Л. Максименко. «Вера сильнее смерти», «Комсомольская правда — Кузбасс», 29.11.2025 — https://www.kem.kp.ru/daily/27749.5/5177787/'
    stranica: статья
    href: https://www.kem.kp.ru/daily/27666/5017533/
    otryvok: «они, мальчишки, через несколько дней в снегопад тайно срезали тело девушки и спрятали в снегу в овраге, рискуя жизнями…»
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: 13 лет — это седьмой класс
    istochnik: n2
    dlya_voprosa: false
  - n: 12
    id: ns-0212-foto-2015
    summary: Немцы сами фотографировали её казнь, и эти снимки в 2015-м нашёл русский историк.
    det:
    - Немецкие солдаты снимают казнь на память. Через десятки лет эти кадры всплывают среди старых немецких фотографий на интернет-аукционах.
    src: 'Источник: Л. Максименко. «Вера сильнее смерти», «Комсомольская правда — Кузбасс», 29.11.2025 — https://www.kem.kp.ru/daily/27749.5/5177787/'
    stranica: статья
    href: https://www.kem.kp.ru/daily/27749.5/5177787/
    otryvok: «Тогда, в 2015-м Александр Никитин, историк из Рязани, нашел на международных интернет-аукционах в выкладке старых немецких фотографий кадры с неизвестной казненной фашистами девушкой.»
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
