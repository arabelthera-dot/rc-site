    summary: За месяц Вера семь раз ушла в немецкий тыл и вернулась, восьмой раз стал последним.
    det:
    - В октябре 1941 года Вера становится бойцом войсковой части № 9903 разведотдела штаба Западного фронта. Семь раз она переходит линию фронта и возвращается. 21 ноября группа уходит в восьмой раз.
    src: 'Источник: «Герои страны». Волошина Вера Даниловна — https://warheroes.ru/hero/hero.asp?Hero_id=3289'
    stranica: страница героя
