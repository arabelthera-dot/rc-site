    summary: Всю ночь немцы пытали её — и не услышали ни одного имени товарища.
    det:
    - Раненую разведчицу приводят в здание бывшей школы, где стоит немецкий штаб. Допрос с пытками идёт до утра, но Вера не называет никого из группы.
    src: 'Источник: Л. Максименко. «„Меня зовут Гора!“: стали известны последние часы советской разведчицы из Кузбасса Веры Волошиной перед казнью», «Комсомольская правда — Кузбасс», 28.11.2024 — https://www.kem.kp.ru/daily/27666/5017533/; «Названая сестра Зои Космодемьянской», РИА Новости, 29.11.2011 — https://ria.ru/20111129/501268214.html'
    stranica: статья
    href: https://www.kem.kp.ru/daily/27666/5017533/
    otryvok: «В здании бывшей школы, где находился немецкий штаб, ее допрашивали и пытали всю ночь.»
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n2
