    summary: 'Из одной кемеровской школы №12 вышли два Героя: Вера и её жених комбат Юрий Двужильный.'
    det:
    - Вера и Юрий учатся в одном классе кемеровской школы. 21 июня 1941 года подруги покупают Вере свадебное платье. Юрий Двужильный погибнет комбатом и станет Героем Советского Союза.
