    src: 'Источник: Л. Максименко. «„Меня зовут Гора!“: стали известны последние часы советской разведчицы из Кузбасса Веры Волошиной перед казнью», «Комсомольская правда — Кузбасс», 28.11.2024 — https://www.kem.kp.ru/daily/27666/5017533/; «Вера Волошина», «1941–1942: Московская битва» — https://1941-1942.ru/vera-voloshina/'
    stranica: статья
    href: https://www.kem.kp.ru/daily/27666/5017533/
    otryvok: «В начале допроса Гора заявила, что относится к группе статистов, принимавшей участие в съемках… пропагандистского фильма.»
