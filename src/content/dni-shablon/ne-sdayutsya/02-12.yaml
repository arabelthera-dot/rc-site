  transcript:
  - Осень тысяча девятьсот сорок первого года, немцы под Москвой. Вера Волошина, студентка из Кемерова, служит разведчицей. За месяц она семь раз уходит в немецкий тыл и возвращается.
  - Двадцать первого ноября группа уходит в восьмой раз. Попав в засаду, разведчики отходят к лесу. Раненная в плечо Вера остаётся ближе всех к немцам и прикрывает отход товарищей из автомата.
  - Немцы берут её в плен. Всю ночь её пытают — и не слышат ни одного имени. Она называет себя Верой Горой и выдумывает, что она статистка со съёмок фильма.
  - 'Двадцать девятого ноября в деревне Головково, с петлёй на шее, она поёт «Интернационал», говорит немцам: «Наши всё равно победят» — и кричит: «Я — Волошина!» В тот же день в десяти километрах казнят Зою Космодемьянскую.'
  - Пятнадцать лет мать считает её пропавшей без вести. Журналист Георгий Фролов находит свидетелей казни. Через пятьдесят три года, в тысяча девятьсот девяносто четвёртом, Вера Волошина становится Героем Российской Федерации.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
