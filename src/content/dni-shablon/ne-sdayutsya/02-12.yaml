quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — Гора; 2 — статисткой со съёмок фильма; 3 — семь; 4 — 10 км; 5 — через 53 года.'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: какой фамилией назвалась Вера на допросе у немцев?'
    o:
    - Иванова
    - Гора
    - Петрова
    - Лесная
    a: 1
    e: 'На допросе Вера назвалась немцам «Верой Горой», а перед казнью крикнула: «Я — Волошина!»'
  - q: Кем Вера назвалась немцам на допросе?
    o:
    - медсестрой
    - учительницей
    - статисткой со съёмок фильма
    - почтальоном
    a: 2
    e: Вера выдумала для немцев, что она статистка со съёмок фильма.
  - q: Сколько раз Вера ушла в немецкий тыл и вернулась?
    o:
    - два
    - пять
    - семь
    - десять
    a: 2
    e: За месяц Вера семь раз ушла в немецкий тыл и вернулась, восьмой раз стал последним.
  - q: Сколько километров было между местами казни Веры и Зои Космодемьянской?
    o:
    - 1 км
    - 10 км
    - 50 км
    - 100 км
    a: 1
    e: В один день и в 10 км друг от друга немцы казнили двух подруг — Веру и Зою Космодемьянскую.
  - q: Через сколько лет Веру признали Героем?
    o:
    - через 5 лет
    - через 20 лет
    - через 53 года
    - через 100 лет
    a: 2
    e: Героем её признали через 53 года — уже Героем России, страны, которой в 1941-м не было.
