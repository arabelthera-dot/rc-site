  - n: 3
    id: ns-0212-prikryla-othod
    summary: Раненая в плечо, Вера осталась ближе всех к немцам и автоматом прикрыла отход своей группы.
    det:
    - Разведгруппа попадает в засаду и отходит к лесу. Вера остаётся ближе всех к врагу и, уже раненая в плечо, стреляет из автомата, пока товарищи уходят.
    src: 'Источник: «К 100-летию разведчицы Веры Волошиной в Музее Победы открылась выставка», «Новости Москвы» (smi24.news) — https://smi24.news/k-100-letiyu-razvedchiczy-very-voloshinoj-v-muzee-pobedy-otkrylas-vystavka/; «„Наши все равно победят“: сила воли простой разведчицы Веры Волошиной», RuBaltic.ru, 02.11.2022 — https://www.rubaltic.ru/context/02112022-nashi-vse-ravno-pobedyat-sila-voli-prostoy-razvedchitsy-very-voloshinoy-ee-veli-na-kazn-a-ona-pela/; «Наро-Фоминский историко-краеведческий музей получил документ, рассказывающий о подвиге Веры Волошиной», «Регион. Наро-Фоминск» — https://regions.ru/naro-fominsk/obshchestvo/naro-fominskiy-istoriko-kraevedcheskiy-muzey-poluchil-dokument-rasskazyvayuschiy-o-podvige-very-voloshinoy'
