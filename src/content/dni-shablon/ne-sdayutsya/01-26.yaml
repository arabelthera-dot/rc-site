story:
  kicker: Среда подвига
  h2: Корабль с надувной дверью
  abzacy:
    - "Вскоре после полёта Гагарина Сергей Королёв решил готовить выход человека из корабля в открытый космос. Для этого трёхместный «Восход» переделали в двухместный «Восход-2»: экипажу нужно было место, чтобы готовиться к выходу прямо в кабине."
    - "Шлюзовую камеру сделали «мягкой»: надувную трубу из 36 секций, которую разворачивали уже на орбите, снаружи корабля. <b>Внутренний диаметр камеры — один метр, а скафандр «Беркут» в плечах — 68 сантиметров.</b> Кислород космонавт получал из ранца на спине. Связь с кораблём держалась по кабелю, двигаться в скафандре было очень трудно — так об этом рассказывает сегодняшний руководитель предприятия «Звезда», где делают скафандры."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Алексей Леонов — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Леонов сам, не спрашивая Землю, стравил давление в скафандре и протиснулся в шлюз.</b>
        det:
          - "В пустоте скафандр раздуло так, что, по словам Леонова, «пальцы вышли из перчаток, а ноги из сапог». Согласовывать было некогда, и он сбросил давление до аварийного. Это грозило закипанием азота в крови: «Но что мне оставалось делать?» Леонов рассчитал, что за час дыхания чистым кислородом азот из крови должен был «вымыться»."
        src: "Источник: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025 — https://ria.ru/20250318/kosmos-2005530278.html; «Шаг за край. 45 лет выходу человека в открытый космос», РИА Новости, 18.03.2010, https://ria.ru/20100318/215081522.html"
        stranica: «Шаг за край. 45 лет выходу человека в открытый космос», РИА Новости, 18.03.2010
        href: https://ria.ru/20100318/215081522.html
        otryvok: «Тогда космонавт, не советуясь с Землёй, принял решение сбросить давление в скафандре.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-26-goskatalog-8941182.jpg
          alt: Белый скафандр с гермошлемом, перчатками и ботинками стоит в витрине на зелёной подсветке.
          data_source: https://goskatalog.ru/portal/#/collections?id=8941182
          license: ст. 1274 ГК РФ
          podpis: Скафандр «Беркут» для внекорабельной деятельности, 1963–1964 гг. — в таком Леонов вышел в открытый космос.
          credit: ГБУК г. Москвы «Мемориальный музей космонавтики», Госкаталог № 8941182
          width: 353
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Леонов и Беляев семь часов летели в кабине, где кислорода было почти втрое больше нормы.</b>
        det:
          - "После возвращения Леонова люк закрылся неплотно, и система жизнеобеспечения стала нагнетать кислород. Парциальное давление дошло до 460 мм при норме 160 мм, и любая искра могла вызвать пожар. Спасла случайность: Леонов, по его словам, «шлангом от скафандра задел за тумблер наддува», давление обжало корпус, и люк сел на уплотнитель. «Семь часов в таком состоянии, а потом заснули… видимо, от стресса»."
        src: "Источник: «Как космонавт Алексей Леонов пожелал американцам жизни, полной секса» (к 90-летию Леонова), «Родина», 30.05.2024, https://rodina-history.ru/2024/05/30/kak-kosmonavt-aleksej-leonov-pozhelal-amerikancam-zhizni-polnoj-seksa.html; РИА Новости, 18.03.2010, https://ria.ru/20100318/215081522.html"
        stranica: «Как космонавт Алексей Леонов пожелал американцам жизни, полной секса» (к 90-летию Леонова), «Родина», 30.05.2024
        href: https://rodina-history.ru/2024/05/30/kak-kosmonavt-aleksej-leonov-pozhelal-amerikancam-zhizni-polnoj-seksa.html
        otryvok: «Начало расти парциальное давление кислорода (в кабине), которое дошло до 460 мм и продолжало расти. Это при норме 160 мм!.. … Семь часов в таком состоянии, а потом заснули... видимо, от стресса. Чуть позже мы разобрались, что я шлангом от скафандра задел за тумблер наддува...»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Беляев отстегнулся, встал и первым в истории посадил космический корабль вручную.</b>
        det:
          - "Автоматика отказала. Иллюминаторы «Восхода-2» не позволяли управлять кораблём из кресел, поэтому командиру пришлось отстегнуться, встать, развернуть корабль и лечь обратно. Секунды, ушедшие на это, увели корабль на 80 км от расчётной траектории: 19 марта «Восход-2» сел в заснеженной тайге, примерно в 180 км северо-западнее Перми."
        src: "Источник: РИА Новости, «Шаг за край…», 18.03.2010, https://ria.ru/20100318/215081522.html; «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025 — https://ria.ru/20250318/kosmos-2005530278.html"
        stranica: РИА Новости, «Шаг за край…», 18.03.2010
        href: https://ria.ru/20100318/215081522.html
        otryvok: «Павел Беляев принял решение сажать аппарат вручную – впервые в истории космических полётов. Но компоновка иллюминаторов «Восхода-2» не обеспечивала ручного управления непосредственно из ложементов. Нужно было отстегнуться, встать, осмотреться, развернуть корабль и лечь обратно.»
        utverzhden: 2026-11-03
      - summary: <b>Леонов и Беляев грелись у костра в тайге, вокруг выли волки, а укрывались обшивкой скафандров.</b>
        det:
          - Космонавты содрали со скафандров экранно-вакуумную теплоизоляцию, завернулись в неё, как в одеяла, и обвязались парашютными стропами. Они таскали к костру сухостой, но на глубоком снегу он плохо разгорался, и доедали бортовой запас еды. С вертолёта их заметили как раз посреди такого «обеда». Из заснеженной тайги космонавтов вытащили только на третьи сутки.
        src: "Источник: РИА Новости, «Шаг за край…», 18.03.2010, https://ria.ru/20100318/215081522.html; «Как космонавта Леонова спасали в тайге — секретный архив показали его дочери», «Родина», 24.07.2026, https://rodina-history.ru/2026/07/24/kak-kosmonavta-leonova-spasali-v-tajge-sekretnyj-arhiv-pokazali-ego-docheri.html"
        stranica: РИА Новости, «Шаг за край…», 18.03.2010
        href: https://ria.ru/20100318/215081522.html
        otryvok: «они выдрали из них экранно-вакуумную теплоизоляцию и обернулись в неё как в одеяла, обвязавшись парашютными стропами. Вокруг выли волки, а космонавты таскали сухостой к костру (на глубоком снегу он разгорался плохо) и доедали бортовые запасы пищи.»
        utverzhden: 2026-11-03
      - summary: "<b>Леонов вылез из скафандра после выхода и вспоминал: «Пота было по колено».</b>"
        det:
          - "Пока он разворачивался в шлюзе диаметром метр (скафандр в плечах 68 см), пульс подскочил до 190 ударов в минуту, а от пота он почти ничего не видел. В тайге мокрое бельё пришлось выжать: космонавты разделись догола и надели его снова, а мороз был минус 25."
        src: "Источник: РИА Новости, 18.03.2010, https://ria.ru/20100318/215081522.html; «Родина», 24.07.2026, https://rodina-history.ru/2026/07/24/kak-kosmonavta-leonova-spasali-v-tajge-sekretnyj-arhiv-pokazali-ego-docheri.html"
        stranica: РИА Новости, 18.03.2010
        href: https://ria.ru/20100318/215081522.html
        otryvok: «Сняв скафандры («Пота было по колено» – вспоминает Леонов)»
        utverzhden: 2026-11-03
      - summary: "<b>Леонов нарушил инструкцию: вошёл в шлюз головой вперёд и развернулся в метровой камере.</b>"
        det:
          - "По инструкции входили ногами, но раздутый скафандр этого не позволял. В 11:47 Леонов протиснулся головой вперёд, а затем развернулся: внутренний диаметр шлюза 1 м, скафандр в плечах 68 см. В корабль всё равно надо было входить ногами, потому что крышка люка открывалась внутрь и занимала 30% кабины. Сам Леонов говорил: «Понятия не имею, как это у меня получилось»."
        src: "Источник: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025 — https://ria.ru/20250318/kosmos-2005530278.html; РИА Новости, 18.03.2010, https://ria.ru/20100318/215081522.html"
        stranica: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025
        href: https://ria.ru/20250318/kosmos-2005530278.html
        otryvok: «Леонов протиснулся в шлюз головой вперед вопреки инструкции заходить в него ногами. Это произошло в 11 часов 47 минут.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-26-goskatalog-36019420.jpg
          alt: "Чёрно-белое фото: космонавт в скафандре с ранцем парит в воздухе внутри салона самолёта."
          data_source: https://goskatalog.ru/portal/#/collections?id=36019420
          license: ст. 1274 ГК РФ
          podpis: Леонов в скафандре «Беркут» на тренировке невесомости в салоне самолёта Ту-104, 1965 год.
          credit: ГБУК г. Москвы «Мемориальный музей космонавтики», № ММК-IV-Ф-3620, Госкаталог № 36019420
          width: 616
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Леонов не пролезал в люк с зазором 2 см, а кислорода в скафандре было всего на 20 минут.</b>
        det:
          - Кислород в скафандре был рассчитан на 20 минут. Даже в обычном состоянии между плечом скафандра и краем люка было всего 20 мм. Скафандр раздулся, и не помогли ни рёбра жёсткости, ни плотная ткань. Леонов сделал несколько безуспешных попыток протиснуться внутрь, пока не решился сбросить давление.
        src: "Источник: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025 — https://ria.ru/20250318/kosmos-2005530278.html"
        stranica: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025
        href: https://ria.ru/20250318/kosmos-2005530278.html
        otryvok: «В обычном состоянии зазор между скафандром у каждого плеча Леонова и краем люка составлял всего 20 миллиметров. Космонавт сделал несколько безрезультатных попыток протиснуться в шлюз.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-26-goskatalog-8941182.jpg
          alt: Белый скафандр с гермошлемом, перчатками и ботинками стоит в витрине на зелёной подсветке.
          data_source: https://goskatalog.ru/portal/#/collections?id=8941182
          license: ст. 1274 ГК РФ
          podpis: Скафандр «Беркут» для внекорабельной деятельности, 1963–1964 гг. — в таком Леонов вышел в открытый космос.
          credit: ГБУК г. Москвы «Мемориальный музей космонавтики», Госкаталог № 8941182
          width: 353
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Леонов взял на «Восход-2» цветные карандаши и, по его словам, первым рисовал в полёте.</b>
        det:
          - "Сам Леонов вспоминал: «На борт „Восхода-2“ я взял с собой цветные карандаши, и мне удалось зарисовать виды, которые произвели на меня наибольшее впечатление. При этом меня вдохновляло сознание того, что в этой области живописи я был первым. Я рисовал Солнце и Землю». По его словам, в полёте у него рождалось чувство, «будто я — космический Микеланджело». В открытом космосе он вспомнил, как расспрашивал Гагарина о том, как выглядят звёзды и Земля, и пришёл к выводу, что, пока сам такого не увидишь, правдоподобно нарисовать не сможешь."
        src: "Источник: «Космический Микеланджело», «Российская газета», 11.04.2025, https://rg.ru/2025/04/11/kosmicheskij-mikelandzhelo.html; РИА Новости, 18.03.2010, https://ria.ru/20100318/215081522.html"
        stranica: «Космический Микеланджело», «Российская газета», 11.04.2025
        href: https://rg.ru/2025/04/11/kosmicheskij-mikelandzhelo.html
        otryvok: «На борт "Восхода-2" я взял с собой цветные карандаши, и мне удалось зарисовать виды, которые произвели на меня наибольшее впечатление. При этом меня вдохновляло сознание того, что в этой области живописи я был первым.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-26-goskatalog-57122082.jpg
          alt: "Лист бумаги с наброском ручкой: человечек с ранцем парит горизонтально; рядом надпись «Рисунок Леонова во время разговора 08.04.65»."
          data_source: https://goskatalog.ru/portal/#/collections?id=57122082
          license: ст. 1274 ГК РФ
          podpis: Рисунок Алексея Леонова «Парящий в космосе космонавт», 8 апреля 1965 года — через три недели после выхода.
          credit: ФГБУК «Государственный исторический музей», № Арх. 6236, Госкаталог № 57122082
          width: 800
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Леонов и Беляев выжили в тайге в унтах, сброшенных с воздуха, а куртки повисли на ветках.</b>
        det:
          - Космонавты передали свои координаты, и через несколько часов над ними уже кружили самолёты и вертолёты, но сесть в тайге было негде. Куртки, сброшенные с воздуха, застряли высоко на ветках, долетели только унты, и они спасли. А сброшенная бутылка коньяка разбилась. На Байконуре Гагарин и Королёв удивились, когда экипаж вышел из самолёта в унтах и меховых куртках. Об этом рассказала дочь космонавта Оксана Леонова.
        src: "Источник: «Как космонавта Леонова спасали в тайге — секретный архив показали его дочери», «Родина», 24.07.2026, https://rodina-history.ru/2026/07/24/kak-kosmonavta-leonova-spasali-v-tajge-sekretnyj-arhiv-pokazali-ego-docheri.html"
        stranica: «Как космонавта Леонова спасали в тайге — секретный архив показали его дочери», «Родина», 24.07.2026
        href: https://rodina-history.ru/2026/07/24/kak-kosmonavta-leonova-spasali-v-tajge-sekretnyj-arhiv-pokazali-ego-docheri.html
        otryvok: «Когда Леонову и Беляеву скидывали теплую одежду, куртки застряли высоко на ветках, а из теплого долетели только унты. Но они их тогда и спасли. А вот сброшенная бутылка коньяка разбилась.»
        utverzhden: 2026-11-03
      - summary: <b>Леонов швырнул кинокамеру в шлюз впереди себя, а при развороте едва не упустил её в космос.</b>
        det:
          - "Входя в шлюз головой вперёд, Леонов бросил перед собой кинокамеру. Когда он разворачивался в камере длиной 2,5 м и шириной 1 м, то чуть не вытолкнул её в открытый космос, но успел поймать. На госкомиссии 22 марта 1965 года он ругал съёмочную технику: «Было очень стыдно выходить с такой оптикой в космос»."
        src: "Источник: РИА Новости, 18.03.2010, https://ria.ru/20100318/215081522.html; «„Понесся на «Восход»…“ Как 60 лет назад Алексей Леонов в открытый космос выходил», «Российская газета», 18.03.2025, https://rg.ru/2025/03/18/60-let-nazad-kosmonavt-aleksej-leonov-pervym-v-istorii-shagnul-v-otkrytyj-kosmos.html"
        stranica: РИА Новости, 18.03.2010
        href: https://ria.ru/20100318/215081522.html
        otryvok: «В процессе «разворачивания» Леонов чуть было не вытолкнул в открытый космос кинокамеру, но успел её поймать.»
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Леонов дёрнул фал, полетел на корабль и рукой «отпружинил» от него, чтобы не разбить шлем.</b>
        det:
          - "Это рассказ из доклада Леонова на госкомиссии 22 марта 1965 года, который РГАНТД полностью опубликовал только в 2024 году: «понесся на „Восход“… выставил руку, „отпружинил“ от корабля и начал вращаться». В последний раз он отошёл от корабля, чтобы понять, почему его закручивает. За 20 минут работы в жёстком скафандре он, по его словам, ослаб. Увидев планету, Леонов сказал: «А Земля-то круглая…»"
        src: "Источник: «Российская газета», 18.03.2025, https://rg.ru/2025/03/18/60-let-nazad-kosmonavt-aleksej-leonov-pervym-v-istorii-shagnul-v-otkrytyj-kosmos.html; «„А Земля-то круглая“. 60 лет назад человек впервые вышел в открытый космос», «Родина», 18.03.2025, https://rodina-history.ru/2025/03/18/a-zemlia-to-kruglaia-60-let-nazad-chelovek-vpervye-vyshel-v-otkrytyj-kosmos.html"
        stranica: «Российская газета», 18.03.2025
        href: https://rg.ru/2025/03/18/60-let-nazad-kosmonavt-aleksej-leonov-pervym-v-istorii-shagnul-v-otkrytyj-kosmos.html
        otryvok: «В какой-то момент Леонов осмелел, резко дернул фал, и - понесся на "Восход". Чтобы не разбить шлем, выставил руку, "отпружинил" от корабля и начал вращаться.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Королёв проводил экипаж «Восхода-2» словами: «Наверное, последний раз я тут с вами».</b>"
        det:
          - Королёв сказал это утром 18 марта 1965 года, провожая Беляева и Леонова в полёт. Через 10 месяцев главного конструктора не стало.
        src: "Источник: РИА Новости, «Шаг за край…», 18.03.2010, https://ria.ru/20100318/215081522.html"
        stranica: РИА Новости, «Шаг за край…», 18.03.2010
        href: https://ria.ru/20100318/215081522.html
        otryvok: «„Наверное, последний раз я тут с вами“, – невесело сказал Сергей Павлович Королёв утром 18 марта 1965 года, провожая экипаж «Восхода-2» в полёт.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-26-goskatalog-4973845.jpg
          alt: "Чёрно-белое фото: четверо мужчин, трое в военной форме, за столом с бумагами; внизу рукописная надпись."
          data_source: https://goskatalog.ru/portal/#/collections?id=4973845
          license: ст. 1274 ГК РФ
          podpis: "Байконур, март 1965 года: накануне старта «Восхода-2» с Алексеем Леоновым и Павлом Беляевым."
          credit: ФГБУК «Государственный музей политической истории России», № Ф.III-37681, Госкаталог № 4973845
          width: 800
          height: 615
        utverzhden: 2026-11-03
      - summary: <b>Леонов первым в мире вышел в открытый космос, и держал его только фал длиной 5,35 метра.</b>
        det:
          - "18 марта 1965 года в 11:34:51 Леонов вышел из шлюза. Фал был стальным тросом с проводами для медицинских данных и телефонной связи с командиром. Беляев смотрел на напарника по телекамере и доложил на Землю: «Человек вышел в космическое пространство!»"
        src: "Источник: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025 — https://ria.ru/20250318/kosmos-2005530278.html; РИА Новости, 18.03.2010, https://ria.ru/20100318/215081522.html"
        stranica: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025
        href: https://ria.ru/20250318/kosmos-2005530278.html
        otryvok: «в 11 часов 34 минуты 51 секунду Леонов вышел в космическое пространство. Его с кораблем связывал только фал длиной 5,35 метра, в составе которого был стальной трос и электрические провода»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-26-goskatalog-2581383.jpg
          alt: Чёрно-белый портрет космонавта в гермошлеме с надписью «СССР».
          data_source: https://goskatalog.ru/portal/#/collections?id=6327635
          license: ст. 1274 ГК РФ
          podpis: Лётчик-космонавт Алексей Леонов в гермошлеме с надписью «СССР».
          credit: ФГБУК «Государственный музей политической истории России», Госкаталог № 6327635
          width: 574
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>ФАИ засчитала Леонову 12 минут 09 секунд, хотя вне корабля он пробыл 23 минуты 41 секунду.</b>
        det:
          - По спортивному кодексу время считают от выхода человека из шлюза до входа обратно в камеру. ФАИ присудила Леонову Золотую медаль «Космос», а Беляеву диплом и медаль. Рекорд утвердили 20 октября 1965 года. В подсчёте РИА Новости по данным «Роскосмоса» внекорабельная деятельность длилась 16 минут.
        src: "Источник: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025 — https://ria.ru/20250318/kosmos-2005530278.html; «Названа общая продолжительность работы космонавтов в открытом космосе», РИА Новости, 18.03.2025 — https://ria.ru/20250318/kosmos-2005614537.html"
        stranica: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025
        href: https://ria.ru/20250318/kosmos-2005530278.html
        otryvok: «20 октября 1965 года Международная авиационная федерация (ФАИ) утвердила мировой рекорд продолжительности пребывания человека в космическом пространстве вне космического корабля 12 минут 09 секунд»
        utverzhden: 2026-11-03
      - summary: <b>Леонов пять раз отходил от корабля, а скафандр нагревался до +60 °C и остывал до −100 °C.</b>
        det:
          - "В первый раз Леонов отошёл на метр, в остальные четыре на всю длину фала. Снаружи скафандр нагревался на солнце до +60 °C, а в тени остывал до −100 °C. Шлюз был мягким: надувная труба из 36 секций, которую раскрывали уже на орбите."
        src: "Источник: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025 — https://ria.ru/20250318/kosmos-2005530278.html"
        stranica: «Первый в истории выход человека в открытый космос (1965)», РИА Новости, 18.03.2025
        href: https://ria.ru/20250318/kosmos-2005530278.html
        otryvok: «В открытом космосе Леонов совершил пять отходов и подходов от шлюзовой камеры, причем самый первый отход был сделан на минимальное расстояние – один метр – для ориентации в новых условиях, а остальные на полную длину фала.»
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-leonov-ru.mp3
  durationLabel: 1 минута 17 секунд
  lead: "Голос ведёт от шлюзовой камеры через двенадцать минут в открытом космосе к минуте, когда скафандр не прошёл в люк, — и к решению, которое Леонов принял сам: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Шлюз
    - t: 15
      mark: 0:15
      title: Шаг наружу
    - t: 29
      mark: 0:29
      title: Не пролезает
    - t: 46
      mark: 0:46
      title: Решение
    - t: 62
      mark: 1:02
      title: Головой вперёд
  transcript:
    - <p>Восемнадцатого марта тысяча девятьсот шестьдесят пятого года корабль «Восход-2» с Павлом Беляевым и Алексеем Леоновым вышел на орбиту. Уже на первом витке Леонов вплыл в надувную шлюзовую камеру, и командир выпустил из неё воздух.</p>
    - <p>Через несколько минут Леонов вышел в открытый космос — первым из людей. С кораблём его связывал только фал длиной пять метров тридцать пять сантиметров. Пять раз он отходил от шлюза и возвращался.</p>
    - <p>Пришла команда возвращаться — и оказалось, что вернуться нельзя. В пустоте скафандр раздулся. А зазор между плечом и краем люка и в обычном состоянии был всего двадцать миллиметров. Кислорода в скафандре было на двадцать минут.</p>
    - "<p>Согласовывать с Землёй было некогда. Леонов сам сбросил давление в скафандре до аварийного. Он рассчитал: за час на чистом кислороде азот должен был уйти из крови, и кипения не будет. Скафандр стал меньше.</p>"
    - <p>Леонов протиснулся в шлюз головой вперёд, вопреки инструкции, и с трудом развернулся в камере шириной в метр. Он первым вышел в открытый космос — и едва не остался там навсегда. Но вернулся.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
