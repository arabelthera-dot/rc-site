      a: 3
      e: "Без согласования с Землёй он сбросил давление в скафандре до аварийного: за час на чистом кислороде азот должен был уйти из крови."
    - q: Как Леонов вошёл в шлюз?
      o:
        - Ногами вперёд, как велела инструкция
        - Головой вперёд — вопреки инструкции
        - Боком, сняв шлем
        - Его втянул за фал Беляев
      a: 1
      e: В 11:47 он протиснулся в шлюз головой вперёд, вопреки инструкции, и потом развернулся в камере диаметром один метр.
    - q: Какое время в открытом космосе ФАИ утвердила как мировой рекорд?
      o:
