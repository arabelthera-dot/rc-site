vizual:
  imya: leonov-pult
  vid: predmet
  kicker: Предмет под лупой
  h2: Пульт фотоаппарата Леонова
  lead: 'Рукоятка на проводе спускала затвор фотоаппарата на груди скафандра Леонова. Приближайте: рычаг на винтах, пружина тросика и провод к камере.'
audioguide:
  audioSrc: audio-guide-leonov-ru.mp3
  durationLabel: 1 минута 17 секунд
  lead: "Голос ведёт от шлюзовой камеры через двенадцать минут в открытом космосе к минуте, когда скафандр не прошёл в люк, — и к решению, которое Леонов принял сам: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Шлюз
    - t: 13
      mark: 0:13
      title: Шаг наружу
    - t: 26
      mark: 0:26
      title: Не пролезает
    - t: 42
      mark: 0:42
      title: Решение
    - t: 56
      mark: 0:56
      title: Головой вперёд
  transcript:
    - "Восемнадцатого марта тысяча девятьсот шестьдесят пятого года корабль «Восход-2» с Павлом Беляевым и Алексеем Леоновым вышел на орбиту. Уже на первом витке Леонов вплыл в надувную шлюзовую камеру, и командир выпустил из неё воздух."
    - "Через несколько минут Леонов вышел в открытый космос — первым из людей. С кораблём его связывал только фал длиной пять метров тридцать пять сантиметров. Пять раз он отходил от шлюза и возвращался."
    - "Пришла команда возвращаться — и оказалось, что вернуться нельзя. В пустоте скафандр раздулся. А зазор между плечом и краем люка и в обычном состоянии был всего двадцать миллиметров. Кислорода в скафандре было на двадцать минут."
    - "Согласовывать с Землёй было некогда. Леонов сам сбросил давление в скафандре до аварийного. Он рассчитал: за час на чистом кислороде азот должен был уйти из крови, и кипения не будет. Скафандр стал меньше."
    - "Леонов протиснулся в шлюз головой вперёд, вопреки инструкции, и с трудом развернулся в камере шириной в метр. Он первым вышел в открытый космос — и едва не остался там навсегда. Но вернулся."
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
