story:
  kicker: Подвиг
  h2: Оборона Троице-Сергиевой лавры
  abzacy:
  - 'Смутное время. Под стенами Троице-Сергиева монастыря встают войска Сапеги и Лисовского — тридцать тысяч. В крепости около двух тысяч воинов, монахи, слуги и крестьяне. На приказ сдаться защитники отвечают: «Десятилетний отрок у Троицы посмеётся вашему безумству».'
  - Враги ведут подкоп, и крестьяне Никон Шилов и Слота взрывают его вместе с собой. Слуга Анания Селевин приводит в крепость 16 знатных пленных, Пимен Тененев стрелой сбивает с коня полковника Лисовского. Летом 1609 года на стенах остаётся меньше 200 воинов против 12 тысяч, и они снова говорят «нет». Шестнадцать месяцев ворота Троицы остаются закрытыми.
