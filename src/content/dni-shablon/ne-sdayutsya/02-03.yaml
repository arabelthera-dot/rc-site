  - q: Сколько знатных пленных один привёл в крепость Анания Селевин?
    o:
    - '2'
    - '6'
    - '16'
    - '60'
    a: 2
    e: Слуга Анания Селевин один привёл в осаждённую крепость 16 знатных пленных.
  - q: Чем Пимен Тененев сбил с коня полковника Лисовского?
    o:
    - Из пищали
    - Из лука
    - Копьём
    - Камнем
    a: 1
    e: Слуга Пимен Тененев выстрелом из лука в лицо сбил с коня полковника Лисовского.
