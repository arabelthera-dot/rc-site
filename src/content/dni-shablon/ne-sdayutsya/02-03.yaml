    - '16'
    - '30'
    a: 2
    e: Две тысячи воинов против тридцати тысяч Сапеги и Лисовского — и ворота закрыты 16 месяцев.
  - q: Что взорвали вместе с собой крестьяне Никон Шилов и Слота?
    o:
