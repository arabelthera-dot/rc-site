vizual:
  imya: troica-oborona-miloradovich
  vid: predmet
  kicker: Картина под лупой
  h2: Оборона Троице-Сергиевой лавры
  lead: 'Так оборону Троицы написал художник Сергей Милорадович в 1894 году. Внутри монастыря у стены стоят пушка, воины с бердышами и монахи, за ними купола собора. Приближайте: лица, оружие, ряса, кладка стены.'
audioguide:
  audioSrc: audio-guide-troica-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от закрытых ворот Троицы через подкоп, лучников и порох — к шестнадцати месяцам осады: пять остановок.'
  stops:
    - t: 0
      mark: '0:00'
      title: 'Ворота закрыты'
    - t: 25
      mark: '0:25'
      title: 'Подкоп'
    - t: 50
      mark: '0:50'
      title: 'Слуги с луками'
    - t: 75
      mark: '1:15'
      title: 'Порох и пушки'
    - t: 100
      mark: '1:40'
      title: 'Последний штурм'
  transcript:
    - 'Смутное время. Под стенами Троице-Сергиева монастыря тридцать тысяч Сапеги и Лисовского. В крепости около двух тысяч воинов. На приказ сдаться защитники отвечают: «Десятилетний отрок у Троицы посмеётся вашему безумству».'
    - 'Враги ведут подкоп под стены. Крестьяне Никон Шилов и Слота прыгают в подкоп и взрывают его вместе с собой.'
    - 'Слуга Анания Селевин один приводит в крепость шестнадцать знатных пленных. Вдвоём с немым воином, с луками, он обращает в бегство роту копейщиков. Слуга Пимен Тененев стрелой сбивает с коня полковника Лисовского.'
    - 'Защитники отбивают у врага восемь пушек и вносят их в крепость с его же знамёнами, литаврами и трубами. Семьдесят казаков и двадцать слуг ночью прорываются сквозь кольцо и привозят двадцать пудов пороха.'
    - 'Летом тысяча шестьсот девятого года на стенах меньше двухсот воинов против двенадцати тысяч, и они снова говорят «нет». В последнем штурме гибнет одна женщина, больше никого даже не ранили. Шестнадцать месяцев ворота Троицы остаются закрытыми.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
