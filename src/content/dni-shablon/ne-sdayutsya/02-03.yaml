    - Пушку
    - Подкоп
    - Ворота
    a: 2
    e: Крестьяне Никон Шилов и Слота прыгнули в подкоп врага и взорвали его вместе с собой.
  - q: Сколько воинов осталось на стенах летом 1609 года?
    o:
    - Меньше 200
    - Около 1000
    - '2000'
    - 12 000
    a: 0
