      - summary: <b>Раненый канадский майор рассказал о гибели Карбышева — и через полгода генерал стал Героем.</b>
        det:
          - "В феврале 1946 года канадский майор Седдон де Сент-Клер, бывший узник Маутхаузена, из госпиталя под Лондоном вызвал представителя советской миссии: «Я хочу рассказать вам о том, как погиб генерал-лейтенант Дмитрий Карбышев». 16 августа 1946 года Карбышеву посмертно присвоено звание Героя Советского Союза. В 1948 году в Маутхаузене открыли памятник: «Дмитрию Карбышеву. Учёному. Воину. Коммунисту. Жизнь и смерть его были подвигом во имя жизни»."
