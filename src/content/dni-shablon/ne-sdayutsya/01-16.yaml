        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Карбышев отверг и «мягкий» вариант полковника Пелита — писать историю войны за выезд за границу.</b>
        det:
          - "В Хаммельбурге в 1942 году полковник вермахта Пелит, сослуживец Карбышева по фортам Брестской крепости, предлагал: генерал пишет исторические труды об операциях Красной армии, а за это ему разрешат выезд в нейтральную страну. Карбышев «вновь отмёл все предложенные гитлеровцами варианты сотрудничества». Уговоры начались ещё осенью 1941 года в Острув-Мазовецкой."
        src: "Источник: АиФ, 18.02.2014 — https://aif.ru/society/history/neslomlennyy_zabytyy_podvig_generala_karbysheva; Решин — https://www.molodguard.ru/heroes19.htm"
