audioguide:
  audioSrc: audio-guide-karbyshev-ru.mp3
  durationLabel: 1 минута 27 секунд
  lead: "Голос ведёт от пленения у Днепра через три предложения перейти на службу врагу — к смерти на морозе в Маутхаузене: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Плен
    - t: 19
      mark: 0:19
      title: Не Власов — Карбышев
    - t: 35
      mark: 0:35
      title: Берлинское предложение
    - t: 50
      mark: 0:50
      title: Вердикт
    - t: 66
      mark: 1:06
      title: Маутхаузен
  transcript:
    - <p>Восьмого августа тысяча девятьсот сорок первого года при попытке выйти из окружения у реки Днепр генерал-лейтенант Дмитрий Карбышев получает тяжёлую контузию и в бессознательном состоянии попадает в плен. Ему за шестьдесят. Крупнейший военный инженер страны — для немцев это не рядовой пленный, а находка.</p>
    - "<p>Немцы рассчитывают поставить во главе будущей коллаборационистской армии именно его — не Андрея Власова, как считают многие. Почти два года его уговаривают: в лагере Хаммельбург, через полковника Пелита, наконец — в Берлине.</p>"
    - "<p>Профессор Гейнц Раубенгеймер предлагает свободу, квартиру, полное обеспечение и доступ ко всем библиотекам Германии. Карбышев отвечает одной фразой: мои убеждения не выпадают вместе с зубами от недостатка витаминов в лагерном рационе.</p>"
    - "<p>В тысяча девятьсот сорок третьем году немецкая комиссия пишет: Карбышева можно считать безнадёжным в смысле использования в качестве специалиста — он фанатически предан воинскому долгу. Приговор — каторжные работы без скидок на возраст и звание.</p>"
    - <p>В ночь на восемнадцатое февраля тысяча девятьсот сорок пятого года узников после пыток обливают ледяной водой на морозе около двенадцати градусов. О подвиге мир узнаёт от канадского майора Седдона де Сент-Клера — умирая, он диктует показания. Посмертно Карбышеву присваивают звание Героя Советского Союза.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
