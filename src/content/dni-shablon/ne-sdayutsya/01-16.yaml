      - summary: <b>Карбышев в 1941 году нашёл неотмеченный на картах мост через Шару, и по нему ушёл штаб 10-й армии.</b>
        det:
          - "28 июня 1941 года все переправы через Шару заняли немцы. Вспомнили о заброшенном мосте в устье, и Карбышев сказал: «раз на картах эта переправа не обозначена, значит, и противника там может не быть». Мост оказался полусгнившим, на ремонт разобрали два сарая, и всю ночь Карбышев стоял у реки, пока переправлялись люди и сотни машин. Свидетель — подполковник С. А. Маркушевич."
