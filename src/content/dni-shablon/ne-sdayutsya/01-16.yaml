      - summary: <b>Карбышев прошёл десять лагерей и ни в одном не согласился служить врагу.</b>
        det:
          - "В плен он попал тяжело контуженным, без сознания, 8 августа 1941 года у Днепра, близ деревни Добрейка Могилёвской области. Путь: Острув-Мазовецка → Замостье → Хаммельбург → Берлин, гестапо → Нюрнберг → Флоссенбюрг → Майданек → Освенцим → Заксенхаузен → Маутхаузен. На старой странице порядок был перепутан, теперь он исправлен."
