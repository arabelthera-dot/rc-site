story:
  kicker: Среда подвига
  h2: Генерал, которого хотели купить
  abzacy:
    - К началу войны Дмитрию Карбышеву было за шестьдесят. Крупнейший советский военный инженер, доктор военных наук, профессор Военной академии Генштаба РККА — кадровый офицер ещё старой русской армии. 8 августа 1941 года при попытке выйти из окружения у реки Днепр, близ деревни Добрейка в Могилёвской области, он был тяжело контужен и в бессознательном состоянии попал в плен.
    - "Для немцев такой пленный был находкой не как рядовой военнопленный, а как специалист и фигура: рассчитывали, что штурм инженерных сооружений РККА и имя генерала-инженера принесут им пользу. <b>Поэтому во главе будущей коллаборационистской Русской освободительной армии немцы первоначально хотели видеть именно Карбышева — не Андрея Власова, как считают многие.</b> Только после отказа и почти двух лет уговоров выбор достался другому."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Генерал Карбышев — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: "<b>Карбышев в плену напомнил коменданту немецкого лагеря: ключи от Берлина почти двести лет хранятся в Казанском соборе.</b>"
        det:
          - "«Невольно хочется напомнить вам, господин лейтенант, что уже почти двести лет ключи от Берлина хранятся в Казанском соборе в Ленинграде… Ваша любознательность удовлетворена?» Это Карбышев сказал в лагере Замостье коменданту Козлову, бывшему белогвардейцу на службе у немцев. Козлов ехидно попросил генерала рассказать о войнах России с Германией. Карбышев рассказал о Ледовом побоище, Грюнвальде и Семилетней войне, когда русские войска вошли в Берлин, и напомнил слова прусского короля Фридриха II: «Русского солдата недостаточно убить, его надо после этого суметь повалить». Козлов процедил: «Вы почти комиссар!» — и ушёл. Свидетель — П. П. Кошкаров."
        src: "Источник: Решин, глава «Замостье» — https://www.molodguard.ru/heroes19.htm"
        stranica: Решин, глава «Замостье»
        href: https://www.molodguard.ru/heroes19.htm
        otryvok: «Невольно хочется напомнить вам, господин лейтенант, что уже почти двести лет ключи от Берлина хранятся в Казанском соборе в Ленинграде… Ваша любознательность удовлетворена?»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Карбышеву сулили свободу и квартиру, а он ответил: убеждения не выпадают вместе с зубами.</b>"
        det:
          - "Генерал вермахта Гейнц Раубенгеймер в Берлине предлагал освобождение, частную квартиру, полное обеспечение, все библиотеки Германии и штат помощников. Ответ: «Мои убеждения не выпадают вместе с зубами от недостатка витаминов в лагерном рационе». Раубенгеймер начал: «Вы, как я знаю, господин генерал, свободно говорите по-немецки… услуги переводчика нам не понадобятся». «Нет, по-немецки я не говорю, — ответил Карбышев на чистом немецком, — я говорю по-русски», и пришлось вызвать переводчика. О трудах Раубенгеймера он потом сказал товарищам: «ни одной свежей, оригинальной идеи… Всё удивительно шаблонно»."
        src: "Источник: Е. Решин, «Генерал Карбышев», глава «В сетях гестапо» — https://www.molodguard.ru/heroes19.htm; А. Емельяненков, «Прививка от нацизма», «Родина», № 2, 2020 — https://rodina-history.ru/2020/02/17/semdesiat-piat-let-nazad-oborvalas-zhizn-generala-karbysheva.html; РИА Новости, 18.02.2020 — https://ria.ru/20200218/1564903612.html; АиФ, 18.02.2014 — https://aif.ru/society/history/neslomlennyy_zabytyy_podvig_generala_karbysheva; «Вечерняя Москва», 19.02.2015 — https://vm.ru/society/613278-podvig-generala-karbysheva"
        stranica: Е. Решин, «Генерал Карбышев», глава «В сетях гестапо»
        href: https://www.molodguard.ru/heroes19.htm
        otryvok: «Мои убеждения не выпадают вместе с зубами от недостатка витаминов в лагерном рационе»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-16-goskatalog-31774402.jpg
          alt: "Генеральская фуражка: светлая тулья, красный околыш, золотой шнур, кокарда со звездой"
          data_source: https://goskatalog.ru/portal/#/collections?id=31774402
          license: предмет, фото музея
          podpis: Фуражка Героя Советского Союза генерал-лейтенанта инженерных войск Карбышева Дмитрия Михайловича. Первая половина XX века.
          credit: Центральный музей Вооружённых Сил РФ, инв. 2/3274, рег. № Госкаталога 31581930
          width: 799
          height: 637
        utverzhden: 2026-11-03
      - summary: "<b>Карбышев отказался выпить с немецким генералом: «Вы, наверное, забыли, что я русский солдат».</b>"
        det:
          - Осенью 1941 года в лагерь Острув-Мазовецка приехали немецкие чины во главе с генералом. Вынесли стол, вино, звучали тосты за фюрера и «поход на Москву». Карбышева позвали к столу, он не взял бокал, когда пили «за будущее генерала», ответил «Вы, наверное, забыли, что я русский солдат» и ушёл в барак. Весь лагерь «с затаённым дыханием» видел это. Свидетель — старший лейтенант Владимир Герасимов.
        src: "Источник: Решин, глава «Острув-Мазовецка» — https://www.molodguard.ru/heroes19.htm"
        stranica: Решин, глава «Острув-Мазовецка»
        href: https://www.molodguard.ru/heroes19.htm
        otryvok: «поход на Москву»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Карбышев отказался от «свободы» за воротами: «Пусть убивают здесь, на глазах у всех».</b>"
        det:
          - "В сентябре 1941 года немецкий офицер зачитал ему заметку: СССР просит обменять Карбышева на двух немецких генералов. Пленные на руках пронесли генерала до ворот, там ему объявили, что он «свободен». Карбышев ответил: «Никуда не пойду… Если же это провокация и меня хотят убить, то пусть убивают здесь, на глазах у всех военнопленных». Вернулся в лагерь и крикнул: «Никакой их „свободой“ фашисты не заставят меня служить им!» Свидетель — старший лейтенант Ф. П. Адашев."
        src: "Источник: Решин, глава «Острув-Мазовецка» — https://www.molodguard.ru/heroes19.htm"
        stranica: Решин, глава «Острув-Мазовецка»
        href: https://www.molodguard.ru/heroes19.htm
        otryvok: «Никуда не пойду… Если же это провокация и меня хотят убить, то пусть убивают здесь, на глазах у всех военнопленных»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Карбышев отказался от завтрака, раз без еды оставили весь лагерь, — и комендант отменил приказ.</b>
        det:
          - "В Замостье комендант на двое суток лишил питания весь лагерь из-за одного больного пленного. Утром завтрак принесли только генералам. Карбышев от еды отказался и велел передать коменданту: раз без питания весь лагерь, исключений быть не должно. Другие генералы его поддержали, и «комендант отменил приказ». Свидетели — П. П. Кошкаров и Р. Р. Черношей."
        src: "Источник: Решин, глава «Замостье» — https://www.molodguard.ru/heroes19.htm"
        stranica: Решин, глава «Замостье»
        href: https://www.molodguard.ru/heroes19.htm
        otryvok: «комендант отменил приказ»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Карбышева облили водой на морозе, а он успел крикнуть: «Бодрей, товарищи!»</b>"
        det:
          - "В ночь на 18 февраля 1945 года в Маутхаузене узников после пыток вывели на мороз около −12 °C и поливали из брандспойтов, пока люди не погибли. Перед смертью генерал сказал: «Бодрей, товарищи! Думайте о Родине, и мужество не покинет вас!» В ту ночь так погибли около 500 человек."
        src: "Источник: РИА Новости, 18.02.2020 — https://ria.ru/20200218/1564903612.html; АиФ, 18.02.2014 — https://aif.ru/society/history/neslomlennyy_zabytyy_podvig_generala_karbysheva; «Вечерняя Москва» — https://vm.ru/society/613278-podvig-generala-karbysheva; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=413"
        stranica: РИА Новости, 18.02.2020
        href: https://aif.ru/society/history/neslomlennyy_zabytyy_podvig_generala_karbysheva
        otryvok: «Бодрей, товарищи! Думайте о Родине, и мужество не покинет вас!»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-16-goskatalog-6008180.jpg
          alt: Мраморная стела с фигурой человека, у подножия цветы, за ней лагерные бараки
          data_source: https://goskatalog.ru/portal/#/collections?id=6008180
          license: "автор не указан, 1975; цитирование в информационных и учебных целях с указанием источника (ст. 1274 ГК РФ)"
          podpis: Памятник генералу Карбышеву перед главным входом в лагерь Маутхаузен. 1975.
          credit: Государственный центральный музей современной истории России (ГЦМСИР), рег. № Госкаталога 5830593
          width: 614
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>В 1941 году 60-летний Карбышев два километра под огнём нёс на руках раненого красноармейца.</b>
        det:
          - "При выходе из окружения к Днепру миной тяжело ранило красноармейца Дадашева. Товарищ один нести его не смог, и Карбышев понёс раненого вместе с ним под преследованием. Дадашев просил: «Оставьте меня… вы из-за меня попадёте к немцам». Генерал ответил: «Я солдат и ты солдат. А солдаты друг друга в бою не оставляют». Это свидетельство лейтенанта Павла Кириллова."
        src: "Источник: Решин, глава «Война» — https://www.molodguard.ru/heroes19.htm"
        stranica: Решин, глава «Война»
        href: https://www.molodguard.ru/heroes19.htm
        otryvok: «Оставьте меня… вы из-за меня попадёте к немцам»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Нацисты записали: Карбышев «безнадёжен» — и отправили 62-летнего генерала на каторгу.</b>"
        det:
          - "В немецких архивах: «Этот крупнейший советский фортификатор… оказался фанатически преданным идее верности воинскому долгу и патриотизму. Карбышева можно считать безнадёжным в смысле использования у нас в качестве специалиста военно-инженерного дела». Вердикт 1943 года: «Направить в концлагерь во Флоссенбюрг на каторжные работы. Никаких скидок на звание и возраст не делать»."
        src: "Источник: Э. Кузнецова, «Татар-информ» — https://www.tatar-inform.ru/news/nacisty-zapisali-dlya-nas-on-beznadezen-general-leitenantu-dmitriyu-karbysevu-145-let-6004124"
        stranica: Э. Кузнецова, «Татар-информ»
        href: https://www.tatar-inform.ru/news/nacisty-zapisali-dlya-nas-on-beznadezen-general-leitenantu-dmitriyu-karbysevu-145-let-6004124
        otryvok: «Этот крупнейший советский фортификатор… оказался фанатически преданным идее верности воинскому долгу и патриотизму. Карбышева можно считать безнадёжным в смысле использования у нас в качестве специалиста военно-инженерного дела»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Немцы хотели поставить во главе власовской армии Карбышева, а не Власова — он отказался.</b>
        det:
          - Первым кандидатом немецкого командования в руководители коллаборационистской армии был Карбышев, крупнейший военный инженер в их руках. Его уговаривали почти два года, и только после отказа выбор достался Власову.
        src: "Источник: РИА Новости, 18.02.2020 — https://ria.ru/20200218/1564903612.html; АиФ, 18.02.2014 — https://aif.ru/society/history/neslomlennyy_zabytyy_podvig_generala_karbysheva; «Вечерняя Москва» — https://vm.ru/society/613278-podvig-generala-karbysheva"
        stranica: РИА Новости, 18.02.2020
        href: https://aif.ru/society/history/neslomlennyy_zabytyy_podvig_generala_karbysheva
        otryvok: «Именно он, а не генерал Власов , по первоначальной задумке, должен был возглавить Русскую Освободительную армию. Но все замыслы нацистов разбились о непреклонность Карбышева.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Карбышев сделал детям Освенцима солнечные часы — они разошлись с хронометром эсэсовца на минуту.</b>
        det:
          - "В Биркенау дети тайком ходили к «дедушке» Карбышеву, и он рассказывал им о часах, солнце и звёздах. Эсэсовец застал его у самодельных солнечных часов. Генерал встал, но берет не снял: «На моих — одиннадцать часов тридцать минут». Офицер сверился с хронометром: «Разница всего на одну минуту… Ты что, старый Иван, часовой мастер?» Карбышев промолчал. Свидетель — Н. Л. Белоруцкий."
        src: "Источник: Решин, глава «Освенцим» — https://www.molodguard.ru/heroes19.htm"
        stranica: Решин, глава «Освенцим»
        href: https://www.molodguard.ru/heroes19.htm
        otryvok: «На моих — одиннадцать часов тридцать минут»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
