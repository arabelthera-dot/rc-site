    udary:
      - summary: <b>Карбышев отказался от генеральских условий — это подтвердил на допросе пленный немец-надзиратель.</b>
        det:
          - "Летом 1943 года на Курской дуге генерал-майор Н. В. Крисанов, ученик Карбышева, допросил пленного бывшего надзирателя Хаммельбургского лагеря. Тот вспомнил «большевистского генерала»: «ему создали особые условия… он отказался от них, ел то, что давали всем пленным. За ним приезжали из Берлина, обещали генеральский чин германской империи. Но от всех благ… он отказался». Крисанов написал жене: «Любаша… я этим данным верю»."
        src: "Источник: Решин, глава «В сетях гестапо» — https://www.molodguard.ru/heroes19.htm"
        stranica: Решин, глава «В сетях гестапо»
