      - summary: "<b>Высоцкий спел о нём: «А он себя шьёт — понимаете? — большими-большими стежками».</b>"
        det:
          - "В 1963 году Владимир Высоцкий написал песню о хирурге, который «в холоде сам себе скальпелем» вырезает аппендикс, противопоставив его тем, кто «в ванночке с кафелем» нежится. Финал: «Герой он! Теперь же смекайте-ка: / Нигде не умеют так больше»."
