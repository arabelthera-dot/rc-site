quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — На станции Новолазаревская в Антарктиде; 2 — 1 час 45 минут; 3 — Инженер-механик Зиновий Теплинский; 4 — Тёмное пятно — ещё день, и его было бы не спасти; 5 — Гагарина."
  ball: 10
  voprosy:
    - q: Где Леонид Рогозов оперировал сам себя?
      o:
        - На подводной лодке
        - На станции Новолазаревская в Антарктиде
        - На дрейфующей льдине в Арктике
        - В тайге под Минусинском
      a: 1
      e: На станции Новолазаревская в оазисе Ширмахера, в ночь на 1 мая 1961 года.
    - q: Сколько длилась операция?
      o:
        - 1 час 45 минут
        - Десять минут
        - Сутки
        - Полчаса
      a: 0
      e: 1 час 45 минут — обычно такая операция идёт около получаса.
    - q: Кто держал зеркало и лампу?
      o:
        - Второй врач станции
        - Начальник экспедиции
        - Инженер-механик Зиновий Теплинский
        - Сам Рогозов
      a: 2
      e: Инженер-механик Зиновий Теплинский; инструменты подавал метеоролог Александр Артемьев.
    - q: Что Рогозов увидел на аппендиксе?
      o:
        - Ничего особенного
        - Камень
        - Он был здоров
        - Тёмное пятно — ещё день, и его было бы не спасти
      a: 3
      e: "Тёмное пятно: аппендикс мог лопнуть в ближайшие часы."
    - q: С чьим подвигом в одном апреле сравнивают Рогозова?
      o:
        - Чкалова
        - Гагарина
        - Папанина
        - Седова
      a: 1
      e: Операция была через восемнадцать дней после полёта Гагарина; оба родились в марте 1934 года.
