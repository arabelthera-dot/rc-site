  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: "<b>Рогозов отшучивался от новых зимовок: «Кто-то оставляет в Антарктиде сердце, я — аппендикс».</b>"
        det:
          - Ему не раз предлагали снова поехать на шестой континент; всерьёз он объяснял, что там был кем угодно, только не врачом, и боялся потерять квалификацию, а в шутку отвечал этой фразой. Рассказ, что после него в Антарктиду брали только врачей с удалённым аппендиксом, заместитель директора Музея Арктики и Антарктики М. Дукальская считает байкой.
        src: "Источник: «Комсомольская правда», 29.04.2026 (перепечатка заметок 9–10 мая 1961 г.) — https://www.kp.ru/daily/27777.3/5242048/; «Сын хирурга Леонида Рогозова: в Антарктиде папа сам себе вырезал аппендикс», «Комсомольская правда», 26.04.2018 — https://www.kp.ru/daily/26374.3/3253842/; Безменова А., «Комсомольская правда в Санкт-Петербурге», 14.04.2011 — https://www.spb.kp.ru/daily/25669.4/829773/"
        stranica: «Комсомольская правда», 29.04.2026 (перепечатка заметок 9–10 мая 1961 г.)
        href: https://www.kp.ru/daily/27777.3/5242048/
        otryvok: "«Леониду Рогозову еще неоднократно предлагали снова отправиться на шестой континент, но он лишь отшучивался: «Кто-то оставляет в Антарктиде сердце, я же оставил аппендикс».»"
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Начальник станции позвал Верещагина — и тот сфотографировал операцию, пока врач резал себя.</b>
        det:
          - Гербович стоял в ногах кровати и видел всё; в разгар операции он пригласил полярника Верещагина, и тот сделал снимки. Именно эти кадры теперь хранит Музей Арктики и Антарктики (подписи «пересъёмка… / Музей Арктики и Антарктики» в «КП») и публикует семья Рогозова.
        src: "Источник: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus) — https://jlm-taurus.livejournal.com/143075.html; подписи к фото — «Комсомольская правда», 29.04.2026 (перепечатка заметок 9–10 мая 1961 г.) — https://www.kp.ru/daily/27777.3/5242048/"
        stranica: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus)
        href: https://jlm-taurus.livejournal.com/143075.html
        otryvok: «пересъёмка… / Музей Арктики и Антарктики»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Рогозов спас себя через 18 дней после полёта Гагарина — оба родились в марте 1934-го.</b>
        det:
          - "Апрель 1961 года страна запомнила двумя героями: один облетел Землю, другой спас себя сам на краю света. Оба ровесники, обоим по 27, оба из рабочих семей. «Комсомольская правда» рассказала о подвиге 9 мая 1961 года — по телеграмме, пришедшей из Мирного."
        src: "Источник: Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014 — https://aif.ru/society/people/1353447; «Комсомольская правда», 29.04.2026 (перепечатка заметок 9–10 мая 1961 г.) — https://www.kp.ru/daily/27777.3/5242048/"
        stranica: Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014
        href: https://aif.ru/society/people/1353447
        otryvok: «Два героя апреля 1961-го — Юрий Гагарин и Леонид Рогозов — родились в марте 1934 года. Первый космонавт Земли 9 марта, а будущий врач-полярник — 14 марта.»
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-13-goskatalog-18801358.jpg
          alt: Чёрно-белый портрет юноши с зачёсанными назад волосами, в тёмной куртке и клетчатой рубашке.
          data_source: https://goskatalog.ru/portal/#/collections?id=18801358
          license: цитирование, ст. 1274 ГК РФ; автор Требин Ю. П.; дата съёмки в карточке не указана
          podpis: Юный Леонид Рогозов, выпускник минусинской школы № 4, — портрет из собрания Минусинского музея (негатив фотографа Ю. Требина).
          credit: МБУК «Минусинский региональный краеведческий музей им. Н.М. Мартьянова», № Н-5031/7 (МКМ Н ОФ-5031/7), Госкаталог № 18801358
          width: 522
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>1 Мая, с температурой 38,1, Рогозов слушал праздничные телеграммы — их читал ему начальник.</b>
        det:
          - "Накануне он записал: «Я же огорчён — испортил всем праздник. Завтра 1 Мая». Праздник на станции урезали до одного ужина и задержали его на два часа. Перед ужином Гербович зашёл к прооперированному врачу: температура 38,1, «держится молодцом»; зачитал поздравления, пришедшие на станцию, и только потом пошёл в кают-компанию. Ужин прошёл «без подъёма», на кино большинство уснуло — вторую часть не показывали."
        src: "Источник: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus) — https://jlm-taurus.livejournal.com/143075.html; «Сын хирурга Леонида Рогозова: в Антарктиде папа сам себе вырезал аппендикс», «Комсомольская правда», 26.04.2018 — https://www.kp.ru/daily/26374.3/3253842/"
        stranica: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus)
        href: https://jlm-taurus.livejournal.com/143075.html
        otryvok: «Я же огорчён — испортил всем праздник. Завтра 1 Мая»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-13-goskatalog-23405058.jpg
          alt: Полярники в меховой одежде стоят у домика с флагами и колоколом на крыше, вокруг снег и камни.
          data_source: https://goskatalog.ru/portal/#/collections?id=23405058
          license: цитирование, ст. 1274 ГК РФ; автор не указан
          podpis: Первомай на станции Новолазаревская, 6-я Советская антарктическая экспедиция — зимовка, на которой Рогозов оперировал себя.
          credit: ФГБУК «Российский государственный музей Арктики и Антарктики», № РГМАА О-9385/12, Госкаталог № 23405058
          width: 636
          height: 479
        utverzhden: 2026-11-03
      - summary: <b>Через две недели Рогозов вернулся к работе, а через месяц выполнял даже тяжёлую.</b>
        det:
          - Закончив операцию, Рогозов ещё объяснил помощникам, как прибраться, принял снотворное и уснул. Через несколько суток спала температура, а через семь дней после операции он сам снял себе швы. По его собственной записи, через две недели он смог приступить к обязанностям, а через месяц — даже к тяжёлой работе.
        src: "Источник: «Операция вместо Первомая. Как русский хирург сам себе вырезал аппендикс», Life.ru, 01.05.2018 — https://life.ru/p/1112039; Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus) — https://jlm-taurus.livejournal.com/143075.html; Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014 — https://aif.ru/society/people/1353447"
        stranica: «Операция вместо Первомая. Как русский хирург сам себе вырезал аппендикс», Life.ru, 01.05.2018
        href: https://life.ru/p/1112039
        otryvok: «После операции за мной был организован хороший уход, и через две недели я смог приступить к исполнению своих обязанностей, а через месяц — даже выполнять тяжёлую работу".»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-rogozov-ru.mp3
  durationLabel: 1 минута 22 секунды
  lead: "Голос ведёт от открытия станции до сна после операции: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Станция
    - t: 18
      mark: 0:18
      title: Диагноз
    - t: 33
      mark: 0:33
      title: Решение
    - t: 50
      mark: 0:50
      title: Ночь на первое мая
    - t: 66
      mark: 1:06
      title: Утро
  transcript:
    - <p>Февраль тысяча девятьсот шестьдесят первого. В оазисе Ширмахера, среди антарктического льда, открывают новую советскую станцию — Новолазаревскую. На зимовку остаются тринадцать человек. Врач у них один — хирург Леонид Рогозов.</p>
    - "<p>Вечером двадцать девятого апреля у врача поднимается температура и болит живот. Он понимает: аппендицит. Лечится без операции — не помогает. Самолёта нет, за окном пурга.</p>"
    - "<p>Он записывает в дневнике: это почти невыполнимо, но я не могу просто опустить руки и сдаться. И решает оперировать себя сам. Учит товарищей: кто подаёт инструменты, кто держит зеркало, что делать, если он потеряет сознание.</p>"
    - "<p>Новокаин, разрез, зеркало и лампа. Он работает без перчаток, многое на ощупь. Каждые несколько минут останавливается перевести дух. На аппендиксе — тёмное пятно: ещё день, и было бы поздно.</p>"
    - <p>Операция длится час сорок пять минут. Под конец он ещё говорит помощникам, как прибраться, — и засыпает. Через неделю снимают швы. Хирург и пациент в одном лице — он не сдался.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
