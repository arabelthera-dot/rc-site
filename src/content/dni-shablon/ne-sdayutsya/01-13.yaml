story:
  kicker: Среда подвига
  h2: Зимовка, с которой не уехать
  abzacy:
    - "5 ноября 1960 года на судне «Обь» в Антарктиду уходит 6-я Советская антарктическая экспедиция. Врачом в неё взяли двадцатишестилетнего хирурга из Ленинграда Леонида Рогозова: сын шофёра и доярки, отец погиб на фронте в 1943-м."
    - "18 февраля 1961 года в оазисе Ширмахера открывают новую станцию — Новолазаревскую. Корабль уходит и вернётся только через год. Станция недостроена, и врач работает за троих: разгружает грузы, строит, ведёт метеонаблюдения, водит машину. <b>На всю полярную зиму здесь тринадцать человек — и единственный врач.</b>"
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Леонид Рогозов — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Зашивая собственный живот, Рогозов попросил подвинуть зеркало — чтобы шов вышел красивее.</b>
        det:
          - "Около полуночи 1 мая 1961 года, уже обессиленный после удаления отростка, Рогозов перешёл к шву и велел Теплинскому лучше осветить рану лампой и поднести зеркало. Начальник станции Гербович записал: «чтобы лучше и красивее сделать шов». Сестра Валентина потом видела шрам: «Такой аккуратный, никто бы не подумал, что можно так ювелирно зашить самого себя»."
        src: "Источник: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus) — https://jlm-taurus.livejournal.com/143075.html; Безменова А., «Комсомольская правда в Санкт-Петербурге», 14.04.2011 — https://www.spb.kp.ru/daily/25669.4/829773/ (слова сестры)"
        stranica: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus)
        href: https://jlm-taurus.livejournal.com/143075.html
        otryvok: «чтобы лучше и красивее сделать шов»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-13-goskatalog-70379047.jpg
          alt: Хирургический скальпель с цельнометаллической ручкой на светлом фоне.
          data_source: https://goskatalog.ru/portal/#/collections?id=70379047
          license: цитирование, ст. 1274 ГК РФ
          podpis: Скальпель из того самого хирургического набора, которым Рогозов сделал себе разрез 30 апреля 1961 года.
          credit: ФГБУК «Российский государственный музей Арктики и Антарктики», № РГМАА О-6865/1, Госкаталог № 70379047
          width: 354
          height: 147
        utverzhden: 2026-11-03
      - summary: "<b>Рогозов записал: «Это почти невыполнимо… но я не могу просто опустить руки и сдаться».</b>"
        det:
          - "Запись из дневника накануне операции. Вечером 29 апреля 1961 года у него поднялась температура; он понял — острый аппендицит, испробовал покой, голод, местный холод и антибиотики, но не помогло. «Я вынужден думать о единственно возможном выходе: самому оперировать себя»."
        src: "Источник: Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014 — https://aif.ru/society/people/1353447; «Легендарный хирург Леонид Рогозов», Сибирский медицинский портал, 15.08.2018 — https://sibmedport.ru/legendarnyj-hirurg-leonid-rogozov/"
        stranica: Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014
        href: https://aif.ru/society/people/1353447
        otryvok: "«Я вынужден думать о единственно возможном выходе: самому оперировать себя»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Рогозов уговорил начальника: сначала разрез — даже если отросток лопнет, гной вытечет наружу.</b>"
        det:
          - "На станции Новолазаревская зимовали 13 человек, врач один; самолёта не было ни у них, ни на соседних станциях, а пурга не дала бы взлететь. Утром 30 апреля Гербович предложил ждать врача из Мирного — он ещё 29-го просил его по радио, но самолёт не мог ни вылететь, ни сесть. Рогозов перебил: «Подождите, не возражайте». Его расчёт был хирургический: первый этап — разрез, тогда при прорыве гноя не будет перитонита, «а дальше будет видно по моему состоянию»; ждать нельзя, потому что он ослабнет и уже ничего не сможет."
        src: "Источник: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus) — https://jlm-taurus.livejournal.com/143075.html; Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014 — https://aif.ru/society/people/1353447; «Комсомольская правда», 29.04.2026 (перепечатка заметок 9–10 мая 1961 г.) — https://www.kp.ru/daily/27777.3/5242048/"
        stranica: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus)
        href: https://jlm-taurus.livejournal.com/143075.html
        otryvok: «Подождите, не возражайте»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Рогозов добрался до аппендикса и увидел тёмное пятно: ещё день — и было бы поздно.</b>"
        det:
          - Отросток мог лопнуть в ближайшие часы, а перитонит в Антарктиде был смертным приговором.
        src: "Источник: «Сын хирурга Леонида Рогозова: в Антарктиде папа сам себе вырезал аппендикс», «Комсомольская правда», 26.04.2018 — https://www.kp.ru/daily/26374.3/3253842/; «Операция вместо Первомая. Как русский хирург сам себе вырезал аппендикс», Life.ru, 01.05.2018 — https://life.ru/p/1112039"
        stranica: "«Сын хирурга Леонида Рогозова: в Антарктиде папа сам себе вырезал аппендикс», «Комсомольская правда», 26.04.2018"
        href: https://www.kp.ru/daily/26374.3/3253842/
        otryvok: "«Наконец вот он, проклятый аппендикс! С ужасом я увидел темное пятно на нем: это означало, что еще день промедления - и меня уже было бы не спасти»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Рогозов оперировал себя по зеркалу, где всё наоборот, а остальное делал на ощупь без перчаток.</b>
        det:
          - Зеркало держал инженер-механик Зиновий Теплинский и направлял свет лампы. Местное обезболивание новокаином, разрез 12 см; задел слепую кишку — и тут же её зашил. Каждые 4–5 минут останавливался на 20–25 секунд, когда кружилась голова; операция длилась 1 час 45 минут. «Зеркало помогает, но в то же время запутывает», — записал Рогозов.
        src: "Источник: Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014 — https://aif.ru/society/people/1353447; «Сын хирурга Леонида Рогозова: в Антарктиде папа сам себе вырезал аппендикс», «Комсомольская правда», 26.04.2018 — https://www.kp.ru/daily/26374.3/3253842/; Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus) — https://jlm-taurus.livejournal.com/143075.html"
        stranica: Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014
        href: https://www.kp.ru/daily/26374.3/3253842/
        otryvok: «Зеркало помогает, но в то же время запутывает»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-13-goskatalog-70379037.jpg
          alt: Круглое зеркало в светлой металлической оправе на тёмном фоне, в нём отражается окно.
          data_source: https://goskatalog.ru/portal/#/collections?id=70379037
          license: цитирование, ст. 1274 ГК РФ, с указанием музея и Госкаталога
          podpis: Круглое зеркало из хирургического набора, которым Леонид Рогозов 30 апреля 1961 года оперировал сам себя на станции Новолазаревская (так в описании музея).
          credit: ФГБУК «Российский государственный музей Арктики и Антарктики», № РГМАА О-6865/18, Госкаталог № 70379037
          width: 415
          height: 377
        utverzhden: 2026-11-03
      - summary: "<b>Посреди операции Рогозова обожгла мысль: «Я наношу себе всё больше ран и не замечаю их».</b>"
        det:
          - Работая на ощупь, без перчаток, Рогозов вдруг понял, что ранит себя и не чувствует этого. Через полчаса после начала пришли слабость и головокружение; он продолжал, отдыхая по 20–25 секунд каждые 4–5 минут.
        src: "Источник: «Легендарный хирург Леонид Рогозов», Сибирский медицинский портал, 15.08.2018 — https://sibmedport.ru/legendarnyj-hirurg-leonid-rogozov/; Шадрин Р., «История хирурга Рогозова, который вырезал сам себе аппендицит», Chita.ru, 23.02.2022 — https://www.chita.ru/text/longread/2022/02/23/71227760/"
        stranica: «Легендарный хирург Леонид Рогозов», Сибирский медицинский портал, 15.08.2018
        href: https://sibmedport.ru/legendarnyj-hirurg-leonid-rogozov/
        otryvok: "«Внезапно в моей голове вспыхнуло: я наношу себе все больше ран и не замечаю их... Я становился слабее и слабее, мое сердце начинает сбоить. Каждые четыре-пять минут я останавливаюсь отдохнуть на 20-25 секунд.»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Гербович разрешил врачу резать себя и лишь ночью понял: при неудаче отвечать пришлось бы ему.</b>"
        det:
          - "Начальник станции Владислав Гербович ответил на просьбу Рогозова: «Я согласен с вами. Начнём подготовку». Сам надел халат и резиновые перчатки и встал в ногах кровати, чтобы подменить ассистента, если тому станет дурно. Уже засыпая после операции, он осознал, что при неудаче всю ответственность возложили бы на него. На время подготовки вся станция, даже начальник, подчинялась одному Рогозову («КП», 10.05.1961)."
        src: "Источник: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus) — https://jlm-taurus.livejournal.com/143075.html; «Комсомольская правда», 29.04.2026 (перепечатка заметок 9–10 мая 1961 г.) — https://www.kp.ru/daily/27777.3/5242048/"
        stranica: Гербович В. И., дневник начальника станции Новолазаревская (публикация в блоге jlm_taurus)
        href: https://jlm-taurus.livejournal.com/143075.html
        otryvok: «Я согласен с вами. Начнём подготовку»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Рогозов научил помощников, что делать, если он потеряет сознание, — и не потерял.</b>
        det:
          - Метеорологу Александру Артемьеву он дал шприц и показал, как сделать укол; Артемьев подавал инструменты. Начальник станции Владислав Гербович дежурил рядом, чтобы подменить того, кому станет дурно. «Мои бедные ассистенты! …они стояли в белых халатах и сами были белее белого», — записал Рогозов. Подменять никого не пришлось.
        src: "Источник: Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014 — https://aif.ru/society/people/1353447; «Сын хирурга Леонида Рогозова: в Антарктиде папа сам себе вырезал аппендикс», «Комсомольская правда», 26.04.2018 — https://www.kp.ru/daily/26374.3/3253842/"
        stranica: Сидорчик А., «Круче, чем Хаус. Как советский врач в Антарктиде провёл операцию сам себе», «Аргументы и факты», 09.10.2014
        href: https://aif.ru/society/people/1353447
        otryvok: «Мои бедные ассистенты! …они стояли в белых халатах и сами были белее белого»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-13-goskatalog-70379039.jpg
          alt: Стеклянный шприц с металлическими кольцами и маркировкой «58» рядом с масштабной линейкой на 10 см.
          data_source: https://goskatalog.ru/portal/#/collections?id=70379039
          license: цитирование, ст. 1274 ГК РФ
          podpis: Шприц из хирургического набора Рогозова — такой шприц он дал метеорологу Артемьеву на случай, если сам потеряет сознание.
          credit: ФГБУК «Российский государственный музей Арктики и Антарктики», № РГМАА О-6865/14, Госкаталог № 70379039
          width: 800
          height: 533
        utverzhden: 2026-11-03
      - summary: "<b>Космонавт Герман Титов написал: «Мы завидуем мужеству советского врача Леонида Рогозова».</b>"
        det:
          - "В книге «Голубая моя планета» лётчик-космонавт СССР Герман Титов написал: «…мы завидуем мужеству советского врача Леонида Рогозова, который сделал сам себе операцию в сложных условиях антарктической экспедиции»."
