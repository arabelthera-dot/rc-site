vizual:
  imya: rogozov-qsl
  vid: dokument
  kicker: Документ под лупой
  h2: Позывной Новолазаревской
  lead: 'Такой карточкой станция Новолазаревская подтверждала радиосвязь в 1962 году. Приближайте: Антарктида, звезда станции и позывной UA1KAE.'
audioguide:
  audioSrc: audio-guide-rogozov-ru.mp3
  durationLabel: около двух минут
  lead: Голос ведёт от шва, который Рогозов накладывал себе сам, через решение оперироваться на станции Новолазаревская к швам, которые он снял себе через неделю.
  stops:
    - t: 0
      mark: '0:00'
      title: Шов покрасивее
    - t: 27
      mark: '0:27'
      title: Единственный выход
    - t: 60
      mark: '1:00'
      title: Белее белого
    - t: 88
      mark: '1:28'
      title: Всё наоборот
    - t: 118
      mark: '1:58'
      title: Испорченный праздник
  transcript:
    - "Около полуночи первого мая тысяча девятьсот шестьдесят первого года обессиленный Леонид Рогозов перешёл к шву на собственном животе. Он велел лучше осветить рану и поднести зеркало. Начальник станции Владислав Гербович записал: «чтобы лучше и красивее сделать шов». Сестра Валентина потом видела шрам: «Такой аккуратный, никто бы не подумал, что можно так ювелирно зашить самого себя». Отросток он к тому времени уже удалил сам."
    - "Вечером двадцать девятого апреля у него поднялась температура. Он понял, что это острый аппендицит, испробовал покой, голод, холод и антибиотики, но не помогло. На станции Новолазаревская зимовали тринадцать человек, врач один. Самолёта не было ни у них, ни у соседей, а пурга не дала бы взлететь. В дневнике он записал: «Это почти невыполнимо… но я не могу просто опустить руки и сдаться». И дальше: «Я вынужден думать о единственно возможном выходе: самому оперировать себя»."
    - "Гербович предлагал ждать врача из Мирного, но Рогозов перебил: «Подождите, не возражайте». Расчёт был хирургический: если после разреза отросток лопнет, гной вытечет наружу. Гербович ответил: «Я согласен с вами. Начнём подготовку». Метеорологу Александру Артемьеву Рогозов дал шприц и показал, как сделать укол, если он потеряет сознание. Зеркало держал инженер-механик Зиновий Теплинский. Рогозов записал: «Мои бедные ассистенты! …они стояли в белых халатах и сами были белее белого»."
    - "Местное обезболивание новокаином, разрез двенадцать сантиметров. В зеркале всё было наоборот, остальное он делал на ощупь, без перчаток. Каждые четыре — пять минут кружилась голова, и он отдыхал по двадцать — двадцать пять секунд. Вдруг обожгла мысль: «Я наношу себе всё больше ран и не замечаю их». На отростке было тёмное пятно, ещё день — и было бы поздно. Операция длилась час сорок пять минут, подменять никого не пришлось."
    - "Закончив, Рогозов объяснил помощникам, как прибраться, принял снотворное и уснул. Накануне он огорчался, что испортил всем праздник. Первого мая, с температурой тридцать восемь и одна, он слушал поздравительные телеграммы, их читал ему начальник станции. Через семь дней он сам снял себе швы, через две недели вернулся к работе. Космонавт Герман Титов написал: «мы завидуем мужеству советского врача Леонида Рогозова»."
  note: Озвучено синтезом речи.
