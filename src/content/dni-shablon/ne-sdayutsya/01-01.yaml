story:
  kicker: Подвиг
  h2: Евпатий Коловрат
  abzacy:
  - 'Декабрь 1237 года. Орда Батыя взяла Рязань и сожгла её дотла. Весть о нашествии застала воеводу Евпатия Коловрата в Чернигове, у князя Ингваря Ингоревича: там было безопасно. Он вернулся и на пепелище собрал тех, кто уцелел, потому что во время штурма был вне города, — 1700 человек.'
  - 'С этой дружиной Коловрат догнал Батыя в Суздальской земле и внезапно ударил по станам — в спину войску, которое погони не ждало. Батый послал против него Хостоврула, и тот обещал привести воеводу живым. Коловрат рассёк его до седла.'
  - 'Взять Коловрата живым так и не смогли: против одного воина навели пороки — стенобитные камнемёты, которыми ломали крепости. Над его телом Батый сказал, что держал бы такого человека «против сердца своего», отдал тело дружине и отпустил пленных.'
