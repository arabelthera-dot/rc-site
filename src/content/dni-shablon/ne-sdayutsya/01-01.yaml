story:
  kicker: Подвиг · 6 ударов
  h2: Бой, который не мог быть выигран
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Декабрь 1237 года. Орда Батыя взяла Рязань и сожгла её дотла, а Коловрат в это время был в Чернигове.
      det:
        - Весть о нашествии застала воеводу у князя Ингваря Ингоревича в Чернигове. Там было безопасно. Он мог остаться, переждать, пока орда уйдёт, или потом служить сильному царю, как служили многие. Он вернулся.
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН."
    - summary: На пепелище он собрал тех, кто уцелел, — 1700 человек, — и пошёл вдогонку за войском, взявшим город.
      det:
        - "«Повесть»: «собра мало дружины тысящу семсот человек, которых Богъ соблюде — быша внѣ града». Уцелели они только потому, что во время штурма были вне города."
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН."
    - summary: Коловрат настиг Батыя в Суздальской земле и ударил по станам — в спину войску, которое погони не ждало.
      det:
        - Орда уходила с добычей. Удар был внезапным, и бой шёл с ожесточением, какого она не видела.
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН."
    - summary: Батый послал против него Хостоврула, и тот обещал привести воеводу живым. Коловрат рассёк его до седла.
      det:
        - Хостоврул в «Повести» — «шурич» Батыя, то есть сын шурина. На старой странице музея было написано «шурин» — это неточно.
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, текст и комментарий 30."
    - summary: Взять его живым не смогли. На одного воина навели камнемёты, которыми ломали стены, — и едва убили.
      det:
        - Коловрат погиб, но орда, взявшая десятки городов, запомнила этот бой. Батый над телом сказал, что держал бы такого человека «против сердца своего», отдал тело дружине и отпустил пленных.
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН."
    - summary: Что здесь было на самом деле, а что досказала легенда, историки спорят. Но выбор не сдаться — подлинный.
      det:
        - Коловрат известен только по «Повести». Д. С. Лихачёв и А. А. Горский считают эпизод полулегендарным, в основе — вероятно, рязанское предание. Нашествие 1237 года и разорение Рязани — исторический факт.
        - Человек, у которого отняли всё, выбрал не сдаться. Не ради победы — победы не было. Ради того, чтобы остаться собой.
      src: "Источники: БЛДР т. 5, вступительная статья; ТОДРЛ, т. 46 (ИРЛИ РАН); Рязанский историко-архитектурный музей-заповедник."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Евпатии Коловрате
    h2: Мечи, пороки и «люди крылатые»
    udary:
      - summary: <b>Коловрат рубился так, что мечи притупились, — и стал рубить врага татарскими мечами.</b>
        det:
          - "«Еупатию тако их бьяше нещадно, яко и мечи притупишася, и емля татарскыа мечи и сѣчаша их». В переводе: Евпатий бился так беспощадно, что мечи притупились, и он выхватывал татарские и рубил ими. До этого, по «Повести», татары «сташа яко пианы или неистовы»."
        src: "Источник: БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        stranica: БЛДР т. 5, ИРЛИ РАН
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        otryvok: «Еупатию тако их бьяше нещадно, яко и мечи притупишася, и емля татарскыа мечи и сѣчаша их»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-01-goskatalog-12931201.jpg
          alt: Кованый древнерусский шлем с наносником и навершием-шпилем
          data_source: https://goskatalog.ru/portal/#/collections?id=12931201
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Шлем древнерусского воина, тип II — так были защищены дружинники времён Батыева нашествия.
          credit: "Хранится: МБУК городского округа город Воронеж «Центр военно-патриотического воспитания «Музей-диорама»», инв. ВМД А 36. Госкаталог № 12826458. Источник: goskatalog.ru"
          width: 1600
          height: 1065
        utverzhden: 2026-11-03
      - summary: <b>Дружина Коловрата билась так, что мурзы Батыя назвали рязанцев «людьми крылатыми».</b>
        det:
          - "Над телом Коловрата военачальники Батыя сказали: «Мы со многими цари, во многих землях, на многихъ бранех бывали, а таких удалцов и резвецов не видали». И дальше: «Сии бо люди крылатыи и не имеюще смерти… бьяшеся един с тысящею, а два — с тмою», то есть один бился с тысячей, а двое — с десятью тысячами. По их словам, о таких бойцах им не рассказывали даже отцы."
        src: "Источник: БЛДР т. 5 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        stranica: БЛДР т. 5
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        otryvok: «Мы со многими цари, во многих землях, на многихъ бранех бывали, а таких удалцов и резвецов не видали»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Коловрат рассёк до седла Хостоврула, который хвалился привести его к Батыю живым.</b>
        det:
          - "Батый послал против Коловрата «шурича своего Хостоврула». В переводе ИРЛИ это «сын шурина», то есть родич жены Батыя. Хостоврул «похвалися пред царем, хотя Еупатия жива пред царя привести», а Коловрат «разсече Хостоврула на полы до седла». Поправка к старой странице: там написано «шурин», это неточно."
        src: "Источник: БЛДР т. 5, текст и комментарий 30 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956; Пометка: Хостоврул известен только по «Повести» (комм. 30)"
        stranica: БЛДР т. 5, текст и комментарий 30
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        otryvok: «шурича своего Хостоврула»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Пятеро израненных рязанцев высмеяли Батыя в лицо — и царь подивился их ответу.</b>
        det:
          - "Татары с трудом взяли в плен пятерых воинов, «изнемогших от великых ран». Батый спросил, кто они. Пленные назвались слугами князя Юрия Ингоревича из полка Коловрата, посланными от Ингваря Ингоревича «почтить» царя, и добавили: «Да не подиви, царю, не успевати наливати чаш на великую силу — рать татарьскую» (не дивись, царь, что не успеваем наливать чаш на такую силу). «Повесть»: царь «подивися отвѣту их мудрому»."
        src: "Источник: БЛДР т. 5 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        stranica: БЛДР т. 5
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        otryvok: «изнемогших от великых ран»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-01-goskatalog-14903630.jpg
          width: 512
          height: 800
          klass: portret
          alt: "Офорт: хан в остроконечной шапке с саблей на коленях сидит на престоле, позади русские воины в кольчугах"
          data_source: https://goskatalog.ru/portal/#/collections?id=14903630
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: А. Д. Шмаринов. «Хан. Повесть о разорении Рязани Батыем», 1978–1979 — хан на престоле, за его спиной стоят русские пленники.
          credit: "Шмаринов А. Д. «Хан. Повесть о разорении Рязани Батыем», цикл «На поле Куликовом», 1978–1979, офорт. Хранится: ФГБУК Музей-заповедник «Абрамцево», инв. Г 1655, МА КП 6584. Госкаталог № 14775053. Источник: goskatalog.ru"
        utverzhden: 2026-11-03
      - summary: "<b>Коловрат заставил Батыя сказать над своим телом: «Держал бы его против сердца своего».</b>"
        det:
          - "Древнерусский текст: «Аще бы у меня такий служил, держал бых его против сердца своего». В переводе ИРЛИ: «любил бы его всем сердцем». Батый, взявший Рязань, говорит это о человеке, который только что бил его войско. На странице дать древнерусский текст и пометить, что это не перевод."
        src: "Источник: БЛДР т. 5 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        stranica: БЛДР т. 5
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        otryvok: «Аще бы у меня такий служил, держал бых его против сердца своего»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Коловрата не смогли взять мечом — на одного воина навели «тмочисленые пороки».</b>
        det:
          - «Татарове возбояшеся, видя Еупатия крѣпка исполина. И навадиша на него множество пороков, и нача бити по нем ис тмочисленых пороков, и едва убиша его». Пороки — стенобитные камнемёты, которыми ломали крепости. Против одного человека их навели бесчисленное множество, «тьму».
        src: "Источник: БЛДР т. 5 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        stranica: БЛДР т. 5
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        otryvok: «Татарове возбояшеся, видя Еупатия крѣпка исполина. И навадиша на него множество пороков, и нача бити по нем ис тмочисленых пороков, и едва убиша его»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Коловрат догнал орду в Суздальской земле и ударил так внезапно, что татары решили: это встали мёртвые.</b>"
        det:
          - "«Татарове мняша, яко мертви восташа!» Перед этим «Повесть» говорит о Рязани: «не осталось во граде ни одного живого». Удар 1700 человек Коловрата пришёлся по станам Батыя внезапно. Перевод ИРЛИ: «едва смогли догнать его в Суздальской земле. И внезапно напали на отдыхавшее войско Батыево, и начали сечь без милости, и внесли смятение во все полки татарские». Батый уходил с добычей и погони не ждал. Удар пришёлся в спину войску, разорившему Рязанскую землю."
        src: "Источник: БЛДР т. 5 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        stranica: БЛДР т. 5
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        otryvok: «Татарове мняша, яко мертви восташа!»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-01-goskatalog-47351224.jpg
          alt: Ржавый железный наконечник стрелы-срезня с широким треугольным остриём
          data_source: https://goskatalog.ru/portal/#/collections?id=47351224
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Наконечник стрелы «срезень» с треугольным остриём монгольского типа, XIII–XIV века — такими стреляло войско Батыя.
          credit: "Хранится: МБУК «Историко-краеведческий музей» Дятьковского района Брянской области, инв. ИКМ ОФ 2735. Госкаталог № 47106202. Источник: goskatalog.ru"
          width: 1600
          height: 413
        utverzhden: 2026-11-03
      - summary: <b>Коловрат вернулся на пепелище Рязани и собрал 1700 уцелевших — против всей орды.</b>
        det:
          - Весть о нашествии застала Коловрата в Чернигове, у князя Ингваря Ингоревича, там было безопасно. Увидев сожжённый город, «Еупатий воскрича в горести душа своея», «собра мало дружины тысящу семсот человек, которых Богъ соблюде — быша внѣ града». Это были люди, которые уцелели только потому, что во время штурма были вне города. Против них стояло войско, взявшее Рязань за несколько дней.
        src: "Источник: БЛДР т. 5 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        stranica: БЛДР т. 5
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        otryvok: «Еупатий воскрича в горести душа своея»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-01-goskatalog-9187534.jpg
          width: 624
          height: 487
          alt: Зимний ночной лес, воины в шлемах у костров, над ними видения святых
          data_source: https://goskatalog.ru/portal/#/collections?id=9187534
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
