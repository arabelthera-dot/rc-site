video:
  h2: "Евпатий Коловрат: пепелище Рязани"
  klyuch: nesdayutsya/01jan-kolovrat
  format: horizontal
  pole: nesdayutsya/01jan-kolovrat:horizontal.sec
  suffix: сек
  badge: 69 сек
  intro: Та же история кинематографическим роликом — от сожжённой Рязани до слов Батыя над телом.
  poster: video/day-01jan-kolovrat-poster.jpg
  mp4: video/day-01jan-kolovrat.mp4?v=1
  note: Визуальный ряд — картина Максима Преснякова «Евпатий Коловрат» (2009), миниатюра Лицевого летописного свода XVI века и фото памятника в Рязани. Нейросетевых кадров нет. Закадровый текст озвучен синтезом речи.
story:
  kicker: Подвиг · 6 ударов
  h2: Бой, который не мог быть выигран
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Декабрь 1237 года. Орда Батыя взяла Рязань и сожгла её дотла, а Коловрат в это время был в Чернигове.
      det:
        - Весть о нашествии застала воеводу у князя Ингваря Ингоревича в Чернигове. Там было безопасно. Он мог остаться, переждать, пока орда уйдёт, или потом служить сильному царю, как служили многие. Он вернулся.
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН."
    - summary: На пепелище он собрал тех, кто уцелел, — 1700 человек, — и пошёл вдогонку за войском, взявшим город.
      det:
        - "«Повесть»: «собра мало дружины тысящу семсот человек, которых Богъ соблюде — быша внѣ града». Уцелели они только потому, что во время штурма были вне города."
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН."
    - summary: Коловрат настиг Батыя в Суздальской земле и ударил по станам — в спину войску, которое погони не ждало.
      det:
        - Орда уходила с добычей. Удар был внезапным, и бой шёл с ожесточением, какого она не видела.
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН."
    - summary: Батый послал против него Хостоврула, и тот обещал привести воеводу живым. Коловрат рассёк его до седла.
      det:
        - Хостоврул в «Повести» — «шурич» Батыя, то есть сын шурина. На старой странице музея было написано «шурин» — это неточно.
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, текст и комментарий 30."
    - summary: Взять его живым не смогли. На одного воина навели камнемёты, которыми ломали стены, — и едва убили.
      det:
        - Коловрат погиб, но орда, взявшая десятки городов, запомнила этот бой. Батый над телом сказал, что держал бы такого человека «против сердца своего», отдал тело дружине и отпустил пленных.
      src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН."
    - summary: Что здесь было на самом деле, а что досказала легенда, историки спорят. Но выбор не сдаться — подлинный.
      det:
        - Коловрат известен только по «Повести». Д. С. Лихачёв и А. А. Горский считают эпизод полулегендарным, в основе — вероятно, рязанское предание. Нашествие 1237 года и разорение Рязани — исторический факт.
        - Человек, у которого отняли всё, выбрал не сдаться. Не ради победы — победы не было. Ради того, чтобы остаться собой.
      src: "Источники: БЛДР т. 5, вступительная статья; ТОДРЛ, т. 46 (ИРЛИ РАН); Рязанский историко-архитектурный музей-заповедник."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Евпатии Коловрате
    h2: Мечи, пороки и «люди крылатые»
    udary:
      - summary: <b>Коловрат рубился так, что мечи притупились, — и стал рубить врага татарскими мечами.</b>
        det:
          - "В переводе: Евпатий бился так беспощадно, что мечи притупились, и он выхватывал татарские и рубил ими. До этого, по «Повести», татары «сташа яко пианы или неистовы»."
        src: "Источник: «Повесть о разорении Рязани Батыем», подготовка текста, перевод и комментарии И. А. Лобаковой, БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «Еупатию тако их бьяше нещадно, яко и мечи притупишася, и емля татарскыа мечи и сѣчаша их»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        kadr:
          src: /muzei/ne-sdayutsya/img/01-01-goskatalog-12931201.jpg
          alt: Кованый древнерусский шлем с наносником и навершием-шпилем
          data_source: https://goskatalog.ru/portal/#/collections?id=12931201
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Шлем древнерусского воина, тип II — так были защищены дружинники времён Батыева нашествия.
          credit: "Хранится: МБУК городского округа город Воронеж «Центр военно-патриотического воспитания «Музей-диорама»», инв. ВМД А 36. Госкаталог № 12826458. Источник: goskatalog.ru"
          width: 1600
          height: 1065
      - summary: <b>Дружина Коловрата билась так, что мурзы Батыя назвали рязанцев «людьми крылатыми».</b>
        det:
          - "Над телом Коловрата военачальники Батыя сказали: «Мы со многими цари, во многих землях, на многихъ бранех бывали, а таких удалцов и резвецов не видали». Один бился с тысячей, а двое — с десятью тысячами. По их словам, о таких бойцах им не рассказывали даже отцы."
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «Сии бо люди крылатыи и не имеюще смерти… бьяшеся един с тысящею, а два — с тмою»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: <b>Коловрат рассёк до седла Хостоврула, который хвалился привести его к Батыю живым.</b>
        det:
          - Батый послал против Коловрата «шурича своего Хостоврула» — в переводе ИРЛИ это «сын шурина», родич жены Батыя. На старой странице было «шурин» — это неточно.
          - В других русских и монгольских источниках Хостоврул не упоминается (комментарий 30).
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, текст и комментарий 30 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «похвалися пред царем, хотя Еупатия жива пред царя привести… разсече Хостоврула на полы до седла»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, текст и комментарий 30
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: <b>Пятеро израненных рязанцев высмеяли Батыя в лицо — и царь подивился их ответу.</b>
        det:
          - Татары с трудом взяли в плен пятерых воинов, «изнемогших от великых ран». Пленные назвали себя людьми Ингваря Ингоревича, посланными «почтить» могучего царя, и добавили, что не успевают наливать чаш на такую силу.
          - "«Повесть»: царь «подивися отвѣту их мудрому». На старой странице была только первая половина ответа, без насмешки про чаши."
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «Да не подиви, царю, не успевати наливати чаш на великую силу — рать татарьскую»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: "<b>Коловрат заставил Батыя сказать над своим телом: «Держал бы его против сердца своего».</b>"
        det:
          - "Это древнерусский текст, не перевод. В переводе ИРЛИ: «любил бы его всем сердцем». Батый, взявший Рязань, говорит это о человеке, который только что бил его войско."
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «Аще бы у меня такий служил, держал бых его против сердца своего»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: <b>Коловрата не смогли взять мечом — на одного воина навели «тмочисленые пороки».</b>
        det:
          - Пороки — стенобитные камнемёты, которыми ломали крепости. Против одного человека их навели бесчисленное множество, «тьму».
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «И навадиша на него множество пороков, и нача бити по нем ис тмочисленых пороков, и едва убиша его»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: "<b>Дружина Коловрата ударила так, что татары решили: это встали мёртвые рязанцы.</b>"
        det:
          - О Рязани «Повесть» говорит, что во граде не осталось ни одного живого, поэтому её защитников враг считал убитыми. Внезапный удар 1700 человек показался ему восстанием мёртвых.
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «Татарове мняша, яко мертви восташа!»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: <b>Коловрат вернулся на пепелище Рязани и собрал 1700 уцелевших — против всей орды.</b>
        det:
          - Весть о нашествии застала Коловрата в Чернигове, у князя Ингваря Ингоревича, — там было безопасно. Увидев сожжённый город, «Еупатий воскрича в горести душа своея».
          - С ним пошли люди, уцелевшие только потому, что во время штурма были вне города. Против них стояло войско, взявшее Рязань за несколько дней.
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «собра мало дружины тысящу семсот человек, которых Богъ соблюде — быша внѣ града»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: <b>Коловрат догнал орду в Суздальской земле и внезапно ударил по станам Батыя.</b>
        det:
          - Батый уходил с добычей и погони не ждал. Удар пришёлся в спину войску, разорившему Рязанскую землю.
        src: "Источник: «Повесть о разорении Рязани Батыем», перевод ИРЛИ, БЛДР т. 5 — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «едва смогли догнать его в Суздальской земле. И внезапно напали на отдыхавшее войско Батыево, и начали сечь без милости»
        stranica: «Повесть о разорении Рязани Батыем», перевод И. А. Лобаковой, БЛДР т. 5
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
        kadr:
          src: /muzei/ne-sdayutsya/img/01-01-goskatalog-47351224.jpg
          alt: Ржавый железный наконечник стрелы-срезня с широким треугольным остриём
          data_source: https://goskatalog.ru/portal/#/collections?id=47351224
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Наконечник стрелы «срезень» с треугольным остриём монгольского типа, XIII–XIV века — такими стреляло войско Батыя.
          credit: "Хранится: МБУК «Историко-краеведческий музей» Дятьковского района Брянской области, инв. ИКМ ОФ 2735. Госкаталог № 47106202. Источник: goskatalog.ru"
          width: 1600
          height: 413
      - summary: <b>Коловрат даже мёртвым заставил Батыя отдать его тело дружине и отпустить пленных.</b>
        det:
          - Пленных отпустили живыми, «ничем вредити», — это была цена уважения к павшему противнику.
          - "Где похоронили Коловрата, «Повесть» не говорит: Ингварь хоронит мать и других погибших, о Коловрате там ни слова."
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «даша тѣло Еупатево его дружине останочной, которые поиманы на побоище»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
  - id: fakty-dnya
    nav: Ещё пять
    kicker: Ещё пять фактов
    h2: Повесть, память и бронза
    udary:
      - summary: <b>Коловрат так бился в полках орды, что «самому царю возбоятися».</b>
        det:
          - В переводе — сам царь испугался. Сразу после этого Батый отправляет против Коловрата Хостоврула с «силныа полкы татарскыа».
        src: "Источник: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «И ездя полком татарскым храбро и мужественно, яко и самому царю возбоятися»
        stranica: «Повесть о разорении Рязани Батыем», БЛДР т. 5, ИРЛИ РАН (Пушкинский Дом)
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: <b>Коловрат остался в памяти без единой летописной строки — его сберегла одна «Повесть».</b>
        det:
          - В некоторых редакциях у него есть отчество «Львович». «Повесть» сложилась вскоре после нашествия (её сближают с литературой 1270-х годов), а дошла до нас в списках XVI века.
        src: "Источник: БЛДР т. 5, комментарий 28 и вступительная статья — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        otryvok: «Евпатий Коловрат нигде более не упоминается»
        stranica: БЛДР т. 5, «Повесть о разорении Рязани Батыем», комментарий 28
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: <b>Рассказ о рязанском поражении стал образцом для повестей о победе на Куликовом поле.</b>
        det:
          - По вступительной статье ИРЛИ, «Повесть» повлияла на «Задонщину», «Сказание о Мамаевом побоище», «Повесть о нашествии Тохтамыша» и повесть Нестора-Искандера о взятии Царьграда. Книжники XIV–XV веков писали о победах, опираясь на рассказ о бое Коловрата.
        src: "Источник: БЛДР т. 5, вступительная статья — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956"
        stranica: БЛДР т. 5, вступительная статья к «Повести о разорении Рязани Батыем»
        href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4956
      - summary: <b>Рязанцы поставили Коловрату конную статую высотой 7 метров — в 2007 году.</b>
        det:
          - Памятник открыт 18 октября 2007 года к 70-летию Рязанской области, на пересечении улиц Ленина и Почтовой. Проект выбрали из 14 конкурсных работ, авторы — скульптор Олег Седов и архитектор Владислав Лаврентьев. Скульптура высотой 4,6 м, вместе с постаментом — 7 м.
        src: "Источник: Краеведческий календарь Рязанской ОУНБ им. Горького, «Героическая оборона Рязани от монгольских завоевателей (1237 г.). Евпатий Коловрат» — https://kraeved.rounb.ru/calendar/geroicheskaja-oborona-rjazani-ot-mongolskih-zavoevatelej-1237-g-"
        stranica: Краеведческий календарь Рязанской ОУНБ им. Горького, «Героическая оборона Рязани от монгольских завоевателей (1237 г.). Евпатий Коловрат»
        href: https://kraeved.rounb.ru/calendar/geroicheskaja-oborona-rjazani-ot-mongolskih-zavoevatelej-1237-g-
      - summary: <b>Рязанская земля семь веков хранила имя Коловрата, хотя учёные спорят о деталях боя.</b>
        det:
          - Д. С. Лихачёв и А. А. Горский считают эпизод полулегендарным, в основе, вероятно, рязанское предание или былина. Число 1700, пороки и поединок могли прийти из книжной традиции, в том числе из Жития Ипатия Гангрского.
          - Нашествие 1237 года и разорение Рязани — исторический факт.
        src: "Источники: БЛДР т. 5, вступительная статья; ТОДРЛ, т. 46 (ИРЛИ РАН); Рязанский историко-архитектурный музей-заповедник (ryazankreml.ru)"
        stranica: БЛДР т. 5, вступительная статья к «Повести о разорении Рязани Батыем»
