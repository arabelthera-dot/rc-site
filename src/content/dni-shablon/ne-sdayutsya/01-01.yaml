return:
  q: Почему татары, по «Повести», решили, что против них встали мёртвые?
  a: В Рязани не осталось ни одного живого — и вдруг по их станам ударила дружина рязанцев.
  src: «Повесть о разорении Рязани Батыем», БЛДР т. 5
audioguide:
  audioSrc: /muzei/ne-sdayutsya/audio-guide-kolovrat-ru-v2.mp3
  durationLabel: 1 минута 41 секунда
  lead: Голос ведёт от пепелища Рязани до последнего боя — пять остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь историю.
  stops:
    - t: 0
      mark: "0:00"
      title: Пепелище Рязани
    - t: 19
      mark: "0:19"
      title: Человек из «Повести»
    - t: 42
      mark: "0:42"
      title: Малая дружина
    - t: 60
      mark: "1:00"
      title: Бой, которого не ждали
    - t: 79
      mark: "1:19"
      title: Слова Батыя
  transcript:
    - "<p>«Мы входим в тёмный зал, и свет в нём один — на пепелище. Смотрите на миниатюру: это Рязань, декабрь 1237 года. Города больше нет. Именно сюда, в этот пепел, вернулся человек, о котором мы сегодня говорим.</p>"
    - <p>Его звали Евпатий Коловрат, и его не было в городе, когда пришла орда. Он был в Чернигове, у князя Ингваря. Узнав, что Рязань сожжена, он мог остаться — в тепле, в безопасности. Вместо этого он собрал малую дружину и пошёл догонять войско, которое сильнее его в сто раз.</p>
    - "<p>Около 1700 человек против орды, бравшей города. Единственный источник, который о них рассказывает, — «Повесть о разорении Рязани Батыем». И там написано странное: татары бились с ними, думая, что мёртвые восстали.</p>"
    - <p>Батый послал против Коловрата Хостоврула, сына своего шурина, — воевода рассёк его до седла. Взять его живым не смог никто. И тогда, по «Повести», его убили так, как не убивают человека, — камнемётными орудиями, которыми разрушали крепости.</p>
    - "<p>Батый, глядя на мёртвого, сказал: если бы такой человек служил мне, я держал бы его против сердца. Тело отдал дружине, пленных отпустил. Что здесь история, а что легенда — решают историки. Но выбор, о котором этот зал, — подлинный: не сдаться, даже когда сдаться разумно».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
