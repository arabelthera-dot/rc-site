return:
  q: Что, по «Повести», подумали татары, когда бились с дружиной Коловрата?
  a: «Татарове мняша, яко мертви восташа» — что мёртвые восстали.
  src: «Повесть о разорении Рязани Батыем», БЛДР т. 5
vizual:
  imya: kolovrat-linogravyura
  vid: predmet
  kicker: Гравюра под лупой
  h2: '«Коловрат. 1237»'
  lead: 'Линогравюру Людвига Гоцлавского хранит Музей Победы. Приблизь: из чёрного и белого вырезан богатырь, который с 1700 уцелевшими рязанцами ударил по всей орде Батыя.'
audioguide:
  audioSrc: /muzei/ne-sdayutsya/audio-guide-kolovrat-ru-v2.mp3
  durationLabel: около двух минут
  lead: Голос ведёт от пепелища Рязани через внезапный удар малой дружины Коловрата к словам Батыя над его телом.
  stops:
    - t: 0
      mark: '0:00'
      title: Встали мёртвые
    - t: 32
      mark: '0:32'
      title: Тысяча семьсот уцелевших
    - t: 61
      mark: '1:01'
      title: Хостоврул и пороки
    - t: 87
      mark: '1:27'
      title: Слова над телом
  transcript:
    - "Войско Батыя решило, что это встали мёртвые. Так и сказано в «Повести»: «Татарове мняша, яко мертви восташа!» Рязань только что была сожжена, во граде не осталось ни одного живого. Батый уходил с добычей и погони не ждал. Евпатий Коловрат едва смог догнать его в Суздальской земле и внезапно напал на отдыхавшее войско. Его люди начали сечь без милости и внесли смятение во все полки татарские. Удар пришёлся в спину тем, кто разорил Рязанскую землю."
    - Весть о нашествии застала Коловрата в Чернигове, у князя Ингваря Ингоревича, где было безопасно. Увидев сожжённый город, Евпатий «воскрича в горести душа своея». Он собрал тысячу семьсот человек — тех, кто уцелел только потому, что во время штурма был вне города. Против них стояло войско, взявшее Рязань за несколько дней. Коловрат бился так беспощадно, что мечи притупились, и тогда он выхватывал татарские мечи и рубил ими.
    - Он ездил по полкам татарским так храбро, что испугался сам царь. Батый послал против него Хостоврула, сына своего шурина, то есть родича жены. Хостоврул хвалился привести Евпатия к царю живым, а Коловрат рассёк его надвое до седла. Мечом взять рязанца не смогли. Тогда на одного воина навели бесчисленное множество пороков — стенобитных камнемётов, которыми ломали крепости, — и едва убили его.
    - "Над телом Коловрата военачальники Батыя сказали, что во многих землях бывали, а таких удальцов и резвецов не видали: «Сии бо люди крылатыи и не имеюще смерти». А сам Батый произнёс: «Аще бы у меня такий служил, держал бых его против сердца своего». Тело он отдал остаткам дружины, взятым в плен на побоище, и велел отпустить их живыми, ничем не вредя. Ни одна летопись больше не упоминает Коловрата, его имя сберегла только «Повесть»."
  note: Озвучено синтезом речи.
