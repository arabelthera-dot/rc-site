quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — в Чернигове, у князя Ингваря; 2 — около 1700; 3 — что мёртвые восстали; 4 — камнемётными орудиями, «пороками»; 5 — отдал дружине, а пленных отпустил."
  ball: 20
  voprosy:
    - q: Где был Коловрат, когда Батый сжигал Рязань?
      o:
        - В Рязани, на стене
        - В Чернигове, у князя Ингваря
        - В Новгороде
        - В плену у Батыя
      a: 1
      e: Он был в Чернигове, у князя Ингваря Ингоревича. Узнав о нашествии, вернулся — но город уже лежал в пепле.
    - q: Сколько человек, по «Повести», было в дружине Коловрата?
      o:
        - Около 1700
        - Десять тысяч
        - Триста
        - Сорок тысяч
      a: 0
      e: «Малая дружина» — около 1700 человек. Против орды это ничтожно мало, поэтому число и запомнилось.
    - q: Как татары, по «Повести», объяснили, кто перед ними?
      o:
        - Что это новое войско
        - Что мёртвые восстали
        - Что это разбойники
        - Что это княжеская дружина
      a: 1
      e: «Татарове мняша, яко мертви восташа». Врага, который не боится смерти, страшнее смерти.
    - q: Чем, по «Повести», убили Коловрата?
      o:
        - В честном поединке
        - Стрелой из засады
        - Камнемётными орудиями — «пороками»
        - Он сам сдался
      a: 2
      e: «Множеством пороков» — камнемётными машинами, которыми брали крепости. Человека убивали как крепость.
    - q: Что Батый, по «Повести», сделал с телом Коловрата?
      o:
        - Сжёг
        - Бросил в поле
        - Отдал дружине, а пленных отпустил
        - Насадил на копьё
      a: 2
      e: Отдал тело дружине, а пленных отпустил — и сказал, что держал бы такого «против сердца своего».
