vizual:
  imya: dom-pavlova-znachok
  vid: predmet
  kicker: Предмет под лупой
  h2: Значок «Дом Павлова»
  lead: 'Такие значки увозили из Волгограда в память о доме, который 58 дней держали бойцы сержанта Павлова и лейтенанта Афанасьева. Приближайте: каски, разбитая стена и надпись внизу.'
audioguide:
  audioSrc: audio-guide-dom-pavlova-ru.mp3
  durationLabel: 1 минута 10 секунд
  lead: "Голос ведёт от ночной разведки до контратаки в ноябре: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Площадь
    - t: 16
      mark: 0:16
      title: Четверо
    - t: 26
      mark: 0:26
      title: Гарнизон
    - t: 41
      mark: 0:41
      title: Подвал
    - t: 55
      mark: 0:55
      title: Пятьдесят восемь дней
  transcript:
    - "Сталинград, сентябрь тысяча девятьсот сорок второго года. Немцы вышли к Волге. Гвардейцы Родимцева держат узкую полосу у реки. У площади Девятого января стоит обычный жилой дом в четыре этажа."
    - "Ночью командир роты посылает туда разведку: сержанта Якова Павлова и трёх бойцов. Они выбивают немцев из дома — и остаются в нём."
    - "Через два дня приходят пулемётчики лейтенанта Афанасьева, бронебойщики, миномётчики. Около тридцати человек. Рядом — мельница и дом Заболотного: вместе они держат центр города."
    - "Дом бьют артиллерией, миномётами, бомбами. А в подвале живут мирные люди, которых не успели вывезти за Волгу. Больше пятидесяти человек — рядом с бойцами, все два месяца."
    - "Дом так и не взяли. Двадцать пятого ноября гарнизон сам идёт в контратаку. Официальный счёт обороны — пятьдесят восемь дней. Дом назван по сержанту, а держали его все."
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
