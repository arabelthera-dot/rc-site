    - q: В каком городе стоит дом Павлова?
      o:
        - В Ленинграде
        - В Севастополе
        - В Сталинграде
        - В Москве
      a: 2
      e: В Сталинграде, у площади 9 Января (ныне площадь Ленина в Волгограде).
    - q: Кто первым занял дом?
      o:
        - Разведгруппа сержанта Якова Павлова — четыре бойца
        - Пулемётчики лейтенанта Афанасьева
        - Батальон морской пехоты
        - Ополченцы тракторного завода
      a: 0
      e: "Четверо: Павлов, Глущенко, Александров и Черноголов. Пулемётчики Афанасьева подошли через два дня."
    - q: Сколько дней длилась оборона по официальному счёту?
      o:
        - "28"
        - "100"
        - "200"
        - "58"
      a: 3
      e: 58 дней — с ночи на 27 сентября до 25 ноября 1942 года.
    - q: Кто ещё был в доме всё время обороны?
      o:
        - Штаб армии
        - Мирные жители в подвале — больше пятидесяти человек
        - Пленные немцы
        - Госпиталь дивизии
      a: 1
      e: В подвале жили люди, которых не успели вывезти за Волгу.
    - q: Какую награду получил Яков Павлов за оборону дома?
      o:
        - Никакой
        - Орден Красной Звезды в 1942 году
        - Звание Героя Советского Союза в 1945 году
        - Звание Героя Социалистического Труда
      a: 2
      e: Звание Героя Советского Союза — 27 июня 1945 года. Старший по званию в доме, лейтенант Афанасьев, Героем не стал.
