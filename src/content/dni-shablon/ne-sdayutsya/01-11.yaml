    udary:
      - summary: "<b>Около 30 бойцов держали дом так, что немцы считали: против них целый батальон.</b>"
        det:
          - На третьи сутки пришли пулемётный взвод Афанасьева (семь человек со станковым пулемётом), бронебойщики Собгайды, миномётчики Чернушенко и автоматчики — до 30 бойцов. Вместе с домом лейтенанта Заболотного и мельницей, где был командный пункт полка, дом стал опорным пунктом. Использовали канализационные люки, с чердака стрелял снайпер Анатолий Чехов. Немцы считали, что им противостоит целый батальон.
        src: "Источник: «В Узбекистане скончался последний защитник Дома Павлова в Сталинграде», РИА Новости, 17.03.2015 — https://ria.ru/20150317/1052915776.html; «Дом Павлова без легенд и мифов», Рощупкин В., «Независимое военное обозрение», 14.02.2014 — https://nvo.ng.ru/history/2014-02-14/15_pavlov.html; «С поля боя — в монастырь? Что известно о защитнике Дома Павлова», «АиФ-Волгоград», 18.10.2017 — https://vlg.aif.ru/society/persona/s_polya_boya_-_v_monastyr_chto_izvestno_o_zashchitnike_doma_pavlova; «Сидели в осаде, но жили весело…» (интервью с Ю. Я. Павловым), «История.РФ» — https://histrf.ru/biblioteka/b/sidieli-v-osadie-no-zhili-viesielo-s-fashistami-pierierughivalis ; Пометка: по официальным данным 24 бойца"
        stranica: РИА Новости, 17.03.2015
        href: https://ria.ru/20150317/1052915776.html
        otryvok: «Дом Павлова — жилой 4-этажный дом, в котором во время Сталинградской битвы 58 дней и ночей держала оборону группа советских бойцов численностью около 30 человек. Немцы, в свою очередь, считали, что им противостоит целый батальон.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>На доме Павлова писали «Отстоим тебя, родной Сталинград!», а потом город отстраивали заново.</b>
        det:
          - "На углу дома Павлова сохранилась надпись «Отстоим тебя, родной Сталинград!». Маршак в 1952 году писал о такой надписи, к которой сверху добавили «р»: вышло «Отстроим». В июне 1943 года Александра Черкасова начала добровольческое движение, в её бригаде были 19 жён фронтовиков. К 1948 году в таких бригадах работали 86 тысяч человек, а дом Павлова стал первым восстановленным зданием города."
        src: "Источник: «Отстояли. Теперь отстроим!», «Родина», 02.02.2023 — https://rodina-history.ru/2023/02/02/otstoiali-teper-otstroim.html; «С поля боя — в монастырь? Что известно о защитнике Дома Павлова», «АиФ-Волгоград», 18.10.2017 — https://vlg.aif.ru/society/persona/s_polya_boya_-_v_monastyr_chto_izvestno_o_zashchitnike_doma_pavlova; «Дом Павлова без легенд и мифов», Рощупкин В., «Независимое военное обозрение», 14.02.2014 — https://nvo.ng.ru/history/2014-02-14/15_pavlov.html"
        stranica: Отстояли — теперь отстроим, «Родина», 02.02.2023
        href: https://rodina-history.ru/2023/02/02/otstoiali-teper-otstroim.html
        otryvok: «Отстоим тебя, родной Сталинград!»
        pometka: документ
        kadr:
          src: kartinka:000546
          alt: Иссечённая пулями торцевая стена дома с надписями «Мать Родина! Здесь героически сражались с врагом гвардейцы Родимцева» и «Этот дом отстоял гв. сержант Яков Федотович Павлов»; мимо идут прохожие, за домом руины
          data_source: https://goskatalog.ru/portal/#/collections?id=6490366
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Дом гвардии сержанта Павлова в 1945 году: на стене — имена защитников и надпись о том, кто отстоял дом."
          credit: ФГБУК «Государственный центральный музей современной истории России», ГИК 41798/464; Госкаталог № 6251470
          width: 605
          height: 800
        utverzhden: 2026-11-03
      - summary: "<b>Чуйков сказал: павловцы убили больше врагов, чем немцы потеряли, взяв Париж.</b>"
        det:
          - "Командарм 62-й армии В. И. Чуйков: «Небольшая группа, обороняя один дом, уничтожила вражеских солдат больше, чем гитлеровцы потеряли при взятии Парижа»."
        src: "Источник: «Дом Павлова без легенд и мифов», Рощупкин В., «Независимое военное обозрение», 14.02.2014 — https://nvo.ng.ru/history/2014-02-14/15_pavlov.html; «Сидели в осаде, но жили весело…» (интервью с Ю. Я. Павловым), «История.РФ» — https://histrf.ru/biblioteka/b/sidieli-v-osadie-no-zhili-viesielo-s-fashistami-pierierughivalis ; Пометка: подсчёта потерь у дома нет, слова Чуйкова — образ, а не статистика; на старой странице факт стоял в блоке «Факт или миф»"
        stranica: Рощупкин В. «Дом Павлова без легенд и мифов», «НВО», 14.02.2014
        href: https://nvo.ng.ru/history/2014-02-14/15_pavlov.html
        otryvok: «Небольшая группа, обороняя один дом, уничтожила вражеских солдат больше, чем гитлеровцы потеряли при взятии Парижа»
        pometka: легенда
        utverzhden: 2026-11-03
      - summary: <b>Бронебойщик Тургунов назвал Зину из подвала дочкой и писал ей письма до 1992 года.</b>
        det:
          - "После войны Воронов, Рамазанов, Жуков и Тургунов разыскали Зину Селезнёву и слали ей посылки, все звали её дочкой. Тургунов заверил в сельсовете справку, что она родилась в доме Павлова, — это было нужно для льготы. Своих детей у него было 12: «Будешь 13-й дочкой». Последнее письмо датировано 15 апреля 1992 года. Тургунов умер в марте 2015-го последним из защитников дома, оставив 14 детей, 62 внука и 85 правнуков."
        src: "Источник: «Дочка из Дома Павлова», «Родина», 30.01.2018 — https://rodina-history.ru/2018/01/30/rodina-stalingrad-zina.html; Позднякова М. «История девочки Зины. Как иконка спасла ребенка в Сталинграде», «Аргументы и факты», 01.02.2023 — https://aif.ru/society/history/ikona_portyanki_istoriya_devochki_ziny_kotoruyu_nemcy_ne_ubili_v_stalingrade; «В Узбекистане скончался последний защитник Дома Павлова в Сталинграде», РИА Новости, 17.03.2015 — https://ria.ru/20150317/1052915776.html"
        stranica: Дочка из Дома Павлова, «Родина», 30.01.2018
        href: https://rodina-history.ru/2018/01/30/rodina-stalingrad-zina.html
        otryvok: «Будешь 13-й дочкой»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Калмык Гаря Хохолов через 59 лет доказал, что «неизвестный солдат» дома Павлова — это он.</b>
        det:
          - Бронебойщик из группы Сабгайды учился стрелять у снайпера Чехова прямо в доме, знак «Отличный снайпер» получил 7 ноября 1942 года. После ранения 25 ноября и Курской дуги его, инвалида на костылях, вместе с калмыцким народом выслали на 13 лет. В 1981 году он узнал дом на экскурсии; на звание «неизвестного солдата» претендовали около 50 человек. Хохолова признали 25-м защитником и наградили медалью «За отвагу».
        src: "Источник: «Хохолов Гаря Бадмаевич», музей-заповедник «Сталинградская битва», «Неизвестные судьбы» — https://stalingrad-battle.ru/history/unknown-destinies/3640/"
        stranica: музей-заповедник «Сталинградская битва», раздел «Неизвестные судьбы»
        href: https://stalingrad-battle.ru/history/unknown-destinies/3640/
        otryvok: «Теперь в музее имеются справки из Центрального архива министерства обороны, из Военно-медицинского музея, сопоставив данные которых с воспоминаниями Хохолова, здесь пришли к выводу, что все рассказанное им – правда.»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-dom-pavlova-ru.mp3
  durationLabel: 1 минута 10 секунд
  lead: "Голос ведёт от ночной разведки до контратаки в ноябре: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Площадь
    - t: 16
      mark: 0:16
      title: Четверо
    - t: 26
      mark: 0:26
      title: Гарнизон
    - t: 41
      mark: 0:41
      title: Подвал
    - t: 55
      mark: 0:55
      title: Пятьдесят восемь дней
  transcript:
    - <p>Сталинград, сентябрь тысяча девятьсот сорок второго года. Немцы вышли к Волге. Гвардейцы Родимцева держат узкую полосу у реки. У площади Девятого января стоит обычный жилой дом в четыре этажа.</p>
    - "<p>Ночью командир роты посылает туда разведку: сержанта Якова Павлова и трёх бойцов. Они выбивают немцев из дома — и остаются в нём.</p>"
    - "<p>Через два дня приходят пулемётчики лейтенанта Афанасьева, бронебойщики, миномётчики. Около тридцати человек. Рядом — мельница и дом Заболотного: вместе они держат центр города.</p>"
    - <p>Дом бьют артиллерией, миномётами, бомбами. А в подвале живут мирные люди, которых не успели вывезти за Волгу. Больше пятидесяти человек — рядом с бойцами, все два месяца.</p>
    - <p>Дом так и не взяли. Двадцать пятого ноября гарнизон сам идёт в контратаку. Официальный счёт обороны — пятьдесят восемь дней. Дом назван по сержанту, а держали его все.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
