  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — В Сталинграде; 2 — Разведгруппа сержанта Якова Павлова — четыре бойца; 3 — 58; 4 — Мирные жители в подвале — больше пятидесяти человек; 5 — Звание Героя Советского Союза в 1945 году."
