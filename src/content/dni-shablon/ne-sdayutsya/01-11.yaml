      - summary: <b>Лейтенант Афанасьев командовал обороной дома, а Звезду Героя и имя дому получил сержант.</b>
        det:
          - Подкрепление привёл лейтенант Иван Афанасьев, его и назначили командиром группы; большую часть времени обороной руководил он. Но имя дому дала разведка Павлова. Героем Советского Союза стал только Павлов, в июне 1945 года. Афанасьев в своей книге называл дом «Домом солдатской славы».
        src: "Источник: «Дом Павлова без легенд и мифов», Рощупкин В., «Независимое военное обозрение», 14.02.2014 — https://nvo.ng.ru/history/2014-02-14/15_pavlov.html; «Герою Сталинграда сержанту Павлову исполнилось сто лет», «Российская газета», 17.10.2017 — https://rg.ru/2017/10/17/reg-ufo/geroiu-stalingrada-serzhantu-pavlovu-ispolnilos-sto-let.html; «С поля боя — в монастырь? Что известно о защитнике Дома Павлова», «АиФ-Волгоград», 18.10.2017 — https://vlg.aif.ru/society/persona/s_polya_boya_-_v_monastyr_chto_izvestno_o_zashchitnike_doma_pavlova; «Афанасьев Иван Филиппович», Российская государственная библиотека для слепых — https://rgbs.ru/tiflology/biblio/letopis-velikoy-otechestvennoy-voyny/ivan-filippovich-afanasev-22-dekabrya-1916-po-st-stilyu-4-yanvarya-1917-g-17-avgusta-1975-g-uchastnik-velikoj-otechestvennoj-vojny-ordenonosets-zashhitnik-doma-soldatskoj-slavy-doma-pavlova-chlen-s/ ; Пометка: что большую часть времени обороной руководил Афанасьев — по РГ"
