story:
  kicker: Сержант
  h2: Парень из новгородской деревни
  abzacy:
    - Яков Павлов родился в 1917 году в деревне Крестовая под Валдаем. В армии — с 1938 года, на фронте — с первых дней войны. <b>В Сталинграде он гвардии сержант, командир пулемётного отделения 42-го гвардейского полка.</b>
    - Дом он держал до конца ноября. 25–26 ноября гарнизон пошёл в контратаки; во время атаки на соседний «молочный дом» Павлов был ранен. После госпиталя воевал до Победы — под Гдыней, Гданьском, Штеттином — и закончил войну под Берлином младшим лейтенантом.
    - Звание Героя Советского Союза ему присвоили 27 июня 1945 года. <b>После войны он работал на заводе в Новгороде и написал воспоминания «В Сталинграде».</b>
    - Его награды, воспоминания и фотографии хранятся в Музее-панораме «Сталинградская битва». Павлов стал почётным гражданином Волгограда в 1980 году. Умер в 1981 году, похоронен в Великом Новгороде.
    - Павлов Яков Федотович // Музей-заповедник «Сталинградская битва», раздел «Биографии Второй мировой».
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Дом Павлова — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Павлов пустил ракеты в другую сторону, и немецкие лётчики отбомбились мимо дома.</b>
        det:
          - "Немцы пытались разбить дом авиацией и ракетами указывали цель лётчикам. Павлов выхватил ракетницу и стал стрелять в противоположную сторону. Одна бомба всё же попала в дом: фасадная стена со стороны площади 9 Января обвалилась. Сын Павлова в интервью «История.РФ» говорит так же: ракетницами «имитировали и передвигали направление удара»."
        src: "Источник: «Герою Сталинграда сержанту Павлову исполнилось сто лет», «Российская газета», 17.10.2017 — https://rg.ru/2017/10/17/reg-ufo/geroiu-stalingrada-serzhantu-pavlovu-ispolnilos-sto-let.html; «Сидели в осаде, но жили весело…» (интервью с Ю. Я. Павловым), «История.РФ» — https://histrf.ru/biblioteka/b/sidieli-v-osadie-no-zhili-viesielo-s-fashistami-pierierughivalis"
        stranica: Герою Сталинграда сержанту Павлову исполнилось сто лет, «Российская газета», 17.10.2017
        href: https://rg.ru/2017/10/17/reg-ufo/geroiu-stalingrada-serzhantu-pavlovu-ispolnilos-sto-let.html
        otryvok: «имитировали и передвигали направление удара»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Воронов с раненой рукой выдёргивал чеку зубами и бросал гранаты, отбиваясь от немцев.</b>
        det:
          - Старший сержант Илья Воронов, орловский колхозник, стал наводчиком единственного пулемёта взвода. 25 ноября гарнизон пошёл в атаку и занял ещё два дома. Воронова ранило, потом разрывной пулей в левую руку, а он, перевязав её, отбивался гранатами, выдёргивая чеку зубами. Врачи насчитали больше 20 пулевых и осколочных ран, ампутировали правую ногу, лечился он 15 месяцев.
        src: "Источник: «Герой обороны Дома Павлова», regionorel.ru, 02.02.2023 — https://regionorel.ru/novosti/society/geroy_oborony_doma_pavlova/"
        stranica: Герой обороны Дома Павлова, regionorel.ru, 02.02.2023
        href: https://regionorel.ru/novosti/society/geroy_oborony_doma_pavlova/
        otryvok: «В это время разрывной пулей его ранило в левую руку. Перевязав её, Воронов продолжал вести огонь по врагу, выдёргивая чеку зубами и бросая гранаты, чтобы отразить атаку фашистов.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Гарнизон на крик немцев «Дайте валенки — дадим патронов!» отвечал: «Своих патронов хватит!»</b>"
        det:
          - "Позиции стояли так близко, что гарнизон перекрикивался с немцами. Немцы мёрзли и предлагали обменять патроны на валенки. Павловцы ответили: «Нам своих патронов хватит! Мы вам покажем!»"
        src: "Источник: «Сидели в осаде, но жили весело…» (интервью с Ю. Я. Павловым), «История.РФ» — https://histrf.ru/biblioteka/b/sidieli-v-osadie-no-zhili-viesielo-s-fashistami-pierierughivalis ; Пометка: со слов Павлова в пересказе его сына Юрия Яковлевича"
        stranica: Сидели в осаде, но жили весело… (интервью с Ю. Я. Павловым), «История.РФ»
        href: https://histrf.ru/biblioteka/b/sidieli-v-osadie-no-zhili-viesielo-s-fashistami-pierierughivalis
        otryvok: «Нам своих патронов хватит! Мы вам покажем!»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Лейтенант Афанасьев начал рыть могилку младенцу в подвале — и девочка Зина ожила.</b>
        det:
          - В подвале дома родилась Зинаида Селезнёва. Кормили её смесью жжёной муки с водой, пелёнками были солдатские портянки. Девочка перестала подавать признаки жизни, и Афанасьев взял сапёрную лопатку, чтобы вырыть ей могилку. Лопата наткнулась на нательную иконку Божией Матери «Знамение», её положили к ребёнку, и Зина «ожила».
        src: "Источник: Позднякова М. «История девочки Зины. Как иконка спасла ребенка в Сталинграде», «Аргументы и факты», 01.02.2023 — https://aif.ru/society/history/ikona_portyanki_istoriya_devochki_ziny_kotoruyu_nemcy_ne_ubili_v_stalingrade; «Дочка из Дома Павлова», «Родина», 30.01.2018 — https://rodina-history.ru/2018/01/30/rodina-stalingrad-zina.html"
        stranica: Позднякова М. «История девочки Зины. Как иконка спасла ребенка в Сталинграде», «АиФ», 01.02.2023
        href: https://aif.ru/society/history/ikona_portyanki_istoriya_devochki_ziny_kotoruyu_nemcy_ne_ubili_v_stalingrade
        otryvok: «Взял сапёрную лопатку и стал рыть для меня могилку. Лопата наткнулась на что-то металлическое. Это оказалась нательная иконка Божией Матери «Знамение».»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Гарнизон держал дом 58 дней, а 25 ноября сам пошёл из него в атаку.</b>
        det:
          - Вечером 27 сентября 1942 года разведгруппа Павлова получила задание и заняла дом, через двое-трое суток пришло подкрепление. 58 дней и ночей дом били артиллерией, миномётами и авиацией и не взяли. 25 ноября, когда полк перешёл в наступление, гарнизон атаковал и занял ещё два дома; в этот день Павлов был ранен.
        src: "Источник: «Герой обороны Дома Павлова», regionorel.ru, 02.02.2023 — https://regionorel.ru/novosti/society/geroy_oborony_doma_pavlova/; «С поля боя — в монастырь? Что известно о защитнике Дома Павлова», «АиФ-Волгоград», 18.10.2017 — https://vlg.aif.ru/society/persona/s_polya_boya_-_v_monastyr_chto_izvestno_o_zashchitnike_doma_pavlova; «Дом Павлова без легенд и мифов», Рощупкин В., «Независимое военное обозрение», 14.02.2014 — https://nvo.ng.ru/history/2014-02-14/15_pavlov.html"
        stranica: Герой обороны Дома Павлова, regionorel.ru, 02.02.2023
        href: https://regionorel.ru/novosti/society/geroy_oborony_doma_pavlova/
        otryvok: «58 дней и ночей продолжалась оборона. Но бойцы не только оборонялись - 25 ноября они перешли в атаку и штурмом заняли ещё два дома.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Ослепший Афанасьев выучил Брайля и написал книгу о доме — а потом хирург вернул ему зрение.</b>
        det:
          - Из-за нескольких контузий у Афанасьева развилась слепота, и 6 октября 1951 года его уволили в запас капитаном. 12 лет он не видел родных и родившуюся дочь Тамару, работал металлоштамповщиком на предприятии для слепых. Освоил пишущую машинку и шрифт Брайля и написал книгу «Дом солдатской славы». В 1964 году профессор А. М. Водовозов сделал уникальную операцию, и зрение вернулось, хотя врачи считали слепоту необратимой.
        src: "Источник: «Афанасьев Иван Филиппович», Российская государственная библиотека для слепых — https://rgbs.ru/tiflology/biblio/letopis-velikoy-otechestvennoy-voyny/ivan-filippovich-afanasev-22-dekabrya-1916-po-st-stilyu-4-yanvarya-1917-g-17-avgusta-1975-g-uchastnik-velikoj-otechestvennoj-vojny-ordenonosets-zashhitnik-doma-soldatskoj-slavy-doma-pavlova-chlen-s/; Позднякова М. «История девочки Зины. Как иконка спасла ребенка в Сталинграде», «Аргументы и факты», 01.02.2023 — https://aif.ru/society/history/ikona_portyanki_istoriya_devochki_ziny_kotoruyu_nemcy_ne_ubili_v_stalingrade"
        stranica: Иван Филиппович Афанасьев…, РГБС, «Летопись Великой Отечественной войны»
        href: https://rgbs.ru/tiflology/biblio/letopis-velikoy-otechestvennoy-voyny/ivan-filippovich-afanasev-22-dekabrya-1916-po-st-stilyu-4-yanvarya-1917-g-17-avgusta-1975-g-uchastnik-velikoj-otechestvennoj-vojny-ordenonosets-zashhitnik-doma-soldatskoj-slavy-doma-pavlova-chlen-s/
        otryvok: «Дом солдатской славы»
        pometka: два источника
        kadr:
          src: kartinka:000544
          alt: Погрудный портрет пожилого мужчины в пиджаке с рядами орденов и медалей на фоне занавески, кадр негативной плёнки
          data_source: https://goskatalog.ru/portal/#/collections?id=26042283
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Иван Афанасьев, командир обороны дома, 10 февраля 1971 года — снимок для газеты «Молодой ленинец».
          credit: ФГБУК «Государственный историко-мемориальный музей-заповедник «Сталинградская битва», НЕГ 5192/748; Госкаталог № 25894934; фото Е. Ф. Сивакова
          width: 356
          height: 336
        utverzhden: 2026-11-03
      - summary: "<b>Сержант Павлов и трое бойцов выбили немцев из дома, и он отправил в роту записку: «Дом занят».</b>"
        det:
          - "Вечером 27 сентября 1942 года командир роты лейтенант Наумов послал сержанта Якова Павлова в разведку в четырёхэтажный дом. С ним пошли Глущенко, Александров и Черноголов. Они выбили немцев, и Павлов решил держать дом. Через санинструктора он передал записку: «Дом занят. Жду дальнейших указаний». Двое суток вчетвером они отбивали атаки, пока не пришло подкрепление."
        src: "Источник: «Герой обороны Дома Павлова», regionorel.ru, 02.02.2023 — https://regionorel.ru/novosti/society/geroy_oborony_doma_pavlova/; «С поля боя — в монастырь? Что известно о защитнике Дома Павлова», «АиФ-Волгоград», 18.10.2017 — https://vlg.aif.ru/society/persona/s_polya_boya_-_v_monastyr_chto_izvestno_o_zashchitnike_doma_pavlova"
        stranica: Герой обороны Дома Павлова, regionorel.ru, 02.02.2023
        href: https://regionorel.ru/novosti/society/geroy_oborony_doma_pavlova/
        otryvok: «Дом занят. Жду дальнейших указаний»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Павлов и трое его бойцов отбили больше 40 контратак и уничтожили до батальона.</b>
        det:
          - "В наградном листе описан штурм: Павлов с бойцом забросал гранатами комнату, где сидели восемь немцев, потом из автомата уничтожил ещё семерых в подвале. Вчетвером они поставили трофейные пулемёты и держала круговую оборону 30 суток. Лично Павлов уничтожил больше 90 немцев."
        src: 'Источник: «"Лично истребил более 90 немцев": рассекречены донесения из Сталинграда», РИА Новости, 02.02.2018 — https://ria.ru/20180202/1513851423.html ; Пометка: штурм, 40 контратак и 90 убитых — по наградному листу'
        stranica: РИА Новости, 02.02.2018 (текст наградного листа Я. Ф. Павлова)
        href: https://ria.ru/20180202/1513851423.html
        otryvok: «Обороняя дом с трех сторон, четверка храбрецов удерживала в продолжение 30 суток, отразив при этом более 40 контратак и уничтожив до батальона пехоты немцев. Лично сам Павлов истребил более 90 немцев.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Когда бомба снесла фасад, Павлов доложил командиру: «Теперь хорошо — появилась вентиляция».</b>"
        det:
          - "Снаряды и бомба обрушили стену со стороны площади 9 Января. Павлов отчитался шуткой: дом остался обычным, только с тремя стенами, «теперь хорошо — появилась вентиляция». В «Российской газете» музейщики приводят слова разведчиков: «Дом как дом, с небольшой вентиляцией. Можно жить»."
        src: "Источник: «С поля боя — в монастырь? Что известно о защитнике Дома Павлова», «АиФ-Волгоград», 18.10.2017 — https://vlg.aif.ru/society/persona/s_polya_boya_-_v_monastyr_chto_izvestno_o_zashchitnike_doma_pavlova; «Герою Сталинграда сержанту Павлову исполнилось сто лет», «Российская газета», 17.10.2017 — https://rg.ru/2017/10/17/reg-ufo/geroiu-stalingrada-serzhantu-pavlovu-ispolnilos-sto-let.html"
