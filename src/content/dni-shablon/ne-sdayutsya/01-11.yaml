    udary:
      - summary: "Около 30 бойцов держали дом так, что немцы считали: против них целый батальон."
        det:
          - На третьи сутки пришли пулемётный взвод Афанасьева (семь человек со станковым пулемётом), бронебойщики Собгайды, миномётчики Чернушенко и автоматчики — до 30 бойцов. Вместе с домом лейтенанта Заболотного и мельницей, где был командный пункт полка, дом стал опорным пунктом. Использовали канализационные люки, с чердака стрелял снайпер Анатолий Чехов. Немцы считали, что им противостоит целый батальон.
        src: "Источник: «В Узбекистане скончался последний защитник Дома Павлова в Сталинграде», РИА Новости, 17.03.2015 — https://ria.ru/20150317/1052915776.html; «Дом Павлова без легенд и мифов», Рощупкин В., «Независимое военное обозрение», 14.02.2014 — https://nvo.ng.ru/history/2014-02-14/15_pavlov.html; «С поля боя — в монастырь? Что известно о защитнике Дома Павлова», «АиФ-Волгоград», 18.10.2017 — https://vlg.aif.ru/society/persona/s_polya_boya_-_v_monastyr_chto_izvestno_o_zashchitnike_doma_pavlova; «Сидели в осаде, но жили весело…» (интервью с Ю. Я. Павловым), «История.РФ» — https://histrf.ru/biblioteka/b/sidieli-v-osadie-no-zhili-viesielo-s-fashistami-pierierughivalis"
        stranica: РИА Новости, 17.03.2015
        href: https://ria.ru/20150317/1052915776.html
        otryvok: «Дом Павлова — жилой 4-этажный дом, в котором во время Сталинградской битвы 58 дней и ночей держала оборону группа советских бойцов численностью около 30 человек. Немцы, в свою очередь, считали, что им противостоит целый батальон.»
