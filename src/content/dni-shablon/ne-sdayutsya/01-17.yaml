story:
  kicker: Среда подвига
  h2: Лётчик, которого не стало ни на земле, ни в небе
  abzacy:
    - 4 апреля 1942 года в воздушном бою в районе Демянского плацдарма (Новгородская область) самолёт Як-1 младшего лейтенанта Алексея Маресьева был подбит на высоте около 800 метров. Падая, самолёт врезался в лес с высоты около 30 метров — Маресьев остался жив, но раздробил обе стопы.
    - Идти он не мог. <b>18 суток он пробирался к своим через лес и болота ползком, без еды</b> — пока вечером не наткнулся на жителей деревни Плав в Валдайском районе.
    - "В московском госпитале (филиал госпиталя имени Бурденко) из-за развившейся гангрены 22 июля 1942 года профессор Н. Н. Теребинский провёл операцию: ампутацию обеих голеней."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Алексей Маресьев — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Маресьев позвал врачебную комиссию в клуб и танцевал на протезах — и получил «годен».</b>
        det:
          - "После ампутации он заново учился ходить, потом летать, и осенью 1942 года в дом отдыха лётчиков приехала экспертная комиссия ВВС под председательством бригврача Миролюбова. Маресьев сказал ей: «Если вы интересуетесь, как я владею протезами, то приходите сегодня в клуб, я там буду танцевать». Пришла вся комиссия; с первого раза танец не заметили, и он пошёл танцевать снова. Ответ врачей: «Считайте, все наши голоса за вами», в заключении — «годен на все истребители»; сын потом вспоминал, что повязки на ногах были «все в крови»."
        src: "Источник: «Настоящий Маресьев» (стенограмма 1943), «Родина», 27.05.2016 — https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html; «Воля к жизни», РИА Новости Крым, 20.05.2026 — https://crimea.ria.ru/20260520/volya-k-zhizni-khrestomatiynaya-sudba-alekseya-mareseva-1155981171.html; «Алексей Маресьев. Первое интервью», «Российская газета», 04.04.2022 — https://rg.ru/2022/04/04/aleksej-maresev-pervoe-interviu.html; «Сильный духом», «Российская газета», 08.04.2022 — https://rg.ru/2022/04/08/silnyj-duhom-80-let-nazad-sovershil-svoj-podvig-letchik-aleksej-maresev.html; «Поединок с историей», АиФ — https://aif.ru/society/history/poedinok_s_istoriey_na_valdae_chtyat_pravdu_i_pamyat_ob_aleksee_mareseve"
        stranica: «Настоящий Маресьев» (стенограмма 1943), «Родина», 27.05.2016
        href: https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html
        otryvok: «Если вы интересуетесь, как я владею протезами, то приходите сегодня в клуб, я там буду танцевать»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-17-goskatalog-6899878.jpg
          alt: Мужчина в нательной рубахе сидит на кровати и застёгивает ремни протезов на обеих ногах, на протезах ботинки
          data_source: https://goskatalog.ru/portal/#/collections?id=6899878
          license: "автор указан — И. Акуленко, годы жизни не установлены; TODO: проверить срок охраны"
          podpis: Маресьев А.П. за креплением протезов. 1948. Фото И. Акуленко.
          credit: Государственный центральный музей современной истории России (ГЦМСИР), инв. А83300, рег. № Госкаталога 6676338 (чёрно-белый негатив)
          width: 445
          height: 667
        utverzhden: 2026-11-03
      - summary: <b>Сбитый Маресьев упал в 150 м от нашей дороги, но 18 суток полз в другую сторону.</b>
        det:
          - "Поисковый отряд «Находка» (Александр Морзунов) нашёл в архиве Минобороны акт: «Як-1 N4649 сев. д. Рабежа 4 км. отм. 238,2». Самолёт упал в нашем тылу, рядом с дорогой к штабу 245-й стрелковой дивизии; по «Родине», пойди лётчик на запад, «уже через час пил бы чай с бубликами в штабе». Контуженный, с раздробленными стопами, он ушёл на восток, через Лютицкое болото, и 18 суток полз без еды — а по прямой было всего 6–10 км. Самолёт искали до 70 км от этой точки, и 30.05.1942 машину списали: «место падения самолёта не обнаружено»."
        src: "Источник: «Поисковики нашли точное место падения самолёта Алексея Маресьева», «Родина», № 5, 2017 (17.05.2017) — https://rodina-history.ru/2017/05/17/rodina-poiskoviki-mesto-padeniia-samoleta-mareseva.html; «Архивные документы помогли установить место падения самолёта Маресьева», «Родина», № 4, 2017 — https://rodina-history.ru/2017/03/27/rodina-samolet-mareseva.html; интервью А. Морзунова, История.РФ — https://histrf.ru/biblioteka/b/kak-na-samom-dielie-vyzhil-mariesiev; «Российская газета», 04.04.2022 — https://rg.ru/2022/04/04/aleksej-maresev-pervoe-interviu.html; «Российская газета», 08.04.2022 — https://rg.ru/2022/04/08/silnyj-duhom-80-let-nazad-sovershil-svoj-podvig-letchik-aleksej-maresev.html; АиФ, «Поединок с историей» — https://aif.ru/society/history/poedinok_s_istoriey_na_valdae_chtyat_pravdu_i_pamyat_ob_aleksee_mareseve"
        stranica: «Поисковики нашли точное место падения самолёта Алексея Маресьева», «Родина», № 5, 2017 (17.05.2017)
        href: https://histrf.ru/biblioteka/b/kak-na-samom-dielie-vyzhil-mariesiev
        otryvok: «Як-1 N4649 сев. д. Рабежа 4 км. отм. 238,2»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Комэск Числов взял безногого Маресьева ведомым, дав расписку, что пойдёт под трибунал.</b>
        det:
          - "Летом 1943 года командир 63-го гвардейского полка подполковник Иванов не решался выпускать в бой лётчика без ног и сказал комэску Александру Числову: «Хочешь тут с инвалидом возиться? Пиши расписку. Если с ним что-то случится, пойдёшь под трибунал!» — «И дядя Саша написал» (рассказ сына). Числов взял его ведомым, потом сам стал ходить у него в паре и, по словам сына, «еле поспевал». Маресьев называл Числова своим «крёстным»; Звёзды Героя они получили одним указом 24.08.1943."
        src: "Источник: «Воля к жизни», РИА Новости Крым, 20.05.2026 — https://crimea.ria.ru/20260520/volya-k-zhizni-khrestomatiynaya-sudba-alekseya-mareseva-1155981171.html; С. Варшавчик, РИА Новости, 20.05.2016 — https://ria.ru/20160520/1436882068.html; «Неизвестный Маресьев», МК, 10.05.2016 — https://www.mk.ru/social/2016/05/10/neizvestnyy-maresev-geroy-bez-nog-nikuda-ne-denetsya.html"
        stranica: «Воля к жизни», РИА Новости Крым, 20.05.2026
        href: https://crimea.ria.ru/20260520/volya-k-zhizni-khrestomatiynaya-sudba-alekseya-mareseva-1155981171.html
        otryvok: «Хочешь тут с инвалидом возиться? Пиши расписку. Если с ним что-то случится, пойдёшь под трибунал!»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Маресьев выдержал ампутацию на глазах у хирурга и спросил: «Это вся операция?»</b>"
        det:
          - "В московском госпитале гангренозные ткани уже «сами отходили», и профессор Н. Н. Теребинский «взял стерильные ножницы и просто на моих глазах отрезал ноги этими ножницами… Я спрашиваю: „Товарищ профессор, это вся операция?“». На второй операции 22 июля 1942 года, когда ему ампутировали обе голени, не подействовали ни спинномозговой, ни местный наркоз; под эфирной маской он кричал: «Снимите, дайте мне хоть немножко пожить!» Сотрудница Камышинского музея эпизод с ножницами «подтвердить не может», но это слова самого Маресьева в стенограмме 1943 года."
        src: "Источник: стенограмма 1943, «Родина», 27.05.2016 — https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html; «Российская газета», 04.04.2022 — https://rg.ru/2022/04/04/aleksej-maresev-pervoe-interviu.html; «Российская газета», 08.04.2022 — https://rg.ru/2022/04/08/silnyj-duhom-80-let-nazad-sovershil-svoj-podvig-letchik-aleksej-maresev.html; АиФ, «Поединок с историей» — https://aif.ru/society/history/poedinok_s_istoriey_na_valdae_chtyat_pravdu_i_pamyat_ob_aleksee_mareseve"
        stranica: стенограмма 1943, «Родина», 27.05.2016
        href: https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html
        otryvok: "«взял стерильные ножницы и просто на моих глазах отрезал ноги этими ножницами… Я спрашиваю: „Товарищ профессор, это вся операция?“»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Маресьев сбил два «Фокке-Вульфа» над Курской дугой и спас двух своих товарищей.</b>
        det:
          - "20 июля 1943 года в бою с превосходящими силами противника Маресьев спас двух советских лётчиков, сбив два FW-190, прикрывавших пикировщики Ju-87; всего наши лётчики в этом бою сбили 13 вражеских самолётов. После боя его назначили заместителем комэска, а в представлении к Герою командир полка написал: «Не жалея жизни и крови, сражается против врагов и, несмотря на серьёзный физический недостаток, добивается в воздушных боях отличных успехов»."
        src: "Источник: С. Варшавчик, РИА Новости, 20.05.2016 — https://ria.ru/20160520/1436882068.html; «Жизнь настоящего человека», АиФ — https://aif.ru/society/history/zhizn_nastoyashchego_cheloveka_chem_aleksey_maresev_otlichalsya_ot_geroya_knigi"
        stranica: С. Варшавчик, РИА Новости, 20.05.2016
        href: https://ria.ru/20160520/1436882068.html
        otryvok: «Не жалея жизни и крови, сражается против врагов и, несмотря на серьёзный физический недостаток, добивается в воздушных боях отличных успехов»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Маресьев ответил кадровику «Ноги у меня есть, но деревянные» и дошёл до генерала.</b>
        det:
          - "Полковник Вальчугин из управления кадров ВВС дочитал заключение до слов «не годен» и бросил: «У вас ног нет, а пришли сюда очки втирать». Маресьев: «Ноги у меня, товарищ полковник, есть, но ноги деревянные… Я дойду до маршала авиации». Начальник отдела кадров генерал-майор Орехов сначала тоже отказал («Вы — средний командир и должны слушать то, что вам говорит генерал»), но в итоге отправил его на пробу в лётную школу в Ибресях. «Единственный человек — этот генерал, который мне помог»."
        src: "Источник: стенограмма 1943, «Родина», 27.05.2016 — https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html"
        stranica: стенограмма 1943, «Родина», 27.05.2016
        href: https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html
        otryvok: «У вас ног нет, а пришли сюда очки втирать»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Маресьев запрыгнул на стол перед врачами, чтобы показать, что сломает лишь протезы.</b>
        det:
          - "Врачи Собейников и Миролюбов не пускали его на истребитель: при прыжке с парашютом «ты поломаешь себе ноги». Маресьев: «Я не поломаю себе ноги, а поломаю протезы». Когда врачи заспорили, «я влез на стол, прыгнул и сказал: „Вот, так и получится!“». Миролюбов сдался и написал: «разрешаем попробовать на самолёте УТИ-4, Як-7»."
        src: "Источник: стенограмма 1943, «Родина», 27.05.2016 — https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html"
        stranica: стенограмма 1943, «Родина», 27.05.2016
        href: https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html
        otryvok: «ты поломаешь себе ноги»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Комэск Дехтяренко с утра до вечера искал Маресьева по госпиталям и увёз вопреки врачу.</b>
        det:
          - "30 апреля 1942 года в Валдае в палату вошёл комэск Андрей Дехтяренко — он вылетел в 7 утра, а площадка «бывает километра за 3–4». Врач говорил, что больного отправят в глубокий тыл; Дехтяренко: «Это мой лётчик, я его заберу!» В самолёте Маресьев терял сознание; «Я тебя везу, а ты, наверное, умрёшь». — «Давай, жми! Живого или мёртвого, уж взялся, так вези!» 11 июля 1942 года Дехтяренко не вернулся с боевого задания."
        src: "Источник: стенограмма 1943, «Родина», 27.05.2016 — https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html"
        stranica: стенограмма 1943, «Родина», 27.05.2016
        href: https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html
        otryvok: «бывает километра за 3–4»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Маресьев при Полевом опустил культи в ледяную воду — так началась «Повесть о настоящем человеке».</b>
        det:
          - "Летом 1943 года корреспондент «Правды» Борис Полевой ночевал в землянке 63-го гвардейского полка и не знал, что лётчик безногий. После ужина он услышал грохот: Маресьев бросил протезы на пол и опустил кровоточившие культи в ведро с ледяной водой, глуша боль. Тогда Полевой «фактически заставил» его рассказать всё и за ночь исписал две толстые тетради. Так Маресьев стал прототипом героя «Повести о настоящем человеке» (1946), и книга сделала его имя всенародно известным."
        src: "Источник: «Летал и танцевал без ног», «Комсомольская правда», 20.05.2026 — https://www.kp.ru/daily/277783.4/5251309/; «Российская газета», 04.04.2022 — https://rg.ru/2022/04/04/aleksej-maresev-pervoe-interviu.html; «Российская газета», 08.04.2022 — https://rg.ru/2022/04/08/silnyj-duhom-80-let-nazad-sovershil-svoj-podvig-letchik-aleksej-maresev.html; АиФ, «Поединок с историей» — https://aif.ru/society/history/poedinok_s_istoriey_na_valdae_chtyat_pravdu_i_pamyat_ob_aleksee_mareseve"
        stranica: «Летал и танцевал без ног», «Комсомольская правда», 20.05.2026
        href: https://www.kp.ru/daily/277783.4/5251309/
        otryvok: «Бросил протезы на доски пола и опустил кровоточившие культи в ведро с ледяной водой. Заглушал боль. И тогда Полевой фактически заставил Маресьева рассказать ему всю свою эпопею. Писатель исписал за ночь две толстые тетради.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Маресьев в бреду расстрелял две обоймы по мотору разбитого «Яка», чтобы его не взял враг.</b>
        det:
          - После падения с высоты около 30 м он 40 минут лежал без памяти. «Я очень хотел испортить мотор, вынимаю пистолет и начинаю стрелять по мотору… выстрелил одну обойму, затем другую». Галлюцинации — аэродром, «дом отдыха», девушка с вёдрами — длились «суток 10–11». Когда его нашёл крестьянин, в пистолете оставалось два патрона.
        src: "Источник: стенограмма 1943, «Родина», 27.05.2016 — https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html"
        stranica: стенограмма 1943, «Родина», 27.05.2016
        href: https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html
        otryvok: «Я очень хотел испортить мотор, вынимаю пистолет и начинаю стрелять по мотору… выстрелил одну обойму, затем другую»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Маресьев вернулся в полк на протезах и сбил ещё семь вражеских самолётов.</b>
        det:
          - "В июне 1943 года он вернулся в 63-й гвардейский истребительный полк; первая подтверждённая победа на протезах — 19 июля 1943 года, сбитый Ju-87. 24 августа 1943 года — Герой Советского Союза. За войну 86 вылетов и 10 сбитых: 3 до ранения и 7 после."
        src: "Источник: «Российская газета», 04.04.2022 — https://rg.ru/2022/04/04/aleksej-maresev-pervoe-interviu.html; «Российская газета», 08.04.2022 — https://rg.ru/2022/04/08/silnyj-duhom-80-let-nazad-sovershil-svoj-podvig-letchik-aleksej-maresev.html; АиФ, «Поединок с историей» — https://aif.ru/society/history/poedinok_s_istoriey_na_valdae_chtyat_pravdu_i_pamyat_ob_aleksee_mareseve; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=353"
        stranica: «Российская газета», 04.04.2022
        href: https://rg.ru/2022/04/04/aleksej-maresev-pervoe-interviu.html
        otryvok: «Всего за время войны Маресьев совершил восемьдесят шесть боевых вылетов, сбил десять самолетов врага, из которых семь – после ранения.»
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-17-goskatalog-6004591.jpg
          alt: Поясной портрет лётчика в фуражке и кителе с погонами, на груди Золотая Звезда, через руку перекинут кожаный реглан
          data_source: https://goskatalog.ru/portal/#/collections?id=6004591
          license: автор не указан, 1943 — общественное достояние
          podpis: Маресьев А.П. — Герой Советского Союза, лётчик-истребитель. 1943.
          credit: Государственный центральный музей современной истории России (ГЦМСИР), рег. № Госкаталога 5828748, инв. № не указан
          width: 618
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Маресьев прошёл на протезах строевым шагом с факелом Вечного огня к Брежневу.</b>
        det:
          - "При первом зажжении Вечного огня у Могилы Неизвестного Солдата в мае 1967 года Маресьев принял факел с бронетранспортёра и, как вспоминал сын, «пошёл к Леониду Ильичу строевым шагом, держа факел перед собой, как Знамя. Никто его об этом не просил». На вопрос сына, зачем, ответил: не для генсека старался, «а для того солдата. Неизвестного»."
        src: "Источник: «Родина», № 5, 2017 — https://rodina-history.ru/2017/05/17/rodina-poiskoviki-mesto-padeniia-samoleta-mareseva.html; год 1967 — АиФ — https://aif.ru/society/history/zhizn_nastoyashchego_cheloveka_chem_aleksey_maresev_otlichalsya_ot_geroya_knigi"
        stranica: «Родина», № 5, 2017
        href: https://rodina-history.ru/2017/05/17/rodina-poiskoviki-mesto-padeniia-samoleta-mareseva.html
        otryvok: «пошёл к Леониду Ильичу строевым шагом, держа факел перед собой, как Знамя. Никто его об этом не просил»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Маресьев пристыдил министров и добился для инвалидов войны машин вместо мотоколясок.</b>
        det:
          - "Работая в Комитете ветеранов войны, Маресьев узнал, что в Серпухове собираются выпускать для инвалидов мотоколяски, и возмутился: неужели это всё, что заслужили люди? После этого ветеранам стали выдавать бесплатные «Запорожцы». В Комитете ветеранов он проработал 45 лет (с 1956 года, с 1983-го — первый зампред) и ничего не просил для себя."
        src: "Источник: «„Запорожцы“ ветеранам ВОВ начали выдавать по просьбе Алексея Маресьева», «Российская газета», 18.05.2016 — https://rg.ru/2016/05/18/zaporozhcy-veteranam-vov-nachali-vydavat-po-prosbe-alekseia-mareseva.html; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=353; РИА Новости Крым, 20.05.2026 — https://crimea.ria.ru/20260520/volya-k-zhizni-khrestomatiynaya-sudba-alekseya-mareseva-1155981171.html"
        stranica: «„Запорожцы“ ветеранам ВОВ начали выдавать по просьбе Алексея Маресьева», «Российская газета», 18.05.2016
        href: https://rg.ru/2016/05/18/zaporozhcy-veteranam-vov-nachali-vydavat-po-prosbe-alekseia-mareseva.html
        otryvok: '«Тогда в Серпухове хотели выпускать мотоколяски для инвалидов. Как вспоминает его сын, Маресьев возмутился: неужели это все, что заслужили люди? Тогда и стали выдавать ветеранам бесплатные "Запорожцы".»'
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-17-goskatalog-9691804.jpg
          alt: За накрытым столом сидит Маресьев в тёмном костюме, вокруг стоят подростки, по краям сидят женщины
          data_source: https://goskatalog.ru/portal/#/collections?id=9691804
          license: "автор не указан, 1968 — для анонимного снимка срок охраны 70 лет после обнародования; TODO: проверить права"
          podpis: Встреча в Советском комитете ветеранов войны. 2-й справа за столом — А. Маресьев, 1-я слева — Н. Троян. Москва, август 1968.
          credit: Центральный музей Великой Отечественной войны 1941–1945 гг. (Музей Победы), рег. № Госкаталога 9572298, инв. № не указан
          width: 800
          height: 521
        utverzhden: 2026-11-03
      - summary: <b>Маресьев умер за час до вечера в свою честь, и истребитель на сцене утонул в цветах.</b>
        det:
          - "18 мая 2001 года около 17 часов, собираясь в Театр Российской армии на вечер к своему 85-летию, он упал — обширный инфаркт. В зале ждали около 200 человек, в фойе давала интервью Ольга Сергеева, которая в войну нашла замерзавшего лётчика в лесу и спасла его. Ведущий Олег Марусев вышел с чёрными розами: «Алексей Петрович скончался» — и положил их на крыло выставленного на сцене истребителя с бортовым номером 85; через несколько минут истребитель «буквально утонул в розах, гвоздиках и тюльпанах»."
        src: "Источник: С. Дюпин, Ю. Сенаторов, «Торжественный вечер стал поминальным», «Коммерсантъ», 19.05.2001 — https://www.kommersant.ru/doc/267213; «за час» — РИА Новости Крым, 20.05.2026 — https://crimea.ria.ru/20260520/volya-k-zhizni-khrestomatiynaya-sudba-alekseya-mareseva-1155981171.html"
        stranica: С. Дюпин, Ю. Сенаторов, «Торжественный вечер стал поминальным», «Коммерсантъ», 19.05.2001
        href: https://www.kommersant.ru/doc/267213
        otryvok: «Алексей Петрович скончался»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Ещё до своего падения Маресьев сбил три немецких транспортника, снабжавших окружённых под Демянском.</b>
        det:
          - "В районе Демянска Красная армия окружила 2-й корпус 16-й армии вермахта, и попавших в котёл немцев снабжали по воздуху десятки транспортных самолётов. Здесь Маресьев одержал первую победу: 1 апреля 1942 года сбил транспортный Ju-52, а 4 апреля — ещё два. Сам он в стенограмме 1943 года говорил: «Мы их сбили за 8 суток три штуки». Когда его Як-1 подбили над лесом, Маресьев успел увести падающую машину за линию фронта."
        src: "Источник: «Российская газета», 08.04.2022 — https://rg.ru/2022/04/08/silnyj-duhom-80-let-nazad-sovershil-svoj-podvig-letchik-aleksej-maresev.html; стенограмма 1943, «Родина», 27.05.2016 — https://rodina-history.ru/2016/05/27/rodina-nastoiashchij-maresev.html"
        stranica: «Российская газета», 08.04.2022
        href: https://rg.ru/2022/04/08/silnyj-duhom-80-let-nazad-sovershil-svoj-podvig-letchik-aleksej-maresev.html
        otryvok: «Мы их сбили за 8 суток три штуки»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-maresyev-ru.mp3
  durationLabel: 1 минута 17 секунд
  lead: "Голос ведёт от падения в лес под Новгородом через 18 суток ползком, ампутацию обеих ног и протезы — к первой победе в небе 1943 года: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Падение
    - t: 16
      mark: 0:16
      title: Госпиталь
    - t: 27
      mark: 0:27
      title: Снова в небе
    - t: 40
      mark: 0:40
      title: Победа на протезах
    - t: 57
      mark: 0:57
      title: Курская дуга
  transcript:
    - <p>Четвёртого апреля тысяча девятьсот сорок второго года в воздушном бою у Демянского плацдарма самолёт младшего лейтенанта Алексея Маресьева подбивают, и он падает в лес. Обе стопы раздроблены. Идти он не может — и восемнадцать суток ползёт к своим через лес и болота без еды.</p>
    - "<p>В московском госпитале развивается гангрена. Двадцать второго июля тысяча девятьсот сорок второго года профессор Теребинский проводит операцию: ампутацию обеих голеней.</p>"
    - "<p>На протезах Маресьев заново учится ходить, потом летать. Врачебная комиссия даёт заключение: годен на все истребители. В июне тысяча девятьсот сорок третьего года он возвращается в свой полк.</p>"
    - <p>Девятнадцатого июля тысяча девятьсот сорок третьего года — первая подтверждённая победа на протезах. За войну — десять сбитых самолётов, три до ранения и семь после. Двадцать четвёртого августа тысяча девятьсот сорок третьего года ему присваивают звание Героя Советского Союза.</p>
    - "<p>Двадцатого июля тысяча девятьсот сорок третьего года, над Курской дугой, Маресьев в бою с превосходящими силами врага сбивает два «Фокке-Вульфа» и спасает двух советских лётчиков. В этом бою наши сбивают тринадцать вражеских самолётов. Командир полка пишет в представлении к Герою: «Не жалея жизни и крови, сражается против врагов».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
