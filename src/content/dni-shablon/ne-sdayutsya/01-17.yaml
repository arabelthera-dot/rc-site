quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — 4 апреля 1942 года у Демянского плацдарма; 2 — 18 суток; 3 — Ампутация обеих голеней из-за гангрены; 4 — 19 июля 1943 года; 5 — 10 самолётов — 3 до ранения и 7 после."
  ball: 10
  voprosy:
    - q: Где и когда Маресьева сбили?
      o:
        - 4 апреля 1942 года у Демянского плацдарма
        - 22 июня 1941 года под Брестом
        - Летом 1943 года под Курском
        - В 1944 году под Ленинградом
      a: 0
      e: 4 апреля 1942 года в воздушном бою в районе Демянского плацдарма, Новгородская область.
    - q: Сколько суток он добирался до своих после падения?
      o:
        - 3 суток
        - 18 суток
        - 30 суток
        - 6 суток
      a: 1
      e: "18 суток, ползком через лес и болота без еды — идти он не мог: стопы были раздроблены."
    - q: Что произошло 22 июля 1942 года?
      o:
        - Маресьев вернулся в полк
        - Ампутация обеих голеней из-за гангрены
        - Первая победа на протезах
        - Присвоение звания Героя Советского Союза
      a: 1
      e: Профессор Н. Н. Теребинский провёл операцию по ампутации обеих голеней.
    - q: Когда Маресьев одержал первую подтверждённую победу на протезах?
      o:
        - 6 июля 1943 года
        - 19 июля 1943 года
        - 24 августа 1943 года
        - 9 мая 1945 года
      a: 1
      e: 19 июля 1943 года — сбит немецкий Ju-87; дата подтверждена двумя независимыми источниками.
    - q: Сколько всего самолётов Маресьев сбил за войну?
      o:
        - 7 самолётов
        - 10 самолётов — 3 до ранения и 7 после
        - 15 самолётов
        - 6 самолётов, все на протезах
      a: 1
      e: "10 самолётов за 86 боевых вылетов: 3 до ранения и 7 после возвращения в строй на протезах."
