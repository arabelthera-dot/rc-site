    title: Постель
  - t: 11
    mark: '0:11'
    title: Трафарет
  - t: 26
    mark: '0:26'
    title: Отказ журнала
  - t: 39
    mark: '0:39'
    title: Война
  - t: 51
    mark: '0:51'
    title: Тираж
  transcript:
  - 'В 1930 году Николай Островский лежал прикованный к постели: паралич и почти полная слепота. Именно тогда он начал писать роман «Как закалялась сталь».'
  - Сначала он писал от руки. Когда глаза перестали видеть, ассистентка прорезала в картонной папке полосы размером в строку, и он писал по трафарету. Потом отказала рука, и он стал диктовать. В рукописи 19 разных почерков.
  - 'Журнал «Молодая гвардия» ответил: «выведенные типы нереальны». Харьковская цензура назвала роман антисоветским и потребовала изъять. Но первую часть читатели раскупили мгновенно.'
  - В 1942 году в блокадном Ленинграде роман напечатали вручную, и десять тысяч книг раскупили за два часа. Под Сталинградом одну книгу на весь полк разорвали на листы и читали по очереди.
  - Островский умер 22 декабря 1936 года. К 1991 году роман вышел общим тиражом 53 миллиона. В Китае его тираж больше 15 миллионов, и Павка Корчагин там до сих пор любимый герой.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
