  audioSrc: audio-guide-ostrovskij-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от постели через трафарет и девятнадцать почерков — к блокадному Ленинграду и миллионным тиражам: пять остановок.'
  stops:
