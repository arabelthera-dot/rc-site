story:
  kicker: Подвиг
  h2: Николай Островский
  abzacy:
  - 'Николай Островский подростком ушёл на фронт Гражданской войны и был ранен. Потом работал на стройке узкоколейки по колено в ледяной воде и тяжело заболел. Болезнь приковала его к постели: он был разбит параличом и почти полностью ослеп.'
  - 'Ровно тогда, в 1930 году, он начал писать роман «Как закалялась сталь». Сначала писал от руки. Когда глаза перестали видеть, ассистентка прорезала в картонной папке полосы размером в строку, и он писал по этому трафарету. Потом отказала рука, и он стал диктовать. Рукопись записана 19 разными почерками. Журнал «Молодая гвардия» ответил разгромной рецензией: «выведенные типы нереальны».'
  - Первую часть читатели раскупили мгновенно. В 1935 году его наградили орденом Ленина, в 1936-м армия взяла его на учёт бригадным комиссаром. 22 декабря 1936 года он умер. Его книгу потом читали в блокадном Ленинграде, под Сталинградом и в партизанских отрядах, а к 1991 году её общий тираж составил 53 миллиона.
