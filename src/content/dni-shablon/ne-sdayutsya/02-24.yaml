data_uslovnaya: 24 февраля — день музея; событие — работа Николая Островского над романом «Как закалялась сталь» с 1930 года и его последние годы до 22 декабря 1936 года.
chto_sluchilos: 'Парализованный и почти ослепший Николай Островский в 1930 году начал писать роман «Как закалялась сталь»: сначала по картонному трафарету, потом диктуя. Журнал отверг рукопись, цензура требовала изъять книгу, но роман вышел общим тиражом 53 миллиона и шёл с бойцами по всей войне.'
