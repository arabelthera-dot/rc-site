quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 19; 2 — за два часа; 3 — губами; 4 — «выведенные типы нереальны»; 5 — бригадного комиссара.'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: сколько разных почерков в рукописи романа «Как закалялась сталь»?'
    o:
    - '3'
    - '7'
    - '19'
    - '40'
    a: 2
    e: Островский не видел и не мог держать перо, он диктовал. Фотокопии 19 почерков хранятся в РГАЛИ.
  - q: За сколько раскупили 10 000 экземпляров романа, напечатанного вручную в блокадном Ленинграде?
    o:
    - За два часа
    - За неделю
    - За месяц
    - За год
    a: 0
    e: Это было в 1942 году, в голодном и холодном городе.
  - q: Как санитарка без рук и ног перелистывала «Как закалялась сталь»?
    o:
    - Ей читали вслух
    - Губами
    - Плечом
    - Никак, только слушала радио
    a: 1
    e: Девушка-солдат сама приспособилась переворачивать страницы губами.
  - q: Что ответил журнал «Молодая гвардия» на рукопись романа?
    o:
    - «Печатаем немедленно»
    - «Слишком длинно»
    - «Выведенные типы нереальны»
    - «Пришлите вторую часть»
    a: 2
    e: Это была разгромная рецензия. Потом роман вышел общим тиражом 53 миллиона.
  - q: Какое звание дала армия в 1936 году слепому и неподвижному писателю?
    o:
    - Рядового
    - Лейтенанта
    - Бригадного комиссара
    - Маршала
    a: 2
    e: В январе 1936 года его взяли на воинский учёт как политработника со званием бригадного комиссара.
