  h2: Николай Островский
  udary:
  - id: ns-0224-komissar
    summary: Слепого и неподвижного Островского армия взяла на учёт бригадным комиссаром
    det:
    - В январе 1936 года его взяли на воинский учёт как политработника. Ему сшили форму, и в ней он с тех пор фотографировался.
    src: 'Источник: Основные даты жизни и работы Н. А. Островского (по книге М. В. Ширяева, В. И. Тимофеева «Величие подвига Николая Островского») — Кольчугинская межпоселенческая библиотека — https://www.kmslib.ru/sites/default/files/kcfinder/files/virtualnye-vystavki/osnovnye-daty-zhizni-i-raboty.pdf; В. Малышев. Тайны романа «Как закалялась сталь» — «Столетие», 29.09.2020 — http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm'
    stranica: документ
    href: https://www.kmslib.ru/sites/default/files/kcfinder/files/virtualnye-vystavki/osnovnye-daty-zhizni-i-raboty.pdf
    otryvok: «…1936 г., январь. Взят на воинский учет как политработник с присвоением звания бригадного комиссара…»
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: false
    n: 1
  - id: ns-0224-sanitarka
    summary: Санитарка без рук и ног листала «Как закалялась сталь» губами
    det:
    - Девушка-солдат потеряла на войне руки и ноги. Книгу Островского она читала сама, переворачивая страницы губами.
    src: 'Источник: Т. Г. Доступова. Вторая жизнь Павла Корчагина — https://coollib.com/b/314750/read'
    stranica: книга
    href: https://coollib.com/b/314750/read
    otryvok: «…девушка-солдат не без труда, но все же приспособилась переворачивать страницы книги… губами…»
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n3
    dlya_voprosa: false
    n: 2
  - id: ns-0224-moryak
    summary: Моряк с оторванной рукой зубами сбросил горящие шашки с бомб, а в бушлате был роман
    det:
    - 25 марта 1943 года катер атаковали 30 самолётов. Старшина зубами перегрыз концы горящих шашек и сбросил их за борт. В кармане его бушлата нашли залитую кровью книгу «Как закалялась сталь».
    src: 'Источник: Т. Г. Доступова. Вторая жизнь Павла Корчагина — https://coollib.com/b/314750/read'
    stranica: книга
    href: https://coollib.com/b/314750/read
    otryvok: «…старшина зубами перегрызает найтовые концы шашек, бросает их за борт… в кармане бушлата нашли залитую кровью книгу «Как закалялась сталь»…»
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n3
    dlya_voprosa: false
    n: 3
  - id: ns-0224-pereklichka
    summary: Партизаны записали Островского в отряд, и на перекличке за него отвечали
    det:
    - 'Командир вызывал: «Правофланговый Николай Островский». Партизан Афанасий Козлов отвечал за него: «Погиб на боевом посту!»'
    src: 'Источник: Т. Г. Доступова. Вторая жизнь Павла Корчагина — https://coollib.com/b/314750/read'
    stranica: книга
    href: https://coollib.com/b/314750/read
    otryvok: '«…когда командир вызывал: «Правофланговый Николай Островский», Афанасий Козлов громко отвечал: «Погиб на боевом посту!»…»'
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n3
    dlya_voprosa: false
    n: 4
  - id: ns-0224-zhid
    summary: 'Андре Жид, ругавший СССР, написал об Островском в своей книге: «Это святой»'
    det:
    - 'Французский писатель приехал в СССР в 1936 году и вернулся с резкой книгой о стране. Об Островском он написал в ней: «Я не могу говорить об Островском, не испытывая чувства глубочайшего уважения». И добавил: «Религия не создала более прекрасного лица».'
    src: 'Источник: А. Жид. Возвращение из СССР (1936) — https://kprf.ru/library/classics/memo/5703.html'
    stranica: книга
    href: https://kprf.ru/library/classics/memo/5703.html
    otryvok: '«Я не могу говорить об Островском, не испытывая чувства глубочайшего уважения. Если бы мы не были в СССР, я бы сказал: "Это святой". Религия не создала более прекрасного лица.»'
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n4
    dlya_voprosa: false
    n: 5
  - id: ns-0224-blokada
    summary: В блокадном Ленинграде роман напечатали вручную, и 10 000 книг раскупили за два часа
    det:
    - Это было в 1942 году, в голодном и холодном осаждённом городе.
    src: 'Источник: В. Малышев. Тайны романа «Как закалялась сталь» — «Столетие», 29.09.2020 — http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm; Новосибирская государственная областная научная библиотека: о романе «Как закалялась сталь» — https://ngounb.ru/?p=22453'
    stranica: статья
    href: http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm
    otryvok: «В осажденном голодном и холодном Ленинграде в 1942 года книга Островского была напечатана вручную, и ее десятитысячный тираж был распродан за два часа.»
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n2
    dlya_voprosa: false
    n: 6
  - id: ns-0224-stalingrad
    summary: Под Сталинградом одну книгу на весь полк разорвали на листы и читали по очереди
    det:
    - 'Писатель Борис Полевой ночью застал бойцов передового батальона у костра: они слушали «Как закалялась сталь». Листы передавали друг другу в редкие часы отдыха.'
    src: 'Источник: В. Малышев. Тайны романа «Как закалялась сталь» — «Столетие», 29.09.2020 — http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm'
    stranica: статья
    href: http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm
    otryvok: «…бойцы пожаловались, что книга эта одна на весь полк. Для удобства чтения её разорвали на несколько частей и в редкие часы боевого отдыха читали, передавая друг другу листы по мере прочтения».
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n2
    dlya_voprosa: false
    n: 7
  - id: ns-0224-radio
    summary: 'В 1935-м он сказал по радио: «Когда грянет гром… рубайте за Павку Корчагина»'
    det:
    - Осенью 1935 года комсомол Украины устроил радиоперекличку городов Сочи — Киев — Шепетовка. Островский говорил из Сочи о будущей войне.
    src: 'Источник: Т. Г. Доступова. Вторая жизнь Павла Корчагина — https://coollib.com/b/314750/read'
    stranica: книга
    href: https://coollib.com/b/314750/read
    otryvok: «…Осенью 1935 года комсомол Украины попросил Николая Островского выступить на радиоперекличке городов Сочи — Киев — Шепетовка… «Когда грянет гром, — сказал писатель, — и настанет кровопролитная ночь…»»
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n3
    dlya_voprosa: false
    n: 8
  - id: ns-0224-cenzura
    summary: Харьковская цензура назвала роман антисоветским и потребовала изъять
    det:
    - Читатели раскупили первую часть мгновенно, а критики молчали. Слава пришла в 1935 году, после очерка Михаила Кольцова в «Правде».
    src: 'Источник: В. Малышев. Тайны романа «Как закалялась сталь» — «Столетие», 29.09.2020 — http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm'
    stranica: статья
    href: http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm
    otryvok: «…харьковский цензурный Обллит вообще назвал роман «Как закалялась сталь» антисоветским и потребовал его «немедленно изъять».»
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n2
    dlya_voprosa: false
    n: 9
  - id: ns-0224-tirazh
    summary: 'Журнал отказал: «типы нереальны». Потом роман вышел тиражом больше 53 миллионов'
    det:
    - Рукопись отправили в журнал «Молодая гвардия» в 1932 году. К 1991 году роман переиздали 773 раза и перевели больше чем на сто языков.
    src: 'Источник: В. Малышев. Тайны романа «Как закалялась сталь» — «Столетие», 29.09.2020 — http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm; Стальной характер автора романа «Как закалялась сталь» Николая Островского — журнал «Родина» — https://rodina-history.ru/2024/09/29/stalnoj-harakter-avtora-romana-kak-zakalialas-stal-nikolaia-ostrovskogo.html'
    stranica: статья
    href: http://www.stoletie.ru/kultura/tajny_romana_kak_zakalalas_stal_944.htm
    otryvok: «…Островский получил в ответ разгромную рецензию, будто в его книге «выведенные типы нереальны»… к 1991 году ее переиздавали 773 раза, общий тираж составил фантастические 53 миллиона.»
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n2
    dlya_voprosa: false
    n: 10
