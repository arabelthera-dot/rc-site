story:
  kicker: Подвиг
  h2: Ольга Берггольц
  abzacy:
  - 'До войны Ольга Берггольц ни разу не выступала по радио. Она сама пришла в Ленинградский радиокомитет и предложила помощь — и почти каждый день выходила в эфир для жителей блокадного города. Паёк у неё был такой же, как у всех: первой блокадной зимой — 125 граммов хлеба. Ноги опухли от голода, обессиленная, она часто ночевала в студии.'
  - '22 февраля 1942 года она прочла по радио «Февральский дневник» — целую поэму, написанную для одной радиопередачи. Её выступления действовали на ленинградцев так сильно, что немцы внесли её в список тех, кого расстреляют сразу после взятия города. Город выстоял. 18 января 1943 года именно ей доверили сказать ленинградцам: «Блокада прорвана!» Её слова «Никто не забыт, и ничто не забыто» высечены на стеле Пискарёвского кладбища.'
