  - id: ns-0215-spisok
    summary: Немцы внесли её в список на расстрел сразу после взятия города — за стихи по радио
    det:
    - Радиовыступления Берггольц действовали на ленинградцев так сильно, что немцы внесли её в особый список. Всех людей из этого списка должны были расстрелять сразу после взятия Ленинграда. Город выстоял.
    src: 'Источник: «Фонтанка.ру». Ольга Берггольц: блокадная муза Ленинграда (16.05.2025) — https://www.fontanka.ru/2025/05/16/75401501/'
    stranica: статья
    href: https://www.fontanka.ru/2025/05/16/75401501/
    otryvok: «Выступления Берггольц имели такую силу, что немцы внесли ее в список советских деятелей, которые сразу будут расстреляны, как только Ленинград будет захвачен.»
