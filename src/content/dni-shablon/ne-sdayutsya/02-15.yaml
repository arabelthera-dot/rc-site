  - id: ns-0215-lopata
    summary: 'Пожарный Ленэнерго: после её передачи «легче кажется лопата»'
    det:
    - В мае 1943 года пожарный Ленэнерго Нина Ситникова написала Берггольц на радио. Многие ленинградские женщины ждали её радиобесед, и после них хотелось больше работать. Ситникова писала, что после её выступлений и лопата кажется легче.
    src: 'Источник: А. Рубашкин. «Голос Ленинграда. Ленинградское радио в дни блокады» — https://litresp.ru/chitat/ru/%D0%A0/rubashkin-aleksandr-iljich/golos-leningrada-leningradskoe-radio-v-dni-blokadi'
