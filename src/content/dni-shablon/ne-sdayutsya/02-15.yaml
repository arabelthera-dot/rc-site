slovar:
- lyudi:olga-berggolc
vizual:
  imya: berggolc-portret
  vid: predmet
  kicker: Рисунок под лупой
  h2: «Февральский дневник» глазами художника
  lead: 'Ленинградский художник Пётр Бусырев нарисовал заставку к поэме, которую Ольга Берггольц прочла по радио 22 февраля 1942 года. Приблизь: колонна с винтовками уходит по снежной улице, а в углу карандашом подписано «февр. дневник».'
audioguide:
  audioSrc: audio-guide-berggolc-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от первого эфира через голодную зиму и «Февральский дневник» — к прорыву блокады: пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Первый эфир
  - t: 22
    mark: 0:22
    title: 125 граммов
  - t: 44
    mark: 0:44
    title: Февральский дневник
  - t: 66
    mark: '1:06'
    title: Письма без адреса
  - t: 88
    mark: '1:28'
    title: Блокада прорвана
  transcript:
  - Ленинград, блокада. До войны Ольга Берггольц ни разу не выступала по радио. Она сама приходит в Радиокомитет и предлагает помощь. С тех пор её голос звучит в эфире почти каждый день.
  - 'Паёк у неё такой же, как у всех: первой блокадной зимой — сто двадцать пять граммов хлеба. Ноги опухли от голода, а она каждый день пишет и выходит в эфир. Обессиленная от голода, она часто ночует в студии.'
  - Двадцать второго февраля сорок второго года она читает «Февральский дневник» — целую поэму, написанную для одной радиопередачи. Её голос так держит город, что немцы вносят её в список на расстрел сразу после взятия Ленинграда.
  - 'Письма идут на конвертах без адреса: «Ленинград. Радио. Ольге Берггольц» — и доходят. Пожарный Ленэнерго пишет: после её передачи легче кажется лопата.'
  - 'Восемнадцатого января сорок третьего года именно ей доверяют сказать городу: «Блокада прорвана!» Её слова «Никто не забыт, и ничто не забыто» высечены на стеле Пискарёвского кладбища. Ниже — викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
