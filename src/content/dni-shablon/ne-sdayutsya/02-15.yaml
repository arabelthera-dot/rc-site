  - id: ns-0215-ni-razu
    summary: До войны ни разу не выступала по радио — и стала голосом миллионного города
    det:
    - До войны Берггольц никогда не выступала по радио. Она сама пришла в Радиокомитет и предложила помощь, после чего выступала почти каждый день. Фадеев писал, что её тихий голос зазвенел по радио на весь блокадный город.
    src: 'Источник: «Комсомольская правда» — Санкт-Петербург. Радио блокадного Ленинграда — https://regions.kp.ru/spb/radio-blokadnogo-leningrada/'
