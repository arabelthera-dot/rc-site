    det:
    - Одна женщина подписала письмо на радио словами «одинокая мать» и упрекнула писателей в том, что им показывают только лицевую сторону медали. 9 февраля 1943 года Берггольц ответила ей по радио. Слушатели тоже стали отвечать «одинокой матери» в письмах Берггольц.
    src: 'Источник: А. Рубашкин. «Голос Ленинграда. Ленинградское радио в дни блокады» — https://litresp.ru/chitat/ru/%D0%A0/rubashkin-aleksandr-iljich/golos-leningrada-leningradskoe-radio-v-dni-blokadi'
