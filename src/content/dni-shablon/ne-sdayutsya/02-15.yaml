  - id: ns-0215-ishudavshim
    summary: Немцы слушали эфир — и в стихах «опухшим» заменили на «исхудавшим»
    det:
    - Передачи ленинградского радио могли слушать и немцы, поэтому каждое слово взвешивали. Во втором «Письме на Каму» Берггольц написала «опухшим», а в эфире прочла «исхудавшим». По той же причине строку «Мы готовились к самой последней борьбе» прочли как «Мы готовились к баррикадной борьбе».
    src: 'Источник: А. Рубашкин. «Голос Ленинграда. Ленинградское радио в дни блокады» — https://litresp.ru/chitat/ru/%D0%A0/rubashkin-aleksandr-iljich/golos-leningrada-leningradskoe-radio-v-dni-blokadi'
    stranica: глава книги
    href: https://litresp.ru/chitat/ru/%D0%A0/rubashkin-aleksandr-iljich/golos-leningrada-leningradskoe-radio-v-dni-blokadi
    otryvok: '«Берггольц написала: «Это гимн ленинградцам, опухшим, упрямым, родным», а прочла по радио иначе: «Это гимн ленинградцам, исхудавшим, упрямым, родным».»'
    pometka: один источник
