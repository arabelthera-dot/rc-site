  - id: ns-0215-v-leningrad
    summary: 'Из сытой Москвы рвалась назад: «В Ленинград! Только в Ленинград… навстречу гибели»'
    det:
    - В марте 1942 года Берггольц жила в Москве в тёплой гостинице, где было сытно и была горячая вода. 12 марта она записала в дневнике, что хочет только в Ленинград, навстречу гибели, и уже хлопочет об отъезде. В столице она пробыла меньше двух месяцев.
    src: 'Источник: ГНКК. «Блокадница по убеждению» — https://gnkk.ru/articles/blokadnica-po-ubezhdeniyu/'
    stranica: статья
    href: https://gnkk.ru/articles/blokadnica-po-ubezhdeniyu/
    otryvok: «12/III-42. Москва Живу в гостинице «Москва». Тепло, уютно, светло, сытно, горячая вода. В Ленинград! Только в Ленинград… В Ленинград – навстречу гибели…»
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n3
    dlya_voprosa: false
  - id: ns-0215-blokada-prorvana
    summary: '18 января 1943-го именно ей доверили сказать городу: «Блокада прорвана!»'
    det:
    - В ночь на 18 января 1943 года в Ленинград пришла весть о прорыве блокады. Сообщить её городу по радио поручили Ольге Берггольц. Она начала словами «Ленинградцы, дорогие соратники, товарищи, друзья! Блокада прорвана!».
    src: 'Источник: «Фонтанка.ру». Ольга Берггольц: блокадная муза Ленинграда (16.05.2025) — https://www.fontanka.ru/2025/05/16/75401501/'
