  - id: ns-0215-summa-udobstv
    summary: 'Москва ей не понравилась: «это ещё вовсе не жизнь — это СУММА удобств»'
    det:
    - Из Москвы Берггольц написала в Ленинград Георгию Макогоненко, коллеге по Радиокомитету и будущему мужу. Свет, тепло, ванна и еда в столице, по её словам, были «суммой удобств», а не жизнью. Существовать там было можно, а жить нельзя.
    src: 'Источник: «Фонтанка.ру». Ольга Берггольц: блокадная муза Ленинграда (16.05.2025) — https://www.fontanka.ru/2025/05/16/75401501/'
    stranica: статья
    href: https://www.fontanka.ru/2025/05/16/75401501/
    otryvok: «Знаешь, свет, тепло, ванна, харчи — все это отлично, но как объяснить тебе, что это еще вовсе не жизнь, — это СУММА удобств. Существовать, конечно, можно, но ЖИТЬ — нельзя.»
    pometka: один источник
    utverzhden: '2026-11-14'
