  - id: ns-0215-starik
    summary: 'Радио замолчало — старик пришёл пешком: «ещё стойкости — пожалуйста, но радио пусть говорит»'
    det:
    - В январе 1942 года ленинградское радио почти замолчало. В Радиокомитет стали приходить люди и спрашивать, когда оно заговорит снова. Старик с палочкой пришёл с Васильевского острова и сказал, что готов терпеть ещё, но радио должно говорить. Это вспоминает сама Берггольц.
    src: 'Источник: А. Рубашкин. «Голос Ленинграда. Ленинградское радио в дни блокады» — https://litresp.ru/chitat/ru/%D0%A0/rubashkin-aleksandr-iljich/golos-leningrada-leningradskoe-radio-v-dni-blokadi'
