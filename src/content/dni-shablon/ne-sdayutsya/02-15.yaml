    - Ленинград. Смольный
    - Почтамт, до востребования
    a: 1
    e: Писали просто «Ленинград. Радио. Ольге Берггольц» — и письма доходили.
  - q: Сколько граммов хлеба получала Берггольц первой блокадной зимой?
