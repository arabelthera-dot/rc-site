    summary: 'Ни лишнего пайка, ни привилегий: 125 граммов, как у всех, ночевала в студии'
    det:
    - В блокаду у Берггольц не было ни привилегий, ни дополнительных пайков. Работники Радиокомитета получали паёк служащих, и первой блокадной зимой это было 125 граммов хлеба. Обессиленная от голода, она часто ночевала в студии.
