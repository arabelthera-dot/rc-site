    stranica: статья
    href: http://www.imha.ru/print:page,1,1144529617-oborona-petropavlovskogo-porta-v-1854-godu-protiv-anglo-francuzskoj-yeskadry.html
    otryvok: «…Сунцов, подполз из-под горы и пулею прострелил — из-под бороды в череп — голову английского… Паркера.»
