  imya: petropavlovsk-avrora-chertezh
  vid: predmet
  kicker: Чертёж под лупой
  h2: Пробоины «Авроры»
  lead: 'Этот чертёж составили после боя 1854 года. Приблизь корпус и мачты фрегата: цифрами отмечено каждое попадание вражеских ядер.'
audioguide:
  audioSrc: audio-guide-petropavlovsk-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от тумана Кальяо через батарею Максутова и Никольскую сопку — к пустому городу: пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Предупреждение
  - t: 22
    mark: 0:22
    title: Батарея
  - t: 44
    mark: 0:44
    title: Никольская сопка
  - t: 66
    mark: '1:06'
    title: Знамя
  - t: 88
    mark: '1:28'
    title: Пустой город
  transcript:
  - 'Король Гавайев за полгода предупредил Камчатку: летом придут англичане и французы. «Аврора» ускользнула в тумане из Кальяо — мимо английской и французской эскадр. Английский адмирал Прайс застрелился перед штурмом — эскадру повёл француз.'
  - Батарея князя Дмитрия Максутова восемь часов держала огонь восьмидесяти орудий трёх фрегатов.
  - Около девятисот десантников сбросили с сопки отряды, где было всего двести девяносто наших солдат. Пятидесятник Карандашев с раненой рукой один вытащил пушку изо рва и выстрелил. Боцман Спылихин с семнадцатью охотниками кинулся в самый центр вражеского десанта. Новобранец из Забайкалья Сунцов одной пулей убил командира вражеского десанта.
  - Десант бежал и бросил знамя британской морской пехоты — трофей повезли в Петербург. У убитого английского капитана в кармане — план десанта на афише оперы «Эрнани». Английский капитан взял на десант кандалы для пленных — в плен попали англичане.
  - 'Через год двенадцать вражеских кораблей с четырьмястами двадцатью пушками пришли мстить — и нашли пустой город. «Таймс» про уход Завойко: «Два чёрных пятна — их не смыть водами океанов». Крошечный гарнизон отразил эскадру — десант сбросили с сопки.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
