    summary: '«Таймс» про уход Завойко: «Два чёрных пятна — их не смыть водами океанов»'
    det:
    - Весной 1855 года русские корабли ушли из Петропавловска в залив Де-Кастри, пока враг искал их в тумане у Авачинской губы.
    src: 'Источник: Военная литература. Тихоокеанский флот. Оборона Петропавловска-Камчатского — https://militera.lib.ru/h/tihookeanskiy_flot/02.html'
    stranica: статья
    href: https://militera.lib.ru/h/tihookeanskiy_flot/02.html
    otryvok: «…нанесла нашему британскому флагу два черных пятна, которые не могут быть смыты никакими водами океанов вовеки»
