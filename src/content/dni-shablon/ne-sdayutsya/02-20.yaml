story:
  kicker: Подвиг
  h2: Оборона Петропавловска-Камчатского
  abzacy:
  - 'В августе 1854 года, в Крымскую войну, к Петропавловскому порту на Камчатке подошла англо-французская эскадра. Весть о ней пришла заранее: Камчатку предупредил король Гавайских островов Камеамеа Третий. Фрегат «Аврора» успел прийти в порт — он ускользнул от английских и французских кораблей в тумане перуанского порта Кальяо.'
  - Двадцатого августа батарея лейтенанта князя Дмитрия Максутова восемь часов держала огонь восьмидесяти орудий трёх фрегатов. Двадцать четвёртого августа враг высадил на Никольскую сопку около девятисот человек. Их сбросили с горы малые отряды, где было всего двести девяносто наших солдат. Пятидесятник Карандашев с раненой рукой вытащил пушку изо рва и выстрелил, боцман Спылихин с семнадцатью охотниками кинулся в самый центр десанта.
  - 'Десант бежал к кораблям и бросил знамя британской морской пехоты. Через год двенадцать вражеских кораблей пришли мстить, но нашли пустой город: гарнизон Василия Завойко ушёл морем в Де-Кастри. Лондонская «Таймс» написала о двух чёрных пятнах на британском флаге.'
