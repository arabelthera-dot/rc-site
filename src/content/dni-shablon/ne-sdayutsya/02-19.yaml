story:
  kicker: Подвиг
  h2: Взвод Широнина
  abzacy:
  - В начале марта 1943 года 25-я гвардейская стрелковая дивизия закрывала дорогу Лозовая — Харьков. Железнодорожный переезд на южной окраине посёлка Тарановка, Змиёвский район Харьковской области, достался 1-му взводу 8-й стрелковой роты 78-го гвардейского стрелкового полка. Командовал взводом гвардии лейтенант Пётр Широнин, в окопах было 25 человек и одна сорокапятка.
  - 'Утром 2 марта, в 8 часов, на переезд пошли 25 танков и 15 бронетранспортёров. Взвод отбил семь атак: гвардейцы шли с гранатами навстречу танкам, Вернигоренко гнул траком танковый пулемёт, Шкодин сбросил штурмовое орудие с насыпи. В 20 часов подошло подкрепление: перед переездом стояли десять подбитых танков, а держали позицию двое раненых. Указом от 18 мая 1943 года Героями Советского Союза стали все 25 бойцов взвода.'
