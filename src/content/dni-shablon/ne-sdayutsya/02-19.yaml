  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — двое раненых; 2 — 25; 3 — трак от гусеницы; 4 — в 1950 году; 5 — шестеро.'
  ball: 10
  voprosy:
  - q: Кто к вечеру 2 марта держал переезд у Тарановки?
    o:
    - Весь взвод
    - Двое раненых
    - Рота подкрепления
    - Расчёт пушки
    a: 1
    e: Враг не знал, что позицию удерживали только два раненых бойца — Букаев и Торопов.
  - q: Сколько бойцов взвода стали Героями Советского Союза одним указом?
    o:
    - '6'
    - '10'
    - '25'
    - '15'
    a: 2
    e: Указ от 18 мая 1943 года назвал Героями всех 25 бойцов взвода.
  - q: Чем Вернигоренко заставил замолчать танковый пулемёт?
    o:
    - Гранатой
    - Прикладом
    - Траком от гусеницы
    - Лопатой
    a: 2
    e: Он вскочил на танк и ударом трака согнул ствол пулемёта.
  - q: Когда наводчик Тюрин получил свою Золотую Звезду?
    o:
    - В 1943 году
    - В 1945 году
    - В 1950 году
    - В 1965 году
    a: 2
    e: Тюрин не знал о награде и воевал дальше — Звезду вручили в феврале 1950 года.
  - q: Сколько бойцов, награждённых посмертно, на самом деле остались живы?
    o:
    - Ни одного
    - Двое
    - Шестеро
    - Десять
    a: 2
    e: Шестеро тяжело раненных узнали о Звезде в госпиталях.
