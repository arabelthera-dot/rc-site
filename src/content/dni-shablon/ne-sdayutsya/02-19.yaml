vizual:
  imya: shironin-zemlya-taranovki
  vid: predmet
  kicker: Снимок под лупой
  h2: Земля Тарановки
  lead: 'Эту землю со станции Тарановка жена Петра Широнина привезла в музей в 1983 году. Приблизь контейнер: в земле переезда — следы того боя.'
audioguide:
  audioSrc: audio-guide-vzvod-shironina-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от утренней атаки танков через бой у пушки и рукопашную — к двум раненым на переезде: пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Переезд
  - t: 22
    mark: 0:22
    title: Танки
  - t: 44
    mark: 0:44
    title: Пушка
  - t: 66
    mark: '1:06'
    title: Двое раненых
  - t: 88
    mark: '1:28'
    title: Звёзды
  transcript:
  - Второе марта тысяча девятьсот сорок третьего года. Железнодорожный переезд у посёлка Тарановка под Харьковом. Здесь окопался взвод гвардии лейтенанта Петра Широнина — двадцать пять человек и одна пушка.
  - В восемь утра на переезд пошли двадцать пять танков и пятнадцать бронетранспортёров. Трое гвардейцев — Скворцов, Седых и Павлов — с гранатами бросились навстречу трём танкам. И танки встали. Шкодин одной гранатой сбросил штурмовое орудие с насыпи.
  - От расчёта пушки остался один наводчик, Александр Тюрин, — и подбил два танка. Старшина-пехотинец Сергей Нечипуренко встал к орудию и подбил ещё танк и бронетранспортёр. Иван Вернигоренко вскочил на танк и траком от гусеницы согнул ствол пулемёта.
  - У Чертенкова кончились патроны — он бил автоматом как дубиной и, сражённый, утащил немца за горло. К восьми вечера, когда подошло подкрепление, переезд держали двое раненых — Букаев и Торопов. Враг не знал, что взвода больше нет. Перед окопами стояли десять подбитых танков.
  - Всех двадцать пять наградили посмертно. А шестеро были живы и узнали о Звезде в госпиталях. Тюрин не знал, что он Герой, и воевал дальше — Звезду ему вручили только в пятидесятом. Букаев дошёл до Берлина и прошёл на Параде Победы.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
