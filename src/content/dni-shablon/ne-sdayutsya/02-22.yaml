story:
  kicker: Подвиг
  h2: Мать Мария (Скобцова)
  abzacy:
  - 'Елизавета Пиленко выросла у Чёрного моря, в Анапе. В 1918 году поэтесса стала первой женщиной — городским головой Анапы. Она защищала горожан от арестов и расстрелов, а за «комиссарство» белые её арестовали, и ей грозила смертная казнь. Потом была эмиграция: Грузия, Константинополь, Сербия, Париж. Она приняла постриг с именем Мария и открыла в доме 77 на улице Лурмель приют для бездомных, больных и одиноких. При нём были церковь в гараже и столовая.'
  - 'В 1940 году Францию оккупировали. Мать Мария записала свою богадельню муниципальной столовой и стала получать продукты в мэрии. Её дом стал одним из штабов Сопротивления: здесь прятали беглецов и советских военнопленных, а отец Димитрий Клепинин выдавал евреям свидетельства о крещении. В ночь с 4 на 5 июля 1942 года на зимний велодром согнали 13 тысяч евреев. Монахиня пробралась туда, провела там три дня и вывезла четверых детей в ящиках для мусора.'
  - В феврале 1943 года гестапо арестовало её сына, потом её саму. Дальше были форт Роменвиль, лагерь Компьень и вагон для скота до Равенсбрюка. В лагере она делилась едой, утешала узниц, вышивала, переводила песни. Больной её перевели в Югендлагерь — лагерь смерти для ослабевших. 31 марта 1945 года она поменялась одеждой с молодой матерью, которую загнали в строй, и пошла в газовую камеру вместо неё.
