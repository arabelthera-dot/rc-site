    src: 'Источник: К 25-летию со дня кончины Матери Марии (Скобцовой) — сайт «Мать Мария, Mère Marie» (И. А. Кривошеин) — https://mere-marie.com/life/mat-mariya/; Мать Мария (Скобцова). Красота спасающая — К. И. Кривошеина, «Азбука веры» — https://azbyka.ru/fiction/mat-mariya-skobcova-krasota-spasayushhaya/'
