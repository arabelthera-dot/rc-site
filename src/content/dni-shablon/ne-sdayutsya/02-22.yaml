  - id: ns-0222-gestapo-mat
    summary: 'Гестаповец: «Дочь помогает только евреям». Её мать: «Она помогла бы и вам»'
    det:
    - 'Это слова матери, Софьи Борисовны Пиленко, при аресте дочери. Мать Мария улыбнулась и сказала: «Пожалуй, помогла бы».'
    src: 'Источник: Мать Мария (Скобцова): Горячее сердце — Правмир — https://www.pravmir.ru/bodrstvujte-molites-obo-mne/; Мать Мария (Скобцова): как богемная дива стала монахиней, в честь которой теперь названа улица в Париже — журнал «Фома» — https://foma.ru/mat-marija-skobcova-kak-bogemnaja-diva-stala-monahinej-v-chest-kotoroj-teper-nazvana-ulica-v-parizhe.html'
    stranica: статья
    href: https://foma.ru/mat-marija-skobcova-kak-bogemnaja-diva-stala-monahinej-v-chest-kotoroj-teper-nazvana-ulica-v-parizhe.html
    otryvok: '«…а ее маме, Софии Борисовне, бросил упрек: «Вы дурно воспитывали вашу дочь, она только жидам помогает!» Но та спокойно ответила: «Моя дочь настоящая христианка, и для нее нет ни эллина, ни иудея, а есть несчастный человек. Если бы и вам грозила беда, она и вам помогла». И мать Мария улыбнулась: «Пожалуй, помогла бы».»'
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: false
