  transcript:
  - В 1918 году двадцатишестилетняя поэтесса Елизавета Кузьмина-Караваева стала первой женщиной — городским головой Анапы. Во время большевистского террора она многих горожан защитила от арестов и расстрелов.
  - 'В Париже она приняла постриг с именем Мария и открыла приют в доме семьдесят семь на улице Лурмель. В оккупацию приют стал одним из штабов французского Сопротивления: здесь прятались советские военнопленные, бежавшие из немецких лагерей, а священник общины выписывал евреям свидетельства о крещении.'
  - В ночь на пятое июля 1942 года немцы согнали на зимний велодром тринадцать тысяч евреев. Монахиня сама вошла за оцепление на три дня — и вывезла четверых детей в ящиках для мусора.
  - 'При аресте дочери гестаповец крикнул её матери, что дочь помогает только евреям. Софья Борисовна ответила: если бы и вам грозила беда, она помогла бы и вам. В оккупированном Париже мать Мария говорила: «Я не боюсь за Россию. Я знаю, что она победит».'
  - 'В Равенсбрюке узница номер девятнадцать тысяч двести шестьдесят три переводила советские военные песни — их тайком пел весь барак. Глядя на дым крематория, говорила: выше он становится всё прозрачнее и чище. В оккупированном Париже спасала людей — и вошла в газовую камеру вместо другой.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
