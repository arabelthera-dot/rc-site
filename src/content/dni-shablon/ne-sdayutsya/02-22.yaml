quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 13 тысяч; 2 — в ящиках для мусора; 3 — Анапа; 4 — орден Отечественной войны II степени; 5 — советские военные песни.'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: сколько евреев немцы согнали на зимний велодром в Париже в июле 1942 года?'
    o:
    - Около 500
    - Около 2 тысяч
    - 13 тысяч
    - 100 тысяч
    a: 2
    e: В ночь на 5 июля 1942 года на зимний велодром свезли 13 тысяч человек. Мать Мария провела там три дня.
  - q: Как мать Мария вывезла четверых детей с оцепленного велодрома?
    o:
    - В ящиках для мусора
    - В санитарной машине
    - Под монашеской рясой
    - В бочках из-под вина
    a: 0
    e: Она спрятала четверых детей в ящики для мусора и спасла их от отправки в Освенцим.
  - q: Каким городом в 1918 году руководила Елизавета Кузьмина-Караваева?
    o:
    - Ялтой
    - Анапой
    - Новороссийском
    - Ригой
    a: 1
    e: В 26 лет она стала первой женщиной — городским головой Анапы.
  - q: Какой наградой СССР в 1985 году посмертно отметил мать Марию?
    o:
    - Медалью «За отвагу»
    - Орденом Красной Звезды
    - Орденом Отечественной войны II степени
    - Орденом Ленина
    a: 2
    e: Указом Президиума Верховного Совета СССР от 7 мая 1985 года — орден Отечественной войны II степени.
  - q: Что мать Мария переводила на французский в Равенсбрюке?
    o:
    - Молитвы
    - Советские военные песни
    - Письма узниц
    - Немецкие приказы
    a: 1
    e: Она переводила советские военные и патриотические песни — их потом тайком пели все заключённые.
