  udary:
  - id: ns-0222-velodrom-deti
    summary: Монахиня вывезла с оцепленного немцами велодрома четверых детей — в мусорных баках
    det:
    - 'Мать Мария пробралась на зимний велодром благодаря монашескому одеянию. Музей Достоевского добавляет: детей спасли от отправки в Освенцим.'
    src: 'Источник: Мать Мария (Скобцова): как богемная дива стала монахиней, в честь которой теперь названа улица в Париже — журнал «Фома» — https://foma.ru/mat-marija-skobcova-kak-bogemnaja-diva-stala-monahinej-v-chest-kotoroj-teper-nazvana-ulica-v-parizhe.html; Мать Мария — Литературно-мемориальный музей Ф. М. Достоевского в Санкт-Петербурге (раздел «Достоеведы в годы Великой Отечественной войны») — https://www.md.spb.ru/muzej/dostoevedy_2020/mat_mariya/'
    stranica: статья
    href: https://foma.ru/mat-marija-skobcova-kak-bogemnaja-diva-stala-monahinej-v-chest-kotoroj-teper-nazvana-ulica-v-parizhe.html
    otryvok: «…Она провела там три дня, утешая подругу-еврейку, помогая добровольцам из Красного Креста оказывать помощь больным, поддерживая взрослых и детей, распределяя провизию... И сумела спасти четверых детей, спрятав их в ящики для мусора…»
    pometka: два источника
    utverzhden: '2026-11-15'
