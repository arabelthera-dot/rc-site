- id: fakty-dnya
  kicker: Ещё пять фактов
  h2: Как старостиху узнала вся Россия
  udary:
  - id: ns-0221-ranenyj
    summary: Раненого пленного она пожалела и выходила, а француз потом прислал ей денег
    det:
    - Выздоровев, француз вернулся к своим. Деньги он передал Василисе через знакомых.
