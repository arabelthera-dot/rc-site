  transcript:
  - "Лето тысяча восемьсот двенадцатого года. Хутор Горшково Сычёвского уезда Смоленской губернии. Французы убили старосту Кожина, мужики ушли в армию. Сход решил — быть Василисе старостихой."
  - Староста соседней деревни повёл в город одну партию пленных французов, а вторую отдал Василисе. Конвоя не было. Она собрала крестьян, села верхом на лошадь и взяла в руки косу.
  - Ну, злодеи французы, во фрунт, ступай, марш, — кричала она. Пленный офицер не захотел слушаться бабу и упал мёртвым от её косы. Уж я двадцати семи таким вашим озорникам сорвала головы, — сказала старостиха колонне.
  - В декабре тысяча восемьсот двенадцатого года об этом напечатал журнал «Сын Отечества». Венецианов нарисовал французов голодными крысами под её командой, в детской азбуке ей досталась буква «Ф». Картинки с ней висели во всех трактирах.
  - Под её портретом тысяча восемьсот тринадцатого года написали — большую сделала для России пользу. А Толстой в «Войне и мире» вспомнил старостиху Василису, побившую сотни французов.
  note: Озвучено синтезом речи.
