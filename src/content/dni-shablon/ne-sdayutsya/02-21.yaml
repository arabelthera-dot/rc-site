quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Старостиха Василиса
  intro: Пять вопросов о том, как крестьянка вела пленных французов.
  noscript: Викторина работает с включённым JavaScript.
  ball: 10
  voprosy:
  - q: Чем старостиха Василиса погоняла колонну пленных?
    o:
    - Кнутом
    - Косой
    - Ружьём
    - Палкой
    a: 1
    e: Она села верхом на лошадь и взяла в руки косу.
  - q: Скольким «озорникам», по её словам, она уже сорвала головы?
    o:
    - Семи
    - Двенадцати
    - Двадцати семи
    - Сотне
    a: 2
    e: '«Уж я двадцати семи таким вашим озорникам сорвала головы!» — так записал «Сын Отечества».'
  - q: Какая буква досталась ей в детской азбуке 1812 года?
    o:
    - «В»
    - «К»
    - «С»
    - «Ф»
    a: 3
    e: '«Французов, как мышей, словила в западню» — картинка под буквой «Ф».'
  - q: Кем Венецианов изобразил французов под её командой?
    o:
    - Голодными крысами
    - Мокрыми курами
    - Волками
    - Баранами
    a: 0
    e: Гравюра называлась «Французы, голодные крысы, в команде у старостихи Василисы».
  - q: Где в 1812 году впервые напечатали о старостихе Василисе?
    o:
    - В газете «Московские ведомости»
    - В журнале «Сын Отечества»
    - В письме Кутузова
    - В романе «Война и мир»
    a: 1
    e: Заметку напечатали в декабрьской книжке «Сына Отечества» за 1812 год.
