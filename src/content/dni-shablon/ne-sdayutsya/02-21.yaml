  - id: ns-0221-kon-i-kosa
    summary: Крестьянка села на коня, взяла косу и одна погнала колонну пленных французов в город
    det:
    - Староста соседней деревни отдал ей партию пленных для отправки в город. Конвоя не было — Василиса собрала крестьян, села верхом и поехала вокруг колонны с косой.
    src: 'Источник: музей-заповедник «Тарханы», «Как старостиха Василиса Кожина стала знаменитой» (текст заметки «Сын Отечества», 1812) — http://museumtarhany.blogspot.com/2013/11/vasilisa-kojina-1812.html; Русский музей, лубок А. Г. Венецианова — https://virtualrm.spb.ru/ru/node/17764'
    stranica: статья
    href: http://museumtarhany.blogspot.com/2013/11/vasilisa-kojina-1812.html
    otryvok: '«Василиса собрала крестьян, села верхом на лошадь, взяла в руки косу, и разъезжая вокруг пленных, кричала важным голосом…»'
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: false
    n: 3
  - id: ns-0221-pominki
    summary: Позвала французов на поминки мужа, напоила, заперла в избе и подожгла
    det:
    - Отряд французов пришёл в хутор, где только что убили старосту. Вдова накрыла стол, а когда гости захмелели, крестьяне заперли двери и окна.
    src: 'Источник: Смоленская областная библиотека, «История Смоленщины в лицах» — http://www.smolensklib.ru/zem2/node/8578; Псковская областная библиотека, «Общая память» — https://inter.pskovlib.ru/obshchaya-pamyat-vojna-1812-goda/risunki/1490-vasilisa-kozhina'
    stranica: статья
    href: http://www.smolensklib.ru/zem2/node/8578
    otryvok: '«Василиса пригласила врагов в дом, накрыла на стол, угостила их выпивкой. Воспользовавшись моментом, вдова заперла незваных гостей снаружи и подожгла избу.»'
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n3
    dlya_voprosa: false
    n: 4
  - id: ns-0221-azbuka
    summary: 'В азбуке для детей ей досталась буква «Ф»: «Французов, как мышей, словила в западню»'
    det:
    - Азбуку 1812 года в карикатурах выпустил художник Иван Теребенев. По ней дети учили буквы — и запоминали старостиху Василису.
    src: 'Источник: музей-заповедник «Тарханы», «Как старостиха Василиса Кожина стала знаменитой» — http://museumtarhany.blogspot.com/2013/11/vasilisa-kojina-1812.html'
    stranica: статья
    href: http://museumtarhany.blogspot.com/2013/11/vasilisa-kojina-1812.html
    otryvok: '«…Василисе Кожиной, которой посвящена картинка под буквой «Ф»: «Французов как мышей, словила в западню; не будь их дух в Руси; я всех предам огню».»'
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: false
    n: 5
  - id: ns-0221-krysy
    summary: Венецианов нарисовал французов голодными крысами под командой старостихи Василисы
    det:
    - Гравюру Алексей Венецианов сделал в 1812 году. Позже лубочники перерисовывали её, и этот лист вошёл в атлас «Русские народные картинки» — он на обложке дня.
    src: 'Источник: Русский музей, лубок А. Г. Венецианова — https://virtualrm.spb.ru/ru/node/17764; А. Сидорчик, «Героиня из черни», «Аргументы и факты» — https://aif.ru/society/history/geroinya_iz_cherni_minuta_slavy_vasilisy_kozhinoy'
    stranica: статья
    href: https://aif.ru/society/history/geroinya_iz_cherni_minuta_slavy_vasilisy_kozhinoy
    otryvok: '«Французы, голодные крысы, в команде у старостихи Василисы». Гравюра на дереве Алексея Венецианова. 1812 год.'
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n2
    dlya_voprosa: false
    n: 6
  - id: ns-0221-vo-frunt
    summary: 'Она муштровала пленных солдат Наполеона: «Ну, злодеи французы! Во фрунт! Ступай, марш!»'
    det:
    - «Фрунт» — строй лицом к командиру. Крестьянка командовала солдатами армии, прошедшей всю Европу, их же военными словами.
    src: 'Источник: музей-заповедник «Тарханы», «Как старостиха Василиса Кожина стала знаменитой» (текст заметки «Сын Отечества», 1812) — http://museumtarhany.blogspot.com/2013/11/vasilisa-kojina-1812.html'
    stranica: статья
    href: http://museumtarhany.blogspot.com/2013/11/vasilisa-kojina-1812.html
    otryvok: '«…разъезжая вокруг пленных, кричала важным голосом: «Ну, злодеи французы! Во фрунт! Ступай, марш!»»'
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: false
    n: 7
  - id: ns-0221-baby-i-podrostki
    summary: Мужиков в деревне не было, и она повела на французов баб и подростков с косами и вилами
    det:
    - Мужчины хутора ушли в армию и ополчение. Отряд Василисы вооружился тем, что было в хозяйстве, — косами, вилами и топорами.
    src: 'Источник: А. Сидорчик, «Героиня из черни», «Аргументы и факты» (текст статьи БСЭ) — https://aif.ru/society/history/geroinya_iz_cherni_minuta_slavy_vasilisy_kozhinoy; Смоленская областная библиотека, «История Смоленщины в лицах» — http://www.smolensklib.ru/zem2/node/8578'
    stranica: статья
    href: https://aif.ru/society/history/geroinya_iz_cherni_minuta_slavy_vasilisy_kozhinoy
    otryvok: '«Организовав из подростков и женщин отряд партизан, вооружённых косами, вилами, топорами и т. п., К. уничтожала и брала в плен солдат наполеоновской армии…»'
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n4
    dlya_voprosa: false
    n: 8
  - id: ns-0221-tolstoj
    summary: 'Толстой в «Войне и мире»: «Была старостиха Василиса, побившая сотни французов»'
    det:
    - Толстой вспоминает её в четвёртом томе, в главах о народной войне, — рядом с дубиной, которая гвоздила французов.
    src: 'Источник: Л. Н. Толстой, «Война и мир», т. 4, ч. 3, гл. 3; Н. Г. Долинина, «По страницам „Войны и мира“» — https://literatura5.narod.ru/tolstoy_dolinina-vojna-i-mir-ch4-3.html'
    stranica: статья
    href: https://literatura5.narod.ru/tolstoy_dolinina-vojna-i-mir-ch4-3.html
    otryvok: '«Была старостиха Василиса, побившая сотни французов».'
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n7
    dlya_voprosa: false
    n: 9
  - id: ns-0221-durova
    summary: 'Из героинь 1812 года история сохранила по имени двоих: кавалерист-девицу Дурову и её, старостиху Василису'
    det:
    - Надежда Дурова была офицером кавалерии. Василиса Кожина — неграмотная крестьянка из смоленского хутора.
    src: 'Источник: А. Сидорчик, «Героиня из черни», «Аргументы и факты» — https://aif.ru/society/history/geroinya_iz_cherni_minuta_slavy_vasilisy_kozhinoy'
