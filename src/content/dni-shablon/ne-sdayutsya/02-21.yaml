data_uslovnaya: 21 февраля — день музея; событие — 15 августа 1812 года французы убили старосту Кожина, и его вдова Василиса повела хутор Горшково против оккупантов.
chto_sluchilos: После 15 августа 1812 года, когда французы зарубили её мужа, старостиха хутора Горшково Сычёвского уезда Смоленской губернии Василиса Кожина верхом и с косой сама погнала в город партию пленных французов, зарубила непокорного офицера и повела баб и подростков с косами и вилами на солдат Наполеона.
