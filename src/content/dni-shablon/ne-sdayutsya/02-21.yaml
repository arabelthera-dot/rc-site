story:
  kicker: Подвиг
  h2: Старостиха Василиса
  abzacy:
  - Летом 1812 года французский отряд ворвался в Сычёвский уезд. 15 августа в хуторе Горшково французы зарубили старосту Кожина, а мужики были в ополчении и в армии. Хутор остался на вдове — Василисе Кожиной, и сход решил, что старостой будет она.
  - Староста соседней деревни повёл в город одну партию пленных, а вторую отдал Василисе. Она села на коня, взяла косу и погнала французов сама; пленного офицера, отказавшегося слушаться, зарубила на месте. Заметку об этом в декабре 1812 года напечатал «Сын Отечества», и старостиха с косой разошлась по лубкам, азбукам и трактирным стенам всей России.
