quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Призвать сослуживцев бросить службу в полиции; 2 — «Работайте, братья!»; 3 — Боевики вырезали этот эпизод из своего ролика; 4 — Юристом в банке; 5 — В Махачкале."
  ball: 10
  voprosy:
    - q: Чего потребовали боевики от Магомеда Нурбагандова на камеру?
      o:
        - Назвать адреса сослуживцев
        - Отречься от веры
        - Призвать сослуживцев бросить службу в полиции
        - Попросить выкуп у семьи
      a: 2
      e: Его связали, включили камеру телефона и потребовали обратиться к сослуживцам с призывом бросить работу в правоохранительных органах.
    - q: Что он ответил?
      o:
        - «Работайте, братья!»
        - «Держитесь, братья!»
        - «Прощайте, братья!»
        - «Служите, братья!»
      a: 0
      e: "Он сказал два слова: «Работайте, братья!». «Служите, братья!» — неточная цитата из слов президента в 2016 году."
    - q: Почему о его словах узнали не сразу?
      o:
        - Свидетелей не осталось
        - Запись засекретили
        - Слова передал по рации сослуживец
        - Боевики вырезали этот эпизод из своего ролика
      a: 3
      e: «Когда террористы монтировали запись расправ, этот эпизод просто вычеркнули», — сказал глава Дагестана. Запись нашли в телефоне главаря банды через месяц.
    - q: Кем Магомед работал до полиции?
      o:
        - Учителем
        - Юристом в банке
        - Футбольным тренером
        - Журналистом
      a: 1
      e: Он с отличием окончил юридический факультет Дагестанского государственного университета и работал юристом в банке, а потом стал полицейским.
    - q: Где в 2023 году ему открыли памятник?
      o:
        - В Москве
        - В Махачкале
        - В Грозном
        - В Дербенте
      a: 1
      e: Памятник Герою России Магомеду Нурбагандову открыли в Махачкале 10 июля 2023 года, в седьмую годовщину гибели (РИА Новости, 10.07.2023).
