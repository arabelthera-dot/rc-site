audioguide:
  audioSrc: audio-guide-nurbagandov-ru.mp3
  durationLabel: 2 минуты 28 секунд
  lead: "Голос ведёт от ночного лагеря в лесу и двух слов под стволом — к Кремлю, к фронту и к школьному учебнику: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Ночь в лесу
    - t: 23
      mark: 0:23
      title: Два слова
    - t: 71
      mark: 1:11
      title: Правда и возмездие
    - t: 97
      mark: 1:37
      title: Кремль
    - t: 124
      mark: 2:04
      title: «Работаем, брат!»
  transcript:
    - "<p>Боевики выжидают, пока семья уснёт в палатках, и в пятом часу утра связывают всех пластиковыми стяжками. У Магомеда Нурбагандова находят удостоверение полицейского. Двадцатиоднолетний двоюродный брат Абдурашид, чемпион России по единоборствам, заступается за избиваемого младшего брата: со связанными ногами он сбивает бандита с ног — и его застреливают первым. Посмертно — орден Мужества.</p>"
    - "<p>Бандиты снимают ролик-устрашение: пленный полицейский на камеру должен призвать своих бросить службу. «Скажи… чтобы не работали». Магомед отвечает: «Работайте, братья! Почему нет? Уже всё, уже что говорить?» Он не проживает и тридцати секунд: главарь стреляет ему в голову. Ему тридцать один год, остаются жена Камилла и двое детей. Младший племянник с другим пленником разбивают бутылку и осколками перерезают стяжки; он прибегает в село с вестью о расправе. Двоюродный брат Арсен убеждает бандитов, что телефон с его фото в полицейском мундире чужой, и на своих плечах выносит тело Магомеда из леса. Арсена оставляют в живых, чтобы он передал «послание»: не служите. Он становится офицером спецназа «Витязь».</p>"
    - "<p>Бандиты пускают слух, что Магомед молил о пощаде. Отец не верит: «Магомед так не мог». Седьмого сентября две тысячи шестнадцатого года спецназ в Избербаше и Махачкале уничтожает шестерых, среди них главаря Магомеда Халимбекова. В его телефоне находят полную запись — эпизод с Магомедом убийцы вырезали из своего ролика. Боевик, снимавший расправу, по жалобе прокуроров получает в Верховном суде пожизненное.</p>"
    - "<p>Двадцать второго сентября две тысячи шестнадцатого года Владимир Путин открывает в Кремле вручение наград словами о нём: «или струсить, или шагнуть в бессмертие». Отец героя, принимая Звезду сына, говорит: «Уверяю Вас, если бы далась ему вторая жизнь, он поступил бы так же» — и заканчивает речь двумя словами сына: «Работайте, братья! Спасибо». Через десять лет, пятого июня две тысячи двадцать шестого года, президент закончит обращение к фронту теми же словами.</p>"
    - "<p>Страна отвечает надписями на футболках, машинах и танках: «Работаем, брат!» Водитель из Дагестана говорит: «Магу знал. Хороший. Не затрясся. И я не буду». Имя героя носит школа в Сергокале, его слова вошли в новый школьный учебник. Младший брат Рамазан трижды ранен на фронте и снова идёт на задачи: «Фамилию позорить нельзя».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
