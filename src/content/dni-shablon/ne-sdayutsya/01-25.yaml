        src: "Источник: «Встреча с родителями Магомеда Нурбагандова», Президент России, 21.09.2016 — http://www.kremlin.ru/events/president/news/52933; «Путин в обращении к бойцам произнес фразу Нурбагандова „Работайте, братья“», «АиФ Дагестан», 05.06.2026 — https://dag.aif.ru/society/details/putin-v-obrashchenii-k-boycam-proiznes-frazu-nurbagandova-rabotayte-bratya"
