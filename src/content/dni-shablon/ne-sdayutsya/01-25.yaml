        src: "Источник: «Работайте, братья: Верховный суд ужесточил приговор убийце героя-полицейского», Вести.ru, 18.01.2018 — https://www.vesti.ru/article/1450327; «Соучастник убийства Героя России Нурбагандова приговорен к 24 годам», «Российская газета», 03.10.2017 — https://rg.ru/2017/10/03/reg-ufo/souchastnik-ubijstva-geroia-rossii-nurbagandova-prigovoren-k-24-godam.html"
