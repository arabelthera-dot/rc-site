      - summary: "<b>Дагестанцы клеили его слова на машины: «Не затрясся. И я не буду», — сказал водитель.</b>"
        det:
          - "Осенью 2016 года в Дагестане всё больше машин ездили со стикером «Работайте, братья! Магомед Нурбагандов, Герой России». Водитель Хабиб, возивший людей между Махачкалой и Сергокалой: «Проблема — если я буду молчать… Магу знал. Хороший. Не затрясся. И я не буду». Его имя носит школа в Сергокале, у её входа стоит монумент; улицы его имени есть в Грозном и Махачкале."
        src: "Источник: «„Работайте, братья“. Пять лет назад боевики казнили лейтенанта Нурбагандова», «Лента.ру», 10.07.2021 — https://lenta.ru/articles/2021/07/10/bratia/; «Каким он парнем был», «Российская газета», 10.07.2026 — https://rg.ru/2026/07/10/reg-skfo/rabotajte-bratia-proshlo-10-let-so-dnia-ubijstva-magomeda-nurbagandova.html; «Соучастник убийства Героя России Нурбагандова приговорен к 24 годам», «Российская газета», 03.10.2017 — https://rg.ru/2017/10/03/reg-ufo/souchastnik-ubijstva-geroia-rossii-nurbagandova-prigovoren-k-24-godam.html"
