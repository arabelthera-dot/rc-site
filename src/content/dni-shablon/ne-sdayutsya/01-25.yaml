audioguide:
  audioSrc: audio-guide-nurbagandov-ru.mp3
  durationLabel: 1 минута 7 секунд
  lead: "Голос ведёт от школы в Сергокале через пикник в лесу и два слова под стволом — к записи, которую убийцы вырезали, и к словам, которые повторила вся страна: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Сергокала
    - t: 12
      mark: 0:12
      title: Пикник в лесу
    - t: 28
      mark: 0:28
      title: Два слова
    - t: 41
      mark: 0:41
      title: Вырезанный эпизод
    - t: 55
      mark: 0:55
      title: Слова, которые разошлись
  transcript:
    - "<p>Магомед Нурбагандов вырос в дагестанском селе Сергокала. Окончил школу с золотой медалью, юридический факультет с отличием, работал юристом в банке — и исполнил мечту: стал полицейским.</p>"
    - <p>Летом две тысячи шестнадцатого года, в выходные, Магомед с родственниками отдыхал в лесу на окраине Сергокалы. К привалу вышли вооружённые боевики. Его двоюродного брата убили сразу, а у Магомеда нашли удостоверение полицейского.</p>
    - "<p>Его связали, включили камеру телефона и потребовали призвать сослуживцев бросить службу. Магомед сказал только: «Работайте, братья!» Ему был тридцать один год.</p>"
    - <p>Боевики вырезали эти слова из своего ролика. Через месяц главаря банды уничтожили, и в его телефоне нашли запись. Так страна узнала, что сказал лейтенант полиции под стволом пистолета.</p>
    - <p>Магомеду Нурбагандову посмертно присвоено звание Героя России. Его именем названы школа и улицы. А слова «Работайте, братья!» стали крылатыми.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
