story:
  kicker: Среда подвига
  h2: Сергокала
  abzacy:
    - Магомед Нурбагандов родился в 1985 году и вырос в дагестанском селе Сергокала — райцентре, где живут около девяти тысяч человек. В школе учился на отлично, был капитаном команды КВН, собрал из друзей футбольную команду и окончил школу с золотой медалью. Потом — юридический факультет Дагестанского государственного университета с отличием и работа юристом в банке. <b>Затем он исполнил свою мечту — стал полицейским.</b>
    - С женой Камиллой он учился в одном классе. У них родились сын Нурбаганд и дочь Патимат. В июле 2016 года, в выходные, Магомед с родственниками выехал на пикник в лес на окраине Сергокалы.
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Магомед Нурбагандов — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: "<b>«Русские не сдаются» — двумя словами: с пистолетом у головы Магомед вместо «бросайте службу» сказал своим «Работайте, братья!»</b>"
        det:
          - "Бандиты снимали ролик-устрашение: пленный полицейский на камеру должен был призвать своих бросить службу. Боевик прочитал удостоверение: «Вот, поймали лейтенанта полиции Нурбагандова». — «Да, я это». — «Скажи… чтобы не работали». — «Работайте, братья! Почему нет? Уже всё, уже что говорить?» «Уже всё» — он понимал, чем это кончится, и последние секунды отдал не просьбе о пощаде, а приказу своим. Он не прожил и 30 секунд: главарь выстрелил в голову. Ему был 31 год, остались жена Камилла и двое детей. Враг хотел записать капитуляцию — а записал клятву, которую потом повторила вся страна: «Работаем, брат!»"
        src: "Источник: «„Работайте, братья!“ Как живёт семья убитого 10 лет назад героя Нурбагандова», «Аргументы и факты — Дагестан» — https://dag.aif.ru/society/persona/-rabotayte-bratya-kak-zhivyot-semya-ubitogo-10-let-nazad-geroya-nurbagandova ; «КП — Северный Кавказ», 10.07.2020 — https://www.stav.kp.ru/daily/27154.5/4251224/"
        stranica: «„Работайте, братья!“ Как живёт семья убитого 10 лет назад героя Нурбагандова», «Аргументы и факты — Дагестан»
        href: https://dag.aif.ru/society/persona/-rabotayte-bratya-kak-zhivyot-semya-ubitogo-10-let-nazad-geroya-nurbagandova
        otryvok: «Вот, поймали лейтенанта полиции Нурбагандова»
        pometka: один источник
        kadr:
          src: /muzei/ne-sdayutsya/img/01-25-goskatalog-89442929.jpg
          alt: Живописный портрет Магомеда Нурбагандова со Звездой Героя России.
          data_source: https://goskatalog.ru/portal/#/collections?id=68684480
          license: "цитирование, ст. 1274 ГК РФ, с указанием автора и музея. Внимание: в 01-25.json кредит «Фото: Скирченко» — по Госкаталогу это картина (холст, масло), не фото; исправить «Фото» на «Худ.»"
          podpis: Скирченко С. В. «Герой России Нурбагандов Магомед Нурбагандович». Холст, масло, 2023.
          credit: ГБУ Республики Дагестан «Национальный музей Республики Дагестан им. А. Тахо-Годи», Госкаталог № 68684480 (рег. № 68421273)
          width: 1297
          height: 1600
        utverzhden: 2026-11-03
      - summary: "<b>Отец героя, принимая в Кремле Звезду сына, закончил речь его словами: «Работайте, братья!»</b>"
        det:
          - "22 сентября 2016 года на вручении наград Нурбаганд Нурбагандов сказал: «Уверяю Вас, если бы далась ему вторая жизнь, он поступил бы так же». И закончил двумя словами сына: «Работайте, братья! Спасибо». Звание Героя России посмертно присвоено указом от 20 сентября 2016 года."
        src: "Источник: «Вручение государственных наград», Президент России, 22.09.2016 — http://www.kremlin.ru/events/councils/52941"
        stranica: «Вручение государственных наград», Президент России, 22.09.2016
        href: http://www.kremlin.ru/events/councils/52941
        otryvok: «Уверяю Вас, если бы далась ему вторая жизнь, он поступил бы так же»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-25-kremlin-OOj6r2wy.jpg
          alt: Седой мужчина с усами, в очках и тёмном костюме говорит за белой трибуной с двумя микрофонами.
          data_source: http://www.kremlin.ru/events/councils/52941
          license: "CC BY 4.0, «Фото: kremlin.ru»"
          podpis: Нурбаганд Нурбагандов, отец лейтенанта Магомеда Нурбагандова, выступает в Кремле 22 сентября 2016 года.
          credit: Администрация Президента Российской Федерации, сайт «Президент России» (kremlin.ru)
          width: 1600
          height: 987
        utverzhden: 2026-11-03
      - summary: <b>Абдурашид со связанными ногами сбил бандита с ног — и его застрелили первым.</b>
        det:
          - "Боевики выждали, пока семья уснёт в палатках, и в пятом часу утра связали всех пластиковыми стяжками; у Магомеда нашли удостоверение полицейского. 21-летний двоюродный брат Абдурашид, чемпион России по единоборствам, сказал: «Хотя бы ноги мне развяжите — и увидите, что я с вами сделаю». Он заступился за избиваемого младшего брата: «с завязанными ногами ударил одного из них и свалил даже. И в это время они его застрелили». Посмертно — орден Мужества."
        src: "Источник: «„Работайте, братья!“: каким был Герой России Магомед Нурбагандов», RT на русском, 10.07.2021 — https://russian.rt.com/russia/article/877786-magomed-nurbagandov-geroi-rossii; «„Работайте, братья“. Пять лет назад боевики казнили лейтенанта Нурбагандова», «Лента.ру», 10.07.2021 — https://lenta.ru/articles/2021/07/10/bratia/; «Соучастник убийства Героя России Нурбагандова приговорен к 24 годам», «Российская газета», 03.10.2017 — https://rg.ru/2017/10/03/reg-ufo/souchastnik-ubijstva-geroia-rossii-nurbagandova-prigovoren-k-24-godam.html"
        stranica: "«„Работайте, братья!“: каким был Герой России Магомед Нурбагандов», RT на русском, 10.07.2021"
        href: https://russian.rt.com/russia/article/877786-magomed-nurbagandov-geroi-rossii
        otryvok: «Хотя бы ноги мне развяжите — и увидите, что я с вами сделаю»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Бандиты пощадили Арсена, чтобы он передал их «послание», — он стал офицером спецназа «Витязь».</b>
        det:
          - "Арсена, двоюродного брата Магомеда, увезли в лес вместе с ним. Один боевик предлагал: «Давай застрелим его тоже», другой ответил: «Оставь. Пусть пойдёт и скажет, что его в живых оставили». Арсена оставили, чтобы он передал «послание»: не служите, не боритесь. Арсен окончил военный институт, стал старшим офицером центра специального назначения «Витязь» и воевал на СВО — сражался в Гостомеле, Буче, Ирпене и участвовал в освобождении аэропорта «Антонов»."
        src: "Источник: «Арсен Нурбагандов участвует в республиканской программе развития „Доблесть гор“», «Избербаш-инфо», 13.07.2025 — https://izberbash-info.ru/newsreg/media/2025/7/13/arsen-nurbagandov-uchastvuet-v-respublikanskoj-programme-razvitiya-doblest-gor/; «„Работайте, братья!“: каким был Герой России Магомед Нурбагандов», RT на русском, 10.07.2021 — https://russian.rt.com/russia/article/877786-magomed-nurbagandov-geroi-rossii"
        stranica: «Арсен Нурбагандов участвует в республиканской программе развития „Доблесть гор“», «Избербаш-инфо», 13.07.2025
        href: https://russian.rt.com/russia/article/877786-magomed-nurbagandov-geroi-rossii
        otryvok: «Давай застрелим его тоже»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Бандиты пустили слух, что Магомед молил о пощаде, — их собственная запись показала обратное.</b>
        det:
          - "Отец: «нам рассказывали, что бандиты… запустили это видео, где он плачет, просит, умоляет. Мы этому не верили. Магомед так не мог». Эпизод с Магомедом убийцы вырезали из своего ролика. Полную запись нашли в телефоне главаря после спецоперации: «Когда террористы монтировали запись расправ, этот эпизод просто вычеркнули», — сказал глава Дагестана Владимир Васильев."
        src: "Источник: «„Работайте, братья!“: каким был Герой России Магомед Нурбагандов», RT на русском, 10.07.2021 — https://russian.rt.com/russia/article/877786-magomed-nurbagandov-geroi-rossii; «Каким он парнем был», «Российская газета», 10.07.2026 — https://rg.ru/2026/07/10/reg-skfo/rabotajte-bratia-proshlo-10-let-so-dnia-ubijstva-magomeda-nurbagandova.html"
        stranica: "«„Работайте, братья!“: каким был Герой России Магомед Нурбагандов», RT на русском, 10.07.2021"
        href: https://russian.rt.com/russia/article/877786-magomed-nurbagandov-geroi-rossii
        otryvok: «нам рассказывали, что бандиты… запустили это видео, где он плачет, просит, умоляет. Мы этому не верили. Магомед так не мог»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: "<b>Брат Рамазан трижды ранен на СВО и снова идёт на задачи: «Фамилию позорить нельзя».</b>"
        det:
          - "Рамазану было 16, когда убили Магомеда. Теперь он командир отделения, позывной «Камень»: каждый день проходит 14 км за три часа с едой, топливом и боеприпасами для трёх-четырёх позиций. Первое ранение получил, вытаскивая раненого товарища, после третьего — от дрона — вернулся в строй через десять дней. В 2016 году отец обещал президенту: «братья растут… пойдут по стопам своего брата»."
        src: "Источник: «Трижды раненый брат автора фразы „Работайте, братья“ сражается под Добропольем», «Российская газета», 11.08.2026 — https://rg.ru/2026/08/11/reg-dnr/trizhdy-ranenyj-brat-avtora-frazy-rabotajte-bratia-srazhaetsia-pod-dobropolem.html; «„Фамилию позорить нельзя“: брат легендарного полицейского рассказал о боях на передовой», ТВ «Звезда», 10.08.2026 — https://tvzvezda.ru/news/20268101944-ISaDu.html; «Путин назвал лейтенанта полиции Нурбагандова настоящим героем», «Российская газета», 21.09.2016 — https://rg.ru/2016/09/21/putin-nazval-lejtenanta-policii-nurbagandova-nastoiashchim-geroem.html"
        stranica: «Трижды раненый брат автора фразы „Работайте, братья“ сражается под Добропольем», «Российская газета», 11.08.2026
        href: https://rg.ru/2026/08/11/reg-dnr/trizhdy-ranenyj-brat-avtora-frazy-rabotajte-bratia-srazhaetsia-pod-dobropolem.html
        otryvok: «братья растут… пойдут по стопам своего брата»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Арсен убедил бандитов, что телефон с его фото в мундире чужой, и вынес тело брата из леса.</b>
        det:
          - "На заставке найденного у Арсена телефона он был в мундире сотрудника полиции. Он убедил боевиков, что телефон принадлежит другому участнику пикника и пароля он не знает. Бандиты приказали ему отнести тело Магомеда в село. Отец: «Арсен Магомеда на своих плечах притащил». По словам отца, бандиты не знали, что Арсен — курсант-спецназовец: «Если бы знали, его бы не пожалели»."
        src: "Источник: «„Работайте, братья“. Пять лет назад боевики казнили лейтенанта Нурбагандова», «Лента.ру», 10.07.2021 — https://lenta.ru/articles/2021/07/10/bratia/; «„Работайте, братья!“: каким был Герой России Магомед Нурбагандов», RT на русском, 10.07.2021 — https://russian.rt.com/russia/article/877786-magomed-nurbagandov-geroi-rossii; «Арсен Нурбагандов участвует в республиканской программе развития „Доблесть гор“», «Избербаш-инфо», 13.07.2025 — https://izberbash-info.ru/newsreg/media/2025/7/13/arsen-nurbagandov-uchastvuet-v-respublikanskoj-programme-razvitiya-doblest-gor/"
        stranica: «„Работайте, братья“. Пять лет назад боевики казнили лейтенанта Нурбагандова», «Лента.ру», 10.07.2021
        href: https://lenta.ru/articles/2021/07/10/bratia/
        otryvok: «Арсен Магомеда на своих плечах притащил»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Семиклассник перерезал стяжки осколком бутылки и прибежал в село с вестью о расправе.</b>
        det:
          - "Пока Магомеда и Арсена уводили, самый младший племянник остался связанным у палаток. Вдвоём с другим пленником они разбили бутылку и перерезали осколками пластиковые стяжки: «Всё себе расцарапали, руки были в крови, но освободились». Он прибежал к дому Нурбагандовых. «Так мы и узнали об этой трагедии», — вспоминает отец."
        src: "Источник: «„Работайте, братья!“: каким был Герой России Магомед Нурбагандов», RT на русском, 10.07.2021 — https://russian.rt.com/russia/article/877786-magomed-nurbagandov-geroi-rossii"
        stranica: "«„Работайте, братья!“: каким был Герой России Магомед Нурбагандов», RT на русском, 10.07.2021"
