story:
  kicker: Среда подвига
  h2: Сергокала
  abzacy:
    - Магомед Нурбагандов родился в 1985 году и вырос в дагестанском селе Сергокала — райцентре, где живут около девяти тысяч человек. В школе учился на отлично, был капитаном команды КВН, собрал из друзей футбольную команду и окончил школу с золотой медалью. Потом — юридический факультет Дагестанского государственного университета с отличием и работа юристом в банке. <b>Затем он исполнил свою мечту — стал полицейским.</b>
    - С женой Камиллой он учился в одном классе. У них родились сын Нурбаганд и дочь Патимат. В июле 2016 года, в выходные, Магомед с родственниками выехал на пикник в лес на окраине Сергокалы.
