        src: "Источник: «„Работайте, братья“: последние слова… войдут в учебники литературы», «КП — Северный Кавказ», 03.06.2026 — https://www.stav.kp.ru/daily/277788/5258012/; АиФ, 2026, https://aif.ru/society/v-novye-shkolnye-uchebniki-vklyuchili-frazu-rabotayte-bratya"
        stranica: "«„Работайте, братья“: последние слова… войдут в учебники литературы», «КП — Северный Кавказ», 03.06.2026"
