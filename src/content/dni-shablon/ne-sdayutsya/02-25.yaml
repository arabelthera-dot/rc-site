story:
  kicker: Подвиг
  h2: Сергей Солнечников
  abzacy:
  - Первую жизнь Сергей Солнечников спас в 14 лет — вытащил тонущую шестилетнюю девочку из речной воронки на Волге. Потом стал майором и командиром батальона связи. Солдаты звали его «Комбат Солнце».
  - '28 марта 2012 года ребята-срочники впервые метали боевые гранаты. Рядовой Максим Журавлёв бросил РГД-5 неудачно: граната ударилась о край бруствера и скатилась в окоп, где стояло целое отделение. Майор оттолкнул солдата и накрыл гранату собой. В него попало 32 осколка. Он погиб. 3 апреля 2012 года ему присвоено звание Героя России посмертно.'
