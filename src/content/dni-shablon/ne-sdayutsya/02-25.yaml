  transcript:
  - Первую жизнь Сергей Солнечников спас в четырнадцать лет — вытащил тонущую шестилетнюю девочку из речной воронки. Через много лет он стал майором и командиром батальона связи под Белогорском.
  - Двадцать восьмое марта две тысячи двенадцатого года. Первое в батальоне занятие с боевыми гранатами. Граната отскочила назад, в окоп. Она упала в метре от солдат — в окопе стояло целое отделение, около десяти человек.
  - На решение у комбата было четыре секунды — он не потратил ни одной на себя. Солдаты даже не увидели гранату — увидели, как комбат уже лежит на ней. В комбата попало тридцать два осколка.
  - 'Последний статус комбата: «Счастье — когда звезда упала, а загадать-то и нечего». Звезду Героя для комбата попросили матери спасённых срочников. Звание Героя России — через шесть дней после гибели.'
  - 'Солдату грозило пять лет. Родители героя заступились за него: «Если и ему жизнь перечеркнуть — зачем погиб наш сын?» Отец сказал: «Жил бы для себя… а он жил для других — и на гранату эту лёг».'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
