      - summary: "Отряд Володи — рабочие, 17 женщин и трое мальчишек — почти два месяца выстоял под землёй."
        det:
          - "Отряд имени Сталина спустился в Старокарантинские каменоломни 7 ноября 1941 года: 41 человек, в основном рабочие Камыш-Бурунского комбината, «большое число женщин (17 чел.) и трёх подростков». 12 ноября к ним пришёл 31 красноармеец, 29 декабря отряд вышел на поверхность; сам Володя, по «АиФ-Крым», провёл под землёй 50 дней. 13 ноября погиб командир Зябрев, отрядом дальше командовал С. М. Лазарев."
