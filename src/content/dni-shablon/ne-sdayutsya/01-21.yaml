      - summary: "Партизаны полтора суток бились в штольнях: немцы потеряли 80 человек, отряд — одного."
        det:
          - В середине декабря 1941 года немцы сбросили тяжёлые бомбы в два шурфа и пошли под землю, считая, что газ и обвалы уже покончили с отрядом. «Этот бой длился около полутора суток и обошёлся немцам в 80 трупов своих солдат и офицеров. У партизан был убит один человек, ранено трое». После этого немцы в каменоломни больше не спускались.
        src: "Источник: Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026 — https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb; М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 13 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-13-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html"
