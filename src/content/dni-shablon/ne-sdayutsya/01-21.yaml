story:
  kicker: Среда подвига
  h2: Подземный отряд
  abzacy:
    - Володя Дубинин родился 29 августа 1927 года в Керчи, в семье моряка. Его отец, Никифор Дубинин, в Гражданскую войну воевал в партизанском отряде. Володя много читал, строил модели планеров, фотографировал — и вместе с другими мальчишками облазил подземелья Старокарантинских каменоломен.
    - "Когда отца призвали в армию, мать с Володей и его сестрой переехала к родне в район Старый Карантин. Немцы подходили к Керчи, и в городе готовили партизанские отряды: их базами стали каменоломни — подземные выработки, где до войны добывали камень. В начале ноября 1941 года отряд ушёл в Старокарантинские каменоломни. <b>Володя с друзьями упросили командира взять их с собой.</b>"
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Володя Дубинин — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Володя ответил на крик немцев «Русс, сдавайся!» звонким «Партизаны не сдаются!».</b>
        det:
          - Рано утром 18 ноября 1941 года немцы пошли на штурм каменоломен со станковыми пулемётами и ящиками гранат. «— Русс, сдавайся! — послышались голоса. — Партизаны не сдаются! — ответил звонкий голос. Это кричал Володя». Он стоял с Ваней и Толей «с полной сумкой гранат и патронов». «Двое суток длилось это необычайное сражение», штурм отбили.
        src: "Источник: М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 12 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-12-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html"
        stranica: "М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 12"
        href: https://libcat.ru/knigi/proza/detskiaya-proza/418178-12-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html
        otryvok: «— Русс, сдавайся! — послышались голоса.»
        utverzhden: 2026-11-03
      - summary: <b>Газ свалил 32 партизан — Володя с друзьями потребовал поставить их с винтовками на посты.</b>
        det:
          - "Характеристика 1942 года за подписью командира Лазарева и комиссара Котло: «Когда фашистские изверги… применили удушающие газы, было отравлено 32 человека партизан, не хватало бойцов для несения боевой службы. Володя Дубинин со своими бойцами Ваней Грищенко [правильно Гриценко] и Толей Ковалевым потребовал от командования отряда поставить их на посты». Ребята стояли с винтовками, «некоторые из них были отравлены угарными газами». По Вайсману, ребята «днем и ночью стояли они с оружием в руках и зорко охраняли входы»."
        src: "Источник: А. Д. Попов, Е. А. Попова, «Память о пионере-герое Володе Дубинине: формирование исторического образа и формы мемориализации», журнал «Наука. Общество. Оборона», 2024, т. 12, № 2(39) — https://www.noo-journal.ru/vak/2024-2-39/popov-popova-pamyat-o-pionere-geroe-volode-dubinine-formirovanie-istoricheskogo-obraza/; М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 12–13 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-12-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html"
        stranica: "А. Д. Попов, Е. А. Попова, «Память о пионере-герое Володе Дубинине: формирование исторического образа и формы мемориализации», журнал «Наука. Общество. Оборона», 2024, т. 12, № 2(39)"
        href: https://www.noo-journal.ru/vak/2024-2-39/popov-popova-pamyat-o-pionere-geroe-volode-dubinine-formirovanie-istoricheskogo-obraza/
        otryvok: «Когда фашистские изверги… применили удушающие газы, было отравлено 32 человека партизан, не хватало бойцов для несения боевой службы. Володя Дубинин со своими бойцами Ваней Грищенко [правильно Гриценко. – авт.] и Толей Ковалевым потребовал от командования отряда поставить их на посты.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Володя днём прошёл немецкие посты и предупредил отряд: каменоломни будут топить.</b>"
        det:
          - "По старой странице это было в декабре 1941 года. Ждать темноты было некогда: до затопления оставались часы. Партизаны за двое суток поставили защитные стенки, вода поднималась почти до пояса, но отряд уцелел. Затопление подтверждают документы: местный пособник Фирсов, по протоколам УФСБ, «участвовал в организации насосных станций для заливания шахт морской водой». Подробности с плотинами — из повести Кассиля и Поляновского, сам факт предупреждения есть в «Летописи мужества»."
        src: "Источник: «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека — https://letopis-muzhestva.rgdb.ru/volodya-dubinin; Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026 — https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb; И. Н. Втюрина, «Организация партизанской деятельности на территории Керченского полуострова в ноябре – декабре 1941 г.», «Ноябрьские историко-архивные чтения» 2019, Пермский государственный архив социально-политической истории — https://www.permgaspi.ru/deyatelnost/november-readings/noyabrskie-istoriko-arhivnye-chteniya-v-permskom-partarhive-v-2019-godu/materialy-nauchnoj-konferentsiii-noyabrskie-istoriko-arhivnye-chteniya-2019-g/organizatsiya-partizanskoj-deyatelnosti-na-territorii-kerchenskogo-poluostrova-v-noyabre-dekabre-1941-g.html; Л. Кассиль, М. Поляновский, «Улица младшего сына» — http://militera.lib.ru/prose/russian/kassil_la01/text.html"
        stranica: «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека
        href: https://letopis-muzhestva.rgdb.ru/volodya-dubinin
        otryvok: «Во время одной из разведок узнал, что немцы собираются затопить каменоломни. Рискуя жизнью, в дневное время прошёл вражеские посты и предупредил партизан об опасности, спас тем самым жизнь отряду.»
        utverzhden: 2026-11-03
      - summary: <b>Стоя на посту, Володя подорвал мину и обрушил ход, по которому шли предатели с немцами.</b>
        det:
          - "Партизан Яков Манто вспоминал в «Керченском рабочем» в 1957 году: Дубинин «не растерялся во время дежурства на посту и взорвал мину, обрушив ход, когда туда явились предатели с немецкими солдатами за спиной». Вырезка хранится в Крымской республиканской научной библиотеке «Таврика». Что пособники водили немцев под землю, подтверждают протоколы УФСБ."
        src: "Источник: Н. Дремова, «Пятнадцать лет и вечность. Как Кассиль написал „Улицу младшего сына“», «АиФ-Крым», 16.08.2026 — https://krym.aif.ru/society/pyatnadcat-let-i-vechnost-kak-kassil-napisal-ulicu-mladshego-syna; Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026 — https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb"
        stranica: Н. Дремова, «Пятнадцать лет и вечность. Как Кассиль написал „Улицу младшего сына“», «АиФ-Крым», 16.08.2026
        href: https://krym.aif.ru/society/pyatnadcat-let-i-vechnost-kak-kassil-napisal-ulicu-mladshego-syna
        otryvok: «Дубинин не растерялся во время дежурства на посту и взорвал мину, обрушив ход, когда туда явились предатели с немецкими солдатами за спиной.»
        utverzhden: 2026-11-03
      - summary: <b>Володя пролезал в лазы, куда взрослый не протиснется, — и стал командиром группы юных партизан.</b>
        det:
          - Немцы блокировали выходы и заливали щели цементом. Друзья Толя Ковалёв и Ваня Гриценко отвлекали часовых, Володя выбирался наверх и запоминал, где стоят немецкие части и сколько в них солдат, приносил воду и еду. В характеристике 1942 года он «был назначен командиром группы юных партизан», срок службы — «с 11 ноября по 31 декабря 1941 года».
        src: "Источник: «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека — https://letopis-muzhestva.rgdb.ru/volodya-dubinin; А. Д. Попов, Е. А. Попова, «Память о пионере-герое Володе Дубинине: формирование исторического образа и формы мемориализации», журнал «Наука. Общество. Оборона», 2024, т. 12, № 2(39) — https://www.noo-journal.ru/vak/2024-2-39/popov-popova-pamyat-o-pionere-geroe-volode-dubinine-formirovanie-istoricheskogo-obraza/; М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 8 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-8-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html"
        stranica: «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека
        href: https://letopis-muzhestva.rgdb.ru/volodya-dubinin
        otryvok: «Володя был маленького роста, поэтому мог выбираться по очень узким лазам.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-21-goskatalog-3020725.jpg
          alt: Портретная фотография мальчика с зачёсанными назад волосами, в светлой рубашке
          data_source: https://goskatalog.ru/portal/#/collections?id=6979677
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Фотография «Володя Дубинин — Герой Советского Союза, пионер-партизан» (автор Н. Науменков), так она названа в карточке музея.
          credit: Государственный музей политической истории России, КП-7601/10 (инв. Ф.III-23026)
          width: 604
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Володя разведал немецкий штаб, и первая же вылазка отряда ударила по нему гранатами.</b>
        det:
          - "По каталогу «Памятники Крыма», первая операция отряда прошла в ночь на 13 ноября 1941 года: по разведданным Володи установили, где штаб вражеской части, и группа А. Ф. Зябрева забросала его гранатами. Зябрев погиб, последний приказ: «Закончить операцию, скрыться в каменоломни». Как пишет АиФ, партизан Яков Манто вспоминал, как Володя разведал немецкий штаб, туда наведались партизаны, и в неразберихе немцы устроили перестрелку друг с другом."
        src: "Источник: Н. Дремова, «Пятнадцать лет и вечность. Как Кассиль написал „Улицу младшего сына“», «АиФ-Крым», 16.08.2026 — https://krym.aif.ru/society/pyatnadcat-let-i-vechnost-kak-kassil-napisal-ulicu-mladshego-syna; «Братская могила партизан Старокарантинских каменоломен, 1941 г.», каталог «Памятники Крыма» — https://crimean-monuments.ru/monument/474-bratskaya-mogila-partizan-starokarantinskih-kamenolomen-1941-g; И. Н. Втюрина, «Организация партизанской деятельности на территории Керченского полуострова в ноябре – декабре 1941 г.», «Ноябрьские историко-архивные чтения» 2019, Пермский государственный архив социально-политической истории — https://www.permgaspi.ru/deyatelnost/november-readings/noyabrskie-istoriko-arhivnye-chteniya-v-permskom-partarhive-v-2019-godu/materialy-nauchnoj-konferentsiii-noyabrskie-istoriko-arhivnye-chteniya-2019-g/organizatsiya-partizanskoj-deyatelnosti-na-territorii-kerchenskogo-poluostrova-v-noyabre-dekabre-1941-g.html; М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 10 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-10-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html"
        stranica: «Братская могила партизан Старокарантинских каменоломен, 1941 г.», каталог «Памятники Крыма»
        href: https://crimean-monuments.ru/monument/474-bratskaya-mogila-partizan-starokarantinskih-kamenolomen-1941-g
        otryvok: «По разведданным юного партизана Володи Дубинина, было установлено точное местоположение штаба одной из части врага. Партизаны группы А.Ф. Зябрева забросали штаб гранатами, уничтожив при этом несколько вражеских солдат и офицеров.»
        utverzhden: 2026-11-03
      - summary: <b>Володя в бою встал на место раненого бойца — немцы ушли, бросив тело своего обер-лейтенанта.</b>
        det:
          - По книге 1945 года это было 18 ноября, бой шёл двое суток (на старой странице — декабрь). Когда рядом с командиром выбыл боец, Володя «попросил разрешения заменить раненого бойца», стрелял из карабина и подносил патроны. Немцы ушли, «не сумев даже убрать всех трупов, в том числе труп обер-лейтенанта Рудольфа Вернера». По отчёту отряда, при первой попытке немцев войти в каменоломни был убит немецкий офицер, его документы передали в горотдел НКВД; тот ли это Вернер, документом не подтверждено.
        src: "Источник: М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 12 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-12-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html; И. Н. Втюрина, «Организация партизанской деятельности на территории Керченского полуострова в ноябре – декабре 1941 г.», «Ноябрьские историко-архивные чтения» 2019, Пермский государственный архив социально-политической истории — https://www.permgaspi.ru/deyatelnost/november-readings/noyabrskie-istoriko-arhivnye-chteniya-v-permskom-partarhive-v-2019-godu/materialy-nauchnoj-konferentsiii-noyabrskie-istoriko-arhivnye-chteniya-2019-g/organizatsiya-partizanskoj-deyatelnosti-na-territorii-kerchenskogo-poluostrova-v-noyabre-dekabre-1941-g.html; «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека — https://letopis-muzhestva.rgdb.ru/volodya-dubinin"
        stranica: "М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 12"
        href: https://libcat.ru/knigi/proza/detskiaya-proza/418178-12-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html
        otryvok: «Боеприпасов накопилось много, и юный партизан попросил разрешения заменить раненого бойца. Командир позволил ему.»
        utverzhden: 2026-11-03
      - summary: "<b>Партизаны полтора суток бились в штольнях: немцы потеряли 80 человек, отряд — одного.</b>"
        det:
          - В середине декабря 1941 года немцы сбросили тяжёлые бомбы в два шурфа и пошли под землю, считая, что газ и обвалы уже покончили с отрядом. «Этот бой длился около полутора суток и обошёлся немцам в 80 трупов своих солдат и офицеров. У партизан был убит один человек, ранено трое». После этого немцы в каменоломни больше не спускались. У Вайсмана — «более 80 солдат и офицеров убитыми и ранеными».
        src: "Источник: Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026 — https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb; М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 13 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-13-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html"
        stranica: "Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026"
        href: https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb
        otryvok: «Этот бой длился около полутора суток и обошелся немцам в 80 трупов своих солдат и офицеров. У партизан был убит один человек, ранено трое.»
        utverzhden: 2026-11-03
      - summary: "<b>Отряд не поддался на крик «Выходите, партизаны!»: впереди немцев шли предатели в нашей форме.</b>"
        det:
          - "Отчёт отряда, январь 1942 года: «Около роты фашистских мародёров, впереди которых шли русские провокаторы, переодетые в красноармейскую и краснофлотскую одежду, начали кричать: „Выходите, партизаны, вам ничего не будет, немцы хорошо обращаются и не будут расстреливать вас“». Это было 18 ноября 1941 года в главном проходе. Никто не вышел, ловушка не сработала."
        src: "Источник: Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026 — https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb"
        stranica: "Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026"
        href: https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb
        otryvok: "«Около роты фашистских мародеров, впереди которых шли русские провокаторы, переодетые в красноармейскую и краснофлотскую одежду, начали кричать: «Выходите, партизаны, вам ничего не будет, немцы хорошо обращаются и не будут расстреливать вас»…»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Володя погиб в освобождённой Керчи на мине у входа, под которую бурил камень предатель Фирсов.</b>
        det:
          - 4 января 1942 года, уже после освобождения города, Володя помогал сапёрам разминировать вход в каменоломни; взрыв около 10 утра убил его и четверых сапёров. Как пишет АиФ по рассекреченным документам, Фирсов «у входов бурил камень для закладки взрывчатки и мин. На одной из них после освобождения Керчи подорвался Володя Дубинин». Похоронили в братской партизанской могиле в посёлке Аршинцево, примерно в 2 км от входа.
        src: "Источник: Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026 — https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb; Н. Дремова, «Пятнадцать лет и вечность. Как Кассиль написал „Улицу младшего сына“», «АиФ-Крым», 16.08.2026 — https://krym.aif.ru/society/pyatnadcat-let-i-vechnost-kak-kassil-napisal-ulicu-mladshego-syna; А. Д. Попов, Е. А. Попова, «Память о пионере-герое Володе Дубинине: формирование исторического образа и формы мемориализации», журнал «Наука. Общество. Оборона», 2024, т. 12, № 2(39) — https://www.noo-journal.ru/vak/2024-2-39/popov-popova-pamyat-o-pionere-geroe-volode-dubinine-formirovanie-istoricheskogo-obraza/; «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека — https://letopis-muzhestva.rgdb.ru/volodya-dubinin"
        stranica: "Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026"
        href: https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb
        otryvok: «Он активно помогал немцам, участвовал в организации насосных станций для заливания шахт морской водой, у входов бурил камень для закладки взрывчатки и мин. На одной из них после освобождения Керчи подорвался Володя Дубинин»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Возвращаясь из разведки, Володя перерезал немецкий телефонный кабель в четырёх местах.</b>
        det:
          - Володя с Толей Ковалёвым заметили у шоссе «несколько красных, зелёных и серых проводов». На обратном пути мальчишки «острыми ножами перерезали провода в четырёх местах. Захватили с собой огромный свёрток проводов и быстро ушли». Той же ночью Володя один прополз к входам и высмотрел немецкие пулемётные гнёзда; часовой с фонарём прошёл мимо и не заметил его. Эпизод из очерка 1945 года.
        src: "Источник: М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 11–12 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-11-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html; https://libcat.ru/knigi/proza/detskiaya-proza/418178-12-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html"
        stranica: "М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 11–12"
        href: https://libcat.ru/knigi/proza/detskiaya-proza/418178-12-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html
        otryvok: «Бесшумно они острыми ножами перерезали провода в четырех местах.»
        utverzhden: 2026-11-03
      - summary: <b>Мальчишки напросились в отряд — и под снарядами довезли гранаты, за которыми не дошли взрослые.</b>
        det:
          - "В начале ноября 1941 года отряд уходил в Старокарантинские каменоломни, Володя с друзьями упросили командира Зябрева взять их. На складе в простреливаемом районе остались ящики с гранатами, посланные взрослые «вернулись без ящиков». Первым вызвался Володя: «На то мы и партизаны, чтобы не бояться». Ребята с тележкой пошли через посёлок под обстрелом, и «через три часа ящики с гранатами были доставлены в каменоломни»."
        src: "Источник: М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 6–7 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-7-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html; «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека — https://letopis-muzhestva.rgdb.ru/volodya-dubinin"
        stranica: "М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 6–7"
        href: https://libcat.ru/knigi/proza/detskiaya-proza/418178-7-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html
        otryvok: «— Кто добровольно пойдет за гранатами? — спросил он.»
        utverzhden: 2026-11-03
      - summary: "<b>Двое жителей пробрались к отряду узким заминированным входом, чтобы сказать: Керчь свободна.</b>"
        det:
          - Под Новый, 1942 год Керчь освободил десант Керченско-Феодосийской операции, а десантники, по Вайсману, прошли над каменоломнями и не знали о партизанах. «Двое жителей Старого Карантина, рискуя взорваться на минах, проникли через один из самых узких входов совместно с двумя бойцами Красной Армии и сообщили партизанам, что они освобождены». «От радости и счастья Володя плакал», первыми наверх вышли мальчишки-разведчики. По Втюриной, «в конце декабря разведчик В. Дубинин сообщил об освобождении… Камыш-Буруна».
        src: "Источник: М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 14 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-14-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html; Н. Дремова, «Пятнадцать лет и вечность. Как Кассиль написал „Улицу младшего сына“», «АиФ-Крым», 16.08.2026 — https://krym.aif.ru/society/pyatnadcat-let-i-vechnost-kak-kassil-napisal-ulicu-mladshego-syna; И. Н. Втюрина, «Организация партизанской деятельности на территории Керченского полуострова в ноябре – декабре 1941 г.», «Ноябрьские историко-архивные чтения» 2019, Пермский государственный архив социально-политической истории — https://www.permgaspi.ru/deyatelnost/november-readings/noyabrskie-istoriko-arhivnye-chteniya-v-permskom-partarhive-v-2019-godu/materialy-nauchnoj-konferentsiii-noyabrskie-istoriko-arhivnye-chteniya-2019-g/organizatsiya-partizanskoj-deyatelnosti-na-territorii-kerchenskogo-poluostrova-v-noyabre-dekabre-1941-g.html; «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека — https://letopis-muzhestva.rgdb.ru/volodya-dubinin"
        stranica: "М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 14"
        href: https://libcat.ru/knigi/proza/detskiaya-proza/418178-14-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html
        otryvok: «Двое жителей Старого Карантина, рискуя взорваться на минах, проникли через один из самых узких входов совместно с двумя бойцами Красной Армии и сообщили партизанам»
        utverzhden: 2026-11-03
      - summary: <b>Керчь назвала улицу именем Володи 2 марта 1942-го — назавтра после приказа о его ордене.</b>
        det:
          - "Приказом войскам Крымского фронта № 0306 от 1 марта 1942 года Володю посмертно наградили орденом Красного Знамени (ЦАМО, ф. 33, оп. 682524, д. 602, л. 369). 2 марта исполком горсовета переименовал Крестьянскую улицу в улицу Володи Дубинина и дал его имя школе № 11. Попов: «По всей видимости, это был первый в СССР случай переименования улицы в честь пионера-героя». В 1949 году Кассиль и Поляновский закончили повесть «Улица младшего сына», опросив 28 свидетелей, а в 1951-м на свои деньги отлили и привезли в Керчь бронзовый бюст весом более 220 кг."
        src: "Источник: А. Д. Попов, Е. А. Попова, «Память о пионере-герое Володе Дубинине: формирование исторического образа и формы мемориализации», журнал «Наука. Общество. Оборона», 2024, т. 12, № 2(39) — https://www.noo-journal.ru/vak/2024-2-39/popov-popova-pamyat-o-pionere-geroe-volode-dubinine-formirovanie-istoricheskogo-obraza/; М. Вайсман, «Пионер-партизан Володя Дубинин», Симферополь: Красный Крым, 1945, стр. 15 — https://libcat.ru/knigi/proza/detskiaya-proza/418178-15-m-vajsman-pioner-partizan-volodya-dubinin-ocherk.html; Н. Дремова, «Пятнадцать лет и вечность. Как Кассиль написал „Улицу младшего сына“», «АиФ-Крым», 16.08.2026 — https://krym.aif.ru/society/pyatnadcat-let-i-vechnost-kak-kassil-napisal-ulicu-mladshego-syna"
        stranica: "А. Д. Попов, Е. А. Попова, «Память о пионере-герое Володе Дубинине: формирование исторического образа и формы мемориализации», журнал «Наука. Общество. Оборона», 2024, т. 12, № 2(39)"
        href: https://www.noo-journal.ru/vak/2024-2-39/popov-popova-pamyat-o-pionere-geroe-volode-dubinine-formirovanie-istoricheskogo-obraza/
        otryvok: «Ещё 2 марта 1942 г. Исполком Керченского городского совета принял решение о переименовании улицы Крестьянской в улицу имени Володи Дубинина (15).»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-21-goskatalog-18448984.jpg
          alt: "Разворот буклета: слева портрет мальчика с подписью «Володя Дубинин», справа заголовок «Керченский пионер-герой Володя Дубинин» и текст"
          data_source: https://goskatalog.ru/portal/#/collections?id=18448984
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Буклет «Керченский пионер-герой Володя Дубинин», изданный в Керчи в 1967 году.
          credit: Мемориальный музей А. П. Гайдара — филиал Курского областного краеведческого музея, ЛЛММГ 3480 (инв. ПП 179)
          width: 800
          height: 568
        utverzhden: 2026-11-03
      - summary: <b>Отряд Володи — рабочие, 17 женщин и трое мальчишек — почти два месяца держался под землёй.</b>
        det:
          - "Отряд имени Сталина спустился в Старокарантинские каменоломни 7 ноября 1941 года: 41 человек, в основном рабочие Камыш-Бурунского комбината, «большое число женщин (17 чел.) и трёх подростков». 12 ноября к ним пришёл 31 красноармеец, 29 декабря отряд вышел на поверхность; сам Володя, по «АиФ-Крым», провёл под землёй 50 дней. 13 ноября погиб командир Зябрев, отрядом дальше командовал С. М. Лазарев. Отряд Володи часто путают с соседним отрядом в Аджимушкайских каменоломнях. Источники называют Володю разведчиком и связным, о том, что он «выводил отряды», не пишут."
        src: "Источник: И. Н. Втюрина, «Организация партизанской деятельности на территории Керченского полуострова в ноябре – декабре 1941 г.», «Ноябрьские историко-архивные чтения» 2019, Пермский государственный архив социально-политической истории — https://www.permgaspi.ru/deyatelnost/november-readings/noyabrskie-istoriko-arhivnye-chteniya-v-permskom-partarhive-v-2019-godu/materialy-nauchnoj-konferentsiii-noyabrskie-istoriko-arhivnye-chteniya-2019-g/organizatsiya-partizanskoj-deyatelnosti-na-territorii-kerchenskogo-poluostrova-v-noyabre-dekabre-1941-g.html; Н. Дремова, «Каменоломни Крыма. Кто предал подземный отряд: рассекреченные документы ФСБ», «АиФ-Крым», 16.06.2026 — https://krym.aif.ru/society/kamenolomni-kryma-kto-predal-podzemnyy-otryad-rassekrechennye-dokumenty-fsb; Н. Дремова, «Пятнадцать лет и вечность. Как Кассиль написал „Улицу младшего сына“», «АиФ-Крым», 16.08.2026 — https://krym.aif.ru/society/pyatnadcat-let-i-vechnost-kak-kassil-napisal-ulicu-mladshego-syna; «Володя Дубинин», «Летопись мужества», Российская государственная детская библиотека — https://letopis-muzhestva.rgdb.ru/volodya-dubinin"
