audioguide:
  audioSrc: audio-guide-dubinin-ru.mp3
  durationLabel: 1 минута 22 секунды
  lead: "Голос ведёт от входа в каменоломни через узкий лаз и посты наверху — к минному полю у входа: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Вход в каменоломни
    - t: 14
      mark: 0:14
      title: Узкий лаз
    - t: 31
      mark: 0:31
      title: Мимо постов
    - t: 43
      mark: 0:43
      title: Плотины
    - t: 61
      mark: 1:01
      title: Минное поле
  transcript:
    - "В начале ноября тысяча девятьсот сорок первого года, когда немцы подходили к Керчи, партизанский отряд ушёл в Старокарантинские каменоломни. Четырнадцатилетний Володя Дубинин с друзьями упросили командира взять их с собой."
    - "Немцы блокировали выходы и заливали щели цементом. В оставшиеся лазы мог протиснуться только маленький Володя. Наверху он запоминал, где стоят немецкие части и сколько в них солдат, и приносил в отряд эти сведения, воду и еду."
    - "В разведке он узнал, что немцы решили затопить каменоломни и до начала остались часы. Днём, почти на виду у патрулей, Володя прошёл вражеские посты и предупредил отряд."
    - "Партизаны возводили защитные стенки и заделывали отверстия. Вода поднималась почти до пояса, но за двое суток плотины были готовы, и отряд уцелел. А в декабрьском бою в штольнях Володя подносил боеприпасы и заменил тяжелораненого бойца."
    - "Под Новый год Керчь освободил советский десант. Подходы к каменоломням были заминированы, и Володя вызвался помогать сапёрам. Четвёртого января тысяча девятьсот сорок второго года у входа взорвалась мина: погибли четверо сапёров и Володя Дубинин. Он посмертно награждён орденом Красного Знамени."
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
