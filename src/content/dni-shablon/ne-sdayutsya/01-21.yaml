quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — В Старокарантинских; 2 — Он был маленького роста и пролезал в узкие лазы; 3 — Немцы собираются затопить каменоломни; 4 — Помогая сапёрам разминировать подходы к каменоломням; 5 — Орденом Красного Знамени."
  ball: 10
  voprosy:
    - q: В каких каменоломнях воевал отряд Володи Дубинина?
      o:
        - В Аджимушкайских
        - В Старокарантинских
        - В Инкерманских
        - В Херсонесских
      a: 1
      e: Отряд ушёл в Старокарантинские каменоломни на востоке Керчи. В соседних Аджимушкайских стоял другой партизанский отряд — их часто путают.
    - q: Почему наверх в разведку чаще всех ходил именно Володя?
      o:
        - Он один знал немецкий язык
        - Его назначили командиром разведки
        - Он был маленького роста и пролезал в узкие лазы
        - У него был пропуск от немцев
      a: 2
      e: Немцы блокировали выходы и заливали щели цементом. В оставшиеся узкие лазы мог протиснуться только маленький и юркий Володя.
    - q: О чём Володя узнал в разведке и успел предупредить отряд?
      o:
        - Немцы собираются затопить каменоломни
        - В город вошёл советский десант
        - Отряду сбросят оружие с самолёта
        - Немцы уходят из Керчи
      a: 0
      e: Узнав о плане затопить каменоломни, он днём, почти на виду у патрулей, прошёл вражеские посты и предупредил партизан. Те за двое суток возвели плотины.
    - q: Как погиб Володя Дубинин?
      o:
        - В бою в штольнях
        - При переходе линии фронта
        - В немецком плену
        - Помогая сапёрам разминировать подходы к каменоломням
      a: 3
      e: "4 января 1942 года, уже после освобождения Керчи, у входа в каменоломни взорвалась мина: погибли четверо сапёров и Володя."
    - q: Какой наградой Володя Дубинин награждён посмертно?
      o:
        - Медалью «За отвагу»
        - Орденом Красного Знамени
        - Званием Героя Советского Союза
        - Орденом Славы
      a: 1
      e: Володю Дубинина посмертно наградили орденом Красного Знамени; об этом в 1942 году писала «Пионерская правда».
