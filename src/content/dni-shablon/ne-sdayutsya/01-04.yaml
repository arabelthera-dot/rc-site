      o: [Семь, Пять, Две, Три]
      a: 0
      e: Семь недель. Рязань пала за пять дней, Владимир — за шесть, а Козельск держался дольше всех городов нашествия.
    - q: Что решили жители на вече?
      o: [Не сдаваться, Сдаться, Уйти в леса, Позвать помощь]
      a: 0
      e: Не вдатися Батыю — не сдаваться, хоть князь и был совсем юн. За веру и за отрока-князя положили жизнь.
    - q: Что сделали защитники во время вылазки?
      o: [Разрушили камнемёты, Открыли ворота, Сожгли город, Ушли в степь]
      a: 0
      e: Иссекли осадные машины — «пращи», и, по летописи, перебили до четырёх тысяч врагов. Сами полегли все.
    - q: Как Батый велел называть Козельск?
      o: [Злым городом, Непобедимым, Мёртвым, Святым]
      a: 0
      e: Не иначе как «злым городом» — под его стенами пали три сына темников.
    - q: Куда Батый ушёл после Козельска?
      o: [В степь, На Новгород, На Киев, Обратно в степи Монголии]
      a: 0
      e: В Половецкую степь, не дойдя до Новгорода. Распутица и истощённое войско — но и семь недель под стенами одного города дорого стоили.
