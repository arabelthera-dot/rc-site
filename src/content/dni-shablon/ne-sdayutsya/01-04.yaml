story:
  kicker: Подвиг · 6 ударов
  h2: Семь недель, которых не должно было быть
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Весной 1238 года, после Рязани и Владимира, орда Батыя подошла к малому городу Козельску на Жиздре.
      det:
        - "Зимой орда прошла по Руси огнём. В декабре 1237 года Батый взял Рязань за пять дней; 7 февраля 1238 года пал стольный Владимир. 4 марта на реке Сити погиб великий князь Юрий Всеволодович — Северо-Восточная Русь была разорена, путь орде, казалось, открыт."
        - Городок невелик, но место крепкое — холм в междуречье Жиздры и Другусны, ров, а весенний разлив делает его почти островом.
      src: "Источники: Ипатьевская (Галицко-Волынская) летопись; Каргалов В. В. «Конец ордынского ига» (militera.lib.ru)."
    - summary: В городе княжил отрок Василий — летопись зовёт его «юным», учёные считают, что ему было около двенадцати лет.
      det:
        - "Положение было то, в котором города сдаются: Рязань сожжена, Владимир пал, помощи ждать неоткуда."
      src: "Источник: Ипатьевская (Галицко-Волынская) летопись."
    - summary: Жители собрались на вече и постановили не вдатися Батыю — положить жизнь за отрока-князя.
      det:
        - "Открыть ворота, уйти в леса или держаться — вече прошло по каждой дороге до конца. «Хоть князь наш молод, — сказали козляне, — но положим жизнь свою за него». Не за победу — победы не ждали. За то, чтобы не сдаться."
      src: "Источник: Ипатьевская летопись — по ИРЛИ РАН «Библиотека литературы Древней Руси»."
    - summary: Батый застрял под стенами на семь недель, а защитники сами выходили на вылазки.
      det:
        - "В вылазке козляне иссекли камнемётные орудия — «пращи», ломавшие их стены, и, по летописи, перебили до четырёх тысяч врагов. Сами полегли все."
        - Персидский историк Рашид-ад-Дин, служивший ханам, записал, что город не могли взять два месяца, пока не подоспели отряды Кадана и Бури.
      src: "Источники: Ипатьевская летопись; Рашид-ад-Дин «Сборник летописей» — в передаче Каргалова В. В."
    - summary: Когда город пал, Батый велел не щадить никого и звать Козельск «злым городом».
      det:
        - "Приказ был — «до ссущих млеко», до грудных младенцев. Под стенами пали три сына темников, и тел их не нашли среди множества трупов."
      src: "Источник: Ипатьевская летопись."
    - summary: После Козельска Батый ушёл в Половецкую степь, не дойдя до Новгорода.
      det:
        - "Суть не зависит от числа убитых: город, которому расчёт велел сдаться, выбрал не сдаться. Не ради победы — ради того, чтобы остаться собой."
        - В те же годы в Европе правил император Фридрих II и шла его борьба с папством; Запад ещё не осознал масштаб угрозы, пришедшей с востока.
      src: "Источники: Ипатьевская летопись; Каргалов В. В. «Конец ордынского ига»."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов об обороне Козельска
    h2: Малый город против орды
    udary:
      - summary: "<b>Рязань держалась пять дней, Владимир — шесть, а малый Козельск — семь недель.</b>"
        det:
          - Козельск держал всю орду дольше любого города нашествия. По расчёту он должен был пасть за считанные дни.
        src: "Источники: Ипатьевская (Галицко-Волынская) летопись; Рашид-ад-Дин «Сборник летописей» — в передаче Каргалова В. В."
        pometka: два источника
      - summary: "<b>Козельск стоял на холме между Жиздрой и Другусной, и весной разлив делал его почти островом.</b>"
        det:
          - Городок был невелик, но место крепкое — холм в междуречье, ров и весенняя вода вокруг.
        src: "Источник: Каргалов В. В. «Конец ордынского ига» (militera.lib.ru)."
      - summary: "<b>Князю Козельска Василию было около двенадцати лет — летопись зовёт его «юным».</b>"
        det:
          - Возраст летописец не называет; около двенадцати лет — оценка учёных.
        src: "Источник: Ипатьевская (Галицко-Волынская) летопись."
      - summary: "<b>Вече решило «не вдатися Батыю» — не сдаваться, хоть князь и совсем юн.</b>"
        det:
          - "Открыть ворота значило остаться в живых, уйти в леса — спастись многим. Козляне выбрали третью дорогу: держаться за веру и за отрока-князя, которого больше некому защитить."
        src: "Источник: Ипатьевская летопись — по ИРЛИ РАН «Библиотека литературы Древней Руси»."
        otryvok: "«Жители же Козельска совет сотворили — не вдатися Батыю, сказав: „Хоть князь наш молод, но положим жизнь свою за него“»."
      - summary: "<b>В вылазке козляне «иссекли пращи» — изрубили камнемёты, ломавшие их стены.</b>"
        det:
          - Защитники не ждали штурма за стенами — сами выходили из города и резались с врагом у осадных машин.
        src: "Источник: Ипатьевская летопись."
        kadr:
          src: /muzei/ne-sdayutsya/kozelsk-miniatura-2-vylazka.jpg
          width: 1600
          height: 2216
          klass: portret
          alt: "Миниатюра Лицевого летописного свода: горожане Козельска выходят из ворот и бьются с татарами"
          data_source: "Российская национальная библиотека, Отдел рукописей, Голицынский том Лицевого летописного свода, F.IV.225"
          license: общественное достояние (рукопись 1560–1570-х годов)
          podpis: "Лицевой летописный свод, XVI век — «Горожане выходят против татар»."
          credit: "Миниатюрист Лицевого летописного свода, 1560–1570-е. Хранится: Федеральное государственное бюджетное учреждение «Российская национальная библиотека», Отдел рукописей, Голицынский том Лицевого летописного свода, F.IV.225. Общественное достояние."
      - summary: "<b>По летописи, в той вылазке пало до четырёх тысяч врагов, а сами защитники полегли все.</b>"
        det:
          - Цифра потерь осаждавших, скорее всего, завышена, как обычно в летописных рассказах о битвах. Сам факт вылазки и уничтожения осадных машин сомнений не вызывает.
        src: "Источник: Ипатьевская летопись."
      - summary: "<b>Рашид-ад-Дин, историк монгольских ханов, записал: город не могли взять два месяца.</b>"
        det:
          - Взгляд со стороны осаждающих — вражеский источник сам засвидетельствовал, что малый город держался непривычно долго.
        src: "Источник: Рашид-ад-Дин «Сборник летописей» — в передаче Каргалова В. В. «Конец ордынского ига» (militera.lib.ru)."
      - summary: "<b>Взять Козельск Батый смог, только когда к нему подошли отряды Кадана и Бури.</b>"
        det:
          - Своих сил под стенами не хватило — понадобились новые отряды.
        src: "Источник: Рашид-ад-Дин «Сборник летописей» — в передаче Каргалова В. В."
      - summary: "<b>Под стенами Козельска пали три сына татарских темников, и тел их не нашли.</b>"
        det:
          - Их не смогли отыскать среди множества погибших. Малый город дорого обошёлся осаждавшим.
        src: "Источник: Ипатьевская летопись."
      - summary: "<b>Батый велел звать Козельск не иначе как «злым городом».</b>"
        det:
          - Формула «злой город» пришла из русской летописи, а не из монгольского документа; был ли это буквальный приказ Батыя — проверить нечем. Но что враг запомнил этот город особо, подтверждает и Рашид-ад-Дин.
        src: "Источники: Ипатьевская летопись; Рашид-ад-Дин «Сборник летописей»."
        kadr:
          src: /muzei/ne-sdayutsya/img/01-04-goskatalog-50086505.jpg
          width: 800
          height: 479
          alt: Памятная медаль «Героическая оборона Козельска в 1238 г.»
          data_source: https://goskatalog.ru/portal/#/collections?id=50086505
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Памятная медаль «Героическая оборона Козельска в 1238 г.»
          credit: "Фото: Лобода В. В., 2024. Хранится: Федеральное государственное бюджетное учреждение культуры «Государственный военно-исторический и природный музей-заповедник «Куликово поле»». Госкаталог музейного фонда РФ, № 50086505."
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Цена и память
    udary:
      - summary: "<b>Взяв город, Батый велел не щадить никого — «до ссущих млеко», до грудных младенцев.</b>"
        det:
          - Так летописец передаёт приказ о расправе после падения Козельска.
        src: "Источник: Ипатьевская летопись."
        otryvok: "«до ссущих млеко»"
      - summary: "<b>О гибели юного князя летописец пишет с оговоркой — «инии глаголаху».</b>"
        det:
          - Некоторые говорили, что Василий утонул в крови, потому что был молод. Это не утверждение, а народная молва, записанная летописцем; точная судьба князя неизвестна.
        src: "Источник: Ипатьевская летопись."
        otryvok: "«инии же глаголаху, яко в крови утонул, понеже был молод»"
        pometka: легенда
      - summary: "<b>После Козельска Батый ушёл в Половецкую степь, так и не дойдя до Новгорода.</b>"
        det:
          - Причина — распутица и истощённое войско. Но и семь недель под стенами одного города ему дорого стоили.
        src: "Источник: Каргалов В. В. «Конец ордынского ига» (militera.lib.ru)."
        kadr:
          src: /muzei/ne-sdayutsya/kozelsk-miniatura-3-step.jpg
          width: 1600
          height: 2033
          klass: portret
          alt: "Миниатюра Лицевого летописного свода: войско Батыя уходит от взятого Козельска в степь"
          data_source: "Российская национальная библиотека, Отдел рукописей, Голицынский том Лицевого летописного свода, F.IV.225"
          license: общественное достояние (рукопись 1560–1570-х годов)
          podpis: "Лицевой летописный свод, XVI век — «Взяв Козельск, хан Батый идёт в Половецкую землю»."
          credit: "Миниатюрист Лицевого летописного свода, 1560–1570-е. Хранится: Федеральное государственное бюджетное учреждение «Российская национальная библиотека», Отдел рукописей, Голицынский том Лицевого летописного свода, F.IV.225. Общественное достояние."
      - summary: "<b>Об осаде рассказывают три независимых источника — две русские летописи и персидский историк.</b>"
        det:
          - Ипатьевская (Галицко-Волынская) летопись, Никоновская летопись и Рашид-ад-Дин, служивший монгольским ханам. Оборона Козельска весной 1238 года — исторический факт.
        src: "Источники: Ипатьевская летопись; Никоновская летопись; Рашид-ад-Дин «Сборник летописей»."
        pometka: два источника
      - summary: "<b>Осаду Козельска через три века нарисовали миниатюристы Лицевого летописного свода.</b>"
        det:
          - Свод создавали при Иване Грозном в 1560–1570-х годах. Три его миниатюры рассказывают о Козельске — начало захвата, вылазка горожан, уход Батыя в Половецкую землю.
        src: "Источник: Российская национальная библиотека, Отдел рукописей, Голицынский том Лицевого летописного свода, F.IV.225."
razdely:
  - posle: fakty
    html: |-
      <section class="block" id="chto-zametit">
        <div class="kicker">Источник</div>
        <h2>Что записала летопись</h2>
        <p>Два голоса смотрят на одно и то же: русский летописец — изнутри города, персидский историк — со стороны осаждающих. Оба сходятся в одном: город не сдавался.</p>
        <blockquote><b>Ипатьевская (Галицко-Волынская) летопись · о Козельске</b><br>«Пришёл Батый к городу Козельску… Жители же Козельска совет сотворили — не вдатися Батыю, сказав: „Хоть князь наш молод, но положим жизнь свою за него“». Город держался семь недель. Козляне вышли из стен, «иссекли пращи» — изрубили камнемётные орудия — и, по летописи, перебили до четырёх тысяч врагов, сами полегли все.<br><small>Ипатьевская летопись (Галицко-Волынский свод) — по ИРЛИ РАН «Библиотека литературы Древней Руси» (lib.pushkinskijdom.ru).</small></blockquote>
        <blockquote><b>Рашид-ад-Дин, «Сборник летописей» · взгляд со стороны орды</b><br>Персидский историк, служивший монгольским ханам, записал: Батый подошёл к Козельску и не мог взять его два месяца, пока не подоспели отряды Кадана и Бури. Вражеский источник сам засвидетельствовал: малый город держался непривычно долго.<br><small>Рашид-ад-Дин «Сборник летописей» — в передаче научных работ (Каргалов В. В., «Конец ордынского ига», militera.lib.ru).</small></blockquote>
      </section>
