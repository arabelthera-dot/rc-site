return:
  q: Как Батый велел звать Козельск после семи недель осады?
  a: Не иначе как «злым городом».
  src: Ипатьевская летопись
audioguide:
  audioSrc: audio-guide-kozelsk-ru.mp3
  durationLabel: 1 минута 45 секунд
  lead: "Голос ведёт от города на Жиздре до ухода Батыя в степь: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - { t: 0, mark: "0:00", title: Город на реке }
    - { t: 19, mark: "0:19", title: "Вече: не сдаваться" }
    - { t: 40, mark: "0:40", title: Семь недель осады }
    - { t: 60, mark: "1:00", title: Вылазка }
    - { t: 76, mark: "1:16", title: Злой город }
  transcript:
    - "<p>«Мы входим в зал, и перед нами — маленький город на реке. Это Козельск, весна 1238 года. Зимой орда хана Батыя прошла по русской земле огнём: Рязань пала за пять дней, Владимир — за шесть. Теперь очередь дошла до небольшого городка на реке Жиздре.</p>"
    - "<p>В Козельске княжит мальчик, князь Василий. Ему едва ли двенадцать лет. Казалось бы, чего проще: открыть ворота. Но жители собрались на вече и порешили иначе — не сдаваться. «Хоть князь наш молод, — сказали они, — но положим жизнь свою за него». За веру и за своего отрока-князя.</p>"
    - "<p>Батый подошёл к городу и застрял под его стенами. Не на день, не на два — на семь недель. Рязань держалась пять дней, Владимир — шесть, а этот маленький город держал всю орду почти два месяца. Монголы не могли понять, почему никак не могут его взять.</p>"
    - "<p>Защитники не просто сидели за стенами. Однажды ночью они вышли из города, изрубили осадные машины, камнемёты, и, по словам летописи, перебили до четырёх тысяч врагов. Сами полегли все до одного.</p>"
    - "<p>Когда город всё же пал, Батый приказал не щадить никого, даже младенцев. И велел звать Козельск не иначе как злым городом. Под его стенами полегли три сына татарских темников, чьи тела так и не нашли. А Батый после этого не пошёл дальше на Новгород — развернулся и ушёл в степь. Вот и весь зал: маленький город, который не сдался, хотя сдаться было разумнее всего».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
