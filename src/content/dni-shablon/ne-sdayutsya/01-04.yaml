story:
  kicker: Подвиг
  h2: Семь недель, которых не должно было быть
  abzacy:
    - "Весной 1238 года, после Рязани и Владимира, орда Батыя подошла к малому городу Козельску на Жиздре. Зимой орда прошла по Руси огнём. В декабре 1237 года Батый взял Рязань за шесть дней; 7 февраля 1238 года пал стольный Владимир. 4 марта на реке Сити погиб великий князь Юрий Всеволодович — Северо-Восточная Русь была разорена, путь орде, казалось, открыт. Городок невелик, но место крепкое — холм в междуречье Жиздры и Другусны, ров, а весенний разлив делает его почти островом."
    - "В городе княжил отрок Василий — летопись зовёт его «юным», учёные считают, что ему было около двенадцати лет. Положение было то, в котором города сдаются: Рязань сожжена, Владимир пал, помощи ждать неоткуда."
    - "Жители собрались на вече и постановили не вдатися Батыю — положить жизнь за отрока-князя. Открыть ворота, уйти в леса или держаться — вече прошло по каждой дороге до конца. «Хоть князь наш молод, — сказали козляне, — но положим жизнь свою за него». Не за победу — победы не ждали. За то, чтобы не сдаться."
    - "Батый застрял под стенами на семь недель, а защитники сами выходили на вылазки. В вылазке козляне иссекли камнемётные орудия — «пращи», ломавшие их стены, и, по летописи, перебили до четырёх тысяч врагов. Сами полегли все. Персидский историк Рашид-ад-Дин, служивший ханам, записал, что город не могли взять два месяца, пока не подоспели отряды Кадана и Бури."
    - "Когда город пал, Батый велел не щадить никого и звать Козельск «злым городом». Приказ был — «до ссущих млеко», до грудных младенцев. Под стенами пали три сына темников, и тел их не нашли среди множества трупов."
    - "После Козельска Батый ушёл в Половецкую степь, не дойдя до Новгорода. Суть не зависит от числа убитых: город, которому расчёт велел сдаться, выбрал не сдаться. Не ради победы — ради того, чтобы остаться собой. В те же годы в Европе правил император Фридрих II и шла его борьба с папством; Запад ещё не осознал масштаб угрозы, пришедшей с востока."
