  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Цена и память
    udary:
      - summary: "Археологи больше 20 лет искали тот Козельск — и нашли обгоревшие брёвна его стены в городе."
        det:
          - В 1992 году экспедиция Института археологии РАН вскрыла на холме 164 кв. м и не нашла ничего старше XIV века; после монографии 2005 года на славу «злого города» стал претендовать Чекалин («Коммерсантъ»). В 2013 году экспедиция Калужского краеведческого музея и нацпарка «Угра» (И. Болдин, Г. Массолитина) нашла первые свидетельства и дошла до четырёх слоёв пожарищ, один — начала XIII века. Практически в центре города, у устья Другусны, нашли насыпь с обгоревшими брёвнами крепостной стены («РГ»).
        src: "Источник: РГ (https://rg.ru/2015/06/19/reg-cfo/raskopki.html); «Коммерсантъ», https://www.kommersant.ru/doc/3600778"
        stranica: РГ
        href: https://rg.ru/2015/06/19/reg-cfo/raskopki.html
        otryvok: «При устье речки Другусны практически в центре города, нашли искусственную насыпь с остатками обгоревших бревен крепостной стены.»
        pometka: два источника
        utverzhden: 2026-11-03
        istochnik: "rg"
        dlya_voprosa: false
        sravnenie: "net"
        id: "f11"
      - summary: "Весной Жиздра подходит к холму Козельска — и город становился неприступной крепостью."
        det:
          - "Директор краеведческого музея Илья Яценко: в 2012 году весной река затопила стадион и подошла под склоны холма. «Думаю, в старину так бывало каждый год, и по весне Козельск превращался в неприступную крепость». Детинец, по последним находкам, стоял на холмике у впадения Другузки (Другусны) в Жиздру."
        src: "Источник: «Коммерсантъ» («Огонёк» № 15, 23.04.2018), https://www.kommersant.ru/doc/3600778; РГ (https://rg.ru/2015/06/19/reg-cfo/raskopki.html)"
        stranica: www.kommersant.ru
        href: https://www.kommersant.ru/doc/3600778
        otryvok: «Думаю, в старину так бывало каждый год, и по весне Козельск превращался в неприступную крепость»
