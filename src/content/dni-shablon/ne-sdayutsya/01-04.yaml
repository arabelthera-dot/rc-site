story:
  kicker: Подвиг
  h2: Семь недель, которых не должно было быть
  abzacy:
    - "Весна 1238 года. После Рязани и Владимира орда Батыя движется дальше и подходит к малому городу Козельску на реке Жиздре. Городок невелик, но место крепкое: холм в междуречье Жиздры и Другусны, ров, а весенний разлив превращает его почти в остров. В городе княжит отрок Василий — летопись зовёт его «юным», учёные считают, что ему было около двенадцати лет."
    - "Положение то, в котором города сдаются: Рязань уже сожжена, Владимир пал, помощи ждать неоткуда. Жители собираются на вече и постановляют иначе: <b>не вдатися Батыю</b>. «Хоть князь наш молод, — говорят они, — но положим жизнь свою за него». За веру и за отрока-князя, которого больше некому защитить."
    - "Батый подходит и застревает под стенами. Не на день, не на два — <b>на семь недель</b>. Персидский историк Рашид-ад-Дин, служивший ханам, запишет: город не могли взять два месяца, пока не подоспели ещё два отряда. Защитники не ждут штурма — они сами выходят: в вылазке иссекают камнемётные орудия, «пращи», ломавшие их стены, и, по летописи, перебивают до четырёх тысяч врагов. Сами полегли все."
    - "Когда город всё же пал, Батый приказал не щадить никого — «до ссущих млеко», до грудных младенцев. О князе Василии летописец не знает наверное: «инии же глаголаху, яко в крови утонул, понеже был молод». И велел Батый звать Козельск не иначе как <b>«злым городом»</b> — под его стенами пали три сына темников, и тел их не нашли среди множества трупов."
    - "После Козельска Батый развернул войско и ушёл в Половецкую степь, не дойдя до Новгорода. Суть одна, и она не зависит от числа убитых: город, которому расчёт велел сдаться, <b>выбрал не сдаться</b>. Не ради победы — победы не ждали. Ради того, чтобы остаться собой."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Оборона Козельска — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Козельск два месяца держал Батыя и пал лишь тогда, когда подошли Кадан и Бури.</b>
        det:
          - "Рашид-ад-Дин, историк монгольских ханов: «Бату подошёл к городу Козельску и, осаждая его в течение двух месяцев, не мог овладеть им. Потом прибыли Кадан и Бури и взяли его в три дня». Сам Батый город не взял, понадобились ещё два отряда царевичей. Это свидетельство стороны осаждавших."
        src: "Источник: РАШИД (https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php)"
        stranica: РАШИД
        href: https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php
        otryvok: «Бату подошел к городу Козельску и, осаждая его в течение двух месяцев, не мог овладеть им. Потом прибыли Кадан и Бури и взяли его в три дня.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Козляне встретили татар на проломленной стене и резались с ними на валу ножами.</b>
        det:
          - "Летопись: «разбившимъ граду стѣну, и возиидоша на валъ татаре. Козляне же ножи рѣзахуся с ними». Стена была уже пробита, а город всё равно не сдавался. После этой рукопашной защитники решили выйти на вылазку."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «разбившимъ граду стѣну, и возиидоша на валъ татаре. Козляне же ножи рѣзахуся с ними.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Козляне вышли из стен, изрубили осадные машины и, по летописи, положили 4000 врагов.</b>
        det:
          - В вылазке защитники «исѣкоша праща ихъ», в переводе ИРЛИ «разбили пороки их», то есть камнемёты, ломавшие стены. По летописи, «убиша от татаръ 4 тысящи, и самѣ же избьени быша» — врагов погибло четыре тысячи, а сами козляне полегли все.
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «Свѣтъ же створиша изиити на полкы тотарьскые, и исшедше изъ града, исѣкоша праща ихъ, нападше на полъкы ихъ, и убиша от татаръ 4 тысящи, и самѣ же избьени быша.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Козляне на вече решили не сдаваться Батыю: «Хоть князь наш молод, положим живот свой за него».</b>"
        det:
          - "Летопись: козляне «совет сотвориша — не вдатися Батыю». Полная формула клятвы: «…положимъ животъ свой за нь, и сде славу сего свѣта приимше, и тамъ небесныя вѣнца от Христа Бога приимемь». Рязань и Владимир к этому времени уже пали, помощи ждать было неоткуда."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: "«Козлянѣ жѣ свѣтъ створше не вдатися Батыю, рекше, яко: «Аще князь нашь млад есть, но положимъ животъ свой за нь»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Малый Козельск держался семь недель, хотя большие столицы пали за считанные дни.</b>
        det:
          - "По летописи, город бился «по семь недѣль», у Рашид-ад-Дина — два месяца. По РВИО, крупнейшие города Руси выдерживали натиск несколько дней: Рязань продержалась шесть дней, Владимир — четыре."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961); РАШИД (https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php); РВИО (https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym)"
        stranica: РВИО
        href: https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym
        otryvok: «Так, Рязань продержалась шесть дней, Владимир – четыре… Но под Козельском (ранее – Черниговское княжество, сегодня – Калужская область) войска хана Батыя простояли 50 дней и потеряли 4000 воинов.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Козляне отбились так, что татары, по летописи, «не смеют» назвать город Козельском.</b>
        det:
          - "Летопись: «ву татарѣхъ не смѣють его нарещи град Козлескъ, но град злый, понеже бишася по семь недѣль». Приказа Батыя «звать злым городом» в летописи нет, так говорили сами татары. По РВИО, «„Злой город“, — подвёл итог Батый», а археолог И. Болдин («РГ») говорит, что эти слова «приписывают Субудаю»."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961); РВИО (https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym); РГ (https://rg.ru/2015/06/19/reg-cfo/raskopki.html)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «Оттуду же ву татарѣхъ не смѣють его нарещи град Козлескъ, но град злый, понеже бишася по семь недѣль.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Козельск не поддался на «словеса лестьные» — враг понял, что уговорами город не взять.</b>
        det:
          - "Летопись: «Увѣдавъши же нечестивии, яко умъ крѣпкодушьный имѣють людье во градѣ, словесы лестьными невозможно бѣ града прияти». По РВИО, монголы, подойдя к городу, потребовали немедленной сдачи. Город ответил отказом."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961); РВИО (https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «Увѣдавъши же нечестивии, яко умъ крѣпкодушьный имѣють людье во градѣ, словесы лестьными невозможно бѣ града прияти.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Под стенами Козельска полегли три сына темников, и тел их не нашли среди трупов.</b>
        det:
          - "Летопись: в бою погибли три сына «темничих», то есть военачальников над десятью тысячами воинов, и найти их среди множества тел не смогли. Для орды это была потеря знати, а не простых воинов."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «Убиша бо от татаръ сыны темничи три. [247] Татари же искавше и не могоша ихъ изнаити во множествѣ трупъ мертвыхъ.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>После Козельска орда, по Рашид-ад-Дину, встала на отдых и до осени на Русь не ходила.</b>
        det:
          - "Рашид-ад-Дин: Кадан и Бури взяли город в три дня, «тогда они расположились в домах и отдохнули». Осенью того же года царевичи ушли в другие походы: Менгу и Кадан — на черкесов, Шибан, Бучек и Бури — в Крым, Берке — на кипчаков, то есть половцев."
        src: "Источник: РАШИД (https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php)"
        stranica: РАШИД
        href: https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php
        otryvok: «Потом прибыли Кадан и Бури и взяли его в три дня. Тогда они расположились в домах и отдохнули.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Козельск стоял до последнего — взяв город, Батый не пощадил никого, «до ссущих млеко».</b>
        det:
          - "Летопись: «Батый же взя городъ, изби вси, и не пощадѣ… до отрочатъ, ссущихъ млеко», то есть до грудных младенцев. О судьбе юного князя Василия летописец ничего точно не знал. Козельск заплатил за отказ сдаться всем населением."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «Батый же взя городъ, изби вси, и не пощадѣ от отрочать до сосущих млеко.»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Козляне защищали 12-летнего князя Василия, внука Мстислава, павшего на Калке.</b>
        det:
          - "По РВИО, князю Василию было 12 лет, его дед Мстислав Святославич Черниговский погиб на Калке в 1223 году. Летопись возраст не называет. О судьбе князя летописец пишет с оговоркой: «инии глаголаху, яко во крови утонулъ есть, понеже убо младъ бяше есть» — в переводе ИРЛИ «некоторые говорят, что он утонул в крови, так молод был»."
        src: "Источник: РВИО (https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym); ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: РВИО
        href: https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym
        otryvok: «В то время город Козельск был столицей небольшого княжества во главе с 12-летним князем Василием, внуком Мстислава Святославича Черниговского, погибшего в битве на Калке в 1223 году.»
        utverzhden: 2026-11-03
      - summary: <b>Археологи больше 20 лет искали тот Козельск — и нашли обгоревшие брёвна его стены в городе.</b>
        det:
          - В 1992 году экспедиция Института археологии РАН вскрыла на холме 164 кв. м и не нашла ничего старше XIV века; после монографии 2005 года на славу «злого города» стал претендовать Чекалин («Коммерсантъ»). В 2013 году экспедиция Калужского краеведческого музея и нацпарка «Угра» (И. Болдин, Г. Массолитина) нашла первые свидетельства и дошла до четырёх слоёв пожарищ, один — начала XIII века. Практически в центре города, у устья Другусны, нашли насыпь с обгоревшими брёвнами крепостной стены («РГ»).
        src: "Источник: РГ (https://rg.ru/2015/06/19/reg-cfo/raskopki.html); «Коммерсантъ», https://www.kommersant.ru/doc/3600778"
        stranica: РГ
        href: https://rg.ru/2015/06/19/reg-cfo/raskopki.html
