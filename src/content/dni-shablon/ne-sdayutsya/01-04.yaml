razdely:
  - posle: fakty
    html: |-
      <section class="block" id="chto-zametit">
        <div class="kicker">Источник</div>
        <h2>Что записала летопись</h2>
        <p>Два голоса смотрят на одно и то же: русский летописец — изнутри города, персидский историк — со стороны осаждающих. Оба сходятся в одном: город не сдавался.</p>
        <blockquote><b>Ипатьевская (Галицко-Волынская) летопись · о Козельске</b><br>«Пришёл Батый к городу Козельску… Жители же Козельска совет сотворили — не вдатися Батыю, сказав: „Хоть князь наш молод, но положим жизнь свою за него“». Город держался семь недель. Козляне вышли из стен, «иссекли пращи» — изрубили камнемётные орудия — и, по летописи, перебили до четырёх тысяч врагов, сами полегли все.<br><small>Ипатьевская летопись (Галицко-Волынский свод) — по ИРЛИ РАН «Библиотека литературы Древней Руси» (lib.pushkinskijdom.ru).</small></blockquote>
        <blockquote><b>Рашид-ад-Дин, «Сборник летописей» · взгляд со стороны орды</b><br>Персидский историк, служивший монгольским ханам, записал: Батый подошёл к Козельску и не мог взять его два месяца, пока не подоспели отряды Кадана и Бури. Вражеский источник сам засвидетельствовал: малый город держался непривычно долго.<br><small>Рашид-ад-Дин «Сборник летописей» — в передаче научных работ (Каргалов В. В., «Конец ордынского ига», militera.lib.ru).</small></blockquote>
      </section>
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — семь недель; 2 — не сдаваться; 3 — разрушили камнемёты; 4 — злым городом; 5 — в степь."
  ball: 10
  voprosy:
    - q: Сколько недель держался Козельск?
      o: [ Семь, Пять, Две, Три ]
      a: 0
      e: Семь недель. Рязань пала за пять дней, Владимир — за шесть, а Козельск держался дольше всех городов нашествия.
    - q: Что решили жители на вече?
      o: [ Не сдаваться, Сдаться, Уйти в леса, Позвать помощь ]
      a: 0
      e: Не вдатися Батыю — не сдаваться, хоть князь и был совсем юн. За веру и за отрока-князя положили жизнь.
    - q: Что сделали защитники во время вылазки?
      o: [ Разрушили камнемёты, Открыли ворота, Сожгли город, Ушли в степь ]
      a: 0
      e: Иссекли осадные машины — «пращи», и, по летописи, перебили до четырёх тысяч врагов. Сами полегли все.
    - q: Как Батый велел называть Козельск?
      o: [ Злым городом, Непобедимым, Мёртвым, Святым ]
      a: 0
      e: Не иначе как «злым городом» — под его стенами пали три сына темников.
    - q: Куда Батый ушёл после Козельска?
      o: [ В степь, На Новгород, На Киев, Обратно в степи Монголии ]
      a: 0
      e: В Половецкую степь, не дойдя до Новгорода. Распутица и истощённое войско — но и семь недель под стенами одного города дорого стоили.
