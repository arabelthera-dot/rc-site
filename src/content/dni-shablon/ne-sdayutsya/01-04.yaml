story:
  kicker: Подвиг · 6 ударов
  h2: Семь недель, которых не должно было быть
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Весной 1238 года, после Рязани и Владимира, орда Батыя подошла к малому городу Козельску на Жиздре.
      det:
        - "Зимой орда прошла по Руси огнём. В декабре 1237 года Батый взял Рязань за пять дней; 7 февраля 1238 года пал стольный Владимир. 4 марта на реке Сити погиб великий князь Юрий Всеволодович — Северо-Восточная Русь была разорена, путь орде, казалось, открыт."
        - Городок невелик, но место крепкое — холм в междуречье Жиздры и Другусны, ров, а весенний разлив делает его почти островом.
      src: "Источники: Ипатьевская (Галицко-Волынская) летопись; Каргалов В. В. «Конец ордынского ига» (militera.lib.ru)."
    - summary: В городе княжил отрок Василий — летопись зовёт его «юным», учёные считают, что ему было около двенадцати лет.
      det:
        - "Положение было то, в котором города сдаются: Рязань сожжена, Владимир пал, помощи ждать неоткуда."
      src: "Источник: Ипатьевская (Галицко-Волынская) летопись."
    - summary: Жители собрались на вече и постановили не вдатися Батыю — положить жизнь за отрока-князя.
      det:
        - "Открыть ворота, уйти в леса или держаться — вече прошло по каждой дороге до конца. «Хоть князь наш молод, — сказали козляне, — но положим жизнь свою за него». Не за победу — победы не ждали. За то, чтобы не сдаться."
      src: "Источник: Ипатьевская летопись — по ИРЛИ РАН «Библиотека литературы Древней Руси»."
    - summary: Батый застрял под стенами на семь недель, а защитники сами выходили на вылазки.
      det:
        - "В вылазке козляне иссекли камнемётные орудия — «пращи», ломавшие их стены, и, по летописи, перебили до четырёх тысяч врагов. Сами полегли все."
        - Персидский историк Рашид-ад-Дин, служивший ханам, записал, что город не могли взять два месяца, пока не подоспели отряды Кадана и Бури.
      src: "Источники: Ипатьевская летопись; Рашид-ад-Дин «Сборник летописей» — в передаче Каргалова В. В."
    - summary: Когда город пал, Батый велел не щадить никого и звать Козельск «злым городом».
      det:
        - "Приказ был — «до ссущих млеко», до грудных младенцев. Под стенами пали три сына темников, и тел их не нашли среди множества трупов."
      src: "Источник: Ипатьевская летопись."
    - summary: После Козельска Батый ушёл в Половецкую степь, не дойдя до Новгорода.
      det:
        - "Суть не зависит от числа убитых: город, которому расчёт велел сдаться, выбрал не сдаться. Не ради победы — ради того, чтобы остаться собой."
        - В те же годы в Европе правил император Фридрих II и шла его борьба с папством; Запад ещё не осознал масштаб угрозы, пришедшей с востока.
      src: "Источники: Ипатьевская летопись; Каргалов В. В. «Конец ордынского ига»."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов об обороне Козельска
    h2: Малый город против орды
    udary:
      - summary: <b>Малый Козельск семь недель держал Батыя, хотя большие столицы пали за считанные дни, — и пал лишь тогда, когда подошли Кадан и Бури.</b>
        det:
          - "Рашид-ад-Дин, историк монгольских ханов: «Бату подошёл к городу Козельску и, осаждая его в течение двух месяцев, не мог овладеть им. Потом прибыли Кадан и Бури и взяли его в три дня». Сам Батый город не взял, понадобились ещё два отряда царевичей. Это свидетельство стороны осаждавших. По летописи, город бился «по семь недѣль». По РВИО, крупнейшие города Руси выдерживали натиск несколько дней: Рязань продержалась шесть дней, Владимир — четыре."
        src: "Источник: РАШИД (https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php); ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961); РАШИД (https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php); РВИО (https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym)"
        stranica: РАШИД
        href: https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php
        otryvok: «Бату подошёл к городу Козельску и, осаждая его в течение двух месяцев, не мог овладеть им. Потом прибыли Кадан и Бури и взяли его в три дня»
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-04-goskatalog-18134111.jpg
          alt: "Лаковая миниатюра: деревянная крепость Козельск с храмами, у стен — всадники"
          data_source: https://goskatalog.ru/portal/#/collections?id=18126558
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Лаковая миниатюра «Оборона Козельска» (2013) из собрания козельского музея «Дом Цыплаковых» — память о семи неделях, что малый город держал Батыя.
          credit: "Хранится: Филиал государственного бюджетного учреждения культуры Калужской области «Калужский объединенный музей-заповедник» — Музейно-краеведческий центр «Дом Цыплаковых». Госкаталог № 18126558 (КОМЗ КФ КП 3219)"
          width: 1600
          height: 1200
        utverzhden: 2026-11-03
      - summary: <b>Козляне встретили татар на проломленной стене и резались с ними на валу ножами.</b>
        det:
          - "Летопись: «разбившимъ граду стѣну, и возиидоша на валъ татаре. Козляне же ножи рѣзахуся с ними». Стена была уже пробита, а город всё равно не сдавался. После этой рукопашной защитники решили выйти на вылазку."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «разбившимъ граду стѣну, и возиидоша на валъ татаре. Козляне же ножи рѣзахуся с ними»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-04-goskatalog-11592978.jpg
          alt: "Рисунок тушью и акварелью: бревенчатая стена с башней, у стены идёт бой"
          data_source: https://goskatalog.ru/portal/#/collections?id=13401696
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: «Защита Козельска» — рисунок Н. Ф. Калинина, 1930–1940-е годы (тушь, акварель).
          credit: "Калинин Николай Филиппович. Хранится: Государственное бюджетное учреждение культуры «Национальный музей Республики Татарстан». Госкаталог № 13401696 (НМРТ КП-23030)"
          width: 575
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Козляне вышли из стен, изрубили осадные машины и положили 4000 врагов.</b>
        det:
          - В вылазке защитники «исѣкоша праща ихъ», в переводе ИРЛИ «разбили пороки их», то есть камнемёты, ломавшие стены. По летописи, «убиша от татаръ 4 тысящи, и самѣ же избьени быша» — врагов погибло четыре тысячи, а сами козляне полегли все.
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «исѣкоша праща ихъ»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/kozelsk-miniatura-2-vylazka.jpg
          width: 1600
          height: 2216
          klass: portret
          alt: "Миниатюра Лицевого летописного свода: горожане Козельска выходят из ворот и бьются с татарами"
          data_source: Российская национальная библиотека, Отдел рукописей, Голицынский том Лицевого летописного свода, F.IV.225
          license: общественное достояние (рукопись 1560–1570-х годов)
          podpis: Лицевой летописный свод, XVI век — «Горожане выходят против татар».
          credit: "Миниатюрист Лицевого летописного свода, 1560–1570-е. Хранится: Федеральное государственное бюджетное учреждение «Российская национальная библиотека», Отдел рукописей, Голицынский том Лицевого летописного свода, F.IV.225. Общественное достояние."
        utverzhden: 2026-11-03
      - summary: "<b>Козляне на вече решили не сдаваться Батыю: «Хоть князь наш молод, положим живот свой за него».</b>"
        det:
          - "Летопись: козляне «совет сотвориша — не вдатися Батыю». Полная формула клятвы: «…положимъ животъ свой за нь, и сде славу сего свѣта приимше, и тамъ небесныя вѣнца от Христа Бога приимемь». Рязань и Владимир к этому времени уже пали, помощи ждать было неоткуда."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «совет сотвориша — не вдатися Батыю»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Козляне отбились так, что татары «не смеют» назвать город Козельском.</b>
        det:
          - "Летопись: «ву татарѣхъ не смѣють его нарещи град Козлескъ, но град злый, понеже бишася по семь недѣль». Так говорили сами татары."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961); РВИО (https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym); РГ (https://rg.ru/2015/06/19/reg-cfo/raskopki.html)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «ву татарѣхъ не смѣють его нарещи град Козлескъ, но град злый, понеже бишася по семь недѣль»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-04-goskatalog-50086505.jpg
          width: 800
          height: 479
          alt: Памятная медаль «Героическая оборона Козельска в 1238 г.»
          data_source: https://goskatalog.ru/portal/#/collections?id=50086505
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Памятная медаль «Героическая оборона Козельска в 1238 г.»
          credit: "Фото: Лобода В. В., 2024. Хранится: Федеральное государственное бюджетное учреждение культуры «Государственный военно-исторический и природный музей-заповедник «Куликово поле»». Госкаталог музейного фонда РФ, № 50086505."
        utverzhden: 2026-11-03
      - summary: <b>Козельск не поддался на «словеса лестьные» — враг понял, что уговорами город не взять.</b>
        det:
          - "Летопись: «Увѣдавъши же нечестивии, яко умъ крѣпкодушьный имѣють людье во градѣ, словесы лестьными невозможно бѣ града прияти». По РВИО, монголы, подойдя к городу, потребовали немедленной сдачи. Город ответил отказом."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961); РВИО (https://histrf.ru/biblioteka/b/kakoi-russkii-ghorod-vraghi-prozvali-zlym)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «Увѣдавъши же нечестивии, яко умъ крѣпкодушьный имѣють людье во градѣ, словесы лестьными невозможно бѣ града прияти»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Под стенами Козельска полегли три сына темников, и тел их не нашли среди трупов.</b>
        det:
          - "Летопись: в бою погибли три сына «темничих», то есть военачальников над десятью тысячами воинов, и найти их среди множества тел не смогли. Для орды это была потеря знати, а не простых воинов."
        src: "Источник: ИРЛИ (http://lib.pushkinskijdom.ru/default.aspx?tabid=4961)"
        stranica: ИРЛИ
        href: http://lib.pushkinskijdom.ru/default.aspx?tabid=4961
        otryvok: «Убиша бо от татаръ сыны темничи три. [247] Татари же искавше и не могоша ихъ изнаити во множествѣ трупъ мертвыхъ.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>После Козельска орда встала на отдых и до осени на Русь не ходила.</b>
        det:
          - "Рашид-ад-Дин: Кадан и Бури взяли город в три дня, «тогда они расположились в домах и отдохнули». Осенью того же года царевичи ушли в другие походы: Менгу и Кадан — на черкесов, Шибан, Бучек и Бури — в Крым, Берке — на кипчаков, то есть половцев."
        src: "Источник: РАШИД (https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php)"
        stranica: РАШИД
        href: https://drevlit.ru/texts/r/rashid_sb_let_t2_ch2.php
        otryvok: «тогда они расположились в домах и отдохнули»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/kozelsk-miniatura-3-step.jpg
          width: 1600
