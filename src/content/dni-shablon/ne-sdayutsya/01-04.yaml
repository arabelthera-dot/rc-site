vizual:
  imya: kozelsk-plan
  vid: karta
  kicker: План под лупой
  h2: Козельск на плане 1782 года
  lead: 'Так выглядел Козельск через пять с лишним веков после Батыя: лист из старинного атласа Калужского края (наместничество — так тогда называлась губерния). Город стоит всё на той же Жиздре. Приближайте: изгиб реки, кварталы и слободы, герб города в углу.'
audioguide:
  audioSrc: audio-guide-kozelsk-ru.mp3
  durationLabel: 1 минута 45 секунд
  lead: "Голос ведёт от города на Жиздре до ухода Батыя в степь: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - { t: 0, mark: "0:00", title: Город на реке }
    - { t: 18, mark: "0:18", title: "Вече: не сдаваться" }
    - { t: 38, mark: "0:38", title: Семь недель осады }
    - { t: 56, mark: "0:56", title: Вылазка }
    - { t: 69, mark: "1:09", title: Злой город }
  transcript:
    - "«Мы входим в зал, и перед нами — маленький город на реке. Это Козельск, весна 1238 года. Зимой орда хана Батыя прошла по русской земле огнём: Рязань пала за шесть дней, Владимир — за четыре. Теперь очередь дошла до небольшого городка на реке Жиздре."
    - "В Козельске княжит мальчик, князь Василий. Ему едва ли двенадцать лет. Казалось бы, чего проще: открыть ворота. Но жители собрались на вече и порешили иначе — не сдаваться. «Хоть князь наш молод, — сказали они, — но положим жизнь свою за него». За веру и за своего отрока-князя."
    - "Батый подошёл к городу и застрял под его стенами. Не на день, не на два — на семь недель. Рязань держалась шесть дней, Владимир — четыре, а этот маленький город держал всю орду почти два месяца. Монголы не могли понять, почему никак не могут его взять."
    - "Защитники не просто сидели за стенами. Однажды ночью они вышли из города, изрубили осадные машины, камнемёты, и, по словам летописи, перебили до четырёх тысяч врагов. Сами полегли все до одного."
    - "Когда город всё же пал, Батый приказал не щадить никого, даже младенцев. И велел звать Козельск не иначе как злым городом. Под его стенами полегли три сына татарских темников, чьи тела так и не нашли. А Батый после этого не пошёл дальше на Новгород — развернулся и ушёл в степь. Вот и весь зал: маленький город, который не сдался, хотя сдаться было разумнее всего»."
  note: Озвучено синтезом речи.
