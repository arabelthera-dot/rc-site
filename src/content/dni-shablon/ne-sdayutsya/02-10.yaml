  voprosy:
  - q: 'Ставка до ответа: что сделал Прохоренко, когда враги по-русски предложили ему сдаться?'
    o:
    - Ушёл ночью
    - Вызвал огонь на себя
    - Сдался
    - Спрятался в развалинах
    a: 1
    e: 'Вместо сдачи он вызвал авиаудар по своим координатам: российские бомбардировщики накрыли высоту.'
  - q: Сколько боевиков окружили одного русского офицера?
    o:
    - Около десяти
    - Около тридцати
    - Около сотни
    - Около тысячи
    a: 2
    e: Около ста бандитов устроили плотное огневое кольцо вокруг российского разведчика.
  - q: Сколько времени Прохоренко один в тылу врага наводил самолёты?
    o:
    - Один день
    - Целую неделю
    - Месяц
    - Полгода
    a: 1
    e: К 17 марта он провёл в тылу врага целую неделю, координируя удары авиации.
  - q: Как его назвала британская газета Daily Mirror?
    o:
    - «Русским Рэмбо»
    - «Русским медведем»
    - «Сирийским львом»
    - «Героем пустыни»
    a: 0
    e: Daily Mirror посвятила ему статью и назвала офицера «русским Рэмбо».
  - q: Какой была последняя запись на его странице?
    o:
    - «Скоро домой»
    - «Всё хорошо»
    - «Я на службе»
    - «Люблю вас»
    a: 2
    e: Последний статус в «Одноклассниках» — «Я на службе».
