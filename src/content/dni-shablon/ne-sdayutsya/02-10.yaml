  transcript:
  - Март две тысячи шестнадцатого года, Сирия, окрестности древней Пальмиры. Старший лейтенант Сил специальных операций Александр Прохоренко целую неделю один в тылу врага. По рации он наводит российские самолёты на позиции боевиков.
  - 'Семнадцатого марта боевики находят его укрытие и окружают. Около сотни человек встают огневым кольцом вокруг одного русского офицера. На русском языке ему кричат: сдавайся.'
  - Он не сдаётся. Он вызывает авиаудар по своим координатам, и российские бомбардировщики накрывают высоту. Когда её берут, там лежат больше сотни убитых боевиков, а среди них он один.
  - 'Через десять дней после его гибели Пальмиру освобождают полностью. Последняя запись на его странице — три слова: «Я на службе». Александру Прохоренко присвоено звание Героя России посмертно.'
  - 'Британская газета называет его «русским Рэмбо». А три французские семьи отдают его родным ордена Почётного легиона своих отцов. Француз Жан-Поль Флок говорит: это подвиг не национального, а мирового уровня.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
