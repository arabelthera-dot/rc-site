story:
  kicker: Подвиг
  h2: Александр Прохоренко
  abzacy:
  - Март 2016 года, Сирия, окрестности древней Пальмиры. Старший лейтенант Сил специальных операций Александр Прохоренко, 25 лет, родом из Оренбуржья, уже неделю один в тылу врага. По рации он наводит российские самолёты на позиции боевиков. 17 марта боевики находят его укрытие и окружают — около ста человек. На русском языке ему предлагают сдаться.
  - Вместо этого он вызывает огонь на себя, и российские бомбардировщики накрывают высоту. Когда её берут сирийские войска, там лежат больше сотни убитых боевиков, а среди них — он один. Через десять дней Пальмира свободна. 11 апреля 2016 года Александру Прохоренко присвоено звание Героя Российской Федерации посмертно, а три французские семьи отдают его родным ордена Почётного легиона своих отцов.
