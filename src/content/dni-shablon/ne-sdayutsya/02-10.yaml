  lead: 'Так Саша Прохоренко стоит с товарищами у артиллерийской установки, ещё задолго до военной академии. Приближайте: лица ребят, камуфляж и ствол орудия.'
audioguide:
  audioSrc: audio-guide-prohorenko-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от недели в тылу врага под Пальмирой через кольцо окружения и огонь на себя — к освобождённому городу и орденам из Франции: пять остановок.'
