quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Рыболовным траулером; 2 — Три; 3 — Носовая пушка не доставала, кормовую разбило; 4 — Спущенный на ночь флаг подняли под огнём; 5 — 37 из 52."
  ball: 10
  voprosy:
    - q: Чем был «Туман» до войны?
      o:
        - Пограничным катером
        - Ледоколом
        - Рыболовным траулером
        - Учебным парусником
      a: 2
      e: «Туман» построили в 1930 году как рыболовный траулер РТ-10 «Лебёдка»; в 1939 году его мобилизовали, в 1940-м он стал сторожевым кораблём.
    - q: Сколько немецких эсминцев вышло против «Тумана»?
      o:
        - Три
        - Один
        - Два
        - Пять
      a: 0
      e: "Три эсминца 6-й флотилии: Z-4 «Рихард Байцен», Z-10 «Ганс Лоди» и Z-16 «Фридрих Экольдт»."
    - q: Почему «Туман» не отвечал на огонь?
      o:
        - Кончились снаряды
        - Был приказ не стрелять
        - Эсминцы стояли слишком далеко для всех
        - Носовая пушка не доставала, кормовую разбило
      a: 3
      e: Носовое орудие было вне сектора обстрела, а кормовое вышло из строя после первых же залпов.
    - q: Что случилось с флагом во время боя?
      o:
        - Его спустили, чтобы сдаться
        - Спущенный на ночь флаг подняли под огнём
        - Его унесли в шлюпку
        - Флага на корабле не было
      a: 1
      e: Лейтенант Михаил Букин приказал поднять флаг, спущенный на ночь; его подняли раненый рулевой Семёнов и радист Константин Блинов.
    - q: Сколько моряков «Тумана» спаслись?
      o:
        - 5 из 52
        - Все 52
        - Никто
        - 37 из 52
      a: 3
      e: 37 человек на двух шлюпках подобрали катера; экипаж «Тумана» был 52 человека.
