story:
  kicker: Среда подвига
  h2: Траулер, который стал кораблём
  abzacy:
    - «Туман» построили в 1930 году на верфи в Данциге как рыболовный траулер РТ-10 «Лебёдка» по заказу Северного государственного рыболовного треста. На нём стояли жиротопная и консервная установки, оборудование для рыбной муки. В 1939 году траулер мобилизовали, а в 1940-м он стал сторожевым кораблём «Туман» с бортовым номером 12.
    - "Вооружение ему дали скромное: <b>две 45-миллиметровые пушки, два пулемёта и 18 малых глубинных бомб.</b> Ход — 9–10 узлов. Радиолокатора на бывших траулерах не было вовсе. Таким кораблям поручали дозор: заметить противника и предупредить базу."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Сторожевой корабль «Туман» — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Рулевой Семёнов с раненой рукой и радист Блинов подняли флаг под огнём трёх эсминцев.</b>
        det:
          - На ночь военно-морской флаг тогда спускали, и бой «Туман» начал без него. Лейтенант Михаил Букин приказал поднять флаг, и краснофлотец Константин Семёнов, серьёзно раненный в руку, вместе со старшим краснофлотцем Константином Блиновым подняли его под обстрелом (ЦВМА, ф. 776, оп. 3, д. 3). С этим флагом корабль и ушёл под воду. По словам Кобчикова, мемуары адмиралов Головко и Кузнецова во многом заменили этот бой художественным вымыслом, но флаг подтверждён документами.
        src: "Источник: Кобчиков, «Гангут», 1993 — https://d-pankratov.ru/archives/2489; «В Баренцевом море нашли кладбище кораблей», «Российская газета», 10.10.2021 — https://rg.ru/2021/10/10/reg-szfo/v-barencevom-more-nashli-kladbishche-korablej.html"
        stranica: Кобчиков, «Гангут», 1993
        href: https://d-pankratov.ru/archives/2489
        otryvok: «рулевой краснофлотец К. Д. Семенов, имевший серьезное ранение в руку, и радист старший краснофлотец В. К. Блинов под огнем противника подняли флаг»
        pometka: документ
        kadr:
          src: kartinka:000657
          alt: "Бронзовая доска: на палубе тонущего корабля моряки у орудия, один поднимает флаг, справа взрыв."
          data_source: https://goskatalog.ru/portal/#/collections?id=9728870
          license: цитирование, ст. 1274 ГК РФ; скульптор в Госкаталоге «неизвестный»
          podpis: Бронзовый барельеф «Подвиг моряков СКР „Туман“ Северного флота 1941 г.», 1959 год, скульптор неизвестен.
          credit: ФГБУКИ «Центральный военно-морской музей имени императора Петра Великого» Министерства обороны Российской Федерации, ЦВММ КП-38095 (05 С-762), Госкаталог № 9607701
          width: 800
          height: 533
        utverzhden: 2026-11-03
      - summary: <b>Лейтенант Рыбаков ушёл с тонущего «Тумана» последним и сел в шлюпку, лишь подобрав всех из воды.</b>
        det:
          - Раненый Рыбаков принял командование после гибели командира и руководил борьбой за живучесть. Экипаж не покидал корабль, пока «Туман» не лёг правым бортом на воду. Рыбаков ушёл последним и приказал гребцам подбирать людей; в шлюпку он поднялся, только когда из воды вытащили всех. Рыбаков воевал дальше и погиб 23 сентября 1944 года помощником командира сторожевика «Бриллиант».
        src: "Источник: Кобчиков, «Гангут», 1993, текст и список экипажа — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993, текст и список экипажа
        href: https://d-pankratov.ru/archives/2489
        otryvok: «Сам Рыбаков, оставив корабль последним, приказал гребцам подбирать команду и лишь после того, как все находившиеся в воде были подобраны, поднялся в шлюпку.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Моряки «Тумана» забили пробоины в шлюпках бушлатами и бескозырками и первыми усадили раненых.</b>
        det:
          - К 5:15 крен достиг 15°, через пятнадцать минут Рыбаков приказал спускать шлюпки. Они тоже были пробиты, и дыры заткнули бушлатами и бескозырками. 37 человек из 52 спаслись на двух шлюпках, их подобрали сторожевой катер № 42 и малые охотники № 143 и № 133. В 5:50 «Туман» затонул.
        src: "Источник: Кобчиков, «Гангут», 1993 — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993
        href: https://d-pankratov.ru/archives/2489
        otryvok: «Через пятнадцать минут лейтенант Л. А. Рыбаков приказал спустить на воду шлюпки, пробоины в которых забили бушлатами и бескозырками. В первую очередь в шлюпки перенесли раненых.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Военфельдшер Петруша, раненный в обе руки, лечил экипаж и снял с корабля последнего раненого.</b>
        det:
          - "Иван Петруша останавливал кровотечения, фиксировал переломы и руководил боевыми санитарами, хотя сам был ранен в обе руки. Вместе с краснофлотцем Александром Шаровым он снял с тонущего корабля последнего раненого, старшину 2-й статьи Ивана Бардана. Бардана это не спасло: он умер в госпитале Полярного в тот же день."
        src: "Источник: Кобчиков, «Гангут», 1993, текст и список экипажа — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993, текст и список экипажа
        href: https://d-pankratov.ru/archives/2489
        otryvok: "«Раненный в обе руки военфельдшер И. Т. Петруша продолжал оказывать первую помощь: останавливал кровотечение, фиксировал переломы, руководил работой боевых санитаров. С помощью краснофлотца А. П. Шарова он снял с тонущего корабля последнего из раненых — старшину 2-й статьи И. Ф. Бардана.»"
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Лейтенант Букин с двумя матросами выбросил за борт снаряды из огня, где уже рвались патроны.</b>
        det:
          - На корме и в надстройке горело. Букин, старшина 2-й статьи Георгий Бессонов и краснофлотец Андрей Сидоренко прямо в огне, среди рвущихся патронов, сбросили за борт все артиллерийские боеприпасы, а трюмный машинист Иван Быльченко — глубинные бомбы. Котельные машинисты Годунов, Хлюстов, Тердунов и Смирнов не уходили с вахты, пока работали механизмы. Взрыва на корабле так и не случилось.
        src: "Источник: Кобчиков, «Гангут», 1993 — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993
        href: https://d-pankratov.ru/archives/2489
        otryvok: «Лейтенант М. М. Букин, старшина 2-й статьи Г. А. Бессонов и краснофлотец А. В. Сидоренко в огне пожара на корме и в надстройке, среди рвущихся патронов, сбросили за борт, все артиллерийские боеприпасы»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Бывший рыболовный траулер с двумя 45-мм пушками вышел против пятнадцати 127-мм орудий.</b>
        det:
          - "«Туман» построили в Данциге как траулер РТ-10 «Лебёдка» для Мурманска, в 1940 году он стал сторожевым кораблём: две 45-мм пушки, два пулемёта, 18 малых глубинных бомб, ход 9–10 узлов, радиолокатора не было. У каждого из немецких эсминцев Z-4 «Рихард Байцен», Z-10 «Ганс Лоди» и Z-16 «Фридрих Экольдт» было по пять 127-мм орудий и ход 38 узлов. Экипаж «Тумана» — 52 человека, у каждого эсминца — 315. Ответить «Туман» не смог ни разу: носовая пушка была вне сектора обстрела, кормовую разбило первыми залпами."
        src: "Источник: Кобчиков, «Гангут», 1993, таблица ТТЭ — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993, таблица ТТЭ
        href: https://d-pankratov.ru/archives/2489
        otryvok: «Вооружение состояло из двух 45-мм орудий 21-К, двух 7,62-мм пулеметов М-1 и 18 малых глубинных бомб.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>«Туман» за пять минут до первого залпа успел передать базе, что идут три эсминца.</b>
        det:
          - В 4:25 вахтенный командир Рыбаков увидел три эсминца на дистанции 80–90 кабельтовых. Донесение № 0426 оперативный дежурный получил в 4:30, огонь немцы открыли в 4:42. Первый же залп перебил антенну и сигнальные фалы, и корабль остался без связи. Главную задачу дозора — предупредить базу — «Туман» выполнил.
        src: "Источник: Кобчиков, «Гангут», 1993 — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993
        href: https://d-pankratov.ru/archives/2489
        otryvok: «которое оперативный дежурный службы наблюдения и связи получил в 4 ч 30 мин.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Экипаж «Тумана» за бой получил только подарки от рабочих Мурманска — и больше ничего.</b>
        det:
          - Вечером 10 августа начальник политуправления флота Н. А. Торик поблагодарил уцелевших за мужество, комиссар дивизиона Воеводин раздал подарки. «Больше ничем и никогда моряки за свой подвиг награждены не были», — пишет Кобчиков. Экипаж расформировали.
        src: "Источник: Кобчиков, «Гангут», 1993 — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993
        href: https://d-pankratov.ru/archives/2489
        otryvok: «Больше ничем и никогда моряки за свой подвиг награждены не были»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Береговой дежурный не поверил донесению и сам стал смотреть в море, пока «Туман» расстреливали.</b>
        det:
          - Оперативный дежурный 2-го артдивизиона воентехник Рязанов усомнился в сообщении, никому не доложил и разбудил начальника штаба лишь в 4:47, когда бой уже шёл. В соседнем 1-м дивизионе батарея № 11 рассчитала данные к 4:50, но командир дивизиона решил ждать приказа коменданта укрепрайона, а тот пришёл только в 5:05. Огонь батарея открыла в 5:08. После первого залпа эсминцы отвернули и со скоростью около 36 узлов ушли под дымовой завесой; все шесть залпов батареи легли с недолётом.
        src: "Источник: Кобчиков, «Гангут», 1993 — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993
        href: https://d-pankratov.ru/archives/2489
        otryvok: «воентехник Рязанов усомнился в достоверности полученного донесения и, никому из командования не доложив и не поставив соответствующей задачи подчиненным ему подразделениям СНиС, лично занялся наблюдением.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Три эсминца за 13 минут всадили в «Туман» 11 прямых попаданий — корабль почти час держался на воде.</b>
        det:
          - С 4:42 до 4:55 эсминцы дали до десятка шестиорудийных залпов. Снаряды прошивали корпус насквозь, рвались в котельном отделении и надстройке, снесли трубу и грузовую стрелу. Немцы прекратили огонь, когда «Туман» скрылся в собственной дымовой завесе, — она и спасла многих. Затонул корабль только в 5:50.
        src: "Источник: Кобчиков, «Гангут», 1993 — https://d-pankratov.ru/archives/2489"
        stranica: Кобчиков, «Гангут», 1993
        href: https://d-pankratov.ru/archives/2489
        otryvok: «Эсминцы противника вели артиллерийский огонь 13 минут и до 4 ч 55 мин сделали до десятка шестиорудийных залпов. «Туман» получил 11 прямых попаданий.»
        pometka: документ
        kadr:
          src: kartinka:000658
          alt: "Цветной рисунок: маленький дымящий корабль среди всплесков от снарядов, вдали силуэты эсминцев, низкое солнце."
          data_source: https://goskatalog.ru/portal/#/collections?id=7782304
          license: "цитирование, ст. 1274 ГК РФ, с указанием художника, музея и Госкаталога. Художник П. Павлинов: годы жизни не проверял, общественным достоянием не считать."
          podpis: Открытка «Бой сторожевого корабля „Туман“ с эсминцами противника», художник П. Павлинов, 1974 год.
