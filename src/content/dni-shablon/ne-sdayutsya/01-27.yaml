audioguide:
  audioSrc: audio-guide-tuman-ru.mp3
  durationLabel: 1 минута 32 секунды
  lead: "Голос ведёт от дозора у острова Кильдин через тринадцать минут обстрела к флагу, который подняли под огнём, и к шлюпкам, заткнутым бушлатами: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Дозор
    - t: 16
      mark: 0:16
      title: Три эсминца
    - t: 34
      mark: 0:34
      title: Тринадцать минут
    - t: 55
      mark: 0:55
      title: Флаг
    - t: 72
      mark: 1:12
      title: Шлюпки
  transcript:
    - <p>Сторожевой корабль «Туман» ещё недавно был рыболовным траулером. В войну на него поставили две маленькие пушки и отправили в дозор у острова Кильдин, у входа в Кольский залив. Его задача — заметить врага и предупредить базу.</p>
    - <p>Десятого августа тысяча девятьсот сорок первого года, в четыре часа двадцать пять минут утра, с «Тумана» увидели три немецких эсминца. Каждый — больше чем вдвое длиннее и почти втрое тяжелее. «Туман» сразу передал донесение, и база его приняла.</p>
    - "<p>Эсминцы открыли огонь. Тринадцать минут — одиннадцать прямых попаданий. Командира сбросило за борт, комиссар погиб на мостике. Ответить было нечем: носовая пушка не доставала, кормовую разбило. Командование принял раненый лейтенант Леонид Рыбаков.</p>"
    - <p>На ночь флаг спускали. Теперь лейтенант Михаил Букин приказал поднять его. Раненный в руку рулевой Семёнов и радист Константин Блинов подняли флаг под огнём. Экипаж тушил пожар и сбрасывал за борт горящие боеприпасы.</p>
    - <p>Корабль кренился. Пробоины в шлюпках забили бушлатами и бескозырками, первыми перенесли раненых. Рыбаков ушёл с корабля последним. В пять часов пятьдесят минут «Туман» затонул под поднятым флагом. Из пятидесяти двух моряков спаслись тридцать семь.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
