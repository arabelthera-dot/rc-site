story:
  kicker: Кто она
  h2: Девочка, которая спрашивала про счастье
  abzacy:
    - "Зоя училась в московской школе и лучше всего писала сочинения. Читала Толстого, Сервантеса, Гёте, Гюго, мечтала о Литературном институте. <b>С собой и с другими была требовательна до одиночества</b>: одноклассники её не всегда понимали."
    - В 1940 году она тяжело переболела менингитом — врачи сперва не надеялись. Выжила, долечивалась в санатории в Сокольниках. <b>Вернулась в школу и догнала класс, хотя после болезни учиться было трудно.</b>
    - В санатории она подружилась с Аркадием Гайдаром и спросила его, что такое счастье. «Только, пожалуйста, не отвечайте мне, как Чуку и Геку», — попросила она. Гайдар ответил, что есть большое общее счастье, «ради него живут и умирают настоящие люди». Через год оба погибли на войне.
    - "Разговор с Гайдаром записала мать Зои, Любовь Тимофеевна, в опубликованных воспоминаниях. На прощание писатель подарил Зое книгу с надписью из «Чука и Гека»: «надо честно жить, много трудиться и крепко любить и беречь эту огромную счастливую землю»."
    - "Воспоминания Л. Т. Космодемьянской; цит. по: Горинов, 2003."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Зоя Космодемьянская — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: "<b>С ящика под виселицей Зоя крикнула немцам: «Всех не перевешаете, нас 170 миллионов».</b>"
        det:
          - "Утром 29 ноября 1941 года её вывели к виселице. Она крикнула жителям: «Граждане! Вы не стойте, не смотрите, а надо помогать воевать!» Последние слова дошли в двух записях: В. А. Кулик («Сколько нас не вешайте, всех не перевешаете, нас 170 миллионов») и П. Я. Кулик («Нас еще 170 миллионов, русский народ всегда побеждал»)."
        src: "Источник: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http); «„Смерть Тани“…», «Родина», 13.09.2023 — https://rodina-history.ru/2023/09/13/smert-tani-podvig-zoi-kosmodemianskoj-na-risunke-sovetskogo-shkolnika.html"
        stranica: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: «Граждане! Вы не стойте, не смотрите, а надо помогать воевать!»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-08-goskatalog-24802346.jpg
          alt: Рисунок «Подвиг Зои Космодемьянской», 1942 год (Голованов Л. Ф.)
          data_source: https://goskatalog.ru/portal/#/collections?id=22927992
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Рисунок «Подвиг Зои Космодемьянской», 1942 год (Голованов Л. Ф.).
          credit: Госкаталог Музейного фонда РФ, № 22927992, Переславский музей-заповедник
          width: 800
          height: 637
        utverzhden: 2026-11-03
      - summary: <b>После двухсот ударов ремнём Зоя не назвала ни своего имени, ни товарищей.</b>
        det:
          - "Хозяйка избы, где стоял штаб, А. П. Воронина: «Ее спрашивали и пороли, она молчит… Всего ей дали больше 200 ремней… Держала она себя мужественно, отвечала резко». На допросе Зоя сказала: «Я из Саратова», «Вторая попалась в Кубинке». Утром на вопрос, кто был с ней, ответила: «Со мной никого не было, я одна»."
        src: "Источник: показания А. П. Ворониной, 3.02.1942, по Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http)"
        stranica: показания А. П. Ворониной, 3.02.1942, по Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: «Ее спрашивали и пороли, она молчит… Всего ей дали больше 200 ремней… Держала она себя мужественно, отвечала резко»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-08-goskatalog-20667567.jpg
          alt: «Допрос Зои Космодемьянской». Работа 1942 года (Кириченко)
          data_source: https://goskatalog.ru/portal/#/collections?id=19956207
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: «Допрос Зои Космодемьянской». Работа 1942 года (Кириченко).
          credit: Госкаталог Музейного фонда РФ, № 19956207, КГАУК «КККМ»
          width: 800
          height: 533
        utverzhden: 2026-11-03
      - summary: "<b>Пленный немецкий унтер признал: «Маленькая героиня вашего народа осталась тверда».</b>"
        det:
          - "Карл Бейерлейн, унтер-офицер 10-й роты 332-го пехотного полка, стоял на постое в Петрищеве. В плену он показал: «маленькая героиня вашего народа осталась тверда, она не знала, что такое предательство». Показания хранятся в РГАЛИ, ф. 1865, оп. 1, д. 110, л. 28–29."
        src: "Источник: «Мягков: подвиг Космодемьянской вызвал у солдат святой порыв…», РИА Новости, 13.09.2023 — https://ria.ru/20230913/poryv-1896002196.html; карточка документа, РИО — https://docs.historyrussia.org/ru/nodes/302798"
        stranica: "«Мягков: подвиг Космодемьянской вызвал у солдат святой порыв…», РИА Новости, 13.09.2023"
        href: https://ria.ru/20230913/poryv-1896002196.html
        otryvok: «маленькая героиня вашего народа осталась тверда, она не знала, что такое предательство»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Зоя подожгла три дома с немцами и не ушла к своим, а вернулась в Петрищево второй раз.</b>
        det:
          - "Группы попали в засаду и рассыпались. В Петрищево, в 10 км от совхоза Головково, пошли трое: Борис Крайнов, Зоя и Василий Клубков. В первую ночь сгорели три дома, где стояли немцы, и 20 немецких лошадей, жители не погибли, но остались без крова. Зоя пересидела день в лесу и пошла снова, тогда её и схватили."
        src: "Источник: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http); Ильченко Д. В. «Подвиг Зои Космодемьянской — правда и вымысел», «КиберЛенинка» — https://cyberleninka.ru/article/n/podvig-zoi-kosmodemyanskoy-pravda-i-vymysel"
        stranica: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: «Как выяснилось впоследствии, Зое удалось поджечь три дома. Однако после этого она не вернулась на условленное место, а, пересидев день в лесу, на следующую ночь (или, по показаниям одного из очевидцев, через ночь) вновь пошла в село.»
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-08-goskatalog-2236733.jpg
          alt: "Зимний снимок: бревенчатая стена и сарай под соломенной крышей в снегу"
          data_source: https://goskatalog.ru/portal/#/collections?id=5992212
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Сарай в деревне Петрищево, который подожгла Зоя Космодемьянская. Снимок 1941 года.
          credit: Госкаталог музейного фонда РФ, № 5992212, Государственный центральный музей современной истории России
          width: 800
          height: 497
        utverzhden: 2026-11-03
      - summary: <b>Брат Зои Александр первым ворвался в форт под Кёнигсбергом, и 550 немцев сдались.</b>
        det:
          - "8 апреля 1945 года батарея самоходок СУ-152 гвардии старшего лейтенанта Космодемьянского прошла минное поле и первой прорвалась в форт «Королева Луиза». Гарнизон капитулировал: 550 солдат, 9 исправных танков, склады. 13 апреля он погиб в бою у Фирбруденкруга северо-западнее Кёнигсберга. Похоронен на Новодевичьем кладбище напротив могилы сестры."
        src: "Источник: «Космодемьянский Александр Анатольевич», «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=419"
        stranica: «Космодемьянский Александр Анатольевич», «Герои страны»
        href: https://warheroes.ru/hero/hero.asp?Hero_id=419
        otryvok: «8 апреля в бою северо-западнее Кёнигсберга его батарея, преодалев минное поле и плотный заградительный огонь, первой прорвалась в форт «Королева Луиза» и, нанеся значительный урон противнику мощным огнём, принудила гарнизон форта к капитуляции. В плен сдались 550 солдат, также советским воинам достались 9 исправных танков и склады.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Веру Волошину повесили в один день с Зоей, но узнали об этом только через 16 лет.</b>
        det:
          - Вера Волошина из той же разведгруппы попала в плен одновременно с Зоей. 29 ноября 1941 года её казнили у деревни Головково Наро-Фоминского района. О ней долго ничего не было известно, всё выяснилось только в 1957 году. Звание Героя России ей присвоили посмертно в мае 1994 года.
        src: "Источник: «Герой без срока давности…», «Российская газета», 13.09.2023 — https://rg.ru/2023/09/13/geroj-bez-sroka-davnosti-zoe-kosmodemianskoj-ispolniaetsia-100-let.html; Архивное управление Кузбасса — https://kuzbassarchives.ru/vklad-kuzbassa-v-pobedu/pisma-s-fronta/voloshina-vera-danilovna/"
        stranica: «Герой без срока давности…», «Российская газета», 13.09.2023
        href: https://rg.ru/2023/09/13/geroj-bez-sroka-davnosti-zoe-kosmodemianskoj-ispolniaetsia-100-let.html
        otryvok: «Еще одна - Вера Волошина - попала в плен одновременно с Зоей. О ней долго было ничего не известно. Только в 1957 году выяснилось, она была повешена в один день с Космодемьянской, но в Наро-Фоминском районе.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: "<b>На вопрос «Где Сталин?» Зоя ответила: «Сталин на посту».</b>"
        det:
          - "Хозяйка избы П. Я. Кулик показала: «Немец спросил у нее: „Где Сталин?“ Она ответила: „Сталин на посту“. И после этого отвернулась и сказала: „Я больше с вами разговаривать не буду“». С десяти вечера до двух ночи её водили по деревне босиком по снегу. Пить не дали, а поднесли к лицу горящую керосиновую лампу. Потом разрешили, и она выпила четыре стакана. Пятилетний Юра Седов с печки смотрел «в дырочку», что немцы с ней делают. На немецком снимке казни он находит себя в верхнем левом углу."
        src: "Источник: показания П. Я. Кулик, 3.02.1942, по Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http); ТВ «Звезда», 29.11.2021 — https://tvzvezda.ru/news/20211129134-qSMrl.html"
        stranica: показания П. Я. Кулик, 3.02.1942, по Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: "«Немец спросил у нее: „Где Сталин?“ Она ответила: „Сталин на посту“. И после этого отвернулась и сказала: „Я больше с вами разговаривать не буду“»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Советский боец убил под Смоленском немецкого офицера, у которого в кармане были 5 снимков казни Зои.</b>
        det:
          - "Пять снимков казни нашли у гитлеровского офицера, убитого под деревней Потапово близ Смоленска. 24 октября 1943 года «Правда» опубликовала их. В 1991 году в музей в Петрищеве поступил шестой снимок: его нашли у другого убитого под Смоленском офицера, и сын фронтовика Ю. Е. Дубинкина выполнил просьбу отца передать его музею."
        src: "Источник: «Известия Мордовии», 06.12.2025 — https://izvmor.ru/novosti/obshchestvo/svidetel-podviga-zoi-kosmodemyanskoj-zhurnalist-tass-anatolij-sivczov-rabotal-v-atyasheve/"
        stranica: «Известия Мордовии», 06.12.2025
        href: https://izvmor.ru/novosti/obshchestvo/svidetel-podviga-zoi-kosmodemyanskoj-zhurnalist-tass-anatolij-sivczov-rabotal-v-atyasheve/
        otryvok: «Опубликованные в «Правде» пять фотографий нашли у гитлеровского офицера, убитого советским бойцом под деревней Потапово, близ Смоленска.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Брат Зои на КВ «За Зою» громил ту самую дивизию, что её казнила.</b>
        det:
          - "Зою пытали и казнили солдаты 332-го полка 197-й пехотной дивизии. На башне КВ Александра Космодемьянского было написано «За Зою». Осенью 1943 года под Оршей он с ходу уничтожил с десяток блиндажей и до роты солдат. 30 октября военкор «Комсомольской правды» С. Крушинский передал: «Танковая часть громит 197-ю пехотную дивизию противника». Ещё 3 октября фронтовая газета писала, что пленный унтер этого полка, дрожа, лепетал: «Это сделал не я, это Рюдерер»."
        src: 'Источник: «Комсомольская правда», 29.07.2025 — https://www.kp.ru/daily/27732.3/5120498/; «Аргументы и факты», «"Бей! Бей её!"…» — https://aif.ru/society/history/bey_bey_ee_kogo_i_za_chto_rasstrelyali_po_delu_zoi_kosmodemyanskoy'
        stranica: «Комсомольская правда», 29.07.2025
        href: https://www.kp.ru/daily/27732.3/5120498/
        otryvok: «Танковая часть громит 197-ю пехотную дивизию противника»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Зою взяли в часть, где командир заранее предупредил: «95% из вас погибнут».</b>"
        det:
          - "Секретарь МГК комсомола А. Шелепин сказал добровольцам: «Может случиться, что 95% из вас погибнут. От фашистов не будет никакой пощады». Зою приняли 31 октября 1941 года, а через три недели, 21 ноября, она ушла на задание. 17 ноября вышел приказ Ставки № 0428: жечь населённые пункты в тылу немцев, чтобы выгнать их на мороз."
        src: "Источник: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http); РИА Новости, 13.09.2023 — https://ria.ru/20230913/poryv-1896002196.html"
        stranica: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: «Может случиться, что 95% из вас погибнут. От фашистов не будет никакой пощады»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Прасковья Кулик выгнала из своей избы односельчанок, пришедших бить пленную.</b>
        det:
          - "Утром в дом пришли Федосья Солина и Аграфена Смирнова, оскорбляли избитую девушку и пытались её ударить. Хозяйка на допросе 24 мая 1942 года рассказала: «я стала их выгонять». Уходя, Смирнова бросила в Зою чугун с помоями. Уголовные дела 1942 года рассекретило УФСБ по Москве и области."
        src: "Источник: «Вести Подмосковья», 22.06.2023 — https://vmo24.ru/news/v_fsb_rasskazali_ob_ugolovnyh_delah_v_otnoshenii_treh_zhiteley_podmoskovya_prichastnyh_k_gibeli_zoi_kosmodemyanskoy"
        stranica: «Вести Подмосковья», 22.06.2023
        href: https://vmo24.ru/news/v_fsb_rasskazali_ob_ugolovnyh_delah_v_otnoshenii_treh_zhiteley_podmoskovya_prichastnyh_k_gibeli_zoi_kosmodemyanskoy
        otryvok: «я стала их выгонять»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Трибунал приговорил к расстрелу соседа, выдавшего Зою, и двух женщин, бивших её.</b>
        det:
          - Зою заметил местный житель С. А. Свиридов, немцы выдали ему белую повязку стражника, а наградой стало «угощение вином». 4 июля 1942 года трибунал приговорил его к высшей мере, в 1997 году в реабилитации отказали. Бившие пленную А. В. Смирнова и Ф. В. Солина получили высшую меру 17 июня и 4 сентября 1942 года. Клубкова из её группы обвинили в выдаче и расстреляли 16 апреля 1942 года, но Горинов считает это обвинение сфабрикованным.
        src: "Источник: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http); «Вести Подмосковья», 22.06.2023 — https://vmo24.ru/news/v_fsb_rasskazali_ob_ugolovnyh_delah_v_otnoshenii_treh_zhiteley_podmoskovya_prichastnyh_k_gibeli_zoi_kosmodemyanskoy"
        stranica: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: «Это уголовное дело №4520 рассматривалось на судебном заседании в Москве 4 июля 1942 года Военным Трибуналом Войск НКВД Московского округа. Семен Свиридов был осужден по ст. 58-1 «а» УК РСФСР и приговорен к высшей мере наказания – расстрелу…»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: "<b>Зоя прямо сказала хозяйке избы: «Мне было задание сжечь деревню».</b>"
        det:
          - "Утром хозяйка спросила, как её зовут, и Зоя промолчала. А на вопрос, зачем её прислали, ответила прямо. В 10 часов 30 минут её вывели к виселице: «Шла ровно, с поднятой головой, молча, гордо». На груди висела табличка «Поджигатель» по-русски и по-немецки."
        src: "Источник: показания жителей Петрищева, 3.02.1942, по Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http)"
        stranica: показания жителей Петрищева, 3.02.1942, по Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: «Шла ровно, с поднятой головой, молча, гордо»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-08-goskatalog-2237300.jpg
          alt: Заснеженное поле, голое дерево и избы деревни на горизонте
          data_source: https://goskatalog.ru/portal/#/collections?id=5992779
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Деревня Петрищево, где казнили Зою Космодемьянскую. Снимок 1941 года.
          credit: Госкаталог музейного фонда РФ, № 5992779, Государственный центральный музей современной истории России
          width: 800
          height: 527
        utverzhden: 2026-11-03
      - summary: <b>Лидов и Струнников, открывшие стране «Таню», погибли вместе под одной бомбой.</b>
        det:
          - Очерк Петра Лидова «Таня» вышел в «Правде» 27 января 1942 года. Таней Зоя назвалась в честь героини Гражданской войны Татьяны Соломахи. По снимкам её опознали учительница В. С. Новосёлова и одноклассник В. И. Белокунь, 16 февраля 1942 года ей посмертно дали звание Героя. В ночь с 22 на 23 июня 1944 года на аэродроме под Полтавой одна авиабомба убила фотографа Сергея Струнникова и его друга Лидова.
        src: "Источник: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http); «Война на снимках военкора Сергея Струнникова», «Родина», 07.05.2024 — https://rodina-history.ru/2024/05/07/vojna-na-snimkah-voenkora-sergeia-strunnikova.html"
        stranica: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: «Погиб Сергей Струнников в ночь с 22 на 23 июня 1944 года от авиационной бомбы на военном аэродроме под Полтавой. Эта бомба унесла и жизнь его друга и коллеги Петра Лидова.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: "<b>Аркадий Гайдар, послушав Зою, восхитился: «Она у вас великолепно читает Гёте».</b>"
        det:
          - "После менингита Зоя 40 дней лечилась в санатории в Сокольниках и там подружилась с Гайдаром, книги которого очень любила. Читала Толстого, Сервантеса, Шекспира, Гёте, мечтала о Литературном институте. Её тетрадь заканчивается записью октября 1941 года, словами Гамлета: «Прощай, прощай и помни обо мне!»"
        src: "Источник: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO — http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM (открывается только по http); «Российская газета», 13.09.2023 — https://rg.ru/2023/09/13/geroj-bez-sroka-davnosti-zoe-kosmodemianskoj-ispolniaetsia-100-let.html"
        stranica: Горинов М. М. «Зоя Космодемьянская (1923–1941)», «Отечественная история», 2003, № 1, текст на VIVOS VOCO
        href: http://vivovoco.astronet.ru/VV/JOURNAL/RUHIST/ZOYA.HTM
        otryvok: «Прощай, прощай и помни обо мне!»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-kosmodemyanskaya-ru.mp3
  durationLabel: 1 минута 27 секунд
  lead: "Голос ведёт от горкома комсомола до виселицы в Петрищеве: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Девяносто пять процентов
    - t: 21
      mark: 0:21
      title: Приказ
    - t: 40
      mark: 0:40
      title: Допрос
    - t: 56
      mark: 0:56
      title: Последняя ночь
    - t: 69
      mark: 1:09
      title: Слово
  transcript:
    - "<p>Октябрь сорок первого года, Москва, горком комсомола. Добровольцам говорят прямо: может случиться, что из вас погибнут девяносто пять процентов. Отказавшихся нет. Восемнадцатилетнюю Зою Космодемьянскую сначала не берут — слишком юная. Она добивается своего.</p>"
    - <p>Ноябрь. Приказ — выгнать немцев из тёплых домов на мороз, жечь занятые ими деревни. Среди них Петрищево под Вереей. В первую ночь Зоя поджигает три дома, где стоят солдаты. И на следующую ночь идёт в деревню снова.</p>
    - <p>Её хватают у сарая. На допросе она говорит, что она из Саратова. Её порют ремнями — хозяйка избы насчитает больше двухсот ударов. Ни своего имени, ни имён товарищей она не называет.</p>
    - <p>Всю ночь её водят босиком по снегу. Она просит только пить. Утром хозяйка спрашивает, кто был с ней. Со мной никого не было, отвечает она, я одна.</p>
    - "<p>У виселицы она сама встаёт на ящик и кричит людям: сколько нас не вешайте, всех не перевешаете, нас сто семьдесят миллионов. Так записали очевидцы. Шестнадцатого февраля сорок второго года ей посмертно присвоят звание Героя Советского Союза.</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
razdely: []
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Таня; 2 — Петрищево; 3 — Из Саратова; 4 — 170; 5 — 16 февраля 1942 года."
  ball: 10
  voprosy:
    - q: Под каким именем страна впервые узнала о ней?
      o:
        - Зоя
        - Таня
        - Вера
        - Клава
      a: 1
      e: «Таня» — так назывался очерк Петра Лидова в «Правде» 27 января 1942 года. Настоящее имя установили в феврале.
    - q: В какой деревне её казнили?
      o:
        - Головково
        - Кубинка
        - Кунцево
        - Петрищево
      a: 3
      e: Петрищево под Вереей. В Кунцеве стояла её часть, под Головковом была засада, про Кубинку она сказала на допросе, чтобы запутать врага.
    - q: Что она ответила на допросе на вопрос, откуда она?
      o:
        - Из Саратова
        - Из Москвы
        - Из Калуги
        - Промолчала
      a: 0
      e: «Я из Саратова» — неправда, чтобы враг не вышел на её товарищей. Она была москвичкой.
    - q: Сколько миллионов назвали очевидцы в её последних словах?
      o:
        - "200"
        - "250"
        - "100"
        - "170"
      a: 3
      e: В показаниях жителей 1942 года — «нас 170 миллионов». «Двести миллионов» — в газетном очерке Лидова.
    - q: Когда ей присвоили звание Героя Советского Союза?
      o:
        - 9 мая 1945 года
        - 7 ноября 1941 года
        - 16 февраля 1942 года
        - 22 июня 1942 года
      a: 2
      e: 16 февраля 1942 года, посмертно — через две недели после того, как комиссия установила её имя.
