quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — до 3 тысяч; 2 — уходить в облака; 3 — полторы; 4 — через 20; 5 — по видео самих боевиков.'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: сколько боевиков, по данным разведки, было в районе, куда приземлился лётчик?'
    o:
    - '30'
    - '300'
    - до 3 тысяч
    - до 30 тысяч
    a: 2
    e: Приземлился туда, где разведка насчитала до 3 тысяч боевиков, — с одним пистолетом.
  - q: Что приказал командир ведомому, когда его самолёт подбили?
    o:
    - Атаковать
    - Уходить в облака
    - Садиться рядом
    - Ждать над ним
    a: 1
    e: Сбитый, он первым делом приказал напарнику уходить в облака — спасал его, а не себя.
  - q: Сколько обойм отстрелял раненый лётчик?
    o:
    - Половину
    - Одну
    - Полторы
    - Пять
    a: 2
    e: Раненый, он отстрелял полторы обоймы и не подпускал врага, пока не окружили.
  - q: Через сколько секунд после попадания ракеты он вызывал спасателей?
    o:
    - Через 2
    - Через 20
    - Через 200
    - Через 2000
    a: 1
    e: Через двадцать секунд после попадания ракеты он уже вызывал спасателей.
  - q: Как нашли место боя через два года?
    o:
    - По карте
    - По следам
    - По видео самих боевиков
    - По письму
    a: 2
    e: Место боя нашли через два года по видео самих боевиков — сверяли каждый валун.
