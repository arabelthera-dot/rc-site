story:
  kicker: Подвиг
  h2: Роман Филипов
  abzacy:
  - 3 февраля 2018 года два русских штурмовика Су-25 облетали зону деэскалации «Идлиб» в Сирии. Ведущим был майор Роман Филипов. С земли по его самолёту пустили ракету переносного зенитного комплекса. «В меня попали! Хорошо попали! Тяну на юг...» — спокойно доложил он ведомому. Через двадцать секунд он уже вызывал спасателей, а напарнику приказал уходить в облака.
  - 'Лётчик катапультировался — туда, где, по данным разведки, скопились до 3 тысяч боевиков. Ведомый ослушался приказа и остался над командиром на последнем топливе, сжёг две машины, мчавшиеся к роще. На земле Филипов передавал координаты и отстреливался из пистолета: одну обойму целиком, вторую наполовину. Когда враги окружили его, он крикнул «Это вам за пацанов!» и подорвал себя гранатой. Взрыв унёс и нескольких боевиков. В тот же день наши ракеты накрыли место, откуда стреляли.'
