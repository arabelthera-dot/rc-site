    title: За пацанов
  transcript:
  - 3 февраля 2018 года над сирийской провинцией Идлиб в штурмовик Су-25 майора Романа Филипова попала ракета. «В меня попали! Хорошо попали! Тяну на юг...» — спокойно доложил он.
  - Через двадцать секунд после попадания он уже вызывал спасателей. А напарнику приказал уходить в облака — спасал его, а не себя.
  - Лётчик катапультировался туда, где, по данным разведки, скопились до 3 тысяч боевиков. У него был только пистолет. Раненый, он отстрелял полторы обоймы и до конца передавал на командный пункт координаты.
  - Ведомый нарушил приказ и остался над командиром на последнем топливе. Он сжёг две машины боевиков, мчавшиеся к роще, где был командир.
  - Когда враги окружили лётчика, он крикнул «Это вам за пацанов!» и подорвал себя гранатой. Взрыв унёс и нескольких боевиков. В тот же день наши ракеты накрыли место, откуда стреляли.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
