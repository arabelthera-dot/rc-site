story:
  kicker: Подвиг
  h2: Таня Савичева
  abzacy:
  - Таня Савичева жила с семьёй на Васильевском острове в Ленинграде. Летом 1941 года, когда началась война, ей было одиннадцать. Вместе с другими детьми она очищала чердаки от мусора и собирала бутылки для зажигательной смеси.
  - 'Зимой начался голод. 28 декабря 1941 года умерла старшая сестра Женя, и Таня открыла записную книжку сестры Нины на букве «Ж». За пять месяцев она записала шесть смертей — каждую на свою букву, с днём и часом. 13 мая 1942 года умерла мама. Последние страницы: «Савичевы умерли. Умерли все. Осталась одна Таня».'
  - Но умерли не все. Нину эвакуировали с завода через Ладогу, брат Миша воевал в партизанах. Таню вывезли с детским домом в Красный Бор; из 125 детей она одна не пережила войну и умерла 1 июля 1944 года. Нина вернулась в Ленинград и нашла книжку в Таниной шкатулке. Девять страниц ребёнка стали одним из главных документов блокады.
