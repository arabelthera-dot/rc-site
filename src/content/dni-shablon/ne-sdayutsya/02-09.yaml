  - id: ns-0209-2024
    n: 14
    summary: Дневник ни разу не вывозили из Петербурга — впервые это случилось только в 2024 году.
    det:
    - Подлинник хранится в Музее истории Санкт-Петербурга. Весной 2024 года его впервые показали за пределами города — в Нижегородском кремле, на выставке «Я говорю с тобой из Ленинграда».
    otryvok: Дневник Тани Савичевой из фондов Музея истории Санкт-Петербурга впервые представили за пределами северной столицы – на выставке "Я говорю с тобой из Ленинграда" в Манеже Нижегородского кремля, передает корреспондент РИА Новости.
