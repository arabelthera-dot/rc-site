  - id: ns-0209-ni-zhaloby
    n: 10
    summary: 'Девять страниц — ни одной жалобы; о себе одна строка: «Осталась одна Таня».'
    det:
    - 'Девять страниц дневника — только имена, даты и часы. Ни жалобы, ни слова о голоде и холоде. О себе Таня написала одну строку: «Осталась одна Таня».'
