  - id: ns-0209-krov
    n: 3
    summary: Женя, сама умирая от голода, сдавала кровь раненым и ходила на завод пешком по 7 км.
    det:
    - Старшая сестра Женя работала на заводе. Трамваи стояли, и она каждый день ходила пешком туда и обратно. Истощённая, она продолжала сдавать кровь для раненых. Женя умерла первой — 28 декабря 1941 года.
    otryvok: Сестра, несмотря на сильное истощение, продолжала сдавать кровь для раненых и каждый день проходила семь километров до завода и обратно.
    src: 'Источник: «Аргументы и факты». «9 строк о смерти. Таня Савичева написала самый страшный дневник войны» — https://aif.ru/society/history/9_strok_o_smerti_tanya_savicheva_napisala_samyy_strashnyy_dnevnik_voyny; Life.ru. «„Осталась одна Таня“: что стало с семьёй девочки, чей дневник стал символом блокады Ленинграда» — https://life.ru/p/ostalas-odna-tanya-chto-stalo-s-semey-devochki-chey-dnevnik-stal-simvolom'
