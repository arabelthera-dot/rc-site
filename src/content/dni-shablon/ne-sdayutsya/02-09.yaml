  - id: ns-0209-nina-ladoga
    n: 5
    summary: Нину увезли по Ладоге прямо с завода, предупредить родных не дали, — дома её сочли погибшей.
    det:
    - Нину вместе с заводом срочно эвакуировали через Ладожское озеро. Дать знать домой она не смогла. Нина не вернулась с работы — и родные решили, что её нет в живых.
    otryvok: На самом деле Нину вместе с сотрудниками предприятия срочно эвакуировали через Ладожское озеро.
