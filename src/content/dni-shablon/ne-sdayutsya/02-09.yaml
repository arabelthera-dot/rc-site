    summary: Одиннадцатилетняя Таня лазила по чердакам и собирала бутылки для зажигательной смеси.
    det:
    - Таня вместе с другими детьми очищала чердаки от мусора, чтобы зажигалки не вызвали пожар. Ещё дети искали стеклянную тару для зажигательных бутылок.
    otryvok: Маленькая Таня вместе со своими сверстниками очищала чердаки от мусора и искала стеклянную тару для зажигательных бутылок.
