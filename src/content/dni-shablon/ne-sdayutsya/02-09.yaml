    n: 11
    summary: Шесть смертей в одной квартире меньше чем за пять месяцев — и каждая записана до часа.
    det:
    - 'С 28 декабря 1941 по 13 мая 1942 года Таня записала шесть смертей: Женя, бабушка, Лёка, дядя Вася, дядя Лёша, мама. При каждой — день и час: «в 2 ч ночь», «в 7.30 час утра».'
    otryvok: Дядя Вася умер в 13 апр 2 ч ночь 1942 г.
