    summary: «Умерли все. Осталась одна Таня» — а сестра Нина и брат Миша в это время были живы.
    det:
    - 'Последняя запись дневника — «Савичевы умерли. Умерли все. Осталась одна Таня». Но старшая сестра Нина была жива: её эвакуировали с завода. Брат Миша воевал в партизанах.'
    otryvok: Сегодня мы знаем – старшая сестра Тани, Нина, осталась жива.
