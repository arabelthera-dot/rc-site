  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — «умерла»; 2 — 124; 3 — «Л»; 4 — сестре Нине; 5 — в Нижнем Новгороде.'
  ball: 10
  voprosy:
  - q: Какого слова нет в записи Тани о маме?
    o:
    - «мама»
    - «умерла»
    - «мая»
    - «утра»
    a: 1
    e: 'Запись о маме: «Мама в 13 мая в 7.30 час утра 1942 г.» Слова «умерла» в ней нет.'
  - q: Сколько детей из 125, вывезенных в Красный Бор, пережили войну?
    o:
    - '100'
    - '115'
    - '124'
    - '125'
    a: 2
    e: Из 125 детей войну пережили 124. Не пережила одна — Таня Савичева.
  - q: На какой букве книжки Таня записала смерть брата Лёки?
    o:
    - «Б»
    - «М»
    - «Ж»
    - «Л»
    a: 3
    e: 'Каждая смерть — на свою букву: Ж — Женя, Б — бабушка, Л — Лёка, М — мама.'
  - q: Кому принадлежала записная книжка, в которой Таня вела дневник?
    o:
    - Маме
    - Сестре Нине
    - Брату Мише
    - Учительнице
    a: 1
    e: 'Это была книжка Нины, конструктора: в ней были её записи о трубах и клапанах.'
  - q: Где в 2024 году дневник впервые показали за пределами Петербурга?
    o:
    - В Москве
    - В Нижнем Новгороде
    - В Казани
    - В Арзамасе
    a: 1
    e: Дневник показали в Манеже Нижегородского кремля на выставке «Я говорю с тобой из Ленинграда».
