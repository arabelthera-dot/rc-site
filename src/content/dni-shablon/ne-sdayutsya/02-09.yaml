vizual:
  imya: savicheva-dnevnik
  vid: dokument
  kicker: Документ
  h2: Записная книжка Тани Савичевой
  lead: Разворот с алфавитными вкладками и записью о дяде Васе. Нажми на кнопку — место подсветится на самой странице.
audioguide:
  audioSrc: audio-guide-savicheva-ru.mp3
  durationLabel: около 2 минут
  lead: Послушайте историю дня — около двух минут.
  stops:
  - t: 0
    mark: 0:00
    title: Девять страниц
  - t: 25
    mark: 0:25
    title: Книжка с алфавитом
  - t: 50
    mark: 0:50
    title: Мама
  - t: 75
    mark: '1:15'
    title: Умерли не все
  - t: 100
    mark: '1:40'
    title: Шкатулка
  transcript:
  - 'Девятое февраля. Ленинград, блокада. Одиннадцатилетняя Таня Савичева ведёт дневник. Девять страниц — ни одной жалобы; о себе одна строка: «Осталась одна Таня».'
  - 'Дневник написан в записной книжке старшей сестры Нины. Книжка с алфавитом, как телефонная. Каждая смерть — на свою букву: Женя, бабушка, Лёка, дядя Вася, дядя Лёша. Шесть смертей меньше чем за пять месяцев — и каждая записана до часа.'
  - 'Тринадцатого мая тысяча девятьсот сорок второго года умерла мама. В этой записи нет слова «умерла»: «Мама в тринадцать мая в семь тридцать час утра». Потом последние строки: «Савичевы умерли. Умерли все. Осталась одна Таня».'
  - Но умерли не все. Нину эвакуировали с завода по Ладоге, и родным она дать знать не смогла. Брат Миша уехал за день до войны и ушёл в партизаны. Таню вывезли с детским домом в Красный Бор. Из ста двадцати пяти детей войну не пережила одна — Таня.
  - Нина вернулась в Ленинград и нашла свою книжку в Таниной шкатулке. Так дневник спасла та, кого Таня считала погибшей. Ниже — викторина и источники. Спасибо, что были с нами.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
