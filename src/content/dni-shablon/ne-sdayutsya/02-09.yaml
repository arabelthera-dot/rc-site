  - id: ns-0209-shkatulka
    n: 6
    summary: 'Дневник спасла та, кого Таня считала погибшей: Нина вернулась и нашла книжку в шкатулке.'
    det:
    - После войны Нина вернулась в Ленинград. У родственницы Евдокии она увидела Танину шкатулку. В ней лежала её собственная записная книжка — с девятью страницами, исписанными рукой сестры.
    otryvok: У Евдокии дома она увидела шкатулку, которая среди прочих вещей была у Тани перед эвакуацией. В ней лежала её же записная книжка, запечатлевшая скорбную летопись.
    src: 'Источник: «АиФ Санкт-Петербург». «Девять строчек. История семьи автора блокадного дневника Тани Савичевой» — https://spb.aif.ru/society/people/1431308'
