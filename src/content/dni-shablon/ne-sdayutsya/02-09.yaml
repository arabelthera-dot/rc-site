  - id: ns-0209-bukvy
    n: 7
    summary: 'Каждая смерть — на свою букву книжки: Ж — Женя, Б — бабушка, Л — Лёка, М — мама.'
    det:
    - Книжка была с алфавитом, как телефонная. Таня находила букву имени и на этой странице писала, кто и когда умер. О брате Лёке — на странице «Л».
    otryvok: 'Найдя в записной книжке страницу с буквой «Л» Таня написала о 24-летнем брате: «Лёка умер 17 марта в 5 часов утра в 1942 г.»'
