  - id: ns-0209-125-detej
    n: 2
    summary: Из 125 детей, вывезенных в Красный Бор, войну не пережила одна — Таня Савичева.
    det:
    - Летом 1942 года Таню вывезли с детским домом в посёлок Красный Бор Горьковской области. Из 125 детей войну пережили 124. Таня умерла 1 июля 1944 года.
    otryvok: В посёлок Красный Бор приехали 125 юных пассажиров, 124 из них пережили войну.
    src: 'Источник: RT. «Блокадные строки: 75 лет назад Таня Савичева сделала последнюю запись в своём дневнике» — https://russiatoday.ru/science/article/389021-75-let-tanya-savicheva-blokadnyi-dnevnik'
