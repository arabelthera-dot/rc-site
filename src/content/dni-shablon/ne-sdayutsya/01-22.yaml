story:
  kicker: Среда подвига
  h2: Высота над ущельем
  abzacy:
    - 6-я парашютно-десантная рота 2-го батальона 104-го гвардейского полка стояла в посёлке Черёха под Псковом и входила в 76-ю гвардейскую воздушно-десантную Черниговскую дивизию. Батальоном командовал подполковник Марк Евтюхин, ротой — майор Сергей Молодов.
    - 29 февраля 2000 года батальону приказали занять господствующие высоты у выхода из Аргунского ущелья в Чечне, чтобы не дать боевикам прорваться на равнину и дальше в Дагестан. Шестая рота должна была стоять на высоте 776,0 у селения Улус-Керт. <b>Боевиков в ущелье, по книге «Шаг в бессмертие», скопилось около трёх тысяч; «Российская газета» пишет о двух с половиной тысячах.</b> О том, что они здесь, десантники не знали.
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: 6-я рота, высота 776 — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>На предложение сдать проход за деньги рота ответила отборным матом — «идите вы на…» и много подобного — и приняла бой.</b>
        det:
          - "Разведдозор роты первым столкнулся с боевиками у подножия Исты-Корда. По рации Идрис и Абу Валид уговаривали Евтюхина: «Нас тут очень много, раз в десять больше вас… Ночь, туман — никто не заметит, а мы очень хорошо заплатим». В ответ десантники послали их — «идите вы на…» и ещё очень много подобных выражений: «в ответ раздался такой виртуозный мат, что переговоры прекратились и начался бой». Потом боевики грозили резать десантников «на мясо и отправлять матерям в посылках», никто не дрогнул."
        src: "Источник: А. Гончаров, «Защитники земли русской: подвиг псковских десантников у высоты 776», РИА Новости Крым, 01.03.2025 — https://crimea.ria.ru/20250301/zaschitniki-zemli-russkoy-podvig-pskovskikh-desantnikov-u-vysoty-776-1144558699.html; А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014 — https://rg.ru/2014/03/01/rota-site.html; «Бились до последнего: подвиг десантников 6-й роты у высоты 776», ТВ «Звезда», 04.03.2020 — https://tvzvezda.ru/news/202034126-GymhB.html; Е. Василькова, «Как сражались и погибали псковские десантники», «Российская газета», 28.02.2025 — https://rg.ru/2025/02/28/heroes/prosti-proshchaj-shestaia-rota.html"
        stranica: А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014
        href: https://rg.ru/2014/03/01/rota-site.html
        otryvok: «Обнаружив перед собой десантников, полевые командиры по рации предложили пропустить их за хорошее вознаграждение. В ответ раздался такой виртуозный мат, что переговоры прекратились и начался бой, продолжавшийся без малого 20 часов.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Девяносто десантников уложили около 500 боевиков — а Басаев уверял, что потерял лишь 20 из 700.</b>
        det:
          - Рота встала на высоте 776,0 у выхода из Аргунского ущелья, чтобы боевики не прорвались на равнину и дальше в Дагестан; что их там тысячи, десантники не знали. Боевиков было около 2500 («Российская газета», РВИО), по книге «Шаг в бессмертие» — около трёх тысяч, по календарю музея — две тысячи. «По подсчетам федеральных сил, только погибшими насчитали около пяти сотен боевиков» — по два десятка на каждого десантника. Басаев заявлял о 20 убитых. 2 марта оставшихся боевиков накрыли авиацией и артиллерией.
        src: "Источник: «Погибнуть, но не сдаться: подвиг шестой роты», «История.РФ», 2020 — https://history.ru/read/articles/poghibnut-no-nie-sdatsia-podvigh-shiestoi-roty; «Бились до последнего: подвиг десантников 6-й роты у высоты 776», ТВ «Звезда», 04.03.2020 — https://tvzvezda.ru/news/202034126-GymhB.html; Е. Василькова, «Как сражались и погибали псковские десантники», «Российская газета», 28.02.2025 — https://rg.ru/2025/02/28/heroes/prosti-proshchaj-shestaia-rota.html; Е. Василькова, «Как жили и погибали псковские десантники», «Российская газета», 26.02.2020 — https://rg.ru/2020/02/26/kak-zhili-i-pogibali-pskovskie-desantniki.html; А. Гончаров, РИА Новости Крым, 01.03.2025 — https://crimea.ria.ru/20250301/zaschitniki-zemli-russkoy-podvig-pskovskikh-desantnikov-u-vysoty-776-1144558699.html; ТВ «Звезда», 04.03.2020 — https://tvzvezda.ru/news/202034126-GymhB.html"
        stranica: "«Погибнуть, но не сдаться: подвиг шестой роты», «История.РФ», 2020"
        href: https://history.ru/read/articles/poghibnut-no-nie-sdatsia-podvigh-shiestoi-roty
        otryvok: «Хотя после боя Шамиль Басаев и заявлял, что в его распоряжении было «всего» 700 человек, из которых погибли двадцать, по подсчетам федеральных сил, только погибшими насчитали около пяти сотен боевиков, а общая численность отряда Хаттаба составляла порядка 2500 человек.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Лейтенант Ермаков, раненный в живот, вырвал у боевика кинжал и убил шестерых, пришедших его добить.</b>
        det:
          - "Услышав в эфире, что у Евтюхина кончаются патроны, Олег Ермаков с 15 добровольцами пошёл на помощь «вопреки приказам оставаться на месте». Раненный на подъёме, он остался прикрывать Доставалова с пулемётом. Когда патроны кончились, шестеро боевиков подошли его добить: «подняли на колени, один из террористов приставил к горлу кинжал»; он «вырвал кинжал из рук боевика и бросился на врагов. Все шестеро были убиты в считанные секунды». Сам Ермаков умер от потери крови, посмертно Герой России."
        src: "Источник: «Бились до последнего: подвиг десантников 6-й роты у высоты 776», ТВ «Звезда», 04.03.2020 — https://tvzvezda.ru/news/202034126-GymhB.html; А. Гончаров, «Защитники земли русской: подвиг псковских десантников у высоты 776», РИА Новости Крым, 01.03.2025 — https://crimea.ria.ru/20250301/zaschitniki-zemli-russkoy-podvig-pskovskikh-desantnikov-u-vysoty-776-1144558699.html; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=9796"
        stranica: "«Бились до последнего: подвиг десантников 6-й роты у высоты 776», ТВ «Звезда», 04.03.2020"
        href: https://tvzvezda.ru/news/202034126-GymhB.html
        otryvok: «К нему подошли шесть боевиков, чтобы добить. Подняли на колени, один из террористов приставил к горлу кинжал. И тут истекающий кровью, раненный в живот Олег вырвал кинжал из рук боевика и бросился на врагов.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Комбат Евтюхин спросил живых: «Вызываем огонь на себя?» — и бойцы ответили: «Да».</b>"
        det:
          - "Утром 1 марта, около 6:10, когда почти вся рота погибла, подполковник Марк Евтюхин и корректировщик капитан Виктор Романов вызвали огонь своей артиллерии на себя. Сержант Андрей Поршнев: «„Ребята, вызываем огонь на себя?“ — он спросил у всех ребят, которые остались вот рядом с ним… Мы сказали: „Да, вызываем“». Бой к тому времени шёл почти 19 часов."
        src: "Источник: «В годовщину подвига 6-й роты у высоты 776 вышел фильм Андрея Кондрашова „Высота“», Вести.ru, 02.03.2025 — https://www.vesti.ru/article/4384575; А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014 — https://rg.ru/2014/03/01/rota-site.html; «Бились до последнего: подвиг десантников 6-й роты у высоты 776», ТВ «Звезда», 04.03.2020 — https://tvzvezda.ru/news/202034126-GymhB.html; «Шаг в бессмертие» (источник старой страницы)"
        stranica: «В годовщину подвига 6-й роты у высоты 776 вышел фильм Андрея Кондрашова „Высота“», Вести.ru, 02.03.2025
        href: https://www.vesti.ru/article/4384575
        otryvok: '«"Ребята, вызываем огонь на себя?" – он спросил у всех ребят, которые остались вот рядом с ним. <…> Мы сказали: "Да, вызываем"»'
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Сапёр Колгатин, раненный в грудь, подорвал две мины под атакующими — 11 убитых.</b>
        det:
          - На рассвете 1 марта старший лейтенант Александр Колгатин заметил, что боевики собираются с севера, и под огнём поставил две мины МОН-50. «Когда бандиты ринулись в атаку, смертельно раненный в грудь Александр привел мины в действие. От мощных взрывов погибли 11 бандитов и более десятка были ранены». Это же записано в листовке-представлении, которую видела «Российская газета».
        src: "Источник: «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=6111; Е. Василькова, «Как жили и погибали псковские десантники», «Российская газета», 26.02.2020 — https://rg.ru/2020/02/26/kak-zhili-i-pogibali-pskovskie-desantniki.html"
        stranica: «Герои страны»
        href: https://warheroes.ru/hero/hero.asp?Hero_id=6111
        otryvok: «Под огнем боевиков установил две мины МОН-50. Когда бандиты ринулись в атаку, смертельно раненый в грудь Александр привел мины в действие. От мощных взрывов погибли 11 бандитов и более десятка были ранены.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Доставалов самовольно прорвался к роте: «Семи смертям не бывать!» — и продлил оборону на два часа.</b>"
        det:
          - "Днём 29 февраля он дважды пытался пробиться, ночью 1 марта пробился с 15 бойцами; первым вызвался 19-летний снайпер Александр Коротеев. Владыкин: «Майор поднял вверх сжатую в кулак руку, подошел к комбату, они обнялись. „Семи смертям не бывать! — пошутил Доставалов. — Будем драться!“». Штабная записка: «Рейд майора Доставалова продлил оборону на два часа». Он вынес раненого из-под огня и погиб; за нарушение приказа ему пытались «зарубить» Звезду, но звание Героя России утвердили."
        src: "Источник: Е. Василькова, «Как жили и погибали псковские десантники», «Российская газета», 26.02.2020 — https://rg.ru/2020/02/26/kak-zhili-i-pogibali-pskovskie-desantniki.html; Е. Василькова, «Как сражались и погибали псковские десантники», «Российская газета», 28.02.2025 — https://rg.ru/2025/02/28/heroes/prosti-proshchaj-shestaia-rota.html; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=2062"
        stranica: Е. Василькова, «Как жили и погибали псковские десантники», «Российская газета», 26.02.2020
        href: https://rg.ru/2020/02/26/kak-zhili-i-pogibali-pskovskie-desantniki.html
        otryvok: «Майор поднял вверх сжатую в кулак руку, подошел к комбату, они обнялись. "Семи смертям не бывать! - пошутил Доставалов. - Будем драться!"»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Воробьёв с перебитыми ногами отправил двух бойцов к своим, прикрыл их и убил амира Идриса.</b>
        det:
          - "У командира разведчиков Алексея Воробьёва осколками были перебиты ноги, пули попали в живот и грудь. Рядовые Комаров и Христолюбов хотели вынести его, но он «приказал им прорываться к своим и прикрыл автоматным огнем. Перед смертью он уничтожил полевого командира амира Идриса». В фильме «Высота» о нём вспоминают: «Когда его на утро нашли, он еще был теплый… автомат держал в руках»."
        src: "Источник: А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014 — https://rg.ru/2014/03/01/rota-site.html; «Рота, ушедшая в бессмертие», «Красная звезда», 02.03.2020 — http://redstar.ru/rota-ushedshaya-v-bessmertie/; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=6430; «Высота 776», диорама Студии военных художников им. М. Б. Грекова — https://www.grekovstudio.ru/diorama/vysota-776; «В годовщину подвига 6-й роты у высоты 776 вышел фильм Андрея Кондрашова „Высота“», Вести.ru (ВГТРК), 02.03.2025 — https://www.vesti.ru/article/4384575"
        stranica: А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014
        href: https://rg.ru/2014/03/01/rota-site.html
        otryvok: «Гвардии рядовые Алексей Комаров и Роман Христолюбов попытались вынести с поля боя истекающего кровью командира разведвзвода Алексея Воробьева - у того была перебита артерия на ноге. Старший лейтенант приказал им прорываться к своим и прикрыл автоматным огнем. Перед смертью он уничтожил полевого командира амира Идриса.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Капитан Соколов без руки и ног очнулся и снова взял автомат — рядом насчитали 15 убитых врагов.</b>
        det:
          - "После гибели ротного Молодова раненый Роман Соколов принял командование. В ночь на 1 марта ему оторвало руку, потом миной — ноги. Очнувшись, он «вновь взялся за автомат, когда наемники уже проводили зачистку высоты. Его застрелили в упор… Возле погибшего офицера насчитали 15 трупов боевиков». Цифра в 15 убитых есть и в листовке-представлении к званию Героя: там сказано, что, получив два тяжёлых ранения, Соколов вёл прицельный огонь до последнего патрона."
        src: "Источник: «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=9794; Е. Василькова, «Как жили и погибали псковские десантники», «Российская газета», 26.02.2020 — https://rg.ru/2020/02/26/kak-zhili-i-pogibali-pskovskie-desantniki.html"
        stranica: «Герои страны»
        href: https://warheroes.ru/hero/hero.asp?Hero_id=9794
        otryvok: «Придя в себя, Соколов вновь взялся за автомат, когда наемники уже проводили зачистку высоты. Его застрелили в упор разрывной пулей в лицо. Возле погибшего офицера насчитали 15 трупов боевиков.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Супонинский уже приставил автомат к подбородку — огонь артиллерии вернул его в бой, и он выжил.</b>
        det:
          - "«Ранним утром я пересчитал свои оставшиеся боеприпасы — оказалось шесть патронов… решил покончить с собой: лучше смерть, чем плен. Спасла артиллерия: снаряды придержали „духов“». Из 90 десантников выжили шестеро. Александр Супонинский стал единственным живым Героем России роты, рядовые Христолюбов, Комаров, Поршнев, Владыкин и Тимошенко получили ордена Мужества."
        src: "Источник: А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014 — https://rg.ru/2014/03/01/rota-site.html; «В годовщину подвига 6-й роты у высоты 776 вышел фильм Андрея Кондрашова „Высота“», Вести.ru, 02.03.2025 — https://www.vesti.ru/article/4384575; «Шаг в бессмертие», ЦБС Пскова (источник старой страницы)"
        stranica: А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014
        href: https://rg.ru/2014/03/01/rota-site.html
        otryvok: '«Комбат стал по рации огонь артиллерии на себя вызывать, а я в какой-то момент не выдержал и решил покончить с собой: лучше смерть, чем плен, - рассказал Александр Супонинский. - Спасла артиллерия: снаряды придержали "духов", я пришел в себя, воспрянул и стал стрелять по бандитам.»'
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Романов без ног наводил огонь до конца и передал последнее: «Лево 50. Прощайте, мужики!»</b>"
        det:
          - "Капитан Виктор Романов пошёл с ротой добровольно и корректировал огонь, когда миной ему оторвало ноги. Он приказал ещё живым ползти к обрыву и прыгать. Офицер 4-й роты Владислав Антипов слышал эфир: «Последние слова корректировщика… „Лево 50. Прощайте, мужики!“ И все, больше вообще ничего не было в эфире». На теле Романова насчитали больше 30 ран. По другим данным, приказ прыгать с обрыва отдал лейтенант Дмитрий Кожемякин, а «Прощайте, мужики» ТВ «Звезда» приписывает Евтюхину."
        src: "Источник: «В годовщину подвига 6-й роты у высоты 776 вышел фильм Андрея Кондрашова „Высота“», Вести.ru, 02.03.2025 — https://www.vesti.ru/article/4384575; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=9798; А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014 — https://rg.ru/2014/03/01/rota-site.html; Е. Василькова, «Как сражались и погибали псковские десантники», «Российская газета», 28.02.2025 — https://rg.ru/2025/02/28/heroes/prosti-proshchaj-shestaia-rota.html"
        stranica: «В годовщину подвига 6-й роты у высоты 776 вышел фильм Андрея Кондрашова „Высота“», Вести.ru, 02.03.2025
        href: https://www.vesti.ru/article/4384575
        otryvok: '«Последние слова корректировщика хорошо я помню, он сказал: "Лево 50. Прощайте, мужики!" <…> И все, больше вообще ничего не было в эфире.»'
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Владыкин пополз за спальниками для раненых, попал к боевикам — и вернулся к своим с пулемётом.</b>
        det:
          - "Ночью раненые мёрзли, и Евгений Владыкин пополз за спальными мешками. Он наткнулся на боевиков; «последнее, что помню, как меня два раза ударили прикладом по голове». «Евгений очнулся под утро»: верхней одежды и обуви не было — «видимо боевики сняли». Снял с погибшего товарища сапоги и одежду, «под телом товарища увидел пулемет — забрал его», вышел к реке и с двумя выжившими дошёл до своих."
        src: "Источник: «Вечный бой рядового Владыкина», ГУ МЧС России по Удмуртской Республике, 2020 — https://18.mchs.gov.ru/deyatelnost/press-centr/novosti/4091576; А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014 — https://rg.ru/2014/03/01/rota-site.html"
        stranica: «Вечный бой рядового Владыкина», ГУ МЧС России по Удмуртской Республике, 2020
        href: https://18.mchs.gov.ru/deyatelnost/press-centr/novosti/4091576
        otryvok: «Возле меня были раненые товарищи, и чтоб они не замерзли, я решил сползать за нашими спальными мешками.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Лейтенант Кожемякин три часа не давал обойти высоту, а без патронов дрался штык-ножом.</b>
        det:
          - "Взвод Дмитрия Кожемякина «помешал врагу обойти высоту и взять десантников в кольцо. Он три часа отбивал атаки, а когда закончились боеприпасы, пустил в ход штык-нож». Рядом с его телом нашли убитых в рукопашной боевиков. По «Российской газете» 2025 года, смертельно раненный, он крикнул: «Я прикрою! Если кто выживет, расскажите, как всё было!» «Российская газета» 2014 года приводит похожие слова капитана Романова: «Кто-то должен выжить и рассказать о нас правду. Уходите, пацаны, я вас прикрою»."
        src: "Источник: «Ушедшая рота. Как псковские десантники шагнули в бессмертие», РИА Новости, 29.02.2020 — https://ria.ru/20200229/1565330664.html; А. Гончаров, «Защитники земли русской: подвиг псковских десантников у высоты 776», РИА Новости Крым, 01.03.2025 — https://crimea.ria.ru/20250301/zaschitniki-zemli-russkoy-podvig-pskovskikh-desantnikov-u-vysoty-776-1144558699.html; «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=1866; Е. Василькова, «Как сражались и погибали псковские десантники», «Российская газета», 28.02.2025 — https://rg.ru/2025/02/28/heroes/prosti-proshchaj-shestaia-rota.html"
        stranica: «Ушедшая рота. Как псковские десантники шагнули в бессмертие», РИА Новости, 29.02.2020
        href: https://ria.ru/20200229/1565330664.html
        otryvok: «Так, лейтенант Кожемякин со своим взводом помешал врагу обойти высоту и взять десантников в кольцо. Он три часа отбивал атаки, а когда закончились боеприпасы, пустил в ход штык-нож.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Младший сержант Духин без патронов подпустил врагов и бросился в их гущу с гранатой — 10 убитых.</b>
        det:
          - Утром 1 марта раненый Владислав Духин выносил раненых и увидел, что боевики обходят позиции с трёх сторон. Он «принял решение самому сдерживать боевиков», а когда кончились патроны, «дождался, когда враги приблизились, и с последней гранатой в руках бросился в их гущу». Взрыв убил его и десять боевиков. Посмертно Герой России.
        src: "Источник: «Герои страны» — https://warheroes.ru/hero/hero.asp?Hero_id=6119"
        stranica: «Герои страны»
        href: https://warheroes.ru/hero/hero.asp?Hero_id=6119
        otryvok: «Когда закончились боеприпасы, десантник дождался, когда враги приблизились, и с последней гранатой в руках бросился в их гущу. Владислав Духин погиб, уничтожив при этом взрывом гранаты десять боевиков.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Контуженный сержант Поршнев шёл по оврагу в полный рост — боевики били в упор и не попали.</b>
        det:
          - "По приказу капитана Романова Поршнев и Супонинский ушли вниз, в овраг. «Контуженный Поршнев шел в полный рост. У него кровоточили нос и уши, солдат качался, как пьяный. Боевики стреляли по ним из подствольников практически в упор, но не попали». «Овраг был извилистый и двое десантников скоро скрылись из виду». О бое Поршнев говорил: «Одну волну перестреляем, полчаса передышки — и снова атака»."
        src: "Источник: А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014 — https://rg.ru/2014/03/01/rota-site.html"
        stranica: А. Валагин, «Как живут уцелевшие бойцы 6-й роты», «Российская газета», 01.03.2014
        href: https://rg.ru/2014/03/01/rota-site.html
        otryvok: «Контуженный Поршнев шел в полный рост. У него кровоточили нос и уши, солдат качался, как пьяный. Боевики стреляли по ним из подствольников практически в упор, но не попали.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Грозный назвал улицу именем 84 псковских десантников — единственную такую в городе.</b>
        det:
          - 23 января 2008 года девятая линия в Грозном стала улицей имени 84-х Псковских десантников — «единственная улица в чеченской столице, названная в честь российских воинов, погибших во время войны на Северном Кавказе». Погибшие — уроженцы 47 регионов России, двадцать из Псковской области. Звание Героя России получили 22 бойца, 21 посмертно; памятники стоят в Пскове и Москве, в родных городах есть улицы и доски.
        src: "Источник: «Погибнуть, но не сдаться: подвиг шестой роты», «История.РФ», 2020 — https://history.ru/read/articles/poghibnut-no-nie-sdatsia-podvigh-shiestoi-roty; Е. Василькова, «Как жили и погибали псковские десантники», «Российская газета», 26.02.2020 — https://rg.ru/2020/02/26/kak-zhili-i-pogibali-pskovskie-desantniki.html; «Шаг в бессмертие», ЦБС Пскова (источник старой страницы)"
        stranica: "«Погибнуть, но не сдаться: подвиг шестой роты», «История.РФ», 2020"
        href: https://history.ru/read/articles/poghibnut-no-nie-sdatsia-podvigh-shiestoi-roty
        otryvok: «А 23 января 2008 года в Грозном появилась улица имени 84-х Псковских десантников — единственная улица в чеченской столице, названная в честь российских воинов, погибших во время войны на Северном Кавказе.»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-6-rota-ru.mp3
  durationLabel: 1 минута 5 секунд
  lead: "Голос ведёт от выхода роты на высоту через ночь, когда к ней прорвались свои, — к огню на себя и шестерым выжившим: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Выход на высоту
    - t: 13
      mark: 0:13
      title: «Командиры договорились»
    - t: 29
      mark: 0:29
      title: Ночью пробились свои
    - t: 41
      mark: 0:41
      title: Огонь на себя
    - t: 49
      mark: 0:49
      title: Восемьдесят четыре имени
  transcript:
    - <p>Двадцать девятого февраля двухтысячного года шестая рота псковских десантников вышла на высоту семьсот семьдесят шесть у выхода из Аргунского ущелья. Рота должна была не дать боевикам прорваться из ущелья на равнину.</p>
    - <p>Разведывательный дозор первым столкнулся с боевиками. Те требовали их пропустить и кричали, что командиры договорились. Рота приняла бой. Девяносто десантников — против нескольких тысяч.</p>
    - <p>Майор Александр Доставалов днём дважды пытался пробиться к роте. Ночью первого марта ему это удалось. Он вынес из-под огня раненого солдата и погиб.</p>
    - <p>Когда почти вся рота уже погибла, подполковник Марк Евтюхин и капитан Виктор Романов вызвали огонь своей артиллерии на себя.</p>
    - "<p>Восемьдесят четыре десантника погибли, шестеро остались в живых. Двадцать два бойца стали Героями России. Ниже — карточка каждого из погибших: где родился, кем призван, где похоронен.</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
