quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Занять высоту у выхода из Аргунского ущелья и не дать боевикам прорваться; 2 — «Командиры договорились»; 3 — Группа майора Александра Доставалова; 4 — Вызвали огонь своей артиллерии на себя; 5 — Шестеро."
  ball: 10
  voprosy:
    - q: Какую задачу получила 6-я рота 29 февраля 2000 года?
      o:
        - Взять штурмом село Улус-Керт
        - Занять высоту у выхода из Аргунского ущелья и не дать боевикам прорваться
        - Сопровождать колонну в Дагестан
        - Эвакуировать мирных жителей
      a: 1
      e: Батальону приказали занять господствующие высоты у выхода из Аргунского ущелья. Шестая рота шла на высоту 776,0 у селения Улус-Керт.
    - q: Что кричали боевики, требуя их пропустить?
      o:
        - «Мы сдаёмся»
        - «Здесь мирные жители»
        - «Командиры договорились»
        - «Вы окружены»
      a: 2
      e: "Разведывательный дозор столкнулся с группой больше сорока боевиков; наёмники кричали, чтобы их пропустили: «командиры договорились»."
    - q: Кто ночью 1 марта прорвался к роте на помощь?
      o:
        - Группа майора Александра Доставалова
        - Вертолётный десант
        - Колонна бронетехники
        - Никто не прорвался
      a: 0
      e: Майор Доставалов днём дважды пытался пробиться к роте, а ночью 1 марта прорвался. Он вынес раненого десантника из-под огня и погиб.
    - q: Что сделали подполковник Евтюхин и капитан Романов, когда почти вся рота погибла?
      o:
        - Приказали отступать
        - Сдались в плен
        - Ушли в ущелье
        - Вызвали огонь своей артиллерии на себя
      a: 3
      e: 1 марта, в критический момент, подполковник Марк Евтюхин и корректировщик капитан Виктор Романов вызвали огонь своей артиллерии на себя.
    - q: Сколько десантников из девяноста остались в живых?
      o:
        - Двадцать два
        - Шестеро
        - Ни одного
        - Сорок
      a: 1
      e: 84 десантника погибли, шестеро остались в живых. Двадцать два бойца получили звание Героя России, из них 21 — посмертно.
