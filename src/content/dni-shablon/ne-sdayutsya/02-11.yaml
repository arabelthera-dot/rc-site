story:
  kicker: Подвиг
  h2: Ледокол «Сибиряков»
  abzacy:
    - 25 августа 1942 года, Карское море. Ледокольный пароход «Александр Сибиряков» везёт груз и смену полярников на Северную Землю. На горизонте — большой военный корабль под американским флагом. Он по-русски спрашивает про лёд в проливе Вилькицкого. Капитан Анатолий Качарава не верит и поворачивает к острову Белуха.
    - Это немецкий тяжёлый крейсер «Адмирал Шеер». Он требует спустить флаг и сдаться. У парохода 1909 года постройки — четыре пушчонки, у крейсера — шесть 280-мм орудий. Качарава командует открыть огонь, а радист открытым текстом передаёт на Диксон о рейдере.
    - Пароход горит, но стреляет. Старший механик Николай Бочурко открывает кингстоны, и «Сибиряков» уходит на дно, не спустив флага. Немцы так и не получают сведений о льдах и конвоях, а Диксон успевает приготовиться к обороне. Операция «Вундерланд» срывается.
