        src: "Источник: С. Доморощенов. «Правда Севера», 19.08.2017 — https://pravdasevera.ru/2017/08/19/60b0a0d3b43ef52e7c67b966.html"
        stranica: С. Доморощенов. «Правда Севера», 19.08.2017
        href: https://pravdasevera.ru/2017/08/19/60b0a0d3b43ef52e7c67b966.html
        otryvok: «Но главстаршина Михаил Сараев вскарабкался вверх по мачте и натянул антенну. Радист снова застучал ключом.»
        pometka: один источник
        utverzhden: 2026-11-14
        sravnenie: net
        istochnik: pravdasevera
        dlya_voprosa: false
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - n: 11
        id: ns-0211-benzin
        summary: На палубе рвались бочки с бензином, пароход горел, а его пушки продолжали бить по крейсеру.
        det:
          - После второго залпа «Шеера» на корме взрываются бочки с бензином. Пароход в огне, а его орудия продолжают стрелять.
        src: "Источник: «Независимое военное обозрение», 22.02.2013 — https://nvo.ng.ru/history/2013-02-22/15_sibiryakov.html; С. Доморощенов. «Правда Севера», 19.08.2017 — https://pravdasevera.ru/2017/08/19/60b0a0d3b43ef52e7c67b966.html"
        stranica: «Независимое военное обозрение», 22.02.2013
        href: https://nvo.ng.ru/history/2013-02-22/15_sibiryakov.html
        otryvok: «После второго залпа «Шеера» на «Сибирякове» взорвались сложенные на корме бочки с бензином. Судно охватило пламя, но оно продолжало стрелять из всех орудий.»
        pometka: два источника
        utverzhden: 2026-11-14
        sravnenie: net
        istochnik: nvo
        dlya_voprosa: false
      - n: 12
        id: ns-0211-zapiska
        summary: Самолёт не мог сесть в шторм и сбросил кочегару записку «Мы тебя видим». Сел на четвёртый день.
        det:
          - "Над островом кружит самолёт, но волна слишком большая. Вавилову сбрасывают записку: «Мы тебя видим, но сесть не можем». Самолёт прилетает ещё три дня, сесть удаётся только на четвёртый."
        src: "Источник: «Советский робинзон Павел Вавилов». Государственный научный краеведческий комплекс, Красноярск — https://gnkk.ru/articles/sovetskiy-robinzon-pavel-vavilov/"
        stranica: «Советский робинзон Павел Вавилов». Государственный научный краеведческий комплекс, Красноярск
        href: https://gnkk.ru/articles/sovetskiy-robinzon-pavel-vavilov/
        otryvok: "«И записка: «Мы тебя видим, но сесть не можем, очень большая волна. Завтра прилетим еще. Остерегайся медведей, на соседнем острове их много».»"
        pometka: один источник
        utverzhden: 2026-11-14
        sravnenie: net
        istochnik: gnkk
        dlya_voprosa: false
      - n: 13
        id: ns-0211-prikaz
        summary: По приказу 1965 года каждый корабль у места боя приспускает флаг и даёт гудок.
        det:
          - "Приказ № 103 командующего Северным флотом от 28 апреля 1965 года: проходя в пятимильной зоне от места гибели «Сибирякова», приспустить флаг и дать звуковой сигнал."
        src: "Источник: С. Доморощенов. «Правда Севера», 19.08.2017 — https://pravdasevera.ru/2017/08/19/60b0a0d3b43ef52e7c67b966.html"
        stranica: С. Доморощенов. «Правда Севера», 19.08.2017
        href: https://pravdasevera.ru/2017/08/19/60b0a0d3b43ef52e7c67b966.html
        otryvok: "«по приказу №103 командующего Северным флотом от 28 апреля 1965 года: проходя в пятимильной зоне от места героической гибели «Сибирякова», приспустить флаг, произвести звуковой сигнал»"
        pometka: один источник
        utverzhden: 2026-11-14
        sravnenie: net
        istochnik: pravdasevera
        dlya_voprosa: true
        otvet: "1965"
        otvet_edinstvennyj: true
      - n: 14
        id: ns-0211-kapitan
        summary: В плену матросы выдавали раненого капитана за простого полярника, чтобы немцы его не выпытали.
        det:
          - "Качарава вспоминал: моряки условились не говорить, что с ними капитан. Товарищи называли его профессиональным полярником."
        src: "Источник: С. Доморощенов. «Правда Севера», 19.08.2017 — https://pravdasevera.ru/2017/08/19/60b0a0d3b43ef52e7c67b966.html"
        stranica: С. Доморощенов. «Правда Севера», 19.08.2017
        href: https://pravdasevera.ru/2017/08/19/60b0a0d3b43ef52e7c67b966.html
        otryvok: «Мы условились не говорить, что с нами капитан.»
        pometka: один источник
        utverzhden: 2026-11-14
        sravnenie: net
        istochnik: pravdasevera
        dlya_voprosa: false
      - n: 15
        id: ns-0211-ssha
        summary: Крейсер поднял флаг США и по-русски спросил про лёд. Качарава не поверил и пошёл к острову.
        det:
          - Крейсер вывешивает американский флаг и семафором по-русски спрашивает о льдах в проливе Вилькицкого. Качарава заподозрил неладное и уходит полным ходом к острову Белуха.
        src: "Источник: РИА Новости, 25.08.2017 — https://ria.ru/20170825/1500989319.html"
        stranica: РИА Новости, 25.08.2017
        href: https://ria.ru/20170825/1500989319.html
        otryvok: «крейсер вывесил американский флаг и семафором на русском языке запросил ледовую обстановку в проливе Вилькицкого»
        pometka: один источник
        utverzhden: 2026-11-14
        sravnenie: net
        istochnik: ria
        dlya_voprosa: false
