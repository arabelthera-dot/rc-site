audioguide:
  audioSrc: audio-guide-sibiryakov-ru.mp3
  durationLabel: около 2 минут
  lead: "Голос ведёт от американского флага на крейсере через бой и кингстоны — к острову Белуха и приказу 1965 года: пять остановок."
  stops:
