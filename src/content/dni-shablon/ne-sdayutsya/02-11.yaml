      title: 34 дня на Белухе
  transcript:
    - Двадцать пятое августа тысяча девятьсот сорок второго года, Карское море. К ледокольному пароходу «Сибиряков» подходит крейсер под американским флагом и по-русски спрашивает про лёд. Капитан Анатолий Качарава не верит и уходит к острову Белуха.
    - Это немецкий тяжёлый крейсер «Адмирал Шеер». Он требует спустить флаг. У крейсера шесть пушек калибра двести восемьдесят миллиметров, у парохода — четыре пушчонки. Качарава командует открыть огонь.
    - Немцы глушат эфир, а радист передаёт на Диксон о рейдере. Антенну сбивает — главстаршина Михаил Сараев лезет на мачту и натягивает её заново.
    - Пароход горит. «Открой, Николай, кингстоны!» — кричит капитан. Старший механик Бочурко остаётся в машине, и «Сибиряков» уходит на дно, не спустив флага. Операция немцев в Арктике сорвана.
    - Кочегар Павел Вавилов тридцать четыре дня живёт один на острове Белуха и дожидается самолёта. А с шестьдесят пятого года корабли у места боя приспускают флаг. Ледокол против крейсера — бой приняли и флаг не спустили.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
