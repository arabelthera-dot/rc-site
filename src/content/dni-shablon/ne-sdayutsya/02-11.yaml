quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Ответы: 1 — 280 мм; 2 — четыре; 3 — 34; 4 — американский; 5 — 1965."
  ball: 10
  voprosy:
    - q: Какого калибра были главные пушки «Адмирала Шеера»?
      o:
        - 45 мм
        - 76 мм
        - 150 мм
        - 280 мм
      a: 3
      e: У крейсера было шесть орудий главного калибра 280 мм («АиФ»).
    - q: Сколько пушек было у «Сибирякова»?
      o:
        - одна
        - четыре
        - десять
        - двадцать
      a: 1
      e: У парохода 1909 года постройки — четыре пушки калибра 76 и 45 миллиметров.
    - q: Сколько дней кочегар Павел Вавилов прожил один на острове Белуха?
      o:
        - "3"
        - "10"
        - "34"
        - "100"
      a: 2
      e: «На скалистом острове Белуха он прожил 34 дня» («Правда Севера»).
    - q: Под каким флагом крейсер подошёл к «Сибирякову»?
      o:
        - американским
        - британским
        - шведским
        - японским
      a: 0
      e: Крейсер вывесил американский флаг и семафором по-русски спросил про лёд (РИА Новости).
    - q: В каком году вышел приказ приспускать флаг у места гибели «Сибирякова»?
      o:
        - "1942"
        - "1945"
        - "1965"
        - "1991"
      a: 2
      e: Приказ № 103 командующего Северным флотом — от 28 апреля 1965 года.
