vizual:
  imya: kuzmin-kartina
  vid: dokument
  kicker: Документ
  h2: Картина 1964 года
  lead: 'Картина А. И. Сизаска из музея Великих Лук: последние минуты Матвея Кузьмина. Нажми — и рассмотри лица вблизи.'
audioguide:
  audioSrc: audio-guide-kuzmin-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от немецкой платы за дорогу через ночь в сугробах и засаду курсантов — к плакату и звезде Героя: пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: «Мало. Дёшево купить хотите»
  - t: 25
    mark: 0:25
    title: Сын-«дурачок»
  - t: 50
    mark: 0:50
    title: Ночь в сугробах
  - t: 75
    mark: '1:15'
    title: «Секи их хлеще!»
  - t: 100
    mark: '1:40'
    title: Звезда через 23 года
  transcript:
  - 'Февраль тысяча девятьсот сорок второго года, деревня под Великими Луками. Немецкий офицер предлагает старику Матвею Кузьмину плату за дорогу в тыл нашим. Старик отвечает: «Мало. Дёшево купить хотите».'
  - 'Сначала проводником немцы хотели взять его тридцатитрёхлетнего сына Василия. Отец выдал сына за дурачка и вызвался идти сам. А Василий ушёл к нашим и предупредил: немцев выведут к деревне Малкино.'
  - До наших — шесть километров. Восьмидесятитрёхлетний старик всю ночь водит батальон горных егерей по сугробам и оврагам. У Малкина немцев уже ждут курсанты с пулемётами.
  - 'На рассвете колонна выходит прямо под огонь. Немецкий майор понимает, что старик его перехитрил, — но поздно. Последние слова Кузьмина: «Не жалей Матвея, секи их хлеще!» Более двухсот пятидесяти егерей остаются на снегу.'
  - Летом сорок второго плакат о подвиге выходит тиражом сто тысяч. Звание Героя Советского Союза Матвею Кузьмину дают в шестьдесят пятом. 83-летний крестьянин повторил Сусанина — вывел врага под огонь.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
