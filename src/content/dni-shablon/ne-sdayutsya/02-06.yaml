story:
  kicker: Подвиг
  h2: Матвей Кузьмин
  abzacy:
  - Февраль 1942 года, деревня под Великими Луками. Батальону немецких горных егерей нужен проводник в тыл нашим войскам на Малкинских высотах. Немцы хотят взять 33-летнего Василия, сына Матвея Кузьмича Кузьмина. Отец выдаёт сына за дурачка и вызывается вести сам. За дорогу ему сулят деньги, муку, керосин и двустволку «Три кольца».
  - 'Василий тем временем уходит к нашим и предупреждает полковника Горбунова: немцев выведут к деревне Малкино. Там занимает позицию 2-й батальон 31-й отдельной курсантской стрелковой бригады. А 83-летний старик всю ночь водит батальон по сугробам и оврагам.'
  - На рассвете колонна выходит прямо под пулемёты. Командир егерей понимает, что старик его перехитрил, и стреляет. «Не жалей Матвея, секи их хлеще!» — кричит Кузьмин курсантам. Более 250 егерей остаются на снегу. В 1965 году Матвею Кузьмину посмертно присвоено звание Героя Советского Союза.
