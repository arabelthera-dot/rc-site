  - q: В каком году родился Матвей Кузьмин?
    o:
    - '1858'
    - '1870'
    - '1890'
    - '1901'
    a: 0
    e: По «Героям страны», Кузьмин родился 15 августа 1858 года — на 12 лет раньше Ленина.
  - q: Сколько километров было от деревни до позиций наших войск?
    o:
    - '2'
    - '6'
    - '20'
    - '50'
    a: 1
    e: Малкинские высоты — в 6 километрах юго-восточнее Великих Лук, а старик водил батальон всю ночь.
  - q: Сколько горных егерей погибло у Малкина?
    o:
    - около 30
    - ровно 100
    - более 250
    - около 1000
    a: 2
    e: 'Псковская областная библиотека пишет: более двухсот пятидесяти егерей были уничтожены.'
  - q: Каким тиражом вышел плакат о подвиге летом 1942 года?
    o:
    - 1 000
    - 10 000
    - 100 000
    - 1 000 000
    a: 2
    e: Издательство «Искусство» отпечатало плакат стотысячным тиражом.
  - q: В каком году Матвею Кузьмину присвоили звание Героя Советского Союза?
    o:
    - '1942'
    - '1945'
    - '1965'
    - '1985'
    a: 2
    e: Указ вышел 8 мая 1965 года — через 23 года после подвига.
