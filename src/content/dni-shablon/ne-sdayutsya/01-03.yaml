story:
  kicker: Подвиг · 5 ударов
  h2: Два часа, которые задержали колонну
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Полк получил приказ отходить. Двадцатилетний старший сержант Николай Сиротинин остался у моста один — с одной 76-миллиметровой пушкой.
      det:
        - 17 июля 1941 года, деревня Сокольничи под Кричевом, мост через реку Добрость на Варшавском шоссе — единственный мост на участке. Кто удержит его, тот спасёт отходящий полк.
      src: "Источники: «Подвиг», «Российская газета», 22.07.2010; телеканал «Звезда», материал о Сиротинине."
    - summary: "Первым выстрелом он подбил головной танк, вторым — замыкающую машину. Колонна встала: вперёд не пройти, назад не свернуть."
      find: true
      tag: Находка дня
      det:
        - Колонна 4-й танковой дивизии оказалась запертой на шоссе. Пока она стояла, полк за спиной отходил.
      src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; «Подвиг», «Российская газета», 22.07.2010."
    - summary: Около двух часов шёл бой, и противник не мог понять, что орудие одно.
      find: true
      tag: Находка дня
      det:
        - Пушка стояла в высокой ржи на бугре. Немцы были уверены, что по ним бьёт батарея, и позицию нашли только мотоциклисты-разведчики.
      src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; телеканал «Звезда», материал о Сиротинине."
    - summary: Когда снаряды кончились, он отстреливался из карабина до последнего патрона. Сдаться отказался.
      det:
        - Канонический итог боя — одиннадцать танков, семь бронеавтомобилей, пятьдесят семь солдат. Немецкими документами эти цифры не подтверждены.
      src: "Источники: «Убит непобеждённым», «АиФ-Черноземье»; старая страница музея (mlyn.by, krichev.gov.by, voentv.mil.by)."
    - summary: "Немецкие офицеры отдали честь на его похоронах. Суть не в числах: двадцать лет, один ствол и выбор не сдаться."
      find: true
      tag: Находка дня
      det:
        - Рассказ о похоронах известен по записи, приписываемой дневнику обер-лейтенанта Ф. Хенфельда (немецкий оригинал не найден), и по воспоминаниям жителей Сокольничей.
      src: "Источники: «Подвиг», «Российская газета», 22.07.2010; «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; телеканал «Звезда», материал о Сиротинине."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Николае Сиротинине
    h2: Один у моста
    udary:
      - summary: <b>Сиротинин дрался так, что враг хоронил его с тремя залпами и крестом с его каской.</b>
        det:
          - Немцы согнали жителей Сокольничей, тело завернули в плащ-палатку. На могиле поставили деревянный крест с простреленной каской и трижды дали залп.
          - Оберст перед строем сказал, что если бы все солдаты фюрера дрались, как этот русский, они завоевали бы весь мир. По «СБ», немцы при этом сняли перчатки и каски.
        src: "Источники: «Подвиг», «Российская газета», 22.07.2010; «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; телеканал «Звезда», материал о Сиротинине."
        href: https://rg.ru/2010/07/22/podvig.html
        pometka: два источника
      - summary: <b>Сиротинин погиб так, что немецкий командир велел написать его матери, каким героем был сын.</b>
        det:
          - Ольга Борисовна Вержбицкая знала немецкий. После похорон немецкий «главный начальник» дал ей документ погибшего.
          - Молодой офицер, стоявший у могилы, вырвал у неё бумажку и медальон. Это записано по воспоминаниям очевидцев, про медальон пишет и «Звезда».
        src: "Источники: «Убит непобеждённым», «АиФ-Черноземье»; телеканал «Звезда», материал о Сиротинине."
        otryvok: «Возьми этот документ и напиши родным. Пусть мать знает, каким героем был её сын и как он погиб».
        href: https://chr.aif.ru/orel/people/ubit_nepobezhdyonnym_kak_russkiy_soldat_sderzhal_nemeckuyu_tankovuyu_kolonnu
        pometka: два источника
      - summary: <b>Сиротинин двумя выстрелами закупорил колонну на шоссе — и остался, хотя мог уйти.</b>
        det:
          - "Первым выстрелом он подбил головной танк, вторым — замыкающую машину. Колонна 4-й танковой дивизии встала на Варшавском шоссе у моста через Добрость: ни вперёд, ни назад."
          - У него оставалось около 60 снарядов, и он остался с ними один («СБ»).
        src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; «Подвиг», «Российская газета», 22.07.2010."
        href: https://www.sb.by/articles/emu-otdavali-chest-vragi-.html
        pometka: два источника
        kadr: &a1
          src: /muzei/ne-sdayutsya/img/01-03-goskatalog-13617029.jpg
          width: 800
          height: 600
          alt: Советская пушка времён Великой Отечественной войны со щитом и раздвижными станинами в музейном зале
          data_source: https://goskatalog.ru/portal/#/collections?id=13617029
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Советское орудие военных лет в музейном зале: щит, длинный ствол, две станины. Один человек у такой пушки — наводчик без расчёта."
          credit: Госкаталог музейного фонда РФ, id 13617029.
      - summary: <b>Сиротинин стрелял так, что немцы искали батарею, — а у пушки нашли одного солдата.</b>
        det:
          - "Учительница немецкого Мария Ивановна Грабская рассказывала, что немцы были уверены: по их танкам бьёт батарея. Колонна смогла войти в Сокольничи только через пару часов и удивилась, найдя у пушки одного солдата."
          - Пригорок у моста в деревне до сих пор зовут «сиротининским».
        src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; «Подвиг», «Российская газета», 22.07.2010."
        otryvok: "«…были уверены: огонь по их танкам вела батарея»."
        href: https://www.sb.by/articles/emu-otdavali-chest-vragi-.html
        pometka: два источника
      - summary: <b>Раненый командир отошёл, а двадцатилетний Сиротинин отказался уйти от пушки.</b>
        det:
          - Шёл июль 1941 года, полк отходил на восток. У засадного 76-мм орудия первым номером был сам командир батареи, вторым вызвался Сиротинин.
          - "На рассвете командира ранило осколком в руку, и он ушёл к переправе. Сиротинин остался у пушки один («Звезда»: вероятно, не хотел бросать снаряды)."
        src: "Источники: телеканал «Звезда», материал о Сиротинине; «Подвиг», «Российская газета», 22.07.2010."
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
        pometka: два источника
      - summary: <b>Сиротинин стрелял из высокой ржи, и немцам пришлось послать мотоциклистов искать пушку.</b>
        det:
          - Орудие стояло в высокой ржи на холме, и откуда бьют, немцы понять не могли. Позицию нашла разведка автоматчиков-мотоциклистов, когда снаряды почти кончились.
          - По «Звезде», бой длился почти три часа.
        src: "Источник: телеканал «Звезда», материал о Сиротинине."
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
      - summary: <b>Сиротинин расстрелял все снаряды, отстреливался из карабина и не сдался.</b>
        det:
          - Немцы вышли на позицию, когда, по «АиФ», у него оставалось три снаряда. На предложение сдаться он ответил огнём из карабина и погиб у орудия 17 июля 1941 года.
        src: "Источники: «Убит непобеждённым», «АиФ-Черноземье»; телеканал «Звезда», материал о Сиротинине; старая страница музея (mlyn.by, krichev.gov.by, voentv.mil.by)."
        href: https://chr.aif.ru/orel/people/ubit_nepobezhdyonnym_kak_russkiy_soldat_sderzhal_nemeckuyu_tankovuyu_kolonnu
        pometka: два источника
      - summary: <b>Сиротинин бился так, что немцы после боя стояли у пушки и подсчитывали его выстрелы.</b>
        det:
          - После похорон немцы долго стояли у пушки и могилы и «не без восхищения» считали выстрелы и попадания.
          - Житель Иван Кашуро рассказывал о трёх пробоинах в щитке, в каждую влезали три пальца. Каска тоже была пробита, вокруг лежали гильзы.
        src: "Источник: телеканал «Звезда», материал о Сиротинине."
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
        kadr: &a4
          src: /muzei/ne-sdayutsya/img/01-03-goskatalog-12025903.jpg
          width: 1200
          height: 1600
          klass: portret
          alt: Стреляная гильза артиллерийского снаряда с рваной пробоиной в стенке, рядом масштабная линейка
          data_source: https://goskatalog.ru/portal/#/collections?id=12025903
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Стреляная артиллерийская гильза из музейного собрания. Такие гильзы, по рассказам жителей, лежали вокруг пушки Сиротинина после боя.
          credit: Госкаталог музейного фонда РФ, id 12025903.
      - summary: <b>Сиротинин остался без Звезды Героя, потому что его единственное фото потеряли в эвакуации.</b>
        det:
          - Жители Кричева хлопотали о звании Героя, но для документов нужна была фотография. Сестра Таисия рассказывала, что мама отдала карточку увеличить, а мастер её потерял.
          - "В итоге его посмертно наградили орденом Отечественной войны I степени (представление подано в 1960 году). По «Звезде», формальная причина отказа другая: представление должен был подписать непосредственный командир."
        src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; «Убит непобеждённым», «АиФ-Черноземье»; телеканал «Звезда», материал о Сиротинине."
        otryvok: «Единственная его карточка с паспорта… в эвакуации в Мордовии мама отдала её увеличить. А мастер её потерял!»
        href: https://www.sb.by/articles/emu-otdavali-chest-vragi-.html
        pometka: два источника
      - summary: <b>Сиротинин, по канонической версии, вывел из строя 11 танков, 7 бронемашин и 57 солдат.</b>
        det:
          - Эти цифры приняты в русских и белорусских источниках. Немецкими документами они не подтверждены.
          - Колонна стояла около двух часов, по «Звезде» — почти три.
        src: "Источники: старая страница музея (mlyn.by, krichev.gov.by, voentv.mil.by); телеканал «Звезда», материал о Сиротинине."
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
        pometka: легенда
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Как вернули имя
    udary:
      - summary: <b>Краевед Мельников перебрал «Сиротина», «Сироткина», «Сиротку» — и через 20 лет вернул герою имя.</b>
        det:
          - Зацепкой были только рассказы жителей Сокольничей, которые называли фамилию нечётко. Фамилию нашли в конце 1950-х, а окончательно подтвердили в начале 1960-х, после многих перепроверок.
          - Поиск вели краеведы под руководством М. Ф. Мельникова. Ольга Вержбицкая была очевидицей и переводчицей.
        src: "Источник: виртуальная выставка «М. Ф. Мельников», Зональный государственный архив в г. Кричеве."
        href: https://archives.gov.by/wp-content/uploads/files/virt_vyst/zgakr_melnikov.pdf
        pometka: документ
        kadr: &a3
          src: /muzei/ne-sdayutsya/img/01-03-camo-58-977531-39-l780.jpg
          width: 1120
          height: 1684
          klass: portret
          alt: "Анкета на разыскиваемого военнослужащего: Сиротинин Николай Владимирович, командир орудия, 1921 года рождения, разыскивает мать"
          data_source: ЦАМО, ф. 58, оп. 977531, д. 39, л. 780 (копия из базы «Память народа»)
          license: официальный документ — не объект авторского права (подп. 1 п. 6 ст. 1259 ГК РФ)
          podpis: "Анкета Орловского горвоенкомата: Сиротинин, командир орудия, 1921 года, призван в октябре 1940-го, письма прекратились в июле 1941-го. Ищет его мать, Елена Корнеевна."
          credit: Центральный архив Министерства обороны РФ, ф. 58, оп. 977531, д. 39, л. 780.
      - summary: <b>Запись немецкого офицера о «русском у пушки» дошла до Симонова и запустила поиск героя.</b>
        det:
          - Подвиг известен по записи, приписываемой дневнику обер-лейтенанта Фридриха Хенфельда из 4-й танковой дивизии. Немецкий оригинал не найден, подлинность записи не подтверждена.
          - Журналист Фёдор Селиванов показал запись К. Симонову, в поиске помогали С. Смирнов и маршал В. Куликов. В 1958 году «Огонёк» напечатал статью «Легенда о подвиге», и из неё о подвиге узнали родные. Кто автор статьи, источники называют по-разному.
        src: "Источники: телеканал «Звезда», материал о Сиротинине; виртуальная выставка «М. Ф. Мельников», Зональный государственный архив в г. Кричеве."
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
        pometka: два источника
        kadr: &a2
          src: /muzei/ne-sdayutsya/img/01-03-camo-58-977531-39-l778.jpg
          width: 1120
          height: 1700
          klass: portret
          alt: Машинописное письмо Орловского горвоенкомата 1958 года о розыске Николая Владимировича Сиротинина с рукописными пометами
          data_source: ЦАМО, ф. 58, оп. 977531, д. 39, л. 778 (копия из базы «Память народа»)
          license: официальный документ — не объект авторского права (подп. 1 п. 6 ст. 1259 ГК РФ)
          podpis: "Орловский горвоенкомат, май 1958 года: материал по розыску Сиротинина отправлен в Москву со ссылкой на «Огонёк» № 10 за 1958 год. В письме — 16 июля и 55-й стрелковый полк 6-й дивизии: архив расходится со статьями."
          credit: Центральный архив Министерства обороны РФ, ф. 58, оп. 977531, д. 39, л. 778.
      - summary: <b>Анна Поклад поила Сиротинина молоком перед боем — а потом годами ухаживала за его могилой.</b>
        det:
          - Анна Фёдоровна Поклад звала его «дите горькое». Ей он рассказал про сестёр Нину и Таисию и брата Вениамина. Её собственный сын тоже погиб на войне.
          - Через три года после войны останки Сиротинина перенесли в братскую могилу в Кричеве.
        src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; виртуальная выставка «М. Ф. Мельников», Зональный государственный архив в г. Кричеве."
        href: https://www.sb.by/articles/emu-otdavali-chest-vragi-.html
        pometka: два источника
      - summary: <b>Сокольничи поставили Сиротинину обелиск и 76-мм пушку на постаменте — в 1961 году.</b>
        det:
          - Обелиск с пушкой стоит у места боя, полный текст надписи есть в «СБ». Улицы его имени есть в Кричеве и Орле.
        src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; старая страница музея (krichev.gov.by)."
        href: https://www.sb.by/articles/emu-otdavali-chest-vragi-.html
      - summary: <b>Орловцы на свои деньги поставили пушку ЗиС-2 в сквере Артиллеристов в память о Сиротинине.</b>
        det:
          - В родном Орле подвиг долго ничем не был отмечен. Сквер с пушкой и памятной табличкой сделали на народные деньги, а мастер отреставрировал орудие бесплатно.
          - Позже его имя присвоили орловской школе № 7.
        src: "Источники: телеканал «Звезда», материал о Сиротинине; «Убит непобеждённым», «АиФ-Черноземье»."
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
