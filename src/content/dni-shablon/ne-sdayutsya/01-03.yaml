story:
  kicker: Подвиг · 5 ударов
  h2: Два часа, которые задержали колонну
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: Полк получил приказ отходить. Двадцатилетний старший сержант Николай Сиротинин остался у моста один — с одной 76-миллиметровой пушкой.
      det:
        - 17 июля 1941 года, деревня Сокольничи под Кричевом, мост через реку Добрость на Варшавском шоссе — единственный мост на участке. Кто удержит его, тот спасёт отходящий полк.
      src: "Источники: «Подвиг», «Российская газета», 22.07.2010; телеканал «Звезда», материал о Сиротинине."
    - summary: "Первым выстрелом он подбил головной танк, вторым — замыкающую машину. Колонна встала: вперёд не пройти, назад не свернуть."
      find: true
      tag: Находка дня
      det:
        - Колонна 4-й танковой дивизии оказалась запертой на шоссе. Пока она стояла, полк за спиной отходил.
      src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; «Подвиг», «Российская газета», 22.07.2010."
    - summary: Около двух часов шёл бой, и противник не мог понять, что орудие одно.
      find: true
      tag: Находка дня
      det:
        - Пушка стояла в высокой ржи на бугре. Немцы были уверены, что по ним бьёт батарея, и позицию нашли только мотоциклисты-разведчики.
      src: "Источники: «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; телеканал «Звезда», материал о Сиротинине."
    - summary: Когда снаряды кончились, он отстреливался из карабина до последнего патрона. Сдаться отказался.
      det:
        - Канонический итог боя — одиннадцать танков, семь бронеавтомобилей, пятьдесят семь солдат. Немецкими документами эти цифры не подтверждены.
      src: "Источники: «Убит непобеждённым», «АиФ-Черноземье»; старая страница музея (mlyn.by, krichev.gov.by, voentv.mil.by)."
    - summary: "Немецкие офицеры отдали честь на его похоронах. Суть не в числах: двадцать лет, один ствол и выбор не сдаться."
      find: true
      tag: Находка дня
      det:
        - Рассказ о похоронах известен по записи, приписываемой дневнику обер-лейтенанта Ф. Хенфельда (немецкий оригинал не найден), и по воспоминаниям жителей Сокольничей.
      src: "Источники: «Подвиг», «Российская газета», 22.07.2010; «Ему отдавали честь враги…», «СБ. Беларусь сегодня», 27.06.2009; телеканал «Звезда», материал о Сиротинине."
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о Николае Сиротинине
    h2: Один у моста
    udary:
      - summary: <b>Сиротинин дрался так, что враг хоронил его с тремя залпами и крестом с его каской.</b>
        det:
          - "Немцы согнали жителей Сокольничей, тело завернули в плащ-палатку. На могиле поставили деревянный крест с простреленной каской и трижды дали залп. Немецкий командир сказал солдатам: «Если бы вы воевали, как этот русский, армия фюрера уже праздновала бы победу». По «СБ», немцы при этом сняли перчатки и каски."
        src: "Источник: РГ (https://rg.ru/2010/07/22/podvig.html); СБ (https://www.sb.by/articles/emu-otdavali-chest-vragi-.html); ЗВЕЗДА (https://tvzvezda.ru/news/20201141640-tXxSs.html)"
        stranica: РГ
        href: https://rg.ru/2010/07/22/podvig.html
        otryvok: «Если бы вы воевали, как этот русский, армия фюрера уже праздновала бы победу»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: "<b>Сиротинин погиб так, что немецкий командир велел написать его матери: каким героем был сын.</b>"
        det:
          - "Ольга Борисовна Вержбицкая знала немецкий. После похорон немецкий «главный начальник» дал ей документ погибшего: «Возьми этот документ и напиши родным. Пусть мать знает, каким героем был её сын и как он погиб». Молодой офицер, стоявший у могилы, вырвал у неё бумажку и медальон. Так вспоминала сама Вержбицкая (АиФ)."
        src: "Источник: АиФ (https://chr.aif.ru/orel/people/ubit_nepobezhdyonnym_kak_russkiy_soldat_sderzhal_nemeckuyu_tankovuyu_kolonnu)"
        stranica: АиФ
        href: https://chr.aif.ru/orel/people/ubit_nepobezhdyonnym_kak_russkiy_soldat_sderzhal_nemeckuyu_tankovuyu_kolonnu
        otryvok: «Возьми этот документ и напиши родным. Пусть мать знает, каким героем был её сын и как он погиб».
        pometka: два источника
        kadr:
          src: kartinka:000515
          alt: Чёрный восьмигранный пластмассовый смертный медальон РККА с отвинченной крышкой и резьбой
          data_source: https://goskatalog.ru/portal/#/collections?id=3743748
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Смертный медальон красноармейца с адресом матери внутри — такой медальон немецкий офицер вырвал у Ольги Вержбицкой вместе с документом Сиротинина.
          credit: "Медальон смертный служащего РККА, начало 1940-х; Музейный комплекс им. И. Я. Словцова (Тюмень); ТОКМ ОФ-2702/1, Госкаталог № 3158799; «Источник: goskatalog.ru»"
          width: 533
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Сиротинин двумя выстрелами закупорил колонну на шоссе — и остался, хотя мог уйти.</b>
        det:
          - "Первым выстрелом он подбил головной танк, вторым замыкающую машину. Колонна 4-й танковой дивизии встала на Варшавском шоссе у моста через Добрость: ни вперёд, ни назад. У него оставалось около 60 снарядов, и он остался с ними один («СБ»)."
        src: "Источник: СБ (https://www.sb.by/articles/emu-otdavali-chest-vragi-.html); ЗВЕЗДА (https://tvzvezda.ru/news/20201141640-tXxSs.html); РГ (https://rg.ru/2010/07/22/podvig.html)"
        stranica: СБ
        href: https://www.sb.by/articles/emu-otdavali-chest-vragi-.html
        otryvok: «Когда на рассвете показались немецкие танки, Николай подорвал головную машину и ту, что замыкала колонну, образовав пробку на дороге. Выполнив задачу, он, наверное, мог уйти к своим. Но остался, ведь у него было еще около 60 снарядов!»
        pometka: два источника
        kadr:
          src: kartinka:000516
          width: 800
          height: 600
          alt: Советская пушка времён Великой Отечественной войны со щитом и раздвижными станинами в музейном зале
          data_source: https://goskatalog.ru/portal/#/collections?id=13617029
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Советское орудие военных лет в музейном зале: щит, длинный ствол, две станины. Один человек у такой пушки — наводчик без расчёта."
          credit: Госкаталог музейного фонда РФ, id 13617029.
        utverzhden: 2026-11-03
      - summary: <b>Сиротинин стрелял так, что немцы искали батарею, — а у пушки нашли одного солдата.</b>
        det:
          - "Учительница немецкого Мария Ивановна Грабская рассказывала, что немцы «были уверены: огонь по их танкам вела батарея». Колонна смогла войти в Сокольничи только через пару часов и удивилась, найдя у пушки одного солдата. Пригорок у моста в деревне до сих пор зовут «сиротининским»."
        src: "Источник: СБ (https://www.sb.by/articles/emu-otdavali-chest-vragi-.html); РГ (https://rg.ru/2010/07/22/podvig.html)"
        stranica: СБ
        href: https://www.sb.by/articles/emu-otdavali-chest-vragi-.html
        otryvok: "«были уверены: огонь по их танкам вела батарея»"
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Раненый командир отошёл, а двадцатилетний Сиротинин отказался уйти от пушки.</b>
        det:
          - "Шёл июль 1941 года, полк отходил на восток. У замаскированного противотанкового орудия остались двое: командир орудия, лейтенант, и Сиротинин. На рассвете 17 июля командира ранило осколком в руку, и он ушёл к переправе. Сиротинин остался у пушки один."
        src: "Источник: ЗВЕЗДА (https://tvzvezda.ru/news/20201141640-tXxSs.html); РГ (https://rg.ru/2010/07/22/podvig.html)"
        stranica: ЗВЕЗДА
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
        otryvok: «На рассвете 17 июля немцы начали обстрел деревни, осколком был ранен в руку лейтенант - командир орудия. Он покинул позицию и поспешил к переправе. Старший сержант Сиротинин остался один.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Сиротинин стрелял из высокой ржи, и немцам пришлось послать мотоциклистов искать пушку.</b>
        det:
          - Орудие стояло в высокой ржи на холме, и откуда бьют, немцы понять не могли. Позицию нашла разведка автоматчиков-мотоциклистов, когда снаряды почти кончились. По «Звезде», бой длился почти три часа.
        src: "Источник: ЗВЕЗДА (https://tvzvezda.ru/news/20201141640-tXxSs.html)"
        stranica: ЗВЕЗДА
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
        otryvok: «Фашисты выслали разведку автоматчиков-мотоциклистов. Они и определили позицию орудия, открыли по нему огонь.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Сиротинин расстрелял все снаряды, отстреливался из карабина и не сдался.</b>
        det:
          - Немцы вышли на позицию, когда, по АиФ, у него оставалось три снаряда. На предложение сдаться он ответил огнём из карабина и погиб у орудия 17 июля 1941 года, после почти трёхчасового боя («Звезда»).
        src: "Источник: АиФ (https://chr.aif.ru/orel/people/ubit_nepobezhdyonnym_kak_russkiy_soldat_sderzhal_nemeckuyu_tankovuyu_kolonnu); ЗВЕЗДА (https://tvzvezda.ru/news/20201141640-tXxSs.html)"
        stranica: АиФ
        href: https://chr.aif.ru/orel/people/ubit_nepobezhdyonnym_kak_russkiy_soldat_sderzhal_nemeckuyu_tankovuyu_kolonnu
        otryvok: «А когда вышли на Колину позицию, у того осталось всего три снаряда. Предлагали сдаться, но он ответил им пальбой из карабина.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Сиротинин бился так, что немцы после боя стояли у пушки и подсчитывали его выстрелы.</b>
        det:
          - После похорон немцы долго стояли у пушки и могилы и «не без восхищения» считали выстрелы и попадания. Житель Иван Кашуро рассказывал о трёх пробоинах в щитке, в самую большую влезали три пальца. Каска тоже была пробита, вокруг лежали гильзы.
        src: "Источник: ЗВЕЗДА (https://tvzvezda.ru/news/20201141640-tXxSs.html)"
        stranica: ЗВЕЗДА
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
        otryvok: «не без восхищения»
        pometka: документ
        kadr:
          src: kartinka:000517
          width: 1200
          height: 1600
          klass: portret
          alt: Стреляная гильза артиллерийского снаряда с рваной пробоиной в стенке, рядом масштабная линейка
          data_source: https://goskatalog.ru/portal/#/collections?id=12025903
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Стреляная артиллерийская гильза из музейного собрания. Такие гильзы, по рассказам жителей, лежали вокруг пушки Сиротинина после боя.
          credit: Госкаталог музейного фонда РФ, id 12025903.
        utverzhden: 2026-11-03
      - summary: <b>Сиротинин остался без Звезды Героя, потому что его единственное фото потеряли в эвакуации.</b>
        det:
          - "Жители Кричева хлопотали о звании Героя, но для документов нужна была фотография. Сестра Таисия: «Единственная его карточка с паспорта… в эвакуации в Мордовии мама отдала её увеличить. А мастер её потерял!» В итоге его наградили посмертно орденом Отечественной войны I степени (представление подано в 1960 году)."
        src: "Источник: СБ (https://www.sb.by/articles/emu-otdavali-chest-vragi-.html); АиФ (https://chr.aif.ru/orel/people/ubit_nepobezhdyonnym_kak_russkiy_soldat_sderzhal_nemeckuyu_tankovuyu_kolonnu); ЗВЕЗДА (https://tvzvezda.ru/news/20201141640-tXxSs.html); Пометка: по «Звезде», формальная причина отказа — представление должен был подписать непосредственный командир"
        stranica: СБ
        href: https://www.sb.by/articles/emu-otdavali-chest-vragi-.html
        otryvok: «Единственная его карточка с паспорта… в эвакуации в Мордовии мама отдала её увеличить. А мастер её потерял!»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Сиротинин вывел из строя 11 танков, 7 бронемашин и 57 солдат.</b>
        det:
          - Эти цифры приводят «Звезда» и АиФ. Колонна стояла почти три часа.
        src: "Источник: ЗВЕЗДА (https://tvzvezda.ru/news/20201141640-tXxSs.html); АиФ (https://chr.aif.ru/orel/people/ubit_nepobezhdyonnym_kak_russkiy_soldat_sderzhal_nemeckuyu_tankovuyu_kolonnu); Пометка: два источника; немецкими документами цифры не подтверждены"
        stranica: ЗВЕЗДА
        href: https://tvzvezda.ru/news/20201141640-tXxSs.html
        otryvok: «артиллерист Николай Сиротинин в одиночку уничтожил 11 танков, 7 бронемашин, 57 солдат и офицеров противника.»
        pometka: легенда
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Как вернули имя
    udary:
