return:
  q: Почему немцы решили, что по колонне бьёт целая батарея?
  a: Сиротинин стрелял из высокой ржи так часто и метко, что одно орудие приняли за батарею.
  src: «СБ. Беларусь сегодня», 27.06.2009
vizual:
  imya: sirotinin-orden
  vid: predmet
  kicker: Награда под лупой
  h2: 'Орден Отечественной войны I степени'
  lead: 'Таким орденом Сиротинина наградили посмертно — представление подали в 1960 году. Приблизь звезду: за красными лучами скрещены винтовка и шашка.'
audioguide:
  audioSrc: audio-guide-sirotinin-ru.mp3
  durationLabel: 1 минута 22 секунды
  lead: "Голос ведёт от моста через Добрость до последнего патрона: пять остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Один у моста
    - t: 15
      mark: 0:15
      title: Одна пушка против колонны
    - t: 33
      mark: 0:33
      title: Почти три часа боя
    - t: 50
      mark: 0:50
      title: Он не сдался
    - t: 67
      mark: 1:07
      title: Что осталось
  transcript:
    - "«Мы входим в тёмный зал, и свет в нём один — на дорогу у моста. Варшавское шоссе, река Добрость, деревня Сокольничи. Июль тысяча девятьсот сорок первого года. Здесь, у этого моста, остался один человек — прикрывать отход целого полка. Его звали Николай Сиротинин."
    - "Ему было двадцать лет. Семнадцатого июля сорок первого года полк отходил на восток. Раненый командир отошёл, а Сиротинин отказался уйти — остался один, с одной сорокапятимиллиметровой пушкой. Одна пушка против целой колонны четвёртой танковой дивизии."
    - "Первым выстрелом он подбил головной танк, вторым — замыкающую машину. Колонна встала: вперёд не пройти, назад не свернуть. Почти три часа он держал дорогу. Немцы были уверены, что по ним бьёт целая батарея. А бил один человек."
    - "Когда боеприпасы кончились, он отстреливался из карабина до последнего. Ему предлагали сдаться — он ответил огнём. Враг хоронил его с тремя залпами и поставил на могилу крест с его каской."
    - "Остаться один на один с колонной, когда можно было уйти. Один парень. Одна пушка. Целая колонна встала. Он не сдался»."
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
