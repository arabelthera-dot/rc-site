quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — у деревни Сокольничи под Кричевом; 2 — двадцать; 3 — одной 45-мм пушкой; 4 — 11 танков, 7 бронеавтомобилей, 57 солдат; 5 — отдали честь на похоронах."
  ball: 10
  voprosy:
    - q: Где шёл бой Сиротинина 17 июля 1941 года?
      o:
        - У Бреста
        - Под Москвой
        - У деревни Сокольничи под Кричевом
        - У Сталинграда
      a: 2
      e: У деревни Сокольничи под Кричевом, у моста через реку Добрость на Варшавском шоссе.
    - q: Сколько лет было Сиротинину, когда он остался у моста?
      o:
        - Двадцать пять
        - Двадцать
        - Восемнадцать
        - Тридцать
      a: 1
      e: Ему было двадцать лет. Он родился 7 марта 1921 года в Орле.
    - q: Чем он в одиночку сдерживал танковую колонну?
      o:
        - Одной 45-мм пушкой
        - Противотанковым ружьём
        - Пулемётом
        - Связкой гранат
      a: 0
      e: Одной 45-миллиметровой противотанковой пушкой — «сорокапяткой». Плотность огня была такой, что противник решил — бьёт целая батарея.
    - q: Каков итог боя у моста через Добрость?
      o:
        - Три танка
        - Пять танков
        - 11 танков, 7 бронеавтомобилей, 57 солдат
        - Тридцать танков
      a: 2
      e: "Одиннадцать танков, семь бронеавтомобилей, пятьдесят семь солдат противника."
    - q: Как немецкие офицеры отнеслись к подвигу?
      o:
        - Не заметили
        - Отдали честь на похоронах
        - Расстреляли пленных
        - Сожгли тело
      a: 1
      e: Отдали честь на похоронах — жест уважения к врагу, который не отступил.
