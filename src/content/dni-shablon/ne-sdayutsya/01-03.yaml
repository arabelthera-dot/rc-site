story:
  kicker: Подвиг
  h2: Николай Сиротинин
  abzacy:
  - 'Июль 1941 года, полк отходил на восток. У деревни Сокольничи под Кричевом, у моста через Добрость на Варшавском шоссе, осталась одна 45-миллиметровая пушка. Раненый командир отошёл, а двадцатилетний старший сержант Николай Сиротинин отказался уйти от орудия.'
  - 'Первым выстрелом он подбил головной танк, вторым — замыкающую машину, и колонна 4-й танковой дивизии встала на шоссе: ни вперёд, ни назад. Пушка стояла в высокой ржи на холме, и немцы были уверены, что огонь по их танкам ведёт батарея. Искать её пришлось мотоциклистам.'
  - 'Когда снаряды кончились, на предложение сдаться Сиротинин ответил огнём из карабина и погиб у орудия 17 июля 1941 года, после почти трёхчасового боя. Враг хоронил его с тремя залпами и поставил на могилу крест с его каской.'
