return:
  q: Почему немцы решили, что по колонне бьёт целая батарея?
  a: Сиротинин стрелял из высокой ржи так часто и метко, что одно орудие приняли за батарею.
  src: «СБ. Беларусь сегодня», 27.06.2009
audioguide:
  audioSrc: audio-guide-sirotinin-ru.mp3
  durationLabel: 1 минута 30 секунд
  lead: "Голос ведёт от моста через Добрость до последнего патрона: пять остановок, на каждой — что искать глазами. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Один у моста
    - t: 15
      mark: 0:15
      title: Одна пушка против колонны
    - t: 33
      mark: 0:33
      title: Два часа боя
    - t: 50
      mark: 0:50
      title: Он не сдался
    - t: 70
      mark: 1:10
      title: Что осталось
  transcript:
    - <p>«Мы входим в тёмный зал, и свет в нём один — на дорогу у моста. Варшавское шоссе, река Добрость, деревня Сокольничи. Июль тысяча девятьсот сорок первого года. Здесь, у этого моста, остался один человек — прикрывать отход целого полка. Его звали Николай Сиротинин.</p>
    - <p>Ему было двадцать лет. Семнадцатого июля сорок первого года его батарея получила приказ задержать немецкую колонну, пока полк отходит. Когда поступил приказ отступать, Сиротинин вызвался остаться — один, с одной семидесятишестимиллиметровой пушкой. Одна пушка против целой колонны четвёртой танковой дивизии.</p>
    - "<p>Первым выстрелом он подбил головной танк, вторым — замыкающую машину. Колонна встала: вперёд не пройти, назад не свернуть. Около двух часов он держал дорогу. Немцы были уверены, что по ним бьёт целая батарея. А бил один человек.</p>"
    - "<p>Когда боеприпасы кончились, он отстреливался из карабина до последнего. Ему предлагали сдаться — он не сдался. Канонический итог: одиннадцать танков, семь бронеавтомобилей, пятьдесят семь солдат противника. И деталь, которую рассказывают до сих пор: немецкие офицеры отдали честь его похоронам — в знак уважения к врагу, который не отступил.</p>"
    - "<p>Что здесь история, а что легенда — спорят до сих пор. Но выбор, о котором этот зал, — подлинный: остаться один на один с колонной, когда можно было уйти. Один парень. Одна пушка. Целая колонна встала. Он не сдался».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
