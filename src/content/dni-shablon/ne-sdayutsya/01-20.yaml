  transcript:
    - "<p>Летом тысяча девятьсот сорок первого года эвакуированная в Томск Мария Октябрьская получила похоронку: её муж, полковой комиссар, погиб на Украине. В военкомате ей отказали — почти сорок лет и перенесённый в молодости туберкулёз.</p>"
    - <p>Тогда она с сестрой продала всё, что привезла в эвакуацию, и несколько месяцев вышивала на продажу. Пятьдесят тысяч рублей она внесла в Госбанк на постройку танка и попросила назвать его «Боевая подруга», а её саму отправить механиком-водителем.</p>
    - <p>С третьего мая тысяча девятьсот сорок третьего года она училась в Омском танковом училище, а осенью уже воевала под Витебском в двадцать шестой гвардейской танковой бригаде.</p>
    - <p>В первом бою, восемнадцатого ноября, «Боевая подруга» прорвала оборону и была подбита. Раненая Мария двое суток оставалась в танке под огнём. А в январе тысяча девятьсот сорок четвёртого года у станции Крынки она выбралась чинить разбитый ленивец — и осколок мины попал ей в глаз.</p>
    - <p>Пятнадцатого марта тысяча девятьсот сорок четвёртого года Мария Октябрьская умерла в госпитале в Смоленске. Экипаж ещё четыре раза менял танк — и каждый называл «Боевая подруга».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
