    udary:
      - summary: <b>Октябрьская писала родным, что экипаж бережёт её жизнь, «но я не пользуюсь их добротой».</b>
        det:
          - "Письмо мужу сестры Василию Гирявенко 15.12.1943: «Каждое письмо… мы читаем всем экипажем… Танк был в бою подбит, трое суток стоял под шквалом огня… Шансов на встречу очень мало, почти нет… Пишите моим ребятам, от них во многом зависит моя судьба и жизнь… Желают сохранить мою жизнь, но я не пользуюсь их добротой». Через месяц она под огнём полезла чинить гусеницу и была смертельно ранена."
        src: "Источник: Правда, 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/"
        stranica: Правда, 15–18.08.2025
        href: https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/
        otryvok: «Желают сохранить мою жизнь, но я не пользуюсь их добротой»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Комбат по рации поставил экипаж Октябрьской в пример всему батальону.</b>
        det:
          - "с мая 1943 года она училась на механика-водителя, осенью воевала в 26-й гвардейской танковой бригаде под Витебском. У совхоза «Крынки» в шлемофонах прозвучало: «Сражайтесь так, как сражаются танкисты „Боевой подруги“. Только за сегодняшний день экипаж славной машины уничтожил взвод гитлеровских бандитов». Сухой паёк и боеприпасы подходили к концу. По АиФ, вначале солдаты «столбенели, видя на месте механика-водителя женщину», и сомневались, но «с первого же боя сомнения рассеялись»."
        src: "Источник: Герой Советского Союза Октябрьская Мария Васильевна // Герои страны — https://warheroes.ru/hero/hero.asp?Hero_id=358 ; «„Боевая подруга“ Мария Октябрьская: почему Смоленск свято чтит память…» // «О чём говорит Смоленск», № 3 (306), 31.03.2025 — https://journal.smolensk-i.ru/306/04/; «„Боевая подруга“. Как Мария Октябрьская отомстила оккупантам» // АиФ — https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam; «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024 — https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html; «Минобороны рассекретило танкисток» // «Российская газета», 09.09.2018 — https://rg.ru/2018/09/09/minoborony-rassekretilo-tankistok.html; «В Приморье испытали танк „Боевая подруга“» // «Российская газета», 23.03.2020 — https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html"
        stranica: Герой Советского Союза Октябрьская Мария Васильевна // Герои страны
        href: https://warheroes.ru/hero/hero.asp?Hero_id=358
        otryvok: «"Сражайтесь так, как сражаются танкисты "Боевой подруги". Только за сегодняшний день экипаж славной машины уничтожил взвод гитлеровских бандитов."»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: "<b>Октябрьская писала с фронта: «Не один боекомплект осколочных выпустила по гадам».</b>"
        det:
          - "Письмо семье сестры 29.10.1943: «Можете за меня порадоваться: я получила боевое крещение, открыла счёт, бью гадов. От злости не вижу света! Не по радио слышу, не на картине вижу, как гады — пьяные, во весь рост, идут в контратаку… Мой экипаж — всеми уважаемый, пишите экипажу». Бригада шла 41 день на 12 км от Лиозно до Нового Села — не более 300 м в день."
        src: "Источник: «„Тов. Октябрьская — смелый, отважный воин“» // «Правда», № 88, 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/"
        stranica: «„Тов. Октябрьская — смелый, отважный воин“» // «Правда», № 88, 15–18.08.2025
        href: https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/
        otryvok: «Не по радио слышу, не на картине вижу, как гады — пьяные, во весь рост, идут в контратаку. Не один боекомплект осколочных выпустила по гадам.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Мехлис велел везти Октябрьскую к лучшим хирургам Москвы, но перевезти её было уже нельзя.</b>
        det:
          - она умерла в госпитале в Смоленске 15 марта 1944 года и похоронена в Смоленском кремле, на берегу Днепра; 2 августа 1944 года — Герой Советского Союза посмертно. Член военного совета Западного фронта Лев Мехлис навестил её в смоленском госпитале и «приказал готовить её к перевозке в Москву, где для её спасения планировалось задействовать лучших хирургов страны». Осколок, пробив глаз, задел большое полушарие мозга; состояние исключало перевозку. Она умерла на рассвете 15 марта 1944 г.
        src: "Источник: АиФ — https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam ; warheroes.ru — https://warheroes.ru/hero/hero.asp?Hero_id=358; «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024 — https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html; «Минобороны рассекретило танкисток» // «Российская газета», 09.09.2018 — https://rg.ru/2018/09/09/minoborony-rassekretilo-tankistok.html; «В Приморье испытали танк „Боевая подруга“» // «Российская газета», 23.03.2020 — https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html"
        stranica: АиФ
        href: https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam
        otryvok: «Узнав у врачей о состоянии больной, он приказал готовить ее к перевозке в Москву, где для ее спасения планировалось задействовать лучших хирургов страны.»
        utverzhden: 2026-11-03
      - summary: <b>Военные опознали «Боевую подругу» на базе хранения по надписи и пяти звёздам на стволе.</b>
        det:
          - "От машины остался пустой корпус; по формуляру и виду опознали: надпись «Боевая подруга», белая стрела и гвардейский знак на башне, пять звёзд на стволе — по числу уничтоженных машин врага. Детали «находили выпускники училища и привозили из различных уголков страны», часть восстановили по чертежам. В марте 2020 г. Т-34-85 прошёл трассу «Танкового биатлона» под Благовещенском (ДВОКУ)."
        src: "Источник: В Приморье испытали танк «Боевая подруга» // Российская газета, 23.03.2020 — https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html ; «Боевая подруга»: легендарный танк… восстановили в Приамурье // ТВ «Звезда», 02.05.2019 — https://tvzvezda.ru/news/201952750-kxXYA.html ; РИА Новости, 01.04.2020 — https://ria.ru/20200401/1569453189.html"
        stranica: В Приморье испытали танк «Боевая подруга» // Российская газета, 23.03.2020
        href: https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html
        otryvok: '«По формуляру и внешнему виду Т-34 военные догадались, что перед ними легендарный танк: надпись "Боевая подруга", белая стрела и гвардейский знак на башне, пять звезд - по числе уничтоженных машин врага, - на стволе пушки.»'
        utverzhden: 2026-11-03
