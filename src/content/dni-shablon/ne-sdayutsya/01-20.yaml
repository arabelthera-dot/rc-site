      - summary: "<b>Комбриг записал в наградной лист: Октябрьская отомстила на танке, купленном «за наличный расчёт».</b>"
        det:
          - "Наградной лист подписал командир 26-й гв. танковой бригады гв. полковник Степан Нестеров: «В период боевых операций и в период формирования бригады тов. Октябрьская с любовью заботливо относилась к боевой машине. Её танк не имел вынужденных остановок и поломок. Тов. Октябрьская на приобретённом ею танке за наличный расчёт отомстила фашистам за смерть своего мужа. Тов. Октябрьская — смелый, бесстрашный воин»."
        src: "Источник: «Боевая подруга». Как Мария Октябрьская отомстила оккупантам // АиФ — https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam ; «Тов. Октябрьская — смелый, отважный воин» // Правда, № 88, 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/"
        stranica: «Боевая подруга». Как Мария Октябрьская отомстила оккупантам // АиФ
        href: https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam
        otryvok: «Тов. Октябрьская на приобретённом ею танке за наличный расчёт отомстила фашистам за смерть своего мужа. Тов. Октябрьская — смелый, бесстрашный воин»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Экипаж потерял три «Боевые подруги» и на четвёртой дошёл до Кёнигсберга.</b>
        det:
          - "экипаж четыре раза сменил танк, и каждый назывался «Боевая подруга». Первая машина погибла в бою; вторую после освобождения Минска сдали в ремонт/списали; третья погибла под прусским Гумбиненом; четвёртая с экипажем П. И. Чеботько закончила войну под Кёнигсбергом. На каждой танкисты в память о «маме» писали «Боевая подруга». В апреле 1945 г. после штурма Кёнигсберга солдаты разглядывали Т-34 с надписью «Боевая подруга» на башне: «Кто-то ухмылялся, поражаясь удали танкистов, а те, кто постарше, осуждающе качали головами — не время сейчас для такой бравады». Почти никто не знал, что надпись — память о погибшей женщине."
        src: "Источник: «„Боевая подруга“. Как Мария Октябрьская отомстила оккупантам» // АиФ — https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam; «Боевая подруга» Мария Октябрьская: почему Смоленск свято чтит память… // О чём говорит Смоленск, № 3 (306), 31.03.2025 — https://journal.smolensk-i.ru/306/04/; «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024 — https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html; «Минобороны рассекретило танкисток» // «Российская газета», 09.09.2018 — https://rg.ru/2018/09/09/minoborony-rassekretilo-tankistok.html; «В Приморье испытали танк „Боевая подруга“» // «Российская газета», 23.03.2020 — https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html"
        stranica: «„Боевая подруга“. Как Мария Октябрьская отомстила оккупантам» // АиФ
        href: https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam
        otryvok: «Третья машина погибла под прусским городом Гумбинен. Четвертый танк с именем «Боевая подруга» дошел до Кенигсберга, где и закончил войну.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-20-goskatalog-18388293.jpg
          alt: "Чёрно-белое фото: трое солдат в пилотках и сидящая женщина в военной форме"
          data_source: https://goskatalog.ru/portal/#/collections?id=3975113
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Экипаж танка «Боевая подруга» 26-й гвардейской танковой бригады, 1943 год: Чеботько П. И., Галкин М. К., Октябрьская М. В., Ясько Г. И. (фотокопия)."
          credit: Государственный военно-исторический музей-заповедник «Прохоровское поле», ГВИМЗПП КП 1730
          width: 800
          height: 571
        utverzhden: 2026-11-03
      - summary: <b>Октябрьская отдала за танк 250 месячных зарплат заводского рабочего.</b>
        det:
          - "«Деньги на тот момент действительно огромные. При условии, что зарплата рабочего на заводе — около 200 рублей в месяц, а ведро картошки стоило 400 рублей». Подсчёт по цифрам статьи: 50 000 ÷ 200 = 250 зарплат (≈21 год работы) или 125 вёдер картошки."
        src: "Источник: Военная история томички и её танка «Боевая подруга» // РИА Новости, 07.05.2013 — https://ria.ru/20130507/499408815.html"
        stranica: Военная история томички и её танка «Боевая подруга» // РИА Новости, 07.05.2013
        href: https://ria.ru/20130507/499408815.html
        otryvok: «При условии, что зарплата рабочего на заводе - около 200 рублей в месяц, а ведро картошки стоило 400 рублей.»
        utverzhden: 2026-11-03
      - summary: "<b>Прочитав о танке свердловских работниц, Октябрьская ахнула: «Всего-то за 50 тысяч рублей!»</b>"
        det:
          - В газете она прочитала, что работницы Свердловской хлебомакаронной фабрики в складчину купили танк для Красной армии. «„Всего-то за 50 тысяч рублей!“ — удивилась Мария, и её жизнь снова обрела смысл». До этого, получив похоронку только в августе 1942-го, она три дня без слёз пролежала в постели.
        src: "Источник: «„Тов. Октябрьская — смелый, отважный воин“» // «Правда», № 88, 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/"
        stranica: «„Тов. Октябрьская — смелый, отважный воин“» // «Правда», № 88, 15–18.08.2025
        href: https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/
        otryvok: ««Всего-то за 50 тысяч рублей!» — удивилась Мария, и её жизнь снова обрела смысл.»
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
