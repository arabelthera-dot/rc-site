story:
  kicker: Среда подвига
  h2: Жена командира
  abzacy:
    - Мария Гарагуля родилась в 1902 году в крымской деревне, в крестьянской семье, где было десять детей. Работала на консервном заводе в Симферополе и телефонисткой. В 1925 году вышла замуж за курсанта кавалерийской школы Илью Рядненко — супруги взяли фамилию Октябрьские. Жена кадрового командира выучилась на шофёра.
    - "Война застала семью в Кишинёве. Марию с сестрой эвакуировали в Томск. Летом 1941 года пришла похоронка: полковой комиссар Илья Октябрьский погиб 9 августа 1941 года на Украине."
    - "Она пошла в военкомат — и получила отказ: возраст и перенесённый в молодости туберкулёз. <b>Тогда Мария Октябрьская решила купить танк.</b>"
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Мария Октябрьская — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Военкомат отказал Октябрьской, и она вышивкой и распродажей вещей собрала 50 тысяч на танк.</b>
        det:
          - "эвакуированной в Томск Марии летом 1941 года пришла похоронка на мужа, полкового комиссара. В военкомате отказали: почти сорок лет и туберкулёз в молодости. С сестрой она продала всё, что привезла, несколько месяцев вышивала салфетки и скатерти на продажу и внесла в Госбанк 50 000 рублей. Из письма сестре Евдокии: «Я прошу денег, 50 тысяч рублей. Ты продай мой крепдешин, чёрное платье креп-жоржетовое. Можно плюшевую дорожку, или марселевое одеяло, или костюм Ильюшин… Дуся, в общем, тебе нужно потрудиться ещё немного, чтобы меня отправить… Дышать некогда». Модница, «законодательница моды среди офицерских жён», распродала все наряды, привезённые в эвакуацию."
        src: "Источник: «„Тов. Октябрьская — смелый, отважный воин“» // «Правда», № 88, 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/; «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024 — https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html; «Минобороны рассекретило танкисток» // «Российская газета», 09.09.2018 — https://rg.ru/2018/09/09/minoborony-rassekretilo-tankistok.html; «В Приморье испытали танк „Боевая подруга“» // «Российская газета», 23.03.2020 — https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html"
        stranica: «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024
        href: https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html
        otryvok: «Она несколько раз ходит в военкомат, но там ей отказывают. Первая причина - перенесенная болезнь, в молодости у нее был туберкулез, вторая - возраст.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-20-goskatalog-1711815.jpg
          alt: "Плакат: женщина в танкистском шлеме с очками на фоне танка, подпись «Октябрьская Мария Васильевна (1905–1944)»"
          data_source: https://goskatalog.ru/portal/#/collections?id=1711815
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Плакат «Герой Советского Союза Октябрьская Мария Васильевна» из комплекта «Советские женщины в боях за Родину», 1967 год.
          credit: Государственный исторический музей Южного Урала, ЧОКМ ОФ-2399/260 (редактор П. Ф. Смирнов; художник на листе — А. М. Стадник)
          width: 513
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Октябрьская попросила Сталина назвать танк «Боевая подруга», а её саму посадить за рычаги.</b>
        det:
          - "В телеграмме Сталину: «За его смерть, за смерть всех советских людей, замученных фашистскими варварами, хочу отомстить фашистским собакам». Она просила назвать танк «Боевая подруга» и отправить её механиком-водителем. Ответ: «Благодарю Вас, Мария Васильевна, за Вашу заботу о бронетанковых силах Красной Армии. Ваше желание будет исполнено». Дата телеграммы: 19 февраля («Правда») или 3 марта 1943 года (АиФ)."
        src: "Источник: «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024 — https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html; «Минобороны рассекретило танкисток» // «Российская газета», 09.09.2018 — https://rg.ru/2018/09/09/minoborony-rassekretilo-tankistok.html; «В Приморье испытали танк „Боевая подруга“» // «Российская газета», 23.03.2020 — https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html"
        stranica: «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024
        href: https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html
        otryvok: «Танк прошу назвать "Боевая подруга" и направить меня на фронт в качестве водителя этого танка.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-20-goskatalog-28058864.jpg
          alt: Рукописный монтажный лист карандашом с заголовком «Боевая подруга»
          data_source: https://goskatalog.ru/portal/#/collections?id=28058864
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Монтажный лист кинооператоров Центральной студии кинохроники А. Крылова и Е. Лозовского к сюжету «Боевая подруга» о танке, созданном на сбережения М. В. Октябрьской, октябрь–ноябрь 1943 года.
          credit: "Государственный центральный музей кино, ГЦМК КП-19436/554 (авторы: Е. Д. Лозовский, А. А. Крылов)"
          width: 776
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>В первом бою подбитая «Боевая подруга» отбивалась от немцев, а Октябрьская с экипажем под огнём её починила.</b>
        det:
          - "18 ноября 1943 года у деревни Новое Село танк прорвал оборону, уничтожил пушку и около пятидесяти солдат и был подбит; раненая Октябрьская двое суток оставалась в машине под огнём. Наградной документ о бое 18.11.1943 у Нового Села: «Октябрьская первой ворвалась на своём танке в оборону противника, где гусеницами танка уничтожила одно ПТО и до 30 солдат противника… Несмотря на ранение, она не оставила своего танка и в течение трёх дней под непрерывным артогнём противника — восстановила танк и возвратилась в часть». («двое суток, пока танк не эвакуировали» — это второй наградной лист.) Подбитая «тридцатьчетверка» скатилась в овраг; немцы обстреливали её из миномётов и несколько раз подбирались, «чтобы уничтожить танк гранатами и бутылками с горючей жидкостью, но экипаж активно отстреливался, а ночью занимался ремонтом». Танк починили, он продолжил бои."
        src: "Источник: «„Тов. Октябрьская — смелый, отважный воин“» // «Правда», № 88, 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/; Хозяйка танка. Как жила похороненная в Смоленске Мария Октябрьская // АиФ-Смоленск — https://smol.aif.ru/society/history/hozyayka_tanka_kak_zhila_pohoronennaya_v_smolenske_mariya_oktyabrskaya; «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024 — https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html; «Минобороны рассекретило танкисток» // «Российская газета», 09.09.2018 — https://rg.ru/2018/09/09/minoborony-rassekretilo-tankistok.html; «В Приморье испытали танк „Боевая подруга“» // «Российская газета», 23.03.2020 — https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html"
        stranica: Хозяйка танка. Как жила похороненная в Смоленске Мария Октябрьская // АиФ-Смоленск
        href: https://smol.aif.ru/society/history/hozyayka_tanka_kak_zhila_pohoronennaya_v_smolenske_mariya_oktyabrskaya
        otryvok: «Фашисты несколько раз пытались приблизиться, чтобы уничтожить танк гранатами и бутылками с горючей жидкостью, но экипаж активно отстреливался, а ночью занимался ремонтом. В этом бою Мария Васильевна была легко ранена.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Экипаж прислал раненой Октябрьской письмо «Здравствуйте, наша мама» и через час ушёл в бой.</b>
        det:
          - "Молодые танкисты звали 38-летнюю Марию «мамой». В смоленский госпиталь майор Топок привёз письмо: «Здравствуйте, наша мама Мария Васильевна! … Мы глубоко верим, что наша „Боевая подруга“ дойдёт до Берлина. За ваше ранение мы будем беспощадно мстить врагу. Через час уходим в бой. Обнимаем вас все». Он стал последним посетителем, которого врачи к ней пустили."
        src: "Источник: «„Боевая подруга“. Как Мария Октябрьская отомстила оккупантам» // АиФ — https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam; «„Тов. Октябрьская — смелый, отважный воин“» // «Правда», № 88, 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/; Как «Боевая подруга» отомстила фашистам // histrf.ru (РВИО) — https://histrf.ru/biblioteka/b/kak-boievaia-podrugha-otomstila-fashistam"
        stranica: «„Боевая подруга“. Как Мария Октябрьская отомстила оккупантам» // АиФ
        href: https://aif.ru/society/history/boevaya_podruga_kak_mariya_oktyabrskaya_otomstila_okkupantam
        otryvok: «За ваше ранение мы будем беспощадно мстить врагу. Через час уходим в бой. Обнимаем вас все.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Октябрьская снимала шлем перед пленными немцами, и те видели под ним женщину.</b>
        det:
          - "26 сентября 1943 г. она писала родным: «Я имею бравый вид танкиста, они обращаются: „Зялдат, дай махорки!“. Снимаю шлём, они видят женскую голову, и глаза их выходят из орбит. Я говорю: „Напиши Гертруде, что ты встретил русскую Марийку с пистолетом и танком“»."
        src: "Источник: Правда, 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/"
        stranica: Правда, 15–18.08.2025
        href: https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/
        otryvok: «Снимаю шлём, они видят женскую голову, и глаза их выходят из орбит.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Октябрьская у Крынок раздавила гусеницами два орудия и под огнём полезла чинить танк.</b>
        det:
          - в январе 1944 года у совхоза Крынки танк раздавил три пулемётные точки, снарядом перебило гусеницу; Октябрьская выбралась под огнём чинить её, и осколок мины попал ей в глаз. «17 января 1944 года в районе совхоза Крынки тов. Октябрьская участвовала в атаке… гусеницами своего танка раздавила два орудия с прислугой, в бою танк „Боевая подруга“ был выведен из строя огнём противника». По «Правде» — два орудия и три пулемётные точки, всего около 20 солдат и офицеров.
        src: "Источник: АиФ-Смоленск — https://smol.aif.ru/society/history/hozyayka_tanka_kak_zhila_pohoronennaya_v_smolenske_mariya_oktyabrskaya ; «Правда», 15–18.08.2025 — https://gazeta-pravda.ru/issue/88-31725-1518-avgusta-2025-goda/tov-oktyabrskaya-smelyy-otvazhnyy-voin/; «Купила танк и била фашистов. 80 лет назад умерла от ран Мария Октябрьская» // «Родина», 15.03.2024 — https://rodina-history.ru/2024/03/15/kupila-tank-i-bila-fashistov-80-let-nazad-umerla-ot-ran-mariia-oktiabrskaia.html; «Минобороны рассекретило танкисток» // «Российская газета», 09.09.2018 — https://rg.ru/2018/09/09/minoborony-rassekretilo-tankistok.html; «В Приморье испытали танк „Боевая подруга“» // «Российская газета», 23.03.2020 — https://rg.ru/2020/03/23/reg-dfo/v-primore-ispytali-tank-boevaia-podruga.html"
        stranica: АиФ-Смоленск
        href: https://smol.aif.ru/society/history/hozyayka_tanka_kak_zhila_pohoronennaya_v_smolenske_mariya_oktyabrskaya
