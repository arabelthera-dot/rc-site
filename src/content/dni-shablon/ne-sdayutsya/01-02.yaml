        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Ответное «ура» и залп «Меркурия» заставили турок убрать с марсов готовых к абордажу людей.</b>
        det:
          - Враг ждал, что бриг спустит флаг, и уже держал абордажные команды на марсах и реях. После залпа их пришлось убрать.
        src: "Источник: «Подвиг и бесчестье», «Независимое военное обозрение», 05.02.2016, https://nvo.ng.ru/history/2016-02-05/12_podvig.html"
