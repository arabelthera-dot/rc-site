      - summary: "<b>Бриг сделал невозможное: британский историк флота Джейн отказывался в это верить.</b>"
        det:
          - "Фредерик Джейн писал: «Совершенно невозможно допустить, что такое маленькое судно… вывело из строя два линейных корабля». Ответ ему — слова штурмана с «Реал-бея» (факт 1). Цитата Джейна известна только в пересказе «Родины»."
