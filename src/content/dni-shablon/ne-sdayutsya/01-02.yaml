        href: https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html
        otryvok: «Казарскому. Потомству в пример»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>За год до «Меркурия» Казарский на бриге «Соперник» брал Анапу и Варну — и получил золотую саблю.</b>
        det:
          - Ему было 30 лет. За Анапу и Варну он получил чин капитан-лейтенанта и золотую саблю.
        src: "Источник: РГ (https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html)"
