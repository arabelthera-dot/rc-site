        href: https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html
        otryvok: «Совершенно невозможно допустить, что такое маленькое судно… вывело из строя два линейных корабля».
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Подвигу «Меркурия» поставили первый памятник Севастополя.</b>
        det:
          - "Памятник Казарскому стал первым монументом города. На нём надпись: «Казарскому. Потомству в пример»."
        src: "Источник: РГ (https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html); РОДИНА (https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html)"
