story:
  kicker: Подвиг · 6 ударов
  h2: Четыре часа, которых не должно было быть
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
    - summary: 14 (26) мая 1829 года дозор у Босфора заметил турецкую эскадру. Тихоходный «Меркурий» отстал, и за ним погнались два линейных корабля.
      det:
        - Шла Русско-турецкая война 1828–1829 годов. Дозор из трёх кораблей — «Штандарт», «Орфей» и «Меркурий» — искал турецкий флот у Босфора.
        - '«Селимие» и «Реал-бей» настигали малый бриг. Положение было то, в котором корабли сдаются: перевес десятикратный, уходить некуда, помощи нет.'
      src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
    - summary: 'Сдаться было проще всего — и уже случалось: за три дня до этого так сдался фрегат «Рафаил».'
      det:
        - Император повелел, когда фрегат вернут, предать его огню, «почитая его впредь недостойным носить флаг русский». Капитана Стройникова разжаловали в матросы.
        - 'Приказ исполнили через двадцать четыре года: при Синопе, в 1853-м, эскадра Нахимова сожгла бывший «Рафаил».'
      src: 'Источники: Центральный военно-морской музей, navalmuseum.ru; «Военная энциклопедия».'
    - summary: 'Казарский собрал совет. Решение короткое: принять бой, а если удержать корабль не удастся — взорвать его.'
      det:
        - Сдаться, взорваться сразу, отступить — совет прошёл по каждой дороге до конца и выбрал ту, что вела в огонь.
        - 'На порох положили заряженный пистолет: последний, кто останется в живых, должен был взорвать бриг. Это был уговор не одного командира — всего экипажа.'
      src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
    - summary: Четыре часа малый бриг вёл бой с двумя линкорами и бил не по бортам, а по мачтам и снастям, лишая их хода.
      find: true
      tag: Находка дня
      det:
        - Линкор без парусов теряет ход. «Селимие» лёг в дрейф, «Реал-бей» потерял управление. Турки прекратили погоню.
      src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
    - summary: 'Цена: четверо убитых, шестеро раненых, командир контужен, свыше трёхсот повреждений. Но бриг не спустил флаг.'
      det:
        - В корпусе — двадцать две пробоины, в парусах — сто тридцать три, в рангоуте — шестнадцать повреждений, в такелаже — сто сорок восемь.
        - «Меркурий» своим ходом пошёл к эскадре и доложился.
      src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
    - summary: Награда — кормовой Георгиевский флаг, второй случай в истории русского флота. А на памятнике — «Казарскому. Потомству в пример».
      det:
        - Николай I повелел навсегда иметь в составе флота корабль «Память Меркурия», чтобы имя не умерло.
        - Экипаж, которому расчёт велел сдаться, выбрал бой — и победил.
      src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
fakty:
  - id: fakty
    nav: Факты
    kicker: Десять фактов о бриге «Меркурий»
    h2: Пистолет у пороха и флаг на гвоздях
    udary:
      - summary: "<b>Экипаж «Меркурия» дрался на глазах у Стройникова, сдавшего «Рафаил», — Николай I лишил труса чинов, орденов и дворянства, а флот передаёт его слова: запретить жениться, «дабы не иметь в России потомства труса».</b>"
        det:
          - "11 мая 1829 года капитан 2-го ранга Семён Стройников без боя сдал туркам фрегат «Рафаил». Николай I лишил его чинов, орденов и дворянства и отправил в Бобруйскую крепость, в арестантские роты. Там бывший командир пробыл почти четыре года, а в апреле 1834 года его записали простым матросом на Черноморский флот. Слова о запрете жениться, «дабы не иметь потомства труса», флот передаёт из поколения в поколение. Сам фрегат Николай I велел, когда его вернут, «предать оный огню». 18 ноября 1853 года при Синопе бывший «Рафаил», 24 года ходивший у турок под именем «Фазли-Аллах», сожгли, и Нахимов начал рапорт словами: «Воля Вашего Императорского Величества исполнена, фрегат «Рафаил» не существует». Среди офицеров «Парижа», одного из двух линкоров, сжёгших фрегат, был сын Стройникова Александр, родившийся в 1824 году, ещё до сдачи. Семён Стройников раньше командовал самим «Меркурием». 11 мая 1829 года он сдал туркам фрегат «Рафаил» без боя, хотя команда постановила драться. Через три дня, во время боя, он находился на борту «Реал-бея» и видел, как его бывший бриг не сдаётся."
        src: "Источник: В. В. Шигин, «Неизвестная война императора Николая I» (выписка из послужного списка С. М. Стройникова, рескрипт 4 июня 1829 г.) — https://4etalka.ru/nauka_obrazovanie/istoriya/357666/fulltext.htm; «Подвиг и бесчестье», «Независимое военное обозрение», 05.02.2016, https://nvo.ng.ru/history/2016-02-05/12_podvig.html; РОДИНА (https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html)"
        stranica: «Подвиг и бесчестье», «Независимое военное обозрение», 05.02.2016
        href: https://nvo.ng.ru/history/2016-02-05/12_podvig.html
        otryvok: «дабы не иметь потомства труса»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>С турецкого флагмана крикнули по-русски «Сдавайся!» — бриг ответил залпом всех пушек.</b>
        det:
          - "Когда «Меркурий» оказался зажат между двумя линкорами, с корабля капудан-паши закричали по-русски: «Сдавайся и убирай паруса». Ответом были залп всей артиллерией и дружный ружейный огонь, на бриге кричали «ура». Эпизод описан в рапорте Казарского адмиралу Грейгу; рапорт хранится в Николаевском музее судостроения и флота, отрывки из него приводит «Российская газета»."
        src: "Источник: РГ (https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html); «Подвиг и бесчестье», «Независимое военное обозрение», 05.02.2016, https://nvo.ng.ru/history/2016-02-05/12_podvig.html"
        stranica: «Кто и за что отравил командира легендарного брига „Меркурий“ Казарского», «Российская газета», 15.06.2021
        href: https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html
        otryvok: «Сдавайся и убирай паруса»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: "<b>Казарский бился так, что штурман «Реал-бея» написал: имя его достойно золотых литер.</b>"
        det:
          - "Штурман турецкого линкора «Реал-бей» записал: «Ежели в великих деяниях древних и наших времён находятся подвиги храбрости, то сей поступок должен все оные помрачить, и имя сего героя достойно быть начертано золотыми литерами на храме Славы». И дальше: «С двадцатью пушками, не более, он дрался против двухсот двадцати в виду неприятельского флота». Это написал противник."
        src: "Источник: РОДИНА (https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html)"
        stranica: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025
        href: https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html
        otryvok: «Ежели в великих деяниях древних и наших времён находятся подвиги храбрости, то сей поступок должен все оные помрачить, и имя сего героя достойно быть начертано золотыми литерами на храме Славы»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-02-goskatalog-11974987.jpg
          alt: "Раскрашенная пунктирная гравюра: погрудный портрет офицера в эполетах на фоне андреевского и георгиевского флагов, внизу надпись «Храбрый Александр Иванович Казарский»"
          data_source: https://goskatalog.ru/portal/#/collections?id=11974987
          license: общественное достояние (гравюра 1831 года); при публикации — цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "«Храбрый Александр Иванович Казарский» — гравюра Ивана Логинова 1831 года, вышедшая через два года после боя: командир брига на фоне флагов и морского сражения."
          credit: "Гравёр Иван Логинов, 1831, пунктир, акварель. Хранится: Государственный Эрмитаж, инв. ЭРГ-399. Госкаталог музейного фонда РФ, № 11974987. Источник: goskatalog.ru"
          width: 324
          height: 465
        utverzhden: 2026-11-03
      - summary: <b>Штурман Прокофьев предложил взорвать бриг, совет решил это единогласно — и офицеры «Меркурия» внесли пистолет в свои гербы, а бриг получил Георгиевский флаг.</b>
        det:
          - "Казарский опрашивал офицеров, начиная с младшего по чину. Поручик корпуса штурманов Иван Прокофьев предложил «взорвать бриг, когда он будет доведён до крайности», и предложение «принято единогласно». У крюйт-камеры положили заряженный пистолет: последний оставшийся в живых офицер должен был выстрелить в порох. Нижние чины «единогласно объявили, что будут до конца верны долгу и присяге». Георгиевский орден потом получили двое — Казарский и Прокофьев. Георгиевский флаг — второй случай в истории русского флота, первым был «Азов». Все офицеры получили следующий чин, экипаж — пожизненную пенсию в двойной оклад. Казарского произвели в капитаны 2 ранга и флигель-адъютанты. В гербы офицеров внесли тульский пистолет, тот, что лежал у крюйт-камеры."
        src: "Источник: РГ (https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html); RT (https://russian.rt.com/science/article/635075-rossiya-turtsiya-brig-korably-pobeda); РОДИНА (https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html); донесение Казарского адмиралу Грейгу (цитата в РОДИНА (https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html)); РГ (https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html); РОДИНА (https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html)"
        stranica: «Кто и за что отравил командира легендарного брига „Меркурий“ Казарского», «Российская газета», 15.06.2021
        href: https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html
        otryvok: «взорвать бриг, когда он будет доведён до крайности»
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-02-gk-10747353-medal.jpg
          alt: "Бронзовая медаль: воин со знаменем на раковине среди морских волн, надпись «Подвиг брига Меркурия», 1829"
          data_source: https://goskatalog.ru/portal/#/collections?id=10747353
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Медаль «Подвиг брига „Меркурий“», 1829 год: надпись по кругу и дата боя — память о том, что бриг не спустил флага."
          credit: "Хранится: Центральный военно-морской музей имени императора Петра Великого. Госкаталог музейного фонда РФ, № 10747353. Источник: goskatalog.ru"
          width: 800
          height: 769
        utverzhden: 2026-11-03
      - summary: <b>Казарский поставил у флага часового с приказом стрелять в любого, кто попробует его спустить.</b>
        det:
          - У флаг-фала стоял вооружённый часовой. Сам флаг прибили к гафелю, чтобы он не упал, даже если ядро перебьёт фал. Так спустить флаг было нельзя ни по приказу, ни случайно.
        src: "Источник: РОДИНА (https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html)"
        stranica: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025
        href: https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html
        otryvok: «Еще он выставил у флаг-фала вооруженного часового с приказом стрелять во всякого, кто попытается спустить флаг. Сам флаг на всякий случай прибили к гафелю - вдруг фал перебьет.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>115 моряков с 18 пушками приняли бой против двух линкоров со 184 орудиями.</b>
