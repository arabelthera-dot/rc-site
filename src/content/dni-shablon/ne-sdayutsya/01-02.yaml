head:
  title: Бриг «Меркурий» — «Русские не сдаются»
  description: За три дня до этого русский фрегат сдался без боя. Бриг «Меркурий» — 18 пушек против 184 — положил пистолет у пороха, принял бой и вернулся, не спустив флага.
