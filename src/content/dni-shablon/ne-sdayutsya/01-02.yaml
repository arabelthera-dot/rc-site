return:
  q: Что положили у пороха на «Меркурии» перед боем — и зачем?
  a: 'Заряженный пистолет: последний живой офицер должен был взорвать бриг, чтобы он не достался врагу.'
  src: «Российская газета», 15.06.2021
audioguide:
  audioSrc: audio-guide-merkuriy-ru.mp3
  durationLabel: 1 минута 30 секунд
  lead: 'Голос ведёт от турецкой эскадры у Босфора до кормового Георгиевского флага: пять остановок. Слушать можно фоном, пока читаешь историю ниже.'
  stops:
    - t: 0
      mark: 0:00
      title: Босфор, май 1829
    - t: 17
      mark: 0:17
      title: Корабль, который сдался
    - t: 33
      mark: 0:33
      title: Пистолет у пороха
    - t: 52
      mark: 0:52
      title: Четыре часа боя
    - t: 66
      mark: '1:06'
      title: Флаг не спущен
  transcript:
    - '<p>«Мы входим в зал, и свет в нём — на море. Смотрите на картину: это Босфор, май 1829 года. Два турецких линейных корабля настигают маленький русский бриг. На нём сто пятнадцать человек, и у них восемнадцать пушек против ста восьмидесяти четырёх.</p>'
    - <p>Бриг называется «Меркурий». Им командует капитан-лейтенант Александр Иванович Казарский. За три дня до этого другой русский корабль, фрегат «Рафаил», сдался туркам без боя. Экипаж «Меркурия» знал, что станет с теми, кто сдаётся. И поступил иначе.</p>
    - '<p>Казарский собрал военный совет. Решение было коротким: принять бой, а если удержать корабль не удастся — взорвать его. На порох положили заряженный пистолет: последний оставшийся в живых офицер должен был выстрелить в порох и взорвать бриг, чтобы он не достался врагу.</p>'
    - <p>Бой шёл четыре часа. Маленький бриг маневрировал и бил по мачтам и снастям линкоров, лишая их хода. «Селимие» лёг в дрейф, «Реал-бей» потерял управление. Турки прекратили погоню — и «Меркурий», весь в пробоинах, пошёл к своей эскадре.</p>
    - '<p>Цена была заплачена: четверо убитых, шестеро раненых, командир контужен. Но флаг не спустили. Наградой стал кормовой Георгиевский флаг — второй случай в истории русского флота. А на памятнике в Севастополе написали четыре слова: «Казарскому. Потомству в пример». Вот и весь зал: не сдаться, даже когда сдаться разумно».</p>'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
