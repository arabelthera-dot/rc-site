          podpis: "Памятник Казарскому в Севастополе на литографии середины XIX века. На нём слова: «Казарскому. Потомству в пример»."
          credit: "Рисунок Н. В. Берга, литография Д. Н. Россова, сер. XIX в. Хранится: Государственный Эрмитаж. Госкаталог музейного фонда РФ, № 16117881. Источник: goskatalog.ru"
