story:
  kicker: Подвиг · 6 ударов
  h2: Четыре часа, которых не должно было быть
  intro: Читается подряд. Нажми на удар — откроется подробный разбор с источниками.
  udary:
  - summary: 14 (26) мая 1829 года дозор у Босфора заметил турецкую эскадру. Тихоходный «Меркурий» отстал, и за ним погнались два линейных корабля.
    det:
    - Шла Русско-турецкая война 1828–1829 годов. Дозор из трёх кораблей — «Штандарт», «Орфей» и «Меркурий» — искал турецкий флот у Босфора.
    - '«Селимие» и «Реал-бей» настигали малый бриг. Положение было то, в котором корабли сдаются: перевес десятикратный, уходить некуда, помощи нет.'
    src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
  - summary: 'Сдаться было проще всего — и уже случалось: за три дня до этого так сдался фрегат «Рафаил».'
    det:
    - Император повелел, когда фрегат вернут, предать его огню, «почитая его впредь недостойным носить флаг русский». Капитана Стройникова разжаловали в матросы.
    - 'Приказ исполнили через двадцать четыре года: при Синопе, в 1853-м, эскадра Нахимова сожгла бывший «Рафаил».'
    src: 'Источники: Центральный военно-морской музей, navalmuseum.ru; «Военная энциклопедия».'
  - summary: 'Казарский собрал совет. Решение короткое: принять бой, а если удержать корабль не удастся — взорвать его.'
    det:
    - Сдаться, взорваться сразу, отступить — совет прошёл по каждой дороге до конца и выбрал ту, что вела в огонь.
    - 'На порох положили заряженный пистолет: последний, кто останется в живых, должен был взорвать бриг. Это был уговор не одного командира — всего экипажа.'
    src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
  - summary: Четыре часа малый бриг вёл бой с двумя линкорами и бил не по бортам, а по мачтам и снастям, лишая их хода.
    find: true
    tag: Находка дня
    det:
    - Линкор без парусов теряет ход. «Селимие» лёг в дрейф, «Реал-бей» потерял управление. Турки прекратили погоню.
    src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
  - summary: 'Цена: четверо убитых, шестеро–восемь раненых, командир контужен, свыше трёхсот повреждений. Но бриг не спустил флаг.'
    det:
    - В корпусе — двадцать две пробоины, в парусах — сто тридцать три, в рангоуте — шестнадцать повреждений, в такелаже — сто сорок восемь.
    - «Меркурий» своим ходом пошёл к эскадре и доложился.
    src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
  - summary: Награда — кормовой Георгиевский флаг, второй случай в истории русского флота. А на памятнике — «Казарскому. Потомству в пример».
    det:
    - Николай I повелел навсегда иметь в составе флота корабль «Память Меркурия», чтобы имя не умерло.
    - Экипаж, которому расчёт велел сдаться, выбрал не сдаться. Не ради победы — победы не ждали. Ради того, чтобы остаться собой.
    src: 'Источники: донесение А. И. Казарского о бое; Центральный военно-морской музей, navalmuseum.ru; Севастопольский военно-исторический музей Черноморского флота, sevmuseum.ru.'
fakty:
- id: fakty
  nav: Факты
  kicker: Десять фактов о бриге «Меркурий»
  h2: Пистолет у пороха и флаг на гвоздях
  udary:
  - summary: '<b>Казарский бился так, что штурман «Реал-бея» написал: имя его достойно золотых литер.</b>'
    det:
    - 'Штурман турецкого линкора «Реал-бей» записал: «Ежели в великих деяниях древних и наших времён находятся подвиги храбрости, то сей поступок должен все оные помрачить, и имя сего героя достойно быть начертано золотыми литерами на храме Славы».'
    - 'И дальше: «С двадцатью пушками, не более, он дрался против двухсот двадцати в виду неприятельского флота». Это написал противник.'
    src: 'Источник: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025 — https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html'
    otryvok: «…имя сего героя достойно быть начертано золотыми литерами на храме Славы».
    stranica: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025
    href: https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html
  - summary: <b>Экипаж «Меркурия» дрался на глазах у Стройникова, который сдал «Рафаил» и стоял на «Реал-бее».</b>
    det:
    - Семён Стройников раньше командовал самим «Меркурием». 11 мая 1829 года он сдал туркам фрегат «Рафаил» без боя, хотя команда постановила драться.
    - Через три дня, во время боя, он находился на борту «Реал-бея» и видел, как его бывший бриг не сдаётся.
    src: 'Источник: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025 — https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html'
    stranica: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025
    href: https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html
  - summary: <b>Младший из офицеров, штурман Прокофьев, предложил взорвать бриг — и совет решил это единогласно.</b>
    det:
    - Казарский опрашивал офицеров по обычаю, начиная с младшего. Поручик корпуса флотских штурманов Иван Прокофьев предложил «взорвать бриг, когда он будет доведён до крайности», и предложение «принято единогласно».
    - 'У крюйт-камеры положили заряженный пистолет: последний оставшийся в живых офицер должен был выстрелить в порох. Нижние чины «единогласно объявили, что будут до конца верны долгу и присяге».'
    - Георгия IV степени потом получили двое — Казарский и Прокофьев.
    src: 'Источники: «Кто и за что отравил командира легендарного брига „Меркурий“ Казарского», «Российская газета», 15.06.2021 — https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html; RT на русском — https://russian.rt.com/science/article/635075-rossiya-turtsiya-brig-korably-pobeda; А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025 (цитата донесения Казарского адмиралу Грейгу)'
    otryvok: «…взорвать бриг, когда он будет доведён до крайности»… «принято единогласно».
    stranica: «Кто и за что отравил командира легендарного брига „Меркурий“ Казарского», «Российская газета», 15.06.2021
    href: https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html
    pometka: два источника
  - summary: <b>Казарский поставил у флага часового с приказом стрелять в любого, кто попробует его спустить.</b>
    det:
    - У флаг-фала стоял вооружённый часовой. Сам флаг прибили к гафелю, чтобы он не упал, даже если ядро перебьёт фал.
    - Так спустить флаг было нельзя ни по приказу, ни случайно.
    src: 'Источник: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025 — https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html'
    stranica: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025
    href: https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html
  - summary: <b>115 моряков с 18 пушками приняли бой против двух линкоров со 184 орудиями.</b>
    det:
    - У брига 18 карронад и две переносные трёхфунтовые пушки. У «Селимие» 110 орудий и флаг капудан-паши, у «Реал-бея» 74.
    - Перевес десятикратный, по расчёту такой бой кончается за полчаса. «Родина», считая переносные пушки, пишет «20 против 220».
    src: 'Источники: «Бой брига „Меркурий“», Центральный военно-морской музей им. императора Петра Великого, 27.05.2016 — https://navalmuseum.ru/news?id=711; А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025; донесение Казарского'
    stranica: «Бой брига „Меркурий“», Центральный военно-морской музей им. императора Петра Великого, 27.05.2016
    href: https://navalmuseum.ru/news?id=711
    pometka: два источника
  - summary: <b>Канониры «Меркурия» били по мачтам и снастям — и «Селимие» лёг в дрейф.</b>
    det:
    - Бриг не пытался пробить толстые борта линкоров, он бил по рангоуту и такелажу. Без парусов линкор теряет ход.
    - Сначала отстал «Селимие», потом «Реал-бею» перебили две реи, и он потерял управление. Бой шёл около четырёх часов (по ЦВММ; «Родина» пишет о шести).
    src: 'Источники: «Бой брига „Меркурий“», Центральный военно-морской музей им. императора Петра Великого, 27.05.2016 — https://navalmuseum.ru/news?id=711; А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025'
    stranica: «Бой брига „Меркурий“», Центральный военно-морской музей им. императора Петра Великого, 27.05.2016
    href: https://navalmuseum.ru/news?id=711
    pometka: два источника
  - summary: <b>Николай I велел сжечь сдавшийся «Рафаил» — и Нахимов исполнил это при Синопе через 24 года.</b>
    det:
    - Император повелел, когда фрегат вернут, предать его огню, «почитая его впредь недостойным носить флаг русский». Стройникова разжаловали в матросы.
    - В 1853 году при Синопе эскадра Нахимова сожгла бывший «Рафаил», ходивший у турок под именем «Фазли-Аллах».
    - 'Легенда о «запрете жениться, дабы трусов не плодить» документами не подтверждается: Стройников был женат, двое его сыновей стали контр-адмиралами.'
    src: 'Источники: Центральный военно-морской музей, navalmuseum.ru; «Военная энциклопедия»; Артефакт, ar.culture.ru (источники старой страницы)'
  - summary: <b>Матросы «Меркурия» гребли по семь вёсел с борта и уводили бриг из-под бортовых залпов.</b>
    det:
    - 'Людей не хватало: матросов посадили на вёсла, к орудиям встали и офицеры. По ЦВММ, «пользуясь парусами и вёслами», бриг уклонялся от залпов.'
    - После боя все гребные вёсла были разбиты.
    src: 'Источники: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025 — https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html; «Бой брига „Меркурий“», Центральный военно-морской музей им. императора Петра Великого, 27.05.2016 — https://navalmuseum.ru/news?id=711; RT на русском — https://russian.rt.com/science/article/635075-rossiya-turtsiya-brig-korably-pobeda'
    stranica: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025
    href: https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html
    pometka: два источника
  - summary: '<b>Казарский под ядрами крикнул гребцам: «Пусть пугают — они везут нам Георгия».</b>'
    det:
    - 'Ядро ударило в весло и сбило гребцов. Казарский крикнул: «Не робеть, ребята! Пусть пугают — они везут нам Георгия». Бриг действительно получил Георгиевский флаг.'
    - 'Фраза известна по рассказу: первоисточник в статье не назван.'
    src: 'Источник: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025 — https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html'
    stranica: А. Валагин, «Бриг „Меркурий“ в шестичасовом бою победил два турецких линкора», журнал «Родина», 26.05.2025
    href: https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html
  - summary: <b>«Меркурий» получил кормовой Георгиевский флаг, а офицеры внесли пистолет в гербы.</b>
    det:
    - Георгиевский флаг — второй случай в истории русского флота, первым был «Азов». Все офицеры получили следующий чин, экипаж — пожизненную пенсию в двойной оклад.
    - Казарского произвели в капитаны 2 ранга и флигель-адъютанты. В гербы офицеров внесли тульский пистолет, тот, что лежал у крюйт-камеры.
