    udary:
      - summary: <b>Подвиг брига заставил императора навсегда держать во флоте корабль «Память Меркурия».</b>
        det:
          - Николай I повелел, чтобы корабль с этим именем «на вечные времена» служил примером потомству. Имя носили корвет 1865 года, крейсер 1880 года и крейсер, бывший «Кагул», а в 2023 году Андреевский флаг подняли на корвете «Меркурий». В ноябре 1917 года почти 200 матросов «Памяти Меркурия» отказались служить под чужим флагом.
        src: "Источник: РВИО (https://history.ru/read/articles/v-pamyat-o-merkurii); РГ (https://rg.ru/2021/06/15/kto-i-za-chto-otravil-komandira-legendarnogo-briga-merkurij-kazarskogo.html); РОДИНА (https://rodina-history.ru/2025/05/26/brig-merkurij-v-shestichasovom-boiu-pobedil-dva-tureckih-linkora.html)"
