quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Для викторины нужен JavaScript. Ответы: 1 — 18; 2 — заряженный пистолет; 3 — сдался без боя; 4 — кормовой Георгиевский флаг; 5 — «Казарскому. Потомству в пример».'
  ball: 20
  voprosy:
    - q: Сколько пушек было у брига «Меркурий»?
      o:
        - '18'
        - '36'
        - '74'
        - '110'
      a: 0
      e: 18 орудий. Против 184 у двух турецких линкоров — перевес десятикратный.
    - q: Что положили у пороха перед боем?
      o:
        - Карту
        - Заряженный пистолет
        - Компас
        - Приказ
      a: 1
      e: Заряженный пистолет. Последний оставшийся в живых офицер должен был взорвать корабль, чтобы тот не достался врагу.
    - q: Что сделал фрегат «Рафаил» за три дня до боя?
      o:
        - Сдался без боя
        - Выиграл бой
        - Взорвался
        - Ушёл в порт
      a: 0
      e: Сдался без боя. Император велел предать фрегат огню, а капитана Стройникова разжаловали в матросы.
    - q: Какую награду получил «Меркурий»?
      o:
        - Орден
        - Кормовой Георгиевский флаг
        - Медаль
        - Новый корабль
      a: 1
      e: Кормовой Георгиевский флаг — второй случай в истории русского флота.
    - q: Что написано на памятнике Казарскому в Севастополе?
      o:
        - «Казарскому. Потомству в пример»
        - «Слава флоту»
        - «Не сдался»
        - «Герою боя»
      a: 0
      e: «Казарскому. Потомству в пример».
