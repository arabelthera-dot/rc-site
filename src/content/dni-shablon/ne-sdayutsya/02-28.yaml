story:
  kicker: Подвиг
  h2: Лиза Чайкина
  abzacy:
  - Елизавета Чайкина родилась 28 августа 1918 года в деревне Руно на Тверской земле. Она стала секретарём Пеновского райкома комсомола. Когда осенью 1941 года пришли немцы, истребительный батальон из 70 бойцов стал партизанским отрядом, и Лиза ушла в лес вместе с ним. Она ходила в разведку и несла по захваченным деревням листовки с докладом Сталина.
  - 22 ноября 1941 года Лиза пошла в Пено и заночевала у подруги Маруси Купоровой на хуторе Красное Покатище. Её выдали. Семью подруги расстреляли, а Лизу допрашивали и пытали. Она не назвала ни товарищей, ни своего имени. 23 ноября 1941 года её расстреляли. Посмертно Лизе Чайкиной присвоено звание Героя Советского Союза с вручением ордена Ленина.
