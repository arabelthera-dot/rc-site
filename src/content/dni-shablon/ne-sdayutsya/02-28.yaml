    mark: 0:44
    title: Иванова из Ленинграда
  - t: 66
    mark: '1:06'
    title: У стены сарая
  - t: 88
    mark: '1:28'
    title: Наши придут
  transcript:
  - Лиза Чайкина родилась в 1918 году в деревне Руно. Она стала секретарём Пеновского райкома комсомола. Когда немцы подошли, она с комсомольцами отстояла горящую школу.
  - Осенью 1941 года Лиза ушла к партизанам. За 10 дней в тылу врага она обошла 14 деревень с докладом Сталина от 7 ноября.
  - 'В ноябре её выдали. Лизу допрашивали при всей деревне — никто не выдал, крикнула только одна. Под пытками она не назвала даже своего имени и твердила: «Иванова из Ленинграда».'
  - 'Идти она уже не могла, на расстрел её несли. У стены сарая она встала и запела «Интернационал». Немецкий офицер сказал о ней: «Погибла, как Жанна д''Арк».'
  - 'Её слова «Наши придут. Победа будет за нами!» облетели страну. Комсорг полка, бравшего Рейхстаг, написал на его стене: «Наша Лиза».'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
