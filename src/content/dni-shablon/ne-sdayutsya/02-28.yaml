  audioSrc: audio-guide-chajkina-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от комсомольского райкома через рейд по деревням и допрос — к стене сарая и слову, облетевшему страну: пять остановок.'
