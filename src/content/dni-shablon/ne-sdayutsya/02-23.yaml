  transcript:
  - 4 августа 1985 года атомная подводная лодка К-278 ушла на 1027 метров. Глубже не опускалась ни одна подводная лодка мира. Её корпус впервые в мире сделали целиком из титана.
  - 7 апреля 1989 года в Норвежском море в седьмом отсеке начался пожар. Огонь разогнал отсек до тысячи градусов. Лодка всплыла, и экипаж шесть часов боролся за неё.
  - Капитан третьего ранга Анатолий Испенков до последней минуты держал дизель, чтобы у товарищей были свет и время. Командир Евгений Ванин вернулся в тонущую лодку за людьми.
  - Моряки ждали помощи в ледяной воде и запели «Варяга». Мичман Виктор Слюсаренко продержался в воде сорок минут. Плавбаза «Алексей Хлобыстов» подняла тридцать живых.
  - Потом обитаемые аппараты «Мир» шестьдесят восемь раз спускались к лодке на глубину тысяча семьсот метров. Экипаж боролся за лодку, пока она не ушла на дно, и не сдался.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
