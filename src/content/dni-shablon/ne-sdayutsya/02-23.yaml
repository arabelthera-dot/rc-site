quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 1027 метров; 2 — из титана; 3 — «Варяга»; 4 — 40 минут; 5 — аппараты «Мир».'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: на какую глубину ушёл «Комсомолец» 4 августа 1985 года?'
    o:
    - 300 метров
    - 600 метров
    - 1027 метров
    - 3000 метров
    a: 2
    e: 1027 метров — глубже не опускалась ни одна подводная лодка мира.
  - q: Из чего был сделан корпус К-278?
    o:
    - Из стали
    - Из титана
    - Из алюминия
    - Из меди
    a: 1
    e: Это первый в мире корпус атомной лодки целиком из титана.
  - q: Какую песню запели моряки в ледяной воде?
    o:
    - «Катюшу»
    - «Варяга»
    - «Священную войну»
    - «Яблочко»
    a: 1
    e: «Мы запели «Варяга», что дало нам ещё определённый заряд энергии», — вспоминал Юрий Парамонов.
  - q: Сколько минут продержался в ледяной воде мичман Слюсаренко?
    o:
    - '5'
    - '15'
    - '40'
    - '120'
    a: 2
    e: В такой воде человек живёт 15–20 минут, Слюсаренко продержался 40.
  - q: Кто 68 раз спускался к лодке на дно?
    o:
    - Водолазы
    - Аппараты «Мир»
    - Батискаф «Триест»
    - Роботы с берега
    a: 1
    e: Обитаемые аппараты «Мир-1» и «Мир-2» работали у лодки семь лет.
