story:
  kicker: Подвиг
  h2: Подлодка К-278 «Комсомолец»
  abzacy:
  - К-278 была единственной лодкой проекта 685 «Плавник». Её корпус впервые в мире целиком сделали из титана. 4 августа 1985 года она ушла на 1027 метров. Корпус скрипел так, что железную койку штурмана выгнуло луком, а срезанные болты летели как пули. Лодка выдержала, выстрелила из торпедных аппаратов с 800 метров и всплыла.
  - 7 апреля 1989 года в Норвежском море в седьмом отсеке начался пожар. Огонь разогнал отсек до 1000 градусов. Лодка всплыла, и экипаж шесть часов боролся за неё. Капитан 3-го ранга Анатолий Испенков остался у дизель-генератора, чтобы у товарищей были свет и время. В 17:08 «Комсомолец» ушёл на дно.
  - Моряки ждали помощи в ледяной воде и пели «Варяга». Командир Евгений Ванин вернулся в лодку за людьми и погиб. Из всплывшей спасательной камеры выбрался один мичман Виктор Слюсаренко. Рыбацкая плавбаза «Алексей Хлобыстов» подняла из воды 30 живых. Потом обитаемые аппараты «Мир» 68 раз спускались к лодке на 1700 метров.
