        otryvok: «Радистка оставалась на месте, в одиночку обеспечивая связь с 12 радиостанциями. Второй радист, как назло, тяжело заболел, и заменить ее было некем.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-15-goskatalog-5567616.jpg
          alt: Овальный портрет Кренкеля над деревянным домом радиостанции с мачтой, рядом группа людей
          data_source: https://goskatalog.ru/portal/#/collections?id=5567616
          license: «Союзфото», 1934, авторы не указаны — общественное достояние
          podpis: Радиостанция в Уэлене, поддерживавшая связь с лагерем Шмидта, и радист «Челюскина» Э. Кренкель. Лист фотовыставки «Союзфото», 1934.
          credit: Государственный центральный музей современной истории России (ГЦМСИР), № Госкаталога (ГИК) 10811/21
