        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Челюскинцы выпустили на льдине «Не сдадимся!», а следующий номер назвали «Не сдались!»</b>
        det:
          - "На льдине вышли два номера самодельной стенной газеты «Не сдадимся!», а ещё один вышел уже на пароходе «Смоленск» под названием «Не сдались!». В газете были сводки о дрейфе и запасах и много карикатур: Шмидта нарисовали выглядывающим из палатки с бородой, примёрзшей ко льду."
        src: "Источник: «Александр Миронов, челюскинец и собкор „Правды Севера“», «Правда Севера», 30.03.2025 — https://pravdasevera.ru/2025/03/30/67e81a5be90f55fa14060016.html; «„Всё знает, всё понимает, всё умеет“: как Отто Шмидт стал супергероем советской Арктики», РГО, 30.09.2021 — https://rgo.ru/activity/redaction/articles/vsye-znaet-vsye-ponimaet-vsye-umeet-kak-otto-shmidt-stal-supergeroem-sovetskoy-arktiki/"
        stranica: «Александр Миронов, челюскинец и собкор „Правды Севера“», «Правда Севера», 30.03.2025
        href: https://pravdasevera.ru/2025/03/30/67e81a5be90f55fa14060016.html
        otryvok: «„Не сдадимся!“ – именно так называлась самодельная стенная газета, два номера которой вышли в лагере Шмидта. Ещё один номер (но под фиксирующим победу названием „Не сдались!“) вышел уже на борту парохода „Смоленск“…»
        utverzhden: 2026-11-03
      - summary: <b>Каманин разбил шасси и пересел в самолёт подчинённого — Пивенштейн остался чинить командирский.</b>
        det:
          - По пути к Ванкарему Каманин при вынужденной посадке сломал шасси, пересел в машину лётчика Бориса Пивенштейна, дозаправив её, и с Молоковым долетел до цели. Пивенштейн остался в Валькальтене чинить командирский самолёт. Каманин вывез со льдины 34 человека и стал Героем, Пивенштейн получил орден Красной Звезды.
        src: "Источник: Иванов М., «Не ставшие героями», «История» (изд. дом «Первое сентября»), №19/2004 — https://his.1sept.ru/2004/19/11.htm; «Челюскинская эпопея», «Вокруг света» — https://www.vokrugsveta.ru/vs/article/338/ (34 человека)"
        stranica: Иванов М., «Не ставшие героями», «История» (изд. дом «Первое сентября»), №19/2004
        href: https://his.1sept.ru/2004/19/11.htm
        otryvok: «Тогда командир пересел в машину Пивенштейна, дозаправив ее горючим из своего покалеченного самолета, и вместе с Молоковым продолжил прерванный полет.»
        utverzhden: 2026-11-03
      - summary: <b>Водопьянов с 36 швами на лице ходил по кабинетам, пока его не взяли спасать челюскинцев.</b>
        det:
          - "В феврале 1933 года Водопьянов разбился на Байкале: бортмеханик погиб, лётчику наложили на лицо 36 швов. Ещё не оправившись, он ходил по кабинетам, пока его не включили в спасательную операцию. С Галышевым и Дорониным он пролетел почти 6500 км от Хабаровска до Ванкарема, трижды садился в лагере и вывез 10 человек."
        src: "Источник: «От полюса к бомбёжке Берлина. Как лётчик Водопьянов совершал невозможное», АиФ, 18.11.2019 — https://aif.ru/society/history/ot_polyusa_k_bombezhke_berlina_kak_letchik_vodopyanov_sovershal_nevozmozhnoe; «„Воздушный каюр“: 125 лет со дня рождения полярного лётчика Михаила Водопьянова», РГО, 18.11.2024 — https://rgo.ru/activity/redaction/articles/vozdushnyy-kayur-125-let-so-dnya-rozhdeniya-polyarnogo-letchika-mikhaila-vodopyanova/ («более 30 швов»); «90 лет назад погиб пароход „Челюскин“», «Год Литературы», 13.02.2024 — https://godliteratury.ru/articles/2024/02/13/90-let-nazad-pogib-parohod-cheliuskin (бельё)"
        stranica: «От полюса к бомбёжке Берлина. Как лётчик Водопьянов совершал невозможное», АиФ, 18.11.2019
        href: https://aif.ru/society/history/ot_polyusa_k_bombezhke_berlina_kak_letchik_vodopyanov_sovershal_nevozmozhnoe
        otryvok: «Только на лице врачи ему наложили 36 швов.»
        utverzhden: 2026-11-03
      - summary: <b>Лётчики сняли со льдины всех 104 человек — и стали первыми Героями Советского Союза.</b>
        det:
          - На льду оказались 104 человека, среди них десять женщин, пятимесячная Карина, родившаяся в походе 31 августа 1933 года, и полуторагодовалая Алла. С 5 марта по 13 апреля 1934 года самолёты вывезли всех. Ляпидевский, Леваневский, Молоков, Каманин, Слепнёв, Водопьянов и Доронин стали первыми Героями Советского Союза, Ляпидевский — Герой № 1.
        src: "Источник: «„Через два часа всё было кончено“. 90 лет назад затонул легендарный ледокол „Челюскин“», Лента.ру, 13.02.2024 — https://lenta.ru/articles/2024/02/13/cheluskin/; «90 лет назад погиб пароход „Челюскин“», «Год Литературы», 13.02.2024 — https://godliteratury.ru/articles/2024/02/13/90-let-nazad-pogib-parohod-cheliuskin (семь Героев, № 1); «Челюскинская эпопея», «Вокруг света» — https://www.vokrugsveta.ru/vs/article/338/"
        stranica: «„Через два часа всё было кончено“. 90 лет назад затонул легендарный ледокол „Челюскин“», Лента.ру, 13.02.2024
        href: https://lenta.ru/articles/2024/02/13/cheluskin/
        otryvok: «104 человека, включая десять женщин, пятимесячную Карину и полуторагодовалую Аллу, оказались в одном из самых отдаленных и труднодоступных мест мира…»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-15-goskatalog-59271092.jpg
          alt: Биплан Р-5 заходит на посадку над ровным льдом, на переднем плане спиной стоит человек в меховой одежде
          data_source: https://goskatalog.ru/portal/#/collections?id=59271092
          license: автор неизвестен, 1934 — общественное достояние
          podpis: Г. Ушаков фотографирует посадку самолёта В.С. Молокова в лагере Шмидта. Арктика, 1934 (надпись карандашом на обороте).
          credit: museumId 10206, полное название музея по API получить не удалось (403); № Госкаталога (ГИК) ГМИК НЕЖ КП 4719/1, инв. № не указан
          width: 1280
          height: 919
        utverzhden: 2026-11-03
      - summary: "<b>Небольсин отказался угонять 60 собачьих упряжек: без собак чукчам грозил голод.</b>"
        det:
          - "14 февраля чрезвычайная тройка в Уэлене отчиталась, что мобилизовала 60 нарт для 700-километрового похода к лагерю. Уполномоченный ОГПУ Андрей Небольсин план не одобрил: в феврале и марте на Чукотке почти нет дня и постоянная пурга. Если забрать собак на два месяца, чукчи останутся без охоты. Разведка подтвердила, что до лагеря сплошные торосы и разводья, и от упряжек отказались в пользу авиации."
        src: "Источник: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024 — https://lenta.ru/articles/2024/02/18/cheluskin2/"
        stranica: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024
        href: https://lenta.ru/articles/2024/02/18/cheluskin2/
        otryvok: «Мобилизовать на два месяца собак — значило оставить чукчей без охоты, то есть обречь их на голод»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-chelyuskincy-ru.mp3
  durationLabel: 1 минута 30 секунд
  lead: "Голос ведёт от гибели «Челюскина» до последнего самолёта: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Поход
    - t: 20
      mark: 0:20
      title: Два часа
    - t: 39
      mark: 0:39
      title: Лагерь
    - t: 55
      mark: 0:55
      title: Первый самолёт
    - t: 71
      mark: 1:11
      title: Всех
  transcript:
    - <p>Лето тридцать третьего года. Пароход «Челюскин» идёт Северным морским путём — от Мурманска до Владивостока за одно лето. Экспедицию ведёт Отто Шмидт. Судно — не ледокол. В Чукотском море, совсем рядом с Беринговым проливом, его зажимают льды.</p>
    - <p>Тринадцатое февраля тридцать четвёртого года. Льды ломают борт. За два часа пароход уходит под воду. Погибает один человек — завхоз Борис Могилевич. На льду остаются сто четыре человека, среди них десять женщин и двое маленьких детей.</p>
    - <p>Палатки, барак, камбуз, радио. В лагере выпускают свою газету. Она называется «Не сдаёмся!». Лёд ломается, и площадку для самолётов расчищают заново — тринадцать раз.</p>
    - <p>Пятое марта. Лётчик Анатолий Ляпидевский почти тридцать раз вылетал на поиски — и наконец находит лагерь. Он садится на льдину и забирает женщин и детей. Самой маленькой, Карине, — пять месяцев.</p>
    - <p>В апреле лётчики возят людей на берег, в Ванкарем. Василий Молоков сажает людей в ящики под крыльями. Тринадцатого апреля льдина пустеет. Спасены все сто четыре человека. Никто не сдался — ни на льду, ни в небе.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
