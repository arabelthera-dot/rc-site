          podpis: Лагерь Шмидта. Расчистка ледового аэродрома. 1934.
          credit: ГБУ ЧАО «Музейный Центр „Наследие Чукотки“», инв. Ф-5947, № Госкаталога (ГИК) МЦНЧ-9039/26
          width: 800
