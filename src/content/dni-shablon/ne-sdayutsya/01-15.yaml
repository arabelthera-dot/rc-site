      - summary: <b>Челюскинцы 13 раз заново расчищали аэродром на льду — и вынесли вещи из барака за минуты до вала.</b>
        det:
          - Лёд ломался и вставал торосами, и аэродром переносили или восстанавливали после разломов 13 раз. В ночь после 7 апреля на лагерь пошёл ледяной вал, первым на пути стоял барак, где недавно спали 14 человек. Люди успели вытащить самое ценное, а 9 апреля лёд раздавил камбуз и вельбот.
        src: "Источник: «„Через два часа всё было кончено“. 90 лет назад затонул легендарный ледокол „Челюскин“», Лента.ру, 13.02.2024 — https://lenta.ru/articles/2024/02/13/cheluskin/ (13 раз); «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024 — https://lenta.ru/articles/2024/02/18/cheluskin2/ (вал, воспоминание Ушакова)"
        stranica: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024
        href: https://lenta.ru/articles/2024/02/18/cheluskin2/
        otryvok: «Ледяной вал быстро приближался к лагерю. Первым на его пути стоял барак. Люди успели вытащить из него наиболее ценное имущество.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-15-goskatalog-12323745.jpg
          alt: Люди на льду расчищают площадку для посадки самолётов
