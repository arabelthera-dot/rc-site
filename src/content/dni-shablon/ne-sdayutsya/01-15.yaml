        - Летал на огромном самолёте
        - Брал людей на колени
        - Делал рейсы ночью
      a: 0
      e: Фанерные парашютные ящики под крыльями Р-5 — так Молоков вывез 39 человек.
    - q: Сколько человек из 104, сошедших на лёд, спасли лётчики?
      o:
        - Половину
        - Всех
        - Только женщин и детей
        - Девяносто
      a: 1
      e: Спасены все 104 человека; последних сняли со льдины 13 апреля 1934 года.
