story:
  kicker: Среда подвига
  h2: Пройти Север за одну навигацию
  abzacy:
    - Летом 1933 года пароход «Челюскин» вышел в Арктику. Экспедицию вёл учёный Отто Шмидт, судно — капитан Владимир Воронин. Задача — <b>пройти Северным морским путём от Мурманска до Владивостока за одно лето</b> и доказать, что по этому пути могут ходить обычные грузовые суда.
    - "«Челюскин» не был ледоколом. В Чукотском море, уже у самого выхода к Берингову проливу, его зажали льды — и понесли вместе с собой. Дрейф шёл всю осень и зиму. На борту было больше ста человек: моряки, учёные, строители для зимовки на острове Врангеля и их семьи. <b>Одна девочка родилась прямо в походе, 31 августа 1933 года, в Карском море, — её назвали Кариной.</b>"
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Челюскинцы — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Шмидт достал револьвер и пообещал лично застрелить первого, кто уйдёт с льдины пешком.</b>
        det:
          - "После гибели «Челюскина» часть людей хотела идти к берегу пешком: до суши было 130–200 км торосов и полыней при морозе под 40°. Для женщин, детей и слабых это означало верную смерть. Шмидт запретил пешие походы под угрозой оружия, и лагерь остался ждать самолёты."
        src: "Источник: «„Через два часа всё было кончено“. 90 лет назад затонул легендарный ледокол „Челюскин“», Лента.ру, 13.02.2024 — https://lenta.ru/articles/2024/02/13/cheluskin/; «Спасение экипажа „Челюскина“», «Коммерсантъ», 13.04.2024 — https://www.kommersant.ru/doc/6634455 (130 км, идею «подавили» полярники)"
        stranica: «„Через два часа всё было кончено“. 90 лет назад затонул легендарный ледокол „Челюскин“», Лента.ру, 13.02.2024
        href: https://lenta.ru/articles/2024/02/13/cheluskin/
        otryvok: «Все оценив, Шмидт достал револьвер и объяснил, что лично застрелит первого же «пешехода».»
        utverzhden: 2026-11-03
      - summary: <b>Молоков сажал челюскинцев в парашютные ящики под крыльями — и вывез 39 человек, больше всех.</b>
        det:
          - В двухместный Р-5 много людей не посадишь, и Василий Молоков возил челюскинцев в фанерных парашютных ящиках под крыльями. Так он вывез 39 человек (по другим данным 38), больше всех. Саму идею, по воспоминаниям штурмана Шелыганова, придумал лётчик Фабио Фарих, которого Каманин отстранил от перелёта.
        src: "Источник: «Спасение экипажа „Челюскина“», «Коммерсантъ», 13.04.2024 — https://www.kommersant.ru/doc/6634455; Иванов М., «Не ставшие героями», «История» (изд. дом «Первое сентября»), №19/2004 — https://his.1sept.ru/2004/19/11.htm"
        stranica: «Спасение экипажа „Челюскина“», «Коммерсантъ», 13.04.2024
        href: https://www.kommersant.ru/doc/6634455
        otryvok: «Летчик Василий Молоков вывез со льдины больше всех спасенных — 39 человек — на двухместном самолете Р-5. Предложил вывозить одновременно по 6 человек, приспособив для дополнительных пассажиров подвешенные под плоскостями фанерные парашютные ящики»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-15-goskatalog-29485310.jpg
          alt: Под нижним крылом биплана механики подвешивают длинный сигарообразный контейнер, рядом на снегу второй такой же
          data_source: https://goskatalog.ru/portal/#/collections?id=29485310
          license: автор неизвестен, 1934 — общественное достояние
          podpis: Крепление к крылу самолёта Молокова устройства для перевозки дополнительного пассажира. Ванкарем, апрель 1934.
          credit: Российский государственный музей Арктики и Антарктики (РГМАА), № Госкаталога (ГИК) РГМАА О-9672/8
          width: 500
          height: 346
        utverzhden: 2026-11-03
      - summary: <b>Ляпидевский сел во льдах с лопнувшим валом мотора — и четыре дня мир считал его погибшим.</b>
        det:
          - "14 марта 1934 года у АНТ-4 лопнул коленчатый вал левого мотора, и Ляпидевский сел на лёд у острова Колючин. Американские газеты успели напечатать: «Гибель русского полярного героя Ляпидевского». Только 18 марта узнали, что лётчики живы, а самолёт чинили 42 дня."
        src: "Источник: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024 — https://lenta.ru/articles/2024/02/18/cheluskin2/; Иванов М., «Не ставшие героями», «История» (изд. дом «Первое сентября»), №19/2004 — https://his.1sept.ru/2004/19/11.htm (Колючин, 42 дня)"
        stranica: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024
        href: https://lenta.ru/articles/2024/02/18/cheluskin2/
        otryvok: «К сожалению, 14 марта АНТ-4 потерпел аварию (лопнул коленчатый вал левого мотора) и вынужден был совершить вынужденную посадку на льду Чукотского моря. Четыре дня летчик считался погибшим.»
        utverzhden: 2026-11-03
      - summary: <b>Ляпидевский почти 30 раз вылетал искать лагерь — и 5 марта первым сел на льдину.</b>
        det:
          - В полярной мгле Ляпидевский пытался пробиться к лагерю 29 раз («Коммерсантъ» пишет о 28 неудачных вылетах). 5 марта 1934 года он посадил тяжёлый АНТ-4 на площадку 450 на 150 метров и забрал десять женщин и двоих детей — пятимесячную Карину и полуторагодовалую Аллу.
        src: "Источник: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024 — https://lenta.ru/articles/2024/02/18/cheluskin2/; «Челюскинская эпопея», «Вокруг света» — https://www.vokrugsveta.ru/vs/article/338/ (450 на 150 метров); «Спасение экипажа „Челюскина“», «Коммерсантъ», 13.04.2024 — https://www.kommersant.ru/doc/6634455; «90 лет назад погиб пароход „Челюскин“», «Год Литературы», 13.02.2024 — https://godliteratury.ru/articles/2024/02/13/90-let-nazad-pogib-parohod-cheliuskin (Карина и Алла)"
        stranica: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024
        href: https://lenta.ru/articles/2024/02/18/cheluskin2/
        otryvok: «До того как на Чукотку прибыли другие самолеты, Ляпидевский пытался пробиться к лагерю Шмидта 29 раз, но либо вынужден был вернуться из-за нелетной погоды, либо не мог его отыскать.»
        utverzhden: 2026-11-03
      - summary: <b>Шмидт с температурой 39 отказывался улетать — его вывезли только по приказу из Москвы.</b>
        det:
          - К апрелю у Шмидта обострился плеврит, температура дошла до 39°, но он не хотел бросать лагерь, пока там люди. Ушаков доложил в Кремль, и пришёл приказ передать руководство Боброву. 11 апреля Шмидта вывезли в Ванкарем, 12-го Слепнёв доставил его в госпиталь в Номе.
        src: "Источник: «Челюскинская эпопея», «Вокруг света» — https://www.vokrugsveta.ru/vs/article/338/; «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024 — https://lenta.ru/articles/2024/02/18/cheluskin2/; Иванов М., «Не ставшие героями», «История» (изд. дом «Первое сентября»), №19/2004 — https://his.1sept.ru/2004/19/11.htm (Слепнёв, Ном)"
        stranica: «Челюскинская эпопея», «Вокруг света»
        href: https://www.vokrugsveta.ru/vs/article/338/
        otryvok: «Но поскольку температура у него поднялась до 39, Ушаков, не дожидаясь, пока положение станет критическим, сообщил о ситуации в Кремль. Вскоре из Москвы на имя Шмидта пришел приказ передать руководство своему заместителю Боброву…»
        utverzhden: 2026-11-03
      - summary: <b>Завхоз Могилевич до последнего спасал груз на палубе — и ушёл под воду вместе с «Челюскиным».</b>
        det:
          - "«Челюскин» шёл из Мурманска во Владивосток за одну навигацию. 13 февраля 1934 года льды пропороли борт почти на 30 метров, и за два часа пароход ушёл под воду. Люди успели выгрузить на лёд продовольствие и палатки. Погиб один человек — завхоз Борис Могилевич: спасая имущество, он был сбит сорвавшимся грузом."
        src: "Источник: «„Через два часа всё было кончено“. 90 лет назад затонул легендарный ледокол „Челюскин“», Лента.ру, 13.02.2024 — https://lenta.ru/articles/2024/02/13/cheluskin/; «90 лет назад погиб пароход „Челюскин“», «Год Литературы», 13.02.2024 — https://godliteratury.ru/articles/2024/02/13/90-let-nazad-pogib-parohod-cheliuskin (бочки, брёвна, ящики)"
        stranica: «„Через два часа всё было кончено“. 90 лет назад затонул легендарный ледокол „Челюскин“», Лента.ру, 13.02.2024
        href: https://lenta.ru/articles/2024/02/13/cheluskin/
        otryvok: «Через два часа все было кончено. … Пытаясь сойти с судна, погиб завхоз Могилевич. Он был придавлен бревном и увлечен в воду»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Леваневский в обледеневшем самолёте выбил рукой стекло, чтобы видеть торосы, — и дотянул до льда.</b>
        det:
          - Леваневский летел из Нома в Ванкарем на американском «Флитстере» с Ушаковым и механиком-американцем Клайдом Армстедом. Самолёт покрылся льдом, мотор глох, машина сорвалась в штопор, приборы отказали. Лётчик выбил рукой обледеневшее стекло, на малой высоте выровнял самолёт и посадил его на брюхо в торосах. Леваневского ранило в лицо, а Ушаков вылил ему на рану йод прямо из бутылки и перевязал разорванными кальсонами.
        src: "Источник: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024 — https://lenta.ru/articles/2024/02/18/cheluskin2/ (воспоминания Леваневского); Иванов М., «Не ставшие героями», «История» (изд. дом «Первое сентября»), №19/2004 — https://his.1sept.ru/2004/19/11.htm (Армстед)"
        stranica: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024
        href: https://lenta.ru/articles/2024/02/18/cheluskin2/
        otryvok: «Впереди почти ничего не видно. Левой рукой разбиваю стекло. Врывается сильная струя воздуха.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-15-goskatalog-13500766.jpg
          alt: Трое мужчин в тёмных костюмах у карты, тот, что в центре, показывает на неё рукой
          data_source: https://goskatalog.ru/portal/#/collections?id=13500766
          license: автор неизвестен, 1934 — общественное достояние
          podpis: Леваневский, Ушаков, Слепнёв (слева направо) перед полётом в лагерь Шмидта. Москва, 1934.
          credit: museumId 258, название музея по API получить не удалось (403); инв. Д-1529, № Госкаталога (ГИК) КФ КП-4420
          width: 800
          height: 441
        utverzhden: 2026-11-03
      - summary: <b>Механики Слепнёва заменили сломанные стойки шасси распиленным пополам ломом — и самолёт взлетел.</b>
        det:
          - 7 апреля Слепнёв сел у лагеря и привёз ящик американского пива и ездовых собак, но у тяжёлого «Флитстера» сломались стойки шасси. Механики заменили их распиленным пополам ломом, а самолёт перетащили на руках на новую площадку. 10 апреля Каманин, Слепнёв и Молоков за три рейса вывезли 25 человек, а 12-го Слепнёв доставил Шмидта на Аляску.
        src: "Источник: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024 — https://lenta.ru/articles/2024/02/18/cheluskin2/; «90 лет назад погиб пароход „Челюскин“», «Год Литературы», 13.02.2024 — https://godliteratury.ru/articles/2024/02/13/90-let-nazad-pogib-parohod-cheliuskin (пиво, собаки); Иванов М., «Не ставшие героями», «История» (изд. дом «Первое сентября»), №19/2004 — https://his.1sept.ru/2004/19/11.htm (Аляска, 12 апреля)"
        stranica: «„Их брали за ноги и за руки и складывали в самолёт“», Лента.ру, 18.02.2024
        href: https://lenta.ru/articles/2024/02/18/cheluskin2/
        otryvok: «На одном из них механики упорно ремонтировали машину Слепнева и наконец добились результата. Вместо сломанных стоек шасси был приспособлен распиленный пополам лом.»
        utverzhden: 2026-11-03
      - summary: <b>Радистка Людмила Шрадер с воспалённым аппендиксом одна держала связь с 12 радиостанциями.</b>
        det:
          - Радистка полярной станции Уэлен Людмила Шрадер приехала на Чукотку по своей воле в 1931 году. Её станция первой отзывалась на радиограммы Кренкеля, и она в одиночку держала связь с 12 радиостанциями. Во время спасательной операции у неё воспалился аппендикс, но второй радист тяжело заболел, и она от операции отказалась.
        src: "Источник: «На одной волне: какими были радисты, покорившие Арктику и Антарктиду», РГО — https://rgo.ru/activity/redaction/articles/na-odnoy-volne-kakimi-byli-radisty-pokorivshie-arktiku-i-antarktidu/"
        stranica: "«На одной волне: какими были радисты, покорившие Арктику и Антарктиду», РГО"
