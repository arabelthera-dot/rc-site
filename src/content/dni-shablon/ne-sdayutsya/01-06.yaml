  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — 6 августа 1915 года; 2 — Мокрыми повязками; 3 — Около 60; 4 — Инженер Хмельков в 1939 году; 5 — Нет — её оставили по приказу и взорвали."
