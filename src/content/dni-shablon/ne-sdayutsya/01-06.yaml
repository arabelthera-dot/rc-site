vizual:
  imya: osovec-etyud
  vid: predmet
  kicker: Этюд под лупой
  h2: Осовец в 1915 году
  lead: 'Этот этюд художник Пётр Котов написал в 1915 году, когда крепость ещё держала оборону. Приближайте: разбитый мост, настил на сваях над водой, двое солдат у каменной опоры.'
audioguide:
  audioSrc: audio-guide-osovets-ru.mp3
  durationLabel: около двух минут
  lead: Голос ведёт от газовой атаки на Осовец через штыковой удар отравленных рот к крепости, которую так и не взяли штурмом.
  stops:
    - t: 0
      mark: '0:00'
      title: Атака мертвецов
    - t: 31
      mark: '0:31'
      title: Газ без противогазов
    - t: 59
      mark: '0:59'
      title: Котлинский и Стржеминский
    - t: 84
      mark: '1:24'
      title: Сорок человек и пулемёт
    - t: 110
      mark: '1:50'
      title: Полгода вместо двух суток
  transcript:
    - "Немцы приготовили повозки, чтобы вывезти из Осовца трупы. После газа одиннадцатая ландверная дивизия рассчитывала просто войти в крепость. Вместо этого навстречу примерно семи тысячам немецкой пехоты поднялись около полусотни отравленных русских солдат и пошли в штыки. Немцы были уверены, что впереди никого нет, боя не приняли и бросились назад. Многие повисли на своей же колючей проволоке. Военный инженер Сергей Хмельков, сам бывший в обороне, записал со слов очевидца: это была атака «мертвецов»."
    - Попутного ветра немцы ждали больше десяти дней. Газ, хлор с примесью брома, пустили шестого августа тысяча девятьсот пятнадцатого года в четыре часа утра. Прошёл он около десяти километров. Противогазов не было, спасались повязками. Девятая, десятая и одиннадцатая роты Землянского полка погибли целиком, от трёх рот у Бялогронд осталось около шестидесяти человек, и они продолжали держать позицию. Вся медь в крепости покрылась толстым зелёным налётом.
    - Тринадцатую роту поднял в атаку Котлинский, уже отравленный. По уставу в атаку бросались за сто — двести шагов, он поднял роту за четыреста — пятьсот. Ему только что исполнился двадцать один год. Смертельно раненный, он передал команду подпоручику Владиславу Стржеминскому, сапёру, который сам вызвался идти с ротой. Стржеминский, тоже отравленный, повёл её ещё в две успешные атаки.
    - "От двенадцатой роты осталось около сорока человек при одном пулемёте. Подпоручик Михаил Чоглоков загнул фланг и бил по прорвавшимся немцам сбоку. На этом огне застрял семьдесят шестой ландверный полк, который к тому же попал под собственный газ. Когда русские отбили деревню Сосня, нашли убитого пулемётчика крепостной артиллерии: он выпустил в упор две ленты и пал на пулемёт, не успев вложить третью."
    - "Ещё в марте штаб армии просил продержаться сорок восемь часов. Комендант Николай Бржозовский ответил, что «нет никаких данных беспокоиться за участь крепости». Солдаты под обстрелом шутили: «Пущай постреляет, по крайней мере выспимся». Штурмом Осовец так и не взяли, его оставили по приказу при общем отходе армии. А Новогеоргиевск, где было тридцать три форта против четырёх в Осовце, сдался."
  note: Озвучено синтезом речи.
