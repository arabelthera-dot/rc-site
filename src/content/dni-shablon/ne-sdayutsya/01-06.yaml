    udary:
      - summary: "<b>Солдаты Осовца отшучивались от обстрела: «Пущай постреляет, по крайней мере выспимся».</b>"
        det:
          - С 25 февраля по 3 марта 1915 года по крепости били 66 тяжёлых орудий калибром до 42 см. Немцы выпустили около 200 000 тяжёлых снарядов, на местности насчитали около 30 000 воронок. Ночью немцы не стреляли, поэтому гарнизон каждую ночь чинил дневные разрушения. Вокруг броневой башни на Скобелевой горе было около 2000 воронок, а в саму башню попало три снаряда. К 7 марта немцы прекратили бомбардировку.
        src: "Источник: Хмельков, 1939, с. 62–72 — http://militera.lib.ru/h/hmelkov_sa/04.html и «Заключение» — http://militera.lib.ru/h/hmelkov_sa/05.html; 200 000 и 30 000 также у РВИО — https://history.ru/read/articles/osoviets-event"
        stranica: Хмельков, 1939, с. 62–72
        href: http://militera.lib.ru/h/hmelkov_sa/04.html
        otryvok: ««Пущай постреляет, по крайней мере выспимся», — говорили солдаты, измученные предшествующими боями на передовых позициях и оборонительными работами в крепости.»
        pometka: два источника
        kadr:
          src: kartinka:000051
          alt: "Фотография: солдаты в шинелях и папахах на зимнем угощении"
          data_source: https://goskatalog.ru/portal/#/collections?id=4975312
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Солдаты наблюдательной станции Осовецкой крепостной воздухоплавательной роты на угощении от работников Земского союза, февраль 1915 года.
          credit: "Хранится: Федеральное государственное бюджетное учреждение культуры «Государственный центральный музей современной истории России». Госкаталог № 4975312 (ГИК 3308/1190)"
          width: 800
          height: 603
        utverzhden: 2026-11-03
      - summary: <b>Сапёр Стржеминский сам вызвался в атаку и после гибели Котлинского дважды водил роту вперёд.</b>
        det:
          - "Подпоручику Владиславу Стржеминскому из 2-й Осовецкой крепостной сапёрной роты был 21 год. Он сам пошёл с 13-й ротой, чтобы обеспечивать бой как инженер, и тоже был отравлен. Приняв команду, повёл роту ещё в две успешные атаки. Курьёз: в 1920-е годы Стржеминский стал известным художником-авангардистом."
        src: "Источник: «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/02/rodina-ataka.html; «Родина», 06.08.2025 — https://rodina-history.ru/2025/08/06/reg-szfo/110-let-nazad-ataka-mertvecov-voshla-v-istoriiu.html"
        stranica: «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/02/rodina-ataka.html
        otryvok: «Подпоручик служил во 2-й Осовецкой крепостной саперной роте и с 13-й Землянской вызвался идти, чтобы помочь в инженерном обеспечении боя.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Четыре пушки весь последний день стреляли, чтобы немцы не узнали, что крепость пуста.</b>
        det:
          - "23 августа 1915 года в крепости оставались инженеры, две роты сапёров и расчёты четырёх 15-см пушек. До этого тяжёлые орудия ночами вывезли на Гродно на лямках, по 30–50 человек на пушку. В 19 часов сапёры подожгли здания, с 20 часов начались взрывы: под одну казарму закладывали по 1000–1500 кг пироксилина. Последними подорвали четыре пушки. Немцы вошли в развалины только 25 августа."
        src: "Источник: старая страница («оставлена по приказу, укрепления взорваны»); Хмельков, 1939, глава «Эвакуация крепости 18–23 августа 1915 г.», с. 83–85 — http://militera.lib.ru/h/hmelkov_sa/04.html"
        stranica: старая страница («оставлена по приказу, укрепления взорваны»); Хмельков, 1939, глава «Эвакуация крепости 18–23 августа 1915 г.», с. 83–85
        href: http://militera.lib.ru/h/hmelkov_sa/04.html
        otryvok: «23 августа в крепости находились только крепостные инженеры, две роты сапер и смена артиллеристов при четырех 15- см пушках. Эти орудия весь день вели интенсивную стрельбу, чтобы ввести в заблуждение противника и замаскировать отсутствие гарнизона.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>От трёх рот газ оставил около 60 человек, и они продолжали держать позицию.</b>
        det:
          - Попутного ветра немцы ждали больше десяти дней. Газ пустили 6 августа 1915 года в 4 часа утра, хлор с примесью брома. Прошёл он около 10 км. Противогазов не было, спасались повязками. 9, 10 и 11-я роты Землянского полка погибли целиком, от трёх рот у Бялогронд осталось около 60 человек. Вся медь в крепости, от частей орудий до умывальников, покрылась толстым зелёным налётом.
        src: "Источник: Хмельков, 1939 — http://militera.lib.ru/h/hmelkov_sa/04.html; «Родина», 02.09.2015, «Атака мертвецов» — https://rodina-history.ru/2015/09/02/rodina-ataka.html"
        stranica: Хмельков, 1939
        href: http://militera.lib.ru/h/hmelkov_sa/04.html
        otryvok: «от трех рот, защищавших Бялогронды, оставалось около 60 человек при двух пулеметах.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Немецкий полк попал под собственный газ и застрял у Сосни.</b>
        det:
          - По Хмелькову, после газа немцы могли быстро взять передовую позицию, но наступали медленно. На правом фланге 76-й ландверный полк попал под свои же газы, понёс огромные потери и встал у Сосни под огнём остатков 12-й роты. На левом фланге 5-й ландверный полк не смог прорезать проволоку у Бялогронд, и его атаку отбили. К 11 часам Сосненская позиция была очищена.
        src: "Источник: Хмельков, 1939 — http://militera.lib.ru/h/hmelkov_sa/04.html"
        stranica: Хмельков, 1939
        href: http://militera.lib.ru/h/hmelkov_sa/04.html
        otryvok: «На правом фланге 76-й ландверный полк попал под свои же газы, понес огромные потери и, овладев Сосня, дальше не мог продвинуться, остановленный огнем остатков 12-й роты.»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-osovets-ru.mp3
  durationLabel: 1 минута 4 секунды
  lead: "Голос ведёт от крепости среди болот до «атаки мертвецов»: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Крепость среди болот
    - t: 12
      mark: 0:12
      title: Газ
    - t: 24
      mark: 0:24
      title: Без противогазов
    - t: 36
      mark: 0:36
      title: Контратака
    - t: 51
      mark: 0:51
      title: «Атака мертвецов»
  transcript:
    - <p>«Мы входим в зал, и перед нами — крепость среди болот. Это Осовец, река Бобр, 1915 год. Крепость прикрывает железную дорогу, обход через болота почти невозможен.</p>
    - <p>6 августа 1915 года к позициям ползёт зелёное облако — газ, хлор с примесью брома. Ветра для этого немцы ждали больше десяти дней. Противогазов у гарнизона нет.</p>
    - <p>Газ проходит вглубь на двадцать километров. За первые часы выбывает больше тысячи шестисот защитников, несколько рот — почти полностью. Кажется, что оборонять уже некому.</p>
    - <p>Но уцелевшие бойцы 13-й роты — около шестидесяти человек, отравленных, с мокрыми тряпками вместо противогазов — поднимаются в штыковую. Ведёт их подпоручик Котлинский. Рядом — 14-я рота, сзади бьёт уцелевшая артиллерия.</p>
    - <p>Немецкая пехота, уверенная, что впереди уже одни мёртвые, не принимает боя и бежит. Крепость, которую просили продержать двое суток, не сдалась и за полгода. Этот подвиг назвали «атакой мертвецов».</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
