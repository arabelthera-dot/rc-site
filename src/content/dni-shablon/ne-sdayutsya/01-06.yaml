story:
  kicker: Подвиг
  h2: Контратака, которую назвали «атакой мертвецов»
  abzacy:
    - Крепость Осовец держалась с сентября 1914 года. Она прикрывала железную дорогу и коридор между реками — и стояла среди болот, так что обойти её было почти невозможно. Немцы пытались взять её штурмом — и не могли.
    - "6 августа 1915 года они применили то, против чего защиты не было: газобаллонную атаку. Хлор с примесью брома, тысячи баллонов. Ветра для этого ждали больше десяти дней. Противогазов у гарнизона не было — только смоченные повязки."
    - Газовая волна прошла вглубь на двадцать километров. Сразу выбыло из строя больше шестнадцати сотен защитников; несколько рот — почти полностью. Казалось, оборонять уже некому. Но уцелевшие бойцы 13-й роты 226-го Землянского полка — около шестидесяти человек, отравленных, с мокрыми тряпками вместо противогазов — <b>поднимаются в штыковую</b>.
    - Ведёт их подпоручик Владимир Котлинский; получив смертельное ранение, он передаёт команду подпоручику Владиславу Стржеминскому. Рядом — 14-я рота, сзади бьёт уцелевшая артиллерия. Немецкая пехота, уверенная, что впереди уже никого нет, <b>не принимает боя и бежит</b> — многие гибнут на своих же проволочных заграждениях.
    - "Крепость, которую просили продержать двое суток, <b>не сдалась и за полгода</b>. Штурмом её так и не взяли: оставлена по приказу при общем отходе армии из Польши, укрепления взорваны. А контратака отравленных осталась в памяти под именем, которое придумают позже, — «атака мертвецов»."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Крепость Осовец — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: "<b>Слова «атака мертвецов» придумал не газетчик: так назвал бой его участник.</b>"
        det:
          - "Выражение появилось в книге «Борьба за Осовец» 1939 года. Её автор, военный инженер Сергей Хмельков, сам был в обороне крепости и записал со слов очевидца: «Эта атака „мертвецов“, как передает очевидец боя, настолько поразила немцев, что они не приняли боя и бросились назад». А газета «Русское слово» писала сразу после боя: «Отсталых не было, торопить не приходилось никого… погибнуть, но отомстить подлым отравителям». Немцы боя не приняли и отступили."
        src: "Источник: ТВ «Звезда», 06.08.2019 — https://tvzvezda.ru/news/201986235-3RLgi.html; Хмельков, 1939 — http://militera.lib.ru/h/hmelkov_sa/04.html"
        stranica: ТВ «Звезда», 06.08.2019
        href: https://tvzvezda.ru/news/201986235-3RLgi.html
        otryvok: «Борьба за Осовец»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Немцы приготовили повозки, чтобы вывезти из Осовца трупы, но наткнулись на огонь гарнизона.</b>
        det:
          - "Пленные единодушно показали: 11-я ландверная дивизия генерала Рудольфа фон Фройденберга рассчитывала после газа просто войти в крепость и вывезти мёртвых. Повозки для этого уже приготовили. Вместо этого дивизия наткнулась на огонь и контратаки «ожившего» гарнизона."
        src: "Источник: А. Смирнов, «Атака мертвецов», журнал «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/02/rodina-ataka.html"
        stranica: А. Смирнов, «Атака мертвецов», журнал «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/02/rodina-ataka.html
        otryvok: «11-я ландверная полагала, что после пуска газов ей останется только войти в Осовец и вывезти оттуда трупы - для чего она уже приготовила повозки.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Полсотни отравленных бойцов пошли в штыки на семитысячное немецкое войско.</b>
        det:
          - За газовой волной немцы двинули 13–14 батальонов пехоты, около семи тысяч человек. Комендант выслал в контратаку 8, 13 и 14-ю роты 226-го Землянского полка. 13-я и 8-я роты, потеряв до половины людей отравленными, развернулись и пошли в штыки. Немцев обратили в бегство около полусотни русских солдат.
        src: "Источник: Хмельков, 1939 — http://militera.lib.ru/h/hmelkov_sa/04.html; ТВ «Звезда», «Погибнуть, но отомстить» (06.08.2019) — https://tvzvezda.ru/news/201986235-3RLgi.html"
        stranica: Хмельков, 1939
        href: http://militera.lib.ru/h/hmelkov_sa/04.html
        otryvok: «Около полусотни русских солдат обратили в бегство семитысячное немецкое войско при обороне крепости Осовец.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Немецкая пехота побежала от «мёртвых» и повисла на своей же колючей проволоке.</b>
        det:
          - "Немцы были уверены, что впереди никого нет, и боя не приняли. Многие погибли на своих проволочных заграждениях. Новое у Хмелькова: бегущие бросили захваченные орудия и пулемёты. 13-я рота взяла 25 пленных, 14-я рота прапорщика Тидебеля вместе с остатками 12-й ещё 15. К 11 часам позицию очистили."
        src: "Источник: старая страница (РНБ, nlr.ru); Хмельков, 1939, с. 80 — http://militera.lib.ru/h/hmelkov_sa/04.html; РВИО, «Осовец» — https://history.ru/read/articles/osoviets-event"
        stranica: старая страница (РНБ, nlr.ru); Хмельков, 1939, с. 80
        href: http://militera.lib.ru/h/hmelkov_sa/04.html
        otryvok: «настолько поразила немцев, что они не приняли боя и бросились назад, много немцев погибло на проволочных сетях перед второй линией окопов от огня крепостной артиллерии.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Две русские пушки Кане несколькими залпами подбили две немецкие 42-см гаубицы.</b>
        det:
          - "28 февраля 1915 года батарея из двух 15-см пушек Кане, только что привезённых из Кронштадта, накрыла две 42-см гаубицы у полустанка Подлесок. Немцы плохо их замаскировали: считали, что крепость не достанет. Тем же огнём взорвали склад боеприпасов. По Хмелькову, гаубицы успели выпустить по крепости всего 30 снарядов. Две оставшиеся немцы увезли в Граево и больше из них не стреляли."
        src: "Источник: Хмельков, 1939, глава «Борьба за главную позицию крепости», с. 65–67 — http://militera.lib.ru/h/hmelkov_sa/04.html"
        stranica: Хмельков, 1939, глава «Борьба за главную позицию крепости», с. 65–67
        href: http://militera.lib.ru/h/hmelkov_sa/04.html
        otryvok: «28 февраля батарея из двух 15- см пушек Кане, прибывших из Кронштадта и только что установленных на плацдарме, вблизи батареи № 9, несколькими залпами подбила два гигантских орудия и взорвала склад боеприпасов.»
        pometka: документ
        kadr:
          src: kartinka:000049
          alt: "Фотография: разрушенная батарея форта среди перерытой земли"
          data_source: https://goskatalog.ru/portal/#/collections?id=24629846
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Разбитая батарея форта № 4 крепости Осовец, 1915 год.
          credit: "Неизвестный фотограф. Хранится: Федеральное государственное бюджетное учреждение культуры «Государственный исторический музей». Госкаталог № 24629846 (ГИМ 96223/385)"
          width: 800
          height: 567
        utverzhden: 2026-11-03
      - summary: <b>Командование просило продержаться 48 часов, а Осовец простоял ещё полгода.</b>
        det:
          - В разгар мартовской бомбардировки 1915 года штаб 12-й армии попросил продержаться 48 часов. Комендант Николай Бржозовский подсчитал потери и ответил, что «нет никаких данных беспокоиться за участь крепости». Штурмом крепость так и не взяли. Её оставили по приказу при общем отходе армии из Польши. Бржозовский был ветераном Порт-Артура, Георгия 4-й степени он получил за то, что отбил немцев ещё в сентябре 1914 года.
        src: 'Источник: старая страница (РНБ, nlr.ru); Хмельков, 1939, с. 65–66 — http://militera.lib.ru/h/hmelkov_sa/04.html; А. Смирнов, «"Крепак" Бржозовский», «Родина», № 9, 2020 — https://rodina-history.ru/2020/09/23/krepak-brzhozovskij-byl-nastoiashchim-bogom-vojny.html'
        stranica: старая страница (РНБ, nlr.ru); Хмельков, 1939, с. 65–66
        href: http://militera.lib.ru/h/hmelkov_sa/04.html
        otryvok: «нет никаких данных беспокоиться за участь крепости»
        pometka: документ
        kadr:
          src: kartinka:000005
          alt: Бомбардировка крепости Осовец, 1915
          data_source: https://goskatalog.ru/portal/#/collections?id=4975631
          license: общественное достояние (автор неизвестен, снимок 1915 года)
          podpis: Бомбардировка крепости Осовец, 1915 год.
          credit: "Автор неизвестен. Хранится: Федеральное государственное бюджетное учреждение культуры «Государственный центральный музей современной истории России». Госкаталог музейного фонда РФ, № 4975631."
          width: 800
          height: 550
        utverzhden: 2026-11-03
      - summary: <b>Последний пулемётчик в упор выпустил по немцам две ленты и погиб, вставляя третью.</b>
        det:
          - "Когда русские отбили деревню Сосня, в ходе сообщения нашли убитого пулемётчика Осовецкой крепостной артиллерии. Он остался совсем один. Поручик П. Ефимов вспоминал: «Единственный русский пулеметчик, оставшийся в живых, успел выпустить в упор две ленты патронов и пал на пулемет, не успев вложить третью ленту». В наступавшем здесь 76-м ландверном полку треть убитых были младшие командиры и добровольцы."
        src: "Источник: «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/02/rodina-ataka.html; цитата Ефимова также у РВИО — https://history.ru/read/articles/osoviets-event"
        stranica: «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/02/rodina-ataka.html
        otryvok: «Единственный русский пулеметчик, оставшийся в живых, успел выпустить в упор две ленты патронов и пал на пулемет, не успев вложить третью ленту»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Подпоручик Чоглоков с сорока бойцами и одним пулемётом остановил немецкий ландверный полк.</b>
        det:
          - После газа от 12-й роты Землянского полка осталось около 40 человек при одном пулемёте. Подпоручик Михаил Чоглоков загнул фланг и бил по прорвавшимся немцам сбоку. На этом огне застрял 76-й ландверный полк, который к тому же попал под собственный газ. У деревни Бялогронды 20 человек с двумя пулемётами не пустили дальше 5-й ландверный полк.
        src: "Источник: «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/02/rodina-ataka.html; Хмельков, 1939, с. 79 — http://militera.lib.ru/h/hmelkov_sa/04.html"
        stranica: «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/02/rodina-ataka.html
        otryvok: «Вот поэтому-то, на наш взгляд, 76-й ландверный полк и застрял под огнем всего 40 человек с пулеметом»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Отравленный Котлинский нарушил устав и поднял роту в атаку за пятьсот шагов.</b>
        det:
          - По уставу в атаку бросались за 100–200 шагов, Котлинский поднял роту за 400–500. Перед этим он, уже отравленный, сам разведал рубеж. Ему только что исполнился 21 год, по специальности он был военным топографом, а роту получил из-за огромной убыли офицеров. Смертельно раненный, он передал команду подпоручику Владиславу Стржеминскому. Приказом от 26 сентября 1916 года Котлинский посмертно награждён орденом Святого Георгия 4-й степени. В 2015 году в Пскове ему поставили памятник.
        src: "Источник: «Родина», № 9, 2015 — https://rodina-history.ru/2015/09/02/rodina-ataka.html; «Память героев Великой войны», карточка награждения — https://gwar.mil.ru/heroes/chelovek_nagrazhdenie50140877/; РВИО, памятник в Пскове — https://history.ru/read/monuments/pamyatnik-geroyam-pervoy-mirovoy-voyny-pskov-2"
        stranica: «Родина», № 9, 2015
        href: https://rodina-history.ru/2015/09/02/rodina-ataka.html
        otryvok: «Устав требовал начинать этот бросок за 100-200 шагов до противника. Котлинский поднял роту не то за 400, не то за 500.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>У Осовца было четыре форта, и он стоял полгода, а Новогеоргиевск с 33 фортами сдался.</b>
        det:
          - Против Новогеоргиевска немцы выставили 45 батальонов, против Осовца 40. При этом в Новогеоргиевске было 33 форта, в Осовце 4. Новогеоргиевск сдался в августе 1915 года и оставил врагу около 80 000 пленных и 1200 орудий. Хмельков называет Осовец «маленькой "игрушечной"» крепостью, которую оставили «только по приказанию высшего командования».
        src: "Источник: Хмельков, 1939, «Заключение», с. 86–88 — http://militera.lib.ru/h/hmelkov_sa/05.html"
