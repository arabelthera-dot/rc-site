  voprosy:
    - q: Когда немцы применили газ под Осовцом?
      o:
        - 6 августа 1915 года
        - 22 июня 1941 года
        - 1 сентября 1939 года
        - 9 мая 1945 года
      a: 0
      e: 6 августа 1915 года. Ветра для газовой атаки немцы ждали больше десяти дней.
    - q: Чем защищались от газа без противогазов?
      o:
        - Противогазами
        - Мокрыми повязками
        - Стальными щитами
        - Ничем — уходили
      a: 1
      e: Противогазов не было — только смоченные водой повязки и подручные средства.
    - q: Сколько примерно бойцов поднялось в контратаку?
      o:
        - Около 6000
        - Около 600
        - Около 60
        - Около 6
      a: 2
      e: Около шестидесяти отравленных бойцов 13-й роты. Оценки в источниках разнятся — но речь о десятках, а не о полках.
    - q: Кто ввёл название «атака мертвецов»?
      o:
        - Немецкий генерал
        - Журналисты в 1915-м
        - Инженер Хмельков в 1939 году
        - Автор неизвестен
      a: 2
      e: Военный инженер Сергей Хмельков, сам участник обороны, в книге «Борьба за Осовец» (1939).
    - q: Взяли ли немцы крепость штурмом?
      o:
        - Да, после газовой атаки
        - Да, на третий штурм
        - Крепость сдалась сама
        - Нет — её оставили по приказу и взорвали
      a: 3
      e: "Нет. Штурмом её так и не взяли: оставлена по приказу при отходе армии из Польши, укрепления взорваны."
