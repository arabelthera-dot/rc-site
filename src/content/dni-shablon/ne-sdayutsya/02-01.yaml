  - summary: Перед боем князь отдал свою одежду, коня и знамя боярину Бренку — Бренка убили вместо князя
    det:
    - «Прежнего же коня своего отдал Михаилу Андреевичу Бренку и ту одежду на него надел, ибо любил он его сверх меры, и знамя свое багряное повелел оруженосцу своему над Бренком держать. Под тем знаменем и убит был вместо великого князя.»
    src: 'Источник: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982'
