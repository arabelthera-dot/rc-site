  - summary: <b>На поединок инок вышел без шлема и доспеха — в схиме с нашитым крестом.</b>
    det:
    - Сергий Радонежский дал Пересвету и Осляби «вместо оружия тленного нетленное — крест Христов, нашитый на схимах» и велел возлагать его вместо золочёных шлемов. В бою на голове Пересвета был куколь, «вооружен же он схимою по велению игумена Сергия».
    src: 'Источник: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982; «Александр (Пересвет) и Андрей (Ослябя) Радонежские», Православная энциклопедия, т. 1, с. 532–533 — https://www.pravenc.ru/text/64384.html'
    stranica: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом)
    href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982
    otryvok: «И дал он им вместо оружия тленного нетленное — крест Христов, нашитый на схимах, и повелел им вместо шлемов золоченых возлагать его на себя»
    pometka: два источника
