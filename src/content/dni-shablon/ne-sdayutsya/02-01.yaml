quiz:
  kicker: Викторина
  h2: Проверь себя
  intro: Пять вопросов по фактам дня. За верный ответ — 10 баллов.
  noscript: Викторина работает при включённом JavaScript.
  ball: 10
  voprosy:
  - q: В чём вышел Пересвет на поединок?
    o:
    - В золочёном шлеме
    - В схиме, без доспеха
    - В багряном плаще князя
    a: 1
    e: По «Сказанию о Мамаевом побоище», Пересвет был «вооружен же он схимою по велению игумена Сергия».
  - q: Кому князь перед боем отдал своих коня, одежду и знамя?
    o:
    - Боярину Михаилу Бренку
    - Иноку Пересвету
    - Князю Владимиру
    a: 0
    e: Под знаменем князя был убит Михаил Бренк — вместо великого князя.
  - q: Где после боя нашли великого князя?
    o:
    - В шатре
    - На берегу Дона
    - Под срубленной берёзой
    a: 2
    e: Князь лежал «в тени срубленного дерева березового» — живой.
  - q: Откуда ударил спрятанный полк?
    o:
    - Из Зелёной дубравы
    - Из-за Дона
    - С Красного холма
    a: 0
    e: Засадный полк стоял в лесном массиве Зелёная Дубрава.
  - q: Сколько часов длилась Куликовская битва?
    o:
    - Один
    - Три
    - Восемь
    a: 1
    e: Сражение длилось три часа — с 6-го по 9-й час по древнерусскому счёту.
