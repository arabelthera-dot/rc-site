story:
  kicker: Подвиг
  h2: Александр Пересвет
  abzacy:
  - '8 сентября 1380 года, на рассвете, русское войско и Мамаева орда встали друг против друга на Куликовом поле. Из ордынских рядов выехал богатырь, «пяти сажен высота его». Навстречу ему выступил инок Троицкой обители Александр Пересвет, бывший брянский боярин. Доспеха на нём не было: Сергий Радонежский велел ему вместо золочёного шлема надеть схиму с нашитым крестом.'
  - Бойцы сшиблись копьями, «едва земля не проломилась под ними», и оба пали с коней замертво. С этого поединка началась Куликовская битва. После победы Дмитрий Донской нашёл Пересвета рядом с поверженным врагом и сказал, что инок «победил великого, сильного, злого татарина». Пересвета похоронили в Москве, в Старом Симонове, рядом с братом по обители Андреем Ослябей.
