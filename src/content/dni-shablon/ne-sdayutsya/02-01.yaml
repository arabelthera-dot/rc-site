    otryvok: «Лучше нам убитым быть, нежели в плен попасть к поганым татарам!»
    pometka: документ
    utverzhden: '2026-11-08'
  - summary: <b>Пересвета похоронили в Москве, в Старом Симонове, рядом с Ослябей.</b>
    det:
    - Иноков погребли у деревянной церкви Рождества Богородицы «на старом Симонове». Их гробницы известны с 1660 года, в 1870 году в Сергиевском приделе поставили чугунное надгробие.
    src: 'Источник: «Александр (Пересвет) и Андрей (Ослябя) Радонежские», Православная энциклопедия, т. 1, с. 532–533 — https://www.pravenc.ru/text/64384.html; «Церковь Рождества Пресвятой Богородицы в Старом Симонове», «Храмы России» — http://www.temples.ru/card_texts.php?CardID=6010'
