  - summary: <b>Пересвет и ордынский богатырь ударились копьями, и оба пали с коней замертво.</b>
    det:
    - «И ударились крепко копьями, едва земля не проломилась под ними, и свалились оба с коней на землю и скончались». Первым павшим на Куликовом поле стал Александр Пересвет — и погиб, сразив врага.
    src: 'Источник: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982; «Церковь Рождества Пресвятой Богородицы в Старом Симонове», «Храмы России» — http://www.temples.ru/card_texts.php?CardID=6010'
