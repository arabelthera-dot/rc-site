  - summary: <b>До пострига Пересвет был брянским боярином и опытным ратником.</b>
    det:
    - 'В списке павших «Летописной повести» сказано: «Александръ Пересвѣтъ, бывый преже болярин брянскый». «Задонщина» зовёт его «Пересвет-чернец, брянский боярин». «Сказание» добавляет, что Пересвет и Ослябя «были известными в сражениях ратниками, не одно нападение встретили».'
    src: 'Источник: «Летописная повесть о Куликовской битве», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4981; «Задонщина», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4980; «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982'
    stranica: «Летописная повесть о Куликовской битве», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом)
    href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4981
    otryvok: «Александръ Пересвѣтъ, бывый преже болярин брянскый»
    pometka: два источника
    utverzhden: '2026-11-08'
  - summary: <b>Дмитрий Донской сам попросил у Сергия Радонежского двух иноков-воинов.</b>
    det:
    - '18 августа 1380 года князь Дмитрий Иванович получил в Троицкой обители благословение на битву и попросил дать ему в подкрепление Пересвета и Ослябю. Сергий отпустил их со словами: «Вот тебе мои воины, а твои избранники».'
    src: 'Источник: «Александр (Пересвет) и Андрей (Ослябя) Радонежские», Православная энциклопедия, т. 1, с. 532–533 — https://www.pravenc.ru/text/64384.html; «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982'
