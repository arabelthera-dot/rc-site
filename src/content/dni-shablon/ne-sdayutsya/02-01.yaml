  - summary: Битву почти проиграли — и тут из Зелёной дубравы ударил спрятанный полк
    det:
    - «…в бой вступил Засадный полк …, который располагался недалеко от полка Левой руки в большом лесном массиве Зеленая Дубрава. Введение в сражение свежих русских сил коренным образом изменило ситуацию на поле боя. Среди ордынцев началась паника. Войска Мамая обратились в бегство.»
