  - summary: Монах вышел без доспеха, в одной схиме — против богатыря «пяти сажен высота его»
    det:
    - '«…пяти сажен высота его и трех сажен ширина его. И увидел его Александр Пересвет, монах, который был в полку Владимира Всеволодовича, и, выступив из рядов, сказал: «Этот человек ищет подобного себе, я хочу с ним переведаться!» И был на голове его куколь, как у архангела, вооружен же он схимою по велению игумена Сергия.»'
    src: 'Источник: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982'
