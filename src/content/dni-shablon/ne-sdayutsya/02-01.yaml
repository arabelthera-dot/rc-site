story:
  kicker: Подвиг
  h2: Александр Пересвет
  abzacy:
  - Князь Дмитрий Иванович попросил у игумена Сергия в войско двух монахов — Александра Пересвета и Андрея Ослябю, и игумен отпустил их в бой. 8 сентября 1380 года русское войско и Мамаева орда встали друг против друга на Куликовом поле.
  - 'Из ордынских рядов выехал богатырь, «пяти сажен высота его». Вызов никто не приказывал: Пересвет сам вышел из строя, без доспеха, в одной схиме. Бойцы сшиблись копьями, «едва земля не проломилась под ними», и оба упали с коней мёртвыми.'
  - Битва длилась три часа. Передовой полк лёг почти весь, но сломал удар Мамаевой конницы, а из Зелёной дубравы ударил спрятанный Засадный полк. Мамай бежал, а великого князя нашли живым под срубленной берёзой.
