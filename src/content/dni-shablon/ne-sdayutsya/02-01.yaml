  - summary: <b>Ордынский богатырь, по «Сказанию», был «пяти сажен высота его».</b>
    det:
    - 'Из ордынского войска выехал печенег, «видом подобен древнему Голиафу: пяти сажен высота его и трех сажен ширина его». Никто не решался выйти навстречу. Пересвет выступил из рядов полка Владимира Всеволодовича и сказал: «Этот человек ищет подобного себе, я хочу с ним переведаться!»'
    src: 'Источник: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982'
    stranica: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом)
    href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982
    otryvok: '«видом подобен древнему Голиафу: пяти сажен высота его и трех сажен ширина его»'
    pometka: документ
    utverzhden: '2026-11-08'
  - summary: <b>Перед боем Пересвет простился с братом по обители и попросил молитвы у Сергия.</b>
    det:
    - '«Отцы и братья, простите меня, грешного! Брат мой, Андрей Ослябя, моли Бога за меня! Чаду моему Якову — мир и благословение!» Когда он поскакал навстречу врагу, все христиане воскликнули: «Боже, помоги рабу своему!»'
    src: 'Источник: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982'
    stranica: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом)
    href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982
    otryvok: «Брат мой, Андрей Ослябя, моли Бога за меня! Чаду моему Якову — мир и благословение!»
    pometka: документ
    utverzhden: '2026-11-08'
  - summary: '<b>Князь нашёл Пересвета на поле рядом с поверженным врагом: монах победил.</b>'
    det:
    - 'Объезжая поле после победы, Дмитрий увидел Пересвета, а перед ним — поверженного богатыря, «будто гора». Князь сказал: «Видите, братья, зачинателя своего, ибо этот Александр Пересвет, пособник наш, благословенный игуменом Сергием, и победил великого, сильного, злого татарина, от которого испили бы многие люди смертную чашу».'
    src: 'Источник: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982'
    stranica: «Сказание о Мамаевом побоище», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом)
    href: http://lib.pushkinskijdom.ru/Default.aspx?tabid=4982
    otryvok: «этот Александр Пересвет, пособник наш, благословенный игуменом Сергием, и победил великого, сильного, злого татарина»
    pometka: документ
    utverzhden: '2026-11-08'
  - summary: <b>«Лучше нам убитым быть, нежели в плен попасть» — слова Пересвета в «Задонщине».</b>
    det:
    - '«Задонщина» называет его «Пересвет-чернец, брянский боярин» и передаёт его слова великому князю: «Лучше нам убитым быть, нежели в плен попасть к поганым татарам!»'
    src: 'Источник: «Задонщина», Библиотека литературы Древней Руси, т. 6, ИРЛИ РАН (Пушкинский Дом) — http://lib.pushkinskijdom.ru/Default.aspx?tabid=4980'
