  - summary: Литовская рать Ягайла опоздала на день — и бежала, даже не увидев русских
    det:
    - «Но и от тех Бог избавил, ибо не поспели немного к сроку, на один день или меньше. … литовцы с Ягайлом поспешно повернули назад, не будучи никем гонимы. Не видели они тогда ни князя великого, ни рати его, ни оружия его…»
