  udary:
  - summary: <b>Церковь с могилой Пересвета 61 год простояла на территории завода — в 1989 году её вернули верующим.</b>
    det:
    - В 1928 году церковь Рождества Богородицы закрыли, она оказалась на территории завода «Динамо», надгробия уничтожили. 10 июля 1989 года зарегистрировали церковную общину, 16 сентября того же года храм освятили, надгробия восстановили.
    src: 'Источник: «Александр (Пересвет) и Андрей (Ослябя) Радонежские», Православная энциклопедия, т. 1, с. 532–533 — https://www.pravenc.ru/text/64384.html; «Церковь Рождества Пресвятой Богородицы в Старом Симонове», «Храмы России» — http://www.temples.ru/card_texts.php?CardID=6010'
    stranica: «Александр (Пересвет) и Андрей (Ослябя) Радонежские», Православная энциклопедия, т. 1, с. 532–533
    href: https://www.pravenc.ru/text/64384.html
    otryvok: «В 1928 г. церковь была закрыта и оказалась на территории завода «Динамо», надгробия были уничтожены. После открытия храма в 1989 г. надгробия восстановлены»
    pometka: два источника
    utverzhden: '2026-11-08'
  - summary: <b>Посох Пересвета из цельной яблони хранится в Рязанском музее-заповеднике.</b>
    det:
    - Посох высотой 138 см и окружностью 16 см до передачи в музей хранился в алтаре соборной церкви Димитриевского монастыря близ Скопина — в 45 верстах от Куликова поля. Монастырь посвящён Димитрию Солунскому, небесному покровителю князя Дмитрия Донского.
    src: 'Источник: «Александр (Пересвет) и Андрей (Ослябя) Радонежские», Православная энциклопедия, т. 1, с. 532–533 — https://www.pravenc.ru/text/64384.html'
    stranica: «Александр (Пересвет) и Андрей (Ослябя) Радонежские», Православная энциклопедия, т. 1, с. 532–533
    href: https://www.pravenc.ru/text/64384.html
    otryvok: '«Он сделан из цельного яблоневого дерева (в XIX в. посох был урезан; совр. размеры: высота - 138 см, окружность - 16 см)»'
    pometka: один источник
    utverzhden: '2026-11-08'
  - summary: <b>Картину «Поединок Пересвета с Челубеем» Михаил Авилов написал в 1943 году, в разгар войны.</b>
    det:
    - В декабре 1941 года Авилова эвакуировали из блокадного Ленинграда в Узбекистан, осенью 1942-го он перебрался в Москву и там написал холст 327 × 557 см. Картина хранится в Государственном Русском музее, в 1946 году за неё Авилов получил Сталинскую премию первой степени.
    src: 'Источник: «Коренной перелом: 8 деталей картины Михаила Авилова «Поединок Пересвета с Челубеем»», «Вокруг света» — https://www.vokrugsveta.ru/article/320127/; «К 140-летию Михаила Авилова», Российский культурный институт в Вене — http://russischeskulturinstitut.at/ru/gallery/k-140-letiyu-mihaila-avilova'
    stranica: '«Коренной перелом: 8 деталей картины Михаила Авилова «Поединок Пересвета с Челубеем»», «Вокруг света»'
    href: https://www.vokrugsveta.ru/article/320127/
    otryvok: «За эту картину он стал Лауреатом Сталинской премии первой степени в 1946 году»
    pometka: два источника
    utverzhden: '2026-11-08'
  - summary: <b>Авилов одел монаха в кольчугу и шлем — от схимы на картине остался крест поверх кольчуги.</b>
    det:
    - На картине о миссии Пересвета напоминает крест-мощевик поверх кольчуги, голову защищает сфероконический шлем. Так же написан Пересвет и на копии картины 1952 года из Госкаталога. В «Сказании» доспеха на иноке нет — только схима.
    src: 'Источник: «Коренной перелом: 8 деталей картины Михаила Авилова «Поединок Пересвета с Челубеем»», «Вокруг света» — https://www.vokrugsveta.ru/article/320127/'
    stranica: '«Коренной перелом: 8 деталей картины Михаила Авилова «Поединок Пересвета с Челубеем»», «Вокруг света»'
    href: https://www.vokrugsveta.ru/article/320127/
    otryvok: «крест-мощевик поверх кольчуги. Голову воина защищает сфероконический шлем»
    pometka: один источник
    utverzhden: '2026-11-08'
  - summary: <b>Андрей Ослябя, брат Пересвета по Троицкой обители, тоже бился на Куликовом поле.</b>
    det:
    - 'Ослябя был любутским боярином, принял постриг в обители Сергия и пришёл к князю вместе с Пересветом. Перед поединком Пересвет просил его: «Брат мой, Андрей Ослябя, моли Бога за меня!» Обоих иноков почитают вместе, память — 7 сентября.'
