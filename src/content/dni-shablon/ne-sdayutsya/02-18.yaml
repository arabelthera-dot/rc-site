story:
  kicker: Подвиг
  h2: Подольские курсанты
  abzacy:
  - В начале октября 1941 года у Юхнова лётчики нашли колонну немецких танков и мотопехоты длиной 25 километров. Дорога на Москву была открыта. Навстречу подняли курсантов Подольского пехотного и Подольского артиллерийского училищ — три с половиной тысячи почти мальчишек, многим по 18–19 лет. Самые младшие проучились всего две недели.
  - 'Курсанты заняли Ильинский рубеж на Варшавском шоссе под Малоярославцем. Их просили продержаться пять дней — они стояли двенадцать. По двое суток без еды, в рваной обуви, под налётами, с учебными и даже музейными пушками они жгли танки и поднимались в атаку по пять-семь раз за день. Немцы назвали эти бои самыми тяжёлыми за всю русскую кампанию. 17 октября курсанты получили приказ отойти за реку Нару: за эти дни у Москвы успели выстроить оборону.'
