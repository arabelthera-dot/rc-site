vizual:
  imya: podolskie-kursanty-baranov
  vid: predmet
  kicker: Снимок под лупой
  h2: Награды курсанта
  lead: 'Этот снимок хранит музей «Ильинские рубежи» — на том самом рубеже. Приблизь портрет бывшего курсанта Василия Баранова: ордена и медали на его пиджаке.'
audioguide:
  audioSrc: audio-guide-podolskie-kursanty-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от колонны танков через Ильинский рубеж и налёты — к двенадцати дням: пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Колонна
  - t: 22
    mark: 0:22
    title: Музейные пушки
  - t: 44
    mark: 0:44
    title: Оживающий дот
  - t: 66
    mark: '1:06'
    title: Руки есть
  - t: 88
    mark: '1:28'
    title: Двенадцать дней
  transcript:
  - Двести пятьдесят курсантов с одной пушкой вышли навстречу колонне немецких танков длиной двадцать пять километров. Сотни курсантов и десантников не ждали удара — сами атаковали немецкий полк и отбросили к Угре.
  - В бой против танков курсанты взяли музейные пушки времён русско-турецкой войны. Некоторые курсанты проучились всего две недели — и встали против танкового корпуса.
  - 'Немцы прозвали дот курсантов «оживающим»: его разбивали, а он снова открывал огонь. Немецкие танки зашли в тыл под красными флагами — курсанты раскусили обман и разбили колонну за полчаса.'
  - 'В один день немцы четырнадцать раз бомбили рубеж. По двое суток без еды, у шестидесяти процентов рваная обувь — и курсанты держали рубеж. Ослепший от контузии курсант сказал: «Руки-то у меня есть» — и набивал диски пулемётам.'
  - 'Немцы сбрасывали курсантам листовки: «Доблестные красные юнкера, мы уважаем ваш героизм». Немецкое командование назвало бои у Ильинского самыми тяжёлыми за всю русскую кампанию. Курсантов просили продержаться пять дней — они стояли двенадцать.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
