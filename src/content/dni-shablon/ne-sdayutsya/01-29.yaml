story:
  kicker: Среда подвига
  h2: Смута, новый царь и костромская глушь
  abzacy:
    - "Начало 1613 года. Страна выходит из Смуты: десять лет безвластия, самозванцы, польские и литовские отряды по всей земле. В Москве Земский собор избирает на царство юного Михаила Романова. Сам он в это время с матерью в Костроме — рядом с их родовой вотчиной, селом Домнино. По Костромскому уезду ходят «польские и литовские люди», которые ищут нового царя."
    - "Иван Сусанин — крестьянин этой вотчины; в одних источниках он староста села Деревеньки, в других — самого Домнина. <b>Его схватили и пытали, чтобы узнать, где царь. Он знал — и не сказал.</b> Так записано в жалованной грамоте, которую царь Михаил Фёдорович дал 30 ноября 1619 года зятю Сусанина Богдану Собинину:"
    - Леса, болота и отряда, который не вышел из чащи, в грамоте нет. Нет и даты. Всё это появится позже.
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Иван Сусанин — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Сусанина пытали «немерными пытками», но он так и не сказал врагам, где укрылся молодой царь.</b>
        det:
          - "Так записано в единственном документе тех лет — жалованной грамоте царя Михаила Фёдоровича от 30 ноября 1619 года зятю Сусанина Богдану Собинину: «…Иван, ведая про нас… не сказал», и враги замучили его до смерти. За это Собинину дали половину деревни Деревнищи и «обелили» её — освободили от податей — «за службу, за кровь и за терпение» тестя. Грамота написана через шесть лет после гибели."
        src: "Источник: «Подвиг Сусанина…», РИА Новости, 30.03.2007 — https://ria.ru/20070330/62835275.html; А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018 — https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif; Л. А. Поросятковская. «Белопашцы — потомки Сусанина», портал Росархива «Преодоление Смуты» — https://portal.rusarchives.ru/smuta/09-1-belopashcy-statya.shtml"
        stranica: "А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018"
        href: https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif
        otryvok: «…Иван, ведая про нас, великого государя, где мы в те поры были, терпя от тех польских и литовских людей немерные пытки, про нас, великого государя, тем польским и литовским людям, где мы в те поры были, не сказал, и польские и литовские люди замучили его до смерти...»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-29-tretyakov-c2e5f505e09a830779ebe6c1a459ed12.jpg
          alt: "Живопись: крестьянин Иван Сусанин среди польских воинов"
          data_source: https://my.tretyakov.ru/app/masterpiece/91083
          license: общественное достояние (автор умер в 1861 г.)
          podpis: Михаил Скотти. Подвиг Ивана Сусанина (название по прежней подписи сайта; сверить на странице my.tretyakov.ru — страница в этот раз не открывалась).
          credit: Государственная Третьяковская галерея
          width: 1585
          height: 1600
        utverzhden: 2026-11-03
      - summary: <b>Потомки Сусанина почти триста лет не платили царю ни одной подати — до самой Февральской революции.</b>
        det:
          - Грамоты 1619, 1633, 1644 и 1691 годов подтверждали и расширяли льготы, затем их подтвердили Иоанн Антонович 21 сентября 1741 года и Екатерина II 18 декабря 1767 года (тогда белопашцев было 76 душ мужского и 77 женского пола). В ревизских сказках их записывали «для одного токмо счета», не для налогов. Ещё в 1901 году потомок Николай Сабинин судился с воронежской полицией за отказ выдать ему удостоверение личности; льготы отменила только Февральская революция.
        src: "Источник: Л. А. Поросятковская. «Белопашцы — потомки Сусанина», портал Росархива «Преодоление Смуты» — https://portal.rusarchives.ru/smuta/09-1-belopashcy-statya.shtml"
        stranica: Л. А. Поросятковская. «Белопашцы — потомки Сусанина», портал Росархива «Преодоление Смуты»
        href: https://portal.rusarchives.ru/smuta/09-1-belopashcy-statya.shtml
        otryvok: «для одного токмо счета»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-29-goskatalog-75491963.jpg
          alt: Старая фотография села Коробово — деревенские избы
          data_source: https://goskatalog.ru/portal/#/collections?id=59245648
          license: фотография 1878 г., автор неизвестен — общественное достояние по сроку; Госкаталог лицензию не указывает
          podpis: Родина гражданина Ивана Сусанина, село Коробово Костромской губернии. Неизвестный фотограф, 1878 г. Альбуминовый отпечаток на картоне.
          credit: Государственный исторический музей, инв. И VI 45263
          width: 800
          height: 595
        utverzhden: 2026-11-03
      - summary: <b>Потомки Сусанина добились, что воевода, а потом и губернатор не смели въехать к ним без спросу.</b>
        det:
          - Грамота 5 августа 1644 года запретила въезжать в Коробово «воеводам, сыщикам и какому-либо другому официальному лицу» и передала белопашцев в ведение приказа Большого дворца. По указу 1837 года костромской губернатор мог въехать в их селение только с разрешения министра двора, «кроме случаев особенной важности». Коробово род получил грамотой 30 января 1633 года взамен Деревнищ, которые после смерти царицы Марфы (1631) отдали Новоспасскому монастырю.
        src: "Источник: Л. А. Поросятковская. «Белопашцы — потомки Сусанина», портал Росархива «Преодоление Смуты» — https://portal.rusarchives.ru/smuta/09-1-belopashcy-statya.shtml"
        stranica: susanin.kostromka.ru
        href: https://susanin.kostromka.ru/129.php
        otryvok: «вверить главное попечительство над ними министру Двора Нашего, а ближайшее местное наблюдение костромскому гражданскому губернатору, с тем однако же, чтобы он не иначе въезжал в их селение, как всякий раз с разрешения Министра Двора, кроме случаев особенной важности, нетерпящих отлагательства»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-29-goskatalog-75491963.jpg
          alt: Старая фотография села Коробово — деревенские избы
          data_source: https://goskatalog.ru/portal/#/collections?id=59245648
          license: фотография 1878 г., автор неизвестен — общественное достояние по сроку; Госкаталог лицензию не указывает
          podpis: Родина гражданина Ивана Сусанина, село Коробово Костромской губернии. Неизвестный фотограф, 1878 г. Альбуминовый отпечаток на картоне.
          credit: Государственный исторический музей, инв. И VI 45263
          width: 800
          height: 595
        utverzhden: 2026-11-03
      - summary: "<b>«Повторил подвиг Ивана Сусанина» — так Совинформбюро сказало о 83-летнем Матвее Кузьмине: всю ночь водил немцев по лесу и вывел их под огонь наших.</b>"
        det:
          - "Вызвавшись в проводники, житель Куракина успел шепнуть сыну Васе, чтобы тот предупредил наших; 14 февраля 1942 года у деревни Малкино Великолукского района был бой, Кузьмин погиб. Сводка Совинформбюро: Кузьмин «повторил подвиг Ивана Сусанина, выведя батальон 1-й горнострелковой дивизии немцев на засаду наших войск». Сколько немцев убили, источники пишут по-разному: «в одних материалах — 50, в других — 250». 9 мая 1965 года он посмертно стал Героем Советского Союза — самым пожилым Героем той войны. У Бориса Полевого Вася — 11-летний внук, и похороны будто бы с залпами; на деле тело до весны пролежало в ящике во дворе."
        src: "Источник: С. Емельянов. «Потомки 83-летнего Матвея Кузьмина рассказали правду о гибели своего деда-героя», «Родина», 2017, № 1 — https://rodina-history.ru/2017/01/19/potomki-geroia-matveia-kuzmina-rasskazali-pravdu-o-gibeli-svoego-deda.html"
        stranica: С. Емельянов. «Потомки 83-летнего Матвея Кузьмина рассказали правду о гибели своего деда-героя», «Родина», 2017, № 1
        href: https://rodina-history.ru/2017/01/19/potomki-geroia-matveia-kuzmina-rasskazali-pravdu-o-gibeli-svoego-deda.html
        otryvok: «От советского информбюро 83-летний Матвей Кузьмич Кузьмин 14 февраля 1942 года в районе Малкинских высот (несколько километров от Великих Лук) повторил подвиг Ивана Сусанина, выведя батальон 1-й горнострелковой дивизии немцев на засаду наших войск.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>«Подвиг Ивана Сусанина повторил» и 62-летний Иван Иванов: завёл немецкую колонну из 30 машин в овраг, где та завязла в снегу.</b>"
        det:
          - "11 декабря 1941 года немцы заставили колхозника из деревни Лишняги Ивана Петровича Иванова показать путь отступления; за отказ его сильно избили. Он повёл колонну с боеприпасами и продовольствием малохоженой дорогой из Лишняг в Подхожее через глубокий овраг. 30 машин застряли, солдатам пришлось бросить их со всем грузом, а проводника расстреляли. Обелиск на месте гибели — главная достопримечательность Подхожего. Таких «Сусаниных» в войну было много: по официальным данным, в оккупации подвиг Сусанина повторили 17 раз, а журнал «Родина» пишет о более чем ста советских людях."
        src: "Источник: «11 декабря 1941 года — подвиг Ивана Сусанина повторил колхозник Иван Иванов», Культура МГО, «Летопись подвигов» — https://kulturamgo.ru/pomnim-gordimsya/letopis-podvigov/21402-podvig-ivana-susanina-povtoril-kolkhoznik-ivan-ivanov-4; С. Емельянов, «Родина», 2017, № 1 — https://rodina-history.ru/2017/01/19/potomki-geroia-matveia-kuzmina-rasskazali-pravdu-o-gibeli-svoego-deda.html"
        stranica: «11 декабря 1941 года — подвиг Ивана Сусанина повторил колхозник Иван Иванов», Культура МГО, «Летопись подвигов»
        href: https://kulturamgo.ru/pomnim-gordimsya/letopis-podvigov/21402-podvig-ivana-susanina-povtoril-kolkhoznik-ivan-ivanov-4
        otryvok: "«11 декабря 1941 года подвиг Ивана Сусанина повторил колхозник Иван Иванов: завел в глубокий овраг колонну немецкой техники – 30 груженых боеприпасами и продовольствием автомашин»"
        utverzhden: 2026-11-03
      - summary: <b>«Вторым Сусаниным» назвали его земляка Осипа Комиссарова — тот толкнул под руку стрелявшего в Александра II и спас царя.</b>
        det:
          - 4 апреля 1866 года бывший студент Дмитрий Каракозов выхватил револьвер и навёл на царя; 25-летний петербургский шапочный мастер Комиссаров толкнул его. В тот же вечер его принял император, дал Владимирский крест IV степени и потомственное дворянство с фамилией Комиссаров-Костромской. Родом он был из села Молвитина Буйского уезда, и его нарекли негласным званием «второго Сусанина», а костромичи ответили телеграммой, что «дух Сусанина живёт в сердцах костромичей».
        src: "Источник: В. Бурт. «Сусанины», «Столетие», 30.03.2018 — https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm"
        stranica: В. Бурт. «Сусанины», «Столетие», 30.03.2018
        href: https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm
        otryvok: «Ну а спасителем царя стал 25-летний Осип Комиссаров, скромный петербургский шапочный мастер. Интересно, что был он родом из Костромской области, земляком легендарного Ивана Сусанина.»
        utverzhden: 2026-11-03
      - summary: <b>Опера Глинки дописала Сусанину непроходимую чащу, а в 1939 году отправила его спасать уже не царя, а Москву.</b>
        det:
          - "Легенда, что Сусанин нарочно завёл врагов в чащу, появилась в опере «Жизнь за царя» (1836) и ушла в учебники. Новую редакцию предложил дирижёр Самуил Самосуд, либретто написал поэт Сергей Городецкий, действие перенесли в подмосковное село; премьера «Ивана Сусанина» в Большом театре прошла 21 февраля 1939 года, и, по легенде, Алексей Толстой съязвил: «Самосуд над Глинкой». Теплоход «Иван Сусанин» потом переименовали в «Пётр Первый»."
        src: "Источник: А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018 — https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif; Д. Изотов. «„Иван Сусанин“ 1939 года: Большой театр и идеология», belcanto.ru, 28.11.2016 — https://www.belcanto.ru/16112805.html; В. Бурт. «Сусанины», «Столетие», 30.03.2018 — https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm"
        stranica: "А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018"
        href: https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif
        otryvok: «Легенда о том, что Сусанин согласился показать оккупантам местонахождение монарха и намеренно завёл их в непроходимую чащу, появилась в опере Михаила Глинки «Жизнь за царя» (1836) и затем прочно вошла в учебники истории.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-29-goskatalog-41573071.jpg
          alt: "Лубок: Сусанин с шапкой в руке среди поляков с ножами и саблей в зимнем лесу"
          data_source: https://goskatalog.ru/portal/#/collections?id=34945408
          license: общественное достояние (издание 1882 г., автор не указан)
          podpis: "Подвиг Ивана Сусанина. Хромолитография, Москва, 1882. По описанию музея: «В центре Иван Сусанин, фронтально, стоя, с шапкой в руке; вокруг него пятеро поляков, двое их которых замахиваются на него ножом, один саблей; на фоне зимнего леса»."
          credit: Государственный музей истории российской литературы им. В. И. Даля
          width: 400
          height: 317
        utverzhden: 2026-11-03
      - summary: "<b>Историк Николай Костомаров в 1862 году усомнился: а был ли подвиг Сусанина вообще?</b>"
        det:
          - "В феврале 1862 года в «Отечественных записках» он писал, что достоверно лишь одно: Сусанин был «одною из бесчисленных жертв» разбойников Смуты, а льготы зять выпросил, обратившись «к мягкому сердцу старушки, инокини Марфы». Возражение держится на самих грамотах: рядом с царём был и крутой нравом патриарх Филарет, и за ложь о спасении государя мужик поплатился бы головой. Большинство историков в подвиге не сомневаются."
        src: "Источник: К. Кудряшов. «Сусанин без лесов и болот. Почему несомненен подвиг костромского мужика?», АиФ, 30.03.2023 — https://aif.ru/society/history/susanin_bez_lesov_i_bolot_pochemu_nesomnenen_podvig_kostromskogo_muzhika; В. Бурт. «Сусанины», «Столетие», 30.03.2018 — https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm"
        stranica: К. Кудряшов. «Сусанин без лесов и болот. Почему несомненен подвиг костромского мужика?», АиФ, 30.03.2023
        href: https://aif.ru/society/history/susanin_bez_lesov_i_bolot_pochemu_nesomnenen_podvig_kostromskogo_muzhika
        otryvok: «В истории Сусанина достоверно только то, что этот крестьянин был одною из бесчисленных жертв, погибших от разбойников, бродивших по России в Смутное время; действительно ли он погиб за то, что не хотел сказать, где находился новоизбранный царь Михаил Федорович — это остаётся под сомнением»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Указ 1731 года впервые сказал, что Сусанин «отвёл» поляков от Домнина и погиб за болотом.</b>
        det:
          - В указе 19 мая 1731 года Сусанин уже «отвёл» врагов от Домнина и убит в Исупове — соседнем селе через болото; это первое отклонение от текста грамоты. По словам главного хранителя РГАДА Юрия Эскина, широко о Сусанине заговорили после поездки Екатерины II в Кострому в 1767 году, а после войны 1812 года он стал символом единства царя и народа.
        src: "Источник: «Подвиг Сусанина…», РИА Новости, 30.03.2007 — https://ria.ru/20070330/62835275.html; А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018 — https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif"
        stranica: «Подвиг Сусанина…», РИА Новости, 30.03.2007
        href: https://ria.ru/20070330/62835275.html
        otryvok: «Первые отклонения от традиционного описания героических действий Сусанина появляются в XVIII веке, в указе от 19 мая 1731 года. Здесь прежняя версия этой истории подверглась некоторым изменениям, в частности указывается, что Сусанин «отвел» поляков от Домнина и был убит в Исуповке (Исупове), соседнем селе, лежащем через болото от Домнина.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-29-goskatalog-731259.jpg
          alt: Карандашный рисунок села Домнино
          data_source: https://goskatalog.ru/portal/#/collections?id=3910611
          license: НЕ ЯСНЫ — год смерти А. Л. Соколовой не найден. Можно только цитировать с указанием музея (ст. 1274 ГК РФ). Если нужна замена — костромские фонды и pastvu не смотрел, не хватило вызовов
          podpis: Ариадна Соколова. Село Домнино. Рисунок, карандаш, 1944 г.
          credit: Ярославский историко-архитектурный и художественный музей-заповедник, инв. Гр-227
          width: 800
          height: 610
        utverzhden: 2026-11-03
      - summary: "<b>«Третьим Сусаниным» стал алтайский крестьянин Фёдор Гуляев: завёл белых в болото и получил в награду фамилию Сусанин.</b>"
        det:
          - В 1919 году 53-летний Гуляев завёл большой белогвардейский отряд в непроходимое болото и сам сумел скрыться. Его наградили орденом Красного Знамени и дали фамилию Сусанин; он встречался с Лениным и хранил фото Клары Цеткин с надписью «товарищу Сусанину». В те же годы памятник настоящему Сусанину в Костроме снесли как «царский».
        src: "Источник: В. Бурт. «Сусанины», «Столетие», 30.03.2018 — https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm"
        stranica: В. Бурт. «Сусанины», «Столетие», 30.03.2018
        href: https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm
        otryvok: «Сначала появился «третий Сусанин». Им стал 53-летний житель Алтая Федор Гуляев, который в 1919 году завел большой белогвардейский отряд в непроходимое болото. Сам же он сумел скрыться.»
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Александр II особым указом взялся за потомков Сусанина, устроивших в Коробове притоны для беглых.</b>
        det:
          - По указу 23 октября 1859 года, освобождённые от податей и даже от въезда полиции, белопашцы ушли в раскол (секта бегунов) и завели в селе и окрестных лесах притоны для беглецов и бродяг; не помогла даже постройка православной церкви. Нескольких самых виновных переселили с лишением льгот, остальных подчинили наблюдению губернатора. По уставу 1874 года белопашцев стали призывать в армию.
        src: "Источник: Л. А. Поросятковская. «Белопашцы — потомки Сусанина», портал Росархива «Преодоление Смуты» (ПСЗ, 2 собр., т. XXXIV, № 35020) — https://portal.rusarchives.ru/smuta/09-1-belopashcy-statya.shtml"
        stranica: susanin.kostromka.ru
        href: https://susanin.kostromka.ru/129.php
        otryvok: «Бедность белопашцев привела, в конце концов, к довольно печальным обстоятельствам – в Коробове обосновалась секта бегунов.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-29-goskatalog-75491963.jpg
          alt: Старая фотография села Коробово — деревенские избы
          data_source: https://goskatalog.ru/portal/#/collections?id=59245648
          license: фотография 1878 г., автор неизвестен — общественное достояние по сроку; Госкаталог лицензию не указывает
          podpis: Родина гражданина Ивана Сусанина, село Коробово Костромской губернии. Неизвестный фотограф, 1878 г. Альбуминовый отпечаток на картоне.
          credit: Государственный исторический музей, инв. И VI 45263
          width: 800
          height: 595
        utverzhden: 2026-11-03
      - summary: <b>Археологи в 2002–2004 годах нашли у Исупова среди католических крестов один разрубленный православный.</b>
        det:
          - Раскопки на кладбище деревни Исупово шли с 2002 по 2004 год. Предполагаемые останки Сусанина — мужчина 45–50 лет, ростом около 165 см, убит ударом по голове. Убедительной эту идентификацию сочли не все учёные.
        src: "Источник: «Подвиг Сусанина…», РИА Новости, 30.03.2007 — https://ria.ru/20070330/62835275.html; А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018 — https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif"
        stranica: «Подвиг Сусанина…», РИА Новости, 30.03.2007
        href: https://ria.ru/20070330/62835275.html
        otryvok: «В 2002 начались раскопки на территории кладбища деревни Исупово, которые завершились в 2004 году. Среди фрагментов скелетов были найдены католические четырехконечные кресты, и один осьмиконечный православный, сильно изрубленный.»
        utverzhden: 2026-11-03
      - summary: <b>Кострома в 1851 году поставила Сусанину памятник, а советская власть снесла его как царский.</b>
        det:
          - В 1835 году центральную площадь Костромы указом назвали Сусанинской; памятник по проекту Василия Демут-Малиновского, где Сусанин изображён с Михаилом Романовым, открыли в 1851 году и демонтировали после 1917-го, площадь стала площадью Революции (старое имя вернули в 1992 году). Нынешний памятник работы Н. Лавинского стоит с 1967 года. В 1939 году село Молвитино переименовали в Сусанино; в его Воскресенской церкви действует музей.
        src: "Источник: В. Бурт. «Сусанины», «Столетие», 30.03.2018 — https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm; «Подвиг Сусанина…», РИА Новости, 30.03.2007 — https://ria.ru/20070330/62835275.html; «Посёлок Сусанино — старинное село Молвитино», vatravel.ru — https://vatravel.ru/posyolok-susanino/"
        stranica: «Подвиг Сусанина…», РИА Новости, 30.03.2007
        href: https://ria.ru/20070330/62835275.html
        otryvok: «В 1851 году по проекту скульптора В.Демут-Малиновского в Костроме воздвигли монумент, посвященный подвигу Ивана Сусанина.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-29-goskatalog-15330002.jpg
          alt: "Гравюра: колонна с бюстом царя, у подножия — коленопреклонённый Сусанин"
          data_source: https://goskatalog.ru/portal/#/collections?id=16081533
          license: общественное достояние (В. Ф. Тимм умер в 1895 г.)
          podpis: Памятник Царю Михаилу Фёдоровичу и поселянину Ивану Сусанину, открытый в Костроме 14-го марта 1851 года. Лист № 14 (печать, бумага), автор — Василий Тимм, середина XIX века.
          credit: Государственный музей-заповедник Л. Н. Толстого, инв. К-820/50
          width: 800
          height: 562
        utverzhden: 2026-11-03
      - summary: <b>Николай I в 1834 году узнал о бедности потомков Сусанина и дал роду 742 десятины земли.</b>
        det:
          - "Во время приезда императора в Кострому в 1834 году ему доложили, что белопашцы бедствуют. Расследование показало: землю в Коробове делили «по дворянству», и надел раздробился на умножившийся род. Комитет министров Двора, финансов и внутренних дел составил положение (утверждено 27 февраля 1836 года), и 14 марта 1837 года роду отвели из казённых пустошей 742 десятины."
        src: "Источник: Л. А. Поросятковская. «Белопашцы — потомки Сусанина», портал Росархива «Преодоление Смуты» — https://portal.rusarchives.ru/smuta/09-1-belopashcy-statya.shtml"
        stranica: susanin.kostromka.ru
        href: https://susanin.kostromka.ru/129.php
        otryvok: «В главной части грамоты в дополнение к имеющимся у коробовцев 98 десятинам земли им, истинно по-царски, было пожаловано ещё 742 десятины земель из казённых пустошей.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-29-goskatalog-75491963.jpg
          alt: Старая фотография села Коробово — деревенские избы
          data_source: https://goskatalog.ru/portal/#/collections?id=59245648
          license: фотография 1878 г., автор неизвестен — общественное достояние по сроку; Госкаталог лицензию не указывает
          podpis: Родина гражданина Ивана Сусанина, село Коробово Костромской губернии. Неизвестный фотограф, 1878 г. Альбуминовый отпечаток на картоне.
          credit: Государственный исторический музей, инв. И VI 45263
          width: 800
          height: 595
        utverzhden: 2026-11-03
      - summary: <b>Отчество «Осипович» Сусанину приписали позже, а дату его гибели вычислили историки.</b>
        det:
          - "«Сусанин» значит «сын Сусанны» — так на Руси называли вдов, а отчество «Осипович», частое в литературе, RT называет выдумкой. Дата 30 марта 1613 года — расчёт: протоиерей Алексий Домнинский (1794–1871) относил гибель к осени 1612 года, большинство исследователей — ко времени после 3 марта 1613 года, когда Земский собор избрал Михаила на царство. RT называет Сусанина старостой Домнина, а местом рождения считают деревню Деревеньки."
        src: "Источник: А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018 — https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif"
        stranica: "А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018"
        href: https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif
        otryvok: «Сусанин дословно означает сын Сусанны — так на Руси называли вдов. Таким образом, можно сделать вывод, что у крестьянина не было отца, а отчество «Осипович», которое часто упоминается в литературных источниках, является выдумкой.»
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-susanin-ru.mp3
  durationLabel: 1 минута 30 секунд
  lead: "Голос ведёт от зимы 1613 года и царской грамоты через указ 1731 года и оперу Глинки к раскопкам в Исупове и второму Сусанину — Матвею Кузьмину: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Зима тысяча шестьсот тринадцатого
    - t: 16
      mark: 0:16
      title: Что записано в грамоте
    - t: 36
      mark: 0:36
      title: Как рос сюжет
    - t: 54
      mark: 0:54
      title: Спор о подвиге
    - t: 70
      mark: 1:10
      title: Второй Сусанин
  transcript:
    - <p>Страна выходит из Смуты. Земский собор избрал на царство юного Михаила Романова. Он с матерью в Костроме, рядом с родовой вотчиной — селом Домнино. По уезду ходят польские и литовские отряды и ищут нового царя.</p>
    - "<p>Через шесть лет царь дал грамоту зятю Ивана Сусанина. В ней сказано: Сусанина схватили и пытали немерными пытками, требуя сказать, где царь. Он знал — и не сказал. Его замучили до смерти. Ни леса, ни болота в грамоте нет.</p>"
    - <p>В указе тысяча семьсот тридцать первого года Сусанин уже «отвёл» поляков от Домнина и убит в Исупове за болотом. А в опере Глинки «Жизнь за царя», в тысяча восемьсот тридцать шестом, он ведёт врагов в непроходимую чащу. Отсюда история попала в учебники.</p>
    - "<p>Историк Костомаров усомнился, был ли подвиг вообще. Ему возражают грамоты: их четыре, и льготы потомкам подтверждали снова и снова. В две тысячи втором году у Исупова начали раскопки; опознание останков признали не все.</p>"
    - <p>Четырнадцатого февраля сорок второго года под Великими Луками восьмидесятитрёхлетний Матвей Кузьмин всю ночь водил немецкий отряд и на рассвете вывел его под огонь наших. Он погиб. И его историю потом тоже украсили. Ниже — проверь сам, где правда, а где миф.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
