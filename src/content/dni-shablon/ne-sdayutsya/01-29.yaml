      - summary: "«Повторил подвиг Ивана Сусанина» — так Совинформбюро сказало о 83-летнем Матвее Кузьмине: всю ночь водил немцев по лесу и вывел их под огонь наших."
        det:
          - "Вызвавшись в проводники, житель Куракина успел шепнуть сыну Васе, чтобы тот предупредил наших; 14 февраля 1942 года у деревни Малкино Великолукского района был бой, Кузьмин погиб. Сводка Совинформбюро: Кузьмин «повторил подвиг Ивана Сусанина, выведя батальон 1-й горнострелковой дивизии немцев на засаду наших войск». Наши войска уничтожили 50 гитлеровцев. 9 мая 1965 года он посмертно стал Героем Советского Союза — самым пожилым Героем той войны. У Бориса Полевого Вася — 11-летний внук, и похороны с залпами; на деле тело до весны пролежало в ящике во дворе."
        src: "Источник: С. Емельянов. «Потомки 83-летнего Матвея Кузьмина рассказали правду о гибели своего деда-героя», «Родина», 2017, № 1 — https://rodina-history.ru/2017/01/19/potomki-geroia-matveia-kuzmina-rasskazali-pravdu-o-gibeli-svoego-deda.html"
