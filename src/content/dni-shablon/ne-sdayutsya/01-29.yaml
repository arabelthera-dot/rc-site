  ball: 10
  voprosy:
    - q: Какой документ первым рассказывает о подвиге Сусанина?
      o:
        - Летопись 1613 года
        - Жалованная грамота 1619 года его зятю Богдану Собинину
        - Указ 1731 года
        - Либретто оперы Глинки
      a: 1
      e: "Первая — жалованная грамота царя Михаила Фёдоровича от 30 ноября 1619 года зятю Сусанина Богдану Собинину: «за тестя его, Ивана Сусанина, к нам службу и за кровь»."
    - q: Чего нет в грамоте 1619 года?
      o:
        - Что Сусанина пытали
        - Что он не сказал, где царь
        - Что его замучили до смерти
        - Что он завёл отряд в лес и болото
      a: 3
      e: Грамота говорит о пытках, молчании и смерти. Леса, болота и гибели отряда в ней нет — этот сюжет закрепила опера Глинки 1836 года.
    - q: Как называлась опера Михаила Глинки на премьере 1836 года?
      o:
        - «Жизнь за царя»
        - «Иван Сусанин»
        - «Смутное время»
        - «Костромские леса»
      a: 0
      e: Опера вышла под названием «Жизнь за царя». В 1939 году её переименовали в «Иван Сусанин» и переписали либретто.
    - q: У какой деревни в 2002–2004 годах искали останки Сусанина?
      o:
        - Домнино
        - Деревеньки
        - Исупово
        - Куракино
      a: 2
      e: Раскопки шли на старом кладбище у Исупова — соседнего с Домнином села за болотом, где, по указу 1731 года, Сусанин был убит. Опознание останков признали не все учёные.
    - q: Кто повторил подвиг Сусанина в 1942 году под Великими Луками?
      o:
        - Николай Гастелло
        - Матвей Кузьмин
        - Александр Матросов
        - Алексей Маресьев
      a: 1
      e: 83-летний Матвей Кузьмин всю ночь водил немецкий отряд и вывел его под огонь наших у деревни Малкино. Он погиб; в 1965 году стал Героем Советского Союза посмертно.
