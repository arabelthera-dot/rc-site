vizual:
  imya: susanin-lubok
  vid: predmet
  kicker: Лубок под лупой
  h2: Сусанин на лубке Сытина
  lead: 'Лубок 1889 года показывает лес, поляков с саблями и стихи внизу. В грамоте 1619 года леса нет — там сказано, что Сусанина пытали «немерными пытками», а он «не сказал». Приближайте: занесённые сабли, шуба старика и церковь на холме.'
audioguide:
  audioSrc: audio-guide-susanin-ru.mp3
  durationLabel: 1 минута 30 секунд
  lead: "Голос ведёт от 1613 года и царской грамоты через указ 1731 года и оперу Глинки к раскопкам в Исупове и второму Сусанину — Матвею Кузьмину: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Тысяча шестьсот тринадцатый
    - t: 12
      mark: 0:12
      title: Что записано в грамоте
    - t: 30
      mark: 0:30
      title: Как рос сюжет
    - t: 54
      mark: 0:54
      title: Спор о подвиге
    - t: 70
      mark: 1:10
      title: Второй Сусанин
  transcript:
    - "Тысяча шестьсот тринадцатый год, конец Смуты. Иван Сусанин — староста Домнина, вотчины Романовых. Враги ищут молодого, только что избранного царя Михаила. Сусанин знает, где тот укрылся."
    - "Через шесть лет царь дал грамоту зятю Сусанина Богдану Собинину. В ней сказано: Сусанина пытали немерными пытками, он знал — и не сказал. Его замучили до смерти. Зятю дали полдеревни Деревнищи без податей. Ни леса, ни болота в грамоте нет."
    - "В указе тысяча семьсот тридцать первого года Сусанин уже «отвёл» врагов от Домнина и убит в Исупове, за болотом. После войны двенадцатого года он стал символом. А в тридцать девятом году двадцатого века в Большом театре поставили оперу Глинки «Иван Сусанин»."
    - "В тысяча восемьсот шестьдесят втором историк Костомаров усомнился, был ли подвиг вообще. Ему возражают сами грамоты: льготы потомкам держались до Февральской революции. В Исупове нашли предполагаемые останки — мужчину, убитого ударом по голове. Большинство историков в подвиге не сомневаются."
    - "Четырнадцатого февраля сорок второго года у деревни Малкино под Великими Луками восьмидесятитрёхлетний Матвей Кузьмин всю ночь водил немецкий отряд по лесу и вывел его под огонь наших. Он погиб. Совинформбюро сказало: повторил подвиг Ивана Сусанина."
  note: Озвучено синтезом речи.
razdely: []
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Жалованная грамота 1619 года его зятю Богдану Собинину; 2 — Что он завёл отряд в лес и болото; 3 — «Жизнь за царя»; 4 — Исупово; 5 — Матвей Кузьмин."
  ball: 10
  voprosy:
    - q: Какой документ первым рассказывает о подвиге Сусанина?
      o:
        - Летопись 1613 года
        - Жалованная грамота 1619 года его зятю Богдану Собинину
        - Указ 1731 года
        - Либретто оперы Глинки
      a: 1
      e: "Первая — жалованная грамота царя Михаила Фёдоровича от 30 ноября 1619 года зятю Сусанина Богдану Собинину: «за тестя его, Ивана Сусанина, к нам службу и за кровь»."
    - q: Чего нет в грамоте 1619 года?
      o:
        - Что Сусанина пытали
        - Что он не сказал, где царь
        - Что его замучили до смерти
        - Что он завёл отряд в лес и болото
      a: 3
      e: Грамота говорит о пытках, молчании и смерти. Леса, болота и гибели отряда в ней нет — этот сюжет закрепила опера Глинки 1836 года.
    - q: Как называлась опера Михаила Глинки на премьере 1836 года?
      o:
        - «Жизнь за царя»
        - «Иван Сусанин»
        - «Смутное время»
        - «Костромские леса»
      a: 0
      e: Опера вышла под названием «Жизнь за царя». В 1939 году её переименовали в «Иван Сусанин» и переписали либретто.
    - q: У какой деревни в 2002–2004 годах искали останки Сусанина?
      o:
        - Домнино
        - Деревеньки
        - Исупово
        - Куракино
      a: 2
      e: Раскопки шли на старом кладбище у Исупова — соседнего с Домнином села за болотом, где, по указу 1731 года, Сусанин был убит. Опознание останков признали не все учёные.
    - q: Кто повторил подвиг Сусанина в 1942 году под Великими Луками?
      o:
        - Николай Гастелло
        - Матвей Кузьмин
        - Александр Матросов
        - Алексей Маресьев
      a: 1
      e: 83-летний Матвей Кузьмин всю ночь водил немецкий отряд и вывел его под огонь наших у деревни Малкино. Он погиб; в 1965 году стал Героем Советского Союза посмертно.
