      - summary: "«Вторым Сусаниным» назвали его земляка Осипа Комиссарова — тот толкнул под руку стрелявшего в Александра II и спас царя."
        det:
          - 4 апреля 1866 года бывший студент Дмитрий Каракозов выхватил револьвер и навёл на царя; 25-летний петербургский шапочный мастер Комиссаров толкнул его. В тот же вечер его принял император, дал Владимирский крест IV степени и потомственное дворянство с фамилией Комиссаров-Костромской. Родом он был из села Молвитина Буйского уезда, и его нарекли негласным званием «второго Сусанина», а костромичи ответили телеграммой, что «дух Сусанина живёт в сердцах костромичей».
        src: "Источник: В. Бурт. «Сусанины», «Столетие», 30.03.2018 — https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm"
        stranica: В. Бурт. «Сусанины», «Столетие», 30.03.2018
        href: https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm
        otryvok: «дух Сусанина живёт в сердцах костромичей»
        pometka: документ
        utverzhden: 2026-11-03
        istochnik: "stoletie"
        dlya_voprosa: false
        sravnenie: "net"
        id: "f06"
      - summary: "В 1939 году Сусанина вернули в ряд национальных героев — рядом с Невским, Донским, Кутузовым, Мининым и Пожарским."
        det:
          - "После революции церковь на родине героя в Домнине превратили в склад зерна. В конце 1930-х годов крестьянина реабилитировали и возвели в разряд национальных героев вместе с Александром Невским, Дмитрием Донским, Михаилом Кутузовым, Мининым и Пожарским. В 1939 году оперу Глинки под названием «Иван Сусанин» поставили в Большом театре: гремело «Славься!», а в финале народ шёл мимо храма Василия Блаженного встречать Минина и Пожарского."
        src: "Источник: В. Бурт. «Сусанины», «Столетие», 30.03.2018 — https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm; А. Заквасин, Н. Алексеева. «„Терпя немерные пытки“: какова подлинная история подвига Ивана Сусанина», RT, 30.03.2018 — https://russian.rt.com/science/article/498253-susanin-podvig-pravda-mif"
        stranica: В. Бурт. «Сусанины», «Столетие», 30.03.2018
        href: https://www.stoletie.ru/territoriya_istorii/susaniny_550.htm
        otryvok: «Он был возведен в разряд национальных героев вместе с Александром Невским, Дмитрием Донским, Михаилом Кутузовым, Мининым и Пожарским.»
