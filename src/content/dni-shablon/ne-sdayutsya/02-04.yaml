story:
  kicker: Подвиг
  h2: Миноносец «Стерегущий»
  abzacy:
  - '26 февраля 1904 года, Жёлтое море у Порт-Артура. Миноносцы «Решительный» и «Стерегущий» возвращаются из ночной разведки, и путь им отрезают четыре японских миноносца. У японцев 64 орудия, у «Стерегущего» — четыре. В 6 часов 40 минут снаряд разбивает два котла, миноносец теряет ход, но его пушки бьют дальше: в «Акебоно» попадает почти 30 снарядов.'
  - Смертельно раненный командир лейтенант Александр Сергеев приказывает драться до конца и не сдавать корабль. Сигнальщик Кружков с кочегаром Осининым топят секретные книги, привязав к ним железо. Из 49 моряков погибают 45. Японцы заводят буксир и тянут миноносец в море, но через 18 минут трос лопается.
  - 'Из Порт-Артура идут «Новик» и «Баян», на «Новике» — флаг адмирала Макарова. Японский флагман приказывает бросить добычу. «Стерегущий» уходит на дно, врагу достаются только компас и бинокли. Четырёх пленных в Японии встречает письмо министра: «Вы, господа, сражались храбро».'
