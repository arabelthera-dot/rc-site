quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 18; 2 — 64; 3 — «Новик»; 4 — 45; 5 — компас и бинокли.'
  ball: 10
  voprosy:
  - q: Через сколько минут лопнул трос, на котором японцы тащили «Стерегущий»?
    o:
    - '5'
    - '18'
    - '40'
    - '60'
    a: 1
    e: По Афонину, японцы завели буксир в 8 часов 10 минут, а через 18 минут он лопнул.
  - q: Сколько японских орудий било по «Стерегущему», у которого было четыре пушки?
    o:
    - '8'
    - '16'
    - '30'
    - '64'
    a: 3
    e: Четыре японских миноносца — 64 орудия против четырёх.
  - q: На какой корабль перенёс свой флаг адмирал Макаров, чтобы выручать «Стерегущий»?
    o:
    - «Баян»
    - «Новик»
    - «Петропавловск»
    - «Читосе»
    a: 1
    e: 'Медлить было нельзя: Макаров перенёс флаг на лёгкий крейсер «Новик».'
  - q: Сколько моряков из 49 погибли на «Стерегущем»?
    o:
    - '4'
    - '20'
    - '45'
    - '49'
    a: 2
    e: Погибли командир, все офицеры и 45 матросов из 49; уцелели четверо.
  - q: Что японцы унесли со «Стерегущего» как трофеи?
    o:
    - Флаг и пушку
    - Компас и бинокли
    - Секретные книги
    - Ничего
    a: 1
    e: Японцы забрали компас и найденные бинокли, а секретные книги сигнальщик утопил заранее.
