vizual:
  imya: gavrilov-bundin
  vid: dokument
  kicker: Картина под лупой
  h2: Собрание в Восточном форту
  lead: 'Так художник В. Бундин в 1957 году написал бойцов Восточного форта на партийном собрании в каземате. Приближайте: винтовки в руках, тесный круг у стола, кирпичная арка позади.'
audioguide:
  audioSrc: audio-guide-gavrilov-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от ультиматума Восточному форту через конюшню и последний бой — к плену и признанию: пять остановок.'
  stops:
    - t: 0
      mark: '0:00'
      title: Час на ответ
    - t: 22
      mark: '0:22'
      title: «Майор застрелился»
    - t: 44
      mark: '0:44'
      title: Последний бой
    - t: 66
      mark: '1:06'
      title: Плен и тиф
    - t: 88
      mark: '1:28'
      title: Признание
  transcript:
    - 'Двадцать девятое июня тысяча девятьсот сорок первого года, Восточный форт Брестской крепости. Немцы дают защитникам час: выдать майора Гаврилова и сложить оружие. На всю крепость они отводили восемь часов. Форт отвечает: драться до конца.'
    - 'Бумаги нет — заявления в партию бойцы пишут на немецких листовках «сдавайтесь». Форт падает, и немцы записывают: «майор застрелился». А Гаврилов жив. Он ест комбикорм для коней, а ночью пьёт воду из канала.'
    - 'Двадцать третье июля, тридцать второй день войны. Раненый майор зарылся в кучу навоза в конюшне. Под рукой — пять гранат и пистолет. Один против десятков врагов, он принимает последний бой.'
    - 'В плену немецкий генерал говорит при пленных: немецкое командование уважает героизм даже в противнике. Пленные врачи объявляют, что у майора тиф, и немцы перестают к нему ходить.'
    - 'Сослуживцы считали, что Гаврилов погиб в первые минуты войны. А он был последним, кто держал форт. После войны он спас от тифа японских пленных. Ниже — викторина и источники. Спасибо, что были с нами.'
  note: 'Озвучено синтезом речи — временно, до записи голосом автора музея.'
