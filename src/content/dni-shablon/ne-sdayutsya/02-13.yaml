story:
  kicker: Подвиг
  h2: Пётр Гаврилов
  abzacy:
    - '22 июня 1941 года немцы штурмуют Брестскую крепость. По их плану она должна пасть за восемь часов. В Восточном форту оборону держит майор Пётр Гаврилов, командир 44-го стрелкового полка. 29 июня немцы ставят ультиматум: за час выдать Гаврилова и сложить оружие. Форт продолжает бой. Бойцы пишут заявления в партию на обороте немецких листовок «сдавайтесь».'
    - 'Форт падает, и немцы записывают: «майор застрелился». А Гаврилов прячется в конюшне, ест комбикорм для коней, ночью пьёт воду из канала. 23 июля, на тридцать второй день войны, раненый и истощённый, он принимает последний бой из-под кучи навоза: очередь, пять гранат, пистолет. В плену немецкий генерал объявляет: «уважаем героизм даже в противнике». Пленные врачи спасают его, объявив больным тифом. Звезду Героя Советского Союза Гаврилов получает в 1957 году.'
