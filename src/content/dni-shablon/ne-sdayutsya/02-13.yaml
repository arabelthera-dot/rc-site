    udary:
      - id: ns-0213-pyat-procentov
        summary: За первую неделю враг потерял у крепости 5% своих убитых на всём фронте
        det:
          - Немецкие потери убитыми при штурме Брестской крепости за первую неделю войны — пять процентов от всех убитых гитлеровской армии на советско-германском фронте за ту же неделю.
        src: 'Источник: С. С. Смирнов. «Брестская крепость», гл. 34 «Враг свидетельствует» — https://bibliotekar.ru/brest-1941/34.htm'
        stranica: глава книги
        href: 'https://bibliotekar.ru/brest-1941/34.htm'
        otryvok: «…потери врага убитыми при штурме Брестской крепости за первую неделю войны составили 5 процентов от общих потерь гитлеровской армии на всем советско-германском фронте за ту же неделю.»
        pometka: один источник
        utverzhden: '2026-11-14'
        sravnenie: каждый двадцатый убитый немец первой недели — у Бреста
        istochnik: n5
        dlya_voprosa: true
        otvet: 5%
        otvet_edinstvennyj: true
      - id: ns-0213-guderian
        summary: 'Гудериан о защитниках крепости: «эти люди заслуживают величайшего восхищения»'
        det:
          - 'Генерал-полковник Гудериан получает отчёт о боях в Брестской крепости и говорит офицеру связи: эти люди заслуживают величайшего восхищения.'
        src: 'Источник: С. С. Смирнов. «Брестская крепость», гл. 34 «Враг свидетельствует» — https://bibliotekar.ru/brest-1941/34.htm'
        stranica: глава книги
        href: 'https://bibliotekar.ru/brest-1941/34.htm'
        otryvok: '«Когда генерал-полковник Гудериан получил отчет об этих боевых действиях, он сказал майору фон Белову, офицеру связи высшего командования армии при танковой группе: "Эти люди заслуживают величайшего восхищения".»'
        pometka: один источник
        utverzhden: '2026-11-14'
        sravnenie: net
        istochnik: n5
        dlya_voprosa: false
      - id: ns-0213-navoz
        summary: 'Последний бой он начал из-под кучи навоза: очередь, пять гранат, пистолет'
        det:
          - 'Гаврилов натаскивает в угол каземата навоз из конюшни и зарывается в него, оставив щель для наблюдения. Под рукой — пять гранат и пистолеты. Отсюда он и встречает немцев в последнем бою.'
        src: 'Источник: С. С. Смирнов. «Брестская крепость» — майор Гаврилов, часть 2 (warmech.ru) — http://www.warmech.ru/1941war/w-front/br_gavr_2.html'
        stranica: глава книги
        href: 'http://www.warmech.ru/1941war/w-front/br_gavr_2.html'
        otryvok: '«Он зарылся в эту груду навоза и завалил себя снаружи, проделав небольшую щель для наблюдения и положив под рукой оставшиеся пять гранат и два пистолета, каждый с полной обоймой.»'
        pometka: один источник
        utverzhden: '2026-11-14'
        sravnenie: net
        istochnik: n8
        dlya_voprosa: true
        otvet: в куче навоза
        otvet_edinstvennyj: true
      - id: ns-0213-znamya-vedro
        summary: Знамя закопали в форте под ведром. Через 15 лет боец пришёл и сам его откопал
        det:
          - 'В 1941 году Родион Семенюк с товарищами заворачивает знамя дивизиона в брезент, кладёт в два ведра и закапывает в каземате. 27 сентября 1956 года он сам приезжает в крепость, и знамя находят под его руководством.'
        src: 'Источник: С. С. Смирнов. «Брестская крепость», гл. 51 «Знамя» — https://bibliotekar.ru/brest-1941/51.htm'
        stranica: глава книги
        href: 'https://bibliotekar.ru/brest-1941/51.htm'
        otryvok: '«Они завернули его в брезент, положили в брезентовое ведро, взятое из конюшни, а потом поместили еще в цинковое ведро и так закопали в одном из казематов.»'
        pometka: два источника
        utverzhden: '2026-11-14'
        sravnenie: net
        istochnik: n6
        dlya_voprosa: true
        otvet: 15 лет
        otvet_edinstvennyj: true
      - id: ns-0213-kombikorm
        summary: 'Он ел комбикорм для коней, ночью пил из канала, но не сдался'
        det:
          - 'Спрятавшись в конюшне форта, Гаврилов находит комбикорм для коней — смесь зерна, мякины и соломы. Днём он ест его, ночью пьёт воду из канала и ждёт, чтобы уйти в Беловежскую Пущу.'
        src: 'Источник: С. С. Смирнов. «Брестская крепость» — майор Гаврилов, часть 2 (warmech.ru) — http://www.warmech.ru/1941war/w-front/br_gavr_2.html'
        stranica: глава книги
        href: 'http://www.warmech.ru/1941war/w-front/br_gavr_2.html'
        otryvok: '«Дней пять все шло хорошо - он ел комбикорм, а ночью пил воду из канала.»'
        pometka: один источник
        utverzhden: '2026-11-14'
        sravnenie: net
        istochnik: n8
        dlya_voprosa: true
        otvet: комбикорм
        otvet_edinstvennyj: true
