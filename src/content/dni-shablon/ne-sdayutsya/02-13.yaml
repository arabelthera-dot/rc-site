quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — час; 2 — восемь; 3 — 32-й; 4 — на немецких листовках; 5 — тиф.'
  ball: 10
  voprosy:
    - q: 'Ставка до ответа: сколько времени немцы дали форту, чтобы выдать майора Гаврилова?'
      o:
        - Час
        - Сутки
        - Неделю
        - Месяц
      a: 0
      e: 29 июня немцы потребовали в течение часа выдать Гаврилова и его заместителя и сложить оружие.
    - q: За сколько часов немцы рассчитывали взять всю Брестскую крепость?
      o:
        - За два
        - За восемь
        - За сорок
        - За сто
      a: 1
      e: 'Гитлеровские войска рассчитывали за восемь часов полностью овладеть крепостью, а майор Гаврилов воевал 32 дня.'
    - q: На какой день войны Гаврилов принял последний бой?
      o:
        - 2-й
        - 8-й
        - 32-й
        - 100-й
      a: 2
      e: '23 июля 1941 года, на тридцать второй день войны.'
    - q: На чём бойцы писали заявления в партию?
      o:
        - На стене каземата
        - На немецких листовках
        - На бинтах
        - На досках
      a: 1
      e: 'Бумаги не было — писали на обрывках, кусках газет и на обороте немецких листовок, звавших сдаваться в плен.'
    - q: 'Какую болезнь пленные врачи объявили у Гаврилова, чтобы немцы к нему не ходили?'
      o:
        - Тиф
        - Ангину
        - Корь
        - Насморк
      a: 0
      e: 'Врачи заявили, что майор заболел тифом, и перевели его в тифозный барак, куда немцы боялись показываться.'
