quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — В пограничных войсках на границе Ингушетии и Чечни; 2 — Подъехали на машине «скорой помощи» и выскочили из неё; 3 — Днём его девятнадцатилетия; 4 — Это известно со слов матери, и церковная комиссия подтверждений не нашла; 5 — В алтаре храма святителя Николая в Пыжах."
  ball: 10
  voprosy:
    - q: Где служил Евгений Родионов, когда попал в плен?
      o:
        - В морской пехоте
        - В пограничных войсках на границе Ингушетии и Чечни
        - В воздушно-десантных войсках
        - В танковом полку
      a: 1
      e: Евгений служил гранатомётчиком в пограничных войсках; в январе 1996 года его отправили в Назранский пограничный отряд на границе Ингушетии и Чечни.
    - q: Как боевики захватили четырёх пограничников?
      o:
        - Напали на заставу ночью
        - Захватили их в бою у Бамута
        - Заманили их в селение
        - Подъехали на машине «скорой помощи» и выскочили из неё
      a: 3
      e: Пограничники остановили для проверки машину «скорой помощи»; из неё выскочили больше десятка вооружённых «санитаров» в камуфляже.
    - q: Чем был для Евгения день гибели, 23 мая 1996 года?
      o:
        - Днём его девятнадцатилетия
        - Днём присяги
        - Днём, когда его должны были обменять
        - Последним днём службы
      a: 0
      e: Евгений родился 23 мая 1977 года и погиб 23 мая 1996-го — в день, когда ему исполнилось девятнадцать.
    - q: Почему точно не известно, убили ли его именно за отказ снять крест?
      o:
        - Об этом молчат все источники
        - Убийцы отрицали это на суде
        - Это известно со слов матери, и церковная комиссия подтверждений не нашла
        - Тело так и не нашли
      a: 2
      e: Министерство обороны пишет об отказе снять крест, но единственное свидетельство — слова матери; Синодальная комиссия по канонизации в 2002–2003 годах подтверждений не нашла.
    - q: Где сейчас хранится нательный крестик Евгения?
      o:
        - В музее пограничных войск
        - В алтаре храма святителя Николая в Пыжах
        - На кресте над его могилой
        - В школе, где он учился
      a: 1
      e: Мать опознала тело сына по нательному кресту и передала крестик в храм святителя Николая в Пыжах; он хранится в алтаре.
