audioguide:
  audioSrc: audio-guide-rodionov-ru.mp3
  durationLabel: 1 минута 21 секунда
  lead: "Голос ведёт от заставы на чеченской границе через почти сто дней плена — к кресту над могилой в Сатино-Русском: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Застава
    - t: 13
      mark: 0:13
      title: Плен
    - t: 30
      mark: 0:30
      title: Двадцать третье мая
    - t: 46
      mark: 0:46
      title: Что известно точно
    - t: 62
      mark: 1:02
      title: Крест над могилой
  transcript:
    - "В тысяча девятьсот девяносто пятом году Евгения Родионова призвали в пограничные войска. Он служил гранатомётчиком на границе Ингушетии и Чечни, а в январе девяносто шестого его отправили в Назранский пограничный отряд."
    - "В ночь с тринадцатого на четырнадцатое февраля Евгений с тремя товарищами стоял в карауле у селения Галашки. Солдаты остановили машину «скорой помощи», а из неё выскочили больше десятка вооружённых боевиков. Четырёх пограничников увезли в плен."
    - "Почти сто дней спустя, двадцать третьего мая тысяча девятьсот девяносто шестого года, Евгения убили под Бамутом. В этот день ему исполнилось девятнадцать. Мать опознала тело сына по нательному кресту — крест так и остался на нём."
    - "Министерство обороны пишет, что его убили за отказ снять крест и перейти в ислам. Известно это со слов матери: церковная комиссия по канонизации подтверждений не нашла. Посмертно Евгений Родионов награждён орденом Мужества."
    - "Евгения похоронили в деревне Сатино-Русское под Подольском. Над могилой стоит двухметровый крест с надписью: «Здесь лежит русский солдат Евгений Родионов, защищавший Отечество и не отрекшийся от Христа». А нательный крестик мать передала в храм святителя Николая в Пыжах."
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
