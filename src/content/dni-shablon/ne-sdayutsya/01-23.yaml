story:
  kicker: Среда подвига
  h2: Застава на чеченской границе
  abzacy:
    - Евгений Родионов родился 23 мая 1977 года в селе Чибирлей Пензенской области. Отец был столяром и мебельщиком, мать, Любовь Васильевна, — мебельщиком-технологом. Евгений окончил девять классов школы в посёлке Курилово Подольского района под Москвой, работал на мебельной фабрике и учился на шофёра.
    - В 1995 году его призвали в пограничные войска. Учебку он прошёл в Озёрске Калининградской области, служил гранатомётчиком в пограничном отряде на границе Ингушетии и Чечни — шла первая чеченская война. В январе 1996 года его отправили в командировку в Назранский пограничный отряд. <b>Через месяц, в ночь с 13 на 14 февраля, он стоял в карауле у селения Галашки.</b>
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Евгений Родионов — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Родионов не снял нательный крест в плену — и боевики казнили его в день его 19-летия.</b>
        det:
          - Пограничника Евгения Родионова взяли в плен в ночь с 13 на 14 февраля 1996 года. После трёх месяцев пыток его убили в Бамуте 23 мая 1996 года — в день, когда ему исполнилось 19, на праздник Вознесения. Бамут взяли на следующий день. Посмертно он награждён орденом Мужества и орденом «Слава России».
        src: "Источник: Родионов Евгений // История.РФ (РВИО), https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich; Медведева Т. Подвиг и слава Евгения Родионова // «Культура», 2016, https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/"
        stranica: Родионов Евгений // История.РФ (РВИО)
        href: https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich
        otryvok: «Чеченские головорезы убили Евгения Родионова 23 мая 1996 года — в праздник Вознесения Господня, в чеченском селении Бамут.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>По словам главаря боевиков, Родионов дважды пытался бежать из плена.</b>
        det:
          - Об этом матери рассказал сам главарь банды Руслан Хайхороев. 23 мая 1996 года пленных вывели в лес под Бамутом. Во время боёв за Бамут Хайхороев грозил казнить по пять пленных после каждого обстрела.
        src: "Источник: «Лента.ру», 23.05.2026, https://lenta.ru/articles/2026/05/23/rodionov/"
        stranica: «Лента.ру», 23.05.2026
        href: https://lenta.ru/articles/2026/05/23/rodionov/
        otryvok: «Согласно этой версии, боевик сообщил ей, что Родионов дважды пытался бежать из плена.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Родионов мог сменить веру и остаться в живых, но не снял креста — это признал сам его палач.</b>
        det:
          - "Хайхороев сказал это при представителе миссии ОБСЕ: «У солдата был выбор. Он мог сменить веру, но не захотел снять с себя креста». 23 августа 1999 года Хайхороева вместе с телохранителями убили свои — в разборке между чеченскими группировками."
        src: "Источник: «Культура», 2016, https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/; История.РФ (РВИО), https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich"
        stranica: «Культура», 2016
        href: https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/
        otryvok: "«В присутствии представителя миссии ОБСЕ Хайхороев заявлял: «У солдата был выбор. Он мог сменить веру, но не захотел снять с себя креста».»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Мать продала квартиру и одна ушла по воюющей Чечне искать сына.</b>
        det:
          - Любовь Родионова сама вела переговоры с главарями боевиков. Её избил Ширвани, брат Шамиля Басаева, а Хайхороев обещал убить её, если она ещё раз появится в Чечне. За то, чтобы ей показали могилу, требовали выкуп, и квартиру пришлось заложить. Только осенью 1996 года, после Хасавюрта, её привели к тайной могиле, где лежали трое солдат.
        src: "Источник: «Культура», 2016, https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/; «Лента.ру», 23.05.2026, https://lenta.ru/articles/2026/05/23/rodionov/"
        stranica: «Культура», 2016
        href: https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/
        otryvok: «Для того, чтобы поехать в Чечню и разыскать тело сына, она продала квартиру.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Мать узнала обезглавленное тело сына по нательному крестику, который он так и не снял.</b>
        det:
          - Тело выдали без головы, но с крестом на шее. Отец, Александр Константинович, умер через четыре дня после похорон сына.
        src: "Источник: История.РФ (РВИО), https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich; «Культура», 2016, https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/"
        stranica: «Культура», 2016
        href: https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/
        otryvok: «Тело ей отдали — без головы, но с крестом на шее.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Голову сына мать везла домой в поезде в сумке, и проводница ругала её за запах.</b>
        det:
          - За выкуп боевики указали могилу, где мать опознала останки сына по крестику. Голову Евгения выдали ей отдельно. Она положила её в сумку и повезла домой; в поезде из-за сильного запаха от сумки её ругала проводница.
        src: "Источник: «Лента.ру», 23.05.2026, https://lenta.ru/articles/2026/05/23/rodionov/"
        stranica: «Лента.ру», 23.05.2026
        href: https://lenta.ru/articles/2026/05/23/rodionov/
        otryvok: «Любовь Васильевна положила ее в сумку и повезла домой, в поезде из-за сильного запаха от сумки ее ругала проводница.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Ветеран Великой Отечественной снял свою медаль «За отвагу» и положил её на могилу Родионова.</b>
        det:
          - "Ветеран приехал на могилу у деревни Сатино-Русское под Подольском, к церкви Вознесения Христова. Он оставил на могильном камне свою фронтовую награду, а матери сказал: «Он душу России спас!»"
        src: "Источник: История.РФ (РВИО), https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich; «Лента.ру», 23.05.2026, https://lenta.ru/articles/2026/05/23/rodionov/"
        stranica: История.РФ (РВИО)
        href: https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich
        otryvok: «А однажды на могилу Евгения близ деревни Сатино-Русское Подольского района Московской области, возле церкви Вознесения Христова приехал один из ветеранов Великой Отечественной войны.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Масхадов потребовал отдать матери сына, но Хайхороев ответил: «В Бамуте мы хозяева!»</b>"
        det:
          - "Хайхороев отказался подчиняться высокопоставленным главарям сепаратистов. Аслану Масхадову, потребовавшему отдать Родионовой сына, он заявил: «Командуй у себя в Грозном, а в Бамуте мы хозяева!»"
        src: "Источник: «Лента.ру», 23.05.2026, https://lenta.ru/articles/2026/05/23/rodionov/"
        stranica: «Лента.ру», 23.05.2026
        href: https://lenta.ru/articles/2026/05/23/rodionov/
        otryvok: "«Он отказался подчиняться высокопоставленным главарям сепаратистов и заявил Аслану Масхадову, потребовавшему отдать Родионовой сына: «Командуй у себя в Грозном, а в Бамуте мы хозяева!»»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Четверо пограничников стояли на посту без света и связи — боевики подъехали к ним на «скорой».</b>
        det:
          - В ночь с 13 на 14 февраля 1996 года у Галашек из машины «скорой помощи» выскочило больше десятка «санитаров» в камуфляже. Они схватили Родионова, Трусова, Яковлева и Железнова, которые прибыли из Калининградской области всего за месяц до этого. Контрольный пункт стоял в 200 м от заставы, без огневой поддержки. Пленных «связали и бросили в машину как цыплят».
        src: "Источник: «Лента.ру», 23.05.2026, https://lenta.ru/articles/2026/05/23/rodionov/; История.РФ (РВИО), https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich"
        stranica: История.РФ (РВИО)
        href: https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich
        otryvok: «Из подъехавшей машины «Скорой помощи», которую пограничники остановили для проверки, внезапно выскочили «санитары» в камуфляже — более десятка вооруженных до зубов бандитов.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Мать доказала, что сын не дезертир: командование сначала искало всех четверых по домам.</b>"
        det:
          - "Сначала пропавших пограничников заподозрили в том, что они сбежали из части. Их искали по домашним адресам. Мать пошла искать сама и нашла всех четверых: «Я их искала — и я их нашла»."
        src: "Источник: «Культура», 2016, https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/; Православие.Ru, 2016, https://pravoslavie.ru/93541.html"
        stranica: «Культура», 2016
        href: https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/
        otryvok: «Вначале командование даже заподозрило ребят в дезертирстве, их искали по домашним адресам, и только значительно позже пришла достоверная информация о том, что же произошло во время досмотра машины.»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Мать почти 60 раз ездила в «горячие точки» и возила солдатам продукты и тёплые вещи.</b>
        det:
          - "После похорон сына Любовь Родионова сделала около 60 таких поездок: «Я в каждом из солдат видела черты сына». Она помогала и другим матерям искать пропавших сыновей."
        src: "Источник: Беседа с Л. В. Родионовой // Православие.Ru, 2016, https://pravoslavie.ru/93541.html; «Лента.ру», 23.05.2026, https://lenta.ru/articles/2026/05/23/rodionov/"
        stranica: Беседа с Л. В. Родионовой // Православие.Ru, 2016
        href: https://pravoslavie.ru/93541.html
        otryvok: «Всего вы совершили около 60 командировок в «горячие точки».»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Крестик Родионова, который сняли с его тела, побывал у бойцов в Сирии, на Донбассе и в Крыму.</b>
        det:
          - Сначала мать передала крестик в храм святителя Николая в Пыжах, и его хранили в алтаре. Выносили его только по воскресеньям. Когда к нему стали приезжать люди с войны, мать забрала крестик, чтобы бойцы могли приложиться к нему сразу.
        src: "Источник: Беседа с Л. В. Родионовой // Православие.Ru, 2016, https://pravoslavie.ru/93541.html; История.РФ (РВИО), https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich"
        stranica: Беседа с Л. В. Родионовой // Православие.Ru, 2016
        href: https://pravoslavie.ru/93541.html
        otryvok: «Крестик был в Сирии, на Донбассе, в Крыму, в госпиталях.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>На могиле Родионова стоит двухметровый крест: «не отрекшийся от Христа».</b>"
        det:
          - "Полная надпись: «Здесь лежит русский солдат Евгений Родионов, защищавший Отечество и не отрекшийся от Христа, казнённый под Бамутом 23 мая 1996 года». У могилы растут четыре кипариса — по числу четверых пленных пограничников. Жители Бамута ухаживают за крестом на месте казни."
        src: "Источник: Пограничная служба ФСБ России, Центральный пограничный музей, http://ps.fsb.ru/fps/history/museum/ekspozitsiya/eksponaty.htm; Православие.Ru, 2016, https://pravoslavie.ru/93541.html; «Культура», 2016, https://portal-kultura.ru/articles/history/134451-podvig-i-slava-evgeniya-rodionova/"
        stranica: history.ru
        href: https://history.ru/read/biographies/rodionov-ievghienii-alieksandrovich
        otryvok: «Сейчас на его могиле, благодаря пожертвованиям, установлен двухметровый крест, горит лампадка, — и сюда идут, и идут люди.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Десантники в 2012 году встали почётным караулом у могилы пограничника Родионова.</b>
        det:
          - 23 мая 2012 года, в годовщину гибели, на могиле в Сатино-Русском прошли панихида и возложение венков. Панихиду отслужил главный священник ВДВ протоиерей Михаил Васильев, а по распоряжению командующего ВДВ для воинских почестей выделили взвод почётного караула.
        src: "Источник: Десантники почтили память воина-мученика Евгения Родионова // Министерство обороны РФ, 23.05.2012, https://old.mil.ru/ec/info/more.htm?id=11141928@egNews"
        stranica: Десантники почтили память воина-мученика Евгения Родионова // Министерство обороны РФ, 23.05.2012
        href: https://old.mil.ru/ec/info/more.htm?id=11141928@egNews
        otryvok: «Панихиду отслужил главный священник Воздушно-десантных войск (ВДВ) протоиерей Михаил Васильев.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Церковь не причислила Родионова к святым, но вокруг него возник культ — с иконами и крестами.</b>
        det:
          - "Синодальная комиссия по канонизации отказалась причислить Родионова к лику святых: историю его гибели знают лишь со слов матери, которая виделась с Хайхороевым не более семи минут и «честно призналась, что доказать ничего нельзя». В ноябре 2002 года в одном из храмов Горного Алтая, по словам очевидцев, замироточила икона с изображением Родионова. На трассе М4 «Дон» у реки Осётр стоят поклонный крест и мемориал «Воину Евгению»."
