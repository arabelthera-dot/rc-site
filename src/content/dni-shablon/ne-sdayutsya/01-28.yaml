vizual:
  imya: gromova-etyud
  vid: predmet
  kicker: Этюд под лупой
  h2: Ульяна Громова на этюде Ильина
  lead: 'В 1948 году Евгений Ильин писал этот этюд к картине «Клятва краснодонцев». Ульяна Громова сказала следователю: «Жалею только об одном, что мало мы успели сделать». Приближайте: поднятый взгляд и грубая ткань холста под краской.'
audioguide:
  audioSrc: audio-guide-molodaya-gvardiya-ru.mp3
  durationLabel: около трёх минут
  lead: "Голос ведёт по судьбе «Молодой гвардии»: от Третьякевича на краю шурфа через флаги, сожжённую биржу и молчание под пытками к звёздам Героев и запоздалой правде."
  stops:
    - t: 0
      mark: '0:00'
      title: На краю шурфа
    - t: 31
      mark: '0:31'
      title: Наши подходят
    - t: 61
      mark: '1:01'
      title: Восемь красных флагов
    - t: 93
      mark: '1:33'
      title: Струсил и донёс
    - t: 123
      mark: '2:03'
      title: Бежать от девятерых
  transcript:
    - "Пятнадцатого января тысяча девятьсот сорок третьего года первую группу молодогвардейцев повезли на казнь к шахте номер пять. Виктор Третьякевич, которого пытали особенно жестоко, но так и не заставили говорить, на краю пятидесятиметрового шурфа вцепился в шею заместителю начальника полиции и потянул его за собой вниз. Тот «побледнел от страха и почти не сопротивлялся». Полицая спас подбежавший жандарм: он ударил Виктора пистолетом по голове. Потом полиция пустила слух, что всех выдал именно Третьякевич."
    - "Почти семнадцать лет Третьякевич носил клеймо предателя, его фамилии не было на обелиске над братской могилой. Пойманный через шестнадцать лет полицай Василий Подтынный показал: Третьякевича оклеветали. Мать так и не сняла чёрного платья. Молчали и другие. Радистка Любовь Шевцова месяц не выдавала под пытками ни шифров, ни места рации, и последними её словами были: «Наши подходят». Ульяна Громова ответила следователю: «Жалею только об одном, что мало мы успели сделать»."
    - "Двадцатого июля тысяча девятьсот сорок второго года Краснодон заняли немцы, и Сергей Тюленин начал войну с оккупантами в одиночку. Он же дал подполью имя «Молодая гвардия». Каждый, кто вступал, клялся «мстить беспощадно». В ночь на седьмое ноября над Краснодоном появились восемь красных флагов, и люди говорили: «О нас помнят, мы нашими не забыты!» Ночью пятого декабря подпольщики сожгли биржу труда со списками и спасли от угона в Германию около двух с половиной тысяч человек."
    - Первого января тысяча девятьсот сорок третьего года арестовали Евгения Мошкова, Виктора Третьякевича и Ивана Земнухова. Штаб приказал всем немедленно уйти из города. Геннадий Почепцов, узнав об арестах, струсил и сам написал заявление в полицию. Начались массовые аресты, многие не ушли, боясь за родителей, и скрыться удалось лишь двенадцати. Казнили ночью пятнадцатого, шестнадцатого и тридцать первого января у шурфа шахты номер пять. После освобождения Краснодона оттуда подняли семьдесят одно тело.
    - "Тридцать первого января к шурфу везли Анатолия Ковалёва, руки связаны телефонным проводом, конвой — девять полицаев. Он шепнул Мише Григорьеву: «Миша, давай бежать!», ослабил провод и рванулся, пуля попала в левую руку. Он ушёл из города и пропал без вести. Тринадцатого сентября тысяча девятьсот сорок третьего года звание Героя Советского Союза посмертно получили Ульяна Громова, Иван Земнухов, Олег Кошевой, Сергей Тюленин и Любовь Шевцова. Командиру Ивану Туркеничу его присвоили только в тысяча девятьсот девяностом году."
  note: Озвучено синтезом речи.
