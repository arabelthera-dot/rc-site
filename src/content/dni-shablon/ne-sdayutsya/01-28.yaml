audioguide:
  audioSrc: audio-guide-molodaya-gvardiya-ru.mp3
  durationLabel: 1 минута 25 секунд
  lead: "Голос ведёт от оккупированного Краснодона через клятву, флаги и сожжённую биржу к январским арестам и шурфу шахты № 5: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Город под оккупацией
    - t: 17
      mark: 0:17
      title: Клятва
    - t: 31
      mark: 0:31
      title: Флаги и биржа
    - t: 45
      mark: 0:45
      title: Выдал свой
    - t: 67
      mark: 1:07
      title: Шурф шахты номер пять
  transcript:
    - <p>Двадцатого июля сорок второго года немцы заняли шахтёрский Краснодон. Комендантский час, сдача оружия и радиоприёмников, принудительная работа на шахтах. Тридцатого сентября вчерашние школьники объединились в подпольную «Молодую гвардию».</p>
    - "<p>Каждый, кто вступал, давал клятву, составленную Иваном Земнуховым: мстить беспощадно за сожжённые города и сёла, за смерть тридцати двух шахтёров. Самому младшему, Радию Юркину, было четырнадцать.</p>"
    - <p>В ночь на седьмое ноября над Краснодоном и посёлками поднялись восемь красных флагов. В ночь на шестое декабря сгорела биржа труда со списками для угона в Германию — около двух с половиной тысяч юношей и девушек остались дома.</p>
    - <p>Первого января сорок третьего года арестовали троих. Геннадий Почепцов, узнав об этом, испугался и сам написал в полицию. Начались аресты. Арестованных жестоко пытали. Полиция пустила слух, что всех выдал Виктор Третьякевич, — его оправдали только в шестидесятом году.</p>
    - "<p>Ночью пятнадцатого, шестнадцатого и тридцать первого января их казнили у шурфа шахты номер пять. Пятерых расстреляли девятого февраля под Ровеньками. Ниже — карточка каждого из семидесяти одного: сколько лет, какая школа, что делал в подполье.</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
