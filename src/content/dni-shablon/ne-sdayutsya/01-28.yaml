story:
  kicker: Среда подвига
  h2: Шахтёрский город под оккупацией
  abzacy:
    - Краснодон стал городом только в 1938 году — из казачьего хутора вырос посёлок угольных шахт. 20 июля 1942 года его заняли немцы. Появились приказы о комендантском часе, о сдаче оружия и радиоприёмников, о регистрации всех, кто может работать; жителей заставили добывать уголь для немецкой армии. Главным карательным органом стала жандармерия.
    - "30 сентября 1942 года руководители разрозненных молодёжных групп объединились в подпольную комсомольскую организацию «Молодая гвардия». <b>Многие из них едва успели окончить школу; самому младшему, Радию Юркину, было четырнадцать.</b> Каждый, кто вступал, давал клятву, составленную Иваном Земнуховым: «…Клянусь мстить беспощадно за сожжённые и разорённые города и сёла. За смерть 32-х шахтёров-героев»."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: «Молодая гвардия» — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Сергей Тюленин начал войну с оккупантами в одиночку и дал подполью имя «Молодая гвардия».</b>
        det:
          - 20 июля 1942 года Краснодон заняли немцы. Почти сразу запылала новая баня, готовая под немецкие казармы, — это начал Тюленин; листовки он писал на обрывках газет. Днём рождения организации стало 30 сентября, когда разрозненные группы объединились; название, предложенное Тюлениным, приняли единогласно.
        src: "Источник: Наука и жизнь, 2003, № 1 — https://www.nkj.ru/archive/articles/2464/"
        stranica: Наука и жизнь, 2003, № 1
        href: https://www.nkj.ru/archive/articles/2464/
        otryvok: «И почти сразу же в городе появились первые листовки, запылала новая баня, уже готовая под немецкие казармы. Это начал действовать Сережка Тюленин. Один.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Виктор Третьякевич на краю шурфа схватил заместителя начальника полиции и потянул за собой вниз.</b>
        det:
          - "15 января 1943 года первую группу молодогвардейцев повезли на казнь к шахте № 5. Третьякевич, которого пытали особенно жестоко, но так и не заставили говорить, на краю 50-метрового шурфа вцепился палачу в шею; тот «побледнел от страха и почти не сопротивлялся». Полицая спас подбежавший жандарм: он ударил Виктора пистолетом по голове."
        src: "Источник: А. Дружинина. «Молодая гвардия» — некоторые факты // Наука и жизнь, 2003, № 1 — https://www.nkj.ru/archive/articles/2464/"
        stranica: А. Дружинина. «Молодая гвардия» — некоторые факты // Наука и жизнь, 2003, № 1
        href: https://www.nkj.ru/archive/articles/2464/
        otryvok: «побледнел от страха и почти не сопротивлялся»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Анатолий Ковалёв ослабил провод на руках по дороге к шурфу и бежал от девяти пьяных полицаев.</b>
        det:
          - "Ковалёва арестовали 28 января 1943 года; в камере он, несмотря на пытки, делал гимнастику, как Котовский. 31 января его и товарищей везли к шахте № 5, руки связаны телефонным проводом, конвой — девять полицаев. Он шепнул Мише Григорьеву: «Миша, давай бежать!», ослабил провод и рванулся; пуля попала в левую руку. Несколько дней скрывался, потом ушёл из города и пропал без вести."
        src: "Источник: molodguard.ru, «А. В. Ковалёв» — https://molodguard.ru/guardian34.htm"
        stranica: molodguard.ru, «А. В. Ковалёв»
        href: https://molodguard.ru/guardian34.htm
        otryvok: «Миша, давай бежать!»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Ульяна Громова ответила следователю: «Жалею только об одном, что мало мы успели сделать».</b>"
        det:
          - "Следователь Черенков спросил, почему она держится так вызывающе. Громова: «Не для того я вступила в организацию, чтобы потом просить у вас прощения». В камере она читала товарищам лермонтовского «Демона», а перед казнью гвоздём нацарапала на стене прощание: «Прощайте, папа. Прощайте, мама… Крепче за родину стой»."
        src: "Источник: molodguard.ru, «Ульяна Громова» — https://molodguard.ru/guardian3.htm"
        stranica: molodguard.ru, «Ульяна Громова»
        href: https://molodguard.ru/guardian3.htm
        otryvok: «Не для того я вступила в организацию, чтобы потом просить у вас прощения»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Сергей Тюленин раненым бежал из плена домой, но соседка выведала у малыша, где он прячется.</b>
        det:
          - "В январе 1943 года Тюленин перешёл линию фронта, воевал с армейской разведкой под Каменском, был ранен в правое предплечье. Попал в плен, бежал и вернулся в Краснодон. 27 января соседка, приставленная следить за квартирой, спросила полуторагодовалого племянника Валерия: «Где дядя?» — ребёнок показал на дверь; вскоре Сергея арестовали."
        src: "Источник: molodguard.ru, «Сергей Тюленин» — https://molodguard.ru/guardian4.htm"
        stranica: molodguard.ru, «Сергей Тюленин»
        href: https://molodguard.ru/guardian4.htm
        otryvok: «При выполнении задания он был ранен в правое предплечье.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Подпольщики сожгли биржу труда со списками и спасли от угона в Германию около двух с половиной тысяч человек.</b>
        det:
          - Биржу подожгли ночью 5 декабря 1942 года Сергей Тюленин, Любовь Шевцова и Виктор Лукьянченко. К началу декабря у молодогвардейцев на складе было 15 автоматов, 80 винтовок, 300 гранат, около 15 тысяч патронов, 10 пистолетов и 65 килограммов взрывчатки. Они освобождали военнопленных и отбили у немцев стадо в 500 голов, разогнав его по хуторам.
        src: "Источник: Наука и жизнь, 2003, № 1 — https://www.nkj.ru/archive/articles/2464/; molodguard.ru, «Сергей Тюленин» — https://molodguard.ru/guardian4.htm"
        stranica: Наука и жизнь, 2003, № 1
        href: https://www.nkj.ru/archive/articles/2464/
        otryvok: «Ночью сожгли немецкую Биржу труда — и две с половиной тысячи краснодонцев были избавлены от немецкой каторги.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Молодогвардейцы молчали под пытками, а выдал их Геннадий Почепцов — струсил и сам донёс в полицию.</b>
        det:
          - 1 января 1943 года арестовали Евгения Мошкова, Виктора Третьякевича и Ивана Земнухова. Штаб приказал всем немедленно уйти из города. Почепцов из группы посёлка Первомайка, узнав об арестах, струсил и сам написал заявление в полицию. Начались массовые аресты; многие не ушли, боясь за родителей, скрыться удалось лишь двенадцати.
        src: "Источник: Наука и жизнь, 2003, № 1 — https://www.nkj.ru/archive/articles/2464/"
        stranica: Наука и жизнь, 2003, № 1
        href: https://www.nkj.ru/archive/articles/2464/
        otryvok: «Геннадий Почепцов, узнав об арестах, струсил и написал заявление в полицию о существовании подпольной организации.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: "<b>Виктор Третьякевич почти 17 лет носил клеймо предателя, пока палач Подтынный не признал: он молчал.</b>"
        det:
          - "Полиция пустила слух, что всех выдал Третьякевич; его фамилии не было на обелиске над братской могилой. Пойманный через 16 лет полицай Василий Подтынный показал: Третьякевича оклеветали. Указом от 13 декабря 1960 года Виктор реабилитирован и посмертно награждён орденом Отечественной войны I степени; мать так и не сняла чёрного платья."
        src: "Источник: Наука и жизнь, 2003, № 1 — https://www.nkj.ru/archive/articles/2464/"
        stranica: Наука и жизнь, 2003, № 1
        href: https://www.nkj.ru/archive/articles/2464/
        otryvok: "«Через 16 лет удалось арестовать одного из самых свирепых палачей, пытавших молодогвардейцев, — Василия Подтынного. На следствии он заявил: Третьякевича оклеветали, но он, несмотря на жестокие пытки и побои, никого не выдал. Так почти через 17 лет истина восторжествовала.»"
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: "<b>Радистка Любовь Шевцова месяц молчала под пытками и последними её словами были: «Наши подходят».</b>"
        det:
          - Шевцова окончила школу подготовки партизан и подпольщиков по специальности радистки; контрразведка пытками добивалась от неё шифров и места рации. Арестована 8 января 1943 года, ничего не сказала. 9 февраля в Гремучем лесу под Ровеньками её расстреляли вместе с Олегом Кошевым, Дмитрием Огурцовым, Семёном Остапенко и Виктором Субботиным.
        src: "Источник: molodguard.ru, «Любовь Шевцова» — https://molodguard.ru/guardian5.htm"
        stranica: molodguard.ru, «Любовь Шевцова»
        href: https://molodguard.ru/guardian5.htm
        otryvok: «Гитлеровцы более месяца издевались над девушкой.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Молодогвардейцы в ночь на 7 ноября 1942 года вывесили над Краснодоном восемь красных флагов.</b>
        det:
          - "Люди, увидев флаги, говорили: «О нас помнят, мы нашими не забыты!» Почти всё делалось ночью, хотя за появление на улице после шести вечера грозил расстрел. За всё время подпольщики выпустили около 30 листовок общим тиражом почти пять тысяч экземпляров."
        src: "Источник: Музей Победы, электронная выставка «Молодая гвардия» — https://victorymuseum.ru/electronic-exhibitions/molodaja-gvardija/; Наука и жизнь, 2003, № 1 — https://www.nkj.ru/archive/articles/2464/"
        stranica: Музей Победы, электронная выставка «Молодая гвардия»
        href: https://victorymuseum.ru/electronic-exhibitions/molodaja-gvardija/
        otryvok: «О нас помнят, мы нашими не забыты!»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Молодогвардейцы не сломались и у шурфа глубиной 53 метра, куда многих сбрасывали живыми.</b>
        det:
          - "Казнили ночью 15, 16 и 31 января 1943 года у шурфа шахты № 5. Начальник жандармского поста Отто Шен показал: «Во время допросов все без исключения молодогвардейцы подвергались всяческим пыткам». Чтобы не было слышно криков, в полиции заводили патефон. После освобождения Краснодона из шурфа подняли 71 тело."
        src: "Источник: Музей Победы — https://victorymuseum.ru/electronic-exhibitions/molodaja-gvardija/; патефон и «сбрасывали живыми» — Наука и жизнь, 2003, № 1 — https://www.nkj.ru/archive/articles/2464/"
        stranica: Музей Победы
        href: https://victorymuseum.ru/electronic-exhibitions/molodaja-gvardija/
        otryvok: «Во время допросов все без исключения молодогвардейцы подвергались всяческим пыткам»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Олег Кошевой пытался уйти за линию фронта и был схвачен у станции Картушино с печатью организации.</b>
        det:
          - С Ниной и Ольгой Иванцовыми, Валерией Борц и Сергеем Тюлениным Кошевой пробовал перейти фронт, но не смог и 11 января вернулся в Краснодон, а наутро снова ушёл. В последних числах января его задержали у Ровеньков; при обыске нашли печать «Молодой гвардии» и чистые бланки комсомольских билетов. После пыток расстрелян 9 февраля в Гремучем лесу.
        src: "Источник: molodguard.ru, «Олег Кошевой» — https://molodguard.ru/guardian1.htm"
        stranica: molodguard.ru, «Олег Кошевой»
        href: https://molodguard.ru/guardian1.htm
        otryvok: «Кошевой был задержан в последних числах января 1943 года вблизи железнодорожной станции Картушино, в 6-7 километрах от г. Ровеньки»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Командир «Молодой гвардии» Иван Туркенич ушёл в армию мстить и погиб в 1944 году в Польше.</b>
        det:
          - Туркенич уцелел при разгроме подполья и воевал в 99-й стрелковой дивизии. 13 августа 1944 года в бою на подступах к реке Вислока капитан Туркенич был смертельно ранен; похоронен в Жешуве. Звание Героя Советского Союза ему присвоили только 5 мая 1990 года.
        src: "Источник: molodguard.ru, «Иван Туркенич» — https://molodguard.ru/guardian7.htm"
        stranica: molodguard.ru, «Иван Туркенич»
        href: https://molodguard.ru/guardian7.htm
        otryvok: «Над могилой павших товарищей он поклялся мстить»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Пятерым молодогвардейцам звание Героя присвоили уже 13 сентября 1943 года — посмертно.</b>
        det:
