quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — 30 сентября 1942 года; 2 — Биржу труда со списками для угона в Германию; 3 — Геннадий Почепцов из группы Первомайки сам написал заявление в полицию; 4 — У шурфа шахты № 5; 5 — Четырнадцать."
  ball: 10
  voprosy:
    - q: Когда в Краснодоне была создана «Молодая гвардия»?
      o:
        - 22 июня 1941 года
        - 20 июля 1942 года
        - 30 сентября 1942 года
        - 14 февраля 1943 года
      a: 2
      e: Краснодон заняли 20 июля 1942 года, а 30 сентября руководители молодёжных групп объединились в подпольную комсомольскую организацию «Молодая гвардия». 14 февраля 1943 года город освободили.
    - q: Что подпольщики подожгли в ночь на 6 декабря 1942 года?
      o:
        - Здание жандармерии
        - Биржу труда со списками для угона в Германию
        - Склад с боеприпасами
        - Клуб имени Горького
      a: 1
      e: Сгорела немецкая биржа труда, где хранились списки людей для угона в Германию. От отправки спаслись около двух с половиной тысяч юношей и девушек.
    - q: Как полиция узнала о подпольной организации?
      o:
        - Её выдал под пытками Виктор Третьякевич
        - Нашли спрятанное оружие
        - Перехватили радиопередачу
        - Геннадий Почепцов из группы Первомайки сам написал заявление в полицию
      a: 3
      e: "Узнав об арестах 1 января 1943 года, Почепцов струсил и написал заявление в полицию. Третьякевича оклеветали: он никого не выдал и в 1960 году реабилитирован."
    - q: Где казнили большинство арестованных молодогвардейцев?
      o:
        - У шурфа шахты № 5
        - В Гремучем лесу
        - На городской площади
        - В концлагере в Германии
      a: 0
      e: Ночью 15, 16 и 31 января 1943 года арестованных казнили у 53-метрового шурфа шахты № 5. Пятерых расстреляли 9 февраля в Гремучем лесу под Ровеньками.
    - q: Сколько лет было самому младшему участнику «Молодой гвардии» — Радию Юркину?
      o:
        - Двенадцать
        - Четырнадцать
        - Шестнадцать
        - Восемнадцать
      a: 1
      e: Радию Юркину было четырнадцать. Он ушёл от ареста, после войны служил на флоте. Четверым из погибших было по пятнадцать лет.
