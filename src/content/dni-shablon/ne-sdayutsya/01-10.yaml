story:
  kicker: Команда
  h2: 570 человек на одном крейсере
  abzacy:
    - На «Варяге» служили 570 человек, на «Корейце» — 174. Матросы из деревень и губернских городов, механики, кочегары, судовые врачи. <b>Большинство из них видели бой впервые.</b>
    - Бой длился около часа. Одним из первых погиб дальномерный офицер мичман граф Алексей Нирод. Ранен был и командир. Раненых перевязывали прямо на палубе, пожары тушили под огнём. <b>Крейсер выпустил 1105 снарядов.</b>
    - "Весной 1904 года моряков встречала вся страна: в Одессе — с оркестрами, в Петербурге — парадом. Их приняли как победителей, хотя корабль они потеряли. <b>Страна чествовала не победу, а отказ сдаться.</b>"
    - "По честному слову офицеров экипажи больше не участвовали в войне: иначе японцы не отпустили бы их на иностранные корабли. Моряков привезли домой через нейтральные порты. В 1954 году, к пятидесятилетию боя, пятнадцать доживших ветеранов получили медаль «За отвагу»."
    - «Коммерсантъ», 09.02.2024; ВИЖ, 2019, № 10.
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Крейсер «Варяг» — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>«Врагу не сдаётся наш гордый „Варяг“» — эту строку первым написал австриец, восхищённый русскими моряками.</b>
        det:
          - "Австрийский поэт Рудольф Грейнц был так вдохновлён подвигом экипажей «Варяга» и «Корейца», что написал стихотворение «Der Warjag». Его напечатал немецкий журнал «Jugend». Поэтесса Евгения Студенская почти дословно перевела стихи на русский, а военный музыкант Алексей Турищев положил их на музыку. Получилась песня «Памяти „Варяга“». Впервые она прозвучала на торжественном приёме у Николая II в честь вернувшихся на Родину экипажей: «Наверх, о товарищи, все по местам! / Последний парад наступает! / Врагу не сдаётся наш гордый „Варяг“, / Пощады никто не желает!» Песня стала неофициальным гимном русских моряков."
        src: 'Источник: «Врагу не сдаётся наш гордый "Варяг"…», «Родина», 31.10.2024 — https://rodina-history.ru/2024/10/31/vragu-ne-sdaetsia-nash-gordyj-variag-125-let-nazad-na-vodu-spushchen-legendarnyj-krejser.html'
        stranica: Врагу не сдаётся наш гордый "Варяг"…, «Родина», 31.10.2024
        href: https://rodina-history.ru/2024/10/31/vragu-ne-sdaetsia-nash-gordyj-variag-125-let-nazad-na-vodu-spushchen-legendarnyj-krejser.html
        otryvok: «Наверх, о товарищи, все по местам! / Последний парад наступает! / Врагу не сдаётся наш гордый „Варяг“, / Пощады никто не желает!»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Руднев вывел два корабля из нейтрального порта навстречу шести японским крейсерам.</b>
        det:
          - Утром 27 января (9 февраля) 1904 года контр-адмирал Уриу потребовал покинуть рейд Чемульпо до полудня, иначе обещал атаковать прямо в порту. За островом Пхамильдо ждали шесть крейсеров и три миноносца. Командиры иностранных кораблей отказались сопровождать русских до границы территориальных вод. Руднев объявил команде, что идёт на прорыв в Порт-Артур.
        src: 'Источник: «Бой у Чемульпо: история легендарного сражения», «Коммерсантъ», 09.02.2024 — https://www.kommersant.ru/doc/6495968; Президентская библиотека, «Родился командир легендарного крейсера "Варяг"…» — https://www.prlib.ru/history/619499'
        stranica: "Бой у Чемульпо: история легендарного сражения, «Коммерсантъ», 09.02.2024"
        href: https://www.kommersant.ru/doc/6495968
        otryvok: "«За ним расположились корабли японской эскадры: шесть крейсеров и три миноносца.»"
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Матрос Сила Псалом отслужил свой срок, но перед боем добился, чтобы его оставили на «Варяге».</b>
        det:
          - Он уже собирался домой в Россию, а накануне узнал, что крейсер примет бой, и попросил разрешения остаться. Сражался и был награждён. Псалом — один из 15 моряков «Варяга», чьи останки в 1911 году перенесли из Кореи во Владивосток, на Морское кладбище.
        src: 'Источник: «В России прошли торжества в честь 110-летия подвига крейсера "Варяг"», «Российская газета», 10.02.2014 — https://rg.ru/2014/02/10/varyag.html'
        stranica: В России прошли торжества в честь 110-летия подвига крейсера "Варяг", «Российская газета», 10.02.2014
        href: https://rg.ru/2014/02/10/varyag.html
        otryvok: «Он, отслужив срок на флоте и собираясь в Россию, накануне узнал, что крейсер примет бой, добился разрешения остаться и героически сражался.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Иностранные экипажи выстроились на палубах и оркестрами провожали «Варяг» на бой.</b>
        det:
          - На рейде стояли британский крейсер «Тэлбот», французский «Паскаль», итальянский «Эльба» и американская канонерка «Виксбург». Когда «Варяг» шёл мимо них к выходу, экипажи стояли в строю и оркестры играли гимны. Командиры трёх европейских кораблей потом приняли русских моряков на борт.
        src: "Источник: «Бой у Чемульпо: история легендарного сражения», «Коммерсантъ», 09.02.2024 — https://www.kommersant.ru/doc/6495968"
        stranica: "Бой у Чемульпо: история легендарного сражения, «Коммерсантъ», 09.02.2024"
        href: https://www.kommersant.ru/doc/6495968
        otryvok: "«Экипажи были выстроены на палубах, оркестры играли гимны стран, которым принадлежали корабли, стоявшие в порту: британский крейсер «Талбот», французский «Паскаль», итальянский «Эльба», американская канонерка «Виксбург».»"
        pometka: документ
        kadr:
          src: kartinka:000010
          alt: "Два военных корабля на рейде: слева двухтрубная канонерка «Кореец», справа четырёхтрубный крейсер «Варяг»"
          data_source: https://goskatalog.ru/portal/#/collections?id=5541971
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: «Варяг» и «Кореец» выходят из порта Чемульпо на бой 27 января 1904 года.
          credit: Государственный центральный музей современной истории России (ГЦМСИР), ГИК 30943/353А, инв. № не указан; Госкаталог рег. № 5413081
          width: 704
          height: 436
        utverzhden: 2026-11-03
      - summary: <b>Раненый Руднев затопил крейсер и последним сошёл с борта, а флаг так и не спустили.</b>
        det:
          - "Решение поддержал совет офицеров: людей снять, крейсер затопить, канонерку взорвать, чтобы корабли не достались врагу. Открыли кингстоны, без взрыва, чтобы не задеть чужие корабли на тесном рейде, и в 18:10 «Варяг» лёг на левый борт. «Кореец» взорвали, пароход «Сунгари» сожгли. Руднев, раненный в голову и контуженный, последним покинул борт своего корабля."
        src: 'Источник: Президентская библиотека, «Родился командир легендарного крейсера "Варяг"…» — https://www.prlib.ru/history/619499; «Бой у Чемульпо: история легендарного сражения», «Коммерсантъ», 09.02.2024 — https://www.kommersant.ru/doc/6495968'
        stranica: Президентская библиотека, «Родился командир легендарного крейсера "Варяг"…»
        href: https://www.prlib.ru/history/619499
        otryvok: «Раненый в голову и контуженый Руднев последним покинул борт своего корабля.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Корабль не хотел тонуть, и Руднев просил британцев добить его из пушек.</b>
        det:
          - После открытия кингстонов «Варяг» уходил под воду медленно. Руднев просил британцев расстрелять его, лишь бы крейсер не достался врагу. Британцы отказались. Об этой просьбе рассказали британские документы, в рапорт Руднева она не вошла.
        src: 'Источник: Подшивалов А. А., Подшивалов И. А. «Крейсер "Варяг": пропагандистский символ эпохи», ВИЖ, 2019, № 10 — https://history.milportal.ru/krejser-varyag-propagandistskij-simvol-epoxi/'
        stranica: 'Подшивалов А. А., Подшивалов И. А. «Крейсер "Варяг": пропагандистский символ эпохи», ВИЖ, 2019, № 10'
        href: https://history.milportal.ru/krejser-varyag-propagandistskij-simvol-epoxi/
        otryvok: "«Английские документы довольно сдержанны в оценках сражения, но дают много новой информации об эвакуации союзников и сообщают о просьбе Руднева, которую он не отразил в своём рапорте: расстрелять «Варяг» после боя, т.к. он очень медленно тонул (просьба была отклонена).»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>В 1905 году Руднев отказался наказывать своих матросов, и за это его уволили в отставку.</b>
        det:
          - После боя Руднев стал командиром строившегося броненосца «Андрей Первозванный». В ноябре 1905 года он отказался принять дисциплинарные меры против революционно настроенных матросов своего экипажа, и его уволили в отставку с производством в контр-адмиралы. Последние годы он жил в своей усадьбе в Тульской губернии, сейчас в деревне Савино работает его музей.
        src: 'Источник: Президентская библиотека, «Родился командир легендарного крейсера "Варяг"…» — https://www.prlib.ru/history/619499; «Российская газета», 10.02.2014 — https://rg.ru/2014/02/10/varyag.html'
        stranica: Президентская библиотека, «Родился командир легендарного крейсера "Варяг"…»
        href: https://www.prlib.ru/history/619499
        otryvok: "«Однако его блестящая карьера вскоре закончилась: в ноябре 1905 г. за отказ принять дисциплинарные меры против революционно настроенных матросов своего экипажа он был уволен в отставку с производством в контр-адмиралы.»"
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Всех офицеров «Варяга» наградили Георгием, а всех матросов знаком отличия Военного ордена.</b>
        det:
          - "Николай II наградил весь личный состав обоих кораблей: офицеров орденом Святого Георгия IV степени, нижних чинов знаками отличия Военного ордена. Руднев получил ещё и звание флигель-адъютанта. «Корейцем» командовал капитан 2-го ранга Григорий Беляев."
        src: 'Источник: «Бой у Чемульпо: история легендарного сражения», «Коммерсантъ», 09.02.2024 — https://www.kommersant.ru/doc/6495968; «Врагу не сдаётся наш гордый "Варяг"…», «Родина», 31.10.2024 — https://rodina-history.ru/2024/10/31/vragu-ne-sdaetsia-nash-gordyj-variag-125-let-nazad-na-vodu-spushchen-legendarnyj-krejser.html'
        stranica: "Бой у Чемульпо: история легендарного сражения, «Коммерсантъ», 09.02.2024"
        href: https://www.kommersant.ru/doc/6495968
        otryvok: «Все офицеры «Варяга» и «Корейца», включая капитанов Всеволода Руднева и Григория Беляева, были награждены орденом Святого Георгия IV степени, нижние чины — знаками отличия Военного ордена.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Даже японцы наградили Руднева орденом Восходящего солнца за этот бой.</b>
        det:
          - Помимо Георгия и звания флигель-адъютанта, Руднев стал одним из первых европейцев, удостоенных японского ордена Восходящего солнца. Так противник признал бой у Чемульпо.
        src: 'Источник: «Врагу не сдаётся наш гордый "Варяг"…», «Родина», 31.10.2024 — https://rodina-history.ru/2024/10/31/vragu-ne-sdaetsia-nash-gordyj-variag-125-let-nazad-na-vodu-spushchen-legendarnyj-krejser.html'
        stranica: Врагу не сдаётся наш гордый "Варяг"…, «Родина», 31.10.2024
        href: https://rodina-history.ru/2024/10/31/vragu-ne-sdaetsia-nash-gordyj-variag-125-let-nazad-na-vodu-spushchen-legendarnyj-krejser.html
        otryvok: «Помимо ордена, Всеволод Руднев получил звание флигель-адъютанта и стал одним из первых европейцев, удостоенных японского ордена Восходящего солнца.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>За час боя «Варяг» выпустил 1105 снарядов против целой эскадры.</b>
        det:
          - На «Варяге» служили 570 человек, на «Корейце» 174. За час боя крейсер выпустил 1105 снарядов. Были разбиты почти все орудия и дальномеры, перебито рулевое управление, четыре пробоины ниже ватерлинии. Убиты дальномерный офицер мичман Нирод и ещё 38 матросов и нижних чинов, раненых 74.
        src: "Источник: «Бой у Чемульпо: история легендарного сражения», «Коммерсантъ», 09.02.2024 — https://www.kommersant.ru/doc/6495968"
        stranica: "Бой у Чемульпо: история легендарного сражения, «Коммерсантъ», 09.02.2024"
        href: https://www.kommersant.ru/doc/6495968
        otryvok: «В общей сложности «Варяг» выпустил по врагам 1105 снарядов разного калибра, согласно рапорту командира.»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Американский командир отказался принять русских, а британцы, французы и итальянцы взяли 665 моряков.</b>
        det:
          - "В 12:45 стрельбу прекратили, около 13:00 «Варяг» встал на якорь на рейде: четыре пробоины ниже ватерлинии, перебито рулевое управление. К 15:50 людей переправили: 216 на французский «Паскаль», 273 на британский «Тэлбот», 176 на итальянский «Эльбу». Американский командир «Виксбурга» принять моряков отказался, сославшись на отсутствие приказов."
        src: "Источник: «Бой у Чемульпо: история легендарного сражения», «Коммерсантъ», 09.02.2024 — https://www.kommersant.ru/doc/6495968"
        stranica: "Бой у Чемульпо: история легендарного сражения, «Коммерсантъ», 09.02.2024"
        href: https://www.kommersant.ru/doc/6495968
        otryvok: «Американцы отказались принимать русских моряков, сославшись на отсутствие соответствующих приказов командования.»
        pometka: документ
        kadr:
          src: kartinka:000077
          alt: "Рисунок: на палубе иностранного корабля матросы ведут раненых, вдали дымит и кренится четырёхтрубный «Варяг», к борту идут шлюпки"
          data_source: https://goskatalog.ru/portal/#/collections?id=23034137
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Раненых с тонущего «Варяга» переправляют на иностранные стационеры — репродукция рисунка Матаньи по наброску с натуры.
          credit: Центральный военно-морской музей имени императора Петра Великого (ЦВММ), КП ФН-4263 (негатив на стекле); Госкаталог рег. № 22897452
          width: 800
          height: 495
        utverzhden: 2026-11-03
      - summary: <b>Японцы подняли «Варяг» и десять лет учили на нём курсантов, не сбив с кормы русское имя.</b>
        det:
          - В 1905 году японцы подняли крейсер и ввели в строй под именем «Соя», надпись «Варяг» на корме сохранили. В 1916 году Россия выкупила его за 4 млн иен, в 1917-м отправила на ремонт в Британию, где его конфисковали. Корпус закончил путь у берегов Шотландии. В 2003 году российская экспедиция нашла его у Ленделфута на глубине 6–8 метров, в ней участвовал внук Руднева Никита.
        src: 'Источник: «Врагу не сдаётся наш гордый "Варяг"…», «Родина», 31.10.2024 — https://rodina-history.ru/2024/10/31/vragu-ne-sdaetsia-nash-gordyj-variag-125-let-nazad-na-vodu-spushchen-legendarnyj-krejser.html; «Бой у Чемульпо: история легендарного сражения», «Коммерсантъ», 09.02.2024 — https://www.kommersant.ru/doc/6495968'
        stranica: Врагу не сдаётся наш гордый "Варяг"…, «Родина», 31.10.2024
        href: https://rodina-history.ru/2024/10/31/vragu-ne-sdaetsia-nash-gordyj-variag-125-let-nazad-na-vodu-spushchen-legendarnyj-krejser.html
        otryvok: «Более 10 лет легендарный корабль служил учебным судном для японских моряков. К счастью, надпись "Варяг" на корме была сохранена.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Инчхон через 106 лет вернул России гюйс «Варяга», который корейцы хранили с боя.</b>
        det:
          - 11 ноября 2010 года власти Инчхона (бывшего Чемульпо) передали гюйс крейсера в посольстве России в Сеуле при президенте России. По корейским правилам музейный экспонат передаётся только в аренду, её продлевают каждые пять лет. Гюйс принял почётный караул гвардейского ракетного крейсера «Варяг», который был в Инчхоне с визитом.
        src: 'Источник: «Южная Корея передала России флаг легендарного крейсера "Варяг"», РИА Новости, 11.11.2010 — https://ria.ru/20101111/294907441.html'
        stranica: Южная Корея передала России флаг легендарного крейсера "Варяг", РИА Новости, 11.11.2010
        href: https://ria.ru/20101111/294907441.html
        otryvok: «Церемония передачи прошла в посольстве РФ в Сеуле в присутствии президента России Дмитрия Медведева.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Страна встречала моряков «Варяга» как героев.</b>
        det:
          - 1 апреля 1904 года первых моряков «Варяга» торжественно встретили в Одессе, потом их принял Николай II. Японцы отпустили экипажи на иностранные корабли только под честное слово офицеров больше не воевать. 8 февраля 1954 года, к 50-летию боя, главком ВМФ Кузнецов вручил пятнадцати ветеранам медали «За отвагу».
        src: 'Источник: «Бой у Чемульпо: история легендарного сражения», «Коммерсантъ», 09.02.2024 — https://www.kommersant.ru/doc/6495968; «Врагу не сдаётся наш гордый "Варяг"…», «Родина», 31.10.2024 — https://rodina-history.ru/2024/10/31/vragu-ne-sdaetsia-nash-gordyj-variag-125-let-nazad-na-vodu-spushchen-legendarnyj-krejser.html; Подшивалов А. А., Подшивалов И. А. «Крейсер "Варяг": пропагандистский символ эпохи», ВИЖ, 2019, № 10 — https://history.milportal.ru/krejser-varyag-propagandistskij-simvol-epoxi/'
        stranica: "Бой у Чемульпо: история легендарного сражения, «Коммерсантъ», 09.02.2024"
        href: https://www.kommersant.ru/doc/6495968
        otryvok: «Оттуда русские моряки с «Талбота» отправились в Коломбо (Цейлон, ныне Шри-Ланка) и далее в Одессу (где их торжественно встретили 1 апреля 1904 года).»
        pometka: два источника
        kadr:
          src: kartinka:000078
          alt: "Старая фотография: у борта парохода на мостовой порта выстроены ряды моряков, вокруг толпа встречающих"
          data_source: https://goskatalog.ru/portal/#/collections?id=8586173
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Одесса, 1904 год: город встречает моряков «Варяга» и «Корейца», вернувшихся из Чемульпо."
          credit: Филиал «Музей командира крейсера „Варяг“ В.Ф. Руднева» Тульского музейного объединения, инв. ИИ 8, МРС 32; Госкаталог рег. № 8478499
          width: 736
          height: 572
        utverzhden: 2026-11-03
      - summary: <b>Японских офицеров учили мужеству на примере экипажей «Варяга» и «Корейца».</b>
        det:
          - Поступок русских моряков считали героическим и сами противники — японцы. Молодых японских офицеров учили мужеству и стойкости, ставя в пример экипажи «Варяга» и «Корейца». Принимая неравный и безнадёжный бой, русские моряки показали врагу, что лёгкой победы в войне с Россией не будет и каждый её воин будет стоять до конца.
        src: "Источник: «В России прошли торжества в честь 110-летия подвига крейсера „Варяг“», «Российская газета», 10.02.2014 — https://rg.ru/2014/02/10/varyag.html"
        stranica: «В России прошли торжества в честь 110-летия подвига крейсера „Варяг“», «Российская газета», 10.02.2014
        href: https://rg.ru/2014/02/10/varyag.html
        otryvok: «Публицисты-патриоты настойчиво продвигали версию, что русские моряки взорвали крейсер вместе с собой»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-varyag-ru.mp3
  durationLabel: 1 минута 25 секунд
  lead: "Голос ведёт от ультиматума до последних минут крейсера: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Ультиматум
    - t: 18
      mark: 0:18
      title: Выход
    - t: 37
      mark: 0:37
      title: Бой
    - t: 53
      mark: 0:53
      title: Решение
    - t: 67
      mark: 1:07
      title: Флаг
  transcript:
    - "<p>Январь тысяча девятьсот четвёртого года, корейский порт Чемульпо. На рейде — корабли пяти стран. Утром японский адмирал требует: русским покинуть порт до полудня, иначе он атакует прямо здесь. У выхода ждут шесть крейсеров и миноносцы.</p>"
    - "<p>Капитан первого ранга Всеволод Руднев объявляет команде: идём на прорыв. «Варяг» и канонерская лодка «Кореец» снимаются с якоря. На иностранных кораблях выстраиваются экипажи, играют оркестры. Так провожают тех, кто идёт на смерть.</p>"
    - <p>Японцы открывают огонь первыми. «Варяг» отвечает и за час выпускает больше тысячи снарядов. Пожары, пробоины ниже ватерлинии, перебито рулевое управление. Погибает мичман Нирод, ранен командир.</p>
    - <p>Прорваться уже нельзя. Крейсер возвращается на рейд. Раненых и команду свозят на французский, британский и итальянский корабли. Корабль врагу не отдают.</p>
    - <p>Открывают кингстоны. В восемнадцать десять «Варяг» ложится на борт. «Кореец» взрывают. Флаг перед неприятелем спущен не был. Весной моряков встречает вся страна — и каждого награждают Георгием.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
