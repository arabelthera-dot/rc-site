quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — У корейского порта Чемульпо; 2 — Покинуть рейд до полудня — иначе атака в порту; 3 — Всеволод Руднев; 4 — Затопили, открыв кингстоны; 5 — Все офицеры — орденом Святого Георгия, все нижние чины — знаком отличия Военного ордена."
  ball: 10
  voprosy:
    - q: Где «Варяг» принял бой в 1904 году?
      o:
        - У Порт-Артура
        - У корейского порта Чемульпо
        - В Цусимском проливе
        - У Владивостока
      a: 1
      e: У Чемульпо — нейтрального порта в Корее, где «Варяг» и «Кореец» охраняли русскую миссию в Сеуле.
    - q: Что потребовал японский адмирал Уриу?
      o:
        - Спустить флаг и сдать корабли
        - Разоружиться и остаться в порту
        - Покинуть рейд до полудня — иначе атака в порту
        - Передать ему «Кореец»
      a: 2
      e: Требование было одно — выйти с рейда. Сигнала о сдаче, по японским документам, не поднимали.
    - q: Кто командовал «Варягом»?
      o:
        - Степан Макаров
        - Григорий Беляев
        - Зиновий Рожественский
        - Всеволод Руднев
      a: 3
      e: Капитан 1-го ранга Всеволод Руднев. Беляев командовал «Корейцем», Макаров — флотом в Порт-Артуре, Рожественский позже повёл эскадру к Цусиме.
    - q: Как поступили с «Варягом» после боя?
      o:
        - Затопили, открыв кингстоны
        - Взорвали вместе с командой
        - Сдали японцам
        - Увели в Порт-Артур
      a: 0
      e: Команду свезли на иностранные корабли, а крейсер затопили без взрыва, чтобы не повредить чужие суда на тесном рейде. «Взорвали себя» — выдумка публицистов 1904 года.
    - q: Как наградили экипаж?
      o:
        - Наградили только командира
        - Все офицеры — орденом Святого Георгия, все нижние чины — знаком отличия Военного ордена
        - Никого не наградили — корабль потерян
        - Медалью «За оборону Порт-Артура»
      a: 1
      e: Поголовное награждение Георгиевскими наградами всего экипажа — единственный такой случай; позже учредили и медаль «За бой „Варяга“ и „Корейца“».
