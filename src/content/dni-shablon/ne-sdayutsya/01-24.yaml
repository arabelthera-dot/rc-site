vizual:
  imya: shipka-vereshchagin-etyud
  vid: predmet
  kicker: Картина под лупой
  h2: Часовой в метели
  lead: 'Верещагин написал этот этюд к картине «На Шипке всё спокойно». Приближайте: солдат закутан с головой, за спиной винтовка, вокруг снежный вихрь.'
audioguide:
  audioSrc: audio-guide-shipka-ru.mp3
  durationLabel: около трёх минут
  lead: "Голос ведёт по обороне Шипки: от камней, которыми ополченцы встречали турок без патронов, через стрелков на казачьих конях и ломкие от мороза шинели к залпу тысяча девятьсот сорок четвёртого года."
  stops:
    - t: 0
      mark: '0:00'
      title: Камни вместо патронов
    - t: 32
      mark: '0:32'
      title: Умирать так умирать
    - t: 64
      mark: '1:04'
      title: Стрелки на казачьих конях
    - t: 95
      mark: '1:35'
      title: Шинели не гнутся
    - t: 129
      mark: '2:09'
      title: Залп у вершины Столетова
  transcript:
    - "Девятого августа тысяча восемьсот семьдесят седьмого года на Орлином гнезде, когда кончались патроны, ополченцы третьей роты первой дружины «обрушивали на врага каменные глыбы, сметая его в ложбину». Граф Игнатьев записал, что болгарские дружинники, «не имея патронов и с испорченными ружьями… кидали в турок каменьями, изобилующими на Шибке». Шипкинский перевал был кратчайшим путём через Балканы на Стамбул. Генерал Столетов доносил, что перед ним выстроился весь корпус Сулейман-паши: «Защищаться буду до последней крайности». Атаки отбили."
    - "В тот же день турки закрепились под окопами той же роты. «Ополченец Леон Крудов, схватив дымящую турецкую гранату, выскочил на бруствер и, крикнув: „Что же братцы, умирать так умирать“ — бросился с нею на турок». Такой же подвиг совершил рядовой Орловского полка Лейба Файгенбаум. В тот день турки предприняли одиннадцать атак, все отбиты. Воды на перевале не было, и до тысячи жителей Габрова, среди них мальчики, под градом пуль носили её даже в передовую цепь."
    - "Одиннадцатого августа к десяти утра турки охватили позицию с трёх сторон: около двадцати пяти тысяч против семи с небольшим тысяч. Командир Брянского полка Липинский спросил о подкреплении, и Столетов ответил: «Свежих подкреплений, тебе известно, нет». Липинский сам повёл в контратаку сто пятьдесят человек. Майор Попов предложил посадить батальон стрелков на казачьих лошадей, и стрелков подняли на перевал по двое-трое на конях. К шести вечера они с ходу отбили ключевую высоту."
    - "Двенадцатого августа похлёбку стали варить прямо за укреплениями, и когда в неё сыпались турецкие пули, солдаты острили: «Вишь ты, как турка за нас старается, соли подбавляет». Потом было «шипкинское сидение». Участник писал: «Шинели так замерзли, что их полы не сгибаются, а ломаются». В морозные дни из строя выбывали по триста-четыреста человек. Боевые потери отряда составили около четырёх тысяч, больными и обмороженными — одиннадцать тысяч. Позиции не оставили до самого Шейнова, где в декабре отряды Радецкого и Скобелева разбили турок."
    - "Над князем Эммануилом Мещерским, командиром батареи на горе Святого Николая, сначала смеялись за плохой русский, но бесстрашием он «заслужил общую симпатию». Он погиб при отражении ночного штурма Орлиного гнезда, и солдаты говорили: «Жаль, русский был человек!» Батарею негласно назвали его именем. В сентябре тысяча девятьсот сорок четвёртого года полки Толбухина построились на кладбище под вершиной Столетова и дали винтовочный залп в честь героев тысяча восемьсот семьдесят седьмого года."
  note: Озвучено синтезом речи.
