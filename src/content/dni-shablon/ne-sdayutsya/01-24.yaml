story:
  kicker: Среда подвига
  h2: Запертые двери Балкан
  abzacy:
    - Шёл 1877 год, русско-турецкая война. Чтобы наступать за Балканы, на Стамбул, русской армии нужен был Шипкинский перевал через Балканский хребет — Стара-Планину. 7 (19) июля 1877 года, после двухдневных боёв, русские войска его заняли.
    - "Турецкое командование приказало армии Сулеймана-паши взять перевал и прорваться на север, в тыл русской армии. Перевал держал русско-болгарский отряд генерал-майора Николая Столетова: Орловский пехотный полк и дружины болгарского ополчения. <b>Позиция была неудобной: голый гребень, со всех сторон простреливаемый с соседних высот, без воды.</b>"
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Оборона Шипки — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Ополченцы без патронов обрушивали на турок каменные глыбы и сметали их в ложбину.</b>
        det:
          - 9 (21) августа на Орлином гнезде «когда кончались патроны, ополченцы третьей роты 1-й дружины обрушивали на врага каменные глыбы, сметая его в ложбину». Игнатьев 12 августа записал, что болгарские дружинники, «не имея патронов и с испорченными ружьями… кидали в турок каменьями, изобилующими на Шибке». Радецкий просил корреспондента писать о полках и ополчении, «которые, израсходовав боеприпасы, отбивали турецкие атаки камнями». Атаки отбили.
        src: "Источник: Н. П. Игнатьев, «Походные письма 1877 года», М.: РОССПЭН, 1999, письмо № 28 — http://militera.lib.ru/db/ignatyev_np/02.html; Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979 — http://militera.lib.ru/h/genov/03.html; С. И. Шашин, «Вятчане в годы русско-турецкой войны 1877–1878 гг.», альманах «Вятские записки», вып. 13, Кировская ОНБ им. Герцена — https://herzenlib.ru/almanac/number/detail.php?NUMBER=number13&ELEMENT=gerzenka13_3_1"
        stranica: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979
        href: http://militera.lib.ru/h/genov/03.html
        otryvok: «Когда кончались патроны, ополченцы третьей роты 1-й дружины обрушивали на врага каменные глыбы, сметая его в ложбину.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Стрелков подняли на перевал по двое-трое на казачьих конях — и они с ходу отбили ключевую высоту.</b>
        det:
          - "11 (23) августа к 10 утра турки охватили позицию с трёх сторон, их было около 25 тысяч против 7 с небольшим тысяч. Майор П. Н. Попов под огнём подскакал к генералу: «Не найдете ли, ваше превосходительство, лучшим посадить на казачьих лошадей батальон стрелков». 16-й стрелковый батальон пришёл в Габрово в час ночи, в 11 утра его двинули дальше по жаре, к шести вечера он поднялся и «тотчас же вступил в дело». Ночью подошли подкрепления Драгомирова."
        src: "Источник: С. И. Шашин, «Вятчане в годы русско-турецкой войны 1877–1878 гг.», альманах «Вятские записки», вып. 13, Кировская ОНБ им. Герцена — https://herzenlib.ru/almanac/number/detail.php?NUMBER=number13&ELEMENT=gerzenka13_3_1; Н. П. Игнатьев, «Походные письма 1877 года», М.: РОССПЭН, 1999, письмо № 28 — http://militera.lib.ru/db/ignatyev_np/02.html; «Оборона Шипки», «История.РФ» — https://history.ru/read/articles/oborona-shipki-event; «Оборона Шипки 1877», Большая российская энциклопедия (копия web.archive.org, 15.12.2024) — https://web.archive.org/web/20241215034136/https://bigenc.ru/c/oborona-shipki-1877-26d2ac"
        stranica: С. И. Шашин, «Вятчане в годы русско-турецкой войны 1877–1878 гг.», альманах «Вятские записки», вып. 13, Кировская ОНБ им. Герцена
        href: https://herzenlib.ru/almanac/number/detail.php?NUMBER=number13&ELEMENT=gerzenka13_3_1
        otryvok: «Не найдете ли, ваше превосходительство, лучшим посадить на казачьих лошадей батальон стрелков»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Ополченец Леон Крудов схватил дымящуюся турецкую гранату и бросился с ней на турок.</b>
        det:
          - "9 (21) августа турки закрепились ниже окопов 3-й роты 1-й дружины и били по ней ружейным огнём. «Ополченец Леон Крудов, схватив дымящую турецкую гранату, выскочил на бруствер и, крикнув: „Что же братцы, умирать так умирать“ — бросился с нею на турок». Такой же подвиг совершил рядовой Орловского полка Лейба Файгенбаум. В тот день турки предприняли 11 атак, все отбиты."
        src: "Источник: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979 — http://militera.lib.ru/h/genov/03.html"
        stranica: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979
        href: http://militera.lib.ru/h/genov/03.html
        otryvok: "«Ополченец Леон Крудов, схватив дымящую турецкую гранату, выскочил на бруствер и, крикнув: «Что же братцы, умирать так умирать»— бросился с нею на турок.»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Генерал Столетов телеграфировал: «Защищаться буду до последней крайности» — и перевал не отдал.</b>"
        det:
          - "Шипкинский перевал, взятый 7 (19) июля 1877 года, был кратчайшим путём через Балканы на Стамбул. Позиция — голый гребень без воды, простреливаемый с соседних высот; держали её Орловский полк и болгарские дружины. 8 августа Столетов доносил: «Перед занимаемой мной позицией выстроился весь корпус Сулейман-паши… Защищаться буду до последней крайности, но… несоразмерность сил слишком велика». Над богомольным генералом раньше трунили, а потом, писал Игнатьев, «все удивляются его энергии и непоколебимому мужеству»."
        src: "Источник: А. Сидорчик, «„На Шипке всё спокойно“. Как русские солдаты свободу Болгарии добывали», «Аргументы и факты», 21.08.2014 — https://aif.ru/society/history/na_shipke_vse_spokoyno_kak_russkie_soldaty_svobodu_bolgarii_dobyvali; Ю. Совцов, «Шипка», журнал «Родина», 05.04.2016 — https://rodina-history.ru/2016/04/05/rodina-shipka.html; Н. П. Игнатьев, «Походные письма 1877 года», М.: РОССПЭН, 1999, письмо № 28 — http://militera.lib.ru/db/ignatyev_np/02.html; «Оборона Шипки», «История.РФ» — https://history.ru/read/articles/oborona-shipki-event"
        stranica: А. Сидорчик, «„На Шипке всё спокойно“. Как русские солдаты свободу Болгарии добывали», «Аргументы и факты», 21.08.2014
        href: https://aif.ru/society/history/na_shipke_vse_spokoyno_kak_russkie_soldaty_svobodu_bolgarii_dobyvali
        otryvok: «Завтра неприятель будет штурмовать Шипку. Защищаться буду до последней крайности, но долгом считаю доложить, что несоразмерность сил слишком велика.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Солдаты под пулями шутили, что пули в похлёбке — это «турка соли подбавляет».</b>
        det:
          - "9–11 августа защитники сидели без горячей пищи: похлёбка из Габрова выливалась из котлов на крутом подъёме. 12-го стали варить прямо за укреплениями, «но пули турецкие щелкали беспрестанно по большим котлам кухни и ранили нескольких кашеваров. Когда пули сыпались в похлебку, солдаты, не смущаясь, острили, приговаривая: „Вишь ты, как турка за нас старается, соли подбавляет“». Игнатьев записал это со слов корреспондента Форбса."
        src: "Источник: Н. П. Игнатьев, «Походные письма 1877 года», М.: РОССПЭН, 1999, письмо № 28 — http://militera.lib.ru/db/ignatyev_np/02.html; «Оборона Шипки», «История.РФ» — https://history.ru/read/articles/oborona-shipki-event"
        stranica: "Н. П. Игнатьев, «Походные письма 1877 года», М.: РОССПЭН, 1999, письмо № 28"
        href: http://militera.lib.ru/db/ignatyev_np/02.html
        otryvok: "«Когда пули сыпались в похлебку, солдаты, не смущаясь, острили, приговаривая: «Вишь ты, как турка за нас старается, соли подбавляет».»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Шипку держали в шинелях, которые на морозе не гнулись, а ломались.</b>
        det:
          - "Дневник участника: «Шинели солдат покрылись толстой ледяной коркой… Шинели так замерзли, что их полы не сгибаются, а ломаются». Полковник Духонин доносил с горы Святого Николая: «Ружья покрыты сплошной ледяной корой». Первые обморожения появились 26 сентября (8 октября), в морозные дни из строя выбывали по 300–400 человек, 24-ю дивизию 19 (31) декабря пришлось снять с позиций. За всё «шипкинское сидение» боевые потери отряда — около 4 тысяч, больными и обмороженными — 11 тысяч. Позиции не оставили до самого Шейнова."
        src: "Источник: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979 — http://militera.lib.ru/h/genov/03.html; Б. А. Костин, «Скобелев», М.: Молодая гвардия, 2000 — http://militera.lib.ru/bio/kostin/13.html (донесение Духонина о «ледяной коре» на ружьях); «Оборона Шипки 1877», Большая российская энциклопедия (копия web.archive.org, 15.12.2024) — https://web.archive.org/web/20241215034136/https://bigenc.ru/c/oborona-shipki-1877-26d2ac; «Оборона Шипки», «История.РФ» — https://history.ru/read/articles/oborona-shipki-event"
        stranica: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979
        href: http://militera.lib.ru/h/genov/03.html
        otryvok: «Шинели солдат покрылись толстой ледяной коркой. … Шинели так замерзли, что их полы не сгибаются, а ломаются.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Барабанщик Углицкого полка сказал: «Пропадать, так по присяге» — и пошёл на редут с барабаном.</b>"
        det:
          - "28 декабря 1877 года под Шейновом в 3-м батальоне Углицкого полка произошла заминка. Барабанщик обратился к командиру полка полковнику Панютину: «пойдемте на редут. Пропадать, так по присяге. Тут все равно всех перестреляют!» — и пошёл вперёд «с барабанным боем». Панютин взял знамя, и батальон «выбил турок из траншей»."
        src: "Источник: Б. А. Костин, «Скобелев», М.: Молодая гвардия, 2000 — http://militera.lib.ru/bio/kostin/13.html; В. В. Верещагин, «На войне: Воспоминания о русско-турецкой войне 1877 года», М., 1902; Вологодская областная научная библиотека — https://www.booksite.ru/vereschagin/6_28.html"
        stranica: "Б. А. Костин, «Скобелев», М.: Молодая гвардия, 2000"
        href: http://militera.lib.ru/bio/kostin/13.html
        otryvok: "«Ваше благородие, — обратился он к Панютину, — что вы на них смотрите: пойдемте на редут. Пропадать, так по присяге. Тут все равно всех перестреляют!»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Скобелев пригрозил атаковать Шипку одной бригадой — и пустил её под музыку, чтобы казалась больше.</b>
        det:
          - "27–28 декабря 1877 года (8–9 января 1878) отряды Радецкого, Скобелева и Святополк-Мирского разбили турок в Шипко-Шейновском сражении. Вессель-паша не ручался за отряд на самом перевале: «Я главнокомандующий, но не знаю, послушают ли они меня. — А если так, то я сейчас же атакую Шипку». Бригада пошла к горам «под музыку, церемониально, на больших дистанциях, чтобы войска казалось больше!». «Шипка сдалась в конце концов без протеста»."
        src: "Источник: В. В. Верещагин, «На войне: Воспоминания о русско-турецкой войне 1877 года», М., 1902; Вологодская областная научная библиотека — https://www.booksite.ru/vereschagin/6_28.html; Б. А. Костин, «Скобелев», М.: Молодая гвардия, 2000 — http://militera.lib.ru/bio/kostin/13.html; «Оборона Шипки 1877», Большая российская энциклопедия (копия web.archive.org, 15.12.2024) — https://web.archive.org/web/20241215034136/https://bigenc.ru/c/oborona-shipki-1877-26d2ac"
        stranica: "В. В. Верещагин, «На войне: Воспоминания о русско-турецкой войне 1877 года», М., 1902; Вологодская областная научная библиотека"
        href: https://www.booksite.ru/vereschagin/6_28.html
        otryvok: «В ожидании ответа бригада все-таки двинулась к горам, под музыку, церемониально, на больших дистанциях, чтобы войска казалось больше!»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>До тысячи габровцев, среди них мальчишки, под градом пуль носили воду даже в передовую цепь.</b>
        det:
          - "На перевале не было воды. Граф Игнатьев 14 августа 1877 года написал жене со слов корреспондента «Дейли ньюс» Форбса: «до тысячи жителей и мальчиков габровских разносили под градом пуль воду нашим войскам и даже застрельщикам передовой цепи, а также и уносили раненых с полным самоотвержением». Форбс пробыл на Шипке весь день 12 августа и загнал лошадь насмерть, чтобы первым сообщить «об отбитии нами 19 яростных атак турок»."
        src: "Источник: Н. П. Игнатьев, «Походные письма 1877 года», М.: РОССПЭН, 1999, письмо № 28 — http://militera.lib.ru/db/ignatyev_np/02.html; «Оборона Шипки», «История.РФ» — https://history.ru/read/articles/oborona-shipki-event"
        stranica: "Н. П. Игнатьев, «Походные письма 1877 года», М.: РОССПЭН, 1999, письмо № 28"
        href: http://militera.lib.ru/db/ignatyev_np/02.html
        otryvok: «При нем до тысячи жителей и мальчиков габровских разносили под градом пуль воду нашим войскам и даже застрельщикам передовой цепи, а также и уносили раненых с полным самоотвержением.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Двенадцать ополченцев встали к пушкам погибших артиллеристов и стреляли до последнего снаряда.</b>
        det:
          - "11 (23) августа турки дошли до окопов у «Центральной» батареи. «Погибли русские артиллеристы „Круглой“ батареи во главе с полковником Бенецким, но 12 ополченцев, занявшие их места, продолжали вести огонь до последнего снаряда». Из болгарских рядов кричали: «Бейте их, юнаки! Умрем, как умирали наши прадеды»."
        src: "Источник: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979 — http://militera.lib.ru/h/genov/03.html"
        stranica: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979
        href: http://militera.lib.ru/h/genov/03.html
        otryvok: «Погибли русские артиллеристы «Круглой» батареи во главе с полковником Бенецким, но 12 ополченцев, занявшие их места, продолжали вести огонь до последнего снаряда.»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: "<b>Орловцы и брянцы выстояли против Сулеймана, который велел: «Пусть они падают тысячами».</b>"
        det:
          - "Перед штурмом 11 (23) августа Сулейман-паша, по «АиФ», приказал: «Пусть они падают тысячами — на их место станут другие. Из сигналов допускаются только „сбор“, „наступление“ и „командир убит“». За шесть дней августовских штурмов русско-болгарский отряд потерял около 3,6 тысячи человек, турки — от 6,5 до 12 тысяч по разным данным. Шипку Сулейман не взял, а после войны его самого судили за действия на перевале."
        src: "Источник: А. Сидорчик, «„На Шипке всё спокойно“. Как русские солдаты свободу Болгарии добывали», «Аргументы и факты», 21.08.2014 — https://aif.ru/society/history/na_shipke_vse_spokoyno_kak_russkie_soldaty_svobodu_bolgarii_dobyvali; «Оборона Шипки 1877», Большая российская энциклопедия (копия web.archive.org, 15.12.2024) — https://web.archive.org/web/20241215034136/https://bigenc.ru/c/oborona-shipki-1877-26d2ac; «Оборона Шипки», «История.РФ» — https://history.ru/read/articles/oborona-shipki-event; Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979 — http://militera.lib.ru/h/genov/03.html"
        stranica: А. Сидорчик, «„На Шипке всё спокойно“. Как русские солдаты свободу Болгарии добывали», «Аргументы и факты», 21.08.2014
        href: https://aif.ru/society/history/na_shipke_vse_spokoyno_kak_russkie_soldaty_svobodu_bolgarii_dobyvali
        otryvok: «Пусть они падают тысячами — на их место станут другие, — говорил командующий турецкой армии. — Из сигналов допускаются только «сбор», «наступление» и „командир убит“»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Командир брянцев узнал, что подкреплений нет, — и сам повёл 150 человек в контратаку.</b>
        det:
          - "11 (23) августа командир 35-го Брянского полка Липинский написал Столетову: «Скажите правду, получим ли мы подкрепление… нам не следует больше вводить в заблуждение солдат». Столетов ответил: «Свежих подкреплений, тебе известно, нет». В критический момент Липинский «повел в контратаку 150 храбрецов, которые выбили из окопов проникших туда турецких пехотинцев»."
        src: "Источник: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979 — http://militera.lib.ru/h/genov/03.html"
        stranica: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979
        href: http://militera.lib.ru/h/genov/03.html
        otryvok: «В критический момент обороны командир 35-го Брянского пехотного полка повел в контратаку 150 храбрецов, которые выбили из окопов проникших туда турецких пехотинцев.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Поручик Киснемский делал фугасы из турецкого пороха и кабеля турецкого телеграфа.</b>
        det:
          - «Стальная» батарея стояла на самом уязвимом месте и была вооружена трофейными крупповскими пушками. «Поручик Киснемский использовал турецкий порох и кабель турецкого телеграфа для изготовления фугасов, на которые натыкались колонны атакующих. Из трофейных снарядов изготовлялись ручные гранаты». Огнём батареи уничтожено одно турецкое орудие на Малык-Бедеке и шесть на Демиртепе.
        src: "Источник: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979 — http://militera.lib.ru/h/genov/03.html"
        stranica: Ц. Генов, «Русско-турецкая война 1877–1878 гг. и подвиг освободителей», гл. III «Шипкинская эпопея», русское издание, София, 1979
        href: http://militera.lib.ru/h/genov/03.html
        otryvok: «Поручик Киснемский использовал турецкий порох и кабель турецкого телеграфа для изготовления фугасов, на которые натыкались колонны атакующих.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Над князем Мещерским смеялись за плохой русский, а после гибели батарею назвали его именем.</b>
        det:
          - "Флигель-адъютант князь Эммануил Мещерский командовал батареей на горе Святого Николая. Над полковником, «прекрасно изъяснявшимся по-французски, но очень плохо по-русски», сначала смеялись, но бесстрашием он «заслужил общую симпатию». Он погиб 5 (17) сентября 1877 года при отражении ночного штурма Орлиного гнезда, и солдаты говорили: «Жаль, русский был человек!» Батарею негласно окрестили его именем, на месте гибели стоит крест."
        src: "Источник: В. В. Верещагин, «На войне: Воспоминания о русско-турецкой войне 1877 года», М., 1902; Вологодская областная научная библиотека — https://www.booksite.ru/vereschagin/6_28.html; Ю. Совцов, «Шипка», журнал «Родина», 05.04.2016 — https://rodina-history.ru/2016/04/05/rodina-shipka.html"
        stranica: "В. В. Верещагин, «На войне: Воспоминания о русско-турецкой войне 1877 года», М., 1902; Вологодская областная научная библиотека"
        href: https://www.booksite.ru/vereschagin/6_28.html
        otryvok: «„Жаль, – говорили все, – русский был человек!“ Хорошим мерилом популярности покойного было негласное окрещение батареи его именем.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>В 1944 году полки Толбухина дали на русском кладбище у Шипки залп в честь героев 1877 года.</b>
        det:
          - "В сентябре 1944 года части 3-го Украинского фронта шли через перевал. Толбухин записал: «Приятно русскому сердцу видеть памятники своим предкам за пределами Советского Союза». Полки построились на кладбище под вершиной Столетова и дали винтовочный залп. Сегодня на месте боёв — парк-музей «Шипка» с памятником Свободы (1934), у подножия — мемориальный храм Рождества Христова (1902)."
        src: "Источник: «Оборона Шипки», «История.РФ» — https://history.ru/read/articles/oborona-shipki-event; «Оборона Шипки 1877», Большая российская энциклопедия (копия web.archive.org, 15.12.2024) — https://web.archive.org/web/20241215034136/https://bigenc.ru/c/oborona-shipki-1877-26d2ac"
        stranica: militera.lib.ru
        href: http://militera.lib.ru/h/genov/03.html
        otryvok: «Построенные полки на русском военном кладбище под вершиной Столетова дали винтовочный залп в честь героев Шипки — их отцов и дедов, павших вдали от родины за свободу братского болгарского народа.»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-shipka-ru.mp3
  durationLabel: 1 минута 8 секунд
  lead: "Голос ведёт от летнего занятия перевала через шесть дней августовских штурмов и зиму «шипкинского сидения» — к январю 1878 года: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Перевал
    - t: 12
      mark: 0:12
      title: Шесть дней в августе
    - t: 28
      mark: 0:28
      title: На казачьих лошадях
    - t: 41
      mark: 0:41
      title: Шипкинское сидение
    - t: 57
      mark: 0:57
      title: Январь
  transcript:
    - <p>Седьмого июля тысяча восемьсот семьдесят седьмого года русские войска заняли Шипкинский перевал — кратчайший путь через Балканы на Стамбул. Турецкая армия Сулеймана-паши получила приказ его отбить.</p>
    - <p>Девятого августа турки пошли на штурм. Отряд генерала Столетова — русские полки и болгарские ополченцы — держался в полуокружении, без воды. Жители Габрова, среди них дети, под пулями носили бойцам воду.</p>
    - <p>Одиннадцатого августа позицию охватили с трёх сторон. Вечером на перевал на казачьих лошадях подняли стрелковый батальон, и он отбил ключевую высоту. Шипка устояла.</p>
    - <p>Потом пришла зима. Отряд сидел на вершине под огнём и в мороз. В морозные дни из строя выбывали по триста-четыреста человек. Больными и обмороженными отряд потерял почти втрое больше, чем в боях.</p>
    - <p>В январе тысяча восемьсот семьдесят восьмого года войска Радецкого и Скобелева разбили турок под Шипкой и Шейновом. Перевал держали в мороз — и не сошли.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
