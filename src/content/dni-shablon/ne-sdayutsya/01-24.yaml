  voprosy:
    - q: Почему Шипкинский перевал был так важен?
      o:
        - Там стояла главная крепость турок
        - Это кратчайший путь через Балканы на Стамбул
        - Там проходила граница России
        - Там были склады всей армии
      a: 1
      e: Перевал через Балканский хребет — кратчайший путь на Стамбул; турки хотели прорваться через него на север, в тыл русской армии.
    - q: Кто вместе с русскими полками защищал перевал?
      o:
        - Сербские добровольцы
        - Румынская армия
        - Казаки Кавказа
        - Болгарское ополчение
      a: 3
      e: "Отряд генерал-майора Столетова был русско-болгарским: Орловский полк и дружины болгарского ополчения."
    - q: Как в критический день 11 (23) августа на перевал успела подмога?
      o:
        - Стрелковый батальон подняли на казачьих лошадях
        - Подкрепление спустили на канатах
        - Подмогу привезли по железной дороге
        - Подмоги не было
      a: 0
      e: Вечером, когда положение было почти безнадёжным, на перевал на казачьих лошадях подняли 16-й стрелковый батальон, и он отбил Боковую горку.
    - q: Что унесло больше всего людей за время обороны?
      o:
        - Августовские штурмы
        - Артиллерийский обстрел
        - Морозы и болезни
        - Голод
      a: 2
      e: Боевые потери Шипкинского отряда — около 4 тысяч человек, а больными и обмороженными — 11 тысяч.
    - q: Чем закончилась оборона Шипки?
      o:
        - Отходом русских войск
        - Победой в Шипко-Шейновском сражении
        - Перемирием
        - Обменом пленными
      a: 1
      e: 27–28 декабря 1877 года (8–9 января 1878) войска Радецкого, Скобелева и Святополк-Мирского разбили турок в Шипко-Шейновском сражении.
