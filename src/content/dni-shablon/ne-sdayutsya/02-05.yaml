  - id: ns-0205-patrony-konchilis
    summary: Патроны кончились — ночью Талалихин винтом отрубил хвост «Хейнкелю» и остался жив.
    det:
    - 'В ночь на 7 августа 1941 года младший лейтенант Виктор Талалихин догоняет над Подмосковьем немецкий бомбардировщик «Хейнкель-111». На высоте около 2500 метров у него кончаются патроны. Он решает таранить: подойти вплотную и винтом отрубить врагу хвост.'
    src: 'Источник: «Герои страны». Талалихин Виктор Васильевич — https://warheroes.ru/hero/hero.asp?Hero_id=230'
    stranica: страница героя
    href: https://warheroes.ru/hero/hero.asp?Hero_id=230
    otryvok: «Вместе с противником я снизился до высоты примерно 2500 метров. И тут у меня кончились боеприпасы... Оставалось одно - таранить.»
    pometka: два источника
    utverzhden: '2026-11-12'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: true
    otvet: винтом
    otvet_edinstvennyj: true
  - id: ns-0205-ranen-ne-otvernul
    summary: Стрелок «Хейнкеля» прошил ему руку с 10–15 метров — Талалихин не отвернул и пошёл на таран.
    det:
    - Когда до врага остаётся 10–15 метров, из хвоста бомбардировщика бьёт пулемётная очередь. Пули проходят у кабины и обжигают лётчику руку. Талалихин даёт газ и врезается в немецкий самолёт.
    src: 'Источник: М. Поляков. «Летопись краснозвёздного истребителя», «Военно-исторический журнал» — http://history.milportal.ru/letopis-krasnozvyozdnogo-istrebitelya/'
    stranica: статья
    href: http://history.milportal.ru/letopis-krasnozvyozdnogo-istrebitelya/
    otryvok: «Когда до врага осталось метров 10—15, из хвостовой точки неприятельского самолёта засверкала пулемётная очередь. Пули пролетели с правой стороны кабины, обожгли руку.»
    pometka: один источник
    utverzhden: '2026-11-12'
    sravnenie: 10–15 метров — как длина двух-трёх легковых машин
    istochnik: n3
    dlya_voprosa: true
    otvet: 10–15 метров
    otvet_edinstvennyj: true
  - id: ns-0205-40-protiv-22
    summary: Сбитым «Хейнкелем» командовал 40-летний подполковник с Железным крестом. Талалихину было 22.
    det:
    - Экипажем бомбардировщика командовал опытный подполковник, награждённый Железным крестом ещё за войну против Польши в 1939 году. Его сбил лётчик почти вдвое моложе.
    src: 'Источник: «Красные соколы». Талалихин Виктор Васильевич — https://airaces.narod.ru/winter/talalih.htm'
    stranica: страница лётчика
    href: https://airaces.narod.ru/winter/talalih.htm
    otryvok: «Командир экипажа "Хейнкеля" - 40-летний подполковник, награждённым Железным Крестом за боевые действия против Польши в 1939 году.»
    pometka: один источник
    utverzhden: '2026-11-12'
