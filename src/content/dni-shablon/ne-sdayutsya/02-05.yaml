story:
  kicker: Подвиг
  h2: Виктор Талалихин
  abzacy:
  - Ночь на 7 августа 1941 года, небо над Подмосковьем. Младший лейтенант 177-го истребительного авиационного полка ПВО Виктор Талалихин на истребителе И-16 догоняет немецкий бомбардировщик «Хейнкель-111». Бой идёт 33 минуты. На высоте около 2500 метров у Талалихина кончаются патроны, и он решает таранить. Стрелок «Хейнкеля» с 10–15 метров ранит его в руку, но лётчик не отворачивает.
  - 'Удар — и бомбардировщик падает. Истребитель переворачивается, раненый Талалихин выбрасывается и около 800 метров летит затяжным прыжком, потом раскрывает парашют. «Хейнкель» находят через несколько часов. 8 августа 1941 года Талалихин — Герой Советского Союза. Через 73 года поисковики поднимают его И-16: бортовые часы стоят на 11:30, номер мотора совпадает с архивом.'
