quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — винтом; 2 — 10–15 метров; 3 — 22 года; 4 — 11:30; 5 — сотым.'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: чем Талалихин ударил «Хейнкель», когда кончились патроны?'
    o:
    - Крылом
    - Колёсами
    - Винтом
    - Хвостом
    a: 2
    e: По словам самого лётчика, он решил подойти поближе и винтом отрубить немцу хвост.
  - q: С какого расстояния стрелок «Хейнкеля» ранил Талалихина в руку?
    o:
    - 1–2 метра
    - 10–15 метров
    - 100 метров
    - 500 метров
    a: 1
    e: Когда до врага оставалось 10–15 метров, из хвоста бомбардировщика ударила пулемётная очередь и обожгла лётчику руку.
  - q: Сколько лет было Талалихину в ночь тарана?
    o:
    - '18'
    - '22'
    - '30'
    - '40'
    a: 1
    e: Талалихину было 22 года, а командиру «Хейнкеля» — 40.
  - q: На каком времени остановились бортовые часы И-16, поднятые через 73 года?
    o:
    - 00:00
    - 07:00
    - '11:30'
    - '23:59'
    a: 2
    e: Стрелки стоят на 11:30 — это время ночного тарана.
  - q: Каким по счёту с начала войны лётчиком, пошедшим на таран, был Талалихин?
    o:
    - Первым
    - Десятым
    - Сотым
    - Тысячным
    a: 2
    e: За полтора месяца войны на таран пошли уже 99 советских лётчиков, Талалихин — сотый.
