  - id: ns-0205-chasy-11-30
    summary: Через 73 года из земли подняли часы его И-16. Стрелки стоят на 11:30, это время тарана.
    det:
    - В 2014 году поисковики поднимают из земли обломки истребителя Талалихина. В кабине с приборной доской находят бортовые часы. Они остановились на 11:30 — в час ночного тарана.
    src: 'Источник: М. Поляков. «Летопись краснозвёздного истребителя», «Военно-исторический журнал» — http://history.milportal.ru/letopis-krasnozvyozdnogo-istrebitelya/'
    stranica: статья
    href: http://history.milportal.ru/letopis-krasnozvyozdnogo-istrebitelya/
    otryvok: «…часы остановились на времени 11:30, что совпадает с временем ночного тарана.»
