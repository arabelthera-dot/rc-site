vizual:
  imya: talalihin-heinkel
  vid: predmet
  kicker: Снимок под лупой
  h2: Обломки «Хейнкеля»
  lead: 'Так выглядел немецкий бомбардировщик, сбитый тараном Талалихина, на снимке августа 1941 года. Приближайте: смятые крылья и корпус, а впереди — купол парашюта.'
audioguide:
  audioSrc: audio-guide-talalihin-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от ночного неба над Подмосковьем через раненую руку и таран — к прыжку с восьмисот метров и Звезде Героя: пять остановок.'
  stops:
    - t: 0
      mark: '0:00'
      title: 'Ночь на 7 августа'
    - t: 22
      mark: '0:22'
      title: 'Раненая рука'
    - t: 42
      mark: '0:42'
      title: 'Таран'
    - t: 64
      mark: '1:04'
      title: '800 метров вниз'
    - t: 86
      mark: '1:26'
      title: 'Герой через сутки'
  transcript:
    - 'Ночь на седьмое августа тысяча девятьсот сорок первого года, небо над Подмосковьем. Младший лейтенант Виктор Талалихин на истребителе И-16 догоняет немецкий бомбардировщик «Хейнкель». С начала войны прошло полтора месяца. Ночной бой идёт тридцать три минуты.'
    - 'Стрелок «Хейнкеля» прошивает ему руку с десяти-пятнадцати метров. Талалихин не отворачивает. Патроны кончились — и он идёт на таран.'
    - 'Винтом он отрубает хвост «Хейнкелю». Бомбардировщиком командует сорокалетний подполковник с Железным крестом. Талалихину двадцать два. Пятый немец успевает выпрыгнуть, двадцать дней пробирается к своим и попадает в плен под Смоленском.'
    - 'Раненый Талалихин выпадает из перевёрнутого самолёта и восемьсот метров летит вниз, не раскрывая парашюта. И остаётся жив. «Хейнкель» находят через несколько часов, с документами экипажа, — таран нельзя оспорить.'
    - 'Восьмого августа, через сутки, Талалихин — Герой Советского Союза. Гитлер вёл «книгу личных врагов». Против фамилии Талалихин там стояло: «Уничтожен». Через семьдесят три года из земли подняли его И-16: стрелки часов стоят на одиннадцати тридцати, номер мотора совпал с архивом. Ниже — викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
