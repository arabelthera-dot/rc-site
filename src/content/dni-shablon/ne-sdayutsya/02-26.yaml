story:
  kicker: Подвиг
  h2: Святитель Лука
  abzacy:
  - Валентин Войно-Ясенецкий был земским хирургом, затем профессором в Ташкенте. В 1921 году он принял сан священника, в 1923-м стал епископом Лукой — и в том же году был арестован и отправлен в первую ссылку, в Туруханский край. Всего на его долю пришлись три ссылки и годы тюрем.
  - 'В 1937 году его снова арестовали в Ташкенте: тринадцать суток допроса «конвейером», требования признаться в шпионаже и отречься от сана. Он не признал вину. 13 февраля 1940 года вынесли приговор — пять лет ссылки в Красноярский край. В Большой Мурте он оперировал в районной больнице, а с войной стал хирургом эвакогоспиталя в Красноярске. В 1946 году за «Очерки гнойной хирургии» получил Сталинскую премию.'
