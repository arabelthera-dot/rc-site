quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 13 суток; 2 — 7 дней; 3 — 130 тысяч; 4 — в пользу какого государства он шпионил; 5 — слепой, которого он вылечил.'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: сколько суток длился допрос «конвейером»?'
    o:
    - '3'
    - '7'
    - '13'
    - '30'
    a: 2
    e: Тринадцать суток без сна — и он не оговорил себя.
  - q: Сколько дней голодал хирург, когда от него требовали отречься от сана?
    o:
    - '2'
    - '7'
    - '15'
    - '40'
    a: 1
    e: Семь дней, до рвоты кровью, — и не отрёкся.
  - q: Сколько из 200 тысяч Сталинской премии он отдал детским домам?
    o:
    - 10 тысяч
    - 50 тысяч
    - 130 тысяч
    - 200 тысяч
    a: 2
    e: 130 тысяч — две трети огромной суммы.
  - q: Что он спросил у следователей, когда его обвинили в шпионаже?
    o:
    - Сколько ему дадут
    - В пользу какого государства он шпионил
    - Кто на него донёс
    - Можно ли позвать адвоката
    a: 1
    e: Ответить следователи не смогли.
  - q: Кто поднял базар, когда хирурга уволили в Фатеже?
    o:
    - Городской голова
    - Священник
    - Слепой, которого он вылечил
    - Студенты
    a: 2
    e: Вылеченный слепой влез на бочку, и толпа пошла громить управу.
