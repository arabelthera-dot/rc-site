vizual:
  imya: luka-ocherki
  vid: dokument
  kicker: Снимок под лупой
  h2: Книга из ссылки
  lead: 'Эту книгу он писал между тюрьмами и ссылками, а дописал в Большой Мурте. Приблизь снимок: первое издание «Очерков гнойной хирургии», 1934 год.'
audioguide:
  audioSrc: audio-guide-luka-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от суда в Ташкенте через тюрьму и ссылки — к госпиталю и премии: пять остановок.'
  stops:
  - t: 0
    mark: 0:00
    title: Суд
  - t: 22
    mark: 0:22
    title: Икона
  - t: 44
    mark: 0:44
    title: Тюрьма
  - t: 66
    mark: '1:06'
    title: Ссылка и госпиталь
  - t: 88
    mark: '1:28'
    title: Премия
  transcript:
  - 'Ташкент, суд. Чекист спросил хирурга: «Вы видели Бога?» Ответ: «Бога я действительно не видел. Но я много оперировал на мозге и, открывая черепную коробку, никогда не видел там также и ума». Зал хохотал. Показательный суд провалился.'
  - Икону сняли из операционной — хирург не оперировал, пока её не вернули. Наутро икона действительно висела на месте. Один против комиссии, и власть уступила.
  - Его обвинили в шпионаже. Он спросил, в пользу какого государства, — следователи ответить не смогли. Тринадцать суток допроса без сна, голову обливали холодной водой. От него требовали отречься от сана — он голодал семь дней и не отрёкся.
  - 'Ссыльный епископ телеграфировал Калинину: дайте раненых, а после войны вернусь в ссылку. В шестьдесят четыре года он стал консультантом всех госпиталей Красноярского края. Раненые, чьи суставы он спас, салютовали ему поднятыми прямыми ногами.'
  - 'За «Очерки гнойной хирургии» ему дали Сталинскую премию — двести тысяч рублей. Сто тридцать тысяч он отдал детским домам. Хирург-архиепископ: в ссылках продолжал оперировать и не отрёкся.'
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
