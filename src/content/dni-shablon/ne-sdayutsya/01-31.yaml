      - summary: <b>Подполковник Смирнов повёл советских пленных на охрану Бухенвальда — они взяли склад оружия.</b>
        det:
          - К апрелю 1945 года у подполья было 178 боевых групп, всего около двух тысяч человек. Треть из них были советские военнопленные. Ими командовал подполковник Иван Иванович Смирнов, а отряды Виктора Хазанова и Валентина Логунова в день восстания прорвались через проволочное заграждение и захватили склад вооружения.
        src: "Источник: «Бухенвальдский набат…», «Родина», 11 апреля 2025 — https://rodina-history.ru/2025/04/11/buhenvaldskij-nabat-80-let-nazad-uzniki-konclageria-podniali-vosstanie.html; «Победители. Концлагерь Бухенвальд освободили его узники», А. Сидорчик, АиФ, 11 апреля 2014 — https://aif.ru/society/history/pobediteli_konclager_buhenvald_osvobodili_ego_uzniki"
        stranica: «Бухенвальдский набат…», «Родина», 11 апреля 2025
        href: https://rodina-history.ru/2025/04/11/buhenvaldskij-nabat-80-let-nazad-uzniki-konclageria-podniali-vosstanie.html
        otryvok: «Командиром отрядов советских военнопленных стал подполковник Иван Иванович Смирнов - заключенные уважительно называли его "нашим комкором" (командиром корпуса). Отряды под командованием Виктора Хазанова и Валентина Логунова прорвались через проволочное заграждение и захватили склад вооружения.»
        pometka: два источника
        kadr:
