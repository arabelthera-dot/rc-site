story:
  kicker: Подвиг
  h2: Ринг за колючей проволокой
  abzacy:
    - Борзенко выходил на лагерный ринг около 80 раз и не проиграл ни одного боя.
    - Борзенко дважды пытался бежать из лагеря для пленных, и за это его отправили в Бухенвальд.
    - 11 апреля 1945 года Борзенко с товарищами захватил одну из сторожевых вышек Бухенвальда.
    - Узник Борзенко, нокаутировавший нацистов, после войны стал хирургом высшей категории.
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Боксёр, который не сдался
    udary:
      - summary: <b>Борзенко выходил на лагерный ринг около 80 раз и не проиграл ни одного боя.</b>
        det:
          - Пленного красноармейца, бывшего чемпиона Узбекистана, эсэсовцы заставляли драться на потеху охране. Против него выставляли уголовников, охранников и профессионалов из СС. По данным «Советского спорта», с 1942 по 1945 год он провёл около 80 боёв без единого поражения. Число боёв известно со слов семьи и из публикаций, лагерных протоколов нет.
        src: "Источник: «Провёл 80 боёв в Бухенвальде. После побега из концлагеря продолжил уничтожать нацистов», А. Губин, «Советский спорт» — https://www.sovsport.ru/boxing/articles/provyol-80-boyov-v-buhenvalde-posle-pobega-iz-konczlagerya-prodolzhil-unichtozhat-naczistov"
        stranica: «Провёл 80 боёв в Бухенвальде. После побега из концлагеря продолжил уничтожать нацистов», А. Губин, «Советский спорт»
        href: https://www.sovsport.ru/boxing/articles/provyol-80-boyov-v-buhenvalde-posle-pobega-iz-konczlagerya-prodolzhil-unichtozhat-naczistov
        otryvok: «Несмотря на истощение и раны, Борзенко провёл около 80 боёв с 1942 по 1945 год, не потерпев ни одного поражения.»
        pometka: легенда
        utverzhden: 2026-11-03
      - summary: <b>Борзенко четыре раунда терпел запрещённые удары громилы Вилли — и нокаутировал его.</b>
        det:
          - Одним из главных боёв стала встреча с огромным немцем Вилли; «Советский спорт» называет его чемпионом СС в тяжёлом весе, Lenta.ru — бывшим профессиональным боксёром, сидевшим по уголовной статье. Четыре раунда Вилли бил запрещёнными ударами. Когда он решил, что противник выдохся, и пошёл добивать, Борзенко ответил точным ударом в челюсть и отправил его в нокаут.
        src: "Источник: «Красный гладиатор Бухенвальда. Как советский боксёр побил более 80 фашистов в концлагере», С. Перемутов, «Советский спорт», 9 мая 2023 — https://www.sovsport.ru/boxing/articles/2:1065038; «„Он налетел на немца, как зверь“…», Lenta.ru, 26 октября 2025 — https://lenta.ru/articles/2025/10/26/on-naletel-kak-zver/"
        stranica: «Красный гладиатор Бухенвальда. Как советский боксёр побил более 80 фашистов в концлагере», С. Перемутов, «Советский спорт», 9 мая 2023
        href: https://www.sovsport.ru/boxing/articles/2:1065038
        otryvok: «Справился и с неким Вилли, чемпионом СС в тяжёлом весе. … Четыре раунда соперник бил заключённого, не стесняясь никаких запрещённых ударов. Борзенко получал ногой в пах и по лицу локтями, но держался. Улучив момент, советский боксёр контратаковал фашиста, да так, что тот улетел в нокаут.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Борзенко выходил на ринг, чтобы эсэсовцы смотрели бой, а подпольщики собирали оружие.</b>
        det:
          - "По рассказам, Борзенко был связан с подпольем Бухенвальда (документов об этом нет). Его бои собирали охрану у ринга. Участник подполья В. Власов вспоминал: «Бои на ринге отвлекали эсэсовцев от выполнения служебных обязанностей, их бдительность притуплялась». По книге Свиридова, ради этого и ради того, чтобы прекратить избиения товарищей, герой и выходил на ринг."
        src: "Источник: «Красный гладиатор Бухенвальда…», «Советский спорт», 9 мая 2023 — https://www.sovsport.ru/boxing/articles/2:1065038"
        stranica: «Красный гладиатор Бухенвальда…», «Советский спорт», 9 мая 2023
        href: https://www.sovsport.ru/boxing/articles/2:1065038
        otryvok: «Бои на ринге отвлекали эсэсовцев от выполнения служебных обязанностей, их бдительность притуплялась»
        pometka: легенда
        utverzhden: 2026-11-03
      - summary: <b>Изголодавшийся узник Борзенко нокаутировал чемпиона Гамбурга во втором раунде.</b>
        det:
          - Первым противником Борзенко на лагерном ринге стал профессионал, чемпион Гамбурга. Узник отправил его в нокаут во втором раунде. Наградой за победу стали булка хлеба и банка тушёнки.
        src: "Источник: «Красный гладиатор Бухенвальда…», «Советский спорт», 9 мая 2023 — https://www.sovsport.ru/boxing/articles/2:1065038"
        stranica: «Красный гладиатор Бухенвальда…», «Советский спорт», 9 мая 2023
        href: https://www.sovsport.ru/boxing/articles/2:1065038
        otryvok: «В первом бою Андрею предстояло подраться с профессиональным боксёром, чемпионом Гамбурга. … Пленник нокаутировал немца во втором раунде и в награду получил булку хлеба и банку тушёнки.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>11 апреля 1945 года Борзенко с товарищами захватил одну из сторожевых вышек Бухенвальда.</b>
        det:
          - Борзенко был среди активных участников восстания и вместе с несколькими товарищами захватил одну из смотровых вышек лагеря. Узники атаковали гарнизон самодельными гранатами, камнями и палками. К пяти часам вечера восставшие держали весь лагерь, и американские войска вошли уже в освобождённый Бухенвальд.
        src: "Источник: Lenta.ru, 26 октября 2025 — https://lenta.ru/articles/2025/10/26/on-naletel-kak-zver/; «Бухенвальдский набат: 80 лет назад узники концлагеря подняли восстание», Е. Зайцева, «Родина», 11 апреля 2025 — https://rodina-history.ru/2025/04/11/buhenvaldskij-nabat-80-let-nazad-uzniki-konclageria-podniali-vosstanie.html"
        stranica: Lenta.ru, 26 октября 2025
        href: https://lenta.ru/articles/2025/10/26/on-naletel-kak-zver/
        otryvok: «Среди активных участников восстания был Борзенко, который вместе с несколькими товарищами успешно захватил одну из смотровых вышек.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Борзенко отправил немца Гельмута в нокдаун девять раз на первом послевоенном чемпионате.</b>
        det:
          - "В 1947 году на чемпионате Узбекской ССР по жребию ему достался немец по имени Гельмут. Писатель Георгий Свиридов видел этот бой: «После удара гонга он, как зверь, налетел на немца». Гельмут девять раз падал в нокдаун. Свиридов пошёл узнать, откуда такая ярость, и услышал историю Бухенвальда."
        src: "Источник: Lenta.ru, 26 октября 2025 — https://lenta.ru/articles/2025/10/26/on-naletel-kak-zver/; «Правда и мифы о русском боксере в Бухенвальде», П. Садков, «Комсомольская правда», 29 июня 2022 — https://www.kp.ru/sports/boks/pravda-i-mify-o-russkom-boksere-v-buhenvalde/"
        stranica: Lenta.ru, 26 октября 2025
        href: https://lenta.ru/articles/2025/10/26/on-naletel-kak-zver/
        otryvok: «После удара гонга он, как зверь, налетел на немца»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Борзенко дважды пытался бежать из лагеря для пленных, и за это его отправили в Бухенвальд.</b>
        det:
          - "Летом 1941 года Борзенко был тяжело ранен в ногу и попал в плен; «Советский спорт» называет бои в треугольнике Луцк — Броды — Дубно, Lenta.ru — отход через Днепр под Киевом в августе. Из первого лагеря он дважды пытался бежать, и в 1942 году его перевели в Бухенвальд. Где был первый лагерь, источники тоже расходятся: «под Дрезденом» или «близ Ганновера»."
        src: "Источник: «Советский спорт» (А. Губин) — https://www.sovsport.ru/boxing/articles/provyol-80-boyov-v-buhenvalde-posle-pobega-iz-konczlagerya-prodolzhil-unichtozhat-naczistov; Lenta.ru, 26 октября 2025 — https://lenta.ru/articles/2025/10/26/on-naletel-kak-zver/"
        stranica: «Советский спорт» (А. Губин)
        href: https://www.sovsport.ru/boxing/articles/provyol-80-boyov-v-buhenvalde-posle-pobega-iz-konczlagerya-prodolzhil-unichtozhat-naczistov
        otryvok: «Он дважды пытался бежать, но оба раза был пойман, после чего подвергся пыткам.»
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-31-goskatalog-5878363.jpg
          alt: "Набросок пером: исхудавшие узники в шапках за столом, сверху крупно лицо пожилого заключённого"
          data_source: https://goskatalog.ru/portal/#/collections?id=5878363
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Александр Ханько. Рисунок «Бухенвальд»: узники Малого лагеря, блок 55."
          credit: "Автор: А. Н. Ханько. Хранится: ФГБУК «Государственный музей политической истории России»."
