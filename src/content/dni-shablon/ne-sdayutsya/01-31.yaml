      - summary: <b>Узники Бухенвальда за первые полчаса восстания взяли в плен около 200 эсэсовцев.</b>
        det:
          - 11 апреля 1945 года, когда к лагерю подходили американцы, подполье подняло восстание. «В течение первого получаса в руки заключённых попали около 200 эсэсовцев». К пяти часам вечера лагерь был в руках восставших.
        src: "Источник: «Бухенвальдский набат…», «Родина», 11 апреля 2025 — https://rodina-history.ru/2025/04/11/buhenvaldskij-nabat-80-let-nazad-uzniki-konclageria-podniali-vosstanie.html"
        stranica: «Бухенвальдский набат…», «Родина», 11 апреля 2025
        href: https://rodina-history.ru/2025/04/11/buhenvaldskij-nabat-80-let-nazad-uzniki-konclageria-podniali-vosstanie.html
        otryvok: «В течение первого получаса в руки заключённых попали около 200 эсэсовцев»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-31-goskatalog-7736023.jpg
          alt: "Литография: узники ломают лагерные ворота, один замахивается прикладом на падающего охранника; позади бараки и ограда с вышкой"
          data_source: https://goskatalog.ru/portal/#/collections?id=7736023
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Фриц Кремер. «Восстание в Бухенвальде». Литография.
          credit: "Автор: Фриц Кремер (немецкий скульптор, автор памятника в Бухенвальде). Хранится: ФГБУК «Государственный музей изобразительных искусств имени А. С. Пушкина»."
          width: 800
          height: 648
        utverzhden: 2026-11-03
      - summary: <b>Подполковник Смирнов повёл советских пленных на охрану Бухенвальда — они взяли склад оружия.</b>
        det:
          - К апрелю 1945 года у подполья было 178 боевых групп, всего около двух тысяч человек. Треть из них были советские военнопленные. Ими командовал подполковник Иван Иванович Смирнов, а отряды Виктора Хазанова и Валентина Логунова в день восстания прорвались через проволочное заграждение и захватили склад вооружения.
        src: "Источник: «Бухенвальдский набат…», «Родина», 11 апреля 2025 — https://rodina-history.ru/2025/04/11/buhenvaldskij-nabat-80-let-nazad-uzniki-konclageria-podniali-vosstanie.html; «Победители. Концлагерь Бухенвальд освободили его узники», А. Сидорчик, АиФ, 11 апреля 2014 — https://aif.ru/society/history/pobediteli_konclager_buhenvald_osvobodili_ego_uzniki"
        stranica: «Бухенвальдский набат…», «Родина», 11 апреля 2025
        href: https://rodina-history.ru/2025/04/11/buhenvaldskij-nabat-80-let-nazad-uzniki-konclageria-podniali-vosstanie.html
        otryvok: «Командиром отрядов советских военнопленных стал подполковник Иван Иванович Смирнов - заключенные уважительно называли его "нашим комкором" (командиром корпуса). Отряды под командованием Виктора Хазанова и Валентина Логунова прорвались через проволочное заграждение и захватили склад вооружения.»
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-31-goskatalog-36644928.jpg
          alt: Чёрно-белый портрет мужчины с усами в тёмном костюме; в углу дарственная надпись музею
          data_source: https://goskatalog.ru/portal/#/collections?id=36644928
