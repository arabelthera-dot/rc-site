audioguide:
  audioSrc: audio-guide-borzenko-ru.mp3
  durationLabel: 1 минута 31 секунда
  lead: "Голос ведёт от плена и побегов через лагерный ринг Бухенвальда и восстание — к операционной в Ташкенте: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Плен
    - t: 15
      mark: 0:15
      title: Ринг
    - t: 39
      mark: 0:39
      title: Бои для подполья
    - t: 57
      mark: 0:57
      title: Восстание
    - t: 73
      mark: 1:13
      title: После войны
  transcript:
    - <p>Летом тысяча девятьсот сорок первого года красноармеец Андрей Борзенко, бывший чемпион Узбекистана по боксу, тяжело ранен в ногу и попадает в плен. Из первого лагеря под Дрезденом он дважды пытается бежать, и в тысяча девятьсот сорок втором году его переводят в Бухенвальд.</p>
    - <p>Эсэсовцы заставляют пленного драться на потеху охране. Первый противник — профессионал, чемпион Гамбурга; изголодавшийся узник отправляет его в нокаут во втором раунде. Четыре раунда терпит он запрещённые удары громилы Вилли, чемпиона СС в тяжёлом весе, — и нокаутирует его ударом в челюсть. С тысяча девятьсот сорок второго по тысяча девятьсот сорок пятый год — около восьмидесяти боёв без единого поражения.</p>
    - "<p>Борзенко связан с подпольем Бухенвальда. Бои собирают охрану у ринга. Участник подполья вспоминал: «Бои на ринге отвлекали эсэсовцев от выполнения служебных обязанностей, их бдительность притуплялась». Тем временем подпольщики тайком мастерят больше сотни ручных гранат.</p>"
    - <p>Одиннадцатого апреля тысяча девятьсот сорок пятого года подполье поднимает восстание. Борзенко с товарищами захватывает одну из сторожевых вышек. За первые полчаса в руки узников попадают около двухсот эсэсовцев, к пяти часам вечера весь лагерь в руках восставших.</p>
    - <p>После освобождения Борзенко служит в военной контрразведке СМЕРШ, в тысяча девятьсот сорок седьмом году становится чемпионом Ташкента, а потом до конца жизни работает хирургом. Писатель Георгий Свиридов видит его на ринге в тысяча девятьсот сорок седьмом году и через четырнадцать лет выводит в романе «Ринг за колючей проволокой» под именем Андрей Бурзенко.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
