    - q: Сколько боёв Борзенко провёл на лагерном ринге без поражений?
      o:
        - Около 10
        - Около 30
        - Около 80
        - Около 200
      a: 2
      e: С 1942 по 1945 год он провёл около 80 боёв. Против него ставили уголовников, охранников и профессионалов из СС — и ни один не победил.
    - q: Зачем, по воспоминаниям подпольщиков, были нужны бои Борзенко?
      o:
        - Чтобы получить свободу
        - Чтобы отвлечь эсэсовцев, пока подполье собирало оружие
        - Чтобы попасть в сборную
        - Чтобы перейти в другой лагерь
      a: 1
      e: "Подпольщик В. Власов вспоминал: «Бои на ринге отвлекали эсэсовцев от выполнения служебных обязанностей, их бдительность притуплялась»."
    - q: Что Борзенко захватил с товарищами в день восстания, 11 апреля 1945 года?
      o:
        - Комендатуру
        - Железнодорожную станцию
        - Одну из сторожевых вышек лагеря
        - Радиостанцию
      a: 2
      e: Узники атаковали гарнизон самодельными гранатами, камнями и палками. К пяти часам вечера восставшие держали весь лагерь.
    - q: Как называется роман Георгия Свиридова о Борзенко?
      o:
        - «Ринг за колючей проволокой»
        - «Нокаут в Бухенвальде»
        - «Чемпион»
        - «Последний раунд»
      a: 0
      e: Свиридов увидел бой Борзенко в 1947 году и выпустил роман в 1961-м. В книге герой зовётся Андрей Бурзенко.
    - q: Кем Борзенко работал после войны до конца жизни?
      o:
        - Тренером
        - Хирургом
        - Учителем
        - Шофёром
      a: 1
      e: Вернувшись в Ташкент, он доучился в медицинском институте и стал хирургом высшей категории. Умер 21 февраля 1993 года.
