story:
  kicker: Подвиг
  h2: Андрей Борзенко
  abzacy:
    - Пленного красноармейца Андрея Борзенко, бывшего чемпиона Узбекистана, эсэсовцы выводили на ринг на потеху охране. Против него ставили уголовников, охранников и профессионалов из СС. С 1942 по 1945 год он провёл около 80 боёв и не проиграл ни одного. Пока охрана смотрела бой, подпольщики Бухенвальда собирали оружие.
    - 11 апреля 1945 года подполье подняло восстание. Борзенко с товарищами захватил одну из сторожевых вышек, за первые полчаса восставшие взяли в плен около 200 эсэсовцев, к пяти часам вечера весь лагерь был в их руках. После войны Борзенко вернулся в Ташкент, выиграл чемпионат города и до конца жизни работал хирургом.
