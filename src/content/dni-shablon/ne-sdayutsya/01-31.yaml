  lead: 'Лоскут полосатой лагерной ткани бывшего узника Бухенвальда А. В. Иваницкого. Приближайте: красный треугольник с буквой R, номер 24667, набитый по трафарету, и чёрные стежки, которыми нашивки пришиты к ткани.'
audioguide:
  audioSrc: audio-guide-borzenko-ru.mp3
  durationLabel: около двух минут
  lead: "Голос ведёт по судьбе узника Андрея Борзенко: от лагерного ринга Бухенвальда, где он не проиграл ни одного боя, через восстание к операционной в Ташкенте."
  stops:
    - t: 0
      mark: '0:00'
      title: Громила Вилли
    - t: 31
      mark: '0:31'
      title: Бои для подполья
    - t: 59
      mark: '0:59'
      title: Сторожевая вышка
    - t: 88
      mark: '1:28'
      title: Девять нокдаунов
    - t: 118
      mark: '1:58'
      title: Хирург высшей категории
  transcript:
    - Пленного красноармейца Андрея Борзенко, бывшего чемпиона Узбекистана, эсэсовцы заставляли драться на потеху охране. Одним из главных боёв стала встреча с огромным немцем Вилли, чемпионом в тяжёлом весе. Четыре раунда Вилли бил запрещёнными ударами. Когда он решил, что противник выдохся, и пошёл добивать, Борзенко ответил точным ударом в челюсть и отправил его в нокаут. Против него выставляли уголовников, охранников и профессионалов, и около восьмидесяти раз он выходил на лагерный ринг без единого поражения.
    - "Первым противником изголодавшегося узника стал профессионал, чемпион Гамбурга, и Борзенко нокаутировал его во втором раунде. Наградой стали булка хлеба и банка тушёнки. Борзенко был связан с подпольем Бухенвальда, и его бои собирали охрану у ринга. Участник подполья Власов вспоминал: «Бои на ринге отвлекали эсэсовцев от выполнения служебных обязанностей, их бдительность притуплялась». Оружие для восстания собирали годами, подпольщики тайком смастерили «более сотни ручных гранат»."
    - Одиннадцатого апреля тысяча девятьсот сорок пятого года подполье подняло восстание. Советскими военнопленными командовал подполковник Иван Иванович Смирнов, и отряды Виктора Хазанова и Валентина Логунова прорвались через проволочное заграждение и захватили склад вооружения. Борзенко с несколькими товарищами захватил одну из сторожевых вышек. Узники атаковали гарнизон самодельными гранатами, камнями и палками. За первые полчаса в плен попали около двухсот эсэсовцев, к пяти часам вечера весь лагерь был в руках восставших.
    - "В плен Борзенко попал летом тысяча девятьсот сорок первого года, тяжело раненный в ногу. Из первого лагеря под Дрезденом он дважды пытался бежать, и за это его отправили в Бухенвальд. В тысяча девятьсот сорок седьмом году на первом послевоенном чемпионате ему по жребию достался немец по имени Гельмут. Писатель Георгий Свиридов видел этот бой: «После удара гонга он, как зверь, налетел на немца». Гельмут девять раз падал в нокдаун."
    - Свиридов пошёл узнать, откуда такая ярость, и услышал историю Бухенвальда. Через четырнадцать лет вышел его роман «Ринг за колючей проволокой», где боксёр стал Андреем Бурзенко. После освобождения Борзенко служил в военной контрразведке, но «родственникам он никогда об этом не рассказывал». Вернувшись в Ташкент, он стал чемпионом города, возобновил учёбу в медицинском институте и до конца жизни работал хирургом. Он умер двадцать первого февраля тысяча девятьсот девяносто третьего года.
  note: Озвучено синтезом речи.
