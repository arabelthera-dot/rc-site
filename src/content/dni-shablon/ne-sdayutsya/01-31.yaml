      - summary: <b>Свиридов заметил Борзенко в 1947 году и через 14 лет вывел его на ринг романа как Бурзенко.</b>
        det:
          - Свиридов лично знал боксёра и впервые обратил на него внимание в 1947 году. Роман «Ринг за колючей проволокой» вышел в 1961 году. В нём Андрей Бурзенко — подпольщик, который выходит на ринг, чтобы прикрыть товарищей. Подробно описаны три боя.
        src: "Источник: «Правда и мифы о русском боксере в Бухенвальде», «Комсомольская правда», 29 июня 2022 — https://www.kp.ru/sports/boks/pravda-i-mify-o-russkom-boksere-v-buhenvalde/"
