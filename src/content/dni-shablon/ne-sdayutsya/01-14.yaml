vizual:
  imya: vir-isaakievskaya
  vid: dokument
  kicker: Рисунок под лупой
  h2: Исаакиевская площадь, март 1942
  lead: 'Сюда, к подвалу с картофелем коллекции, дважды в день ходил Вадим Лехнович. Так площадь нарисовал Николай Быльев-Протопопов. Приближайте: санки, вёдра, памятник Николаю I.'
audioguide:
  audioSrc: audio-guide-vir-ru.mp3
  durationLabel: 1 минута 32 секунды
  lead: "Голос ведёт от поезда, вернувшегося со станции Мга, до полей после войны: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Коллекция
    - t: 20
      mark: 0:20
      title: Поезд
    - t: 41
      mark: 0:41
      title: Зима
    - t: 60
      mark: 1:00
      title: Ладога
    - t: 73
      mark: 1:13
      title: Поля
  transcript:
    - "Исаакиевская площадь, Ленинград. В здании Всесоюзного института растениеводства хранится коллекция семян со всего мира — двести пятьдесят тысяч образцов. Её собирали экспедиции Николая Вавилова. Это не запас еды, а живой фонд: из этих семян выводят новые сорта."
    - "Лето сорок первого. Часть коллекции улетает на Урал самолётом. Почти сто тысяч образцов грузят в поезд. Тридцатого августа состав подходит к станции Мга — она уже занята врагом. Поезд возвращается. Через несколько дней город в кольце."
    - "Зима сорок первого — сорок второго. Хранители получают по сто двадцать пять граммов хлеба в день. Крысы сбрасывают коробки с семенами — люди связывают коробки между собой. Дмитрий Иванов умирает от голода в кабинете, где лежат десятки килограммов риса и гречихи."
    - "Весной сорок второго Григория Рубцова вывозят через Ладогу. Он умирает в дороге. В нагрудном кармане у него находят мешочек с семенами. Нетронутый."
    - "Большая часть коллекции пережила блокаду. После войны из спасённых семян вывели новые сорта. Сегодня в коллекции больше трёхсот двадцати тысяч образцов. Люди, которые её хранили, умирали от голода рядом с зерном — и не сдались."
  note: Озвучено синтезом речи.
