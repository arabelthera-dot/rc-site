story:
  kicker: Среда подвига
  h2: Зерно, которое нельзя есть
  abzacy:
    - Всесоюзный институт растениеводства стоит на Исаакиевской площади, в самом центре Ленинграда. В 1920–1930-е годы им руководил Николай Вавилов. Экспедиции института объехали полмира и свезли сюда семена пшеницы, ячменя, риса, кукурузы, овса, бобовых, овощей и масличных — <b>к началу войны 250 тысяч образцов, самую богатую коллекцию на свете.</b>
    - "Это не запас продовольствия, а живой фонд: из таких семян селекционеры выводят новые сорта. Съесть образец — значит потерять его навсегда. Когда в сентябре 1941 года кольцо блокады замкнулось, коллекция осталась в городе, где люди умирали от голода."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Сотрудники ВИР и коллекция семян — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: "<b>Лехнович признался: умирая от голода, не съесть коллекцию было нетрудно — «нисколько!»</b>"
        det:
          - "Хранители, как все служащие блокадного города, получали 125 граммов хлеба в день, и ни один не взял из коллекции. Вадим Лехнович, хранитель коллекции картофеля и соратник Вавилова, блокадной зимой 1941/42 года охранял клубни в подвале института. Годы спустя он объяснял, что съесть коллекцию было «невозможно»: это было дело всей жизни его и его товарищей. ВИР привёл эти слова в рассказе о концерте к 80-летию исполнения «Ленинградской» симфонии."
        src: "Источник: «Умереть от голода, но сохранить уникальную коллекцию семян: подвиг сотрудников НИИ Вавилова», «Наука ТВ» — https://naukatv.ru/articles/umeret_ot_goloda_no_spasti_semena; «ВИР – 80-летию Ленинградской симфонии Дмитрия Шостаковича», сайт ВИР, 09.08.2022 — https://www.vir.nw.ru/blog/2022/08/09/vir-80-letiyu-leningradskoj-simfonii-dmitriya-shostakovicha/; Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html (125 граммов)"
        stranica: "«Умереть от голода, но сохранить уникальную коллекцию семян: подвиг сотрудников НИИ Вавилова», «Наука ТВ»"
        href: https://www.vir.nw.ru/blog/2022/08/09/vir-80-letiyu-leningradskoj-simfonii-dmitriya-shostakovicha/
        otryvok: «Ходить было трудно… Да, невыносимо трудно было вставать, руками-ногами двигать… А не съесть коллекцию – трудно не было. Нисколько! Потому что съесть ее было невозможно. Дело всей жизни, дело жизни моих товарищей…»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-14-goskatalog-57423967.jpg
          alt: Портрет пожилого мужчины с длинной белой бородой
          data_source: https://goskatalog.ru/portal/#/collections?id=57423967
          license: фотограф Романович Э. К.; ст. 1274 ГК РФ, с указанием автора и музея (водяной знак ГМИ СПб в кадре)
          podpis: Вадим Степанович Лехнович. Фотография Э. К. Романовича, 1973 год.
          credit: ГМИ СПб, инв. II-А-22838 н, ГИК ГМИ СПб 70006
          width: 610
          height: 600
        utverzhden: 2026-11-03
      - summary: <b>Рубцов умер после переправы через Ладогу, на груди у него нашли сохранённый мешочек семян.</b>
        det:
          - "Старшего научного сотрудника отдела плодовых Григория Рубцова эвакуировали через Ладогу, и он умер от дистрофии; на его груди нашли сохранённый мешочек с семенами. «Родина» относит его смерть к весне 1942 года, «Коммерсантъ» пишет, что он умер в больничном пункте через несколько часов после переправы. В феврале 1942 года из институтов ВАСХНИЛ эвакуировали 300 человек, в том числе сотрудников ВИР: трое суток в промёрзших вагонах до Борисовой Гривы, 7 км пешком до Осиновца, потом на грузовиках по льду, людей в кузовах привязывали, чтобы не выпали. Мешочек с семенами висел на шее у каждого эвакуированного сотрудника ВИР, ещё трое сотрудников не перенесли дороги в теплушках."
        src: "Источник: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html; Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501; презентация «Научная деятельность ВИР в годы блокады», сайт ВИР, 2021 — http://www.vir.nw.ru/wp-content/uploads/2021/12/Блокада-ВИР.pdf"
        stranica: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019
        href: https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html
        otryvok: «Весной 1942 года умер от дистрофии по дороге из блокадного Ленинграда через Ладогу. На его груди нашли сохраненный мешочек с семенами.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Щукин умер, сжимая пакет редкого арахиса, который готовил к отправке на Урал.</b>
        det:
          - Хранитель масличных культур Александр Щукин в последние дни готовил дублет арахиса — запасной образец, который должен был улететь самолётом в Красноуфимск. 27 ноября 1941 года он умер от дистрофии в кабинете, заставленном орехами, с пакетом в руках. Коллеги вспоминали, что уже истощённым он собирал с пола каждое рассыпанное семечко. Заведующий отделом крупяных Дмитрий Иванов умер от голода 9 января 1942 года в кабинете, где хранились десятки килограммов риса, кукурузы, гречихи и проса (Родина, 2019; Наука ТВ).
        src: "Источник: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html; сюжет телеканала «Санкт-Петербург» — https://tvspb.ru/programs/stories/515946; «Умереть от голода, но сохранить уникальную коллекцию семян: подвиг сотрудников НИИ Вавилова», «Наука ТВ» — https://naukatv.ru/articles/umeret_ot_goloda_no_spasti_semena ; Пометка: дата смерти Щукина — по «Родине»; «Наука ТВ» — январь 1942-го"
        stranica: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019
        href: https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html
        otryvok: «Последней работой Александра Щукина стала подготовка дублета арахиса - дублирующего образца. Исследователь планировал отправить его в Красноуфимск самолетом. Но не успел. Он умер, сжимая в руках пакет арахиса редкого сорта.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Камераз один копал картофель под обстрелом и ушёл из Павловска с последней партией перед немцами.</b>
        det:
          - "Коллекция картофеля росла на Павловской экспериментальной базе ВИР «Красный пахарь». Летом 1941 года коллекционное поле стало передовой: Абрам Камераз каждый день ездил туда из города и выкапывал клубни южноамериканских «дикарей» под бомбёжками; сначала с помощниками, потом один. Из Павловска он ушёл с последней партией перед самым захватом города немцами, получил контузию, но довёз материал «до последнего образца»."
        src: "Источник: очерк «110 лет А. Я. Камеразу», сайт ВИР — http://vir.nw.ru/test/vir.nw/index.php?option=com_content&view=article&id=368&catid=69&lang=ru"
        stranica: очерк «110 лет А. Я. Камеразу», сайт ВИР
        href: http://vir.nw.ru/test/vir.nw/index.php?option=com_content&view=article&id=368&catid=69&lang=ru
        otryvok: «до последнего образца»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-14-goskatalog-49620809.jpg
          alt: Мужчина в шляпе и пиджаке склонился над кустами картофеля в поле
          data_source: https://goskatalog.ru/portal/#/collections?id=49620809
          license: автор снимка в карточке не указан; ст. 1274 ГК РФ, с указанием музея
          podpis: Абрам Яковлевич Камераз, доктор сельскохозяйственных наук, на картофельном поле. 1959 год.
          credit: ГМИ СПб, инв. II-Б-26026 ф, ГИК ГМИ СПб 23989
          width: 800
          height: 560
        utverzhden: 2026-11-03
      - summary: <b>Лехнович провёл 38 ночей в поле, охраняя высаженную коллекцию картофеля от голодных людей.</b>
        det:
          - Клубни нельзя хранить годами, поэтому весной 1942 года Лехнович и Воскресенская высадили две тонны картофеля, выкопанного под Слуцком (Павловском). В сентябре и октябре 1942 года Лехнович 38 ночей провёл на полях, сторожа посадки. Пешком он ходил по дальним совхозам учить картофелеводов; в сумке у него были хлеб, сахар, блокнот, карандаш, линейка и перевязочный пакет «на случай ранения осколком снаряда».
        src: "Источник: Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501"
        stranica: Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025
        href: https://www.kommersant.ru/doc/7459501
        otryvok: «на случай ранения осколком снаряда»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-14-goskatalog-58065377.jpg
          alt: Широкий плакат с зелёным заголовком «Выращивание картофеля», столбцы текста и рисунки клубней, куста и ящика для хранения
          data_source: https://goskatalog.ru/portal/#/collections?id=58065377
          license: издание 1943 года; автор-составитель Лехнович умер в 1989 году, поэтому авторское право на текст формально действует до 2059 года, показ по ст. 1274 ГК РФ (цитирование в информационных целях) с указанием автора и музея; на кадре служебная шкала цвета и водяной знак ГМИ СПб — кадрировать не надо
          podpis: Плакат «Выращивание картофеля» из серии «В помощь огороднику», составитель В. С. Лехнович. Ленинград, 1943 год.
          credit: Государственный музей истории Санкт-Петербурга (ГМИ СПб), инв. I-Б-3837 пл, ГИК ГМИ СПб 433254
          width: 800
          height: 500
        utverzhden: 2026-11-03
      - summary: <b>Лехнович запер картофель на три замка, обил дверь железом и не дал морозу опуститься ниже нуля.</b>
        det:
          - Подвал с клубнями нужно было беречь от крыс, мороза (до −36…−40 °С) и голодных людей. Лехнович опломбировал подвал, повесил три разных замка и обил дверь железом. Дважды в день он ходил с улицы Некрасова на Исаакиевскую площадь, по полтора часа в один конец, каждый день топил печь, а дрова добывал где мог; комендант раз в неделю выдавала ему вязанку дров.
        src: "Источник: Лоскутов И. Г., «Всероссийский НИИ растениеводства им. Н. И. Вавилова и блокада Ленинграда», сайт ВИР, 2018 — https://www.vir.nw.ru/wp-content/uploads/2018/09/blokada3.pdf; «Умереть от голода, но сохранить уникальную коллекцию семян: подвиг сотрудников НИИ Вавилова», «Наука ТВ» — https://naukatv.ru/articles/umeret_ot_goloda_no_spasti_semena"
        stranica: Лоскутов И. Г., «Всероссийский НИИ растениеводства им. Н. И. Вавилова и блокада Ленинграда», сайт ВИР, 2018
        href: https://www.vir.nw.ru/wp-content/uploads/2018/09/blokada3.pdf
        otryvok: «Приходилось охранять клубни от крыс, мороза и от голодающих людей. Для большей надежности я стал пломбировать подвал, закрывать его на три различных замка. Дверь обил железом.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Хранители связали жестяные коробки по нескольку штук — и голодные крысы не добрались до семян.</b>
        det:
          - Семена хранили в жестяных коробках на стеллажах. Голодные крысы сбрасывали их на пол, крышки открывались. Тогда коробки стали связывать между собой — сдвинуть такую связку крысе было не под силу. Сами люди еле держались на ногах.
        src: "Источник: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html"
        stranica: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019
        href: https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html
        otryvok: "«Грызуны сбрасывали со стеллажей жестяные коробки с семенами, от удара крышки открывались. Быстро оценив масштаб катастрофы, сотрудники нашли нестандартный ход: стали связывать между собой несколько коробок. Скинуть их или вскрыть стало невозможно...»"
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Поезд с коллекцией упёрся в занятую врагом Мгу и вернулся с семенами в Ленинград.</b>
        det:
          - В первую волну эвакуации около 20 тысяч образцов вывезли в ручной клади, около 40 тысяч пакетов доставили в Красноуфимск самолётом. Почти 100 тысяч образцов отправили поездом. 30 августа 1941 года состав подошёл к станции Мга, а она уже была занята врагом. Поезд вернулся в Ленинград, и груз снова занял здание на Исаакиевской площади.
        src: "Источник: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html; Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501 ; Пометка: возвращение — по «Родине»; по «Коммерсанту», состав полгода простоял на запасных путях, а коробки вернулись в здание ВИР на улице Герцена, 44"
        stranica: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019
        href: https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html
        otryvok: "«Но 30 августа 1941 года, когда состав подошел к станции Мга, выяснилось: город занят фашистами. Поезд вернулся в Ленинград, уникальный груз - в здание на Исаакиевской площади...»"
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-14-goskatalog-14842094.jpg
          alt: Рабочий чинит застеклённую крышу; внизу Мойка и площадь, вдали купол Казанского собора
          data_source: https://goskatalog.ru/portal/#/collections?id=14842094
          license: автор не указан; снимок 1947 года; ст. 1274 ГК РФ, с указанием музея (водяной знак «© ГМИ СПб»)
          podpis: Восстановление Всесоюзного института растениеводства. Оригинал снимка — 27 июня 1947 года (копия 1950–1960-х годов).
          credit: ГМИ СПб, инв. II-Б30174ф, ГИК ГМИ СПб 48916
          width: 600
          height: 788
        utverzhden: 2026-11-03
      - summary: "<b>Камераз спас картофель — и ушёл на фронт рядовым: стрелок, миномётчик, разведчик, переводчик.</b>"
        det:
          - "С ноября 1941 по июль 1945 года Камераз воевал на Ленинградском фронте в 123-й (Лужской) дивизии: рядовым стрелком, миномётчиком, ходил в разведку и был военным переводчиком — хорошо знал немецкий. Дважды ранен, один раз тяжело; орден Красной Звезды, медаль «За отвагу». В блокадном Ленинграде в это время умерла его жена Людмила, тоже сотрудница ВИР, — вместе с ещё не родившимся ребёнком. Кончил войну старшиной в Латвии и вернулся в отдел клубнеплодов."
        src: "Источник: очерк «110 лет А. Я. Камеразу», сайт ВИР — http://vir.nw.ru/test/vir.nw/index.php?option=com_content&view=article&id=368&catid=69&lang=ru"
        stranica: очерк «110 лет А. Я. Камеразу», сайт ВИР
        href: http://vir.nw.ru/test/vir.nw/index.php?option=com_content&view=article&id=368&catid=69&lang=ru
        otryvok: «Воевал рядовым стрелком, минометчиком, ходил в разведку, а по совместительству был еще военным переводчиком, т.к. неплохо владел немецким. Дважды был ранен, один из них тяжело.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Ослепшая после взрыва Воскресенская по описаниям лаборантов восстановила перемешанные сорта.</b>
        det:
          - "Коллекцию картофеля, почти 1200 образцов, спасали Абрам Камераз, Ольга Воскресенская и Вадим Лехнович. Во время посадки 1943 года на поле разорвался снаряд: взрыв сорвал таблички и перемешал клубни. Воскресенская получила травму головы и потеряла зрение; лаборанты описывали ей каждую картофелину, и она по памяти восстанавливала названия."
        src: "Источник: Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501; Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html ; Пометка: взрыв и описания лаборантов — по «Коммерсанту»; «Родина» пишет, что окончательно ослепшая Воскресенская восстановила сорта на ощупь"
        stranica: Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025
        href: https://www.kommersant.ru/doc/7459501
        otryvok: «Во время посадки на поле разорвался снаряд. Взрыв сорвал таблички и перемешал клубни разных сортов.»
        pometka: два источника
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Эсэсовец, охотившийся за коллекцией Вавилова, в 1958 году сам отдал ВИР 700 сортов картофеля.</b>
        det:
          - Хайнц Брюхер вступил в НСДАП в 1934 году, в СС в 1937-м. В 1943 году Гиммлер назначил его начальником команды СС по сбору ботанического материала на оккупированных землях, главной целью была коллекция Вавилова; Брюхер ездил по селекционным станциям с переводчиком Арнольдом Штейнбрехером. В опытном хозяйстве СС в замке Ланнах посеяли 197 сортов ячменя, 66 яровой пшеницы и 82 овса. В 1958 году директор ВИР Пётр Жуковский встретил Брюхера в Аргентине, и тот безвозмездно передал институту 700 местных сортов картофеля по 2–3 клубня, а приехать в СССР отказался. За три месяца команда Брюхера вывезла в Австрию около 40 тысяч образцов, эта часть коллекции утрачена.
        src: "Источник: Максимов Н., «Колос на глиняных ногах», Русский Newsweek, 09.04.2008, в дайджесте РАН — https://www.ras.ru/digest/showdnews.aspx?id=1c4d9009-b6c1-4894-99c9-71bfddf0e98c&print=1; Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501 (по книге С. Паркина) ; Пометка: вывоз 40 тысяч образцов — по книге британского журналиста Саймона Паркина в пересказе «Коммерсанта»"
        stranica: Максимов Н., «Колос на глиняных ногах», Русский Newsweek, 09.04.2008, в дайджесте РАН
        href: https://www.ras.ru/digest/showdnews.aspx?id=1c4d9009-b6c1-4894-99c9-71bfddf0e98c&print=1
        otryvok: «Известно, что немец безвозмездно передал Жуковскому 700 местных сортов картофеля, каждого по 2–3 клубня, но отказался от приглашения приехать в Советский Союз.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Основатель коллекции Вавилов умер в саратовской тюрьме — от того же истощения.</b>
        det:
          - Вавилова арестовали в августе 1940 года в экспедиции по Западной Украине. Он умер 26 января 1943 года в тюрьме № 1 УНКВД Саратова; «Родина» пишет о крупозном воспалении лёгких и истощении, «Коммерсантъ» — об истощении. Его ученики в Ленинграде умирали от того же голода рядом с его коллекцией. Реабилитирован в 1955 году.
        src: "Источник: справка УНКВД по Саратовской области о смерти Н. И. Вавилова, 29.01.1943 (ЦА ФСБ, Р-2311) — https://istmat.org/node/39469; Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html; Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501"
        stranica: справка УНКВД по Саратовской области о смерти Н. И. Вавилова, 29.01.1943 (ЦА ФСБ, Р-2311)
        href: https://istmat.org/node/39469
        otryvok: «ВАВИЛОВ Николай Иванович 1887 г. р. 26 Января 1943 г. умер в тюрьме № 1 УНКВД г. Саратова.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Агрометеоролог Молибога так ослаб от голода, что не смог выбраться из горящей квартиры.</b>
        det:
          - "В декабре 1941 года многие сотрудники уже не вставали с постели. Агрометеоролог А. Я. Молибога сгорел при пожаре у себя дома. Вскоре от истощения умерли доктор биологических наук С. А. Эгис и Д. С. Иванов, а за ними ещё 28 человек. «Родина» называет поимённо 13 погибших сотрудников: Александр Щукин, Дмитрий Иванов, Николай Леонтьевский, Александр Молибога, Георгий Гейнц, Георгий Крейер, Григорий Рубцов, Елизавета Войко, Иван Бажанов, Анисия Мальгина, Николай Лихвонен, шофёр Андрей Байков, дворник Григорий Голенищев."
        src: "Источник: Павлов Д. В., «Стойкость» — http://militera.lib.ru/memo/russian/pavlov_db/06.html; Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html; Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501 (около 20 погибших) ; Пометка: 28 — по Павлову; другие издания пишут о двух-трёх десятках погибших"
        stranica: Павлов Д. В., «Стойкость»
        href: http://militera.lib.ru/memo/russian/pavlov_db/06.html
        otryvok: «Их товарищ агрометеоролог А. Я. Молибога сгорел во время пожара у себя дома. Он настолько ослабел от голода, что не мог выбраться из охваченного огнем помещения.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Николай Иванов научил блокадный город есть траву: в 1942-м переработали 400 тонн диких растений.</b>"
        det:
          - "В 1942 году горожане собирали лебеду и сныть, но не всегда могли определить, какие травы съедобны. Хранитель зернобобовых Николай Иванов составил список съедобных растений: например, из одуванчика получалось четыре продукта — суррогат кофе, заменитель каперсов, салат и квашеная зелень. В городе открыли 15 пунктов приёма трав, где за сданные (не меньше 25 кг) давали хлебные карточки. Травы перерабатывал фасовочно-пищевой комбинат, за 1942 год — около 400 тонн."
        src: "Источник: Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501 ; Пометка: 400 тонн — по данным Иванова"
        stranica: Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025
        href: https://www.kommersant.ru/doc/7459501
        otryvok: «Вскоре в городе открылось 15 пунктов приема трав, где их обменивали на хлебные карточки.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Хранители после снятия блокады разослали по стране 100 тысяч спасённых образцов на пересев.</b>
        det:
          - Сразу после снятия блокады, в феврале 1944 года, из Красноуфимска в Ленинград приехали сотрудники, чтобы отобрать образцы для срочного пересева. Отобрали 100 тысяч и разослали на 6 опытных станций института и в 72 селекционных учреждения страны. Всего с использованием коллекции ВИР выведено больше 4,5 тысячи районированных сортов. К началу войны в коллекции было 250 тысяч образцов — самая богатая коллекция семян на свете. Безвозвратно потеряно около двух тонн; из спасённого выведены новые сорта пшеницы, ячменя, риса, картофеля. Сегодня в коллекции больше 320 тысяч образцов.
        src: "Источник: Лоскутов И. Г., «Всероссийский НИИ растениеводства им. Н. И. Вавилова и блокада Ленинграда», сайт ВИР, 2018 — https://www.vir.nw.ru/wp-content/uploads/2018/09/blokada3.pdf; Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501; «Умереть от голода, но сохранить уникальную коллекцию семян: подвиг сотрудников НИИ Вавилова», «Наука ТВ» — https://naukatv.ru/articles/umeret_ot_goloda_no_spasti_semena; Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html"
        stranica: Лоскутов И. Г., «Всероссийский НИИ растениеводства им. Н. И. Вавилова и блокада Ленинграда», сайт ВИР, 2018
        href: https://www.vir.nw.ru/wp-content/uploads/2018/09/blokada3.pdf
        otryvok: «В итоге к посеву было отобрано 100 тыс. образцов и отправлено на 6 опытных станциях института и 72 опытно-селекционных учреждения страны.»
        pometka: два источника
        kadr:
          src: /muzei/ne-sdayutsya/img/01-14-goskatalog-23840781.jpg
          alt: Бланк телеграммы с наклеенными строками «Горячо поздравляем коллектив ленинградцев сокрушением вражеских банд терзавших Ленинград» и подписями Эйхфельд, Таерев, Букасов и др.
          data_source: https://goskatalog.ru/portal/#/collections?id=23840781
