      - summary: "Поезд с коллекцией упёрся в занятую врагом Мгу и вернулся с семенами в Ленинград."
        det:
          - В первую волну эвакуации около 20 тысяч образцов вывезли в ручной клади, около 40 тысяч пакетов доставили в Красноуфимск самолётом. Почти 100 тысяч образцов отправили поездом. 30 августа 1941 года состав подошёл к станции Мга, а она уже была занята врагом. Поезд вернулся в Ленинград, и груз снова занял здание на Исаакиевской площади.
        src: "Источник: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html; Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501"
