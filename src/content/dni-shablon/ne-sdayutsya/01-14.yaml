quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — 250 тысяч; 2 — Станция Мга оказалась занята врагом; 3 — Связывали коробки между собой; 4 — Нетронутый мешочек с семенами; 5 — Больше 320 тысяч."
  ball: 10
  voprosy:
    - q: Сколько образцов было в коллекции ВИР к началу войны?
      o:
        - Около тысячи
        - 250 тысяч
        - Десять миллионов
        - Пять тысяч
      a: 1
      e: 250 тысяч образцов — самая богатая коллекция семян на свете.
    - q: Почему поезд с почти 100 тысячами образцов вернулся в Ленинград?
      o:
        - Сломался паровоз
        - Не хватило угля
        - Станция Мга оказалась занята врагом
        - Его не выпустили из города
      a: 2
      e: 30 августа 1941 года состав подошёл к Мге — станция уже была занята, и поезд вернулся.
    - q: Что делали хранители, чтобы крысы не добрались до семян?
      o:
        - Завели кошек
        - Унесли семена в подвал
        - Связывали коробки между собой
        - Залили коробки воском
      a: 2
      e: Крысы сбрасывали жестяные коробки со стеллажей; их стали связывать по нескольку штук.
    - q: Что нашли в нагрудном кармане Григория Рубцова, умершего по дороге через Ладогу?
      o:
        - Хлебную карточку
        - Нетронутый мешочек с семенами
        - Письмо Вавилову
        - Дневник
      a: 1
      e: Мешочек с семенами — он его так и не открыл.
    - q: Сколько образцов в коллекции ВИР сегодня?
      o:
        - Больше 320 тысяч
        - Около 50 тысяч
        - Ровно 250 тысяч
        - Коллекция утрачена
      a: 0
      e: Сегодня в коллекции больше 320 тысяч образцов.
