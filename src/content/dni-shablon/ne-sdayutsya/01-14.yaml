          podpis: "Телеграмма из Свердловска от И. Г. Эйхфельда и коллег коллективу ВИРа в Ленинград (ул. Герцена, 44), получена 27 января 1944 года: поздравление со снятием блокады."
          credit: ГММОБЛ, ГИК ГММОБЛ КП 14536/44
