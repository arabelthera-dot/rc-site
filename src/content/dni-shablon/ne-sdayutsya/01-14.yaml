        id: "f12"
      - summary: "Агрометеоролог Молибога так ослаб от голода, что не смог выбраться из горящей квартиры."
        det:
          - "В декабре 1941 года многие сотрудники уже не вставали с постели. Агрометеоролог А. Я. Молибога сгорел при пожаре у себя дома. Вскоре от истощения умерли доктор биологических наук С. А. Эгис и Д. С. Иванов, а за ними ещё 28 человек. «Родина» называет поимённо 13 погибших сотрудников: Александр Щукин, Дмитрий Иванов, Николай Леонтьевский, Александр Молибога, Георгий Гейнц, Георгий Крейер, Григорий Рубцов, Елизавета Войко, Иван Бажанов, Анисия Мальгина, Николай Лихвонен, шофёр Андрей Байков, дворник Григорий Голенищев."
        src: "Источник: Павлов Д. В., «Стойкость» — http://militera.lib.ru/memo/russian/pavlov_db/06.html; Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html; Кунина М., «Как учёные блокадного Ленинграда умирали, сберегая потенциальный урожай», «Коммерсантъ», 27.01.2025 — https://www.kommersant.ru/doc/7459501 (около 20 погибших)"
