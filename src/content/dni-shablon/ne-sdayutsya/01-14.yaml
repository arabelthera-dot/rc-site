        id: "f02"
      - summary: "Щукин умер, сжимая пакет редкого арахиса, который готовил к отправке на Урал."
        det:
          - Хранитель масличных культур Александр Щукин в последние дни готовил дублет арахиса — запасной образец, который должен был улететь самолётом в Красноуфимск. 27 ноября 1941 года он умер от дистрофии в кабинете, заставленном орехами, с пакетом в руках. Коллеги вспоминали, что уже истощённым он собирал с пола каждое рассыпанное семечко. Заведующий отделом крупяных Дмитрий Иванов умер от голода 9 января 1942 года в кабинете, где хранились десятки килограммов риса, кукурузы, гречихи и проса (Родина, 2019; Наука ТВ).
        src: "Источник: Черенева В., «В блокаду сотрудники Всесоюзного института растениеводства умирали от голода в кабинетах, заставленных элитными семенами», «Родина», 27.01.2019 — https://rodina-history.ru/2019/01/27/rodina-blokada-semena.html; сюжет телеканала «Санкт-Петербург» — https://tvspb.ru/programs/stories/515946; «Умереть от голода, но сохранить уникальную коллекцию семян: подвиг сотрудников НИИ Вавилова», «Наука ТВ» — https://naukatv.ru/articles/umeret_ot_goloda_no_spasti_semena"
