story:
  kicker: Подвиг
  h2: Станислав Петров
  abzacy:
  - 'Та ночь была не его: Петров вышел на дежурство вместо товарища. Табло горело «СТАРТ», достоверность «высшая» — Петров доложил: «Выдаю ложную информацию». Машина насчитала 15 боеголовок, это 400 Хиросим, — Петров сказал «ложная тревога». Спутник принял солнечные блики на облаках за пуск пяти американских ракет.'
  - '«Ракеты» шли с одной базы — Петров понял: так войну не начинают. «Уверенность была 50 на 50» — и Петров поставил на мир. «Ноги отнялись, встать с кресла не мог» — и всё же доложил: тревога ложная. До удара — 40 минут, а Петров позвонил наверх через две: «Компьютер дал сбой». «Не я буду зачинщиком Третьей мировой», — решил Петров у пульта.'
  - 'Петров спас мир — и получил выговор: не заполнил боевой журнал. Американцы в ООН наградили русского офицера: «Человеку, который предотвратил ядерную войну». Кевин Костнер прислал Петрову 500 долларов переводом — от себя.'
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 15; 2 — «СТАРТ»; 3 — 50 на 50; 4 — 40; 5 — Солнечные блики на облаках.'
  ball: 10
  voprosy:
