  - id: ns-0208-f13
    summary: «Не я буду зачинщиком Третьей мировой», — решил Петров у пульта
    det:
    - 'Пока выла сирена, Петров думал только об одном: не он начнёт Третью мировую войну.'
    - Радары второго эшелона потом показали, что небо над СССР чистое, никаких ракет нет.
    src: 'Источник: Техинсайдер — Станислав Петров: история офицера, предотвратившего ядерную войну'
    stranica: 'Техинсайдер — Станислав Петров: история офицера, предотвратившего ядерную войну'
    href: https://www.techinsider.ru/history/1659621-stanislav-petrov-chelovek-kotoryi-spas-mir-ot-yadernoi-voiny/
    otryvok: 'Позже подполковник поделился, что все это время в голове у него была лишь одна мысль: «А стоит ли оно того? Что ж, нет, не я буду зачинщиком Третьей мировой войны».'
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n9
    dlya_voprosa: false
  - id: ns-0208-f14
    summary: 'Та ночь была не его: Петров вышел на дежурство вместо товарища'
    det:
    - 'У Петрова в тот день был выходной: коллега попросил выйти за него на смену, и Петров не отказал (так пишет Техинсайдер).'
    - Так в ночь на 26 сентября 1983 года у пульта «Ока» на Серпухове-15 оказался именно он.
    src: 'Источник: КП, 2023 — 18 минут до ядерной войны: как советский офицер спас мир и получил за это выговор'
    stranica: 'КП, 2023 — 18 минут до ядерной войны: как советский офицер спас мир и получил за это выговор'
    href: https://www.kp.ru/daily/27559/4828433/
    otryvok: Собственно, в тот день он вообще не должен был этого делать, но пришлось выйти на работу вместо штатного дежурного.
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n5
    dlya_voprosa: false
  - id: ns-0208-f15
    summary: Кевин Костнер прислал Петрову 500 долларов переводом — от себя
    det:
    - Когда о Петрове начали писать в Америке и Европе, актёр Кевин Костнер прислал ему перевод — около 500 долларов.
    - Костнер благодарил его за то, что советские ракеты тогда не взлетели. Позже Костнер снялся в фильме о Петрове «Человек, который спас мир».
    src: 'Источник: КП, 2013 — Офицер Станислав Петров, предотвративший ядерную войну: Я спас мир? Это был рабочий эпизод'
    stranica: 'КП, 2013 — Офицер Станислав Петров, предотвративший ядерную войну: Я спас мир? Это был рабочий эпизод'
    href: https://www.kp.ru/daily/26139.3/3028054/
    otryvok: '- Однажды мне прислал денежный перевод актер Кевин Костнер. Долларов пятьсот. Неловко говорить, но он меня благодарил за то, что мы тогда не подняли в воздух ракеты, которые стерли бы с лица земли половину Штатов...'
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: false
