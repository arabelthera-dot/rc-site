  - id: ns-0208-f11
    summary: 'До удара — 40 минут, а Петров позвонил наверх через две: «Компьютер дал сбой»'
    det:
    - Система показала старт из Северной Дакоты, до удара оставалось около 40 минут.
    - Петров позвонил руководству через две минуты после первого сигнала и сказал, что компьютер дал сбой. Радары засекли бы ракеты через 18 минут, но ничего не появилось.
    src: 'Источник: РИА Новости, 08.04.2026 — Неизвестная история человека, который спас мир от ядерной катастрофы'
    stranica: РИА Новости, 08.04.2026 — Неизвестная история человека, который спас мир от ядерной катастрофы
    href: https://ria.ru/20260408/petrov-2085679496.html
    otryvok: '"Руководству я позвонил через две минуты [после первого сигнала] и сказал в трубку, что тревога ложная, компьютер дал сбой.'
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n4
    dlya_voprosa: false
  - id: ns-0208-f12
    summary: Спутник принял солнечные блики на облаках за пуск пяти американских ракет
    det:
    - Спутник системы «Око» передал, что из США стартовали пять межконтинентальных ракет с ядерными боеголовками, и система оценила это как достоверное.
    - На деле солнечные лучи отразились от облаков и засветили советские датчики обнаружения, и автоматика приняла это за пуски.
    src: 'Источник: РИА Новости, 2017 (обновл. 03.03.2020) — Нагоняй вместо поощрения: как офицер Петров предотвратил войну в 1983 году'
    stranica: 'РИА Новости, 2017 (обновл. 03.03.2020) — Нагоняй вместо поощрения: как офицер Петров предотвратил войну в 1983 году'
