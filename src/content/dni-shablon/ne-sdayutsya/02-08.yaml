    summary: '«Ракеты» шли с одной базы — Петров понял: так войну не начинают'
    det:
    - 'Научный директор РВИО Михаил Мягков рассказал, что Петров заметил: все «ракеты» вылетали из одной точки.'
    - 'Настоящий первый удар идёт сразу с многих баз, поэтому Петров решил, что это ошибка системы. Сам он говорил «Комсомолке»: «При настоящей атаке по Союзу ракеты должны идти с нескольких баз».'
