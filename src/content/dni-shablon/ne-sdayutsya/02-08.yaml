  - id: ns-0208-f03
    summary: Петров сам писал боевые программы «Ока» — и первым не поверил своей машине
    det:
    - Командующий войсками ПРО и ПКО Юрий Вотинцев в 1993 году написал об этом в «Военно-историческом журнале». Петров был заместителем начальника отдела боевых алгоритмов и программ, то есть отвечал за программы самой системы.
    - 'Вотинцев назвал его «настоящим профессионалом»: Петров быстро оценил обстановку и не пустил ложную информацию дальше. Причину сбоя генерал назвал прямо: боевую программу не доработали для условий высокой солнечной активности.'
    src: 'Источник: Военно-исторический журнал, 1993, № 10 — Ю. В. Вотинцев, мемуарный очерк'
    stranica: Военно-исторический журнал, 1993, № 10 — Ю. В. Вотинцев, мемуарный очерк
    href: http://militera.lib.ru/periodic/0/v/voenno-istorichesky-zhurnal/vij_1993-10.pdf
    otryvok: К счастью, в то время обязанности оперативного дежурного на КП системы выполнял настоящий профессионал, заместитель начальника отдела боевых алгоритмов и программ подполковник-инженер С. Е. Петров". Мгновенно проанализировав и оценив обстановку и ситуацию, он не допустил выдачи ложной информации на КП СПРН.
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n3
