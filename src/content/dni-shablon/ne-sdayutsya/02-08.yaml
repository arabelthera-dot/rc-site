  - q: Что горело на табло?
    o:
    - «ПУСК»
    - «СТАРТ»
    - «ТРЕВОГА»
    - «ОГОНЬ»
    a: 1
    e: 'Табло горело «СТАРТ», достоверность «высшая» — Петров доложил: «Выдаю ложную информацию».'
  - q: Какой была уверенность Петрова?
    o:
    - 100 на 0
    - 70 на 30
    - 50 на 50
    - 90 на 10
    a: 2
    e: «Уверенность была 50 на 50» — и Петров поставил на мир.
  - q: Сколько минут оставалось до удара?
    o:
    - '2'
    - '18'
    - '40'
    - '400'
    a: 2
    e: 'До удара — 40 минут, а Петров позвонил наверх через две: «Компьютер дал сбой».'
  - q: Что спутник принял за пуск ракет?
    o:
    - Самолёты
    - Солнечные блики на облаках
    - Метеориты
    - Птиц
    a: 1
    e: Спутник принял солнечные блики на облаках за пуск пяти американских ракет.
