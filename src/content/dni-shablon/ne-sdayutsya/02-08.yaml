  udary:
  - id: ns-0208-f01
    summary: 'Табло горело «СТАРТ», достоверность «высшая» — Петров доложил: «Выдаю ложную информацию»'
    det:
    - В 0:15 26 сентября 1983 года компьютер командного пункта Серпухов-15 сообщил о старте ракеты из США, достоверность — «высшая». На стене загорелась надпись «СТАРТ», выла сирена.
    - 'Петров велел расчёту сесть по местам и всё проверить, а по правительственной связи доложил: «Я выдаю вам ложную информацию».'
    src: 'Источник: КП, 2013 — Офицер Станислав Петров, предотвративший ядерную войну: Я спас мир? Это был рабочий эпизод'
    stranica: 'КП, 2013 — Офицер Станислав Петров, предотвративший ядерную войну: Я спас мир? Это был рабочий эпизод'
    href: https://www.kp.ru/daily/26139.3/3028054/
    otryvok: '- Машина показывает, что достоверность высшая, - вспоминает Станислав Евграфович. - Сирена орет как оглашенная. Сверху на стене горят большие красные буквы: «СТАРТ». … Поднимаю трубку и докладываю дежурному: «Я выдаю вам ложную информацию». Он коротко ответил: «Понял».'
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: false
  - id: ns-0208-f02
    summary: Машина насчитала 15 боеголовок, это 400 Хиросим, — Петров сказал «ложная тревога»
    det:
    - Компьютер насчитал пять ракет «Минитмен», у каждой по три боеголовки. Всего 15 термоядерных зарядов — по мощности это 400 Хиросим.
    - Удар по советским городам ждали через 40 минут, но атака существовала только в «мозгу» компьютера.
    src: 'Источник: Российская газета, 2024 — 41 год назад подполковник Петров предотвратил ядерную войну СССР и США'
    stranica: Российская газета, 2024 — 41 год назад подполковник Петров предотвратил ядерную войну СССР и США
    href: https://rg.ru/2024/10/02/nakanune-konca-sveta.html
    otryvok: 'С момента, как на КП завыла сирена, пошел отчет: через 40 минут на советские города должны обрушиться 15 термоядерных бомб совокупной мощностью 400 Хиросим. Правда, только в воспаленном "мозгу" компьютера.'
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n2
    dlya_voprosa: false
