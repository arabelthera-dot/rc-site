  - id: ns-0208-f04
    summary: 'Американцы в ООН наградили русского офицера: «Человеку, который предотвратил ядерную войну»'
    det:
    - 'О Петрове на Западе узнали благодаря немцу Карлу Шумахеру: в 1998 году он разыскал офицера во Фрязине и привёз его в Германию.'
    - В 2006 году в штаб-квартире ООН в Нью-Йорке Петрову вручили награду «Человеку, который предотвратил ядерную войну». Потом были немецкие премии, в том числе Дрезденская.
    src: 'Источник: РИА Новости, 08.04.2026 — Неизвестная история человека, который спас мир от ядерной катастрофы'
    stranica: РИА Новости, 08.04.2026 — Неизвестная история человека, который спас мир от ядерной катастрофы
    href: https://ria.ru/20260408/petrov-2085679496.html
    otryvok: В 2006-м офицер получил награду в штаб-квартире ООН в Нью-Йорке с формулировкой "Человеку, который предотвратил ядерную войну", позже — премии в Германии, включая Дрезденскую.
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n4
    dlya_voprosa: false
  - id: ns-0208-f05
    summary: 'Петров спас мир — и получил выговор: не заполнил боевой журнал'
    det:
    - 'Проверка выяснила причину: солнечные лучи отразились от облаков и ослепили датчики спутника.'
    - К ордену Петрова так и не представили, зато объявили выговор за незаполненный боевой журнал. По его словам, в одной руке у него была телефонная трубка, в другой — микрофон, а дописывать журнал задним числом — уголовное дело.
    src: 'Источник: РИА Новости, 08.04.2026 — Неизвестная история человека, который спас мир от ядерной катастрофы'
    stranica: РИА Новости, 08.04.2026 — Неизвестная история человека, который спас мир от ядерной катастрофы
    href: https://ria.ru/20260408/petrov-2085679496.html
    otryvok: Вместо ордена Петрова к награде не представили. Более того — ему объявили выговор за то, что во время дежурства не заполнил боевой журнал.
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n4
    dlya_voprosa: false
  - id: ns-0208-f06
    summary: Кнопка пуска стояла под колпаком и пломбой, но провода к ней не подключали
    det:
    - Петров рассказал «Комсомолке», что красная кнопка на пульте дежурного была под колпачком со свинцовой пломбой.
    - 'Провода к ней не подключали: после аварии на одной советской АЭС решили, что такое решение должен принимать компьютер, а не человек, и кнопку оставили как символ.'
    src: 'Источник: КП, 2023 — 18 минут до ядерной войны: как советский офицер спас мир и получил за это выговор'
    stranica: 'КП, 2023 — 18 минут до ядерной войны: как советский офицер спас мир и получил за это выговор'
    href: https://www.kp.ru/daily/27559/4828433/
    otryvok: Она на том пульте дежурного была под колпачком со свинцовой пломбой. Чтобы случайно никто не нажал. Но только… снизу к ней даже провода подключены не были!
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n5
    dlya_voprosa: false
  - id: ns-0208-f07
    summary: «Уверенность была 50 на 50» — и Петров поставил на мир
    det:
    - Петров решил не верить компьютеру, позвонил руководству и доложил, что тревога ложная.
    - 'Сам он признавался, что до последнего не был уверен в своей правоте: шансы были 50 на 50, и поправить его, если он ошибся, было бы уже некому.'
    src: 'Источник: BFM.ru — Станислав Петров — человек, который не поверил компьютеру и спас мир'
    stranica: BFM.ru — Станислав Петров — человек, который не поверил компьютеру и спас мир
    href: https://www.bfm.ru/news/365258
    otryvok: Но сам я до последнего не был уверен, что это так. Уверенность у меня была 50 на 50. И я знал, что если я ошибся, меня никто не поправит».
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n6
    dlya_voprosa: false
  - id: ns-0208-f08
    summary: '«Ноги отнялись, встать с кресла не мог» — и всё же доложил: тревога ложная'
    det:
    - Петров потом вспоминал, что от потрясения не мог встать с кресла, у него отнялись ноги.
    - Шёл 1983 год, только что сбили южнокорейский «Боинг», холодная война дошла до предела. И всё же Петров решил, что тревога ложная.
    src: 'Источник: КП, 2023 — 18 минут до ядерной войны: как советский офицер спас мир и получил за это выговор'
    stranica: 'КП, 2023 — 18 минут до ядерной войны: как советский офицер спас мир и получил за это выговор'
    href: https://www.kp.ru/daily/27559/4828433/
    otryvok: «Я встать с кресла не мог, у меня ноги отнялись. Переживал жутко, как будто меня на Голгофу вели», - вспоминал он сам впоследствии.
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n5
    dlya_voprosa: false
  - id: ns-0208-f09
    summary: Сотня человек смены вскочила с мест — и все смотрели на одного Петрова
    det:
    - В ту ночь на смену в «спецзону» Серпухова-15 заступил боевой расчёт без малого из ста человек, половина из них офицеры.
    - 'Когда загорелось «СТАРТ», операторы вскочили со своих мест. Петров потом рассказывал РИА Новости: «все смотрят на меня».'
    src: 'Источник: Российская газета («Родина»), 2017 — В ночь на 26 сентября 1983 года Станислав Петров спас мир от ядерной войны'
    stranica: Российская газета («Родина»), 2017 — В ночь на 26 сентября 1983 года Станислав Петров спас мир от ядерной войны
    href: https://rg.ru/amp/2017/09/19/rodina-stanislav-petrov.html
    otryvok: Сюда же постепенно подтягивался весь боевой расчет - без малого сто человек, половина из которых офицеры.
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n7
    dlya_voprosa: false
