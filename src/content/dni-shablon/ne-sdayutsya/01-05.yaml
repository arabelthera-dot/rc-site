vizual:
  imya: brest-flyaga
  vid: predmet
  kicker: Предмет под лупой
  h2: Фляга защитника крепости
  lead: 'Эта фляга принадлежала участнику обороны Брестской крепости. За водой защитникам приходилось пробираться к реке под огнём. Приближайте: вмятины, рыжие пятна, буквы, процарапанные на алюминии.'
audioguide:
  audioSrc: audio-guide-brest-ru.mp3
  durationLabel: 1 минута 30 секунд
  lead: "Голос ведёт от первого удара войны до надписи на кирпиче: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: '0:00'
      title: Крепость на границе
    - t: 13
      mark: '0:13'
      title: Первый удар
    - t: 27
      mark: '0:27'
      title: Без воды
    - t: 40
      mark: '0:40'
      title: Очаги
    - t: 54
      mark: '0:54'
      title: «Умираю, но не сдаюсь»
  transcript:
    - "«Мы входим в зал, и перед нами — крепость на западной границе, у слияния рек Мухавец и Западный Буг. Это Брест, 22 июня 1941 года. До мирного утра — считанные минуты."
    - "Около четырёх часов утра по крепости бьют артиллерия и авиация. Война началась — и первым её ударом приняла эта крепость. За считанные часы гарнизон теряет связь с командованием, склады уничтожены."
    - "Положение отчаянное: окружение, ни единого командования, ни воды. Река простреливается, водопровод разбит. Люди держатся под огнём и под жаждой — об этом скульптура «Жажда» в мемориале."
    - "Оборону держат разрозненные очаги. Майор Пётр Гаврилов руководит Восточным фортом и держится дольше всех. Комиссар Фомин, лейтенант Кижеватов, капитан Зубачёв — каждый держит свой участок, пока может."
    - "На стенах остаются последние слова тех, кто не сдался. Самая известная — «Умираю, но не сдаюсь! Прощай, Родина. 20/VII–41». Её выцарапали штыком по кирпичу. Вот и весь зал: крепость, которая не сдалась, хотя сдаться было разумнее всего»."
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
