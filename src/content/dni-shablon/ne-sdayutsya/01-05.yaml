story:
  kicker: Подвиг
  h2: Бой, который крепость приняла в первый час
  abzacy:
    - 22 июня 1941 года, около четырёх утра. Крепость на западной границе, у слияния Мухавца и Западного Буга, принимает один из первых ударов войны. Артиллерия и авиация бьют по казармам, складам, домам комсостава. За считанные часы гарнизон теряет связь с командованием, а склады боеприпасов и продовольствия уничтожены.
    - "Положение то, в котором части сдаются: окружение, отсутствие единого командования, ни воды, ни хлеба. Но защитники делают иначе — кто где успел, тот там и встаёт. Оборону держат разрозненные очаги: солдаты и командиры, оставшиеся без приказа и без надежды на помощь."
    - Очагов много, и у каждого — своё имя. Майор Пётр Гаврилов руководит обороной Восточного форта и держится дольше всех — пленён лишь 23 июля, на 32-й день войны, тяжелораненым и истощённым. Комиссар Ефим Фомин, лейтенант Андрей Кижеватов, капитан Иван Зубачёв — они не выходили из боя, пока могли.
    - "На стенах остались последние слова тех, кто не сдался, — выцарапанные штыком по кирпичу, когда вокруг уже всё говорило «конец». Суть одна, и она не зависит от числа павших: гарнизон, которому расчёт велел сдаться, предпочёл не сдаться. Не ради победы — победы не ждали. Ради того, чтобы остаться собой."
    - "Цена — страшная: из тех, кто держал крепость, большинство погибли или попали в плен. В 1965 году крепость получила звание «крепость-герой», в 1971-м открыт мемориальный комплекс. Под гранитными плитами — останки 962–1038 погибших, имена известны лишь у 270–276 из них. Остальные — безымянные. Но их надписи на стенах — это их голоса."
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Крепость, которая не сдалась
    udary:
      - summary: <b>Лейтенант Кижеватов не подал руки немецкому парламентёру — и никто не согласился сдаться.</b>
        det:
          - "Пограничники 9-й заставы Андрея Кижеватова у Тереспольских ворот отбивали до шести атак в день. Немцы прислали переводчика с белым флагом и обещали сохранить жизнь Кижеватову и его семье. Боец заставы Георгий Еремеев вспоминал: Кижеватов показал на убитых в воротах и спросил: «За что эти люди погибли?» Сдаваться из собравшихся в подвале не захотел никто. Кижеватов погиб в крепости и посмертно стал Героем Советского Союза."
        src: "Источник: КП (https://www.kp.ru/daily/277786/5255021/); звание Героя — МО-РИА (https://ria.ru/20190622/1555812484.html)"
        stranica: КП
        href: https://www.kp.ru/daily/277786/5255021/
        otryvok: «За что эти люди погибли?»
        pometka: документ
        kadr:
          src: kartinka:000534
          alt: Фотопортрет лейтенанта Андрея Митрофановича Кижеватова
          data_source: https://goskatalog.ru/portal/#/collections?id=7180344
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Лейтенант Андрей Митрофанович Кижеватов, начальник 9-й пограничной заставы 17-го Брестского погранотряда, участник обороны Брестской крепости.
          credit: "Фотокопия. Хранится: Магаданское областное государственное автономное учреждение культуры «Магаданский областной краеведческий музей». Госкаталог № 7180344 (МОКМ КП-1721/15)"
          width: 558
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Майор Гаврилов держал Восточный форт 32 дня — и в плен попал без сознания, «скелетом».</b>
        det:
          - "23 июля 1941 года у Гаврилова оставалось пять гранат и два пистолета. Он отбил две атаки, пока его не оглушило гранатой. Лагерный врач вспоминал: привезли без сознания «скелет, обтянутый кожей», немцы говорили, что час назад он убил нескольких их солдат. Врачи спрятали его в тифозном бараке, куда немцы боялись заходить, и допроса не было. По рассекреченным документам Минобороны, немецкие офицеры приезжали в лагерь посмотреть на него."
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (пленён 23 июля); АиФ (https://aif.ru/society/history/chtoby-mir-uznal-kak-sergey-smirnov-razyskival-zashchitnikov-brestskoy-kreposti); МО-РИА (https://ria.ru/20190622/1555812484.html)"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: «скелет, обтянутый кожей»
        pometka: документ
        kadr:
          src: kartinka:000535
          alt: Фотопортрет майора Петра Михайловича Гаврилова
          data_source: https://goskatalog.ru/portal/#/collections?id=7180313
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Майор Пётр Михайлович Гаврилов, командир 44-го стрелкового полка 42-й стрелковой дивизии, участник обороны Брестской крепости.
          credit: "Фотокопия. Хранится: Магаданское областное государственное автономное учреждение культуры «Магаданский областной краеведческий музей». Госкаталог № 7180313 (МОКМ КП-1721/1)"
          width: 543
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Пятеро бойцов Зульпукарова остались в горящем форту, когда 384 товарища уже вышли сдаваться.</b>
        det:
          - "29 июня, после сильнейшего авианалёта, из Восточного форта почти два часа выходили пленные — 384 человека. Утром 30 июня немцы «извлекли несколько раненых русских», и пленных стало 389: пятеро продолжали держаться. Это группа лейтенанта Баганда Зульпукарова, о котором Гаврилов писал, что тот с простреленной грудью вернулся к орудию, сбил самолёт и подбил танк. Награды Зульпукаров не получил: за подпольную работу в лагере в 1942 году его передали гестапо и казнили в Дахау."
        src: "Источник: РОДИНА (https://rodina-history.ru/2024/10/02/brestskaia-krepost-poslednie-geroi.html) (BA-MA RH 26-45/27; Гаврилов, «Конспект о защите Брестской крепости»)"
        stranica: РОДИНА
        href: https://rodina-history.ru/2024/10/02/brestskaia-krepost-poslednie-geroi.html
        otryvok: «извлекли несколько раненых русских»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Последние защитники вышли из каземата в июле — и немецкие офицеры сняли перед ними каски.</b>
        det:
          - Бывший узник Игнат Иванов написал Смирнову, что в конце июля в лагерь № 307 привезли четверых прямо из крепости. После неудачной попытки прорваться к Бугу они почти двое суток держались в каземате. Когда они вышли, офицер снял каску, а за ним и все солдаты. Комендант Бреста Вальтер фон Унру тоже вспоминал, что схваченным «оказали почести».
        src: "Источник: РОДИНА (https://rodina-history.ru/2024/10/02/brestskaia-krepost-poslednie-geroi.html) (Смирнов С. С., «Брестская крепость», М., 1965, с. 301; BA-MA ZA 1 1406)"
        stranica: РОДИНА
        href: https://rodina-history.ru/2024/10/02/brestskaia-krepost-poslednie-geroi.html
        otryvok: «Один из офицеров, ..., снял каску .., и все солдаты, ... почтили верность воинскому долгу наших воинов снятием каски"»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Безымянный защитник выцарапал на стене: «Я умираю, но не сдаюсь. Прощай, Родина!»</b>"
        det:
          - Надпись нашёл в 1950 году научный сотрудник московского музея, обследуя западные казармы. Подписи под словами не было, но внизу стояла ясно различимая дата — «20 июля 1941 года». Так нашлось прямое доказательство, что крепость сопротивлялась и на 29-й день войны.
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (отрывок из книги С. С. Смирнова «Брестская крепость», 1964); МО-РИА (https://ria.ru/20190622/1555812484.html)"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: «20 июля 1941 года»
        pometka: документ
        kadr:
          src: kartinka:000536
          alt: Кусок штукатурки со стены Брестской крепости с надписью защитника
          data_source: https://goskatalog.ru/portal/#/collections?id=48247470
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: "Кусок штукатурки со стены Брестской крепости с надписью защитника: «Я умираю, но не сдаюсь. Прощай, Родина. 20/VII-41»."
          credit: "Фото: автор не указан, первая половина XX века. Хранится: Федеральное государственное бюджетное учреждение культуры и искусства «Центральный музей Вооружённых Сил Российской Федерации» Министерства обороны Российской Федерации. Госкаталог музейного фонда РФ, № 48247470. Источник: Госкаталог Музейного фонда РФ, https://goskatalog.ru/portal/#/collections?id=48247470."
          width: 800
          height: 433
        utverzhden: 2026-11-03
      - summary: <b>Девочка Валя Сачковская принесла в крепость ультиматум о сдаче — и осталась помогать раненым.</b>
        det:
          - Отец Вали служил капельмейстером 33-го инженерного полка. Немцы узнали, что он в крепости, и послали девочку под огнём с ультиматумом. Ультиматум она передала, но к немцам не вернулась и осталась помогать раненым. При прорыве группы старшего лейтенанта Потапова её взяли в плен, но она сбежала.
        src: "Источник: МО-РГ (https://rg.ru/2019/06/22/minoborony-rassekretilo-dokumenty-o-zashchite-brestskoj-kreposti.html) (документы архива Минобороны РФ)"
        stranica: МО-РГ
        href: https://rg.ru/2019/06/22/minoborony-rassekretilo-dokumenty-o-zashchite-brestskoj-kreposti.html
        otryvok: «Когда фашисты узнали, что отец девочки находится в крепости, они отправили туда Валю с ультиматумом о сдаче.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Крепость стреляла и после того, как штаб 45-й дивизии доложил, что она пала 1 июля.</b>
        det:
          - В немецком «Боевом донесении о занятии Брест-Литовска» сказано, что крепость держалась девять дней и пала к 1 июля. Но жён командиров брали в плен ещё 10–15 июля, когда бои продолжались. Охрану крепости немцам пришлось почти утроить, со 133 до 399 человек. Командир дивизии Фриц Шлипер спешил увести её на восток, потому что дальнейшее пребывание в Бресте «оказало бы неблагоприятное воздействие на боевой настрой». В донесении упомянута и авиабомба весом 1800 кг, «потрясшая детонацией весь город Брест».
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (Смирнов); РОДИНА (https://rodina-history.ru/2024/10/02/brestskaia-krepost-poslednie-geroi.html) (BA-MA RH 26-45/26, Bl. 48); МО-РИА (https://ria.ru/20190622/1555812484.html)"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: «Боевом донесении о занятии Брест-Литовска»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Около 3,5 тысячи защитников неделю сдерживали 45-ю пехотную дивизию вермахта.</b>
        det:
          - "Энциклопедия «Великая Отечественная война» (2010): с учётом потерь первого дня крепость защищали около 3,5 тысячи человек, блокированных в разных её частях. Командовали капитан И. Н. Зубачёв и полковой комиссар Е. М. Фомин. Неделю гарнизон сдерживал 45-ю пехотную дивизию с артиллерией и авиацией, а отдельные очаги сопротивления держались ещё три недели — майор П. М. Гаврилов попал в плен 23 июля."
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (Н. А. Асташин, энциклопедия «Великая Отечественная война», 2010)"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: «Великая Отечественная война»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Защитники держались без воды под огнём, а Гаврилов прикладывал язык к влажным кирпичам.</b>
        det:
          - Водоснабжение крепости было разрушено, а набрать воды из Мухавца и Буга почти не давал огонь противника; стояла сильная жара. Чтобы унять жажду, майор Гаврилов прикладывал язык к влажным кирпичам. Сегодня в мемориале стоит композиция «Жажда».
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (Асташин); АиФ (https://aif.ru/society/history/chtoby-mir-uznal-kak-sergey-smirnov-razyskival-zashchitnikov-brestskoy-kreposti); «Российская газета», 17.06.2004 — https://rg.ru/2004/06/17/brest.html"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: «(чтобы унять жажду, Гаврилов прикладывал язык к влажным кирпичам подземных казематов)»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Наши войска взяли под Орлом архив 45-й дивизии — и о подвиге Бреста рассказал сам враг.</b>
        det:
          - "В феврале 1942 года под Орлом захватили архив штаба 45-й пехотной дивизии, а в нём «Боевое донесение о занятии Брест-Литовска». В донесении сказано: «Русские в Брест-Литовске дрались исключительно настойчиво и упорно… доказали замечательную волю к сопротивлению». Выдержки из него в 1942 году напечатала «Красная звезда», и так страна узнала об обороне крепости."
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (Смирнов); МО-РИА (https://ria.ru/20190622/1555812484.html)"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: «Боевое донесение о занятии Брест-Литовска»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Голоса со стен
    udary:
      - summary: <b>Бойцы писали на стенах «Умрём, но не уйдём!», а последний из троих москвичей — «живым не дамся».</b>
        det:
          - "У Тереспольских ворот осталась надпись пятерых: «Нас было пятеро: Седов, Грутов И., Боголюбов, Михайлов, Селиванов В. Мы приняли первый бой 22.VI.1941. Умрём, но не уйдём!» В клубе полка, бывшей церкви: «Нас было трое москвичей — Иванов, Степанчиков, Жунтяев… дали клятву: умрём, но не уйдём отсюда». Ниже была вторая надпись: «Я остался один… Осталась последняя граната, но живым не дамся». Первую надпись сняли со штукатуркой и передали в Центральный музей Советской Армии."
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (Смирнов)"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: "«Нас было пятеро: Седов, Грутов И., Боголюбов, Михайлов, Селиванов В. Мы приняли первый бой 22.VI.1941. Умрём, но не уйдём!»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Комиссар Фомин поднял контратаку у Тереспольских ворот и запер прорвавшихся немцев в клубе.</b>
        det:
          - Штурмовые отряды 45-й дивизии прорвались на Центральный остров, их встретила контратака под командованием полкового комиссара Е. М. Фомина. Немецкий авангард понёс большие потери и на время оказался заперт в здании клуба. Командование объединёнными силами защитников принял капитан И. Н. Зубачёв, Фомин стал его заместителем. Позже оглушённого взрывом Фомина взяли в плен, предатели выдали его немецкому офицеру, и комиссара расстреляли у крепостной стены.
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (Асташин); МО-РИА (https://ria.ru/20190622/1555812484.html)"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: «В районе Тереспольских ворот немцы встретили отчаянную контратаку советских бойцов под общим командованием полкового комиссара Е.М. Фомина.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Лейтенант Наганов держал башню над Тереспольскими воротами — его нашли с пистолетом на взводе.</b>
        det:
          - Алексей Наганов командовал взводом курсантов 333-го стрелкового полка и закрепился в башне над Тереспольскими воротами, на направлении главного удара. В 1949 году при разборе развалин башни нашли останки бойцов, в кармане одного — комсомольский билет Наганова. Рядом лежали полевая сумка и пистолет на боевом взводе. В 1954 году он посмертно награждён орденом Отечественной войны I степени.
        src: "Источник: МК (https://brest-fortress.by), «Судьба моей семьи в истории моей страны» — https://www.brest-fortress.by/novosti/663-sudba-moej-semi-v-istorii-moej-strany"
        stranica: МК
        href: https://brest-fortress.by
        otryvok: «В башне над воротами и закрепился с группой красноармейцев лейтенант Наганов.»
        pometka: два источника
        kadr:
          src: kartinka:000537
          alt: Фотопортрет лейтенанта Алексея Фёдоровича Наганова в фуражке
          data_source: https://goskatalog.ru/portal/#/collections?id=7180298
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Лейтенант Алексей Фёдорович Наганов, командир взвода полковой школы 333-го стрелкового полка 6-й Орловской стрелковой дивизии, участник обороны Брестской крепости.
          credit: "Фотокопия. Хранится: Магаданское областное государственное автономное учреждение культуры «Магаданский областной краеведческий музей». Госкаталог № 7180298 (МОКМ КП-1721/14)"
          width: 525
          height: 800
        utverzhden: 2026-11-03
      - summary: "<b>Гарнизон встал насмерть там, где его застала война: крепость дралась отдельными очагами.</b>"
        det:
          - "Немцы начали штурм мощной артподготовкой: она разрушила значительную часть строений, убила многих бойцов и поначалу деморализовала уцелевших. До того как кольцо замкнулось, уйти из крепости на рубежи по плану успела лишь до половины гарнизона. Остальные дрались в разных частях крепости: враг быстро закрепился на Южном и Западном островах, но казармы Цитадели взять не смог."
        src: "Источник: ИСТОРИЯ.РФ (https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti) (Асташин)"
        stranica: ИСТОРИЯ.РФ
        href: https://histrf.ru/lenta-vremeni/event/view/oborona-briestskoi-krieposti
        otryvok: «С учетом потерь за первый день обороны, в итоге крепость защищали порядка 3,5 тыс. чел., блокированных в разных ее частях.»
        pometka: один источник
        kadr:
          src: kartinka:000538
          alt: Приказ № 1 по гарнизону Брестской крепости — фотокопия
          data_source: https://goskatalog.ru/portal/#/collections?id=7180316
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Приказ № 1 по гарнизону Брестской крепости — фотокопия.
          credit: "Фото: автор не указан, 1950-е. Хранится: Магаданское областное государственное автономное учреждение культуры «Магаданский областной краеведческий музей». Госкаталог музейного фонда РФ, № 7180316. Источник: Госкаталог Музейного фонда РФ, https://goskatalog.ru/portal/#/collections?id=7180316."
          width: 799
          height: 553
        utverzhden: 2026-11-03
      - summary: <b>Писатель Смирнов разыскал больше 300 живых защитников и вернул им доброе имя.</b>
        det:
          - "Гаврилова Смирнов нашёл на окраине Краснодара, в саманном домике, который тот построил сам. Только в 1955 году писатель побывал в 30 областях, а его квартиру называли «Комитетом справедливости»: он добивался пенсий и пересмотра дел. Гаврилов стал Героем Советского Союза, крепость в 1965 году — «крепостью-героем», в 1971 году открыт мемориал. В 2004 году его директор, генерал Валерий Губаренко, рассказал «Российской газете»: «По официальным данным, в Бресте погибли 962 человека. 270 имен вынесено на мемориальные плиты». Каждый год музей устанавливает одну-две новые фамилии."
        src: "Источник: АиФ (https://aif.ru/society/history/chtoby-mir-uznal-kak-sergey-smirnov-razyskival-zashchitnikov-brestskoy-kreposti); РОДИНА (https://rodina-history.ru/2024/10/02/brestskaia-krepost-poslednie-geroi.html); МО-РИА (https://ria.ru/20190622/1555812484.html); «Российская газета», 17.06.2004 (https://rg.ru/2004/06/17/brest.html)"
        stranica: АиФ
        href: https://aif.ru/society/history/chtoby-mir-uznal-kak-sergey-smirnov-razyskival-zashchitnikov-brestskoy-kreposti
        otryvok: «По официальным данным, в Бресте погибли 962 человека. 270 имен вынесено на мемориальные плиты»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-brest-ru.mp3
  durationLabel: 1 минута 30 секунд
  lead: "Голос ведёт от первого удара войны до надписи на кирпиче: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: "0:00"
      title: Крепость на границе
    - t: 18
      mark: "0:18"
      title: Первый удар
    - t: 38
      mark: "0:38"
      title: Без воды
    - t: 60
      mark: "1:00"
      title: Очаги
    - t: 78
      mark: "1:18"
      title: «Умираю, но не сдаюсь»
  transcript:
    - <p>«Мы входим в зал, и перед нами — крепость на западной границе, у слияния рек Мухавец и Западный Буг. Это Брест, 22 июня 1941 года. До мирного утра — считанные минуты.</p>
    - <p>Около четырёх часов утра по крепости бьют артиллерия и авиация. Война началась — и первым её ударом приняла эта крепость. За считанные часы гарнизон теряет связь с командованием, склады уничтожены.</p>
    - "<p>Положение отчаянное: окружение, ни единого командования, ни воды. Река простреливается, водопровод разбит. Люди держатся под огнём и под жаждой — об этом скульптура «Жажда» в мемориале.</p>"
    - <p>Оборону держат разрозненные очаги. Майор Пётр Гаврилов руководит Восточным фортом и держится дольше всех. Комиссар Фомин, лейтенант Кижеватов, капитан Зубачёв — каждый держит свой участок, пока может.</p>
    - "<p>На стенах остаются последние слова тех, кто не сдался. Самая известная — «Умираю, но не сдаюсь! Прощай, Родина. 20/VII–41». Её выцарапали штыком по кирпичу. Вот и весь зал: крепость, которая не сдалась, хотя сдаться было разумнее всего».</p>"
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
razdely: []
quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — 22 июня 1941 года; 2 — воды; 3 — 32 дня; 4 — «Умираю, но не сдаюсь»; 5 — крепость-герой."
  ball: 10
  voprosy:
    - q: Когда Брестская крепость приняла первый удар?
      o:
        - 22 июня 1941 года
        - 23 июля 1941 года
        - 1 сентября 1939 года
        - 9 мая 1945 года
      a: 0
      e: 22 июня 1941, около четырёх утра. Крепость на границе приняла удар в первый час войны на этом участке.
    - q: Чего больше всего не хватало защитникам?
      o:
        - Патронов
        - Воды
        - Хлеба
        - Смелости
      a: 1
      e: "Воды: река простреливалась, водопровод разбит. Люди мучились от жажды и всё равно держались."
    - q: Сколько дней держался Восточный форт?
      o:
        - 7 дней
        - 3 дня
        - 32 дня
        - 100 дней
      a: 2
      e: 32 дня. Майора Гаврилова взяли в плен 23 июля — на 32-й день войны.
    - q: Что выцарапано на кирпиче крепости?
      o:
        - «Держись, Москва»
        - «Умираю, но не сдаюсь»
        - «Вперёд, за Родину»
        - «Победа будет за нами»
      a: 1
      e: «Умираю, но не сдаюсь! Прощай, Родина. 20/VII–41» — дата по тексту надписи, а не доказанная. Автор точно неизвестен — но это голос всей крепости.
    - q: Какое звание получила крепость в 1965 году?
      o:
        - Город-герой
        - Крепость-герой
        - Орден Победы
        - Памятник ЮНЕСКО
      a: 1
      e: Крепость-герой. В 1971 году открыт мемориальный комплекс — монумент «Мужество», скульптура «Жажда», штык-обелиск.
