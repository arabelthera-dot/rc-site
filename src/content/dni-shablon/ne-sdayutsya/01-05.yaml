          podpis: Приказ № 1 по гарнизону Брестской крепости — фотокопия.
          credit: "Фото: автор не указан, 1950-е. Хранится: Магаданское областное государственное автономное учреждение культуры «Магаданский областной краеведческий музей». Госкаталог музейного фонда РФ, № 7180316. Источник: Госкаталог Музейного фонда РФ, https://goskatalog.ru/portal/#/collections?id=7180316."
          width: 799
          height: 553
        det:
          - Комиссар Ефим Фомин, лейтенант Андрей Кижеватов, капитан Иван Зубачёв — каждый держал свой участок и не выходил из боя, пока мог.
        src: "Источник: мемориальный комплекс «Брестская крепость-герой» (brest-fortress.by); С. С. Смирнов, «Брестская крепость»."
      - summary: "<b>Майор Пётр Гаврилов держал Восточный форт до 23 июля — 32 дня от начала войны.</b>"
        det:
          - Организованная оборона шла до конца июня, отдельные очаги жили и в июле. Гаврилова взяли в плен тяжелораненым и истощённым.
          - Фронт к тому времени ушёл далеко на восток, шли бои за Смоленск — а из брестских руин ещё стреляли.
        src: "Источник: мемориальный комплекс «Брестская крепость-герой» (brest-fortress.by); С. С. Смирнов, «Брестская крепость»."
      - summary: "<b>Что крепость держалась неделями, подтверждают донесения самой наступавшей дивизии.</b>"
        det:
          - Оборону подтверждают донесения 45-й пехотной дивизии вермахта, приказы и подлинные надписи на стенах. Спорна не сама оборона, а отдельные детали.
        src: "Источники: мемориальный комплекс «Брестская крепость-герой» (brest-fortress.by); портал «История.РФ» (history.ru)."
      - summary: "<b>Защитник выцарапал на стене: «Я умираю, но не сдаюсь! Прощай, Родина. 20/VII–41».</b>"
