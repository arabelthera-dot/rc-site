story:
  kicker: Подвиг
  h2: Зина Портнова
  abzacy:
  - Летом 1941 года ленинградская школьница Зина Портнова с младшей сестрой Галей приезжает на каникулы к бабушке в деревню Зуя под Оболью. Через несколько дней приходят немцы. В 1942 году в Оболи появляется подпольная организация «Юные мстители» — 38 школьников. Они взрывают эшелоны, водокачку, льнозавод, сжигают 2000 тонн льна. 605 дней немцы не могут выйти на их след.
  - Зина моет посуду в столовой для немецких офицеров и подсыпает в суп яд. Немцы заставляют её саму есть этот суп, и она ест, не моргнув. Летом 1943 года предатель выдаёт подполье, из 38 схвачены 34. Зина идёт узнать, кто их выдал, и попадает в гестапо. На допросе она хватает пистолет следователя и стреляет. Под пытками она седеет, но не называет ни одного имени. 10 января 1944 года Зину расстреливают. В 1958 году ей присвоено звание Героя Советского Союза.
