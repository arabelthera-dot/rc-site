  transcript:
  - Лето тысяча девятьсот сорок первого года. Ленинградская школьница Зина Портнова с младшей сестрой Галей приезжает на каникулы к бабушке, под станцию Оболь в Витебской области. Через несколько дней приходят немцы.
  - В Оболи тридцать восемь школьников создают подполье «Юные мстители». Они взрывают эшелоны и водокачку, сжигают две тысячи тонн льна. Шестьсот пять дней немцы не могут выйти на их след. Сестра Галя сидит на завалинке и поёт «Во поле берёзонька», если видит полицая.
  - Зина моет посуду в столовой немецких офицеров и подсыпает яд в суп. Когда офицеры начинают падать, немцы заставляют её саму есть этот суп. Она ест, не моргнув. Дома бабушка отпаивает её молочной сывороткой, и Зина выживает.
  - Летом сорок третьего предатель выдаёт подполье. Из тридцати восьми схвачены тридцать четыре. Зина одна идёт узнать, кто их выдал, и попадает в гестапо.
  - На допросе она хватает пистолет следователя и стреляет. Раненная, бежит к реке, но её хватают. Под пытками семнадцатилетняя Зина седеет, но не называет ни одного имени. Десятого января тысяча девятьсот сорок четвёртого года её расстреливают. Зина Портнова — Герой Советского Союза.
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
