  udary:
  - id: ns-0216-seno
    summary: На платформе загорелось сено, под ним показался танк, и назавтра наши разбомбили четыре эшелона
    det:
    - Через Оболь шли эшелоны с сеном. От паровозной искры одна платформа вспыхнула, немцы стали сбрасывать сено, и под ним показался танк. Подпольщики это заметили и передали партизанам.
    src: 'Источник: Lenta.ru. Дети войны — https://lenta.ru/articles/2025/03/15/deti/; БелТА+ — https://beltaplus.by/ru/human-ru/view/kogda-nachalas-vojna-ej-bylo-15-let-kakie-podvigi-sovershila-zina-portnova-s-otrjadom-16018-2023/'
    stranica: статья
    href: https://lenta.ru/articles/2025/03/15/deti/
    otryvok: «На следующий день советская авиация бомбила станцию. Четыре эшелона с танками были уничтожены.»
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n9
    dlya_voprosa: false
  - id: ns-0216-strelochnik
    summary: Стрелочник поставил одну мину, и на воздух взлетели сразу три эшелона
    det:
    - Подпольщик Николай Алексеев работал на станции. Он поставил мину с часовым механизмом, а к моменту взрыва на станции стояли три эшелона.
    src: 'Источник: БелТА+. Когда началась война, ей было 15 лет (к. и. н. Е. Павлова) — https://beltaplus.by/ru/human-ru/view/kogda-nachalas-vojna-ej-bylo-15-let-kakie-podvigi-sovershila-zina-portnova-s-otrjadom-16018-2023/'
    stranica: статья
    href: https://beltaplus.by/ru/human-ru/view/kogda-nachalas-vojna-ej-bylo-15-let-kakie-podvigi-sovershila-zina-portnova-s-otrjadom-16018-2023/
    otryvok: «Прогремел взрыв, было очень много разрушений, уничтожены все три эшелона…»
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n10
    dlya_voprosa: true
    otvet: три эшелона
    otvet_edinstvennyj: true
  - id: ns-0216-vedro
    summary: Мины для взрыва льнозавода несли мимо немцев в ведре с молоком
    det:
    - Руководительница подполья Ефросинья Зенькова несла три магнитные мины для электростанции и льнозавода. Мины лежали в ведре с молоком, капсюли — в платке.
    src: 'Источник: Е. Зенькова. «За тебя, Беларусь!» (сб. «Нам не забыть вас, ребята») — https://www.molodguard.ru/heroes445.htm'
    stranica: глава книги
    href: https://www.molodguard.ru/heroes445.htm
    otryvok: «Мины я опустила в ведро с молоком, а капсюли спрятала в платке.»
    pometka: один источник
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n7
    dlya_voprosa: false
  - id: ns-0216-len
    summary: Школьники сожгли 2000 тонн льна, который немцы готовили к отправке в Германию
    det:
    - За неполные два года «Юные мстители» совершили 21 диверсию. Один из пожаров уничтожил весь лён, приготовленный к вывозу в Германию.
    src: 'Источник: БелТА — https://belta.by/socium/view/podsypala-v-kastrjulju-s-supom-krysinyj-jad-sudba-junyh-mstitelej-iz-oboli-696658-2025/; «Наше общее отечество» — https://www.noo-journal.ru/oborona/istoriya/portnova-zina/'
