  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 605 дней; 2 — 34; 3 — 2000 тонн; 4 — три эшелона; 5 — «Во поле берёзонька».'
  ball: 10
  voprosy:
  - q: 'Ставка до ответа: сколько дней немцы не могли выйти на след «Юных мстителей»?'
    o:
    - '60'
    - '160'
    - '605'
    - '1000'
    a: 2
    e: 605 дней школьники вели диверсии у немцев под носом, на особо охраняемой станции.
  - q: Сколько подпольщиков из 38 схватили после предательства?
    o:
    - '4'
    - '14'
    - '24'
    - '34'
    a: 3
    e: На свободе остались четверо, и Зина пошла узнать, кто выдал товарищей.
  - q: Сколько льна, готового к отправке в Германию, сожгли школьники?
    o:
    - 20 тонн
    - 200 тонн
    - 2000 тонн
    - 20 000 тонн
    a: 2
    e: Две тысячи тонн льна сгорели вместе с льнозаводом.
  - q: Сколько эшелонов взлетело на воздух от одной мины стрелочника?
    o:
    - Один
    - Два
    - Три
    - Пять
    a: 2
    e: Мину ставили под один эшелон, а к взрыву на станции оказались три.
  - q: Какую песню пела Галя, если видела полицая?
    o:
    - «Катюша»
    - «Во поле берёзонька»
    - «Калинка»
    - «Священная война»
    a: 1
    e: Младшая сестра Зины сидела на завалинке и песней предупреждала подпольщиков.
