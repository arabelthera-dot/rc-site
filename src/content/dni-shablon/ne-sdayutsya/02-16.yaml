    otryvok: «Так, были уничтожены огнем 2 тыс. т льна, приготовленного для отправки в Германию.»
    pometka: два источника
    utverzhden: '2026-11-15'
    sravnenie: net
    istochnik: n11
    dlya_voprosa: true
    otvet: 2000 тонн
    otvet_edinstvennyj: true
  - id: ns-0216-vodokachka
    summary: Подпольщики взорвали водокачку, и паровозы к фронту две недели не могли набрать воду
    det:
    - Летом 1943 года Нина Азолина пронесла на охраняемую станцию угольную мину в маленькой красной сумочке и подбросила её в уголь у котельной. Через двое суток водокачка взлетела на воздух.
    src: 'Источник: БелТА — https://belta.by/socium/view/podsypala-v-kastrjulju-s-supom-krysinyj-jad-sudba-junyh-mstitelej-iz-oboli-696658-2025/; Е. Зенькова — https://www.molodguard.ru/heroes445.htm'
