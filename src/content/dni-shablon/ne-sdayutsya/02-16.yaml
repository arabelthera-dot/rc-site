  imya: portnova-portret
  vid: dokument
  kicker: Снимок под лупой
  h2: Лицо разведчицы
  lead: 'Такой Зина Портнова была до войны: ленинградская школьница, приехавшая на каникулы к бабушке. Приблизь снимок — через два года эта девочка будет мыть посуду в столовой немецких офицеров и подсыпать яд в их суп.'
