      - summary: <b>Комиссия 1948 года вскрыла могилу при сотне местных жителей — и нашла пулевые переломы рёбер.</b>
        det:
          - "В 1948 году, перед перезахоронением в Великих Луках, работала комиссия из представителей Минобороны, областных властей и медиков во главе с хирургом Козловской. Плотный влажный грунт сохранил тело и одежду: плащ-палатку, телогрейку, ватные брюки, шапку, валенки, гимнастёрку. Комиссия нашла смертельное ранение в грудь и огнестрельные переломы рёбер, один слева и два справа. Акт составили при «более чем сотни местных жителей»."
        src: "Источник: «Мародеры истории», «МК в Уфе», 14.12.2011 — https://ufa.mk.ru/articles/2011/12/14/653057-maroderyi-istorii.html"
        stranica: Мародеры истории, «МК в Уфе», 14.12.2011
        href: https://ufa.mk.ru/articles/2011/12/14/653057-maroderyi-istorii.html
        otryvok: «более чем сотни местных жителей»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: "<b>Накануне боя Матросов написал Лиде: если погибнуть — то «в бою и лицом на запад».</b>"
        det:
          - "Письмо Лидии Кургановой датировано 26 февраля 1943 года, за день до боя: если суждено погибнуть, то умереть «в бою и лицом на запад». Утром он собирался передать его связному."
        src: "Источник: Экштут С., «Родина», 2018, № 2 — https://rodina-history.ru/2018/02/22/rodina-matrosov.html; Базанов П., «Родина», № 2, 2024 — https://rodina-history.ru/2024/02/05/vek-aleksandra-matrosova.html; «Мародеры истории», «МК в Уфе», 14.12.2011 — https://ufa.mk.ru/articles/2011/12/14/653057-maroderyi-istorii.html ; Пометка: что письмо собирались передать связному — по «Родине» (2024); по «МК в Уфе» (2011), письмо нашли неотправленным в кармане"
        stranica: Экштут С., «Родина», 2018, № 2
        href: https://rodina-history.ru/2018/02/22/rodina-matrosov.html
        otryvok: «в бою и лицом на запад»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Бригада Матросова потеряла 411 убитыми, а 27 февраля немцы приказали уходить из-под Ржева.</b>
        det:
          - "В донесении политотдела 91-й бригады от 28 февраля 1943 года — 1327 человек потерь, из них 411 убитыми: 18 командиров, 80 младших командиров, 313 рядовых. 27 февраля немецкое командование приказало отводить войска с Ржевско-Вяземского выступа, 3 марта Западный фронт вошёл в Ржев. Локню освободили только через год, 26 февраля 1944 года."
        src: "Источник: Экштут С. «Километры и секунды Александра Матросова», «Родина», 2018, № 2 — https://rodina-history.ru/2018/02/22/rodina-matrosov.html"
        stranica: Экштут С. «Километры и секунды Александра Матросова», «Родина», 2018, № 2 (донесение политотдела 91 осбр от 28 февраля)
        href: https://rodina-history.ru/2018/02/22/rodina-matrosov.html
        otryvok: '«"Противник упорно сопротивляется, в результате чего имеем потери... 1327 человек. Из них убитых: комсостава - 18, младшего комсостава - 80, рядового состава - 313...»'
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>На его комсомольском билете вывели карандашом: «Лег на огневую точку противника и заглушил ее».</b>"
        det:
          - "Комсомольский билет достали из левого кармана гимнастёрки, пуля его не задела. Простым карандашом на нём написали: «Лег на огневую точку противника и заглушил ее. Проявил геройство…». Подлинник хранится в Центральном музее Вооружённых сил. Билет вынул командир отделения И. С. Токарев."
        src: "Источник: «Имя подвига — Александр Матросов», «Историк», 05.02.2024 — https://www.историк.рф/news/977; Базанов П., «Родина», № 2, 2024 — https://rodina-history.ru/2024/02/05/vek-aleksandra-matrosova.html; «Мародеры истории», «МК в Уфе», 14.12.2011 — https://ufa.mk.ru/articles/2011/12/14/653057-maroderyi-istorii.html ; Пометка: Токарев — по его собственным воспоминаниям у «Родины»; по МК, билет вынул помощник начальника политотдела Илья Ноздрачёв"
        stranica: Имя подвига — Александр Матросов, «Историк», 05.02.2024
        href: https://www.историк.рф/news/977
        otryvok: «Лег на огневую точку противника и заглушил ее. Проявил геройство…»
        pometka: два источника
        kadr:
          src: kartinka:000553
          alt: Фотокопия комсомольского билета № 17251590 на имя Матросова с косой карандашной надписью поперёк страницы взносов
          data_source: https://goskatalog.ru/portal/#/collections?id=24627099
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Фотокопия комсомольского билета Матросова с надписью «Лег на огневую точку противника и заглушил ее. Проявил геройство».
          credit: Государственный исторический музей, инв. И IX 10780, Госкаталог № 24483311
          width: 800
          height: 642
        utverzhden: 2026-11-03
      - summary: <b>Матросов погиб 27 февраля, а газеты перенесли подвиг на 23-е — к празднику армии.</b>
        det:
          - В базе «Мемориал» дата гибели — 27 февраля 1943 года, а 23 февраля стоит в советской печати и в приказе № 269.
        src: "Источник: Экштут С., «Родина», 2018, № 2 — https://rodina-history.ru/2018/02/22/rodina-matrosov.html; Багаутдиновы А. и Р., «Подвиг Александра Матросова: новые данные», «Ватандаш», 26.04.2022 — https://vatandash.ru/articles/istoriya/2022-04-26/podvig-aleksandra-matrosova-novye-dannye-2784474; Ерёменко А. И. (приказ № 269) — https://militera.lib.ru/memo/russian/eremenko_ai3/01.html ; Пометка: в наградном листе — 25 февраля; место гибели — Плетень по реконструкции «Родины» или подступы к Чернушке по Айрату и Рушану Багаутдиновым (у них дата — 25 февраля); есть гипотеза, что настоящее имя героя — Шакирьян Мухамедьянов"
        stranica: Экштут С., «Родина», 2018, № 2
        href: https://rodina-history.ru/2018/02/22/rodina-matrosov.html
        otryvok: «Шел 616-й день войны. 27 февраля 1943 года красноармеец Александр Матвеевич Матросов, закрыв грудью амбразуру вражеского дзота, стал легендарным героем Великой Отечественной.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Старший сержант Обит Шарипов подкрался к немецкому дзоту, уничтожил расчёт и забрал пулемёт.</b>
        det:
          - 26 февраля 1943 года, за день до подвига Матросова, помкомвзвода 1-й роты 2-го батальона старший сержант Обит Шарипов под Чернушками «подкрался к немецкому дзоту, уничтожил расчет и захватил немецкий пулемет». Был ранен. В тех же боях красноармеец 3-го батальона Ярулла Галимов из противотанкового ружья поджёг дзот и захватил пулемёт, его наградили орденом Красной Звезды. Обоих наградили приказом № 040 от 5 марта 1943 года.
        src: "Источник: Базанов П. «Век Александра Матросова», «Родина», № 2, 2024 — https://rodina-history.ru/2024/02/05/vek-aleksandra-matrosova.html"
        stranica: Базанов П. «Век Александра Матросова», «Родина», № 2, 2024
        href: https://rodina-history.ru/2024/02/05/vek-aleksandra-matrosova.html
        otryvok: «подкрался к немецкому дзоту, уничтожил расчет и захватил немецкий пулемет»
        pometka: документ
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-matrosov-ru.mp3
  durationLabel: 1 минута 21 секунда
  lead: "Голос ведёт от колонии в Уфе до приказа наркома: пять остановок. Слушать можно фоном, пока читаешь историю ниже."
  stops:
    - t: 0
      mark: 0:00
      title: Колония
    - t: 16
      mark: 0:16
      title: Две недели
    - t: 30
      mark: 0:30
      title: Три дзота
    - t: 49
      mark: 0:49
      title: Секунды
    - t: 67
      mark: 1:07
      title: Навечно
  transcript:
    - "<p>Уфа, тысяча девятьсот сорок второй год. Детская трудовая колония. Воспитанник Саша Матросов, слесарь и помощник воспитателя, твердит одно: его место на фронте. Осенью его провожают добровольцем.</p>"
    - <p>Двенадцатого февраля сорок третьего он прибывает в сибирскую добровольческую бригаду на Калининском фронте. Три ночи марша по лесам и болотам. Две трети бойцов корпуса — новобранцы, как он.</p>
    - <p>Батальон выходит на опушку и попадает под огонь трёх дзотов. Два подавили. Третий бьёт по лощине. К нему ползут двое автоматчиков. Товарища ранит. Матросов бросает две гранаты — пулемёт замолкает и оживает снова.</p>
    - "<p>Тогда он встаёт в полный рост и закрывает амбразуру собой. Несколько секунд без огня — и бойцы добегают до дзота. Агитатор Волков пишет на тетрадном листке: подробности доложу по возвращении. В тот же день Волков погибает.</p>"
    - <p>Осенью приказ наркома обороны навечно зачисляет Матросова в списки роты — первым в армии. А такой же подвиг за войну совершили больше четырёхсот человек. Имя одного стало словом для всех.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
