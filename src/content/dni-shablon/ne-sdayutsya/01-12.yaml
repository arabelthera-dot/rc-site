story:
  kicker: Среда подвига
  h2: Февраль 1943-го, лес под Локней
  abzacy:
    - Сталинградская битва только что закончилась. На Калининском фронте Сибирский добровольческий корпус идёт на Локню — железнодорожный узел в руках у немцев.
    - "Бригада добровольцев-сибиряков три ночи идёт лесами и болотами — 83 километра. Бойцы сами расчищают дороги и строят переправы. <b>Две трети корпуса — новобранцы. Александр Матросов среди них: в бригаду он прибыл 12 февраля.</b>"
    - Немцы ждут. Подступы к деревне закрывают три дзота — брёвна, земля, пулемёт; вокруг проволока и мины. Опушки и лощины пристреляны заранее.
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Александр Матросов — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Матросов бросил две гранаты, пулемёт ожил — и тогда он закрыл амбразуру собой.</b>
        det:
          - 16–17 февраля 1943 года бригада прошла от станции Земцы 83 км за три ночных перехода. 27 февраля 2-й батальон обошёл Плетень с фланга и вышел на опушку под огонь трёх дзотов; два фланговых уничтожили штурмовые группы, центральный не взяли и бронебойщики. К нему поползли Пётр Огурцов и Александр Матросов, Огурцова тяжело ранило. Матросов с фланга, примерно с 30 метров, бросил две гранаты, огонь прекратился, но когда батальоны поднялись, пулемёт ожил, и тогда Матросов встал в полный рост и закрыл амбразуру.
        src: "Источник: Экштут С. «Километры и секунды Александра Матросова. Полная реконструкция подвига», «Родина», 2018, № 2 — https://rodina-history.ru/2018/02/22/rodina-matrosov.html"
        stranica: Экштут С. «Километры и секунды Александра Матросова. Полная реконструкция подвига», «Родина», 2018, № 2
        href: https://rodina-history.ru/2018/02/22/rodina-matrosov.html
        otryvok: «Огурцов был тяжело ранен, а Матросов сумел подобраться к амбразуре с фланга. С расстояния примерно 30 метров он бросил одну за другой две гранаты. Огонь из дзота прекратился.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: "<b>Агитатор Волков написал о подвиге: «Подробности доложу по возвращении» — и погиб в тот же день.</b>"
        det:
          - "Первым о подвиге сообщил агитатор политотдела бригады старший лейтенант Пётр Ильич Волков, 36 лет, из Нижнего Тагила. 27 февраля он отправил записку: «…Чернушки взяты… Подробности доложу по возвращении». Вернуться ему не довелось: в тот же день Волков был убит."
        src: "Источник: Экштут С. «Километры и секунды Александра Матросова», «Родина», 2018, № 2 — https://rodina-history.ru/2018/02/22/rodina-matrosov.html"
        stranica: Экштут С. «Километры и секунды Александра Матросова», «Родина», 2018, № 2
        href: https://rodina-history.ru/2018/02/22/rodina-matrosov.html
        otryvok: «…Чернушки взяты… Подробности доложу по возвращении»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Санинструктор Валентина Шипица повела бойцов на дзот — и вынесла из боя 46 раненых с оружием.</b>
        det:
          - "Старшина медслужбы Валентина Александровна Шипица, санинструктор того же 2-го батальона, в боях 25–27 февраля 1943 года под Чернушками возглавила атаку на дзот. С поля боя она вынесла 46 раненых вместе с их оружием. Её наградили по приказу комбрига полковника С. И. Андронова № 040 от 5 марта 1943 года. Тем же приказом наградили санинструктора Елизавету Солнцеву: она вынесла 39 человек «в районе деревни Чернушки»."
        src: "Источник: Базанов П. «Век Александра Матросова», «Родина», № 2, 2024 (на сайте 05.02.2025) — https://rodina-history.ru/2024/02/05/vek-aleksandra-matrosova.html"
        stranica: Базанов П. «Век Александра Матросова», «Родина», № 2, 2024
        href: https://rodina-history.ru/2024/02/05/vek-aleksandra-matrosova.html
        otryvok: «в районе деревни Чернушки»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Комвзвода Леонид Королёв уничтожил немецкий расчёт и развернул его пулемёт против немцев.</b>
        det:
          - Младший лейтенант Леонид Семёнович Королёв командовал взводом автоматчиков 2-го батальона, того, где воевал Матросов. В боях 25–27 февраля 1943 года он вывел из строя немецкий пулемётный расчёт, убил офицера и «повернул пулемет немцев против противника». Награждён приказом № 040 от 5 марта 1943 года, всего этим приказом наградили 23 человек.
        src: "Источник: Базанов П. «Век Александра Матросова», «Родина», № 2, 2024 — https://rodina-history.ru/2024/02/05/vek-aleksandra-matrosova.html"
        stranica: Базанов П. «Век Александра Матросова», «Родина», № 2, 2024
        href: https://rodina-history.ru/2024/02/05/vek-aleksandra-matrosova.html
        otryvok: «повернул пулемет немцев против противника»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Командующий фронтом Ерёменко узнал, что подвиг никак не отмечен, — и послал офицера на место.</b>
        det:
          - В апреле 1943 года генерал-полковник А. И. Ерёменко вернулся в строй после ранения и принял Калининский фронт. В штабе много говорили о Матросове; Ерёменко спросил, как отмечен подвиг, и оказалось, «что пока никак». Он направил офицера управления фронта выяснить на месте все детали. Указ о звании Героя вышел 19 июня 1943 года. В мемуарах Ерёменко стоит дата 23 февраля, а «Собкор02» пишет о 27 февраля, «позднее перенесенный пропагандистами на 23 февраля».
        src: "Источник: Ерёменко А. И. «Годы возмездия. 1943–1945», М.: Наука, 1969 — https://militera.lib.ru/memo/russian/eremenko_ai3/01.html; «Подвиг Александра Матросова стал известен благодаря маршалу Андрею Еременко», «Собкор02», 07.05.2018 — https://sobkor02.ru/news/region/8655/"
        stranica: "Ерёменко А. И. «Годы возмездия. 1943–1945», М.: Наука, 1969"
        href: https://militera.lib.ru/memo/russian/eremenko_ai3/01.html
        otryvok: «что пока никак»
        pometka: два источника
        kadr:
          src: kartinka:000552
          alt: "Старая фотография: генерал Ерёменко и офицеры у открытого армейского вездехода на деревенской улице, за ними бревенчатые дома"
          data_source: https://goskatalog.ru/portal/#/collections?id=57550601
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Командующий Калининским фронтом Андрей Ерёменко, 1943 год. Фото Бориса Вдовенко.
          credit: Мультимедийный комплекс актуальных искусств (Москва), инв. ФII-19290, Госкаталог рег. № 57262600; фото Бориса Вдовенко
          width: 799
          height: 547
        utverzhden: 2026-11-03
      - summary: <b>445 бойцов закрыли амбразуры собой, а Алексей Очкин сделал это и выжил.</b>
        det:
          - "Такой подвиг совершили 445 человек, 14 из них остались живы. Первым ещё 24 августа 1941 года при обороне Новгорода закрыл собой амбразуру младший политрук танковой роты Александр Панкратов. Алексей Очкин, раненый в Сталинграде, сбежал из госпиталя, догнал полк на Курской дуге и закрыл дзот; его нашли хрипящим, с гранатой в руке: он собирался подорвать себя. После войны он окончил ВГИК и стал кинорежиссёром."
        src: "Источник: «Ни в одной другой армии мира», журнал «Историк», № 25, январь 2017 — https://историк.рф/journal/post/6273; «Бессмертный рядовой», «Столетие» — https://www.stoletie.ru/territoriya_istorii/bessmertnyj_radovoj_903.htm ; Пометка: число 445 и 14 выживших — по данным журнала «Историк»"
        stranica: Ни в одной другой армии мира, журнал «Историк», № 25, январь 2017
        href: https://историк.рф/journal/post/6273
        otryvok: «Однако мало кто знает, что 14 из 445 героев чудом остались живы, а один из них жив до сих пор!»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Покальчук лёг на амбразуру, с которой немцы только что сбросили тело его друга Гутченко.</b>
        det:
          - В августе 1942 года у станицы Клетской замполитрука Пётр Гутченко и младший лейтенант Александр Покальчук (93-й стрелковый полк 76-й дивизии) подползли к дзоту и забросали его гранатами, но пулемёт не замолчал. Первым на амбразуру лёг Гутченко. Когда бойцы поднялись, немцы сбросили его тело и снова открыли огонь, и тогда на ту же амбразуру лёг Покальчук. Высоту взяли, оба посмертно награждены орденом Ленина и стали Героями Советского Союза.
        src: "Источник: «Ни в одной другой армии мира», «Историк», № 25, январь 2017 — https://историк.рф/journal/post/6273; «Матросовцы Сталинградской битвы», газета «Дон» (Клетский район) — https://kletskdon.ru/matrosovcy-stalingradskoj-bitvy/"
        stranica: Ни в одной другой армии мира, «Историк», № 25, январь 2017
        href: https://историк.рф/journal/post/6273
        otryvok: «Но когда наши бойцы поднялись в атаку, вражеские пулеметчики с помощью заранее приготовленных шестов отбросили тело погибшего героя и продолжили стрельбу. В этот момент Покальчук, видевший гибель товарища, лег на ту же амбразуру.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Из колонии Матросов писал наркому как «простой рабочий из Уфы» — и просился оборонять Москву.</b>
        det:
          - "За нарушение паспортного режима Матросов получил два года и 21 апреля 1941 года прибыл в Уфимскую детскую трудовую колонию; в конце апреля он был среди колонистов, готовивших побег. Потом работал учеником слесаря, с марта 1942 года — помощником воспитателя и председателем конфликтной комиссии. Наркому обороны он писал: «Пишет вам простой рабочий из города Уфы» и просился добровольцем на Западный фронт, «в обороне Москвы». Такие просьбы он посылал не раз, призвали его в сентябре 1942 года."
        src: "Источник: «Мародеры истории», «МК в Уфе», 14.12.2011 — https://ufa.mk.ru/articles/2011/12/14/653057-maroderyi-istorii.html; «Грудью на амбразуру: жизнь и подвиг Александра Матросова», правительство Псковской области, 05.02.2020 — https://pskov.ru/press/05.02.20/119984/print/"
        stranica: Мародеры истории, «МК в Уфе», 14.12.2011
        href: https://ufa.mk.ru/articles/2011/12/14/653057-maroderyi-istorii.html
        otryvok: «Пишет вам простой рабочий из города Уфы»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: "<b>Матросова навечно зачислили в роту: на поверке за него отвечал правофланговый.</b>"
        det:
          - Приказ наркома обороны № 269 от 8 сентября 1943 года присвоил 254-му гвардейскому полку имя Матросова и навечно зачислил его в списки 1-й роты, первым в армии. На вечерней поверке старшина выкликал его имя первым, и правофланговый отвечал, что Матросов «пал смертью храбрых в бою за свободу и независимость нашей Родины». В 2019 году министр обороны вернул имя 254-му гвардейскому мотострелковому полку, 11 декабря 2020 года полк получил знамя.
        src: "Источник: Ерёменко А. И. «Годы возмездия» (текст приказа № 269) — https://militera.lib.ru/memo/russian/eremenko_ai3/01.html; С. Нанкин, «Повесть о герое», «Смена», № 593, февраль 1952 — https://smena-online.ru/node/45309/print; Багаутдиновы А. и Р., «Подвиг Александра Матросова: новые данные», «Ватандаш», 26.04.2022 — https://vatandash.ru/articles/istoriya/2022-04-26/podvig-aleksandra-matrosova-novye-dannye-2784474; Экштут С., «Родина», 2018, № 2 («первым советским воином, навечно зачисленным») — https://rodina-history.ru/2018/02/22/rodina-matrosov.html; «Историк», 05.02.2024 — https://www.историк.рф/news/977"
        stranica: Ерёменко А. И. «Годы возмездия» (текст приказа НКО № 269)
        href: https://militera.lib.ru/memo/russian/eremenko_ai3/01.html
        otryvok: «пал смертью храбрых в бою за свободу и независимость нашей Родины»
        pometka: два источника
        kadr:
          src: kartinka:000230
          alt: Листовка 1943 года «Бессмертный подвиг гвардии рядового Александра Матвеевича Матросова» с текстом приказа НКО № 269 в красной рамке
          data_source: https://goskatalog.ru/portal/#/collections?id=18580182
          license: цитирование в информационных и учебных целях с указанием автора и источника (ст. 1274 ГК РФ)
          podpis: Листовка 1943 года с текстом приказа наркома обороны № 269 о вечном зачислении Матросова в списки роты.
          credit: Центральный музей Великой Отечественной войны 1941–1945 гг., инв. ЛС-2928, Госкаталог № 18441450
          width: 520
