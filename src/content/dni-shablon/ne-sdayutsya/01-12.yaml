quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Девятнадцать; 2 — Бросил две гранаты; 3 — Агитатор политотдела старший лейтенант Волков; 4 — 404; 5 — Первым был навечно зачислен в списки части приказом наркома."
  ball: 10
  voprosy:
    - q: Сколько лет было Александру Матросову в день боя?
      o:
        - Шестнадцать
        - Девятнадцать
        - Двадцать пять
        - Тридцать
      a: 1
      e: "Девятнадцать: в феврале 1943 года, за несколько недель до боя."
    - q: Что он сделал, прежде чем броситься к дзоту?
      o:
        - Бросил две гранаты
        - Позвал командира
        - Отступил к своим
        - Сдался в плен
      a: 0
      e: С фланга, примерно с тридцати метров, он бросил две гранаты; пулемёт замолчал и ожил снова.
    - q: Кто первым сообщил о подвиге?
      o:
        - Командир фронта
        - Корреспондент газеты
        - Агитатор политотдела старший лейтенант Волков
        - Сам Матросов в письме
      a: 2
      e: Пётр Волков — запиской на тетрадном листке. В тот же день он погиб.
    - q: Сколько воинов за войну совершили такой же подвиг, по подсчёту исследователей?
      o:
        - Трое
        - Около двадцати
        - Сто
        - "404"
      a: 3
      e: 404, среди них две женщины (сборник «Самопожертвование на Великой Отечественной войне», 2002).
    - q: Чем Матросов стал первым в армии?
      o:
        - Первым получил автомат в бригаде
        - Первым был навечно зачислен в списки части приказом наркома
        - Первым дошёл до Берлина
        - Первым стал генералом
      a: 1
      e: Приказ № 269 от 8 сентября 1943 года зачислил его в списки 1-й роты навечно.
