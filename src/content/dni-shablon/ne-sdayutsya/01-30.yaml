      - summary: <b>Легасов пять часов докладывал в Вене правду об аварии, а дома его заподозрили в разглашении тайн.</b>
        det:
          - В августе 1986 года на совещании МАГАТЭ в Вене перед более чем 500 экспертами из 62 стран от СССР с докладом выступал Валерий Легасов; доклад о деталях аварии длился пять часов, и многочисленных исков к СССР после него не последовало. Дома нашлись те, кто посчитал, что доклад мог раскрыть секретные данные. Ещё в первые дни Легасов предложил забрасывать реактор с вертолётов смесью бора, свинца и доломитовой глины и убедил Щербину эвакуировать Припять.
        src: 'Источник: «"Неблагонадёжный" учёный. Как жил до и после Чернобыльской аварии Легасов?», В. Тимохина, К. Шестаков, «АиФ-Тула», 01.09.2019, https://tula.aif.ru/society/persona/neblagonadyozhnyy_uchyonyy_kak_zhil_do_i_posle_chernobylskoy_avarii_legasov'
        stranica: «"Неблагонадёжный" учёный. Как жил до и после Чернобыльской аварии Легасов?», В. Тимохина, К. Шестаков, «АиФ-Тула», 01.09.2019
        href: https://tula.aif.ru/society/persona/neblagonadyozhnyy_uchyonyy_kak_zhil_do_i_posle_chernobylskoy_avarii_legasov
        otryvok: «Собралось более 500 экспертов из 62 стран. Отчитывался Легасов. Пять часов.»
        utverzhden: 2026-11-03
      - summary: <b>Майор Телятников сам тушил пожар на ЧАЭС и стал одним из трёх живых Героев «за Чернобыль».</b>
        det:
          - "Начальник ВПЧ-2 Леонид Телятников «руководил и лично участвовал в тушении пожара». В тот день огонь тушили 69 пожарных на 19 машинах, шестеро погибли от острой лучевой болезни. К 6:35 утра основные очаги были ликвидированы. Живыми звание Героя Советского Союза «за Чернобыль» получили только трое: Телятников, лётчик Антошкин и начальник химвойск Пикалов."
        src: "Источник: ГУ МЧС России по Ивановской области, 26.04.2022, https://37.mchs.gov.ru/deyatelnost/press-centr/novosti/4730715; РИА Новости, 25.04.2026, https://ria.ru/20260425/pozharnye-2088393161.html; АвиаПорт, 28.04.2006, https://www.aviaport.ru/news/104180/"
        stranica: ГУ МЧС России по Ивановской области, 26.04.2022
        href: https://37.mchs.gov.ru/deyatelnost/press-centr/novosti/4730715
        otryvok: «Спустя считанные минуты уже руководил и лично участвовал в тушении пожара начальник ВПЧ-2 по охране ЧАЭС майор Леонид Телятников.»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Вертолётчики бомбили реактор мешками, хотя радиация над ним втрое превышала расчётную.</b>
        det:
          - Рассчитывали, что на высоте прохода будет до 1000 рентген, на деле было в 3–3,5 раза больше, в эпицентре — 10–12 тысяч. Приборы мерили только до 500 рентген. Каждый член экипажа за один пролёт получал 5–6 рентген, у борттехников после вылетов начиналась рвота. Сам Антошкин за 10 суток набрал около 605–608 рентген и потерял 11 кг веса.
        src: "Источник: «Вертолёты над Чернобылем», АвиаПорт, 28.04.2006, https://www.aviaport.ru/news/104180/"
        stranica: «Вертолёты над Чернобылем», АвиаПорт, 28.04.2006
        href: https://www.aviaport.ru/news/104180/
        otryvok: «Теоретически рассчитывали, что на высоте прохода радиационное облучение в пределах 1000 рентген, а на самом деле оно было в 3 - 3,5 раза больше.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Ликвидаторы вернулись с крыши в ботинках, которые светились на 50 рентген.</b>
        det:
          - Журналист Александр Крутов снимал в Чернобыле в 1986 году. По его словам, добровольцев строили в шеренгу и спрашивали согласия; очисткой крыши руководил молодой инженер Юрий Самойленко. Обувь вернувшихся с крыши «светилась» на 50 рентген. Безопасная доза для человека измеряется в микрорентгенах.
        src: "Источник: «Российская газета», 26.04.2026, https://rg.ru/2026/04/26/vedushchij-programmy-vremia-aleksandr-krutov-v-aprele-1986-go-mir-byl-na-voloske.html"
        stranica: «Российская газета», 26.04.2026
        href: https://rg.ru/2026/04/26/vedushchij-programmy-vremia-aleksandr-krutov-v-aprele-1986-go-mir-byl-na-voloske.html
        otryvok: «Ботинки вернувшихся с крыши светились на 50 рентген.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-30-goskatalog-20046324.jpg
          alt: Светлая льняная куртка прямого покроя с белыми пластмассовыми пуговицами и тремя карманами, разложенная на ткани.
          data_source: https://goskatalog.ru/portal/#/collections?id=20046324
          license: цитирование с указанием музея и Госкаталога (ст. 1274 ГК РФ)
          podpis: Куртка от костюма ликвидатора последствий аварии на ЧАЭС С.С. Климченко. 1986.
          credit: Саратовский «Музей боевой и трудовой славы», № МБС 8962/1 (ТКН 560), Госкаталог № 20046324
          width: 819
          height: 768
        utverzhden: 2026-11-03
      - summary: "<b>Припять опустела менее чем за три часа: к городу стянули около 1200 автобусов.</b>"
        det:
          - "Вывоз жителей начался 27 апреля в 14:00, примерно через 36 часов после аварии. Автобусы выстроились в многокилометровую колонну. Операция прошла стремительно: менее чем за три часа город, где накануне жили десятки тысяч человек, практически опустел. Всего из 30-километровой зоны эвакуировали более 115 тысяч человек."
        src: "Источник: «Чернобыльская авария: что произошло на АЭС 26 апреля 1986», РИА Новости, 25.04.2026, https://ria.ru/20260425/avariya-na-chernobylskoy-aes-2088934431.html; ГУ МЧС России по Тульской области, https://71.mchs.gov.ru/deyatelnost/press-centr/novosti/3563832"
        stranica: "«Чернобыльская авария: что произошло на АЭС 26 апреля 1986», РИА Новости, 25.04.2026"
        href: https://ria.ru/20260425/avariya-na-chernobylskoy-aes-2088934431.html
        otryvok: «К Припяти стянули около 1200 автобусов, выстроенных в многокилометровую колонну.»
        utverzhden: 2026-11-03
      - summary: "<b>Ананенко развенчал миф сериала: «водолазы» шли по воде по щиколотку и не умерли от облучения.</b>"
        det:
          - "По словам Ананенко, в затопленном коридоре вода оказалась на уровне щиколоток. Гидрокостюмов не было: дали обычные респираторы и два дозиметра, на груди и на лодыжке; главный риск — никто не знал, как изменится активность воды в глубине коридора. После операции все трое продолжили работать на ЧАЭС. Баранов умер в 2005 году, Беспалов и Ананенко в 2019-м были живы."
        src: "Источник: ТВ «Звезда», 08.06.2019, https://tvzvezda.ru/news/2019681120-21A8y.html"
        stranica: ТВ «Звезда», 08.06.2019
        href: https://tvzvezda.ru/news/2019681120-21A8y.html
        otryvok: «Вода оказалась на уровне щиколоток.»
        utverzhden: 2026-11-03
      - summary: <b>Более 600 тысяч ликвидаторов прошли через Чернобыль, из них 340 тысяч военных.</b>
        det:
          - С 1986 по 1992 год в ликвидации участвовали более 600 тысяч человек, в том числе более 210 воинских частей общей численностью 340 тысяч военнослужащих; свыше 90 тысяч из них были в зоне в самый острый период, с апреля по декабрь 1986 года. В 30-километровой зоне работали более миллиона человек. Генерал Тараканов сравнивал полмиллиона прошедших через очаг за пять лет с наполеоновской армией.
        src: "Источник: ГУ МЧС России по Тульской области, https://71.mchs.gov.ru/deyatelnost/press-centr/novosti/3563832; газета «Культура», 22.02.2016, https://portal-kultura.ru/articles/history/129184-zhivoy-geroy-mertvogo-gorodasazh/"
        stranica: ГУ МЧС России по Тульской области
        href: https://71.mchs.gov.ru/deyatelnost/press-centr/novosti/3563832
        otryvok: «С 1986 года по 1992г.г. участие в ликвидации последствий аварии на ЧАЭС приняло более 600 000 человек и более миллиона людей было задействовано в работах в 30-километровой зоне.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-30-goskatalog-11514652.jpg
          alt: Голубая коленкоровая обложка с потёртыми краями и тиснёной надписью «Удостоверение».
          data_source: https://goskatalog.ru/portal/#/collections?id=11514652
