fakty:
  - id: fakty
    kicker: Десять фактов
    h2: ликвидаторы Чернобыля — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Ананенко, Беспалов и Баранов спустились под взорванный блок и слили воду из-под реактора.</b>
        det:
          - "Правительственная комиссия опасалась, что «лава» из разрушенного реактора дойдёт до воды под 4-м блоком и последствия будут непредсказуемы. Нужно было открыть задвижки в тоннеле на глубине трёх метров под станцией. Задание досталось смене старшего инженера-механика реакторного цеха Алексея Ананенко. Задвижки нашли, открыли и по шуму воды поняли: «Вода ушла. И нам оставалось только вернуться и подняться»."
        src: 'Источник: «"Чернобыльские дайверы": ликвидатор затопленного коридора под реактором рассказал правду о задании», ТВ «Звезда», 08.06.2019 (пересказ интервью Ананенко), https://tvzvezda.ru/news/2019681120-21A8y.html'
        stranica: '«"Чернобыльские дайверы": ликвидатор затопленного коридора под реактором рассказал правду о задании», ТВ «Звезда», 08.06.2019 (пересказ интервью Ананенко)'
        href: https://tvzvezda.ru/news/2019681120-21A8y.html
        otryvok: «Чтобы это сделать, было необходимо открыть задвижки в тоннеле на глубине трех метров под станцией.»
        utverzhden: 2026-11-03
      - summary: <b>Лейтенанты Правик и Кибенок в 23 года не пустили огонь с 4-го блока на 3-й и погибли от облучения.</b>
        det:
          - Караул Владимира Правика (14 человек) прибыл к станции в 1:28, через четыре минуты после взрывов. В 1:35 подошёл караул Виктора Кибенка из Припяти (10 бойцов). Они тушили кровлю машинного зала на высоте более 70 метров, среди плавящегося битума и раскалённых обломков графита. Оба умерли в ночь на 11 мая 1986 года от острой лучевой болезни, обоим посмертно присвоено звание Героя Советского Союза.
        src: "Источник: «Истории пожарных, первыми прибывших к месту аварии на ЧАЭС», РИА Новости, 25.04.2026, https://ria.ru/20260425/pozharnye-2088393161.html; «Их было 28 — пожарные Чернобыля», ГУ МЧС России по Ивановской области, 26.04.2022, https://37.mchs.gov.ru/deyatelnost/press-centr/novosti/4730715"
        stranica: «Истории пожарных, первыми прибывших к месту аварии на ЧАЭС», РИА Новости, 25.04.2026
        href: https://ria.ru/20260425/pozharnye-2088393161.html
        otryvok: "«Караулы Правика и Кибенка начали тушить кровлю машинного зала. Это была критическая точка : если бы огонь перекинулся на 3-й энергоблок, масштаб катастрофы стал бы невообразимым.»"
        utverzhden: 2026-11-03
      - summary: <b>Солдаты вручную очистили крышу 3-го блока от графита там, где отказала электроника роботов.</b>
        det:
          - "На крыше третьего блока лежало 156 тонн осколков графита из взорвавшегося реактора, радиация наверху была от 300 до 2000 рентген. Сначала пробовали луноход и радиоуправляемых роботов, но электроника на крыше «сходила с ума». Тогда пошли люди: забежать, захватить графит лопатой, сбросить вниз — на всё 45 секунд. На опросах в шеренге отказывались лишь двое-трое, так набрали 5 тысяч добровольцев. Один выход на крышу означал последний день работы в Чернобыле."
        src: "Источник: «45 секунд до смерти: Журналист Александр Крутов — о том, что увидел на Чернобыльской АЭС 40 лет назад», «Российская газета», 26.04.2026, https://rg.ru/2026/04/26/vedushchij-programmy-vremia-aleksandr-krutov-v-aprele-1986-go-mir-byl-na-voloske.html"
        stranica: "«45 секунд до смерти: Журналист Александр Крутов — о том, что увидел на Чернобыльской АЭС 40 лет назад», «Российская газета», 26.04.2026"
        href: https://rg.ru/2026/04/26/vedushchij-programmy-vremia-aleksandr-krutov-v-aprele-1986-go-mir-byl-na-voloske.html
        otryvok: «Но вся эта аппаратура на крыше третьего реактора стала вдруг "сходить с ума" - электроника отказывалась работать. И тогда было принято решение все делать руками добровольцев.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-30-goskatalog-1413481.jpg
          alt: "Чёрно-белый снимок из окна: человек в маске с щупом дозиметра в руке, за стеклом — разрушенный блок, башенные краны и площадка с бетонными блоками."
          data_source: https://goskatalog.ru/portal/#/collections?id=1413481
          license: цитирование в информационных и учебных целях с указанием музея и Госкаталога (ст. 1274 ГК РФ); автор указан (Зуфаров В.А.), авторские права могут действовать — при крупном показе лучше получить разрешение музея
          podpis: Дозиметрический контроль четвёртого энергоблока Чернобыльской АЭС. 1986. Фото Валерия Зуфарова.
          credit: ГБУК ВО «Владимиро-Суздальский музей-заповедник», № ФН-7079 (КП В-40050/11), Госкаталог № 1413481
          width: 800
