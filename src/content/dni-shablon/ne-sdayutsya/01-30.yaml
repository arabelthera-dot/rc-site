          podpis: Удостоверение № 947047 участника ликвидации аварии на ЧАЭС (с 12.05 по 21.07.1986) Александра Ивановича Катюшкина. Выдано Азовским горвоенкоматом 18.08.1993.
          credit: ГБУК РО «Азовский историко-археолого-палеонтологический музей-заповедник», № АМЗ КП 30561/132, Госкаталог № 11514652
