quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Ответы: 1 — Задвижки, чтобы слить воду из-под реактора; 2 — В тормозные парашюты; 3 — 136 метров; 4 — 206; 5 — По щиколотку."
  ball: 10
  voprosy:
    - q: Что открыли Ананенко, Беспалов и Баранов в тоннеле под 4-м блоком?
      o:
        - Люк на крышу машинного зала
        - Задвижки, чтобы слить воду из-под реактора
        - Шлюз для пожарных машин
        - Дверь в комнату комиссии
      a: 1
      e: "Комиссия боялась, что «лава» из реактора дойдёт до воды под блоком. Смена Ананенко нашла и открыла задвижки на глубине трёх метров и по шуму поняла: «Вода ушла»."
    - q: Во что генерал Антошкин предложил грузить песок для сброса на реактор?
      o:
        - В бочки
        - В мешки из-под цемента
        - В тормозные парашюты
        - В деревянные ящики
      a: 2
      e: Он вспомнил портовые краны с сетками. Из ВДВ привезли 14 тысяч парашютов, и когда сброс наладили, за день в реактор уходило полторы тысячи тонн.
    - q: Какой длины тоннель прорыли шахтёры под 4-м блоком?
      o:
        - 36 метров
        - 136 метров
        - 360 метров
        - 1360 метров
      a: 1
      e: Тоннель длиной 136 метров вели, чтобы расплав из реактора не ушёл в грунт. Смена в забое длилась три часа, и бригады спорили за каждую минуту.
    - q: Сколько дней строители УС-605 возводили «Укрытие» над реактором?
      o:
        - "56"
        - "106"
        - "206"
        - "306"
      a: 2
      e: Работы шли 206 дней и ночей и закончились 30 ноября 1986 года. Только строителей на объекте было около 90 тысяч.
    - q: Какой глубины была вода в затопленном коридоре, по словам Ананенко?
      o:
        - По щиколотку
        - По пояс
        - По грудь
        - С головой
      a: 0
      e: Вода оказалась на уровне щиколоток, гидрокостюмов не было. После операции все трое продолжили работать на ЧАЭС.
