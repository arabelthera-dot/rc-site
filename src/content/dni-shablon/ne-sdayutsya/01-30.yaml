story:
  kicker: Подвиг
  h2: Ликвидаторы Чернобыля
  abzacy:
    - Ночью взорвался четвёртый блок Чернобыльской АЭС. Лейтенанты Владимир Правик и Виктор Кибенок не пустили огонь на третий блок и погибли от облучения. Правительственная комиссия боялась, что раскалённая «лава» из реактора дойдёт до воды под блоком. Смена Алексея Ананенко — он, Беспалов и Баранов — спустилась в тоннель под станцией, открыла задвижки и слила воду.
    - Потом пошли тысячи. Вертолётчики генерала Антошкина сбрасывали на реактор песок в тормозных парашютах — до полутора тысяч тонн в день. Шахтёры прорыли под блоком тоннель длиной 136 метров. Солдаты лопатами сбрасывали графит с крыши там, где отказали роботы. Строители УС-605 за 206 дней накрыли реактор «Укрытием». Всего через Чернобыль прошли больше 600 тысяч ликвидаторов.
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Ликвидаторы Чернобыля
    udary:
      - summary: <b>Ананенко, Беспалов и Баранов спустились под взорванный блок и слили воду из-под реактора.</b>
        det:
          - "Правительственная комиссия опасалась, что «лава» из разрушенного реактора дойдёт до воды под 4-м блоком и последствия будут непредсказуемы. Нужно было открыть задвижки в тоннеле на глубине трёх метров под станцией. Задание досталось смене старшего инженера-механика реакторного цеха Алексея Ананенко. Задвижки нашли, открыли и по шуму воды поняли: «Вода ушла. И нам оставалось только вернуться и подняться»."
        src: 'Источник: «"Чернобыльские дайверы": ликвидатор затопленного коридора под реактором рассказал правду о задании», ТВ «Звезда», 08.06.2019 (пересказ интервью Ананенко), https://tvzvezda.ru/news/2019681120-21A8y.html'
        stranica: '«"Чернобыльские дайверы": ликвидатор затопленного коридора под реактором рассказал правду о задании», ТВ «Звезда», 08.06.2019 (пересказ интервью Ананенко)'
        href: https://tvzvezda.ru/news/2019681120-21A8y.html
        otryvok: «Вода ушла. И нам оставалось только вернуться и подняться»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Лейтенанты Правик и Кибенок в 23 года не пустили огонь с 4-го блока на 3-й и погибли от облучения.</b>
        det:
          - Караул Владимира Правика (14 человек) прибыл к станции в 1:28, через четыре минуты после взрывов. В 1:35 подошёл караул Виктора Кибенка из Припяти (10 бойцов). Они тушили кровлю машинного зала на высоте более 70 метров, среди плавящегося битума и раскалённых обломков графита. Оба умерли в ночь на 11 мая 1986 года от острой лучевой болезни, обоим посмертно присвоено звание Героя Советского Союза.
        src: "Источник: «Истории пожарных, первыми прибывших к месту аварии на ЧАЭС», РИА Новости, 25.04.2026, https://ria.ru/20260425/pozharnye-2088393161.html; «Их было 28 — пожарные Чернобыля», ГУ МЧС России по Ивановской области, 26.04.2022, https://37.mchs.gov.ru/deyatelnost/press-centr/novosti/4730715"
        stranica: «Истории пожарных, первыми прибывших к месту аварии на ЧАЭС», РИА Новости, 25.04.2026
        href: https://ria.ru/20260425/pozharnye-2088393161.html
        otryvok: "«Караулы Правика и Кибенка начали тушить кровлю машинного зала. Это была критическая точка : если бы огонь перекинулся на 3-й энергоблок, масштаб катастрофы стал бы невообразимым.»"
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>Солдаты вручную очистили крышу 3-го блока от графита там, где отказала электроника роботов.</b>
        det:
          - "На крыше третьего блока лежало 156 тонн осколков графита из взорвавшегося реактора, радиация наверху была от 300 до 2000 рентген. Сначала пробовали луноход и радиоуправляемых роботов, но электроника на крыше «сходила с ума». Тогда пошли люди: забежать, захватить графит лопатой, сбросить вниз — на всё 45 секунд. На опросах в шеренге отказывались лишь двое-трое, так набрали 5 тысяч добровольцев. Один выход на крышу означал последний день работы в Чернобыле."
        src: "Источник: «45 секунд до смерти: Журналист Александр Крутов — о том, что увидел на Чернобыльской АЭС 40 лет назад», «Российская газета», 26.04.2026, https://rg.ru/2026/04/26/vedushchij-programmy-vremia-aleksandr-krutov-v-aprele-1986-go-mir-byl-na-voloske.html"
        stranica: "«45 секунд до смерти: Журналист Александр Крутов — о том, что увидел на Чернобыльской АЭС 40 лет назад», «Российская газета», 26.04.2026"
        href: https://rg.ru/2026/04/26/vedushchij-programmy-vremia-aleksandr-krutov-v-aprele-1986-go-mir-byl-na-voloske.html
        otryvok: «сходила с ума»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-30-goskatalog-20046324.jpg
          alt: Светлая льняная куртка прямого покроя с белыми пластмассовыми пуговицами и тремя карманами, разложенная на ткани.
          data_source: https://goskatalog.ru/portal/#/collections?id=20046324
          license: цитирование с указанием музея и Госкаталога (ст. 1274 ГК РФ)
          podpis: Куртка от костюма ликвидатора последствий аварии на ЧАЭС С.С. Климченко. 1986.
          credit: Саратовский «Музей боевой и трудовой славы», № МБС 8962/1 (ТКН 560), Госкаталог № 20046324
          width: 819
          height: 768
        utverzhden: 2026-11-03
      - summary: <b>Антошкин стал сбрасывать песок на реактор в тормозных парашютах и довёл сброс до 1500 т в день.</b>
        det:
          - В первый день вертолётчики сбросили около 56 тонн мешков, а учёные требовали 5–6 тысяч тонн. Антошкин вспомнил портовые краны с сетками и предложил грузить песок в тормозные парашюты на внешней подвеске; из ВДВ привезли 14 тысяч парашютов. Свинец вешали по 50 кг на каждую из 28 строп, всего 1400 кг. Когда наладили подъём свинца, за один день сбросили в реактор полторы тысячи тонн.
        src: "Источник: «Вертолёты над Чернобылем» (интервью Н. Т. Антошкина белорусскому журналу «Армия»), АвиаПорт, 28.04.2006, https://www.aviaport.ru/news/104180/"
        stranica: «Вертолёты над Чернобылем» (интервью Н. Т. Антошкина белорусскому журналу «Армия»), АвиаПорт, 28.04.2006
        href: https://www.aviaport.ru/news/104180/
        otryvok: «Осенило! Тормозные парашюты.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Шахтёры прорыли тоннель под реактором за месяц с небольшим вместо трёх с лишним месяцев.</b>
        det:
          - "Тоннель длиной 136 метров вели под 4-й блок, чтобы расплав из реактора не ушёл в грунт. Тульский шахтёр Владимир Наумов вспоминал: смена длилась три часа, и бригады спорили за каждую минуту в забое — «там такие рекорды ставились, которые никогда не будут повторены». Голыми, как в сериале, шахтёры не работали."
        src: 'Источник: «Шахтёр из Тулы оценил достоверность сериала "Чернобыль"», РИА Новости, 12.06.2019, https://ria.ru/20190612/1555505356.html; «Авария в 1986 году на Чернобыльской АЭС. Историческая справка», МЧС России, https://mchs.gov.ru/deyatelnost/press-centr/informacionnye-proekty/30-letie-katastrofy-na-chernobylskoy-aes/avariya-v-1986-godu-na-chernobylskoy-aes-istoricheskaya-spravka'
        stranica: «Шахтёр из Тулы оценил достоверность сериала "Чернобыль"», РИА Новости, 12.06.2019
        href: https://ria.ru/20190612/1555505356.html
        otryvok: «там такие рекорды ставились, которые никогда не будут повторены»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-30-goskatalog-41616672.jpg
          alt: "Небольшая чёрно-белая карточка с отрезанным уголком: пожилой седой мужчина в пиджаке и рубашке в полоску смотрит прямо в камеру."
          data_source: https://goskatalog.ru/portal/#/collections?id=41616672
          license: цитирование с указанием музея и Госкаталога (ст. 1274 ГК РФ)
          podpis: Фотопортрет. Возвышаев В.П., шахтёр, ликвидатор последствий аварии на Чернобыльской АЭС. 1990-е.
          credit: МБУК «Историко-художественный музейный комплекс «Бобрики», инв. Ф 2131, Госкаталог № 41616672
          width: 884
          height: 1024
        utverzhden: 2026-11-03
      - summary: <b>Генерал Тараканов добился свинцовых листов для солдат, потребовав их у зампреда Совмина Щербины.</b>
        det:
          - "Николай Тараканов руководил удалением высокорадиоактивных обломков с крыш ЧАЭС. Правительственная комиссия заседала в комнате, обитой свинцом, и он потребовал от Щербины снять листы и отдать солдатам; из них резали «рубашки» на грудь и спину, поверх надевали рентгеновский фартук и две пары перчаток — всего 26 кг. Солдат он подводил к монитору: графит «буквально впаян в кровлю», бери кувалду и отбивай. На крыше большинство побывали один раз, редко два."
        src: "Источник: Е. Сажнева, «Живой герой мёртвого города», газета «Культура», 22.02.2016, https://portal-kultura.ru/articles/history/129184-zhivoy-geroy-mertvogo-gorodasazh/"
        stranica: Е. Сажнева, «Живой герой мёртвого города», газета «Культура», 22.02.2016
        href: https://portal-kultura.ru/articles/history/129184-zhivoy-geroy-mertvogo-gorodasazh/
        otryvok: «буквально впаян в кровлю»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Солдаты Тараканова сняли с крыш ЧАЭС 300 тонн ядерного горючего, графита и обломков.</b>
        det:
          - Роботы из ГДР в Чернобыле сразу вышли из строя, и 16 сентября 1986 года правительственная комиссия решила послать на крышу солдат. Через пролом ставили пожарную лестницу, внизу стоял офицер с секундомером, группа из пяти человек выскакивала на крышу; «дозу военного времени ребята получали за две-три минуты», максимум за пять. Ещё 300 тысяч кубометров заражённой земли вывезли в десять могильников.
        src: "Источник: Е. Сажнева, «Живой герой мёртвого города», газета «Культура», 22.02.2016, https://portal-kultura.ru/articles/history/129184-zhivoy-geroy-mertvogo-gorodasazh/"
        stranica: Е. Сажнева, «Живой герой мёртвого города», газета «Культура», 22.02.2016
        href: https://portal-kultura.ru/articles/history/129184-zhivoy-geroy-mertvogo-gorodasazh/
        otryvok: «дозу военного времени ребята получали за две-три минуты»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Строители УС-605 за 206 дней и ночей накрыли взорванный реактор «Укрытием».</b>
        det:
          - "Проектирование началось 20 мая 1986 года, рассмотрели 18 вариантов. Арку на 230 м отвергли: она требовала полтора-два года, выбрали схему на несколько месяцев. В первые числа июня начали строить бетонный завод и за 15 дней запустили первую установку; три установки давали до 6000 кубометров бетона в сутки. Работы закончили 30 ноября 1986 года, только строителей на объекте было около 90 тысяч."
        src: "Источник: «Строительство объекта Укрытие (Саркофаг)», Сибирский региональный Союз «Чернобыль», http://souzchernobylnsk.ru/articles/stroitelstvo-obekta-ukrytie (только http)"
        stranica: «Строительство объекта Укрытие (Саркофаг)», Сибирский региональный Союз «Чернобыль»
        href: http://souzchernobylnsk.ru/articles/stroitelstvo-obekta-ukrytie
        otryvok: «Строительство продолжалось 206 дней и ночей с июня по ноябрь 1986 года . В нем приняли непосредственное участие только строителей около 90 тысяч человек.»
        pometka: один источник
        kadr:
          src: /muzei/ne-sdayutsya/img/01-30-goskatalog-17377493.jpg
          alt: "Чёрно-белое фото: семеро мужчин в белых робах, шапочках и респираторах стоят в ряд перед громадной ступенчатой стеной саркофага."
          data_source: https://goskatalog.ru/portal/#/collections?id=17377493
          license: цитирование с указанием музея и Госкаталога (ст. 1274 ГК РФ); автор снимка в Госкаталоге не указан
          podpis: Сотрудники ВНИИЭФ, группа дозиметрического контроля, на сооружении саркофага над четвёртым блоком Чернобыльской АЭС. 1987.
          credit: ФГБУК «Государственный центральный музей современной истории России», № ГИК 44986/107, Госкаталог № 17377493
          width: 800
          height: 610
        utverzhden: 2026-11-03
      - summary: <b>Легасов пять часов докладывал в Вене правду об аварии, а дома его заподозрили в разглашении тайн.</b>
        det:
          - В августе 1986 года на совещании МАГАТЭ в Вене перед более чем 500 экспертами из 62 стран от СССР с докладом выступал Валерий Легасов; доклад о деталях аварии длился пять часов, и многочисленных исков к СССР после него не последовало. Дома нашлись те, кто посчитал, что доклад мог раскрыть секретные данные. Ещё в первые дни Легасов предложил забрасывать реактор с вертолётов смесью бора, свинца и доломитовой глины и убедил Щербину эвакуировать Припять.
        src: 'Источник: «"Неблагонадёжный" учёный. Как жил до и после Чернобыльской аварии Легасов?», В. Тимохина, К. Шестаков, «АиФ-Тула», 01.09.2019, https://tula.aif.ru/society/persona/neblagonadyozhnyy_uchyonyy_kak_zhil_do_i_posle_chernobylskoy_avarii_legasov'
        stranica: «"Неблагонадёжный" учёный. Как жил до и после Чернобыльской аварии Легасов?», В. Тимохина, К. Шестаков, «АиФ-Тула», 01.09.2019
        href: https://tula.aif.ru/society/persona/neblagonadyozhnyy_uchyonyy_kak_zhil_do_i_posle_chernobylskoy_avarii_legasov
        otryvok: «Собралось более 500 экспертов из 62 стран. Отчитывался Легасов. Пять часов.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Майор Телятников сам тушил пожар на ЧАЭС и стал одним из трёх живых Героев «за Чернобыль».</b>
        det:
          - "Начальник ВПЧ-2 Леонид Телятников «руководил и лично участвовал в тушении пожара». В тот день огонь тушили 69 пожарных на 19 машинах, шестеро погибли от острой лучевой болезни. К 6:35 утра основные очаги были ликвидированы. Живыми звание Героя Советского Союза «за Чернобыль» получили только трое: Телятников, лётчик Антошкин и начальник химвойск Пикалов."
        src: "Источник: ГУ МЧС России по Ивановской области, 26.04.2022, https://37.mchs.gov.ru/deyatelnost/press-centr/novosti/4730715; РИА Новости, 25.04.2026, https://ria.ru/20260425/pozharnye-2088393161.html; АвиаПорт, 28.04.2006, https://www.aviaport.ru/news/104180/"
        stranica: ГУ МЧС России по Ивановской области, 26.04.2022
        href: https://37.mchs.gov.ru/deyatelnost/press-centr/novosti/4730715
        otryvok: «руководил и лично участвовал в тушении пожара»
        pometka: документ
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Вертолётчики бомбили реактор мешками, хотя радиация над ним втрое превышала расчётную.</b>
        det:
          - Рассчитывали, что на высоте прохода будет до 1000 рентген, на деле было в 3–3,5 раза больше, в эпицентре — 10–12 тысяч. Приборы мерили только до 500 рентген. Каждый член экипажа за один пролёт получал 5–6 рентген, у борттехников после вылетов начиналась рвота. Сам Антошкин за 10 суток набрал около 605–608 рентген и потерял 11 кг веса.
        src: "Источник: «Вертолёты над Чернобылем», АвиаПорт, 28.04.2006, https://www.aviaport.ru/news/104180/"
        stranica: «Вертолёты над Чернобылем», АвиаПорт, 28.04.2006
        href: https://www.aviaport.ru/news/104180/
        otryvok: «Теоретически рассчитывали, что на высоте прохода радиационное облучение в пределах 1000 рентген, а на самом деле оно было в 3 - 3,5 раза больше.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Ликвидаторы вернулись с крыши в ботинках, которые светились на 50 рентген.</b>
        det:
          - Журналист Александр Крутов снимал в Чернобыле в 1986 году. По его словам, добровольцев строили в шеренгу и спрашивали согласия; очисткой крыши руководил молодой инженер Юрий Самойленко. Обувь вернувшихся с крыши «светилась» на 50 рентген. Безопасная доза для человека измеряется в микрорентгенах.
        src: "Источник: «Российская газета», 26.04.2026, https://rg.ru/2026/04/26/vedushchij-programmy-vremia-aleksandr-krutov-v-aprele-1986-go-mir-byl-na-voloske.html"
        stranica: «Российская газета», 26.04.2026
        href: https://rg.ru/2026/04/26/vedushchij-programmy-vremia-aleksandr-krutov-v-aprele-1986-go-mir-byl-na-voloske.html
        otryvok: «Ботинки вернувшихся с крыши светились на 50 рентген.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: "<b>Припять опустела менее чем за три часа: к городу стянули около 1200 автобусов.</b>"
        det:
          - "Вывоз жителей начался 27 апреля в 14:00, примерно через 36 часов после аварии. Автобусы выстроились в многокилометровую колонну. Операция прошла стремительно: менее чем за три часа город, где накануне жили десятки тысяч человек, практически опустел. Всего из 30-километровой зоны эвакуировали более 115 тысяч человек."
        src: "Источник: «Чернобыльская авария: что произошло на АЭС 26 апреля 1986», РИА Новости, 25.04.2026, https://ria.ru/20260425/avariya-na-chernobylskoy-aes-2088934431.html; ГУ МЧС России по Тульской области, https://71.mchs.gov.ru/deyatelnost/press-centr/novosti/3563832"
        stranica: "«Чернобыльская авария: что произошло на АЭС 26 апреля 1986», РИА Новости, 25.04.2026"
        href: https://ria.ru/20260425/avariya-na-chernobylskoy-aes-2088934431.html
        otryvok: «К Припяти стянули около 1200 автобусов, выстроенных в многокилометровую колонну.»
        pometka: два источника
        utverzhden: 2026-11-03
      - summary: <b>«Водолазы» Чернобыля прошли затопленный коридор по щиколотку в воде — и, вопреки сериалу, не умерли от облучения.</b>
        det:
          - "По словам Ананенко, в затопленном коридоре вода оказалась на уровне щиколоток. Гидрокостюмов не было: дали обычные респираторы и два дозиметра, на груди и на лодыжке; главный риск — никто не знал, как изменится активность воды в глубине коридора. После операции все трое продолжили работать на ЧАЭС. Баранов умер в 2005 году, Беспалов и Ананенко в 2019-м были живы."
        src: "Источник: ТВ «Звезда», 08.06.2019, https://tvzvezda.ru/news/2019681120-21A8y.html"
        stranica: ТВ «Звезда», 08.06.2019
        href: https://tvzvezda.ru/news/2019681120-21A8y.html
        otryvok: «Вода оказалась на уровне щиколоток.»
        pometka: один источник
        utverzhden: 2026-11-03
      - summary: <b>Более 600 тысяч ликвидаторов прошли через Чернобыль, из них 340 тысяч военных.</b>
        det:
          - С 1986 по 1992 год в ликвидации участвовали более 600 тысяч человек, в том числе более 210 воинских частей общей численностью 340 тысяч военнослужащих; свыше 90 тысяч из них были в зоне в самый острый период, с апреля по декабрь 1986 года. В 30-километровой зоне работали более миллиона человек. Генерал Тараканов сравнивал полмиллиона прошедших через очаг за пять лет с наполеоновской армией.
        src: "Источник: ГУ МЧС России по Тульской области, https://71.mchs.gov.ru/deyatelnost/press-centr/novosti/3563832; газета «Культура», 22.02.2016, https://portal-kultura.ru/articles/history/129184-zhivoy-geroy-mertvogo-gorodasazh/"
        stranica: ГУ МЧС России по Тульской области
        href: https://71.mchs.gov.ru/deyatelnost/press-centr/novosti/3563832
        otryvok: «С 1986 года по 1992г.г. участие в ликвидации последствий аварии на ЧАЭС приняло более 600 000 человек и более миллиона людей было задействовано в работах в 30-километровой зоне.»
        pometka: документ
        kadr:
          src: /muzei/ne-sdayutsya/img/01-30-goskatalog-11514652.jpg
          alt: Голубая коленкоровая обложка с потёртыми краями и тиснёной надписью «Удостоверение».
          data_source: https://goskatalog.ru/portal/#/collections?id=11514652
          license: цитирование с указанием музея и Госкаталога (ст. 1274 ГК РФ); на картинке только обложка, разворота в карточке нет
          podpis: Удостоверение № 947047 участника ликвидации аварии на ЧАЭС (с 12.05 по 21.07.1986) Александра Ивановича Катюшкина. Выдано Азовским горвоенкоматом 18.08.1993.
          credit: ГБУК РО «Азовский историко-археолого-палеонтологический музей-заповедник», № АМЗ КП 30561/132, Госкаталог № 11514652
          width: 1106
          height: 836
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-chernobyl-ru.mp3
  durationLabel: 1 минута 50 секунд
  lead: "Голос ведёт от ночного пожара на четвёртом блоке через затопленный коридор под реактором, небо над ним и крышу третьего блока — к «Укрытию»: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Пожар
    - t: 32
      mark: 0:32
      title: Под реактором
    - t: 55
      mark: 0:55
      title: Небо над реактором
    - t: 71
      mark: 1:11
      title: Крыша
    - t: 95
      mark: 1:35
      title: Укрытие
  transcript:
    - <p>Ночью двадцать шестого апреля тысяча девятьсот восемьдесят шестого года, через четыре минуты после взрывов, к станции прибывает караул лейтенанта Владимира Правика. Следом подходит караул Виктора Кибенка из Припяти. На кровле машинного зала, на высоте больше семидесяти метров, среди плавящегося битума и раскалённого графита, они не пускают огонь с четвёртого блока на третий. Обоим по двадцать три года, оба умирают от острой лучевой болезни. Майор Леонид Телятников сам руководит тушением и сам тушит; к шести тридцати пяти утра основные очаги ликвидированы.</p>
    - <p>Комиссия боится, что расплав из реактора дойдёт до воды под четвёртым блоком. Нужно открыть задвижки в тоннеле под станцией. Алексей Ананенко, Беспалов и Баранов идут по затопленному коридору — вода по щиколотку, вместо гидрокостюмов обычные респираторы и два дозиметра. Задвижки открыты, вода ушла. После этого все трое продолжают работать на станции.</p>
    - <p>Вертолётчики бросают на реактор мешки с песком. Радиация над ним втрое выше расчётной, приборы мерят только до пятисот рентген. Генерал Николай Антошкин придумывает грузить песок в тормозные парашюты на внешней подвеске и доводит сброс до полутора тысяч тонн в день.</p>
    - "<p>На крыше третьего блока лежат осколки графита из взорвавшегося реактора. Электроника роботов там отказывает — и идут люди: забежать, захватить графит лопатой, сбросить вниз. Генерал Николай Тараканов требует снять свинцовые листы из комнаты правительственной комиссии и режет из них «рубашки» солдатам. Его солдаты снимают с крыш станции триста тонн ядерного горючего, графита и обломков.</p>"
    - <p>Строители управления строительства шестьсот пять за двести шесть дней и ночей накрывают взорванный реактор «Укрытием». С тысяча девятьсот восемьдесят шестого по тысяча девятьсот девяносто второй год через Чернобыль проходят больше шестисот тысяч ликвидаторов, из них триста сорок тысяч военных.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
