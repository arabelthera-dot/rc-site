    href: https://library.narod.ru/tetr/tetr3.htm
    otryvok: «Пока не было Телятникова, лейтенант Правик взял на себя общее руководство ликвидацией огня.»
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: false
  - id: ns-0214-tri-brata
    summary: Три родных брата тушили реактор в одну ночь, и все выжили
    det:
    - Братья Леонид, Иван и Пётр Шаврей служили пожарными на Чернобыльской АЭС. В ночь аварии они тушили огонь все трое. После острой лучевой болезни все трое выжили.
    src: 'Источник: Sputnik Беларусь. Братья Шаврей: трое против огня Чернобыля — https://sputnik.by/20160426/1022083448.html'
    stranica: статья
