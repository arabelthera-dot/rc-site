quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: 'Ответы: 1 — 3,6 рентгена в час; 2 — № 3; 3 — к третьему; 4 — 520 бэр; 5 — 37.'
  ball: 10
  voprosy:
  - q: 'До скольки рентген в час мерил прибор пожарных?'
    o:
    - 3,6
    - '36'
    - '360'
    - 15 000
    a: 0
    e: Шкала прибора была всего на 3,6 рентгена в час, а на крыше было до 15–20 тысяч.
  - q: Какой номер вызова передал по рации лейтенант Правик?
    o:
    - № 1
    - № 2
    - № 3
    - № 10
    a: 2
    e: По вызову № 3 к станции шли все пожарные машины Киевской области.
  - q: К какому энергоблоку пожарные не пустили огонь?
    o:
    - К первому
    - Ко второму
    - К третьему
    - К пятому
    a: 2
    e: Огонь шёл по общей крыше к соседнему, третьему энергоблоку, и пожарные его остановили.
  - q: Какую дозу получил майор Телятников и выжил?
    o:
    - 5 бэр
    - 52 бэр
    - 520 бэр
    - 5200 бэр
    a: 2
    e: 520 бэр — практически смертельная доза, но майор выжил.
  - q: Сколько очагов огня погасили пожарные за ночь?
    o:
    - '7'
    - '17'
    - '37'
    - '97'
    a: 2
    e: В реакторном отделении и на кровле машзала погасили тридцать семь очагов огня.
