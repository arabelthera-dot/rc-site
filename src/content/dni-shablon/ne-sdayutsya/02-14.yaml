  - id: ns-0214-50-mashin
    summary: 50 машин приехали, когда огонь уже погасили первые
    det:
    - По вызову № 3 к станции пришли пятьдесят пожарных машин со всей области. Но основную работу к тому времени уже сделали первые караулы — Правика, Кибенка и Телятникова.
    src: 'Источник: Г. Медведев. «Чернобыльская тетрадь», гл. 3 («Новый мир», 1989) — https://library.narod.ru/tetr/tetr3.htm'
    stranica: глава книги
    href: https://library.narod.ru/tetr/tetr3.htm
    otryvok: «…на помощь к месту аварии прибыло пятьдесят пожарных машин. Но основная работа была уже выполнена…»
