    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n7
    dlya_voprosa: false
  - id: ns-0214-do-pobedy
    summary: '«Не покидать до победы»: пост стоял на крыше до пяти утра'
    det:
    - На крыше машинного зала выставили боевой пост с приказом не покидать до победы. Пожарный Прищепа с Шавреем и Петровским простояли там до пяти утра.
    src: 'Источник: Г. Медведев. «Чернобыльская тетрадь», гл. 3 («Новый мир», 1989) — https://library.narod.ru/tetr/tetr3.htm'
