  - id: ns-0214-vyzov-3
    summary: Лейтенант Правик одной рацией поднял все пожарные машины Киевской области
    det:
    - Лейтенант Владимир Правик первым понял, что пожар огромный, и передал по рации вызов № 3. По нему все пожарные машины Киевской области, где бы они ни были, шли к атомной станции.
    src: 'Источник: Г. Медведев. «Чернобыльская тетрадь», гл. 3 («Новый мир», 1989) — https://library.narod.ru/tetr/tetr3.htm'
    stranica: глава книги
    href: https://library.narod.ru/tetr/tetr3.htm
    otryvok: «Правик по рации передал вызов № 3, по которому все пожарные машины Киевской области должны следовать к атомной станции, где бы они ни находились.»
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
    istochnik: n1
    dlya_voprosa: true
    otvet: № 3
