  - id: ns-0214-37-ochagov
    summary: 37 очагов огня на высоте до 71 метра за одну ночь
    det:
    - Огонь горел в реакторном отделении и на кровле машинного зала, а самая высокая точка — крыша блока спецхимии, отметка плюс 71 метр. За ночь пожарные погасили там тридцать семь очагов огня.
    src: 'Источник: Г. Медведев. «Чернобыльская тетрадь», гл. 3 («Новый мир», 1989) — https://library.narod.ru/tetr/tetr3.htm'
    stranica: глава книги
    href: https://library.narod.ru/tetr/tetr3.htm
    otryvok: «Всего в реакторном отделении и на кровле машзала загасили тридцать семь очагов огня.»
    pometka: один источник
    utverzhden: '2026-11-14'
    sravnenie: net
