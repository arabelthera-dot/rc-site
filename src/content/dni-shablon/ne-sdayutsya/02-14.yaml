  h2: Пожарные из Чернобыля
  lead: 'Этот рисунок художник Дмитрий Нагурный сделал в 1986 году, в год аварии. Приближайте: брезентовые боёвки, каски, пожарный рукав у ног.'
audioguide:
  audioSrc: audio-guide-pozharnye-ru.mp3
  durationLabel: около 2 минут
  lead: 'Голос ведёт от взрыва на четвёртом блоке через крышу машзала и третий блок — к Героям: пять остановок.'
  stops:
