  - id: ns-0214-dva-glotka
    summary: 'Пожарный пил из рукава радиоактивную воду: «Не сделаю два глотка — упаду»'
    det:
    - Леонид Шаврей стоял на крыше с рукавом в руках. Силы кончались, и он сделал два глотка прямо из пожарного рукава. Он понимал, что вода радиоактивная, но иначе, как он вспоминал, упал бы и не поднялся.
    src: 'Источник: Sputnik Беларусь. Братья Шаврей: трое против огня Чернобыля — https://sputnik.by/20160426/1022083448.html'
    stranica: статья
    href: https://sputnik.by/20160426/1022083448.html
