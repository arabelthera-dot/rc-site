  - id: ns-0214-pribor
    summary: Прибор показал 3,6 рентгена в час, а на крыше было до 15 000
    det:
    - 'У пожарных был прибор со шкалой всего на 3,6 рентгена в час. Он не мог измерить поля на крыше: там активность выброшенного топлива доходила до 15–20 тысяч рентген в час. Пожарные продолжали тушить.'
    src: 'Источник: Г. Медведев. «Чернобыльская тетрадь», гл. 3 («Новый мир», 1989) — https://library.narod.ru/tetr/tetr3.htm'
