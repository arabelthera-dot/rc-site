    summary: Водитель голыми руками выдернул из шины железку
    det:
    - У станции в колесо пожарной машины впилась железка. Водитель вылез и выдернул её руками — пришлось повозиться. Железка была радиоактивной, и с ожогами рук он попал в московскую клинику.
    src: 'Источник: Г. Медведев. «Чернобыльская тетрадь», гл. 3 («Новый мир», 1989) — https://library.narod.ru/tetr/tetr3.htm'
