  - id: ns-0214-tretij-blok
    summary: Огонь шёл к третьему реактору, и пожарные его туда не пустили
    det:
    - Горела крыша машинного зала, общая для третьего и четвёртого блоков. Пока одни караулы гасили огонь у разрушенного реактора, другие сдерживали огонь, который шёл к соседнему, третьему энергоблоку. Огонь туда не прошёл.
    src: 'Источник: Г. Медведев. «Чернобыльская тетрадь», гл. 3 («Новый мир», 1989) — https://library.narod.ru/tetr/tetr3.htm'
    stranica: глава книги
    href: https://library.narod.ru/tetr/tetr3.htm
    otryvok: «…два других сдерживали продвижение клокочущего огня к соседнему третьему энергоблоку.»
    pometka: два источника
    utverzhden: '2026-11-14'
    sravnenie: net
