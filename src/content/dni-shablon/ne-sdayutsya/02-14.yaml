  - id: ns-0214-bitum
    summary: По инструкции крыша огнестойкая, а её залили горючим битумом
    det:
    - Крыша машинного зала по инструкции должна была иметь огнестойкое покрытие. Вместо него её залили обычным горючим битумом. Битум горел и плавился под ногами пожарных.
    src: 'Источник: ВДПО. «Энциклопедия пожарной безопасности»: Чернобыльская катастрофа — https://xn--b1ae4ad.xn--p1ai/enc/chernobylskaya-katastrofa'
