story:
  kicker: Подвиг
  h2: Пожарные Чернобыля
  abzacy:
  - В 1:24 ночи 26 апреля 1986 года на 4-м энергоблоке Чернобыльской АЭС гремит взрыв. Горит крыша машинного зала, залитая горючим битумом. Первым приезжает караул лейтенанта Владимира Правика, за ним из Припяти — караул лейтенанта Виктора Кибенка. Правику 23 года. Он передаёт по рации вызов № 3 — все пожарные машины Киевской области идут к станции. Прибор у пожарных мерит до 3,6 рентгена в час, а на крыше — до 15 000.
  - 'Лестницы только тридцатиметровые, крыша выше, воды в машине на пять минут. Пожарные поднимаются наверх и не пускают огонь к соседнему, третьему энергоблоку. Майор Леонид Телятников приезжает из-за праздничного стола и ставит пост: «не покидать до победы». За ночь погашено 37 очагов огня. Правик, Кибенок и Телятников становятся Героями Советского Союза. Телятников получает 520 бэр и выживает.'
