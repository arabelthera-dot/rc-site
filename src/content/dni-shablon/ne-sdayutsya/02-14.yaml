  - id: ns-0214-v-dolgu
    summary: 'Британская газета: «Мы в большом долгу перед Леонидом и его пожарными»'
    det:
    - 'В 1987 году майор Телятников приехал в Англию. Редактор газеты «Стар» Л. Тернер написал о нём статью «Самый храбрый человек на Земле»: пожарные не допустили, чтобы авария стала международной катастрофой.'
    src: 'Источник: МВД. Некоторые отклики отечественных и зарубежных специалистов и средств массовой информации на работу пожарных — https://www.rubin01.ru/info/articles/mvd-podvig-v-chernobyle/nekotorye-otkliki-otechestvennykh-i-zarubezhnykh-spetsialistov-sredstv-massovoy-informatsii-na-rabot/'
