    src: 'Источник: ДАН. Как простые советские парни Кибенок и Правик стали героями Чернобыля — https://dan-news.ru/stories/kak-prostye-sovetskie-parni-kibenok-i-pravik-stali-gerojami-chernobylja-vspominaet-doneckij-pozharnyj/'
