    title: Вызов № 3
  - t: 18
    mark: '0:18'
    title: Прибор на 3,6
  - t: 33
    mark: '0:33'
    title: Третий блок
  - t: 46
    mark: '0:46'
    title: До победы
  - t: 61
    mark: '1:01'
    title: Герои
  transcript:
  - 'Двадцать шестое апреля тысяча девятьсот восемьдесят шестого года, ночь, Чернобыльская АЭС. Взрыв на четвёртом энергоблоке, горит крыша машинного зала. Лейтенант Владимир Правик, ему двадцать три года, передаёт по рации вызов номер три: все пожарные машины Киевской области — к станции.'
  - Прибор у пожарных мерит до трёх целых шести десятых рентгена в час. А на крыше — до пятнадцати тысяч. Лестницы только тридцатиметровые, крыша выше, воды в машине на пять минут. Пожарные поднимаются наверх.
  - Крыша по инструкции должна быть огнестойкой, а её залили горючим битумом. Огонь идёт по общей крыше к соседнему, третьему блоку. Караулы Правика и Кибенка встают у него на пути, и огонь туда не проходит.
  - 'Майор Леонид Телятников приезжает из-за праздничного стола, в свой день рождения. Он ставит на крыше пост: не покидать до победы. Пост стоит до пяти утра. За ночь погашено тридцать семь очагов огня.'
  - 'Правик, Кибенок и Телятников стали Героями Советского Союза. Майор получил пятьсот двадцать бэр и выжил. Британская газета написала: мы в большом долгу перед Леонидом и его пожарными. Ниже — викторина и источники. Спасибо, что были с нами.'
  note: Озвучено синтезом речи.
