  - id: ns-0214-23-goda
    summary: 23-летний лейтенант один командовал тушением ядерного пожара
    det:
    - Владимир Правик родился 13 июня 1962 года — в ночь аварии ему было 23 года. Пока не приехал майор Телятников, лейтенант Правик один руководил тушением пожара.
    src: 'Источник: Г. Медведев. «Чернобыльская тетрадь», гл. 3 («Новый мир», 1989) — https://library.narod.ru/tetr/tetr3.htm'
