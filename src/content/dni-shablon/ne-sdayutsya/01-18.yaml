story:
  kicker: Среда подвига
  h2: Инженер, который стал легендой
  abzacy:
    - Николай Кузнецов родился 27 июля 1911 года в деревне Зырянка на Урале, в крестьянской семье. Уже в школе и затем в лесном техникуме в Талице он показал редкие способности к немецкому языку; позже, работая на Уралмашзаводе в Свердловске, постоянно общался с немецкими инженерами-специалистами — так разговорная практика превратилась в безупречное владение не только языком, но и манерами, привычками, психологией немцев.
    - "В 1938 году его перевели в центральный аппарат НКВД, и несколько лет он вёл разведывательную работу среди иностранной колонии в Москве под легендой инженера. После начала войны его готовили к новой роли: зимой 1941/42 года он осваивал быт и порядки германской армии в лагере для пленных немцев под Красногорском. <b>Так родилась легенда обер-лейтенанта Пауля Вильгельма Зиберта — с документами сотрудника тайной полевой полиции.</b>"
    - С октября 1942 года под этим именем Кузнецов жил и работал в оккупированном Ровно — тогдашней столице рейхскомиссариата «Украина», — постоянно общаясь с офицерами вермахта, спецслужб и чиновниками оккупационной администрации.
fakty:
  - id: fakty
    kicker: Десять фактов
    h2: Николай Кузнецов — «Русские не сдаются» — Русская цивилизация
    udary:
      - summary: <b>Кузнецов увёз генерала Ильгена из его особняка, а на столе оставил записку «Спасибо за кашу».</b>
        det:
          - "В ноябре 1943 года генерал Макс Ильген, командующий особыми (карательными) войсками на Украине, вернулся домой, снял шинель и увидел гауптмана с «вальтером». Денщик под диктовку написал: «Спасибо за кашу. Ухожу к партизанам. Беру с собой генерала. Кузько». Связанного генерала ещё грузили в машину, когда подошли четыре немецких офицера; Кузнецов показал жетон гестапо, проверил у них документы и увёз «в гестапо» одного из них — Гранау, личного шофёра Коха. «Оппелек» на пятерых увёз семерых, а наводчицей была Лидия Лисовская, служившая у Ильгена экономкой."
        src: "Источник: Д. Медведев, «Это было под Ровно», глава «Продолжение следует» — http://militera.lib.ru/memo/russian/medvedev/34.html; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm; «Комсомольская правда», спецпроект «Николай Кузнецов» — https://www.kp.ru/putevoditel/spetsproekty/nikolaj-kuznetsov/"
        stranica: Д. Медведев, «Это было под Ровно», глава «Продолжение следует»
        href: http://militera.lib.ru/memo/russian/medvedev/34.html
        otryvok: '«Под диктовку Николая Ивановича денщик написал: "Спасибо за кашу. Ухожу к партизанам. Беру с собой генерала. Кузько". Эту записку положили на видном месте на письменном столе в кабинете генерала Ильгена.»'
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов около сорока минут говорил с Кохом с «вальтером» в кармане и узнал о Курской дуге.</b>
        det:
          - "31 мая 1943 года рейхскомиссар Эрих Кох вызвал Валю Довгер, а вместе с ней «обер-лейтенанта Зиберта», хлопотавшего, чтобы его «возлюбленную» оставили в Ровно. Беседа длилась «около сорока минут», в кармане у Кузнецова был взведённый «вальтер», но стрелять он не стал: «Три охранника да еще за драпировкой… стоял кто-то. Проклятая собака у ног». Кох проговорился: «фюрер именно на вашем курском участке готовит хороший сюрприз», и сведения о готовящемся наступлении под Курском ушли в Москву."
        src: "Источник: Д. Медведев, «Это было под Ровно», глава «На приеме у Коха» — http://militera.lib.ru/memo/russian/medvedev/26.html; Н. Долгополов, «Смерть рядом», АиФ, 27.07.2021, на сайте СВР — http://svr.gov.ru/smi/2021/07/smert-ryadom-kogda-rassekretyat-biografiyu-razvedchika-nikolaya-kuznetsova.htm; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm; «Я знаю повадки этих зверей», Lenta.ru, 29.08.2021 — https://lenta.ru/articles/2021/08/29/razvedka/; «Как погиб советский разведчик Николай Кузнецов», «Российская газета», 29.03.2017 — https://rg.ru/2017/03/29/kak-pogib-razvedchik-nikolaj-kuznecov.html"
        stranica: Д. Медведев, «Это было под Ровно», глава «На приеме у Коха»
        href: http://militera.lib.ru/memo/russian/medvedev/26.html
        otryvok: «В продолжение всей беседы, длившейся около сорока минут, Кузнецов чувствовал в правом кармане брюк взведенный "вальтер".»
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов сам повысил себя до гауптмана и два часа проверял документы на заставах, искавших его.</b>
        det:
          - "СД искало именно Пауля Зиберта, и отрядный врач Альберт Цессарский вырезал печать из сапожной кожи и на трофейной машинке с немецким шрифтом впечатал в документы новый чин — гауптман. После покушений на каждом квартале Ровно стояли заставы и ловили «бандитов, одетых в немецкую форму». Кузнецов сам вышел на мостовую и начал останавливать машины: «Хальт! Ваши документы!» Проезжавшие гестаповцы показали ему жетон: «Мы ловим того же бандита», а через два часа, когда заставы сняли, он спокойно уехал."
        src: "Источник: Д. Медведев, «Это было под Ровно», глава «Лучше настоящих» — http://militera.lib.ru/memo/russian/medvedev/15.html; там же, глава «Возмездие» — http://militera.lib.ru/memo/russian/medvedev/31.html; Н. Долгополов, «Российская газета», 29.03.2017 — https://rg.ru/2017/03/29/kak-pogib-razvedchik-nikolaj-kuznecov.html; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm; Lenta.ru, 29.08.2021 — https://lenta.ru/articles/2021/08/29/razvedka/"
        stranica: Н. Долгополов, «Российская газета», 29.03.2017
        href: https://rg.ru/2017/03/29/kak-pogib-razvedchik-nikolaj-kuznecov.html
        otryvok: «Потому и "произвели" его в капитаны. Врач Альберт Цесарский изготовил печать - из сапога - и на похищенной партизанами машинке с немецким шрифтом впечатал изменения в документы своего друга.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-18-goskatalog-36593161.jpg
          alt: "Трое мужчин в лесу: слева в немецкой фуражке и с автоматом, в центре и справа в штатском, справа в шляпе"
          data_source: https://goskatalog.ru/portal/#/collections?id=36593161
          license: неизвестный фотограф, 1940-е — общественное достояние
          podpis: "Николай Кузнецов с товарищами-разведчиками перед уходом на задание (в карточке: «Кузнецов Н.И., Смехов С.Т. и Стручинский (?) Н.В.» — фамилии, видимо, искажены, вероятно Стехов и Струтинский; в подписи их лучше не называть)."
          credit: Государственный исторический музей (museumId 239), инв. И IX 14855, № Госкаталога (ГИК) ГИМ 98738/559
          width: 522
          height: 799
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов узнал в казино о покушении на Большую тройку — и отказался войти в группу Скорцени.</b>
        det:
          - "За игрой в казино штурмбаннфюрер Ортель проговорился «Зиберту»: Отто Скорцени готовит операцию «Длинный прыжок» — теракт против лидеров СССР, Великобритании и США на встрече в Тегеране. Ортель предлагал похлопотать о включении Кузнецова в группу Скорцени, но тот отказался, опасаясь провала. Сведения ушли в Центр; СВР пишет, что Кузнецов первым сообщил о подготовке покушения."
        src: "Источник: «Я знаю повадки этих зверей», Lenta.ru, 29.08.2021 — https://lenta.ru/articles/2021/08/29/razvedka/; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm"
        stranica: «Я знаю повадки этих зверей», Lenta.ru, 29.08.2021
        href: https://lenta.ru/articles/2021/08/29/razvedka/
        otryvok: "«Осенью 1943 года во время «дружеских» посиделок в казино с Ортелем Кузнецов узнал: главный немецкий диверсант Отто Скорцени готовит операцию «Длинный прыжок» — грандиозный теракт в отношении лидеров СССР, Великобритании и США, которые запланировали свою встречу в Тегеране. Штурмбаннфюрер даже предлагал Николаю похлопотать о включении его в группу Скорцени, но Кузнецов благоразумно отказался…»"
        utverzhden: 2026-11-03
      - summary: "<b>Кузнецов чуть не погиб от своих: после встречи с Кохом из Москвы пришло «Расстрелять».</b>"
        det:
          - "Вернувшись в отряд после приёма у Коха, Кузнецов был арестован по личному приказу Медведева, который счёл это трусостью. Замнаркома Кобулов ответил радиограммой: «Расстрелять. Ваш Кузнецов пьёт водку с девками, показал себя изменником и предателем». Его спас Павел Судоплатов: предложил спокойно разобраться, потому что «лучшего, чем он, разведчика у Павла Анатольевича не было»."
        src: "Источник: Н. Долгополов, «Смерть рядом», АиФ, 27.07.2021, на сайте СВР — http://svr.gov.ru/smi/2021/07/smert-ryadom-kogda-rassekretyat-biografiyu-razvedchika-nikolaya-kuznetsova.htm"
        stranica: Н. Долгополов, «Смерть рядом», АиФ, 27.07.2021, на сайте СВР
        href: http://svr.gov.ru/smi/2021/07/smert-ryadom-kogda-rassekretyat-biografiyu-razvedchika-nikolaya-kuznetsova.htm
        otryvok: "«Кобулов ответил быстро: «Расстрелять. Ваш Кузнецов пьёт водку с девками, показал себя изменником и предателем». К счастью, приняли радио­грамму и от Судоплатова. Тот предлагал во всём спокойно разобраться. Кузнецов был ему нужен. Лучшего, чем он, разведчика у Павла Анатольевича не было.»"
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов взял в засаде чиновников Коха, и карта из сумки вывела на ставку Гитлера «Вервольф».</b>
        det:
          - В феврале 1943 года Кузнецов с партизанами в форме полицаев бросил гранату под машину на дороге из Ровно и захватил начальника отдела рейхскомиссариата Гаана и имперского советника связи Райса. В сумке Райса была карта подземного кабеля от Берлина до Винницы; на допросе Гаан рассказал, что кабель связывал Германию со ставкой Гитлера «Вервольф». Кабель прокладывали двенадцать тысяч советских пленных — после работы всех расстреляли. Сведения ушли в Москву, авиация нанесла по ставке несколько ударов.
        src: "Источник: «Я знаю повадки этих зверей», Lenta.ru, 29.08.2021 — https://lenta.ru/articles/2021/08/29/razvedka/; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm"
        stranica: «Я знаю повадки этих зверей», Lenta.ru, 29.08.2021
        href: https://lenta.ru/articles/2021/08/29/razvedka/
        otryvok: «В дорожной сумке Райса была карта со схемой проложенного от Берлина до Винницы подземного кабеля. … Гаан рассказал ему, что система обеспечивала связь между Германией и ставкой Гитлера Werwolf («Оборотень»). Прокладывали кабель двенадцать тысяч советских военнопленных — после завершения работы все они были расстреляны.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-18-goskatalog-43561179.jpg
          alt: Груда бетонных глыб на поляне, позади сосновый лес, вдали несколько посетителей
          data_source: https://goskatalog.ru/portal/#/collections?id=43561179
          license: автор не указан, 1980 — не общественное достояние по сроку; публикация с указанием музея, нужно проверить условия
          podpis: Остатки бункера полевой ставки Гитлера «Вервольф» возле села Коло-Михайловка под Винницей. 1980.
          credit: museumId 2294 (тот же, что у кадра 4), инв. Н-16689, № Госкаталога (ГИК) СМ-21885/6
          width: 800
          height: 485
        utverzhden: 2026-11-03
      - summary: <b>О Кузнецове львовское гестапо отправило «телеграмму-молнию» Мюллеру лично в Берлин.</b>
        det:
          - В бумагах львовского гестапо нашли «телеграмму-молнию» от 2.IV.1944 «для вручения СС группенфюреру и генерал-лейтенанту полиции Мюллеру лично». В ней сказано, что «Пауль Зиберт» убил в Ровно Функа и похитил генерала Ильгена, а во Львове расстрелял вице-губернатора Бауэра, его президиал-шефа Шнайдера и майора полевой жандармерии Кантера, «которого мы тщательно искали»; подписал начальник полиции безопасности и СС по Галицийскому округу доктор Витиска. У трёх советских агентов, задержанных националистами, нашли отчёт одного из них, где описание убийства дано «до малейших подробностей»; по данным «Российской газеты», Кузнецов подписал отчёт псевдонимом «Пух».
        src: "Источник: Д. Медведев, «Сильные духом», часть 3 — http://militera.lib.ru/prose/russian/medvedev_dn/03.html; «Российская газета», 29.03.2017 — https://rg.ru/2017/03/29/kak-pogib-razvedchik-nikolaj-kuznecov.html"
        stranica: Д. Медведев, «Сильные духом», часть 3
        href: http://militera.lib.ru/prose/russian/medvedev_dn/03.html
        otryvok: «Телеграмма-молния В главное управление имперской безопасности для вручения СС группенфюреру и генерал-лейтенанту полиции Мюллеру лично.»
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов застрелил не того чиновника, но через несколько дней вернулся за Даргелем.</b>
        det:
          - Кузнецов охотился на правительственного президента Пауля Даргеля и в 14:30 застрелил у рейхскомиссариата генерала с адъютантом, у которого был красный портфель. Из газет выяснилось, что убит имперский советник финансов д-р Ганс Гель и его адъютант Винтер. На том же месте и в тот же час Кузнецов, уже гауптман, бросил в Даргеля противотанковую гранату, и тяжело раненного Даргеля вывезли в Берлин. Медведев пишет «через десять дней», СВР — «через месяц»; «Комсомольская правда» называет операцию «Дар» и датирует первое покушение 20.09.1943.
        src: "Источник: Д. Медведев, «Это было под Ровно», глава «Возмездие» — http://militera.lib.ru/memo/russian/medvedev/31.html; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm"
        stranica: Д. Медведев, «Это было под Ровно», глава «Возмездие»
        href: http://militera.lib.ru/memo/russian/medvedev/31.html
        otryvok: «Оказывается, убит был не Даргель, а имперский советник финансов доктор Ганс Гель и его адьютант Винтер.»
        utverzhden: 2026-11-03
      - summary: "<b>Кузнецов подошёл к вице-губернатору Галиции, спросил фамилию и сказал: «Вы мне и нужны».</b>"
        det:
          - "Утром 9 февраля 1944 года во Львове у особняка вице-губернатора Отто Бауэра остановилась машина. Гауптман подошёл к Бауэру и его спутнику Шнайдеру, спросил фамилии и со словами «Вы мне и нужны» застрелил обоих. Губернатора Вехтера, основную цель, достать не удалось: по «Российской газете», тот заболел. Медведев, лежавший в московском госпитале, узнал об этом из стокгольмской газеты «Афтонбладет», пересказанной по радио: «Убийца не задержан»."
        src: "Источник: Д. Медведев, «Сильные духом», часть 3 — http://militera.lib.ru/prose/russian/medvedev_dn/03.html; Д. Медведев, «Это было под Ровно», глава «Письмо Кузнецова» — http://militera.lib.ru/memo/russian/medvedev/39.html; «Российская газета», 29.03.2017 — https://rg.ru/2017/03/29/kak-pogib-razvedchik-nikolaj-kuznecov.html"
        stranica: Д. Медведев, «Сильные духом», часть 3
        href: http://militera.lib.ru/prose/russian/medvedev_dn/03.html
        otryvok: "«Он спокойно приблизился к Бауэру и Шнайдеру и спросил их фамилии. Получив ответ, он со словами: «Вы мне и нужны» — несколькими выстрелами убил обоих…»"
        pometka: документ
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов внимательно слушал, как глава подпольного обкома восхищается им самим.</b>
        det:
          - В декабре 1943 года в отряд приехал В. А. Бегма, руководитель Ровенского подпольного обкома, и за обедом рассказывал о партизане в форме немецкого офицера, который «убивает крупных немецких заправил среди белого дня прямо на улице, украл немецкого генерала». Бегма «и не подозревал, что этот партизан сидит с ним рядом за обеденным столом». Медведев знаком велел комиссару Лукину молчать, и только после слов «Вот это дела!» гостю представили Кузнецова.
        src: "Источник: Д. Медведев, «Это было под Ровно», глава «Передышка» — http://militera.lib.ru/memo/russian/medvedev/35.html; «Российская газета», 29.03.2017 — https://rg.ru/2017/03/29/kak-pogib-razvedchik-nikolaj-kuznecov.html; Н. Долгополов, АиФ, 27.07.2021, на сайте СВР — http://svr.gov.ru/smi/2021/07/smert-ryadom-kogda-rassekretyat-biografiyu-razvedchika-nikolaya-kuznetsova.htm"
        stranica: Д. Медведев, «Это было под Ровно», глава «Передышка»
        href: http://militera.lib.ru/memo/russian/medvedev/35.html
        otryvok: «Рассказывая, Василий Андреевич и не подозревал, что этот партизан сидит с ним рядом за обеденным столом. Лукин порывался было перебить рассказчика, но я дал знак ему, чтоб молчал, а Николай Иванович Кузнецов внимательно слушал Бегму.»
        utverzhden: 2026-11-03
  - id: fakty-dnya
    kicker: Ещё пять фактов
    h2: Ещё о подвиге
    udary:
      - summary: <b>Кузнецов оставил письмо «Вскрыть после моей гибели», строка из него — название «Сильные духом».</b>
        det:
          - "Запечатанный конверт с надписью «Вскрыть после моей гибели. Кузнецов» хранился у Медведева с весны 1943 года и был вскрыт во Львове в 1944 году: «25 августа 1942 г. в 24 часа 05 мин. я опустился с неба на парашюте…», «Я люблю жизнь, я еще очень молод». Закончил он строками Горького: «Но в песне смелых и сильных духом всегда ты будешь живым примером…» и припиской «Пусть чаще читает его наша молодежь»."
        src: "Источник: Д. Медведев, «Сильные духом», часть 3 — http://militera.lib.ru/prose/russian/medvedev_dn/03.html"
        stranica: Д. Медведев, «Сильные духом», часть 3
        href: http://militera.lib.ru/prose/russian/medvedev_dn/03.html
        otryvok: "«При мне было запечатанное его письмо с надписью на конверте: «Вскрыть после моей гибели. Кузнецов». Это письмо лежало с весны прошлого года…»"
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов жил в Ровно немецким офицером, а отряд с ним ликвидировал 11 генералов и чиновников.</b>
        det:
          - С октября 1942 года под именем обер-лейтенанта Пауля Зиберта он жил в Ровно, столице рейхскомиссариата «Украина». Общаясь с немцами, он овладел шестью германскими диалектами — прусским, берлинским, саксонским, баварским и другими. По словам историка ФСБ А. Матвеева, отряду Медведева, «главным образом благодаря Николаю Кузнецову», удалось ликвидировать 11 генералов и высших чиновников рейха в Ровенской и Львовской областях.
        src: "Источник: «Рассекречен архив о легендарном советском разведчике Кузнецове», РИА Новости, 04.11.2024 — https://ria.ru/20241104/kuznetsov-1981743583.html; Lenta.ru, 29.08.2021 — https://lenta.ru/articles/2021/08/29/razvedka/; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm"
        stranica: «Рассекречен архив о легендарном советском разведчике Кузнецове», РИА Новости, 04.11.2024
        href: https://ria.ru/20241104/kuznetsov-1981743583.html
        otryvok: «…отряду, главным образом благодаря Николаю Кузнецову, удалось ликвидировать 11 генералов и высших государственных чиновников Третьего рейха в оккупированных Ровенской и Львовской областях", — добавил Матвеев.»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-18-goskatalog-43858267.jpg
          alt: Портрет мужчины в немецкой офицерской форме
          data_source: https://goskatalog.ru/portal/#/collections?id=36593128
          license: неизвестный фотограф, 1940-е — общественное достояние
          podpis: Николай Кузнецов в форме обер-лейтенанта вермахта, Ровно, осень 1942 года (как в подписи обложки; в карточке место и дата не указаны).
          credit: Государственный исторический музей (museumId 239), инв. И IX 14856, № Госкаталога (ГИК) ГИМ 98738/560
          width: 522
          height: 800
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов с товарищами убил генерала Кнута, а немцы скрыли его смерть от газет.</b>
        det:
          - "Заместитель рейхскомиссара Кнут руководил конторой «Пакетаукцион», торговавшей награбленным, и ровно в шесть выехал из неё на улице Легионов. Ян Каминский бросил в его машину противотанковую гранату, Кузнецов и Струтинский стреляли из автоматов. Геля хоронили пышно, о покушении на Даргеля много шумели, а о Кнуте «нигде ни единого слова не было ни сказано, ни написано»: оккупанты не захотели признавать, что их главарей убивают среди бела дня."
        src: "Источник: Д. Медведев, «Это было под Ровно», глава «Возмездие» — http://militera.lib.ru/memo/russian/medvedev/31.html"
        stranica: Д. Медведев, «Это было под Ровно», глава «Возмездие»
        href: http://militera.lib.ru/memo/russian/medvedev/31.html
        otryvok: «А вот о Кнуте нигде ни единого слова не было ни сказано, ни написано. Как будто его и не было на свете…»
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов сыграл главную роль в спектакле пленных немцев, и они его не раскрыли.</b>
        det:
          - "Зимой 1941/42 года, перед заброской, его под видом Пауля Зиберта поместили в лагерь военнопленных немцев под Красногорском, где он осваивал быт и порядки германской армии. Там он «выдвинулся буквально на первые роли»: сыграл главную роль в спектакле, который ставили пленные. Его произношение «соратники по лагерю признали чистейшим и классическим»."
        src: "Источник: Н. Долгополов, «Смерть рядом», АиФ, 27.07.2021, на сайте СВР — http://svr.gov.ru/smi/2021/07/smert-ryadom-kogda-rassekretyat-biografiyu-razvedchika-nikolaya-kuznetsova.htm; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm; Lenta.ru, 29.08.2021 — https://lenta.ru/articles/2021/08/29/razvedka/; «Российская газета», 29.03.2017 — https://rg.ru/2017/03/29/kak-pogib-razvedchik-nikolaj-kuznecov.html"
        stranica: Н. Долгополов, «Смерть рядом», АиФ, 27.07.2021, на сайте СВР
        href: http://svr.gov.ru/smi/2021/07/smert-ryadom-kogda-rassekretyat-biografiyu-razvedchika-nikolaya-kuznetsova.htm
        otryvok: "«Кузнецов и тут выдвинулся буквально на первые роли: сыграл главную роль в спектакле, который ставили пленные фрицы. Его немецкое произношение соратники по лагерю признали чистейшим и классическим.»"
        utverzhden: 2026-11-03
      - summary: <b>Кузнецов подорвал себя гранатой, чтобы не сдаться, а его могилу нашли только через 15 лет.</b>
        det:
          - В ночь с 8 на 9 марта 1944 года в селе Боратин Львовской области на группу Кузнецова напали бандеровцы. В перестрелке погибли Белов и Каминский, а Кузнецов, не желая сдаваться живым, подорвал себя гранатой — по «Российской газете», противотанковой. 5 ноября 1944 года ему посмертно присвоили звание Героя Советского Союза. Могилу нашли лишь в сентябре 1959 года стараниями друга Н. Струтинского, через год останки перезахоронили на Холме Славы во Львове.
        src: "Источник: «Я знаю повадки этих зверей», Lenta.ru, 29.08.2021 — https://lenta.ru/articles/2021/08/29/razvedka/; Н. Долгополов, «Как погиб разведчик Кузнецов», «Российская газета», 29.03.2017 — https://rg.ru/2017/03/29/kak-pogib-razvedchik-nikolaj-kuznecov.html; СВР России — http://svr.gov.ru/history/stages/kuznetsov.htm"
        stranica: «Я знаю повадки этих зверей», Lenta.ru, 29.08.2021
        href: https://lenta.ru/articles/2021/08/29/razvedka/
        otryvok: «В ожесточенной перестрелке погибли Белов и Каминский, а сам Кузнецов, не желая сдаваться врагу живым, подорвал себя гранатой. … Место захоронения Кузнецова в урочище Кутыки было обнаружено лишь в сентябре 1959 года благодаря стараниям его друга Николая Струтинского. Год спустя останки … были перезахоронены на расположенном во Львове Холме Славы»
        kadr:
          src: /muzei/ne-sdayutsya/img/01-18-goskatalog-55403032.jpg
          alt: Большая группа детей и взрослых у забора перед домом
          data_source: https://goskatalog.ru/portal/#/collections?id=55403032
          license: автор «неизвестно», дата не указана — права нужно проверить
          podpis: У дома (хаты) в селе Боратин, где погиб Николай Кузнецов (дата в карточке не указана, по виду 1960–70-е).
          credit: museumId 1439, полное название музея по API не получено; № Госкаталога (ГИК) КПКМ ОФ-3730/38
          width: 768
          height: 517
        utverzhden: 2026-11-03
audioguide:
  audioSrc: audio-guide-kuznetsov-ru.mp3
  durationLabel: 1 минута 22 секунды
  lead: "Голос ведёт от учёбы в Талице через Ровно под чужим именем — к гибели в Боратине: пять остановок."
  stops:
    - t: 0
      mark: 0:00
      title: Инженер, который выучил немецкий
    - t: 17
      mark: 0:17
      title: Легенда Пауля Зиберта
    - t: 28
      mark: 0:28
      title: Ставка Гитлера и Тегеран
    - t: 45
      mark: 0:45
      title: Проверка, которая могла стать последней
    - t: 62
      mark: 1:02
      title: Боратин
  transcript:
    - "<p>Николай Кузнецов родился в тысяча девятьсот одиннадцатом году на Урале, в крестьянской семье. Работая на Уралмашзаводе, он так освоил немецкий язык, манеры и психологию немцев, что немецкая военная разведка позже отмечала: он владеет шестью диалектами немецкого.</p>"
    - <p>С октября тысяча девятьсот сорок второго года под именем обер-лейтенанта Пауля Зиберта он жил в оккупированном Ровно, постоянно общаясь с офицерами вермахта и чиновниками оккупационной администрации.</p>
    - <p>Седьмого февраля тысяча девятьсот сорок третьего года он захватил курьера с картой, раскрывшей ставку Гитлера под Винницей. Позже от своего же невольного источника, судьи Альфреда Функа, узнал о покушении на лидеров Большой тройки в Тегеране — и помог его предотвратить.</p>
    - <p>В декабре тысяча девятьсот сорок третьего года патруль искал террориста в форме обер-лейтенанта — но Кузнецов уже носил погоны гауптмана, на чин выше. Вместо того чтобы уехать, он сам встал к посту и несколько часов проверял документы у немецких офицеров.</p>
    - <p>Девятого марта тысяча девятьсот сорок четвёртого года в селе Боратин Кузнецова и его спутников застигли бойцы украинской повстанческой армии. Пятого ноября того же года ему посмертно присвоили звание Героя Советского Союза. С тысяча девятьсот шестидесятого года он покоится на Холме Славы во Львове.</p>
  note: Озвучено синтезом речи — временно, до записи голосом автора музея.
