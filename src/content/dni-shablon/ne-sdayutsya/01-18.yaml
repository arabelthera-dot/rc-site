      a: 1
      e: С октября 1942 года Кузнецов жил и работал в Ровно под именем обер-лейтенанта (позже гауптмана) Пауля Вильгельма Зиберта, с документами сотрудника тайной полевой полиции.
    - q: Что раскрыл Кузнецов, захватив 7 февраля 1943 года майора Гаана с секретной картой?
      o:
        - План обороны Берлина
        - Список агентов гестапо
        - Маршрут снабжения армии
        - Расположение ставки Гитлера «Вервольф» под Винницей
      a: 3
      e: Изучив карту и допросив курьера рейхскомиссариата майора Гаана, Кузнецов узнал точное расположение подземной ставки Гитлера под Винницей, в 8 км от города.
    - q: О чём рассказал Кузнецову его невольный источник Альфред Функ?
      o:
        - О подготовке покушения на лидеров «Большой тройки» в Тегеране
        - О плане эвакуации немецких войск
        - О местонахождении партизанских отрядов
        - О новом виде оружия
      a: 0
      e: Альфред Функ, главный судья рейхскомиссариата, в разговоре с «гауптманом Зибертом» рассказал об операции «Длинный прыжок» — покушении на Тегеранской конференции. Позже Кузнецов лично застрелил Функа в здании суда.
    - q: Что спасло Кузнецова на проверке документов в декабре 1943 года?
      o:
        - У него были поддельные документы высшего качества
        - Патруль был пьян и не проверял документы
        - Патруль искал «террориста» в форме обер-лейтенанта — на чин ниже его нового звания гауптмана
        - Он успел убежать до прибытия патруля
      a: 2
      e: Немцы искали нарушителя в форме обер-лейтенанта, а Кузнецов уже носил погоны гауптмана — на чин выше. Вместо того чтобы уехать, он сам встал к посту и несколько часов проверял документы у проезжавших немецких офицеров.
    - q: Когда и где погиб Николай Кузнецов?
      o:
        - В мае 1945 года в Берлине
        - 9 марта 1944 года в селе Боратин, Львовская область
        - В 1943 году под Курском
        - Он не погиб на задании и умер после войны
      a: 1
      e: 9 марта 1944 года в селе Боратин бойцы Украинской повстанческой армии застигли Кузнецова и его спутников; по одной версии он погиб в перестрелке, по другой — подорвал себя гранатой, чтобы не попасть в плен.
