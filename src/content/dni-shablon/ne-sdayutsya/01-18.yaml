quiz:
  kicker: Проверь себя · 5 вопросов
  h2: Викторина
  intro: На каждый вопрос — одна попытка. После ответа покажем объяснение.
  noscript: "Для викторины нужен JavaScript. Ответы: 1 — Обер-лейтенант Пауль Зиберт; 2 — Расположение ставки Гитлера «Вервольф» под Винницей; 3 — О подготовке покушения на лидеров «Большой тройки» в Тегеране; 4 — Патруль искал «террориста» в форме обер-лейтенанта — на чин ниже его нового звания гауптмана; 5 — 9 марта 1944 года в селе Боратин, Львовская область."
