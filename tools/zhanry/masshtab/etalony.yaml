# Эталоны жанра «Угадай и проверь масштабом» (G7): привычное, с чем сравнивается цифра дня. Данные жанра, не дня:
# новый день с той же единицей берёт их сам. Источник у каждого — не Википедия.
glubina:        # вариация а — глубина, метры вниз
  edinica: м
  shkala: [0, null]            # null — до цифры дня с запасом
  etalony:
    - { v: 540, k: высота Останкинской башни, istochnik: "https://tvtower.ru/ — официальный сайт башни: 540 м" }
moroz:          # вариация б — мороз, градусы Цельсия
  edinica: °C
  shkala: [20, -273.15]
  etalony:
    - { v: -89.2, k: самый сильный мороз на Земле — станция «Восток», 1983, istochnik: "https://wmo.int/ — архив рекордов погоды ВМО (World: Lowest Temperature)" }
    - { v: -195.8, k: кипит жидкий азот, istochnik: "Справочник физических величин (Григорьев, Мейлихов, 1991)" }
    - { v: -273.15, k: абсолютный ноль — ниже не бывает, istochnik: "СИ: 0 К = −273,15 °C" }
