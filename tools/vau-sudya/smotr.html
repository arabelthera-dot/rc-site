<!doctype html>
<!-- Просмотрщик судьи для голой модели .glb: студийный свет, камера на 3/4 сверху, __vs.povorot(град) — поворот вокруг модели. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#1d2128}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1d2128);
sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 5, 2); sc.add(sun);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 1e5);
let ugol = 0.6, cel = new THREE.Vector3(), dist = 5, vys = 0;
const g = await new GLTFLoader().loadAsync('./model.glb');
sc.add(g.scene);
g.scene.updateMatrixWorld(true);
const box = new THREE.Box3();   // рамка — только по сеткам: пустые узлы, камеры и свет из .glb её не раздувают
g.scene.traverse((o) => { if (o.isMesh && o.visible) { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); } });
const size = box.getSize(new THREE.Vector3());
box.getCenter(cel); dist = Math.max(size.x, size.y, size.z) * 1.4 / Math.min(1, cam.aspect); vys = dist * 0.35;
const kam = () => { cam.position.set(cel.x + Math.sin(ugol) * dist, cel.y + vys, cel.z + Math.cos(ugol) * dist); cam.lookAt(cel); };
window.__vs.povorot = (d) => { ugol += d * Math.PI / 180; };
r.setAnimationLoop(() => { kam(); r.render(sc, cam); });
</script></body></html>
