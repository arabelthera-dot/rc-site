# Стоп-лист text-metrics.py (эталон Шухова: у живых версий 0 попаданий, у машинных 4 и 12).
# Порог «3+ на страницу = красный» Vale не считает — каждое попадание отдельной ошибкой.
extends: existence
message: "Канцелярит/штамп «%s» — вычеркнуть или сказать действием."
level: error
ignorecase: true
nonword: true
tokens:
  - '(?:^|[^\p{L}])уникальн\p{L}*'
  - 'поистине'
  - 'не имеет аналог\p{L}*'
  - '(?:^|[^\p{L}])не имеющ\p{L}*'
  # «является», но не «не является» (RE2 без lookbehind: слово перед — любое, кроме «не»)
  - '(?:^|[.!?]\s+|(?:^|[^\p{L}])(?:\p{L}{3,}|\p{L}|[^н\P{L}]\p{L}|н[^е\P{L}])\s+)явля(?:ется|лся|лась|ются)'
  - 'осуществля(?:ет|л|ют)'
  - 'в рамках'
  - '(?:^|[^\p{L}])данн(?:ый|ая|ое|ого|ому|ом|ым|ой|ую)(?:[^\p{L}]|$)'
  - 'позволя(?:ет|ют|ло|ла|л) (?:осуществ|значительн|существенн|получ)'
  - 'способствов\p{L}*'
  - 'неоценим\p{L}*'
  - 'вн[её]с(?:ли)? (?:огромный |большой )?вклад'
  - 'значительн\p{L}*'
  - 'существенн\p{L}*'
  - 'широко примен\p{L}*'
  - 'определённ(?:ый|ая|ое|ых|ым)'
  - 'необходимо отметить'
  - 'следует отметить'
  - 'играет важную роль'
  - 'получил широкое'
  - 'инновацион\p{L}*'
  - 'целый ряд'
  - '(?:^|[^\p{L}])ряд (?:важных|преимуществ|особенностей|факторов)'
