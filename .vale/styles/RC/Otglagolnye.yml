# Отглагольные существительные вместо действия (закрытый список text-metrics.py).
extends: existence
message: "«%s» — отглагольное существительное: скажи глаголом."
level: warning
ignorecase: true
nonword: true
tokens:
  - '(?:^|[^\p{L}])(?:осуществлени|обеспечени|проведени|применени|внедрени|реализаци|использовани|формировани|функционировани|распространени|изготовлени|повышени|снижени|улучшени|расширени|укреплени|совершенствовани)\p{L}*'
