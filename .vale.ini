# Vale — проверка живого языка страниц (вместо самоделки text-metrics.py, 19.10.2026).
# Правила: .vale/styles/RC. Запуск: vale dist/muzei/<музей>/<страница>/index.html
StylesPath = .vale/styles
MinAlertLevel = suggestion
# Как в text-metrics: в замер идёт тело экспоната, служебное — нет.
SkippedScopes = script, style, pre, code, nav, header, footer, svg, noscript

[*.html]
BasedOnStyles = RC
