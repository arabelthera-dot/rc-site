<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Схема поля боя для образца механики kazhdomu-svoyo-mesto: без надписей (Р18), подписи ставит движок. -->
  <defs><linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3150"/><stop offset="1" stop-color="#3d5a78"/></linearGradient></defs>
  <rect width="800" height="250" fill="url(#n)"/>
  <rect y="250" width="800" height="150" fill="#3b4a2a"/>
  <!-- орудие слева -->
  <rect x="40" y="300" width="90" height="22" rx="10" fill="#6b5232" transform="rotate(-14 85 311)"/>
  <circle cx="70" cy="330" r="22" fill="none" stroke="#2a1d10" stroke-width="7"/>
  <!-- укрепление: стена с башней -->
  <rect x="540" y="150" width="200" height="100" fill="#7d7568"/>
  <rect x="600" y="110" width="60" height="140" fill="#8c8476"/>
  <path d="M540 150h20v-14h20v14h20v-14h20v14h20" fill="none" stroke="#8c8476" stroke-width="10"/>
  <!-- вал и укрытые за ним -->
  <path d="M340 250 Q390 200 440 250 Z" fill="#5a4a30"/>
  <circle cx="460" cy="244" r="6" fill="#c9a84c"/><circle cx="476" cy="244" r="6" fill="#c9a84c"/><circle cx="492" cy="244" r="6" fill="#c9a84c"/>
  <!-- пехота в поле -->
  <g fill="#b42828"><rect x="250" y="330" width="8" height="24"/><rect x="268" y="330" width="8" height="24"/><rect x="286" y="330" width="8" height="24"/><rect x="304" y="330" width="8" height="24"/><rect x="322" y="330" width="8" height="24"/></g>
  <!-- деревянные склады -->
  <g fill="#8a5a2b"><rect x="640" y="300" width="70" height="50"/><path d="M632 300l43-30 43 30z" fill="#6b3f1c"/><rect x="725" y="315" width="50" height="35"/></g>
</svg>
