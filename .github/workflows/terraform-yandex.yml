# Инфраструктура сайта в Яндекс Облаке кодом (Р6, задача Y, 20.10.2026): infra/yandex/, docs/yandex-oblako.md.
# Только ручной запуск. Пять вопросов: задевает — бакеты russian-civilization.ru и www, зону Cloud DNS и сертификат
# в каталоге YC_FOLDER_ID, на GitHub Pages и reg.ru не влияет; нужно — секреты YC_SA_KEY_JSON, YC_FOLDER_ID,
# YC_ACCESS_KEY_ID, YC_SECRET_ACCESS_KEY (М47, Михаил); без нужного — спит с понятной строкой; проверка —
# сначала deystvie=plan; откат — docs/yandex-oblako.md, «Откат».
name: terraform-yandex
on:
  workflow_dispatch:
    inputs:
      deystvie:
        description: 'plan — только показать изменения; apply — применить'
        type: choice
        options: [plan, apply]
        default: plan
      https:
        description: 'Ждать выпуска сертификата Let''s Encrypt и привязать его к бакетам (первый проход — false)'
        type: boolean
        default: true
      dop_https:
        description: 'Дополнительные адреса (М36): ждать сертификат и привязать (после смены NS у регистратора)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: terraform-yandex
  cancel-in-progress: false
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: infra/yandex
    env:
      YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      YC_STORAGE_ACCESS_KEY: ${{ secrets.YC_ACCESS_KEY_ID }}
      YC_STORAGE_SECRET_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      AWS_ENDPOINT_URL: https://storage.yandexcloud.net
      # Бакет состояния terraform (не в git); переменная репозитория YC_TFSTATE_BUCKET — если имя занято.
      TFSTATE_BUCKET: ${{ vars.YC_TFSTATE_BUCKET || 'russian-civilization-tfstate' }}
      TF_VAR_https: ${{ inputs.https }}
      # Дополнительные адреса с 301 (М36): переменная репозитория YC_DOP_DOMENY — JSON-список punycode; нет — пусто.
      TF_VAR_dop_domeny: ${{ vars.YC_DOP_DOMENY || '[]' }}
      TF_VAR_dop_https: ${{ inputs.dop_https }}
      TF_IN_AUTOMATION: '1'
    steps:
      - id: est
        working-directory: .
        run: |
          for s in YC_SA_KEY_JSON YC_FOLDER_ID YC_STORAGE_ACCESS_KEY YC_STORAGE_SECRET_KEY; do
            if [ -z "${!s}" ]; then
              echo "::notice::Яндекс Облако: нет секретов YC_SA_KEY_JSON / YC_FOLDER_ID / YC_ACCESS_KEY_ID / YC_SECRET_ACCESS_KEY (М47, Михаил) — terraform не запускался"
              echo "est=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "est=true" >> "$GITHUB_OUTPUT"
      - if: steps.est.outputs.est == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: steps.est.outputs.est == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.9'
          terraform_wrapper: false
      - name: ключ сервисного аккаунта и бакет состояния
        if: steps.est.outputs.est == 'true'
        run: |
          umask 077
          printf '%s' "$YC_SA_KEY_JSON" > "$RUNNER_TEMP/sa-key.json"
          echo "YC_SERVICE_ACCOUNT_KEY_FILE=$RUNNER_TEMP/sa-key.json" >> "$GITHUB_ENV"
          # Бакет состояния заводится один раз, с версиями — прежнее состояние можно вернуть.
          if ! aws s3api head-bucket --bucket "$TFSTATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$TFSTATE_BUCKET"
            aws s3api put-bucket-versioning --bucket "$TFSTATE_BUCKET" --versioning-configuration Status=Enabled
          fi
      - if: steps.est.outputs.est == 'true'
        run: |
          terraform fmt -check
          # Ключи бэкенд берёт из AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY окружения — в файлы они не пишутся.
          terraform init -input=false -backend-config="bucket=$TFSTATE_BUCKET"
          terraform validate
      - if: steps.est.outputs.est == 'true'
        run: terraform plan -input=false -out=plan.tfplan
      - if: steps.est.outputs.est == 'true' && inputs.deystvie == 'apply'
        run: terraform apply -input=false plan.tfplan
      - if: steps.est.outputs.est == 'true' && inputs.deystvie == 'apply'
        run: terraform output
      - if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/sa-key.json"
