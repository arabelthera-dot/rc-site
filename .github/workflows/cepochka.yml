# Безопасность цепочки (п.502 плана, Р745, 10.11.2026): процессы GitHub Actions проверяют actionlint (ошибки
# синтаксиса и выражений) и zizmor (подстановки в run, широкие права, незакреплённые actions, опасные запуски).
# Как в мире — https://docs.zizmor.sh/usage/#use-in-github-actions и https://github.com/rhysd/actionlint/blob/main/docs/usage.md.
# База старых находок — .github/zizmor.yml. Откат — удалить этот файл.
name: cepochka
on:
  pull_request:
    paths: ['.github/workflows/**', '.github/zizmor.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/zizmor.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cepochka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: actionlint — процессы без ошибок
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color -shellcheck=
      - name: zizmor — процессы без опасных мест
        run: pipx run zizmor==1.32.0 --offline --min-severity high --config .github/zizmor.yml .github/workflows
