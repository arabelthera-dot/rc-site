# Проход игр января двух музеев в webkit (iPhone) и firefox (p544-f, Р546, Р205, Р204). Закон навыка
# museum-page-production: «Игра пройдена нажатиями до финала, консоль без ошибок». Заявка #418 проходит игры
# в chromium; здесь — те же игры в двух других движках и сравнение снимков страницы с живым сайтом.
# Список игр машина берёт из сборки заявки: dist/muzei/{izobreteniya,ne-sdayutsya}/den/01-*/ + estIgra.
# Пять вопросов: задевает — ничего, только читает сборку и живой сайт; нужно — npm ci, сборка, браузеры
# Playwright (ставятся точной версией из lock-файла); без нужного — красный шаг сборки, сайт не задет;
# проверка до слияния — эта же работа на заявке + ручной пуск; откат — удалить файл.
# Выключатель строгости — переменная IGRY_DVIZHKI_STROGO (≠ '1' — проход пишет отчёт и не роняет заявку;
# новое ставится выключенным, Р204). Ручной пуск с strogo=1 — строгий прогон без переменной.
name: igry-dvizhki
on:
  pull_request:
    paths:
      - 'src/data/full-pages/izobreteniya/01-*'
      - 'src/data/full-pages/ne-sdayutsya/01-*'
      - 'src/content/days/izobreteniya/01-*'
      - 'src/content/days/ne-sdayutsya/01-*'
      - 'src/components/DenIzobreteniya.astro'
      - 'src/data/igry/**'
      - 'public/assets/**'
      - 'public/muzei/izobreteniya/igry/**'
      - 'scripts/prohod-igr-dvizhki.mjs'
      - 'scripts/igra-pravila.mjs'
      - '.github/workflows/igry-dvizhki.yml'
  workflow_dispatch:
    inputs:
      strogo:
        description: '1 — провал игры роняет работу'
        default: '0'
      igry:
        description: 'только эти игры: izobreteniya/01-30,… (пусто — все игры января двух музеев)'
        default: ''
permissions:
  contents: read
concurrency:
  group: igry-dvizhki-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prohod:
    runs-on: ubuntu-latest
    # Сцена rc3d в программном WebGL идёт 2–5 минут на пуск, игр до 10, движков два.
    timeout-minutes: 60
    steps:
      # Журнал исправлений на страницах дней берёт даты из git log —
      # мелкий клон роняет сборку (как в proverka.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps webkit firefox
      - name: проход игр января — webkit и firefox
        continue-on-error: ${{ !(vars.IGRY_DVIZHKI_STROGO == '1' || inputs.strogo == '1') }}
        env:
          IGRY: ${{ inputs.igry }}
        run: node scripts/prohod-igr-dvizhki.mjs --dist dist --dvizhki webkit,firefox ${IGRY:+--igry "$IGRY"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prohod-igr-dvizhki
          path: /tmp/prohod-igr-dvizhki/
          retention-days: 14
