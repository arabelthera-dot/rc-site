# Д3 плана сайта (19.10.2026): внешний сторож доступности — сбой и восстановление → Telegram.
# Лёгкий (curl, без браузера), поэтому отдельно от smoke.yml (Playwright, раз в 3 ч).
# Пять вопросов: задевает — ничего, только читает сайт снаружи и пишет в один чат; нужно — секреты
# TG_BOT_TOKEN (бот, тот же, что у kanaly.yml) и TG_STOROZH_CHAT (чат тревог, не публичный канал) — даёт Михаил;
# без нужного — проверка идёт, отправка пишет «спит: нет секрета», работа зелёная; проверка — ручной пуск
# с proba=true шлёт пробное «сбой»; откат — переменная STOROZH_VKL ≠ '1' или удалить файл.
# Выключатель расписания — переменная STOROZH_VKL (≠ '1' — спит). Адрес — переменная STOROZH_ADRES
# (по умолчанию https://russian-civilization.ru — сертификат Let's Encrypt на msk-new с 21.10.2026).
# Б21 (опись Р84, 21.10.2026): тот же запуск проверяет срок сертификата — меньше 14 дней (переменная SROK_DNEY)
# → одно сообщение «истекает» в тот же чат, продлён — «продлён» (scripts/storozh/storozh.sh).
name: storozh
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      proba:
        description: 'Проба падения — отправить пробное сообщение «сбой» (сайт не трогается)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write   # отметка «сайт лежит» между запусками хранится в кэше
concurrency:
  group: storozh
  cancel-in-progress: false
jobs:
  storozh:
    if: github.event_name == 'workflow_dispatch' || vars.STOROZH_VKL == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/storozh
      # Отметка прошлого состояния: файл .storozh/lezhit есть — в прошлый раз сайт лежал.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .storozh
          key: storozh-${{ github.run_id }}
          restore-keys: storozh-
      - name: Проверка
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_STOROZH_CHAT: ${{ secrets.TG_STOROZH_CHAT }}
          ADRES: ${{ vars.STOROZH_ADRES || 'https://russian-civilization.ru' }}
          PROBA: ${{ github.event_name == 'workflow_dispatch' && inputs.proba }}
          SROK_DNEY: ${{ vars.SROK_DNEY || '14' }}
        run: bash scripts/storozh/storozh.sh
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .storozh
          key: storozh-${{ github.run_id }}
