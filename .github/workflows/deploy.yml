# Сборка и выкладка на GitHub Pages — официальный способ Astro (withastro/action).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nochnaya:
        description: 'Ночная пересборка: собрать, только если сегодня (по Москве) сайт ещё не собирался — для внешнего будильника'
        type: boolean
        default: false
  # Ночная пересборка (Сергей 17.10.2026, «да» на стандартную настройку): RSS, «Детям» и вид без JS зависят от даты,
  # поэтому сайт собирается заново каждую ночь. Расписание GitHub время не гарантирует (Б11: 19.10 запуск в 01:58,
  # 20.10 — в 03:12 МСК вместо 00:07), поэтому попыток три — 00:07, 00:37, 01:07 МСК (21:07, 21:37, 22:07 UTC),
  # минуты не круглые, чтобы не стоять в общей очереди GitHub. Собирает первая; остальные видят в задаче «nado»,
  # что сегодня по Москве сборка уже прошла, и выходят. Откат — revert заявки (Б11, задача L).
  schedule:
    - cron: '7 21 * * *'
    - cron: '37 21 * * *'
    - cron: '7 22 * * *'
# Права по умолчанию — только чтение (20.10.2026, цепочка «ошибка помощника → сайт»): pages и id-token — лишь у задачи
# deploy, сборка (npm-пакеты, скрипты заявки) выложить сайт сама не может. Откат — вернуть три строки сюда.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # «Уже собрано сегодня — выйти» (Б11, задача L): для запуска по расписанию и для ночного вызова извне
  # (workflow_dispatch с nochnaya=true) — есть ли с московской полуночи запуск этого же deploy.yml с успешной
  # задачей build (любой: по расписанию, по слиянию в main, ручной). Есть — сборка и выкладка пропускаются.
  # Запуски deploy.yml идут по одному (concurrency: pages), поэтому двух проверяющих одновременно не бывает.
  # Слияние в main и ручной запуск собирают всегда. Ошибка API — собираем (лишняя сборка лучше вчерашнего сайта).
  nado:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      sobrat: ${{ steps.p.outputs.sobrat }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          SOBYTIE: ${{ github.event_name }}
          NOCHNAYA: ${{ inputs.nochnaya }}
        run: |
          if [ "$SOBYTIE" != schedule ] && [ "$NOCHNAYA" != true ]; then echo "sobrat=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          polnoch=$(date -u -d "$(TZ=Europe/Moscow date +%F) 00:00 +0300" +%FT%TZ)
          echo "московская полночь — $polnoch UTC"
          runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" -f created=">=$polnoch" -f status=success -f per_page=100 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id") || { echo "::warning::список запусков недоступен — собираем"; echo "sobrat=true" >> "$GITHUB_OUTPUT"; exit 0; }
          for id in $runs; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length')" != 0 ]; then
              echo "сегодня по Москве сайт уже собран: запуск $id — выходим"
              echo "sobrat=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "сегодня по Москве сборки ещё не было — собираем"
          echo "sobrat=true" >> "$GITHUB_OUTPUT"
  build:
    needs: nado
    if: needs.nado.outputs.sobrat == 'true'
    runs-on: ubuntu-latest
    # Основной адрес https://russian-civilization.ru/ — сервер msk-new (nginx + Let's Encrypt, с 21.10.2026), задача msk ниже;
    # Pages этого репо — зеркало (свой домен с Pages снят). Индексируется основной адрес.
    env:
      # Поиск по сайту (pagefind) — переменная репозитория RC_POISK ('1' — включён; src/integrations/poisk.mjs).
      RC_POISK: ${{ vars.RC_POISK }}
      # «Поддержать проект» (Р31, 20.10.2026): пусто — выключен до работающего приёма денег, '1' — включён.
      PUBLIC_PODDERZHKA: ${{ vars.PUBLIC_PODDERZHKA }}
      PUBLIC_CSP: ${{ vars.PUBLIC_CSP }}
      # Почта (Р32, М48): форма подписки рядом с Telegram — только при PUBLIC_POCHTA=1 и адресе формы сервиса.
      PUBLIC_POCHTA: ${{ vars.PUBLIC_POCHTA }}
      PUBLIC_POCHTA_FORMA: ${{ vars.PUBLIC_POCHTA_FORMA }}
      PUBLIC_POCHTA_SPISOK: ${{ vars.PUBLIC_POCHTA_SPISOK }}
    steps:
      # Вся история git: «Проверено» и журнал исправлений дня берутся из git log карточки (Е5, src/lib/redakciya.mjs);
      # мелкий клон в CI роняет сборку, а не показывает всем дням одну дату.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Ролики — только со своего сервера (Р263, Сергей 26.10.2026; заявка r284): Pages — 1 ГБ на сайт, сборка
      # с роликами упёрлась в 950 МБ. После сборки все *.mp4 переносятся (не удаляются) из dist/ в video-sajta/ с теми
      # же путями: в артефакт github-pages (выкладка Pages) уходит сборка без роликов, ролики — отдельным артефактом
      # video-sajta, задача msk складывает их обратно в полную сборку для сервера. На копии Pages ролика нет (там и так
      # не грузятся стили: base '/', адрес …/rc-site/) — тег <video> с постером, проигрывание — 404.
      # Откат — убрать build-cmd и шаг «video-sajta», в msk — шаг «ролики обратно».
      - uses: withastro/action@15aa0a5a1e067940253e3b259413ab2ae882a740 # v5
        with:
          build-cmd: >-
            npm run build &&
            mkdir -p video-sajta &&
            (cd dist && find . -type f -name '*.mp4' -print0 | xargs -0 -r cp --parents -p -t ../video-sajta) &&
            find dist -type f -name '*.mp4' -delete &&
            echo "ролики вынесены из сборки Pages: $(find video-sajta -type f -name '*.mp4' | wc -l) mp4, $(du -sm video-sajta | cut -f1) МБ; сборка Pages $(du -sm dist | cut -f1) МБ"
      - name: video-sajta — ролики отдельным артефактом для своего сервера
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (та же, что в withastro/action)
        with:
          name: video-sajta
          path: video-sajta
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  # Российская площадка msk-new (Р6; решение Михаила 20.10.2026: сайт на своём сервере nginx + Let's Encrypt, Облако
  # не делаем — задача yandex снята): та же сборка, что ушла на Pages (артефакт github-pages), плюс ролики (артефакт
  # video-sajta, Р263) уходит rsync по ssh на
  # rcdeploy@185.149.145.227. На сервере ключ ограничен rrsync -wo с корнем /srv/rc-site/www — путь в команде не пишется.
  # Ключ хоста — строкой ниже (не секрет, данные Михаила 20.10), StrictHostKeyChecking=yes: подменённый сервер сайт не
  # получит. --delay-updates + --delete-after: новые файлы подменяются разом в конце, старые удаляются после — посетитель
  # не застаёт полусайт. nginx (Михаил): try_files $uri $uri/ $uri.html, error_page 404 /404.html.
  # Нужно: секрет RU_DEPLOY_KEY (кладёт Михаил); нет — задача спит строкой в журнале. Ошибка — предупреждение, Pages и
  # IndexNow не роняются (continue-on-error). Откат — убрать эту задачу.
  msk:
    needs: build
    runs-on: ubuntu-latest
    # Окружение msk-new (Р64): секрет RU_DEPLOY_KEY переносится сюда из секретов репо (Михаил) с правилом «только main».
    # Пока окружение без правил — поведение прежнее.
    environment: msk-new
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      KLYUCH: ${{ secrets.RU_DEPLOY_KEY }}
      KUDA: rcdeploy@185.149.145.227
      IZVESTNYE: 185.149.145.227 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINiBNP3Z9qG62TuG7JbZftc72//MO+dQQjR9B9B3F/nh
      ADRES: ${{ vars.RU_DEPLOY_URL }}
      RU_DEPLOY_MAX_MB: ${{ vars.RU_DEPLOY_MAX_MB }}
    steps:
      - id: est
        run: |
          if [ -z "$KLYUCH" ]; then
            echo "::notice::msk-new: нет секрета RU_DEPLOY_KEY (Михаил) — выкладка в Россию пропущена, сайт выложен на GitHub Pages"
            echo "est=false" >> "$GITHUB_OUTPUT"
          else
            echo "est=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.est.outputs.est == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: artefakt
      # Ролики обратно в сборку (Р263, r284): Pages получил сборку без *.mp4, сервер — полную. Роликов в сборке должно
      # стать ровно столько, сколько в video-sajta, иначе выкладка останавливается: --delete-after стёр бы ролики с сервера.
      - name: ролики обратно
        if: steps.est.outputs.est == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: video-sajta
          path: video-sajta
      - name: выкладка на msk-new
        if: steps.est.outputs.est == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist && tar -xf artefakt/artifact.tar -C dist
          vsego=$(find video-sajta -type f -name '*.mp4' | wc -l)
          [ "$vsego" -gt 0 ] || { echo "::error::msk-new: артефакт video-sajta пуст — выкладка остановлена"; exit 1; }
          cp -a video-sajta/. dist/
          v_dist=$(find dist -type f -name '*.mp4' | wc -l)
          [ "$v_dist" = "$vsego" ] || { echo "::error::msk-new: роликов в сборке $v_dist, а вынесено $vsego — выкладка остановлена"; exit 1; }
          echo "msk-new: роликов $v_dist из $vsego, $(du -sm video-sajta | cut -f1) МБ"
          # Проверка содержимого до выкладки (Р63): обязательные файлы есть, секретов и ключей нет, размер разумный.
          for f in index.html 404.html robots.txt; do
            test -f "dist/$f" || { echo "::error::msk-new: в сборке нет $f — выкладка остановлена"; exit 1; }
          done
          lishnie=$(find dist \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \
            -o -name 'id_rsa*' -o -name 'id_ed25519*' -o -name 'id_ecdsa*' -o -name 'id_dsa*' -o -name '.git' -o -name '.npmrc' \) -print)
          if [ -n "$lishnie" ]; then echo "::error::msk-new: в сборке файлы, похожие на секреты:"; echo "$lishnie"; exit 1; fi
          if grep -rIl -E -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' dist >/dev/null; then
            echo "::error::msk-new: в сборке закрытый ключ"; grep -rIl -E -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' dist; exit 1
          fi
          mb=$(du -sm dist | cut -f1); echo "msk-new: размер сборки $mb МБ"
          [ "$mb" -le "${RU_DEPLOY_MAX_MB:-1500}" ] || { echo "::error::msk-new: сборка $mb МБ больше порога ${RU_DEPLOY_MAX_MB:-1500} МБ"; exit 1; }
          umask 077; mkdir -p ~/.ssh
          printf '%s\n' "$KLYUCH" > ~/.ssh/klyuch
          printf '%s\n' "$IZVESTNYE" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/klyuch -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes"
          rsync -rlptz --delete-after --delay-updates --chmod=D755,F644 --stats -e "$SSH" dist/ "$KUDA:" | tail -n 15
          rm -f ~/.ssh/klyuch
          echo "msk-new: выложено в $KUDA — $(find dist -type f | wc -l) файлов"
          if [ -n "$ADRES" ]; then
            kod=$(curl -s -o /dev/null -w '%{http_code}' "$ADRES") || kod=нет
            echo "проверка $ADRES — код $kod"
            [ "$kod" = 200 ] || echo "::warning::msk-new: $ADRES ответил $kod"
          fi
  # IndexNow (Е6, Р47; «да» Сергея 20.10.2026): после выкладки — адреса волны 1 карты сайта и изменившиеся за сутки
  # Яндексу и Bing (scripts/indexnow.mjs; ночью — только изменившиеся). Без сети или с ошибкой — предупреждение,
  # выкладка уже прошла и не роняется. Откат — убрать эту задачу.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts/indexnow.mjs
            src/data/karta-sayta.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs ${{ (github.event_name == 'schedule' || inputs.nochnaya) && '--tolko-svezhie' || '' }}
