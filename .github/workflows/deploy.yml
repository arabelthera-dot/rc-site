# Сборка и выкладка на GitHub Pages — официальный способ Astro (withastro/action).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Ночная пересборка (Сергей 17.10.2026, «да» на стандартную настройку): дни и RSS зависят от даты,
  # поэтому сайт собирается заново каждую ночь — 00:07 МСК (21:07 UTC), минута не круглая,
  # чтобы не стоять в общей очереди GitHub. Откат — убрать этот блок.
  schedule:
    - cron: '7 21 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Это превью на /rc-site/ — поисковикам закрыто (meta noindex + robots.txt). Основной адрес после
    # переключения собирает задача vykladka-site ниже — без этой переменной, он индексируется.
    env:
      PUBLIC_NOINDEX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v5
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Выкладка на основной адрес https://russian-civilization.ru/ (свой домен с 18.10.2026): та же сборка
  # под корень домена — в ветку site старого репозитория; cname кладёт CNAME в каждую выкладку
  # (force_orphan иначе стёр бы его и домен слетел). Старые github.io/rc-museum-preview/* GitHub
  # переадресует на домен сам. Откат домена — убрать --site/--base / и cname, вернуть
  # --base /rc-museum-preview, затем gh api -X PUT repos/arabelthera-dot/rc-museum-preview/pages -F cname=.
  # Pages rc-museum-preview смотрит на ветку site (проверено 19.10.2026: source site /, cname
  # russian-civilization.ru); site пишет только эта задача — она и есть живой сайт. Старый сайт —
  # main того же репо; откат — источник Pages на main по docs/otkat-pereklyucheniya.md, п. 3 и 7
  # (откат после переключения 17.10 ещё не репетировался). Выключатель — переменная репозитория RC_SITE_TO_PREVIEW (не '1' — задача
  # пропускается и живой сайт застывает на последней сборке).
  vykladka-site:
    needs: build
    if: vars.RC_SITE_TO_PREVIEW == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --site https://russian-civilization.ru --base /
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.RC_MUSEUM_PREVIEW_DEPLOY_KEY }}
          external_repository: arabelthera-dot/rc-museum-preview
          publish_branch: site
          publish_dir: ./dist
          force_orphan: true
          cname: russian-civilization.ru
          commit_message: 'rc-site → site'
