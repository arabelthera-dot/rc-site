# Сборка и выкладка на GitHub Pages — официальный способ Astro (withastro/action).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nochnaya:
        description: 'Ночная пересборка: собрать, только если сегодня (по Москве) сайт ещё не собирался — для внешнего будильника'
        type: boolean
        default: false
  # Ночная пересборка (Сергей 17.10.2026, «да» на стандартную настройку): RSS, «Детям» и вид без JS зависят от даты,
  # поэтому сайт собирается заново каждую ночь. Расписание GitHub время не гарантирует (Б11: 19.10 запуск в 01:58,
  # 20.10 — в 03:12 МСК вместо 00:07), поэтому попыток три — 00:07, 00:37, 01:07 МСК (21:07, 21:37, 22:07 UTC),
  # минуты не круглые, чтобы не стоять в общей очереди GitHub. Собирает первая; остальные видят в задаче «nado»,
  # что сегодня по Москве сборка уже прошла, и выходят. Откат — revert заявки (Б11, задача L).
  schedule:
    - cron: '7 21 * * *'
    - cron: '37 21 * * *'
    - cron: '7 22 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # «Уже собрано сегодня — выйти» (Б11, задача L): для запуска по расписанию и для ночного вызова извне
  # (workflow_dispatch с nochnaya=true) — есть ли с московской полуночи запуск этого же deploy.yml с успешной
  # задачей build (любой: по расписанию, по слиянию в main, ручной). Есть — сборка и выкладка пропускаются.
  # Запуски deploy.yml идут по одному (concurrency: pages), поэтому двух проверяющих одновременно не бывает.
  # Слияние в main и ручной запуск собирают всегда. Ошибка API — собираем (лишняя сборка лучше вчерашнего сайта).
  nado:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      sobrat: ${{ steps.p.outputs.sobrat }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          SOBYTIE: ${{ github.event_name }}
          NOCHNAYA: ${{ inputs.nochnaya }}
        run: |
          if [ "$SOBYTIE" != schedule ] && [ "$NOCHNAYA" != true ]; then echo "sobrat=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          polnoch=$(date -u -d "$(TZ=Europe/Moscow date +%F) 00:00 +0300" +%FT%TZ)
          echo "московская полночь — $polnoch UTC"
          runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" -f created=">=$polnoch" -f status=success -f per_page=100 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id") || { echo "::warning::список запусков недоступен — собираем"; echo "sobrat=true" >> "$GITHUB_OUTPUT"; exit 0; }
          for id in $runs; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length')" != 0 ]; then
              echo "сегодня по Москве сайт уже собран: запуск $id — выходим"
              echo "sobrat=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "сегодня по Москве сборки ещё не было — собираем"
          echo "sobrat=true" >> "$GITHUB_OUTPUT"
  build:
    needs: nado
    if: needs.nado.outputs.sobrat == 'true'
    runs-on: ubuntu-latest
    # Основной адрес https://russian-civilization.ru/ (свой домен на Pages этого репо с 19.10.2026) —
    # индексируется. Откат на старую выкладку — revert заявки «домен на rc-site» + cname обратно.
    env:
      # Поиск по сайту (pagefind) — переменная репозитория RC_POISK ('1' — включён; src/integrations/poisk.mjs).
      RC_POISK: ${{ vars.RC_POISK }}
      # «Поддержать проект» (Р31, 20.10.2026): пусто — выключен до работающего приёма денег, '1' — включён.
      PUBLIC_PODDERZHKA: ${{ vars.PUBLIC_PODDERZHKA }}
      # Почта (Р32, М48): форма подписки рядом с Telegram — только при PUBLIC_POCHTA=1 и адресе формы сервиса.
      PUBLIC_POCHTA: ${{ vars.PUBLIC_POCHTA }}
      PUBLIC_POCHTA_FORMA: ${{ vars.PUBLIC_POCHTA_FORMA }}
      PUBLIC_POCHTA_SPISOK: ${{ vars.PUBLIC_POCHTA_SPISOK }}
    steps:
      # Вся история git: «Проверено» и журнал исправлений дня берутся из git log карточки (Е5, src/lib/redakciya.mjs);
      # мелкий клон в CI роняет сборку, а не показывает всем дням одну дату.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: withastro/action@v5
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Яндекс Облако (Р6, задача Y, 20.10.2026; docs/yandex-oblako.md): та же сборка, что ушла на Pages (артефакт
  # github-pages), — в бакет Object Storage russian-civilization.ru через aws s3 sync с endpoint Яндекса
  # (https://yandex.cloud/ru/docs/storage/tools/aws-cli). Content-Type и Cache-Control задаются явно по типам файлов:
  # _astro/* (имена с хэшем) — год, immutable; картинки, звук, видео, шрифты — неделя; css/js/json — час; HTML — 10 минут, как на Pages.
  # Тяжёлые файлы сверяются по размеру (--size-only), текстовые выкладываются каждый раз; --delete убирает удалённое.
  # Нет секретов YC_ACCESS_KEY_ID/YC_SECRET_ACCESS_KEY — задача спит со строкой в журнале. Ошибка — предупреждение,
  # Pages и IndexNow не роняются (continue-on-error). Откат — убрать эту задачу.
  yandex:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ru-central1
      YC_S3: https://storage.yandexcloud.net
      BAKET: ${{ vars.YC_BUCKET || 'russian-civilization.ru' }}
    steps:
      - id: est
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::Яндекс Облако: нет секретов YC_ACCESS_KEY_ID / YC_SECRET_ACCESS_KEY (М47, Михаил) — выкладка в бакет пропущена, сайт выложен на GitHub Pages"
            echo "est=false" >> "$GITHUB_OUTPUT"
          else
            echo "est=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.est.outputs.est == 'true'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artefakt
      - name: выкладка в бакет
        if: steps.est.outputs.est == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist && tar -xf artefakt/artifact.tar -C dist
          test -f dist/index.html && test -f dist/404.html
          s3() { aws s3 sync dist "s3://$BAKET" --endpoint-url "$YC_S3" --only-show-errors --no-progress --delete "$@"; }
          GOD='public, max-age=31536000, immutable'; NEDELYA='public, max-age=604800'; CHAS='public, max-age=3600'; HTML='public, max-age=600'
          # 1. _astro/ — имена с хэшем содержимого, по типам.
          while read -r ras tip; do
            s3 --size-only --exclude '*' --include "_astro/*.$ras" --content-type "$tip" --cache-control "$GOD"
          done <<'TIPY'
          js text/javascript; charset=utf-8
          css text/css; charset=utf-8
          jpg image/jpeg
          png image/png
          webp image/webp
          avif image/avif
          svg image/svg+xml
          woff2 font/woff2
          TIPY
          ASTRO=(); for r in js css jpg png webp avif svg woff2; do ASTRO+=(--exclude "_astro/*.$r"); done
          s3 --size-only --exclude '*' --include '_astro/*' "${ASTRO[@]}" --cache-control "$GOD"
          # 2. Тяжёлые файлы — по размеру.
          while read -r ras tip; do
            s3 --size-only --exclude '*' --include "*.$ras" --exclude '_astro/*' --content-type "$tip" --cache-control "$NEDELYA"
          done <<'TIPY'
          jpg image/jpeg
          jpeg image/jpeg
          png image/png
          webp image/webp
          avif image/avif
          gif image/gif
          ico image/x-icon
          mp3 audio/mpeg
          mp4 video/mp4
          webm video/webm
          woff2 font/woff2
          woff font/woff
          pdf application/pdf
          TIPY
          # 3. Текстовые — каждый раз (размер у правки может совпасть).
          while read -r ras tip; do
            s3 --exclude '*' --include "*.$ras" --exclude '_astro/*' --content-type "$tip" --cache-control "$CHAS"
          done <<'TIPY'
          css text/css; charset=utf-8
          js text/javascript; charset=utf-8
          mjs text/javascript; charset=utf-8
          json application/json
          webmanifest application/manifest+json
          svg image/svg+xml
          vtt text/vtt; charset=utf-8
          txt text/plain; charset=utf-8
          xml application/xml
          wasm application/wasm
          TIPY
          # 4. Всё прочее (индекс поиска pagefind и т. п.) — тип по расширению от самого aws-cli.
          ISKL=(); for r in html jpg jpeg png webp avif gif ico mp3 mp4 webm woff2 woff pdf css js mjs json webmanifest svg vtt txt xml wasm; do ISKL+=(--exclude "*.$r"); done
          s3 "${ISKL[@]}" --exclude '_astro/*' --cache-control "$CHAS"
          # 5. HTML последним — страницы ссылаются уже на выложенные файлы.
          s3 --exclude '*' --include '*.html' --content-type 'text/html; charset=utf-8' --cache-control "$HTML"
          echo "Яндекс Облако: выложено в бакет $BAKET — $(find dist -type f | wc -l) файлов"
          kod=$(curl -s -o /dev/null -w '%{http_code}' "http://$BAKET.website.yandexcloud.net/") || kod=нет
          echo "проверка http://$BAKET.website.yandexcloud.net/ — код $kod"
          [ "$kod" = 200 ] || echo "::warning::Яндекс Облако: сайт бакета ответил $kod (хостинг включает terraform-yandex.yml)"
  # IndexNow (Е6, Р47; «да» Сергея 20.10.2026): после выкладки — адреса волны 1 карты сайта и изменившиеся за сутки
  # Яндексу и Bing (scripts/indexnow.mjs; ночью — только изменившиеся). Без сети или с ошибкой — предупреждение,
  # выкладка уже прошла и не роняется. Откат — убрать эту задачу.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/indexnow.mjs
            src/data/karta-sayta.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs ${{ (github.event_name == 'schedule' || inputs.nochnaya) && '--tolko-svezhie' || '' }}
