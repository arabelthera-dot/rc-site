# Сборка и выкладка на GitHub Pages — официальный способ Astro (withastro/action).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nochnaya:
        description: 'Ночная пересборка: собрать, только если сегодня (по Москве) сайт ещё не собирался — для внешнего будильника'
        type: boolean
        default: false
  # Ночная пересборка (Сергей 17.10.2026, «да» на стандартную настройку): RSS, «Детям» и вид без JS зависят от даты,
  # поэтому сайт собирается заново каждую ночь. Расписание GitHub время не гарантирует (Б11: 19.10 запуск в 01:58,
  # 20.10 — в 03:12 МСК вместо 00:07), поэтому попыток три — 00:07, 00:37, 01:07 МСК (21:07, 21:37, 22:07 UTC),
  # минуты не круглые, чтобы не стоять в общей очереди GitHub. Собирает первая; остальные видят в задаче «nado»,
  # что сегодня по Москве сборка уже прошла, и выходят. Откат — revert заявки (Б11, задача L).
  schedule:
    - cron: '7 21 * * *'
    - cron: '37 21 * * *'
    - cron: '7 22 * * *'
# Права по умолчанию — только чтение (20.10.2026, цепочка «ошибка помощника → сайт»): pages и id-token — лишь у задачи
# deploy, сборка (npm-пакеты, скрипты заявки) выложить сайт сама не может. Откат — вернуть три строки сюда.
permissions:
  contents: read
# Выкладки (Р676 → Р727, 10.11.2026): в группе один работающий и один ожидающий — самый свежий; новое вливание заменяет
# ожидающий, и тот выкладывает main целиком со всеми прошлыми вливаниями (стандарт GitHub concurrency). queue: max
# (9.11) ставил каждое вливание отдельной полной сборкой по ~16 мин подряд — 10.11 очередь из 13 выкладок отстала на 2,5 ч.
# Дыра 9.11 (3fb34f3c, 782ddde1 не дошли) была в «nado»: расписание вытесняло ожидающее вливание и выходило, раз сегодня
# уже собирали. Теперь расписание выходит, только если сегодня собран именно этот коммит main. Откат — вернуть queue: max.
# cancel-in-progress: true не ставим (r790, 16.11.2026): при слияниях каждые 5–10 минут каждая выкладка рубила бы
# предыдущую, и сайт не обновлялся бы весь поток; оборванный посреди rsync сервер остался бы с частью новых файлов.
# Нынешнее «один работает, ждёт один самый свежий» и даёт из 10 слияний подряд не больше двух выкладок.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # «Уже собрано сегодня — выйти» (Б11, задача L): для запуска по расписанию и для ночного вызова извне
  # (workflow_dispatch с nochnaya=true) — есть ли с московской полуночи запуск этого же deploy.yml с успешной
  # задачей build (любой: по расписанию, по слиянию в main, ручной). Есть — сборка и выкладка пропускаются.
  # Запуски deploy.yml идут по одному (concurrency: pages), поэтому двух проверяющих одновременно не бывает.
  # Слияние в main и ручной запуск собирают всегда. Ошибка API — собираем (лишняя сборка лучше вчерашнего сайта).
  nado:
    runs-on: ubuntu-24.04  # Р761: на ubuntu-latest (26.04) Playwright не ставит chromium
    permissions:
      actions: read
    outputs:
      sobrat: ${{ steps.p.outputs.sobrat }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          SOBYTIE: ${{ github.event_name }}
          NOCHNAYA: ${{ inputs.nochnaya }}
        run: |
          if [ "$SOBYTIE" != schedule ] && [ "$NOCHNAYA" != true ]; then echo "sobrat=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          polnoch=$(date -u -d "$(TZ=Europe/Moscow date +%F) 00:00 +0300" +%FT%TZ)
          echo "московская полночь — $polnoch UTC"
          runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" -f created=">=$polnoch" -f status=success -f per_page=100 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .head_sha == \"$GITHUB_SHA\") | .id") || { echo "::warning::список запусков недоступен — собираем"; echo "sobrat=true" >> "$GITHUB_OUTPUT"; exit 0; }
          for id in $runs; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length')" != 0 ]; then
              echo "сегодня по Москве этот коммит main уже собран: запуск $id — выходим"
              echo "sobrat=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "сегодня по Москве этот коммит main ещё не собирали — собираем"
          echo "sobrat=true" >> "$GITHUB_OUTPUT"
  build:
    needs: nado
    if: needs.nado.outputs.sobrat == 'true'
    runs-on: ubuntu-24.04  # Р761: на ubuntu-latest (26.04) Playwright не ставит chromium
    # Основной адрес https://russian-civilization.ru/ — сервер msk-new (nginx + Let's Encrypt, с 21.10.2026), задача msk ниже;
    # Pages этого репо — зеркало (свой домен с Pages снят). Индексируется основной адрес.
    env:
      # Поиск по сайту (pagefind) — переменная репозитория RC_POISK ('1' — включён; src/integrations/poisk.mjs).
      RC_POISK: ${{ vars.RC_POISK }}
      # «Поддержать проект» (Р31, 20.10.2026): пусто — выключен до работающего приёма денег, '1' — включён.
      PUBLIC_PODDERZHKA: ${{ vars.PUBLIC_PODDERZHKA }}
      PUBLIC_CSP: ${{ vars.PUBLIC_CSP }}
      # Почта (Р32, М48): форма подписки рядом с Telegram — только при PUBLIC_POCHTA=1 и адресе формы сервиса.
      PUBLIC_POCHTA: ${{ vars.PUBLIC_POCHTA }}
      PUBLIC_POCHTA_FORMA: ${{ vars.PUBLIC_POCHTA_FORMA }}
      PUBLIC_POCHTA_SPISOK: ${{ vars.PUBLIC_POCHTA_SPISOK }}
      # Выход по дате (Р686 п.7, src/lib/vyhod.mjs): '1' — день с god_pokaza выходит в свой день ночной пересборкой
      # (schedule выше); пусто — выключено, все готовые дни на сайте сразу, как раньше.
      RC_PO_DATE: ${{ vars.RC_PO_DATE }}
      # «Мой край» (п.505, Р746): '1' — страницы /moy-kray/ и вход с главной; пусто — выключено.
      PUBLIC_MOY_KRAY: ${{ vars.PUBLIC_MOY_KRAY }}
    steps:
      # Вся история git: «Проверено» и журнал исправлений дня берутся из git log карточки (Е5, src/lib/redakciya.mjs);
      # мелкий клон в CI роняет сборку, а не показывает всем дням одну дату. История — без старых версий файлов
      # (частичный клон blob:none, Р819): git log по путям читает только коммиты и деревья, старые ролики не качаются.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      # Кэш сборки (Р737 п.7а) — тот же путь и ключ, что в proverka.yml: заявки берут кэш, сохранённый здесь на main.
      # Кадры пересылки rc-og-den, картинки rc-kartinki, плитки лупы rc-dz и кэш Astro ключуются хешем содержимого.
      # Восстанавливается до withastro/action: там npm install (не ci), папки на точку в node_modules он не трогает.
      # Свой кэш Astro у withastro/action выключен (cache: false) — он лишь дублировал бы node_modules/.astro.
      # Как в мире — docs.github.com «Caching dependencies». Откат — удалить шаг и строку cache: false.
      - name: кэш сборки — og, картинки, лупа, Astro
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.astro
            node_modules/.cache/rc-og-den
            node_modules/.cache/rc-kartinki
            node_modules/.cache/rc-dz
          key: rc-sborka-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            rc-sborka-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            rc-sborka-${{ runner.os }}-
      # Картинки — и в хранилище media.russian-civilization.ru (Р825 задача F, 19.11.2026): картинки остаются в git и в
      # dist, этот шаг докладывает их из public/ в хранилище, как rolik-na-sait.yml ролики. vars.MEDIA_KARTINKI: пусто —
      # выключено; путь страницы от корня dist (muzei/…/den/02-02) или список через запятую — только они; '*' — все.
      # MEDIA_KARTINKI попадает в сборку, только если закачка удалась: тогда scripts/media-base.mjs ставит img/srcset
      # прямых ссылок на хранилище. Не удалась — предупреждение, картинки берутся из dist, как раньше.
      # Откат — опустошить vars.MEDIA_KARTINKI.
      # Картинки шаблона (dist/_k/) рождаются только в сборке — их докладывает scripts/kartinki-k-v-hranilishche.sh
      # в build-cmd ниже (Р825 задача G); ключ хранилища поэтому есть и в env шага сборки.
      - name: картинки в хранилище
        if: vars.MEDIA_KARTINKI != ''
        env:
          MEDIA_KLYUCH: ${{ secrets.MEDIA_SSH_KEY }}
          IZVESTNYE: 185.149.145.227 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINiBNP3Z9qG62TuG7JbZftc72//MO+dQQjR9B9B3F/nh
          MOST: ${{ vars.RU_MOST }}
          MOST2: ${{ vars.RU_MOST2 }}
          KARTINKI: ${{ vars.MEDIA_KARTINKI }}
        run: |
          [ -n "$MEDIA_KLYUCH" ] || { echo "::warning::нет секрета MEDIA_SSH_KEY — картинки из dist"; exit 0; }
          most=$(scripts/prohod-v-rossiyu.sh) || { echo "::warning::нет прохода в Россию — картинки из dist"; exit 0; }
          S="$RUNNER_TEMP/ssh-media"; (umask 077; mkdir -p "$S"; printf '%s\n' "$MEDIA_KLYUCH" > "$S/media"; printf '%s\n' "$IZVESTNYE" > "$S/known_hosts")
          # без --delete — только докладываем; --checksum — как у роликов (r790)
          rsync -rltz --checksum --delay-updates --chmod=D755,F644 --stats --include='*/' \
            --include='*.jpg' --include='*.jpeg' --include='*.png' --include='*.webp' --include='*.avif' --include='*.gif' --include='*.svg' \
            --exclude='*' --prune-empty-dirs \
            -e "ssh -i $S/media -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$S/known_hosts -o BatchMode=yes -o ConnectTimeout=30 $most" \
            public/ rcmedia@185.149.145.227: | tail -n 4
          kod=${PIPESTATUS[0]}; rm -rf "$S"
          [ "$kod" = 0 ] || { echo "::warning::картинки не доложены в хранилище (rsync $kod) — картинки из dist"; exit 0; }
          echo "MEDIA_KARTINKI=$KARTINKI" >> "$GITHUB_ENV"
      # Ролики — только в хранилище media.russian-civilization.ru (Р825 задача A, 18.11.2026): mp4 в public/ нет, их
      # кладёт туда rolik-na-sait.yml, список — src/data/hranilishche-rolikov.sha256. Сборка выходит без роликов, и
      # прежний перенос mp4 в артефакт video-sajta (Р263, r284) убран вместе с ним из msk и paket.
      # MEDIA_BASE=https://media.russian-civilization.ru обязателен: scripts/media-base.mjs ставит ссылки mp4 на хранилище.
      # Пустой MEDIA_BASE больше не откат — роликов на сайте нет; откат — revert заявки Р825 шаг 5.
      # Рамка зеркала (п.501, Р745): scripts/ramka-zerkala.mjs — копия на *.github.io не показывается внутри чужой
      # страницы; на своём сервере скрипт молчит. Откат — убрать три строки ramka/csp из build-cmd.
      - uses: withastro/action@15aa0a5a1e067940253e3b259413ab2ae882a740 # v5
        env:
          MEDIA_BASE: ${{ vars.MEDIA_BASE }}
          MEDIA_KLYUCH: ${{ vars.MEDIA_KARTINKI != '' && secrets.MEDIA_SSH_KEY || '' }}
          IZVESTNYE: 185.149.145.227 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINiBNP3Z9qG62TuG7JbZftc72//MO+dQQjR9B9B3F/nh
          MOST: ${{ vars.RU_MOST }}
          MOST2: ${{ vars.RU_MOST2 }}
        with:
          cache: false
          build-cmd: >-
            npm run build &&
            bash scripts/kartinki-k-v-hranilishche.sh &&
            node scripts/ramka-zerkala.mjs --proba &&
            node tests/csp-strogiy.mjs &&
            node scripts/ramka-zerkala.mjs dist &&
            echo "сборка $(du -sm dist | cut -f1) МБ, mp4 в ней: $(find dist -type f -name '*.mp4' | wc -l)"
  deploy:
    needs: build
    runs-on: ubuntu-24.04  # Р761: на ubuntu-latest (26.04) Playwright не ставит chromium
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.povtor.outputs.page_url }}
    # Повтор выкладки (Р568, 06.11.2026): прогон 42214452722 — Pages отменил выкладку («Deployment cancelled»/«Timeout
    # reached»), сайт ждал ручного перезапуска. Образец — docs.github.com, контекст steps: первая попытка с
    # continue-on-error, вторая — только при steps.deployment.outcome == 'failure', после паузы; та же сборка (артефакт
    # github-pages). Вторая тоже упала — прогон красный, как прежде. Откат — убрать шаги pauza и povtor.
    # Зеркало для заграницы (Р815, 18.11.2026): Pages живёт в подпапке /rc-site/, сборка — под корень домена, поэтому
    # на копии артефакта пути переписываются scripts/zerkalo-podpapka.mjs и выкладывается артефакт github-pages-zerkalo.
    # Артефакт github-pages (его берут msk и paket для .ru) не меняется. Откат — убрать три шага zerkalo и artifact_name.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/zerkalo-podpapka.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: artefakt
      - name: zerkalo — пути под подпапку /rc-site/
        run: |
          set -euo pipefail
          mkdir -p zerkalo && tar -xf artefakt/artifact.tar -C zerkalo && rm -rf artefakt
          node scripts/zerkalo-podpapka.mjs zerkalo /rc-site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: zerkalo
          name: github-pages-zerkalo
          retention-days: 1
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-zerkalo
      - name: pauza — Pages отказал, вторая попытка через минуту
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::deploy-pages — первая попытка не удалась, повтор через минуту"
          sleep 60
      - id: povtor
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-zerkalo
  # Российская площадка msk-new (Р6; решение Михаила 20.10.2026: сайт на своём сервере nginx + Let's Encrypt, Облако
  # не делаем — задача yandex снята): та же сборка, что ушла на Pages (артефакт github-pages; роликов
  # в ней нет — они в хранилище media.russian-civilization.ru, Р825) уходит rsync по ssh на
  # rcdeploy@185.149.145.227. На сервере ключ ограничен rrsync -wo с корнем /srv/rc-site/www — путь в команде не пишется.
  # Ключ хоста — строкой ниже (не секрет, данные Михаила 20.10), StrictHostKeyChecking=yes: подменённый сервер сайт не
  # получит. --delay-updates + --delete-after: новые файлы подменяются разом в конце, старые удаляются после — посетитель
  # не застаёт полусайт. nginx (Михаил): try_files $uri $uri/ $uri.html, error_page 404 /404.html.
  # Нужно: секрет RU_DEPLOY_KEY (кладёт Михаил); нет — задача спит строкой в журнале. Отказ выкладки — красный прогон
  # и строка в итоге прогона (Р531, 04.11.2026: с continue-on-error прогон был зелёным, а сайт в России — старым,
  # 41847877029: сборка 1647 МБ > порога). Pages и IndexNow от msk не зависят (needs: build / deploy) и выкладываются
  # как прежде. Откат — убрать эту задачу.
  msk:
    needs: build
    # Исполнитель внутри России (r790, 16.11.2026; выключено): переменная репо RC_RUNNER_RF = '1' — задачи msk и zhivoy
    # идут на свой исполнитель с метками self-hosted, rf (сервер в России, ставит Михаил — docs/vykladka-rf-runner.md);
    # пусто — облако GitHub, как прежде. Нужен, когда msk-new закрыт из-за границы (с 13.11.2026 22/443 — timeout).
    # Как в мире — docs.github.com «Choosing the runner for a job» (fromJSON-список меток). Откат — переменную очистить.
    runs-on: ${{ vars.RC_RUNNER_RF == '1' && fromJSON('["self-hosted","rf"]') || 'ubuntu-24.04' }}
    # Окружение msk-new (Р64): секрет RU_DEPLOY_KEY переносится сюда из секретов репо (Михаил) с правилом «только main».
    # Пока окружение без правил — поведение прежнее.
    environment: msk-new
    # 40, а не 20 (r790): первая выкладка после закрытия везёт всё слитое с 13.11 разом; обычная с --checksum — минуты.
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      est: ${{ steps.est.outputs.est }}
    env:
      KLYUCH: ${{ secrets.RU_DEPLOY_KEY }}
      KUDA: rcdeploy@185.149.145.227
      IZVESTNYE: 185.149.145.227 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINiBNP3Z9qG62TuG7JbZftc72//MO+dQQjR9B9B3F/nh
      ADRES: ${{ vars.RU_DEPLOY_URL }}
      RU_SAYT_MAX_MB: ${{ vars.RU_SAYT_MAX_MB }}
      # Проход в Россию (18.11.2026, без Михаила): msk-new с 13.11 закрыт из-за границы, а изнутри РФ открыт. vars.RU_MOST —
      # адрес туннеля Cloudflare (trycloudflare.com) до нашего сервера, где узкий проход ведёт только на 185.149.145.227:22
      # через РФ-выход (~/tools/rf-most). ssh идёт сквозь туннель как через ProxyJump: ключ RU_DEPLOY_KEY из облака не
      # выходит, сервер сверяется по IZVESTNYE — подмена по пути невозможна. Пусто — прямой путь, как прежде (откат).
      # Запасные (Р813): пути по порядку — прямой (если фильтр сняли), Cloudflare (RU_MOST), bore.pub (RU_MOST2, host:port);
      # берётся первый, где сервер ответил баннером SSH. Адреса держит смотритель ~/tools/rf-most/smotritel.py.
      MOST: ${{ vars.RU_MOST }}
      MOST2: ${{ vars.RU_MOST2 }}
    steps:
      - id: est
        run: |
          if [ -z "$KLYUCH" ]; then
            echo "::notice::msk-new: нет секрета RU_DEPLOY_KEY (Михаил) — выкладка в Россию пропущена, сайт выложен на GitHub Pages"
            echo "est=false" >> "$GITHUB_OUTPUT"
          else
            echo "est=true" >> "$GITHUB_OUTPUT"
          fi
      - name: проход в Россию
        if: steps.est.outputs.est == 'true' && (env.MOST != '' || env.MOST2 != '')
        run: |
          set -euo pipefail
          otvet() { timeout 25 bash -c "exec 3<>/dev/tcp/$1/$2 && head -c 7 <&3" 2>/dev/null | grep -q '^SSH-2.0'; }
          if otvet 185.149.145.227 22; then echo "msk-new: прямой путь открыт — без прохода"; exit 0; fi
          # Версия и контрольная сумма закреплены: чужой файл не запустится.
          # Не скачался cloudflared — не беда, дальше запасной bore (ему в облаке ставить нечего: nc есть в образе).
          if [ -n "$MOST" ] && curl -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.11.1/cloudflared-linux-amd64 \
             && echo "97bb3b02d23a5980fc9c15a1a270e692da1923f103f920d5b16d4931d5ab55e7  $RUNNER_TEMP/cloudflared" | sha256sum -c -; then
            chmod +x "$RUNNER_TEMP/cloudflared"
            printf '#!/bin/sh\nexec "%s" access tcp --hostname "%s"\n' "$RUNNER_TEMP/cloudflared" "$MOST" > "$RUNNER_TEMP/most.sh"
            chmod +x "$RUNNER_TEMP/most.sh"
            "$RUNNER_TEMP/cloudflared" access tcp --hostname "$MOST" --url 127.0.0.1:2222 >/dev/null 2>&1 &
            cf=$!
            est=0; for i in $(seq 1 15); do sleep 2; if otvet 127.0.0.1 2222; then est=1; break; fi; done
            kill "$cf" || true
            if [ "$est" = 1 ]; then
              echo "SSH_MOST=-o ProxyCommand=$RUNNER_TEMP/most.sh" >> "$GITHUB_ENV"; echo "msk-new: выкладка через проход $MOST"; exit 0
            fi
            echo "::warning::msk-new: проход Cloudflare $MOST не ответил — пробую запасной"
          fi
          if [ -n "$MOST2" ] && otvet "${MOST2%:*}" "${MOST2##*:}"; then
            printf '#!/bin/sh\nexec nc %s %s\n' "${MOST2%:*}" "${MOST2##*:}" > "$RUNNER_TEMP/most2.sh"; chmod +x "$RUNNER_TEMP/most2.sh"
            echo "SSH_MOST=-o ProxyCommand=$RUNNER_TEMP/most2.sh" >> "$GITHUB_ENV"
            echo "msk-new: выкладка через запасной проход $MOST2"; exit 0
          fi
          echo "::error::msk-new: ни прямой путь, ни проходы ($MOST, $MOST2) не отвечают — смотритель ~/tools/rf-most"; exit 1
      - if: steps.est.outputs.est == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: artefakt
      - name: выкладка на msk-new
        if: steps.est.outputs.est == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist && tar -xf artefakt/artifact.tar -C dist
          # Проверка содержимого до выкладки (Р63): обязательные файлы есть, секретов и ключей нет, размер разумный.
          for f in index.html 404.html robots.txt; do
            test -f "dist/$f" || { echo "::error::msk-new: в сборке нет $f — выкладка остановлена"; exit 1; }
          done
          lishnie=$(find dist \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \
            -o -name 'id_rsa*' -o -name 'id_ed25519*' -o -name 'id_ecdsa*' -o -name 'id_dsa*' -o -name '.git' -o -name '.npmrc' \) -print)
          if [ -n "$lishnie" ]; then echo "::error::msk-new: в сборке файлы, похожие на секреты:"; echo "$lishnie"; exit 1; fi
          if grep -rIl -E -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' dist >/dev/null; then
            echo "::error::msk-new: в сборке закрытый ключ"; grep -rIl -E -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' dist; exit 1
          fi
          # Бюджет размера (Р536, п. 9) — как в мире, по частям, а не одним числом на всё (прежний RU_DEPLOY_MAX_MB от
          # du -sm dist рос вместе с роликами, 04.11 его подняли руками до 3000 — заплатка). Сайт без роликов — не больше
          # RU_SAYT_MAX_MB (1000: лимит опубликованного сайта GitHub Pages 1 ГБ, на Pages уходит эта же сборка —
          # https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits). Бюджет ролика
          # RU_ROLIK_MAX_MB (Р825) — в rolik-na-sait.yml: ролики идут в хранилище оттуда, в сборке их нет.
          sayt=$(du -sm --exclude='*.mp4' dist | cut -f1); echo "msk-new: сайт без роликов $sayt МБ"
          [ "$sayt" -le "${RU_SAYT_MAX_MB:-1000}" ] || { echo "::error::msk-new: сайт без роликов $sayt МБ больше бюджета ${RU_SAYT_MAX_MB:-1000} МБ"; exit 1; }
          umask 077; S="$RUNNER_TEMP/ssh-sayt"; mkdir -p "$S"
          printf '%s\n' "$KLYUCH" > "$S/klyuch"
          printf '%s\n' "$IZVESTNYE" > "$S/known_hosts"
          SSH="ssh -i $S/klyuch -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$S/known_hosts -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 ${SSH_MOST:-}"
          # --checksum (r790): сборка каждый раз новая, у всех файлов новое время — без сверки содержимого rsync гнал
          # все 18 313 файлов (2,5 ГБ, 13.11: «regular files transferred 18,313», 4 мин 50 с), хотя менялось ~28 МБ.
          # Со сверкой уходят и подменяются только изменённые; у остальных лишь обновится время. Как в мире — man rsync,
          # --checksum: «skip based on checksum, not mod-time & size». Откат — убрать --checksum.
          rsync -rlptz --checksum --delete-after --delay-updates --chmod=D755,F644 --stats -e "$SSH" dist/ "$KUDA:" | tail -n 15
          rm -rf "$S"
          echo "msk-new: выложено в $KUDA — $(find dist -type f | wc -l) файлов"
          if [ -n "$ADRES" ] && [ -z "$MOST" ]; then
            kod=$(curl -s -o /dev/null -w '%{http_code}' "$ADRES") || kod=нет
            echo "проверка $ADRES — код $kod"
            [ "$kod" = 200 ] || echo "::warning::msk-new: $ADRES ответил $kod"
          fi
      # Отказ — понятной строкой наверху прогона (как failure-сводки в GitHub Actions job summary).
      - name: итог выкладки в Россию
        if: failure()
        run: |
          echo "::error::Выкладка в Россию (msk-new) НЕ прошла — сайт в России старый, GitHub Pages обновлён. Причина — строкой ::error выше в шаге «выкладка на msk-new»."
          {
            echo "### ❌ Выкладка в Россию (msk-new) не прошла"
            echo "Сайт в России остался старым; GitHub Pages обновлён. Причина — в журнале шага «выкладка на msk-new» (строка ::error)."
          } >> "$GITHUB_STEP_SUMMARY"
      # Тревога о сбое (#2363, Михаил 04.11) — тот же бот и чат, что у сторожа (storozh.yml). Нет секретов — спит строкой.
      - name: тревога в Telegram
        if: failure() && steps.est.outputs.est == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_STOROZH_CHAT: ${{ secrets.TG_STOROZH_CHAT }}
          ZAPUSK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tekst="Выкладка на msk-new (russian-civilization.ru) не прошла: $ZAPUSK"
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_STOROZH_CHAT:-}" ]; then
            echo "::notice::спит: нет секрета (TG_BOT_TOKEN / TG_STOROZH_CHAT) — не отправлено: $tekst"
            exit 0
          fi
          kod=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_STOROZH_CHAT}" \
              --data-urlencode "text=${tekst}" || true)
          echo "Telegram: код $kod"
  # Пакет для забора сервером (Р815, 18.11.2026, Сергей «да»): msk-new с 13.11 закрыт из-за границы, и толкать сборку
  # rsync-ом по ssh приходится через туннели (RU_MOST/RU_MOST2) — заплатка. По мировой практике сервер сам забирает
  # готовую сборку (pull): эта задача кладёт её ассетами в релиз с постоянным тегом vykladka, а scripts/server/zabrat-sayt.sh
  # на сервере раз в 5 минут сверяет sayt.sha256 и при новом хэше скачивает, сверяет, раскладывает (docs/zabor-na-servere.md).
  # Входящие соединения серверу больше не нужны. Задача msk не тронута: пока Михаил не включил забор, выкладка прежняя.
  # Ассеты: sayt.tar.gz (сайт без роликов) + sayt.sha256 (последним — по нему сервер видит новую сборку). Ролики в релиз
  # больше не идут (Р825): их кладёт в хранилище media.russian-civilization.ru rolik-na-sait.yml.
  # Пять вопросов: задевает — только релиз vykladka (сайт, Pages и msk не меняет); нужно — github.token с contents: write
  # (только этой задаче); без нужного — красная задача, сайт и Pages прежние; проверка — прогон на main, ассеты в релизе;
  # откат — убрать задачу; релиз vykladka можно оставить (сервер без забора его не читает).
  # Как в мире — docs.github.com «About releases» (ассет меньше 2 GiB) и pull-выкладка (сервер забирает сам).
  paket:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TEG: vykladka
      RU_SAYT_MAX_MB: ${{ vars.RU_SAYT_MAX_MB }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: artefakt
      # Те же проверки, что в msk перед rsync (Р63, Р536 п. 9): обязательные файлы есть, секретов нет, размер.
      - name: проверка сборки
        run: |
          set -euo pipefail
          mkdir -p dist && tar -xf artefakt/artifact.tar -C dist
          v_dist=$(find dist -type f -name '*.mp4' | wc -l)
          [ "$v_dist" = 0 ] || { echo "::error::paket: в сборке без роликов $v_dist mp4 — пакет не собран"; exit 1; }
          for f in index.html 404.html robots.txt; do
            test -f "dist/$f" || { echo "::error::paket: в сборке нет $f — пакет не собран"; exit 1; }
          done
          lishnie=$(find dist \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \
            -o -name 'id_rsa*' -o -name 'id_ed25519*' -o -name 'id_ecdsa*' -o -name 'id_dsa*' -o -name '.git' -o -name '.npmrc' \) -print)
          if [ -n "$lishnie" ]; then echo "::error::paket: в сборке файлы, похожие на секреты:"; echo "$lishnie"; exit 1; fi
          if grep -rIl -E -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' dist >/dev/null; then
            echo "::error::paket: в сборке закрытый ключ"; grep -rIl -E -- '-----BEGIN [A-Z ]*PRIVATE KEY-----' dist; exit 1
          fi
          sayt=$(du -sm dist | cut -f1); echo "paket: сайт без роликов $sayt МБ"
          [ "$sayt" -le "${RU_SAYT_MAX_MB:-1000}" ] || { echo "::error::paket: сайт без роликов $sayt МБ больше бюджета ${RU_SAYT_MAX_MB:-1000} МБ"; exit 1; }
      - name: релиз vykladka
        run: |
          set -euo pipefail
          gh release view "$TEG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TEG" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest=false --title "Выкладка для сервера" \
            --notes "Постоянный релиз для забора сервером (Р815): sayt.tar.gz + sayt.sha256 (ролики — в хранилище media.russian-civilization.ru, Р825). Перезаливает задача paket в deploy.yml."
      - name: сайт в релиз
        run: |
          set -euo pipefail
          mkdir -p paket
          tar -czf paket/sayt.tar.gz -C dist .
          (cd paket && sha256sum sayt.tar.gz > sayt.sha256)
          echo "paket: sayt.tar.gz $(du -m paket/sayt.tar.gz | cut -f1) МБ, $(cat paket/sayt.sha256)"
          gh release upload "$TEG" -R "$GITHUB_REPOSITORY" --clobber paket/sayt.tar.gz
          # sayt.sha256 — последним: сервер видит новый хэш, только когда архив уже на месте.
          gh release upload "$TEG" -R "$GITHUB_REPOSITORY" --clobber paket/sayt.sha256
          {
            echo "### 📦 Пакет для забора сервером"
            echo "Релиз \`$TEG\`: sayt.tar.gz $(du -m paket/sayt.tar.gz | cut -f1) МБ, ролики — в хранилище media.russian-civilization.ru."
          } >> "$GITHUB_STEP_SUMMARY"
  # Живой сайт после выкладки в Россию (Р536, п. 9) — post-deploy smoke на Playwright, как smoke.yml: машина открывает
  # https://russian-civilization.ru как посетитель — страницы дней, изменённых этой выкладкой (git diff от прошлой
  # успешной выкладки), а нет таких — выборку (tests/smoke/dni.spec.mjs). Страница 200 и равна выложенной сборке, хук
  # карточки на странице, ролик и аудиогид отдаются (HEAD 200, тип). Брак — красный прогон и карточка на доске
  # (одна открытая на всё: следующий брак — комментарием к ней). Без секрета (msk спит) — не запускается.
  # Пять вопросов: задевает — ничего, только читает сайт; нужно — github.token (actions/issues); без нужного — красный
  # прогон без карточки; проверка — zhivoy-sayt.yml на заявке; откат — убрать эту задачу.
  zhivoy:
    needs: msk
    # С проходом (vars.RU_MOST) облако до https сервера не достаёт — живой сайт проверяется с нашего сервера через РФ-выход.
    if: needs.msk.outputs.est == 'true' && vars.RU_MOST == ''
    # Свой исполнитель в России при RC_RUNNER_RF = '1' (r790, см. задачу msk): из облака закрытый сервер не открыть.
    runs-on: ${{ vars.RC_RUNNER_RF == '1' && fromJSON('["self-hosted","rf"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            tests/smoke
            src/content/days
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Playwright
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: github-pages
          path: artefakt
      # Из выложенной сборки — страницы дней и аудиогиды (сравнить с живыми); изменения — от прошлой успешной выкладки.
      - name: что выложено
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vylozheno && tar -xf artefakt/artifact.tar -C vylozheno --wildcards '*/den/*' '*.mp3'
          proshlyy=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" -f branch=main -f status=success -f per_page=20 \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0].head_sha // empty") || proshlyy=
          if [ -n "$proshlyy" ] && [ "$proshlyy" != "$GITHUB_SHA" ]; then
            gh api "repos/$GITHUB_REPOSITORY/compare/$proshlyy...$GITHUB_SHA" --paginate --jq '.files[].filename' > izmeneniya.txt || : > izmeneniya.txt
          else : > izmeneniya.txt; fi
          echo "изменено файлов с ${proshlyy:-—}: $(wc -l < izmeneniya.txt)"
      - name: дни на живом сайте
        working-directory: tests/smoke
        env:
          SMOKE_DIST: ${{ github.workspace }}/vylozheno
          SMOKE_IZMENENIYA: ${{ github.workspace }}/izmeneniya.txt
        run: npx --no-install playwright test -c playwright.config.mjs dni.spec.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: zhivoy-otchet
          path: tests/smoke/otchet
          retention-days: 7
      - name: карточка на доске
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zag='Выкладка в Россию: живой сайт не прошёл проверку дней'
          prog="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "::error::Живой сайт после выкладки в Россию не прошёл проверку дней — $prog"
          echo "### ❌ Живой сайт после выкладки не прошёл проверку дней — отчёт в артефакте zhivoy-otchet" >> "$GITHUB_STEP_SUMMARY"
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$zag\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Снова брак: $prog (коммит $GITHUB_SHA)"; exit 0; fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$zag" --label agent:arabelthera-dot --body "$(printf '%s\n' \
            "Прогон: $prog (коммит $GITHUB_SHA). Какие дни и что не так — в журнале шага «дни на живом сайте» и в артефакте zhivoy-otchet." \
            '### Готово значит' 'Задача zhivoy в deploy.yml зелёная на следующей выкладке.' \
            '### Что задевает' 'Живой сайт https://russian-civilization.ru — посетитель видит брак.' \
            '### Что нужно' 'Хозяин дня чинит карточку или страницу; сервер — Михаил.' \
            '### Что будет без нужного' 'На сайте в России день с браком.' \
            '### Проверка до слияния' 'tests/smoke/dni.spec.mjs с SMOKE_DNI=<музей/ММ-ДД> зелёный.' \
            '### Как откатить' 'Revert заявки, давшей брак.')"
  # IndexNow (Е6, Р47; «да» Сергея 20.10.2026): после выкладки — адреса волны 1 карты сайта и изменившиеся за сутки
  # Яндексу и Bing (scripts/indexnow.mjs; ночью — только изменившиеся). Без сети или с ошибкой — предупреждение,
  # выкладка уже прошла и не роняется. Откат — убрать эту задачу.
  indexnow:
    needs: deploy
    runs-on: ubuntu-24.04  # Р761: на ubuntu-latest (26.04) Playwright не ставит chromium
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts/indexnow.mjs
            src/data/karta-sayta.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs ${{ (github.event_name == 'schedule' || inputs.nochnaya) && '--tolko-svezhie' || '' }}
