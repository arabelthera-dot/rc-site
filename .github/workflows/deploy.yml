# Сборка и выкладка на GitHub Pages — официальный способ Astro (withastro/action).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Ночная пересборка (Сергей 17.10.2026, «да» на стандартную настройку): дни и RSS зависят от даты,
  # поэтому сайт собирается заново каждую ночь — 00:07 МСК (21:07 UTC), минута не круглая,
  # чтобы не стоять в общей очереди GitHub. Откат — убрать этот блок.
  schedule:
    - cron: '7 21 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Pages самого rc-site (https://arabelthera-dot.github.io/rc-site/) с 18.10.2026 — не копия сайта, а
    # переадресация каждой страницы на тот же путь https://russian-civilization.ru/ (scripts/pereadresaciya.mjs):
    # дубль для поисковиков и путаница для людей убраны. Сборка нужна только ради списка страниц.
    # Основной адрес собирает задача vykladka-site ниже. Откат — вернуть шаги checkout + withastro/action@v5.
    env:
      PUBLIC_NOINDEX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
      - run: node scripts/pereadresaciya.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Выкладка на основной адрес https://russian-civilization.ru/ (свой домен с 18.10.2026): та же сборка
  # под корень домена — в ветку site старого репозитория; cname кладёт CNAME в каждую выкладку
  # (force_orphan иначе стёр бы его и домен слетел). Старые github.io/rc-museum-preview/* GitHub
  # переадресует на домен сам. Откат домена — убрать --site/--base / и cname, вернуть
  # --base /rc-museum-preview, затем gh api -X PUT repos/arabelthera-dot/rc-museum-preview/pages -F cname=.
  # С переключения 17.10.2026 Pages старого репо смотрит на site, так что
  # эта задача и есть живой сайт; откат — Pages обратно на main (docs/otkat-pereklyucheniya.md,
  # п. 2–6). Выключатель — переменная репозитория RC_SITE_TO_PREVIEW (не '1' — задача
  # пропускается и живой сайт застывает на последней сборке).
  vykladka-site:
    needs: build
    if: vars.RC_SITE_TO_PREVIEW == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build --site https://russian-civilization.ru --base /
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.RC_MUSEUM_PREVIEW_DEPLOY_KEY }}
          external_repository: arabelthera-dot/rc-museum-preview
          publish_branch: site
          publish_dir: ./dist
          force_orphan: true
          cname: russian-civilization.ru
          commit_message: 'rc-site → site'
