# Машина отдельно от содержания (Р524, Сергей 04.11.2026, пункт А). Корень: помощники дней правили
# общую машину каждый в своей ветке дня → конфликты #795, #800, #801.
# Пять вопросов до изменения (Сергей, 28.09.2026):
# Что задевает — каждую заявку в main: одна проверка mashina-otdelno, файлы сайта не меняются.
# Что нужно — заявка правит ЛИБО данные дня (src/content/, src/data/utverzhdeno/, public/muzei/),
#   ЛИБО машину (scripts/, .github/). Оба сразу — красная «машину — отдельной заявкой».
#   Исключение — метка mashina-i-dannye, ставит только Джарвис (arabelthera-dot); агентам — нельзя.
#   public/video/registry.json — общий реестр: дописанные записи — не машина; но JSON валиден,
#   без дублей ключей, прежние записи не стёрты и не изменены (иначе — машина).
# Что будет без нужного — помощник дня чинит машину у себя в ветке, параллельные дни ловят конфликт.
# Проверка до слияния — 3 пробные заявки: только данные → зелёная, только машина → зелёная,
#   данные + машина → красная; 3 из 3 (заявка Р524-А).
# Без фильтра paths: статус нужен на каждой заявке. Переименование считается по обоим путям.
# Откат: удалить этот файл (в обязательные проверки ruleset не внесена).
name: mashina-otdelno
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: mashina-otdelno-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  mashina-otdelno:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: registry.json — валиден, без дублей, только дописан
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BAZA: ${{ github.event.pull_request.base.sha }}
          GOLOVA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REESTR=public/video/registry.json
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename' > faily.txt
          touch reestr-mashina.txt
          if ! grep -qxF "$REESTR" faily.txt; then echo "Реестр видео не тронут."; exit 0; fi
          gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$REESTR?ref=$GOLOVA" > novyy.json
          gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$REESTR?ref=$BAZA" > staryy.json 2>/dev/null || echo '{}' > staryy.json
          python3 - <<'PY'
          import json, sys
          def bez_dubley(pary):
              klyuchi = [k for k, _ in pary]
              dubli = sorted({k for k in klyuchi if klyuchi.count(k) > 1})
              if dubli:
                  raise ValueError('дубли ключей: ' + ', '.join(dubli))
              return dict(pary)
          try:
              novyy = json.load(open('novyy.json', encoding='utf-8'), object_pairs_hook=bez_dubley)
          except ValueError as e:
              print(f'::error::public/video/registry.json сломан — {e}')
              sys.exit(1)
          staryy = json.load(open('staryy.json', encoding='utf-8'))
          # дописывание = каждая прежняя запись на месте и та же; служебные updated/_ можно менять
          def tronuto(s, n, put=''):
              if isinstance(s, dict) and isinstance(n, dict):
                  out = []
                  for k, v in s.items():
                      if put == '' and k in ('updated', '_'):
                          continue
                      if k not in n:
                          out.append(f'{put}{k} — стёрто')
                      else:
                          out += tronuto(v, n[k], f'{put}{k}/' if isinstance(v, dict) else f'{put}{k}')
                  return out
              return [] if s == n else [put + ' — изменено']
          t = tronuto(staryy, novyy)
          if t:
              print('Реестр видео: прежние записи тронуты — это правка машины:')
              print('\n'.join('  ' + x for x in t[:20]))
              open('reestr-mashina.txt', 'w').write('\n'.join(t))
          else:
              print('Реестр видео: JSON валиден, дублей нет, записи только дописаны — не машина.')
          PY
      - name: mashina-otdelno — машину отдельной заявкой
        env:
          METKA: ${{ contains(github.event.pull_request.labels.*.name, 'mashina-i-dannye') }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | sort -u > vse.txt
          echo "Файлов в заявке: $(wc -l < vse.txt)"
          DANNYE='^(src/content/|src/data/utverzhdeno/|public/muzei/)'
          MASHINA='^(scripts/|\.github/)'
          grep -E "$DANNYE" vse.txt > dannye.txt || true
          grep -E "$MASHINA" vse.txt > mashina.txt || true
          if [ -s reestr-mashina.txt ]; then echo "public/video/registry.json (прежние записи тронуты)" >> mashina.txt; fi
          if [ ! -s dannye.txt ] || [ ! -s mashina.txt ]; then
            echo "Данные дня: $(wc -l < dannye.txt), машина: $(wc -l < mashina.txt) — не вместе, зелёная."
            exit 0
          fi
          echo "Данные дня:"; sed 's/^/  /' dannye.txt | head -20
          echo "Машина:"; sed 's/^/  /' mashina.txt | head -20
          if [ "$METKA" = "true" ]; then
            echo "Метка mashina-i-dannye стоит — Джарвис разрешил вместе, зелёная."
            exit 0
          fi
          echo "::error::Заявка правит и данные дня, и машину. Машину — отдельной заявкой (ветка mashina/*), день ждёт её слияния. Исключение — метка mashina-i-dannye, ставит только Джарвис (Р524)."
          exit 1
