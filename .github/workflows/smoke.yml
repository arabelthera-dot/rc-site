# Smoke-тест живого сайта (19.10.2026) — мировой стандарт (Playwright) вместо самодельного
# tools/skvoznoy-probnik.py. Ходит браузером на главную, /poisk/ и страницу музея; чужой сертификат,
# код ≠ 200, ошибка JS или битый ресурс своего домена — красный.
# Пять вопросов: задевает — ничего, только читает сайт; нужно — github.token (чтение); без нужного —
# спит; проверка — ручной пуск (workflow_dispatch работает и при выключенном расписании); откат —
# удалить файл или переменную. Выключатель расписания — переменная SMOKE_TEST (≠ '1' — спит).
# Прокси (21.10.2026): задевает — только путь браузера smoke; нужно — secrets.RF_PROXY (российский выход,
# маршрут Azure→Москва рвётся); без него — прямой путь, как раньше; проверка — ручной пуск на ветке; откат — убрать env.
name: smoke
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke
  cancel-in-progress: true
jobs:
  sait:
    if: github.event_name == 'workflow_dispatch' || vars.SMOKE_TEST == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # sparse-checkout в режиме cone берёт и файлы корня — package.json и package-lock.json:
      # @playwright/test ставится точной версией из lock-файла (npm ci), не плавающей «@1» (Р63, цепочка поставок).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: tests/smoke
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Playwright
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: smoke
        working-directory: tests/smoke
        env:
          RF_PROXY: ${{ secrets.RF_PROXY }}
        run: npx --no-install playwright test -c playwright.config.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-otchet
          path: tests/smoke/otchet
          retention-days: 7
