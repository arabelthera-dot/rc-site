# Лист приёмки и образцовые снимки (r610; поправка 3 r605, Р444). Отдельно от proverka.yml.
# 1) Заявка правит дни (src/content/dni-shablon/<музей>/ММ-ДД.yaml или src/data/full-pages/<музей>/ММ-ДД.html) —
#    верх каждой изменённой страницы на телефоне 390×844 одним листом list.png (артефакт list-priemki) и комментарий
#    в заявке со ссылкой. Браузер и сервер — как в scripts/glazami.mjs (scripts/list-priemki.mjs, scripts/dist-server.mjs).
# 2) Заявка правит шаблон дня или общие стили (список SHABLON в scripts/list-priemki.mjs) — образцовые дни
#    (tests/obrazcy/obrazcy.json) сверяются toHaveScreenshot со снимками tests/obrazcy/snimki; отличие выше порога —
#    красное, пока образец не обновлён явной командой в той же заявке: node scripts/list-priemki.mjs obnovit <прогон>
#    (берёт артефакт obrazcy-novye этого прогона) и коммит. Разница по точкам — артефакт obrazcy-raznica.
# Запускается после каждой проверки заявки: без дней и без шаблона — зелёное за полминуты.
# Сборка одна (Р737 п.8, 10.11.2026): сайт здесь больше не собирается второй раз параллельно с proverka.yml — лист
# запускается по workflow_run, когда proverka закончилась, и берёт её артефакт dist (actions/download-artifact с run-id;
# GitHub Docs «Storing workflow data as artifacts»). Код заявки с ключом на комментарий — только из этого же репо
# (GitHub Security Lab, «Preventing pwn requests»). Итог виден в заявке статусом list-priemki на её коммите.
# Ручной запуск — с номером прогона proverka. Откат — вернуть pull_request и шаги npm run build из истории git.
name: list-priemki
on:
  workflow_run:
    workflows: [proverka]
    types: [completed]
  workflow_dispatch:
    inputs:
      progon:
        description: 'Номер прогона proverka (gh run list -w proverka.yml), из которого взять dist'
        required: true
permissions:
  contents: read
concurrency:
  group: list-priemki-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true
jobs:
  list-priemki:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion != 'cancelled' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROGON: ${{ github.event.workflow_run.id || inputs.progon }}
    steps:
      - name: прогон proverka — коммит и заявка
        id: progon
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROGON" -q .head_sha)
          vetka=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROGON" -q .head_branch)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROGON" -q '.pull_requests[0].number // empty')
          if [ -z "$n" ]; then n=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$vetka" --json number -q '.[0].number'); fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "Прогон proverka $PROGON, коммит $sha, заявка ${n:-нет}"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=pending -f context=list-priemki \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      # Вся история: дни заявки — из git diff origin/main...HEAD; blob:none — без лишних файлов.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.progon.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: что правит заявка
        id: chto
        run: |
          git fetch -q origin main
          dni=$(node --input-type=module -e "import('./scripts/list-priemki.mjs').then(m => console.log(m.izmenennyeDni().join(',')))")
          echo "dni=$dni" >> "$GITHUB_OUTPUT"
          if node scripts/list-priemki.mjs shablon; then echo "shablon=" >> "$GITHUB_OUTPUT"; else echo "shablon=1" >> "$GITHUB_OUTPUT"; fi
          echo "Дни: ${dni:-нет}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        with:
          node-version: 22
          cache: npm
      - if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        run: npm ci
      # dist — из прогона proverka (задание sborka), не собирается заново.
      - if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: /tmp
          run-id: ${{ env.PROGON }}
          github-token: ${{ github.token }}
      - if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        run: tar -xf /tmp/dist.tar && rm /tmp/dist.tar
      # Браузер — тем же кэшем, что в proverka.yml (ключ по версии playwright).
      - name: браузер — версия
        id: pw
        if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        run: echo "versiya=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: браузер из кэша
        id: pw-kesh
        if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versiya }}-chromium
      - name: браузер
        if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        timeout-minutes: 10
        run: |
          # Системные пакеты — один раз и без timeout: убитый timeout'ом npx
          # оставлял живой apt-get с замком dpkg, и попытки 2 и 3 падали сразу.
          npx --no-install playwright install-deps chromium || exit 1
          for i in 1 2 3; do
            timeout 180 npx --no-install playwright install chromium && exit 0
            echo "::warning::playwright install: попытка $i не удалась"
          done
          exit 1
      - name: лист приёмки
        id: list
        if: steps.chto.outputs.dni != ''
        run: node scripts/list-priemki.mjs --dist dist --out /tmp/list-priemki --dni "${{ steps.chto.outputs.dni }}"
      - name: лист — артефакт
        id: list-art
        if: always() && steps.chto.outputs.dni != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: /tmp/list-priemki/list.png
          archive: false
          if-no-files-found: ignore
      - name: лист — комментарий в заявке
        if: always() && steps.chto.outputs.dni != '' && steps.progon.outputs.n != ''
        env:
          N: ${{ steps.progon.outputs.n }}
          SHA: ${{ steps.progon.outputs.sha }}
          URL: ${{ steps.list-art.outputs.artifact-url }}
        run: |
          itog=$(head -1 /tmp/list-priemki/itog.txt 2>/dev/null || echo "Лист приёмки не собран — см. лог.")
          telo="<!-- list-priemki -->
          **$itog** Верх страницы на телефоне 390×844, коммит ${SHA::7}.
          Лист: ${URL:-нет} · прогон: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" --paginate -q '.[] | select(.body | startswith("<!-- list-priemki -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$telo" >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="$telo" >/dev/null; fi
      - name: образцовые дни — сверка снимков
        id: obrazcy
        if: always() && steps.chto.outputs.shablon != '' && steps.pw.outcome == 'success'
        run: |
          npx playwright test -c tests/obrazcy && exit 0
          npx playwright test -c tests/obrazcy --update-snapshots >/dev/null 2>&1 || true
          mkdir -p /tmp/obrazcy-novye && cp tests/obrazcy/snimki/*.png /tmp/obrazcy-novye/
          echo "::error::Образцовый день отличается от снимка больше порога. Если так и задумано — обновить образец этой командой и закоммитить в этой же заявке: node scripts/list-priemki.mjs obnovit $GITHUB_RUN_ID"
          echo "Образец отличается — разница: артефакт obrazcy-raznica; обновить: \`node scripts/list-priemki.mjs obnovit $GITHUB_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.obrazcy.outcome == 'failure'
        with:
          name: obrazcy-novye
          path: /tmp/obrazcy-novye
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.obrazcy.outcome == 'failure'
        with:
          name: obrazcy-raznica
          path: /tmp/obrazcy-rezultat
          if-no-files-found: ignore
      # Итог — статусом на коммите заявки: прогон по workflow_run в проверки заявки сам не попадает.
      - name: итог — статус list-priemki в заявке
        if: always() && steps.progon.outputs.sha != ''
        env:
          SHA: ${{ steps.progon.outputs.sha }}
          ITOG: ${{ job.status }}
        run: |
          state=$([ "$ITOG" = success ] && echo success || echo failure)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context=list-priemki \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
