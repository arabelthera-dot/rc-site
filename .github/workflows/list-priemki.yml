# Лист приёмки и образцовые снимки (r610; поправка 3 r605, Р444). Отдельно от proverka.yml.
# 1) Заявка правит дни (src/content/dni-shablon/<музей>/ММ-ДД.yaml или src/data/full-pages/<музей>/ММ-ДД.html) —
#    верх каждой изменённой страницы на телефоне 390×844 одним листом list.png (артефакт list-priemki) и комментарий
#    в заявке со ссылкой. Браузер и сервер — как в scripts/glazami.mjs (scripts/list-priemki.mjs, scripts/dist-server.mjs).
# 2) Заявка правит шаблон дня или общие стили (список SHABLON в scripts/list-priemki.mjs) — образцовые дни
#    (tests/obrazcy/obrazcy.json) сверяются toHaveScreenshot со снимками tests/obrazcy/snimki; отличие выше порога —
#    красное, пока образец не обновлён явной командой в той же заявке: node scripts/list-priemki.mjs obnovit <прогон>
#    (берёт артефакт obrazcy-novye этого прогона) и коммит. Разница по точкам — артефакт obrazcy-raznica.
# Запускается на каждой заявке: без дней и без шаблона — зелёное за полминуты (можно ставить обязательной проверкой).
# Откат — удалить этот файл.
name: list-priemki
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: list-priemki-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  list-priemki:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Вся история: сборка берёт даты из git log карточек (как в proverka.yml); blob:none — без лишних файлов.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: что правит заявка
        id: chto
        run: |
          git fetch -q origin main
          dni=$(node --input-type=module -e "import('./scripts/list-priemki.mjs').then(m => console.log(m.izmenennyeDni().join(',')))")
          echo "dni=$dni" >> "$GITHUB_OUTPUT"
          if node scripts/list-priemki.mjs shablon; then echo "shablon=" >> "$GITHUB_OUTPUT"; else echo "shablon=1" >> "$GITHUB_OUTPUT"; fi
          echo "Дни: ${dni:-нет}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        with:
          node-version: 22
          cache: npm
      - if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        run: npm ci
      - if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        run: npm run build
      # Браузер — тем же кэшем, что в proverka.yml (ключ по версии playwright).
      - name: браузер — версия
        id: pw
        if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        run: echo "versiya=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: браузер из кэша
        id: pw-kesh
        if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versiya }}-chromium
      - name: браузер
        if: steps.chto.outputs.dni != '' || steps.chto.outputs.shablon != ''
        timeout-minutes: 10
        run: |
          # Системные пакеты — один раз и без timeout: убитый timeout'ом npx
          # оставлял живой apt-get с замком dpkg, и попытки 2 и 3 падали сразу.
          npx --no-install playwright install-deps chromium || exit 1
          for i in 1 2 3; do
            timeout 180 npx --no-install playwright install chromium && exit 0
            echo "::warning::playwright install: попытка $i не удалась"
          done
          exit 1
      - name: лист приёмки
        id: list
        if: steps.chto.outputs.dni != ''
        run: node scripts/list-priemki.mjs --dist dist --out /tmp/list-priemki --dni "${{ steps.chto.outputs.dni }}"
      - name: лист — артефакт
        id: list-art
        if: always() && steps.chto.outputs.dni != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: /tmp/list-priemki/list.png
          archive: false
          if-no-files-found: ignore
      - name: лист — комментарий в заявке
        if: always() && steps.chto.outputs.dni != '' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          URL: ${{ steps.list-art.outputs.artifact-url }}
        run: |
          itog=$(head -1 /tmp/list-priemki/itog.txt 2>/dev/null || echo "Лист приёмки не собран — см. лог.")
          telo="<!-- list-priemki -->
          **$itog** Верх страницы на телефоне 390×844, коммит ${GITHUB_SHA::7}.
          Лист: ${URL:-нет} · прогон: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" --paginate -q '.[] | select(.body | startswith("<!-- list-priemki -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$telo" >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="$telo" >/dev/null; fi
      - name: образцовые дни — сверка снимков
        id: obrazcy
        if: always() && steps.chto.outputs.shablon != '' && steps.pw.outcome == 'success'
        run: |
          npx playwright test -c tests/obrazcy && exit 0
          npx playwright test -c tests/obrazcy --update-snapshots >/dev/null 2>&1 || true
          mkdir -p /tmp/obrazcy-novye && cp tests/obrazcy/snimki/*.png /tmp/obrazcy-novye/
          echo "::error::Образцовый день отличается от снимка больше порога. Если так и задумано — обновить образец этой командой и закоммитить в этой же заявке: node scripts/list-priemki.mjs obnovit $GITHUB_RUN_ID"
          echo "Образец отличается — разница: артефакт obrazcy-raznica; обновить: \`node scripts/list-priemki.mjs obnovit $GITHUB_RUN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.obrazcy.outcome == 'failure'
        with:
          name: obrazcy-novye
          path: /tmp/obrazcy-novye
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.obrazcy.outcome == 'failure'
        with:
          name: obrazcy-raznica
          path: /tmp/obrazcy-rezultat
          if-no-files-found: ignore
