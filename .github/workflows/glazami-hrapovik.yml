# Храповик эталона «глазами посетителя» (Сергей 17.10.2026: «не заплатками, ручками — системно, автоматически»).
# После каждого слияния в main машина мерит сборку; если хоть один пункт стал лучше эталона —
# сама открывает заявку с понижённым scripts/glazami-porog.json и ставит автослияние.
# Повышать эталон нельзя: --zapisat берёт минимум из старого и нового (ratchet, как betterer/eslint-baseline).
# Заявка бота получает pull_request-проверку «ждёт одобрения» (политика first_time_contributors), а ручной
# пуск proverka к заявке не прикрепляется (замер 17.10, #52) — храповик сам одобряет свою ждущую проверку.
# Выключатель — переменная GLAZAMI_HRAPOVIK (≠ '1' — спит). Откат — удалить этот файл.
#
# Все дни с телефона (r486, Р384: «машина смотрит глазами посетителя вместо Сергея»): тем же заданием после выборки
# `glazami.mjs --dni vse` открывает ВСЕ страницы дней всех музеев на 390×844 и меряет каждую: экран блока фактов,
# открывается ли лупа, кадры без лупы, ширина, битые картинки, ошибки консоли, плашки >10% экрана. Артефакт
# glazami-dni — dni.tsv «день → цифры» и dni-svodka.md (недостаток на 2+ днях одного музея — «чинить в шаблоне»).
# Храповик — раздел «dni» в scripts/glazami-porog.json: стало хуже — задание красное; лучше — эталон понижается той же заявкой.
# Пять вопросов: задевает — только это задание и раздел «dni» эталона, сайт не меняет; нужно — GLAZAMI_HRAPOVIK=1;
# без нужного — после слияний спит, как и выборка; проверка — ручной пуск с любой ветки
# (gh workflow run glazami-hrapovik.yml --ref <ветка>): мерит и краснеет, если хуже, эталон не пишет, заявки нет; откат — убрать два шага «все дни».
#
# Задание reestry (Е1, Сергей 20.10.2026, Р47) — тот же храповик-заявка для снимков реестров Минюста: по понедельникам
# в 6:20 МСК `node scripts/prava.mjs --reestry` обновляет data/reestry/*.json, есть разница — заявка с автослиянием;
# её сборка сверяет сайт с новым снимком (src/integrations/zakon.mjs) — новое имя из реестра в тексте роняет заявку.
# Пять вопросов: задевает — только data/reestry/ (кроме isklyucheniya/osnovaniya); нужно — secrets.RF_PROXY
# (socks5h://…, российский выход: minjust.gov.ru из-за рубежа отвечает нестабильно) — даёт Михаил; без нужного —
# пробует напрямую, не вышло — предупреждение, работа зелёная, снимок прежний (сборка предупреждает, если он старше
# 14 дней); проверка — ручной пуск; откат — убрать задание reestry.
name: glazami-hrapovik
on:
  push:
    branches: [main]
    paths-ignore: ['scripts/glazami-porog.json']
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:
# Права — на уровне задания (Р63): верх — только чтение; запись — задаче hrapovik и только на main.
permissions:
  contents: read
concurrency:
  group: glazami-hrapovik-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  hrapovik:
    # после слияния — только при GLAZAMI_HRAPOVIK=1; ручной пуск — всегда и с любой ветки (проба),
    # эталон пишется и заявка открывается только на main при включённом выключателе
    if: (github.event_name == 'push' && vars.GLAZAMI_HRAPOVIK == '1') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    timeout-minutes: 75
    env:
      VETKA: avto/glazami-porog
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: node scripts/glazami.mjs --dist dist --porog scripts/glazami-porog.json ${{ github.ref == 'refs/heads/main' && vars.GLAZAMI_HRAPOVIK == '1' && '--zapisat' || '' }}
      - name: все дни с телефона
        if: success() || failure()
        run: node scripts/glazami.mjs https://russian-civilization.ru/ /tmp/glazami-dni --dist dist --dni vse --potokov 6 --porog scripts/glazami-porog.json ${{ github.ref == 'refs/heads/main' && vars.GLAZAMI_HRAPOVIK == '1' && '--zapisat' || '' }}
      - name: все дни — таблица
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glazami-dni
          path: |
            /tmp/glazami-dni/dni.tsv
            /tmp/glazami-dni/dni-svodka.md
            /tmp/glazami-dni/dni-syroe.json
            /tmp/glazami-dni/dni-itog.json
          retention-days: 30
      - name: заявка с понижённым эталоном
        if: github.ref == 'refs/heads/main' && vars.GLAZAMI_HRAPOVIK == '1'
        run: |
          git diff --quiet -- scripts/glazami-porog.json && { echo "Эталон не изменился — заявки нет."; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$VETKA"
          git commit -m "[avto] glazami: эталон понижен по замеру ${GITHUB_SHA::7}" -- scripts/glazami-porog.json
          git push -f origin "$VETKA"
          telo="Машина замерила main ${GITHUB_SHA::7}: часть пунктов стала лучше — эталон понижен (повысить его нельзя).
          $(git diff HEAD~1 -U0 -- scripts/glazami-porog.json | grep '^[-+] ' || true)"
          nomer=$(gh pr list --head "$VETKA" --state open --json number -q '.[0].number')
          [ -n "$nomer" ] || nomer=$(gh pr create --head "$VETKA" --base main \
            --title "[avto] glazami: эталон понижен" --body "$telo" | grep -o '[0-9]*$')
          gh pr merge "$nomer" --auto --squash
          sha=$(git rev-parse HEAD)
          zapros="repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request"
          for i in $(seq 1 12); do
            vsego=$(gh api "$zapros" -q '.total_count')
            zhdut=$(gh api "$zapros" -q '.workflow_runs[] | select(.conclusion=="action_required") | .id')
            for id in $zhdut; do gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; done
            [ "${vsego:-0}" -gt 0 ] && [ -z "$zhdut" ] && { echo "Проверка заявки #$nomer идёт."; exit 0; }
            sleep 10
          done
          echo "::warning::проверка заявки #$nomer не запустилась за 2 мин"
  reestry:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      VETKA: avto/reestry
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: снимки реестров Минюста
        env:
          RF_PROXY: ${{ secrets.RF_PROXY }}
        run: node scripts/prava.mjs --reestry || echo "::warning::реестры Минюста обновились не все — снимок прежний (нужен секрет RF_PROXY?)"
      - name: заявка с новым снимком
        run: |
          git diff --quiet -- data/reestry && { echo "Снимки не изменились — заявки нет."; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$VETKA"
          git commit -m "[avto] reestry: снимок реестров Минюста $(date -u +%F)" -- data/reestry
          git push -f origin "$VETKA"
          nomer=$(gh pr list --head "$VETKA" --state open --json number -q '.[0].number')
          [ -n "$nomer" ] || nomer=$(gh pr create --head "$VETKA" --base main \
            --title "[avto] reestry: снимок реестров Минюста" \
            --body "Еженедельное обновление data/reestry (Е1). Сборка заявки сверяет сайт с новым снимком: красная — в тексте имя из реестра, строка в логе сборки." | grep -o '[0-9]*$')
          gh pr merge "$nomer" --auto --squash
          sha=$(git rev-parse HEAD)
          zapros="repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=pull_request"
          for i in $(seq 1 12); do
            zhdut=$(gh api "$zapros" -q '.workflow_runs[] | select(.conclusion=="action_required") | .id')
            for id in $zhdut; do gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; done
            [ "$(gh api "$zapros" -q '.total_count')" -gt 0 ] && [ -z "$zhdut" ] && exit 0
            sleep 10
          done
          echo "::warning::проверка заявки #$nomer не запустилась за 2 мин"
