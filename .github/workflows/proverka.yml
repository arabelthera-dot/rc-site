# Единственная проверка заявки (план переезда, шаг 5): сборка + битые внутренние ссылки, порог 0.
# Внешние ссылки здесь не проверяются: чужие сайты (особенно российские из-за рубежа) отвечают
# нестабильно, и заявка краснела бы не по своей вине.
name: proverka
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sborka-i-ssylki:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Вся история git: «Проверено» и журнал исправлений дня берутся из git log карточки (Е5, src/lib/redakciya.mjs);
      # мелкий клон в CI роняет сборку, а не показывает всем дням одну дату.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # «Сегодня» — по Москве во всех блоках (B11, 19.10.2026): home/Today.astro и portal/Segodnya.astro
      # дают один день под TZ Лос-Анджелеса/Москвы/Владивостока. Без сборки, секунды.
      # Строгая с 20.10.2026 (Р52: на main 0 расхождений). Выключатель — переменная SEGODNYA_MSK_STROGO=0.
      - name: segodnya-msk — один день по Москве
        continue-on-error: ${{ vars.SEGODNYA_MSK_STROGO == '0' }}
        timeout-minutes: 1
        run: node scripts/segodnya-msk.test.mjs && node scripts/segodnya-msk.mjs
      # Пост 9:00 в каналы (Е8, Р47, 20.10.2026): заведомый брак (имя из реестра Минюста, второе предложение в хуке,
      # обрезанное имя музея, битая ссылка, ссылка не на сайт, день 16+, картинка не с сайта) отклонён, нормальный пост
      # проходит — теми же функциями, что у сборки (src/lib/proverka-posta.mjs). Без сети и без отправки, секунды.
      - name: kanaly — пробы проверки поста
        timeout-minutes: 2
        run: node scripts/kanaly/proverka.test.mjs
      # Г20: проверочная сборка включает арабскую пробу /ar/ (RC_PROBA_RTL=1) — её ссылки, разметка и вид проверяются
      # в каждой заявке. На живой сайт проба не попадает: deploy.yml собирает без этой переменной.
      - run: npm run build
        env:
          RC_POISK: ${{ vars.RC_POISK }}
          PUBLIC_PODDERZHKA: ${{ vars.PUBLIC_PODDERZHKA }}
          RC_PROBA_RTL: '1'
      # Г20: страница-проба с её стилями — артефактом заявки (≈5 МБ, 3 дня), чтобы смотреть письмо справа налево
      # глазами без полной локальной сборки: gh run download <run> -n proba-rtl.
      - uses: actions/upload-artifact@v4
        with:
          name: proba-rtl
          path: |
            dist/ar
            dist/assets
            dist/_astro
          retention-days: 3
      # «Поддержать проект» выключен до работающего приёма денег (Р31, 20.10.2026): в сборке не должно быть
      # ни текста «Поддержать проект», ни движка museum-support.js. Включение — переменная PUBLIC_PODDERZHKA=1.
      - name: podderzhka — блок поддержки выключен
        env:
          PUBLIC_PODDERZHKA: ${{ vars.PUBLIC_PODDERZHKA }}
        run: node scripts/podderzhka.test.mjs && node scripts/podderzhka.mjs dist
      # Внешние хосты (Е4, Р38, 20.10.2026): всё, что браузер посетителя грузит сам (скрипты, стили, шрифты,
      # картинки, iframe, fetch), — со своего домена, Яндекса, VK Видео или Rutube. Новый чужой хост — заявка
      # красная, список в отчёте. Строгая сразу (решение Сергея Р49); откат — удалить этот шаг.
      - name: vneshnie-hosty — ни одного запроса за рубеж
        run: node scripts/vneshnie-hosty.mjs --dist dist
      # Сайт живёт от корня домена — корень проверки и есть сборка.
      - run: ln -s "$PWD/dist" /tmp/root
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --index-files index.html --root-dir /tmp/root '/tmp/root/**/*.html'
          fail: true
          jobSummary: true
      # Подгрузки из движков (18.10.2026): lychee не видит import()/from в js — пропавший файл
      # 3D или библиотеки ловит scripts/js-import.mjs. Строгая с 20.10.2026 (Р52: на main пропавших 0).
      # Выключатель — переменная JSIMPORT_STROGO=0.
      - name: js-import — подгрузки движков
        continue-on-error: ${{ vars.JSIMPORT_STROGO == '0' }}
        run: node scripts/js-import.mjs dist
      # Ленивые адреса data-src/data-poster (20.10.2026): lychee их не видит — 18 «битых» аудио/видео/картинок
      # на полных страницах дней ловит scripts/data-src.mjs. Строгий с 20.10.2026: прогон показал 0 битых из 18.
      - name: data-src — ленивые аудио, видео, картинки
        run: node scripts/data-src.mjs --dist dist
      # Замок веса (18.10.2026): лимит хостинга 1 ГБ, порог 950 МБ. Строгий с 20.10.2026 (Р52: на main
      # 932.4 МБ — запас 17.6 МБ). Выключатель — переменная VES_STROGO=0.
      - name: ves — вес сборки
        continue-on-error: ${{ vars.VES_STROGO == '0' }}
        run: node scripts/ves.mjs --dist dist --porog 950 --rolik 12
      # Карточка пересылки (Б9/Б10, 20.10.2026): og:image меньше 600×315 Telegram/ВК показывают крошкой —
      # сборка ставит запасную (og-den), проверка считает остаток (должно быть 0); у каждой страницы дня
      # есть og:image (файл в dist) и twitter:card. Строгая с 20.10.2026 (задача E: обход живого сайта —
      # 4331 из 4332 дней в порядке, последний — временный 503). Выключатель — OGRAZMER_STROGO=0.
      - name: og-razmer — карточка пересылки у каждого дня
        continue-on-error: ${{ vars.OGRAZMER_STROGO == '0' }}
        run: node scripts/og-razmer.mjs dist
      # Сторож «глазами посетителя» (Сергей 17.10.2026): заявка, которая делает сайт хуже достигнутого,
      # краснеет. Мерка — эталон scripts/glazami-porog.json (понижать можно, повышать нельзя).
      # Строгость включается переменной репозитория GLAZAMI_STROGO=1; без неё — только предупреждение.
      - name: glazami — браузер
        continue-on-error: ${{ vars.GLAZAMI_STROGO != '1' }}
        timeout-minutes: 4
        run: npm i --no-save --no-audit --no-fund playwright@1.48.0 && npx playwright install --with-deps chromium
      - name: glazami — замер против эталона
        continue-on-error: ${{ vars.GLAZAMI_STROGO != '1' }}
        timeout-minutes: 5
        env:
          PUBLIC_PODDERZHKA: ${{ vars.PUBLIC_PODDERZHKA }}
        run: node scripts/glazami.mjs --dist dist --porog scripts/glazami-porog.json
      # Сторож «Найти день по дате» (18.10.2026): список дней на главной не задваивается при медленной сети.
      # Строгая с 19.10.2026 (на main зелёно, подложенный задвоенный список — красно): заявка краснеет.
      # Выключатель — переменная репозитория PODATE_STROGO=0 (вернуть мягкость без отката кода).
      - name: po-date — список дней не задвоен
        continue-on-error: ${{ vars.PODATE_STROGO == '0' }}
        timeout-minutes: 3
        run: node scripts/po-date.mjs --dist dist
      # Сверка текста старый/новый сайт (план переезда, шаг 4; 19.10.2026): по дням с legacy_page —
      # дата, название, хук, источник 1:1. Старый сайт клонируется с main rc-museum-preview (публичный).
      # Новое — выключенным: строгость переменной репозитория SVERKA_STROGO=1.
      - name: sverka-teksta — текст старого и нового сайта 1:1
        continue-on-error: ${{ vars.SVERKA_STROGO != '1' }}
        timeout-minutes: 6
        run: |
          # без --depth: нужна история всех веток (git log --all), blob:none — без содержимого старых версий
          git clone -q --filter=blob:none https://github.com/arabelthera-dot/rc-museum-preview /tmp/stary
          node scripts/sverka-teksta.mjs --dist dist --legacy /tmp/stary --vse
      # Три правила старого сайта, потерянные при переезде (Сергей 19.10.2026: вернуть, стандарт №4):
      # «Консультанты музея» без слова «научный», метка ЖДУ ОТВЕТА, счёт из 100. Логика — из старого
      # аудитора как есть. Новое — выключенным: строгость переменной репозитория STAROE_STROGO=1.
      - name: staroe-pravilo — консультанты, ЖДУ ОТВЕТА, счёт из 100
        continue-on-error: ${{ vars.STAROE_STROGO != '1' }}
        timeout-minutes: 3
        run: python3 scripts/staroe-pravilo.py --dist dist
      # Полнота переадресаций (план переезда, шаг 4; 19.10.2026): каждый публичный адрес старого сайта
      # из scripts/legacy-paths.txt есть в сборке — страницей или переадресацией; иначе список и код 1.
      # Строгая с 20.10.2026 (Р52: на main 221 из 221). Выключатель — переменная REDIR_STROGO=0.
      - name: polnota — старые адреса не умирают
        continue-on-error: ${{ vars.REDIR_STROGO == '0' }}
        timeout-minutes: 2
        run: node scripts/polnota.mjs --dist dist
      # Сверка карточки дня и полной страницы (19.10.2026): title карточки против <title>/<h1> страницы
      # src/data/full-pages — общее значимое слово или дата дня (логика pageMatches импорта). Коммит 81b9dff
      # сдвинул страницы «Не сдаются» на соседний день, и никто не поймал. Строгая с 20.10.2026
      # (Р52: на main расхождений 0). Выключатель — переменная SVERKA_H1_STROGO=0.
      - name: sverka-h1 — страница дня про этот день
        continue-on-error: ${{ vars.SVERKA_H1_STROGO == '0' }}
        timeout-minutes: 1
        env:
          SVERKA_H1_STROGO: '1'
        run: node scripts/sverka-h1.mjs
      # Подписи кадров (план сайта Д2, 20.10.2026): красное — кадр карточки дня без подписи. Полные
      # страницы и жёлтое «подпись неполная» — только отчёт (чинят хозяева страниц). Строгая с 20.10.2026
      # (Р52: красных в карточках 0 на main). Выключатель — переменная PODPISI_STROGO=0.
      - name: podpisi — у каждого кадра есть подпись
        continue-on-error: ${{ vars.PODPISI_STROGO == '0' }}
        timeout-minutes: 1
        run: npm run proverka-podpisey
      # Отчёт о скорости и доступности (18.10.2026): Lighthouse CI + axe-core по 4 страницам
      # (главная, музей izobreteniya, его календарь, день 01-05). ТОЛЬКО ОТЧЁТ — заявку роняют лишь
      # сборка и битые ссылки (Сергей 17.10): continue-on-error, в lighthouserc только "warn".
      # Бюджет веса главной (18.10): total-byte-weight ≤ 500 000 байт — предупреждение (assertMatrix), не роняет.
      - name: skorost — Lighthouse CI
        continue-on-error: true
        timeout-minutes: 4
        run: npx -y @lhci/cli@0.14.0 autorun --config=lighthouserc.json
      - name: skorost — axe и сводка
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: npm i --no-save --no-audit --no-fund playwright@1.48.0 @axe-core/playwright@4.10.1 && node scripts/otchet-skorost.mjs --dist dist --lhci /tmp/lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glazami
          path: /tmp/glazami
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: /tmp/lhci
          if-no-files-found: ignore
  # Таблица = запись (план ядра, шаг 2; 19.10.2026): утверждённые таблицы года лежат в data/tablicy/
  # рядом с записями — без ключей и чужих хранилищ. Разборщик переписывает хуки записей по старшей
  # версии таблицы; если src/content/days после этого изменился — заявка правит запись мимо таблицы,
  # заявка красная, список дней в отчёте. Откат — удалить это задание.
  tablicy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: таблица = запись
        run: |
          node scripts/tablicy/razbor.mjs --zapis
          if ! git diff --quiet -- src/content/days; then
            echo "::error::записи расходятся с утверждёнными таблицами (data/tablicy/) — правка записи мимо таблицы:"
            git diff --stat -- src/content/days | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node scripts/tablicy/razbor.mjs --sverka | tee -a "$GITHUB_STEP_SUMMARY"
