# Проверка заявки — только база (Р627, Сергей 08.11.2026: «Да, действую.» на план «под ноль — контроль»).
# Остаются пять групп, как на любом сайте: сборка (и битые внутренние ссылки в ней), страницы без ошибок JS,
# старые адреса живы, картинки на месте, безопасность. Смысл текста машина не судит — день принимается
# чтением целиком против утверждённого (Р627 п. 4). Новая проверка — только со словом Сергея (Р627 п. 3).
# Снятые проверки удалены (Р737, 10.11.2026); прежний вид — proverka-do-r627.yml в истории git (git log --all -- .github/workflows-arhiv).
name: proverka
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Новый пуш в заявку отменяет её прежний прогон (Р568, 06.11.2026): старые прогоны держали исполнители —
# #883 и #885 стояли 23+ мин. Как в мире — GitHub Docs «Using concurrency», cancel-in-progress; на main не отменяем.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  # Фильтр заявки (Р737 п.7б, 10.11.2026): заявка, которая трогает только машины и документы, полную сборку не ждёт.
  # paths-ignore нельзя — sborka-i-ssylki обязательна в защите main, и заявка повисла бы «ожидает»; поэтому задания
  # сборки пропускаются, а итог sborka-i-ssylki зелёный (GitHub Docs «Handling skipped but required checks»).
  # Без сборки — только scripts/, tools/, docs/, .github/ (кроме этого файла) и *.md вне src/; скрипт, который зовут
  # сборка или эта проверка (package.json, astro.config.mjs, src/, proverka.yml), и то, что он подключает, — со сборкой.
  # Ручной запуск и заявка больше 3000 файлов — всегда со сборкой. Откат — убрать задание filtr и строки needs/if с ним.
  filtr:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sborka: ${{ steps.f.outputs.sborka }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            package.json
            astro.config.mjs
            src
            scripts
            .github
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "sborka=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$N/files" --paginate -q '.[].filename' > /tmp/fajly.txt
          vsego=$(wc -l < /tmp/fajly.txt)
          # Скрипты сборки и проверки: названные в package.json, astro.config.mjs, src/, proverka.yml, и всё, что они
          # подключают относительным импортом (./ и ../, до неподвижной точки).
          grep -rhoE 'scripts/[A-Za-z0-9_./-]+\.(mjs|cjs|js|py|sh)' package.json astro.config.mjs src .github/workflows/proverka.yml \
            | sort -u > /tmp/nuzhnye.txt
          while :; do
            for f in $(cat /tmp/nuzhnye.txt); do
              if [ -f "$f" ]; then
                grep -hoE "(from|import\() *'\.\.?/[^']+'" "$f" | grep -oE "\.\.?/[^']+" \
                  | while read -r i; do realpath -m --relative-to=. "$(dirname "$f")/$i"; done || true
              fi
            done | cat - /tmp/nuzhnye.txt | sort -u > /tmp/nuzhnye2.txt
            if cmp -s /tmp/nuzhnye.txt /tmp/nuzhnye2.txt; then break; fi
            mv /tmp/nuzhnye2.txt /tmp/nuzhnye.txt
          done
          sborka=false
          if [ "$vsego" -ge 3000 ]; then sborka=true; fi
          while IFS= read -r f; do
            case "$f" in
              .github/workflows/proverka.yml) sborka=true ;;
              scripts/*) if grep -qxF "$f" /tmp/nuzhnye.txt; then sborka=true; fi ;;
              tools/*|docs/*|.github/*) ;;
              src/*) sborka=true ;;
              *.md) ;;
              *) sborka=true ;;
            esac
            if [ "$sborka" = true ]; then echo "со сборкой: $f"; break; fi
          done < /tmp/fajly.txt
          echo "Файлов в заявке: $vsego; полная сборка: $sborka" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sborka=$sborka" >> "$GITHUB_OUTPUT"
  bez-sborki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Сторож ссылок и опасного JS (разбор безопасности 20.10.2026, п. 1-2): каждый внешний домен в днях, полных
      # страницах, шаблонах и движках — из data/razreshennye-domeny.txt (206 с main); eval/new Function/atob/
      # document.write/location= на чужой адрес/склейка 'ht'+'tps' — запрещены. На main 0 нарушений — строгий сразу.
      # Откат — удалить этот шаг.
      - name: storozh-ssylok — разрешённые домены и опасный JS
        timeout-minutes: 2
        run: node scripts/storozh-ssylok.mjs
      # Опись HTML-вставок (OWASP DOM XSS, 20.10.2026): innerHTML/outerHTML/insertAdjacentHTML/document.write
      # с данными из адреса, localStorage, fetch или ввода (класс «в») — только сверх базы
      # scripts/innerhtml-isklyucheniya.txt. На main 0 таких мест. Откат — удалить этот шаг.
      - name: innerhtml-opis — новые небезопасные вставки HTML
        timeout-minutes: 1
        run: node scripts/innerhtml-opis.mjs
      # Ключи и пароли в коммитах заявки (п.502 плана, Р745, 10.11.2026): gitleaks — только коммиты сверх main.
      # Как в мире — https://github.com/gitleaks/gitleaks#docker. Откат — удалить этот шаг.
      - name: gitleaks — ключей в коммитах заявки нет
        timeout-minutes: 3
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --log-opts="origin/main..HEAD"
  sborka:
    needs: filtr
    if: needs.filtr.outputs.sborka == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Вся история git: «Проверено» и журнал исправлений дня берутся из git log карточки (Е5, src/lib/redakciya.mjs);
      # мелкий клон в CI роняет сборку, а не показывает всем дням одну дату.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Кэш сборки (Р737 п.7а): кадры пересылки rc-og-den (4220 карточек — ~2 мин заново), картинки rc-kartinki,
      # плитки лупы rc-dz и кэш Astro. Все ключуются хешем содержимого внутри, так что чужой кэш не портит сборку,
      # только экономит. Восстановление — после npm ci (он стирает node_modules). Заявка берёт кэш main (deploy.yml
      # кладёт тот же путь и ключ). Как в мире — docs.github.com «Caching dependencies». Откат — удалить шаг.
      - name: кэш сборки — og, картинки, лупа, Astro
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            node_modules/.astro
            node_modules/.cache/rc-og-den
            node_modules/.cache/rc-kartinki
            node_modules/.cache/rc-dz
          key: rc-sborka-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            rc-sborka-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            rc-sborka-${{ runner.os }}-
      # Г20: проверочная сборка включает арабскую пробу /ar/ (RC_PROBA_RTL=1) — её ссылки, разметка и вид проверяются
      # в каждой заявке. На живой сайт проба не попадает: deploy.yml собирает без этой переменной.
      - run: npm run build
        env:
          RC_POISK: ${{ vars.RC_POISK }}
          PUBLIC_PODDERZHKA: ${{ vars.PUBLIC_PODDERZHKA }}
          PUBLIC_CSP: ${{ vars.PUBLIC_CSP }}
          PUBLIC_POCHTA: ${{ vars.PUBLIC_POCHTA }}
          PUBLIC_POCHTA_FORMA: ${{ vars.PUBLIC_POCHTA_FORMA }}
          PUBLIC_POCHTA_SPISOK: ${{ vars.PUBLIC_POCHTA_SPISOK }}
          RC_PROBA_RTL: '1'
          # п.497 (Р745): проверочная сборка — со страницами /god/, /vek/ и фильтрами поиска; живой сайт (deploy.yml) — без.
          PUBLIC_VREMYA: '1'
      # Р531, аудит п.15: сборка не оставляет грязной копии — всё, что она пишет, либо в dist, либо в .gitignore.
      # Новый сгенерированный файл в git → красный здесь, а не тихий шум в чужих заявках.
      - name: сборка не оставила грязной копии
        run: |
          gryaz=$(git status --porcelain)
          if [ -n "$gryaz" ]; then
            echo "$gryaz"
            echo "::error::сборка оставила грязную копию: сгенерированный файл — в .gitignore или в dist, не в git (Р531)"
            exit 1
          fi
      # Г20: страница-проба с её стилями — артефактом заявки (≈5 МБ, 3 дня), чтобы смотреть письмо справа налево
      # глазами без полной локальной сборки: gh run download <run> -n proba-rtl.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proba-rtl
          path: |
            dist/ar
            dist/assets
            dist/_astro
          retention-days: 3
      # dist одним tar без сжатия: права и символьные ссылки целы, загрузка — один файл, а не десятки тысяч.
      # 3 дня (Р737 п.8): dist берут следующие шаги этой проверки, второй сборки нет. Сжатие не ставим:
      # dist ~2,4 ГБ, почти всё — png/webp/jpg/mp3/mp4, уже сжатые (gzip -1 на локальном dist — минус 18% за 19 с).
      - run: tar -cf /tmp/dist.tar dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: /tmp/dist.tar
          compression-level: 0
          retention-days: 3
  proverki-dist:
    needs: [filtr, sborka]
    if: needs.filtr.outputs.sborka == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Сборка одна — на всё задание (Р531, аудит п.16): dist приходит из задания sborka, не собирается заново.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: /tmp
      - run: tar -xf /tmp/dist.tar && rm /tmp/dist.tar
      - name: vneshnie-hosty — ни одного запроса за рубеж
        run: node scripts/vneshnie-hosty.mjs --dist dist
      - name: Личной почты в сборке нет (разбор безопасности 20.10)
        run: node scripts/pochta-v-sborke.mjs dist
      - name: polnota — старые адреса не умирают
        continue-on-error: ${{ format('{0}', vars.REDIR_STROGO) == '0' }}
        timeout-minutes: 2
        run: node scripts/polnota.mjs --dist dist
  brauzer:
    needs: [filtr, sborka]
    if: needs.filtr.outputs.sborka == 'true'
    runs-on: ubuntu-latest
    # 25, не 15 (27.10.2026): oshibki-js ~3,5, glazami ~2,5, Lighthouse обрывался на 15-й минуте (#515, #516, #520).
    # 45, не 25 (r561, 06.11.2026): prohod-igr проходит все игры и съедает свои 10; oshibki-js обрывался на 25-й (#876).
    timeout-minutes: 45
    steps:
      # Вся история: glazami и kartinki-dnya берут изменённые в заявке дни из git diff с origin/main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Сборка одна — на всё задание (Р531, аудит п.16): dist приходит из задания sborka, не собирается заново.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: /tmp
      - run: tar -xf /tmp/dist.tar && rm /tmp/dist.tar
      # Корень для Lighthouse (lighthouserc.json: staticDistDir /tmp/root).
      - run: ln -s "$PWD/dist" /tmp/root
      - name: glazami — версия браузера
        id: pw
        run: echo "versiya=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: glazami — браузер из кэша
        id: pw-kesh
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versiya }}-chromium
      - name: glazami — браузер
        id: pw-ustanovka
        timeout-minutes: 10
        run: |
          echo "Кэш браузера: ${{ steps.pw-kesh.outputs.cache-hit == 'true' && 'hit' || 'miss' }} (playwright ${{ steps.pw.outputs.versiya }})"
          # Системные пакеты — один раз и без timeout: убитый timeout'ом npx
          # оставлял живой apt-get с замком dpkg, и попытки 2 и 3 падали сразу.
          npx --no-install playwright install-deps chromium || exit 1
          for i in 1 2 3; do
            timeout 180 npx --no-install playwright install chromium && exit 0
            echo "::warning::playwright install: попытка $i не удалась"
          done
          exit 1
      - name: glazami — браузер в кэш
        if: steps.pw-kesh.outputs.cache-hit != 'true' && steps.pw-ustanovka.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versiya }}-chromium
      # Замок ошибок JS (задание r253, 24.10.2026): карикатура 01-01…01-04 сыпала SyntaxError на каждой прокрутке,
      # а проверки молчали. Каждая полная страница дня — загрузка и прокрутка до низа; ошибка JS — заявка красная.
      - name: oshibki-js — на полных страницах дней нет ошибок JS
        timeout-minutes: 8
        run: node scripts/oshibki-js.mjs --proba && node scripts/oshibki-js.mjs --dist dist
      - name: kartinki-dnya — обложка и картинки в тексте у дня
        timeout-minutes: 4
        run: node scripts/kartinki-dnya.mjs --proba && node scripts/kartinki-dnya.mjs --dist dist
  sborka-i-ssylki:
    needs: [filtr, bez-sborki, sborka, proverki-dist, brauzer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: итог — все задания зелёные
        env:
          ITOG: ${{ toJSON(needs) }}
        run: |
          echo "$ITOG" | node -e 'const n=JSON.parse(require("fs").readFileSync(0,"utf8"));let plokho=0;
            const bezSborki=n.filtr.result==="success"&&n.filtr.outputs.sborka==="false";
            for (const [k,v] of Object.entries(n)) { console.log(k+": "+v.result);
              if (v.result==="skipped"&&bezSborki&&["sborka","proverki-dist","brauzer"].includes(k)) continue;
              if (v.result!=="success") plokho=1; }
            if (bezSborki) console.log("заявка без сборки — только машины и документы (filtr)");
            if (plokho) { console.log("::error::proverka: не все задания зелёные — смотри задание с красным итогом выше"); process.exit(1); }'
  # Таблица = запись (план ядра, шаг 2; 19.10.2026): утверждённые таблицы года лежат в data/tablicy/
