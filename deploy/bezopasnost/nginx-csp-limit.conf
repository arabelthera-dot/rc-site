# Безопасность своего сервера (п.501, Р745): ограничение частоты для /s/igra и наблюдение строгого CSP.
# Ставит Михаил на msk-new рядом с deploy/schet-igr/nginx-schet-igr.conf; проверка — nginx -t, откат — убрать строки.
# Образцы: nginx ngx_http_limit_req_module (https://nginx.org/en/docs/http/ngx_http_limit_req_module.html),
# MDN Content-Security-Policy-Report-Only (https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy-Report-Only).
# Форма «Нашли ошибку» — письмо (mailto, Base.astro), запроса к серверу нет; лимит ей не нужен, пока нет ящика (М45).
#
# В http { } (один раз):
limit_req_zone $binary_remote_addr zone=rc_igra:1m rate=2r/s;   # события игр: человек шлёт 2–3 за игру
limit_req_zone $binary_remote_addr zone=rc_csp:1m rate=1r/s;    # отчёты CSP
limit_req_status 429;
log_format rc_csp '$time_iso8601 $request_uri';                # без адреса и браузера, как rc_igry
#
# В server { } сайта russian-civilization.ru (443):
#   В location = /s/igra (из nginx-schet-igr.conf) первой строкой:
#     limit_req zone=rc_igra burst=10 nodelay;
#
#   Строгий CSP — только наблюдение, сайт не ломает. Строка = CSP_STROGIY() из src/lib/csp.mjs
#   (сверяет tests/csp-strogiy.mjs). Неделя без строк в rc-csp.log — тогда «-Report-Only» убрать (с «да» Сергея).
