# Подсчёт «начал игру — доиграл» (Р286 п.3) — приём событий игр. Ставит Михаил на msk-new (README.md рядом).
# В http { } (один раз):
log_format rc_igry '$time_iso8601 $rc_igry_bot $args';     # без адреса, без браузера, без cookie — только время и строка события
map $http_user_agent $rc_igry_bot { default 0; ~*(bot|crawl|spider|headless|preview) 1; }
